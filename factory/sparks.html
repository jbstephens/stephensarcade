function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

];
const BASS = CHORDS.flatMap(([r]) => [r - 24, 0, r - 17, 0, r - 12, 0, r - 17, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = bossState === 'fight';
  const stepDur = 60 / (fight ? 170 : 140) / 2, shift = fight ? -3 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length], a = ARP[step % ARP.length];
    note(midi(a + shift), t, stepDur * 0.7, 'triangle', 0.03);
    if (m) note(midi(m + shift), t, stepDur * 1.6, 'square', 0.035);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.09);
    nextNoteTime += stepDur; step++;
  }
}

addEventListener('keydown', e => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (!keys.jump) jumpPressed = true;
    keys.jump = true;
    e.preventDefault();
  }
  if (k === 'Enter') jumpPressed = true;
  if (state === 'title' && !e.repeat && (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'l' || k === 'L')) cycleLook(k === 'ArrowLeft' ? -1 : 1);
  if ((state === 'title' || state === 'win') && k >= '1' && k <= '9') { totalCoins = 0; levelIndex = +k - 1; loadLevel(levelIndex); }
  if (k === 'm' || k === 'M') musicOn = !musicOn;
  if ((k === 'r' || k === 'R') && state === 'play') loadLevel(levelIndex);
});
C.addEventListener('mousedown', e => {                // tap the arrows (or Sparks) on the title to change look
  if (state !== 'title') return;
  const r = C.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (inBox(PK_L, x, y)) cycleLook(-1);
  else if (inBox(PK_R, x, y) || inBox(PK, x, y)) cycleLook(1);

addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.jump = false;

const isSolidCh = ch => ch === '#' || ch === '=' || ch === 'W';
function tileSolid(tx, ty) {
  if (tx < 0 || tx >= cols) return true;
  if (ty < 0 || ty >= rows) return false;
  return isSolidCh(map[ty][tx]);
}
// Finds the ground under a spot. If there is none, builds some so things never float over a hole.
function groundRow(x, y) {
  for (let r = y; r < rows; r++) if (isSolidCh(map[r][x])) return r;
  map[rows - 2][x] = map[rows - 1][x] = '#';
  return rows - 2;
}

function loadLevel(i) {
  const L = LEVELS[i];
  rows = L.map.length;
  cols = Math.max(...L.map.map(r => r.length)) + 2;
  map = L.map.map(r => r.padEnd(cols, ' ').split(''));
  // Boss arena: flat floor at the end of the level, rocket lands there after the boss is beaten
  const groundEnd = map[rows - 2].lastIndexOf('#') + 1;
  arenaStart = cols;
  cols += ARENA;
  map = map.map(r => r.concat(Array(ARENA).fill(' ')));
  for (let x = groundEnd; x < cols; x++) map[rows - 2][x] = map[rows - 1][x] = '#';
  bossState = 'none'; boss = null; shots = []; bossBanner = 0; shake = 0;
  coins = []; enemies = []; springs = []; spikes = []; particles = []; kittens = []; kittensSaved = 0;
  let start = { x: 3, y: 10 }, c = null;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = map[y][x];
    if (ch === 'o') coins.push({ x: x * T + T / 2, y: y * T + T / 2, got: false });
    else if (ch === 'E') enemies.push({ x: x * T + 6, y: y * T + 12, w: 28, h: 28, vx: -1.2, vy: 0, dead: 0 });
    else if (ch === 'K') kittens.push({ x, y });
    else if (ch === 'B') springs.push({ x, y });
    else if (ch === '^') spikes.push({ x, y });
    else if (ch === 'P') start = { x, y };
    else if (ch === 'C') c = { x, y };
    if (!isSolidCh(ch)) map[y][x] = ' ';
  }
  springs = springs.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T + 5, y: g * T - 20, w: 30, h: 20, squish: 0 }; });
  kittens = kittens.map(k => { const g = groundRow(k.x, k.y); return { x: k.x * T + 8, y: g * T - 24, w: 24, h: 24, saved: false, color: ['#ff9800', '#9e9e9e', '#ffffff'][k.x % 3] }; });
  spikes = spikes.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T, y: (g - 1) * T }; });
  const pg = groundRow(start.x, start.y);
  player = { x: start.x * T + 3, y: pg * T - 32, w: 34, h: 32, vx: 0, vy: 0, onGround: false,
             face: 1, coyote: 0, buffer: 0, jumping: false, inv: 0, squash: 1, hover: 70, hovering: false };
  respawn = { x: player.x, y: player.y };
  flag = { x: (cols - 4) * T + T / 2, y: (rows - 2) * T, drop: 600 };
  checkpoint = null;
  if (c) { const g = groundRow(c.x, c.y); checkpoint = { x: c.x * T + T / 2, y: g * T, reached: false }; }
  levelCoins = 0;
  camX = 0;
  state = 'play';
  helpTimer = levelIndex === 0 ? 400 : 0;
  levelBanner = 150;
  goldKey = i === 0 ? { x: 1 * T, y: 7 * T - 4, got: hasKey() } : null;
  mapPiece = i === 0 ? { x: 51 * T + T / 2, y: 6 * T, got: hasMapPiece() } : null;
}

// ---------- Physics ----------
function overlapsSolid(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(tx, ty)) return true;
  return false;
}
function moveX(e) {
  e.x += e.vx;
  if (!overlapsSolid(e)) return false;
  if (e.vx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w;
  else e.x = (Math.floor(e.x / T) + 1) * T;
  e.vx = 0;
  return true;
}
function moveY(e) {
  e.y += e.vy;
  e.onGround = false;
  if (!overlapsSolid(e)) return;
  if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.onGround = true; }
  else e.y = (Math.floor(e.y / T) + 1) * T;
  e.vy = 0;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: camX + Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: cols[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

function startBoss() {
  const B = LEVELS[levelIndex].boss;
  bossState = 'fight'; shots = []; helpTimer = 0;
  bossBanner = 150; bannerText = 'BOSS: ' + B.name + '!';
  for (let y = 0; y < rows - 2; y++) map[y][arenaStart] = 'W';   // laser wall closes behind you
  respawn = { x: (arenaStart + 2) * T, y: (rows - 2) * T - player.h };
  const [w, h] = { blob: [90, 80], crab: [110, 64], ufo: [130, 56] }[B.type];
  boss = { type: B.type, look: B.look, name: B.name, hp: B.hp, maxHp: B.hp, w, h, x: (arenaStart + 17) * T,
           y: B.type === 'ufo' ? -80 : -120, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, pause: 0,
           mode: 'up', modeT: 0, dying: 0 };
  sfx.boss();
}

function bossShoot(b, n) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  for (let i = 0; i < n; i++) {
    const ang = a + (i - (n - 1) / 2) * 0.35;
    shots.push({ x: cx, y: cy, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4, r: 9 });
  }
}

function updateBoss() {
  const p = player, b = boss;
  if (bossBanner > 0) bossBanner--;
  if (bossState === 'defeated' && flag.drop > 0) {
    flag.drop = Math.max(0, flag.drop - 8);
    if (flag.drop === 0) { sfx.land(); shake = 10; burst(flag.x, flag.y, ['#cfd8dc', '#fff'], 20, 4); }
  }
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffea00', '#ff9100', '#fff'], 10, 5);
    if (b.dying > 80) {
      burst(b.x + b.w / 2, b.y + b.h / 2, ['#ffea00', '#ff9100', '#fff', '#7df9ff'], 50, 8);
      boss = null; bossState = 'defeated'; shake = 20;
      bossBanner = 150; bannerText = 'You beat ' + b.name + '!';
      for (let y = 0; y < rows; y++) if (map[y][arenaStart] === 'W') map[y][arenaStart] = ' ';
      confetti();
    }
    return;
  }
  const angry = b.maxHp - b.hp;   // bosses get faster as they get hurt
  const left = (arenaStart + 1) * T, right = cols * T;
  if (b.type === 'ufo') {
    b.modeT++;
    const lowY = (rows - 2) * T - b.h - 50;
    if (b.mode === 'fly') {
      b.x += b.dir * (2.5 + angry * 0.5);
      if (b.x < left + 20 || b.x + b.w > right - 20) b.dir = -b.dir;
      b.y = 100 + Math.sin(b.t * 0.05) * 15;
      if (b.t % Math.max(40, 70 - angry * 10) === 0) shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: 0, vy: 1, r: 10, bomb: true });
      if (b.modeT > 280) { b.mode = 'down'; b.modeT = 0; }
    } else if (b.mode === 'down') {
      b.y += 3;
      if (b.y >= lowY) { b.y = lowY; b.mode = 'low'; b.modeT = 0; }
    } else if (b.mode === 'low') {
      b.x += Math.sign(p.x - b.x - b.w / 2 + p.w / 2) * 0.8;
      b.y = lowY + Math.sin(b.t * 0.1) * 4;
      if (b.modeT > 160) { b.mode = 'up'; b.modeT = 0; }
    } else {
      b.y -= 3;
      if (b.y <= 100) { b.mode = 'fly'; b.modeT = 0; }
    }
  } else {
    const speed = (b.type === 'blob' ? 1.6 : 2.2) + angry * 0.4;
    b.vy = Math.min(b.vy + GRAV, MAXFALL);
    if (b.pause > 0) {
      b.pause--; b.vx = 0;
      if (b.pause === 20) { bossShoot(b, 3); sfx.hover(); }
    } else b.vx = b.dir * speed;
    if (moveX(b)) b.dir = -b.dir;
    moveY(b);
    if (b.type === 'blob' && b.onGround && b.t % 110 === 0) { b.vy = -11; }
    if (b.type === 'blob' && b.onGround && b.vy === 0 && b.landed === false) { shake = 6; sfx.land(); }
    b.landed = b.onGround;
    if (b.type === 'crab' && b.t % Math.max(90, 140 - angry * 15) === 0) b.pause = 40;
  }
  // Bop the boss on the head!
  if (overlap(p, b) && b.hurt === 0 && state === 'play') {
    if (p.vy > 0 && p.y + p.h - p.vy <= b.y + 20) {
      b.hp--; b.hurt = 70; p.vy = -12; p.jumping = false; shake = 12;
      sfx.bossHit();
      burst(p.x + p.w / 2, b.y, ['#ffea00', '#fff', '#7df9ff'], 16, 5);
      if (b.type === 'ufo') { b.mode = 'up'; b.modeT = 0; }
      if (b.hp <= 0) { b.dying = 1; shots = []; sfx.bossDie(); sticker('sparks-' + slug(b.name)); }
    } else hurt();
  }
}

function updateShots() {
  const p = player;
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy;
    if (s.bomb) s.vy = Math.min(s.vy + 0.25, 10);
    if (tileSolid(Math.floor(s.x / T), Math.floor((s.y + s.r) / T)) || s.y > H + 40) {
      s.gone = true; burst(s.x, s.y, ['#ff9100', '#ffea00'], 8, 3);
    }
    const dx = s.x - (p.x + p.w / 2), dy = s.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < (s.r + 13) ** 2 && state === 'play' && p.inv === 0) { s.gone = true; hurt(); }
  }
  shots = shots.filter(s => !s.gone);
}

function hurt() {
  if (player.inv > 0 || state !== 'play') return;
  state = 'dying'; timer = 0;
  sfx.ouch();
  burst(player.x + 17, player.y + 16, ['#f4b942', '#fff', '#ff7043'], 20, 5);
}

function updatePlay() {
  const p = player;
  const target = (keys.right - keys.left) * SPEED;
  p.vx += (target - p.vx) * (p.onGround ? 0.3 : 0.15);
  if (keys.right) p.face = 1; else if (keys.left) p.face = -1;

  if (jumpPressed) p.buffer = 8; else p.buffer--;
  jumpPressed = false;
  if (p.onGround) p.coyote = 6; else p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7;
    sfx.jump();
    burst(p.x + 17, p.y + p.h, ['#fff', '#e0e0e0'], 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;
  if (p.vy >= 0) p.jumping = false;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  // Hold jump while falling to hover with jet boots!
  p.hovering = !p.onGround && keys.jump && p.vy > 0 && p.hover > 0;
  if (p.hovering) {
    p.vy = Math.min(p.vy, 0.6); p.hover--;
    if (frame % 2) particles.push({ x: p.x + 6 + Math.random() * 16, y: p.y + p.h + 4, vx: (Math.random() - .5),
                                    vy: 2 + Math.random() * 2, life: 14, color: frame % 4 ? '#ffab40' : '#ffeb3b', size: 4 });
    if (frame % 4 === 0) sfx.hover();
  }

  const wasInAir = !p.onGround;
  moveX(p); moveY(p);
  if (p.onGround && wasInAir) p.squash = 1.3;
  if (p.onGround) p.hover = 70;
  p.squash += (1 - p.squash) * 0.2;
  if (p.inv > 0) p.inv--;

  // Coins
  for (const c of coins) {
    if (c.got) continue;
    const dx = c.x - (p.x + p.w / 2), dy = c.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 28 * 28) {
      c.got = true; levelCoins++; totalCoins++; bankCoin();
      sfx.coin();
      burst(c.x, c.y, ['#ffd740', '#fff59d'], 8, 3);
    }
  }

  // The secret golden key
  if (goldKey && !goldKey.got) {
    const dx = goldKey.x - (p.x + p.w / 2), dy = goldKey.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 34 * 34) {
      goldKey.got = true; keyCount = foundKey(); keyBanner = 150;
      [784, 988, 1175, 1568, 1319, 1568].forEach((f, i) => note(f, i * 0.08, 0.18, 'square', 0.08));
      burst(goldKey.x, goldKey.y, ['#ffd700', '#fff59d', '#fff'], 24, 4);
    }
  }

  // Treasure Map piece
  if (mapPiece && !mapPiece.got) {
    const dx = mapPiece.x - (p.x + p.w / 2), dy = mapPiece.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 34 * 34) {
      mapPiece.got = true; mapCount = foundMapPiece(); mapBanner = 150;
      [523, 659, 784, 1047, 880, 1047, 1319].forEach((f, i) => note(f, i * 0.09, 0.2, 'triangle', 0.12));
      burst(mapPiece.x, mapPiece.y, ['#e6c88e', '#fff59d', '#d32f2f', '#fff'], 24, 4);
    }
  }

  // Kittens to rescue
  for (const k of kittens) {
    if (k.saved) { k.y -= 2; k.fly = (k.fly || 0) + 1; continue; }
    if (overlap(p, k)) {
      k.saved = true; kittensSaved++;
      sfx.meow();
      burst(k.x + 12, k.y + 12, ['#ff4081', '#ff80ab', '#fff'], 14, 3);
    }
  }

  // Springs
  for (const s of springs) {
    if (s.squish > 0) s.squish--;
    if (p.vy > 0 && overlap(p, s) && p.y + p.h - p.vy <= s.y + 10) {
      p.y = s.y - p.h; p.vy = -SPRING; p.jumping = false; s.squish = 10;
      sfx.spring();
    }
  }

  // Spikes
  for (const s of spikes) if (overlap(p, { x: s.x + 6, y: s.y + 22, w: 28, h: 18 })) hurt();

  // Monsters
  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.vy = Math.min(e.vy + GRAV, MAXFALL);
    const old = e.vx;
    if (moveX(e)) e.vx = -old;
    moveY(e);
    if (e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!tileSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
    }
    if (e.y > rows * T + 200) e.gone = true;
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 12) {
        e.dead = 1; p.vy = -10; p.jumping = false;
        sfx.stomp();
        burst(e.x + 14, e.y + 20, ['#9e9e9e', '#ffd740', '#fff'], 12, 3);
      } else hurt();
    }
  }
  enemies = enemies.filter(e => !e.gone && e.dead < 30);

  // Checkpoint
  if (checkpoint && !checkpoint.reached && overlap(p, { x: checkpoint.x - 10, y: checkpoint.y - 80, w: 24, h: 80 })) {
    checkpoint.reached = true;
    respawn = { x: checkpoint.x - 14, y: checkpoint.y - p.h };
    sfx.check();
    burst(checkpoint.x, checkpoint.y - 70, ['#ffd740', '#fff'], 14, 3);
  }

  // Finish flag
  if (bossState === 'none' && p.x > (arenaStart + 4) * T) startBoss();
  updateBoss();
  updateShots();

  if (bossState === 'defeated' && flag.drop === 0 && overlap(p, { x: flag.x - 28, y: flag.y - 130, w: 56, h: 130 })) {
    state = 'levelDone'; timer = 0;
    sfx.win(); confetti();
  }

  if (p.y > rows * T + 60) hurt();
  if (helpTimer > 0) helpTimer--;
  if (levelBanner > 0) levelBanner--;
}

function update() {
  frame++;
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += pt.confetti ? 0.05 : 0.2;
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);

  if (state === 'title' || state === 'win') {
    if (jumpPressed) {
      jumpPressed = false;
      if (state === 'win') totalCoins = 0;
      levelIndex = 0; loadLevel(0);
    }
    if (state === 'win' && frame % 90 === 0) confetti();
    return;
  }
  if (state === 'dying') {
    timer++;
    if (timer > 50) {
      Object.assign(player, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 90 });
      shots = [];
      state = 'play';
    }
  } else if (state === 'levelDone') {
    timer++;
    if (timer > 60 && jumpPressed || timer > 240) {
      levelIndex++;
      if (levelIndex >= LEVELS.length) { state = 'win'; confetti(); trophy('sparksWin'); }
      else loadLevel(levelIndex);
    }
    jumpPressed = false;
  } else if (state === 'play') updatePlay();

  const target = player.x + player.w / 2 - W / 2;
  const minX = bossState === 'fight' ? arenaStart * T : 0;
  camX += (Math.max(minX, Math.min(cols * T - W, target)) - camX) * 0.12;
  if (shake > 0) shake--;
  if (keyBanner > 0) keyBanner--;
  if (mapBanner > 0) mapBanner--;
  if (stickerNew > 0) stickerNew--;
}

// ---------- Drawing ----------
function drawGoldKey(x, y) {      // a shiny golden key with a glow
  const bob = Math.sin(frame * 0.07) * 5, gl = 0.35 + 0.2 * Math.sin(frame * 0.12);
  ctx.save(); ctx.translate(x, y + bob);
  const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 30); g.addColorStop(0, `rgba(255,236,120,${gl})`); g.addColorStop(1, 'rgba(255,236,120,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill();

  ctx.beginPath(); ctx.arc(-10, 0, 8, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff8e1'; ctx.beginPath(); ctx.arc(-10, 0, 3.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffc107'; ctx.fillRect(-2, -2.5, 18, 5); ctx.strokeRect(-2, -2.5, 18, 5);
  ctx.fillRect(10, 2, 3, 6); ctx.fillRect(14, 2, 3, 4);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(-1, -2, 14, 1.5);
  ctx.restore();
  const tw = (frame % 60) / 60, sx = x + Math.cos(frame * 0.05) * 18, sy = y + bob - 14 + Math.sin(frame * 0.05) * 6;

}
function drawMapPiece(x, y) {      // a torn piece of old treasure map, bobbing with a sparkle
  const bob = Math.sin(frame * 0.07) * 5, gl = 0.3 + 0.2 * Math.sin(frame * 0.12);
  ctx.save(); ctx.translate(x, y + bob);
  const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 32); g.addColorStop(0, `rgba(255,236,170,${gl})`); g.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 32, 0, 7); ctx.fill();
  ctx.rotate(Math.sin(frame * 0.03) * 0.15);
  const P = [[-16,-12],[-10,-15],[-4,-11],[3,-16],[9,-12],[16,-14],[13,-6],[17,0],[13,6],[16,13],[9,11],[3,15],[-4,11],[-10,15],[-17,12],[-13,5],[-17,-2],[-13,-7]];
  ctx.fillStyle = '#e6c88e'; ctx.strokeStyle = '#8d6e3f'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); P.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(150,105,50,.3)'; ctx.beginPath(); ctx.arc(-8, 6, 4, 0, 7); ctx.arc(10, 8, 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#d32f2f'; [[-12,4],[-8,1],[-4,-1],[0,-3],[4,-3]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a, b, 1.4, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.moveTo(9, -6); ctx.lineTo(13, -2); ctx.lineTo(11, 0); ctx.lineTo(7, -4); ctx.closePath(); ctx.fill();   // a bit of the red X
  ctx.restore();
  const tw = (frame % 60) / 60, sx = x + Math.cos(frame * 0.05) * 18, sy = y + bob - 14 + Math.sin(frame * 0.05) * 6;
  ctx.fillStyle = `rgba(255,255,255,${1 - tw})`; ctx.fillRect(sx - 1, sy - 6, 2, 12); ctx.fillRect(sx - 6, sy - 1, 12, 2);
}
function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}

function drawBackground(L) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (L.theme === 'lab' || L.theme === 'ship' || L.theme === 'portal') { drawInside(L); return; }

  if (L.night) {
    for (let i = 0; i < 60; i++) {
      ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(frame * 0.04 + i * 1.7)})`;
      ctx.fillRect(((i * 137.5 - camX * 0.03) % W + W) % W, (i * 71) % 260, 2, 2);
    }
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath(); ctx.arc(800 - camX * 0.04, 90, 40, 0, 7); ctx.fill();
    ctx.fillStyle = L.sky[0];
    ctx.beginPath(); ctx.arc(818 - camX * 0.04, 78, 36, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = '#fff59d';
    ctx.beginPath(); ctx.arc(820 - camX * 0.05, 90, 45, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 260 - camX * 0.2 + frame * 0.15) % (W + 300) + W + 300) % (W + 300) - 150;
      const cy = 60 + (i * 47) % 120;
      ctx.beginPath();
      ctx.arc(cx, cy, 26, 0, 7); ctx.arc(cx + 30, cy - 12, 32, 0, 7); ctx.arc(cx + 62, cy, 24, 0, 7);
      ctx.fill();
    }
  }

  if (L.theme === 'beach') { drawBeach(L); return; }
  if (L.theme === 'junk') { drawJunk(L); return; }
  if (L.park) {
    // rolling hills with round trees
    for (const [color, speed, base] of [[L.hill, 0.3, 360], [L.hill2, 0.5, 410]]) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 10) ctx.lineTo(x, base - Math.abs(Math.sin((x + camX * speed) / 160)) * 50);
      ctx.lineTo(W, H); ctx.fill();
      const off = camX * speed, first = Math.floor(off / 170);
      for (let i = first; i < first + 8; i++) {
        const tx = i * 170 - off + 40, ty = base - Math.abs(Math.sin((tx + off) / 160)) * 50;
        ctx.fillStyle = '#6d4c41'; ctx.fillRect(tx - 5, ty - 40, 10, 40);
        ctx.fillStyle = speed < 0.4 ? '#81c784' : '#43a047';
        ctx.beginPath(); ctx.arc(tx, ty - 55, 26, 0, 7); ctx.arc(tx - 16, ty - 40, 18, 0, 7); ctx.arc(tx + 16, ty - 40, 18, 0, 7); ctx.fill();
      }
    }
    return;
  }

  // city buildings (two layers)
  for (const [color, speed, base, spacing] of [[L.hill, 0.25, 440, 130], [L.hill2, 0.5, 440, 160]]) {
    const off = camX * speed, first = Math.floor(off / spacing) - 1;
    for (let i = first; i < first + W / spacing + 3; i++) {
      const bx = i * spacing - off, bw = spacing - 20 - (Math.abs(i * 7) % 3) * 10;
      const bh = 120 + (Math.abs(i * 73) % 7) * 25 + (speed > 0.3 ? 0 : 60);
      ctx.fillStyle = color; ctx.fillRect(bx, base - bh, bw, bh);
      for (let wy = base - bh + 14; wy < base - 20; wy += 28)
        for (let wx = bx + 12; wx < bx + bw - 16; wx += 24) {
          const lit = L.night ? (Math.abs(i * 31 + wx * 7 + wy * 3) % 5 < 2) : true;
          ctx.fillStyle = L.night ? (lit ? '#ffe082' : 'rgba(0,0,0,.25)') : 'rgba(255,255,255,.45)';
          ctx.fillRect(wx, wy, 12, 16);
        }
    }
  }
}

function drawBeach(L) {
  ctx.fillStyle = '#0288d1'; ctx.fillRect(0, 300, W, H - 300);            // ocean
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
  for (let r = 0; r < 4; r++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, 320 + r * 35 + Math.sin((x + camX * (0.2 + r * 0.1)) / 30 + frame * 0.05) * 4);
    ctx.stroke();
  }
  const off = camX * 0.5, first = Math.floor(off / 260) - 1;              // palm trees
  for (let i = first; i < first + 6; i++) {
    const tx = i * 260 - off + 80;
    ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(tx, 440); ctx.quadraticCurveTo(tx + 20, 360, tx + 10, 290); ctx.stroke();
    ctx.strokeStyle = '#43a047'; ctx.lineWidth = 8;
    for (const a of [-2.6, -2, -1.2, -0.5]) {
      ctx.beginPath(); ctx.moveTo(tx + 10, 290);
      ctx.quadraticCurveTo(tx + 10 + Math.cos(a) * 30, 290 + Math.sin(a) * 30, tx + 10 + Math.cos(a) * 55, 300 + Math.sin(a) * 10 + 20);
      ctx.stroke();
    }
    ctx.fillStyle = '#6d4c41'; ctx.beginPath(); ctx.arc(tx + 6, 296, 5, 0, 7); ctx.arc(tx + 15, 298, 5, 0, 7); ctx.fill();
  }
}

function drawJunk(L) {
  for (const [color, speed, base] of [[L.hill, 0.3, 360], [L.hill2, 0.5, 410]]) {
    const off = camX * speed;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, base - Math.abs(Math.sin((x + off) / 120)) * 70);
    ctx.lineTo(W, H); ctx.fill();
    const first = Math.floor(off / 90) - 1;                                // junk on the piles
    for (let i = first; i < first + 13; i++) {
      const jx = i * 90 - off, jy = base - Math.abs(Math.sin((jx + off) / 120)) * 70;
      const kind = Math.abs(i * 7) % 3;
      if (kind === 0) { ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(jx, jy - 8, 12, 0, 7); ctx.fill(); }
      else if (kind === 1) { ctx.fillStyle = ['#e53935', '#1e88e5', '#43a047'][Math.abs(i) % 3]; ctx.fillRect(jx - 18, jy - 16, 36, 16); }
      else { ctx.fillStyle = '#bdbdbd'; ctx.fillRect(jx - 8, jy - 24, 16, 24); }
    }
  }
}

function drawInside(L) {
  const off = camX * 0.4;
  if (L.theme === 'portal') {                                              // swirling time vortex
    ctx.save(); ctx.translate(W / 2, H / 2 - 40);
    for (let i = 0; i < 14; i++) {
      ctx.strokeStyle = `rgba(255,255,255,${0.05 + (i % 3) * 0.04})`; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(0, 0, 30 + i * 30, frame * 0.01 * (i % 2 ? 1 : -1) + i, frame * 0.01 * (i % 2 ? 1 : -1) + i + 3); ctx.stroke();
    }
    ctx.restore();
    for (let i = 0; i < 6; i++) {                                          // floating clocks
      const cx = ((i * 190 - camX * 0.2) % (W + 100) + W + 100) % (W + 100) - 50, cy = 80 + (i * 67) % 220 + Math.sin(frame * 0.03 + i) * 10;
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(cx, cy, 18, 0, 7); ctx.fill();
      ctx.strokeStyle = '#4527a0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(frame * 0.05 + i) * 13, cy + Math.sin(frame * 0.05 + i) * 13); ctx.stroke();
    }
    return;
  }
  ctx.fillStyle = L.hill;                                                  // back wall panels
  const first = Math.floor(off / 160) - 1;
  for (let i = first; i < first + 8; i++) {
    const wx = i * 160 - off;
    ctx.fillStyle = L.hill; ctx.fillRect(wx + 4, 40, 152, 400);
    if (L.theme === 'ship') {                                              // round windows with stars
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(wx + 80, 150, 38, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; for (let k = 0; k < 5; k++) ctx.fillRect(wx + 60 + (k * 13 % 40), 130 + (k * 17 % 40), 2, 2);
      ctx.strokeStyle = L.grass; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(wx + 80, 150, 38, 0, 7); ctx.stroke();
      if (Math.abs(i) % 3 === 0) {                                         // glowing time portal
        ctx.strokeStyle = `hsl(${(frame * 3 + i * 60) % 360},90%,65%)`; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.ellipse(wx + 80, 320, 30, 50, 0, 0, 7); ctx.stroke();
      }
    } else {                                                               // evil lab: screens and goo tanks
      roundRect(wx + 30, 90, 100, 64, 6, '#111');
      ctx.fillStyle = frame % 60 < 30 ? '#ff1744' : '#b71c1c';
      ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('☠', wx + 80, 138);
      roundRect(wx + 55, 220, 50, 120, 20, 'rgba(118,255,3,.35)');
      ctx.fillStyle = 'rgba(204,255,144,.8)';
      ctx.beginPath(); ctx.arc(wx + 80, 330 - (frame + i * 40) % 100, 5, 0, 7); ctx.fill();
    }
  }
  ctx.fillStyle = L.hill2;                                                 // pipes
  ctx.fillRect(0, 30, W, 14); ctx.fillRect(0, 380, W, 10);
}

function drawTiles(L) {
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(cols - 1, Math.ceil((camX + W) / T));
  for (let y = 0; y < rows; y++) for (let x = c0; x <= c1; x++) {
    const ch = map[y][x], px = x * T, py = y * T;
    if (ch === 'W') {                                  // Princess's force field
      ctx.fillStyle = `rgba(255,64,129,${0.4 + 0.3 * Math.sin(frame * 0.3 + y)})`;
      ctx.fillRect(px + 12, py, 16, T);
      ctx.fillStyle = '#fce4ec'; ctx.fillRect(px + 18, py, 4, T);
    } else if (ch === '#') {
      ctx.fillStyle = L.dirt; ctx.fillRect(px, py, T + 1, T + 1);
      ctx.fillStyle = 'rgba(0,0,0,.15)';
      const style = L.ground || (L.park ? 'grass' : 'brick');
      if (style === 'brick') {
        ctx.fillRect(px, py + 19, T, 2); ctx.fillRect(px, py + 39, T, 1);
        ctx.fillRect(px + (y % 2 ? 10 : 30), py, 2, 20); ctx.fillRect(px + (y % 2 ? 30 : 10), py + 20, 2, 20);
      } else {
        if ((x * 7 + y * 13) % 3 === 0) ctx.fillRect(px + 8, py + 22, 6, 6);
        if ((x * 5 + y * 11) % 4 === 0) ctx.fillRect(px + 26, py + 12, 5, 5);
      }
      if (y === 0 || map[y - 1][x] !== '#') {
        ctx.fillStyle = L.grass; ctx.fillRect(px, py, T + 1, style === 'metal' ? 6 : 12);
        if (style === 'grass') {
          ctx.beginPath();
          for (let i = 0; i < 4; i++) ctx.arc(px + 5 + i * 10, py + 12, 5, 0, Math.PI);
          ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(px, py + 10, T, 2); ctx.fillRect(px, py, 1, 12);
        }
      }
    } else if (ch === '=' && L.ground === 'metal') {   // glowing tech block
      roundRect(px + 1, py + 1, T - 2, T - 2, 6, '#1e2a4a');
      ctx.strokeStyle = L.grass; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(px + 2, py + 2, T - 4, T - 4, 6); ctx.stroke();
      ctx.fillStyle = (frame / 20 + x) % 4 < 2 ? L.grass : '#ffffff';
      ctx.beginPath(); ctx.arc(px + T / 2, py + T / 2, 5, 0, 7); ctx.fill();
    } else if (ch === '=') {                           // wooden crate
      ctx.fillStyle = '#c68642'; ctx.fillRect(px, py, T, T);
      ctx.strokeStyle = '#7a4b1c'; ctx.lineWidth = 3;
      ctx.strokeRect(px + 2, py + 2, T - 4, T - 4);
      ctx.beginPath(); ctx.moveTo(px + 3, py + 3); ctx.lineTo(px + T - 3, py + T - 3); ctx.stroke();
    }
  }
}

function drawCoin(x, y, t) {                           // fish treat
  const s = 0.8 + Math.abs(Math.cos(t)) * 0.2;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, 1);
  ctx.fillStyle = '#ff9800';
  ctx.beginPath(); ctx.ellipse(-2, 0, 11, 7, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(15, -7); ctx.lineTo(15, 7); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-7, -2, 1.8, 0, 7); ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {                                // wind-up toy robot
  const squash = e.dead ? 0.3 : 1;
  const h = e.h * squash, y = e.y + e.h - h;
  roundRect(e.x + 2, y, e.w - 4, h - 4, 5, '#9e9e9e');
  if (e.dead) return;
  const d = e.vx > 0 ? 1 : -1;
  roundRect(e.x + 6 + d * 2, y + 6, e.w - 12, 8, 3, '#212121');
  ctx.fillStyle = frame % 20 < 10 ? '#ff1744' : '#ff8a80';
  ctx.fillRect(e.x + 9 + d * 4, y + 8, 4, 4); ctx.fillRect(e.x + 17 + d * 4, y + 8, 4, 4);
  ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 3;     // spinning wind-up key
  const kx = d > 0 ? e.x : e.x + e.w, ky = y + 14, a = frame * 0.2;
  ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(kx - d * 6, ky); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(kx - d * 6, ky - 6 * Math.cos(a)); ctx.lineTo(kx - d * 6, ky + 6 * Math.cos(a)); ctx.stroke();
  ctx.fillStyle = '#424242';                           // wheels
  ctx.beginPath(); ctx.arc(e.x + 8, e.y + e.h - 3, 4, 0, 7); ctx.arc(e.x + e.w - 8, e.y + e.h - 3, 4, 0, 7); ctx.fill();
}

function drawKitten(k) {
  if (k.saved && k.fly > 60) return;
  const x = k.x, y = k.y + (k.saved ? 0 : Math.abs(Math.sin(frame * 0.08 + x)) * -3);
  if (k.saved) {                                        // floats away in a bubble
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(x + 12, y + 12, 20, 0, 7); ctx.fill();
  }
  ctx.fillStyle = k.color;
  ctx.beginPath(); ctx.ellipse(x + 12, y + 18, 10, 7, 0, 0, 7); ctx.fill();     // body
  ctx.beginPath(); ctx.arc(x + 12, y + 8, 8, 0, 7); ctx.fill();                  // head
  ctx.beginPath(); ctx.moveTo(x + 5, y + 5); ctx.lineTo(x + 6, y - 3); ctx.lineTo(x + 11, y + 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 19, y + 5); ctx.lineTo(x + 18, y - 3); ctx.lineTo(x + 13, y + 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x + 9, y + 8, 1.6, 0, 7); ctx.arc(x + 15, y + 8, 1.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff80ab'; ctx.fillRect(x + 11, y + 10, 2, 2);
  if (!k.saved && frame % 120 < 50) text('help!', x + 12, y - 8, 14, '#fff');
}

function drawPlayer(p, lk = look) {                    // Sparks the robot dog, with two cats inside
  if (state === 'dying' || state === 'levelDone') return;
  if (p.inv > 0 && Math.floor(frame / 4) % 2) return;
  const f = p.face, w = p.w / p.squash, h = p.h * p.squash;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  const run = Math.abs(p.vx) > 0.5 && p.onGround ? Math.sin(frame * 0.4) * 3 : 0;
  if (lk === 'kitten') { drawWhiskers(x, y, w, h, f, run, p.hovering); return; }
  const gold = lk === 'gold', GL = gold ? goldPaint(x - 4, y, w + 8, h) : '#f4b942', GD = gold ? goldPaint(x - 4, y, w + 8, h, 1) : '#c98e2a';   // gold Sparks: same dog, shiny gold paint
  if (p.hovering) {                                    // rocket paws
    ctx.fillStyle = '#ffab40';
    for (const fx of [x + 7, x + w - 7]) {
      const fl = 8 + Math.random() * 8;
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + fl); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.fillStyle = GD;                                  // legs
  ctx.fillRect(x + 4 + run, y + h - 9, 6, 9); ctx.fillRect(x + w - 10 - run, y + h - 9, 6, 9);
  const back = f > 0 ? x + 2 : x + w - 2;              // wagging tail
  ctx.strokeStyle = GD; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(back, y + h * 0.45);
  ctx.lineTo(back - f * 8, y + h * 0.2 + Math.sin(frame * 0.4) * 4); ctx.stroke();
  roundRect(x, y + h * 0.3, w, h * 0.45, 8, GL);      // body
  ctx.fillStyle = '#b3e5fc';                           // cockpit window with the two cats
  ctx.beginPath(); ctx.arc(x + w / 2 - f * 3, y + h * 0.52, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.arc(x + w / 2 - f * 3 - 3, y + h * 0.55, 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#9e9e9e'; ctx.beginPath(); ctx.arc(x + w / 2 - f * 3 + 3, y + h * 0.55, 3, 0, 7); ctx.fill();
  const hx = f > 0 ? x + w - 18 : x + 18;              // head
  roundRect(hx - 11, y, 22, 18, 7, GL);
  roundRect(hx - 2 + f * 6, y + 7, 12, 9, 4, GL);      // snout
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(hx + f * 13, y + 9, 3, 0, 7); ctx.fill();   // nose
  ctx.beginPath(); ctx.arc(hx + f * 2, y + 6, 2.2, 0, 7); ctx.fill();  // eye
  ctx.fillStyle = gold ? '#e65100' : '#8d5a2b';        // floppy ear
  ctx.beginPath(); ctx.ellipse(hx - f * 7, y + 6, 4, 9, f * 0.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#e53935'; ctx.fillRect(hx - 9, y + 17, 18, 3);      // collar
  drawHat(lk, hx, y + 2, 11, f);
  if (gold) goldTwinkle(x, y, w, h);
}

// A hat from the Bundle Room. cx = middle of the head, top = top of the head, hw = half the head's width, f = facing (1 right, -1 left)
function drawHat(id, cx, top, hw, f) {
  if (!id || id === 'normal' || id === 'kitten' || id === 'gold') return;
  const k = hw / 11;
  ctx.save(); ctx.translate(cx, top); ctx.scale(f * k, k);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(0,0,0,.6)';
  const shape = (fill, path) => { ctx.beginPath(); path(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  if (id === 'bow') {                                  // big pink bow
    shape('#ff4fa3', () => { ctx.moveTo(-3, -3); ctx.lineTo(-14, -11); ctx.lineTo(-14, 4); ctx.closePath(); ctx.moveTo(-3, -3); ctx.lineTo(8, -11); ctx.lineTo(8, 4); ctx.closePath(); });
    shape('#ff9ccf', () => ctx.arc(-3, -3, 3.4, 0, 7));
  } else if (id === 'cap') {                           // blue cap, brim pointing forward
    shape('#1565c0', () => { ctx.moveTo(4, -2); ctx.lineTo(19, -1); ctx.quadraticCurveTo(21, 2, 17, 3); ctx.lineTo(4, 2); ctx.closePath(); });
    shape('#1e88e5', () => { ctx.arc(0, 2, 11, Math.PI, 0); ctx.closePath(); });
    shape('#fff', () => ctx.arc(0, -9, 1.8, 0, 7));
  } else if (id === 'fire') {                          // red firefighter helmet with a gold badge
    shape('#c62828', () => ctx.ellipse(-2, 1, 17, 3.5, 0, 0, 7));
    shape('#e53935', () => { ctx.arc(0, 0, 11, Math.PI, 0); ctx.closePath(); });
    ctx.strokeStyle = '#b71c1c'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.4;
    shape('#ffd600', () => { ctx.moveTo(3, -8); ctx.lineTo(10, -8); ctx.lineTo(10, -3); ctx.lineTo(6.5, -0.5); ctx.lineTo(3, -3); ctx.closePath(); });
  } else if (id === 'crown') {                         // golden crown with jewels
    shape('#ffd600', () => { ctx.moveTo(-10, 2); ctx.lineTo(-11, -12); ctx.lineTo(-5.5, -6); ctx.lineTo(0, -15); ctx.lineTo(5.5, -6); ctx.lineTo(11, -12); ctx.lineTo(10, 2); ctx.closePath(); });
    ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(0, -3, 2.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#2979ff'; ctx.beginPath(); ctx.arc(-6, -2, 1.6, 0, 7); ctx.arc(6, -2, 1.6, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// Whiskers the kitten (MEGA Kitten Pack): same size and moves as Sparks, just a different drawing
function drawWhiskers(x, y, w, h, f, run, hovering) {
  const dot = (cx, cy, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); };
  if (hovering) {                                      // rocket paws
    ctx.fillStyle = '#ffab40';
    for (const fx of [x + 8, x + w - 8]) {
      const fl = 8 + Math.random() * 8;
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + fl); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.fillStyle = '#ef8f2b';                           // legs with white paws
  ctx.fillRect(x + 5 + run, y + h - 9, 6, 9); ctx.fillRect(x + w - 11 - run, y + h - 9, 6, 9);
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 5 + run, y + h - 3, 6, 3); ctx.fillRect(x + w - 11 - run, y + h - 3, 6, 3);
  const back = f > 0 ? x + 4 : x + w - 4;              // curly tail
  ctx.strokeStyle = '#ef8f2b'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(back, y + h * 0.6);
  ctx.quadraticCurveTo(back - f * 13, y + h * 0.55, back - f * 9, y + h * 0.15 + Math.sin(frame * 0.2) * 3); ctx.stroke();
  roundRect(x + 2, y + h * 0.38, w - 4, h * 0.42, 9, '#ffa726');   // body
  ctx.fillStyle = '#e67e22';                           // stripes
  for (let i = 0; i < 3; i++) ctx.fillRect(x + w / 2 - f * 6 + (i - 1) * 6 - 1.5, y + h * 0.38, 3, 6);
  ctx.fillStyle = '#ffe0b2'; ctx.beginPath(); ctx.ellipse(x + w / 2 + f * 3, y + h * 0.66, 7, 3.5, 0, 0, 7); ctx.fill();   // tummy
  const hx = f > 0 ? x + w - 14 : x + 14, hy = y + 11;  // head
  ctx.fillStyle = '#ffa726';
  ctx.beginPath(); ctx.moveTo(hx - 10, hy - 3); ctx.lineTo(hx - 9, hy - 16); ctx.lineTo(hx - 2, hy - 9); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 10, hy - 3); ctx.lineTo(hx + 9, hy - 16); ctx.lineTo(hx + 2, hy - 9); ctx.fill();
  ctx.fillStyle = '#ff9ec4';
  ctx.beginPath(); ctx.moveTo(hx - 8, hy - 6); ctx.lineTo(hx - 8, hy - 12); ctx.lineTo(hx - 4, hy - 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 8, hy - 6); ctx.lineTo(hx + 8, hy - 12); ctx.lineTo(hx + 4, hy - 8); ctx.fill();
  dot(hx, hy, 11, '#ffa726');
  ctx.fillStyle = '#e67e22'; ctx.fillRect(hx - 4, hy - 11, 2, 4); ctx.fillRect(hx - 1, hy - 11, 2, 5); ctx.fillRect(hx + 2, hy - 11, 2, 4);
  dot(hx - 6.5 + f, hy + 3.5, 2.2, '#ffab91'); dot(hx + 6.5 + f, hy + 3.5, 2.2, '#ffab91');   // pink cheeks
  for (const ex of [hx - 4 + f * 1.5, hx + 4 + f * 1.5]) { dot(ex, hy - 1, 3.2, '#fff'); dot(ex + f * 0.6, hy - 0.6, 2.2, '#2e7d32'); dot(ex + f * 0.6, hy - 0.6, 1.2, '#000'); dot(ex - 0.6, hy - 2, 0.8, '#fff'); }

function drawSpikes(s) {                               // thorn bush
  ctx.fillStyle = '#2e7d32';
  ctx.beginPath(); ctx.arc(s.x + 10, s.y + 30, 11, 0, 7); ctx.arc(s.x + 30, s.y + 30, 11, 0, 7); ctx.arc(s.x + 20, s.y + 24, 13, 0, 7); ctx.fill();
  ctx.fillStyle = '#6d4c41';
  for (const [tx, ty, a] of [[6, 20, -2.4], [20, 10, -1.57], [34, 20, -0.7], [2, 32, 3.1], [38, 32, 0]]) {
    ctx.beginPath();
    ctx.moveTo(s.x + tx + Math.cos(a) * 7, s.y + ty + Math.sin(a) * 7);
    ctx.lineTo(s.x + tx + Math.cos(a + 1.57) * 3, s.y + ty + Math.sin(a + 1.57) * 3);

  ctx.beginPath(); ctx.arc(s.x + 14, s.y + 26, 2.5, 0, 7); ctx.arc(s.x + 27, s.y + 31, 2.5, 0, 7); ctx.fill();
}

      ctx.beginPath(); ctx.moveTo(bx, b.y + b.h - 4); ctx.lineTo(bx + Math.cos(a) * 14, b.y + b.h - 4 + Math.sin(a) * 4); ctx.stroke();

    ctx.fillStyle = '#212121'; ctx.fillRect(b.x + 10, b.y + b.h - 22, b.w - 20, 8);   // suction slot

    ctx.fillStyle = '#795548';

    ctx.fillStyle = '#ff1744';                         // glowing button eyes

    ctx.strokeStyle = '#9e9e9e';                       // antenna
    ctx.beginPath(); ctx.moveTo(cx, b.y - 16); ctx.lineTo(cx, b.y - 30); ctx.stroke();
    ctx.fillStyle = frame % 20 < 10 ? '#ff1744' : '#fff';

    ctx.beginPath(); ctx.moveTo(cx, b.y - 14); ctx.lineTo(cx + 16, b.y - 24); ctx.lineTo(cx + 16, b.y - 6); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx - 7 + look / 2, b.y + 2, 3, 0, 7); ctx.arc(cx + 7 + look / 2, b.y + 2, 3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;       // grumpy eyebrows

    ctx.fillStyle = '#29b6f6';                         // pacifier

    ctx.fillStyle = '#f48fb1';                         // stroller tub

    ctx.fillStyle = '#ec407a'; ctx.fillRect(b.x, b.y + 20, b.w, 8);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = (Math.floor(frame / 8) + i) % 2 ? '#fff176' : '#fff';
      ctx.beginPath(); ctx.arc(b.x + 25 + i * 20, b.y + 34, 4, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#ffab40';                         // thrusters

      ctx.beginPath(); ctx.moveTo(tx - 7, b.y + 46); ctx.lineTo(tx, b.y + 58 + Math.random() * 10); ctx.lineTo(tx + 7, b.y + 46); ctx.fill();
    }

    ctx.fillStyle = '#8d6e63';                         // big fluffy tail

    ctx.beginPath(); ctx.arc(cx + look * 2, b.y + 18, 24, 0, 7); ctx.fill();          // head
    ctx.beginPath(); ctx.moveTo(cx - 20, b.y + 2); ctx.lineTo(cx - 14, b.y - 18); ctx.lineTo(cx - 6, b.y); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 20, b.y + 2); ctx.lineTo(cx + 14, b.y - 18); ctx.lineTo(cx + 6, b.y); ctx.fill();
    ctx.fillStyle = '#ff1744';

    ctx.fillStyle = '#ff1744';
    ctx.fillRect(cx - 24 + look, b.y + 8, 12, 7); ctx.fillRect(cx + 12 + look, b.y + 8, 12, 7);
    const open = b.mode === 'low' ? 0.2 : 0.6 + Math.sin(frame * 0.1) * 0.2;
    ctx.strokeStyle = '#616161'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    for (const s of [-1, 0, 1]) {
      const a = Math.PI / 2 + s * open;

      ctx.lineTo(cx + s * 20 + Math.cos(a) * 30 * (s ? 1 : 0.3), b.y + 26 + Math.sin(a) * 30); ctx.stroke();
    }
  } else if (b.look === 'evil') {                      // the evil fake Sparks
    const f = Math.sign(look) || 1, run = Math.sin(frame * 0.4) * 4;

    ctx.fillStyle = '#ff1744';                         // spiky collar
    for (let i = 0; i < 4; i++) {
      const sx = (f > 0 ? b.x + b.w - 40 : b.x + 14) + i * 7;
      ctx.beginPath(); ctx.moveTo(sx, b.y + 18); ctx.lineTo(sx + 3, b.y + 10); ctx.lineTo(sx + 6, b.y + 18); ctx.fill();
    }
    const hx = f > 0 ? b.x + b.w - 26 : b.x + 26;
    roundRect(hx - 22, b.y - 18, 44, 34, 10, '#37474f');                             // head
    roundRect(hx - 4 + f * 12, b.y - 4, 22, 16, 6, '#37474f');                        // snout
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hx + f * 26, b.y + 2, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff1744'; ctx.beginPath(); ctx.arc(hx + f * 4, b.y - 6, 5, 0, 7); ctx.fill();   // red eye
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx - f * 6, b.y - 16); ctx.lineTo(hx + f * 12, b.y - 10); ctx.stroke();
    ctx.fillStyle = '#212121';
    ctx.beginPath(); ctx.ellipse(hx - f * 14, b.y - 6, 7, 16, f * 0.4, 0, 7); ctx.fill();   // ear
    ctx.strokeStyle = '#37474f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    const back = f > 0 ? b.x + 6 : b.x + b.w - 6;
    ctx.beginPath(); ctx.moveTo(back, b.y + 26); ctx.lineTo(back - f * 16, b.y + 4 + Math.sin(frame * 0.3) * 4); ctx.stroke();
    if (frame % 10 < 5) {                              // crackling sparks
      ctx.strokeStyle = '#ffea00'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - 10, b.y + 20); ctx.lineTo(cx - 4, b.y + 30); ctx.lineTo(cx - 12, b.y + 34); ctx.lineTo(cx - 6, b.y + 46); ctx.stroke();
    }
  } else if (b.look === 'crab') {                      // Robo-Crab
    ctx.strokeStyle = '#e65100'; ctx.lineWidth = 6;
    for (let i = 0; i < 3; i++) for (const s of [-1, 1]) {
      const k = Math.sin(frame * 0.3 + i) * 5;
      ctx.beginPath(); ctx.moveTo(cx + s * 20, b.y + 55); ctx.lineTo(cx + s * (36 + i * 8), b.y + 62 + k); ctx.lineTo(cx + s * (40 + i * 8), b.y + b.h); ctx.stroke();
    }
    const snap = Math.sin(frame * 0.15) * 0.3;
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#ff6d00';

      ctx.fillStyle = '#4dd0e1';
      ctx.beginPath(); ctx.moveTo(cx + s * 46, b.y + 18); ctx.arc(cx + s * 46, b.y + 18, 19, -Math.PI / 2 - 0.3 - snap, -Math.PI / 2 + 0.3 + snap); ctx.fill();
    }
    ctx.fillStyle = '#ff9100';
    ctx.beginPath(); ctx.ellipse(cx, b.y + 50, 36, 24, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#9e9e9e'; ctx.fillRect(cx - 20, b.y + 44, 40, 5);                // robot stripe
    ctx.strokeStyle = '#e65100'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx - 10, b.y + 30); ctx.lineTo(cx - 12, b.y + 14); ctx.moveTo(cx + 10, b.y + 30); ctx.lineTo(cx + 12, b.y + 14); ctx.stroke();
    for (const ex of [cx - 12, cx + 12]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, b.y + 12, 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + look / 2, b.y + 13, 4, 0, 7); ctx.fill();
    }
  } else if (b.look === 'guard') {                     // Alien Guard Bot
    ctx.fillStyle = '#4a148c';
    ctx.fillRect(b.x + 20, b.y + b.h - 14, 16, 14); ctx.fillRect(b.x + b.w - 36, b.y + b.h - 14, 16, 14);

    ctx.fillStyle = '#9e9e9e';                         // arm cannons

    ctx.strokeStyle = '#ce93d8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, b.y - 14); ctx.lineTo(cx, b.y - 26); ctx.stroke();
    ctx.fillStyle = frame % 16 < 8 ? '#00e676' : '#fff';
    ctx.beginPath(); ctx.arc(cx, b.y - 28, 4, 0, 7); ctx.fill();
  } else {                                             // Time Saucer
    ctx.fillStyle = 'rgba(224,64,251,.5)';
    ctx.beginPath(); ctx.arc(cx, b.y + 24, 30, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff';                            // clock face in the dome
    ctx.beginPath(); ctx.arc(cx, b.y + 12, 13, 0, 7); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, b.y + 12); ctx.lineTo(cx + Math.cos(frame * 0.2) * 10, b.y + 12 + Math.sin(frame * 0.2) * 10);
    ctx.moveTo(cx, b.y + 12); ctx.lineTo(cx + Math.cos(frame * 0.02) * 6, b.y + 12 + Math.sin(frame * 0.02) * 6); ctx.stroke();
    ctx.fillStyle = '#7e57c2';
    ctx.beginPath(); ctx.ellipse(cx, b.y + 34, b.w / 2, 18, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#4527a0';
    ctx.beginPath(); ctx.ellipse(cx, b.y + 40, b.w / 2 - 10, 9, 0, 0, Math.PI); ctx.fill();
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = (Math.floor(frame / 6) + i) % 3 === 0 ? '#ffea00' : '#e040fb';
      ctx.beginPath(); ctx.arc(b.x + 15 + i * 20, b.y + 34, 4, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

function drawShots() {

      roundRect(s.x - 6, s.y - 10, 12, 18, 4, '#e3f2fd');

      for (var a = 0; a < gp.axes.length; a++) if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  hub.fns.push(function (now, pads) {
    if (leaving) return;
    if (IS_BOOK) {                     // while a game is open its own overlay owns the idle timer
      if (!player) player = document.getElementById('player');
      if (player && player.classList.contains('open')) { last = now; return; }
    }
    if (padActive(pads)) last = now;
    if (now - last < IDLE_MS) return;
    leaving = true;
    var g = false;
    try { g = window.parent !== window && typeof window.parent.closeGame === 'function'; } catch (e) {}
    if (g) { try { window.parent.closeGame(); } catch (e) {} }
    else location.href = '/';          // pagehide fires -> games persist their state
  });
})();
</script>
