     are kept (filtered slots read null), exactly like lib/controller.js. -->
<script id="__gf_padfilter">
(function () {
  var nav = window.navigator;
  if (!nav || typeof nav.getGamepads !== 'function' || nav.__gfPadFilter) return;
  var orig = nav.getGamepads;
  var PHANTOM = /motion sensors|touchpad/i;
  var out = [];                       // reused every call: no per-frame allocation
  function filtered() {
    var src = orig.call(nav);
    if (!src) return src;
    var n = src.length, anyStd = false, i, p;
    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }
    out.length = n;
    for (i = 0; i < n; i++) {
      p = src[i];
      out[i] = (!p || PHANTOM.test(p.id || '') || (anyStd && p.mapping !== 'standard')) ? null : p;
    }
    return out;
  }
  try { nav.getGamepads = filtered; } catch (e) {}
  if (nav.getGamepads !== filtered) {
    try { Object.defineProperty(nav, 'getGamepads', { value: filtered, configurable: true, writable: true }); } catch (e) {}
  }
  try { nav.__gfPadFilter = true; } catch (e) {}
})();
</script>

<style>

<script>
'use strict';
// =====================================================================
// 💌 GAME FACTORY CARDS: printable greeting cards with Game Factory characters.
// A card = { type, chars: [ids], theme, msg (index, -1 = blank), to (name or ''), from ('Ben' or ''), magic, traces }
// Panels are drawn in a 400 x 520 design box and placed on a printed page:
//   SMALL card (quarter-fold): letter portrait, viewBox 800 x 1035. Bottom row = back + FRONT, top row = the
//   inside, printed UPSIDE DOWN (rotated 180°) so it is right-side up after the two folds.
//   BIG card (half-fold): letter landscape, viewBox 1035 x 800. Page 1 = outside (back | front), page 2 = inside.
// Character art is copied from the Trading Cards (tradingcards.html charArt).
// =====================================================================
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
// ===== CHARACTER ART (copied from tradingcards.html charArt) =====
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }
function aR(x, y, w, h, rx, f, s, sw, rot) { return '<rect x="' + _n(x) + '" y="' + _n(y) + '" width="' + _n(w) + '" height="' + _n(h) + '" rx="' + _n(rx || 0) + '" fill="' + f + '"' + _st(s, sw) + _rot(rot, x + w / 2, y + h / 2) + '/>'; }
function aP(d, f, s, w) { return '<path d="' + d + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aL(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
function aT(x, y, txt, size, f, s) { return '<text x="' + _n(x) + '" y="' + _n(y) + '" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="bold" font-size="' + size + '" fill="' + f + '"' + (s ? ' stroke="' + s + '" stroke-width="1"' : '') + '>' + txt + '</text>'; }
function aG(x, y, s, inner, rot, flip) { return '<g transform="translate(' + _n(x) + ' ' + _n(y) + ')' + (rot ? ' rotate(' + _n(rot) + ')' : '') + ' scale(' + (flip ? -s : s) + ' ' + s + ')">' + inner + '</g>'; }
function aO(op, inner) { return '<g opacity="' + op + '">' + inner + '</g>'; }
function polyD(pts) { let d = ''; for (let k = 0; k < pts.length; k += 2) d += (k ? 'L' : 'M') + _n(pts[k]) + ' ' + _n(pts[k + 1]) + ' '; return d + 'Z'; }
function starD(x, y, r, n, inner, rot) {
  n = n || 5; inner = inner || 0.45; rot = rot || 0; const pts = [];
  for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + rot + k * Math.PI / n, rr = k % 2 ? r * inner : r; pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  return polyD(pts);
}
function ngonD(x, y, r, n, rot) { const pts = []; for (let k = 0; k < n; k++) { const a = (rot || 0) + k * Math.PI * 2 / n; pts.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } return polyD(pts); }
const shine = (x, y, rx, ry, rot) => aE(x, y, rx, ry, '#ffffff', 0, 0, rot === undefined ? -25 : rot).replace('/>', ' opacity=".45"/>');

// ----- faces -----
// kinds: cute, dot, angry, happy, sleepy, glow, pixel, dizzy, mad (glow + brows)
function eyes(x, y, gap, r, kind, col) {
  col = col || '#1b1b2f'; let s = '';
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    if (kind === 'happy') s += aL('M' + _n(ex - r) + ' ' + _n(y + r * .3) + ' Q' + _n(ex) + ' ' + _n(y - r * 1.1) + ' ' + _n(ex + r) + ' ' + _n(y + r * .3), OL, Math.max(2, r * .45));
    else if (kind === 'dot') s += aC(ex, y, r * .6, col, 0) + aC(ex - r * .2, y - r * .2, r * .2, '#fff', 0);
    else if (kind === 'pixel') s += aR(ex - r * .8, y - r * .8, r * 1.6, r * 1.6, 0, '#fff', OL, 1.5) + aR(ex - r * .4, y - r * .3, r * .8, r * .8, 0, col, 0);
    else if (kind === 'glow' || kind === 'mad') s += aE(ex, y, r * .75, r, col, OL, 1.5) + aC(ex - r * .2, y - r * .35, r * .25, '#fff', 0);
    else if (kind === 'dizzy') s += aL('M' + _n(ex - r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex + r * .7) + ' ' + _n(y + r * .7) + ' M' + _n(ex + r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex - r * .7) + ' ' + _n(y + r * .7), OL, Math.max(2, r * .4));
    else {
      s += aE(ex, y, r * .85, r, '#fff', OL, 1.8) + aC(ex + sx * r * .1, y + r * .15, r * .55, col, 0) + aC(ex + sx * r * .1 - r * .2, y - r * .1, r * .2, '#fff', 0);
      if (kind === 'sleepy') s += aP('M' + _n(ex - r * .9) + ' ' + _n(y) + ' A' + _n(r * .9) + ' ' + _n(r) + ' 0 0 1 ' + _n(ex + r * .9) + ' ' + _n(y) + ' Z', '#0000001a', OL, 1.5);
    }
    if (kind === 'angry' || kind === 'mad') s += aL('M' + _n(ex - sx * r * 1.1) + ' ' + _n(y - r * 1.5) + ' L' + _n(ex + sx * r * .7) + ' ' + _n(y - r * .9), OL, Math.max(2, r * .4));
  }
  return s;
}
// kinds: smile, grin, fang, o, grr, flat, frown, teeth
function mouth(x, y, w, kind) {
  const h = w / 2;
  if (kind === 'grin') return aP('M' + _n(x - h) + ' ' + _n(y) + ' Q' + _n(x) + ' ' + _n(y + w * .9) + ' ' + _n(x + h) + ' ' + _n(y) + ' Z', '#7a1030', OL, 1.8) + aE(x, y + w * .3, w * .22, w * .13, '#ff7aa2', 0);
  if (kind === 'fang') return aL('M' + _n(x - h) + ' ' + _n(y) + ' Q' + _n(x) + ' ' + _n(y + w * .5) + ' ' + _n(x + h) + ' ' + _n(y)) + aP(polyD([x - h * .5, y + w * .12, x - h * .3, y + w * .45, x - h * .1, y + w * .2]), '#fff', OL, 1.2) + aP(polyD([x + h * .1, y + w * .2, x + h * .3, y + w * .45, x + h * .5, y + w * .12]), '#fff', OL, 1.2);
  if (kind === 'o') return aE(x, y + w * .2, w * .22, w * .28, '#7a1030', OL, 1.8);
  if (kind === 'grr') { let d = 'M' + _n(x - h) + ' ' + _n(y); for (let k = 1; k <= 6; k++) d += ' L' + _n(x - h + k * w / 6) + ' ' + _n(y + (k % 2 ? w * .2 : 0)); return aL(d, OL, 2.2); }
  if (kind === 'flat') return aL('M' + _n(x - h * .7) + ' ' + _n(y + 2) + ' L' + _n(x + h * .7) + ' ' + _n(y + 2));
  if (kind === 'frown') return aL('M' + _n(x - h) + ' ' + _n(y + w * .35) + ' Q' + _n(x) + ' ' + _n(y - w * .1) + ' ' + _n(x + h) + ' ' + _n(y + w * .35));
  if (kind === 'teeth') return aR(x - h, y, w, w * .4, w * .12, '#fff', OL, 1.8) + aL('M' + _n(x - h / 3) + ' ' + _n(y) + ' L' + _n(x - h / 3) + ' ' + _n(y + w * .4) + ' M' + _n(x + h / 3) + ' ' + _n(y) + ' L' + _n(x + h / 3) + ' ' + _n(y + w * .4), OL, 1.2);
  return aL('M' + _n(x - h) + ' ' + _n(y) + ' Q' + _n(x) + ' ' + _n(y + w * .55) + ' ' + _n(x + h) + ' ' + _n(y));
}
const cheeks = (x, y, gap, r) => aO('.55', aE(x - gap, y, r, r * .65, '#ff7aa2', 0) + aE(x + gap, y, r, r * .65, '#ff7aa2', 0));

// ----- little props -----
function crown(x, y, w, h, col, spiky) {
  col = col || '#ffd740'; const l = x - w / 2, b = y + h / 2, t = y - h / 2;

function dressUp(id, type) {

    case 'thanks':
      return c.art(false) + sign(0, 32, 'THANK', 'YOU!') + (id === 'sparks' || id === 'woof' || id === 'sammy' ? aE(-30, 18, 7, 6, '#f4b942', OL, 1.8) + aE(30, 18, 7, 6, '#f4b942', OL, 1.8) : '');
    case 'love':
      return c.art(false) + heartShape(0, 32, 2.6, '#ff1744') + heartShape(side, -34, 1, '#ff80ab');
    case 'xmas':
      if (id === 'gloop') return gloop({ crown: false, mouth: 'grin' }) + aP('M-30 14 Q-32 40 0 48 Q32 40 30 14 Q20 26 12 22 Q0 30 -12 22 Q-20 26 -30 14 Z', '#ffffff', OL, 2) + santaHat(0, -32, 46) + giftBox(side + 4, 34, 1.2, '#43a047');
      return c.art(!!H) + hat(santaHat) + giftBox(side, 36, 1.1, id === 'sparks' ? '#e53935' : '#43a047');
    case 'halloween':
      if (id === 'robo') return pumpkinRobo() + candyBucket(side, 30);
      return c.art(!!H) + hat(witchHat) + candyBucket(side, 30);
    case 'easter':
      return c.art(!!H) + hat(bunnyEars) + egg(side - 4, 40, 1.2, '#b39ddb') + egg(side + 12, 44, 1, '#80deea', '#ff80ab');
    case 'newyear':

    case 'congrats':
      return c.art(false) + medal(0, 24) + trophyCup(side, 26, 1.3);
    case 'miss':
      return c.art(false) + letter(0, 34) + heartShape(side, -30, 1, '#ff80ab') + heartShape(side + 10, -48, .7, '#ff4081');
    case 'mom':
      return c.art(false) + bouquet(side - 4, 14) + heartShape(-side, -34, .9, '#ff4081');
    case 'dad':
      return c.art(false) + mug(side - 2, 26) + aP(starD(-side, -36, 9), '#ffd740', OL, 1.5);
    case 'school':
      return c.art(false) + apple(side - 4, 36, 1.2) + pencil(-side + 4, 22, 1, -20) + (H ? aP('M' + _n(H[0] - H[2] / 2) + ' ' + _n(H[1]) + ' Q' + H[0] + ' ' + _n(H[1] - H[2] * .7) + ' ' + _n(H[0] + H[2] / 2) + ' ' + _n(H[1]) + ' Z', '#1e6bff', OL, 2) + aR(H[0] - 4, H[1] - 3, 26, 6, 3, '#1e6bff', OL, 1.6) : '');

}
