<canvas id="game" width="960" height="520"></canvas>
<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const PX = 180, PY = 62, PW = 770, PH = 386;            // where the paper sits
const paper = document.createElement('canvas'); paper.width = PW; paper.height = PH;
const pctx = paper.getContext('2d', { willReadFrequently: true });
pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, PW, PH);
let frame = 0;

// ---------- Sound ----------
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } return actx; }
function note(f, start, dur, wave = 'sine', vol = 0.06, slide = null) {
  if (!actx) return;
  const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  click: () => note(800, 0, 0.05, 'square', 0.04),
  pop: () => note(500, 0, 0.12, 'sine', 0.12, 1200),
  splash: () => { note(300, 0, 0.25, 'sine', 0.1, 900); note(900, 0.08, 0.2, 'sine', 0.06, 1500); },
  sparkle: () => note(1500 + Math.random() * 1500, 0, 0.06, 'sine', 0.03),
  undo: () => note(600, 0, 0.12, 'triangle', 0.08, 300),
  save: () => [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.08, 0.15, 'square', 0.05)),
  swoosh: () => note(200, 0, 0.3, 'sawtooth', 0.04, 80),
};

// ---------- Tools ----------
const TOOLS = [
  { id: 'brush', name: 'Brush', icon: '🖌️' }, { id: 'rainbow', name: 'Rainbow', icon: '🌈' },
  { id: 'sparkle', name: 'Sparkle', icon: '✨' }, { id: 'spray', name: 'Spray', icon: '💨' },
  { id: 'fill', name: 'Fill', icon: '🪣' }, { id: 'stamp', name: 'Stamps', icon: '⭐' },
  { id: 'eraser', name: 'Eraser', icon: '🧽' }, { id: 'shapes', name: 'Shapes', icon: '🔷' },
];
const COLORS = ['#000000', '#7a7a7a', '#ffffff', '#ff1744', '#ff6d00', '#ffd600', '#76ff03', '#00c853', '#00b8d4', '#2979ff', '#651fff', '#d500f9', '#ff4081', '#8d5a2b', '#ffccbc', '#b2ebf2'];
const STAMPS = ['⭐', '❤️', '🌸', '🌈', '☀️', '🌙', '🐶', '🐱', '🦄', '🐉', '🦖', '🚀', '🌳', '🏠', '🍕', '🦋', '🐟', '🎈', '👑', '😀'];
const SHAPES = ['circle', 'square', 'heart', 'star', 'triangle'];
const SIZES = [4, 10, 20, 40];

let tool = 'brush', color = '#ff1744', sizeI = 1, stamp = '⭐', shape = 'circle', mirror = false;
let mouse = { x: 0, y: 0, down: false }, last = null, hue = 0, panel = null, toastMsg = '', toastT = 0, clearArm = 0, shapeStart = null;
const undoStack = [];
function pushUndo() { undoStack.push(pctx.getImageData(0, 0, PW, PH)); if (undoStack.length > 25) undoStack.shift(); }
function undo() { const d = undoStack.pop(); if (d) { pctx.putImageData(d, 0, 0); sfx.undo(); } else toast('Nothing to undo!'); }
function toast(t) { toastMsg = t; toastT = 140; }
const size = () => SIZES[sizeI];
const inPaper = (x, y) => x >= PX && x < PX + PW && y >= PY && y < PY + PH;

// mirror helper: run a drawing function at (x, y) and again mirrored left-right
function both(fn, x, y, ...rest) { fn(x, y, ...rest); if (mirror) fn(PW - x, y, ...rest, true); }

function line(x1, y1, x2, y2, c, w) {
  pctx.strokeStyle = c; pctx.lineWidth = w; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.beginPath(); pctx.moveTo(x1, y1); pctx.lineTo(x2, y2); pctx.stroke();
  if (mirror) { pctx.beginPath(); pctx.moveTo(PW - x1, y1); pctx.lineTo(PW - x2, y2); pctx.stroke(); }
}
function starPath(c, x, y, r, pts = 5, inner = 0.45, rot = -Math.PI / 2) {
  c.beginPath();
  for (let i = 0; i < pts * 2; i++) { const rr = i % 2 ? r * inner : r, a = rot + i * Math.PI / pts; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath();
}
function sparkleAt(x, y) {
  const r = size() * 0.6 + 4;
  for (let i = 0; i < 2; i++) {
    const sx = x + (Math.random() - .5) * r * 2.5, sy = y + (Math.random() - .5) * r * 2.5;
    pctx.fillStyle = `hsl(${Math.random() * 360},100%,60%)`;
    both((px, py) => { starPath(pctx, px, py, r * (0.4 + Math.random() * 0.5), 4, 0.35, Math.random()); pctx.fill(); }, sx, sy);
  }
  if (Math.random() < 0.3) sfx.sparkle();
}
function sprayAt(x, y) {
  const r = size() * 1.5 + 8; pctx.fillStyle = color;
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * r;
    both((px, py) => pctx.fillRect(px, py, 2, 2), x + Math.cos(a) * d, y + Math.sin(a) * d);
  }
}
function stampAt(x, y) {
  const s = size() * 2.2 + 24;
  pctx.font = `${s}px sans-serif`; pctx.textAlign = 'center'; pctx.textBaseline = 'middle';
  pctx.fillText(stamp, x, y);
  if (mirror) { pctx.save(); pctx.translate(PW - x, y); pctx.scale(-1, 1); pctx.fillText(stamp, 0, 0); pctx.restore(); }
  sfx.pop();
}
function shapePath(c, kind, x1, y1, x2, y2) {
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, rx = Math.abs(x2 - x1) / 2, ry = Math.abs(y2 - y1) / 2;
  c.beginPath();
  if (kind === 'circle') c.ellipse(cx, cy, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
  else if (kind === 'square') c.rect(Math.min(x1, x2), Math.min(y1, y2), rx * 2, ry * 2);
  else if (kind === 'triangle') { c.moveTo(cx, cy - ry); c.lineTo(cx + rx, cy + ry); c.lineTo(cx - rx, cy + ry); c.closePath(); }
  else if (kind === 'star') { starPath(c, cx, cy, Math.max(rx, ry)); }
  else if (kind === 'heart') {
    c.moveTo(cx, cy + ry); c.bezierCurveTo(cx - rx * 1.6, cy - ry * 0.2, cx - rx * 0.6, cy - ry * 1.4, cx, cy - ry * 0.45);
    c.bezierCurveTo(cx + rx * 0.6, cy - ry * 1.4, cx + rx * 1.6, cy - ry * 0.2, cx, cy + ry); c.closePath();
  }
}
function drawShape(x1, y1, x2, y2) {
  pctx.fillStyle = color;
  shapePath(pctx, shape, x1, y1, x2, y2); pctx.fill();
  if (mirror) { shapePath(pctx, shape, PW - x1, y1, PW - x2, y2); pctx.fill(); }
  sfx.pop();
}

// flood fill (paint bucket)
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function floodFill(sx, sy, hex) {
  sx = Math.floor(sx); sy = Math.floor(sy);
  const img = pctx.getImageData(0, 0, PW, PH), d = img.data, [r, g, b] = hexToRgb(hex);
  const i0 = (sy * PW + sx) * 4, tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];
  if (Math.abs(tr - r) + Math.abs(tg - g) + Math.abs(tb - b) < 10) return;
  const match = i => Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) < 110;
  const seen = new Uint8Array(PW * PH), stack = [sx, sy];
  while (stack.length) {
    const y = stack.pop(), x0 = stack.pop();
    let x = x0;
    while (x >= 0 && !seen[y * PW + x] && match((y * PW + x) * 4)) x--;
    x++;
    let up = false, down = false;
    while (x < PW && !seen[y * PW + x] && match((y * PW + x) * 4)) {
      const i = (y * PW + x) * 4; seen[y * PW + x] = 1;
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
      if (y > 0) { const m = !seen[(y - 1) * PW + x] && match(((y - 1) * PW + x) * 4); if (m && !up) { stack.push(x, y - 1); up = true; } else if (!m) up = false; }
      if (y < PH - 1) { const m = !seen[(y + 1) * PW + x] && match(((y + 1) * PW + x) * 4); if (m && !down) { stack.push(x, y + 1); down = true; } else if (!m) down = false; }
      x++;
    }
  }
  pctx.putImageData(img, 0, 0);
}

// ---------- Coloring pages ----------
function outline(fn) {
  pushUndo();
  pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, PW, PH);
  pctx.strokeStyle = '#000'; pctx.lineWidth = 6; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  const s = (f) => { pctx.beginPath(); f(); pctx.stroke(); };
  fn(s, pctx);
  sfx.swoosh(); toast('Use the 🪣 Fill tool to color it in!');
  tool = 'fill';
}
const PAGES = {
  house: { name: 'House', icon: '🏠', draw: (s, c) => {
    s(() => c.rect(250, 170, 270, 190)); s(() => { c.moveTo(220, 175); c.lineTo(385, 60); c.lineTo(550, 175); c.closePath(); });
    s(() => c.rect(355, 270, 60, 90)); s(() => c.rect(275, 200, 60, 50)); s(() => c.rect(435, 200, 60, 50));
    s(() => { c.moveTo(305, 200); c.lineTo(305, 250); c.moveTo(275, 225); c.lineTo(335, 225); c.moveTo(465, 200); c.lineTo(465, 250); c.moveTo(435, 225); c.lineTo(495, 225); });
    s(() => c.arc(660, 80, 40, 0, Math.PI * 2)); s(() => { c.moveTo(0, 360); c.lineTo(PW, 360); });
    s(() => { c.moveTo(80, 360); c.lineTo(80, 260); }); s(() => c.arc(80, 220, 50, 0, Math.PI * 2));
  } },
  cat: { name: 'Kitty', icon: '🐱', draw: (s, c) => {
    s(() => c.ellipse(385, 280, 110, 85, 0, 0, Math.PI * 2)); s(() => c.arc(385, 160, 75, 0, Math.PI * 2));
    s(() => { c.moveTo(325, 115); c.lineTo(315, 50); c.lineTo(365, 92); c.closePath(); }); s(() => { c.moveTo(445, 115); c.lineTo(455, 50); c.lineTo(405, 92); c.closePath(); });
    s(() => c.arc(355, 150, 12, 0, Math.PI * 2)); s(() => c.arc(415, 150, 12, 0, Math.PI * 2));
    s(() => { c.moveTo(375, 180); c.lineTo(395, 180); c.lineTo(385, 192); c.closePath(); });
    s(() => { c.moveTo(385, 192); c.quadraticCurveTo(370, 210, 355, 200); c.moveTo(385, 192); c.quadraticCurveTo(400, 210, 415, 200); });
    s(() => { c.moveTo(495, 300); c.quadraticCurveTo(600, 300, 580, 190); });
    s(() => { c.moveTo(340, 175); c.lineTo(280, 165); c.moveTo(340, 185); c.lineTo(280, 195); c.moveTo(430, 175); c.lineTo(490, 165); c.moveTo(430, 185); c.lineTo(490, 195); });
  } },
  rocket: { name: 'Rocket', icon: '🚀', draw: (s, c) => {
    s(() => { c.moveTo(385, 30); c.quadraticCurveTo(470, 110, 450, 280); c.lineTo(320, 280); c.quadraticCurveTo(300, 110, 385, 30); });
    s(() => c.arc(385, 150, 35, 0, Math.PI * 2));
    s(() => { c.moveTo(320, 220); c.lineTo(260, 300); c.lineTo(325, 280); }); s(() => { c.moveTo(450, 220); c.lineTo(510, 300); c.lineTo(445, 280); });
    s(() => { c.moveTo(340, 280); c.lineTo(355, 360); c.lineTo(385, 320); c.lineTo(415, 360); c.lineTo(430, 280); });
    for (const [x, y] of [[100, 80], [640, 60], [150, 300], [650, 300], [560, 170]]) s(() => starPath(c, x, y, 26));
  } },
  dino: { name: 'Dinosaur', icon: '🦖', draw: (s, c) => {
    s(() => { c.moveTo(150, 300); c.quadraticCurveTo(250, 160, 400, 200); c.quadraticCurveTo(470, 100, 500, 80); c.quadraticCurveTo(600, 60, 610, 110);
      c.quadraticCurveTo(600, 140, 540, 140); c.quadraticCurveTo(520, 200, 520, 260); c.quadraticCurveTo(480, 320, 380, 310); c.quadraticCurveTo(250, 320, 150, 300); });
    s(() => c.arc(560, 92, 8, 0, Math.PI * 2));
    s(() => c.rect(330, 300, 40, 60)); s(() => c.rect(440, 290, 40, 70));
    for (let i = 0; i < 5; i++) s(() => { const x = 250 + i * 50, y = 205 - i * 8 + (i > 2 ? 10 : 0); c.moveTo(x, y); c.lineTo(x + 18, y - 35); c.lineTo(x + 36, y - 2); });
    s(() => { c.moveTo(0, 362); c.lineTo(PW, 362); });
  } },
  flower: { name: 'Flowers', icon: '🌸', draw: (s, c) => {
    for (const [x, y, r] of [[200, 160, 50], [400, 120, 60], [600, 170, 48]]) {
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; s(() => c.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.55, 0, Math.PI * 2)); }
      s(() => c.arc(x, y, r * 0.55, 0, Math.PI * 2)); s(() => { c.moveTo(x, y + r * 1.5); c.lineTo(x, 370); });
      s(() => c.ellipse(x + 30, y + r * 2.2, 30, 12, -0.5, 0, Math.PI * 2));
    }
    s(() => { c.moveTo(0, 370); c.lineTo(PW, 370); });
  } },
  fish: { name: 'Fish', icon: '🐟', draw: (s, c) => {
    s(() => c.ellipse(360, 190, 170, 100, 0, 0, Math.PI * 2));
    s(() => { c.moveTo(530, 190); c.lineTo(640, 100); c.lineTo(640, 280); c.closePath(); });
    s(() => c.arc(260, 165, 20, 0, Math.PI * 2));
    for (let k = 0; k < 3; k++) s(() => c.arc(350 + k * 60, 190, 45, -1.2, 1.2));
    s(() => { c.moveTo(330, 95); c.quadraticCurveTo(380, 30, 440, 100); });
    for (const [x, y, r] of [[120, 80, 18], [90, 140, 12], [150, 40, 10]]) s(() => c.arc(x, y, r, 0, Math.PI * 2));
  } },
};

// ---------- Gallery ----------
function gallery() { try { return JSON.parse(localStorage.getItem('paintGallery') || '[]'); } catch (_) { return []; } }
function saveArt() {
  const list = gallery();
  list.unshift(paper.toDataURL('image/jpeg', 0.8));
  while (list.length > 8) list.pop();
  try { localStorage.setItem('paintGallery', JSON.stringify(list)); sfx.save(); toast('Saved to your gallery! 🖼️'); loadThumbs(); }
  catch (_) { toast('Oops! The gallery is full. Delete an old picture first.'); }
}
let thumbs = [];
function loadThumbs() { thumbs = gallery().map(src => { const im = new Image(); im.src = src; return im; }); }
loadThumbs();
let deleteArm = -1;

// ---------- UI layout ----------
let buttons = [];
function btn(x, y, w, h, o) { buttons.push({ x, y, w, h, ...o }); }
function buildButtons() {
  buttons = [];
  // top bar
  const top = [
    ['↩️', 'Undo', () => undo()],
    ['🪞', 'Mirror', () => { mirror = !mirror; toast(mirror ? 'Mirror magic ON! Both sides match! 🦋' : 'Mirror off'); }],
    ['📄', 'Coloring', () => { panel = panel === 'pages' ? null : 'pages'; }],
    ['💾', 'Save', () => saveArt()],
    ['🖼️', 'Gallery', () => { panel = panel === 'gallery' ? null : 'gallery'; deleteArm = -1; }],
    ['🗑️', clearArm ? 'Sure?' : 'New', () => {
      if (!clearArm) { clearArm = 150; toast('Click "Sure?" to start a new picture'); return; }
      pushUndo(); pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, PW, PH); clearArm = 0; sfx.swoosh(); toast('Fresh new paper! (Undo brings it back)');
    }],
  ];
  top.forEach(([icon, label, fn], i) => btn(330 + i * 104, 8, 98, 46, { icon, label, fn, active: (label === 'Mirror' && mirror) || (label === 'Coloring' && panel === 'pages') || (label === 'Gallery' && panel === 'gallery'), warn: label === 'Sure?' }));
  // tools
  TOOLS.forEach((t, i) => btn(10 + (i % 2) * 82, 62 + Math.floor(i / 2) * 72, 76, 66, { icon: t.icon, label: t.name, fn: () => { tool = t.id; panel = null; }, active: tool === t.id, big: true }));
  // sizes
  SIZES.forEach((s, i) => btn(10 + i * 41, 356, 37, 40, { dot: Math.min(16, s / 2.5 + 2), fn: () => { sizeI = i; }, active: sizeI === i }));
  // bottom: colors, stamps or shapes
  if (tool === 'stamp') STAMPS.forEach((s, i) => btn(PX + i * 38.5, 456, 36, 54, { emoji: s, fn: () => { stamp = s; }, active: stamp === s }));
  else if (tool === 'shapes') {
    SHAPES.forEach((s, i) => btn(PX + i * 62, 456, 56, 54, { shape: s, fn: () => { shape = s; }, active: shape === s }));
    COLORS.forEach((c, i) => btn(PX + 320 + i * 28, 462, 25, 42, { swatch: c, fn: () => { color = c; }, active: color === c }));
  } else if (tool !== 'rainbow' && tool !== 'sparkle' && tool !== 'eraser') COLORS.forEach((c, i) => btn(PX + i * 48, 458, 44, 50, { swatch: c, fn: () => { color = c; }, active: color === c }));
  // panels
  if (panel === 'pages') Object.entries(PAGES).forEach(([id, pg], i) => btn(PX + 40 + (i % 3) * 240, PY + 60 + Math.floor(i / 3) * 150, 210, 130, { icon: pg.icon, label: pg.name, fn: () => { outline(pg.draw); panel = null; }, card: true }));
  if (panel === 'gallery') thumbs.forEach((im, i) => {
    const x = PX + 30 + (i % 4) * 180, y = PY + 60 + Math.floor(i / 4) * 150;
    btn(x, y, 165, 100, { thumb: im, fn: () => { pushUndo(); pctx.drawImage(im, 0, 0, PW, PH); panel = null; sfx.pop(); toast('Here is your picture! Keep painting! 🎨'); } });
    btn(x + 40, y + 106, 85, 30, { label: deleteArm === i ? 'Sure?' : 'Delete', small: true, warn: deleteArm === i, fn: () => {
      if (deleteArm !== i) { deleteArm = i; return; }
      const list = gallery(); list.splice(i, 1); try { localStorage.setItem('paintGallery', JSON.stringify(list)); } catch (_) {} loadThumbs(); deleteArm = -1; sfx.undo();
    } });
  });
}

// ---------- Input ----------
function pos(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
C.addEventListener('mousedown', e => {
  audio();
  const [x, y] = pos(e); mouse.x = x; mouse.y = y;
  buildButtons();
  for (const b of buttons.slice().reverse()) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { sfx.click(); b.fn(); return; }
  if (panel) { panel = null; return; }
  if (!inPaper(x, y)) return;
  const px = x - PX, py = y - PY;
  mouse.down = true; last = [px, py];
  pushUndo();
  if (tool === 'fill') { floodFill(px, py, color); if (mirror) floodFill(PW - 1 - px, py, color); sfx.splash(); mouse.down = false; }
  else if (tool === 'stamp') { stampAt(px, py); mouse.down = false; }
  else if (tool === 'shapes') shapeStart = [px, py];
  else paintAt(px, py, px, py);
});
C.addEventListener('mousemove', e => {
  const [x, y] = pos(e); mouse.x = x; mouse.y = y;
  if (!mouse.down || tool === 'shapes') return;
  const px = clampX(x - PX), py = clampY(y - PY);
  paintAt(last[0], last[1], px, py);
  last = [px, py];
});
const clampX = v => Math.max(0, Math.min(PW - 1, v)), clampY = v => Math.max(0, Math.min(PH - 1, v));
addEventListener('mouseup', () => {
  if (mouse.down && tool === 'shapes' && shapeStart) {
    const ex = clampX(mouse.x - PX), ey = clampY(mouse.y - PY);
    if (Math.abs(ex - shapeStart[0]) + Math.abs(ey - shapeStart[1]) < 6) drawShape(shapeStart[0] - 40, shapeStart[1] - 40, shapeStart[0] + 40, shapeStart[1] + 40);
    else drawShape(shapeStart[0], shapeStart[1], ex, ey);
    shapeStart = null;
  }
  mouse.down = false;

  window.addEventListener('keydown', bump, { capture: true });
  window.addEventListener('pointerdown', bump, { capture: true });
  window.addEventListener('touchstart', bump, { capture: true, passive: true });
  function padActive(pads) {
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (!gp || gp.connected === false) continue;
      for (var b = 0; b < gp.buttons.length; b++) if (gp.buttons[b].pressed) return true;
      for (var a = 0; a < gp.axes.length; a++) if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  hub.fns.push(function (now, pads) {
    if (leaving) return;
    if (IS_BOOK) {                     // while a game is open its own overlay owns the idle timer
      if (!player) player = document.getElementById('player');
      if (player && player.classList.contains('open')) { last = now; return; }
    }
    if (padActive(pads)) last = now;
    if (now - last < IDLE_MS) return;
    leaving = true;
    var g = false;
    try { g = window.parent !== window && typeof window.parent.closeGame === 'function'; } catch (e) {}
    if (g) { try { window.parent.closeGame(); } catch (e) {} }
    else location.href = '/';          // pagehide fires -> games persist their state
  });
})();
</script>
