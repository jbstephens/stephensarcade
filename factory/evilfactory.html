    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }

<script>

function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 90; } } catch (_) {} }   // for the Sticker Book

  try {
    const s = JSON.parse(localStorage.getItem('evilFactory') || '{}') || {};
    s.unlocked = Math.max(s.unlocked || 1, unlocked); if (won) s.won = true;

const C = document.getElementById('game'), ctx = C.getContext('2d');

// ---------- Colors: every color has an EVIL look and a GOOD look; `good` (0 → 1) flips between them ----------
let good = 0;
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hex(a), B = hex(b), k = Math.max(0, Math.min(1, t));
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * k)},${Math.round(A[1] + (B[1] - A[1]) * k)},${Math.round(A[2] + (B[2] - A[2]) * k)})`;
}
const ev = (evil, nice) => mix(evil, nice, good);    // pick the color for how good the factory is right now

// ---------- Sound ----------
let actx = null;
function wake() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump:    () => note(350, 0, 0.15, 'square', 0.07, 700),
  hover:   () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  smile:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  stomp:   () => { note(320, 0, 0.08, 'sawtooth', 0.12, 200); note(600, 0.06, 0.1, 'square', 0.08, 900); },
  clang:   () => { note(1400, 0, 0.12, 'triangle', 0.1, 900); note(700, 0.03, 0.15, 'square', 0.05); },

  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },
  bossDie: () => { for (let i = 0; i < 8; i++) note(400 - i * 40, i * 0.08, 0.15, 'sawtooth', 0.08); },
  boom:    () => note(90, 0, 0.4, 'triangle', 0.25, 40),

// ---------- Music (original spooky-silly "Evil Factory" theme: eighth notes, 0 = rest) ----------
let musicOn = true, nextNoteTime = 0, step = 0;
const MUSIC_BPM = 132;
const MELODY = [
  57,0,60,0, 64,0,63,0, 62,0,60,0, 59,0,0,0,   57,0,60,0, 64,0,67,0, 66,0,64,0, 63,0,0,0,
  69,0,67,0, 64,0,63,64, 62,0,60,0, 59,60,62,0, 57,0,64,0, 63,0,59,0, 57,0,0,0, 0,0,52,0,
];
const BASS = [45, 45, 41, 40, 45, 43, 41, 40].flatMap(r => [r, 0, r + 12, 0, r + 7, 0, r + 12, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = bossState === 'fight', happy = state === 'win';
  const stepDur = 60 / (fight ? 156 : MUSIC_BPM) / 2, shift = happy ? 3 : fight ? -2 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    let m = MELODY[step % MELODY.length]; const b = BASS[step % BASS.length];
    if (happy && m && [0, 5, 7].includes(m % 12)) m += 1;   // the good factory plays it happy (major)!
    if (m) note(midi(m + shift), t, stepDur * 0.9, 'square', 0.035);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.09);
    if (step % 2 === 0) note(fight ? 140 : 110, t, 0.04, 'square', 0.015);
    nextNoteTime += stepDur; step++;
  }
}

// ---------- Input ----------
const keys = { left: false, right: false, jump: false };
let jumpPressed = false, okPressed = false;
addEventListener('keydown', e => {
  wake();

  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (!keys.jump) jumpPressed = true;
    keys.jump = true; e.preventDefault();
  }
  if ((k === ' ' || k === 'Enter') && !e.repeat) okPressed = true;
  if (state === 'title' && k >= '1' && k <= '5') { if (+k <= unlocked) startGame(+k - 1); else sfx.ouch(); }
  if (k === 'm' || k === 'M') musicOn = !musicOn;
  if (k === 'Escape' && state !== 'title') goTitle();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.jump = false;
});
const LV_BTN = i => ({ x: W / 2 - 250 + i * 100 + 5, y: 350, w: 90, h: 62 });
const PLAY_BTN = { x: W / 2 - 150, y: 272, w: 300, h: 60 };
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
C.addEventListener('mousedown', e => {                 // taps: level buttons + PLAY on the title, anywhere to continue
  wake();
  const r = C.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (state === 'title') {
    for (let i = 0; i < 5; i++) if (inBox(LV_BTN(i), x, y)) { if (i < unlocked) startGame(i); else sfx.ouch(); return; }
    if (inBox(PLAY_BTN, x, y)) startGame(unlocked - 1);
  } else if (state === 'levelDone' || state === 'win') okPressed = true;
});


// ---------- Levels ----------
// Map key:  # ground   = metal ledge   > < conveyor belts (they push you!)   ~ bubbly goo (bouncy ouch)
//           ^ grumpy spikes   o smile to save   E evil gear   F frowny flying page   B bounce pad   C checkpoint sign   P start
// An EVIL TWIN boss arena is added to the end of every level.
const LEVELS = [
  { name: 'Upside-Down Assembly Line', sky: ['#2a0a3d', '#5c1033'], nice: ['#4fc3f7', '#e1f5fe'], top: '#b0306a', topG: '#66bb6a', dirt: '#3a0f40', dirtG: '#8d6e63',

const ARENA = 24;

// ---------- World ----------
let state = 'title', levelIndex = 0, frame = 0, timer = 0;
let map, rows, cols, arenaStart, smiles, enemies, springs, spikes, signs, player, respawn;
let camX = 0, particles = [], levelBanner = 0, helpTimer = 0, smilesGot = 0, shake = 0;
let bossState = 'none', boss = null, shots = [], waves = [], marks = [], bossBanner = 0, bannerText = '', bannerSub = '';
let history = [];                                     // where Robo has been (Evil Robo copies it!)

function buildLevel(i) {
  const L = LEVELS[i];
  const width = Math.max(...L.map.map(r => r.length)) + 2;
  arenaStart = width;
  rows = 13; cols = width + ARENA;
  map = []; smiles = []; enemies = []; springs = []; spikes = []; signs = [];
  for (let r = 0; r < rows; r++) {
    const src = (L.map[r] || '').padEnd(width, r >= 11 ? '#' : ' ');
    let row = '';
    for (let c = 0; c < cols; c++) {
      let ch = c < width ? src[c] : (r >= 11 ? '#' : (r === 8 && ((c - width >= 3 && c - width <= 6) || (c - width >= 17 && c - width <= 20)) ? '=' : ' '));
      const x = c * T, y = r * T;
      if (ch === 'o') smiles.push({ x: x + T / 2, y: y + T / 2, got: false });
      else if (ch === 'E') enemies.push({ kind: 'gear', x: x + 2, y: y + 4, w: 36, h: 36, vx: -1.2, vy: 0, alive: true, squish: 0 });
      else if (ch === 'F') enemies.push({ kind: 'page', x: x, y: y, w: 40, h: 34, baseY: y, vx: -1, vy: 0, alive: true, squish: 0, t: c * 7 });
      else if (ch === 'B') springs.push({ x: x + 2, y: y + 24, w: 36, h: 16, squash: 0 });
      else if (ch === '^') spikes.push({ x: x + 4, y: y + 18, w: 32, h: 22 });
      else if (ch === 'C') signs.push({ x: x + 6, y: y - 30, w: 30, h: 70, on: false });
      else if (ch === 'P') respawn = { x: x + 6, y: y + 4 };
      row += '#=<>~'.includes(ch) ? ch : ' ';
    }
    map.push(row);
  }
}
const tileAt = (c, r) => (r < 0 || r >= rows || c < 0 || c >= cols) ? (c < 0 || c >= cols ? '#' : ' ') : map[r][c];
const solid = ch => ch === '#' || ch === '=' || ch === '<' || ch === '>';

function newPlayer() {
  return { x: respawn.x, y: respawn.y, w: 28, h: 36, vx: 0, vy: 0, onGround: false, face: 1, coyote: 0, buffer: 0,
           jumping: false, inv: 0, squash: 1, hover: 80, hovering: false, hp: MAXHP, safe: { x: respawn.x, y: respawn.y } };
}
function startGame(i) {
  levelIndex = i; buildLevel(i);
  player = newPlayer(); state = 'play'; timer = 0; good = 0;
  camX = 0; particles = []; shots = []; waves = []; marks = []; history = [];
  bossState = 'none'; boss = null; bossBanner = 0; smilesGot = 0;
  levelBanner = 200; helpTimer = i === 0 ? 420 : 0;
  okPressed = jumpPressed = false;
}
function goTitle() { state = 'title'; bossState = 'none'; boss = null; good = 0; okPressed = false; }

// ---------- Moving + bumping into tiles ----------
function moveX(o) {
  o.x += o.vx;
  const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 1) / T);
  if (o.vx > 0) { const c = Math.floor((o.x + o.w) / T); for (let r = top; r <= bot; r++) if (solid(tileAt(c, r))) { o.x = c * T - o.w; o.vx = 0; o.hitWall = 1; break; } }
  else if (o.vx < 0) { const c = Math.floor(o.x / T); for (let r = top; r <= bot; r++) if (solid(tileAt(c, r))) { o.x = (c + 1) * T; o.vx = 0; o.hitWall = -1; break; } }
}
function moveY(o) {
  o.y += o.vy; o.onGround = false; o.belt = 0;
  const l = Math.floor((o.x + 2) / T), rr = Math.floor((o.x + o.w - 3) / T);
  if (o.vy > 0) {
    const r = Math.floor((o.y + o.h) / T);
    for (let c = l; c <= rr; c++) { const ch = tileAt(c, r); if (solid(ch)) { o.y = r * T - o.h; o.vy = 0; o.onGround = true; if (ch === '>') o.belt = 1.6; if (ch === '<') o.belt = -1.6; break; } }
  } else if (o.vy < 0) {
    const r = Math.floor(o.y / T);
    if (r >= 0) for (let c = l; c <= rr; c++) if (solid(tileAt(c, r))) { o.y = (r + 1) * T; o.vy = 0; break; }
  }
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function burst(x, y, colors, n = 10, sp = 4) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * sp * 2, vy: (Math.random() - .8) * sp * 1.5,
    life: 30 + Math.random() * 20, color: colors[i % colors.length], size: 3 + Math.random() * 4 });
}


// ---------- Ouch (gentle: 5 hearts, then you just try again from the last sign with all hearts back) ----------
function hurt(fromX) {
  const p = player;
  if (p.inv > 0 || state !== 'play') return;
  p.hp--; p.inv = 90; sfx.ouch(); shake = 8;
  burst(p.x + 14, p.y + 18, ['#ffffff', '#7df9ff', '#2979ff'], 12, 4);
  if (fromX !== undefined) { p.vx = (p.x + p.w / 2 < fromX ? -6 : 6); p.vy = -7; }
  if (p.hp <= 0) { state = 'dying'; timer = 0; burst(p.x + 14, p.y + 18, ['#ffffff', '#7df9ff', '#2979ff'], 20, 5); }
}
function respawnPlayer() {
  const keepFight = bossState === 'fight';
  player = newPlayer();
  if (keepFight) {                                       // back to the left side of the boss room; the boss keeps its bumps!
    player.x = arenaStart * T + 60; player.y = FLOOR - 120;
    shots = []; waves = []; marks = [];
    if (boss) { boss.mode = 'move'; boss.t = 0; boss.vx = 0; boss.x = arenaStart * T + W - 100 - boss.w; boss.y = Math.min(boss.y, FLOOR - boss.h); }
    history = [];
  }
  player.inv = 90; state = 'play';
}

function updatePlay() {
  const p = player;
  const target = (keys.right - keys.left) * SPEED;
  p.vx += (target - p.vx) * (p.onGround ? 0.3 : 0.15);
  if (keys.right) p.face = 1; else if (keys.left) p.face = -1;

  if (jumpPressed) p.buffer = 8; else p.buffer--;
  jumpPressed = false;
  if (p.onGround) p.coyote = 6; else p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7;
    sfx.jump(); burst(p.x + 14, p.y + p.h, ['#7df9ff', '#fff'], 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;
  if (p.vy >= 0) p.jumping = false;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  // Hold jump while falling to hover with jet boots!
  p.hovering = !p.onGround && keys.jump && p.vy > 0 && p.hover > 0;
  if (p.hovering) {
    p.vy = Math.min(p.vy, 0.6); p.hover--;
    if (frame % 2) particles.push({ x: p.x + 6 + Math.random() * 16, y: p.y + p.h + 4, vx: (Math.random() - .5), vy: 2 + Math.random() * 2,
                                    life: 14, color: frame % 4 ? '#7df9ff' : '#ffffff', size: 4 });
    if (frame % 4 === 0) sfx.hover();
  }

  const wasInAir = !p.onGround, prevBottom = p.y + p.h;

function finishLevel() {

function update() {

  if (bossBanner > 0) bossBanner--; if (levelBanner > 0) levelBanner--; if (helpTimer > 0) helpTimer--;
  for (const q of particles) { q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.life--; }
  particles = particles.filter(q => q.life > 0);
  if (particles.length > 400) particles.splice(0, particles.length - 400);

  else if (state === 'play') {
    updatePlay();
    if (state === 'play' || state === 'dying') { updateBoss(); updateShots(); }
    if (bossState === 'defeated' && state === 'play') {

  } else if (state === 'win') {
    good = Math.min(1, good + 0.01);
