let state = { mode: 'color', names: NAMES.slice(), outfit: {}, traces: {}, magic: {}, prints: 0, parades: 0 };
let view = 'gallery', sel = 0, cur = 0, pen = '#ff3b30', stroke = null;
function loadState() {
  try { const s = JSON.parse(localStorage.getItem('dressUp') || 'null');
    if (s && typeof s === 'object') {
      state.mode = s.mode === 'line' ? 'line' : 'color';
      if (Array.isArray(s.names)) state.names = NAMES.filter(x => s.names.indexOf(x) >= 0);
      ['outfit', 'traces', 'magic'].forEach(k => { if (s[k] && typeof s[k] === 'object') state[k] = s[k]; });
      state.prints = +s.prints || 0; state.parades = +s.parades || 0;
    } } catch (_) {}
}
function saveState() { try { localStorage.setItem('dressUp', JSON.stringify(state)); } catch (_) {} }
