<body>
<canvas id="fx"></canvas>
<!-- 🎁 the surprise box -->
<div id="gift" class="screen">
  <div id="giftMsg">🎁 A SUPER MYSTERY PRIZE! Tap the box to open it!</div>
  <div id="giftBox"></div>
  <button class="btn b-gold glowy" id="bUnwrap">🎁 OPEN IT!</button>
</div>
<!-- 🏟️ opening ceremony -->
<div id="opening" class="screen cer">
  <h1 class="big cerTitle" id="openTitle">🏅 THE GAME FACTORY<br>OLYMPICS! 🏅</h1>
  <div class="cap" id="openCap"></div>
  <div id="runner"></div>
  <div id="parade"></div>
  <div class="cerBtns">
    <button class="btn b-pink" id="bOpenBack">⬅️ Back</button>
    <button class="btn b-blue" id="bOpenAgain">🔁 Watch again</button>
    <button class="btn b-gold" id="bOpenSkip">⏭️ Pick teams!</button>
  </div>
</div>
<!-- 🏳️ pick teams -->
<div id="teams" class="screen">
  <div class="bar"><h1 class="big">🏳️ PICK YOUR TEAMS!</h1></div>
  <div id="teamWrap">
    <div id="teamGrid"></div>
    <div id="teamSide">
      <h2 id="tsTitle"></h2>
      <div id="tsHelp" class="roster"></div>
      <div class="names" id="nameBtns"></div>
      <div class="roster" id="rosterAll"></div>
      <div class="two">
        <button class="btn b-pink" id="bTeamsBack">⬅️ Back</button>
        <button class="btn b-go" id="bTeamsGo">✅ Let's go!</button>
      </div>
    </div>
  </div>
</div>
<!-- 🏟️ the events hub -->

const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
