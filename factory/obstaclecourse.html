<script>

  { id: 'clap',    e: '👏', n: 'Clap Attack',     t: 'Clap 10 times as fast as you can' },
  { id: 'roll',    e: '🌀', n: 'Log Roll',        t: 'Roll on the carpet like a log 2 times' },
  { id: 'penguin', e: '🐧', n: 'Penguin Waddle',  t: 'Waddle like a penguin 6 steps' },
  { id: 'spoon',   e: '🥄', n: 'Spoon Carry',     t: 'Carry a sock on a spoon to the couch' },
  { id: 'pinch',   e: '🦞', n: 'Pinch Pinch',     t: 'Make crab claws and pinch the air 10 times like Captain Pinch' },
  { id: 'gooblob', e: '🟢', n: 'Goo Melt',        t: 'Melt into a puddle of goo on the floor, then pop back up!' },
  { id: 'kangaroo',e: '🦘', n: 'Kangaroo Hops',   t: 'Do 5 kangaroo hops with your feet together' },
  { id: 'touchtoes',e:'🙆', n: 'Toe Touch',       t: 'Touch your toes 5 times' },
  { id: 'pillowjump',e:'☁️', n: 'Pillow Puddles', t: 'Put 3 pillows on the floor and step from pillow to pillow' },
  { id: 'animal',  e: '🐒', n: 'Monkey Noises',   t: 'Do 3 silly monkey noises and scratch your head' },
  { id: 'lava',    e: '🌋', n: 'Floor Is Lava',   t: 'The floor is lava! Freeze on one foot and count to 5' },
  { id: 'shape',   e: '🔺', n: 'Shape Hunt',      t: 'Find something shaped like a circle and touch it' },
  { id: 'book',    e: '📚', n: 'Book Balance',    t: 'Balance a soft book on your head for 5 steps' },
  { id: 'hug',     e: '🤗', n: 'Hug Station',     t: 'Give a stuffed animal a big hug and say "you can do it!"' },
  { id: 'starfish',e: '🏖️', n: 'Starfish Jump',   t: 'Jump into a big starfish shape 3 times' },
  { id: 'woofbark',e: '🐶', n: 'Woof Run',        t: 'Crawl on hands and knees and bark 3 times like Captain Woof' }
];
var CHEERS = ['Go Ben go!', 'Super speed!', 'You rock!', 'Zoom zoom!', 'Beep boop, awesome!', 'Keep going!', 'Turbo mode!', 'Wow, so fast!', 'Robo is proud!', 'You can do it!'];
var PLAYERS = ['Ben', 'Mom', 'Dad', 'Brother', 'Grandma', 'Grandpa', 'Friend'];
var PLAYER_EMOJI = { Ben: '🦖', Mom: '🌸', Dad: '🧔', Brother: '⚡', Grandma: '👵', Grandpa: '👴', Friend: '🤝' };
var NAME_START = ['The Goo', 'The Wobbly', 'The Turbo', 'The Silly', 'The Mega', 'The Sneaky', 'The Bouncy', 'The Robo', 'The Zombie', 'The Super'];
var NAME_HERO = ["Sammy's Sneaky", "King Gloop's Gooey", "Robo's Turbo", "Captain Woof's Heroic", "Chaos Nova's Spinny", "Captain Pinch's Crabby"];
var NAME_END = ['Gauntlet', 'Run', 'Dash', 'Challenge', 'Adventure', 'Zoom', 'Scramble', 'Quest', 'Race', 'Mission'];
var MIN_ST = 3, MAX_ST = 10, MAX_SAVED = 10;

function byId(id) { for (var i = 0; i < CHALLENGES.length; i++) if (CHALLENGES[i].id === id) return CHALLENGES[i]; return null; }
function fmt(ms) {
  ms = Math.max(0, Math.round(ms));
  var t = Math.floor(ms / 100), m = Math.floor(t / 600), s = Math.floor(t / 10) % 60, d = t % 10;
  return m + ':' + (s < 10 ? '0' : '') + s + '.' + d;
}
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }

// ===== SAVE =====
var SAVE = { courses: [], player: 'Ben', music: true };
function loadSave() {
  try { var s = JSON.parse(localStorage.getItem('obstacleCourse') || 'null');
    if (s && typeof s === 'object') { SAVE.courses = Array.isArray(s.courses) ? s.courses : []; SAVE.player = s.player || 'Ben'; SAVE.music = s.music !== false; }
  } catch (_) {}
}
function writeSave() { try { localStorage.setItem('obstacleCourse', JSON.stringify(SAVE)); } catch (_) {} }
function courseKey(ids) { return ids.join(','); }
function findSaved(ids) { var k = courseKey(ids); for (var i = 0; i < SAVE.courses.length; i++) if (courseKey(SAVE.courses[i].ids) === k) return SAVE.courses[i]; return null; }
function makeName(ids) {
  var used = {}; SAVE.courses.forEach(function (c) { used[c.name] = 1; });
  for (var tries = 0; tries < 60; tries++) {
    var start = Math.random() < 0.5 ? NAME_START[Math.floor(Math.random() * NAME_START.length)] : NAME_HERO[Math.floor(Math.random() * NAME_HERO.length)];
    var nm = start + ' ' + NAME_END[Math.floor(Math.random() * NAME_END.length)];
    if (!used[nm]) return nm;
  }
  return 'Course #' + (SAVE.courses.length + 1);
}
// Saves the course (if new). If 10 are saved, the oldest-played one makes room.
function saveCourse(ids) {
  var c = findSaved(ids); if (c) return c;
  if (SAVE.courses.length >= MAX_SAVED) {
    var oldest = 0; SAVE.courses.forEach(function (x, i) { if ((x.played || 0) < (SAVE.courses[oldest].played || 0)) oldest = i; });
    SAVE.courses.splice(oldest, 1);
  }
  c = { name: makeName(ids), ids: ids.slice(), best: null, bestBy: null, records: {}, played: Date.now() };
  SAVE.courses.push(c); writeSave(); return c;
}
// Records a time for a player. Returns { personal, course } = was it a new record?
function recordTime(c, player, ms) {
  var r = { personal: false, course: false };
  if (!c.records) c.records = {};
  if (c.records[player] == null || ms < c.records[player]) { c.records[player] = ms; r.personal = true; }
  if (c.best == null || ms < c.best) { c.best = ms; c.bestBy = player; r.course = true; }
  c.played = Date.now(); writeSave(); return r;
}
function leaderboard(c) {
  var list = []; for (var p in (c.records || {})) list.push({ p: p, t: c.records[p] });
  list.sort(function (a, b) { return a.t - b.t; }); return list;
}

// ===== BUILDING A COURSE =====
var count = 5, current = [], run = null, screen = 'build', boardFrom = 'build', boardCourse = null, timers = [];
var clock = function () { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); };
function $(id) { return document.getElementById(id); }
function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(function (t) { clearTimeout(t); }); timers = []; }

function randomCourse(n) {
  var ids = CHALLENGES.map(function (c) { return c.id; });
  for (var i = ids.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp; }
  return ids.slice(0, Math.max(MIN_ST, Math.min(MAX_ST, n)));
}
function rollCourse() { current = randomCourse(count); blip(660); say('Here is your course!'); renderBuild(); }
function clearCourse() { current = []; renderBuild(); }
