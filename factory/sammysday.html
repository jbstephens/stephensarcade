<!-- injected by scripts/inject-factory.py (HEAD, before touchpad.js) — hide phantom

     are kept (filtered slots read null), exactly like lib/controller.js. -->

(function () {
  var nav = window.navigator;
  if (!nav || typeof nav.getGamepads !== 'function' || nav.__gfPadFilter) return;
  var orig = nav.getGamepads;
  var PHANTOM = /motion sensors|touchpad/i;
  var out = [];                       // reused every call: no per-frame allocation
  function filtered() {
    var src = orig.call(nav);
    if (!src) return src;
    var n = src.length, anyStd = false, i, p;
    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }
    out.length = n;
    for (i = 0; i < n; i++) {
      p = src[i];
      out[i] = (!p || PHANTOM.test(p.id || '') || (anyStd && p.mapping !== 'standard')) ? null : p;
    }
    return out;
  }
  try { nav.getGamepads = filtered; } catch (e) {}
  if (nav.getGamepads !== filtered) {
    try { Object.defineProperty(nav, 'getGamepads', { value: filtered, configurable: true, writable: true }); } catch (e) {}
  }
  try { nav.__gfPadFilter = true; } catch (e) {}
})();

<canvas id="game" width="960" height="520"></canvas>
<script>
// 🐱 SAMMY'S DAY
// Take care of Sammy, Ben's real brown tabby cat! Feed him, play with him, pet him, brush him,
// give him a (very dramatic) bath, tuck him in for a nap, and let him out for some "Sweet freedom!".
// His 4 need meters follow the real clock (gently, and never below 20%). Happy points unlock silly tricks,
// coins buy collars, bandanas, a bow tie, a tiny crown and cozy blankets. Sammy writes a funny diary.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const FLOOR = 20;                                     // meters never go below 20%: Sammy is never sad for long
const NEEDS = ['food', 'fun', 'clean', 'sleep'];
const NEED_INFO = {
  food:  { icon: '🍗', name: 'Hungry', col: '#ff8a65', room: 1, want: 'Food please!' },
  fun:   { icon: '😺', name: 'Fun',    col: '#ffd54f', room: 0, want: 'Play with me!' },
  clean: { icon: '🧼', name: 'Clean',  col: '#4fc3f7', room: 2, want: 'Brush me?' },
  sleep: { icon: '💤', name: 'Sleepy', col: '#b39ddb', room: 4, want: 'Nap time...' },
};
const DECAY_PLAY = { food: 0.06, fun: 0.07, clean: 0.03, sleep: 0.04 };   // per second while you play
const DECAY_AWAY = { food: 5, fun: 4, clean: 2, sleep: 3 };               // per HOUR while you're away (gentle)
const AWAY_CAP_H = 24;                                                    // never count more than a day away
const FULL_HOLD = 60;                                                     // a meter stays at 100% for 60 s after you fill it

// ---------- Saves, coins, trophies, stickers ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book
function bankCoin(n = 1) { try { const c = JSON.parse(localStorage.getItem('gfCoins') || '{}'); c.sammysday = (c.sammysday || 0) + n; localStorage.setItem('gfCoins', JSON.stringify(c)); } catch (_) {} }   // coins for the Bundle Room in the Game Factory book

const nowMs = () => (typeof TEST_NOW === 'number' ? TEST_NOW : Date.now());
const fresh = () => ({ m: { food: 70, fun: 70, clean: 80, sleep: 75 }, full: { food: 0, fun: 0, clean: 0, sleep: 0 }, last: nowMs(),
  coins: 10, hp: 0, owned: {}, wear: { neck: '', head: '', bed: 'bed-blue' }, tricks: {}, diary: [], diaryKeys: {}, tufts: 0,
  music: true, happyDone: false, days: 0, lastDay: '' });
let save = fresh(), awayMsg = null;
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('sammysDay') || 'null'); if (s && typeof s === 'object') save = Object.assign(fresh(), s); } catch (_) {}
  const f = fresh();
  save.m = Object.assign({}, f.m, save.m || {}); save.full = Object.assign({}, f.full, save.full || {});
  for (const k of NEEDS) { save.m[k] = Math.max(FLOOR, Math.min(100, num(save.m[k], f.m[k]))); save.full[k] = Math.max(0, num(save.full[k], 0)); }
  save.coins = Math.max(0, Math.floor(num(save.coins, 10))); save.hp = Math.max(0, num(save.hp, 0)); save.tufts = Math.max(0, Math.floor(num(save.tufts, 0)));
  save.owned = save.owned || {}; save.wear = Object.assign({}, f.wear, save.wear || {}); save.tricks = save.tricks || {};
  save.diary = Array.isArray(save.diary) ? save.diary : []; save.diaryKeys = save.diaryKeys || {};
  save.last = num(save.last, nowMs());
}
function writeSave() { save.last = nowMs(); try { localStorage.setItem('sammysDay', JSON.stringify(save)); } catch (_) {} }
// ⏰ real time: the meters go down gently while you're away (capped, never below 20%)
function applyAway() {
  const hrs = Math.max(0, Math.min(AWAY_CAP_H, (nowMs() - save.last) / 3600000));
  if (!isFinite(hrs)) return 0;
  for (const k of NEEDS) {
    const hold = Math.min(hrs * 3600, save.full[k]); save.full[k] = Math.max(0, save.full[k] - hrs * 3600);
    const h = hrs - hold / 3600;
    save.m[k] = Math.max(FLOOR, Math.min(100, save.m[k] - DECAY_AWAY[k] * h));
  }
  save.last = nowMs();
  return hrs;
}
loadSave();
{ const hrs = applyAway(); if (hrs > 1) awayMsg = { t: 260, txt: hrs > 8 ? 'Sammy missed you SO much! 💕' : 'Sammy missed you! 💕' }; }

// ---------- Day and night (the real clock) ----------
const hourNow = () => (typeof TEST_HOUR === 'number' ? TEST_HOUR : new Date().getHours() + new Date().getMinutes() / 60);
const isNight = () => { const h = hourNow(); return h >= 20 || h < 6.5; };
const isEvening = () => { const h = hourNow(); return h >= 17 && h < 23; };
function darkness() {                                // 0 = bright day, 1 = deep night
  const h = hourNow();
  if (h >= 7.5 && h < 17.5) return 0;
  if (h >= 17.5 && h < 20.5) return (h - 17.5) / 3;
  if (h >= 6 && h < 7.5) return 1 - (h - 6) / 1.5;
  return 1;
}
const todayKey = () => { const d = new Date(nowMs()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const dayName = () => ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date(nowMs()).getDay()];

// ---------- Sammy's Diary ----------
const DIARY = {
  newday: ['Today I knocked a pencil off the desk. It was AMAZING.', 'I sat in a box that was too small. I fit anyway.',
           'I stared at a wall for ten minutes. The wall knows what it did.', 'I sat on Ben\'s homework. Now it is MY homework.',
           'A bird looked at me through the window. We are enemies now.', 'I slept in a sunbeam. Then the sunbeam moved. Rude.'],
  feed: 'I ate fish. It was the best fish of my whole life. Again.',
  picky: 'Ben offered me food. I said no. I am a cat of mystery.',
  feather: 'I caught the feather SIX times. The feather has learned its lesson.',
  laser: 'The red dot escaped AGAIN. One day, red dot. One day.',
  yarn: 'I batted the yarn ball all over the house. It lives under the couch now.',
  pet: 'Ben petted me. I purred like a tiny motorcycle.',
  belly: 'Someone touched my belly. I did a tiny swat. Fair is fair.',
  brush: 'I got brushed. I left fluff everywhere. You\'re welcome.',
  bath: 'BATH. I do not want to talk about it. I am now very floofy.',
  escape: 'I escaped the bath like a ninja. Sweet freedom!',
  nap: 'I napped for a very long time. Then I napped again.',
  outside: 'I went outside. Sweet freedom! I sniffed a leaf. It smelled like leaf.',
  garage: 'I hid in the garage. Ben found me. He is a very good finder.',
  cup: 'Today I knocked a cup off the table. It was AMAZING.',
  zoomies: 'I did zoomies all over the house. Everyone loved it. Probably.',
  robo: 'Robo came over. He has no fur at all. Weird, but nice.',
  shop: 'I got something new to wear. I look extremely fancy.',
  happy: 'Today I was 100% happy. I purred so loud the couch shook.',
  trick: 'I did a trick and Ben clapped. I am basically a superstar.',
};
function diaryAdd(key, txt) {
  const tk = todayKey() + ':' + key;
  if (save.diaryKeys[tk]) return false;
  save.diaryKeys[tk] = 1;
  save.diary.push({ d: dayName(), day: todayKey(), t: txt || (Array.isArray(DIARY[key]) ? pick(DIARY[key]) : DIARY[key]) });
  if (save.diary.length > 60) save.diary.splice(0, save.diary.length - 60);
  const ks = Object.keys(save.diaryKeys); if (ks.length > 200) for (const k of ks.slice(0, ks.length - 200)) delete save.diaryKeys[k];
  diaryNew = 180;
  return true;
}
let diaryNew = 0;

// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
// 🐱 a "meow": a buzzy voice through a vowel filter, pitch goes up then down
function meow(pitch = 1, len = 0.45, vol = 0.14) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), bp = actx.createBiquadFilter(), g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(520 * pitch, t); o.frequency.linearRampToValueAtTime(820 * pitch, t + len * 0.35); o.frequency.linearRampToValueAtTime(480 * pitch, t + len);
  bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.setValueAtTime(900, t); bp.frequency.linearRampToValueAtTime(1800, t + len * 0.4); bp.frequency.linearRampToValueAtTime(1000, t + len);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.04); g.gain.setValueAtTime(vol, t + len * 0.7); g.gain.linearRampToValueAtTime(0, t + len);
  o.connect(bp); bp.connect(g); g.connect(sfxBus || actx.destination); o.start(t); o.stop(t + len + 0.05);
}
// 😻 a "purr": a low rumble that pulses
function purr(len = 2) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), lp = actx.createBiquadFilter(), g = actx.createGain(), am = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
  o.type = 'sawtooth'; o.frequency.value = 26; lp.type = 'lowpass'; lp.frequency.value = 380;
  lfo.type = 'sine'; lfo.frequency.value = 1.6; lg.gain.value = 0.5; am.gain.value = 0.5;
  lfo.connect(lg); lg.connect(am.gain);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35, t + 0.3); g.gain.setValueAtTime(0.35, t + len - 0.4); g.gain.linearRampToValueAtTime(0, t + len);
  o.connect(lp); lp.connect(am); am.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); lfo.start(t); o.stop(t + len + 0.05); lfo.stop(t + len + 0.05);
}
function whoosh() {
  if (!actx || !noiseBuf) return;
  const t = actx.currentTime, s = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(2600, t + 0.12); bp.frequency.exponentialRampToValueAtTime(600, t + 0.28);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.4, t + 0.06); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  s.connect(bp); bp.connect(g); g.connect(sfxBus || actx.destination); s.start(t); s.stop(t + 0.35);
}
function rustle() {
  if (!actx || !noiseBuf) return;
  const t = actx.currentTime;
  for (let i = 0; i < 3; i++) {
    const s = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain(), tt = t + i * 0.07;
    s.buffer = noiseBuf; bp.type = 'highpass'; bp.frequency.value = 2500 + Math.random() * 2000;
    g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(0.09, tt + 0.01); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.08);
    s.connect(bp); bp.connect(g); g.connect(sfxBus || actx.destination); s.start(tt); s.stop(tt + 0.1);
  }
}

// ---------- MUSIC ENGINE ----------
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) { nextT = 0; }
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;

function decayTick(dt) {
  const night = isNight();
  for (const k of NEEDS) {
    if (mode === 'nap' && k === 'sleep') continue;
    if (save.full[k] > 0) { save.full[k] = Math.max(0, save.full[k] - dt); continue; }
