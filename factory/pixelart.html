// a template as 16 x 16 palette numbers
function tplCells(t) { const out = []; t.rows.forEach(r => r.split('').forEach(ch => out.push(ch === '.' ? 0 : LETTER[ch]))); return out; }
// fit a 16 x 16 template onto an N x N grid: grow it by whole steps (crisp pixels) and center it
function fitTo(c16, N) {
  const k = Math.max(1, Math.floor(N / 16)), off = Math.floor((N - 16 * k) / 2), out = new Array(N * N).fill(0);
  for (let r = 0; r < 16 * k; r++) for (let c = 0; c < 16 * k; c++) out[(r + off) * N + c + off] = c16[Math.floor(r / k) * 16 + Math.floor(c / k)];
  return out;
}
// outline-only: black lines where color patches meet (one line, not two), black details (eyes, mouths) stay
function outlineOf(cells, N) {
  const cnt = {}, filled = cells.filter(v => v).length; cells.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; });
  const darkC = v => (v === BLACK || v === 23) && cnt[v] <= filled * .2;      // small dark bits = details (a big black body still gets lines)
  const at = (r, c) => (r < 0 || c < 0 || r >= N || c >= N) ? 0 : cells[r * N + c];
  return cells.map((v, i) => { if (!v) return 0; if (darkC(v)) return BLACK; const r = Math.floor(i / N), c = i % N;
    return [at(r - 1, c), at(r + 1, c), at(r, c - 1), at(r, c + 1)].some(u => u !== v && (u === 0 || (u > v && !darkC(u)))) ? BLACK : 0; });
}
// resize a drawing to a new grid size (nearest pixel)
function rescale(cells, from, to) {
  const out = new Array(to * to).fill(0);
  for (let r = 0; r < to; r++) for (let c = 0; c < to; c++) out[r * to + c] = cells[Math.floor(r * from / to) * from + Math.floor(c * from / to)];
  return out;
}
