<canvas id="game" width="960" height="520"></canvas>
<script>
// ===== SNOW FACTORY! Catch snow, build from blueprints, then a silly snowball fight vs the Snow-Bots =====
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }   // for the Trophy Room in the Game Factory book
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 90; } } catch (_) {} }   // for the Sticker Book
let stickerNew = 0;

// ---------- Saved progress ----------
let unlocked = 1, everWon = false;
try { const s = JSON.parse(localStorage.getItem('snowFactory') || '{}') || {}; unlocked = Math.max(1, Math.min(4, s.unlocked || 1)); everWon = !!s.won; } catch (_) {}
function saveProgress(won) {
  try {
    const s = JSON.parse(localStorage.getItem('snowFactory') || '{}') || {};
    s.unlocked = Math.max(s.unlocked || 1, unlocked); if (won) s.won = true;
    localStorage.setItem('snowFactory', JSON.stringify(s));
  } catch (_) {}
}

const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, GROUND = 450;
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Levels ----------
// bp = which blueprint you build.  team = who you have a snowball fight with (hats = how many hats to knock off)
const LEVELS = [
  { name: 'Snowman Morning', bp: 'snowman', sky: ['#4fc3f7', '#e1f5fe'], wind: 75, hide: [130, 240],
    story: 'Build a SNOWMAN, then beat the Snow-Bots!',
    team: [{ k: 'bot', x: 640, hats: 2, col: '#e53935' }, { k: 'bot', x: 840, hats: 2, col: '#43a047' }] },
  { name: 'Fort Afternoon', bp: 'fort', sky: ['#29b6f6', '#fff3e0'], wind: 65, hide: [110, 220],
    story: 'Build a strong SNOW FORT, then beat 3 Snow-Bots!',
    team: [{ k: 'bot', x: 590, hats: 2, col: '#1e88e5' }, { k: 'bot', x: 730, hats: 2, col: '#fdd835' }, { k: 'bot', x: 870, hats: 2, col: '#8e24aa' }] },
  { name: 'Snowy Sunset', bp: 'ammo', sky: ['#ff8a65', '#ffe0b2'], wind: 60, hide: [110, 200],
    story: 'Make a BIG pile of snowballs! Sparks and Pages want to play!',
    team: [{ k: 'sparks', x: 600, hats: 3, col: '#00acc1' }, { k: 'pages', x: 740, hats: 3, col: '#ec407a' }, { k: 'bot', x: 880, hats: 2, col: '#ff7043' }] },
  { name: 'King of Snow', bp: 'royal', sky: ['#1a237e', '#7986cb'], wind: 60, hide: [120, 210], night: true,
    story: 'The KING OF SNOW wants a BIG fight! Build a royal fort!',
    team: [{ k: 'bot', x: 590, hats: 2, col: '#00897b' }, { k: 'king', x: 810, hats: 6, col: '#ffd600' }] },
];
// Blueprint parts: ball = catch snow then roll it big, block = pack a fort block, ammo = squish a snowball, item = catch it from the machine
const BLUEPRINTS = {
  snowman: { name: 'SNOWMAN', parts: [{ t: 'ball', r: 46 }, { t: 'ball', r: 35 }, { t: 'ball', r: 26 }, { t: 'item', item: 'carrot' }, { t: 'item', item: 'hat' }] },
  fort:    { name: 'SNOW FORT WALL', parts: [0, 1, 2, 3, 4, 5].map(() => ({ t: 'block' })) },
  ammo:    { name: 'SNOWBALL PILE', parts: [0, 1, 2, 3, 4, 5, 6, 7].map(() => ({ t: 'ammo' })) },
  royal:   { name: 'ROYAL FORT', parts: [{ t: 'block' }, { t: 'block' }, { t: 'block' }, { t: 'block' }, { t: 'ammo' }, { t: 'ammo' }, { t: 'ammo' }, { t: 'item', item: 'flag' }] },
};
const NEED = { ball: 5, block: 4, ammo: 2 }, ROLLS = { ball: 6, block: 3, ammo: 2 };

// ---------- Sound ----------
let actx = null;
function wakeAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  catch:  () => note(1200 + Math.random() * 300, 0, 0.1, 'sine', 0.08, 1800),
  gold:   () => [988, 1319, 1568].forEach((f, i) => note(f, i * 0.06, 0.12, 'triangle', 0.1)),
  roll:   () => note(140 + Math.random() * 40, 0, 0.12, 'triangle', 0.15, 90),
  place:  () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.07, 0.15, 'triangle', 0.12)),
  throw:  () => note(500, 0, 0.12, 'sine', 0.08, 260),
  splat:  () => note(220, 0, 0.12, 'sawtooth', 0.06, 80),
  hat:    () => { note(700, 0, 0.1, 'square', 0.08, 1400); note(1400, 0.1, 0.15, 'square', 0.06, 900); },
  brrr:   () => { for (let i = 0; i < 6; i++) note(300 + (i % 2) * 40, i * 0.05, 0.05, 'square', 0.05); },
  chip:   () => note(160, 0, 0.1, 'triangle', 0.15, 70),
  warn:   () => { note(880, 0, 0.08, 'square', 0.06); note(880, 0.12, 0.08, 'square', 0.06); },
  big:    () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.2, 0.25, 'sawtooth', 0.1)),
  pop:    () => { note(900, 0, 0.08, 'sine', 0.1, 300); note(600, 0.06, 0.1, 'sine', 0.08, 1200); },
  out:    () => [784, 659, 523].forEach((f, i) => note(f, i * 0.1, 0.14, 'triangle', 0.1)),
  win:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.09)),
  click:  () => note(660, 0, 0.06, 'square', 0.06),
  no:     () => note(200, 0, 0.2, 'square', 0.06, 120),
};

// ---------- Music: original cozy "Snow Factory" tune (eighth notes, 0 = rest) ----------
let musicOn = true, nextNoteTime = 0, step = 0;
const MUSIC_BPM = 132;
const MELODY = [
  72,0,76,0, 79,0,76,74, 72,0,74,76, 74,0,0,0,   71,0,74,0, 77,0,76,74, 72,0,71,72, 74,0,0,0,
  72,0,76,0, 79,0,81,79, 77,0,76,74, 76,0,72,0,  69,0,71,72, 74,0,76,74, 72,0,0,0, 79,0,84,0,
];
const BASS = [48, 43, 53, 43, 48, 45, 50, 43].flatMap(r => [r, 0, r + 7, 0, r + 12, 0, r + 7, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = state === 'fight';
  const stepDur = 60 / (fight ? 156 : MUSIC_BPM) / 2;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
    if (m) note(midi(m), t, stepDur * 0.9, 'square', 0.035);
    if (b) note(midi(b), t, stepDur * 0.9, 'triangle', 0.09);
    if (step % 4 === 2) note(fight ? 2600 : 2200, t, 0.05, 'sine', 0.012);   // little sleigh-bell tick
    nextNoteTime += stepDur; step++;
  }
}

// ---------- Input ----------
const keys = { left: false, right: false, down: false, hide: false };
let actPressed = false, tapHide = false, dragX = null;
addEventListener('keydown', e => {
  wakeAudio();
  const k = e.key;
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (!keys.left && !e.repeat) leftPress(); keys.left = true; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (!keys.right && !e.repeat) rightPress(); keys.right = true; }
  if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = true;
  if (k === 'h' || k === 'H') keys.hide = true;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.down = keys.hide = false;
  if ((k === ' ' || k === 'Enter') && !e.repeat) actPressed = true;
  if (k === 'm' || k === 'M') musicOn = !musicOn;
  if (state === 'title' && k >= '1' && k <= '4') { if (+k <= unlocked) startLevel(+k - 1); else sfx.no(); }
  if (k === 'Escape' && state !== 'title') goTitle();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
  if (k === 'h' || k === 'H') keys.hide = false;
});
function canvasXY(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
C.addEventListener('mousedown', e => { wakeAudio(); const [x, y] = canvasXY(e); tapAt(x, y); });
C.addEventListener('mousemove', e => { if (e.buttons & 1) { const [x, y] = canvasXY(e); dragAt(x, y); } });
addEventListener('mouseup', () => { tapHide = false; dragX = null; });

// ---------- Game state ----------
let state = 'title', lv = 0, frame = 0, banner = 0, bannerText = '', shake = 0;
let parts = [], puffs = [], bgFlakes = [];
for (let i = 0; i < 70; i++) bgFlakes.push({ x: Math.random() * W, y: Math.random() * H, s: rnd(1.5, 4), v: rnd(0.4, 1.2) });

function goTitle() { state = 'title'; banner = 0; }
function puff(x, y, n = 8, col = '#fff') { for (let i = 0; i < n; i++) puffs.push({ x, y, vx: rnd(-3, 3), vy: rnd(-4, 1), life: rnd(20, 40), col, r: rnd(2, 5) }); }
function say(text, t = 90) { bannerText = text; banner = t; }

// =================== PART 1: BUILD (catch snow, roll it, build the blueprint) ===================
let robo = { x: 300, face: 1, walk: 0 }, bucket = 0, flakes = [], partIdx = 0, bphase = 'catch', rolls = 0, fly = null, doneT = 0, nozX = 340, spawnT = 0, itemT = 0;
let itemsFalling = [];
const SITE_X = 815;
function bp() { return BLUEPRINTS[LEVELS[lv].bp]; }
function partInfo(i) {                     // where each blueprint part goes on the build site
  const kind = LEVELS[lv].bp, p = bp().parts[i];
  if (kind === 'snowman') {
    const ys = [GROUND - 46, GROUND - 119, GROUND - 172];
    if (p.t === 'ball') return { t: 'ball', x: SITE_X, y: ys[i], r: p.r };
    if (p.item === 'carrot') return { t: 'item', item: 'carrot', x: SITE_X + 8, y: GROUND - 170 };
    return { t: 'item', item: 'hat', x: SITE_X, y: GROUND - 196 };
  }
  if (kind === 'fort') return { t: 'block', x: 752 + (i % 3) * 42, y: GROUND - 34 * (Math.floor(i / 3) + 1), w: 40, h: 34 };
  if (kind === 'ammo') {
    const row = i < 4 ? 0 : i < 7 ? 1 : 2, j = i < 4 ? i : i < 7 ? i - 4 : 0, n = [4, 3, 1][row];
    return { t: 'ammo', x: SITE_X + (j - (n - 1) / 2) * 30, y: GROUND - 15 - row * 26, r: 15 };
  }
  // royal fort: 4 blocks, a little snowball pile, and a flag on top
  if (i < 4) return { t: 'block', x: 752 + (i % 2) * 42, y: GROUND - 34 * (Math.floor(i / 2) + 1), w: 40, h: 34 };
  if (i < 7) return { t: 'ammo', x: [870, 900, 885][i - 4], y: GROUND - 15 - (i === 6 ? 26 : 0), r: 15 };
  return { t: 'item', item: 'flag', x: 793, y: GROUND - 68 };
}
function startLevel(i) {
  lv = i; state = 'build'; frame = 0;
  robo = { x: 300, face: 1, walk: 0 }; bucket = 0; flakes = []; itemsFalling = []; partIdx = 0; bphase = 'catch'; rolls = 0; fly = null; doneT = 0;
  puffs = []; spawnT = 30; itemT = 40;
  say('LEVEL ' + (i + 1) + ': ' + LEVELS[i].name.toUpperCase(), 150);
  sfx.place();
}
function curPart() { return bp().parts[partIdx]; }

function updateBuild() {
  const L = LEVELS[lv];
  nozX = 340 + Math.sin(frame * 0.013) * 270;
  // --- move Robo (arrows or drag your finger) ---
  if (bphase !== 'roll') {
    let mv = 0;
    if (keys.left) mv = -1; if (keys.right) mv = 1;
    if (dragX !== null && Math.abs(dragX - robo.x) > 8) mv = Math.sign(dragX - robo.x);
    robo.x = clamp(robo.x + mv * 6.5, 50, 640);
    if (mv) { robo.face = mv; robo.walk++; }
  }
  // --- the snow machine puffs out snowflakes ---
  if (--spawnT <= 0 && bphase !== 'done') {
    spawnT = rnd(18, 30);
    flakes.push({ x: nozX + rnd(-20, 20), y: 128, vy: rnd(1.5, 2.2) + lv * 0.12, wob: rnd(0, 6), gold: Math.random() < 0.08 });
  }
  const p = curPart();
  if (p && p.t === 'item' && bphase === 'catch' && !itemsFalling.length && --itemT <= 0) {
    itemsFalling.push({ item: p.item, x: nozX, y: 128, vy: 1.5 });
    sfx.warn();
  }
  for (const f of flakes) {
    f.y += f.vy; f.x += Math.sin(frame * 0.05 + f.wob) * 0.8;
    if (bphase === 'catch' && Math.abs(f.x - robo.x) < 34 && f.y > GROUND - 116 && f.y < GROUND - 88) {
      f.dead = true;
      if (p && p.t !== 'item') { bucket = Math.min(NEED[p.t], bucket + (f.gold ? 2 : 1)); f.gold ? sfx.gold() : sfx.catch(); puff(f.x, f.y, 4, f.gold ? '#ffe082' : '#fff'); }
      else { sfx.catch(); puff(f.x, f.y, 3, '#e1f5fe'); }
    }
    if (f.y > GROUND) { f.dead = true; puff(f.x, GROUND - 2, 2); }
  }
  flakes = flakes.filter(f => !f.dead);
  for (const it of itemsFalling) {
    it.y += it.vy; it.x += Math.sin(frame * 0.04) * 0.6;
    if (Math.abs(it.x - robo.x) < 40 && it.y > GROUND - 124 && it.y < GROUND - 80) {
      it.dead = true; sfx.gold(); startFly(it.x, it.y);
    } else if (it.y > GROUND) { it.dead = true; puff(it.x, GROUND - 4, 6); itemT = 60; say('Oops! The machine will drop another one!', 80); }
  }
  itemsFalling = itemsFalling.filter(i => !i.dead);
  // --- bucket full? time to roll! ---
  if (bphase === 'catch' && p && p.t !== 'item' && bucket >= NEED[p.t]) { bphase = 'roll'; rolls = 0; actPressed = false; sfx.place(); }
  if (bphase === 'roll' && actPressed) {
    rolls++; sfx.roll(); puff(robo.x + robo.face * 50, GROUND - 4, 4); robo.walk += 6;
    if (rolls >= ROLLS[p.t]) startFly(robo.x + robo.face * 50, GROUND - rollR());
  }
  if (fly) {
    fly.t++;
    if (fly.t >= 40) {
      fly = null; partIdx++; sfx.place(); puff(partInfo(partIdx - 1).x + 10, partInfo(partIdx - 1).y, 10);
      if (p && p.t !== 'item') bucket = 0;
      itemT = 50;
      if (partIdx >= bp().parts.length) { bphase = 'done'; doneT = 150; say('BLUEPRINT DONE! ' + bp().name + '!', 150); sfx.win(); }
      else bphase = 'catch';
    }
  }
  if (bphase === 'done' && --doneT <= 0) startFight();
  actPressed = false;
}
function rollR() {                         // how big the snowball you are rolling is right now
  const p = curPart(); if (!p) return 10;
  const goal = p.t === 'ball' ? p.r : p.t === 'block' ? 20 : 15;
  return 8 + (goal - 8) * Math.min(1, rolls / ROLLS[p.t]);
}
function startFly(x, y) {
  const info = partInfo(partIdx);
  const tx = info.t === 'block' ? info.x + 20 : info.x, ty = info.t === 'block' ? info.y + 17 : info.y;
  fly = { x, y, tx, ty, t: 0, info, r: rollR() }; bphase = 'fly';
}

function drawBuild() {
  const L = LEVELS[lv];
  drawSky(L); drawFactoryBack();
  drawSite();
  // falling snow + items
  for (const f of flakes) drawFlake(f.x, f.y, f.gold ? 9 : 7, f.gold ? '#ffd740' : '#fff', frame * 0.03 + f.wob);
  for (const it of itemsFalling) {
    ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(frame * 0.2); ctx.fillStyle = '#fff59d';
    ctx.beginPath(); ctx.arc(it.x, it.y, 30, 0, 7); ctx.fill(); ctx.restore();
    drawItem(it.item, it.x, it.y, 1.2);
  }
  drawMachine();
  // Robo with his bucket, or rolling a snowball
  const p = curPart();
  if (bphase === 'roll' || (bphase === 'fly' && !fly)) {
    const r = rollR(), bx = robo.x + robo.face * 50;
    drawSnowball(bx, GROUND - r, r, rolls * 0.9, p && p.t === 'block');
    drawRobo(robo.x, GROUND, 1.8, { face: robo.face, walk: robo.walk, push: true });
  } else drawRobo(robo.x, GROUND, 1.8, { face: robo.face, walk: robo.walk, bucket: p && p.t !== 'item' ? bucket / NEED[p.t] : 0 });
  if (fly) {
    const k = fly.t / 40, x = fly.x + (fly.tx - fly.x) * k, y = fly.y + (fly.ty - fly.y) * k - Math.sin(k * Math.PI) * 140;
    if (fly.info.t === 'item') drawItem(fly.info.item, x, y, 1); else drawSnowball(x, y, fly.info.t === 'ball' ? fly.info.r : fly.info.t === 'block' ? 18 : 15, fly.t * 0.3, fly.info.t === 'block');
  }
  // what to do now (big and simple)
  let help = '';
  if (bphase === 'catch' && p) help = p.t === 'item' ? 'Catch the ' + p.item.toUpperCase() + '! It drops from the machine!' : 'Catch ' + NEED[p.t] + ' snowflakes in your bucket!  ⬅ ➡';
  if (bphase === 'roll') help = (p.t === 'ball' ? 'ROLL it BIG!' : p.t === 'block' ? 'PACK the block!' : 'SQUISH a snowball!') + '  Press SPACE / tap!  ' + rolls + '/' + ROLLS[p.t];
  if (help) {
    ctx.fillStyle = 'rgba(13,42,74,.75)'; rr(110, 140, 470, 40, 14);
    txt(help, 345, 168, 20, '#fff');
  }
  if (bphase === 'roll') {                 // big ROLL button for fingers
    const s = 1 + 0.06 * Math.sin(frame * 0.25);
    ctx.save(); ctx.translate(345, 240); ctx.scale(s, s);
    ctx.fillStyle = '#ff7043'; ctx.beginPath(); ctx.arc(0, 0, 44, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke();
    txt(p.t === 'ball' ? 'ROLL!' : p.t === 'block' ? 'PACK!' : 'SQUISH!', 0, 8, p.t === 'ammo' ? 18 : 22, '#fff');
    ctx.restore();
  }
}

// =================== PART 2: SNOWBALL FIGHT ===================
const RX = 150, G_E = 0.25, G_P = 0.3;
let fort = [], foes = [], pBalls = [], eBalls = [], hatsFly = [], texts = [];
let rise = 1, froz = 0, popT = 0, throwCool = 0, aimIdx = 0, tapTarget = null, regenT = 0, winT = 0, fightT = 0, fortMax = 2;
const HAT_SETS = { bot: ['beanie', 'tophat', 'party'], sparks: ['cap', 'beanie', 'party'], pages: ['bow', 'beanie', 'tophat'], king: ['crown', 'beanie', 'tophat', 'party', 'cap', 'pot'] };
function startFight() {
  const L = LEVELS[lv];
  state = 'fight'; fightT = 0; winT = 0; regenT = 0;
  fortMax = (L.bp === 'fort' || L.bp === 'royal') ? 3 : 2;
  fort = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) fort.push({ x: 198 + c * 32, y: GROUND - 30 * (r + 1), w: 32, h: 30, hp: fortMax });

function updateFight() {

function drawFight() {
  const L = LEVELS[lv];
  drawSky(L);
  // your side: cheering snowman / snowball pile / royal flag from the blueprint you built
  if (L.bp === 'snowman') {
    circ(55, GROUND - 30, 30, '#fafdff'); circ(55, GROUND - 78, 22, '#fafdff'); circ(55, GROUND - 115, 16, '#fafdff');

    ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(35, GROUND - 80); ctx.lineTo(18, GROUND - 105 + Math.sin(frame * 0.2) * 8); ctx.moveTo(75, GROUND - 80); ctx.lineTo(92, GROUND - 105 - Math.sin(frame * 0.2) * 8); ctx.stroke();
  }
  if (L.bp === 'ammo' || L.bp === 'royal') {

    for (const [x, r] of pile) drawSnowball(x, GROUND - 11 - r * 19, 11, x, false);
  }
  // Robo pops up and hides behind the fort
  const feet = GROUND - 30 + (1 - rise) * 52;

  ctx.fillStyle = '#f5fbff'; ctx.fillRect(90, GROUND, 130, H - GROUND); ctx.fillStyle = '#d6ecfa'; ctx.fillRect(90, GROUND, 130, 5);
  ctx.fillStyle = '#eaf6ff'; rr(108, GROUND - 30, 84, 34, 8);                    // snow step
  for (const b of fort) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = b.hp >= fortMax ? '#f5fbff' : b.hp === 1 ? '#c5e1f5' : '#ddeefa'; rr(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 6);
    ctx.fillStyle = '#b3d9f2'; ctx.fillRect(b.x + 4, b.y + b.h - 6, b.w - 8, 3);
    if (b.hp < fortMax) { ctx.strokeStyle = '#90caf9'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.x + 8, b.y + 4); ctx.lineTo(b.x + 16, b.y + 14); ctx.lineTo(b.x + 12, b.y + 24); ctx.stroke(); }
  }

  // the other team, then their snow piles in front
  ctx.save(); ctx.beginPath(); ctx.rect(-20, -20, W + 40, GROUND + 20); ctx.clip();   // hiding foes duck down behind the snow
  for (const f of foes) drawFoe(f);

    ctx.fillStyle = '#f5fbff'; ctx.beginPath(); ctx.ellipse(f.x - 15, GROUND, 62, 64, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#d6ecfa'; ctx.beginPath(); ctx.ellipse(f.x - 15, GROUND, 62, 20, 0, Math.PI, 0); ctx.fill();
  }
  // giant snowball warning

  if (kb) {
    ctx.save(); ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 5; ctx.setLineDash([12, 8]); ctx.lineDashOffset = frame;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.3);
    ctx.beginPath(); ctx.arc(RX + 50, GROUND - 60, 75, 0, 7); ctx.stroke(); ctx.restore();
  }
  // snowballs, hats, puffs, words
  for (const b of pBalls) drawSnowball(b.x, b.y, b.r, frame * 0.3, false);
  for (const b of eBalls) drawSnowball(b.x, b.y, b.r, -frame * 0.3, false);
  for (const h of hatsFly) { ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot); drawHat(h.type, 0, 6, h.col); ctx.restore(); }
  // aim target
  const a = aliveFoes();
  if (a.length && winT <= 0) {
    const p = aimPoint(a[aimIdx % a.length]);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(frame * 0.05); ctx.strokeStyle = '#ffea00'; ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.stroke(); ctx.restore();
    txt('▼', p.x, p.y - 44 - (a[aimIdx % a.length].k === 'king' ? 150 : 50) + Math.sin(frame * 0.2) * 4, 22, '#ffea00');
  }
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t / 20); txt(t.s, t.x, t.y, 26, t.col); ctx.globalAlpha = 1; }
  // HUD

  ctx.fillStyle = 'rgba(13,42,74,.6)'; rr(10, 10, 330, 40, 12); txt('Level ' + (lv + 1) + ': ' + L.name, 175, 38, 20, '#fff');
  ctx.fillStyle = 'rgba(13,42,74,.6)'; rr(350, 10, 260, 40, 12); txt('🎩 Hats to knock off: ' + hatsLeft, 480, 38, 20, '#fff59d');
  if (froz > 0) txt('BRRR! Frozen for a second!', 330, 90, 24, '#80d8ff');
  txt('⬅ ➡ pick   SPACE or TAP them = THROW   hold ⬇ / HIDE = hide', W / 2, 500, 17, '#e3f2fd');
}
