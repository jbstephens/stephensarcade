    mel: (r => r + ' ' + r)('A4:0.5 C5:0.5 E5:0.5 A5:0.5 G5:0.5 E5:0.5 C5 F4:0.5 A4:0.5 C5:0.5 F5:0.5 E5:0.5 C5:0.5 A4 C5:0.5 E5:0.5 G5:0.5 C6:0.5 B5:0.5 G5:0.5 E5 D5:0.5 G5:0.5 B5:0.5 D6:0.5 C6 B5 A5 - E5:0.5 A5:0.5 C6 A5 - F5:0.5 A5:0.5 C6 G5:0.5 E5:0.5 G5:0.5 C6:0.5 E6 D6 B5:0.5 G5:0.5 D5:0.5 B4:0.5 G4:2') },
  { id: 'hyperglitch', name: 'Hyper GL1TCH', icon: '👾', level: 4, bpm: 136, speed: 285, wave: 'square', edm: true, glitch: true, lyrics: HYPER_WORDS,
    chords: 'A F C G A F C G A F C G A F C G A',
    mel: (r => r + ' ' + r)('A4:0.5 C5:0.5 E5:0.5 A5:0.5 G5:0.5 E5:0.5 C5 F4:0.5 A4:0.5 C5:0.5 F5:0.5 E5:0.5 C5:0.5 A4 C5:0.5 E5:0.5 G5:0.5 C6:0.5 B5:0.5 G5:0.5 E5 D5:0.5 G5:0.5 B5:0.5 D6:0.5 C6 B5 A5 - E5:0.5 A5:0.5 C6 A5 - F5:0.5 A5:0.5 C6 G5:0.5 E5:0.5 G5:0.5 C6:0.5 E6 D6 B5:0.5 G5:0.5 D5:0.5 B4:0.5 G4:2') },

const CHORD_ROOT = { C: 36, D: 38, E: 40, F: 41, G: 43, A: 45, B: 47 };
function midi(n) { const m = /^([A-G])(#|b)?(\d)$/.exec(n); return 12 * (+m[3] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); }

const LEAD_IN = 4;   // beats of drums before the first note
// turn a song into notes: { t: seconds, lane, m: midi note }

  let b = LEAD_IN;
  for (const tok of song.mel.trim().split(/\s+/)) {
    const [n, len] = tok.split(':'); const beats = len ? +len : 1;
    if (n !== '-') {

// ---------- Sound ----------
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } if (actx && actx.state !== 'running') actx.resume(); }

  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(at);

const hat = at => noise(at, 0.04, 0.08, 7000);
const sfx = {
  click: () => { if (actx) tone(700, actx.currentTime, 0.06, 'square', 0.08); },
  miss: () => { if (actx) tone(110, actx.currentTime, 0.12, 'sawtooth', 0.05, 80); },
  cheer: () => { if (actx) { noise(actx.currentTime, 1.2, 0.12, 900); [523, 659, 784, 1047].forEach((f, i) => tone(f, actx.currentTime + i * 0.1, 0.3, 'square', 0.07)); } },
};

// ---------- Save ----------
let SAVE = { best: {}, mine: [] };   // best: { songId: { stars, score } }, mine: your own songs from the Song Maker
try { const s = JSON.parse(localStorage.getItem('beatParty') || 'null'); if (s) SAVE = Object.assign(SAVE, s); } catch (_) {}
function save() { try { localStorage.setItem('beatParty', JSON.stringify(SAVE)); } catch (_) {} }

// ---------- Game state ----------
const LANES = 4, LANE_W = 104, LX = W / 2 - LANES * LANE_W / 2, HIT_Y = 430;
const LANE_COL = ['#ff4f6d', '#3fa9ff', '#ffd23f', '#4cd97b'];
const KEYS = [['d', 'arrowleft', '1'], ['f', 'arrowdown', '2'], ['j', 'arrowup', '3'], ['k', 'arrowright', '4']];
const JUDGE = [[0.07, 'PERFECT!', 100, '#ffe066'], [0.12, 'GREAT!', 70, '#7cf3ff'], [0.18, 'OK', 40, '#c6b3ff']];
let scene = 'title', frame = 0, song = null, notes = [], endT = 0, beatLen = 0.5, t0 = 0, clock = null;
let score = 0, combo = 0, bestCombo = 0, hype = 0.5, counts = { PERFECT: 0, GREAT: 0, OK: 0, MISS: 0 }, pops = [], laneFlash = [0, 0, 0, 0];
let saidLine = -1, glitchT = 0, nextEvent = 0, events = [], particles = [], result = null, sel = 0, mouse = { x: 0, y: 0 }, lastTouch = 0;
// song time in seconds: the audio clock when there is sound (so notes match the music exactly), else a normal clock
function now() { return clock !== null ? clock : actx ? actx.currentTime - t0 : performance.now() / 1000 - t0; }

function startSong(i) { sel = i; playSong(SONGS[i]); }
function playSong(theSong) {
  audio();
  song = theSong; saidLine = -1;
  if (song.lyrics) voiceWake();
  const c = chart(song); notes = c.notes.map(n => ({ ...n, hit: false, missed: false })); endT = c.endT; beatLen = c.beat;
  // the backing band: drums + bass, planned ahead and played on the audio clock
  events = [];
  const bars = Math.ceil(endT / (beatLen * 4)), roots = song.chords.split(' ');
  for (let bar = 0; bar < bars; bar++) for (let k = 0; k < 8; k++) {
    const t = (bar * 4 + k / 2) * beatLen; if (t > endT - 2) break;
    const onBeat = k % 2 === 0, beatN = k / 2;
    if (onBeat && (beatN === 0 || beatN === 2 || song.level >= 3)) events.push({ t, f: kick });
    if (onBeat && (beatN === 1 || beatN === 3) && bar >= 1) events.push({ t, f: snare });
    events.push({ t, f: hat });
    const root = CHORD_ROOT[roots[Math.max(0, bar - 1) % roots.length]] || 36;   // bar 0 is the drum count-in
    if (song.edm) { if (bar >= 1 && !onBeat) events.push({ t, f: at => tone(hz(root), at, beatLen * 0.4, 'sawtooth', 0.09) }); }
    else if (bar >= 1 && onBeat) { const m = root + (beatN === 2 ? 7 : 0); events.push({ t, f: at => tone(hz(m), at, beatLen * 0.9, 'triangle', 0.18) }); }
  }
  events.sort((a, b) => a.t - b.t); nextEvent = 0;
  score = 0; combo = 0; bestCombo = 0; hype = 0.5; counts = { PERFECT: 0, GREAT: 0, OK: 0, MISS: 0 }; pops = []; particles = [];
  t0 = actx ? actx.currentTime + 0.3 : performance.now() / 1000 + 0.3;
  scene = 'play'; sfx.click();
}
function hitLane(l) {
  if (scene !== 'play') return;
  laneFlash[l] = 10;
  const t = now();
  let best = null;
  for (const n of notes) if (!n.hit && !n.missed && n.lane === l && Math.abs(n.t - t) < JUDGE[2][0] && (!best || Math.abs(n.t - t) < Math.abs(best.t - t))) best = n;
  if (!best) return;   // tapping with no note is fine: no penalty
  const dt = Math.abs(best.t - t), j = JUDGE.find(j => dt < j[0]);
  best.hit = true; combo++; bestCombo = Math.max(bestCombo, combo);
  const mult = Math.min(3, 1 + Math.floor(combo / 10) * 0.5);
  score += Math.round(j[2] * mult); counts[j[1].replace('!', '')]++;
  hype = Math.min(1, hype + 0.03);
  // YOU play the melody note!
  if (actx) {
    const g = song.glitch && Math.random() < 0.3 ? 12 : 0;
    tone(hz(best.m + g), actx.currentTime, Math.min(0.6, best.len * 0.9), song.wave, song.edm ? 0.07 : 0.09);
    if (song.glitch && Math.random() < 0.25) tone(hz(best.m + 7), actx.currentTime + 0.06, 0.06, 'square', 0.05);   // little glitch blip
  }
  if (song.glitch && Math.random() < 0.3) glitchT = 8;
  pops.push({ text: j[1], col: j[3], x: LX + l * LANE_W + LANE_W / 2, y: HIT_Y - 50, life: 40 });
  for (let i = 0; i < 10; i++) { const a = Math.random() * 6.28, s = 2 + Math.random() * 4; particles.push({ x: LX + l * LANE_W + LANE_W / 2, y: HIT_Y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 30, c: LANE_COL[l] }); }
}
function finishSong() {
  const total = notes.length * 100, got = counts.PERFECT * 100 + counts.GREAT * 70 + counts.OK * 40, acc = got / total;
  const stars = acc >= 0.85 ? 3 : acc >= 0.6 ? 2 : 1;   // you always get at least 1 star for finishing!
  const old = SAVE.best[song.id] || { stars: 0, score: 0 };
  const newBest = score > old.score;
  SAVE.best[song.id] = { stars: Math.max(old.stars, stars), score: Math.max(old.score, score) }; save();
  result = { stars, acc, newBest, t: 0 };

// ---------- Song Maker: tap boxes to make your own song! ----------
const MK_NOTES = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];        // bottom row to top row
const MK_COL = ['#ff4f6d', '#ff8c42', '#ffd23f', '#4cd97b', '#3fd0c9', '#3fa9ff', '#7c4dff', '#ff6ec7'];

const MK_A = ['Super', 'Funky', 'Sparkly', 'Crazy', 'Happy', 'Spooky', 'Turbo', 'Jumpy', 'Cosmic', 'Silly'];
const MK_B = ['Dino', 'Robot', 'Zombie', 'Kitty', 'Puppy', 'Pizza', 'Rocket', 'Monster', 'Ninja', 'Alien'];

let mk = null, mkSlot = 0, mkPaint = null, mkListen = null;

// turn one of your songs into a song the game can play
function mineToSong(m, slot) {

  const chords = [];
  for (let bar = 0; bar < MK_STEPS / 4; bar++) {
    const ns = m.steps.slice(bar * 4, bar * 4 + 4).filter(i => i >= 0).map(i => MK_NOTES[i][0]);
    const fit = ch => ns.filter(n => ({ C: 'CEG', F: 'FAC', G: 'GBD', A: 'ACE' })[ch].includes(n)).length;

  if (mkPaint === 'erase') { if (mk.steps[c] === r) mk.steps[c] = -1; }
  else if (mk.steps[c] !== r) { mk.steps[c] = r; if (actx) tone(hz(midi(MK_NOTES[r])), actx.currentTime, 0.25, MK_SOUNDS[mk.sound][1], 0.08); }
}
function mkToggleListen() {
  audio();

}
function mkUpdate() {
  if (!mkListen) return;
  const beat = 60 / MK_SPEEDS[mk.speed][1], t = (actx ? actx.currentTime : performance.now() / 1000) - mkListen.start, step = Math.floor(t / beat);
  if (step >= MK_STEPS) { mkListen = null; return; }

    const r = mk.steps[step];
    if (actx) { if (r >= 0) tone(hz(midi(MK_NOTES[r])), actx.currentTime, beat * 0.9, MK_SOUNDS[mk.sound][1], 0.09); if (step % 2 === 0) kick(actx.currentTime); else hat(actx.currentTime); }

function makerButtons() {

        buttons.push({ x, y: 400, w: 195, h: 44, fn: () => openMaker(i), label: '✏️ Change it', col: '#3fa9ff', small: true });
      } else buttons.push({ x, y: 240, w: 195, h: 150, fn: () => openMaker(i), emptyCard: true });

  } else {

    B(90, 130, mkListen ? '⏹ Stop' : '▶ Listen', mkToggleListen, '#4cd97b');
