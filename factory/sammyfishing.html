// ---------- Rarity odds (lures make rare fish more likely) ----------
function rarityWeights(lure) {
  const L = lure || 0;
  return [RARITY[0].w, RARITY[1].w * (1 + 0.35 * L), RARITY[2].w * (1 + 0.6 * L), RARITY[3].w * (1 + 0.9 * L)];
}
function rollRarity(lure, rnd = Math.random) {
  const w = rarityWeights(lure), tot = w.reduce((a, b) => a + b, 0);
  let x = rnd() * tot;
  for (let i = 0; i < 4; i++) { if (x < w[i]) return i; x -= w[i]; }
  return 0;
}
function rollCatch(spot, lure, rnd = Math.random) {
  const list = spotCatches(spot);
  let r = rollRarity(lure, rnd);
  if ((save.dry[spot] || 0) >= 25 && list.some(c => c.r === 3)) r = 3;     // lucky: a LEGENDARY after 25 catches without one
  while (r > 0 && !list.some(c => c.r === r)) r--;
  const pool = list.filter(c => c.r === r);
  // fish you haven't caught yet are a bit more likely, so the album fills up
  const wts = pool.map(c => save.caught[c.id] ? 1 : 2), tw = wts.reduce((a, b) => a + b, 0);
  let x = rnd() * tw;
  for (let i = 0; i < pool.length; i++) { if (x < wts[i]) return pool[i]; x -= wts[i]; }
  return pool[pool.length - 1];
}

// ---------- Album counts ----------
const albumCount = () => CATCHES.filter(c => save.caught[c.id]).length;
function spotProgress(s) {                             // [caught, total, stars 0..3] for one spot (its own catches)
  const list = CATCHES.filter(c => c.spot === s), got = list.filter(c => save.caught[c.id]).length;
  return [got, list.length, got >= list.length ? 3 : Math.floor(got * 3 / list.length)];
}

// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;

function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

  plop:   () => { note(500, 0, 0.12, 'sine', 0.14, 150); note(900, 0.05, 0.08, 'sine', 0.06, 400); },
  splash: () => { if (actx && noiseBuf) noiseHit(actx.currentTime, 'bandpass', 1200, 1, 0.25, 0.3, sfxBus); note(300, 0, 0.2, 'sine', 0.1, 120); },
  bite:   () => { note(1047, 0, 0.08, 'square', 0.08); note(1319, 0.08, 0.12, 'square', 0.08); },
  hook:   () => { note(400, 0, 0.12, 'sawtooth', 0.08, 900); note(1200, 0.08, 0.1, 'sine', 0.08); },

// ---------- MUSIC ENGINE ----------
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {

    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];

    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }

      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);

// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ

  for (const m of notes) {

    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {

    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato

      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);

        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);

// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);

function updateFish() {
  const hold = keys.space || mouseHeld, sp = spot();
  if (F.phase === 'idle' && !sp.ice) {

  } else if (F.phase === 'fly') {

    F.t++;

  if (frame % 1800 === 0) save.happy = Math.max(20, (save.happy || 0) - 1);
  if (dance > 0) dance--; if (eatT > 0) eatT--;

function openPage(id) {
  sfx.click();

  else if (id === 'album') { state = 'album'; albumOpen = false; }
  else if (id === 'shop') { state = 'shop'; }

  else if (id === 'fish') { state = 'fish'; }

}
const canLeave = () => F.phase === 'idle' || F.phase === 'show' || F.phase === 'miss';

function updateMenus() {
  if (state === 'title') {
    if (inBox(tap, MUSIC_BTN)) { toggleMusic(); tap = null; }
    if (press.act || press.enter || tap) { sfx.click(); startFishing(spotOpen(save.spot) ? save.spot : 0); }
    return;
  }
  if (state === 'fish') {
    if (tap) {
      const b = HUD_BTNS.find(b => inBox(tap, b));
      if (inBox(tap, BACK_BTN)) { if (canLeave()) openPage('title'); }
      else if (inBox(tap, MUSIC_BTN)) toggleMusic();

      else if (F.phase === 'show') press.act = true;
      else { mouseHeld = true; press.act = true; }
    }
    if (press.x) feedSammy();
    if (press.enter && F.phase === 'idle') { state = 'menu'; menuSel = 0; sfx.click(); }
    if (press.esc && F.phase === 'idle') openPage('title');
    return;
  }
  if (state === 'menu') {
    if (press.u) menuSel = (menuSel + MENU_ITEMS.length - 1) % MENU_ITEMS.length;
    if (press.d) menuSel = (menuSel + 1) % MENU_ITEMS.length;
    let pick = (press.act || press.enter) ? menuSel : -1;
    if (tap) MENU_ITEMS.forEach((m, i) => { if (inBox(tap, menuBox(i))) pick = i; });
    if (pick >= 0) openPage(MENU_ITEMS[pick][0]);
    else if (press.esc || inBox(tap, BACK_BTN)) openPage('fish');
    return;
  }
  const back = press.esc || inBox(tap, BACK_BTN);
  if (state === 'album') {
    if (albumOpen) { if (press.act || press.enter || tap || press.esc) { albumOpen = false; sfx.click(); } return; }
    if (back) { openPage('fish'); return; }
    if (press.l) albumSel = (albumSel + CATCHES.length - 1) % CATCHES.length;

    if (press.d) albumSel = (albumSel + 8) % CATCHES.length;

    return;
  }
  if (state === 'shop') {
    if (back) { openPage('fish'); return; }
    if (press.u) shopRow = (shopRow + 3) % 4;

    if (press.r) shopCol++;
    shopCol = clamp(shopCol, 0, SHOP[shopRow].items.length - 1);

}

function roundRect(x, y, w, h, r, fill) {

}
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }

  let bx = Math.max(6, Math.min(W - w - 6, x - w / 2)), by = Math.max(48, y - h - 12);

}

// ---------- SAMMY: Ben's brown tabby (big, front view, very expressive) ----------
const FUR = '#a8683a', FUR_D = '#8f552c', STRIPE = '#5a3416', TAN = '#e9cda3', EYE = '#9a5a22', EYE_L = '#c98a45', PUPIL = '#2b1a0e', PINK = '#f48fb1', NOSE = '#e57373';
const WET = '#7d4d2b';
// o: { pose: sit|loaf|crouch|sleep|highfive|swat|eat|roll|box, expr: normal|happy|wide|mad|sleepy|slow|nope, mouth: w|open|smile|frown,
//      look: -1..1, tail: wag amount, floof: 0..1, wet: 0..1, neck, head, lean (radians) }
function drawSammy(x, y, s, o = {}) {
  const pose = o.pose || 'sit', fur = (o.wet || 0) > 0.5 ? WET : FUR, t = frame;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (pose !== 'box') ellipse(0, 2, pose === 'loaf' || pose === 'sleep' ? 78 : 62, 12, 'rgba(0,0,0,.2)');
  if (o.lean) { ctx.translate(0, -70); ctx.rotate(o.lean); ctx.translate(0, 70); }
  const thin = (o.wet || 0) > 0.5 ? 0.82 : 1, fl = o.floof || 0;
  const loaf = pose === 'loaf' || pose === 'box', crouch = pose === 'crouch';
  const headY = loaf ? -86 : crouch ? -78 : -122, bodyY = loaf ? -40 : crouch ? -36 : -56;
  // 🌀 the striped tail (it swishes!)
  if (pose !== 'box') {
    const sw = Math.sin(t * 0.07) * (o.tail == null ? 1 : o.tail);
    for (let i = 0; i < 12; i++) {
      const k = i / 11;
      let tx, ty;
      if (loaf) { tx = 60 - k * 100; ty = -6 + Math.sin(k * 3) * 4; }                     // wrapped around his paws
      else { tx = 40 + k * 42 + sw * k * 10; ty = -16 - k * k * 80 + Math.sin(k * 4 + sw) * 6; }
      circle(tx, ty, (11 - k * 4) * thin + fl * 4, i % 2 ? STRIPE : fur);
    }
  }
  // 💨 floof fuzz around his outline (after the bath)
  if (fl > 0) {
    for (let i = 0; i < 22; i++) { const a = i / 22 * Math.PI * 2, r = 54 + Math.sin(i * 2.3) * 4; circle(Math.cos(a) * r * 1.05, bodyY + Math.sin(a) * r * 1.1, 10 * fl + 3, fur); }
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; circle(Math.cos(a) * 54, headY + 4 + Math.sin(a) * 50, 9 * fl + 2, fur); }
  }
  // body
  if (loaf) {
    ellipse(0, bodyY, 76 * thin, 42, fur);
    ellipse(0, bodyY + 10, 40 * thin, 26, TAN);
  } else {
    ellipse(-30, -28, 26 * thin, 30, fur); ellipse(30, -28, 26 * thin, 30, fur);              // back legs
    ellipse(0, bodyY, 44 * thin, crouch ? 40 : 56, fur);
    ellipse(0, bodyY + 8, 25 * thin, crouch ? 26 : 40, TAN);                                     // light tan belly
  }
  // tiger stripes on his sides
  ctx.strokeStyle = STRIPE; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const sd of [-1, 1]) for (let i = 0; i < 3; i++) {
    const yy = bodyY - 26 + i * 20, xx = sd * (loaf ? 60 : 38) * thin;
    ctx.beginPath(); ctx.moveTo(xx + sd * 4, yy); ctx.quadraticCurveTo(xx - sd * 10, yy + 4, xx - sd * 14, yy + 12); ctx.stroke();
  }
  // front paws
  if (!loaf) {
    const lift = pose === 'highfive' || pose === 'swat';
    ellipse(-17, -7, 14, 9, TAN);
    if (lift) {
      const sx = pose === 'swat' ? Math.sin(t * 0.6) * 8 : 0;
      ellipse(44 + sx, headY + 30, 11, 30, fur, -0.5); ellipse(54 + sx, headY + 6, 14, 13, TAN);
      for (const k of [-6, 0, 6]) circle(54 + sx + k, headY + 2, 3.2, PINK);
      if (pose === 'swat') for (const k of [0, 1, 2]) line(70 + sx, headY - 6 + k * 10, 86 + sx, headY - 10 + k * 10, '#fff', 3);
    } else ellipse(17, -7, 14, 9, TAN);
    ctx.strokeStyle = 'rgba(90,52,22,.5)'; ctx.lineWidth = 2;
    for (const px of lift ? [-17] : [-17, 17]) for (const k of [-4, 4]) { ctx.beginPath(); ctx.moveTo(px + k, -12); ctx.lineTo(px + k, -3); ctx.stroke(); }
  }
  drawSammyHead(0, headY + (o.bob || 0), o, fur, thin);
  ctx.lineCap = 'butt';
  if ((o.wet || 0) > 0.3) for (let i = 0; i < 4; i++) { const k = (t * 0.03 + i * 0.25) % 1; ellipse(-40 + i * 27, headY + 30 + k * 90, 3, 5, 'rgba(129,212,250,' + (1 - k).toFixed(2) + ')'); }
  ctx.restore();
}
function drawSammyHead(hx, hy, o, fur, thin) {
  const look = (o.look || 0) * 6, expr = o.expr || 'normal';
  ctx.save(); ctx.translate(hx, hy); if (o.tilt) ctx.rotate(o.tilt);
  // ears (with pink insides), then the big round head with fluffy cheeks
  const ew = expr === 'mad' || expr === 'nope' ? 10 : 0;
  for (const sd of [-1, 1]) {
    tri(sd * 44, -14, sd * (34 + ew), -66 + ew * 1.2, sd * 8, -40, fur);
    tri(sd * 36, -22, sd * (31 + ew), -54 + ew, sd * 15, -38, PINK);
  }
  circle(0, 0, 48 * Math.max(thin, 0.9), fur);
  ellipse(0, 14, 56, 34, fur);
  tri(-56, 14, -70, 24, -50, 34, fur); tri(56, 14, 70, 24, 50, 34, fur);                     // cheek tufts
  // the tabby "M" on his forehead and cheek stripes
