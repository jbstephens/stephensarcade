<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { background: #14102a; }   /* no white strip peeking out on the iPad */
  body { min-height: 100dvh; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
    background: radial-gradient(circle at 50% 0%, #4a3480, #14102a 70%);
    color: #2d2340; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .gear { position: fixed; font-size: 140px; opacity: .1; animation: spin 14s linear infinite; pointer-events: none; }
  .g1 { top: -40px; left: -40px; } .g2 { bottom: 30px; right: -40px; font-size: 180px; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- the book ---- */
  .stage { display: flex; align-items: center; gap: 18px; padding: 0 16px; position: relative; z-index: 1; }   /* above the night sky and party floaters */
  .book {
    position: relative; width: 640px; aspect-ratio: 4 / 3.2; perspective: 2200px;
  }
  .book::after {                               /* the spine / page edges */
    content: ""; position: absolute; top: 6px; bottom: -10px; right: -12px; left: 12px; z-index: -1;
    border-radius: 6px 22px 22px 6px; background: repeating-linear-gradient(0deg, #f3e9d2 0 3px, #d9ccae 3px 4px);
    box-shadow: 0 20px 40px rgba(0,0,0,.5);
  }
  .page {
    position: absolute; inset: 0; border-radius: 6px 22px 22px 6px; overflow: hidden;
    background: #fffaf0; box-shadow: inset 18px 0 24px -14px rgba(0,0,0,.35);
    transform-origin: left center; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 4% 7%;
  }
  .page.turning { transition: transform .7s ease-in-out; z-index: 3; }
  .page.flipped { transform: rotateY(-180deg); }
  .page.under { z-index: 1; }
  .page.top { z-index: 2; }

  .pageNum { position: absolute; bottom: 12px; right: 22px; font-size: 16px; color: #9a8a70; }
  .corner { position: absolute; bottom: 0; right: 0; width: 46px; height: 46px; background: linear-gradient(135deg, transparent 50%, #e8dcc0 50%); border-radius: 0 0 22px 0; }

  /* cover */
  .cover { background: linear-gradient(160deg, #66bb6a, #1b5e20); color: #fff; box-shadow: inset 22px 0 30px -16px rgba(0,0,0,.5); }
  .cover h1 { font-size: 64px; margin: 0; color: #ffe34d; text-shadow: 4px 4px 0 #0b3d14, 0 0 20px rgba(255,227,77,.6); line-height: 1.05; }
  .cover .icons { font-size: 30px; margin: 12px 0; letter-spacing: 3px; line-height: 1.25; }   /* small so all the games fit on the cover */
  .cover p { font-size: 22px; margin: 4px 0; }
  .cover .open { margin-top: 18px; font-size: 20px; background: rgba(0,0,0,.25); padding: 8px 22px; border-radius: 999px; animation: pulse 1.2s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }

  /* contents */
  .contents h2 { margin: 0 0 10px; font-size: 30px; color: #ff5aa5; }
  .toc { list-style: none; padding: 0; margin: 0; width: 100%; max-width: 760px; text-align: left; columns: 4; column-gap: 10px; }   /* 4 columns so all the games fit */
  .toc li { display: flex; align-items: baseline; gap: 3px; font-size: 9.5px; padding: 0 3px; line-height: 1.1; break-inside: avoid; border-radius: 8px; cursor: pointer; }
  .toc li:hover { background: #fff0c4; }
  .toc .dots { flex: 1; border-bottom: 3px dotted #c9b89a; transform: translateY(-5px); }

  /* game pages */
  .pic { width: 100%; height: 42%; border-radius: 18px; background: var(--c); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 -8px 0 rgba(0,0,0,.15); }
  .pic .icon { font-size: 100px; animation: float 2s ease-in-out infinite alternate; }
  .pic .mini { position: absolute; font-size: 34px; opacity: .9; }
  @keyframes float { to { transform: translateY(-10px) rotate(-5deg); } }
  .game h2 { margin: 12px 0 4px; font-size: 42px; color: var(--t); text-shadow: 2px 2px 0 rgba(0,0,0,.12); }
  .game .desc { font-size: 19px; margin: 0 0 6px; }
  .game .ctrl { font-size: 15px; color: #7a6a58; margin: 0 0 10px; }
  .playBtn {
    font: inherit; font-size: 24px; color: #fff; cursor: pointer; border: none;
    padding: 8px 40px; border-radius: 999px; background: var(--t);
    box-shadow: 0 6px 0 rgba(0,0,0,.3); transition: transform .1s;
  }
  .playBtn:hover { transform: scale(1.07); }
  .playBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }

  /* back cover */
  .end { background: linear-gradient(160deg, #26c6da, #3949ab); color: #fff; }
  /* trophy room */
  .trophies { background: linear-gradient(160deg, #3e2723, #1b0f0a); color: #fff; padding: 3% 4%; }
  .trophies h2 { margin: 0; font-size: 34px; color: #ffd740; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .trophies .count { font-size: 16px; color: #ffe0b2; margin: 2px 0 4px; }
  .shelf { max-height: 360px; overflow-y: auto; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; width: 100%; box-sizing: border-box; }
  .tro { background: rgba(255,255,255,.08); border-radius: 12px; padding: 3px 3px; line-height: 1.05; cursor: pointer; }   /* tap one to see how to win it */
  .tro .ic { font-size: 23px; display: block; }
  .tro b { display: block; font-size: 11px; color: #ffd740; overflow-wrap: anywhere; }
  .troInfo { font-size: 15px; color: #ffe0b2; min-height: 22px; margin-top: 6px; }
  .tro i { display: block; font-size: 9px; font-style: normal; color: #d7ccc8; }
  .tro.no { opacity: .45; } .tro.no .ic { filter: grayscale(1) brightness(.6); }
  .tro.yes { background: rgba(255,215,64,.18); box-shadow: 0 0 0 2px #ffd740 inset; }
  .tropBtn { margin-left: 10px; font-size: 16px; background: #ffd740; color: #5d4037; border-radius: 999px; padding: 4px 12px; cursor: pointer; vertical-align: middle; }
  /* puzzle room */
  .puzzle { background: linear-gradient(160deg, #1a237e, #0d0a2b); color: #fff; padding: 3% 4%; }
  .puzzle h2 { margin: 0; font-size: 34px; color: #80d8ff; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .puzzle .count { font-size: 16px; color: #b3e5fc; margin: 2px 0 8px; }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; width: 540px; aspect-ratio: 8 / 5; background: rgba(0,0,0,.35); padding: 3px; border-radius: 10px; }
  .board.done { gap: 0; padding: 0; box-shadow: 0 0 0 4px #ffd740, 0 0 30px #ffd740; animation: glow 1s infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 0 4px #fff, 0 0 50px #ffd740; } }
  .pz { border-radius: 6px; background-size: 500% 400%; position: relative; }
  .board.done .pz { border-radius: 0; }
  .pz.no { background: rgba(255,255,255,.07) !important; border: 2px dashed rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-size: 22px; filter: grayscale(1); opacity: .6; }
  .pz.yes { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } }
  .puzzle .msg { margin-top: 8px; font-size: 18px; color: #ffd740; }
  /* jukebox */
  .jukebox { background: radial-gradient(circle at 50% 0%, #6a1b9a, #1a0b33 75%); color: #fff; padding: 3% 4%; }
  .jukebox h2 { margin: 0; font-size: 34px; color: #ff80ab; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .nowPlaying { margin: 4px 0 8px; font-size: 16px; color: #ffe0f0; min-height: 22px; }
  .nowPlaying .eq span { display: inline-block; width: 5px; margin: 0 1px; background: #ff80ab; animation: eq .5s infinite alternate; vertical-align: bottom; }
  @keyframes eq { from { height: 4px; } to { height: 18px; } }
  .jbLyrics { display: none; margin: -4px 0 6px; padding: 5px 14px; border-radius: 16px; background: rgba(0,0,0,.4); border: 2px solid #ff80ab; font-size: 15px; }
  .jbLyrics.on { display: block; }
  .jbLyrics .lit { color: #ffd740; }
  .jbLyrics.glitchy { border-color: #00ffd0; } .jbLyrics.glitchy .lit { color: #00ffd0; }
  .jbGroup { font-size: 13px; color: #ce93d8; margin: 4px 0 3px; text-align: left; width: 100%; }
  .tracks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; width: 100%; }
  .track { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.25); border-radius: 12px; padding: 4px 6px; font-size: 13px; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track:hover { background: rgba(255,128,171,.25); }
  .track.on { background: #ff4081; border-color: #fff; }
  .jbStop { margin-top: 8px; font-size: 16px; background: #fff; color: #6a1b9a; border-radius: 999px; padding: 5px 18px; cursor: pointer; display: inline-block; }
  /* hall of heroes */
  .heroes { background: linear-gradient(160deg, #0d47a1, #1a0b33); color: #fff; padding: 3% 4%; }
  .heroes h2 { margin: 0; font-size: 34px; color: #ffd740; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .heroes .sub { font-size: 14px; color: #bbdefb; margin: 0 0 3px; }
  .cards { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; width: 100%; max-height: 290px; overflow-y: auto; }
  .hero { background: linear-gradient(180deg, #fff8e1, #ffe082); color: #4e342e; border-radius: 10px; padding: 3px 2px; cursor: pointer; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.3); line-height: 1.05; }
  .hero:hover, .hero.on { transform: translateY(-3px); border-color: #ff4081; }
  .hero .ic { font-size: 17px; display: block; }
  .hero b { font-size: 9px; display: block; }
  .heroInfo { margin-top: 4px; min-height: 46px; width: 100%; background: rgba(255,255,255,.12); border-radius: 14px; padding: 6px 12px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 15px; }
  .heroInfo .big { font-size: 44px; }
  .heroInfo .from { color: #ffd740; font-size: 13px; }
  .tropBtns { display: flex; gap: 6px; justify-content: center; margin: -4px 0 8px; flex-wrap: wrap; }
  .tropBtns .tropBtn { margin: 0; font-size: 14px; }
  /* clubhouse */
  .club { background: #3e2723; color: #fff; padding: 2.5% 3%; }
  .club h2 { margin: 0; font-size: 30px; color: #ffcc80; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .club .sub { font-size: 13px; color: #ffe0b2; margin: 0 0 5px; min-height: 17px; }
  .room { position: relative; width: 100%; height: 270px; border-radius: 12px; overflow: hidden; touch-action: none; box-shadow: inset 0 0 0 4px #5d4037;
          background: linear-gradient(180deg, var(--wall) 0 62%, #a1683a 62% 100%); }
  .room .boards { position: absolute; left: 0; right: 0; top: 62%; bottom: 0; background: repeating-linear-gradient(90deg, transparent 0 58px, rgba(0,0,0,.18) 58px 61px); }
  .room .win { position: absolute; left: 40%; top: 9%; width: 20%; height: 34%; border: 6px solid #fff; border-radius: 8px; background: linear-gradient(#4fc3f7, #b3e5fc); }
  .room .win::after { content: '☀️'; position: absolute; right: 6px; top: 2px; font-size: 22px; }
  .room .rug { position: absolute; left: 25%; width: 50%; top: 70%; height: 22%; border-radius: 50%; background: radial-gradient(#ff8a80 0 30%, #ffd180 30% 55%, #80d8ff 55%); opacity: .85; }
  .placed { position: absolute; font-size: 40px; transform: translate(-50%, -50%); cursor: grab; user-select: none; touch-action: none; filter: drop-shadow(0 4px 2px rgba(0,0,0,.35)); }
  .placed.drag { font-size: 48px; cursor: grabbing; z-index: 5; }
  .wallBtn { position: absolute; right: 8px; top: 8px; font-size: 13px; background: rgba(0,0,0,.35); border-radius: 999px; padding: 3px 10px; cursor: pointer; z-index: 6; }
  .toybox { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; width: 100%; margin-top: 6px; max-height: 118px; overflow-y: auto; background: rgba(0,0,0,.25); border-radius: 10px; padding: 4px; }
  .toy { font-size: 24px; cursor: pointer; border-radius: 8px; padding: 2px 0; position: relative; }
  .toy:hover { background: rgba(255,255,255,.15); }
  .toy.out { opacity: .35; }
  .toy.locked { filter: grayscale(1) brightness(.5); }
  .toy.locked::after { content: '🔒'; position: absolute; right: 0; bottom: 0; font-size: 11px; filter: none; }
  /* joke machine */
  .jokes { background: linear-gradient(160deg, #ff9800, #e65100); color: #fff; padding: 3% 5%; }
  .jokes h2, .fortune h2, .aqua h2 { margin: 0; font-size: 32px; text-shadow: 3px 3px 0 rgba(0,0,0,.3); }
  .jokeBot { font-size: 70px; line-height: 1; margin: 4px 0; }
  .jokeBot.talk { animation: wobble .25s 6 alternate; }
  @keyframes wobble { from { transform: rotate(-8deg); } to { transform: rotate(8deg) scale(1.05); } }
  .jokeBox { background: #fff; color: #4e342e; border-radius: 20px; padding: 10px 18px; min-height: 92px; width: 92%; font-size: 21px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
  .jokeBox .punch { color: #e65100; font-size: 24px; margin-top: 6px; }
  .bigBtn { margin-top: 12px; font-size: 22px; background: #fff176; color: #e65100; border-radius: 999px; padding: 10px 28px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.25); display: inline-block; user-select: none; }
  .bigBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  /* fortune machine */
  .fortune { background: radial-gradient(circle at 50% 40%, #4a148c, #12002b 75%); color: #fff; padding: 3% 5%; }
  .ball { width: 170px; height: 170px; border-radius: 50%; margin: 8px auto 4px; background: radial-gradient(circle at 35% 30%, #fff 0 6%, #e1bee7 10%, #7c4dff 45%, #311b92 80%); box-shadow: 0 0 40px #b388ff, inset -12px -16px 30px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
  .ball.spin { animation: glowSpin 1.2s ease-in-out; }
  @keyframes glowSpin { 50% { transform: scale(1.12) rotate(180deg); box-shadow: 0 0 90px #ea80fc, inset -12px -16px 30px rgba(0,0,0,.4); } }
  .stand { width: 130px; height: 26px; margin: -6px auto 8px; background: linear-gradient(#8d6e63, #4e342e); border-radius: 10px 10px 4px 4px; }
  .fortuneText { font-size: 22px; min-height: 60px; color: #ffe57f; text-shadow: 0 0 12px #b388ff; padding: 0 10px; }
  /* bundle room */
  .bundles { background: radial-gradient(circle at 50% 0%, #00897b, #062b26 80%); color: #fff; padding: 2.5% 3%; justify-content: flex-start; }
  .bundles h2 { margin: 0; font-size: 32px; color: #ffd740; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .bundles .sub { font-size: 14px; color: #b2dfdb; margin: 0 0 6px; min-height: 18px; }
  .bTabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 100%; }
  .bTab { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2); border-radius: 12px; padding: 2px 2px; cursor: pointer; line-height: 1.1; font-size: 12px; }
  .bTab .ic { font-size: 22px; } .bTab b { color: #ffd740; }
  .bTab.on { background: #ffd740; color: #4e342e; border-color: #fff; } .bTab.on b { color: #4e342e; }
  .bWallet { margin: 8px 0 6px; font-size: 18px; } .bWallet b { color: #ffd740; font-size: 22px; }

  .bCard { background: linear-gradient(180deg, #fff8e1, #ffe082); color: #4e342e; border-radius: 16px; padding: 6px 4px 8px; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.3); }

  .bCard.can .bBtn { background: #e91e63; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .bCard.got .bBtn { background: #43a047; }
  .bOpen { position: absolute; inset: 0; background: rgba(0,20,18,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9; cursor: pointer; }
  .bOpen .gift { font-size: 120px; animation: shake .12s 7 alternate; }
  @keyframes shake { from { transform: rotate(-12deg) scale(1); } to { transform: rotate(12deg) scale(1.15); } }
  .bOpen .gift.boom { animation: boom .4s forwards; }
  @keyframes boom { to { transform: scale(2.4); opacity: 0; } }

  .bOpen .got span { animation: popUp .5s backwards; }
  @keyframes popUp { from { transform: translateY(60px) scale(.2); opacity: 0; } 70% { transform: translateY(-14px) scale(1.2); } }
  .bOpen .say { font-size: 22px; color: #ffd740; margin-top: 10px; padding: 0 20px; }
  /* 🌙 night mode (7pm - 6am) and 🕹️ party mode (secret code) */
  body.night { background: radial-gradient(circle at 70% 10%, #283593, #050314 70%); }
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .sky .st { position: absolute; color: #fff; animation: twinkle 2s ease-in-out infinite alternate; }
  .sky .moon { position: absolute; right: 4%; top: 4%; font-size: 70px; filter: drop-shadow(0 0 30px #fff59d); }
  .sky .shoot { position: absolute; width: 90px; height: 2px; background: linear-gradient(90deg, #fff, transparent); animation: shoot 7s linear infinite; }
  @keyframes twinkle { from { opacity: .2; transform: scale(.7); } to { opacity: 1; transform: scale(1.2); } }
  @keyframes shoot { 0%, 90% { transform: translate(0, 0) rotate(-30deg); opacity: 0; } 92% { opacity: 1; } 100% { transform: translate(-500px, 280px) rotate(-30deg); opacity: 0; } }

// ---- 🌈 the secret game: it unlocks when you've played every other game from the book ----
function playedSave() {
  let p = readSave('gfPlayed');

    p = { games: [], rainbow: false };
    for (const f of aquaSave().fish) { const g = GAMES.find(x => x.name === f.from); if (g && !p.games.includes(g.file)) p.games.push(g.file); }
  }
  return p;
}

function speak(txt, pitch = 1.4) {

    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt.replace(/[^\w\s'?!.,-]/g, '')); const v = youngVoice(); if (v) u.voice = v; u.pitch = pitch; u.rate = 1.05;
    speechSynthesis.speak(u);
  } catch (_) {}
}

function tellJoke() {

  jokeAt = i;

  bot.classList.remove('talk'); void bot.offsetWidth; bot.classList.add('talk');
  speak(q);
  setTimeout(() => {   // the answer after a little wait
    if (jokeAt !== i) return;
    const p = document.querySelector('.jokeBox .punch'); if (!p) return;
    p.textContent = a; speak(a);
    [[147, 0], [196, 120], [0, 260]].forEach(([f, d]) => setTimeout(() => f ? beep(f, 0.12, 'square', 0.06) : beep(900, 0.15, 'sawtooth', 0.03), 2600 + d));   // ba-dum-tss!

}

function folderRefresh() { if (document.querySelector('.folders') && cur === FOLDER_PAGE()) show(cur); }
function folderClick(e) {   // returns true when the click was for the Folder Room
  if (!e.target.closest('.folders')) return false;
  const t = k => e.target.closest('[data-' + k + ']');
  const S = folderSave(), F = S.folders;
  if (fView === 'make') {
    const inp = document.getElementById('fName'); if (inp) fNew.name = inp.value;
    if (t('fname')) { fNew.name = t('fname').dataset.fname; fNew.icon = t('fname').dataset.ficon; }
    else if (t('ficon')) fNew.icon = t('ficon').dataset.ficon;
    else if (t('fcolor')) fNew.color = t('fcolor').dataset.fcolor;
    else if (e.target.closest('input')) return true;
  }
  if (t('fopen')) { fOpen = +t('fopen').dataset.fopen; fView = 'open'; fDelArm = false; beep(880, 0.05); }
  else if (t('fgame')) {
    const file = t('fgame').dataset.fgame, fo = F[fOpen];
    if (fView === 'add') { fo.games = fo.games.includes(file) ? fo.games.filter(x => x !== file) : fo.games.concat(file); folderStore(S); beep(fo.games.includes(file) ? 990 : 520, 0.05); }
    else { const i = gameByFile(file); if (i >= 0) openGame(i); return true; }
  } else if (t('fdo')) {
    const d = t('fdo').dataset.fdo;
    if (d === 'make') { fNew = { name: '', icon: F_ICONS[F.length % F_ICONS.length], color: F_COLORS[F.length % F_COLORS.length] }; fView = 'make'; }
    else if (d === 'create') {
      const name = (fNew.name || '').trim().slice(0, 18) || 'My Folder';
      F.push({ name, icon: fNew.icon, color: fNew.color, games: [] }); folderStore(S);
      fOpen = F.length - 1; fView = 'add';   // straight to picking its games
      [660, 880, 1320].forEach((f, k) => setTimeout(() => beep(f, 0.1), k * 70));
    }
    else if (d === 'del') {
      if (!fDelArm) { fDelArm = true; beep(330, 0.1); }
      else { F.splice(fOpen, 1); folderStore(S); fDelArm = false; fView = 'list'; beep(220, 0.15); }
    }
    else if (d === 'all') { const fo = F[fOpen]; fo.games = fo.games.length >= visibleGames().length ? [] : visibleGames().map(g => g.file); folderStore(S); beep(990, 0.08); }
    else { fView = d; fDelArm = false; beep(700, 0.05); }
  } else if (fView !== 'make') return true;
  else beep(880, 0.04);
  folderRefresh();
  if (fView === 'make') { const inp = document.getElementById('fName'); if (inp && !inp.value) inp.focus(); }
  return true;
}
