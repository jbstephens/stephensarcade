<script>
// BOSS BUILDER: designed by Ben! "Design your OWN boss: pick its body, eyes, size and attacks. Then you have to fight it!"
// 1) Build a boss in the Boss Workshop (body, color, eyes, extra, size, up to 3 attacks, a silly name).
// 2) Save it as a boss card (up to 6).  3) FIGHT it with Robo! Tired bosses take double damage.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const GRAV = 0.6, SPEED = 4.6, JUMP = 13, MAXFALL = 15;
const FLOOR = 470;                                       // top of the arena floor
const PLATS = [{ x: 90, y: 350, w: 170 }, { x: 700, y: 350, w: 170 }, { x: 395, y: 235, w: 170 }];   // floating platforms (jump up through them)
const MAX_HEARTS = 5;
const ZAP_COOL = 16;                                     // frames between zaps (hold ZAP to keep zapping)
let CHEAT = false;                                       // tests only: Robo can't get hurt

// ---------- Saves for the Game Factory book ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }

// ---------- The boss parts you can pick ----------
const BODIES = [
  { id: 'blob', name: 'Blob', icon: '🟢' }, { id: 'robot', name: 'Robot Box', icon: '🤖' },
  { id: 'dragon', name: 'Dragon', icon: '🐉' }, { id: 'crab', name: 'Crab', icon: '🦀' },
  { id: 'ghost', name: 'Ghost', icon: '👻' }, { id: 'spiky', name: 'Spiky Ball', icon: '🦔' },
  { id: 'saucer', name: 'Saucer', icon: '🛸' }, { id: 'octo', name: 'Giant Octopus', icon: '🐙' },
];
const COLORS = [
  { name: 'Red', c: '#f44336' }, { name: 'Orange', c: '#ff9800' }, { name: 'Yellow', c: '#fdd835' },
  { name: 'Green', c: '#4caf50' }, { name: 'Teal', c: '#1de9b6' }, { name: 'Blue', c: '#2979ff' },
  { name: 'Purple', c: '#9c27b0' }, { name: 'Pink', c: '#ff4fa3' }, { name: 'Brown', c: '#8d6e63' },
  { name: 'Black', c: '#37304a' }, { name: 'RAINBOW', c: 'rainbow' },
];
const EYES = ['One Big Eye', 'Angry Eyes', 'Googly Eyes', 'Sunglasses', 'Three Eyes', 'Sleepy Eyes', 'Laser Visor', 'Heart Eyes'];
const EXTRAS = ['No Extra', 'Crown', 'Horns', 'Wings', 'Cape'];
const SIZES = [
  { name: 'Small', R: 52, hp: 22, mul: 0.8 }, { name: 'Medium', R: 72, hp: 32, mul: 1 },
  { name: 'BIG', R: 96, hp: 46, mul: 1.2 }, { name: 'GIGANTIC', R: 124, hp: 62, mul: 1.4 },
];
const ATTACKS = [
  { id: 'fire', name: 'Fireballs', icon: '🔥', hard: 1, tip: 'Fireballs fly at you: jump or run!' },
  { id: 'stomp', name: 'Stomp', icon: '💥', hard: 1, tip: 'STOMP! Jump over the shockwave!' },
  { id: 'laser', name: 'Laser', icon: '🔴', hard: 2, tip: 'Watch the red line: dodge the laser!' },
  { id: 'minions', name: 'Minions', icon: '👾', hard: 1, tip: 'Little minions! Zap them or bop them!' },
  { id: 'bombs', name: 'Bombs', icon: '💣', hard: 2, tip: 'Bouncy bombs! Run from the red rings!' },
  { id: 'dash', name: 'Dash', icon: '💨', hard: 2, tip: 'It will CHARGE! Jump up high!' },
  { id: 'spikes', name: 'Spike Rain', icon: '📌', hard: 2, tip: 'Spikes fall on the shadows: stand in a gap!' },
  { id: 'star', name: 'Homing Star', icon: '⭐', hard: 1, tip: 'A slow star follows you: zap it 3 times!' },
];
function stars(b) {                                      // difficulty: 1-5 stars from size + attacks
  let s = b.size; for (const a of b.atks) s += ATTACKS[a].hard;
  return Math.max(1, Math.min(5, Math.ceil(s / 1.8)));
}

// ---------- Silly names (no typing! tap the dice) ----------
const NAME_A = ['Captain', 'Mega', 'Super', 'Lord', 'Baron', 'Doctor', 'King', 'Queen', 'Professor', 'Sir', 'Ultra', 'Big', 'Count', 'Little', 'Giga'];
const NAME_B = ['Zor', 'Blub', 'Grum', 'Snoz', 'Wob', 'Glo', 'Bonk', 'Fizz', 'Krak', 'Zib', 'Muf', 'Plop', 'Skree', 'Tob', 'Gloop', 'Noodle', 'Wump'];
const NAME_C = ['go', 'ber', 'ble', 'zle', 'tron', 'ax', 'oid', 'inks', 'umpus', 'etta', 'o', 'ulon', 'bert', 'zilla', 'tron 3000'];
const NAME_D = ['', '', '', ' the Grumpy', ' the Wobbly', ' the Sneaky', ' the Hungry', ' the Sleepy', ' the Mighty', ' the Silly', ' the Stinky', ' the Great', ' Jr.', ' the Bouncy', ' the Loud'];
const pick = a => a[Math.floor(Math.random() * a.length)];
function newName() {
  for (let i = 0; i < 50; i++) {
    const n = (Math.random() < 0.8 ? pick(NAME_A) + ' ' : '') + pick(NAME_B) + pick(NAME_C) + pick(NAME_D);
    if (n.length <= 26) return n;
  }
  return 'Mega Blubbertron';
}

// ---------- The card book: up to 6 saved bosses, in localStorage['bossBuilder'] ----------
const MAX_CARDS = 6;
const EXAMPLES = [
  { name: 'Mega Blubbertron', body: 0, color: 3, eyes: 2, extra: 1, size: 1, atks: [0, 1], wins: 0, ex: 1 },
  { name: 'Captain Zorgo the Grumpy', body: 3, color: 0, eyes: 1, extra: 4, size: 2, atks: [4, 3], wins: 0, ex: 1 },
];
let SAVE = { cards: EXAMPLES.map(b => Object.assign({}, b, { atks: b.atks.slice() })), beatOwn: 0, beat5: 0 };
function cleanBoss(b) {                                  // make sure a saved boss only has good values
  const n = (v, max) => Math.max(0, Math.min(max, v | 0));
  const atks = Array.isArray(b.atks) ? [...new Set(b.atks.map(a => n(a, ATTACKS.length - 1)))].slice(0, 3) : [0];
  return { name: String(b.name || 'Mega Blubbertron').slice(0, 30), body: n(b.body, BODIES.length - 1), color: n(b.color, COLORS.length - 1),
           eyes: n(b.eyes, EYES.length - 1), extra: n(b.extra, EXTRAS.length - 1), size: n(b.size, SIZES.length - 1),
           atks: atks.length ? atks : [0], wins: Math.max(0, b.wins | 0), ex: b.ex ? 1 : 0 };
}
try {
  const s = JSON.parse(localStorage.getItem('bossBuilder') || 'null');
  if (s && Array.isArray(s.cards)) { SAVE.cards = s.cards.slice(0, MAX_CARDS).map(cleanBoss); SAVE.beatOwn = s.beatOwn ? 1 : 0; SAVE.beat5 = s.beat5 ? 1 : 0; }
} catch (_) {}
function saveGame() { try { localStorage.setItem('bossBuilder', JSON.stringify(SAVE)); } catch (_) {} }

// ---------- Robo looks: he looks just like Ben dressed him in Robo Jump! ----------
function bundleHas(j) { try { return (JSON.parse(localStorage.getItem('gfBundles') || '{}').opened || []).includes('robojump-' + j); } catch (_) { return false; } }
const LOOKS = [
  { id: 'normal', bundle: -1 }, { id: 'tophat', bundle: 0 }, { id: 'cap', bundle: 0 },
  { id: 'cowboy', bundle: 1 }, { id: 'crown', bundle: 1 }, { id: 'pinch', bundle: 2 },
];
let look = 'normal';
try {
  const saved = (JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}).robojump;
  const L = LOOKS.find(l => l.id === saved);
  if (L && (L.bundle < 0 || bundleHas(L.bundle))) look = L.id;
} catch (_) {}
function goldOpen() { try { return Object.keys(JSON.parse(localStorage.getItem('gfKeys') || '{}')).length >= 5; } catch (_) { return false; } }
let goldOn = false, goldDraw = false;
try { goldOn = !!(JSON.parse(localStorage.getItem('gfGold') || '{}') || {}).robojump; } catch (_) {}
const isGold = () => goldOn && goldOpen();
const gc = (c, g) => goldDraw ? g : c;

// ---------- Little helpers ----------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const RAINBOW = ['#ff5252', '#ffab40', '#ffee58', '#69f0ae', '#40c4ff', '#b388ff', '#ff80ab'];
const rb = i => RAINBOW[((i % 7) + 7) % 7];
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); ctx.fill();
}
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, 7); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fitText(str, x, y, size, maxW, color, align) {   // shrinks the words until they fit
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  const w = ctx.measureText(str).width;
  text(str, x, y, w > maxW ? Math.max(10, Math.floor(size * maxW / w)) : size, color, align);
}
let particles = [];
function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 90; i++)
    particles.push({ x: Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 220, color: cols[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

// ---------- Sound ----------
let actx = null;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump:    () => note(400, 0, 0.15, 'sine', 0.15, 900),
  hover:   () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  click:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  tick:    () => note(660, 0, 0.06, 'square', 0.06),
  zap:     () => note(1200, 0, 0.12, 'square', 0.05, 2400),
  ouch:    () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  warn:    () => { note(880, 0, 0.1, 'square', 0.07); note(880, 0.15, 0.1, 'square', 0.07); },
  roar:    () => { note(110, 0, 0.9, 'sawtooth', 0.14, 55); note(165, 0.05, 0.8, 'square', 0.06, 70); },
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },
  bop:     () => { note(300, 0, 0.12, 'square', 0.12, 900); note(1200, 0.08, 0.12, 'triangle', 0.08); },
  bonk:    () => { for (let i = 0; i < 10; i++) note(500 - i * 35, i * 0.07, 0.14, 'square', 0.08); },
  land:    () => note(80, 0, 0.5, 'triangle', 0.25, 40),
  clank:   () => { note(1200, 0, 0.08, 'square', 0.06); note(1500, 0.03, 0.12, 'triangle', 0.06); },
  snap:    () => { note(1600, 0, 0.05, 'square', 0.08); note(700, 0.05, 0.08, 'square', 0.06); },
  shoot:   () => note(700, 0, 0.12, 'square', 0.05, 300),
  laser:   () => note(200, 0, 1.0, 'sawtooth', 0.07, 900),
  dice:    () => { for (let i = 0; i < 6; i++) note(500 + Math.random() * 600, i * 0.04, 0.05, 'square', 0.05); },
  build:   () => { note(523, 0, 0.08, 'square', 0.07); note(784, 0.06, 0.12, 'square', 0.07); },
  tired:   () => { for (let i = 0; i < 4; i++) note(600 - i * 100, i * 0.12, 0.15, 'triangle', 0.1); },
  heart:   () => [523, 659, 784].forEach((f, i) => note(f, i * 0.08, 0.15, 'triangle', 0.12)),
  win:     () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
  boom:    () => { note(120, 0, 0.5, 'sawtooth', 0.12, 40); note(1500 + Math.random() * 800, 0.05, 0.3, 'triangle', 0.05, 400); },
};
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  try { if (actx && actx.state === 'suspended') actx.resume(); } catch (_) {}
}

// ---------- Music: Ben's own Boss Builder songs ----------
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const BUILD_BPM = 132;                                    // the Boss Workshop song: bouncy, like building with LEGO
const BUILD_MELODY = [
  72,0,76,0, 79,0,76,0, 77,0,81,0, 79,0,0,0,
  76,0,79,0, 84,0,79,0, 81,79,77,76, 74,0,0,0,
  77,0,81,0, 84,0,81,0, 79,0,77,0, 76,0,74,0,
  74,0,79,0, 83,0,79,0, 77,0,74,0, 71,0,79,0,
];
const BUILD_CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];   // C, Am, F, G
const FIGHT_BPM = 152;                                    // the boss fight song: brave and fast!
const MELODY = [
  69,0,72,76, 0,76,74,72, 74,0,76,0, 69,0,0,0,
  67,0,71,74, 0,79,77,74, 74,0,71,0, 67,0,0,0,
  65,0,69,72, 0,72,74,76, 77,0,76,74, 72,0,0,0,
  76,0,74,72, 71,0,68,71, 76,0,0,68, 71,0,64,0,
];
const FIGHT_CHORDS = [[57, 60, 64], [55, 59, 62], [53, 57, 60], [52, 56, 59]];   // Am, G, F, E
let musicOn = true, nextNoteTime = 0, step = 0;
function playMusic() {
  if (!actx || !musicOn || state === 'pause') return;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  const fight = ['intro', 'fight', 'ko', 'bonked'].includes(state);
  const win = state === 'win';
  const mel = fight ? MELODY : BUILD_MELODY, chords = fight ? FIGHT_CHORDS : BUILD_CHORDS;
  const bpm = fight ? FIGHT_BPM : win ? 150 : BUILD_BPM, stepDur = 60 / bpm / 2;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const ch = chords[Math.floor(step / 16) % 4], m = mel[step % mel.length];
    if (m) note(midi(m), t, stepDur * (fight ? 0.9 : 1.4), fight ? 'square' : 'triangle', fight ? 0.04 : 0.07);
    note(midi(ch[[0, 1, 2, 1][step % 4]] + 12), t, stepDur * 0.7, 'triangle', 0.022);
    if (step % 2 === 0) note(midi(ch[0] - 12 + (step % 8 === 4 ? 7 : 0)), t, stepDur * 1.6, 'triangle', 0.09);
    if (fight && step % 2 === 0) note(60 + Math.random() * 20, t, 0.04, 'square', 0.02);            // drum tick
    if (fight && step % 8 === 4) note(90, t, 0.12, 'sawtooth', 0.05, 45);                            // boom drum
    if (!fight && step % 4 === 2) note(2000, t, 0.03, 'square', 0.012);                              // workshop "tink"
    nextNoteTime += stepDur; step++;
  }
}

// ---------- Drawing Robo (copied from Robo Jump, so every hat + Gold Robo look the same) ----------
function goldShine(x, y, w, h) {                       // a shiny streak sliding across (draw it while clipped to the hero)
  const t = (frame % 140) / 90; if (t > 1) return;
  const sx = x - h * 0.6 + t * (w + h * 1.2);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 8, y); ctx.lineTo(sx + 8 - h * 0.5, y + h); ctx.lineTo(sx - h * 0.5, y + h); ctx.fill();
}
function goldSparkles(x, y, w, h) {                    // little twinkles pop up around the hero now and then
  for (let i = 0; i < 3; i++) {
    const n = frame + i * 41, ph = n % 70; if (ph > 24) continue;
    const s = Math.floor(n / 70) * 3.7 + i * 1.9;
    const sx = x + w * (0.5 + 0.75 * Math.sin(s * 12.99)), sy = y + h * (0.5 + 0.7 * Math.sin(s * 78.23));
    const r = Math.sin(ph / 24 * Math.PI) * 5 + 0.5, q = r * 0.28;
    ctx.fillStyle = i ? '#fff' : '#fff59d';
    ctx.beginPath(); ctx.moveTo(sx, sy - r); ctx.lineTo(sx + q, sy - q); ctx.lineTo(sx + r, sy); ctx.lineTo(sx + q, sy + q);
    ctx.lineTo(sx, sy + r); ctx.lineTo(sx - q, sy + q); ctx.lineTo(sx - r, sy); ctx.lineTo(sx - q, sy - q); ctx.fill();
  }
}
function drawLook(p, id, gold = isGold()) {
  const sx = 1 / p.squash, sy = p.squash;
  const w = p.w * sx, h = p.h * sy;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  goldDraw = gold;
  if (id === 'pinch') { drawPinch(p, x, y, w, h); if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return; }
  if (p.hovering) {                                    // jet boot flames
    const f = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.fillStyle = gc('#3d5afe', '#ff8f00');            // legs
  ctx.fillRect(x + 4, y + h - 7, 8, 7); ctx.fillRect(x + w - 12, y + h - 7, 8, 7);
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6, gc('#f5f7ff', '#ffb300'));   // body
  ctx.fillStyle = gc('#2979ff', '#fff');               // chest light
  ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.7, 3, 0, 7); ctx.fill();
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00')); // ear pods
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00'));
  roundRect(x - 2, y, w + 4, h * 0.55, 12, gc('#ffffff', '#ffd740'));  // big round head
  if (gold) {                                          // ✨ shiny streak + a white highlight
    ctx.save(); ctx.beginPath(); ctx.roundRect(x - 2, y, w + 4, h * 0.55, 12); ctx.roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6); ctx.clip();
    goldShine(x - 2, y, w + 4, h * 0.9); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 3, 3, 1.6, -0.5, 0, 7); ctx.fill();
  }
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9, '#111827');  // dark visor
  const ex = x + w / 2 + p.face * 3, ey = y + h * 0.27;  // glowing eyes
  const blink = frame % 180 < 6 ? 1 : 5;
  ctx.fillStyle = '#40c4ff';
  ctx.beginPath(); ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();
  if (id !== 'normal') drawHat(id, x + w / 2, y + 1, w + 4, p.face);
  if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8);
  goldDraw = false;
}

// Hats: cx = middle of the head, top = top of the head, hw = head width, face = 1 right / -1 left
function drawHat(id, cx, top, hw, face) {
  ctx.save();

      ctx.moveTo(cx - hw * 0.34, top);

      ctx.moveTo(cx - hw * 0.42, top + 1);
      ctx.lineTo(cx - hw * 0.46, top - 14);
      ctx.lineTo(cx - hw * 0.22, top - 6);

      ctx.lineTo(cx + hw * 0.22, top - 6);

    ctx.fillStyle = '#2979ff'; ctx.beginPath(); ctx.arc(cx - hw * 0.25, top - 2, 2, 0, 7); ctx.arc(cx + hw * 0.25, top - 2, 2, 0, 7); ctx.fill();

// Captain Pinch: a small friendly crab, same size box as Robo

  }

  if (goldDraw) { ctx.save(); ctx.clip(); goldShine(cx - w * 0.46, y + h * 0.42, w * 0.92, h * 0.48); ctx.restore(); }

  ctx.fillStyle = '#ff8a80';                           // rosy cheeks
  ctx.beginPath(); ctx.arc(cx - 8, y + h * 0.7, 2.5, 0, 7); ctx.arc(cx + 8, y + h * 0.7, 2.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 1.8;    // smile
  ctx.beginPath(); ctx.arc(cx + f * 1, y + h * 0.68, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.strokeStyle = gc('#b71c1c', '#ff8f00'); ctx.lineWidth = 2.5;    // eye stalks
  ctx.beginPath(); ctx.moveTo(cx - 5, y + h * 0.5); ctx.lineTo(cx - 6, y + h * 0.3);
  ctx.moveTo(cx + 5, y + h * 0.5); ctx.lineTo(cx + 6, y + h * 0.3); ctx.stroke();
  const blink = frame % 180 < 6 ? 1 : 4;
  for (const ex of [cx - 6, cx + 6]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, y + h * 0.3, 4.5, blink + 0.5, 0, 0, 7); ctx.fill();

  ctx.closePath();

  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

  ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';

    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7; p.onGround = false;
    sfx.jump(); burst(p.x + 14, p.y + p.h, ['#7df9ff', '#fff'], 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;

function update() {
  frame++; timer++;

  if (sayT > 0) sayT--;
  if (toastT > 0) toastT--;
