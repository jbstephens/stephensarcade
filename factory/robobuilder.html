<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40;
const GRAV = 0.6, SPEED = 4.5, JUMP = 13, SPRING = 19, MAXFALL = 15;
const ROWS = 13, COLS = 60, SLOTS = 6;
const S = 0.7, GY = 60, PAL_Y = 428;          // editor zoom, where the grid starts, where the block buttons start
const EDMAX = (COLS + 5) * T - W / S;          // how far the editor can scroll

// Each slot gets its own space colors (borrowed from Robo Jump 2's planets)
const THEMES = [
  { sky: ['#12002a', '#3d0a6b'], grass: '#00e5ff', dirt: '#5e4b8b', hill: '#2a0f4a', hill2: '#3b1666', planet: '#ff4081' },
  { sky: ['#001a1a', '#0b4d4d'], grass: '#a7ffeb', dirt: '#4f7a7a', hill: '#0a3333', hill2: '#10474a', planet: '#ffd740' },
  { sky: ['#1a0020', '#5a0f5e'], grass: '#ff80ff', dirt: '#6b4f7a', hill: '#2e0a33', hill2: '#45104d', planet: '#69f0ae' },
  { sky: ['#0a1f00', '#2e5c00'], grass: '#b2ff59', dirt: '#56703a', hill: '#16330a', hill2: '#22470f', planet: '#ff4081' },
  { sky: ['#2a0a00', '#6b2a00'], grass: '#ffab40', dirt: '#7a5440', hill: '#3d1600', hill2: '#57200a', planet: '#7c4dff' },
  { sky: ['#001a33', '#1f4d80'], grass: '#80d8ff', dirt: '#5a7a99', hill: '#0d2640', hill2: '#163a5c', planet: '#ffab40' },
];
const BOSSES = [
  { type: 'blob', name: 'Glitch Gloop', look: 'glitch', hp: 3, hue: 260, glitch: true },
  { type: 'crab', name: 'Flip-Flop Pinch', look: 'flip', hp: 4, hue: 90, glitch: true },
  { type: 'ufo', name: 'Warp Saucer', look: 'warp', hp: 4, hue: 250, glitch: true },
  { type: 'cube', name: 'The Big Glitch', hp: 5, glitch: true },
  null,   // no boss: the rocket waits for you right away
];
const NAMES = ['Lava Land', 'Coin Castle', 'Glitch Zone', 'Bug Party', 'Spike City', 'Sky High', "Ben's Best Level",
  'Robo Rush', 'Jumpy Jungle', 'Warp World', 'Bouncy Town', 'Laser Lab', 'Moon Maze', 'Pixel Palace', 'Turbo Tower',
  'Danger Dash', 'Rainbow Run', 'Super Space Run', 'The Big Jump', 'Coin Rain'];
// the block buttons: [map letter, name]
const TOOLS = [['#', 'Ground'], ['=', 'Tech'], ['g', 'Glitch'], ['o', 'Coin'], ['E', 'Bytebug'], ['X', 'Blinky'], ['^', 'Spikes'],
  ['B', 'Jump Pad'], ['U', 'Up Orb'], ['D', 'Down Orb'], ['1', 'Warp IN'], ['2', 'Warp OUT'], ['C', 'Checkpt'], ['P', 'Robo'], [' ', 'Eraser']];
const ALLOWED = '#=goEX^BUD12CP ';

function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }

// ---------- Saving ----------
function blankGrid() {
  const m = [];
  for (let y = 0; y < ROWS; y++) m.push(Array(COLS).fill(y >= ROWS - 2 ? '#' : ' '));
  m[ROWS - 3][3] = 'P';
  return m;
}
function makeExample() {
  const m = blankGrid();
  const put = (r, c, s) => { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') m[r][c + i] = s[i]; };
  put(10, 7, 'o o');
  for (let x = 15; x <= 17; x++) m[11][x] = m[12][x] = ' ';   // a little hole to jump over
  put(8, 13, '======'); put(7, 14, 'o o o');
  put(10, 22, 'E');
  put(8, 26, 'gggg'); put(7, 26, 'o  o');
  put(10, 32, 'B'); put(4, 30, 'o o o');
  put(10, 36, 'C');
  put(10, 39, '^^');
  put(10, 44, 'X');
  put(10, 47, '1');
  for (let y = 1; y <= 10; y++) put(y, 50, '##');               // a tall wall: use the warp!
  put(10, 54, '2'); put(10, 56, 'o o');
  return { name: "Robo's Example", map: m.map(r => r.join('')), boss: 0 };
}
function cleanLevel(l) {
  if (!l || !Array.isArray(l.map)) return null;
  const map = [];
  for (let y = 0; y < ROWS; y++) {
    const r = String(l.map[y] || '').padEnd(COLS, ' ').slice(0, COLS);
    map.push(r.split('').map(ch => ALLOWED.includes(ch) ? ch : ' ').join(''));
  }
  const boss = Number.isInteger(l.boss) && l.boss >= 0 && l.boss < BOSSES.length ? l.boss : 0;
  return { name: typeof l.name === 'string' && l.name ? l.name.slice(0, 30) : NAMES[0], map, boss };
}
let save = { levels: Array(SLOTS).fill(null), beaten: {} };
function writeSave() { try { localStorage.setItem('roboBuilder', JSON.stringify(save)); } catch (_) {} }
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem('roboBuilder') || 'null'); } catch (_) {}
  if (s && Array.isArray(s.levels)) {
    save.levels = Array.from({ length: SLOTS }, (_, i) => cleanLevel(s.levels[i]));
    save.beaten = s.beaten && typeof s.beaten === 'object' ? s.beaten : {};
  } else {
    save.levels[0] = makeExample();   // first time: a ready-made level to play
    writeSave();
  }
}
loadSave();

// ---------- Sound ----------
let actx = null;
function wakeAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump:   () => note(400, 0, 0.15, 'sine', 0.15, 900),
  hover:  () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  coin:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  stomp:  () => note(400, 0, 0.15, 'triangle', 0.2, 100),
  spring: () => note(200, 0, 0.3, 'sine', 0.2, 900),
  ouch:   () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  check:  () => { note(660, 0, 0.1); note(880, 0.1, 0.2); },
  boss:   () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },
  bossDie: () => { for (let i = 0; i < 8; i++) note(400 - i * 40, i * 0.08, 0.15, 'sawtooth', 0.08); },
  land:   () => note(80, 0, 0.5, 'triangle', 0.25, 40),
  flip:   () => { note(300, 0, 0.25, 'sine', 0.15, 1200); note(1200, 0.05, 0.2, 'square', 0.04, 300); },
  warp:   () => { for (let i = 0; i < 6; i++) note(300 + i * 150, i * 0.04, 0.1, 'square', 0.05); },
  zap:    () => note(1800, 0, 0.08, 'square', 0.03, 200),
  win:    () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
  place:  () => note(500 + Math.random() * 300, 0, 0.06, 'square', 0.05),
  erase:  () => note(300, 0, 0.08, 'triangle', 0.1, 120),
  click:  () => note(700, 0, 0.05, 'sine', 0.12),
  clear:  () => { for (let i = 0; i < 6; i++) note(800 - i * 100, i * 0.05, 0.08, 'triangle', 0.08); },
};

// ---------- Music (a brand new bouncy building song) ----------
let musicOn = true, nextNoteTime = 0, step = 0;
const MUSIC_BPM = 132;
const CHORDS = [[60, 64, 67], [65, 69, 72], [57, 60, 64], [67, 71, 74]];
const ARP = CHORDS.flatMap(([a, b, c]) => [a, b, c, a + 12, c, b, a, b]);
const MELODY = [
  72,0,76,0, 79,0,76,0, 77,0,81,0, 79,0,0,0,  76,0,79,0, 84,0,83,81, 79,0,77,0, 76,0,0,0,
  74,0,77,0, 81,0,79,77, 76,0,79,0, 72,0,76,0, 77,0,76,74, 72,0,74,0, 76,0,74,0, 72,0,0,0,
];
const BASS = CHORDS.flatMap(([r]) => [r - 24, 0, 0, 0, r - 24, 0, r - 12, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = bossState === 'fight';
  const stepDur = 60 / (fight ? MUSIC_BPM + 25 : MUSIC_BPM) / 2, shift = fight ? -3 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length], a = ARP[step % ARP.length];
    note(midi(a + shift), t, stepDur * 0.8, 'triangle', 0.03);
    if (m) note(midi(m + shift), t, stepDur * 2.5, 'sine', 0.07);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.09);
    nextNoteTime += stepDur; step++;
  }
}

// ---------- World ----------
let state = 'title', slot = 0, ed = null, edCam = 0, tool = 0, levelCoins = 0;
let map, rows, cols, coins, enemies, springs, spikes, flag, checkpoints, player = null, respawn;
let camX = 0, particles = [], timer = 0, frame = 0, helpTimer = 0, tipTimer = 0, savedFlash = 0;
let arenaStart = 0, bossState = 'none', boss = null, shots = [], bossBanner = 0, bannerText = '', shake = 0;
let gdir = 1, orbs = [], warps = [], glitchFX = 0, confirmBox = null, cheer = '';
const CHEERS = ['You are an awesome builder!', 'What a cool level!', 'Robo LOVES your level!', 'Build another one!'];

const isSolidCh = ch => ch === '#' || ch === '=' || ch === 'W' || ch === 'g';
// Glitch blocks blink: on for 130 frames, off for 70. Every 4 columns is a different group.
const glitchT = x => (frame + Math.floor(x / 4) * 100) % 200;
const glitchOn = x => glitchT(x) < 130;
function tileSolid(tx, ty) {
  if (tx < 0 || tx >= cols) return true;
  if (ty < 0 || ty >= rows) return false;
  const ch = map[ty][tx];
  return ch === 'g' ? glitchOn(tx) : isSolidCh(ch);
}
// Finds the ground under a spot. If there is none, builds some so things never float over a hole.
function groundRow(x, y) {
  for (let r = Math.max(0, y); r < rows; r++) if (isSolidCh(map[r][x]) && map[r][x] !== 'g') return r;
  map[rows - 2][x] = map[rows - 1][x] = '#';
  return rows - 2;
}

// Turns Ben's level into a playable world (just like Robo Jump 2's loadLevel)
function loadLevel() {
  const B = BOSSES[ed.boss];
  const arena = B ? 24 : 10;
  rows = ROWS;
  cols = COLS + 2;
  map = ed.map.map(r => r.concat([' ', ' ']));
  const groundEnd = map[rows - 2].lastIndexOf('#') + 1;
  arenaStart = cols;
  cols += arena;
  map = map.map(r => r.concat(Array(arena).fill(' ')));
  for (let x = groundEnd; x < cols; x++) map[rows - 2][x] = map[rows - 1][x] = '#';
  bossState = 'none'; boss = null; shots = []; bossBanner = 0; shake = 0; glitchFX = 0;
  coins = []; enemies = []; springs = []; spikes = []; particles = []; orbs = []; warps = []; checkpoints = []; gdir = 1;
  const ins = [], cps = [];
  let out = null, start = null;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = map[y][x];
    if (ch === 'o') coins.push({ x: x * T + T / 2, y: y * T + T / 2, got: false });
    else if (ch === 'E' || ch === 'X') enemies.push({ x: x * T + 6, y: y * T + 12, w: 28, h: 28, vx: -1.2, vy: 0, dead: 0, blinky: ch === 'X', bt: Math.floor(Math.random() * 100) });
    else if (ch === 'U' || ch === 'D') orbs.push({ x: x * T + 4, y: T, w: 32, h: T * 10, dir: ch === 'U' ? -1 : 1, oy: y * T + 4 });
    else if (ch === '1') ins.push({ x, y });
    else if (ch === '2') out = { x, y };
    else if (ch === 'B') springs.push({ x, y });
    else if (ch === '^') spikes.push({ x, y });
    else if (ch === 'P') start = { x, y };
    else if (ch === 'C') cps.push({ x, y });
    if (!isSolidCh(ch)) map[y][x] = ' ';
  }
  if (!start) start = { x: 3, y: 0 };   // no Robo placed? He starts near the beginning
  springs = springs.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T + 5, y: g * T - 20, w: 30, h: 20, squish: 0 }; });
  spikes = spikes.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T, y: (g - 1) * T }; });
  if (out) {
    const gb = groundRow(out.x, out.y);
    for (const a of ins) {
      const ga = groundRow(a.x, a.y);
      warps.push({ x: a.x * T + 4, y: ga * T - 120, w: 72, h: 120, tx: out.x * T + 6, ty: gb * T - 36, ex: out.x * T + 20, ey: gb * T - 32 });
    }
  }
  const pg = groundRow(start.x, start.y);
  player = { x: start.x * T + 6, y: pg * T - 36, w: 28, h: 36, vx: 0, vy: 0, onGround: false,
             face: 1, coyote: 0, buffer: 0, jumping: false, inv: 0, squash: 1, hover: 70, hovering: false, warpCD: 0 };
  for (let i = 0; i < ROWS && overlapsSolid(player); i++) player.y -= T;   // never start inside a block
  respawn = { x: player.x, y: player.y, g: 1 };
  flag = { x: (cols - 4) * T + T / 2, y: (rows - 2) * T, drop: 600 };
  for (const c of cps) { const g = groundRow(c.x, c.y); checkpoints.push({ x: c.x * T + T / 2, y: g * T, reached: false }); }
  if (!B) { bossState = 'defeated'; flag.drop = 0; }   // no boss: the rocket is already waiting
  levelCoins = 0;
  camX = Math.max(0, player.x - W / 2);
  helpTimer = 300;
}

// ---------- Physics ----------
function overlapsSolid(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(tx, ty)) return true;
  return false;
}
function moveX(e) {
  e.x += e.vx;
  if (!overlapsSolid(e)) return false;
  if (e.vx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w;
  else e.x = (Math.floor(e.x / T) + 1) * T;
  e.vx = 0;
  return true;
}
function moveY(e, g = 1) {   // g = -1 when gravity is upside down
  e.y += e.vy;
  e.onGround = false;
  if (!overlapsSolid(e)) return;
  if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.onGround = g > 0; }
  else { e.y = (Math.floor(e.y / T) + 1) * T; e.onGround = g < 0; }
  e.vy = 0;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cs = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: camX + Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: cs[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

// ---------- Boss ----------
function startBoss() {
  const B = BOSSES[ed.boss];
  bossState = 'fight'; shots = []; helpTimer = 0; gdir = 1;
  bossBanner = 150; bannerText = 'BOSS: ' + B.name + '!';
  for (let y = 0; y < rows - 2; y++) map[y][arenaStart] = 'W';   // laser wall closes behind you
  respawn = { x: (arenaStart + 2) * T, y: (rows - 2) * T - player.h, g: 1 };
  const [w, h] = { blob: [90, 80], crab: [110, 64], ufo: [130, 56], cube: [92, 88] }[B.type];
  boss = { type: B.type, name: B.name, hp: B.hp, maxHp: B.hp, look: B.look || '', w, h, x: (arenaStart + 17) * T,
           y: B.type === 'ufo' ? -80 : -120, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, pause: 0,
           mode: 'up', modeT: 0, dying: 0, glitch: !!B.glitch, tp: 0, blink: 0 };
  sfx.boss();
}
function bossShoot(b, n) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  for (let i = 0; i < n; i++) {
    const ang = a + (i - (n - 1) / 2) * 0.35;
    shots.push({ x: cx, y: cy, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4, r: 9 });
  }
}
function updateBoss() {
  const p = player, b = boss;
  if (bossBanner > 0) bossBanner--;
  if (bossState === 'defeated' && flag.drop > 0) {
    flag.drop = Math.max(0, flag.drop - 8);
    if (flag.drop === 0) { sfx.land(); shake = 10; burst(flag.x, flag.y, ['#cfd8dc', '#fff'], 20, 4); }
  }
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffea00', '#ff9100', '#fff'], 10, 5);
    if (b.dying > 80) {
      burst(b.x + b.w / 2, b.y + b.h / 2, ['#ffea00', '#ff9100', '#fff', '#7df9ff'], 50, 8);
      boss = null; bossState = 'defeated'; shake = 20;
      bossBanner = 150; bannerText = 'You beat ' + b.name + '!';
      for (let y = 0; y < rows; y++) if (map[y][arenaStart] === 'W') map[y][arenaStart] = ' ';
      confetti();
    }
    return;
  }
  const angry = Math.min(3, b.maxHp - b.hp);
  const left = (arenaStart + 1) * T, right = cols * T;
  if (b.glitch) {   // glitchy bosses blink, then TELEPORT
    if (b.blink > 0) {
      if (--b.blink === 0) {
        burst(b.x + b.w / 2, b.y + b.h / 2, ['#ff00ff', '#00e5ff', '#fff'], 18, 5);
        let nx, tries = 0;
        do { nx = left + 40 + Math.random() * (right - left - 80 - b.w); } while (Math.abs(nx + b.w / 2 - p.x) < 220 && ++tries < 50);
        b.x = nx; sfx.warp(); glitchFX = 10;
        burst(b.x + b.w / 2, b.y + b.h / 2, ['#ff00ff', '#00e5ff', '#fff'], 18, 5);
      }
    } else if (++b.tp > Math.max(170, 300 - angry * 40)) { b.tp = 0; b.blink = 45; sfx.zap(); }
  }
  if (b.type === 'ufo') {
    b.modeT++;
    const lowY = (rows - 2) * T - b.h - 50;
    if (b.mode === 'fly') {
      b.x += b.dir * (2.5 + angry * 0.5);
      if (b.x < left + 20 || b.x + b.w > right - 20) b.dir = -b.dir;
      b.y = 100 + Math.sin(b.t * 0.05) * 15;
      if (b.t % Math.max(40, 70 - angry * 10) === 0) shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: 0, vy: 1, r: 10, bomb: true });

    if (moveX(b)) b.dir = -b.dir;
    moveY(b);
    if (b.type !== 'crab' && b.onGround && b.t % 110 === 0) { b.vy = b.type === 'cube' ? -13 : -11; }
    if (b.type !== 'crab' && b.onGround && b.vy === 0 && b.landed === false) { shake = 6; sfx.land(); }

function updateShots() {

function hurt() {

function updatePlay() {
  const p = player;
  const target = (keys.right - keys.left) * SPEED;
  p.vx += (target - p.vx) * (p.onGround ? 0.3 : 0.15);
  if (keys.right) p.face = 1; else if (keys.left) p.face = -1;

  if (jumpPressed) p.buffer = 8; else p.buffer--;
  jumpPressed = false;
  if (p.onGround) p.coyote = 6; else p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP * gdir; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7;
    sfx.jump();
    burst(p.x + 14, gdir > 0 ? p.y + p.h : p.y, ['#7df9ff', '#fff'], 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy * gdir < -5) p.vy = -5 * gdir;
  if (p.vy * gdir >= 0) p.jumping = false;
  p.vy += GRAV * gdir;
  p.vy = gdir > 0 ? Math.min(p.vy, MAXFALL) : Math.max(p.vy, -MAXFALL);

  // Hold jump while falling to hover with jet boots!
  p.hovering = !p.onGround && keys.jump && p.vy * gdir > 0 && p.hover > 0;
  if (p.hovering) {
    p.vy = gdir > 0 ? Math.min(p.vy, 0.6) : Math.max(p.vy, -0.6); p.hover--;
    if (frame % 2) particles.push({ x: p.x + 6 + Math.random() * 16, y: gdir > 0 ? p.y + p.h + 4 : p.y - 4, vx: (Math.random() - .5),
                                    vy: (2 + Math.random() * 2) * gdir, life: 14, color: frame % 4 ? '#7df9ff' : '#ffffff', size: 4 });
    if (frame % 4 === 0) sfx.hover();
  }

  for (let i = 0; i < 12 && overlapsSolid(p); i++) p.y -= 4 * gdir;   // a glitch block popped on inside Robo
  const wasInAir = !p.onGround;
  moveX(p); moveY(p, gdir);
  if (p.onGround && wasInAir) p.squash = 1.3;
  if (p.onGround) p.hover = 70;
  p.squash += (1 - p.squash) * 0.2;
  if (p.inv > 0) p.inv--;
  if (p.warpCD > 0) p.warpCD--;

  for (const c of coins) {
    if (c.got) continue;
    const dx = c.x - (p.x + p.w / 2), dy = c.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 28 * 28) {
      c.got = true; levelCoins++;
      sfx.coin();
      burst(c.x, c.y, ['#ffd740', '#fff59d'], 8, 3);
    }
  }
  for (const s of springs) {
    if (s.squish > 0) s.squish--;

      p.y = s.y - p.h; p.vy = -SPRING; p.jumping = false; s.squish = 10;
      sfx.spring();
    }
  }
  for (const s of spikes) if (overlap(p, { x: s.x + 6, y: s.y + 22, w: 28, h: 18 })) hurt();
  for (const o of orbs) if (o.dir !== gdir && overlap(p, o)) {
    gdir = o.dir; p.vy = gdir * 2; p.jumping = false; p.hover = 0; sfx.flip(); glitchFX = 6;
    burst(o.x + 16, o.oy + 16, ['#b388ff', '#00e5ff', '#fff'], 16, 4);
  }
  if (p.warpCD === 0) for (const w of warps) if (overlap(p, w)) {
    burst(p.x + 14, p.y + 18, ['#ff80ff', '#fff'], 14, 4);
    p.x = w.tx; p.y = w.ty; p.vx = 0; p.vy = 0; p.warpCD = 45; sfx.warp(); glitchFX = 8;
    burst(p.x + 14, p.y + 18, ['#ff80ff', '#00e5ff', '#fff'], 18, 4);
    break;
  }

  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.vy = Math.min(e.vy + GRAV, MAXFALL);
    const old = e.vx;
    if (moveX(e)) e.vx = -old;
    moveY(e);
    if (e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!tileSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
    }
    if (e.blinky && e.onGround && ++e.bt % 150 === 0) {   // blinky bugs teleport a few steps
      const nx = e.x + (Math.random() < 0.5 ? -1 : 1) * T * (2 + Math.floor(Math.random() * 2));
      const tx = Math.floor((nx + 14) / T), ty = Math.floor((e.y + 14) / T);
      if (!tileSolid(tx, ty) && map[ty + 1] && (map[ty + 1][tx] === '#' || map[ty + 1][tx] === '=') && Math.abs(nx - p.x) > 70) {
        burst(e.x + 14, e.y + 14, ['#e040fb', '#00e5ff'], 8, 3); e.x = nx; sfx.zap();
      }
    }
    if (e.y > rows * T + 200) e.gone = true;
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 12) {
        e.dead = 1; p.vy = -10; p.jumping = false;
        sfx.stomp();
        burst(e.x + 14, e.y + 20, ['#76ff03', '#ccff90', '#fff'], 12, 3);
      } else hurt();
    }
  }
  enemies = enemies.filter(e => !e.gone && e.dead < 30);

  for (const c of checkpoints) if (!c.reached && overlap(p, { x: c.x - 10, y: c.y - 80, w: 24, h: 80 })) {
    c.reached = true;
    respawn = { x: c.x - 14, y: c.y - p.h, g: 1 };
    sfx.check();
    burst(c.x, c.y - 70, ['#ffd740', '#fff'], 14, 3);
  }

  if (bossState === 'none' && p.x > (arenaStart + 4) * T) startBoss();
  updateBoss();
  updateShots();

  if (bossState === 'defeated' && flag.drop === 0 && overlap(p, { x: flag.x - 28, y: flag.y - 130, w: 56, h: 130 })) {
    state = 'levelDone'; timer = 0;
    sfx.win(); confetti();
    cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    save.beaten[slot] = true; writeSave();
    trophy('builderWin');
  }

  if (p.y > rows * T + 60 || p.y < -90) hurt();   // fell off the bottom (or off the top when upside down)
  if (helpTimer > 0) helpTimer--;
}

}

  ed.map[cy][cx] = ch;

}

    const dx = Math.abs(c.x - x), dy = Math.abs(c.y - y), sx = x < c.x ? 1 : -1, sy = y < c.y ? 1 : -1;

      if (x === c.x && y === c.y) break;

function updateEdit() {

// ---------- Input ----------
const keys = { left: false, right: false, jump: false };

addEventListener('keydown', e => {

  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {

addEventListener('keyup', e => {

// ---------- Main update ----------
function update() {
  frame++;
  if (pressT > 0) pressT--;
  if (glitchFX > 0) glitchFX--;
  else if (state === 'play' && frame % 300 === 0 && Math.random() < 0.3) glitchFX = 6;   // the galaxy is glitchy!
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += pt.confetti ? 0.05 : 0.2;
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);
  syncPad();

  if (state === 'title') { jumpPressed = false; return; }
  if (state === 'edit') { updateEdit(); return; }
  if (state === 'dying') {
    timer++;
    if (timer > 50) {
      Object.assign(player, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 90 }); gdir = respawn.g;
      shots = [];
      state = 'play';
    }
  } else if (state === 'levelDone') {
    timer++;
    if (timer % 90 === 0) confetti();
    if (timer > 60 && jumpPressed) toEdit();
    jumpPressed = false;
    if (state !== 'levelDone') return;
  } else if (state === 'play') {
    updatePlay();
  }
  const target = player.x + player.w / 2 - W / 2;
  const minX = bossState === 'fight' ? arenaStart * T : 0;
  camX += (Math.max(minX, Math.min(cols * T - W, target)) - camX) * 0.12;
  if (shake > 0) shake--;
}

    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.sin(frame * 0.04 + i * 1.7)})`;

}
