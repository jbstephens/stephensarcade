<script>
// RAINBOW JUMP: the secret reward game! Everybody is rainbow, the levels are rainbow,
// and the bosses from ALL of Ben's games are back... in rainbow!
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40;
const GRAV = 0.6, SPEED = 4.5, JUMP = 13, SPRING = 19, MAXFALL = 15, HOVER = 80;

// rainbow colors (real hsl() colors, so it works on the iPad too)
const hue = h => ((h % 360) + 360) % 360;
const rb = (h, l = 60, s = 95) => `hsl(${hue(h)},${s}%,${l}%)`;
// a shifting rainbow stripe gradient from (x0,y0) to (x1,y1)
function rgrad(x0, y0, x1, y1, shift = 0, l = 62) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, rb(frame * 3 + shift + i * 52, l));
  return g;
}

// ---------- Saves, trophies, coins + Bundle Room ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 90; } } catch (_) {} }   // for the Sticker Book in the Game Factory book
let stickerNew = 0;
function bankCoin(n = 1) { try { const c = JSON.parse(localStorage.getItem('gfCoins') || '{}'); c.rainbow = (c.rainbow || 0) + n; localStorage.setItem('gfCoins', JSON.stringify(c)); } catch (_) {} }   // coins for the Bundle Room in the Game Factory book
function bundleHas(j) { try { return (JSON.parse(localStorage.getItem('gfBundles') || '{}').opened || []).includes('rainbow-' + j); } catch (_) { return false; } }   // unlocked in the Bundle Room
const BUNDLE_NAMES = ['Rainbow Hat Pack', 'Magic Hat Pack', 'MEGA Unicorn Pack'];
let SAVE = { level: 0, won: 0, c: 'robo' };
try { Object.assign(SAVE, JSON.parse(localStorage.getItem('rainbowJump') || '{}') || {}); } catch (_) {}
function save() { try { localStorage.setItem('rainbowJump', JSON.stringify(SAVE)); } catch (_) {} }

// ---------- Heroes (all rainbow!) ----------
// hat = [x, y, width] of the top of the head (facing right, feet at 0,0)
const CHARS = [
  { id: 'robo',    name: 'Robo',          from: 'Robo Jump',       hat: [0, -36, 30], bundle: -1 },
  { id: 'sparks',  name: 'Sparks',        from: 'Sparks!',         hat: [8, -36, 20], bundle: -1 },
  { id: 'pages',   name: 'Pages',         from: 'Book Cat',        hat: [8, -35, 20], bundle: -1 },
  { id: 'ember',   name: 'Emberpup',      from: 'Monster Pals', hat: [2, -33, 24], bundle: -1 },
  { id: 'kit',     name: 'Ninja Kit',     from: 'Brawl Buddies',   hat: [0, -37, 22], bundle: -1 },
  { id: 'blip',    name: 'Blip',          from: 'Kart Party',      hat: [0, -28, 26], bundle: -1 },
  { id: 'zeke',    name: 'Zeke',          from: 'Kart Party',      hat: [0, -36, 26], bundle: -1 },
  { id: 'hero',    name: 'Hero Knight',   from: "Ben's Quest",     hat: [1, -41, 24], bundle: -1 },
  { id: 'unicorn', name: 'Sparkle',       from: 'MEGA Unicorn Pack', hat: [10, -35, 18], bundle: 2 },
];
const HATS = [
  { id: 'none',    name: 'No Hat',      icon: '🙂', bundle: -1 },
  { id: 'party',   name: 'Party Hat',   icon: '🎉', bundle: 0 },
  { id: 'crown',   name: 'Crown',       icon: '👑', bundle: 0 },
  { id: 'wizard',  name: 'Wizard Hat',  icon: '🧙', bundle: 1 },
  { id: 'cowboy',  name: 'Cowboy Hat',  icon: '🤠', bundle: 1 },
];
const isOpen = L => L.bundle < 0 || bundleHas(L.bundle);
let charIdx = Math.max(0, CHARS.findIndex(c => c.id === SAVE.c)), charView = 0;
if (!isOpen(CHARS[charIdx])) charIdx = 0;
charView = charIdx;
let hatIdx = 0, hatView = 0;
try {
  const saved = (JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}).rainbow;
  const k = HATS.findIndex(h => h.id === saved);
  if (k > 0 && isOpen(HATS[k])) hatIdx = k;
} catch (_) {}
hatView = hatIdx;
function saveLook() {
  SAVE.c = CHARS[charIdx].id; save();
  try { const o = JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}; o.rainbow = HATS[hatIdx].id; localStorage.setItem('gfLooks', JSON.stringify(o)); } catch (_) {}
}
function pickChar(i) {
  charView = (i + CHARS.length) % CHARS.length;
  if (isOpen(CHARS[charView]) && charView !== charIdx) { charIdx = charView; saveLook(); }
  try { sfx.coin(); } catch (_) {}
}
function pickHat(i) {
  hatView = (i + HATS.length) % HATS.length;
  if (isOpen(HATS[hatView]) && hatView !== hatIdx) { hatIdx = hatView; saveLook(); }
  try { sfx.coin(); } catch (_) {}
}

// ---------- Sound ----------
let actx = null;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump:   () => note(450, 0, 0.15, 'sine', 0.15, 1000),
  hover:  () => note(900 + Math.random() * 400, 0, 0.05, 'triangle', 0.03),
  coin:   () => { note(1047, 0, 0.08); note(1568, 0.07, 0.2); },
  stomp:  () => note(500, 0, 0.15, 'triangle', 0.2, 120),
  spring: () => note(220, 0, 0.3, 'sine', 0.2, 1100),
  ouch:   () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  check:  () => { note(660, 0, 0.1); note(880, 0.1, 0.1); note(1320, 0.2, 0.2); },
  boss:   () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(1200, 0, 0.12, 'sine', 0.1); },
  bossDie: () => { for (let i = 0; i < 10; i++) note(300 + i * 90, i * 0.07, 0.15, 'square', 0.07); },
  land:   () => note(80, 0, 0.5, 'triangle', 0.25, 40),
  warp:   () => { for (let i = 0; i < 6; i++) note(300 + i * 150, i * 0.04, 0.1, 'square', 0.05); },
  zap:    () => note(1800, 0, 0.08, 'square', 0.03, 200),
  win:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
};

// ---------- Music (an original happy rainbow song) ----------
const MUSIC_BPM = 150;   // eighth-note steps
const MELODY = [
  72,76,79,84, 83,79,76,79,  81,0,77,81, 84,0,81,0,
  79,76,72,76, 79,81,79,76,  74,0,77,76, 74,0,0,0,
  72,76,79,84, 86,84,83,79,  81,84,88,0, 86,84,81,0,
  79,81,83,84, 86,83,79,74,  72,0,79,0, 84,0,0,0,
];
const CHORDS = [[60, 64, 67], [65, 69, 72], [60, 64, 67], [55, 59, 62], [60, 64, 67], [65, 69, 72], [55, 59, 62], [60, 64, 67]];
const ARP = CHORDS.flatMap(([a, b, c]) => [a, b, c, b, a + 12, c, b, c]);
const BASS = CHORDS.flatMap(([r]) => [r - 24, 0, r - 12, 0, r - 24, 0, r - 12, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let musicOn = true, nextNoteTime = 0, step = 0;
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = bossState === 'fight';
  const stepDur = 60 / (fight ? MUSIC_BPM + 20 : MUSIC_BPM) / 2, shift = fight ? -2 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length], a = ARP[step % ARP.length];
    note(midi(a + 12 + shift), t, stepDur * 0.7, 'triangle', 0.03);
    if (m) note(midi(m + shift), t, stepDur * 1.6, 'square', 0.045);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.09);
    nextNoteTime += stepDur; step++;
  }
}

// ---------- Input ----------
const keys = { left: false, right: false, jump: false };
let jumpPressed = false;
// select screen buttons (canvas coordinates)
const CARD = i => ({ x: 12 + i * 104, y: 132, w: 96, h: 132 });
const HATBTN = i => ({ x: 230 + i * 102, y: 318, w: 92, h: 62 });
const PLAYBTN = { x: 360, y: 436, w: 240, h: 66 };
const RESTARTBTN = { x: 640, y: 446, w: 200, h: 46 };
const inBox = (mx, my, b, pad = 0) => mx >= b.x - pad && mx <= b.x + b.w + pad && my >= b.y - pad && my <= b.y + b.h + pad;
let selMsg = '', selMsgT = 0;
function wakeAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function tryPlay(fromStart) {
  if (!isOpen(CHARS[charView])) { selMsg = '🔒 Open the MEGA Unicorn Pack in the Bundle Room!'; selMsgT = 120; sfx.ouch(); return; }
  if (!isOpen(HATS[hatView])) { hatView = hatIdx; }
  totalCoins = 0;
  levelIndex = fromStart ? 0 : Math.min(SAVE.level || 0, LEVELS.length - 1);
  loadLevel(levelIndex);
}
addEventListener('keydown', e => {
  wakeAudio();
  const k = e.key;
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
  if (k === 'm' || k === 'M') { musicOn = !musicOn; return; }
  if (state === 'title') { if (k === ' ' || k === 'Enter') { state = 'select'; sfx.coin(); } return; }
  if (state === 'select') {
    if (e.repeat) return;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') pickChar(charView - 1);
    if (k === 'ArrowRight' || k === 'd' || k === 'D') pickChar(charView + 1);
    if (k === 'ArrowUp' || k === 'w' || k === 'W') pickHat(hatView - 1);
    if (k === 'ArrowDown' || k === 's' || k === 'S') pickHat(hatView + 1);
    if (k === ' ' || k === 'Enter') tryPlay(false);
    return;
  }
  if (state === 'win') { if ((k === ' ' || k === 'Enter') && timer > 60) state = 'select'; return; }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (!keys.jump) jumpPressed = true;
    keys.jump = true;
  }
  if (k === 'Enter') jumpPressed = true;
  if (k === 'Escape') { state = 'select'; keys.left = keys.right = keys.jump = false; }
  if ((k === 'r' || k === 'R') && state === 'play') loadLevel(levelIndex);
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.jump = false;
});
C.addEventListener('mousedown', e => {                 // taps (touches become mouse events)
  wakeAudio();
  const r = C.getBoundingClientRect();
  const mx = (e.clientX - r.left) * W / r.width, my = (e.clientY - r.top) * H / r.height;
  if (mx > W - 90 && my > H - 50 && state !== 'select') { musicOn = !musicOn; return; }   // tap the ♪ to turn music on/off
  if (state === 'title') { state = 'select'; sfx.coin(); return; }
  if (state === 'win') { if (timer > 60) state = 'select'; return; }
  if (state === 'levelDone') { jumpPressed = true; return; }
  if (state !== 'select') return;
  for (let i = 0; i < CHARS.length; i++) if (inBox(mx, my, CARD(i))) { if (i !== charView) pickChar(i); else tryPlay(false); return; }
  for (let i = 0; i < HATS.length; i++) if (inBox(mx, my, HATBTN(i))) { pickHat(i); return; }
  if (inBox(mx, my, PLAYBTN, 6)) { tryPlay(false); return; }
  if (SAVE.level > 0 && inBox(mx, my, RESTARTBTN, 6)) { tryPlay(true); return; }
  if (mx > W - 90 && my > H - 50) musicOn = !musicOn;
});
// ---------- Levels (built from little rainbow chunks) ----------
// Map key:  # ground   = cloud blocks   o coin   E gloop   ^ spikes   B spring   C checkpoint   P start
const ROWS = 13;
function chunk(w, f) {
  const g = Array.from({ length: ROWS }, (_, y) => Array(w).fill(y >= 11 ? '#' : ' '));
  const set = (x, y, ch) => { g[y][x] = ch; };
  const gap = (a, b) => { for (let x = a; x <= b; x++) g[11][x] = g[12][x] = ' '; };
  const col = (x, top) => { for (let y = top; y < ROWS; y++) g[y][x] = '#'; };
  const row = (a, b, y, ch = '=') => { for (let x = a; x <= b; x++) g[y][x] = ch; };
  f({ set, gap, col, row });
  return g;
}
const CHUNKS = {
  start:   () => chunk(8, ({ set, row }) => { set(2, 10, 'P'); row(4, 6, 9, 'o'); }),
  flat:    () => chunk(8, ({ set }) => { set(2, 9, 'o'); set(4, 9, 'o'); set(6, 9, 'o'); }),
  enemy:   () => chunk(10, ({ set, row }) => { set(7, 10, 'E'); row(3, 5, 8, 'o'); }),
  enemy2:  () => chunk(12, ({ set, row }) => { set(4, 10, 'E'); set(9, 10, 'E'); row(5, 8, 7, 'o'); }),
  gap2:    () => chunk(7, ({ gap, row }) => { gap(3, 4); row(2, 5, 8, 'o'); }),
  gap3:    () => chunk(8, ({ gap, row }) => { gap(3, 5); row(3, 5, 7, 'o'); }),
  gap4:    () => chunk(9, ({ gap, row }) => { gap(3, 6); row(3, 6, 7, 'o'); }),
  spikes:  () => chunk(8, ({ set, row }) => { set(3, 10, '^'); set(4, 10, '^'); row(3, 4, 7, 'o'); }),
  stairs:  () => chunk(11, ({ col, row }) => { col(2, 10); col(3, 9); col(4, 8); col(5, 8); col(6, 9); row(4, 5, 6, 'o'); }),
  float:   () => chunk(12, ({ gap, row }) => { gap(2, 9); row(4, 7, 9); row(4, 7, 7, 'o'); }),
  high:    () => chunk(12, ({ row }) => { row(2, 4, 9); row(6, 8, 7); row(6, 8, 5, 'o'); row(2, 4, 8, 'o'); }),
  pillars: () => chunk(12, ({ gap, col, set }) => { gap(2, 10); col(4, 9); col(5, 9); col(8, 10); col(9, 10); set(4, 7, 'o'); set(5, 7, 'o'); set(8, 8, 'o'); set(9, 8, 'o'); }),
  spring:  () => chunk(10, ({ set, col, row }) => { set(3, 10, 'B'); col(4, 6); col(5, 6); col(6, 6); row(4, 6, 4, 'o'); }),
  check:   () => chunk(6, ({ set }) => { set(3, 10, 'C'); }),
};
const LEVELS = [
  { name: 'Rainbow Meadow', hue: 200, boss: { type: 'blob', name: 'King Gloop', from: 'Robo Jump', hp: 3 },
    parts: ['start', 'flat', 'gap2', 'enemy', 'high', 'gap3', 'check', 'spikes', 'float', 'enemy', 'flat'] },
  { name: 'Candy Cloud Hills', hue: 320, boss: { type: 'teddy', name: 'Mecha Teddy', from: 'Sparks', hp: 4 },
    parts: ['start', 'gap2', 'stairs', 'enemy', 'float', 'spring', 'check', 'gap3', 'enemy2', 'spikes', 'flat'] },
  { name: 'Storybook Rainbow', hue: 40, boss: { type: 'worm', name: 'Bookworm King', from: 'Book Cat', hp: 4 },
    parts: ['start', 'enemy', 'pillars', 'spikes', 'high', 'check', 'float', 'gap4', 'enemy2', 'spring', 'flat'] },
  { name: 'Dragon Prism Peaks', hue: 10, boss: { type: 'dragon', name: 'Dragon King', from: "Ben's Quest", hp: 4 },
    parts: ['start', 'stairs', 'gap3', 'spring', 'enemy2', 'check', 'pillars', 'spikes', 'float', 'gap4', 'flat'] },
  { name: 'Starlight Rainbow Road', hue: 260, boss: { type: 'zorg', name: 'Emperor Zorg', from: 'Robo vs. The Aliens', hp: 5 },
    parts: ['start', 'float', 'gap4', 'enemy2', 'high', 'check', 'spring', 'pillars', 'spikes', 'float', 'enemy', 'flat'] },
  { name: 'Robo Rainbow Factory', hue: 160, boss: { type: 'king', name: 'MEGA ROBO KING', from: 'Robo Workshop', hp: 5 },
    parts: ['start', 'spikes', 'enemy2', 'stairs', 'gap4', 'check', 'spring', 'pillars', 'float', 'spikes', 'enemy2', 'flat'] },
  { name: 'The Glitchy Rainbow', hue: 290, boss: { type: 'glitch', name: 'The Rainbow Glitch', from: 'Rainbow Jump', hp: 6 },
    parts: ['start', 'gap3', 'float', 'spring', 'check', 'pillars', 'enemy2', 'spikes', 'gap4', 'flat'] },
];
for (const L of LEVELS) {   // glue the chunks together into one long map
  const rowsArr = Array.from({ length: ROWS }, () => []);
  for (const name of L.parts) { const g = CHUNKS[name](); for (let y = 0; y < ROWS; y++) rowsArr[y].push(...g[y]); }
  L.map = rowsArr.map(r => r.join(''));
}

// ---------- World ----------
let state = 'title', levelIndex = 0, totalCoins = 0, levelCoins = 0;
let map, rows, cols, coins, enemies, springs, spikes, flag, checkpoint, player, respawn;
let camX = 0, particles = [], timer = 0, frame = 0, helpTimer = 0;
const ARENA = 24;
let arenaStart = 0, bossState = 'none', boss = null, shots = [], bossBanner = 0, bannerText = '', shake = 0, glitchFX = 0;

const isSolidCh = ch => ch === '#' || ch === '=' || ch === 'W';
function tileSolid(tx, ty) {
  if (tx < 0 || tx >= cols) return true;
  if (ty < 0 || ty >= rows) return false;
  return isSolidCh(map[ty][tx]);
}
// Finds the ground under a spot. If there is none, builds some so things never float over a hole.
function groundRow(x, y) {
  for (let r = y; r < rows; r++) if (isSolidCh(map[r][x])) return r;
  map[rows - 2][x] = map[rows - 1][x] = '#';
  return rows - 2;
}

function loadLevel(i) {
  const L = LEVELS[i];
  rows = L.map.length;
  cols = L.map[0].length + 2;
  map = L.map.map(r => r.padEnd(cols, ' ').split(''));
  arenaStart = cols;   // boss arena: a flat floor at the end of the level
  cols += ARENA;
  map = map.map(r => r.concat(Array(ARENA).fill(' ')));
  for (let x = arenaStart - 2; x < cols; x++) map[rows - 2][x] = map[rows - 1][x] = '#';
  bossState = 'none'; boss = null; shots = []; bossBanner = 0; shake = 0;
  coins = []; enemies = []; springs = []; spikes = []; particles = [];
  let start = { x: 3, y: 10 }, c = null;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = map[y][x];
    if (ch === 'o') coins.push({ x: x * T + T / 2, y: y * T + T / 2, got: false });
    else if (ch === 'E') enemies.push({ x: x * T + 6, y: y * T + 12, w: 28, h: 28, vx: -1.1, vy: 0, dead: 0, hue: Math.random() * 360 });
    else if (ch === 'B') springs.push({ x, y });
    else if (ch === '^') spikes.push({ x, y });
    else if (ch === 'P') start = { x, y };
    else if (ch === 'C') c = { x, y };
    if (!isSolidCh(ch)) map[y][x] = ' ';
  }
  springs = springs.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T + 5, y: g * T - 20, w: 30, h: 20, squish: 0 }; });
  spikes = spikes.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T, y: (g - 1) * T }; });
  const pg = groundRow(start.x, start.y);
  player = { x: start.x * T + 6, y: pg * T - 36, w: 28, h: 36, vx: 0, vy: 0, onGround: false,
             face: 1, coyote: 0, buffer: 0, jumping: false, inv: 0, squash: 1, hover: HOVER, hovering: false };
  respawn = { x: player.x, y: player.y };
  flag = { x: (cols - 4) * T + T / 2, y: (rows - 2) * T, drop: 600 };
  checkpoint = null;
  if (c) { const g = groundRow(c.x, c.y); checkpoint = { x: c.x * T + T / 2, y: g * T, reached: false }; }
  levelCoins = 0;
  camX = 0;
  state = 'play';
  keys.left = keys.right = keys.jump = false; jumpPressed = false;
  helpTimer = i === 0 ? 400 : 200;
  if (i > (SAVE.level || 0)) { SAVE.level = i; save(); }
}

// ---------- Physics ----------
function overlapsSolid(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(tx, ty)) return true;
  return false;
}
function moveX(e) {
  e.x += e.vx;
  if (!overlapsSolid(e)) return false;
  if (e.vx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w;
  else e.x = (Math.floor(e.x / T) + 1) * T;
  e.vx = 0;
  return true;
}
function moveY(e) {
  e.y += e.vy;
  e.onGround = false;
  if (!overlapsSolid(e)) return;
  if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.onGround = true; }
  else e.y = (Math.floor(e.y / T) + 1) * T;
  e.vy = 0;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors === 'rainbow' ? rb(Math.random() * 360) : colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  for (let i = 0; i < 80; i++)
    particles.push({ x: camX + Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: rb(i * 45), size: 5 + Math.random() * 4, confetti: true });
}
// ---------- Bosses (from ALL the games, now rainbow!) ----------
const BOSS_SIZE = { blob: [90, 80], teddy: [100, 72], worm: [72, 92], dragon: [120, 80], zorg: [140, 60], king: [100, 110], glitch: [92, 88] };
const FLYERS = ['dragon', 'zorg'];
const MASH = ['hop', 'shoot', 'dash', 'teleport'];   // The Rainbow Glitch copies the other bosses' tricks!
const floorY = () => (rows - 2) * T;
function startBoss() {
  const B = LEVELS[levelIndex].boss;
  bossState = 'fight'; shots = []; helpTimer = 0;
  bossBanner = 150; bannerText = 'BOSS: ' + B.name + '!';
  for (let y = 0; y < rows - 2; y++) map[y][arenaStart] = 'W';   // a rainbow wall closes behind you
  respawn = { x: (arenaStart + 2) * T, y: floorY() - player.h };
  const [w, h] = BOSS_SIZE[B.type];
  boss = { type: B.type, name: B.name, hp: B.hp, maxHp: B.hp, w, h, x: (arenaStart + 16) * T,
           y: FLYERS.includes(B.type) ? -90 : -140, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, pause: 0,
           mode: FLYERS.includes(B.type) ? 'up' : B.type === 'worm' ? 'under' : 'walk', modeT: 0, dying: 0, blink: 0, mi: 0, landed: true };
  if (B.type === 'worm') boss.y = floorY() + 10;
  sfx.boss();
}
function bossShoot(b, n, speed = 3.6, spread = 0.35) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  for (let i = 0; i < n; i++) {
    const ang = a + (i - (n - 1) / 2) * spread;
    shots.push({ x: cx, y: cy, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r: 9 });
  }
}
const towardP = b => Math.sign(player.x + player.w / 2 - b.x - b.w / 2) || 1;
function walkBoss(b, speed) {   // gravity + walk, turn around at walls
  b.vy = Math.min(b.vy + GRAV, MAXFALL);
  b.vx = b.pause > 0 ? 0 : b.dir * speed;
  if (moveX(b)) b.dir = -b.dir;
  moveY(b);
  if (b.onGround && !b.landed) { shake = 6; sfx.land(); }
  b.landed = b.onGround;
}
function flyBoss(b, angry, drop) {   // fly high + attack, then come down low to rest (that's when you bop it!)
  const left = (arenaStart + 1) * T, right = cols * T, lowY = floorY() - b.h - 30;
  b.modeT++;
  if (b.mode === 'fly') {
    b.x += b.dir * (2.3 + angry * 0.4);
    if (b.x < left + 20 || b.x + b.w > right - 20) b.dir = -b.dir;
    b.y = 90 + Math.sin(b.t * 0.05) * 15;
    if (b.t % Math.max(55, 85 - angry * 10) === 0) drop(b);
    if (b.modeT > 260) { b.mode = 'down'; b.modeT = 0; }
  } else if (b.mode === 'down') {
    b.y += 3;
    if (b.y >= lowY) { b.y = lowY; b.mode = 'low'; b.modeT = 0; }
  } else if (b.mode === 'low') {
    b.x += towardP(b) * 0.6;
    b.y = lowY + Math.sin(b.t * 0.1) * 4;

  } else {
    b.y -= 3;
    if (b.y <= 90) { b.mode = 'fly'; b.modeT = 0; }
  }
}
function teleportBoss(b) {
  const left = (arenaStart + 1) * T, right = cols * T;
  burst(b.x + b.w / 2, b.y + b.h / 2, 'rainbow', 18, 5);
  let nx, n = 0; do { nx = left + 40 + Math.random() * (right - left - 80 - b.w); } while (Math.abs(nx + b.w / 2 - player.x) < 240 && ++n < 50);
  b.x = nx; sfx.warp(); glitchFX = 10;
  burst(b.x + b.w / 2, b.y + b.h / 2, 'rainbow', 18, 5);
}

function updateBoss() {
  const p = player, b = boss;
  if (bossBanner > 0) bossBanner--;
  if (bossState === 'defeated' && flag.drop > 0) {
    flag.drop = Math.max(0, flag.drop - 8);
    if (flag.drop === 0) { sfx.land(); shake = 10; burst(flag.x, flag.y, 'rainbow', 24, 4); }
  }
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, 'rainbow', 10, 5);
    if (b.dying > 80) {
      burst(b.x + b.w / 2, b.y + b.h / 2, 'rainbow', 60, 8);
      boss = null; bossState = 'defeated'; shake = 20;
      bossBanner = 150; bannerText = 'You beat ' + b.name + '!';
      for (let y = 0; y < rows; y++) if (map[y][arenaStart] === 'W') map[y][arenaStart] = ' ';
      confetti();
    }
    return;
  }
  const angry = Math.min(3, b.maxHp - b.hp);   // bosses get a bit faster as they get hurt (not too fast)
  let canTouch = true, harmless = false;
  if (b.type === 'blob') {                     // King Gloop: wobbles toward you and hops
    b.dir = towardP(b);
    walkBoss(b, 1.2 + angry * 0.3);
    if (b.onGround && b.t % 110 === 0) b.vy = -11;
  } else if (b.type === 'teddy') {             // Mecha Teddy: marches, stops, shoots 3 sparks
    walkBoss(b, 1.8 + angry * 0.3);
    if (b.pause > 0) { b.pause--; if (b.pause === 30) { bossShoot(b, 3); sfx.zap(); } }
    else if (b.onGround && b.t % Math.max(100, 140 - angry * 12) === 0) b.pause = 70;
  } else if (b.type === 'worm') {              // Bookworm King: digs under, a bump shows where he'll pop up!
    const top = floorY() - b.h;
    b.modeT++;
    if (b.mode === 'under') {
      canTouch = false; b.y = floorY() + 10;
      b.x += Math.max(-2.2, Math.min(2.2, p.x + p.w / 2 - b.x - b.w / 2));
      b.x = Math.max((arenaStart + 2) * T, Math.min((cols - 3) * T - b.w, b.x));
      if (b.modeT > 80) { b.mode = 'warn'; b.modeT = 0; sfx.zap(); }
    } else if (b.mode === 'warn') {
      canTouch = false;
      if (b.modeT > Math.max(35, 55 - angry * 6)) { b.mode = 'rise'; b.modeT = 0; }
    } else if (b.mode === 'rise') {
      harmless = true; b.y = Math.max(top, b.y - 9);
      if (b.y === top) { b.mode = 'up'; b.modeT = 0; shots.push({ x: b.x + b.w / 2, y: b.y, vx: -2, vy: -6, r: 9, bomb: true }, { x: b.x + b.w / 2, y: b.y, vx: 2, vy: -6, r: 9, bomb: true }); }
    } else if (b.mode === 'up') {
      b.y = top;
      if (b.modeT > Math.max(110, 170 - angry * 20)) { b.mode = 'sink'; b.modeT = 0; }
    } else {
      canTouch = false; b.y += 6;
      if (b.y >= floorY() + 10) { b.mode = 'under'; b.modeT = 0; }
    }
  } else if (b.type === 'dragon') {            // Dragon King: flies and drops fireballs
    flyBoss(b, angry, b => shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: 0, vy: 1, r: 10, bomb: true }));
  } else if (b.type === 'zorg') {              // Emperor Zorg: zooms around in his saucer and zaps
    flyBoss(b, angry, b => { if (b.t % 2 === 0) { bossShoot(b, 3, 3.2); sfx.zap(); } else shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: 0, vy: 1, r: 10, bomb: true }); });
  } else if (b.type === 'king' || b.type === 'glitch') {
    // MEGA ROBO KING charges (a big ! warns you), then gets DIZZY. The Rainbow Glitch mixes up everybody's tricks!
    b.modeT++;
    const g = b.type === 'glitch';
    if (b.mode === 'walk') {
      b.dir = g ? b.dir : towardP(b);
      walkBoss(b, g ? 0 : 1.3 + angry * 0.2);
      const wait = g ? Math.max(45, 70 - angry * 8) : Math.max(110, 160 - angry * 15);
      if (b.onGround && b.modeT > wait) {
        b.modeT = 0;
        const move = g ? MASH[b.mi++ % MASH.length] : 'dash';
        if (move === 'dash') { b.mode = 'warn'; b.dir = towardP(b); sfx.zap(); }
        else if (move === 'hop') { b.mode = 'hop'; b.vy = -13; b.dir = towardP(b); }
        else if (move === 'shoot') { bossShoot(b, 5, 3.2, 0.3); sfx.zap(); }
        else { b.mode = 'blink'; b.blink = 40; sfx.zap(); }
      }
    } else if (b.mode === 'warn') {
      walkBoss(b, 0);
      if (b.modeT > 50) { b.mode = 'dash'; b.modeT = 0; b.dir = towardP(b); }
    } else if (b.mode === 'dash') {
      b.vy = Math.min(b.vy + GRAV, MAXFALL);
      b.vx = b.dir * (6 + angry * 0.5);
      if (frame % 3 === 0) burst(b.x + b.w / 2 - b.dir * b.w / 2, b.y + b.h - 6, 'rainbow', 2, 2);
      if (moveX(b)) { b.mode = 'dizzy'; b.modeT = 0; shake = 14; sfx.land(); b.dir = -b.dir; }

    } else if (b.mode === 'blink') {

  // Bop the boss on the head!
  if (canTouch && overlap(p, b) && b.hurt === 0 && state === 'play') {
    if (p.vy > 0 && p.y + p.h - p.vy <= b.y + 26) {
      b.hp--; b.hurt = 70; p.vy = -12; p.jumping = false; p.hover = HOVER; shake = 12;
      sfx.bossHit();
      burst(p.x + p.w / 2, b.y, 'rainbow', 18, 5);
      if (FLYERS.includes(b.type)) { b.mode = 'up'; b.modeT = 0; }
      if (b.type === 'worm') { b.mode = 'sink'; b.modeT = 0; }
      if (b.hp <= 0) { b.dying = 1; shots = []; sfx.bossDie(); sticker('rainbow-' + b.name.toLowerCase().replace(/^the /, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')); }
    } else if (harmless) { p.vy = -13; p.jumping = false; sfx.spring(); }

}

function updateShots() {
  const p = player;
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy;
    if (s.bomb) s.vy = Math.min(s.vy + 0.25, 10);
    if (tileSolid(Math.floor(s.x / T), Math.floor((s.y + s.r) / T)) || s.y > H + 40 || s.y < -200) {
      s.gone = true; burst(s.x, s.y, 'rainbow', 8, 3);
    }
    const dx = s.x - (p.x + p.w / 2), dy = s.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < (s.r + 12) ** 2 && state === 'play' && p.inv === 0) { s.gone = true; hurt(); }
  }
  shots = shots.filter(s => !s.gone);
}
// ---------- Playing ----------
function hurt() {
  if (player.inv > 0 || state !== 'play') return;
  state = 'dying'; timer = 0;
  sfx.ouch();
  burst(player.x + 14, player.y + 18, 'rainbow', 20, 5);
}

function updatePlay() {
  const p = player;
  const target = (keys.right - keys.left) * SPEED;
  p.vx += (target - p.vx) * (p.onGround ? 0.3 : 0.15);
  if (keys.right) p.face = 1; else if (keys.left) p.face = -1;

  if (jumpPressed) p.buffer = 8; else p.buffer--;
  jumpPressed = false;
  if (p.onGround) p.coyote = 7; else p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7;
    sfx.jump();
    burst(p.x + 14, p.y + p.h, 'rainbow', 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;
  if (p.vy >= 0) p.jumping = false;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  // Hold jump while falling to float on a rainbow!
  p.hovering = !p.onGround && keys.jump && p.vy > 0 && p.hover > 0;
  if (p.hovering) {
    p.vy = Math.min(p.vy, 0.6); p.hover--;
    if (frame % 2) particles.push({ x: p.x + 6 + Math.random() * 16, y: p.y + p.h + 4, vx: (Math.random() - .5), vy: 2 + Math.random() * 2,
                                    life: 16, color: rb(frame * 8), size: 5 });
    if (frame % 6 === 0) sfx.hover();
  }

  const wasInAir = !p.onGround;
  moveX(p); moveY(p);
  if (p.onGround && wasInAir) p.squash = 1.3;
  if (p.onGround) p.hover = HOVER;
  p.squash += (1 - p.squash) * 0.2;
  if (p.inv > 0) p.inv--;
  // sparkle trail when you move
  if ((Math.abs(p.vx) > 1 || !p.onGround) && frame % 2 === 0)
    particles.push({ x: p.x + p.w / 2 - p.face * 10 + (Math.random() - .5) * 8, y: p.y + 8 + Math.random() * 24, vx: -p.face * 0.5, vy: -0.6,
                     life: 22, color: rb(frame * 6 + Math.random() * 60, 70), size: 3 + Math.random() * 3, sparkle: true });

  // Coins
  for (const c of coins) {
    if (c.got) continue;
    const dx = c.x - (p.x + p.w / 2), dy = c.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 30 * 30) {
      c.got = true; levelCoins++; totalCoins++; bankCoin();
      sfx.coin();
      burst(c.x, c.y, 'rainbow', 8, 3);
    }
  }
  // Springs (just walk or jump onto them!)
  for (const s of springs) {
    if (s.squish > 0) s.squish--;
    if (p.vy >= 0 && overlap(p, s)) {
      p.y = s.y - p.h; p.vy = -SPRING; p.jumping = false; s.squish = 10; p.hover = HOVER;
      sfx.spring(); burst(s.x + 15, s.y, 'rainbow', 10, 3);
    }
  }
  // Spikes
  for (const s of spikes) if (overlap(p, { x: s.x + 7, y: s.y + 24, w: 26, h: 16 })) hurt();
  // Rainbow gloops
  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.vy = Math.min(e.vy + GRAV, MAXFALL);
    const old = e.vx;
    if (moveX(e)) e.vx = -old;
    moveY(e);
    if (e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!tileSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
    }
    if (e.y > rows * T + 200) e.gone = true;
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 14) {
        e.dead = 1; p.vy = -10; p.jumping = false; p.hover = HOVER;

  enemies = enemies.filter(e => !e.gone && e.dead < 30);
  // Checkpoint
  if (checkpoint && !checkpoint.reached && overlap(p, { x: checkpoint.x - 14, y: checkpoint.y - 90, w: 28, h: 90 })) {
    checkpoint.reached = true;
    respawn = { x: checkpoint.x - 14, y: checkpoint.y - p.h };
    sfx.check();
    burst(checkpoint.x, checkpoint.y - 70, 'rainbow', 16, 3);
  }
  if (bossState === 'none' && p.x > (arenaStart + 4) * T) startBoss();
  updateBoss();
  updateShots();
  // The rainbow star door takes you to the next level
  if (bossState === 'defeated' && flag.drop === 0 && overlap(p, { x: flag.x - 34, y: flag.y - 130, w: 68, h: 130 })) {
    state = 'levelDone'; timer = 0;
    sfx.win(); confetti();
  }
  if (p.y > rows * T + 60) hurt();   // fell down a hole
  if (helpTimer > 0) helpTimer--;
}

function update() {
  frame++;
  if (stickerNew > 0) stickerNew--;
  if (glitchFX > 0) glitchFX--;
  if (selMsgT > 0) selMsgT--;
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += pt.confetti ? 0.05 : pt.sparkle ? 0 : 0.2;
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);
  if (particles.length > 400) particles.splice(0, particles.length - 400);

  if (state === 'title' || state === 'select') return;
  if (state === 'win') { timer++; if (frame % 90 === 0) confetti(); return; }
  if (state === 'dying') {
    timer++;
    if (timer > 45) {
      Object.assign(player, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 100, hover: HOVER });
      shots = [];
      state = 'play';
    }
  } else if (state === 'levelDone') {
    timer++;
    if (timer > 60 && jumpPressed || timer > 260) {
      levelIndex++;
      if (levelIndex >= LEVELS.length) {
        state = 'win'; timer = 0; confetti(); trophy('rainbowWin');
        SAVE.won = 1; SAVE.level = 0; save();
      } else loadLevel(levelIndex);
    }
    jumpPressed = false;
  } else if (state === 'play') updatePlay();

  const target = player.x + player.w / 2 - W / 2;
  const minX = bossState === 'fight' ? arenaStart * T : 0;
  camX += (Math.max(minX, Math.min(cols * T - W, target)) - camX) * 0.12;
  if (shake > 0) shake--;
}
// ---------- Drawing helpers ----------
function roundRect(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function ell(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function line(pts, color, w) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#2a1442'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

// ---------- Rainbow heroes ----------
// Drawn facing right with feet at (0,0), about 28 wide and 36 tall. o = { run, hover }
function drawHeroBody(id, o) {
  const G = rgrad(-18, -40, 18, 4), F = frame * 3;
  const dark = k => rb(F + k, 38), light = k => rb(F + k, 80);
  const run = o.run || 0, blink = frame % 180 < 6;
  if (o.hover) for (const fx of [-7, 7]) tri(fx - 5, 0, fx, 10 + Math.random() * 9, fx + 5, 0, rb(frame * 10 + fx * 20, 65));   // rainbow jets
