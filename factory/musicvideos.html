const W = 960, H = 540;

// ---------- Little drawing helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const frac = x => x - Math.floor(x);
const hash = (a, b = 0) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const RB = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#00b0ff', '#d500f9'];
const rb = i => RB[((Math.floor(i) % 6) + 6) % 6];
function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)));
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill(); }

function stars(I, n, seed = 1, maxY = 380) {   // twinkly stars that flash on the beat

// ---------- Sound (WebAudio, only starts after a tap) ----------
let actx = null, master = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { actx = null; } }
  if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (_) {} }
  return actx;
}
function out() {   // everything plays through one volume knob, so stopping a video goes quiet right away
  const a = audio(); if (!a) return null;
  if (!master) { master = a.createGain(); master.gain.value = 1; master.connect(a.destination); }
  return master;
}
function hush() { if (master) { try { master.disconnect(); } catch (_) {} master = null; } }
// one note, exactly like the book's Jukebox plays it (jbNote in arcade.html)
function jbNote(m, at, dur, wave, vol) {
  const a = audio(), o2 = out(); if (!a || !o2 || !m) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = wave; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g); g.connect(o2); o.start(at); o.stop(at + dur + 0.05);
}
let noiseBuf = null;
function noise(at, dur, vol, hi) {   // a "tss" for hi-hats and a "pshh" for claps
  const a = audio(), o2 = out(); if (!a || !o2) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.3), a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = hi ? 'highpass' : 'bandpass'; f.frequency.value = hi ? 7000 : 1800;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  s.connect(f); f.connect(g); g.connect(o2); s.start(at); s.stop(at + dur + 0.02);
}
function kick(at, vol = 0.32) {
  const a = audio(), o2 = out(); if (!a || !o2) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(150, at); o.frequency.exponentialRampToValueAtTime(42, at + 0.14);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.2);
  o.connect(g); g.connect(o2); o.start(at); o.stop(at + 0.25);
}

const noteNum = n => { const m = /^([A-G])(\d)$/.exec(n); return 12 * (+m[2] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]]; };

function halfStepMel(str) {   // turn [note, beats] into one slot per half-beat (0 = keep holding / rest), like the Jukebox does
  const out = []; for (const [m, len] of parseMel(str)) { out.push(m); for (let i = 1; i < Math.round(len * 2); i++) out.push(0); } return out;

  }
  const my = y + r + 7;
  ctx.strokeStyle = pupil; ctx.lineWidth = 2.5;
  if (mood === 'happy') { ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.arc(x, my - 2, r * 0.9, 0.1, Math.PI - 0.1); ctx.closePath(); ctx.fill(); ell(x, my + r * 0.45, r * 0.4, r * 0.25, '#ff8a80'); }

}
