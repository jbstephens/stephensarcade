  o.connect(g); g.connect(actx.destination);

}

  if (!actx || !musicOn) return;

  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
    if (m) note(midi(m + shift), t, stepDur * 0.85, 'square', 0.03);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.09);
    if (step % 2 === 0) note(step % 4 === 0 ? 120 : 2400, t, 0.03, step % 4 === 0 ? 'square' : 'sine', 0.015);
    nextNoteTime += stepDur; step++;
