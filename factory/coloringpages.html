<script>

const COLORS = ['#ff3b30', '#ff8a1f', '#ffd60a', '#a6e22e', '#2ecc40', '#0a7d3b', '#5ac8fa', '#1e6bff',

function titleSVG(t) {
  const n = t.length, size = Math.min(78, Math.round(1050 / Math.max(n, 1)));
  const fit = n * size * 0.7 > 740 ? ' textLength="740" lengthAdjust="spacingAndGlyphs"' : '';
  return `<text class="f" fill="#fff" x="400" y="${70 + size * 0.36}" text-anchor="middle" font-size="${size}"` +
    ` font-family="Arial Rounded MT Bold, Arial Black, Comic Sans MS, sans-serif" font-weight="900"${fit}>${t.replace(/&/g, '&amp;')}</text>`;
}
// returns { svg, count }; every colorable shape gets data-i = its number on the page
function buildSVG(pageIdx, fills) {
  const p = PAGES[pageIdx]; fills = fills || {};
  let count = 0;
  const body = (titleSVG(p.title) + p.art()).replace(/class="f" fill="#fff"/g, () => {
    const i = count++;
    return `class="f" data-i="${i}" fill="${fills[i] || W}"`;
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">` +
    `<rect x="0" y="0" width="800" height="1000" fill="#fff"/>${body}</svg>`;
  return { svg, count };
}

let undoStack = [];

let printBackup = null, printTimer = null;
function load() {
  try { const s = JSON.parse(localStorage.getItem('coloringPages') || '{}'); if (s && typeof s === 'object') fills = s; } catch (_) { fills = {}; }
}
function save() { try { localStorage.setItem('coloringPages', JSON.stringify(fills)); } catch (_) {} }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function hasTrophy() { try { return !!JSON.parse(localStorage.getItem('gfTrophies') || '{}').colorArtist; } catch (_) { return false; } }
function pageFills(id) { return fills[id] || (fills[id] = {}); }
function progress() {
  let shapes = 0, pages = 0;
  for (const id in fills) {
    const n = Object.keys(fills[id]).filter(k => fills[id][k] && fills[id][k] !== W).length;
    shapes += n; if (n) pages++;
  }
  return { shapes, pages };
}
function checkTrophy() {
  const pr = progress();
  if (pr.shapes >= 10 && pr.pages >= 5 && !hasTrophy()) {
    trophy('colorArtist');
    toast('🏆 TROPHY! You are a Color Artist! 🎨');
    return true;
  }

}

function svgEl() { return typeof document !== 'undefined' ? document.querySelector('#paper svg') : null; }
function shapeEl(i) { const s = svgEl(); return s ? s.querySelector('[data-i="' + i + '"]') : null; }
function paintEl(i, c) { const el = shapeEl(i); if (el) el.setAttribute('fill', c); }
function fillShape(i, c) {
  const id = PAGES[cur].id, pf = pageFills(id), prev = pf[i] || W;
  if (prev === c) return false;
  undoStack.push({ id, i, prev });
  if (c === W) delete pf[i]; else pf[i] = c;

}
function clearPage() {
  const id = PAGES[cur].id, pf = pageFills(id);

  undoStack.push({ id, all: Object.assign({}, pf) });

}
function magicColor() {             // ✨ colors every empty shape at once (Ben: "make it be colored")
  const id = PAGES[cur].id, pf = pageFills(id), s = svgEl(); if (!s) return;
  const bright = COLORS.filter(c => c !== W && c !== '#222222' && c !== '#9e9e9e');
  undoStack.push({ id, all: Object.assign({}, pf) });
  s.querySelectorAll('.f').forEach(el => { const i = el.dataset.i; if (i == null || pf[i]) return; const c = bright[Math.floor(Math.random() * bright.length)]; pf[i] = c; el.setAttribute('fill', c); });
