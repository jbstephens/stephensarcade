<script>
// 🤖 ROBO SAYS! — a get-up-and-move Simon Says game. Robo calls out actions; players do them in real life.
// Everything is drawn on one canvas in a 1000 x 600 "virtual" screen that is scaled to fit.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 1000, VH = 600;
let W = 1000, H = 600, SC = 1, OX = 0, OY = 0;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth || 1000; H = window.innerHeight || 600;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  SC = Math.min(W / VW, H / VH); OX = (W - VW * SC) / 2; OY = (H - VH * SC) / 2;
  SC *= dpr; OX *= dpr; OY *= dpr;
}
window.addEventListener('resize', resize); resize();

function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function loadBest() { try { const s = JSON.parse(localStorage.getItem('roboSays') || '{}'); return Math.max(0, +s.best || 0); } catch (_) { return 0; } }
function saveBest(n) { try { localStorage.setItem('roboSays', JSON.stringify({ best: n })); } catch (_) {} }

// ---------- the commands (all safe indoors: no running, no climbing) ----------
// t = what Robo says, a = how Robo acts it out
const COMMANDS = [
  { t: 'hop like King Gloop', a: 'hop', p: 'goo' },
  { t: 'meow like Sammy the cat', a: 'meow', p: 'cat' },
  { t: "do Robo's jet-boot hover on your tiptoes", a: 'hover', p: 'jet' },

  { t: 'dance like the Clone Factory robots', a: 'robot' },
  { t: 'wobble like goo', a: 'wobble', p: 'goo' },

  { t: 'fly like Captain Woof with your arms out', a: 'fly', p: 'cape' },

  { t: 'clap 5 times', a: 'clap' },

  { t: 'roar like Eggbert the dragon', a: 'roar' },
  { t: 'tiptoe like Snatcher the cat burglar', a: 'sneak', p: 'mask' },
  { t: 'wave hello to Robo', a: 'wave' },
  { t: 'wiggle your fingers', a: 'wiggle' },
  { t: 'touch your toes', a: 'toes' },
  { t: 'stretch up to the sky', a: 'stretch' },

  { t: 'laugh like a silly robot', a: 'laugh' },

  { t: 'beep your horn like a Turbo Racer', a: 'drive', p: 'kart' },
  { t: 'do a superhero pose', a: 'hero', p: 'cape' },
  { t: 'waddle like a penguin', a: 'waddle' },
  { t: 'buzz like a bee', a: 'flap', p: 'bee' },
  { t: 'balance a pretend book on your head', a: 'balance', p: 'book' },
  { t: 'lift a giant pretend weight', a: 'lift', p: 'weight' },
  { t: 'do a slow zombie walk in place', a: 'zombie' },
  { t: 'punch the air like a Brawl Buddy', a: 'punch' },
  { t: 'sway like a tree in the wind', a: 'sway' },
  { t: 'pretend to eat a giant sandwich', a: 'eat' },

  { t: 'say "beep boop!" in a robot voice', a: 'beep' },
  { t: 'be a statue', a: 'freeze' },
  { t: 'crouch down and blast off like Robo', a: 'blastoff', p: 'jet' },
  { t: 'wag your tail like Sparks', a: 'wiggle', p: 'dog' },
  { t: 'move in super slow motion', a: 'slowmo' },
  { t: 'rub your tummy like you are hungry', a: 'pat' },
  { t: 'flex your muscles', a: 'lift' },
  { t: 'hold your nose like something is stinky', a: 'nose' },
];

// ---------- levels ----------
const LEVELS = {
  easy:   { name: '🐢 Easy',   gap: 6.5, minGap: 4.6, speedUp: 0.06, trick: 0.18, trickWait: 2.0 },
  normal: { name: '🙂 Normal', gap: 5.0, minGap: 3.3, speedUp: 0.09, trick: 0.30, trickWait: 1.7 },
  turbo:  { name: '🚀 Turbo',  gap: 4.0, minGap: 2.5, speedUp: 0.11, trick: 0.33, trickWait: 1.4 },
};
const SNEAKY = ['Robo sez', 'Rabbit says', 'Robot says'];

// Build one call. rnd lets tests pass their own random numbers.
function buildCall(cmd, level, rnd = Math.random) {
  const L = LEVELS[level] || LEVELS.normal;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  if (rnd() >= L.trick) return { text: 'Robo says… ' + cmd.t + '!', say: 'Robo says, ' + cmd.t + '!', real: true, sneaky: false, cmd };
  if (level === 'turbo' && rnd() < 0.6) {
    if (rnd() < 0.3) return { text: 'Robo says… ' + cmd.t + '… just kidding!', say: 'Robo says, ' + cmd.t + '... just kidding!', real: false, sneaky: true, cmd };
    const w = SNEAKY[Math.floor(rnd() * SNEAKY.length) % SNEAKY.length];
    return { text: w + '… ' + cmd.t + '!', say: w + ', ' + cmd.t + '!', real: false, sneaky: true, cmd };
  }
  return { text: cap(cmd.t) + '!', say: cap(cmd.t) + '!', real: false, sneaky: false, cmd };
}
function gapFor(level, n) { const L = LEVELS[level] || LEVELS.normal; return Math.max(L.minGap, L.gap - L.speedUp * n); }

// ---------- players ----------
const NAMES = [
  { n: 'Ben', e: '🧒', c: '#ff5252' }, { n: 'Mom', e: '👩', c: '#ff4081' }, { n: 'Dad', e: '👨', c: '#448aff' },
  { n: 'Brother', e: '👦', c: '#00c853' }, { n: 'Grandma', e: '👵', c: '#aa00ff' }, { n: 'Grandpa', e: '👴', c: '#ff9100' },
  { n: 'Friend', e: '🧑', c: '#00b8d4' },
];

// ---------- drawing helpers ----------
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function dot(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, Math.abs(rx)), Math.max(0.1, Math.abs(ry)), rot, 0, Math.PI * 2); ctx.fill(); }
function line(x1, y1, x2, y2, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function text(s, x, y, size, color, align = 'center', outline = '#000', weight = '900') {
  ctx.font = weight + ' ' + Math.round(size) + 'px "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif';
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.lineWidth = Math.max(2, size / 7); ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function wrapLines(s, maxW, size) {   // split text into lines that fit maxW
  ctx.font = '900 ' + Math.round(size) + 'px "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif';
  const words = s.split(' '), out = []; let cur = '';
  for (const w of words) { const tryS = cur ? cur + ' ' + w : w; if (cur && ctx.measureText(tryS).width > maxW) { out.push(cur); cur = w; } else cur = tryS; }
  if (cur) out.push(cur); return out;
}

// ---------- Robo ----------
const ROBO = { legs: '#3d5afe', body: '#f5f7ff', pod: '#2979ff', head: '#ffffff', edge: '#90a4ae', eye: '#40c4ff', visor: '#111827' };
const NEGA = { legs: '#4a148c', body: '#455a64', pod: '#b71c1c', head: '#37474f', edge: '#212121', eye: '#ff1744', visor: '#000' };
function basePose() { return { x: 0, y: 0, rot: 0, sx: 1, sy: 1, la: 0.3, ra: 0.3, lh: null, rh: null, ll: 0, rl: 0, ht: 0, hy: 0, eyes: 'normal', mouth: 'smile', claws: 0, flame: 0, props: {} }; }
function handPos(s, a, h) { if (h) return [h.x, h.y]; const L = 32; return [s * 24 + s * Math.sin(a) * L, -42 + Math.cos(a) * L]; }

function drawRobo(p, t) {
  const P = p.props.nega ? NEGA : ROBO;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.sx, p.sy);
  // things behind Robo
  if (p.props.cape) { const fl = Math.sin(t * 9) * 6; ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.moveTo(-20, -54); ctx.lineTo(20, -54); ctx.lineTo(34 + fl, -2); ctx.lineTo(-34 - fl, -2); ctx.closePath(); ctx.fill(); }
  if (p.props.wings || p.props.bee) {
    const fl = Math.sin(t * (p.props.bee ? 40 : 14)) * 10, wc = p.props.bee ? 'rgba(200,240,255,.85)' : '#ffca28';
    ell(-40, -60 + fl, 26, 12, wc, -0.5 - fl * 0.02); ell(40, -60 + fl, 26, 12, wc, 0.5 + fl * 0.02);
  }
  if (p.flame > 0) for (const fx of [-9, 9]) { const f = p.flame * (14 + Math.sin(t * 40 + fx) * 5); poly([fx - 7, 0, fx + 7, 0, fx, f], '#ff9100'); poly([fx - 4, 0, fx + 4, 0, fx, f * 0.6], '#ffeb3b'); }
  if (p.props.spring) { ctx.strokeStyle = '#9e9e9e'; ctx.lineWidth = 4; ctx.beginPath(); for (let i = 0; i <= 8; i++) ctx.lineTo((i % 2 ? 10 : -10), i * 3 + 1); ctx.stroke(); }
  // legs
  rr(-15, -14 - p.ll, 11, 14, 4, P.legs); rr(4, -14 - p.rl, 11, 14, 4, P.legs);
  rr(-17, -4 - p.ll, 15, 6, 3, '#283593'); rr(2, -4 - p.rl, 15, 6, 3, '#283593');
  // body
  rr(-25, -56, 50, 44, 13, P.body, P.edge, 2); dot(0, -34, 6, P.pod); dot(0, -34, 2.5, p.props.nega ? '#ff8a80' : '#e3f2fd');
  if (p.props.bee) { ctx.fillStyle = '#212121'; ctx.fillRect(-24, -46, 48, 5); ctx.fillRect(-24, -28, 48, 5); }
  // arms
  for (const s of [-1, 1]) {
    const [hx, hy] = handPos(s, s < 0 ? p.la : p.ra, s < 0 ? p.lh : p.rh);
    line(s * 22, -44, hx, hy, P.body, 8); line(s * 22, -44, hx, hy, P.edge, 1);
    if (p.props.claws) {
      const op = 0.35 + Math.abs(Math.sin(t * 8)) * 0.5;
      dot(hx, hy, 9, '#ff5252'); ctx.fillStyle = '#fff3e0'; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.arc(hx, hy, 10, -Math.PI / 2 - op, -Math.PI / 2 + op); ctx.closePath(); ctx.fill();
    } else dot(hx, hy, 6.5, P.pod);
  }
  // head
  ctx.save(); ctx.translate(0, -58 + p.hy); ctx.rotate(p.ht); ctx.translate(0, 58);
  if (p.props.cat) { poly([-30, -110, -26, -138, -8, -118], '#ff9800'); poly([30, -110, 26, -138, 8, -118], '#ff9800'); }
  if (p.props.dog) { ell(-38, -96 + Math.sin(t * 10) * 3, 10, 22, '#8d5a2b', 0.3); ell(38, -96 - Math.sin(t * 10) * 3, 10, 22, '#8d5a2b', -0.3); }
  else { rr(-42, -100, 10, 20, 4, P.pod); rr(32, -100, 10, 20, 4, P.pod); }
  rr(-35, -120, 70, 60, 21, P.head, P.edge, 2);
  rr(-28, -112, 56, 42, 14, P.visor);
  drawFace(p, P, t);
  if (p.props.mask) { rr(-30, -104, 60, 14, 6, 'rgba(0,0,0,.85)'); dot(-11, -97, 4, P.eye); dot(11, -97, 4, P.eye); }
  if (p.props.book) { rr(-26, -136, 52, 12, 2, '#6d4c41'); rr(-24, -134, 48, 7, 1, '#fffde7'); }
  rr(-3, -132, 6, 13, 2, P.edge);
  dot(0, -134, 6, (t * 3) % 2 < 1 ? '#ff5252' : '#ffeb3b');
  ctx.restore();
  if (p.props.kart) {   // Kart Party kart (in front of the legs)
    rr(-62, -30, 124, 30, 12, '#e53935', '#b71c1c', 3); rr(-50, -40, 30, 12, 4, '#ffd740');
    for (const wx of [-42, 42]) { dot(wx, 2, 13, '#212121'); const a = t * 14; line(wx - Math.cos(a) * 8, 2 - Math.sin(a) * 8, wx + Math.cos(a) * 8, 2 + Math.sin(a) * 8, '#9e9e9e', 3); }
    text('1', 30, -16, 18, '#fff', 'center', null);
  }
  if (p.props.weight) { const [ax, ay] = handPos(-1, p.la, p.lh), [bx, by] = handPos(1, p.ra, p.rh); line(ax - 16, ay, bx + 16, by, '#616161', 5); for (const [qx, qy] of [[ax - 16, ay], [bx + 16, by]]) rr(qx - 7, qy - 18, 14, 36, 4, '#37474f'); }
  if (p.props.sandwich) { const [bx, by] = handPos(1, p.ra, p.rh); rr(bx - 18, by - 10, 36, 8, 4, '#ffcc80'); rr(bx - 19, by - 3, 38, 4, 2, '#66bb6a'); rr(bx - 18, by + 1, 36, 8, 4, '#ffcc80'); }
  ctx.restore();
}
function drawFace(p, P, t) {
  const e = P.eye; ctx.strokeStyle = e; ctx.lineWidth = 4; ctx.lineCap = 'round';
  const ey = -96;
  switch (p.eyes) {
    case 'happy': for (const sx of [-12, 12]) { ctx.beginPath(); ctx.arc(sx, ey + 2, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); } break;
    case 'closed': for (const sx of [-12, 12]) line(sx - 7, ey, sx + 7, ey, e, 4); break;
    case 'wide': for (const sx of [-12, 12]) { dot(sx, ey, 8, e); dot(sx + 2, ey - 2, 3, '#fff'); } break;
    case 'silly': dot(-12, ey, 9, e); dot(-10, ey - 3, 3, '#fff'); dot(12, ey + 1, 4, e); break;
    case 'grr': poly([-21, ey - 6, -5, ey, -21, ey + 4], e); poly([21, ey - 6, 5, ey, 21, ey + 4], e); break;
    case 'cross': dot(-6, ey, 5, e); dot(6, ey, 5, e); break;
    case 'up': for (const sx of [-12, 12]) ell(sx, ey - 4, 5, 6, e); break;
    case 'side': { const lx = Math.sin(t * 3) * 6; for (const sx of [-12, 12]) ell(sx + lx, ey, 5, 5, e); break; }
    case 'dizzy': for (const sx of [-12, 12]) { line(sx - 5, ey - 5, sx + 5, ey + 5, e, 3); line(sx + 5, ey - 5, sx - 5, ey + 5, e, 3); } break;
    default: { const b = (t % 3.2) < 0.12 ? 1 : 7; ell(-12, ey, 5, b, e); ell(12, ey, 5, b, e); }
  }
  const my = -80;
  switch (p.mouth) {
    case 'open': ell(0, my, 8, 6 + Math.abs(Math.sin(t * 9)) * 3, e); break;
    case 'roar': ell(0, my, 12, 8, '#ff1744'); break;
    case 'tongue': ctx.beginPath(); ctx.arc(0, my - 3, 9, 0.2, Math.PI - 0.2); ctx.stroke(); ell(3, my + 6, 6, 7, '#ff80ab'); break;
    case 'flat': line(-8, my, 8, my, e, 3); break;
    case 'o': ctx.beginPath(); ctx.arc(0, my, 4, 0, Math.PI * 2); ctx.stroke(); break;
    case 'none': break;
    default: ctx.beginPath(); ctx.arc(0, my - 5, 9, 0.3, Math.PI - 0.3); ctx.stroke();
  }
}

// ---------- how Robo acts out each command: ANIMS[name](pose, time) ----------
const S = Math.sin, C = Math.cos, A = Math.abs, PI = Math.PI;
const ANIMS = {
  idle(p, t) { p.y = -A(S(t * 2)) * 3; p.la = 0.3 + S(t * 2) * 0.05; p.ra = 0.3 - S(t * 2) * 0.05; },
  hop(p, t) { const h = A(S(t * 5)); p.y = -h * 50; p.sy = h < 0.15 ? 0.85 : 1.05; p.sx = 2 - p.sy; p.la = p.ra = 2.3 + h * 0.5; p.eyes = 'happy'; },
  hop1(p, t) { ANIMS.hop(p, t); p.ll = 14; p.la = p.ra = 1.6; p.rot = S(t * 3) * 0.05; },
  meow(p, t) { p.ht = S(t * 2.5) * 0.18; p.rh = { x: 22 + S(t * 6) * 6, y: -86 }; p.la = 0.4; p.eyes = 'happy'; p.mouth = (t % 1.2) < 0.5 ? 'open' : 'smile'; p.word = 'MEOW!'; },
  hover(p, t) { p.y = -24 + S(t * 4) * 6; p.flame = 1; p.la = p.ra = 1.25 + S(t * 4) * 0.1; p.eyes = 'wide'; p.props.jet = 1; },
  freeze(p, t) { p.la = 2.2; p.ra = 0.8; p.ll = 6; p.rot = 0.06; p.eyes = 'wide'; p.mouth = 'o'; p.ice = 1; },
  bark(p, t) { const b = (t % 0.7) < 0.25; p.hy = b ? -6 : 0; p.mouth = b ? 'open' : 'smile'; p.la = p.ra = 0.6; p.eyes = 'happy'; p.word = 'WOOF!'; p.wag = 1; },
  flap(p, t) { p.la = p.ra = 1.4 + S(t * 14) * 0.7; p.y = -A(S(t * 7)) * 8; p.eyes = 'happy'; p.mouth = 'open'; if (p.props.bee) p.word = 'BZZZ!'; },
  drive(p, t) { p.lh = { x: -14 + S(t * 3) * 6, y: -54 - S(t * 3) * 4 }; p.rh = { x: 14 + S(t * 3) * 6, y: -54 + S(t * 3) * 4 }; p.y = -A(S(t * 12)) * 3 - 10; p.rot = S(t * 3) * 0.08; p.eyes = 'happy'; p.wheel = 1; if ((t % 1.5) < 0.4) p.word = 'BEEP BEEP!'; },
  robot(p, t) { const k = Math.floor(t * 4) % 4; p.la = [0.2, 1.57, 2.8, 1.57][k]; p.ra = [1.57, 0.2, 1.57, 2.8][k]; p.ht = [0.15, 0, -0.15, 0][k]; p.x = [-6, 0, 6, 0][k]; p.mouth = 'flat'; p.eyes = 'wide'; },

// ---------- sound: an original groove + sound effects (WebAudio) ----------
let ac = null, master = null;
function ensureAudio() {
  try {
    if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ac = new AC(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination); }
    if (ac.state === 'suspended' && ac.resume) ac.resume();
  } catch (_) { ac = null; }
}
function tone(f, dur, type = 'square', vol = 0.15, slide = 0, when = 0) {
  if (!ac) return;
  try {
    const t0 = Math.max(ac.currentTime, when || ac.currentTime), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (_) {}
}
let noiseBuf = null;
function noise(dur, vol = 0.1, hp = 1000, when = 0) {
  if (!ac) return;
  try {
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = Math.max(ac.currentTime, when || ac.currentTime), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.02);
  } catch (_) {}
}
const SFX = {
  tap() { tone(660, 0.07, 'square', 0.08); },
  hmm() { tone(330, 0.12, 'triangle', 0.15); tone(392, 0.12, 'triangle', 0.15, 0, ac ? ac.currentTime + 0.16 : 0); },
  good() { tone(784, 0.1, 'square', 0.08); tone(1175, 0.16, 'square', 0.08, 0, ac ? ac.currentTime + 0.08 : 0); },
  gotcha() { tone(500, 0.35, 'sawtooth', 0.1, 0.5); tone(220, 0.4, 'triangle', 0.15, 2.2, ac ? ac.currentTime + 0.35 : 0); },
  out() { [523, 440, 349, 262].forEach((f, i) => tone(f, 0.18, 'square', 0.1, 0, ac ? ac.currentTime + i * 0.15 : 0)); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? 0.6 : 0.16, 'square', 0.11, 0, ac ? ac.currentTime + i * 0.14 : 0)); },
  start() { [392, 523, 659].forEach((f, i) => tone(f, 0.14, 'triangle', 0.18, 0, ac ? ac.currentTime + i * 0.1 : 0)); },
};
// "Robo Groove": 4 bars of 16 steps. Kick, snare, hats, bouncy bass and a little robot blip riff.
const BPM = 118, STEP = 60 / BPM / 4;
const BASS = [[48, 0, 0, 48, 0, 0, 55, 0, 48, 0, 0, 51, 0, 53, 0, 0], [45, 0, 0, 45, 0, 0, 52, 0, 45, 0, 0, 48, 0, 50, 0, 0],
  [41, 0, 0, 41, 0, 0, 48, 0, 41, 0, 0, 44, 0, 46, 0, 0], [43, 0, 0, 43, 0, 0, 50, 0, 43, 0, 47, 0, 50, 0, 53, 0]];
const BLIP = [0, 0, 0, 0, 0, 0, 72, 0, 0, 0, 74, 0, 0, 0, 0, 0];
let beatOn = false, beatStep = 0, beatNext = 0;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function beatTick() {
  if (!ac || !beatOn) return;
  if (beatNext < ac.currentTime) beatNext = ac.currentTime + 0.05;
  while (beatNext < ac.currentTime + 0.12) {
    const s = beatStep % 16, bar = Math.floor(beatStep / 16) % 4, t = beatNext;
    if (s === 0 || s === 8 || s === 10) tone(110, 0.16, 'sine', 0.45, 0.35, t);
    if (s === 4 || s === 12) noise(0.12, 0.22, 1500, t);
    if (s % 2 === 0) noise(0.03, 0.06, 7000, t); else if (s === 15) noise(0.1, 0.05, 6000, t);
    const b = BASS[bar][s]; if (b) tone(midi(b), 0.14, 'square', 0.09, 0, t);
    if (BLIP[s] && bar % 2 === 1) tone(midi(BLIP[s] + (bar === 3 ? 3 : 0)), 0.08, 'triangle', 0.08, 0, t);
    beatStep++; beatNext += STEP;
  }
}
function beat(on) { if (on && !beatOn) { beatStep = 0; beatNext = ac ? ac.currentTime + 0.05 : 0; } beatOn = on; }

// ---------- Robo's voice ----------
function speak(s) {
  try {
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') return;
    speechSynthesis.cancel();
    const clean = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/…/g, '... ');
    const u = new SpeechSynthesisUtterance(clean); u.pitch = 1.6; u.rate = 1.05; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (_) {}
}
function hush() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (_) {} }

// ---------- game state ----------
const G = {
  scene: 'title', mode: 'solo', level: 'normal', picked: [0], players: [], paused: false,
  phase: 'hush', pt: 0, count: 0, streak: 0, best: loadBest(), newBest: false, call: null, deck: [],
  anim: 'dance', animT: 0, props: {}, marked: [], winner: null, msg: '', msgT: 0, time: 0, nice: 0,
};
let confetti = [];

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function nextCmd() { if (!G.deck.length) G.deck = shuffle(COMMANDS.slice()); return G.deck.pop(); }
function setAnim(name, props) { G.anim = ANIMS[name] ? name : 'idle'; G.animT = 0; G.props = Object.assign({}, props || {}); }
function alive() { return G.players.filter(p => !p.out); }
function say(s, t = 2.2) { G.msg = s; G.msgT = t; }

function startGame() {
  ensureAudio();
  const pick = G.picked.slice(0, 4);
  G.mode = (G.mode === 'party' && pick.length >= 2) ? 'party' : 'solo';
  G.players = (G.mode === 'party' ? pick : pick.slice(0, 1)).map(i => ({ n: NAMES[i].n, e: NAMES[i].e, c: NAMES[i].c, out: false }));
  if (G.anon && G.mode === 'solo') G.players = [];   // "Just play!" from the title: no names needed
  G.count = 0; G.streak = 0; G.newBest = false; G.winner = null; G.paused = false; G.deck = [];
  confetti = []; G.scene = 'play'; SFX.start(); speak('Get ready! Only do it if Robo says, Robo says!');
  startHush(2.6);
}
function startHush(extra = 0) { G.phase = 'hush'; G.pt = -extra; beat(false); setAnim('think'); if (!extra) SFX.hmm(); }
function startCall() {
  const cmd = nextCmd();
  G.call = buildCall(cmd, G.level);
  G.phase = 'call'; G.pt = 0; setAnim(cmd.a, cmd.p ? { [cmd.p]: 1 } : null);
  speak(G.call.say); beat(true);
}
function callLength() {   // long enough for Robo to finish talking, then shorter as the round goes on
  const talk = G.call ? G.call.say.length * 0.055 : 0;
  return G.call && !G.call.real ? Math.max(LEVELS[G.level].trickWait, talk + 0.6) : Math.max(gapFor(G.level, G.count), talk + 1.2);
}
function gotchaLine() {
  const c = G.call; if (!c) return "…I didn't say Robo says! 😜";
  if (c.sneaky && /just kidding/.test(c.text)) return 'Just kidding means DON\'T do it! 😜';
  if (c.sneaky) return 'I said "' + c.text.split('…')[0] + '"… not Robo says! 😜';
  return "…I didn't say Robo says! 😜";
}
function startGotcha() { G.phase = 'gotcha'; G.pt = 0; beat(false); setAnim('gotcha'); SFX.gotcha(); speak(gotchaLine()); }

function update(dt) {
  G.time += dt; G.animT += dt; if (G.msgT > 0) G.msgT -= dt; if (G.nice > 0) G.nice -= dt;
  beatTick();
  for (const c of confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 260 * dt; c.rot += c.vr * dt; }
  confetti = confetti.filter(c => c.y < VH + 40);
  if (G.scene !== 'play' || G.paused) return;
  G.pt += dt;
  if (G.phase === 'hush' && G.pt >= (G.level === 'turbo' ? 0.75 : 1.0)) startCall();
  else if (G.phase === 'call' && G.pt >= callLength()) {
    if (G.call.real) { G.count++; G.streak++; G.nice = 0.9; SFX.good(); startHush(); }
    else startGotcha();
  } else if (G.phase === 'gotcha' && G.pt >= 2.6) {
    G.marked = []; G.scene = G.mode === 'party' ? 'whoMoved' : 'soloAsk'; setAnim('laugh');
    speak(G.mode === 'party' ? 'Who moved?' : 'Did you move? Be honest!');
  }
}

// ---------- choices ----------
function toggleMark(i) { const k = G.marked.indexOf(i); if (k >= 0) G.marked.splice(k, 1); else G.marked.push(i); SFX.tap(); }
function doneMarking() {
  const live = G.players.filter(p => !p.out);
  const outs = G.marked.map(i => G.players[i]).filter(p => p && !p.out);
  G.marked = [];
  if (outs.length && outs.length >= live.length) { say('Everybody moved! Everyone stays in! 😂'); speak('Everybody moved! Everyone stays in!'); }
  else if (outs.length) { outs.forEach(p => p.out = true); SFX.out(); speak(outs.map(p => p.n).join(' and ') + (outs.length > 1 ? ' are' : ' is') + ' out! Good try!'); say(outs.map(p => p.e + ' ' + p.n).join(', ') + ' out!'); }
  else { say('Nobody moved! Great listening! 🎉'); speak('Nobody moved! Great listening!'); }
  const left = alive();
  if (left.length === 1) { finish(left[0]); return; }
  G.count++; G.scene = 'play'; startHush(1.2);
}
function soloAnswer(moved) {
  SFX.tap();
  if (moved) { finish(null); return; }
  G.streak++; G.count++; say('Super listening! 😎'); speak('Super listening!'); G.scene = 'play'; startHush(1.0);
}
function finish(winner) {
  G.scene = 'over'; G.winner = winner; beat(false); G.paused = false;
  if (G.mode === 'solo') { if (G.streak > G.best) { G.best = G.streak; G.newBest = true; saveBest(G.best); } speak('Great game! Your streak was ' + G.streak + '!' + (G.newBest ? ' New best!' : '')); }
  else speak(winner.n + ' wins! Hooray!');
  trophy('roboSays'); SFX.win(); setAnim('cheer'); burst(80);
}
function burst(n) {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb', '#ff9100'];
  for (let i = 0; i < n; i++) confetti.push({ x: 200 + Math.random() * 600, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 240, vy: Math.random() * 120, c: cols[i % cols.length], r: 5 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10 });
