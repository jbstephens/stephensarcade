function note(freq, start, dur, wave = 'square', vol = 0.1, slideTo = null) {

  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

function playMusic() {

// Build every room: a border of trees/rocks/walls with gaps where you can walk to the next room
for (const [id, r] of Object.entries(ROOMS)) {
  r.id = id;
  if (!r.open) {
    const [x, y] = id.split(',').map(Number);
    r.open = { up: !!ROOMS[`${x},${y - 1}`], down: !!ROOMS[`${x},${y + 1}`], left: !!ROOMS[`${x - 1},${y}`], right: !!ROOMS[`${x + 1},${y}`] };
    r.gx = x; r.gy = y;
  }
  r.ground = r.ground || 'grass';
  r.tiles = [];
  for (let ty = 0; ty < ROWS; ty++) {
    const row = [];
    for (let tx = 0; tx < COLS; tx++) {
      let ch;
      if (ty === 0) ch = r.open.up && tx >= 10 && tx <= 13 ? 'o' : r.border;
      else if (ty === ROWS - 1) ch = r.open.down && tx >= 10 && tx <= 13 ? 'o' : r.border;
      else if (tx === 0) ch = r.open.left && ty >= 4 && ty <= 6 ? 'o' : r.border;
      else if (tx === COLS - 1) ch = r.open.right && ty >= 4 && ty <= 6 ? 'o' : r.border;
      else ch = (r.map[ty - 1] || '')[tx - 1] || '.';
      if (ch === 'o') ch = r.ground === 'dungeon' ? '_' : r.ground === 'cave' ? '.' : ':';
      row.push(ch);
    }
    r.tiles.push(row);
  }
}

// ---------- Game state ----------
let state = 'title', frame = 0, room = null, enemies = [], drops = [], shots = [], particles = [];

let swordHint = false;
let respawnAt = { room: '1,2', tx: 12, ty: 6.5 };   // moves to the temple once you get inside

function newGame() {
  player = { x: 12 * T, y: 6.5 * T, dir: 'down', hp: 6, maxHp: 6, gems: 0, key: false, sword: false,
             swing: 0, swingId: 0, inv: 0, kx: 0, ky: 0, walk: 0, crystal: false };
  bossDead = false;
  respawnAt = { room: '1,2', tx: 12, ty: 6.5 };

  state = 'play';
  say('Welcome, hero! The evil Dragon stole the Crystal of Light and hid it in the Old Temple. Go get it back! (Hint: visit the cave in the top-left corner first!)');
}
let bossDead = false;

function say(text) { message = text; msgDelay = 20; sfx.talk(); }

function tileAt(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return null;
  return room.tiles[ty][tx];
}
function blocked(px, py, flying) {
  const ch = tileAt(px, py);
  if (ch === null) return false;
  if (flying && (ch === 'W' || ch === 'b')) return false;
  return SOLID.has(ch);
}
function boxBlocked(x, y, half, flying, edgesSolid) {
  for (const [dx, dy] of [[-half, -half], [half, -half], [-half, half], [half, half]]) {
    const px = x + dx, py = y + dy;
    if (edgesSolid && (px < T || py < T || px > W - T || py > ROWS * T - T)) {
      if (tileAt(px, py) === null || SOLID.has(tileAt(px, py))) return true;
    }
    if (blocked(px, py, flying)) return true;
  }
  return false;
}
function moveEntity(e, dx, dy, half, flying, edgesSolid) {
  let hitWall = false;
  if (dx && !boxBlocked(e.x + dx, e.y, half, flying, edgesSolid)) e.x += dx; else if (dx) hitWall = true;
  if (dy && !boxBlocked(e.x, e.y + dy, half, flying, edgesSolid)) e.y += dy; else if (dy) hitWall = true;
  return hitWall;
}

function enterRoom(id, tx, ty) {
  room = ROOMS[id];
  if (id === 'd1' && respawnAt.room !== 'd1') respawnAt = { room: 'd1', tx: 12, ty: 9.3 };
  visited.add(id);
  player.x = tx * T; player.y = ty * T;
  enemies = []; drops = []; shots = []; boss = null;
  const free = [];
  for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
    const ch = room.tiles[y][x];
    if (!SOLID.has(ch) && ch !== 'C' && ch !== 'd' && Math.hypot(x + 0.5 - tx, y + 0.5 - ty) > 6) free.push([x, y]);
  }
  for (const [type, n] of room.enemies) for (let i = 0; i < n && free.length; i++) {
    const [x, y] = free.splice(Math.floor(Math.random() * free.length), 1)[0];
    enemies.push(makeEnemy(type, x * T + T / 2, y * T + T / 2));
  }
  mapPiece = id === '1,2' && !hasMapPiece() ? { x: 22 * T, y: 9 * T } : null;
  if (room.id === 'cave' && !player.sword) drops.push({ x: 12 * T, y: 5.5 * T, type: 'sword', t: 0, forever: true });
  if (room.boss && !bossDead) {
    boss = { x: W / 2, y: 3 * T, hp: 6, maxHp: 6, hurt: 0, t: 0, lastHit: -1 };
    say('ROARRR! I am the Dragon King! You will never get the Crystal of Light!');
    sfx.roar();
  }
  if (room.boss && bossDead && !player.crystal) drops.push({ x: W / 2, y: 5.5 * T, type: 'crystal', t: 0, forever: true });
}

function makeEnemy(type, x, y) {
  const hp = { slime: 1, bat: 1, orc: 2, skeleton: 2 }[type];
  return { type, x, y, hp, dx: 0, dy: 0, t: Math.floor(Math.random() * 60), hurt: 0, kx: 0, ky: 0, lastHit: -1 };
}

// ---------- Player actions ----------
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function frontTile() {
  const [dx, dy] = DIRS[player.dir];
  const tx = Math.floor((player.x + dx * 26) / T), ty = Math.floor((player.y + dy * 26) / T);
  return [tx, ty, room.tiles[ty] && room.tiles[ty][tx]];
}
function swordBox() {
  const [dx, dy] = DIRS[player.dir];
  const cx = player.x + dx * 30, cy = player.y + dy * 30;
  return { x: cx - (dx ? 22 : 26), y: cy - (dy ? 22 : 26), w: dx ? 44 : 52, h: dy ? 44 : 52 };
}
const inBox = (b, x, y, r = 14) => x + r > b.x && x - r < b.x + b.w && y + r > b.y && y - r < b.y + b.h;

function interact() {
  const [tx, ty, ch] = frontTile();
  if (ch === 'I') { say(room.sign); return true; }
  if (ch === 'O') {
    say(player.sword ? 'Good luck, hero! Cut bushes with your sword to find gems and hearts!'
                     : 'Hello, brave hero! It is dangerous out there. Take this SWORD! Walk over to pick it up.');
    return true;
  }
  if (ch === 'X') {
    room.tiles[ty][tx] = 'x';
    const what = room.chest;
    sfx.item();
    if (what === 'heart') { player.maxHp += 2; player.hp = player.maxHp; say('You found a BIG HEART! You have one more heart now! ❤️'); }
    if (what === 'gems') { player.gems += 20; say('You found 20 GEMS! 💎'); }
    if (what === 'key') { player.key = true; say('You found the TEMPLE KEY! 🗝️ Now go open the Old Temple door!'); }
    return true;
  }
  if (ch === 'D') {
    if (player.key) {
      for (const r of room.tiles) for (let i = 0; i < r.length; i++) if (r[i] === 'D') r[i] = 'd';
      sfx.door(); say('You unlocked the temple door! Be brave in there...');
    } else say('The door is locked. You need a KEY!');
    return true;
  }
  return false;
}

function hurtPlayer(dmg, fromX, fromY) {
  if (player.inv > 0) return;
  player.hp -= dmg; player.inv = 70; sfx.ouch();
  const d = Math.hypot(player.x - fromX, player.y - fromY) || 1;
  player.kx = (player.x - fromX) / d * 7; player.ky = (player.y - fromY) / d * 7;
  if (player.hp <= 0) { state = 'dead'; msgDelay = 40; }
}

function burst(x, y, colors, n = 12, power = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 7, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30 + Math.random() * 20, color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function dropLoot(x, y) {
  const r = Math.random();
  if (r < 0.3) drops.push({ x, y, type: 'heart', t: 0 });
  else if (r < 0.75) drops.push({ x, y, type: 'gem', t: 0 });
}

// ---------- Update ----------
function updatePlay() {
  const p = player;
  // Walk
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.a) mx = -1; else if (keys.ArrowRight || keys.d) mx = 1;
  if (keys.ArrowUp || keys.w) my = -1; else if (keys.ArrowDown || keys.s) my = 1;
  if (p.swing === 0) {
    if (mx) p.dir = mx < 0 ? 'left' : 'right';
    if (my && !mx) p.dir = my < 0 ? 'up' : 'down';
  }
  const sp = p.swing > 0 ? 1.2 : 3;
  if (mx && my) { mx *= 0.71; my *= 0.71; }
  moveEntity(p, mx * sp + p.kx, my * sp + p.ky, 12, false, false);
  p.kx *= 0.8; p.ky *= 0.8;
  if (mapPiece && Math.hypot(p.x - mapPiece.x, p.y - mapPiece.y) < 32) {     // found the Treasure Map piece!
    burst(mapPiece.x, mapPiece.y, ['#e6c88e', '#fff59d', '#d32f2f', '#fff'], 24, 4);
    mapPiece = null; mapCount = foundMapPiece(); mapBanner = 150;
    [523, 659, 784, 1047, 880, 1047, 1319].forEach((f, i) => note(f, i * 0.09, 0.2, 'triangle', 0.12));
  }
  if (mx || my) p.walk++;
  if (p.inv > 0) p.inv--;

  // Sword / talk
  if (p.swing > 0) p.swing--;
  if (action() && p.swing === 0) {
    if (!interact()) {
      if (p.sword) { p.swing = 14; p.swingId++; sfx.swing(); }
      else if (!swordHint) { swordHint = true; say("You don't have a sword yet! Visit the old man in the cave (top-left of the village)."); }
    }
  }
  if (p.swing > 4) {
    const sb = swordBox();
    // cut bushes
    for (let ty = Math.floor(sb.y / T); ty <= Math.floor((sb.y + sb.h) / T); ty++)
      for (let tx = Math.floor(sb.x / T); tx <= Math.floor((sb.x + sb.w) / T); tx++)
        if (room.tiles[ty] && room.tiles[ty][tx] === 'b') {
          room.tiles[ty][tx] = '.'; sfx.cut();
          burst(tx * T + 20, ty * T + 20, ['#7cb342', '#aed581'], 10, 3);
          if (Math.random() < 0.35) dropLoot(tx * T + 20, ty * T + 20);
        }
    // knock away fireballs
    for (const s of shots) if (inBox(sb, s.x, s.y, 8)) { s.gone = true; burst(s.x, s.y, ['#ffab40', '#fff'], 6, 2); }
  }

  // Enemies
  for (const e of enemies) {
    e.t++;
    if (e.hurt > 0) e.hurt--;
    const ddx = p.x - e.x, ddy = p.y - e.y, dist = Math.hypot(ddx, ddy) || 1;
    if (e.type === 'slime') {
      if (e.t % 60 === 0) { const d = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]][Math.floor(Math.random() * 5)]; e.dx = d[0] * 0.9; e.dy = d[1] * 0.9; }
    } else if (e.type === 'bat') {
      if (e.t % 25 === 0) { const a = Math.random() * 7; e.dx = Math.cos(a) * 2; e.dy = Math.sin(a) * 2; }
    } else if (e.type === 'orc') {
      if (dist < 220) { e.dx = ddx / dist * 1.3; e.dy = ddy / dist * 1.3; }
      else if (e.t % 70 === 0) { const a = Math.random() * 7; e.dx = Math.cos(a); e.dy = Math.sin(a); }
    } else if (e.type === 'skeleton') {
      if (e.t % 45 === 0) {
        if (dist < 260 && Math.random() < 0.6) { e.dx = ddx / dist * 1.7; e.dy = ddy / dist * 1.7; }
        else { const d = [[1, 0], [-1, 0], [0, 1], [0, -1]][Math.floor(Math.random() * 4)]; e.dx = d[0] * 1.6; e.dy = d[1] * 1.6; }
      }
    }
    if (moveEntity(e, e.dx + e.kx, e.dy + e.ky, 13, e.type === 'bat', true)) { e.dx = -e.dx; e.dy = -e.dy; }
    e.kx *= 0.8; e.ky *= 0.8;
    if (p.swing > 4 && e.lastHit !== p.swingId && inBox(swordBox(), e.x, e.y)) {
      e.lastHit = p.swingId; e.hp--; e.hurt = 15; sfx.hit();
      const [dx, dy] = DIRS[p.dir]; e.kx = dx * 9; e.ky = dy * 9;
      if (e.hp <= 0) { e.dead = true; sfx.poof(); burst(e.x, e.y, ['#fff', '#b0bec5', '#ffd740'], 14, 3); dropLoot(e.x, e.y); }
    }
    if (!e.dead && dist < 26) hurtPlayer(1, e.x, e.y);
  }
  enemies = enemies.filter(e => !e.dead);

  // Dragon boss
  if (boss) {
    const b = boss;
    b.t++;
    if (b.hurt > 0) b.hurt--;
    b.x = W / 2 + Math.sin(b.t * 0.018) * 300;
    b.y = 3.2 * T + Math.sin(b.t * 0.045) * 40 + (b.hp < 3 ? Math.sin(b.t * 0.02) * 60 + 40 : 0);
    const rate = b.hp < 3 ? 85 : 115;
    if (b.t % rate === 0) {
      const a = Math.atan2(p.y - b.y, p.x - b.x);
      for (const off of [-0.3, 0, 0.3]) shots.push({ x: b.x, y: b.y + 30, vx: Math.cos(a + off) * 2.6, vy: Math.sin(a + off) * 2.6 });
      sfx.fire();
    }
    if (p.swing > 4 && b.lastHit !== p.swingId && b.hurt === 0) {
      const sb = swordBox();
      if (sb.x < b.x + 50 && sb.x + sb.w > b.x - 50 && sb.y < b.y + 40 && sb.y + sb.h > b.y - 40) {
        b.lastHit = p.swingId; b.hp--; b.hurt = 40; sfx.hit(); sfx.roar();
        if (Math.random() < 0.6) drops.push({ x: 3 * T + Math.random() * 18 * T, y: 8 * T, type: 'heart', t: 0 });   // a little help
        burst(b.x, b.y, ['#ff5252', '#ffd740', '#fff'], 16, 4);
        if (b.hp <= 0) {
          bossDead = true; boss = null; shots = []; sticker('quest-dragon-king');
          for (let i = 0; i < 5; i++) burst(b.x + (Math.random() - .5) * 80, b.y + (Math.random() - .5) * 60, ['#ff5252', '#ffd740', '#fff', '#ff9100'], 20, 6);
          drops.push({ x: W / 2, y: 5.5 * T, type: 'crystal', t: 0, forever: true });
          say('You defeated the Dragon King!!! Grab the Crystal of Light! ✨');
          sfx.item();
        }
      }
    }
    if (boss && Math.abs(p.x - b.x) < 55 && Math.abs(p.y - b.y) < 45) hurtPlayer(1, b.x, b.y);
  }
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy;
    if (s.x < 0 || s.x > W || s.y < 0 || s.y > ROWS * T) s.gone = true;
    if (!s.gone && Math.hypot(s.x - p.x, s.y - p.y) < 20) { s.gone = true; hurtPlayer(1, s.x, s.y); }
  }
  shots = shots.filter(s => !s.gone);

  // Pick things up
  for (const d of drops) {
    d.t++;
    if (Math.hypot(d.x - p.x, d.y - p.y) < 26) {
      d.gone = true;
      if (d.type === 'gem') { p.gems++; sfx.gem(); }
      if (d.type === 'heart') { p.hp = Math.min(p.maxHp, p.hp + 2); sfx.heart(); }
      if (d.type === 'sword') { p.sword = true; sfx.item(); say('You got the SWORD! ⚔️ Press SPACE to swing it!'); }
      if (d.type === 'crystal') { p.crystal = true; sfx.win(); state = 'win'; trophy('questWin'); msgDelay = 60; }
    }
    if (!d.forever && d.t > 600) d.gone = true;
  }
  drops = drops.filter(d => !d.gone);

  // Doors, cave and room edges
  const here = tileAt(p.x, p.y);
  if (here === 'C') return changeRoom('cave', 12, 9);
  if (here === 'd') return changeRoom('d1', 12, 9.3);
  let dir = null;
  if (p.x < 4) dir = 'left'; else if (p.x > W - 4) dir = 'right';
  else if (p.y < 4) dir = 'up'; else if (p.y > ROWS * T - 4) dir = 'down';
  if (dir) {
    if (room.exits && room.exits[dir]) { const e = room.exits[dir]; changeRoom(e.room, e.tx, e.ty); }
    else {
      const [dx, dy] = DIRS[dir], id = `${room.gx + dx},${room.gy + dy}`;
      if (ROOMS[id]) changeRoom(id, dir === 'left' ? 23.3 : dir === 'right' ? 0.7 : p.x / T, dir === 'up' ? 10.3 : dir === 'down' ? 0.7 : p.y / T);
    }
  }
}

function changeRoom(id, tx, ty) {
  pendingRoom = [id, tx, ty];
  fade = 24;
  state = 'fade';
}

function update() {
  frame++;
  if (stickerNew > 0) stickerNew--;
  if (mapBanner > 0) mapBanner--;
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.94; pt.vy *= 0.94; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);
  if (msgDelay > 0) msgDelay--;

  if (state === 'title') { if (action()) newGame(); }
  else if (state === 'fade') {
    fade--;
    if (fade === 12) { enterRoom(...pendingRoom); }
    if (fade <= 0) state = 'play';
  }
  else if (state === 'play') {
    if (message) { if (action() && msgDelay === 0) message = null; }
    else updatePlay();
  }
  else if (state === 'dead') {
    if (action() && msgDelay === 0) {
      player.hp = player.maxHp; player.inv = 60; state = 'play'; message = null;
      enterRoom(respawnAt.room, respawnAt.tx, respawnAt.ty);
      say(respawnAt.room === 'd1' ? "Phew! You're back at the temple entrance with full hearts. The dragon is just ahead. You can do it!"
                                  : "Phew! You woke up back in the village. You still have all your stuff. Try again!");
    }
  }
  else if (state === 'win') {
    if (frame % 40 === 0) burst(Math.random() * W, Math.random() * 300 + 50, ['#ffd740', '#69f0ae', '#40c4ff', '#ff4081', '#fff'], 20, 4);
    if (action() && msgDelay === 0) location.reload();   // fresh world for a new adventure
  }
  pressed.clear();
}

// ---------- Drawing ----------
function roundRect(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function drawHeart(x, y, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.moveTo(x, y + 6);
  ctx.bezierCurveTo(x, y + 2, x - 10, y - 2, x - 10, y + 6); ctx.bezierCurveTo(x - 10, y + 12, x, y + 16, x, y + 20);
  ctx.bezierCurveTo(x, y + 16, x + 10, y + 12, x + 10, y + 6); ctx.bezierCurveTo(x + 10, y - 2, x, y + 2, x, y + 6);
  ctx.fill();
}
function drawGem(x, y, s = 1) {
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath(); ctx.moveTo(x, y - 9 * s); ctx.lineTo(x + 7 * s, y - 2 * s); ctx.lineTo(x, y + 10 * s); ctx.lineTo(x - 7 * s, y - 2 * s); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.moveTo(x, y - 9 * s); ctx.lineTo(x + 3 * s, y - 2 * s); ctx.lineTo(x - 3 * s, y - 2 * s); ctx.fill();
}
function drawSwordIcon(x, y, a = -0.8) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = '#e0e0e0'; ctx.fillRect(-3, -26, 6, 24);
  ctx.fillStyle = '#ffd740'; ctx.fillRect(-9, -3, 18, 5);
  ctx.fillStyle = '#6d4c41'; ctx.fillRect(-2, 2, 4, 9);
  ctx.restore();
}
function drawKey(x, y) {
  circle(x - 6, y, 6, '#ffd740'); circle(x - 6, y, 2.5, '#5d4037');
  ctx.fillStyle = '#ffd740'; ctx.fillRect(x - 1, y - 2, 16, 4); ctx.fillRect(x + 10, y, 3, 6); ctx.fillRect(x + 5, y, 3, 5);
}

const GROUND = { grass: '#7cc35a', cave: '#4e342e', dungeon: '#5d5d6e' };
function drawTile(ch, tx, ty) {
  const x = tx * T, y = ty * T, seed = (tx * 7 + ty * 13) % 5;
  const base = GROUND[room.ground];
  ctx.fillStyle = base; ctx.fillRect(x, y, T, T);
  if (room.ground === 'grass' && seed === 0) { ctx.fillStyle = '#6aa84f'; ctx.fillRect(x + 10, y + 14, 3, 6); ctx.fillRect(x + 15, y + 12, 3, 8); }
  if (room.ground === 'dungeon' && ch !== '#') { ctx.fillStyle = (tx + ty) % 2 ? '#55556a' : '#62627a'; ctx.fillRect(x, y, T, T); }
  switch (ch) {
    case ':': ctx.fillStyle = '#e0c08a'; ctx.fillRect(x, y, T, T); if (seed < 2) circle(x + 12 + seed * 10, y + 20, 2, '#c9a66b'); break;
    case 'F':
      for (const [fx, fy, c] of [[10, 12, '#ff4081'], [28, 20, '#ffeb3b'], [16, 30, '#e040fb']]) { circle(x + fx, y + fy, 4, c); circle(x + fx, y + fy, 1.5, '#fff'); }
      break;
    case 'T':
      ctx.fillStyle = '#6d4c41'; ctx.fillRect(x + 16, y + 26, 8, 14);
      circle(x + 20, y + 18, 18, '#2e7d32'); circle(x + 14, y + 14, 9, '#388e3c'); break;
    case 'R':
      ctx.fillStyle = room.ground === 'cave' ? '#3e2723' : '#9e9e9e';
      ctx.beginPath(); ctx.roundRect(x + 2, y + 4, T - 4, T - 6, 12); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(x + 10, y + 10, 10, 5); break;
    case 'W': {
      ctx.fillStyle = '#29b6f6'; ctx.fillRect(x, y, T, T);
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
      const o = Math.sin(frame * 0.05 + tx) * 4;
      ctx.beginPath(); ctx.moveTo(x + 6 + o, y + 14); ctx.quadraticCurveTo(x + 12 + o, y + 9, x + 18 + o, y + 14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 20 - o, y + 28); ctx.quadraticCurveTo(x + 26 - o, y + 23, x + 32 - o, y + 28); ctx.stroke();
      break;
    }
    case '=': ctx.fillStyle = '#29b6f6'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#a1887f'; ctx.fillRect(x, y + 3, T, T - 6);
      ctx.fillStyle = '#6d4c41'; for (let i = 0; i < 4; i++) ctx.fillRect(x + i * 10, y + 3, 2, T - 6); break;
    case 'b': circle(x + 20, y + 22, 16, '#43a047'); circle(x + 13, y + 17, 7, '#66bb6a'); circle(x + 27, y + 25, 4, '#66bb6a'); break;
    case 'C':
      ctx.fillStyle = '#9e9e9e'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 20, y + 26, 16, Math.PI, 0); ctx.fillRect(x + 4, y + 26, 32, 14); ctx.fill(); break;
    case 'S': ctx.fillStyle = '#90a4ae'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#78909c';
      ctx.fillRect(x, y + 19, T, 2); ctx.fillRect(x + (ty % 2 ? 10 : 30), y, 2, 19); ctx.fillRect(x + (ty % 2 ? 30 : 10), y + 21, 2, 19); break;
    case 'D': ctx.fillStyle = '#795548'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#5d4037'; ctx.fillRect(x + 4, y + 4, T - 8, T - 4);
      if ((tx + 1) % 2 === 0) { circle(x + 36, y + 20, 5, '#ffd740'); ctx.fillStyle = '#000'; ctx.fillRect(x + 35, y + 20, 2, 6); }
      break;
    case 'd': ctx.fillStyle = '#111'; ctx.fillRect(x, y, T, T); break;
    case 'I': ctx.fillStyle = '#6d4c41'; ctx.fillRect(x + 17, y + 20, 6, 20); roundRect(x + 4, y + 6, 32, 18, 3, '#a1887f');
      ctx.fillStyle = '#5d4037'; ctx.fillRect(x + 9, y + 11, 22, 2); ctx.fillRect(x + 9, y + 17, 16, 2); break;
    case 'X': case 'x':
      roundRect(x + 5, y + 10, 30, 24, 4, '#8d5a2b');
      ctx.fillStyle = '#ffd740'; ctx.fillRect(x + 5, y + 18, 30, 3);
      if (ch === 'X') { ctx.fillRect(x + 17, y + 16, 6, 8); }
      else { ctx.fillStyle = '#3e2723'; ctx.fillRect(x + 7, y + 10, 26, 6); }
      break;
    case 'G': roundRect(x + 8, y + 6, 24, 30, [12, 12, 2, 2], '#b0bec5');
      ctx.fillStyle = '#78909c'; ctx.fillRect(x + 18, y + 12, 4, 14); ctx.fillRect(x + 13, y + 16, 14, 4); break;
    case 'f': ctx.fillStyle = '#5d4037'; ctx.fillRect(x + 16, y + 18, 8, 20);
      circle(x + 20, y + 14 + Math.sin(frame * 0.3 + tx) * 1.5, 8, '#ff9100'); circle(x + 20, y + 16, 4, '#ffea00'); break;
    case 'O': // the old man
      roundRect(x + 8, y + 16, 24, 24, 8, '#b71c1c');
      circle(x + 20, y + 12, 10, '#ffcc99');
      ctx.fillStyle = '#eee'; ctx.beginPath(); ctx.moveTo(x + 12, y + 14); ctx.lineTo(x + 20, y + 30); ctx.lineTo(x + 28, y + 14); ctx.fill();
      circle(x + 16, y + 10, 1.8, '#000'); circle(x + 24, y + 10, 1.8, '#000'); break;
    case '#': ctx.fillStyle = '#37374a'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#2b2b3a';
      ctx.fillRect(x, y + 19, T, 2); ctx.fillRect(x + (ty % 2 ? 10 : 30), y, 2, 19); ctx.fillRect(x + (ty % 2 ? 30 : 10), y + 21, 2, 19); break;
  }
}

function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(frame / 4) % 2) return;
  const x = p.x, y = p.y, step = Math.sin(p.walk * 0.3) * 3;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, y + 16, 13, 5, 0, 0, 7); ctx.fill();
  // sword swing
  if (p.swing > 0) {
    const base = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[p.dir];
    const k = 1 - p.swing / 14, a = base - 1.1 + k * 2.2;
    ctx.save(); ctx.translate(x + Math.cos(a) * 12, y + Math.sin(a) * 12); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = '#e0e0e0'; ctx.fillRect(-3, -36, 6, 30);
    ctx.fillStyle = '#ffd740'; ctx.fillRect(-8, -7, 16, 5);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(x, y, 40, base - 1.1, a); ctx.stroke();
  }
  ctx.fillStyle = '#5d4037';                                          // boots
  ctx.fillRect(x - 9, y + 8 + (p.walk ? step : 0), 7, 8); ctx.fillRect(x + 2, y + 8 - (p.walk ? step : 0), 7, 8);
  roundRect(x - 12, y - 6, 24, 18, 6, '#1e88e5');                     // tunic
  ctx.fillStyle = '#6d4c41'; ctx.fillRect(x - 12, y + 4, 24, 3);       // belt
  circle(x, y - 13, 11, '#ffcc99');                                    // head
  ctx.fillStyle = '#8d5a2b';                                           // hair
  if (p.dir === 'up') { ctx.beginPath(); ctx.arc(x, y - 13, 11.5, 0, 7); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(x, y - 16, 11.5, Math.PI, 0); ctx.fill(); }
  if (p.dir === 'down') { circle(x - 4, y - 12, 2, '#000'); circle(x + 4, y - 12, 2, '#000'); }
  if (p.dir === 'left') circle(x - 6, y - 12, 2, '#000');
  if (p.dir === 'right') circle(x + 6, y - 12, 2, '#000');
  if (p.sword && p.swing === 0) {                                      // shield
    const sx = p.dir === 'left' ? x - 12 : p.dir === 'right' ? x + 12 : p.dir === 'down' ? x - 13 : x + 13;
    roundRect(sx - 5, y - 6, 10, 14, 4, '#ffd740'); circle(sx, y + 1, 2.5, '#d32f2f');
  }
}

function drawEnemy(e) {
  if (e.hurt > 0 && Math.floor(frame / 3) % 2) return;
  const x = e.x, y = e.y;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, y + 14, 12, 4, 0, 0, 7); ctx.fill();
  if (e.type === 'slime') {
    const s = 1 + Math.sin(frame * 0.15 + e.t) * 0.1;
    ctx.fillStyle = '#76ff03'; ctx.beginPath(); ctx.ellipse(x, y + 4, 15 * s, 13 / s, 0, Math.PI, 0); ctx.fillRect(x - 15 * s, y + 4, 30 * s, 10); ctx.fill();
    circle(x - 5, y, 3, '#000'); circle(x + 5, y, 3, '#000');
  } else if (e.type === 'bat') {
    const flap = Math.sin(frame * 0.5 + e.t) * 8;
    ctx.fillStyle = '#4a148c';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 20, y - 6 + flap); ctx.lineTo(x - 10, y + 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 20, y - 6 + flap); ctx.lineTo(x + 10, y + 4); ctx.fill();
    circle(x, y, 9, '#6a1b9a'); circle(x - 3, y - 2, 2, '#ffeb3b'); circle(x + 3, y - 2, 2, '#ffeb3b');
  } else if (e.type === 'orc') {
    roundRect(x - 14, y - 8, 28, 22, 6, '#795548');
    circle(x, y - 12, 12, '#8bc34a');
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 6, y - 6, 3, 4); ctx.fillRect(x + 3, y - 6, 3, 4);
    circle(x - 4, y - 14, 2.5, '#d50000'); circle(x + 4, y - 14, 2.5, '#d50000');
    ctx.fillStyle = '#8d5a2b'; ctx.fillRect(x + 12, y - 18, 5, 26);   // club
  } else if (e.type === 'skeleton') {
    roundRect(x - 10, y - 4, 20, 18, 4, '#eceff1');
    ctx.fillStyle = '#90a4ae'; for (let i = 0; i < 3; i++) ctx.fillRect(x - 8, y + i * 5, 16, 2);
    circle(x, y - 12, 11, '#fafafa');
    circle(x - 4, y - 13, 3, '#000'); circle(x + 4, y - 13, 3, '#000');
    ctx.fillStyle = '#000'; ctx.fillRect(x - 3, y - 6, 6, 2);
  }
}

function drawBoss(b) {
  if (b.hurt > 0 && Math.floor(frame / 3) % 2) return;
  const x = b.x, y = b.y, flap = Math.sin(frame * 0.15) * 14;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y + 60, 60, 14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#b71c1c';                                           // wings
  ctx.beginPath(); ctx.moveTo(x - 20, y - 10); ctx.lineTo(x - 90, y - 40 + flap); ctx.lineTo(x - 70, y + 10); ctx.lineTo(x - 40, y + 15); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 20, y - 10); ctx.lineTo(x + 90, y - 40 + flap); ctx.lineTo(x + 70, y + 10); ctx.lineTo(x + 40, y + 15); ctx.fill();
  ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.ellipse(x, y + 10, 42, 36, 0, 0, 7); ctx.fill();   // body
  ctx.fillStyle = '#ffcc80'; ctx.beginPath(); ctx.ellipse(x, y + 18, 24, 24, 0, 0, 7); ctx.fill();   // belly
  ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.ellipse(x, y - 30, 28, 24, 0, 0, 7); ctx.fill();   // head
