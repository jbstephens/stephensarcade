const COLOR_WORDS = [[/cyan/i, 186], [/magma|lava|fire/i, 14], [/\bred\b/i, 2], [/orange|pumpkin|🎃/i, 28], [/yellow|gold/i, 48], [/lime|zombie|🧟/i, 95], [/green/i, 125],

const hsl = (h, s, l) => 'hsl(' + Math.round((h % 360 + 360) % 360) + ',' + s + '%,' + l + '%)';
function cardColors(card, r) {
  const named = card[1] + ' ' + card[0], all = named + ' ' + card[3].replace(/\b(\w+)\s+(bow|hat|cap|collar|headband|cape|visor|masks?|eyes?|button|tie|beam|hearts?|marks?|x|cheese|slice)\b/gi, '');
  let h = null;
  for (const t of [named, all]) { for (const c of COLOR_WORDS) if (c[0].test(t)) { h = c[1]; break; } if (h !== null) break; }
  const grey = h === null && GREYS.find(g => g[0].test(named));
  if (h === null) h = r() * 360;
  if (grey) return { col: grey[1], dark: '#37474f', light: '#eceff1', hue: h };

    if (IS_BOOK) {                     // while a game is open its own overlay owns the idle timer
      if (!player) player = document.getElementById('player');
      if (player && player.classList.contains('open')) { last = now; return; }
    }
    if (padActive(pads)) last = now;
    if (now - last < IDLE_MS) return;
    leaving = true;
    var g = false;
    try { g = window.parent !== window && typeof window.parent.closeGame === 'function'; } catch (e) {}
    if (g) { try { window.parent.closeGame(); } catch (e) {} }
    else location.href = '/';          // pagehide fires -> games persist their state
  });
})();
</script>
