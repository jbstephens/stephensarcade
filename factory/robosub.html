    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }

  try { nav.getGamepads = filtered; } catch (e) {}
  if (nav.getGamepads !== filtered) {

<script>
// ROBO SUB
// Robo pilots a little yellow submarine down through 5 depth zones: Sunny Shallows, Kelp Forest, Coral Canyon,
// Twilight Deep and The Abyss. Find 20 treasures, bonk critters with bubbles (they just get dizzy!),
// and play tentacle tag with THE KRAKEN KING (Kraken Kid's dad from Robo Jump 4).
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, COLS = 60, ROWS = 140, WW = COLS * T, WH = ROWS * T;
const SURF = 80, ZONE_H = 1000, LAIR_Y = 5080;
const ACC = 0.22, DRAG = 0.955, MAXSP = 3.4, BOOST = 8, O2_MAX = 100, O2_DRAIN = 100 / (60 * 80);

// ---------- Saves, trophies, stickers ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book

let save = { found: {}, beat: false, music: true, explored: '', trophy: false };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('roboSub') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  save.found = save.found || {}; if (typeof save.explored !== 'string') save.explored = '';
}
function writeSave() { try { localStorage.setItem('roboSub', JSON.stringify(save)); } catch (_) {} }
loadSave();

// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  shoot:  () => { note(500, 0, 0.12, 'sine', 0.12, 1100); note(900, 0.03, 0.08, 'sine', 0.05, 1500); },
  pop:    () => note(900 + Math.random() * 300, 0, 0.07, 'sine', 0.08, 1800),
  boost:  () => { note(180, 0, 0.35, 'sawtooth', 0.06, 600); note(600, 0.05, 0.25, 'sine', 0.06, 1400); },
  bonk:   () => { note(420, 0, 0.12, 'triangle', 0.18, 160); note(1200, 0.05, 0.12, 'sine', 0.06, 900); },
  ouch:   () => note(360, 0, 0.3, 'triangle', 0.14, 120),
  zap:    () => { for (let i = 0; i < 4; i++) note(800 + Math.random() * 600, i * 0.04, 0.05, 'square', 0.04); },
  crack:  () => { note(140, 0, 0.3, 'sawtooth', 0.14, 50); note(500, 0, 0.08, 'square', 0.06, 200); },
  clam:   () => { note(300, 0, 0.12, 'sine', 0.12, 700); note(700, 0.1, 0.2, 'sine', 0.1, 1200); },
  treasure: () => [784, 988, 1175, 1568, 1976, 2349].forEach((f, i) => note(f, i * 0.07, 0.3, 'sine', 0.11)),
  air:    () => { for (let i = 0; i < 6; i++) note(500 + i * 120, i * 0.05, 0.1, 'sine', 0.07, 900 + i * 150); },
  low:    () => { note(660, 0, 0.1, 'square', 0.06); note(520, 0.14, 0.12, 'square', 0.06); },
  zone:   () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.1, 0.4, 'triangle', 0.08)),
  click:  () => note(700, 0, 0.06, 'square', 0.06),
  warn:   () => { note(880, 0, 0.08, 'square', 0.08); note(880, 0.12, 0.08, 'square', 0.08); },
  swoosh: () => note(200, 0, 0.35, 'sawtooth', 0.08, 70),
  honk:   () => { note(220, 0, 0.25, 'square', 0.14, 180); note(330, 0.02, 0.25, 'sawtooth', 0.06, 270); },
  yawn:   () => note(300, 0, 0.8, 'sine', 0.1, 140),
  boss:   () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  win:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.12, 0.25, 'square', 0.09)),
};

// ---------- MUSIC ENGINE ----------
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) { nextT = 0; }
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {                                  // kick: a sine that drops in pitch fast
    const o = osc('sine', 150, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out);
  } else if (kind === 's') {                           // snare: noise + a little tone
    noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out);
    const o = osc('triangle', 190, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);          // crash cymbal
  else if (kind === 'r') { const o = osc('sine', 2400, t, t + 0.06), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); o.connect(g); g.connect(out); }
  else if (kind === 't') {                             // tom
    const o = osc('sine', 140, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(75, t + 0.25);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(out);
  }
}
// ---- song compiler: scale degrees -> notes ----
// Melody tokens (one per 8th note): 1-7 = scale degree, ' = octave up, , = octave down, b/# = flat/sharp, - = hold, . = rest. | = bar line.
// Chords (one per bar, "4/5" = two per bar): degree number, M = make it major, m = minor, b = flat root (bVII), 7 = add the 7th.
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10] };
const degS = (sc, k) => sc[((k - 1) % 7 + 7) % 7] + 12 * Math.floor((k - 1) / 7);
function parseMel(str, sc) {
  return str.replace(/\|/g, ' ').trim().split(/\s+/).filter(Boolean).map(tk => {
    if (tk === '.') return null;
    if (tk === '-') return 'h';
    const m = tk.match(/^([b#]?)([1-7])([',]*)$/);
    if (!m) return null;
    const acc = m[1] === 'b' ? -1 : m[1] === '#' ? 1 : 0, d = +m[2];
    const oct = (m[3].match(/'/g) || []).length - (m[3].match(/,/g) || []).length;
    let hd = d - 2, ho = oct; if (hd < 1) { hd += 7; ho--; }            // a third below, inside the scale
    return { s: sc[d - 1] + acc + 12 * oct, hs: sc[hd - 1] + 12 * ho };
  });
}
function melEvents(arr) {                              // onset -> length in 8ths (holds tie notes together)
  const ev = new Array(arr.length).fill(null);
  for (let i = 0; i < arr.length; i++) if (arr[i] && arr[i] !== 'h') { let n = 1; while (arr[i + n] === 'h') n++; ev[i] = Object.assign({ len: n }, arr[i]); }
  return ev;
}
function mirrorMel(arr) {                              // 🪞 play a melody backwards (for Mirror City's bridge)
  const runs = []; let i = 0;
  while (i < arr.length) { let n = 1; while (arr[i + n] === 'h') n++; runs.push(arr.slice(i, i + n)); i += n; }
  return runs.reverse().flat();
}
function parseChord(tk, sc) {
  let flat = false; if (tk[0] === 'b') { flat = true; tk = tk.slice(1); }
  const r = +tk[0], q = tk.slice(1), root = sc[r - 1] - (flat ? 1 : 0);
  let third = flat ? root + 4 : root + ((degS(sc, r + 2) - sc[r - 1]) % 12 + 12) % 12;
  if (q.includes('M')) third = root + 4;
  if (q.includes('m')) third = root + 3;
  const ch = [root, third, root + 7];
  if (q.includes('7')) ch.push(root + ((degS(sc, r + 6) - sc[r - 1]) % 12 + 12) % 12);
  return ch;
}
// ---- drum / bass / arpeggio styles. 16 steps per bar (12 for a waltz). Bass: R root, O octave, 5 fifth, - hold. Arp: chord tone 0-3.
const STYLES = {
  pop: {
    I: { k: 'x.......x.......', h: '..x...x...x...x.', bass: 'R-------R---R-O-', arp: '0.1.2.1.0.1.2.1.' },
    V: { k: 'x.....x.x.......', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.', bass: 'R..R..R.R..R..O.', arp: '0.1.2.1.0.1.2.1.' },
    V2: { k: 'x.....x.x.....x.', s: '....x.......x...', h: 'x.xxx.x.x.xxx.x.', bass: 'R..R..R.R..R.5O.', arp: '0121312101213121' },
    C: { k: 'x...x...x...x...', s: '....x.......x...', h: 'x.xxx.x.x.xxx.x.', o: '..............x.', bass: 'R.RO.RR.R.RO.R5.', arp: '0121312101213121' },
    B: { k: 'x.......x.......', s: '........x.......', h: 'x...x...x...x...', bass: 'R-------5-------', arp: '0...1...2...3...' } },
  waltz: {
    I: { k: 'x...........', h: '....x...x...', bass: 'R-----------', arp: '0...1...2...' },
    V: { k: 'x...........', s: '....x...x...', h: 'x.x.x.x.x.x.', bass: 'R-..5-..5-..', arp: '0.1.2.3.2.1.' },
    C: { k: 'x.....x.....', s: '....x...x...', h: 'xxx.x.x.xxx.', o: '..........x.', bass: 'R-..O-..5-..', arp: '012321012321' },
    B: { k: 'x...........', s: '........x...', h: 'x...x...x...', bass: 'R-----------', arp: '0...2...3...' } },
  calypso: {

// ---------- Critters (bonked critters just get dizzy for a while) ----------
function critterHead(cr) {

    }

}

function updatePlay() {
  const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), ay = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  sub.vx += ax * ACC; sub.vy += ay * ACC;
  if (ax) sub.face = ax;
  sub.vx *= DRAG; sub.vy *= DRAG;
  if (!ay) sub.vy += Math.sin(frame * 0.05) * 0.01;                 // gentle bobbing
  const sp = Math.hypot(sub.vx, sub.vy), max = sub.boostT > 0 ? BOOST : MAXSP;
  if (sp > max) { sub.vx *= max / sp; sub.vy *= max / sp; }
  if (sub.boostT > 0) { sub.boostT--; if (frame % 2 === 0) puffBubbles(sub.x - sub.face * 34, sub.y, 1); }
  if (sub.boostCD > 0) sub.boostCD--;
  if (sub.hurtT > 0) sub.hurtT--;
  if (sub.shotCD > 0) sub.shotCD--;
  if (press.space && sub.boostCD <= 0) {                            // 💨 BOOST
    let dx = ax, dy = ay; if (!dx && !dy) dx = sub.face;
    const n = Math.hypot(dx, dy); sub.vx = dx / n * BOOST; sub.vy = dy / n * BOOST;
    sub.boostT = 26; sub.boostCD = 45; sfx.boost(); puffBubbles(sub.x - sub.face * 30, sub.y, 8);
  }
  if (press.x || keys.x) fireBubble();
  sub.prop += 0.15 + sp * 0.1;
  moveSub(sub.vx, sub.vy);
  if (frame % 40 === 0) puffBubbles(sub.x - sub.face * 36, sub.y - 4, 1, 0.7);
  // 🫧 oxygen
  if (sub.y < SURF + 40) { if (o2 < O2_MAX - 1 && frame % 20 === 0) sfx.pop(); o2 = Math.min(O2_MAX, o2 + 1.5); lastAir = { x: sub.x, y: SURF + 50 }; }
  else o2 -= O2_DRAIN;
  for (const v of VENTS) {
    const vx = v[0] * T + 20, vy = v[1] * T + 20;
    if (dist(sub.x, sub.y, vx, vy) < 70) {
      if (!v.touch) { v.touch = true; if (o2 < O2_MAX - 5) { sfx.air(); say(vx, vy - 50, 'Fresh air! 🫧', '#b2ebf2'); } }
      o2 = O2_MAX; lastAir = { x: vx, y: vy };
    } else v.touch = false;
  }
  if (o2 < 25 && --lowBeep <= 0) { sfx.low(); lowBeep = 70; }
  if (o2 <= 0) { o2 = 0; state = 'float'; timer = 0; floatFrom = { x: sub.x, y: sub.y }; sfx.yawn(); return; }
  // 💰 treasure
  for (const t of treasures) {
    if (t.popT > 0) t.popT--;
    if (!t.got && t.open && (t.how !== 'king' || boss.crown === t) && dist(sub.x, sub.y, t.x, t.y) < 48) collect(t);
  }
  if (explore(sub.x, sub.y) && frame % 30 === 0) writeSave();
  const z = zoneOf(sub.y);
  if (z !== zoneNow) { zoneNow = z; zoneBanner = 160; sfx.zone(); writeSave(); }
  if (hint > 0) hint--;
  if (press.esc) { state = 'title'; timer = 0; writeSave(); }
  if (press.enter || inBox(tap, CHEST_BTN)) { bookFrom = 'play'; state = 'book'; timer = 0; sfx.click(); }
}
function updateFloat() {                                            // out of air: float gently back to the last air bubble
  timer++;
  const k = Math.min(1, timer / 150), e = k * k * (3 - 2 * k);
  sub.x = lerp(floatFrom.x, lastAir.x, e); sub.y = lerp(floatFrom.y, lastAir.y, e); sub.vx = 0; sub.vy = 0;
  if (frame % 6 === 0) puffBubbles(sub.x, sub.y + 20, 1);
  if (timer >= 150) { o2 = O2_MAX; sub.hurtT = 60; state = 'play'; sfx.air(); say(sub.x, sub.y - 40, 'Phew! Full of air again! 🫧', '#b2ebf2'); }
}
function update() {
  frame++;
  if (inBox(tap, MUSIC_BTN) && state !== 'book') { toggleMusic(); tap = null; }
  if (state === 'title') {
    timer++; setSong('title');
    if (inBox(tap, BOOK_BTN) || press.enter) { bookFrom = 'title'; state = 'book'; timer = 0; sfx.click(); }
    else if (press.space || press.x || (tap && timer > 10)) { state = 'play'; timer = 0; hint = 600; zoneNow = zoneOf(sub.y); zoneBanner = 140; sfx.zone(); }
  } else if (state === 'book') {
    timer++;
    if (timer > 10 && (press.esc || press.enter || press.space || press.x || tap)) { state = bookFrom; timer = 0; sfx.click(); }
  } else if (state === 'win') {
    timer++;
    if (timer > 90 && (press.space || press.x || press.enter || tap)) { state = 'play'; timer = 0; }
  } else if (state === 'play' || state === 'float') {
    if (state === 'play') updatePlay(); else updateFloat();
    updateCritters(); updateBoss(); updateShots();
    const fighting = FIGHT[boss.phase] || boss.phase === 'friend';
    setSong(fighting ? 'boss' : zoneOf(sub.y) >= 3 ? 'deep' : 'title');
  }
  if (state === 'play' || state === 'float' || state === 'title') {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; if (p.kind === 'bub') { p.vy -= 0.02; p.vx *= 0.97; if (p.y < SURF) p.life = 0; } else { p.vx *= 0.95; p.vy *= 0.95; } }
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 400) particles.splice(0, particles.length - 400);
    for (const f of floaters) { f.y -= 0.6; f.life--; }
    floaters = floaters.filter(f => f.life > 0);
    if (banner && --banner.life <= 0) banner = null;
    if (zoneBanner > 0) zoneBanner--;
    if (stickerNew > 0) stickerNew--;
    const tx = clamp(sub.x - W / 2, 0, WW - W), ty = clamp(sub.y - H / 2, 0, WH - H);
    cam.x += (tx - cam.x) * 0.12; cam.y += (ty - cam.y) * 0.12;
  }
  for (const k in press) press[k] = false;
  tap = null;
}

// ---------- Drawing helpers (same as Robo Jump 4) ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
  ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y + size * 0.35); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function ring(x, y, r, color, lw) { ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.stroke(); }
function bang(x, y, s = 1) {                            // the big "!" warning bubble
  const k = s * (1 + Math.sin(frame * 0.4) * 0.12);
  circle(x, y, 20 * k, frame % 16 < 8 ? '#ff1744' : '#ffea00');
  text('!', x, y + 11 * k, 30 * k, '#fff');
}
function drawStar(x, y, r, fill, rot = 0) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.fill();
}
function heart(x, y, s, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + s * 0.9); ctx.bezierCurveTo(x - s * 1.4, y, x - s * 0.6, y - s, x, y - s * 0.3); ctx.bezierCurveTo(x + s * 0.6, y - s, x + s * 1.4, y, x, y + s * 0.9); ctx.fill(); }
function hexMix(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16), m = (s) => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, clamp(k, 0, 1)));
  return `rgb(${m(16)},${m(8)},${m(0)})`;
}
function waterAt(y) {
  if (y >= LAIR_Y) return hexMix(ZONES[5].top, ZONES[5].bot, (y - LAIR_Y) / 480);
  const z = zoneOf(y), f = clamp((y - SURF - z * ZONE_H) / ZONE_H, 0, 1);
  return hexMix(ZONES[z].top, ZONES[z].bot, f);
}

// ---------- Robo (same look as Robo Jump 4: white round robot, dark visor, blue eyes, blue ear pods) ----------
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
function drawRobo(x, y, w, h, face = 1) {
  const pal = PAL_ROBO;
  ctx.fillStyle = pal.legs;
  ctx.fillRect(x + 4, y + h - 7 * (h / 40), 8, 7 * (h / 40)); ctx.fillRect(x + w - 12, y + h - 7 * (h / 40), 8, 7 * (h / 40));
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6 * (w / 30), pal.body);
  circle(x + w / 2, y + h * 0.7, 3 * (w / 30), pal.pod);
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9 * (h / 40), 3, pal.pod);
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9 * (h / 40), 3, pal.pod);
  roundRect(x - 2, y, w + 4, h * 0.55, 12 * (w / 30), pal.head);
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9 * (w / 30), pal.visor);
  const ex = x + w / 2 + face * 3 * (w / 30), ey = y + h * 0.27, blink = frame % 180 < 6 ? 1 : 5 * (h / 40), es = w / 30;
  ctx.fillStyle = pal.eye;
  ctx.beginPath(); ctx.ellipse(ex - 6 * es, ey, 3.5 * es, Math.max(0.5, blink), 0, 0, 7); ctx.ellipse(ex + 6 * es, ey, 3.5 * es, Math.max(0.5, blink), 0, 0, 7); ctx.fill();
}

// ---------- The yellow submarine with a bubble window ----------
function drawSub(x, y, face, prop = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(face, 1);
  // propeller + tail fins (at the back)
  ellipse(-40, 0, 4, Math.abs(Math.sin(prop)) * 14 + 2, '#90a4ae');
  ctx.fillStyle = '#f9a825'; ctx.beginPath(); ctx.moveTo(-28, -4); ctx.lineTo(-42, -18); ctx.lineTo(-36, 0); ctx.lineTo(-42, 18); ctx.lineTo(-28, 4); ctx.fill();
  // periscope
  roundRect(4, -34, 6, 18, 2, '#fbc02d'); roundRect(4, -36, 14, 6, 3, '#fbc02d'); circle(18, -33, 3, '#263238');
  // body
  ellipse(0, 0, 34, 20, '#ffd600'); ellipse(0, 6, 30, 12, '#fbc02d'); ellipse(-4, -8, 22, 7, 'rgba(255,255,255,.35)');
  for (const rx of [-18, -8, 2]) circle(rx, 8, 2, '#f57f17');
  // headlight
  circle(32, 4, 5, '#fff59d'); circle(32, 4, 2.5, '#fff');
  // bubble window with Robo inside
  ctx.save(); ctx.beginPath(); ctx.arc(14, -6, 15, 0, 7); ctx.clip();
  circle(14, -6, 15, '#81d4fa');
  drawRobo(3, -15, 22, 30, 1);
  ctx.restore();
  ring(14, -6, 15, '#f9a825', 3.5); ellipse(9, -13, 5, 2.5, 'rgba(255,255,255,.75)', -0.6);
  ctx.restore();
}

// ---------- Critters ----------
function dizzyStars(x, y) { for (let i = 0; i < 3; i++) { const a = frame * 0.12 + i * 2.1; drawStar(x + Math.cos(a) * 16, y + Math.sin(a) * 5, 5, '#fff59d', a); } }
function drawCritter(cr, glowPass) {
  const hp = critterHead(cr), d = cr.dir;
  if (glowPass) {
    if (cr.type === 'jelly') {
      const r = 18, c = cr.dizzy > 0 ? '#b39ddb' : cr.col === '#29b6f6' || cr.col === '#66bb6a' ? '#80deea' : '#f48fb1';
      circle(cr.x, cr.y, r * 2.2, 'rgba(128,222,234,.12)');
      ctx.strokeStyle = c; ctx.lineWidth = 2.5;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); const tx = cr.x - 10 + i * 7; ctx.moveTo(tx, cr.y); for (let k = 1; k <= 4; k++) ctx.lineTo(tx + Math.sin(cr.t * 0.08 + k + i) * 4, cr.y + k * 9); ctx.stroke(); }
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cr.x, cr.y, r, Math.PI, 0); ctx.quadraticCurveTo(cr.x, cr.y + 6, cr.x - r, cr.y); ctx.fill();
      ellipse(cr.x - 6, cr.y - 8, 5, 3, 'rgba(255,255,255,.7)', -0.5);
      circle(cr.x - 5, cr.y - 3, 2, '#311b92'); circle(cr.x + 5, cr.y - 3, 2, '#311b92');
    } else if (cr.type === 'lantern') {
      circle(cr.x, cr.y, 24, 'rgba(255,241,118,.12)');
      ellipse(cr.x, cr.y, 14, 8, '#4dd0e1'); ctx.fillStyle = '#4dd0e1'; ctx.beginPath(); ctx.moveTo(cr.x - d * 12, cr.y); ctx.lineTo(cr.x - d * 22, cr.y - 7); ctx.lineTo(cr.x - d * 22, cr.y + 7); ctx.fill();
      circle(cr.x + d * 6, cr.y - 2, 2.5, '#fff'); circle(cr.x - d * 2, cr.y + 3, 3, '#fff176');
    } else if (cr.type === 'angler') {
      const lx = cr.x + d * 34, ly = cr.y - 38 + Math.sin(cr.t * 0.07) * 3;
      circle(lx, ly, 22, 'rgba(255,241,118,.18)'); circle(lx, ly, 7, '#fff59d'); circle(lx, ly, 3.5, '#fff');
    }
    if (cr.dizzy > 0) dizzyStars(hp.x, hp.y - CRIT_R[cr.type] - (cr.type === 'puffer' ? cr.puff * 20 : 0) - 8);
    if (cr.happy > 0) heart(cr.x, cr.y - 30 - (90 - cr.happy) * 0.3, 7, '#ff80ab');
    return;
  }
  if (cr.type === 'fish') {
    ctx.fillStyle = cr.col; ctx.beginPath(); ctx.moveTo(cr.x - d * 10, cr.y); ctx.lineTo(cr.x - d * 24, cr.y - 10); ctx.lineTo(cr.x - d * 24, cr.y + 10); ctx.fill();
    ellipse(cr.x, cr.y, 16, 10, cr.col); ellipse(cr.x - d * 2, cr.y + 3, 10, 4, 'rgba(255,255,255,.3)');
    circle(cr.x + d * 8, cr.y - 3, 4, '#fff'); circle(cr.x + d * 9, cr.y - 3, 2, '#111');
  } else if (cr.type === 'turtle') {
    const fl = Math.sin(cr.t * 0.08) * 6;
    ellipse(cr.x - 14, cr.y + 12 + fl * 0.3, 10, 5, '#81c784', 0.5); ellipse(cr.x + 14, cr.y + 12 - fl * 0.3, 10, 5, '#81c784', -0.5);
    ellipse(cr.x - 12, cr.y - 10 - fl * 0.3, 11, 5, '#81c784', -0.5); ellipse(cr.x + 12, cr.y - 10 + fl * 0.3, 11, 5, '#81c784', 0.5);
    circle(cr.x + d * 26, cr.y - 2, 9, '#81c784'); circle(cr.x + d * 29, cr.y - 5, 2.5, '#111');
    ellipse(cr.x, cr.y, 22, 16, '#2e7d32'); ellipse(cr.x, cr.y, 15, 10, '#43a047'); ellipse(cr.x - 4, cr.y - 5, 6, 3, 'rgba(255,255,255,.25)');
  } else if (cr.type === 'eel') {
    ellipse(cr.hx, cr.hy + 4, 18, 12, '#1b2a20');                                   // its hidey hole
    if (cr.out > 0.05) {
      ctx.strokeStyle = '#9ccc65'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cr.hx, cr.hy + 4);
      for (let k = 1; k <= 6; k++) { const f = k / 6; ctx.lineTo(lerp(cr.hx, hp.x, f), lerp(cr.hy + 4, hp.y, f) + Math.sin(cr.t * 0.2 + k) * 5 * f); }
      ctx.stroke(); ctx.lineCap = 'butt';
      ellipse(hp.x, hp.y, 13, 9, '#aed581'); circle(hp.x + cr.ldir * 5, hp.y - 3, 3.5, '#fff'); circle(hp.x + cr.ldir * 6, hp.y - 3, 1.8, '#111');
      ctx.strokeStyle = '#33691e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hp.x + cr.ldir * 4, hp.y + 3, 4, 0.2, Math.PI - 0.2); ctx.stroke();
    } else { circle(cr.hx - 5, cr.hy, 2.5, '#fff59d'); circle(cr.hx + 5, cr.hy, 2.5, '#fff59d'); }   // peeking eyes
  } else if (cr.type === 'puffer') {
    const r = 14 + cr.puff * 20;
    if (cr.puff > 0.3) { ctx.strokeStyle = '#f57f17'; ctx.lineWidth = 2.5; ctx.beginPath(); for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28; ctx.moveTo(cr.x + Math.cos(a) * r * 0.9, cr.y + Math.sin(a) * r * 0.9); ctx.lineTo(cr.x + Math.cos(a) * (r + 7 * cr.puff), cr.y + Math.sin(a) * (r + 7 * cr.puff)); } ctx.stroke(); }
    circle(cr.x, cr.y, r, '#ffca28'); ellipse(cr.x, cr.y + r * 0.35, r * 0.8, r * 0.5, '#fff59d');
    circle(cr.x - r * 0.35, cr.y - r * 0.25, 4, '#fff'); circle(cr.x + r * 0.35, cr.y - r * 0.25, 4, '#fff');
    circle(cr.x - r * 0.35, cr.y - r * 0.25, 2, '#111'); circle(cr.x + r * 0.35, cr.y - r * 0.25, 2, '#111');
    circle(cr.x, cr.y + r * 0.25, 3 + cr.puff * 2, '#e65100');
  } else if (cr.type === 'angler') {
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cr.x + d * 8, cr.y - 20); ctx.quadraticCurveTo(cr.x + d * 20, cr.y - 46, cr.x + d * 34, cr.y - 38); ctx.stroke();
    ctx.fillStyle = '#4e342e'; ctx.beginPath(); ctx.moveTo(cr.x - d * 20, cr.y); ctx.lineTo(cr.x - d * 38, cr.y - 14); ctx.lineTo(cr.x - d * 38, cr.y + 14); ctx.fill();
    circle(cr.x, cr.y, 24, '#5d4037'); ellipse(cr.x + d * 12, cr.y + 8, 12, 8, '#3e2723');
    ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(cr.x + d * (4 + i * 7), cr.y + 2); ctx.lineTo(cr.x + d * (7 + i * 7), cr.y + 8); ctx.lineTo(cr.x + d * (10 + i * 7), cr.y + 2); ctx.fill(); }
    circle(cr.x + d * 8, cr.y - 9, 6, '#fff'); circle(cr.x + d * 9, cr.y - 9, 3, '#111');
  }
}

// ---------- The sea: water, light, decorations, rocks ----------
function drawWater(cy) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, waterAt(Math.max(SURF, cy))); g.addColorStop(1, waterAt(Math.max(SURF, cy + H)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (cy < SURF) {                                                 // sky + sun + waves at the top
    const sy = SURF - cy;
    const sk = ctx.createLinearGradient(0, 0, 0, Math.max(1, sy)); sk.addColorStop(0, '#81d4fa'); sk.addColorStop(1, '#e1f5fe');
    ctx.fillStyle = sk; ctx.fillRect(0, 0, W, Math.max(0, sy));
    circle(820 - cam.x * 0.05, sy - 40, 26, '#fff176');
    ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.moveTo(0, sy);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, sy + Math.sin((x + cam.x) * 0.03 + frame * 0.06) * 4);
    ctx.lineTo(W, sy + 10); ctx.lineTo(0, sy + 10); ctx.fill();
  }
  const sun = clamp(1 - (cy - SURF) / 1600, 0, 1);                 // sunbeams fade as you go deeper
  if (sun > 0) {
    ctx.fillStyle = `rgba(255,255,255,${0.07 * sun})`;
    for (let i = 0; i < 6; i++) { const bx = ((i * 230 - cam.x * 0.3 + Math.sin(frame * 0.01 + i) * 30) % 1300 + 1300) % 1300 - 170; ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 60, 0); ctx.lineTo(bx + 200, H); ctx.lineTo(bx + 110, H); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,.25)';                         // little floaty specks
  for (let i = 0; i < 40; i++) { const px = ((i * 137 - cam.x * 0.6 + Math.sin(frame * 0.01 + i) * 10) % W + W) % W, py = ((i * 89 - cam.y * 0.6 - frame * 0.15) % H + H) % H; ctx.fillRect(px, py, 2, 2); }
}
function drawDecor() {
  for (const d of decor) {
    if (d.y < cam.y - 400 || d.y > cam.y + H + 400 || d.x < cam.x - 100 || d.x > cam.x + W + 100) continue;
    if (d.type === 'kelp' || d.type === 'weed') {
      ctx.strokeStyle = d.type === 'kelp' ? '#2e7d32' : '#66bb6a'; ctx.lineWidth = d.type === 'kelp' ? 9 : 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(d.x, d.y);
      for (let k = 1; k <= 8; k++) ctx.lineTo(d.x + Math.sin(frame * 0.02 + d.ph + k * 0.6) * k * 2.2, d.y - d.h * k / 8);
      ctx.stroke(); ctx.lineCap = 'butt';
      if (d.type === 'kelp') for (let k = 2; k <= 7; k += 2) ellipse(d.x + Math.sin(frame * 0.02 + d.ph + k * 0.6) * k * 2.2 + 8, d.y - d.h * k / 8, 10, 4, '#43a047', -0.5);
    } else if (d.type === 'coral') {
      ctx.save(); ctx.translate(d.x, d.y); ctx.scale(d.s, d.s);
