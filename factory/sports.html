<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #10172a; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
  }
  canvas {
    width: min(100vw, calc(100vh * 960 / 520));

    box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: pointer;

</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;

// ---------- Sound ----------
let actx = null;
function startAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
}
function note(freq, start, dur, wave = 'square', vol = 0.1, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}
const sfx = {
  click:   () => note(660, 0, 0.06, 'square', 0.05),
  whoosh:  () => noise(0.15, 0.3, 1500),
  hit:     () => { noise(0.12, 0.8, 2500); note(220, 0, 0.1, 'square', 0.08, 90); },
  mitt:    () => noise(0.1, 0.6, 500),
  cheer:   () => { noise(1.6, 0.35, 1100); [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.1, 0.25, 'square', 0.05)); },
  yay:     () => { noise(0.8, 0.25, 1100); note(784, 0, 0.15, 'square', 0.05); note(1047, 0.12, 0.25, 'square', 0.05); },
  aww:     () => note(320, 0, 0.7, 'sawtooth', 0.05, 140),
  bounce:  () => note(160, 0, 0.1, 'sine', 0.25, 90),
  swish:   () => noise(0.35, 0.45, 4500),
  kick:    () => { noise(0.1, 0.8, 700); note(120, 0, 0.12, 'sine', 0.3, 60); },
  putt:    () => note(520, 0, 0.06, 'sine', 0.2),
  cup:     () => { note(700, 0, 0.1, 'sine', 0.2); note(900, 0.1, 0.1, 'sine', 0.2); note(1200, 0.2, 0.2, 'sine', 0.2); },
  whistle: () => { note(2100, 0, 0.12, 'sine', 0.07); note(2100, 0.18, 0.35, 'sine', 0.07); },
  tackle:  () => { noise(0.3, 0.9, 350); note(90, 0, 0.2, 'sine', 0.3, 50); },
};

// ---------- Input (keyboard, and clicking acts like SPACE) ----------
const keys = {}, pressed = new Set();
let click = null;
addEventListener('keydown', e => {
  startAudio();
  if (!keys[e.key]) pressed.add(e.key);
  keys[e.key] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key] = false; });
C.addEventListener('mousedown', e => {
  startAudio();
  const r = C.getBoundingClientRect();
  click = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  if (!keys[' ']) pressed.add(' ');
  keys[' '] = true;
});
addEventListener('mouseup', () => { keys[' '] = false; });
const action = () => pressed.has(' ') || pressed.has('Enter');

// ---------- Shared helpers ----------
let frame = 0, particles = [];
function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 90; i++)
    particles.push({ x: Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 220, color: cols[i % 5], size: 5 + Math.random() * 4 });
}
function crowd(y0, y1, seed = 1) {
  ctx.fillStyle = '#37474f'; ctx.fillRect(0, y0, W, y1 - y0);
  const cols = ['#ff5252', '#ffd740', '#40c4ff', '#69f0ae', '#fff', '#e040fb', '#ff9800'];
  for (let y = y0 + 8; y < y1 - 4; y += 14)
    for (let x = 6 + (y % 28 ? 7 : 0); x < W; x += 14) {
      const k = (x * 7 + y * 13 + seed) % cols.length;
      circle(x, y + Math.sin(frame * 0.2 + x) * (k === 0 ? 2 : 0.5), 5, cols[k]);
    }
}
function kid(x, y, shirt, s = 1) {          // a simple cartoon player standing at (x, y = feet)
  ctx.fillStyle = '#263238';
  ctx.fillRect(x - 9 * s, y - 22 * s, 7 * s, 22 * s); ctx.fillRect(x + 2 * s, y - 22 * s, 7 * s, 22 * s);
  roundRect(x - 13 * s, y - 52 * s, 26 * s, 32 * s, 8 * s, shirt);
  circle(x, y - 64 * s, 13 * s, '#ffcc99');
  circle(x - 4 * s, y - 66 * s, 2 * s, '#000'); circle(x + 4 * s, y - 66 * s, 2 * s, '#000');
}

// =====================================================================
// ⚾ BASEBALL: swing at the right time
// =====================================================================
const baseball = {
  name: 'Baseball', emoji: '⚾', color: '#43a047', help: 'Press SPACE to swing the bat!',
  init() { Object.assign(this, { score: 0, pitch: 0, max: 10, phase: 'ready', t: 0, ball: null, swing: 0 }); },
  update() {
    this.t++;
    if (this.swing > 0) this.swing--;
    if (this.phase === 'ready' && this.t > 70) {
      this.phase = 'pitch'; this.t = 0; this.pitch++;
      const sp = 7 + Math.random() * 3 + this.pitch * 0.25;
      this.ball = { x: 740, y: 318, vx: -sp, vy: -0.4 + Math.random() * 0.5, ay: 0.012 + Math.random() * 0.012 };
    }
    if (action() && this.swing === 0 && this.phase !== 'result') { this.swing = 16; sfx.whoosh(); }
    const b = this.ball;
    if (!b) return;
    if (this.phase === 'pitch') {
      b.x += b.vx; b.y += b.vy; b.vy += b.ay;
      const since = 16 - this.swing;
      if (this.swing > 0 && since >= 2 && since <= 9 && b.x < 300 && b.x > 150) {
        const d = Math.abs(b.x - 228);
        sfx.hit();
        if (d < 22) { show('HOME RUN!!', '#ffd740'); this.score += 3; b.vx = 17; b.vy = -14; sfx.cheer(); confetti(); }
        else if (d < 50) { show('NICE HIT!', '#69f0ae'); this.score += 1; b.vx = 11; b.vy = -8 - Math.random() * 3; sfx.yay(); }
        else { show('FOUL BALL', '#fff'); b.vx = -4; b.vy = -11; }
        this.phase = 'result'; this.t = 0;
      } else if (b.x < 140) {
        show('STRIKE!', '#ff5252'); sfx.mitt(); sfx.aww();
        this.phase = 'result'; this.t = 0; this.ball = null;
      }
    } else {
      b.x += b.vx; b.y += b.vy; b.vy += 0.22;
    }
  },
  tick() {
    if (this.phase === 'result' && this.t > 100) {
      if (this.pitch >= this.max) return endGame(this.score);
      this.phase = 'ready'; this.t = 0; this.ball = null;
    }
  },
  draw() {
    const g = ctx.createLinearGradient(0, 0, 0, 150); g.addColorStop(0, '#4fc3f7'); g.addColorStop(1, '#b3e5fc');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    crowd(40, 170, 3);
    ctx.fillStyle = '#2e7d32'; ctx.fillRect(0, 170, W, 8);
    ctx.fillStyle = '#43a047'; ctx.fillRect(0, 178, W, H);
    for (let x = 0; x < W; x += 80) { ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x, 178, 40, H); }
    ctx.fillStyle = '#c68642';                                       // dirt
    ctx.beginPath(); ctx.ellipse(230, 420, 170, 60, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(770, 410, 110, 40, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';                                          // home plate
    ctx.beginPath(); ctx.moveTo(210, 410); ctx.lineTo(246, 410); ctx.lineTo(246, 418); ctx.lineTo(228, 428); ctx.lineTo(210, 418); ctx.fill();
    // pitcher
    const throwing = this.phase === 'ready' && this.t > 50;
    kid(780, 400, '#1565c0');
    ctx.strokeStyle = '#ffcc99'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(770, 340); ctx.lineTo(throwing ? 740 : 790, throwing ? 300 : 320); ctx.stroke();
    // batter with bat
    kid(190, 410, '#d32f2f');
    const since = 16 - this.swing, a = this.swing > 0 ? -2.3 + Math.min(1, since / 8) * 3.2 : -2.3;
    const hx = 205, hy = 335;
    ctx.strokeStyle = '#8d5a2b'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(a) * 70, hy + Math.sin(a) * 70); ctx.stroke();
    ctx.strokeStyle = '#ffcc99'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(190, 345); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = '#d32f2f';                                       // batting helmet
    ctx.beginPath(); ctx.arc(190, 344, 15, Math.PI, 0); ctx.fill();
    ctx.fillRect(190, 340, 22, 5);
    const b = this.ball;
    if (b) {
      circle(b.x, 430, 6, 'rgba(0,0,0,.2)');
      circle(b.x, b.y, 8, '#fff');
      ctx.strokeStyle = '#e53935'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x - 6, b.y, 6, -0.8, 0.8); ctx.stroke();
    }
    text(`Pitch ${Math.min(this.pitch, this.max)}/${this.max}`, 20, 30, 24, '#fff', 'left');
    text(`Score: ${this.score}`, W - 20, 30, 24, '#ffd740', 'right');
    text('Home run = 3    Hit = 1', W / 2, 505, 18);
  },
  scoreText: s => `You scored ${s} points!`,
};

// =====================================================================
// 🏀 BASKETBALL: stop the power meter in the green
// =====================================================================
const RIM_Y = 200, RIM_L = 762, RIM_R = 822;
const basketball = {
  name: 'Basketball', emoji: '🏀', color: '#ef6c00', help: 'Press SPACE when the meter is in the GREEN!',
  init() { Object.assign(this, { score: 0, shot: 0, max: 10 }); this.newShot(); },
  newShot() {
    this.sx = 120 + Math.random() * 330; this.phase = 'aim'; this.t = 0;
    this.power = 0; this.pdir = 1; this.ball = null; this.made = false;
    const g = 0.35, th = 55 * Math.PI / 180, dx = (RIM_L + RIM_R) / 2 - this.sx, dy = 380 - RIM_Y;
    const v = Math.sqrt(g * dx * dx / (2 * Math.cos(th) ** 2 * (dx * Math.tan(th) - dy)));
    this.ideal = (v - 10) / 10;
  },
  update() {
    this.t++;
    if (this.phase === 'aim') {
      this.power += this.pdir * (0.012 + this.shot * 0.0015);
      if (this.power > 1 || this.power < 0) { this.pdir *= -1; this.power = Math.max(0, Math.min(1, this.power)); }
      if (action()) {
        const v = 10 + this.power * 10, th = 55 * Math.PI / 180;
        this.ball = { x: this.sx + 10, y: 380, vx: v * Math.cos(th), vy: -v * Math.sin(th), spin: 0 };
        this.phase = 'fly'; this.t = 0; this.shot++; sfx.whoosh();
      }
    } else if (this.phase === 'fly') {
      const b = this.ball, py = b.y;
      b.vy += 0.35; b.x += b.vx; b.y += b.vy; b.spin += 0.2;
      if (b.x + 15 > 838 && b.y > 95 && b.y < 215 && b.vx > 0) { b.x = 823; b.vx = -Math.abs(b.vx) * 0.5; sfx.bounce(); }
      if (py < RIM_Y && b.y >= RIM_Y && !this.made) {
        if (b.x > RIM_L + 10 && b.x < RIM_R - 10) {
          this.made = true; b.vx *= 0.3;
          const three = this.sx < 260;
          this.score += three ? 3 : 2;
          show(three ? '3 POINTER!!' : 'SWISH!', '#ffd740'); sfx.swish(); sfx.cheer();
          if (three) confetti();
        } else if (Math.abs(b.x - RIM_L) < 18 || Math.abs(b.x - RIM_R) < 18) {
          b.vy = -Math.abs(b.vy) * 0.45; b.vx *= Math.abs(b.x - RIM_R) < 18 ? -0.5 : 0.6; b.y = RIM_Y - 1;
          sfx.bounce();
        }
      }
      if (b.y > 470) {
        if (!this.made) { show('MISS!', '#ff8a80'); sfx.aww(); }
        this.phase = 'done'; this.t = 0;
      }
    }
  },
  tick() {
    if (this.phase === 'done' && this.t > 60) {
      if (this.shot >= this.max) return endGame(this.score);
      this.newShot();
    }
  },
  draw() {
    ctx.fillStyle = '#5d4037'; ctx.fillRect(0, 0, W, H);
    crowd(20, 150, 7);
    ctx.fillStyle = '#3e2723'; ctx.fillRect(0, 150, W, 12);
    ctx.fillStyle = '#d7a86e'; ctx.fillRect(0, 440, W, 80);          // wood floor
    for (let x = 0; x < W; x += 60) { ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(x, 440, 2, 80); }
    ctx.fillStyle = '#fff'; ctx.fillRect(260, 440, 4, 80);
    text('3 POINT LINE', 262, 500, 14, '#fff');
    ctx.fillStyle = '#9e9e9e'; ctx.fillRect(880, 100, 14, 340);      // pole
    roundRect(836, 95, 14, 125, 3, '#fff');                           // backboard
    ctx.strokeStyle = '#e53935'; ctx.lineWidth = 3; ctx.strokeRect(838, 150, 10, 40);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;                      // net
    const sway = this.made && this.ball && this.ball.y < 300 ? Math.sin(frame * 0.6) * 4 : 0;
    for (let i = 0; i <= 5; i++) {
      ctx.beginPath(); ctx.moveTo(RIM_L + i * 12, RIM_Y); ctx.lineTo(RIM_L + 10 + i * 8 + sway, RIM_Y + 45); ctx.stroke();
    }
    ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 6;                   // rim
    ctx.beginPath(); ctx.moveTo(RIM_L, RIM_Y); ctx.lineTo(838, RIM_Y); ctx.stroke();
    kid(this.sx, 440, '#1565c0');
    const b = this.ball;
    const bx = b ? b.x : this.sx + 10, by = b ? b.y : 370 + Math.abs(Math.sin(frame * 0.15)) * -8;
    circle(bx, by, 15, '#ef6c00');
    ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2;
    const sp = b ? b.spin : 0;
    ctx.beginPath(); ctx.arc(bx, by, 15, 0, 7);
    ctx.moveTo(bx + Math.cos(sp) * 15, by + Math.sin(sp) * 15); ctx.lineTo(bx - Math.cos(sp) * 15, by - Math.sin(sp) * 15); ctx.stroke();
    if (this.phase === 'aim') {                                       // power meter
      const mx = 330, my = 190, mw = 300;
      roundRect(mx, my, mw, 26, 13, 'rgba(0,0,0,.5)');
      ctx.fillStyle = '#00e676';
      ctx.fillRect(mx + mw * (this.ideal - 0.035), my, mw * 0.07, 26);
      ctx.fillStyle = '#fff'; ctx.fillRect(mx + mw * this.power - 3, my - 6, 6, 38);
      text('POWER', mx + mw / 2, my - 12, 20);
    }
    text(`Shot ${Math.min(this.shot + (this.phase === 'aim' ? 1 : 0), this.max)}/${this.max}`, 20, 30, 24, '#fff', 'left');
    text(`Score: ${this.score}`, W - 20, 30, 24, '#ffd740', 'right');
  },
  scoreText: s => `You scored ${s} points!`,
};

// =====================================================================
// ⚽ SOCCER: penalty kicks
// =====================================================================
const GOAL_L = 300, GOAL_R = 660, GOAL_TOP = 110, GOAL_BOT = 240;
const soccer = {
  name: 'Soccer', emoji: '⚽', color: '#00897b', help: 'Press SPACE to kick at the target!',
  init() { Object.assign(this, { score: 0, kick: 0, max: 10 }); this.newKick(); },
  newKick() {
    Object.assign(this, { phase: 'aim', t: 0, gx: 480, gdive: 0, ball: { x: 480, y: 440, s: 1 }, phaseT: Math.random() * 100 });
  },
  update() {
    this.t++;
    const sp = 0.03 + this.kick * 0.003;
    if (this.phase === 'aim') {
      this.phaseT++;
      this.tx = 480 + Math.sin(this.phaseT * sp) * 210;
      this.ty = 175 + Math.sin(this.phaseT * sp * 1.7) * 55;
      this.gx = 480 + Math.sin(frame * 0.05) * 30;
      if (action()) {
        this.phase = 'kick'; this.t = 0; this.kick++; sfx.kick();
        this.fx = this.tx; this.fy = this.ty;
        const guess = Math.random() < 0.3 + this.kick * 0.03;
        this.target = guess ? Math.max(GOAL_L + 40, Math.min(GOAL_R - 40, this.fx)) : 480 + [-1, 0, 1][Math.floor(Math.random() * 3)] * 95;
      }
    } else if (this.phase === 'kick') {
      const k = Math.min(1, this.t / 28);
      this.ball.x = 480 + (this.fx - 480) * k;
      this.ball.y = 440 + (this.fy - 440) * k - Math.sin(k * Math.PI) * 60;
      this.ball.s = 1 - k * 0.45;
      if (this.t > 6) this.gx += (this.target - this.gx) * 0.18;
      this.gdive = Math.max(-1, Math.min(1, (this.target - 480) / 95));
      if (this.t === 28) {
        const inGoal = this.fx > GOAL_L + 12 && this.fx < GOAL_R - 12 && this.fy > GOAL_TOP + 8;
        if (!inGoal) { show('MISSED!', '#ff8a80'); sfx.aww(); }
        else if (Math.abs(this.fx - this.gx) < 50) { show('SAVED!', '#ff8a80'); sfx.mitt(); sfx.aww(); }
        else { show('GOOOAL!!', '#ffd740'); this.score++; sfx.cheer(); confetti(); }
        this.phase = 'done'; this.t = 0;
      }
    }
  },
  tick() {
    if (this.phase === 'done' && this.t > 90) {
      if (this.kick >= this.max) return endGame(this.score);
      this.newKick();
    }
  },
  draw() {
    crowd(0, 90, 11);
    for (let y = 90; y < H; y += 40) { ctx.fillStyle = (y / 40) % 2 ? '#43a047' : '#4caf50'; ctx.fillRect(0, y, W, 40); }
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 4;
    ctx.strokeRect(180, GOAL_BOT, 600, 150);
    ctx.beginPath(); ctx.moveTo(0, GOAL_BOT); ctx.lineTo(W, GOAL_BOT); ctx.stroke();
    circle(480, 440, 5, '#fff');
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;     // net
    for (let x = GOAL_L; x <= GOAL_R; x += 18) { ctx.beginPath(); ctx.moveTo(x, GOAL_TOP); ctx.lineTo(x, GOAL_BOT); ctx.stroke(); }
    for (let y = GOAL_TOP; y <= GOAL_BOT; y += 18) { ctx.beginPath(); ctx.moveTo(GOAL_L, y); ctx.lineTo(GOAL_R, y); ctx.stroke(); }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(GOAL_L, GOAL_BOT); ctx.lineTo(GOAL_L, GOAL_TOP); ctx.lineTo(GOAL_R, GOAL_TOP); ctx.lineTo(GOAL_R, GOAL_BOT); ctx.stroke();
    // goalie
    ctx.save(); ctx.translate(this.gx, GOAL_BOT - 5);
    ctx.rotate(this.phase !== 'aim' ? this.gdive * 0.9 : 0);
    ctx.fillStyle = '#263238'; ctx.fillRect(-12, -26, 9, 26); ctx.fillRect(3, -26, 9, 26);
    roundRect(-16, -62, 32, 38, 8, '#fdd835');
    ctx.strokeStyle = '#fdd835'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    const arm = Math.sin(frame * 0.2) * 6;
    ctx.beginPath(); ctx.moveTo(-14, -55); ctx.lineTo(-48, -80 + arm); ctx.moveTo(14, -55); ctx.lineTo(48, -80 - arm); ctx.stroke();
    circle(-50, -82 + arm, 8, '#43a047'); circle(50, -82 - arm, 8, '#43a047');
    circle(0, -76, 14, '#ffcc99');
    circle(-5, -78, 2, '#000'); circle(5, -78, 2, '#000');
    ctx.restore();

const TILE_W = 160, TILE_H = 220, TILE_GAP = 20, TILES_X = (W - (TILE_W * 5 + TILE_GAP * 4)) / 2, TILE_Y = 170;

function update() {

    if (click) {
      for (let i = 0; i < 5; i++) {
