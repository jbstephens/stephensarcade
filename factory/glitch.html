<script>

// ---------- Pieces of every game in the book ----------

// ---------- Level generator ----------

function damageBoss() {

// ---------- Input ----------
const keys = {}, pressed = new Set();

  }

    else { shots.push({ x: c.x + 15 + c.face * 18, y: c.y + 12, vx: c.face * 8, life: 70 }); c.cool = 25; sfx.fire(); }
  }
