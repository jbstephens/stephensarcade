// ---------- Sound ----------

// ---------- Little drawing helpers ----------
function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);

}

  ctx.textAlign = align; ctx.textBaseline = 'middle';

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(s, x, y);

function starPath(x, y, r1, r2, n = 5, rot = -Math.PI / 2) {
  ctx.beginPath();

// ---------- Candy drawing: c = { shape, color, flavor, topping } (any part can be missing) ----------
const SPRINKLE_SPOTS = [[-14, -10, 0.4], [8, -16, 1.3], [16, 2, 2.1], [-4, 6, 0.9], [-18, 8, 2.7], [6, 14, 0.2], [-8, -20, 1.8], [18, -8, 0.7], [0, -4, 2.4]];

function drawCandy(c, x, y, s = 1, t = frame) {
  if (!c || !c.shape) return;

    ell(0, 10, 22, 24, K.c); dot(0, -14, 19, K.c);      // body + head
    dot(-20, 4, 8, K.c); dot(20, 4, 8, K.c); dot(-12, 30, 9, K.c); dot(12, 30, 9, K.c);   // paws

    for (let yy = 34; yy > -12; yy -= 12) { ctx.beginPath(); ctx.moveTo(1, yy + 4); ctx.lineTo(15, yy - 4); ctx.stroke(); }
    for (const a of [-0.6, -1.6, -2.6]) { ctx.beginPath(); ctx.moveTo(-6 + Math.cos(a) * 7, -16 + Math.sin(a) * 7); ctx.lineTo(-6 + Math.cos(a - 0.4) * 21, -16 + Math.sin(a - 0.4) * 21); ctx.stroke(); }

}

// ---------- Update (60 steps a second) ----------
function update() {
  frame++; timer++;
  if (dayBanner > 0) dayBanner--;
  if (anim && --anim.t <= 0) anim = null;
  if (check && --check.t <= 0) check = null;
  if (cur && (state === 'play' || state === 'invent')) {
    if (cur.wait > 0) { if (--cur.wait === 0) { cur.tx = cur.step < 4 ? STATION_X[cur.step] : END_X; sfx.roll(); } }
    else {
      const dx = cur.tx - cur.x, sp = BELT_SPEED[upg.belt || 0] * (mode === 'invent' ? 1.4 : 1);
      cur.x += Math.sign(dx) * Math.min(Math.abs(dx), sp);
      if (cur.step === 4 && Math.abs(cur.tx - cur.x) < 0.5) { cur.step = 5; sfx.ding(); }
    }
  }
  if (state === 'play' && cust) {
    cust.t++;
    if (cust.phase === 'enter') { cust.x = Math.min(150, cust.x + 5); if (cust.x >= 150) { cust.phase = 'order'; cust.t = 0; sfx.ding(); } }
    else if (cust.phase === 'order') cust.patience = Math.max(0, cust.patience - 1 / (60 * DAY_PATIENCE[day - 1]));
    else if (cust.phase === 'react') {
      if (cust.t === 70 && cust.candy) { for (let i = 0; i < 14; i++) crumbs.push({ x: cust.x + 30, y: 200, vx: Math.random() * 6 - 3, vy: -Math.random() * 5, t: 50, c: candyCol(cust.candy).c }); cust.candy = null; }
      if (cust.t > 190) { cust.phase = 'leave'; }
    } else if (cust.phase === 'leave') { cust.x -= 7; if (cust.x < -110) nextCustomer(); }
  }
  if (taster) { taster.t++; if (state === 'taste' && taster.t === 60) for (let i = 0; i < 14; i++) crumbs.push({ x: 720, y: 330, vx: Math.random() * 8 - 4, vy: -Math.random() * 6, t: 50, c: candyCol(taster.c).c }); }
  for (const f of floaters) { f.y -= 0.7; f.t--; }
  floaters = floaters.filter(f => f.t > 0);
  for (const p of crumbs) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.t--; }
  crumbs = crumbs.filter(p => p.t > 0);
  if (state === 'win' || state === 'title') {
    if (state === 'win' && confetti.length < 120) confetti.push(makeConfetti());
    for (const p of confetti) { p.x += p.vx; p.y += p.vy; p.a += 0.05; if (p.y > H + 30) { p.y = -20; p.x = Math.random() * W; } }
  }
}
