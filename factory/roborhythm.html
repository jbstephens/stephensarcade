// ---------- 🔊 Audio: Jukebox note math, played through a fat lead (vibrato + echo), arps, bass and drums ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let fakeT = 0;                                         // a clock for when there is no sound card (or in tests)
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function initAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.9;
      if (actx.createDynamicsCompressor) {
        const comp = actx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
        master.connect(comp); comp.connect(actx.destination);
      } else master.connect(actx.destination);
      musicBus = actx.createGain(); musicBus.gain.value = 1; musicBus.connect(master);
      sfxBus = actx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(master);
      delayIn = actx.createGain(); delayIn.gain.value = 0.22;
      delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
      const fb = actx.createGain(); fb.gain.value = 0.3;
      const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
      delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (_) { actx = null; }
  }
  if (actx && actx.state === 'suspended' && actx.resume) actx.resume();
}
const clock = () => actx ? actx.currentTime : fakeT;
// one note, exactly like the Jukebox's jbNote (start at full volume, fade to nothing), but into a bus
function jbNote(m, at, dur, wave, vol, out) {
  if (!actx || !m) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.value = midi(m);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g); g.connect(out || musicBus); o.start(at); o.stop(at + dur + 0.05);
}
// 🎺 the LEAD: the song's own wave + a detuned twin, vibrato on long notes, and an echo
function leadNote(m, at, dur, wave, vol) {
  if (!actx || !m) return;
  const f = midi(m), g = actx.createGain();
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + 0.008); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = wave === 'square' ? 2600 : 4000;
  lp.connect(g); g.connect(musicBus); g.connect(delayIn);
  const o1 = actx.createOscillator(), o2 = actx.createOscillator();
  o1.type = wave; o2.type = wave === 'sine' ? 'triangle' : wave;
  o1.frequency.value = f; o2.frequency.value = f; o1.detune.value = -6; o2.detune.value = 6;
  const mix = actx.createGain(); mix.gain.value = 0.6; o1.connect(mix); o2.connect(mix); mix.connect(lp);
  if (dur > 0.3) {
    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 5.6;
    lg.gain.setValueAtTime(0, at); lg.gain.linearRampToValueAtTime(0, at + 0.12); lg.gain.linearRampToValueAtTime(f * 0.008, at + 0.4);
    lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency); lfo.start(at); lfo.stop(at + dur + 0.05);
  }
  for (const o of [o1, o2]) { o.start(at); o.stop(at + dur + 0.05); }
}
function noiseHit(t, type, freq, vol, decay, out) {
  if (!actx || !noiseBuf) return;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out || musicBus); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drum(kind, t, vol, out) {
  if (!actx) return;
  out = out || musicBus;
  if (kind === 'k') {
    const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.35);
  } else if (kind === 's') { noiseHit(t, 'highpass', 1400, vol * 0.7, 0.15, out); jbNote(55, t, 0.08, 'triangle', vol * 0.4, out); }
  else if (kind === 'h') noiseHit(t, 'highpass', 7500, vol, 0.04, out);
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, vol, 1.0, out);
  else if (kind === 'click') jbNote(96, t, 0.05, 'square', vol, out);
}
// play step k of a song (k = which half-beat). Same math as the Jukebox: melody, chord arps, bass, bass line.
function playStep(T, k, at, drums) {
  const stepDur = T.step;
  const m = T.mel[k % T.mel.length]; if (m) leadNote(m, at, Math.max(0.12, stepDur * T.len), T.wave, (T.vol || 0.06) * 1.6);
  if (T.chords) {
    const ch = T.chords[Math.floor(k / 8) % 4]; const ai = T.arp[k % 8];
    jbNote(ai === 3 ? ch[0] + 12 : ch[ai], at, stepDur * 0.8, 'triangle', 0.03);
    if (T.bass[k % 8]) jbNote(ch[0] - (T.bass[k % 8] === 1 ? 24 : T.bass[k % 8] === 3 ? 17 : 12), at, stepDur * 0.9, 'triangle', 0.08);
  }
  if (T.bassEvery && k % T.bassEvery === 0) jbNote(T.bassLine[Math.floor(k / T.bassEvery) % T.bassLine.length], at, stepDur * T.bassEvery * 0.75, 'sine', 0.1);
  if (!T.chords && !T.bassEvery && k % 4 === 0) jbNote(rootOf(T, k) - 24, at, stepDur * 3, 'triangle', 0.09);   // a simple bass so every song has one
  if (drums) {
    if (k % 4 === 0) drum('k', at, 0.32);
    if (k % 8 === 4) drum('s', at, 0.22);
    drum('h', at, k % 2 ? 0.05 : 0.08);
    if (k % (T.mel.length) === 0) drum('x', at, 0.08);
  }
}
// for songs with no chords: bass follows the lowest melody note of each 4-step chunk
function rootOf(T, k) {
  const b = k - (k % 4); let lo = 0;
  for (let i = 0; i < 4; i++) { const m = T.mel[(b + i) % T.mel.length]; if (m && (!lo || m < lo)) lo = m; }
  if (!lo) { for (let i = 1; i < T.mel.length; i++) { const m = T.mel[((b - i) % T.mel.length + T.mel.length) % T.mel.length]; if (m) { lo = m; break; } } }
  while (lo > 64) lo -= 12;
  return lo || 60;
}
// sound effects
const sfx = {
  hit(g) { if (!actx) return; const t = actx.currentTime; jbNote(g === 0 ? 96 : g === 1 ? 91 : 84, t, 0.06, 'sine', 0.05, sfxBus); },
  miss() { if (!actx) return; const t = actx.currentTime; const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(110, t + 0.15); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.2); },
  pick() { if (!actx) return; jbNote(84, actx.currentTime, 0.08, 'square', 0.04, sfxBus); },
  go() { if (!actx) return; const t = actx.currentTime; [72, 76, 79, 84].forEach((m, i) => jbNote(m, t + i * 0.07, 0.2, 'square', 0.04, sfxBus)); },
  star(i) { if (!actx) return; jbNote(79 + i * 5, actx.currentTime, 0.4, 'triangle', 0.08, sfxBus); },
};

// ---------- 🎯 Turning a song into arrows ----------
const LANES = ['←', '↓', '↑', '→'], LANE_KEYS = ['ArrowLeft', 'ArrowDown', 'ArrowUp', 'ArrowRight'];
const LANE_COL = ['#ff4fa3', '#40c4ff', '#76ff03', '#ffb300'];
const DIFFS = [
  { name: 'Easy', icon: '🙂', win: [0.075, 0.13, 0.2], speed: 300, col: '#66bb6a' },
  { name: 'Normal', icon: '😎', win: [0.055, 0.1, 0.15], speed: 380, col: '#29b6f6' },
  { name: 'Hard', icon: '🔥', win: [0.045, 0.085, 0.13], speed: 460, col: '#ff7043' },
];
const GRADES = [['PERFECT', '#ffea00', 300, 1], ['GREAT', '#76ff03', 200, 0.8], ['OK', '#40c4ff', 100, 0.5], ['MISS', '#ff8a80', 0, 0]];
const COUNT_IN = 8;                                    // 4 beats of "1, 2, 3, 4" before the song starts
const loopsOf = T => T.mel.length >= 128 ? 2 : 3;
const totalSteps = T => loopsOf(T) * T.mel.length;
// each melody note gets an arrow chosen by its pitch: low notes on the left, high notes on the right
function laneMap(T) {
  const ps = [...new Set(T.mel.filter(m => m))].sort((a, b) => a - b), map = {};
  ps.forEach((p, i) => map[p] = Math.min(3, Math.floor(i * 4 / ps.length)));
  return map;
}
function buildChart(T, diff) {
  const map = laneMap(T), notes = [], N = totalSteps(T);
  let count = 0, last = -99;
  for (let k = 0; k < N; k++) {
    const m = T.mel[k % T.mel.length]; if (!m) continue;
    count++;
    if (diff === 0 && count % 2 === 0) continue;                // 🙂 Easy: every other note
    if (diff === 1 && k - last < 2) continue;                   // 😎 Normal: skip the super-fast ones
    last = k;
    const lane = map[m];
    notes.push({ t: k * T.step, lane, k, m, done: false });
    if (diff === 2 && k % 8 === 0) notes.push({ t: k * T.step, lane: (lane + 2) % 4, k, m, done: false, harmony: true });   // 🔥 Hard: harmony notes too
  }
  return notes;
}

// ---------- Game state ----------
let state = 'title', frame = 0, sel = save.song | 0, diff = save.diff | 0;
if (sel < 0 || sel >= SONGS.length) sel = 0;
if (diff < 0 || diff > 2) diff = 1;
let game = null, results = null, calib = null, preview = null;
let parts = [], pops = [], wobble = 0, flash = [0, 0, 0, 0], hold = [0, 0, 0, 0], cheer = 0, menuHover = -1;
const bestKey = (i, d) => SONGS[i].name + '|' + d;
function startSong() {
  initAudio(); preview = null; sfx.go();
  const T = SONGS[sel];
  save.song = sel; save.diff = diff; writeSave();
  const notes = buildChart(T, diff);
  game = { T, d: DIFFS[diff], notes, start: clock() + 0.4 + COUNT_IN * T.step, k: -COUNT_IN, score: 0, combo: 0, maxCombo: 0,
           counts: [0, 0, 0, 0], last: notes.length ? notes[notes.length - 1].t : 0, grade: null, gradeT: 0, endAt: 0 };
  game.endSong = totalSteps(T) * T.step;
  parts = []; pops = []; wobble = 0;
  state = 'play';
}
const songTime = () => game ? clock() - game.start - save.offset : 0;
function schedule() {
  if (!actx) return;
  const ahead = clock() + 0.2;
  if (state === 'play' && game) {
    const T = game.T, N = totalSteps(T);
    while (game.k < N && game.start + game.k * T.step < ahead) {
      const at = game.start + game.k * T.step;
      if (at >= actx.currentTime - 0.02) {
        if (game.k < 0) { if ((game.k + COUNT_IN) % 2 === 0) { drum('h', at, 0.12); jbNote(game.k === -COUNT_IN ? 84 : 79, at, 0.1, 'square', 0.05); } }
        else playStep(T, game.k, at, true);
      }
      game.k++;
    }
  } else if ((state === 'title' || state === 'songs') && preview) {
    const T = preview.T;

// ---------- 🤖 Robo (same look as Robo Jump 4: white round robot, dark visor, blue eyes, blue ear pods) + dancing arms ----------
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };

function drawRoboDancer(cx, feet, sc, beat, level, wob) {

  ctx.fillRect(x + w - 12 + (legKick > 0 ? 3 : 0), y + h - 7 * (h / 40) - (legKick > 0 ? 3 : 0), 8, 7 * (h / 40));

  circle(x + w / 2, y + h * 0.7, 3 * (w / 30), level >= 3 ? ['#ff4fa3', '#ffea00', '#76ff03', '#40c4ff'][Math.floor(beat * 2) % 4] : pal.pod);
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9 * (h / 40), 3, pal.pod);
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9 * (h / 40), 3, pal.pod);
  roundRect(x - 2, y, w + 4, h * 0.55, 12 * (w / 30), pal.head);

}

// ---------- 🔁 Update ----------

    if (t > game.endSong + 0.6 && game.notes.every(n => n.done)) finishSong();
