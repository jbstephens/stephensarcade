    if (!src) return src;
    var n = src.length, anyStd = false, i, p;
    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }
    out.length = n;
    for (i = 0; i < n; i++) {
      p = src[i];
      out[i] = (!p || PHANTOM.test(p.id || '') || (anyStd && p.mapping !== 'standard')) ? null : p;
    }
    return out;
  }
  try { nav.getGamepads = filtered; } catch (e) {}
  if (nav.getGamepads !== filtered) {
    try { Object.defineProperty(nav, 'getGamepads', { value: filtered, configurable: true, writable: true }); } catch (e) {}
  }
  try { nav.__gfPadFilter = true; } catch (e) {}
})();

<script>
// INSIDE THE GAME FACTORY: the secret room in the Game Factory book.
// Orders come in, tap the part machines (or press 1-4) in the right order, the assembler builds it, and it ships!
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }   // for the Trophy Room in the Game Factory book
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const SHIFT_FRAMES = 150 * 60;                 // a shift is 2 and a half minutes
const STAR_AT = [3, 6, 10];                    // products shipped for 1, 2, 3 stars
const BELT_Y = 384, BELT_X0 = 30, BELT_X1 = 776, ASM_X = 832, DOOR_X = 900;
const MACH_X = [112, 270, 428, 586], MACH_Y = 150, MACH_W = 132, MACH_H = 176;
let best = 0;
try { best = (JSON.parse(localStorage.getItem('factoryFloor') || '{}') || {}).best || 0; } catch (_) {}
function saveBest() { try { localStorage.setItem('factoryFloor', JSON.stringify({ best })); } catch (_) {} }

// ---------- Little drawing helpers ----------
function rr(x, y, w, h, r, col) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (col) { ctx.fillStyle = col; ctx.fill(); }
}
function circ(x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (col) { ctx.fillStyle = col; ctx.fill(); } }
function text(s, x, y, size, col, align = 'center', stroke = null) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Arial Rounded MT Bold", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function gear(x, y, r, teeth, ang, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a = i * Math.PI / teeth, rad = i % 2 ? r : r * 1.22;
    ctx.lineTo(Math.cos(a - 0.18) * rad, Math.sin(a - 0.18) * rad); ctx.lineTo(Math.cos(a + 0.18) * rad, Math.sin(a + 0.18) * rad);
  }
  ctx.closePath(); ctx.fill(); circ(0, 0, r * 0.35, 'rgba(0,0,0,.35)'); ctx.restore();
}

// ---------- Sound ----------
let actx = null;
function wakeAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } if (actx && actx.state === 'suspended') actx.resume(); }
function note(freq, start, dur, wave = 'square', vol = 0.1, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  clank:  () => { note(180, 0, 0.08, 'square', 0.09, 90); note(1400, 0, 0.04, 'square', 0.03, 700); },
  stamp:  () => { note(120, 0, 0.12, 'triangle', 0.2, 50); note(900, 0.02, 0.05, 'square', 0.04); },
  plop:   () => note(500, 0, 0.1, 'sine', 0.14, 200),
  click:  () => note(800, 0, 0.05, 'sine', 0.12),
  good:   () => { note(880, 0, 0.08, 'square', 0.06); note(1175, 0.07, 0.12, 'square', 0.06); },
  ding:   () => { note(1568, 0, 0.6, 'sine', 0.16); note(2093, 0.12, 0.7, 'sine', 0.12); note(1047, 0, 0.3, 'triangle', 0.1); },
  bzzt:   () => { note(110, 0, 0.35, 'sawtooth', 0.09, 70); note(150, 0.05, 0.3, 'square', 0.05, 90); },
  trash:  () => { for (let i = 0; i < 5; i++) note(500 - i * 70, i * 0.05, 0.08, 'triangle', 0.1); },
  whirr:  () => note(200, 0, 0.35, 'sawtooth', 0.04, 600),
  steam:  () => note(3000, 0, 0.12, 'triangle', 0.015, 1500),
  order:  () => { note(660, 0, 0.08, 'square', 0.05); note(990, 0.1, 0.1, 'square', 0.05); },
  oops:   () => { note(400, 0, 0.18, 'triangle', 0.1, 250); note(300, 0.18, 0.25, 'triangle', 0.1, 180); },
  whistle: () => { note(1200, 0, 0.5, 'square', 0.05, 1300); note(900, 0.55, 0.5, 'square', 0.05, 950); },
  win:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.12, 0.22, 'square', 0.08)),
};

// ---------- Music: "Conveyor Belt Boogie" (a brand new bouncy factory song) ----------
let musicOn = true, nextNoteTime = 0, step = 0;
const MUSIC_BPM = 144;
const MELODY = [
  65,0,69,72, 0,72,70,69, 67,0,70,0, 74,0,72,0,   65,0,69,72, 0,77,76,74, 72,0,0,70, 69,0,0,0,
  70,0,74,77, 0,77,76,74, 72,0,69,0, 72,0,77,0,   76,74,72,70, 69,0,67,0, 65,0,72,0, 65,0,0,0,
];
const CHORDS = [53, 58, 60, 53];                             // F, Bb, C, F (one chord per 16 eighth notes)
const BASS = CHORDS.flatMap(r => [r - 12, 0, r, 0, r - 12, r - 12, r + 7, 0, r - 12, 0, r, 0, r - 12, 0, r + 7, r + 4]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const stepDur = 60 / MUSIC_BPM / 2;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
    if (m) note(midi(m), t, stepDur * 0.9, 'square', 0.045);
    if (b) note(midi(b), t, stepDur * 0.8, 'triangle', 0.1);
    if (step % 4 === 2) note(2400, t, 0.03, 'square', 0.012, 1800);   // clanky hi-hat
    if (step % 8 === 0) note(140, t, 0.1, 'triangle', 0.14, 60);     // thump
    nextNoteTime += stepDur; step++;
  }
}

// ---------- Parts and products (every part is drawn with shapes, in the style of the real characters) ----------
// Each part is drawn in "product space": (0,0) is the middle of the product's feet, up is negative y.
const PARTS = {

    ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#f57f17'; ctx.lineWidth = 2; ctx.stroke();
    circ(0, -62, 4, '#e53935'); circ(-12, -61, 3, '#29b6f6'); circ(12, -61, 3, '#66bb6a');

  dhead: { name: 'DOG HEAD', cy: -62, draw() {

    ctx.fillStyle = '#8d5a2b'; ctx.beginPath(); ctx.ellipse(0, -68, 6, 13, 0.4 + Math.sin(frame * 0.2) * 0.1, 0, Math.PI * 2); ctx.fill();

  dough: { name: 'PIZZA DOUGH', cy: -12, draw() {

};
const PRODUCTS = [
  { id: 'robo',   name: 'a ROBO!',            short: 'ROBO',       need: ['rhead', 'rbody', 'rboots'], layers: ['rboots', 'rbody', 'rhead'], move: 'fly',    col: '#29b6f6' },
  { id: 'kart',   name: 'a KART!',            short: 'KART',       need: ['wheels', 'kbody', 'steer'], layers: ['steer', 'kbody', 'wheels'], move: 'drive',  col: '#e53935' },
  { id: 'gloop',  name: 'a BOSS (King Gloop)!', short: 'KING GLOOP', need: ['goo', 'crown', 'eyes'],   layers: ['goo', 'eyes', 'crown'],     move: 'bounce', col: '#8e24aa' },
  { id: 'sparks', name: 'a SPARKS!',          short: 'SPARKS',     need: ['dhead', 'dbody', 'collar'], layers: ['dbody', 'dhead', 'collar'], move: 'walk',   col: '#ef6c00' },
  { id: 'pizza',  name: 'a PIZZA!',           short: 'PIZZA',      need: ['dough', 'sauce', 'cheese'], layers: ['dough', 'sauce', 'cheese'], move: 'slide',  col: '#f9a825' },
];
const PROD = {}; for (const p of PRODUCTS) PROD[p.id] = p;
function drawPart(id, x, y, s = 1) {                 // one part on its own, centered at x, y
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.translate(0, -PARTS[id].cy); PARTS[id].draw(); ctx.restore();
}
function drawProduct(prod, have, x, y, s = 1) {      // a product with just the parts it has so far; x, y = its feet
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (const id of prod.layers) if (have.includes(id)) PARTS[id].draw();
  ctx.restore();
}

// ---------- Game state ----------
let scene = 'title', mode = 'shift', frame = 0, t = 0, shipped = 0, newBest = false, endT = 0, endStars = 0;
let orders = [], stack = [], machines = [], belt = [], shipping = [], parts = [], pops = [], puffs = [];
let spawnT = 0, hintT = 0, lastProd = '', shake = 0, asmBump = 0, banner = null;
const lerp = (a, b, k) => a + (b - a) * Math.max(0, Math.min(1, k));
const progress = () => mode === 'shift' ? t / SHIFT_FRAMES : 0;            // 0 at the start of a shift, 1 at the end
const beltSpeed = () => lerp(3.4, 4.4, progress());
const patienceFrames = () => mode === 'shift' ? Math.round(lerp(42, 28, progress()) * 60) : Infinity;
const spawnGap = () => Math.round((mode === 'shift' ? lerp(13, 8, progress()) : 15) * 60);

function newOrder() {
  let p; do { p = PRODUCTS[Math.floor(Math.random() * PRODUCTS.length)]; } while (p.id === lastProd);
  lastProd = p.id;
  return { prod: p, pat: 0, max: 0, pop: 0 };
}
function pop(s, x, y, col = '#fff', size = 34, life = 70) { pops.push({ s, x, y, col, size, t: 0, life }); }
function sparkle(x, y, n = 24, cols = ['#ffeb3b', '#fff', '#40c4ff', '#ff4081', '#76ff03']) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 40 + Math.random() * 30, col: cols[i % cols.length], star: i % 3 === 0 }); }
}
function puff(x, y, n = 10, col = '#eceff1') {
  for (let i = 0; i < n; i++) puffs.push({ x: x + (Math.random() - 0.5) * 30, y: y + (Math.random() - 0.5) * 20, r: 8 + Math.random() * 12,
    vx: (Math.random() - 0.5) * 2, vy: -0.5 - Math.random(), life: 40 + Math.random() * 20, max: 60, col });
}

// The part machines get re-tooled for each new order: the 3 parts it needs plus 1 silly extra part, all mixed up.
function activate() {
  if (!orders.length) orders.push(newOrder());
  const o = orders[0]; o.max = patienceFrames(); o.pat = o.max;
  const others = PRODUCTS.filter(p => p !== o.prod), d = others[Math.floor(Math.random() * others.length)];
  const list = [...o.prod.need, d.need[Math.floor(Math.random() * 3)]];
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  machines = list.map((part, i) => ({ part, cool: 0, retool: 36 + i * 6, bump: 0 }));
  stack = []; hintT = 0;
  if (scene === 'play') sfx.whirr();
}
const neededPart = () => orders.length && stack.length < 3 ? orders[0].prod.need[stack.length] : null;

function startShift() {
  wakeAudio();
  scene = 'play'; t = 0; shipped = 0; newBest = false; lastProd = '';
  orders = [newOrder(), newOrder()]; belt = []; shipping = []; parts = []; pops = []; stack = [];
  spawnT = spawnGap(); banner = { s: mode === 'shift' ? 'SHIFT START! Build what the orders say!' : 'RELAXED MODE: build as many as you like!', t: 150 };
  activate(); sfx.whistle();
}
function endShift() {
  scene = 'end'; endT = 0;
  endStars = STAR_AT.filter(n => shipped >= n).length;
  if (mode === 'shift') {
    if (shipped > best) { best = shipped; newBest = true; saveBest(); }
    if (endStars === 3) trophy('factoryFloor');
  }
  sfx.whistle(); if (endStars >= 2) setTimeout(sfx.win, 600);
}

// ---------- Player actions ----------
function dropPart(i) {
  const m = machines[i];
  if (scene !== 'play' || !m || m.retool > 0 || m.cool > 0) return false;
  m.cool = 22; m.bump = 12; sfx.stamp();
  belt.push({ part: m.part, x: MACH_X[i], y: MACH_Y + MACH_H + 4, vy: 0, onBelt: false });
  return true;
}
function trashStack() {
  if (scene !== 'play') return;
  if (stack.length) { puff(ASM_X, BELT_Y - 40, 14, '#bdbdbd'); pop('WHOOSH! All clear!', ASM_X - 40, 250, '#b2ff59', 26); }
  stack = []; sfx.trash(); hintT = 0;
}

// A part reaches the ASSEMBLER at the end of the belt
function arrive(b) {
  const want = neededPart();
  if (b.part === want) {
    stack.push(b.part); asmBump = 10; sfx.good(); hintT = 0;
    sparkle(ASM_X, BELT_Y - 40, 10);
    if (stack.length === 3) {                                   // finished!
      const o = orders.shift();
      shipping.push({ prod: o.prod, x: ASM_X, y: BELT_Y + 20, t: 0 });
      shipped++; sfx.ding(); sparkle(ASM_X, BELT_Y - 60, 40); shake = 6;
      pop('DING!', ASM_X - 20, 230, '#ffeb3b', 46); pop(o.prod.short + ' SHIPPED!', ASM_X - 60, 278, '#fff', 22, 90);
      activate();
    }
  } else {
    sfx.bzzt(); puff(ASM_X, BELT_Y - 40, 16, '#9e9e9e'); shake = 5; asmBump = 10;
    pop('BZZZT!', ASM_X - 20, 240, '#ff5252', 42);
    if (want) pop('Oops! Needed ' + PARTS[want].name, ASM_X - 120, 282, '#fff', 18, 100);
    stack = []; hintT = 0;
  }
}

// ---------- Update (fixed 60 steps a second) ----------
function update() {
  frame++;
  if (shake > 0) shake--;
  if (asmBump > 0) asmBump--;
  if (banner && --banner.t <= 0) banner = null;
  if (frame % 70 === 0) {                                          // steam puffs from the pipes
    const px = [60, 330, 640][Math.floor(Math.random() * 3)];
    puff(px, 132, 4, 'rgba(255,255,255,.8)'); if (scene === 'play' && Math.random() < 0.5) sfx.steam();
  }
  for (const p of puffs) { p.x += p.vx; p.y += p.vy; p.r += 0.4; p.life--; }
  puffs = puffs.filter(p => p.life > 0);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.t++; p.y -= 0.6; }
  pops = pops.filter(p => p.t < p.life);
  for (const s of shipping) {
    s.t++;
    const sp = { fly: 4, drive: 6, bounce: 3, walk: 2.6, slide: 3.4 }[s.prod.move];
    if (s.t > 30) s.x += sp;                                      // wait a moment so you can see it finished
  }
  shipping = shipping.filter(s => s.x < W + 80);
  if (scene === 'title' && frame % 170 === 0) shipping.push({ prod: PRODUCTS[Math.floor(frame / 170) % PRODUCTS.length], x: ASM_X, y: BELT_Y + 20, t: 0 });
  if (scene === 'end') {
    endT++;
    for (let k = 0; k < endStars; k++) if (endT === 31 + k * 25) { sfx.ding(); sparkle(390 + k * 90, 236, 16); }
    return;
  }
  if (scene !== 'play') return;

  t++; hintT++;
  for (const m of machines) {
    if (m.retool > 0 && --m.retool === 0) sfx.clank();
    if (m.cool > 0) m.cool--;
    if (m.bump > 0) m.bump--;
  }
  // parts fall out of the machines, then ride the belt to the assembler
  const sp = beltSpeed();
  for (const b of belt) {
    if (!b.onBelt) { b.vy += 0.8; b.y += b.vy; if (b.y >= BELT_Y - 22) { b.y = BELT_Y - 22; b.onBelt = true; sfx.plop(); } }
    else b.x += sp;
  }
  for (const b of belt) if (b.x >= BELT_X1) { b.done = true; arrive(b); }
  belt = belt.filter(b => !b.done);

  // orders
  if (orders.length && orders[0].max !== Infinity) {
    if (--orders[0].pat <= 0) {                                   // too slow: no problem, that customer just picks a new thing
      orders.shift(); sfx.oops(); pop('Too slow! Next order!', 330, 140, '#ffd54f', 26, 90);
      activate();
    }
  }
  for (const o of orders) if (o.pop < 1) o.pop = Math.min(1, o.pop + 0.08);
  if (--spawnT <= 0) {
    spawnT = spawnGap();
    if (orders.length < 3) { orders.push(newOrder()); sfx.order(); }
  }
  if (mode === 'shift') {
    if (t === SHIFT_FRAMES - 600) banner = { s: '10 SECONDS LEFT! Hurry hurry!', t: 120 };
    if (t >= SHIFT_FRAMES) endShift();
  }
}
