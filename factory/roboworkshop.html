function rrPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rr(x, y, w, h, r, fill, stroke, lw = 4) {
  rrPath(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, c, stroke, lw = 3) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2);
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function poly(pts, c, stroke, lw = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(pts, c, w) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function star(x, y, r, c, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = c; ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center', outline = '#1b1b2f') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (outline) { ctx.lineWidth = size / 5; ctx.strokeStyle = outline; ctx.strokeText(str, x, y); }

function wrap(s, maxW, size) {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  const words = String(s).split(' '), out = []; let cur = '';

}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;

  r = Math.round(r + (t - r) * k); g = Math.round(g + (t - g) * k); b = Math.round(b + (t - b) * k);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

}

// Draws a whole robot standing at (x, y) (that's its feet). o.explode (0-1) makes it fall apart into pieces!
function drawBot(c, x, y, s, o = {}) {
  const col = c.color, dk = shade(col, -0.3), lt = shade(col, 0.35), k = o.explode || 0, bob = o.bob || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.face || 1), s);
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.rot) ctx.rotate(o.rot);
  ell(0, 2, 72, 12, 'rgba(0,0,0,.28)');
  const piece = (cx, cy, dx, up, fall, spin, fn) => {
    ctx.save();
    if (k) { ctx.translate(cx + dx * 150 * k, cy - Math.sin(k * Math.PI) * up * 110 + k * fall); ctx.rotate(spin * k * 5); ctx.translate(-cx, -cy); }
    fn(); ctx.restore();
  };
  piece(0, -30, 0, 0, 0, 0, () => drawLegs(c, col, dk, lt, o));
  ctx.translate(0, bob);
  piece(0, -100, -0.2, 0.5, 50, 0.3, () => drawBody(c, col, dk, lt));
  piece(-60, -100, -1, 0.8, 80, -1, () => drawArm(c, -1, col, dk, lt, o));
  piece(60, -100, 1, 0.8, 80, 1, () => drawArm(c, 1, col, dk, lt, o));
  piece(0, -185, 0.6, 1.3, 160, 1.4, () => drawHead(c, col, dk, lt, o));
  ctx.restore();
}
