<script>
// =====================================================================
// 🖼️ THE ART GALLERY: 12 finished Game Factory posters (inline SVG, no filters)
// Landscape art is 1200x800 (3:2). Portrait art is 800x1000 (4:5).
// =====================================================================
const OL = '#1b1b2f';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'a0_', artSeq = 0;
function beginArt() { DEFS = []; GC = {}; GP = 'a' + (++artSeq) + '_'; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
// ---- gradients (registered per picture, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
// a round, lit-from-top-left body color
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
// a soft vertical body color
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
// soft glow + soft shadow (fake blur with transparent gradient edges)
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- shapes ----
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
function paint(f, s, w) { return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', w || 2) + ' stroke-linejoin="round" stroke-linecap="round"' : ''); }
const C = (x, y, r, f, s, w, ex) => '<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"' + paint(f, s, w) + (ex || '') + '/>';
const E = (x, y, rx, ry, f, s, w, rot, ex) => '<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + paint(f, s, w) + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : '') + (ex || '') + '/>';
const R = (x, y, w, h, r, f, s, sw, rot, ex) => '<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + paint(f, s, sw) + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : '') + (ex || '') + '/>';
const P = (d, f, s, w, ex) => '<path d="' + d + '"' + paint(f, s, w) + (ex || '') + '/>';
const L = (d, col, w, ex) => '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
const O = (op, inner) => '<g opacity="' + op + '">' + inner + '</g>';
const T = (x, y, txt, size, col, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (col || OL) + '" text-anchor="middle" font-weight="bold" font-family="Chalkboard SE, Comic Sans MS, sans-serif"' + (ex || '') + '>' + txt + '</text>';
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const eglow = (x, y, rx, ry, c, a) => E(x, y, rx, ry, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const twinkle = (x, y, r, col) => glow(x, y, r * 1.6, col || '#fff8c4', .7) + sparkle(x, y, r, col || '#fff');
// seeded random so every picture always looks the same
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function starField(W, H, count, seed, maxY, col) {
  const r = rng(seed); let s = '';
  for (let i = 0; i < count; i++) { const x = r() * W, y = r() * (maxY || H), z = r();
    s += z > .93 ? twinkle(x, y, 4 + z * 4, col) : C(x, y, .8 + z * 1.8, col || '#fff', 0, 0, ' opacity="' + n(.35 + z * .6) + '"'); }
  return s;
}
// light rays from a point (fake god rays)
function rays(x, y, len, count, col, a, spread, start) {
  let s = ''; spread = spread || Math.PI * 2; start = start === undefined ? -Math.PI / 2 - spread / 2 : start;
  for (let i = 0; i < count; i++) { const a1 = start + (i + .5) * spread / count, w = spread / count * .32;
    s += P(poly([x, y, x + Math.cos(a1 - w) * len, y + Math.sin(a1 - w) * len, x + Math.cos(a1 + w) * len, y + Math.sin(a1 + w) * len]), lin([[0, col, a], [1, col, 0]], x, y, x + Math.cos(a1) * len, y + Math.sin(a1) * len, true)); }
  return s;
}
// puffy cloud, lit from above
function cloud(x, y, s, top, bot, a) {
  const f = lin([[0, top || '#ffffff'], [1, bot || '#cfd8ec']]);
  return G(x, y, s, '<g' + (a ? ' opacity="' + a + '"' : '') + '>' + E(0, 18, 92, 22, f) + C(-48, 6, 30, f) + C(-10, -10, 42, f) + C(36, 2, 32, f) + C(64, 12, 22, f) + '</g>');
}
// finished picture wrapper
function svgWrap(W, H, body, ex) {
  const cp = clip('frame', '<rect x="0" y="0" width="' + W + '" height="' + H + '"/>');
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" overflow="hidden" ' + (ex || '') + '><defs>' + DEFS.join('') + '</defs><g' + cp + '>' + body + '</g></svg>';
}
// =====================================================================
// CHARACTERS (each drawn around 0,0, about 120 tall, feet near y=56)
// =====================================================================
function jetFlame(x, y, s, hot) {
  return G(x, y, s || 1, eglow(0, 16, 16, 26, hot || '#7df9ff', .7) +
    P('M-8 0 Q-10 18 0 38 Q10 18 8 0 Z', lin([[0, '#ffffff'], [.4, hot || '#7df9ff'], [1, hot || '#7df9ff', 0]])) +
    P('M-4 0 Q-5 10 0 22 Q5 10 4 0 Z', '#ffffff', 0, 0, ' opacity=".9"'));
}
// ROBO: white round robot, dark visor, blue eyes, blue ear pods, antenna, jet boots
function robo(o) {

const SIZES = [

function layout(o) {

      for (var a = 0; a < gp.axes.length; a++) if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  hub.fns.push(function (now, pads) {
    if (leaving) return;
    if (IS_BOOK) {                     // while a game is open its own overlay owns the idle timer
      if (!player) player = document.getElementById('player');
      if (player && player.classList.contains('open')) { last = now; return; }
    }
    if (padActive(pads)) last = now;
    if (now - last < IDLE_MS) return;
    leaving = true;
    var g = false;
    try { g = window.parent !== window && typeof window.parent.closeGame === 'function'; } catch (e) {}
    if (g) { try { window.parent.closeGame(); } catch (e) {} }
    else location.href = '/';          // pagehide fires -> games persist their state
  });
})();
</script>
</body>
</html>
