function checker(x, y, w, h, k) { let s = ''; const c = Math.max(1, Math.round(h / (k || 10))), sz = h / c;
  for (let j = 0; j < c; j++) for (let i = 0; i * sz < w; i++) if ((i + j) % 2 === 0) s += '<rect x="' + n(x + i * sz) + '" y="' + n(y + j * sz) + '" width="' + n(Math.min(sz, x + w - (x + i * sz))) + '" height="' + n(sz) + '" fill="' + INK + '"/>';
  return s; }

  for (let i = 0; i <= k; i++) { const bx = x + w * i / k; s += C(bx, y, 4.5, ball(i % 2 ? '#ffd740' : '#ff5fa2'), OL, 1) + C(bx, y + h, 4.5, ball(i % 2 ? '#ff5fa2' : '#ffd740'), OL, 1); }

function buildingSheet(b) {
  let s = BT(400, 60, b.emoji + ' ' + b.name.toUpperCase(), b.name.length > 20 ? 30 : 38, b.tcol);
  const x0 = (800 - 2 * b.W - 2 * b.D) / 2, y0 = 114;
  s += boxNet(x0, y0, b.W, b.H, b.D, b.walls, 1);
  const ry = y0 + 2 * b.D + b.H + 46;
  s += BT(x0 + b.D - 32, y0 + 40, 'WALLS', 18, '#40c4ff', 'end');
  let ex = 30;
  if (b.roof === 'prism') {
    s += roofNet(44, ry, b.W, b.D, b.rh, { col: b.roofCol, gableArt: b.gableArt });
    ex = 44 + roofSize(b.W, b.D, b.rh).w + 10;
    s += BT(44 + b.rh + b.W / 2, ry - 12, 'ROOF', 18, '#40c4ff');
  }
  s += b.extras(ex, ry, 770 - ex, 890 - ry);
  return s + STEPS(b.steps);
}

const RW = .42;   // road width (part of the tile)
function roadLayers(paths, s, deco) {
  const rw = s * RW, lay = (col, w, ex) => paths.map(d => '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n(w) + '" stroke-linecap="butt" stroke-linejoin="round"' + (ex || '') + '/>').join('');
  let r = lay(INK, rw + s * .1) + lay(LINE ? '#fff' : '#d7dde0', rw + s * .085) + lay(INK, rw + 3) + lay(LINE ? '#fff' : '#5f6b73', rw);
  r += lay(LINE ? INK : '#ffd740', LINE ? 2.5 : s * .016, ' stroke-dasharray="' + n(s * .07) + ' ' + n(s * .05) + '"');
  return r;
}
function zebra(cx, cy, s, vert) {   // crosswalk stripes across a road
  const rw = s * RW; let r = '';
  for (let i = 0; i < 5; i++) { const o = -rw / 2 + rw * (i + .5) / 5 - rw * .05;
    r += vert ? '<rect x="' + n(cx - s * .05) + '" y="' + n(cy + o) + '" width="' + n(s * .1) + '" height="' + n(rw * .1) + '" fill="#fff" stroke="' + INK + '" stroke-width="1"/>'
      : '<rect x="' + n(cx + o) + '" y="' + n(cy - s * .05) + '" width="' + n(rw * .1) + '" height="' + n(s * .1) + '" fill="#fff" stroke="' + INK + '" stroke-width="1"/>'; }
  return r;
}
