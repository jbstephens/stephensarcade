  var out = [];                       // reused every call: no per-frame allocation
  function filtered() {
    var src = orig.call(nav);
    if (!src) return src;
    var n = src.length, anyStd = false, i, p;
    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }
    out.length = n;
    for (i = 0; i < n; i++) {
      p = src[i];
      out[i] = (!p || PHANTOM.test(p.id || '') || (anyStd && p.mapping !== 'standard')) ? null : p;

  try { nav.getGamepads = filtered; } catch (e) {}
  if (nav.getGamepads !== filtered) {

<script>
// THE REJECTED BOSSES — Ben's idea! A secret page past the end of the Game Factory book.
// Bosses that were NEVER supposed to be in the book (mash-ups of bosses from Ben's games). Robo fights them all.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const GRAV = 0.6, SPEED = 4.5, JUMP = 13, MAXFALL = 15;
const FLOOR = 470;                                       // top of the arena floor
const PLATS = [{ x: 90, y: 350, w: 170 }, { x: 700, y: 350, w: 170 }, { x: 395, y: 235, w: 170 }];   // floating platforms (jump up through them)
const MAX_HEARTS = 5;

// ---------- Saves for the Game Factory book ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 120; } } catch (_) {} }
const slug = name => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
let SAVE = { beaten: {}, won: 0 };                       // beaten = { gloop: 1, pinch: 1, ... }
try { const s = JSON.parse(localStorage.getItem('rejectedBosses') || '{}') || {}; if (s.beaten && typeof s.beaten === 'object') SAVE.beaten = s.beaten; SAVE.won = s.won ? 1 : 0; } catch (_) {}
function saveGame() { try { localStorage.setItem('rejectedBosses', JSON.stringify(SAVE)); } catch (_) {} }

// ---------- Robo looks: he looks just like Ben dressed him in Robo Jump! ----------
function bundleHas(j) { try { return (JSON.parse(localStorage.getItem('gfBundles') || '{}').opened || []).includes('robojump-' + j); } catch (_) { return false; } }
const LOOKS = [
  { id: 'normal', bundle: -1 }, { id: 'tophat', bundle: 0 }, { id: 'cap', bundle: 0 },
  { id: 'cowboy', bundle: 1 }, { id: 'crown', bundle: 1 }, { id: 'pinch', bundle: 2 },
];
let look = 'normal';
try {
  const saved = (JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}).robojump;
  const L = LOOKS.find(l => l.id === saved);
  if (L && (L.bundle < 0 || bundleHas(L.bundle))) look = L.id;
} catch (_) {}
function goldOpen() { try { return Object.keys(JSON.parse(localStorage.getItem('gfKeys') || '{}')).length >= 5; } catch (_) { return false; } }   // all 5 secret keys → gold
let goldOn = false, goldDraw = false;
try { goldOn = !!(JSON.parse(localStorage.getItem('gfGold') || '{}') || {}).robojump; } catch (_) {}
const isGold = () => goldOn && goldOpen();
const gc = (c, g) => goldDraw ? g : c;

// ---------- Little helpers ----------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, 7); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function rr(x, y, w, h, r, fill, stroke, lw = 4) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, c, stroke, lw = 3) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2);
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function poly(pts, c, stroke, lw = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(pts, c, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
}
let particles = [];
function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: cols[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

// ---------- Sound ----------
let actx = null;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump:    () => note(400, 0, 0.15, 'sine', 0.15, 900),
  hover:   () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  click:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  nope:    () => note(220, 0, 0.25, 'square', 0.08, 150),
  stamp:   () => { note(90, 0, 0.25, 'triangle', 0.3, 50); note(1200, 0, 0.05, 'square', 0.05); },
  ouch:    () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  warn:    () => { note(880, 0, 0.1, 'square', 0.07); note(880, 0.15, 0.1, 'square', 0.07); },
  boss:    () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },
  bossDie: () => { for (let i = 0; i < 8; i++) note(400 - i * 40, i * 0.08, 0.15, 'sawtooth', 0.08); },
  land:    () => note(80, 0, 0.5, 'triangle', 0.25, 40),
  shoot:   () => note(700, 0, 0.12, 'square', 0.05, 300),
  laser:   () => note(200, 0, 1.1, 'sawtooth', 0.07, 900),
  warp:    () => { for (let i = 0; i < 6; i++) note(300 + i * 150, i * 0.04, 0.1, 'square', 0.05); },
  honk:    () => { note(330, 0, 0.12, 'square', 0.1); note(330, 0.16, 0.2, 'square', 0.1); },
  squish:  () => note(260, 0, 0.18, 'sine', 0.15, 90),
  win:     () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
  boom:    () => { note(120, 0, 0.5, 'sawtooth', 0.12, 40); note(1500 + Math.random() * 800, 0.05, 0.3, 'triangle', 0.05, 400); },
};

// ---------- Music: an original spooky-silly chiptune (eighth notes, 0 = rest) ----------
const MUSIC_BPM = 140;          // title + boss select speed; fights play faster (168)
const FIGHT_BPM = 168;
const MELODY = [
  69,0,72,76, 74,72,69,0, 67,0,69,72, 71,0,0,0,
  69,0,72,76, 79,77,76,74, 72,74,76,72, 69,0,0,0,
  77,0,76,74, 72,0,74,76, 79,0,77,76, 74,0,71,0,
  72,71,69,71, 72,74,76,79, 81,0,76,0, 69,0,0,0,
];
const CHORDS = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [57, 60, 64]];   // Am  F  G  Am
const ARP = CHORDS.flatMap(([a, b, c]) => [a, b, c, b, a + 12, c, b, c]);
const BASS = CHORDS.flatMap(([r]) => [r - 24, 0, r - 12, 0, r - 24, 0, r - 12, r - 24]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let musicOn = true, nextNoteTime = 0, step = 0;
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = state === 'fight' || state === 'ko';
  const stepDur = 60 / (fight ? FIGHT_BPM : MUSIC_BPM) / 2;     // eighth notes
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length], a = ARP[step % ARP.length];
    note(midi(a + (fight ? 0 : 12)), t, stepDur * 0.8, 'triangle', 0.03);
    if (m) note(midi(m), t, stepDur * 0.9, 'square', 0.045);
    if (b) note(midi(b), t, stepDur * 0.9, 'triangle', 0.09);
    if (fight && step % 2 === 0) note(60 + Math.random() * 20, t, 0.04, 'square', 0.02);   // little drum tick
    nextNoteTime += stepDur; step++;
  }
}
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  try { if (actx && actx.state === 'suspended') actx.resume(); } catch (_) {}
}

// ---------- The Rejected Bosses (each one got kicked out of one of Ben's games!) ----------
const BOSSES = [
  { id: 'gloop',  name: 'Robo Gloop',   from: 'Robo Jump',                 reason: 'Too gloopy for Robo Jump!',    hp: 4, size: [96, 86],   move: 'walk', speed: 1.5, atks: ['hop', 'goo'] },
  { id: 'pinch',  name: 'Laser Pinch',  from: 'Robo Jump',                 reason: 'Lasers were TOO cool!',        hp: 4, size: [120, 70],  move: 'walk', speed: 1.8, atks: ['beam', 'snap', 'floorbeam'] },
  { id: 'teddy',  name: 'Zombie Teddy', from: 'Sparks! + Zombie Maze',     reason: 'Too stinky for Sparks!',       hp: 4, size: [104, 96],  move: 'walk', speed: 1.0, atks: ['stuff', 'minions', 'hop'] },
  { id: 'dragon', name: 'Pizza Dragon', from: "Ben's Quest + Order Up!",   reason: 'Pizza kept melting!',          hp: 4, size: [120, 110], move: 'fly',  atks: ['fire', 'pepperoni'] },
  { id: 'kart',   name: 'Kitty Kart',   from: 'Kart Party + Book Cat',     reason: 'Drove right off the page!',    hp: 4, size: [140, 90],  move: 'kart', atks: ['zoom', 'banana'] },
  { id: 'saucer', name: 'Ghost Saucer', from: 'Robo Jump + The Game Factory', reason: 'Kept turning invisible!',   hp: 4, size: [130, 70],  move: 'fly',  atks: ['tractor', 'boos'] },
  { id: 'grim',   name: 'Glitch Grim',  from: 'Feathers + Robo Jump 2',    reason: 'TOO GLITCHY! Locked away!',    hp: 8, size: [84, 124],  move: 'walk', speed: 1.2, tele: true, atks: ['bones', 'staff'], atks2: ['bones', 'zap', 'staff'], final: true },
];
const FINAL = BOSSES.length - 1;
const beatenCount = () => BOSSES.slice(0, FINAL).filter(B => SAVE.beaten[B.id]).length;
const finalOpen = () => beatenCount() >= FINAL;

let state = 'title', bossIdx = 0, boss = null, player = null, shots = [], lasers = [], marks = [], puddles = [], minions = [];
let timer = 0, frame = 0, shake = 0, hearts = MAX_HEARTS, bannerText = '', bannerT = 0, selIdx = 0, selMsg = '', selMsgT = 0;

// ---------- Drawing Robo (copied from Robo Jump, so every hat + Gold Robo look the same) ----------
function goldShine(x, y, w, h) {                       // a shiny streak sliding across (draw it while clipped to the hero)
  const t = (frame % 140) / 90; if (t > 1) return;
  const sx = x - h * 0.6 + t * (w + h * 1.2);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 8, y); ctx.lineTo(sx + 8 - h * 0.5, y + h); ctx.lineTo(sx - h * 0.5, y + h); ctx.fill();
}
function goldSparkles(x, y, w, h) {                    // little twinkles pop up around the hero now and then
  for (let i = 0; i < 3; i++) {
    const n = frame + i * 41, ph = n % 70; if (ph > 24) continue;
    const s = Math.floor(n / 70) * 3.7 + i * 1.9;
    const sx = x + w * (0.5 + 0.75 * Math.sin(s * 12.99)), sy = y + h * (0.5 + 0.7 * Math.sin(s * 78.23));
    const r = Math.sin(ph / 24 * Math.PI) * 5 + 0.5, q = r * 0.28;
    ctx.fillStyle = i ? '#fff' : '#fff59d';
    ctx.beginPath(); ctx.moveTo(sx, sy - r); ctx.lineTo(sx + q, sy - q); ctx.lineTo(sx + r, sy); ctx.lineTo(sx + q, sy + q);
    ctx.lineTo(sx, sy + r); ctx.lineTo(sx - q, sy + q); ctx.lineTo(sx - r, sy); ctx.lineTo(sx - q, sy - q); ctx.fill();
  }
}
function drawLook(p, id, gold = isGold()) {
  const sx = 1 / p.squash, sy = p.squash;
  const w = p.w * sx, h = p.h * sy;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  goldDraw = gold;
  if (id === 'pinch') { drawPinch(p, x, y, w, h); if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return; }
  if (p.hovering) {                                    // jet boot flames
    const f = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.fillStyle = gc('#3d5afe', '#ff8f00');            // legs
  ctx.fillRect(x + 4, y + h - 7, 8, 7); ctx.fillRect(x + w - 12, y + h - 7, 8, 7);
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6, gc('#f5f7ff', '#ffb300'));   // body
  ctx.fillStyle = gc('#2979ff', '#fff');               // chest light
  ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.7, 3, 0, 7); ctx.fill();
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00')); // ear pods
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00'));
  roundRect(x - 2, y, w + 4, h * 0.55, 12, gc('#ffffff', '#ffd740'));  // big round head
  if (gold) {                                          // ✨ shiny streak + a white highlight
    ctx.save(); ctx.beginPath(); ctx.roundRect(x - 2, y, w + 4, h * 0.55, 12); ctx.roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6); ctx.clip();
    goldShine(x - 2, y, w + 4, h * 0.9); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 3, 3, 1.6, -0.5, 0, 7); ctx.fill();
  }
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9, '#111827');  // dark visor
  const ex = x + w / 2 + p.face * 3, ey = y + h * 0.27;  // glowing eyes
  const blink = frame % 180 < 6 ? 1 : 5;
  ctx.fillStyle = '#40c4ff';
  ctx.beginPath(); ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();
  if (id !== 'normal') drawHat(id, x + w / 2, y + 1, w + 4, p.face);
  if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8);
  goldDraw = false;
}

// Hats: cx = middle of the head, top = top of the head, hw = head width, face = 1 right / -1 left
function drawHat(id, cx, top, hw, face) {
  ctx.save();
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1.5;
  const shape = (fill, f) => { ctx.fillStyle = fill; ctx.beginPath(); f(); ctx.fill(); ctx.stroke(); };
  if (id === 'tophat') {
    shape('#212121', () => ctx.ellipse(cx, top, hw * 0.62, 4, 0, 0, 7));          // brim
    shape('#212121', () => ctx.rect(cx - hw * 0.36, top - 22, hw * 0.72, 22));     // tall part
    ctx.fillStyle = '#e53935'; ctx.fillRect(cx - hw * 0.36, top - 8, hw * 0.72, 5);  // red band
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(cx - hw * 0.28, top - 20, 3, 10);
  } else if (id === 'cap') {
    shape('#e53935', () => ctx.ellipse(cx + face * hw * 0.45, top + 1, hw * 0.4, 3.5, 0, 0, 7));  // bill sticks out the way you face
    shape('#ff1744', () => ctx.arc(cx, top + 2, hw * 0.48, Math.PI, 0));                         // dome
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, top + 2 - hw * 0.48, 2.5, 0, 7); ctx.fill();  // button
    ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(cx - face * 3, top - 5, 3, 0, 7); ctx.fill();   // star badge
  } else if (id === 'cowboy') {
    shape('#8d5524', () => {                                                       // curvy brim
      ctx.moveTo(cx - hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx - hw * 0.6, top + 4, cx, top + 3);
      ctx.quadraticCurveTo(cx + hw * 0.6, top + 4, cx + hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx + hw * 0.6, top - 1, cx, top - 1);
      ctx.quadraticCurveTo(cx - hw * 0.6, top - 1, cx - hw * 0.8, top - 6);
    });
    shape('#a0682f', () => {                                                       // crown with a dent
      ctx.moveTo(cx - hw * 0.34, top);
      ctx.lineTo(cx - hw * 0.3, top - 15);
      ctx.quadraticCurveTo(cx, top - 10, cx + hw * 0.3, top - 15);
      ctx.lineTo(cx + hw * 0.34, top);
      ctx.closePath();
    });
    ctx.fillStyle = '#4e342e'; ctx.fillRect(cx - hw * 0.33, top - 5, hw * 0.66, 3);   // band
  } else if (id === 'crown') {
    shape('#ffd740', () => {
      ctx.moveTo(cx - hw * 0.42, top + 1);
      ctx.lineTo(cx - hw * 0.46, top - 14);
      ctx.lineTo(cx - hw * 0.22, top - 6);
      ctx.lineTo(cx, top - 18);
      ctx.lineTo(cx + hw * 0.22, top - 6);
      ctx.lineTo(cx + hw * 0.46, top - 14);
      ctx.lineTo(cx + hw * 0.42, top + 1);
      ctx.closePath();
    });
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(cx, top - 3, 2.6, 0, 7); ctx.fill();   // jewels
    ctx.fillStyle = '#2979ff'; ctx.beginPath(); ctx.arc(cx - hw * 0.25, top - 2, 2, 0, 7); ctx.arc(cx + hw * 0.25, top - 2, 2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// Captain Pinch: a small friendly crab, same size box as Robo
function drawPinch(p, x, y, w, h) {
  const cx = x + w / 2, f = p.face || 1;
  if (p.hovering) {                                    // still has jet boots!
    const fl = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + fl); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }

    if (frame % 50 < 34) text(b.id === 'saucer' ? 'RECHARGING! BOP!' : 'BOP!', cx, top - 40, 22, '#69f0ae');
  }

// ---------- Starting a fight ----------
function newPlayer() {
  return { x: 60, y: FLOOR - 36, w: 28, h: 36, vx: 0, vy: 0, onGround: true, face: 1, squash: 1, hover: 70,
           jumping: false, buffer: 0, coyote: 0, inv: 60, hovering: false };
}
function clearHazards() { shots = []; lasers = []; marks = []; puddles = []; minions = []; }
function startSplash(i) { bossIdx = i; state = 'splash'; timer = 0; clearHazards(); }
function startBoss() {
  const B = BOSSES[bossIdx], [w, h] = B.size;
  hearts = MAX_HEARTS; player = newPlayer(); clearHazards(); state = 'fight'; timer = 0;   // hearts refill for every boss
  boss = { ...B, w, h, maxHp: B.hp, x: W - 160 - w / 2, y: -h - 60, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, at: 0,
           act: 'enter', ai: 0, tp: 0, blink: 0, dying: 0, phase2: false, onGround: false, vis: 1, fly: false };
  if (B.move === 'kart') { boss.x = W + 30; boss.y = FLOOR - h; boss.onGround = true; }
  bannerText = B.name + '!'; bannerT = 120;
  sfx.boss();
}
function setAct(b, act) { b.act = act; b.at = 0; b.started = false; }
function angry(b) { return Math.min(2, b.maxHp - b.hp) + (b.phase2 ? 1 : 0); }
const pcx = () => player.x + player.w / 2, pcy = () => player.y + player.h / 2;
function aimShots(b, n, spd = 4, kind = 'ball', ox, oy) {
  const cx = ox === undefined ? b.x + b.w / 2 : ox, cy = oy === undefined ? b.y + b.h / 2 : oy;
  const a = Math.atan2(pcy() - cy, pcx() - cx);
  for (let i = 0; i < n; i++) {
    const ang = a + (i - (n - 1) / 2) * 0.4;
    shots.push({ x: cx, y: cy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 10, kind });
  }
  sfx.shoot();
}
function makeMarks(n) {                                   // red "!" stripes on the floor show where things will fall
  marks = [clamp(pcx(), 40, W - 40)];
  for (let k = 1; k < n; k++) { let mx, tries = 0; do { mx = rnd(40, W - 40); } while (marks.some(m => Math.abs(m - mx) < 110) && ++tries < 50); marks.push(mx); }
}
function clawBase(b, s) { return { x: b.x + b.w / 2 + s * 58, y: b.y + b.h - 54 }; }
function startAttack(b) {
  const list = b.phase2 ? b.atks2 : b.atks;
  b.atk = list[b.ai++ % list.length];
  setAct(b, 'warn'); sfx.warn();
  b.aimSide = Math.sign(pcx() - b.x - b.w / 2) || 1;
  if (b.atk === 'beam') {                                  // aim the laser claw at Robo (the dashed line shows where)
    const c = clawBase(b, b.aimSide); b.beamA = Math.atan2(pcy() - c.y, pcx() - c.x);
  }
  if (b.atk === 'pepperoni') makeMarks(4);
  if (b.atk === 'bones') makeMarks(b.phase2 ? 5 : 4);
  if (b.atk === 'zoom') { b.dir = b.aimSide; sfx.honk(); }
}
function bossTeleport(b) {
  burst(b.x + b.w / 2, b.y + b.h / 2, ['#ff00ff', '#00e5ff', '#fff'], 18, 5);
  let nx, tries = 0;
  do { nx = rnd(30, W - 30 - b.w); } while (Math.abs(nx + b.w / 2 - pcx()) < 240 && ++tries < 40);
  b.x = nx; sfx.warp();
  burst(b.x + b.w / 2, b.y + b.h / 2, ['#ff00ff', '#00e5ff', '#fff'], 18, 5);
}

// ---------- Boss brains: walkers (Robo Gloop, Laser Pinch, Zombie Teddy, Glitch Grim) ----------
function walkerPhysics(b) {
  const was = b.onGround;
  if (!b.fly) { b.vy = Math.min(b.vy + GRAV, MAXFALL); b.y += b.vy; }
  b.x += b.vx; b.onGround = false;
  if (b.y + b.h >= FLOOR) { b.y = FLOOR - b.h; b.vy = 0; b.onGround = true; }
  let wall = false;
  if (b.x < 10) { b.x = 10; wall = true; } else if (b.x + b.w > W - 10) { b.x = W - 10 - b.w; wall = true; }
  return { landed: b.onGround && !was, wall };
}
function warnTime(b) { return { beam: 70, floorbeam: 80, bones: 70, pepperoni: 70, zoom: 70, tractor: 60 }[b.atk] || 55; }
function updateWalker(b) {
  const A = angry(b), ph = walkerPhysics(b);
  if (b.act === 'enter') { b.vx = 0; if (ph.landed) { shake = 10; sfx.land(); } if (b.onGround && b.at > 60) setAct(b, 'move'); return; }
  if (b.act === 'move') {
    if (b.blink > 0) { b.vx = 0; if (--b.blink === 0) bossTeleport(b); return; }
    b.vx = b.dir * (b.speed + A * 0.3);
    if (ph.wall) b.dir = -b.dir;
    if (b.at % 90 === 45) b.dir = Math.sign(pcx() - b.x - b.w / 2) || 1;
    if (b.tele && ++b.tp > (b.phase2 ? 140 : 210)) { b.tp = 0; b.blink = 40; }
    if (b.at > Math.max(80, 150 - A * 20) && b.onGround && b.blink === 0) startAttack(b);
    return;
  }
  if (b.act === 'warn') { b.vx = 0; if (b.at > warnTime(b)) setAct(b, 'attack'); return; }
  if (b.act === 'attack') {
    const first = !b.started; b.started = true;
    if (b.atk === 'hop') {
      if (first) { const dx = pcx() - (b.x + b.w / 2); b.vy = -14; b.vx = clamp(dx / 46, -6, 6); b.onGround = false; sfx.jump(); return; }
      if (ph.landed) {
        b.vx = 0; shake = 12; sfx.land();
        for (const d of [-1, 1]) shots.push({ x: b.x + b.w / 2 + d * b.w / 2, y: FLOOR - 12, vx: d * 4, vy: 0, r: 12, kind: 'wave' });
        setAct(b, 'dizzy');
      }
    } else if (b.atk === 'goo') {                          // Robo Gloop jets up, hovers over Robo and drops goo
      if (first) { b.fly = true; b.sub = 'up'; b.vx = 0; sfx.jump(); }
      if (b.sub === 'up') { b.y -= 5; if (b.y <= 100) { b.y = 100; b.sub = 'hover'; b.at = 1; } }
      else if (b.sub === 'hover') {
        b.vx = clamp(pcx() - (b.x + b.w / 2), -2.6, 2.6); b.y = 100 + Math.sin(b.t * 0.1) * 6;
        if (b.at % 34 === 0) { shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: 0, vy: 1, r: 11, kind: 'goo' }); sfx.squish(); }
        if (b.at > 150 + A * 30) { b.sub = 'fall'; b.fly = false; b.vx = 0; }
      } else if (ph.landed) { shake = 12; sfx.land(); setAct(b, 'dizzy'); }
    } else if (b.atk === 'beam') {                         // Laser Pinch: a big red laser (it sweeps UP, away from the floor)
      b.vx = 0;
      if (first) {
        const c = clawBase(b, b.aimSide);
        lasers.push({ kind: 'beam', bx: c.x, by: c.y, a: b.beamA, sweep: b.aimSide > 0 ? -0.004 : 0.004, t: 0 });
        sfx.laser(); shake = 6;
      }
      for (const L of lasers) if (L.kind === 'beam') b.beamA = L.a;
      if (b.at > 70) { lasers = []; setAct(b, 'dizzy'); }
    } else if (b.atk === 'floorbeam') {                    // lasers zap along the floor: get UP on a platform!
      b.vx = 0;
      if (first) { lasers.push({ kind: 'flat', y: FLOOR - 18, x: b.x, w: b.w, t: 0 }); sfx.laser(); shake = 6; }
      if (b.at > 75) { lasers = []; setAct(b, 'dizzy'); }
    } else if (b.atk === 'snap') {                         // claws snapping, scuttle-dash to the wall
      if (first) { b.dir = b.aimSide; sfx.warp(); }
      b.vx = b.dir * 7;
      if (b.at % 4 === 0) particles.push({ x: b.x + b.w / 2 - b.dir * b.w / 2, y: FLOOR - 6, vx: -b.dir, vy: -1, life: 20, color: '#cfd8dc', size: 6 });
      if (ph.wall) { b.vx = 0; shake = 14; sfx.land(); burst(b.dir > 0 ? W - 10 : 10, FLOOR - 40, ['#fff', '#ffea00'], 14, 4); b.dir = -b.dir; setAct(b, 'dizzy'); }
    } else if (b.atk === 'stuff') {                        // Zombie Teddy throws stuffing balls
      b.vx = 0;
      if (b.at === 1 || (b.at === 40 && A > 0)) {
        const cx = b.x + b.w / 2;
        for (let i = 0; i < 3; i++) shots.push({ x: cx, y: b.y + 20, vx: clamp((pcx() - cx) / 60, -5, 5) + (i - 1) * 1.3, vy: -9, r: 11, kind: 'stuff' });
        sfx.shoot();
      }

    } else if (b.atk === 'minions') {                      // ...and calls little teddy minions (stomp them!)
      b.vx = 0;

        const n = Math.min(2 + (A > 0 ? 1 : 0), 4 - minions.length);
        for (let i = 0; i < n; i++) {
          const d = i % 2 ? 1 : -1;
          minions.push({ x: clamp(b.x + b.w / 2 + d * (b.w / 2 + 20 + i * 16) - 15, 12, W - 42), y: b.y + 30, w: 30, h: 30, vx: 0, vy: -6, dir: d, life: 560, dead: 0 });
        }
        sfx.warp(); burst(b.x + b.w / 2, b.y + 30, ['#8bc34a', '#fff'], 16, 4);
      }
      if (b.at > 50) setAct(b, 'dizzy');
    } else if (b.atk === 'bones') {                        // Glitch Grim: pixel bones rain down on the "!" marks
      b.vx = 0;

      if (b.at > 70) setAct(b, 'dizzy');

        for (const d of [-1, 1]) shots.push({ x: b.x + b.w / 2 + d * b.w / 2, y: FLOOR - 12, vx: d * (b.at === 1 ? 4 : 5), vy: 0, r: 12, kind: 'wave' });
      }

// ---------- Boss brains: flyers (Pizza Dragon, Ghost Saucer) ----------
function updateFlyer(b) {
  const A = angry(b), home = b.id === 'dragon' ? 40 : 70, low = FLOOR - b.h;
  if (b.id === 'saucer') {                                 // Boo fades away... then pops back!
    const v = (Math.sin(b.t * 0.035) + 1) / 2;
    b.vis = b.act !== 'move' ? 1 : v < 0.3 ? (frame % 8 < 2 ? 0.4 : 0.07) : v;
  }
  if (b.act === 'enter') { b.y += 3; if (b.y >= home) { b.y = home; setAct(b, 'move'); } return; }
  const cruise = () => {
    b.x += b.dir * (2.2 + A * 0.4);

    b.y = home + Math.sin(b.t * 0.05) * 14;
  };
  if (b.act === 'move') { cruise(); if (b.at > Math.max(80, 140 - A * 20)) startAttack(b); }
  else if (b.act === 'warn') {
    b.y = home + Math.sin(b.t * 0.05) * 14;
    if (b.atk === 'tractor') b.x = clamp(b.x + clamp(pcx() - (b.x + b.w / 2), -3, 3), 20, W - 20 - b.w);
    if (b.at > warnTime(b)) setAct(b, 'attack');
  } else if (b.act === 'attack') {
    const first = !b.started; b.started = true;
    if (b.atk === 'fire') {                                // spicy fire arcs
      if (b.at === 1 || (b.at === 45 && A > 0)) {
        const cx = b.x + b.w / 2;
        for (let i = 0; i < 3; i++) shots.push({ x: cx, y: b.y + b.h - 58, vx: clamp((pcx() - cx) / 70, -5, 5) + (i - 1) * 1.6, vy: -3, r: 11, kind: 'fire' });
        sfx.shoot();
      }
      cruise(); if (b.at > 80) setAct(b, 'swoop');
    } else if (b.atk === 'pepperoni') {                    // raining pepperoni!
      if (first) { for (const m of marks) shots.push({ x: m, y: -20 - Math.random() * 30, vx: 0, vy: 2, r: 15, kind: 'pep' }); marks = []; sfx.warp(); }
      if (b.at > 70) setAct(b, 'swoop');
    } else if (b.atk === 'tractor') {                      // TRACTOR BEAM pulls Robo in... walk out of it!
      b.beam = true;
      if (first) sfx.laser();
      if (b.at > 130) { b.beam = false; setAct(b, 'swoop'); }
    } else if (b.atk === 'boos') {                         // little ghosts float after Robo
      if (b.at === 1) {
        for (let i = 0; i < 2 + (A > 0 ? 1 : 0); i++) shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: (i - 1) * 2, vy: 1, r: 11, kind: 'boo', life: 230 });
        sfx.warp();
      }
      cruise(); if (b.at > 60) setAct(b, 'swoop');
    }
  } else if (b.act === 'swoop') {                          // comes down to the floor to rest (or recharge!)
    b.x = clamp(b.x + clamp(pcx() - (b.x + b.w / 2), -2, 2), 20, W - 20 - b.w);
    b.y += 3.5;
    if (b.y >= low) { b.y = low; setAct(b, 'dizzy'); shake = 10; sfx.land(); }
  } else if (b.act === 'dizzy') {
    b.y = low;
    if (b.at > 170 - A * 10) setAct(b, 'rise');
  } else if (b.act === 'rise') {
    b.y -= 3.5; if (b.y <= home) { b.y = home; setAct(b, 'move'); }
  }

// ---------- Boss brain: Kitty Kart ----------
function updateKart(b) {
  const A = angry(b), cx = b.x + b.w / 2;
  b.y = FLOOR - b.h; b.onGround = true;
  if (b.act === 'enter') { b.dir = -1; b.x -= 5; if (b.x <= W - 30 - b.w) { sfx.honk(); setAct(b, 'move'); } return; }
  if (b.act === 'move') {                                  // drive to the far side, away from Robo
    if (b.at === 1) b.goal = pcx() < W / 2 ? W - 20 - b.w : 20;
    const d = b.goal - b.x;
    if (Math.abs(d) > 4) { b.dir = Math.sign(d); b.x += b.dir * 3; }
    else b.dir = Math.sign(pcx() - cx) || -1;
    if (b.at > Math.max(80, 140 - A * 20) && Math.abs(d) <= 4) startAttack(b);
    return;
  }
  if (b.act === 'warn') {                                  // VROOM VROOM revving
    if (b.at % 5 === 0) particles.push({ x: cx - b.dir * b.w / 2, y: FLOOR - 16, vx: -b.dir * 2, vy: -1, life: 24, color: '#b0bec5', size: 8 });
    if (b.at > warnTime(b)) setAct(b, 'attack');
    return;
  }
  if (b.act === 'attack') {
    if (b.atk === 'zoom') {                                // ZOOM across the arena: jump over it!
      b.x += b.dir * (8 + A * 0.5);
      if (b.at % 3 === 0) particles.push({ x: cx - b.dir * b.w / 2, y: FLOOR - 8, vx: -b.dir, vy: -1, life: 20, color: '#cfd8dc', size: 7 });
      if (b.x < 10 || b.x + b.w > W - 10) {
        b.x = clamp(b.x, 10, W - 10 - b.w); shake = 16; sfx.land();
        burst(b.dir > 0 ? W - 10 : 10, FLOOR - 50, ['#fff', '#ffea00', '#7e57c2'], 18, 5); setAct(b, 'dizzy');
      }
    } else if (b.atk === 'banana') {                       // banana peels everywhere!
      if (b.at === 1 || b.at === 30 || (b.at === 60 && A > 0)) {
        shots.push({ x: cx, y: b.y - 10, vx: clamp((pcx() - cx) / 60, -6, 6) + rnd(-1.5, 1.5), vy: -8, r: 11, kind: 'banana' });
        sfx.shoot();
      }
      if (b.at > 80) setAct(b, 'dizzy');
    }
    return;
  }
  if (b.act === 'dizzy' && b.at > 150 - A * 10) setAct(b, 'move');
}

// ---------- Bopping, getting hurt, winning ----------
function bossHitbox(b) {
  const box = { gloop: [8, 8], pinch: [22, 16], teddy: [14, 0], dragon: [22, 14], kart: [10, 4], saucer: [10, 20], grim: [16, 0] }[b.id];
  return { x: b.x + box[0], y: b.y + box[1], w: b.w - box[0] * 2, h: b.h - box[1] - (b.id === 'saucer' ? 10 : 0) };
}
function updateBoss() {
  const b = boss; if (!b) return;
  b.t++; b.at++;
  if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) { burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffea00', '#ff9100', '#fff'], 10, 5); sfx.boom(); }
    if (b.dying > 80) bossBeaten();
    return;
  }
  if (b.move === 'walk') updateWalker(b); else if (b.move === 'fly') updateFlyer(b); else updateKart(b);
  const p = player, hb = bossHitbox(b);                    // bop the boss on the head! (or bump into it and get hurt)
  if (b.act !== 'enter' && b.hurt === 0 && b.vis > 0.3 && overlap(p, hb)) {
    if (p.vy > 0 && p.y + p.h - p.vy <= hb.y + 30) bopBoss(b);
    else if (b.act !== 'dizzy' && b.blink === 0 && overlap(p, { x: hb.x + 8, y: hb.y + 8, w: hb.w - 16, h: hb.h - 8 })) hurt(Math.sign(pcx() - (b.x + b.w / 2)) || 1);
  }
}
function bopBoss(b) {
  const p = player;
  b.hp--; b.hurt = 70; p.vy = -12; p.jumping = false; p.hover = 70; shake = 12;
  sfx.bossHit();
  burst(pcx(), b.y, ['#ffea00', '#fff', '#7df9ff'], 16, 5);
  if (b.hp <= 0) { b.dying = 1; b.beam = false; clearHazards(); sfx.bossDie(); return; }
  if (b.final && !b.phase2 && b.hp <= b.maxHp / 2) {       // Glitch Grim gets SUPER GLITCHY: phase 2!
    b.phase2 = true; b.ai = 0; b.speed += 0.5; bannerText = 'PHASE 2: SUPER GLITCH GRIM!'; bannerT = 150; shake = 24; sfx.warp();
    burst(b.x + b.w / 2, b.y + b.h / 2, ['#ff00ff', '#00e5ff', '#76ff03', '#ff1744'], 40, 7);
  }
  lasers = []; marks = []; b.beam = false;
  if (b.move === 'walk') { b.fly = false; if (b.act !== 'move') setAct(b, 'move'); b.vx = 0; }
  else if (b.move === 'fly') { if (b.act !== 'move') setAct(b, 'rise'); }
  else setAct(b, 'move');
}
let justUnlocked = false;
function bossBeaten() {
  const b = boss, wasOpen = finalOpen();
  burst(b.x + b.w / 2, b.y + b.h / 2, ['#ffea00', '#ff9100', '#fff', '#7df9ff'], 50, 8);
  boss = null; shake = 20; confetti(); sfx.win();
  sticker('rejected-' + slug(b.name));
  SAVE.beaten[b.id] = 1; saveGame();
  justUnlocked = !wasOpen && finalOpen();
  state = 'beat'; timer = 0;
}
function hurt(dir = 1) {
  const p = player;
  if (p.inv > 0 || state !== 'fight') return;
  hearts--; p.inv = 90; p.vy = -7; p.vx = dir * 6; shake = 8;
  sfx.ouch();
  burst(pcx(), p.y + 18, ['#ffffff', '#7df9ff', '#2979ff'], 20, 5);
  if (hearts <= 0) { state = 'ko'; timer = 0; clearHazards(); if (boss) boss.beam = false; }
}


// ---------- Shots, goo puddles, lasers, tractor beams and teddy minions ----------
const FALLERS = { goo: 0.25, stuff: 0.3, fire: 0.18, pep: 0.25, bone: 0.25, banana: 0.3 };
function updateShots() {
  const p = player, live = state === 'fight';
  for (const s of shots) {
    if (s.kind === 'boo') {                                // little ghosts slowly float after Robo
      s.vx = clamp(s.vx + Math.sign(pcx() - s.x) * 0.06, -1.8, 1.8); s.vy = clamp(s.vy + Math.sign(pcy() - s.y) * 0.05, -1.4, 1.4);
      if (--s.life <= 0) { s.gone = true; burst(s.x, s.y, ['#fff', '#e1f5fe'], 6, 2); }
    } else if (s.sit) { s.vx = 0; s.vy = 0; if (--s.sit <= 0) s.gone = true; }
    else if (FALLERS[s.kind]) s.vy = Math.min(s.vy + FALLERS[s.kind], 9);
    s.x += s.vx; s.y += s.vy;
    if (s.kind === 'boo') s.y = Math.min(s.y, FLOOR - 12);
    else if (s.kind === 'wave') { if (s.x < -20 || s.x > W + 20) s.gone = true; }
    else if (!s.sit && s.y + s.r >= FLOOR) {
      if (s.kind === 'banana') { s.sit = 240; s.y = FLOOR - 8; }                     // the peel stays on the floor!
      else {
