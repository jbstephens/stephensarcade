  #skipBtn { background: #2979ff; }

  .label { font-size: 16px; opacity: .85; margin-top: 2px; }
  .stations { display: flex; gap: 6px; }
  .st { flex: 1; font-size: 15px; padding: 10px 2px; line-height: 1.15; background: #37474f; }
  .st b { display: block; font-size: 19px; }
  .st.on[data-st="fun"] { background: #e91e63; box-shadow: 0 0 14px #ff80ab, 0 5px 0 rgba(0,0,0,.35); }
  .st.on[data-st="boss"] { background: #d50000; box-shadow: 0 0 14px #ff5252, 0 5px 0 rgba(0,0,0,.35); }
  .st.on[data-st="chill"] { background: #3949ab; box-shadow: 0 0 14px #8c9eff, 0 5px 0 rgba(0,0,0,.35); }
  #upNext { font-size: 16px; background: rgba(255,255,255,.1); border-radius: 12px; padding: 6px 10px; min-height: 30px; }
  #reqList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px 4px 8px 0; -webkit-overflow-scrolling: touch; }
  .req { text-align: left; font-size: 18px; padding: 10px 12px; background: #4527a0; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  body.boss .req { background: #8e1b1b; }
  body.chill .req { background: #283593; }
  .req.asked { background: #ffab00 !important; color: #222; }
  .req.playing { outline: 3px solid #fff; }
  #power { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;

  #power h1 { margin: 0; font-size: 54px; text-shadow: 0 0 18px #ff4081, 0 4px 0 #000; }

// ---------- 🔊 Sound ----------
let actx = null, master = null, noiseBuf = null, volume = 0.7;
let vuHits = [];          // recent note times + loudness, for the VU meters
function audio() {
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  actx = new AC(); master = actx.createGain(); master.gain.value = volume; master.connect(actx.destination);
  const n = Math.floor(actx.sampleRate * 1); noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return actx;
}
const now = () => (actx ? actx.currentTime : 0);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function note(m, at, dur, wave, vol, out) {
  const a = audio(); if (!a || !m || !isFinite(m) || !isFinite(at) || !isFinite(dur) || !isFinite(vol)) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = wave; o.frequency.value = mtof(m);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + Math.max(0.03, dur));
  o.connect(g); g.connect(out || master); o.start(at); o.stop(at + dur + 0.05);
  vuHits.push([at, vol]); if (vuHits.length > 80) vuHits.shift();
}
function noiseHit(t, type, freq, vol, decay, out) {
  const a = audio(); if (!a || !noiseBuf) return;
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = freq;
  const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out || master); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 drums (like Robo Rhythm)
function drum(kind, t, vol, out) {
  const a = audio(); if (!a) return;
  if (kind === 'k') {
    const o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(out || master); o.start(t); o.stop(t + 0.35); vuHits.push([t, vol * 0.4]);
  } else if (kind === 's') { noiseHit(t, 'highpass', 1400, vol * 0.7, 0.15, out); note(55, t, 0.08, 'triangle', vol * 0.4, out); }
  else if (kind === 'h') noiseHit(t, 'highpass', 7500, vol, 0.04, out);
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, vol, 1.0, out);
  else if (kind === 'brush') noiseHit(t, 'bandpass', 3000, vol, 0.12, out);
}
// for songs with no chords: bass follows the lowest melody note of each 4-step chunk
function rootOf(T, k) {
  const b = k - (k % 4); let lo = 0;
  for (let i = 0; i < 4; i++) { const m = T.mel[(b + i) % T.mel.length]; if (m && (!lo || m < lo)) lo = m; }
  if (!lo) { for (let i = 1; i < T.mel.length; i++) { const m = T.mel[((b - i) % T.mel.length + T.mel.length) % T.mel.length]; if (m) { lo = m; break; } } }
  while (lo > 64) lo -= 12;
  return lo || 60;
}
// play step k of a song: the Jukebox math (melody, chord arps, bass line) + drums + a bass for every song
function playStep(T, k, at, style, out) {
  const stepDur = T.step * (style === 'chill' ? 1.12 : 1);
  const m = T.mel[k % T.mel.length];
  if (m) note(m + (T.shift || 0) + (T.glitch && Math.random() < 0.04 ? 12 : 0), at, Math.max(0.1, stepDur * T.len), T.wave, (T.vol || 0.06) * 1.3, out);
  if (T.chords) {
    const ch = T.chords[Math.floor(k / 8) % 4]; const ai = T.arp[k % 8];
    note(ai === 3 ? ch[0] + 12 : ch[ai], at, stepDur * 0.8, 'triangle', 0.03, out);
    if (T.bass[k % 8]) note(ch[0] - (T.bass[k % 8] === 1 ? 24 : T.bass[k % 8] === 3 ? 17 : 12), at, stepDur * 0.9, 'triangle', 0.08, out);
  }
  if (T.bassEvery && k % T.bassEvery === 0) note(T.bassLine[Math.floor(k / T.bassEvery) % T.bassLine.length], at, stepDur * T.bassEvery * 0.75, 'sine', 0.1, out);
  if (!T.chords && !T.bassEvery && k % 4 === 0) note(rootOf(T, k) - 24, at, stepDur * 3, 'triangle', 0.09, out);
  if (style === 'chill') {                         // soft brushes, no snare
    if (k % 8 === 0) drum('k', at, 0.14, out);
    if (k % 4 === 2) drum('brush', at, 0.05, out);
  } else if (style === 'boss') {                   // big battle drums
    if (k % 2 === 0) drum('k', at, 0.34, out);
    if (k % 8 === 4) drum('s', at, 0.28, out);
    drum('h', at, k % 2 ? 0.05 : 0.09, out);
    if (k % T.mel.length === 0) drum('x', at, 0.1, out);
  } else {
    if (k % 4 === 0) drum('k', at, 0.3, out);
    if (k % 8 === 4) drum('s', at, 0.22, out);
    drum('h', at, k % 2 ? 0.04 : 0.07, out);
    if (k % T.mel.length === 0) drum('x', at, 0.08, out);
  }
}
// how many steps a song plays on the radio: whole loops, about 45-75 seconds
function songSteps(T, style) {
  const stepDur = T.step * (style === 'chill' ? 1.12 : 1), loopLen = T.mel.length * stepDur;
  let loops = Math.max(2, Math.ceil(45 / loopLen));
  while (loops > 2 && loops * loopLen > 75) loops--;
  return { steps: loops * T.mel.length, stepDur, loops, secs: loops * loopLen };
}
