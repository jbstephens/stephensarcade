<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #nBody { flex: 1; min-height: 0; display: flex; gap: 10px; }

  #nGrid.names { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; text-align: center;

    #plant, #view { flex-direction: column; }

  /* line-art sheet styles */
  .f { fill: #fff; stroke: #222; stroke-width: var(--sw, 4); stroke-linejoin: round; }
  .ln { fill: none; stroke: #222; stroke-width: var(--sw, 4); stroke-linecap: round; stroke-linejoin: round; }

  .tt { font-family: "Arial Rounded MT Bold", "Comic Sans MS", "Chalkboard SE", sans-serif; font-weight: 900; }

  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view) { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; }
  }
</style>

<body>
<div id="garden" class="screen on">

<script>
'use strict';
// ================== the plants (real beginner tips) ==================
// g = height (cm) when it reaches its last stage; fin = what the last stage looks like
const PLANTS = [
  { id: 'bean', name: 'Bean', em: '🫘', g: 30, fin: 'veggie', col: '#43a047', sprout: '4 to 10 days',
    sun: 'A sunny window once it sprouts.', water: 'Keep the paper towel or soil damp, not swimming.',
    extra: 'Fun: in a clear jar with a wet paper towel you can SEE the roots grow!' },
  { id: 'sunflower', name: 'Sunflower', em: '🌻', g: 60, fin: 'flower', col: '#ffd60a', sprout: '7 to 10 days',
    sun: 'LOTS of sun, 6 hours or more.', water: 'Keep the soil damp until it sprouts, then water when the top feels dry.',
    extra: 'Fun: big sunflowers can grow taller than a grown-up!' },
  { id: 'radish', name: 'Radish', em: '🔴', g: 12, fin: 'veggie', col: '#e53935', sprout: '3 to 7 days',
    sun: 'A sunny spot.', water: 'Keep the soil damp.',
    extra: 'Fun: radishes are ready to pull up in about 4 weeks!' },
  { id: 'pea', name: 'Pea', em: '🫛', g: 30, fin: 'veggie', col: '#7cb342', sprout: '7 to 14 days',
    sun: 'Sun, and it likes cool weather.', water: 'Water when the top of the soil feels dry.',
    extra: 'Fun: give it a stick or string. Peas climb with curly tendrils!' },
  { id: 'marigold', name: 'Marigold', em: '🌼', g: 15, fin: 'flower', col: '#ff8a1f', sprout: '5 to 7 days',
    sun: 'Full sun.', water: 'Water when the top of the soil feels dry.',
    extra: 'Fun: marigolds keep blooming all summer long!' },
  { id: 'basil', name: 'Basil', em: '🌿', g: 15, fin: 'herb', col: '#2e7d32', sprout: '5 to 10 days',
    sun: 'A warm, sunny window.', water: 'Water when the top of the soil feels dry.',
    extra: 'Fun: the leaves smell yummy. Ask a grown-up before you eat any!' },
  { id: 'cress', name: 'Cress', em: '🌱', g: 5, fin: 'herb', col: '#8bc34a', sprout: '1 to 3 days',
    sun: 'A bright windowsill.', water: 'Keep the cotton wool or paper towel damp every day.',
    extra: 'Fun: the FASTEST one! Ready in about a week.' },
  { id: 'grass', name: 'Grass Hair', em: '💇', g: 8, fin: 'hair', col: '#4caf50', sprout: '5 to 10 days',
    sun: 'A sunny window.', water: 'Keep the soil damp.',
    extra: 'Fun: when the hair gets long, a grown-up can give it a haircut!' },
  { id: 'zinnia', name: 'Zinnia', em: '🌸', g: 25, fin: 'flower', col: '#ff4f9a', sprout: '4 to 7 days',
    sun: 'Full sun, and warm.', water: 'Water the soil, not the leaves.',
    extra: 'Fun: butterflies LOVE zinnias!' },
  { id: 'pumpkin', name: 'Pumpkin', em: '🎃', g: 60, fin: 'veggie', col: '#ff8a1f', sprout: '5 to 10 days',
    sun: 'Warm and LOTS of sun.', water: 'Water lots, at the soil.',
    extra: 'Fun: pumpkin vines need a BIG space outside when they grow up!' },
];
const plantDef = id => PLANTS.find(p => p.id === id) || PLANTS[0];
const SILLY = ['Beany McBeanface', 'King Sprout', 'Gloopy Green', 'Sir Leafs-a-Lot', 'Captain Stalk', 'Sprouty McSprout',
  'Princess Petal', 'Robo-Root', 'Leafy Lou', 'Mister Wiggles', 'Rocket Sprout', 'Sammy\'s Salad'];
const WHO = ['Ben', 'Mom', 'Dad', 'Brother', 'Grandma', 'Grandpa', 'Friend'];
const POTS = [
  { id: 'robo', name: '🤖 Robo pot' }, { id: 'gloop', name: '👑 King Gloop pot' },
  { id: 'sammy', name: '🐱 Sammy pot' }, { id: 'rocket', name: '🚀 Rocket pot' },
];
const MOODS = ['😊', '🌞', '🌧️', '🐛'];
// Robo's cheers. Real lengths: a crayon is about 9 cm, a pencil about 19 cm, a cat's tail about 28 cm.
const MILESTONES = [
  { id: 'sprout', cm: 0, say: 'First sprout! 🌱' },
  { id: 'crayon', cm: 9, say: 'Taller than a crayon! 🖍️', short: '🖍️ crayon' },
  { id: 'pencil', cm: 19, say: 'Taller than a pencil! ✏️', short: '✏️ pencil' },
  { id: 'tail', cm: 28, say: 'Taller than Sammy\'s tail! 🐱', short: '🐱 Sammy\'s tail' },
  { id: 'robo', cm: 45, say: 'Taller than Robo! 🤖', short: '🤖 Robo' },
  { id: 'door', cm: 90, say: 'Taller than a doorknob! 🚪', short: '🚪 doorknob' },
  { id: 'grownup', cm: 170, say: 'Taller than a grown-up! 🦒', short: '🦒 grown-up' },
];
const MAX_PLANTS = 8, TROPHY_DAYS = 7, THIRSTY_DAYS = 3;
// ================== dates (real local date; tests set FAKE_TODAY) ==================
let FAKE_TODAY = null;
const pad2 = n => (n < 10 ? '0' : '') + n;
function todayStr() {
  if (FAKE_TODAY) return FAKE_TODAY;
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
const validDate = s => typeof s === 'string' && /^\d{4}-\d\d-\d\d$/.test(s);
const dayIndex = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const daysBetween = (a, b) => dayIndex(b) - dayIndex(a);
const dayNum = (p, d) => Math.max(1, daysBetween(p.planted, d || todayStr()) + 1);   // planting day = Day 1
const prettyDate = s => { const [y, m, d] = s.split('-').map(Number); return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1] + ' ' + d; };
// ================== saved garden ==================
let state = { plants: [], traces: {}, magic: {}, nextId: 1 };
const num = (v, lo, hi, def) => { v = Number(v); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : def; };
function cleanPlant(p) {
  if (!p || typeof p !== 'object' || !PLANTS.some(d => d.id === p.type)) return null;
  const planted = validDate(p.planted) ? p.planted : todayStr();
  const seen = {};
  const checks = (Array.isArray(p.checks) ? p.checks : []).filter(c => c && validDate(c.d) && !seen[c.d] && (seen[c.d] = 1))
    .map(c => ({ d: c.d, h: Math.round(num(c.h, 0, 500, 0) * 100) / 100, w: c.w ? 1 : 0, s: c.s ? 1 : 0, m: MOODS.includes(c.m) ? c.m : '' }))
    .sort((a, b) => dayIndex(a.d) - dayIndex(b.d));
  return { id: num(p.id, 1, 1e9, 1) | 0, type: p.type, name: typeof p.name === 'string' ? p.name.slice(0, 30) : plantDef(p.type).name,
    who: WHO.includes(p.who) ? p.who : '', pot: POTS.some(o => o.id === p.pot) ? p.pot : 'robo', planted,
    unit: p.unit === 'in' ? 'in' : 'cm', sprouted: validDate(p.sprouted) ? p.sprouted : '', checks,
    ms: Array.isArray(p.ms) ? MILESTONES.map(m => m.id).filter(id => p.ms.includes(id)) : [] };
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('roboGarden') || '{}');
    if (s && typeof s === 'object') {
      state.plants = (Array.isArray(s.plants) ? s.plants : []).map(cleanPlant).filter(Boolean).slice(0, MAX_PLANTS);
      state.traces = s.traces && typeof s.traces === 'object' ? s.traces : {};
      state.magic = s.magic && typeof s.magic === 'object' ? s.magic : {};
      state.nextId = Math.max(num(s.nextId, 1, 1e9, 1) | 0, ...state.plants.map(p => p.id + 1), 1);
    }
  } catch (_) {}
