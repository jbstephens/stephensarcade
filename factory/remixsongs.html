function playVoice(e, at, dest = BUS) {

  switch (e.v) {
    case 'wob': {   // 🎛️ WUB WUB: a fat bass through a lowpass filter, with an LFO opening and closing the filter
      const out = env(at, d, g, 0.01), lp = filt('lowpass', 900, out, 8);
      osc('sawtooth', f, at, end, lp); osc('square', f * 1.005, at, end, sub(lp, 0.6)); osc('sine', f, at, end, sub(out, 0.7));
      const l = AC.createOscillator(), lg = AC.createGain(); l.type = 'sine'; l.frequency.setValueAtTime(clamp(e.r || 4, 0.5, 30), at);

// ---------- the DJ buttons ----------
function djOut() { if (!ensureAudio()) return false; OUT = MASTER; return true; }   // DJ sounds go straight out, so they work even when the music is stopped
function djDrop() {
  if (!djOut()) return;
  const t = AC.currentTime + 0.02, rise = 1.2;
  playDJ({ v: 'riser', m: 0, d: rise, g: 0.16 }, t);
  playDJ({ v: 'boom', m: 30, d: 1.5, g: 0.6 }, t + rise);
  playDJ({ v: 'crash', m: 0, d: 2, g: 0.2 }, t + rise);
  playDJ({ v: 'kick', m: 0, d: 0.5, g: 0.6 }, t + rise);
  playDJ({ v: 'clap', m: 0, d: 0.3, g: 0.3 }, t + rise);
  if (S) { S.dropAt = sceneT + rise; S.riseAt = sceneT; }
  toast('💥 Get ready... DROP!');
}
const playDJ = (e, at) => playVoice(e, at, MASTER);
function airHorn() {   // 📯 BWAA BWA BWAAAAA
  if (!djOut()) return;
  const t0 = AC.currentTime + 0.02;
  [[0, 0.16], [0.22, 0.16], [0.44, 0.75]].forEach(([s, len]) => {
    const at = t0 + s, end = at + len;
    const out = filt('lowpass', 3800, env(at, len, 0.11, 0.01)), pk = filt('peaking', 1400, out, 1.5); pk.gain.value = 8;

  });

  toast('📯 AIR HORN!');
}
function scratch() {   // 💿 wicka-wicka: the record is pushed back and forth
  if (!djOut()) return;
  const at = AC.currentTime + 0.02, d = 0.5;
  const s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
  const n = AC.createGain(); n.connect(MASTER);
  const b = filt('bandpass', 500, n, 2.5); s.connect(b);
  const pts = [[0, 0.4, 500], [0.12, 2.2, 2600], [0.22, 0.3, 400], [0.36, 1.9, 2200], [0.5, 0.4, 500]];
  pts.forEach(([x, r, ff], i) => {
    const tt = at + x;
    if (i === 0) { s.playbackRate.setValueAtTime(r, tt); b.frequency.setValueAtTime(ff, tt); }
    else { s.playbackRate.linearRampToValueAtTime(r, tt); b.frequency.exponentialRampToValueAtTime(ff, tt); }
  });
  n.gain.setValueAtTime(0.0001, at);
  [[0, 0.5], [0.1, 0.5], [0.12, 0.05], [0.14, 0.5], [0.33, 0.5], [0.36, 0.05], [0.38, 0.45], [0.5, 0.0001]].forEach(([x, v]) => n.gain.linearRampToValueAtTime(v, at + x));
  s.start(at); s.stop(at + d + 0.05);
  if (S) S.scratch = 0.55;
  toast('💿 Wicka-wicka SCRATCH!');
}

// ---------- the player ----------
const P = { si: 0, yi: 0, sel: 0, playing: false, started: false, k: 0, next: 0, timer: null, loop: true, vol: 2, listen: 0, counted: false, vib: -1 };
let pulses = [];   // steps waiting to make the scene move, with the time they happen
const now = () => (AC ? AC.currentTime : 0);
function schedule() {
  if (!P.playing || !AC) return;
  while (P.next < AC.currentTime + 0.22) {
    if (P.k >= songSteps(P.si)) {
      if (P.loop) P.k = 0;
      else { playSong((P.si + 1) % SONGS.length, P.yi); return; }   // loop off: on to the next song
    }
    const r = arrangeStep(P.si, P.yi, P.k);
    if (VIBG && r.vib !== P.vib) { P.vib = r.vib; VIBG.gain.setValueAtTime(r.vib ? 0.0035 : 0, P.next); }   // lo-fi tape wobble on or off
    for (const e of r.ev) playVoice(e, P.next + e.t);
    r.at = P.next; pulses.push(r);
    if (pulses.length > 400) pulses.splice(0, pulses.length - 400);
    P.next += stepDur(P.si, P.yi, P.k); P.k++;
  }
}
function startTimer() { stopTimer(); P.timer = setInterval(schedule, 40); schedule(); }
function stopTimer() { if (P.timer) clearInterval(P.timer); P.timer = null; }
function playSong(si, yi = P.yi) {
  if (!ensureAudio()) return;
  P.si = si; P.yi = yi; P.sel = si; P.k = 0; P.listen = 0; P.counted = false; P.playing = true; P.started = true; P.vib = -1;
  pulses = []; newBus();
  P.next = AC.currentTime + 0.1;
  startTimer(); applyTheme(); refreshUI();
