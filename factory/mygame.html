    title: cleanText(c.title, 24, 'My Game'),

    enemy: isEmoji(c.enemy) ? c.enemy.trim() : '👾',
    item: isEmoji(c.item) ? c.item.trim() : '⭐',
    bg: BGS.includes(c.bg) ? c.bg : 'space',

    music: isFinite(mu) && mu >= 0 && mu <= 2 ? mu : 0,
    color: typeof c.color === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c.color.trim()) ? c.color.trim() : '#42a5f5',

  bop: () => tone(520, 0.12, 'square', 0.07, 200),
  zap: () => tone(1200, 0.08, 'square', 0.03, 500),

// ---------- keyboard, game controllers (via touchpad.js) and taps ----------
const keys = {}, hit = {};   // hit = pressed this frame

window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function toCanvas(e) {
  const r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0, width: W, height: H };

window.addEventListener('resize', fit);

// ---------- backgrounds (one per theme) ----------
const THEMES = {
  space: { sky: ['#070722', '#1b1050'], ground: '#5c4b8a', top: '#9a86e0', text: '#fff' },
  grass: { sky: ['#5ec8ff', '#c8f0ff'], ground: '#8d5a2b', top: '#4caf50', text: '#fff' },
  ocean: { sky: ['#0a3d7a', '#1f8fd1'], ground: '#d9b26a', top: '#f3d98b', text: '#fff' },
  candy: { sky: ['#ff9ad5', '#ffe0f3'], ground: '#b5651d', top: '#ff6fb5', text: '#fff' },
  lava:  { sky: ['#1a0505', '#5a1208'], ground: '#3a2a2a', top: '#ff7a1a', text: '#fff' },

// sparkles and "+10" pop-ups (in world space for whichever mode draws them)

const GY = 440;   // ground height

  const r = makeRng(SEED + lv * 7919), sp = C.speed;

  while (x < J.len) {
    const gap = Math.round(60 + r() * (40 + 15 * sp + 10 * lv));   // 60..175, always jumpable
    const prevEnd = x;
    x += gap;
    if (r() < 0.6) for (let i = 0; i < 3; i++) J.items.push({ x: prevEnd + gap * (i + 1) / 4, y: GY - 120 - (i === 1 ? 20 : 0), got: false });

      J.plats.push({ x: px, w: pw, y: py });

      if (lv >= 2 && r() < 0.35 * sp) J.enemies.push({ x: px + pw / 2, y: py, min: px + 16, max: px + pw - 16, dir: 1, sp: eSpeed * 0.8, alive: true, sq: 0 });
    } else {
      for (let i = 0; i < 2; i++) J.items.push({ x: x + w * (i + 1) / 3, y: GY - 30, got: false });
    }
    if (w > 300 && r() < 0.35 + 0.15 * sp + 0.05 * lv) {
      J.enemies.push({ x: x + w * (0.4 + r() * 0.3), y: GY, min: x + 100, max: x + w - 60, dir: r() < 0.5 ? -1 : 1, sp: eSpeed, alive: true, sq: 0 });
    }

}

    const dir = (right() ? 1 : 0) - (left() ? 1 : 0) + (mouse.down ? (mouse.x > W / 2 ? 1 : -1) : 0);

// ================= 4. MAZE CHASE =================
const MZ = { cols: 23, rows: 11, cell: 40, ox: 20, oy: 74, grid: null, items: [], foes: [], hero: null, exit: null, start: null, open: false };
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function mzWall(c, r) { return c < 0 || r < 0 || c >= MZ.cols || r >= MZ.rows || MZ.grid[r][c] === 1; }
function mzBuild() {
  const r = makeRng(SEED), { cols, rows } = MZ;
  const g = []; for (let y = 0; y < rows; y++) { g.push([]); for (let x = 0; x < cols; x++) g[y].push(1); }
  const stack = [[1, 1]]; g[1][1] = 0;
  while (stack.length) {   // carve a maze (every spot can be reached)
    const [cx, cy] = stack[stack.length - 1];
    const opts = DIRS.filter(([dx, dy]) => { const nx = cx + dx * 2, ny = cy + dy * 2; return nx > 0 && ny > 0 && nx < cols - 1 && ny < rows - 1 && g[ny][nx] === 1; });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[Math.floor(r() * opts.length)];
    g[cy + dy][cx + dx] = 0; g[cy + dy * 2][cx + dx * 2] = 0; stack.push([cx + dx * 2, cy + dy * 2]);
  }
  for (let y = 1; y < rows - 1; y++) for (let x = 1; x < cols - 1; x++) {   // knock out extra walls so there are loops to escape through
    if (g[y][x] !== 1) continue;
    const h = g[y][x - 1] === 0 && g[y][x + 1] === 0 && g[y - 1][x] === 1 && g[y + 1][x] === 1;
    const v = g[y - 1][x] === 0 && g[y + 1][x] === 0 && g[y][x - 1] === 1 && g[y][x + 1] === 1;
