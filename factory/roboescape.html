// ===== RULES START (the puzzle rules; the level checker uses this exact code too) =====
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const ARROWS = { '^': 'up', 'v': 'down', '<': 'left', '>': 'right' };

function nb(lv, c, dx, dy) {

function parseLevel(L) {

    const c = y * w + x;
    let ch = L.map[y][x] || '#';
    if (ch === 'P') { lv.start = c; ch = ' '; }
    else if (ch === 'b') { lv.crates.push(c); ch = ' '; }
    else if (ch === 'B') { lv.crates.push(c); ch = '_'; }
    else if (ch === 'c') { lv.coinAt[c] = lv.coins.length; lv.coins.push(c); ch = ' '; }
    else if (ch === 'k') { lv.keyAt[c] = lv.keys.length; lv.keys.push(c); ch = ' '; }
    if (ch === 'L') { lv.lockAt[c] = lv.locks.length; lv.locks.push(c); }
    if (ch === '_') lv.switches.push(c);
    if (EMIT[ch]) lv.emitters.push({ c, d: EMIT[ch] });
    if (PAD_PAIR[ch]) padPos[ch] = c;
    lv.tiles.push(ch);
  }
  for (const p in padPos) if (padPos[PAD_PAIR[p]] !== undefined) lv.pads[padPos[p]] = padPos[PAD_PAIR[p]];

  const seen = new Array(w * h).fill(false), q = [lv.start];

  while (q.length) {
    const c = q.pop(), next = Object.values(DIRS).map(([dx, dy]) => nb(lv, c, dx, dy));
    if (lv.pads[c] !== undefined) next.push(lv.pads[c]);
    for (const n of next) if (n >= 0 && !seen[n] && lv.tiles[n] !== '#' && !EMIT[lv.tiles[n]]) { seen[n] = true; q.push(n); }
  }

}
function newState(lv) { return { r: lv.start, crates: lv.crates.slice(), keys: 0, keyMask: 0, lockMask: 0, blue: 0, coinMask: 0, won: false }; }
function copyState(s) { return Object.assign({}, s, { crates: s.crates.slice() }); }
function switchesOn(lv, s) { return lv.switches.length > 0 && lv.switches.every(c => c === s.r || s.crates.includes(c)); }
function isOpen(lv, s, c) {   // doors: is this one open right now? (everything else counts as open)
  const t = lv.tiles[c];

  if (t === 'X') return !!s.blue;

}
function blocked(lv, s, c) {

}
function laserPaths(lv, s) {

    const cells = [];
    let c = e.c;
    for (;;) {
      c = nb(lv, c, e.d[0], e.d[1]);
      if (c < 0 || blocked(lv, s, c) || s.crates.includes(c)) break;
      cells.push(c);

}
function inLaser(lv, s, c) { return laserPaths(lv, s).some(p => p.cells.includes(c)); }
function crateCanGo(lv, s, c, dir) {
  if (blocked(lv, s, c) || s.crates.includes(c)) return false;
  const t = lv.tiles[c];
  if (ARROWS[t] && ARROWS[t] !== dir) return false;
  if (t === 'E' || PAD_PAIR[t]) return false;
  if (lv.coinAt[c] !== undefined && !(s.coinMask >> lv.coinAt[c] & 1)) return false;
  if (lv.keyAt[c] !== undefined && !(s.keyMask >> lv.keyAt[c] & 1)) return false;

}
function visit(lv, s, c, ev) {   // Robo steps onto a square: pick things up
  const ci = lv.coinAt[c];

  const ki = lv.keyAt[c];

// Try to move Robo one way. Returns { ok:false, why } or { ok:true, s (new state), path, tele, crate, ev }
function tryMove(lv, s0, dir) {

  const n = nb(lv, s.r, dx, dy);
  if (n < 0) return fail('wall');
  const t = lv.tiles[n];
  if (ARROWS[t] && ARROWS[t] !== dir) return fail('arrow');
  if (t === 'L' && !isOpen(lv, s, n)) {
    if (!s.keys) return fail('lock');
    s.keys--; s.lockMask |= 1 << lv.lockAt[n]; ev.push('unlock');
  } else if (blocked(lv, s, n)) return fail(t === 'G' || t === 'X' ? 'door' : 'wall');

  const ci = s.crates.indexOf(n);
  if (ci >= 0) {
    const n2 = nb(lv, n, dx, dy);
    if (n2 < 0 || !crateCanGo(lv, s, n2, dir)) return fail('crate');
    crate = { i: ci, path: [n, n2] };
    s.crates[ci] = n2; ev.push('push');
    while (lv.tiles[s.crates[ci]] === 'i') {   // crates slide on ice too
      const n3 = nb(lv, s.crates[ci], dx, dy);
      if (n3 < 0 || n3 === n || !crateCanGo(lv, s, n3, dir)) break;
      s.crates[ci] = n3; crate.path.push(n3);
    }
    if (lv.tiles[s.crates[ci]] === 'x' && !s.blue) { s.blue = 1; ev.push('blue'); }
  }
  s.r = n;
  if (inLaser(lv, s, n)) return fail('laser');

  let tele = -1;
  visit(lv, s, n, ev);
  for (;;) {
    const here = s.r, p = lv.pads[here];
    if (p !== undefined) {   // warp pad: pop out of the twin pad (if it's free)
      const tmp = copyState(s); tmp.r = p;
      if (!s.crates.includes(p) && !inLaser(lv, tmp, p)) { s.r = p; tele = path.length; path.push(p); ev.push('warp'); visit(lv, s, p, ev); }
      break;
    }
    if (lv.tiles[here] !== 'i') break;
    const m = nb(lv, here, dx, dy);   // on ice: keep sliding!
    if (m < 0 || blocked(lv, s, m) || s.crates.includes(m)) break;
    const tm = lv.tiles[m];
    if (ARROWS[tm] && ARROWS[tm] !== dir) break;

    if (inLaser(lv, tmp, m)) break;

}

// ---------- Particles ----------

// ---------- Input ----------
const KEY_DIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right',

  wakeAudio();

  if (dir || k === ' ') e.preventDefault();
  if (k === 'm' || k === 'M') { toggleMusic(); return; }
  if (e.repeat) return;
  if (screen === 'title' && (k === 'l' || k === 'L')) { cycleLook(1); sfx.click(); return; }   // L = change look
  if (screen === 'title') { if (k === 'Enter' || k === ' ' || dir) goMap(); return; }
  if (screen === 'map') {
    if (dir) {
      // move to the bubble that is really next to this one on the screen (the path snakes back and forth)
      const b = BUBBLES[mapSel], [mx, my] = { left: [-160, 0], right: [160, 0], up: [0, -125], down: [0, 125] }[dir];
      const n = BUBBLES.findIndex(o => o.x === b.x + mx && o.y === b.y + my);
      if (n >= 0 && n < LEVELS.length && n <= save.done) { mapSel = n; sfx.click(); }
    }
    if (k === 'Enter' || k === ' ') startLevel(mapSel);

  if (screen === 'won') { if (k === 'Enter' || k === ' ') nextLevel(); if (k === 'Escape') goMap(); return; }

addEventListener('keyup', e => { if (KEY_DIR[e.key] === heldDir) heldDir = null; });

let touchStart = null;

C.addEventListener('mousedown', e => {

  let vx = dx, vy = dy;

// ---------- Update ----------
function update() {
  frame++;
  if (glitchFX > 0) glitchFX--;
  else if (frame % 400 === 0 && Math.random() < 0.5) glitchFX = 5;   // the maze is glitchy!
  if (doorFlash > 0) doorFlash--;
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.confetti ? 0.05 : 0.2; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);
  for (const w of words) { w.y -= 0.7; w.life--; }
  words = words.filter(w => w.life > 0);
  if (screen === 'play') {
    if (bump && ++bump.t > 22) bump = null;
    if (anim && ++anim.t >= anim.dur) {
      anim = null;
      if (S.won) { doWin(); return; }
    }
    if (!anim) {
      if (queued) { const d = queued; queued = null; doMove(d); }
      else if (heldDir) { if (++holdT >= 14) { holdT = 6; doMove(heldDir); } }
    }
  } else if (screen === 'won' || screen === 'final') {

  }
}

function drawPlay() {
  drawBackground();

  button(560, 7, 92, 44, '↶ UNDO', '#7c4dff', undo, 20);
