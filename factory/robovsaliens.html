<script>

function bankCoin(n = 1) { try { const c = JSON.parse(localStorage.getItem('gfCoins') || '{}'); c.aliens = (c.aliens || 0) + n; localStorage.setItem('gfCoins', JSON.stringify(c)); } catch (_) {} }   // coins for the Bundle Room in the Game Factory book

  { id: 'zip', name: 'Zip the friendly alien', b: 2 },
  { id: 'gold', name: '✨ Gold Robo', b: -2 },           // unlocked by finding all 5 golden keys

function goldOpen() { try { return Object.keys(JSON.parse(localStorage.getItem('gfKeys') || '{}')).length >= 5; } catch (_) { return false; } }   // all 5 secret keys found → gold heroes
function goldPaint(x, y, w, h, dark) {                 // shiny gold "paint" for the gold hero: a gold gradient with a bright shine streak sliding across
  const g = ctx.createLinearGradient(x, y, x + w, y + h), s = (frame % 110) / 110 * 1.6 - 0.3;
  g.addColorStop(0, dark ? '#ffb300' : '#ffe57f'); g.addColorStop(1, dark ? '#e65100' : '#ff8f00');

}
function goldTwinkle(x, y, w, h) {                     // little sparkles that pop up around the gold hero now and then
  const t = Math.floor(frame / 14), ph = (frame % 14) / 14, fr = v => v - Math.floor(v);
  for (let i = 0; i < 3; i++) {
    const a = fr(Math.sin((t + i * 37) * 12.9898) * 43758.5453), b = fr(Math.sin((t + i * 37) * 78.233) * 43758.5453);
    if (a > 0.45) continue;
    const sx = x - 6 + b * (w + 12), sy = y - 6 + (a / 0.45) * (h + 12), r = 5 * Math.sin(ph * Math.PI);
    ctx.fillStyle = i ? '#fff' : '#fff59d';
    ctx.beginPath(); ctx.moveTo(sx, sy - r * 1.6); ctx.lineTo(sx + r * 0.35, sy - r * 0.35); ctx.lineTo(sx + r * 1.6, sy); ctx.lineTo(sx + r * 0.35, sy + r * 0.35);
    ctx.lineTo(sx, sy + r * 1.6); ctx.lineTo(sx - r * 0.35, sy + r * 0.35); ctx.lineTo(sx - r * 1.6, sy); ctx.lineTo(sx - r * 0.35, sy - r * 0.35); ctx.closePath(); ctx.fill();
  }
}
const lookOpen = L => L.id === 'gold' ? goldOpen() : L.b < 0 || bundleHas(L.b);
let myLook = 'normal', lookSel = 0;
try { const s = (JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}).aliens, i = LOOKS.findIndex(L => L.id === s); if (i > 0 && lookOpen(LOOKS[i])) { myLook = s; lookSel = i; } } catch (_) {}
function saveLook() { try { const o = JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}; o.aliens = myLook; localStorage.setItem('gfLooks', JSON.stringify(o)); } catch (_) {} }
function cycleLook(d) { lookSel = (lookSel + d + LOOKS.length) % LOOKS.length; if (lookOpen(LOOKS[lookSel])) { myLook = LOOKS[lookSel].id; saveLook(); } }
function checkLook() { const L = LOOKS.find(L => L.id === myLook); if (!L || !lookOpen(L)) { myLook = 'normal'; lookSel = 0; } }   // a look that got locked again goes back to normal
const heroName = () => myLook === 'zip' ? 'Zip' : 'Robo';
let actx = null;
function wakeSound() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  pew:    () => note(1400, 0, 0.09, 'square', 0.025, 500),
  pop:    () => { note(600, 0, 0.12, 'triangle', 0.18, 1400); note(1800, 0.05, 0.08, 'sine', 0.06); },
  clink:  () => note(1200, 0, 0.12, 'triangle', 0.12, 700),
  coin:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  power:  () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.06, 0.12, 'square', 0.07)),
  ouch:   () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  thud:   () => note(120, 0, 0.35, 'triangle', 0.25, 50),
  boss:   () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => note(300, 0, 0.12, 'square', 0.06, 120),
  bossDie: () => { for (let i = 0; i < 8; i++) note(400 - i * 40, i * 0.08, 0.15, 'sawtooth', 0.08); },
  mega:   () => { note(80, 0, 1.2, 'sawtooth', 0.15, 900); note(160, 0, 1.2, 'square', 0.06, 1800); },
  wave:   () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.1, 0.15, 'square', 0.08)),
  win:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.13, 0.25, 'square', 0.1)),
  sad:    () => [392, 370, 349, 330].forEach((f, i) => note(f, i * 0.22, 0.3, 'triangle', 0.15)),

// ---------- Music: "Moon Base Defenders" (an original space-battle tune) ----------
const MUSIC_BPM = 150;               // each MELODY step is an eighth note
const MELODY = [
  69,0,72,0, 76,0,74,72, 74,0,71,0, 67,0,71,74,
  76,0,79,0, 81,0,79,76, 74,0,72,0, 74,0,0,0,
  69,0,72,0, 76,0,74,72, 77,0,76,74, 72,0,74,76,
  79,0,81,83, 84,0,83,81, 79,0,76,0, 81,0,0,0,
];
const ROOTS = [57, 53, 55, 52];      // A minor, F, G, E: one per 16 steps
const BASS = ROOTS.flatMap(r => [r - 12, r, r - 12, r, r - 12, r, r - 12, r + 7, r - 12, r, r - 12, r, r - 12, r + 7, r - 12, r + 12]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let musicOn = true, nextNoteTime = 0, step = 0;
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = !!boss;
  const stepDur = 60 / (fight ? MUSIC_BPM * 1.12 : MUSIC_BPM) / 2, shift = fight ? -2 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
    if (m) note(midi(m + shift), t, stepDur * 1.8, 'square', 0.035);
    if (b) note(midi(b - 12 + shift), t, stepDur * 0.8, 'triangle', 0.1);
    if (step % 4 === 0) note(70, t, 0.08, 'sine', 0.15, 40);              // boom
    if (step % 4 === 2) note(3000, t, 0.03, 'square', 0.012, 1500);       // tss
    nextNoteTime += stepDur; step++;
  }
}

// ---------- Input ----------
const keys = { left: false, right: false, up: false, down: false, fire: false };
let confirmPressed = false, backPressed = false, superPressed = false, lookStep = 0;
const mouse = { x: 0, y: 0, down: false };
addEventListener('keydown', e => {
  wakeSound();
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = true;
  if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = true;
  if (k === ' ') { if (!keys.fire) confirmPressed = true; keys.fire = true; }
  if (k === 'Enter') confirmPressed = true;
  if (k === 'Escape') backPressed = true;
  if (k === 'x' || k === 'X') superPressed = true;
  if (k === 'm' || k === 'M') musicOn = !musicOn;
  if (state === 'title') { if (k === 'ArrowLeft') lookStep = -1; if (k === 'ArrowRight' || k === 'l' || k === 'L') lookStep = 1; }   // change your look
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
  if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
  if (k === ' ') keys.fire = false;
});
function canvasPos(e) {
  const r = C.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const MUSIC_BTN = { x: W - 64, y: 12, w: 52, h: 52 };
const RETRY_BTN = { x: W / 2 - 270, y: 250, w: 540, h: 90 };
const RESTART_BTN = { x: W / 2 - 190, y: 365, w: 380, h: 60 };
const LOOK_PANEL = { x: 170, y: 426, w: 620, h: 88 };   // the look picker on the title screen
C.addEventListener('mousedown', e => {
  wakeSound();
  const p = canvasPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (inBox(p, MUSIC_BTN)) { musicOn = !musicOn; return; }
  if (state === 'lost') {
    if (timer < 50) return;
    if (inBox(p, RETRY_BTN)) newGame(wave);
    else if (inBox(p, RESTART_BTN)) newGame(1);
    return;
  }
  if (state === 'title') {
    if (inBox(p, LOOK_PANEL)) { cycleLook(p.x < LOOK_PANEL.x + LOOK_PANEL.w / 2 - 60 ? -1 : 1); sfx.clink(); return; }   // tap ◀ / ▶ to change your look
    newGame(1); return;
  }
  if (state === 'win') { if (timer > 90) goTitle(); return; }
  mouse.down = true;                    // in a battle: finger/mouse held = fly there + fire
});
C.addEventListener('mousemove', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; });
addEventListener('mouseup', () => { mouse.down = false; });

// ---------- World ----------
let state = 'title', frame = 0, timer = 0, wave = 1, score = 0, waveStartScore = 0, coinsGot = 0;
let player, hearts = MAX_HEARTS, baseHp = 100, baseHurt = 0, superMeter = 0, megaT = 0;
let enemies = [], lasers = [], shots = [], pickups = [], particles = [], popups = [];
let queue = [], spawnT = 0, boss = null, bossDelay = 0, shake = 0, sincePower = 0, bossPowerT = 0;
let bannerText = '', bannerSub = '', bannerT = 0, bannerColor = '#ffd740', loseReason = '', waveBonus = 0;
let fireCool = 0, tripleT = 0, rapidT = 0, shieldT = 0, magnetT = 0;
const PALETTES = [
  { sky: ['#0b0630', '#2a1060'], planet: '#ff4081' },
  { sky: ['#03142e', '#0e3a5c'], planet: '#ffd740' },
  { sky: ['#1a0526', '#4a0e4e'], planet: '#69f0ae' },
  { sky: ['#06061a', '#1e1e48'], planet: '#ff6e40' },
  { sky: ['#140a00', '#40180a'], planet: '#7c4dff' },
];
const BOSSES = {
  5:  { name: 'MEGA SAUCER', hp: 45, w: 150, h: 66, speed: 2.2, tip: 'Shoot it from below! Dodge the bombs!' },
  10: { name: 'MOTHERSHIP MAX', hp: 80, w: 210, h: 90, speed: 1.8, tip: 'Watch out for its zappy spreads!' },

  zig:      { r: 19, hp: 1, pts: 150, base: 5 },

function newPlayer() { return { x: W / 2 - 14, y: 380, w: 28, h: 36, face: 1, inv: 0, vy: 0 }; }
player = newPlayer();
function goTitle() { state = 'title'; timer = 0; boss = null; enemies = []; shots = []; lasers = []; pickups = []; particles = []; popups = []; }

function waveRecipe(n) {
  const pool = ['saucer', 'saucer'];
  if (n >= 2) pool.push('zig');
  if (n >= 3) pool.push('rock');
  if (n >= 4) pool.push('bomber');
  if (n >= 6) pool.push('shield');
  if (n >= 7) pool.push('splitter');
  if (n >= 8) pool.push('zig', 'shield', 'rock');
  if (n >= 11) pool.push('splitter', 'bomber');
  const newest = { 2: 'zig', 3: 'rock', 4: 'bomber', 6: 'shield', 7: 'splitter' }[n];
  const list = [];
  const count = 8 + n * 2;
  for (let i = 0; i < count; i++) list.push(pool[Math.floor(Math.random() * pool.length)]);
  if (newest) { list[1] = newest; list[4] = newest; list[7] = newest; }
  return list;
}

function startWave(n) {
  wave = n; waveStartScore = score;
  if (n > save.wave) { save.wave = n; writeSave(); }
  enemies = []; shots = []; boss = null;
  player.inv = 60;
  const P = BOSSES[n];
  if (P) {
    queue = []; bossDelay = 120;
    banner('BOSS: ' + P.name + '!', P.tip, '#ff5252', 150); sfx.boss();
  } else {
    queue = waveRecipe(n); spawnT = 100; bossDelay = 0;

  }

}

           6: 'Shield aliens need 2 zaps!', 7: 'Splitters pop into 2 little aliens!', 14: `Almost there, ${heroName()}!` }[n] || 'Here they come!';
}
function banner(t, sub, color, time) { bannerText = t; bannerSub = sub; bannerColor = color; bannerT = time; }

function spawnEnemy(type, x, y) {
  const D = ENEMY[type], sp = 1 + (wave - 1) * 0.045;
  const e = { type, r: D.r, hp: D.hp, maxHp: D.hp, pts: D.pts, x: x ?? 40 + Math.random() * (W - 80), y: y ?? -30,

  if (type === 'rock') { e.vx = (Math.random() - 0.5) * 1.5; e.vy = (1.8 + Math.random()) * sp; e.r = 16 + Math.random() * 10; }
  if (type === 'bomber') { e.ty = 70 + Math.random() * 60; e.vx = (Math.random() < 0.5 ? -1.8 : 1.8); e.bombT = 80 + Math.random() * 60; }

  enemies.push(e);
  return e;
}

function startBoss() {
  const P = BOSSES[wave];
  boss = { kind: wave, name: P.name, hp: P.hp, maxHp: P.hp, w: P.w, h: P.h, x: W / 2 - P.w / 2, y: -P.h - 20,
           vx: P.speed, speed: P.speed, t: 0, hurt: 0, dying: 0, phase: 1, c1: 120, c2: 200, c3: 160, c4: 300 };

// ---------- Helpers ----------
function burst(x, y, colors, n = 14, power = 4, star = false) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4, star: star && i % 2 === 0 });
  }
}
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 220, color: cols[i % 5], size: 5 + Math.random() * 4, confetti: true });
}
function popup(x, y, str, color = '#ffd740', size = 22) { popups.push({ x, y, str, color, size, life: 50 }); }
function addScore(n) { score += n; if (score > save.best) save.best = score; }
function hitsPlayer(x, y, r) {
  const p = player, px = Math.max(p.x + 4, Math.min(x, p.x + p.w - 4)), py = Math.max(p.y + 4, Math.min(y, p.y + p.h - 4));
  return (x - px) ** 2 + (y - py) ** 2 < r * r;
}
function inBoss(x, y) {
  const b = boss; if (!b || b.dying) return false;
  const cx = b.x + b.w / 2, cy = b.y + b.h * 0.55;
  return ((x - cx) / (b.w / 2)) ** 2 + ((y - cy) / (b.h / 2)) ** 2 < 1;
}
function hurtRobo() {
  if (player.inv > 0 || megaT > 0) return;

  burst(player.x + 14, player.y + 18, ['#ff5252', '#fff', '#40c4ff'], 16, 4);

}
function hurtBase(n, x) {
  baseHp = Math.max(0, baseHp - n); baseHurt = 20; shake = Math.max(shake, 6); sfx.thud();
  burst(x, BASE_Y, ['#ffab40', '#ffd740', '#fff'], 10, 3);
  if (baseHp <= 0) lose('Moon Base needs a repair!');
}
function lose(why) {
  if (state !== 'play') return;
  state = 'lost'; timer = 0; loseReason = why; sfx.sad();
  burst(player.x + 14, player.y + 18, ['#fff', '#40c4ff', '#ffd740'], 30, 6, true);
  if (score > save.best) save.best = score;
  writeSave();
}
function killEnemy(e, fromMega = false) {
  e.dead = true;
  addScore(e.pts);
  popup(e.x, e.y - 10, '+' + e.pts);
  burst(e.x, e.y, ['#76ff03', '#ffd740', '#ff80ab', '#40c4ff', '#fff'], 16, 4, true);
  sfx.pop();
  if (!fromMega) superMeter = Math.min(100, superMeter + 5);
  if (e.type === 'splitter') for (const s of [-1, 1]) { const m = spawnEnemy('mini', e.x + s * 14, e.y); m.vx = s * 1.8 * m.sp; }
  if (Math.random() < 0.55) pickups.push({ kind: 'coin', x: e.x, y: e.y, vy: 1.6, t: Math.random() * 6 });
  sincePower++;
  if (Math.random() < 0.06 || sincePower >= 14) dropPower(e.x, e.y);
}
function dropPower(x, y) {
  sincePower = 0;
  const kinds = ['triple', 'rapid', 'shield', 'magnet'];
  if (hearts < MAX_HEARTS) kinds.push('heart', 'heart');
  pickups.push({ kind: kinds[Math.floor(Math.random() * kinds.length)], x: Math.max(40, Math.min(W - 40, x)), y, vy: 1.1, t: 0 });
}
function aimAt(x, y, speed) { const a = Math.atan2(player.y + 18 - y, player.x + 14 - x); return [Math.cos(a) * speed, Math.sin(a) * speed]; }
function orb(x, y, vx, vy) { shots.push({ x, y, vx, vy, r: 9, bomb: false }); }
function bomb(x, y, vx, vy) { shots.push({ x, y, vx, vy, r: 11, bomb: true }); }
function spread(x, y, n, arc, speed) {
  for (let i = 0; i < n; i++) { const a = Math.PI / 2 - arc / 2 + arc * i / (n - 1); orb(x, y, Math.cos(a) * speed, Math.sin(a) * speed); }
}

// ---------- Update ----------
function update() {
  frame++; timer++;
  if (stickerNew > 0) stickerNew--;
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.confetti ? 0.03 : 0.15; if (pt.confetti) pt.x += Math.sin(frame * 0.05 + pt.y * 0.02) * 0.6; pt.life--; }
  particles = particles.filter(p => p.life > 0 && p.y < H + 40);
  for (const p of popups) { p.y -= 0.8; p.life--; }
  popups = popups.filter(p => p.life > 0);
  if (shake > 0) shake--;
  if (baseHurt > 0) baseHurt--;
  if (bannerT > 0) bannerT--;

  if (state === 'title') { checkLook(); if (lookStep) { cycleLook(lookStep); sfx.clink(); } if (confirmPressed) newGame(1); }
  else if (state === 'win') { if (timer % 45 === 0) confetti(); if (confirmPressed && timer > 90) goTitle(); }
  else if (state === 'lost') {
    if (timer > 50 && confirmPressed) newGame(wave);
    else if (timer > 50 && backPressed) newGame(1);
  } else if (state === 'waveDone') {
    updatePlayer(); updateLasers(); updatePickups();
    if (timer > 170 || (timer > 70 && confirmPressed)) { state = 'play'; startWave(wave + 1); }
  } else if (state === 'play') {
    updatePlay();
  }
  confirmPressed = false; backPressed = false; superPressed = false; lookStep = 0;
}

function updatePlayer() {
  const p = player, SPD = 5.5;
  let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (mouse.down) {          // finger/mouse steering
    const tx = mouse.x - p.x - p.w / 2, ty = mouse.y - 60 - p.y - p.h / 2;
    dx = Math.abs(tx) > 6 ? Math.sign(tx) : 0; dy = Math.abs(ty) > 6 ? Math.sign(ty) : 0;
  }
  if (dx && dy) { dx *= 0.75; dy *= 0.75; }
  p.x = Math.max(4, Math.min(W - p.w - 4, p.x + dx * SPD));
  p.y = Math.max(TOP_LIMIT, Math.min(BASE_Y - p.h - 22, p.y + dy * SPD));
  p.vy = dy; if (dx) p.face = Math.sign(dx);
  if (p.inv > 0) p.inv--;
  if (fireCool > 0) fireCool--;
  if ((keys.fire || mouse.down) && fireCool <= 0) {
    fireCool = rapidT > 0 ? 5 : 9;
    const cx = p.x + p.w / 2, cy = p.y - 4;
    lasers.push({ x: cx, y: cy, vx: 0 });
    if (tripleT > 0) { lasers.push({ x: cx - 8, y: cy + 4, vx: -2.2 }); lasers.push({ x: cx + 8, y: cy + 4, vx: 2.2 }); }
    sfx.pew();
  }
  if (tripleT > 0) tripleT--;
  if (rapidT > 0) rapidT--;
  if (shieldT > 0) shieldT--;
  if (magnetT > 0) magnetT--;
}

function updateLasers() {
  for (const l of lasers) { l.x += l.vx; l.y -= 13; }
  for (const l of lasers) {
    if (l.y < -20) { l.gone = true; continue; }
    for (const e of enemies) {
      if (e.dead || (e.x - l.x) ** 2 + (e.y - l.y) ** 2 > (e.r + 6) ** 2) continue;
      l.gone = true; e.hp--; e.hurt = 8;
      if (e.hp <= 0) killEnemy(e); else { sfx.clink(); burst(l.x, l.y, ['#40c4ff', '#fff'], 6, 2); }
      break;
    }
    if (l.gone) continue;
    for (const s of shots) if (s.bomb && !s.gone && (s.x - l.x) ** 2 + (s.y - l.y) ** 2 < (s.r + 6) ** 2) {
      s.gone = l.gone = true; addScore(25); popup(s.x, s.y, '+25', '#fff', 18); burst(s.x, s.y, ['#ffea00', '#ff1744'], 8, 3); sfx.clink(); break;
    }
    if (!l.gone && inBoss(l.x, l.y)) {
      l.gone = true; hitBoss(1); burst(l.x, l.y, ['#ffea00', '#fff'], 4, 2);
    }
  }
  lasers = lasers.filter(l => !l.gone);
  enemies = enemies.filter(e => !e.dead);
  shots = shots.filter(s => !s.gone);
}

function hitBoss(n) {
  const b = boss; if (!b || b.dying) return;
  b.hp -= n; b.hurt = 6; superMeter = Math.min(100, superMeter + 0.6); addScore(10);
  if (frame % 4 === 0) sfx.bossHit();
  if (b.hp <= 0) { b.hp = 0; b.dying = 1; sfx.bossDie(); shots = []; }
}

function updatePickups() {
  const p = player, pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  for (const k of pickups) {
    k.t += 0.08;
    if (k.kind === 'coin' && magnetT > 0) {
      const dx = pcx - k.x, dy = pcy - k.y, d = Math.hypot(dx, dy) || 1;
      k.x += dx / d * 9; k.y += dy / d * 9;
    } else { k.y += k.vy; if (k.kind !== 'coin') k.x += Math.sin(k.t) * 1.2; }
    const reach = k.kind === 'coin' ? 22 : 34;
    if (Math.abs(k.x - pcx) < reach && Math.abs(k.y - pcy) < reach + 6) {
      k.gone = true;
      if (k.kind === 'coin') { coinsGot++; bankCoin(); addScore(10); sfx.coin(); popup(k.x, k.y - 8, '+10', '#ffd740', 18); continue; }
      sfx.power(); popup(pcx, p.y - 20, POWERS[k.kind].name, POWERS[k.kind].color, 26);
      burst(pcx, pcy, [POWERS[k.kind].color, '#fff'], 16, 4, true);
      if (k.kind === 'triple') tripleT = 600;
      if (k.kind === 'rapid') rapidT = 600;
      if (k.kind === 'shield') shieldT = 600;
      if (k.kind === 'magnet') magnetT = 600;
      if (k.kind === 'heart') { if (hearts < MAX_HEARTS) hearts++; else addScore(500); }
    }
    if (k.y > H + 30) k.gone = true;
  }
  pickups = pickups.filter(k => !k.gone);
}

function updatePlay() {
  updatePlayer();
  // SUPER mega laser
  if (superPressed && superMeter >= 100 && megaT <= 0) {
    megaT = 75; superMeter = 0; sfx.mega(); shake = 16;
    for (const e of enemies) killEnemy(e, true);
    for (const s of shots) burst(s.x, s.y, ['#fff', '#40c4ff'], 4, 2);
    shots = [];
    banner('MEGA LASER!!', '', '#7df9ff', 60);
  }
  if (megaT > 0) {
    megaT--;
    if (boss && !boss.dying) hitBoss(boss.maxHp * 0.15 / 75);
    if (megaT % 3 === 0) for (const e of enemies) if (!e.dead) killEnemy(e, true);
    shots = [];
  }
  updateLasers();

  // spawning
  if (bossDelay > 0 && --bossDelay === 0) startBoss();
  if (queue.length && --spawnT <= 0) {
    let type = queue.shift();
    if (type === 'bomber' && enemies.filter(e => e.type === 'bomber').length >= 2) type = 'saucer';
    spawnEnemy(type);
    spawnT = Math.max(24, 70 - wave * 3) + Math.random() * 20;
  }

  // aliens
  for (const e of enemies) {
    e.t++; if (e.hurt > 0) e.hurt--;
    const sp = e.sp;
    if (e.type === 'saucer' || e.type === 'shield' || e.type === 'splitter') {
      e.y += (e.type === 'saucer' ? 0.95 : e.type === 'shield' ? 0.75 : 0.8) * sp;
      e.x = e.bx + Math.sin(e.t * 0.035 + e.seed) * 45;
      e.x = Math.max(e.r, Math.min(W - e.r, e.x));
    } else if (e.type === 'zig' || e.type === 'mini') {
      e.x += e.vx; e.y += e.vy;
      if (e.x < e.r || e.x > W - e.r) { e.vx *= -1; e.x = Math.max(e.r, Math.min(W - e.r, e.x)); }
      if (e.type === 'zig' && e.t % 55 === 0 && Math.random() < 0.5) e.vx *= -1;
    } else if (e.type === 'rock') {
      e.x += e.vx; e.y += e.vy; e.rot += 0.04;
      if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
    } else if (e.type === 'bomber') {
      if (e.t > 900) e.y += 0.5;                                   // got bored, comes down
      else if (e.y < e.ty) e.y += 1.5;
      e.x += e.vx; if (e.x < 40 || e.x > W - 40) e.vx *= -1;
      if (--e.bombT <= 0 && e.y > 20) { bomb(e.x, e.y + 18, 0, 2.3 + wave * 0.05); e.bombT = Math.max(70, 140 - wave * 4) + Math.random() * 50; }
    }
    if (hitsPlayer(e.x, e.y, e.r * 0.8)) { if (player.inv <= 0 && megaT <= 0) { hurtRobo(); killEnemy(e, true); } }
    else if (e.y + e.r * 0.6 > BASE_Y) { e.dead = true; hurtBase(ENEMY[e.type].base, e.x); burst(e.x, e.y, ['#76ff03', '#fff'], 8, 3); }
  }
  enemies = enemies.filter(e => !e.dead);

  // enemy shots
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy;
    if (hitsPlayer(s.x, s.y, s.r * 0.75) && player.inv <= 0) { s.gone = true; hurtRobo(); }
    else if (s.y > BASE_Y + 4) { s.gone = true; if (s.bomb) hurtBase(4, s.x); }
    else if (s.x < -30 || s.x > W + 30 || s.y < -60) s.gone = true;
  }
  shots = shots.filter(s => !s.gone);

  updateBoss();
  updatePickups();
  if (boss && !boss.dying && ++bossPowerT % 600 === 0) dropPower(60 + Math.random() * (W - 120), -20);

  // wave cleared?
  if (state === 'play' && !queue.length && !enemies.length && !boss && bossDelay <= 0) waveComplete();
}

function updateBoss() {
  const b = boss; if (!b) return;
  b.t++; if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 6 === 0) { burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffea00', '#ff4081', '#76ff03', '#fff'], 14, 5, true); sfx.pop(); }
    b.y += 0.3;
    if (b.dying > 130) {
      burst(b.x + b.w / 2, b.y + b.h / 2, ['#ffea00', '#ff4081', '#76ff03', '#40c4ff', '#fff'], 60, 8, true);
      confetti();
      addScore(b.kind * 500); popup(b.x + b.w / 2, b.y + b.h / 2, '+' + b.kind * 500, '#ffd740', 40);
      for (const e of enemies) killEnemy(e, true);
      for (let i = 0; i < 12; i++) pickups.push({ kind: 'coin', x: b.x + Math.random() * b.w, y: b.y + b.h / 2, vy: 1.5 + Math.random(), t: i });
      boss = null;
      sticker('aliens-' + b.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'));
      if (b.kind === LAST_WAVE) winGame(); else waveComplete();
    }
    return;
  }
  const cx = b.x + b.w / 2, by = b.y + b.h * 0.85, rage = 1 - b.hp / b.maxHp;
  // movement
  if (b.y < 50) { b.y += 1.6; return; }
  const spd = b.speed * (1 + rage * 0.6) * (b.phase === 3 ? 1.25 : 1);
  b.x += Math.sign(b.vx) * spd;
  if (b.x < 10) { b.x = 10; b.vx = 1; } if (b.x > W - b.w - 10) { b.x = W - b.w - 10; b.vx = -1; }
  if (b.kind === 15 && b.phase === 3) b.y = 50 + Math.max(0, Math.sin(b.t * 0.015)) * 70;
  if (hitsPlayer(cx, b.y + b.h * 0.6, b.h * 0.45)) hurtRobo();

  b.c1--; b.c2--; b.c3--; b.c4--;
  if (b.kind === 5) {
    if (b.c1 <= 0) { b.c1 = 95 - rage * 35; for (const vx of [-1.2, 0, 1.2]) bomb(cx, by, vx, 2.2); }
    if (b.c2 <= 0) { b.c2 = 150 - rage * 50; orb(cx, by, ...aimAt(cx, by, 3.2)); }
  } else if (b.kind === 10) {
    if (b.c1 <= 0) { b.c1 = 105 - rage * 35; spread(cx, by, 5, 1.1, 3); }
    if (b.c2 <= 0) { b.c2 = 240; if (enemies.length < 6) for (const s of [-1, 1]) { const m = spawnEnemy('mini', cx + s * 50, by); m.vx = s * 1.6; } }
    if (b.c3 <= 0) { b.c3 = 140; bomb(b.x + 30, by - 10, 0, 2.3); bomb(b.x + b.w - 30, by - 10, 0, 2.3); }
  } else {                                                        // Emperor Zorg
    if (b.phase === 1 && b.hp < b.maxHp * 2 / 3) zorgPhase(2);
    if (b.phase === 2 && b.hp < b.maxHp / 3) zorgPhase(3);
    if (b.c1 <= 0) {
      b.c1 = b.phase === 3 ? 85 : b.phase === 2 ? 105 : 80;
      if (b.phase === 1) { const [vx, vy] = aimAt(cx, by, 3.2); for (const d of [-0.9, 0, 0.9]) orb(cx, by, vx + d, vy); }
      else spread(cx, by, b.phase === 3 ? 9 : 7, b.phase === 3 ? 2.2 : 1.6, 2.9);
    }
    if (b.c3 <= 0) { b.c3 = b.phase === 3 ? 75 : 120; bomb(cx - 60, by - 10, -0.6, 2.3); bomb(cx + 60, by - 10, 0.6, 2.3); }
    if (b.phase >= 2 && b.c2 <= 0) {
      b.c2 = 270;
      if (enemies.length < 6) { if (b.phase === 3) spawnEnemy('zig', cx, by); else for (const s of [-1, 1]) { const m = spawnEnemy('mini', cx + s * 60, by); m.vx = s * 1.6; } }
    }
    if (b.phase === 3 && b.c4 <= 0) { b.c4 = 190; orb(cx, by, ...aimAt(cx, by, 3.6)); }
  }
}
function zorgPhase(n) {
  const b = boss; b.phase = n; b.c1 = 90; b.c2 = 60;
  banner(n === 2 ? 'ZORG IS GETTING MAD! 😠' : 'ZORG IS SUPER MAD!! 😡', n === 2 ? 'Keep zapping!' : 'Almost there! You can do it!', '#ff5252', 120);
  sfx.boss(); shake = 14; shots = [];
  burst(b.x + b.w / 2, b.y + b.h / 2, ['#ff1744', '#ffea00', '#fff'], 30, 6, true);
  pickups.push({ kind: hearts < MAX_HEARTS ? 'heart' : 'shield', x: b.x + b.w / 2, y: b.y + b.h, vy: 1.1, t: 0 });
}

function waveComplete() {
  state = 'waveDone'; timer = 0;
  waveBonus = 250 * wave + Math.round(baseHp) * 5;
  addScore(waveBonus);
  baseHp = Math.min(100, baseHp + 35);
  lasers = []; shots = [];
  if (wave + 1 > save.wave) save.wave = Math.min(LAST_WAVE, wave + 1);
  writeSave(); sfx.wave();
}
function winGame() {
  state = 'win'; timer = 0;
  save.won = true; save.wave = LAST_WAVE; if (score > save.best) save.best = score;
  writeSave(); trophy('aliensWin');
  sfx.win(); confetti(); confetti();
}

// ---------- Drawing ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawBackground() {
  const L = PALETTES[Math.floor((wave - 1) / 3) % PALETTES.length];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 110; i++) {                      // twinkly stars drifting down
    const sx = (i * 137.5) % W, sy = ((i * 71) + frame * (0.15 + (i % 3) * 0.15)) % H;
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.sin(frame * 0.04 + i * 1.7)})`;
    const sz = i % 7 === 0 ? 3 : 2;
    ctx.fillRect(sx, sy, sz, sz);
  }
  const ss = frame % 420;                              // shooting star
  if (ss < 40) {
    const sx = 900 - ss * 18, sy = 40 + ss * 5;
    const tail = ctx.createLinearGradient(sx, sy, sx + 90, sy - 25);
    tail.addColorStop(0, '#fff'); tail.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = tail; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 90, sy - 25); ctx.stroke();
  }
  const px = 790, py = 150;                            // big ringed planet
  ctx.fillStyle = L.planet;
  ctx.beginPath(); ctx.arc(px, py, 55, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.arc(px + 15, py + 10, 50, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(px, py, 95, 20, -0.3, 0, 7); ctx.stroke();
  ctx.fillStyle = '#cfd8dc';                           // little moon
  ctx.beginPath(); ctx.arc(200, 110, 18, 0, 7); ctx.fill();
  ctx.fillStyle = '#b0bec5';
  ctx.beginPath(); ctx.arc(194, 106, 5, 0, 7); ctx.arc(206, 118, 4, 0, 7); ctx.fill();
}

function drawMoonBase() {
  // moon ground
  ctx.fillStyle = '#9ea7b3'; ctx.fillRect(0, 470, W, H - 470);
  ctx.fillStyle = '#c5ccd6'; ctx.fillRect(0, 470, W, 5);
  ctx.fillStyle = '#7d8794';
  for (const [x, y, r] of [[60, 495, 12], [250, 505, 8], [420, 490, 10], [610, 502, 14], [880, 496, 9], [730, 512, 6]]) {
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.6, r * 0.6, 0, 0, 7); ctx.fill();
  }
  // tubes between domes
  roundRect(150, 452, 660, 14, 7, '#b0bec5');
  ctx.fillStyle = '#78909c'; for (let x = 170; x < 800; x += 40) ctx.fillRect(x, 452, 4, 14);
  // antenna
  ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(640, 470); ctx.lineTo(640, 405); ctx.stroke();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(625, 470); ctx.lineTo(640, 430); ctx.lineTo(655, 470); ctx.stroke();
  ctx.fillStyle = '#eceff1'; ctx.beginPath(); ctx.ellipse(640, 412, 16, 6, -0.4, 0, 7); ctx.fill();
  ctx.fillStyle = frame % 40 < 20 ? '#ff1744' : '#ff8a80'; ctx.beginPath(); ctx.arc(640, 400, 5, 0, 7); ctx.fill();
  // glass domes
  for (const [x, r, col] of [[170, 46, '#69f0ae'], [480, 58, '#40c4ff'], [800, 46, '#ff80ab']]) {
    roundRect(x - r - 6, 462, r * 2 + 12, 12, 5, '#90a4ae');
    ctx.fillStyle = col + '55'; ctx.beginPath(); ctx.arc(x, 464, r, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#e0f7fa'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, 464, r, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(x - r * 0.4, 464 - r * 0.6, r * 0.15, r * 0.3, 0.6, 0, 7); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(x - 8, 446, 16, 18);            // little house inside
    ctx.fillStyle = '#fff59d'; ctx.fillRect(x - 4, 450, 8, 6);
  }
  // little blinking lights
  for (let i = 0; i < 16; i++) {
    ctx.fillStyle = (Math.floor(frame / 12) + i) % 4 === 0 ? '#ffea00' : ['#69f0ae', '#40c4ff', '#ff80ab'][i % 3];
    ctx.beginPath(); ctx.arc(30 + i * 60, 482, 3, 0, 7); ctx.fill();
  }
  if (baseHurt > 0) { ctx.fillStyle = `rgba(255,23,68,${baseHurt / 50})`; ctx.fillRect(0, 400, W, H - 400); }
}

function drawRobo(p, gold) {                           // gold = shiny Gold Robo (same Robo, gold paint)
  const w = p.w, h = p.h, x = p.x, y = p.y;
  const GL = gold ? goldPaint(x - 5, y, w + 10, h) : null, GD = gold ? goldPaint(x - 5, y, w + 10, h, 1) : null;
  const f = (p.vy < 0 ? 18 : 9) + Math.random() * 8;  // jet boot flames
  ctx.fillStyle = '#7df9ff';
  for (const fx of [x + 7, x + w - 7]) {
