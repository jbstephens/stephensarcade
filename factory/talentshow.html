<script>
'use strict';
const $ = id => document.getElementById(id);
// ================== character art (copied from the Trading Cards) ==================
// No gradients with ids (many cards share one page), no ctx.filter, just plain shapes with bold outlines.
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }
function aR(x, y, w, h, rx, f, s, sw, rot) { return '<rect x="' + _n(x) + '" y="' + _n(y) + '" width="' + _n(w) + '" height="' + _n(h) + '" rx="' + _n(rx || 0) + '" fill="' + f + '"' + _st(s, sw) + _rot(rot, x + w / 2, y + h / 2) + '/>'; }
function aP(d, f, s, w) { return '<path d="' + d + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aL(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
function aT(x, y, txt, size, f, s) { return '<text x="' + _n(x) + '" y="' + _n(y) + '" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="bold" font-size="' + size + '" fill="' + f + '"' + (s ? ' stroke="' + s + '" stroke-width="1"' : '') + '>' + txt + '</text>'; }
function aG(x, y, s, inner, rot, flip) { return '<g transform="translate(' + _n(x) + ' ' + _n(y) + ')' + (rot ? ' rotate(' + _n(rot) + ')' : '') + ' scale(' + (flip ? -s : s) + ' ' + s + ')">' + inner + '</g>'; }
function aO(op, inner) { return '<g opacity="' + op + '">' + inner + '</g>'; }
function polyD(pts) { let d = ''; for (let k = 0; k < pts.length; k += 2) d += (k ? 'L' : 'M') + _n(pts[k]) + ' ' + _n(pts[k + 1]) + ' '; return d + 'Z'; }
function starD(x, y, r, n, inner, rot) {
  n = n || 5; inner = inner || 0.45; rot = rot || 0; const pts = [];
  for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + rot + k * Math.PI / n, rr = k % 2 ? r * inner : r; pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  return polyD(pts);
}
function ngonD(x, y, r, n, rot) { const pts = []; for (let k = 0; k < n; k++) { const a = (rot || 0) + k * Math.PI * 2 / n; pts.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } return polyD(pts); }
const shine = (x, y, rx, ry, rot) => aE(x, y, rx, ry, '#ffffff', 0, 0, rot === undefined ? -25 : rot).replace('/>', ' opacity=".45"/>');

// ----- faces -----
// kinds: cute, dot, angry, happy, sleepy, glow, pixel, dizzy, mad (glow + brows)
function eyes(x, y, gap, r, kind, col) {
  col = col || '#1b1b2f'; let s = '';
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    if (kind === 'happy') s += aL('M' + _n(ex - r) + ' ' + _n(y + r * .3) + ' Q' + _n(ex) + ' ' + _n(y - r * 1.1) + ' ' + _n(ex + r) + ' ' + _n(y + r * .3), OL, Math.max(2, r * .45));
    else if (kind === 'dot') s += aC(ex, y, r * .6, col, 0) + aC(ex - r * .2, y - r * .2, r * .2, '#fff', 0);
    else if (kind === 'pixel') s += aR(ex - r * .8, y - r * .8, r * 1.6, r * 1.6, 0, '#fff', OL, 1.5) + aR(ex - r * .4, y - r * .3, r * .8, r * .8, 0, col, 0);
    else if (kind === 'glow' || kind === 'mad') s += aE(ex, y, r * .75, r, col, OL, 1.5) + aC(ex - r * .2, y - r * .35, r * .25, '#fff', 0);
    else if (kind === 'dizzy') s += aL('M' + _n(ex - r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex + r * .7) + ' ' + _n(y + r * .7) + ' M' + _n(ex + r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex - r * .7) + ' ' + _n(y + r * .7), OL, Math.max(2, r * .4));
    else {
      s += aE(ex, y, r * .85, r, '#fff', OL, 1.8) + aC(ex + sx * r * .1, y + r * .15, r * .55, col, 0) + aC(ex + sx * r * .1 - r * .2, y - r * .1, r * .2, '#fff', 0);
      if (kind === 'sleepy') s += aP('M' + _n(ex - r * .9) + ' ' + _n(y) + ' A' + _n(r * .9) + ' ' + _n(r) + ' 0 0 1 ' + _n(ex + r * .9) + ' ' + _n(y) + ' Z', '#0000001a', OL, 1.5);
    }
    if (kind === 'angry' || kind === 'mad') s += aL('M' + _n(ex - sx * r * 1.1) + ' ' + _n(y - r * 1.5) + ' L' + _n(ex + sx * r * .7) + ' ' + _n(y - r * .9), OL, Math.max(2, r * .4));
  }
  return s;
}
// kinds: smile, grin, fang, o, grr, flat, frown, teeth
