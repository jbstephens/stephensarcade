function playMusic() {

// ---------- Story ----------

const tileAt = (c, r) => (c < 0 || c >= cols) ? '#' : r >= ROWS ? ' ' : r < 0 ? (map[0][c] === '#' || map[0][c] === 'X' ? map[0][c] : ' ') : map[r][c];   // walls reach up past the top

function buildLevel(st) {

  rings = []; movers = []; switches = []; saws = []; vents = []; bubbles = []; pits = []; rocks = [];
  let x = 0, gy = 11, si = 0, ii = 0, pi = 0;

    else if (ch === 'D') gy += n || 1;

}

// Boss arena: one screen, walls on both sides, two floating platforms.
function buildArena(wi) {
  map = []; cols = 24;
  coins = []; shards = []; enemies = []; springs = []; flags = []; powers = []; hearts = []; signs = [];
  rings = []; movers = []; switches = []; saws = []; vents = []; bubbles = []; pits = []; rocks = [];
  for (let r = 0; r < ROWS; r++) {

    for (let c = 0; c < cols; c++) row.push(c === 0 || c === cols - 1 || r >= 11 ? '#' : (wi === 1 && r < 11 ? '~' : ' '));

    roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, '#2979ff');          // ear pods
    roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, '#2979ff');
    roundRect(x - 2, y, w + 4, h * 0.55, 12, '#ffffff');            // big round head
