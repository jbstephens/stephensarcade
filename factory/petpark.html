<script id="__gf_padfilter">
(function () {

  var orig = nav.getGamepads;
  var PHANTOM = /motion sensors|touchpad/i;
  var out = [];                       // reused every call: no per-frame allocation
  function filtered() {
    var src = orig.call(nav);
    if (!src) return src;
    var n = src.length, anyStd = false, i, p;
    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }
    out.length = n;
    for (i = 0; i < n; i++) {
      p = src[i];
      out[i] = (!p || PHANTOM.test(p.id || '') || (anyStd && p.mapping !== 'standard')) ? null : p;
    }
    return out;
  }
  try { nav.getGamepads = filtered; } catch (e) {}
  if (nav.getGamepads !== filtered) {
    try { Object.defineProperty(nav, 'getGamepads', { value: filtered, configurable: true, writable: true }); } catch (e) {}
  }
  try { nav.__gfPadFilter = true; } catch (e) {}

<style>

  body { margin: 0; background: #10172a; display: flex; align-items: center; justify-content: center; overflow: hidden; }

<canvas id="game" width="960" height="520"></canvas>
<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, TOP = 64, FLOOR_Y0 = 300, FLOOR_Y1 = 420, BAR_Y = 436;
let frame = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Sound ----------
function bankCoin(n = 1) { try { const c = JSON.parse(localStorage.getItem('gfCoins') || '{}'); c.petpark = (c.petpark || 0) + n; localStorage.setItem('gfCoins', JSON.stringify(c)); } catch (_) {} }   // coins for the Bundle Room in the Game Factory book
function bundleHas(j) { try { return (JSON.parse(localStorage.getItem('gfBundles') || '{}').opened || []).includes('petpark-' + j); } catch (_) { return false; } }   // unlocked in the Bundle Room
const BUNDLE_NAMES = ['Pet Hat Pack', 'Fancy Pet Hat Pack', 'MEGA Unicorn Pack'];
let actx = null, musicOn = true, nextNote = 0, mStep = 0;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } return actx; }
function note(f, start, dur, wave = 'square', vol = 0.07, slide = null) {
  if (!actx) return;
  const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  click: () => note(700, 0, 0.05, 'square', 0.05),
  coin: () => { note(1320, 0, 0.06); note(1760, 0.06, 0.12); },
  munch: () => { for (let i = 0; i < 3; i++) note(200 + Math.random() * 80, i * 0.12, 0.06, 'sawtooth', 0.05); },
  pop: () => note(900 + Math.random() * 500, 0, 0.05, 'sine', 0.06, 1800),
  boing: () => note(300, 0, 0.25, 'sine', 0.12, 800),
  yay: () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.08, 0.18, 'square', 0.07)),
  oops: () => note(400, 0, 0.3, 'triangle', 0.1, 200),
  throw: () => note(500, 0, 0.2, 'sine', 0.08, 900),
  buy: () => { note(880, 0, 0.08); note(1320, 0.08, 0.08); note(1760, 0.16, 0.2); },
  snore: () => note(110, 0, 0.6, 'sine', 0.05, 90),
  voice: sp => {
    if (sp === 'dog') { note(450, 0, 0.08, 'sawtooth', 0.08, 280); note(430, 0.12, 0.08, 'sawtooth', 0.08, 260); }
    else if (sp === 'cat') { note(700, 0, 0.18, 'sine', 0.09, 1000); note(1000, 0.18, 0.25, 'sine', 0.08, 650); }
    else if (sp === 'bunny') { note(1400, 0, 0.05, 'sine', 0.06); note(1600, 0.07, 0.05, 'sine', 0.06); }
    else if (sp === 'hamster') { for (let i = 0; i < 3; i++) note(1800 + i * 200, i * 0.05, 0.04, 'square', 0.03); }
    else if (sp === 'parrot') { note(1200, 0, 0.1, 'square', 0.05, 1800); note(1600, 0.12, 0.12, 'square', 0.05, 1100); }
    else if (sp === 'dragon') { note(180, 0, 0.35, 'sawtooth', 0.08, 360); note(900, 0.3, 0.15, 'sine', 0.05, 1400); }
    else if (sp === 'unicorn') { note(600, 0, 0.25, 'triangle', 0.08, 900); [1319, 1568, 2093].forEach((f, i) => note(f, 0.22 + i * 0.07, 0.15, 'sine', 0.05)); }
  },
};
const TUNE = [72, 0, 76, 79, 0, 76, 74, 0, 72, 0, 69, 72, 0, 0, 74, 0, 76, 0, 79, 81, 0, 79, 76, 0, 74, 0, 72, 74, 72, 0, 0, 0];
function playMusic() {
  if (!actx || !musicOn || scene === 'title') return;
  if (nextNote < actx.currentTime) nextNote = actx.currentTime + 0.05;
  while (nextNote < actx.currentTime + 0.2) {
    const t = nextNote - actx.currentTime, m = TUNE[mStep % TUNE.length];
    if (m) note(440 * Math.pow(2, (m - 69) / 12), t, 0.3, 'triangle', 0.035);
    if (mStep % 8 === 0) note(440 * Math.pow(2, ([48, 53, 55, 48][(mStep / 8) % 4] - 69) / 12), t, 0.9, 'sine', 0.05);
    nextNote += 0.2; mStep++;
  }
}

// ---------- Data ----------
const SPECIES = {
  dog:     { name: 'Puppy', colors: ['#d9a066', '#8d5a2b', '#f5f1ea', '#4a4a4a'], price: 20, head: [24, -40, 14] },
  cat:     { name: 'Kitty', colors: ['#ff9f43', '#9e9e9e', '#f5f1ea', '#3d3d3d'], price: 20, head: [22, -38, 13] },
  bunny:   { name: 'Bunny', colors: ['#f5f1ea', '#a1765a', '#b0b0b8'], price: 20, head: [20, -36, 12] },
  hamster: { name: 'Hamster', colors: ['#f4b860', '#f5f1ea', '#a8a8a8'], price: 15, head: [8, -30, 12] },
  parrot:  { name: 'Parrot', colors: ['#43a047', '#1e88e5', '#e53935'], price: 30, head: [6, -58, 11] },
  dragon:  { name: 'Baby Dragon', colors: ['#8e24aa', '#2e7d32', '#e53935'], price: 60, head: [26, -46, 14] },
  unicorn: { name: 'Unicorn', colors: ['#fdf7ff', '#ffd1ec', '#d3e9ff'], price: 0, head: [24, -46, 14], bundle: 2 },   // Sparkle! from the MEGA Unicorn Pack
};
const speciesOpen = sp => SPECIES[sp].bundle == null || bundleHas(SPECIES[sp].bundle);
const NAMES = ['Max', 'Bella', 'Coco', 'Biscuit', 'Peanut', 'Luna', 'Rocky', 'Daisy', 'Pickles', 'Ziggy', 'Mochi', 'Sparky'];
const HATS = [
  { id: 'party', name: 'Party Hat', price: 10 }, { id: 'bow', name: 'Bow', price: 10 }, { id: 'shades', name: 'Sunglasses', price: 15 },
  { id: 'cowboy', name: 'Cowboy Hat', price: 20 }, { id: 'wizard', name: 'Wizard Hat', price: 25 }, { id: 'crown', name: 'Crown', price: 40 },
  // Bundle Room hats (free once the bundle is opened in the Game Factory book)
  { id: 'party2', name: 'Super Party Hat', price: 0, bundle: 0 }, { id: 'cap', name: 'Cap', price: 0, bundle: 0 },
  { id: 'cowboy2', name: 'Sheriff Hat', price: 0, bundle: 1 }, { id: 'flowers', name: 'Flower Crown', price: 0, bundle: 1 },
];
const hatOpen = h => h.bundle == null || bundleHas(h.bundle);
const WALLS = [
  { id: 'cream', name: 'Cozy Cream', price: 0, a: '#fff4dc', b: '#ffe8b8' }, { id: 'sky', name: 'Sky Blue', price: 15, a: '#d6f0ff', b: '#b3e0ff' },
  { id: 'pink', name: 'Bubblegum', price: 15, a: '#ffe0f0', b: '#ffc6e2' }, { id: 'mint', name: 'Minty', price: 15, a: '#dcf7e6', b: '#bdeccf' },
  { id: 'stars', name: 'Starry Night', price: 25, a: '#2a2f6b', b: '#1d2152' },
];
const TRICKS = [{ id: 'sit', name: 'Sit', icon: '🪑' }, { id: 'spin', name: 'Spin', icon: '🌀' }, { id: 'jump', name: 'Jump', icon: '⬆️' }, { id: 'roll', name: 'Roll Over', icon: '🔄' }];
const BOWL = { x: 140, y: 405 }, BED = { x: 830, y: 395 };

let G = { coins: 20, pets: [], hats: [], walls: ['cream'], wall: 'cream', treats: 2, place: 'home' };
function save() { try { localStorage.setItem('petParkSave', JSON.stringify(G)); } catch (_) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem('petParkSave') || 'null'); if (s && Array.isArray(s.pets)) G = Object.assign(G, s); } catch (_) {}
  for (const p of G.pets) Object.assign(p, { state: 'wander', t: 0, tx: p.x, ty: p.y, anim: 0, trick: null, bubble: 0 });
  for (const p of G.pets) { const h = HATS.find(h => h.id === p.hat); if (p.hat && (!h || !hatOpen(h))) p.hat = null; }   // bundle hat no longer unlocked: take it off
}
load();

let scene = 'title', sel = 0, mode = 'room', toastMsg = '', toastT = 0, particles = [], floaters = [], ball = null, fade = 0, adopt = null, shopTab = 'hats';
let mouse = { x: 0, y: 0, down: false, lastX: 0, lastY: 0 };
const selPet = () => G.pets[sel];
function toast(t) { toastMsg = t; toastT = 150; }
function newPet(sp, color, name) {
  return { sp, color, name, x: rnd(300, 660), y: rnd(330, 410), dir: 1, hunger: 80, fun: 80, clean: 90, energy: 90, love: 0,
           tricks: { sit: 0, spin: 0, jump: 0, roll: 0 }, hat: null, state: 'wander', t: 0, tx: 480, ty: 380, anim: 0, trick: null, bubble: 0 };
}
const mood = p => (p.hunger + p.fun + p.clean + p.energy) / 4;

// ---------- Particles ----------
function hearts(x, y, n = 3) { for (let i = 0; i < n; i++) particles.push({ x: x + rnd(-15, 15), y, vx: rnd(-.5, .5), vy: rnd(-2, -1), life: 50, kind: 'heart' }); }
function bubbles(x, y, n = 3) { for (let i = 0; i < n; i++) particles.push({ x: x + rnd(-25, 25), y: y + rnd(-30, 0), vx: rnd(-.6, .6), vy: rnd(-1.5, -.4), life: 60, kind: 'bubble', r: rnd(4, 10) }); }
function sparkle(x, y, n = 12) { for (let i = 0; i < n; i++) { const a = rnd(0, 7), s = rnd(1, 4); particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 40, kind: 'star' }); } }
function confetti() { const cs = ['#ff5a7a', '#ffd84a', '#5ab4ff', '#7fdc6a', '#c9a0ff']; for (let i = 0; i < 80; i++) particles.push({ x: rnd(0, W), y: rnd(-200, 0), vx: rnd(-1, 1), vy: rnd(1, 3), life: 200, kind: 'conf', c: pick(cs) }); }
function floatText(x, y, t, c = '#ffb300') { floaters.push({ x, y, t, c, life: 60 }); }

// ---------- Pet brains ----------
function sendPet(p, x, y, then) { p.state = 'walk'; p.tx = x; p.ty = y; p.then = then; }
function updatePet(p, i) {
  p.t++;
  const sleeping = p.state === 'sleep';
  p.hunger = clamp(p.hunger - 0.25 / 60, 0, 100);
  p.fun = clamp(p.fun - 0.3 / 60, 0, 100);
  p.clean = clamp(p.clean - 0.15 / 60, 0, 100);
  if (!sleeping) p.energy = clamp(p.energy - 0.18 / 60, 0, 100);
  if (p.bubble > 0) p.bubble--;
  if (p.t % 1800 === 0 && mood(p) >= 60) { G.coins++; bankCoin(); floatText(p.x, p.y - 80, '+1 🪙'); sfx.coin(); }   // happy pets earn coins

  if (p.state === 'walk') {
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), sp = p.run ? 4 : 1.6;
    if (Math.abs(dx) > 1) p.dir = dx > 0 ? 1 : -1;
    if (d < sp) { p.x = p.tx; p.y = p.ty; p.state = 'idle'; p.t = 0; p.run = false; const cb = p.then; p.then = null; if (cb) cb(); }
    else { p.x += dx / d * sp; p.y += dy / d * sp; p.anim++; }
  } else if (p.state === 'idle' || p.state === 'wander') {
    if (p.t > 120 + (i * 37) % 120) {
      p.t = 0;
      if (Math.random() < 0.6) sendPet(p, rnd(220, 740), rnd(FLOOR_Y0 + 30, FLOOR_Y1 - 10));
    }
  } else if (p.state === 'eat') {
    if (p.t % 25 === 0) sfx.munch();
    if (p.t > 120) { p.hunger = clamp(p.hunger + 45, 0, 100); p.state = 'idle'; p.t = 0; hearts(p.x, p.y - 60); bowlFull = false; toast(`${p.name} says: Yum yum! 😋`); save(); }
  } else if (p.state === 'sleep') {
    p.energy = clamp(p.energy + 0.25, 0, 100);
    if (p.t % 90 === 0) sfx.snore();
    if (p.energy >= 100) { p.state = 'idle'; p.t = 0; toast(`${p.name} woke up full of energy! ⚡`); save(); }
  } else if (p.state === 'trick') {
    if (p.t > 70) finishTrick(p);
  } else if (p.state === 'fetch') {
    // running after the ball happens in updateBall
  } else if (p.state === 'bath') {
    // stays put while you scrub
  }
}

let bowlFull = false;
function feed(kind) {
  const p = selPet(); if (!p) return;
  if (p.state === 'sleep') return toast(`${p.name} is sleeping. Shhh! 💤`);
  if (kind === 'treat') {
    if (G.treats <= 0) return toast('No treats left! Buy more in the Shop 🛍️');
    G.treats--; p.hunger = clamp(p.hunger + 10, 0, 100); p.fun = clamp(p.fun + 20, 0, 100);
    sfx.munch(); hearts(p.x, p.y - 60, 6); p.state = 'trick'; p.trick = 'jump'; p.t = 0; p.trickOk = 'treat'; save();
    toast(`${p.name} LOVES treats! 🍪`); return;
  }
  if (G.place !== 'home') return toast('The food bowl is at home! 🏠');
  bowlFull = true; sfx.click();
  sendPet(p, BOWL.x + 45, BOWL.y - 5, () => { p.state = 'eat'; p.t = 0; p.dir = -1; });
}
function goSleep() {
  const p = selPet(); if (!p) return;
  if (G.place !== 'home') return toast('The bed is at home! 🏠');
  if (p.state === 'sleep') { p.state = 'idle'; p.t = 0; return toast(`${p.name} woke up!`); }
  sendPet(p, BED.x, BED.y - 8, () => { p.state = 'sleep'; p.t = 0; });
}
function startBath() {
  const p = selPet(); if (!p) return;
  if (G.place !== 'home') return toast('The bathtub is at home! 🏠');
  if (p.state === 'sleep') return toast(`${p.name} is sleeping. Shhh! 💤`);
  sendPet(p, 480, 395, () => { p.state = 'bath'; p.dir = 1; mode = 'bath'; toast('Hold the mouse and scrub-a-dub! 🧽'); });
}
function doTrick(id) {
  const p = selPet(); if (!p) return;
  if (p.state === 'sleep') return toast(`${p.name} is sleeping. Shhh! 💤`);
  if (p.energy < 10) return toast(`${p.name} is too tired. Time for a nap! 💤`);
  const practice = p.tricks[id];
  p.trickOk = Math.random() < 0.45 + practice * 0.15;
  p.state = 'trick'; p.trick = p.trickOk ? id : 'oops'; p.trickId = id; p.t = 0;
  p.trickOk ? sfx.boing() : sfx.oops();
}
function finishTrick(p) {
  p.state = 'idle'; p.t = 0;
  if (p.trickOk === 'treat') { p.trick = null; return; }
  if (p.trickOk) {
    const before = p.tricks[p.trickId];
    p.tricks[p.trickId] = Math.min(5, before + 1);
    p.fun = clamp(p.fun + 6, 0, 100); p.energy = clamp(p.energy - 3, 0, 100);
    G.coins++; bankCoin(); floatText(p.x, p.y - 90, '+1 🪙'); sfx.coin();
    if (before < 5 && p.tricks[p.trickId] === 5) { sfx.yay(); sparkle(p.x, p.y - 40, 30); toast(`⭐ ${p.name} learned ${TRICKS.find(t => t.id === p.trickId).name}! ⭐`); }
    else toast(`Good job, ${p.name}! 🎉`);
  } else toast(`Oops! ${p.name} got confused. Try again!`);
  p.trick = null; save();
}

// fetch!
function throwBall(x, y) {
  const p = selPet(); if (!p || ball) return;
  if (p.state === 'sleep') return toast(`${p.name} is sleeping. Shhh! 💤`);
  if (p.energy < 8) return toast(`${p.name} is too tired to play. Nap time! 💤`);
  ball = { sx: 480, sy: 470, x: 480, y: 470, tx: x, ty: y, t: 0, state: 'fly', pet: p };
  sfx.throw();
}
function updateBall() {
  if (!ball) return;
  const b = ball, p = b.pet;
  if (b.state === 'fly') {
    b.t++;
    const k = Math.min(1, b.t / 35);
    b.x = b.sx + (b.tx - b.sx) * k; b.y = b.sy + (b.ty - b.sy) * k - Math.sin(k * Math.PI) * 160;
    if (k >= 1) { b.state = 'ground'; p.state = 'fetch'; p.run = true; sfx.boing(); }
  } else if (b.state === 'ground') {
    const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
    p.dir = dx > 0 ? 1 : -1; p.anim += 2;
    if (d < 6) { b.state = 'carry'; } else { p.x += dx / d * 4.5; p.y += dy / d * 4.5; }
  } else if (b.state === 'carry') {
    const hx = 480, hy = 400, dx = hx - p.x, dy = hy - p.y, d = Math.hypot(dx, dy);
    p.dir = dx > 0 ? 1 : -1; p.anim += 2;
    const [ox, oy] = SPECIES[p.sp].head;
    const ps = petScale(p); b.x = p.x + p.dir * (ox + 10) * ps; b.y = p.y + (oy + 8) * ps;
    if (d < 6) {
      const gain = G.place === 'park' ? 22 : 15;
      p.fun = clamp(p.fun + gain, 0, 100); p.energy = clamp(p.energy - 4, 0, 100);
      G.coins++; bankCoin(); floatText(p.x, p.y - 90, '+1 🪙'); sfx.coin(); hearts(p.x, p.y - 60, 4);
      toast(`${p.name} brought the ball back! Throw it again! 🎾`);
      p.state = 'idle'; p.t = 0; p.run = false; ball = null; save();
    } else { p.x += dx / d * 3.5; p.y += dy / d * 3.5; }
  }
}

// ---------- Buttons ----------
let buttons = [];
function btn(x, y, w, h, label, onClick, o = {}) { buttons.push({ x, y, w, h, label, onClick, ...o }); }
function buildButtons() {
  buttons = [];
  if (scene === 'title') { btn(W / 2 - 130, 380, 260, 64, G.pets.length ? '▶ Play!' : '▶ Adopt a pet!', startGame, { color: '#ff7aa8', big: true }); return; }
  if (scene !== 'play') return;
  if (mode === 'adopt') return adoptButtons();
  if (mode === 'shop') return shopButtons();
  // bottom toolbar
  const tools = [
    ['🍖', 'Feed', () => { mode = mode === 'feed' ? 'room' : 'feed'; }],
    ['🎾', 'Play', () => { mode = mode === 'throw' ? 'room' : 'throw'; if (mode === 'throw') toast('Click anywhere to throw the ball! 🎾'); }],
    ['🛁', 'Bath', () => { mode = 'room'; startBath(); }],
    ['💤', 'Sleep', () => { mode = 'room'; goSleep(); }],
    ['🎓', 'Tricks', () => { mode = mode === 'tricks' ? 'room' : 'tricks'; }],
    ['🛍️', 'Shop', () => { mode = 'shop'; shopTab = 'hats'; }],
    [G.place === 'home' ? '🌳' : '🏠', G.place === 'home' ? 'Park' : 'Home', () => { mode = 'room'; fade = 40; }],
    ['➕', 'Adopt', () => { if (G.pets.length >= 5) return toast('Your house is full! 5 pets is the most. 🏠'); mode = 'adopt'; adopt = { step: 'species' }; }],
  ];
  tools.forEach(([icon, label, fn], i) => btn(14 + i * 117, BAR_Y + 8, 108, 70, label, fn, { icon, active: (label === 'Feed' && mode === 'feed') || (label === 'Play' && mode === 'throw') || (label === 'Tricks' && mode === 'tricks') }));
  if (mode === 'feed') {
    btn(30, BAR_Y - 74, 150, 60, 'Food bowl', () => { mode = 'room'; feed('bowl'); }, { icon: '🥣', color: '#fff4dc' });
    btn(190, BAR_Y - 74, 170, 60, `Treat (${G.treats})`, () => { mode = 'room'; feed('treat'); }, { icon: '🍪', color: '#fff4dc' });
  }
  if (mode === 'tricks') TRICKS.forEach((t, i) => btn(30 + i * 170, BAR_Y - 74, 160, 60, t.name, () => doTrick(t.id), { icon: t.icon, color: '#fff4dc', stars: selPet() ? selPet().tricks[t.id] : 0 }));
  if (mode === 'bath') btn(W / 2 - 80, BAR_Y - 74, 160, 56, 'All done!', endBath, { icon: '✅', color: '#c8f7d6' });
  // music
  btn(W - 64, 10, 50, 44, musicOn ? '♪' : '♪̸', () => { musicOn = !musicOn; }, { color: '#ffffff', small: true });
}
function endBath() {
  const p = selPet(); mode = 'room';
  if (p && p.state === 'bath') { p.state = 'idle'; p.t = 0; if (p.clean > 90) { sparkle(p.x, p.y - 40, 20); sfx.yay(); toast(`${p.name} is squeaky clean! ✨`); } }
  save();
}

function adoptButtons() {
  const a = adopt;
  btn(W - 150, 80, 130, 46, 'Close', () => { mode = 'room'; }, { icon: '✖', color: '#ffd6d6' });
  if (a.step === 'species') {
    Object.keys(SPECIES).forEach((sp, i) => {
