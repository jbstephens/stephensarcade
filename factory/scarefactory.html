<script id="__gf_padfilter">

    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }
    out.length = n;
    for (i = 0; i < n; i++) {
      p = src[i];
      out[i] = (!p || PHANTOM.test(p.id || '') || (anyStd && p.mapping !== 'standard')) ? null : p;
    }
    return out;
  }
  try { nav.getGamepads = filtered; } catch (e) {}
  if (nav.getGamepads !== filtered) {
    try { Object.defineProperty(nav, 'getGamepads', { value: filtered, configurable: true, writable: true }); } catch (e) {}
  }
  try { nav.__gfPadFilter = true; } catch (e) {}

<style>
  html, body { height: 100%; }
  body {

  }

  }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
// ===== SCARE FACTORY! Robo zaps the silly Scare Bugs and fixes the Game Factory's machines =====
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }   // for the Trophy Room in the Game Factory book
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 90; } } catch (_) {} }   // for the Sticker Book

// ---------- Saved progress: which rooms are open (6 = the Queen's room) ----------
let unlocked = 1, everWon = false;
try { const s = JSON.parse(localStorage.getItem('scareFactory') || '{}') || {}; unlocked = Math.max(1, Math.min(6, s.unlocked || 1)); everWon = !!s.won; } catch (_) {}
function saveProgress(won) {
  try {
    const s = JSON.parse(localStorage.getItem('scareFactory') || '{}') || {};
    s.unlocked = Math.max(s.unlocked || 1, unlocked); if (won) s.won = true;
    localStorage.setItem('scareFactory', JSON.stringify(s));
  } catch (_) {}
}

const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const AX0 = 20, AY0 = 60, AX1 = 940, AY1 = 504;       // the room's floor (inside the walls)
const DC = document.createElement('canvas'); DC.width = W; DC.height = H;
const dctx = DC.getContext('2d');                      // the "darkness" layer (flashlight holes get cut out of it)
const MAXHP = 5, SPEED = 3.6, FIX_RANGE = 92, FIX_TIME = 150;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

// ---------- Sound ----------
let actx = null;
function wakeAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  zap:    () => note(1400, 0, 0.09, 'square', 0.04, 500),
  pop:    () => { note(700, 0, 0.08, 'triangle', 0.14, 1400); note(1500, 0.07, 0.1, 'sine', 0.08); },
  split:  () => { note(500, 0, 0.1, 'square', 0.08, 900); note(500, 0.08, 0.1, 'square', 0.08, 900); },
  ouch:   () => note(500, 0, 0.35, 'sawtooth', 0.09, 90),
  wrench: () => note(260 + Math.random() * 80, 0, 0.05, 'square', 0.035),
  fixed:  () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.08, 0.18, 'triangle', 0.13)),
  oops:   () => note(400, 0, 0.25, 'triangle', 0.1, 200),
  lights: () => [392, 523, 659, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.09, 0.25, 'square', 0.08)),
  warn:   () => { note(880, 0, 0.08, 'square', 0.05); note(880, 0.12, 0.08, 'square', 0.05); },
  seed:   () => note(300, 0, 0.12, 'sine', 0.08, 150),
  dash:   () => note(150, 0, 0.4, 'sawtooth', 0.09, 60),
  bossHit: () => note(220, 0, 0.12, 'square', 0.09, 120),
  boss:   () => [196, 233, 208, 185].forEach((f, i) => note(f, i * 0.22, 0.3, 'sawtooth', 0.1)),
  win:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.12, 0.22, 'square', 0.1)),
};

// ---------- Music (original "Scare Factory" theme: eighth notes, 0 = rest) ----------
let musicOn = true, nextNoteTime = 0, step = 0;
const MUSIC_BPM = 140;
const MELODY = [
  57,0,60,64, 63,0,64,0, 57,0,60,64, 67,0,64,0,  65,0,64,62, 60,0,62,0, 64,0,0,60, 57,0,0,0,
  57,0,60,64, 63,0,64,0, 69,0,67,65, 64,0,62,0,  60,62,64,0, 59,0,56,0, 57,0,0,0, 0,0,64,0,
];
const BASS = [45, 45, 41, 40, 45, 45, 41, 40].flatMap(r => [r, 0, r + 7, 0, r + 12, 0, r + 7, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = state === 'play' && roomIndex === 5;
  const stepDur = 60 / (fight ? 165 : MUSIC_BPM) / 2;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
    if (m) note(midi(m), t, stepDur * 0.9, 'square', 0.03);
    if (b) note(midi(b), t, stepDur * 0.9, 'triangle', 0.08);
    if (step % 2 === 0) note(fight ? 140 : 110, t, 0.04, 'square', 0.012);
    nextNoteTime += stepDur; step++;
  }
}

// ---------- Input ----------
const keys = { l: false, r: false, u: false, d: false, zap: false, fix: false };
let confirmPressed = false;
const KEYMAP = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd',
  ' ': 'zap', z: 'zap', Z: 'zap', j: 'zap', J: 'zap', x: 'fix', X: 'fix', f: 'fix', F: 'fix', k: 'fix', K: 'fix' };
addEventListener('keydown', e => {
  wakeAudio();
  const k = e.key;
  if (KEYMAP[k]) { keys[KEYMAP[k]] = true; e.preventDefault(); }
  if ((k === ' ' || k === 'Enter') && !e.repeat) confirmPressed = true;
  if (state === 'title' && k >= '1' && k <= '6' && +k <= unlocked) startRoom(+k - 1);
  if (k === 'm' || k === 'M') musicOn = !musicOn;
  if (k === 'Escape' && state !== 'title') goTitle();
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const PLAY_BTN = { x: 330, y: 300, w: 300, h: 70 };
const ROOM_BTN = i => ({ x: 480 - 3 * 92 + i * 92 + 6, y: 400, w: 80, h: 70 });
C.addEventListener('mousedown', e => {
  wakeAudio();
  const r = C.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (state === 'title') {
    for (let i = 0; i < 6; i++) if (inBox(ROOM_BTN(i), x, y)) { if (i < unlocked) startRoom(i); else sfx.oops(); return; }
    if (inBox(PLAY_BTN, x, y)) startRoom(unlocked - 1);
  } else if (state === 'roomDone' || state === 'win') confirmPressed = true;
});

// ---------- Game state ----------
let state = 'title', frame = 0, timer = 0, roomIndex = 0, room = null;
let player, bugs = [], shots = [], seeds = [], machines = [], parts = [], confetti = [];
let banner = 0, bannerText = '', bannerSub = '', dark = 0, shake = 0, queen = null, recharge = 0;
let titleBugs = [];
for (let i = 0; i < 7; i++) titleBugs.push({ t: ['moth', 'beetle', 'ghost', 'fly'][i % 4], x: rnd(60, 900), y: rnd(80, 280), a: rnd(0, TAU), ph: rnd(0, 9), r: 18, hp: 1, seen: 1, flash: 0, warn: 0 });

function goTitle() { state = 'title'; timer = 0; queen = null; bugs = []; seeds = []; shots = []; }

// ===== ROOMS =====
// Each room: 3 broken machines [x, y], some crates/conveyors to walk around [x, y, w, h], and which scare bugs live there.
const ROOMS = [
  { name: 'Toy Assembly Line', icon: '🧸', floor: ['#ffe0b2', '#ffcc80'], wall: '#ff8a65', mach: '#ef5350',
    machines: [[200, 170], [760, 170], [480, 390]], walls: [[380, 150, 200, 28]], bugs: { moth: 4 },
    hint: 'Zap the ghost-moths and fix the 3 toy machines!' },
  { name: 'Candy Mixer Room', icon: '🍭', floor: ['#f8bbd0', '#f48fb1'], wall: '#ab47bc', mach: '#ec407a',
    machines: [[180, 150], [780, 400], [520, 250]], walls: [[300, 330, 30, 174], [660, 60, 30, 160]], bugs: { moth: 3, beetle: 2 },
    hint: 'Pumpkin beetles split into 2 mini bugs when you zap them!' },
  { name: 'Paint Shop', icon: '🎨', floor: ['#c8e6c9', '#a5d6a7'], wall: '#26a69a', mach: '#29b6f6',
    machines: [[160, 400], [480, 140], [800, 300]], walls: [[300, 220, 160, 28], [600, 390, 180, 28]], bugs: { moth: 2, ghost: 3 },
    hint: 'Sheet-ghost ladybugs hide in the dark! Shine your flashlight on them!' },
  { name: 'Robot Garage', icon: '🤖', floor: ['#bbdefb', '#90caf9'], wall: '#5c6bc0', mach: '#ffa726',
    machines: [[820, 140], [200, 200], [620, 420]], walls: [[400, 60, 28, 160], [420, 340, 28, 164]], bugs: { fly: 3, beetle: 2, ghost: 1, moth: 1 },
    hint: 'Bat-wing flies blink red, then SWOOP! Step out of the way!' },
  { name: 'Music Box Hall', icon: '🎵', floor: ['#fff9c4', '#fff59d'], wall: '#ffb300', mach: '#7e57c2',
    machines: [[150, 140], [810, 140], [480, 300]], walls: [[260, 300, 120, 28], [580, 300, 120, 28]], bugs: { moth: 2, fly: 2, beetle: 2, ghost: 3 },
    hint: 'The last room! Every kind of scare bug is here!' },
  { name: "The Queen's Throne Room", icon: '👑', floor: ['#e1bee7', '#ce93d8'], wall: '#6a1b9a', mach: '#ab47bc',
    machines: [], walls: [], bugs: {}, hint: 'Zap the QUEEN SCARE BUG! Watch for her warning glow!' },
];
const BUG_STATS = {
  moth:   { r: 18, hp: 1, sp: 1.4 },
  beetle: { r: 22, hp: 3, sp: 1.0 },
  mini:   { r: 13, hp: 1, sp: 1.9 },
  ghost:  { r: 19, hp: 2, sp: 1.1 },
  fly:    { r: 17, hp: 2, sp: 1.6 },
};
function makeBug(t, x, y) {
  const s = BUG_STATS[t];
  return { t, x, y, r: s.r, hp: s.hp, sp: s.sp, a: rnd(0, TAU), ph: rnd(0, 9), flash: 0, seen: 0, swoopT: Math.floor(rnd(120, 240)), warn: 0, dash: 0, dvx: 0, dvy: 0 };
}

function startRoom(i) {
  wakeAudio();
  roomIndex = i; room = ROOMS[i]; state = 'play'; timer = 0;
  player = { x: 90, y: 460, r: 18, ang: -0.6, hp: MAXHP, inv: 60, cool: 0, fixing: null, walk: 0 };
  shots = []; seeds = []; parts = []; confetti = []; recharge = 0;
  machines = room.machines.map(([x, y]) => ({ x, y, w: 76, h: 64, prog: 0, fixed: false, done: 0 }));
  bugs = [];
  for (const t in room.bugs) for (let n = 0; n < room.bugs[t]; n++) {
    let x, y, tries = 0;
    do { x = rnd(AX0 + 60, AX1 - 60); y = rnd(AY0 + 50, AY1 - 50); } while (Math.hypot(x - player.x, y - player.y) < 300 && ++tries < 50);
    bugs.push(makeBug(t, x, y));
  }
  dark = i === 5 ? 0.35 : 0.84;
  queen = i === 5 ? makeQueen() : null;
  bannerText = (i < 5 ? `Room ${i + 1}: ` : '') + room.name; bannerSub = room.hint; banner = 210;
  if (i === 5) sfx.boss();
}

function solids() {
  const s = room.walls.map(([x, y, w, h]) => ({ x, y, w, h }));
  for (const m of machines) s.push({ x: m.x - m.w / 2, y: m.y - m.h / 2, w: m.w, h: m.h });
  return s;
}
function hitsSolid(x, y, r, list) {
  if (x - r < AX0 || x + r > AX1 || y - r < AY0 || y + r > AY1) return true;
  for (const b of list) {
    const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
    if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
  }
  return false;
}
// Is this spot lit up? (the flashlight cone, the glow around Robo, or a fixed machine's lights)
function lit(x, y) {
  if (dark < 0.08) return true;
  const d = Math.hypot(x - player.x, y - player.y);
  if (d < 90) return true;
  if (d < 360 && Math.abs(angDiff(Math.atan2(y - player.y, x - player.x), player.ang)) < 0.5) return true;
  for (const m of machines) if (m.fixed && Math.hypot(x - m.x, y - m.y) < 170) return true;
  return false;
}
const canHit = b => b.t !== 'ghost' || b.seen > 0.5;

function burst(x, y, colors, n = 14, sp = 4) {
  for (let k = 0; k < n; k++) { const a = rnd(0, TAU), s = rnd(1, sp); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(20, 40), c: colors[k % colors.length], s: rnd(3, 7) }); }
}
function hurtPlayer(fromX, fromY) {
  if (player.inv > 0 || recharge > 0) return;
  player.hp--; player.inv = 90; shake = 10; sfx.ouch();
  const a = Math.atan2(player.y - fromY, player.x - fromX), sl = solids();
  for (let k = 0; k < 10; k++) { const nx = player.x + Math.cos(a) * 3, ny = player.y + Math.sin(a) * 3; if (!hitsSolid(nx, ny, player.r, sl)) { player.x = nx; player.y = ny; } }
  if (player.fixing) { player.fixing.prog = Math.max(0, player.fixing.prog - 0.2); bannerText = 'Oops! A bug bumped you!'; bannerSub = 'Keep fixing - you only lost a little!'; banner = 70; }
  if (player.hp <= 0) { recharge = 130; sfx.oops(); }
}

// Move one way; if a corner is in the way, slip around it a little (so Robo never gets snagged)
function slide(p, mx, my, sl) {
  if (!mx && !my) return;
  if (!hitsSolid(p.x + mx, p.y + my, p.r, sl)) { p.x += mx; p.y += my; return; }
  for (let k = 1; k <= 8; k++) for (const sg of [1, -1]) {
    const ox = my ? sg * k : 0, oy = mx ? sg * k : 0;
    if (!hitsSolid(p.x + ox, p.y + oy, p.r, sl) && !hitsSolid(p.x + mx * 0.5 + ox, p.y + my * 0.5 + oy, p.r, sl)) { const nx = p.x + mx * 0.5 + ox * 0.5, ny = p.y + my * 0.5 + oy * 0.5; if (!hitsSolid(nx, ny, p.r, sl)) { p.x = nx; p.y = ny; return; } }
  }
}
function updatePlayer() {
  const p = player;
  if (p.inv > 0) p.inv--;
  if (p.cool > 0) p.cool--;
  let dx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), dy = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if (dx || dy) {
    const L = Math.hypot(dx, dy); dx /= L; dy /= L; p.ang = Math.atan2(dy, dx); p.walk++;
    const sl = solids();
    slide(p, dx * SPEED, 0, sl); slide(p, 0, dy * SPEED, sl);
  }
  // 🔧 Wrench: hold FIX next to a broken machine
  p.fixing = null;
  let near = null, nd = 1e9;
  for (const m of machines) if (!m.fixed) { const d = Math.hypot(m.x - p.x, m.y - p.y); if (d < nd) { nd = d; near = m; } }
  p.near = near && nd < FIX_RANGE ? near : null;
  if (keys.fix && p.near) {
    const m = p.near; p.fixing = m;
    m.prog += 1 / FIX_TIME;
    if (frame % 9 === 0) { sfx.wrench(); parts.push({ x: m.x + rnd(-30, 30), y: m.y + rnd(-30, 20), vx: rnd(-1, 1), vy: rnd(-3, -1), life: 20, c: '#ffeb3b', s: 4 }); }
    if (m.prog >= 1) {
      m.prog = 1; m.fixed = true; m.done = 1; sfx.fixed(); burst(m.x, m.y, ['#ffeb3b', '#69f0ae', '#40c4ff', '#ff80ab'], 26, 6);
      const left = machines.filter(q => !q.fixed).length;
      bannerText = left ? `Machine fixed! ${left} more to go!` : 'All machines fixed!'; bannerSub = left || !bugs.length ? '' : `Now zap the last ${bugs.length} bug${bugs.length > 1 ? 's' : ''}!`; banner = 90;
    }
  }
  // ⚡ Bug zapper: auto-aims a little at the bug you're facing
  if (keys.zap && p.cool === 0) {
    let a = p.ang, best = 0.65;
    const targets = bugs.filter(canHit).concat(queen && queen.hp > 0 ? [queen] : []);
    for (const b of targets) {
      const ta = Math.atan2(b.y - p.y, b.x - p.x), d = Math.hypot(b.x - p.x, b.y - p.y);
      const off = Math.abs(angDiff(ta, p.ang));
      if (d < 520 && off < best) { best = off; a = ta; }
    }
    shots.push({ x: p.x + Math.cos(a) * 24, y: p.y + Math.sin(a) * 24, vx: Math.cos(a) * 11, vy: Math.sin(a) * 11, life: 50 });
    p.cool = 11; sfx.zap();
  }
}

function killBug(b) {
  sfx.pop(); burst(b.x, b.y, b.t === 'beetle' || b.t === 'mini' ? ['#ff9100', '#ffd180', '#69f0ae'] : ['#e1f5fe', '#b388ff', '#ffff8d'], 16, 4.5);
  bugs.splice(bugs.indexOf(b), 1);
  if (b.t === 'beetle') { sfx.split(); for (const s of [-1, 1]) { const m = makeBug('mini', b.x + s * 14, b.y); m.a = Math.atan2(0, s) + rnd(-0.5, 0.5); bugs.push(m); } }
  if (!bugs.length && machines.some(m => !m.fixed)) { bannerText = 'All bugs zapped!'; bannerSub = 'Now fix the broken machines!'; banner = 90; }
}
function updateBugs() {
  const p = player;
  for (const b of bugs.slice()) {
    b.ph += 0.2; if (b.flash > 0) b.flash--;
    b.seen += ((b.t !== 'ghost' || lit(b.x, b.y) ? 1 : 0) - b.seen) * 0.12;
    if (b.t === 'fly' && b.dash > 0) {
      b.dash--; b.x += b.dvx; b.y += b.dvy;
    } else if (b.t === 'fly' && b.warn > 0) {
      b.warn--;
      if (b.warn === 0) { const a = Math.atan2(p.y - b.y, p.x - b.x); b.dvx = Math.cos(a) * 5; b.dvy = Math.sin(a) * 5; b.dash = 38; b.swoopT = Math.floor(rnd(150, 260)); }
    } else {
      if (b.t === 'fly' && --b.swoopT <= 0 && Math.hypot(p.x - b.x, p.y - b.y) < 420) b.warn = 45;
      b.a += rnd(-0.18, 0.18);
      const d = Math.hypot(p.x - b.x, p.y - b.y);
      if (p.fixing && d < 380) b.a += clamp(angDiff(Math.atan2(p.y - b.y, p.x - b.x), b.a), -0.07, 0.07);   // bugs try to interrupt the fixing!
      const sp = b.sp * (queen && queen.phase === 2 ? 1.2 : 1);
      b.x += Math.cos(b.a) * sp; b.y += Math.sin(b.a) * sp + Math.sin(b.ph) * 0.6;
    }
    if (b.x < AX0 + b.r) { b.x = AX0 + b.r; b.a = Math.PI - b.a; b.dvx = Math.abs(b.dvx); }
    if (b.x > AX1 - b.r) { b.x = AX1 - b.r; b.a = Math.PI - b.a; b.dvx = -Math.abs(b.dvx); }
    if (b.y < AY0 + b.r) { b.y = AY0 + b.r; b.a = -b.a; b.dvy = Math.abs(b.dvy); }
    if (b.y > AY1 - b.r) { b.y = AY1 - b.r; b.a = -b.a; b.dvy = -Math.abs(b.dvy); }
    if (b.seen > 0.3 && Math.hypot(p.x - b.x, p.y - b.y) < b.r + p.r - 6) { hurtPlayer(b.x, b.y); b.a += Math.PI; b.dash = 0; }
  }
}
function updateShots() {
  for (const s of shots.slice()) {
    s.x += s.vx; s.y += s.vy; s.life--;
    let gone = s.life <= 0 || s.x < AX0 || s.x > AX1 || s.y < AY0 || s.y > AY1;
    if (!gone) for (const b of bugs) if (canHit(b) && Math.hypot(s.x - b.x, s.y - b.y) < b.r + 9) {
      gone = true; b.hp--; b.flash = 8; if (b.hp <= 0) killBug(b); else note(900, 0, 0.05, 'square', 0.05); break;
    }
    const q = queen;
    if (!gone && q && q.hp > 0 && Math.hypot(s.x - q.x, s.y - q.y) < q.r + 8) {
      gone = true; q.hp -= q.act === 'dizzy' ? 2 : 1; q.flash = 6; sfx.bossHit();
      parts.push({ x: s.x, y: s.y, vx: rnd(-2, 2), vy: rnd(-2, 2), life: 15, c: '#ffeb3b', s: 5 });
    }

}
function updateParts() {
  for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vx *= 0.95; q.vy *= 0.95; q.life--; }

  for (const c of confetti) { c.x += c.vx; c.y += c.vy; c.vy += 0.05; c.rot += c.vr; }

}

  for (let k = 0; k < n; k++) confetti.push({ x: rnd(0, W), y: rnd(-200, -10), vx: rnd(-1, 1), vy: rnd(1, 3), rot: rnd(0, 6), vr: rnd(-0.2, 0.2), c: cols[k % 6] });
}

function updatePlay() {
  updateParts();
  if (recharge > 0) {
    recharge--;
    if (recharge === 0) { player.x = 90; player.y = 460; player.hp = MAXHP; player.inv = 120; seeds = []; shots = []; for (const b of bugs) if (Math.hypot(b.x - 90, b.y - 460) < 200) { b.x += 220; b.y -= 160; } }
    return;
  }
  updatePlayer();
  updateBugs();
  updateShots();
  if (queen) updateQueen();
  for (const s of seeds.slice()) {
    s.x += s.vx; s.y += s.vy; s.spin += 0.2;
    if (s.x < AX0 || s.x > AX1 || s.y < AY0 || s.y > AY1) { seeds.splice(seeds.indexOf(s), 1); continue; }
    if (Math.hypot(s.x - player.x, s.y - player.y) < player.r + 6) { hurtPlayer(s.x, s.y); seeds.splice(seeds.indexOf(s), 1); }

}

// ===== THE QUEEN SCARE BUG =====
function makeQueen() { return { x: 480, y: 210, r: 58, hp: 40, max: 40, phase: 1, act: 'idle', t: 150, tx: 480, ty: 200, flash: 0, aimA: 0, lx: 0, ly: 0, next: '', rep: 0, dvx: 0, dvy: 0, dying: 0, ph: 0 }; }
function queenFire(n, spread, sp) {
  const q = queen;
  for (let k = 0; k < n; k++) { const a = q.aimA + (k - (n - 1) / 2) * spread; seeds.push({ x: q.x + Math.cos(a) * 50, y: q.y + Math.sin(a) * 50, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, spin: 0 }); }

}
function updateQueen() {
  const q = queen, p = player, p2 = q.phase === 2;
  q.ph += 0.1; if (q.flash > 0) q.flash--;

  if (q.hp <= 0) {                                     // she shrinks into a teeny tiny bug and flutters off
    if (q.dying === 0) { seeds = []; for (const b of bugs.slice()) killBug(b); sfx.win(); bannerText = 'You beat the QUEEN SCARE BUG!'; bannerSub = ''; banner = 150; sticker('scare-queen-scare-bug'); }
    q.dying++; q.y -= q.dying > 60 ? 1.5 : 0; if (q.dying % 6 === 0) burst(q.x, q.y, ['#ff9100', '#ffeb3b', '#fff'], 4, 3);
    if (q.dying > 170) { state = 'win'; timer = 0; trophy('scareWin'); unlocked = 6; everWon = true; saveProgress(true); addConfetti(120); }
    return;
  }
  if (!p2 && q.hp <= q.max / 2) {
    q.phase = 2; q.act = 'mad'; q.t = 100; seeds = []; sfx.boss(); shake = 20;
    bannerText = 'THE QUEEN IS MAD! LIGHTS OUT!'; bannerSub = 'Use your flashlight! She glows, so you can still find her!'; banner = 160;
  }
  if (q.act === 'idle') {
    q.x += (q.tx - q.x) * 0.02; q.y += (q.ty - q.y) * 0.02;
    if (Math.hypot(q.tx - q.x, q.ty - q.y) < 10) { q.tx = rnd(160, 800); q.ty = rnd(130, 300); }
    if (--q.t <= 0) {
      const opts = ['spray', 'charge', 'spray'];
      if (bugs.length < (p2 ? 4 : 3)) opts.push('summon');
      if (p2) opts.push('ring', 'charge');
      q.next = opts[Math.floor(Math.random() * opts.length)];
      q.act = 'warn'; q.t = p2 ? 48 : 60; q.rep = 0;
      q.aimA = Math.atan2(p.y - q.y, p.x - q.x); q.lx = p.x; q.ly = p.y; sfx.warn();
    }
  } else if (q.act === 'mad') {
    q.x += (480 - q.x) * 0.05; q.y += (200 - q.y) * 0.05;
    if (--q.t <= 0) { q.act = 'idle'; q.t = 40; }
  } else if (q.act === 'warn') {
    if (--q.t <= 0) {
      if (q.next === 'spray') { queenFire(p2 ? 7 : 5, 0.26, p2 ? 3.6 : 3); q.act = 'rest'; q.t = 26; q.rep = p2 ? 1 : 0; }
      else if (q.next === 'ring') { q.aimA = rnd(0, 1); queenFire(12, TAU / 12, 3); q.act = 'rest'; q.t = 30; }
      else if (q.next === 'summon') {
        for (const s of [-1, 1]) { const m = makeBug(p2 && s > 0 ? 'fly' : 'moth', q.x + s * 70, q.y + 20); bugs.push(m); }
        burst(q.x, q.y - 50, ['#ffeb3b', '#e040fb'], 20, 5); sfx.split(); q.act = 'rest'; q.t = 40;
      } else if (q.next === 'charge') {
        const a = Math.atan2(q.ly - q.y, q.lx - q.x), sp = p2 ? 10 : 8; q.dvx = Math.cos(a) * sp; q.dvy = Math.sin(a) * sp; q.act = 'dash'; q.t = 80; sfx.dash();
      }
    }
  } else if (q.act === 'dash') {
    q.x += q.dvx; q.y += q.dvy;
    const wall = q.x < AX0 + q.r || q.x > AX1 - q.r || q.y < AY0 + q.r || q.y > AY1 - q.r;
    q.x = clamp(q.x, AX0 + q.r, AX1 - q.r); q.y = clamp(q.y, AY0 + q.r, AY1 - q.r);
    if (wall || --q.t <= 0 || Math.hypot(q.lx - q.x, q.ly - q.y) < 12) { q.act = 'dizzy'; q.t = p2 ? 70 : 90; shake = 8; burst(q.x, q.y + 40, ['#bcaaa4', '#fff'], 12, 3); }
  } else if (q.act === 'dizzy') {
    if (--q.t <= 0) { q.act = 'idle'; q.t = p2 ? 55 : 80; }
  } else if (q.act === 'rest') {
    if (--q.t <= 0) {
      if (q.rep > 0) { q.rep--; q.aimA = Math.atan2(p.y - q.y, p.x - q.x); q.act = 'warn'; q.t = 30; sfx.warn(); }
      else { q.act = 'idle'; q.t = p2 ? 55 : 80; }
    }
  }
  if (Math.hypot(p.x - q.x, p.y - q.y) < q.r + p.r - 10) hurtPlayer(q.x, q.y);
}

// ===== UPDATE =====
function update() {
  frame++; timer++;
  if (banner > 0) banner--;
  if (stickerNew > 0) stickerNew--;
  if (shake > 0) shake--;
  if (state === 'title') {
    for (const b of titleBugs) { b.a += rnd(-0.15, 0.15); b.x += Math.cos(b.a) * 1.2; b.y += Math.sin(b.a) * 1.2;
