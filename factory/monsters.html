const WALK = new Set(['.', '=', 'g', 'f']);
function buildMaps() {
  for (const id in MAPS) {
    const m = MAPS[id]; m.id = id; m.w = 40; m.h = m.rows.length;
    m.tiles = m.rows.map(r => { let s = r.slice(0, 40); while (s.length < 40) s += 'T'; return s.split(''); });
    for (const b of m.buildings) {
      for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) m.tiles[y][x] = b.k === 'center' ? 'M' : 'H';
      if (b.k === 'center') { b.dx = b.x + Math.floor(b.w / 2); b.dy = b.y + b.h - 1; m.tiles[b.dy][b.dx] = 'D'; m.center = { x: b.dx, y: b.dy + 1 }; }
    }
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      if (m.tiles[y][x] === 'S' && m.shrine) { m.shrine.x = x; m.shrine.y = y; }
      if (m.tiles[y][x] === 'C') m.tiles[y][x] = '.';
    }
    for (const n of m.npcs) { m.tiles[n.y][n.x] = 'N'; n.dir = 0; }
  }
}
buildMaps();
function tileAt(map, x, y) { const m = MAPS[map]; if (y < 0 || y >= m.h || x < 0 || x >= m.w) return 'T'; return m.tiles[y][x]; }
function isWalk(map, x, y) { return !!MAPS[map] && WALK.has(tileAt(map, x, y)); }

const SAVE_KEY = 'monsterPalsSave_v1';
function save() {
  if (!G.team.length) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ team: G.team, box: G.box, seen: G.seen, caught: G.caught, flags: G.flags, center: G.center, map: P.map, x: P.x, y: P.y, dir: P.dir, music: musicOn })); } catch (e) {}
}
function readSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && Array.isArray(s.team) && s.team.some(m => m && SP[m.sp])) return s; } catch (e) {}
  return null;
}
function fixMon(m) {
  if (!m || !SP[m.sp]) return null;
  const o = { sp: m.sp, name: String(m.name || SP[m.sp].n).slice(0, 14), lvl: clamp(Math.floor(m.lvl) || 1, 1, 50), xp: Math.max(0, Math.floor(m.xp) || 0), hp: 0 };
  o.hp = clamp(Math.floor(m.hp), 0, maxHp(o)); if (isNaN(o.hp)) o.hp = maxHp(o);
  return o;
}
function loadGame(s) {
  G.team = s.team.map(fixMon).filter(Boolean).slice(0, 6);
  G.box = (Array.isArray(s.box) ? s.box : []).map(fixMon).filter(Boolean);
  G.seen = s.seen || {}; G.caught = s.caught || {}; G.flags = s.flags || {};
  G.center = (s.center && MAPS[s.center.map] && isWalk(s.center.map, s.center.x, s.center.y)) ? s.center : { map: 'meadow', x: 7, y: 6 };
  P.map = MAPS[s.map] ? s.map : 'meadow'; P.x = s.x | 0; P.y = s.y | 0;
  if (!isWalk(P.map, P.x, P.y)) { P.map = G.center.map; P.x = G.center.x; P.y = G.center.y; }
  P.dir = clamp(s.dir | 0, 0, 3); snapP(); P.grace = 3;
  musicOn = s.music !== false;
  if (!G.team.some(m => m.hp > 0)) healAll();
}
function newGame() {
  G.team = []; G.box = []; G.seen = {}; G.caught = {}; G.flags = {}; G.center = { map: 'meadow', x: 7, y: 6 };
  P.map = START.map; P.x = START.x; P.y = START.y; P.dir = 0; snapP(); P.grace = 3;
}

// ================= Fade / particles =================
const fade = { a: 0, v: 0, cb: null, col: '#000' };
function startFade(cb, c = '#000') { if (fade.v !== 0) return false; fade.v = 0.07; fade.cb = cb; fade.col = c; return true; }
function updFade() {
  if (fade.v > 0) { fade.a += fade.v; if (fade.a >= 1) { fade.a = 1; const cb = fade.cb; fade.cb = null; fade.v = -0.07; if (cb) cb(); } }
  else if (fade.v < 0) { fade.a += fade.v; if (fade.a <= 0) { fade.a = 0; fade.v = 0; } }
}
function burst(x, y, n, cols, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(o.min || 1, o.max || 5);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 0), life: o.life || rnd(30, 60), col: pick(cols), sz: rnd(3, 7), kind: o.kind || 'dot', rot: rnd(0, 6), g: o.g != null ? o.g : 0.12 });
  }
}
function updParts() { for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += 0.1; if (--p.life <= 0) parts.splice(i, 1); } }
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / 20, 0, 1);
    if (p.kind === 'star') star(p.x, p.y, p.sz * 1.4, p.col, p.rot);
    else if (p.kind === 'conf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.sz, -p.sz / 3, p.sz * 2, p.sz * 0.7); ctx.restore(); }
    else fcirc(p.x, p.y, p.sz, p.col);
  }
  ctx.globalAlpha = 1;
}
const CONFETTI = ['#ff5a7a', '#ffd84a', '#5ab4ff', '#7fdc6a', '#c9a0ff', '#ff9a3d'];

  }
  title.cur = clamp(gridNav(title.cur, 1, opts.length), 0, opts.length - 1);
  if (okP()) {
    sfx.ok();

    else if (titleSave) title.confirm = true;
    else { newGame(); scene = 'starter'; starter.cur = 0; }

}

const DX = [0, 0, -1, 1], DY = [1, -1, 0, 0];
function say(lines, then) { world.dialog = { lines, i: 0, then: then || null, t: 0 }; }
function updWorld() {
  if (world.banner) { world.banner.t--; if (world.banner.t <= 0) world.banner = null; }
  if (world.labT > 0) world.labT--;
  if (world.dialog) {
    world.dialog.t++;
    if (world.dialog.t > 8 && (okP() || backP())) {
      sfx.talk(); world.dialog.i++; world.dialog.t = 0;
      if (world.dialog.i >= world.dialog.lines.length) { const cb = world.dialog.then; world.dialog = null; if (cb) cb(); }
    }
    return;
  }
  if (P.moving) {
    const sp = 5, tx = P.tx * TS, ty = P.ty * TS;
    P.px += clamp(tx - P.px, -sp, sp); P.py += clamp(ty - P.py, -sp, sp); P.walk++;
    if (P.px === tx && P.py === ty) { P.moving = false; P.x = P.tx; P.y = P.ty; onStep(); }
    return;
  }
  if (P.bumpT > 0) P.bumpT--;
  if (backP()) { sfx.ok(); scene = 'menu'; menu.cur = 0; return; }
  if (has('b')) { sfx.ok(); openBook('world'); return; }
  if (has('t')) { sfx.ok(); openTeam('world'); return; }
  if (okP()) { interact(); return; }
  const d = heldDir();
  if (d >= 0) { P.dir = d; tryMove(d); }
  if (++world.saveT > 600) { world.saveT = 0; save(); }
  if (bookDone() && !G.flags.prizeHint && !G.flags.bookPrize) {
    G.flags.prizeHint = true; save(); sfx.gotcha();
    say(['The Monster Book is COMPLETE! All 16 monsters caught!', 'Go talk to Prof. Pip in Sunny Meadow for a SPECIAL PRIZE!']);
  }
}
function bump() { if (P.bumpT <= 0) { sfx.bump(); P.bumpT = 18; } }
function tryMove(d) {
  const m = MAPS[P.map], nx = P.x + DX[d], ny = P.y + DY[d];
  if (nx < 0 || nx >= m.w || ny < 0 || ny >= m.h) {
    const ex = nx < 0 ? 'west' : nx >= m.w ? 'east' : ny < 0 ? 'north' : 'south';
    const to = m.exits[ex];
    if (to && (ex === 'east' || ex === 'west')) changeMap(to, ex, ny); else bump();
    return;
  }
  const t = m.tiles[ny][nx];
  if (t === 'D') { useCenter(nx, ny); return; }
  if (WALK.has(t)) { P.moving = true; P.tx = nx; P.ty = ny; return; }
  bump();
}
function changeMap(to, ex, row) {
  startFade(() => {
    const tm = MAPS[to];
    P.map = to; P.x = ex === 'east' ? 0 : tm.w - 1; P.y = row;
    if (!isWalk(to, P.x, P.y)) { P.x = tm.center.x; P.y = tm.center.y; }
    snapP(); P.grace = 2; world.banner = { text: tm.name, t: 150 }; save();
  });
}
function onStep() {
  if (tileAt(P.map, P.x, P.y) === 'g') {
    if (P.grace > 0) P.grace--;
    else if (Math.random() < 1 / 12) wildEncounter();
  }
}
function wildEncounter() {
  const m = MAPS[P.map];
  const tot = m.wild.reduce((s, w) => s + w[1], 0);
  let r = Math.random() * tot, sp = m.wild[0][0];
  for (const [s, w] of m.wild) { r -= w; if (r < 0) { sp = s; break; } }
  startBattle({ kind: 'wild', team: [makeMon(sp, ri(m.lv[0], m.lv[1]))] });
}
function useCenter(dx, dy) {
  healAll(); sfx.center();
  G.center = { map: P.map, x: dx, y: dy + 1 }; save();
  P.dir = 1;
  say(['Nurse Nibbles: Welcome to the Monster Center!', "Let's give your monsters a yummy snack and a cozy nap...", 'Ta-da! Your whole team is full of energy! Come back anytime!']);
}
function interact() {
  const m = MAPS[P.map], fx = P.x + DX[P.dir], fy = P.y + DY[P.dir];
  const t = tileAt(P.map, fx, fy);
  if (t === 'N') {
    const n = m.npcs.find(q => q.x === fx && q.y === fy); if (!n) return;
    if (n.kind !== 'sign') n.dir = [1, 0, 3, 2][P.dir];
    sfx.talk();
    if (n.kind === 'champ') champTalk(); else if (n.kind === 'prof' && bookDone()) profPrize(); else say(n.lines);
  } else if (t === 'S') shrineTalk();
  else if (t === 'D') useCenter(fx, fy);
  else if (t === 'w') say(['The water sparkles. Splish splash!']);
  else if (t === 'l') say(['Hot hot HOT! Better not touch the lava!']);
  else if (t === 'H') say(['Somebody lives here. Knock knock! Nobody is home right now.']);
}
const bookDone = () => DEX.every(sp => G.caught[sp]);
function profPrize() {
  if (G.flags.bookPrize) { say(['Prof. Pip: Hello, MONSTER MASTER! That crown looks great on you!', 'Prof. Pip: Take good care of Prismo. It loves rainbows and hugs!']); return; }
  say(['Prof. Pip: WOW! You caught ALL 16 monsters! The whole Monster Book is full!',
       'Prof. Pip: In all my years, I have never seen anything like it!',
       'Prof. Pip: You are a true MONSTER MASTER! This GOLDEN CROWN is for you!',
       'Prof. Pip: And look... something is sparkling over the rainbow...',
       'A secret rainbow monster, PRISMO, wants to be your friend!'], () => {
    G.flags.bookPrize = true;
    const m = makeMon('prismo', 25);
    G.seen.prismo = G.caught.prismo = true;
    let where = 'Prismo joined your team!';
    if (G.team.length < 6) G.team.push(m); else { G.box.push(m); where = 'Prismo went to your Box. Swap it into your team from the menu!'; }
    sfx.gotcha(); save();
    for (let i = 0; i < 6; i++) burst(rnd(100, W - 100), rnd(60, 300), 30, CONFETTI, { kind: 'conf' });
    say(['You got the GOLDEN CROWN! 👑', where, 'Prismo is super strong and knows the COMET move! Have fun!']);
  });
}
const CHAMP_TEAM = [['fluffum', 13], ['hootvolt', 14], ['boulderbear', 15], ['blossomhop', 16]];
function champTalk() {
  const bonus = G.flags.champ ? 3 : 0;
  const lines = G.flags.champ
    ? ["Juniper: Hi, Champion! Your monsters look so happy!", "Want a rematch? I've been training too! Here we go!"]
    : ["Juniper: Hello there! I'm Juniper, the Monster Champion!", 'I can tell you really love your monsters. That makes you strong!', "Let's have a friendly battle! Ready? Here I go!"];
