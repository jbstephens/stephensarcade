function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;

  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);

  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

// ---------- 🎵 MUSIC ENGINE ----------
// 5 tracks: FLUTE lead (breathy, vibrato, echo), KOTO pluck arpeggio, soft PADS, BASS, and TAIKO drums.
// Every song is original, written in a pentatonic scale. Melodies: one number per 8th note (MIDI), 0 = rest / hold.
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  delayIn = actx.createGain(); delayIn.gain.value = 0.3;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.38;
  const fb = actx.createGain(); fb.gain.value = 0.36;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2200;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
}
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🎶 FLUTE (shakuhachi-ish): sine + soft triangle, a little breath noise, a pitch scoop and vibrato on long notes
function fluteVoice(m, t, dur, vol, out) {
  const f = midi(m), end = t + dur + 0.25;
  const g = envGain(t, 0.04, vol, 0.85, dur, 0.14, out);
  const lp = lowpass(3800, 1, t); lp.connect(g);
  const o1 = osc('sine', f * 0.985, t, end), o2 = osc('triangle', f, t, end, 6);
  o1.frequency.linearRampToValueAtTime(f, t + 0.06);                       // little scoop up into the note
  const mix = actx.createGain(); mix.gain.value = 0.55; o1.connect(mix); o2.connect(mix); mix.connect(lp);
  noiseHit(t, 'bandpass', f * 2, 2, vol * 0.35, 0.09, g);                  // breath "chff"
  if (dur > 0.3) {
    const lfo = osc('sine', 5.2, t, end), lg = actx.createGain();
    lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.15); lg.gain.linearRampToValueAtTime(f * 0.011, t + 0.5);
    lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
  }
  if (delayIn) g.connect(delayIn);
}
// 🪕 KOTO pluck: bright attack that fades fast
function kotoVoice(m, t, vol, out) {
  const f = midi(m), end = t + 0.9;
  const g = envGain(t, 0.003, vol, 0.2, 0.25, 0.5, out);
  const lp = lowpass(4200, 2, t); lp.frequency.setTargetAtTime(900, t, 0.09); lp.connect(g);
  osc('triangle', f, t, end).connect(lp); osc('sawtooth', f * 2, t, end, 4).connect(lp);
}
function padVoice(notes, t, dur, vol, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, 0.3, vol, 0.85, dur, 0.5, out);
    const lp = lowpass(1000, 0.7, t); lp.connect(g);
    osc('sawtooth', f, t, end, -10).connect(lp); osc('sawtooth', f, t, end, 10).connect(lp);
  }
}
function bassVoice(m, t, dur, vol, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(1400, 5, t); lp.frequency.setTargetAtTime(240, t + 0.01, 0.09); lp.connect(g);
  osc('sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.7; osc('sine', f, t, end).connect(sg); sg.connect(g);
}
// 🥁 TAIKO: K = big "DON", k = small don, r = rim "KA", h = shime (high little drum), x = gong/cymbal swell
function drumHit(kind, t, vol, out) {
  if (kind === 'K' || kind === 'k') {
    const big = kind === 'K', o = osc('sine', big ? 120 : 170, t, t + 0.7);
    o.frequency.exponentialRampToValueAtTime(big ? 48 : 80, t + (big ? 0.3 : 0.18));
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * (big ? 1.1 : 0.7), t + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + (big ? 0.65 : 0.35));
    o.connect(g); g.connect(out);
    noiseHit(t, 'lowpass', 600, 1, vol * 0.5, 0.12, out);                 // the stick "thwack"
  } else if (kind === 'r') {
    const o = osc('triangle', 820, t, t + 0.08), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06); o.connect(g); g.connect(out);
    noiseHit(t, 'bandpass', 2500, 3, vol * 0.4, 0.04, out);
  } else if (kind === 'h') noiseHit(t, 'bandpass', 3400, 2, vol * 0.45, 0.05, out);
  else if (kind === 'x') noiseHit(t, 'highpass', 3000, 0.6, vol * 0.6, 1.4, out);
}
