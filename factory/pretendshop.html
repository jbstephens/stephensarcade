<script id="__gf_padfilter">
(function () {
  var nav = window.navigator;
  if (!nav || typeof nav.getGamepads !== 'function' || nav.__gfPadFilter) return;
  var orig = nav.getGamepads;
  var PHANTOM = /motion sensors|touchpad/i;
  var out = [];                       // reused every call: no per-frame allocation
  function filtered() {
    var src = orig.call(nav);
    if (!src) return src;
    var n = src.length, anyStd = false, i, p;
    for (i = 0; i < n; i++) { p = src[i]; if (p && p.mapping === 'standard') anyStd = true; }
    out.length = n;
    for (i = 0; i < n; i++) {
      p = src[i];
      out[i] = (!p || PHANTOM.test(p.id || '') || (anyStd && p.mapping !== 'standard')) ? null : p;
    }
    return out;
  }
  try { nav.getGamepads = filtered; } catch (e) {}
  if (nav.getGamepads !== filtered) {
    try { Object.defineProperty(nav, 'getGamepads', { value: filtered, configurable: true, writable: true }); } catch (e) {}
  }
  try { nav.__gfPadFilter = true; } catch (e) {}
})();
</script>

<script>
'use strict';
const $ = id => document.getElementById(id);
// ================== character art (from the Trading Cards) ==================
// ===== CHARACTER ART: a real drawn picture for every card (inline SVG: crisp on iPad and in print) =====
// Every drawing is made around (0,0), about 100 tall, then placed in a 140x100 picture window.
// No gradients with ids (many cards share one page), no ctx.filter, just plain shapes with bold outlines.
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }

const DENOMS = [20, 10, 5, 1];                       // 1 is the round Robo coin
const MONEY_LOOK = {
  1: { col: '#a5d6a7', dark: '#2e7d32', who: 'gloop', word: 'ONE' },
  5: { col: '#90caf9', dark: '#1565c0', who: 'robo', word: 'FIVE' },

const sum = a => a.reduce((s, v) => s + v, 0);
const orderTotal = items => sum(items.map(it => it.price));
// SALE! 'half' = half price (round up to a whole Gloop Buck), 'one' = 1 off the total
function applySale(total, mode) {
  if (mode === 'half') {
    const t = Math.ceil(total / 2);
    return { total: t, math: total % 2 ? `Half of ${total} is ${Math.floor(total / 2)}½ → ${t}` : `Half of ${total} = ${t}` };
  }
  if (mode === 'one') { const t = Math.max(0, total - 1); return { total: t, math: `${total} − 1 = ${t}` }; }
  return { total, math: '' };
}
const changeDue = (paid, total) => Math.max(0, paid - total);
// fewest bills + coins: always take the biggest one that fits
function breakdown(amount, denoms) {
  const out = []; let left = Math.max(0, Math.floor(amount));
  (denoms || DENOMS).forEach(d => { while (left >= d) { out.push(d); left -= d; } });
  return out;
}
// ================== challenges ==================
const LEVELS = {
  1: { paid: 0, min: 2, max: 20, money: [] },          // add 2 things
  2: { paid: 10, min: 1, max: 9, money: [5, 1] },      // change from 10
  3: { paid: 20, min: 6, max: 19, money: [10, 5, 1] }, // change from 20
};
function makeChallenge(level, rnd) {
  rnd = rnd || Math.random; const L = LEVELS[level] || LEVELS[1];
  const pick = list => list[Math.floor(rnd() * list.length)];
  let items = [];
  for (let tries = 0; tries < 400; tries++) {
    const a = pick(PRODUCTS), n = level === 2 && rnd() < .35 ? 1 : 2;
    items = [a];
    if (n === 2) { const b = pick(PRODUCTS.filter(p => p !== a)); items.push(b); }
    const t = sum(items.map(p => p[2]));
    if (t >= L.min && t <= L.max) break;
    items = [];
  }
  if (!items.length) items = level === 3 ? [PRODUCTS[0], PRODUCTS[1]] : [PRODUCTS[4], PRODUCTS[9]];   // never happens, but safe
  const total = sum(items.map(p => p[2]));
  const who = pick(CHAR_KEYS);
  return { level, items, total, paid: L.paid, change: L.paid ? changeDue(L.paid, total) : 0, answer: L.paid ? changeDue(L.paid, total) : total, who };
}
function checkChallenge(ch, given) {     // given: a number (level 1) or a list of money (levels 2/3)
  const v = Array.isArray(given) ? sum(given) : given;
  return v === ch.answer;
}
