// ---- text that wraps to fit a width (about .56 of the font size per letter) ----
function wrapLines(txt, size, maxW) {
  const words = String(txt).split(' '), out = []; let line = '';
  const fits = t => t.length * size * .56 <= maxW;
  words.forEach(w => { const t = line ? line + ' ' + w : w; if (fits(t) || !line) line = t; else { out.push(line); line = w; } });
  if (line) out.push(line);
  return out;
}
function WT(x, y, txt, size, maxW, lh, col, anchor) {
  return wrapLines(txt, size, maxW).map((l, i) => T(x, y + i * (lh || size * 1.2), l, size, col, anchor)).join('');
}
