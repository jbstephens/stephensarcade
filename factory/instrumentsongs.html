const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// Find the song's key: the major scale that fits the most notes, then decide if it's really the minor one (A minor = C major notes)
function songKey(song) {
  const notes = song.mel.filter(m => m > 0).map(m => m + (song.shift || 0));
  const cnt = new Array(12).fill(0); notes.forEach(m => cnt[pc(m)]++);
  let best = 0, bestScore = -1;
  for (let r = 0; r < 12; r++) {
    let s = 0; for (let p = 0; p < 12; p++) if (MAJOR.includes(pc(p - r))) s += cnt[p];
    s += cnt[r] * 0.5 + cnt[(r + 7) % 12] * 0.25;   // the home note and its 5th count extra
    if (s > bestScore) { bestScore = s; best = r; }
  }
  const rel = (best + 9) % 12, first = pc(notes[0]), last = pc(notes[notes.length - 1]), low = pc(Math.min(...notes));
  const vote = t => (cnt[t] > cnt[t === best ? rel : best] ? 1 : 0) + (first === t ? 1 : 0) + (last === t ? 1 : 0) + (low === t ? 1 : 0);
  return vote(rel) > vote(best) ? { tonic: rel, minor: true } : { tonic: best, minor: false };

  }
  while (b > 52) b -= 12;
  while (b < 36) b += 12;

// ---------- the player ----------
const P = { si: 0, ii: 0, sel: 0, playing: false, started: false, k: 0, next: 0, timer: null, loop: true, vol: 2, listen: 0, counted: false };
let pulses = [];   // steps waiting to make the scene move, with the time they happen
const now = () => (AC ? AC.currentTime : 0);
function schedule() {
  if (!P.playing || !AC) return;
  while (P.next < AC.currentTime + 0.22) {
    if (P.k >= songSteps(P.si)) {
      if (P.loop) P.k = 0;
      else { playSong((P.si + 1) % SONGS.length, P.ii); return; }   // loop off: on to the next song
    }
    const r = arrangeStep(P.si, P.ii, P.k);
    for (const e of r.ev) playVoice(e, P.next + e.t);
    r.at = P.next; pulses.push(r);
    if (pulses.length > 400) pulses.splice(0, pulses.length - 400);
    P.next += stepDur(P.si, P.ii); P.k++;
  }
}
function startTimer() { stopTimer(); P.timer = setInterval(schedule, 40); schedule(); }
function stopTimer() { if (P.timer) clearInterval(P.timer); P.timer = null; }
function playSong(si, ii = P.ii) {
  if (!ensureAudio()) return;
  P.si = si; P.ii = ii; P.sel = si; P.k = 0; P.listen = 0; P.counted = false; P.playing = true; P.started = true;
  pulses = []; newBus();
  P.next = AC.currentTime + 0.1;
  startTimer(); applyTheme(); sceneFor(ii); refreshUI();
}
function pause() { if (!P.playing) return; P.playing = false; stopTimer(); killBus(); pulses = []; refreshUI(); }
function resume() {
  if (!P.started || P.playing || !ensureAudio()) return;
  P.playing = true; newBus(); P.next = AC.currentTime + 0.08;
  startTimer(); refreshUI();
}
function stopAll() { P.playing = false; P.started = false; stopTimer(); killBus(); pulses = []; P.listen = 0; refreshUI(); }
function togglePlay() {
  ensureAudio();
  if (P.playing && P.sel === P.si) pause();
  else if (P.started && !P.playing && P.sel === P.si) resume();
  else playSong(P.sel, P.ii);
}
function setInstrument(ii, keepPlaying = true) {
  const n = INSTR.length + 1;   // the band counts as the last one when you go round with the arrow keys
  ii = ((ii % n) + n) % n;
  const wasPlaying = P.playing;
  P.ii = ii; applyTheme(); sceneFor(ii);
  if (wasPlaying && keepPlaying) playSong(P.si, ii); else { if (P.started) stopAll(); refreshUI(); }
}
function setVolume(v) { P.vol = v; if (MASTER && AC) MASTER.gain.setValueAtTime(VOLS[v], AC.currentTime); refreshUI(); }
