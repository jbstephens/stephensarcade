<canvas id="game" width="960" height="520"></canvas>
<script>
// ROBO JUMP: GALAXY BOSS RUSH — a secret game! Robo fights EVERY boss from Ben's games, one after another.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const GRAV = 0.6, SPEED = 4.5, JUMP = 13, MAXFALL = 15;
const FLOOR = 470;                                       // top of the arena floor
const PLATS = [{ x: 90, y: 350, w: 170 }, { x: 700, y: 350, w: 170 }, { x: 395, y: 235, w: 170 }];   // floating platforms (jump up through them)
const MAX_HEARTS = 5;

// ---------- Saves for the Game Factory book ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 120; } } catch (_) {} }
const slug = name => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
let SAVE = { best: 0, won: 0 };                          // best = furthest boss reached (0 = the first boss)
try { const s = JSON.parse(localStorage.getItem('bossRush') || '{}') || {}; SAVE.best = Math.max(0, Math.min(11, s.best | 0)); SAVE.won = s.won ? 1 : 0; } catch (_) {}
function saveGame() { try { localStorage.setItem('bossRush', JSON.stringify(SAVE)); } catch (_) {} }

// ---------- Robo looks: he looks just like Ben dressed him in Robo Jump! ----------
function bundleHas(j) { try { return (JSON.parse(localStorage.getItem('gfBundles') || '{}').opened || []).includes('robojump-' + j); } catch (_) { return false; } }
const LOOKS = [
  { id: 'normal', bundle: -1 }, { id: 'tophat', bundle: 0 }, { id: 'cap', bundle: 0 },
  { id: 'cowboy', bundle: 1 }, { id: 'crown', bundle: 1 }, { id: 'pinch', bundle: 2 },
];
let look = 'normal';
try {
  const saved = (JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}).robojump;
  const L = LOOKS.find(l => l.id === saved);
  if (L && (L.bundle < 0 || bundleHas(L.bundle))) look = L.id;
} catch (_) {}
function goldOpen() { try { return Object.keys(JSON.parse(localStorage.getItem('gfKeys') || '{}')).length >= 5; } catch (_) { return false; } }   // all 5 secret keys → gold
let goldOn = false, goldDraw = false;
try { goldOn = !!(JSON.parse(localStorage.getItem('gfGold') || '{}') || {}).robojump; } catch (_) {}
const isGold = () => goldOn && goldOpen();
const gc = (c, g) => goldDraw ? g : c;

// ---------- Little helpers ----------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, 7); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
let particles = [];
function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: cols[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

// ---------- Sound ----------
let actx = null;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump:    () => note(400, 0, 0.15, 'sine', 0.15, 900),
  hover:   () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  click:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  ouch:    () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  warn:    () => { note(880, 0, 0.1, 'square', 0.07); note(880, 0.15, 0.1, 'square', 0.07); },
  boss:    () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },
  bossDie: () => { for (let i = 0; i < 8; i++) note(400 - i * 40, i * 0.08, 0.15, 'sawtooth', 0.08); },
  land:    () => note(80, 0, 0.5, 'triangle', 0.25, 40),
  shoot:   () => note(700, 0, 0.12, 'square', 0.05, 300),
  laser:   () => note(200, 0, 1.1, 'sawtooth', 0.07, 900),
  warp:    () => { for (let i = 0; i < 6; i++) note(300 + i * 150, i * 0.04, 0.1, 'square', 0.05); },
  heart:   () => [523, 659, 784].forEach((f, i) => note(f, i * 0.08, 0.15, 'triangle', 0.12)),
  win:     () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
  boom:    () => { note(120, 0, 0.5, 'sawtooth', 0.12, 40); note(1500 + Math.random() * 800, 0.05, 0.3, 'triangle', 0.05, 400); },
};

// ---------- Music: an original space-hero song (eighth notes, 0 = rest) ----------
const MUSIC_BPM = 150;          // title + splash speed; boss fights play faster (176)
const FIGHT_BPM = 176;
const MELODY = [
  72,0,76,79, 84,0,79,0, 81,79,76,0, 77,76,74,0,
  72,0,76,79, 84,0,86,0, 88,86,84,0, 79,0,0,0,
  77,0,81,84, 86,0,84,81, 79,0,83,86, 88,0,86,0,
  84,83,81,79, 77,76,74,0, 76,0,79,0, 72,0,0,0,
];
const CHORDS = [[60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]];
const ARP = CHORDS.flatMap(([a, b, c]) => [a, b, c, b, a + 12, c, b, c]);
const BASS = CHORDS.flatMap(([r]) => [r - 24, 0, r - 12, 0, r - 24, 0, r - 12, r - 24]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let musicOn = true, nextNoteTime = 0, step = 0;
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = state === 'fight' || state === 'ko';
  const stepDur = 60 / (fight ? FIGHT_BPM : MUSIC_BPM) / 2;     // eighth notes
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length], a = ARP[step % ARP.length];
    note(midi(a + (fight ? -12 : 0)), t, stepDur * 0.8, 'triangle', 0.03);
    if (m) note(midi(m), t, stepDur * 0.9, 'square', 0.045);
    if (b) note(midi(b), t, stepDur * 0.9, 'triangle', 0.09);
    if (fight && step % 2 === 0) note(60 + Math.random() * 20, t, 0.04, 'square', 0.02);   // little drum tick
    nextNoteTime += stepDur; step++;
  }
}
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  try { if (actx && actx.state === 'suspended') actx.resume(); } catch (_) {}
}

// ---------- Drawing Robo (copied from Robo Jump, so every hat + Gold Robo look the same) ----------
function goldShine(x, y, w, h) {                       // a shiny streak sliding across (draw it while clipped to the hero)
  const t = (frame % 140) / 90; if (t > 1) return;
  const sx = x - h * 0.6 + t * (w + h * 1.2);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 8, y); ctx.lineTo(sx + 8 - h * 0.5, y + h); ctx.lineTo(sx - h * 0.5, y + h); ctx.fill();
}
function goldSparkles(x, y, w, h) {                    // little twinkles pop up around the hero now and then
  for (let i = 0; i < 3; i++) {
    const n = frame + i * 41, ph = n % 70; if (ph > 24) continue;
    const s = Math.floor(n / 70) * 3.7 + i * 1.9;
    const sx = x + w * (0.5 + 0.75 * Math.sin(s * 12.99)), sy = y + h * (0.5 + 0.7 * Math.sin(s * 78.23));
    const r = Math.sin(ph / 24 * Math.PI) * 5 + 0.5, q = r * 0.28;
    ctx.fillStyle = i ? '#fff' : '#fff59d';
    ctx.beginPath(); ctx.moveTo(sx, sy - r); ctx.lineTo(sx + q, sy - q); ctx.lineTo(sx + r, sy); ctx.lineTo(sx + q, sy + q);
    ctx.lineTo(sx, sy + r); ctx.lineTo(sx - q, sy + q); ctx.lineTo(sx - r, sy); ctx.lineTo(sx - q, sy - q); ctx.fill();
  }
}
function drawLook(p, id, gold = isGold()) {
  const sx = 1 / p.squash, sy = p.squash;
  const w = p.w * sx, h = p.h * sy;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  goldDraw = gold;
  if (id === 'pinch') { drawPinch(p, x, y, w, h); if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return; }
  if (p.hovering) {                                    // jet boot flames
    const f = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.fillStyle = gc('#3d5afe', '#ff8f00');            // legs
  ctx.fillRect(x + 4, y + h - 7, 8, 7); ctx.fillRect(x + w - 12, y + h - 7, 8, 7);
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6, gc('#f5f7ff', '#ffb300'));   // body
  ctx.fillStyle = gc('#2979ff', '#fff');               // chest light
  ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.7, 3, 0, 7); ctx.fill();
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00')); // ear pods
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00'));
  roundRect(x - 2, y, w + 4, h * 0.55, 12, gc('#ffffff', '#ffd740'));  // big round head
  if (gold) {                                          // ✨ shiny streak + a white highlight
    ctx.save(); ctx.beginPath(); ctx.roundRect(x - 2, y, w + 4, h * 0.55, 12); ctx.roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6); ctx.clip();
    goldShine(x - 2, y, w + 4, h * 0.9); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 3, 3, 1.6, -0.5, 0, 7); ctx.fill();
  }
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9, '#111827');  // dark visor
  const ex = x + w / 2 + p.face * 3, ey = y + h * 0.27;  // glowing eyes
  const blink = frame % 180 < 6 ? 1 : 5;
  ctx.fillStyle = '#40c4ff';
  ctx.beginPath(); ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();
  if (id !== 'normal') drawHat(id, x + w / 2, y + 1, w + 4, p.face);
  if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8);
  goldDraw = false;
}

// Hats: cx = middle of the head, top = top of the head, hw = head width, face = 1 right / -1 left
function drawHat(id, cx, top, hw, face) {
  ctx.save();
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1.5;
  const shape = (fill, f) => { ctx.fillStyle = fill; ctx.beginPath(); f(); ctx.fill(); ctx.stroke(); };
  if (id === 'tophat') {
    shape('#212121', () => ctx.ellipse(cx, top, hw * 0.62, 4, 0, 0, 7));          // brim
    shape('#212121', () => ctx.rect(cx - hw * 0.36, top - 22, hw * 0.72, 22));     // tall part
    ctx.fillStyle = '#e53935'; ctx.fillRect(cx - hw * 0.36, top - 8, hw * 0.72, 5);  // red band
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(cx - hw * 0.28, top - 20, 3, 10);
  } else if (id === 'cap') {
    shape('#e53935', () => ctx.ellipse(cx + face * hw * 0.45, top + 1, hw * 0.4, 3.5, 0, 0, 7));  // bill sticks out the way you face
    shape('#ff1744', () => ctx.arc(cx, top + 2, hw * 0.48, Math.PI, 0));                         // dome
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, top + 2 - hw * 0.48, 2.5, 0, 7); ctx.fill();  // button
    ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(cx - face * 3, top - 5, 3, 0, 7); ctx.fill();   // star badge
  } else if (id === 'cowboy') {
    shape('#8d5524', () => {                                                       // curvy brim
      ctx.moveTo(cx - hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx - hw * 0.6, top + 4, cx, top + 3);
      ctx.quadraticCurveTo(cx + hw * 0.6, top + 4, cx + hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx + hw * 0.6, top - 1, cx, top - 1);
      ctx.quadraticCurveTo(cx - hw * 0.6, top - 1, cx - hw * 0.8, top - 6);
    });
    shape('#a0682f', () => {                                                       // crown with a dent
      ctx.moveTo(cx - hw * 0.34, top);
      ctx.lineTo(cx - hw * 0.3, top - 15);
      ctx.quadraticCurveTo(cx, top - 10, cx + hw * 0.3, top - 15);
      ctx.lineTo(cx + hw * 0.34, top);
      ctx.closePath();
    });
    ctx.fillStyle = '#4e342e'; ctx.fillRect(cx - hw * 0.33, top - 5, hw * 0.66, 3);   // band
  } else if (id === 'crown') {
    shape('#ffd740', () => {
      ctx.moveTo(cx - hw * 0.42, top + 1);
      ctx.lineTo(cx - hw * 0.46, top - 14);
      ctx.lineTo(cx - hw * 0.22, top - 6);
      ctx.lineTo(cx, top - 18);
      ctx.lineTo(cx + hw * 0.22, top - 6);
      ctx.lineTo(cx + hw * 0.46, top - 14);
      ctx.lineTo(cx + hw * 0.42, top + 1);
      ctx.closePath();
    });
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(cx, top - 3, 2.6, 0, 7); ctx.fill();   // jewels
    ctx.fillStyle = '#2979ff'; ctx.beginPath(); ctx.arc(cx - hw * 0.25, top - 2, 2, 0, 7); ctx.arc(cx + hw * 0.25, top - 2, 2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// Captain Pinch: a small friendly crab, same size box as Robo
function drawPinch(p, x, y, w, h) {
  const cx = x + w / 2, f = p.face || 1;
  if (p.hovering) {                                    // still has jet boots!
    const fl = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + fl); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.strokeStyle = gc('#b71c1c', '#ff8f00'); ctx.lineWidth = 2.5; ctx.lineCap = 'round';   // little legs
  const k = Math.abs(p.vx || 0) > 0.5 ? Math.sin(frame * 0.4) * 2 : 0;
  for (const s of [-1, 1]) for (let i = 0; i < 2; i++) {
    ctx.beginPath(); ctx.moveTo(cx + s * (5 + i * 4), y + h * 0.78);
    ctx.lineTo(cx + s * (11 + i * 4), y + h - 1 + (i ? k : -k)); ctx.stroke();
  }
  const wave = Math.sin(frame * 0.12) * 0.25;
  for (const s of [-1, 1]) {                           // claws up high
    ctx.strokeStyle = gc('#d32f2f', '#ff8f00'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx + s * w * 0.32, y + h * 0.6); ctx.lineTo(cx + s * w * 0.5, y + h * 0.38); ctx.stroke();
    ctx.fillStyle = gc('#ff5252', '#ffd740');
    ctx.beginPath(); ctx.arc(cx + s * w * 0.52, y + h * 0.3, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a0b2e';                         // claw pinch gap
    ctx.beginPath(); ctx.moveTo(cx + s * w * 0.52, y + h * 0.3);
    ctx.arc(cx + s * w * 0.52, y + h * 0.3, 6.5, -Math.PI / 2 - 0.35 - wave, -Math.PI / 2 + 0.35 + wave); ctx.fill();
  }
  ctx.fillStyle = gc('#ff1744', '#ffb300');           // round shell body
  ctx.beginPath(); ctx.ellipse(cx, y + h * 0.66, w * 0.46, h * 0.24, 0, 0, 7); ctx.fill();
  if (goldDraw) { ctx.save(); ctx.clip(); goldShine(cx - w * 0.46, y + h * 0.42, w * 0.92, h * 0.48); ctx.restore(); }
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.ellipse(cx - f * 5, y + h * 0.58, 5, 3, -0.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff8a80';                           // rosy cheeks
  ctx.beginPath(); ctx.arc(cx - 8, y + h * 0.7, 2.5, 0, 7); ctx.arc(cx + 8, y + h * 0.7, 2.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 1.8;    // smile
  ctx.beginPath(); ctx.arc(cx + f * 1, y + h * 0.68, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.strokeStyle = gc('#b71c1c', '#ff8f00'); ctx.lineWidth = 2.5;    // eye stalks
  ctx.beginPath(); ctx.moveTo(cx - 5, y + h * 0.5); ctx.lineTo(cx - 6, y + h * 0.3);
  ctx.moveTo(cx + 5, y + h * 0.5); ctx.lineTo(cx + 6, y + h * 0.3); ctx.stroke();
  const blink = frame % 180 < 6 ? 1 : 4;
  for (const ex of [cx - 6, cx + 6]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, y + h * 0.3, 4.5, blink + 0.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + f * 1.5, y + h * 0.31, Math.min(2.2, blink / 2 + 0.3), 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#ffd740';                           // tiny captain hat, just like the big boss
  ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(cx - 7, y - 4, 14, 6); ctx.fill(); ctx.stroke();
  ctx.fillRect(cx - 9 + f * 2, y + 1, 18, 2.5);
  ctx.fillStyle = '#1565c0'; ctx.fillRect(cx - 7, y - 1, 14, 2);
  ctx.lineCap = 'butt';
}

// ---------- The classic bosses (copied from Robo Jump 2's drawBoss: gloops, crabs, saucers, the Big Glitch) ----------
function drawOldBoss(b) {
  if (b.hurt > 0 && Math.floor(frame / 4) % 2) return;
  if (b.blink > 0 && frame % 4 < 2) return;
  ctx.save();
  if (b.blink > 0) ctx.translate((Math.random() - .5) * 14, 0);
  if (b.dying) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);

// ---------- More bosses, drawn like in their own games ----------
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt > 0 ? 255 : 0, k = Math.abs(amt);
  r = Math.round(r + (t - r) * k); g = Math.round(g + (t - g) * k); b = Math.round(b + (t - b) * k);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function rr(x, y, w, h, r, fill, stroke, lw = 4) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, c, stroke, lw = 3) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2);
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function poly(pts, c, stroke, lw = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(pts, c, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
}

function drawTeddy(b, look) {                            // Mecha Teddy (from Sparks!)
  const cx = b.x + b.w / 2;

  ctx.beginPath(); ctx.arc(cx - 18, b.y - 12, 9, 0, 7); ctx.arc(cx + 18, b.y - 12, 9, 0, 7); ctx.fill();

function drawWorm(b) {                                   // the Bookworm King (from Book Cat)
  const x = b.x + b.w / 2;

// one place that draws any boss
function drawBoss(b) {
  const lookDir = Math.sign(player.x - b.x - b.w / 2) * 4;
  if (b.kind === 'old') {
    drawOldBoss(b);
  } else {
    if (b.hurt > 0 && Math.floor(frame / 4) % 2) return;
    ctx.save();
    if (b.dying) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
    if (b.type === 'teddy') drawTeddy(b, lookDir);
    else if (b.type === 'worm') drawWorm(b);
    else if (b.type === 'dragon') drawDragon(b);

  if (b.dying || b.act === 'under') return;
  const cx = b.x + b.w / 2;

    for (let i = 0; i < 3; i++) {

    ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 4; ctx.strokeRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
  }
}

const SIZES = { blob: [90, 80], crab: [110, 64], ufo: [130, 56], cube: [92, 88], teddy: [110, 70], worm: [64, 64], dragon: [120, 110], zorg: [160, 64], king: [100, 110] };

let state = 'title', bossIdx = 0, boss = null, player = null, shots = [], lasers = [], marks = [];
let timer = 0, frame = 0, shake = 0, hearts = MAX_HEARTS, bannerText = '', bannerT = 0, menuSel = 0, dyingFlash = 0;

function newPlayer() {
  return { x: 60, y: FLOOR - 36, w: 28, h: 36, vx: 0, vy: 0, onGround: true, face: 1, squash: 1, hover: 70,
           jumping: false, buffer: 0, coyote: 0, inv: 60, hovering: false };
}
function startSplash(i) {
  bossIdx = i; state = 'splash'; timer = 0; shots = []; lasers = []; marks = [];
  if (i > SAVE.best) { SAVE.best = i; saveGame(); }
}
function startBoss() {
  const B = BOSSES[bossIdx], [w, h] = SIZES[B.type];
  hearts = MAX_HEARTS; player = newPlayer(); shots = []; lasers = []; marks = []; state = 'fight'; timer = 0;
  boss = { ...B, w, h, maxHp: B.hp, x: W - 160 - w / 2, y: -h - 60, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, at: 0,
           act: 'enter', ai: 0, tp: 0, blink: 0, pause: 0, mode: '', dying: 0, phase2: false, onGround: false };
  if (B.move === 'worm') { boss.act = 'under'; boss.y = FLOOR + 10; boss.x = W - 220; }
  bannerText = B.name + '!'; bannerT = 120;
  sfx.boss();
}
function setAct(b, act) { b.act = act; b.at = 0; }
function bossHome(b) { return b.type === 'dragon' ? 40 : 90; }
function bossLowY(b) { return b.type === 'dragon' ? FLOOR - b.h : FLOOR - b.h - 40; }
function angry(b) { return Math.min(2, b.maxHp - b.hp) + (b.phase2 ? 1 : 0); }

function aimShots(b, n, spd = 4, kind = 'ball') {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  for (let i = 0; i < n; i++) {
    const ang = a + (i - (n - 1) / 2) * 0.4;
    shots.push({ x: cx, y: cy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 10, kind });
  }
  sfx.shoot();
}
function startAttack(b) {
  const list = b.phase2 ? b.atks2 : b.atks;
  b.atk = list[b.ai++ % list.length];
  setAct(b, 'warn'); sfx.warn();
  if (b.atk === 'laser') b.laserY = b.ai % 2 ? FLOOR - 18 : 322;          // low beam → get up high!  high beam → stay on the floor!
  if (b.atk === 'rain') {
    marks = [];
    const px = clamp(player.x + 14, 40, W - 40);
    marks.push(px);
    for (let k = 0; k < 4; k++) { let mx; do { mx = rnd(40, W - 40); } while (marks.some(m => Math.abs(m - mx) < 110)); marks.push(mx); }
  }
}
function bossTeleport(b) {
  burst(b.x + b.w / 2, b.y + b.h / 2, ['#ff00ff', '#00e5ff', '#fff'], 18, 5);
  let nx, tries = 0;
  do { nx = rnd(30, W - 30 - b.w); } while (Math.abs(nx + b.w / 2 - player.x) < 240 && ++tries < 40);
  b.x = nx; sfx.warp();
  burst(b.x + b.w / 2, b.y + b.h / 2, ['#ff00ff', '#00e5ff', '#fff'], 18, 5);
}

// ---------- Boss brains ----------
function walkerPhysics(b) {
  const was = b.onGround;
  b.vy = Math.min(b.vy + GRAV, MAXFALL); b.y += b.vy; b.x += b.vx;
  b.onGround = false;
  if (b.y + b.h >= FLOOR) { b.y = FLOOR - b.h; b.vy = 0; b.onGround = true; }
  let wall = false;
  if (b.x < 10) { b.x = 10; wall = true; } else if (b.x + b.w > W - 10) { b.x = W - 10 - b.w; wall = true; }
  return { landed: b.onGround && !was, wall };
}
function updateWalker(b) {
  const A = angry(b), ph = walkerPhysics(b);
  b.pause = b.act === 'attack' && b.atk === 'dash' ? 1 : 0;              // crabs snap their claws while dashing
  if (b.act === 'enter') { b.vx = 0; if (ph.landed) { shake = 10; sfx.land(); } if (b.onGround && b.at > 60) setAct(b, 'move'); return; }
  if (b.act === 'move') {
    if (b.blink > 0) { b.vx = 0; if (--b.blink === 0) bossTeleport(b); return; }
    b.vx = b.dir * (b.speed + A * 0.35);
    if (ph.wall) b.dir = -b.dir;
    if (b.at % 90 === 45) b.dir = Math.sign(player.x - b.x - b.w / 2 + 14) || 1;
    if (b.tele && ++b.tp > (b.phase2 ? 150 : 230)) { b.tp = 0; b.blink = 40; }
    if (b.at > Math.max(70, 150 - A * 25) && b.onGround && b.blink === 0) startAttack(b);
    return;
  }
  if (b.act === 'warn') { b.vx = 0; if (b.at > (b.atk === 'laser' ? 80 : b.atk === 'rain' ? 70 : 55)) { setAct(b, 'attack'); b.started = false; } return; }
  if (b.act === 'attack') {
    const first = !b.started; b.started = true;
    if (b.atk === 'hop') {
      if (first) { const dx = player.x + 14 - (b.x + b.w / 2); b.vy = -14; b.vx = clamp(dx / 46, -6, 6); b.onGround = false; sfx.jump(); return; }
      if (ph.landed) {
        b.vx = 0; shake = 12; sfx.land();
        for (const d of [-1, 1]) shots.push({ x: b.x + b.w / 2 + d * b.w / 2, y: FLOOR - 12, vx: d * 4, vy: 0, r: 12, kind: 'wave' });
        setAct(b, 'dizzy');
      }
    } else if (b.atk === 'dash') {
      if (first) { b.dir = Math.sign(player.x - b.x - b.w / 2 + 14) || 1; sfx.warp(); }
      b.vx = b.dir * 7.5;
      if (b.at % 4 === 0) particles.push({ x: b.x + b.w / 2 - b.dir * b.w / 2, y: FLOOR - 6, vx: -b.dir, vy: -1, life: 20, color: '#cfd8dc', size: 6 });
      if (ph.wall) { b.vx = 0; shake = 14; sfx.land(); burst(b.dir > 0 ? W - 10 : 10, FLOOR - 40, ['#fff', '#ffea00'], 14, 4); b.dir = -b.dir; setAct(b, 'dizzy'); }
    } else if (b.atk === 'spread' || b.atk === 'zap') {
      b.vx = 0;
      if (b.at === 1) aimShots(b, b.atk === 'zap' ? 5 : 3, 4, b.atk === 'zap' ? 'zap' : 'ball');
      if (b.at === 40 && A > 0) aimShots(b, 3, 4, b.atk === 'zap' ? 'zap' : 'ball');
      if (b.at > 60) setAct(b, 'dizzy');
    } else if (b.atk === 'laser') {
      b.vx = 0;
      if (first) { lasers.push({ y: b.laserY, t: 0, x: b.x, w: b.w }); sfx.laser(); shake = 6; }
      if (b.at > 75) { lasers = []; setAct(b, 'dizzy'); }
    } else if (b.atk === 'rain') {
      b.vx = 0;
      if (first) { for (const m of marks) shots.push({ x: m, y: -20 - Math.random() * 30, vx: 0, vy: 2, r: 14, kind: 'pixel' }); marks = []; sfx.warp(); }
      if (b.at > 70) setAct(b, 'dizzy');
    }
    return;
  }
  if (b.act === 'dizzy') { b.vx = 0; if (b.at > (b.atk === 'laser' ? 150 : 120) - A * 8) setAct(b, 'move'); }
}
function updateFlyer(b) {
  const A = angry(b), home = bossHome(b);
  b.mode = b.act === 'dizzy' ? 'low' : 'fly';
  if (b.blink > 0) { if (--b.blink === 0) bossTeleport(b); }
  if (b.act === 'enter') { b.y += 3; if (b.y >= home) { b.y = home; setAct(b, 'move'); } return; }
  const cruise = () => {
    b.x += b.dir * (2.4 + A * 0.4);
    if (b.x < 20) { b.x = 20; b.dir = 1; } else if (b.x + b.w > W - 20) { b.x = W - 20 - b.w; b.dir = -1; }
    b.y = home + Math.sin(b.t * 0.05) * 14;
  };
  if (b.act === 'move') {
    cruise();
    if (b.tele && ++b.tp > 260 && b.blink === 0) { b.tp = 0; b.blink = 40; }
    if (b.at > Math.max(80, 140 - A * 20)) startAttack(b);
  } else if (b.act === 'warn') {

function updateShots() {
  const p = player;
  for (const s of shots) {

    if (s.kind === 'bomb' || s.kind === 'pixel') s.vy = Math.min(s.vy + 0.25, 9);
    if (s.kind === 'ink') s.vy = Math.min(s.vy + 0.3, 9);

// ---------- The game loop ----------

  else if (state === 'fight') { updatePlayer(); updateBoss(); updateShots(); }
  else if (state === 'ko') { updateShots(); if (timer > 130) startSplash(bossIdx); }

      } else startSplash(bossIdx + 1);
    }
  } else if (state === 'win') {
    if (timer % 35 === 1) {
      const fx = rnd(120, W - 120), fy = rnd(70, 230), cols = [['#ff5252', '#ffd740'], ['#69f0ae', '#40c4ff'], ['#e040fb', '#fff'], ['#ffea00', '#ff9100']][Math.floor(timer / 35) % 4];
