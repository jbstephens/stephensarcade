  for (let i = 0; i < 3; i++) {

let actx = null;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

// ---------- Music (original "Captain Woof" theme: eighth notes, 0 = rest) ----------
let musicOn = true, nextNoteTime = 0, step = 0;
const MUSIC_BPM = 150;
const MELODY = [
  67,0,72,0, 72,74,76,0, 74,72,0,67, 69,0,72,0,  77,0,76,74, 72,0,74,0, 76,0,0,79, 76,0,0,0,
  67,0,72,0, 72,74,76,0, 79,0,77,76, 74,0,72,0,  69,71,72,0, 74,0,71,0, 72,0,0,0, 0,0,79,0,
];
const BASS = [48, 53, 48, 55, 48, 45, 53, 55].flatMap(r => [r, 0, r + 7, 0, r + 12, 0, r + 7, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = bossState === 'fight';
  const stepDur = 60 / (fight ? 172 : MUSIC_BPM) / 2, shift = fight ? -2 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
    if (m) note(midi(m + shift), t, stepDur * 0.9, 'square', 0.035);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.09);
    if (step % 2 === 0) note(fight ? 140 : 110, t, 0.04, 'square', 0.015);   // little tick drum
    nextNoteTime += stepDur; step++;
  }
}

const keys = { left: false, right: false, jump: false };

addEventListener('keydown', e => {

  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (!keys.jump) jumpPressed = true;
    keys.jump = true;
    e.preventDefault();
  }
  if (k === 'Enter') jumpPressed = true;
  if ((k === 'x' || k === 'X' || k === 'z' || k === 'Z') && !e.repeat) barkPressed = true;
  if (state === 'title' && !e.repeat && (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'l' || k === 'L')) cycleLook(k === 'ArrowLeft' ? -1 : 1);
  if ((state === 'title' || state === 'win') && k >= '1' && k <= '5' && +k <= unlocked) startGame(+k - 1);
  if (k === 'm' || k === 'M') musicOn = !musicOn;
  if ((k === 'Escape') && state !== 'title') { state = 'title'; bossState = 'none'; }
});
C.addEventListener('mousedown', e => {                // tap the arrows, levels, or anywhere on the title

    if (inBox(PK_R, x, y) || inBox(PK, x, y)) return cycleLook(1);
    for (let i = 0; i < 5; i++) if (inBox(LV_BTN(i), x, y)) { if (i < unlocked) startGame(i); else sfx.ouch(); return; }

  } else if (state === 'levelDone' || state === 'win') jumpPressed = true;

  const k = e.key;

const ARENA = 24;

const isSolidCh = ch => ch === '#' || ch === '=' || ch === 'W';
function tileSolid(tx, ty) {
  if (tx < 0 || tx >= cols) return true;
  if (ty < 0 || ty >= rows) return false;
  return isSolidCh(map[ty][tx]);
}
// Finds the ground under a spot. If there is none, builds some so things never float over a hole.
function groundRow(x, y) {
  for (let r = y; r < rows; r++) if (isSolidCh(map[r][x])) return r;
  map[rows - 2][x] = map[rows - 1][x] = '#';
  return rows - 2;
}
function startGame(i) { totalCoins = 0; levelIndex = i; loadLevel(i); }

function loadLevel(i) {
  const L = LEVELS[i];
  rows = L.map.length;
  cols = Math.max(...L.map.map(r => r.length)) + 2;
  map = L.map.map(r => r.padEnd(cols, ' ').split(''));
  // Boss arena: flat floor at the end of the level; the hero flag pops up there after Snatcher is beaten
  const groundEnd = map[rows - 2].lastIndexOf('#') + 1;
  arenaStart = cols;
  cols += ARENA;
  map = map.map(r => r.concat(Array(ARENA).fill(' ')));
  for (let x = groundEnd; x < cols; x++) map[rows - 2][x] = map[rows - 1][x] = '#';
  bossState = 'none'; boss = null; shots = []; waves = []; bossBanner = 0; shake = 0;
  coins = []; enemies = []; springs = []; spikes = []; particles = []; items = []; itemsBack = 0;
  let start = { x: 3, y: 10 }, c = null;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = map[y][x];
    if (ch === 'o') coins.push({ x: x * T + T / 2, y: y * T + T / 2, got: false });
    else if (ch === 'E') enemies.push({ kind: 'mouse', x: x * T + 6, y: y * T + 14, w: 30, h: 26, vx: -1.2, vy: 0, dead: 0, stun: 0 });
    else if (ch === 'F') enemies.push({ kind: 'pigeon', x: x * T + 4, y: y * T + 8, w: 32, h: 24, vx: -1.4, vy: 0, dead: 0, stun: 0, hx: x * T, hy: y * T + 8 });
    else if (ch === 'K') items.push({ x, y });
    else if (ch === 'B') springs.push({ x, y });
    else if (ch === '^') spikes.push({ x, y });
    else if (ch === 'P') start = { x, y };
    else if (ch === 'C') c = { x, y };
    if (!isSolidCh(ch)) map[y][x] = ' ';
  }
  springs = springs.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T + 3, y: g * T - 20, w: 34, h: 20, squish: 0 }; });
  items = items.map(k => { const g = groundRow(k.x, k.y); return { x: k.x * T + 6, y: g * T - 30, w: 28, h: 28, back: false, fly: 0 }; });
  spikes = spikes.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T, y: (g - 1) * T }; });
  const pg = groundRow(start.x, start.y);
  player = { x: start.x * T + 4, y: pg * T - 44, w: 30, h: 44, vx: 0, vy: 0, onGround: false,
             face: 1, coyote: 0, buffer: 0, jumping: false, inv: 0, squash: 1, gliding: false, hp: MAXHP, barkCool: 0, barkAnim: 0 };
  respawn = { x: player.x, y: player.y };

  checkpoint = null;
  if (c) { const g = groundRow(c.x, c.y); checkpoint = { x: c.x * T + T / 2, y: g * T, reached: false }; }

  camX = 0;

// ---------- Physics ----------
function overlapsSolid(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(tx, ty)) return true;
  return false;
}
function moveX(e) {
  e.x += e.vx;
  if (!overlapsSolid(e)) return false;
  if (e.vx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w;
  else e.x = (Math.floor(e.x / T) + 1) * T;
  e.vx = 0;
  return true;
}
function moveY(e) {
  e.y += e.vy;

  if (!overlapsSolid(e)) return;
  if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.onGround = true; }
  else e.y = (Math.floor(e.y / T) + 1) * T;
  e.vy = 0;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cl = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: camX + Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: cl[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

// Ouch! Lose one heart (there are lots). Out of hearts = back to the hydrant with full hearts.
function hurt(fromX) {
  const p = player;
  if (p.inv > 0 || state !== 'play') return;
  p.hp--; sfx.ouch(); shake = 6;
  burst(p.x + p.w / 2, p.y + p.h / 2, ['#ff5252', '#fff', '#42a5f5'], 14, 4);
  if (p.hp <= 0) { state = 'dying'; timer = 0; return; }
  p.inv = 90; p.vy = -7; p.jumping = false;
  p.vx = (fromX !== undefined ? Math.sign(p.x + p.w / 2 - fromX) || -p.face : -p.face) * 5;
}
function fellDown() {                                  // fell in a hole: one heart, then pop back at the last safe spot
  const p = player;
  p.hp--; sfx.ouch();
  if (p.hp <= 0) { state = 'dying'; timer = 0; return; }
  Object.assign(p, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 90 });
}

// ---------- BARK BLAST! ----------
function bark() {
  const p = player;
  if (p.barkCool > 0) return;
  p.barkCool = BARK_COOL; p.barkAnim = 14;
  sfx.bark();
  waves.push({ x: p.x + p.w / 2 + p.face * 18, y: p.y + 14, dir: p.face, life: 42, r: 10 });
}
function updateWaves() {
  for (const w of waves) {
    w.x += w.dir * 8; w.life--; w.r = Math.min(30, w.r + 0.6);
    const box = { x: w.x - w.r, y: w.y - w.r, w: w.r * 2, h: w.r * 2 };
    if (tileSolid(Math.floor(w.x / T), Math.floor(w.y / T))) w.life = 0;
    for (const e of enemies) if (!e.dead && !e.stun && overlap(box, e)) {
      e.stun = 300; w.life = 0; sfx.stun();
      burst(e.x + e.w / 2, e.y, ['#fff59d', '#80d8ff', '#fff'], 10, 3);
    }
    for (const s of shots) if (!s.gone && Math.abs(s.x - w.x) < w.r + s.r && Math.abs(s.y - w.y) < w.r + s.r) {
      s.gone = true; burst(s.x, s.y, ['#80d8ff', '#fff'], 8, 3);   // bark pops Snatcher's stuff out of the air
    }
    if (boss && !boss.dying && overlap(box, boss)) { w.life = 0; hitBoss(); }
  }
  waves = waves.filter(w => w.life > 0);
}

// ---------- Snatcher's silly machines (one boss per level) ----------
const BOSS_SIZE = { scooter: [120, 78], yarn: [92, 92], balloon: [96, 62], crane: [124, 70], mecha: [140, 130] };
const BOSS_SAY = {
  scooter: 'Meow-ha-ha! Catch me if you can!',
  yarn: 'Roll, roll, roll! You can\'t stop my yarn!',
  balloon: 'Bye-bye, doggy! I\'m floating away!',
  crane: 'My claw will grab EVERYTHING!',
  mecha: 'Behold... MECHA-SNATCHER! Hiss-hiss-hooray!',
};
const BOSS_STICKER = { scooter: 'super-scooter', yarn: 'yarn-ball-roller', balloon: 'getaway-balloon', crane: 'claw-crane', mecha: 'mecha-snatcher' };
let say = '', sayT = 0;
function startBoss() {
  const B = LEVELS[levelIndex].boss;
  bossState = 'fight'; shots = []; helpTimer = 0;
  bossBanner = 150; bannerText = 'BOSS: ' + B.name + '!';
  for (let y = 0; y < rows - 2; y++) map[y][arenaStart] = 'W';   // Snatcher's yarn fence closes behind you
  respawn = { x: (arenaStart + 2) * T, y: (rows - 2) * T - player.h };
  if (checkpoint) checkpoint.reached = true;
  const [w, h] = BOSS_SIZE[B.kind], floor = (rows - 2) * T, air = B.kind === 'balloon' || B.kind === 'crane';
  boss = { kind: B.kind, name: B.name, hp: B.hp, maxHp: B.hp, w, h, x: (arenaStart + 16) * T,
           y: air ? -120 : floor - h - 200, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, warn: 0, mode: air ? 'enter' : 'idle', modeT: 0,
           dying: 0, clawY: 0, grabs: 0, next: 'shoot' };
  say = BOSS_SAY[B.kind]; sayT = 170;
  sfx.boss();
}
function hitBoss() {
  const b = boss;
  if (!b || b.hurt > 0 || b.dying) return false;
  b.hp--; b.hurt = 60; shake = 12; sfx.bossHit();
  burst(b.x + b.w / 2, b.y + 10, ['#ffea00', '#fff', '#80d8ff'], 16, 5);
  if (b.hp > 0) { say = ['Hiss!', 'Yowch!', 'Not my whiskers!', 'Mrrrow!'][b.hp % 4]; sayT = 60; }
  if (b.kind === 'balloon' || b.kind === 'crane') { if (b.mode === 'low') { b.mode = 'up'; b.modeT = 0; } }
  if (b.hp <= 0) { b.dying = 1; b.warn = 0; shots = []; sfx.bossDie(); sticker('woof-' + BOSS_STICKER[b.kind]); say = 'Nooo! My ' + b.name.replace("Snatcher's ", '') + '!'; sayT = 120; }
  return true;
}
function bossShot(x, y, vx, vy, kind, r = 11, grav = 0) { shots.push({ x, y, vx, vy, r, grav, kind }); }
function aimShots(b, n, speed, kind) {
  const cx = b.x + b.w / 2, cy = b.y + b.h * 0.35;
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  for (let i = 0; i < n; i++) { const ang = a + (i - (n - 1) / 2) * 0.35; bossShot(cx, cy, Math.cos(ang) * speed, Math.sin(ang) * speed, kind); }
}

function updateBoss() {
  const p = player, b = boss;
  if (bossBanner > 0) bossBanner--;
  if (sayT > 0) sayT--;
  if (bossState === 'defeated' && flag.rise < 1) flag.rise = Math.min(1, flag.rise + 0.02);
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffea00', '#ff9100', '#fff'], 10, 5);
    if (b.dying > 80) {
      burst(b.x + b.w / 2, b.y + b.h / 2, ['#ffea00', '#ff9100', '#fff', '#ce93d8'], 50, 8);
      boss = null; bossState = 'defeated'; shake = 20;
      bossBanner = 170; bannerText = 'You beat the ' + b.name.replace("Snatcher's ", '') + '!';
      for (let y = 0; y < rows; y++) if (map[y][arenaStart] === 'W') map[y][arenaStart] = ' ';
      confetti();
    }
    return;
  }
  const angry = b.maxHp - b.hp;                         // a little faster as it gets hurt
  const left = (arenaStart + 1) * T, right = cols * T, floor = (rows - 2) * T, cx = b.x + b.w / 2;
  const toP = Math.sign(p.x + p.w / 2 - cx) || 1;
  b.modeT++;
  if (b.warn > 0) { b.warn--; if (b.warn % 12 === 0) sfx.warn(); }
  if (b.kind === 'scooter' || b.kind === 'yarn' || b.kind === 'mecha') {
    b.vy = Math.min(b.vy + GRAV, MAXFALL);
    if (b.mode === 'idle' || b.mode === 'drive') {         // cruise around, then get ready ("!")
      b.vx = b.onGround ? b.dir * (b.kind === 'mecha' ? 1.1 : 1.6) : 0;
      if (b.kind === 'mecha') b.dir = toP;
      if (b.modeT > Math.max(90, 170 - angry * 12)) { b.mode = 'warn'; b.modeT = 0; b.warn = 54; b.dir = toP; }
    } else if (b.mode === 'warn') {
      b.vx = 0;
      if (b.modeT >= 54) {
        b.modeT = 0;
        if (b.kind === 'scooter') { b.mode = 'zoom'; burst(b.x + (b.dir < 0 ? b.w : 0), floor - 6, ['#e0e0e0', '#fff'], 10, 3); }
        else if (b.kind === 'yarn') { b.mode = 'hop'; b.vy = -13; b.vx = toP * 3.2; }
        else if (b.next === 'shoot') { b.mode = 'drive'; b.next = 'stomp'; aimShots(b, 3, 3.6, 'fish'); sfx.warn(); }
        else { b.mode = 'hop'; b.next = 'shoot'; b.vy = -12; b.vx = toP * 2.6; }
      }
    } else if (b.mode === 'zoom') {                        // scooter zooms across: jump over it!
      b.vx = b.dir * (6.5 + angry * 0.4);
    } else if (b.mode === 'dizzy') {
      b.vx = 0;
      if (b.modeT > 110) { b.mode = 'drive'; b.modeT = 0; b.dir = toP; }
    }
    const hitWall = moveX(b);
    const wasAir = !b.onGround;
    moveY(b);
    if (hitWall) {
      b.dir = -b.dir;
      if (b.mode === 'zoom') { b.mode = 'dizzy'; b.modeT = 0; shake = 10; sfx.land(); burst(cx, b.y + 10, ['#fff59d', '#fff'], 12, 3); }
    }
    if (b.onGround && wasAir) {                            // landing
      if (b.mode === 'hop') {
        shake = 10; sfx.land(); b.mode = 'drive'; b.modeT = 0;
        if (b.kind === 'yarn') { bossShot(cx, b.y + 20, -3, -7, 'yarn', 11, 0.3); bossShot(cx, b.y + 20, 3, -7, 'yarn', 11, 0.3); }
        else { bossShot(b.x, floor - 12, -4.5, 0, 'wave', 12); bossShot(b.x + b.w, floor - 12, 4.5, 0, 'wave', 12); }   // stomp shockwaves: jump over them!
      }
    }
  } else if (b.kind === 'balloon') {
    const lowY = floor - b.h - 26;
    if (b.mode === 'enter') { b.y += 2; if (b.y >= 150) { b.mode = 'fly'; b.modeT = 0; } }
    else if (b.mode === 'fly') {
      b.x += b.dir * (1.8 + angry * 0.3);
      if (b.x < left + 20 || b.x + b.w > right - 20) b.dir = -b.dir;
      b.y = 150 + Math.sin(b.t * 0.04) * 12;
      if (b.modeT % 100 === 40) b.warn = 40;
      if (b.modeT % 100 === 80) bossShot(cx, b.y + b.h, 0, 1, 'vase', 12, 0.2);
      if (b.modeT > 300) { b.mode = 'down'; b.modeT = 0; b.warn = 0; }
    } else if (b.mode === 'down') { b.y += 2.5; if (b.y >= lowY) { b.y = lowY; b.mode = 'low'; b.modeT = 0; } }

      b.y = lowY + Math.sin(b.t * 0.1) * 4;
      b.x += Math.sign(p.x - cx) * 0.5;
      if (b.modeT > 190) { b.mode = 'up'; b.modeT = 0; }
    } else { b.y -= 2.5; if (b.y <= 150) { b.mode = 'fly'; b.modeT = 0; } }
  } else if (b.kind === 'crane') {
    const lowY = floor - b.h;
    if (b.mode === 'enter') { b.y += 2; if (b.y >= 60) { b.mode = 'fly'; b.modeT = 0; } }
    else if (b.mode === 'fly') {                           // follow Captain Woof, then "!" and the claw drops
      b.x += Math.max(-2, Math.min(2, (p.x + p.w / 2 - cx) * 0.03));
      b.x = Math.max(left + 10, Math.min(right - b.w - 10, b.x));
      b.y = 60 + Math.sin(b.t * 0.05) * 6;
      if (b.modeT > 80) { b.mode = 'aim'; b.modeT = 0; b.warn = 50; }
    } else if (b.mode === 'aim') {
      if (b.modeT > 50) { b.mode = 'grab'; b.modeT = 0; }
    } else if (b.mode === 'grab') {                        // claw shoots down, waits, comes back up
      if (b.modeT < 30) b.clawY = Math.min(1, b.clawY + 0.06);
      else if (b.modeT > 70) b.clawY = Math.max(0, b.clawY - 0.04);
      if (b.modeT === 30) { shake = 6; sfx.land(); }
      if (b.modeT > 70 && b.clawY === 0) {
        b.grabs++; b.modeT = 0;
        if (b.grabs % 2 === 0) { b.mode = 'down'; say = 'Uh oh... my crane is out of gas!'; sayT = 80; }
        else b.mode = 'fly';
      }
    } else if (b.mode === 'down') { b.y += 3; if (b.y >= lowY) { b.y = lowY; b.mode = 'low'; b.modeT = 0; shake = 8; sfx.land(); } }
    else if (b.mode === 'low') { if (b.modeT > 180) { b.mode = 'up'; b.modeT = 0; } }
    else { b.y -= 3; if (b.y <= 60) { b.mode = 'fly'; b.modeT = 0; bossShot(cx, b.y + b.h, -2.5, -3, 'ball', 10, 0.2); bossShot(cx, b.y + b.h, 2.5, -3, 'ball', 10, 0.2); } }
    if (b.clawY > 0 && state === 'play') {                 // the claw hurts if it lands on you

    if (p.vy > 0 && p.y + p.h - p.vy <= b.y + 22) {

}

function updateShots() {
  const p = player;
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy; s.vy += s.grav;
    if (s.kind !== 'wave' && tileSolid(Math.floor(s.x / T), Math.floor((s.y + s.r) / T)) || s.y > H + 40 || s.x < camX - 100 || s.x > camX + W + 100) {
      s.gone = true; burst(s.x, s.y, ['#ce93d8', '#fff'], 8, 3);
    }
    if (s.kind === 'wave' && (tileSolid(Math.floor((s.x + s.vx * 3) / T), Math.floor(s.y / T)))) s.gone = true;
    const dx = s.x - (p.x + p.w / 2), dy = s.y - (p.y + p.h / 2);
    if (Math.abs(dx) < s.r + 12 && Math.abs(dy) < s.r + 18 && state === 'play' && p.inv === 0) { s.gone = true; hurt(s.x); }
  }
  shots = shots.filter(s => !s.gone);
}

// ---------- Playing ----------
function updatePlay() {
  const p = player;
  const target = (keys.right - keys.left) * SPEED;
  p.vx += (target - p.vx) * (p.onGround ? 0.3 : 0.15);
  if (keys.right) p.face = 1; else if (keys.left) p.face = -1;

  if (jumpPressed) p.buffer = 8; else p.buffer--;
  jumpPressed = false;
  if (p.onGround) p.coyote = 6; else p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7;
    sfx.jump();
    burst(p.x + p.w / 2, p.y + p.h, ['#fff', '#e0e0e0'], 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;
  if (p.vy >= 0) p.jumping = false;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  // Hold JUMP while falling: the cape opens and Captain Woof glides!
  p.gliding = !p.onGround && keys.jump && p.vy > 0;
  if (p.gliding) {
    p.vy = Math.min(p.vy, GLIDE);
    if (frame % 3 === 0) particles.push({ x: p.x + p.w / 2 - p.face * 18, y: p.y + 20 + Math.random() * 14, vx: -p.face * 1.5,
                                          vy: 0.3, life: 16, color: frame % 6 ? '#90caf9' : '#fff', size: 4 });
    if (frame % 10 === 0) sfx.glide();
  }

  if (barkPressed) bark();
  barkPressed = false;
  if (p.barkCool > 0) p.barkCool--;
  if (p.barkAnim > 0) p.barkAnim--;

  const wasInAir = !p.onGround;
  moveX(p); moveY(p);
  if (p.onGround && wasInAir) p.squash = 1.25;
  p.squash += (1 - p.squash) * 0.2;
  if (p.inv > 0) p.inv--;

  // Coins
  for (const c of coins) {
    if (c.got) continue;
    const dx = c.x - (p.x + p.w / 2), dy = c.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 30 * 30) {
      c.got = true; levelCoins++; totalCoins++; bankCoin();
      sfx.coin();
      burst(c.x, c.y, ['#ffd740', '#fff59d'], 8, 3);
    }
  }

  // Treasure Map piece
  if (mapPiece && !mapPiece.got) {
    const dx = mapPiece.x - (p.x + p.w / 2), dy = mapPiece.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 36 * 36) {
      mapPiece.got = true; mapCount = foundMapPiece(); mapBanner = 150;
      [523, 659, 784, 1047, 880, 1047, 1319].forEach((f, i) => note(f, i * 0.09, 0.2, 'triangle', 0.12));
      burst(mapPiece.x, mapPiece.y, ['#e6c88e', '#fff59d', '#d32f2f', '#fff'], 24, 4);
    }
  }

  // Stolen things to give back
  for (const k of items) {
    if (k.back) { k.fly++; k.y -= 3; continue; }
    if (overlap(p, k)) {
      k.back = true; itemsBack++;
      sfx.item();
      burst(k.x + 14, k.y + 14, ['#ffd740', '#ff80ab', '#fff'], 16, 3);
    }
  }

  // Bouncy mattresses
  for (const s of springs) {
    if (s.squish > 0) s.squish--;
    if (p.vy > 0 && overlap(p, s) && p.y + p.h - p.vy <= s.y + 10) {
      p.y = s.y - p.h; p.vy = -SPRING; p.jumping = false; s.squish = 10;
      sfx.spring();
    }
  }

  // Traffic cones
  for (const s of spikes) if (overlap(p, { x: s.x + 8, y: s.y + 14, w: 24, h: 26 })) hurt(s.x + 20);

  // Snatcher's helpers
  for (const e of enemies) {
    if (e.dead) { e.dead++; e.y += e.kicked ? -2 : 0; e.x += e.kicked || 0; continue; }
    if (e.stun > 0) e.stun--;
    if (e.kind === 'mouse') {
      e.vy = Math.min(e.vy + GRAV, MAXFALL);
      if (!e.stun) { const old = e.vx; if (moveX(e)) e.vx = -old; } else { const v = e.vx; e.vx = 0; moveX(e); e.vx = v; }
      moveY(e);
      if (e.onGround && !e.stun) {
        const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
        if (!tileSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
      }
      if (e.y > rows * T + 200) e.gone = true;
    } else if (!e.stun) {                                // pigeon flaps back and forth
      e.x += e.vx;
      if (Math.abs(e.x - e.hx) > 110) { e.vx = -e.vx; e.x = e.hx + Math.sign(e.x - e.hx) * 110; }
      e.y = e.hy + Math.sin(frame * 0.06 + e.hx) * 18;
    } else if (e.y < e.hy + 30) e.y += 1;              // a dizzy pigeon drifts down a bit
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 14) {    // bop!
        e.dead = 1; p.vy = keys.jump ? -12 : -9; p.jumping = false;
        sfx.bop();
        burst(e.x + e.w / 2, e.y + e.h / 2, ['#9e9e9e', '#ffd740', '#fff'], 12, 3);
      } else if (e.stun) {                               // a dizzy helper gets booped away
        e.dead = 1; e.kicked = p.face * 6; sfx.bop();
        burst(e.x + e.w / 2, e.y + e.h / 2, ['#fff59d', '#fff'], 10, 3);
      } else hurt(e.x + e.w / 2);
    }
  }
  enemies = enemies.filter(e => !e.gone && e.dead < 30);
  updateWaves();

  // Fire hydrant checkpoint
  if (checkpoint && !checkpoint.reached && overlap(p, { x: checkpoint.x - 14, y: checkpoint.y - 80, w: 28, h: 80 })) {
    checkpoint.reached = true;
    respawn = { x: checkpoint.x - 15, y: checkpoint.y - p.h };
    p.hp = MAXHP;
    sfx.check();
    burst(checkpoint.x, checkpoint.y - 50, ['#40c4ff', '#fff'], 16, 3);
  }

  // Boss time!
  if (bossState === 'none' && p.x > (arenaStart + 4) * T) startBoss();
  updateBoss();
  updateShots();

  if (bossState === 'defeated' && flag.rise >= 1 && overlap(p, { x: flag.x - 30, y: flag.y - 150, w: 60, h: 150 })) {
    state = 'levelDone'; timer = 0;
    unlocked = Math.max(unlocked, Math.min(5, levelIndex + 2)); saveProgress(false);
    sfx.win(); confetti();
  }

  if (p.y > rows * T + 60) fellDown();
  if (helpTimer > 0) helpTimer--;
  if (levelBanner > 0) levelBanner--;
}

function update() {
  frame++;
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += pt.confetti ? 0.05 : 0.2;
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);

  if (state === 'title' || state === 'win') {
    if (jumpPressed) { jumpPressed = false; startGame(state === 'win' ? 0 : unlocked - 1); }
    barkPressed = false;
    if (state === 'win' && frame % 90 === 0) confetti();
    return;
  }
  if (state === 'dying') {
    timer++;
    if (timer > 50) {
      Object.assign(player, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 90, hp: MAXHP });
      shots = [];
      state = 'play';
    }
  } else if (state === 'levelDone') {
    timer++;
    if (timer > 60 && jumpPressed || timer > 300) {
      levelIndex++;
      if (levelIndex >= LEVELS.length) { state = 'win'; timer = 0; confetti(); trophy('woofWin'); saveProgress(true); }
      else loadLevel(levelIndex);
    }
    jumpPressed = false;
  } else if (state === 'play') updatePlay();

  const target = player.x + player.w / 2 - W / 2;
  const minX = bossState === 'fight' ? arenaStart * T : 0;
  camX += (Math.max(minX, Math.min(cols * T - W, target)) - camX) * 0.12;
  if (shake > 0) shake--;
  if (stickerNew > 0) stickerNew--;
  if (mapBanner > 0) mapBanner--;
}

function drawStar(x, y, r, fill) {

  ctx.strokeStyle = '#c98e2a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(back, y + h * 0.45); ctx.lineTo(back - f * 8, y + h * 0.2 + Math.sin(frame * 0.4) * 4); ctx.stroke();
  roundRect(x, y + h * 0.3, w, h * 0.45, 8, '#f4b942');  // body
  dot(x + w / 2 - f * 3, y + h * 0.52, 7, '#b3e5fc');    // cockpit window with the two cats
  dot(x + w / 2 - f * 3 - 3, y + h * 0.55, 3, '#ff9800'); dot(x + w / 2 - f * 3 + 3, y + h * 0.55, 3, '#9e9e9e');
  const hx = f > 0 ? x + w - 18 : x + 18;                // head
  roundRect(hx - 11, y, 22, 18, 7, '#f4b942');
  roundRect(hx - 2 + f * 6 - (f < 0 ? 8 : 0), y + 7, 12, 9, 4, '#f4b942');
  dot(hx + f * 13, y + 9, 3, '#000'); dot(hx + f * 2, y + 6, 2.2, '#000');
  ctx.fillStyle = '#8d5a2b'; ctx.beginPath(); ctx.ellipse(hx - f * 7, y + 6, 4, 9, f * 0.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#e53935'; ctx.fillRect(hx - 9, y + 17, 18, 3);   // collar
}

// A hat from the Bundle Room. cx = middle of the head, top = top of the head, hw = half the head's width, f = facing
function drawHat(id, cx, top, hw, f) {
  if (!['cap', 'crown', 'helmet', 'tophat'].includes(id)) return;
  const k = hw / 11;
  ctx.save(); ctx.translate(cx, top); ctx.scale(f * k, k);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(0,0,0,.6)';
  const shape = (fill, path) => { ctx.beginPath(); path(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  if (id === 'cap') {                                    // red cap, brim forward
    shape('#c62828', () => { ctx.moveTo(4, -2); ctx.lineTo(19, -1); ctx.quadraticCurveTo(21, 2, 17, 3); ctx.lineTo(4, 2); ctx.closePath(); });
    shape('#e53935', () => { ctx.arc(0, 2, 11, Math.PI, 0); ctx.closePath(); });
    shape('#fff', () => ctx.arc(0, -9, 1.8, 0, 7));
  } else if (id === 'crown') {                           // golden crown with jewels
    shape('#ffd600', () => { ctx.moveTo(-10, 2); ctx.lineTo(-11, -12); ctx.lineTo(-5.5, -6); ctx.lineTo(0, -15); ctx.lineTo(5.5, -6); ctx.lineTo(11, -12); ctx.lineTo(10, 2); ctx.closePath(); });
    dot(0, -3, 2.2, '#e53935'); dot(-6, -2, 1.6, '#2979ff'); dot(6, -2, 1.6, '#2979ff');
  } else if (id === 'helmet') {                          // tall dark-blue police helmet with a silver badge
    shape('#1a237e', () => { ctx.moveTo(-11, 2); ctx.quadraticCurveTo(-12, -20, 0, -21); ctx.quadraticCurveTo(12, -20, 11, 2); ctx.closePath(); });
    shape('#283593', () => ctx.ellipse(0, 2, 13, 3, 0, 0, 7));
    shape('#cfd8dc', () => ctx.arc(1, -10, 3.5, 0, 7));
    shape('#cfd8dc', () => ctx.arc(0, -21, 2, 0, 7));
  } else if (id === 'tophat') {                          // fancy black top hat with a red band
    shape('#212121', () => ctx.ellipse(0, 1, 15, 3, 0, 0, 7));
    shape('#212121', () => { ctx.rect(-9, -20, 18, 21); });
    ctx.fillStyle = '#e53935'; ctx.fillRect(-9, -6, 18, 4);
  }
  ctx.restore();
}

function drawWaves() {                                   // BARK BLAST sound waves
  for (const w of waves) {
    ctx.globalAlpha = Math.min(1, w.life / 12);
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = i === 1 ? '#fff' : '#80d8ff';
      const r = w.r - i * 7; if (r <= 2) continue;
      ctx.beginPath(); ctx.arc(w.x - w.dir * i * 9, w.y, r, w.dir > 0 ? -0.9 : Math.PI - 0.9, w.dir > 0 ? 0.9 : Math.PI + 0.9); ctx.stroke();
    }
    if (w.life > 30) text('WOOF!', w.x, w.y - w.r - 6, 16, '#fff59d');
  }
  ctx.globalAlpha = 1;
}
function drawHydrant(c) {                                // fire hydrant checkpoint (dogs love these!)

}

}
function drawCone(s) {                                   // orange traffic cone
  ctx.fillStyle = '#ff6d00';

function drawFlag(f) {                                   // the hero flag pops up after the boss

  text('🐾', x + 28, y - 116, 20);

}

// ---------- Drawing: Snatcher and his silly machines ----------
// Snatcher the sneaky purple cat. (x, y) = middle of his head, s = size, f = facing, body = draw his striped shirt + sack
function drawSnatcher(x, y, s, f, body = true, dizzy = false) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * f, s);
  const P = '#9c4dcc', PD = '#6a1b9a';
  if (body) {
    ctx.strokeStyle = P; ctx.lineWidth = 4; ctx.lineCap = 'round';   // curly tail
    ctx.beginPath(); ctx.moveTo(-8, 30); ctx.quadraticCurveTo(-26, 30, -22, 12 + Math.sin(frame * 0.15) * 3); ctx.stroke();
    dot(-20, 18, 13, '#d7b98e');                          // the loot sack
    ctx.fillStyle = '#b08d5b'; ctx.fillRect(-24, 4, 8, 4);
    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#2e7d32'; ctx.fillText('$', -20, 23);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#fff' : '#212121'; ctx.fillRect(-10, 10 + i * 4, 20, 4); }   // striped shirt
    ctx.strokeStyle = P; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(6, 14); ctx.lineTo(15, 20); ctx.stroke();
    ctx.fillStyle = PD; ctx.fillRect(-8, 34, 6, 6); ctx.fillRect(2, 34, 6, 6);
  }
  ctx.fillStyle = P;                                      // pointy ears
  ctx.beginPath(); ctx.moveTo(-12, -4); ctx.lineTo(-10, -20); ctx.lineTo(-2, -11); ctx.fill();
  ctx.beginPath(); ctx.moveTo(12, -4); ctx.lineTo(10, -20); ctx.lineTo(2, -11); ctx.fill();
  ctx.fillStyle = '#f48fb1';
  ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(-9, -16); ctx.lineTo(-5, -11); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, -8); ctx.lineTo(9, -16); ctx.lineTo(5, -11); ctx.fill();
  dot(0, 0, 13, P);
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(-14, -7, 28, 9, 4); ctx.fill();   // black burglar mask
  for (const ex of [-5, 5]) {
    dot(ex, -3, 3.4, '#fff');
    if (dizzy) { ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(ex, -3, 2, 0, 5); ctx.stroke(); }
    else dot(ex + 1.2, -3, 1.8, '#c6ff00');
  }
  dot(1.5, 4, 2, '#f06292');                             // nose
  ctx.strokeStyle = '#311b92'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(-1, 6, 3, 0.2, 2.6); ctx.arc(4, 6, 3, 0.5, 2.9); ctx.stroke();   // sneaky grin
  ctx.strokeStyle = '#e1bee7'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(6, 4); ctx.lineTo(17, 2); ctx.moveTo(6, 6); ctx.lineTo(17, 8); ctx.moveTo(-4, 4); ctx.lineTo(-15, 2); ctx.moveTo(-4, 6); ctx.lineTo(-15, 8); ctx.stroke();
  ctx.restore();
}

function drawBoss(b) {
  if (b.hurt > 0 && Math.floor(frame / 4) % 2) return;
  ctx.save();
  if (b.dying) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  const cx = b.x + b.w / 2, f = b.kind === 'scooter' || b.kind === 'yarn' ? (b.dir || -1) : Math.sign(player.x - cx) || -1;
  const dizzy = b.mode === 'dizzy' || b.mode === 'low' || !!b.dying;
  if (b.kind === 'scooter') {                            // Super Scooter
    const fx = f > 0 ? b.x + b.w - 14 : b.x + 14;
    roundRect(b.x + 4, b.y + b.h - 26, b.w - 8, 12, 6, '#ff1744');
    ctx.fillStyle = '#9e9e9e'; ctx.fillRect(fx - 3, b.y + 6, 6, b.h - 24);
    ctx.fillRect(fx - 14, b.y + 4, 28, 5);
    for (const wx of [b.x + 20, b.x + b.w - 20]) { dot(wx, b.y + b.h - 12, 12, '#212121'); dot(wx, b.y + b.h - 12, 5, '#bdbdbd'); }
    drawSnatcher(cx - f * 8, b.y + 14, 1.05, f, true, dizzy);
    if (b.mode === 'zoom' && frame % 3 === 0) particles.push({ x: f > 0 ? b.x : b.x + b.w, y: b.y + b.h - 18, vx: -f * 2, vy: -0.5, life: 20, color: '#e0e0e0', size: 8 });
  } else if (b.kind === 'yarn') {                        // Yarn Ball Roller
    const r = b.w / 2, cy = b.y + r, a = b.x / r;
    dot(cx, cy, r, '#ef5350');
    ctx.strokeStyle = '#c62828'; ctx.lineWidth = 4;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.9, r * (0.2 + i * 0.22), a + i * 0.8, 0, 7); ctx.stroke(); }
    ctx.strokeStyle = '#ffcdd2'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - f * r, cy + r * 0.6); ctx.quadraticCurveTo(cx - f * (r + 30), cy + r, cx - f * (r + 50), b.y + b.h); ctx.stroke();
    drawSnatcher(cx, b.y - 30 + Math.abs(Math.sin(frame * 0.3)) * -4, 0.9, f, true, dizzy);
  } else if (b.kind === 'balloon') {                     // Getaway Balloon
    for (let i = 0; i < 6; i++) {                        // striped balloon
      ctx.fillStyle = i % 2 ? '#ffd600' : '#ab47bc';
      ctx.beginPath(); ctx.ellipse(cx, b.y - 64, 56 - i * 9.5, 62, 0, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 40, b.y - 30); ctx.lineTo(b.x + 10, b.y + 30); ctx.moveTo(cx + 40, b.y - 30); ctx.lineTo(b.x + b.w - 10, b.y + 30); ctx.stroke();
    drawSnatcher(cx, b.y + 14, 1, f, true, dizzy);
    roundRect(b.x + 6, b.y + 30, b.w - 12, b.h - 30, 6, '#8d6e63');
    ctx.fillStyle = '#6d4c41'; for (let i = 0; i < 4; i++) ctx.fillRect(b.x + 14 + i * 20, b.y + 32, 4, b.h - 34);
  } else if (b.kind === 'crane') {                       // Claw Crane (with a helicopter top!)
    const floor = (rows - 2) * T, top = b.y + b.h, clawTop = top + b.clawY * (floor - top - 30);
    ctx.strokeStyle = '#424242'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, clawTop); ctx.stroke();
    ctx.strokeStyle = '#757575'; ctx.lineWidth = 5;      // the claw
    const open = b.mode === 'grab' && b.modeT < 30 ? 14 : 6;
    ctx.beginPath(); ctx.moveTo(cx, clawTop); ctx.lineTo(cx - open - 6, clawTop + 16); ctx.lineTo(cx - open + 2, clawTop + 28);
    ctx.moveTo(cx, clawTop); ctx.lineTo(cx + open + 6, clawTop + 16); ctx.lineTo(cx + open - 2, clawTop + 28); ctx.stroke();
    dot(cx, clawTop, 7, '#9e9e9e');
    ctx.fillStyle = '#616161'; ctx.fillRect(cx - 3, b.y - 16, 6, 16);
    const rr = Math.abs(Math.cos(frame * (b.mode === 'low' ? 0.05 : 0.5))) * 70 + 10;
    ctx.fillRect(cx - rr, b.y - 18, rr * 2, 4);
    roundRect(b.x, b.y, b.w, b.h, 12, '#ffca28');
    roundRect(b.x + 30, b.y + 8, b.w - 60, 40, 10, '#b3e5fc');
    drawSnatcher(cx, b.y + 30, 0.85, f, false, dizzy);
    text('CLAW', cx, b.y + b.h - 6, 16, '#ff1744');
  } else if (b.kind === 'mecha') {                       // MECHA-SNATCHER: a giant robot cat
    const M = '#7e57c2', MD = '#4527a0', step = b.onGround && Math.abs(b.vx) > 0 ? Math.sin(frame * 0.2) * 6 : 0;
    ctx.fillStyle = MD; ctx.fillRect(b.x + 26 + step, b.y + b.h - 34, 22, 34); ctx.fillRect(b.x + b.w - 48 - step, b.y + b.h - 34, 22, 34);
    roundRect(b.x + 18 + step, b.y + b.h - 10, 36, 10, 4, '#311b92'); roundRect(b.x + b.w - 54 - step, b.y + b.h - 10, 36, 10, 4, '#311b92');
    ctx.strokeStyle = M; ctx.lineWidth = 10; ctx.lineCap = 'round';   // robot tail
    ctx.beginPath(); ctx.moveTo(cx - f * 50, b.y + 80); ctx.quadraticCurveTo(cx - f * 95, b.y + 70, cx - f * 85, b.y + 20 + Math.sin(frame * 0.1) * 6); ctx.stroke();
    roundRect(b.x + 12, b.y + 50, b.w - 24, 50, 16, M);  // body
    text('MECHA', cx, b.y + 84, 18, '#fff59d');
    ctx.fillStyle = M;                                   // head with ears
    ctx.beginPath(); ctx.moveTo(cx - 44, b.y + 20); ctx.lineTo(cx - 40, b.y - 14); ctx.lineTo(cx - 18, b.y + 6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 44, b.y + 20); ctx.lineTo(cx + 40, b.y - 14); ctx.lineTo(cx + 18, b.y + 6); ctx.fill();
    roundRect(cx - 46, b.y + 2, 92, 54, 22, M);
    const glow = b.warn > 0 && frame % 10 < 5 ? '#ffff00' : '#ff1744';
    dot(cx - 22 + f * 4, b.y + 32, 8, glow); dot(cx + 22 + f * 4, b.y + 32, 8, glow);
    ctx.fillStyle = 'rgba(179,229,252,.7)'; ctx.beginPath(); ctx.arc(cx, b.y + 20, 18, Math.PI, 0); ctx.fill();   // glass bubble with Snatcher inside
    drawSnatcher(cx, b.y + 12, 0.55, f, false, dizzy);
    ctx.strokeStyle = '#b39ddb'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(cx - 10, b.y + 46); ctx.lineTo(cx - 40, b.y + 42); ctx.moveTo(cx + 10, b.y + 46); ctx.lineTo(cx + 40, b.y + 42); ctx.stroke();
  }
  ctx.restore();
  if (dizzy && !b.dying) for (let i = 0; i < 3; i++) { const a = frame * 0.12 + i * 2.1; text('★', cx + Math.cos(a) * 26, b.y - 8 + Math.sin(a) * 6, 18, '#ffeb3b'); }
  if (b.warn > 0) {                                      // "!" = get ready, something is coming
    const wy = b.kind === 'crane' ? (rows - 2) * T - 30 : b.kind === 'balloon' ? b.y + b.h + 44 : b.y - (b.kind === 'yarn' ? 70 : 30);
    text('!', cx, wy + Math.sin(frame * 0.5) * 4, 48, frame % 10 < 5 ? '#ff1744' : '#ffeb3b');
  }
  if (sayT > 0) {                                        // Snatcher talks
    ctx.font = 'bold 18px "Comic Sans MS", "Chalkboard SE", sans-serif';
    const air = b.kind === 'balloon' || b.kind === 'crane', tw = ctx.measureText(say).width + 24;
    const by = air ? Math.max(150, b.y) : Math.max(150, b.y - (b.kind === 'yarn' ? 110 : 80));
    let bx = air ? cx + b.w / 2 + 14 : cx - tw / 2;
    if (air && bx + tw > camX + W - 10) bx = cx - b.w / 2 - 14 - tw;
    bx = Math.max(camX + 10, Math.min(camX + W - tw - 10, bx));
    roundRect(bx, by, tw, 34, 12, '#fff');
    ctx.fillStyle = '#4a148c'; ctx.textAlign = 'center'; ctx.fillText(say, bx + tw / 2, by + 23);
  }
}

function drawShots() {
  for (const s of shots) {
    if (s.kind === 'yarn') { dot(s.x, s.y, s.r, '#42a5f5'); ctx.strokeStyle = '#1565c0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.6, frame * 0.2, frame * 0.2 + 3); ctx.stroke(); }
    else if (s.kind === 'vase') { roundRect(s.x - 8, s.y - 10, 16, 20, 7, '#4fc3f7'); ctx.fillStyle = '#0288d1'; ctx.fillRect(s.x - 5, s.y - 13, 10, 4); ctx.fillStyle = '#fff'; ctx.fillRect(s.x - 6, s.y - 2, 12, 3); }
    else if (s.kind === 'ball') { dot(s.x, s.y, s.r, '#d4e157'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x - s.r, s.y, s.r * 0.8, -1, 1); ctx.stroke(); }
    else if (s.kind === 'fish') {                        // robot fish missile

      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-18, -7); ctx.lineTo(-18, 7); ctx.fill();
      dot(6, -2, 1.8, '#ff1744'); ctx.restore();
    } else {                                             // purple stomp wave

}
function drawParticles() {
  for (const pt of particles) {

}
