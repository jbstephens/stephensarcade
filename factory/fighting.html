<canvas id="game" width="960" height="520"></canvas>
<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, FLOOR = 440, GRAV = 0.65;

// ---------- Sound ----------
let actx = null;
function note(freq, start, dur, wave = 'square', vol = 0.1, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}
const sfx = {
  swish:  () => noise(0.08, 0.25, 2500),
  punch:  () => { noise(0.1, 0.8, 900); note(160, 0, 0.1, 'square', 0.1, 70); },
  kick:   () => { noise(0.14, 0.9, 600); note(120, 0, 0.15, 'square', 0.12, 50); },
  block:  () => note(1200, 0, 0.08, 'square', 0.06, 900),
  zap:    () => note(300, 0, 0.3, 'sawtooth', 0.07, 1400),
  jump:   () => note(300, 0, 0.12, 'sine', 0.1, 600),
  ko:     () => { noise(0.5, 0.8, 300); [400, 300, 200, 120].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)); },
  bell:   () => { note(880, 0, 0.6, 'sine', 0.15); note(1320, 0, 0.6, 'sine', 0.06); },
  cheer:  () => { noise(1.4, 0.3, 1100); [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.1, 0.25, 'square', 0.06)); },
  click:  () => note(660, 0, 0.05, 'square', 0.05),
};

// ---------- Input ----------
const keys = {}, pressed = new Set();
addEventListener('keydown', e => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k]) pressed.add(k);
  keys[k] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', '/'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
const CONTROLS = {
  solo: { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', punch: 'z', kick: 'x', special: 'c' },
  p1:   { left: 'a', right: 'd', up: 'w', down: 's', punch: 'f', kick: 'g', special: 'h' },
  p2:   { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', punch: ',', kick: '.', special: '/' },
};

// ---------- Fighters ----------
const CHARS = [
  { name: 'Robo Max', color: '#42a5f5', speed: 4, power: 1, jump: 14, special: 'laser', desc: 'Shoots lasers!' },
  { name: 'Ninja Kit', color: '#ff9800', speed: 5.2, power: 0.85, jump: 15.5, special: 'star', desc: 'Super fast!' },
  { name: 'Dino Rex', color: '#66bb6a', speed: 3.2, power: 1.25, jump: 12.5, special: 'fire', desc: 'Super strong!' },
  { name: 'Wizard Zap', color: '#ab47bc', speed: 3.8, power: 1, jump: 14, special: 'orb', desc: 'Magic blasts!' },
];
const MOVES = {
  punch:   { start: 4, active: 5, end: 9, dmg: 5, range: 62, top: 92, bot: 62, kb: 4 },
  kick:    { start: 7, active: 6, end: 13, dmg: 8, range: 78, top: 60, bot: 25, kb: 8 },
  special: { start: 10, active: 1, end: 16 },
};

function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let tpMode = 'one';
const TOUCH = navigator.maxTouchPoints > 0 || /[?&]touch=1/.test(location.search);
let scene = 'title', mode = 'solo', sel = [0, 1], ready = [false, false], fighters = [], shots = [], particles = [], pops = [];
let round = 1, roundT = 0, roundState = 'intro', timer = 60 * 60, frame = 0, shake = 0, menuSel = 0, matchWinner = null;

function makeFighter(ci, x, face, ctrl, cpu) {
  return { ci, ch: CHARS[ci], x, y: FLOOR, vx: 0, vy: 0, face, hp: 100, state: 'idle', st: 0, cd: 0, hitDone: false,
           ctrl, cpu, wins: 0, combo: 0, comboT: 0, flash: 0, ai: { t: 0, hold: null, holdT: 0 } };
}
function startMatch() {
  fighters = [
    makeFighter(sel[0], 260, 1, mode === 'solo' ? CONTROLS.solo : CONTROLS.p1, false),
    makeFighter(sel[1], 700, -1, CONTROLS.p2, mode === 'solo'),
  ];
  round = 1; startRound(); scene = 'fight';
  if (mode === 'duo') trophy('brawl2p');
}
function startRound() {
  fighters.forEach((f, i) => Object.assign(f, { x: i ? 700 : 260, y: FLOOR, vx: 0, vy: 0, hp: 100, state: 'idle', st: 0, cd: 60, combo: 0, flash: 0 }));
  shots = []; pops = []; roundState = 'intro'; roundT = 0; timer = 60 * 60;
  sfx.bell();
}

// ---------- Computer player ----------
function cpuInput(f, o) {
  const a = f.ai, dist = Math.abs(o.x - f.x), toward = o.x > f.x ? 'right' : 'left', away = toward === 'right' ? 'left' : 'right';
  const inp = { left: false, right: false, up: false, down: false, punch: false, kick: false, special: false };
  if (a.holdT > 0) { a.holdT--; inp[a.hold] = true; return inp; }
  if (--a.t > 0) { if (dist > 75) inp[toward] = true; return inp; }
  a.t = 10 + Math.floor(Math.random() * 14);                    // thinks a few times a second
  const opAttacking = ['punch', 'kick'].includes(o.state);
  const r = Math.random();
  if (opAttacking && dist < 110 && r < 0.3) { a.hold = 'down'; a.holdT = 22; inp.down = true; }
  else if (shots.some(s => s.owner === o) && r < 0.35 && f.y >= FLOOR) inp.up = true;
  else if (dist > 230 && f.cd === 0 && r < 0.35) inp.special = true;
  else if (dist > 75) { inp[toward] = true; if (r < 0.06) inp.up = true; }
  else if (r < 0.42) inp.punch = true;
  else if (r < 0.72) inp.kick = true;
  else if (r < 0.82) inp.up = true;
  else { a.hold = away; a.holdT = 15; inp[away] = true; }
  return inp;
}
function humanInput(c) {
  return { left: keys[c.left], right: keys[c.right], up: pressed.has(c.up), down: keys[c.down],
           punch: pressed.has(c.punch), kick: pressed.has(c.kick), special: pressed.has(c.special) };
}

// ---------- Fighting ----------
function hurtbox(f) { return { x: f.x - 28, y: f.y - 112, w: 56, h: 112 }; }
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const POPWORDS = ['POW!', 'BAM!', 'WHAM!', 'BOOM!', 'ZAP!', 'BONK!'];

function landHit(att, def, dmg, kb, x, y, kickUp) {
  const blocking = def.state === 'block' && Math.sign(att.x - def.x) === def.face;
  if (blocking) {
    def.hp -= dmg * 0.15; def.vx = -def.face * 3; sfx.block();
    burst(x, y, ['#90caf9', '#fff'], 6, 3);
    pops.push({ x, y: y - 20, text: 'BLOCK!', t: 40, color: '#90caf9' });
  } else {
    def.hp -= dmg; def.state = 'hurt'; def.st = 18; def.flash = 10;
    def.vx = Math.sign(def.x - att.x || att.face) * kb; if (kickUp) def.vy = -5;
    att.combo = att.comboT > 0 ? att.combo + 1 : 1; att.comboT = 50;
    shake = 6 + kb;
    burst(x, y, ['#ffeb3b', '#ff9800', '#fff'], 14, 5);
    pops.push({ x, y: y - 20, text: att.combo > 1 ? `${att.combo} HITS!` : POPWORDS[Math.floor(Math.random() * POPWORDS.length)], t: 45, color: '#ffeb3b' });
  }
  if (def.hp <= 0) {
    def.hp = 0; def.state = 'ko'; def.vy = -9; def.vx = Math.sign(def.x - att.x || 1) * 6;
    att.wins++; roundState = 'ko'; roundT = 0; sfx.ko(); shake = 20;
  }
}

function fireSpecial(f) {
  const k = f.ch.special, y = f.y - 75;
  if (k === 'laser') shots.push({ owner: f, x: f.x + f.face * 40, y, vx: f.face * 11, dmg: 9, r: 10, kind: k, life: 120 });
  if (k === 'star') for (const dy of [-12, 12]) shots.push({ owner: f, x: f.x + f.face * 40, y: y + dy, vx: f.face * 9, dmg: 5, r: 10, kind: k, life: 120 });
  if (k === 'fire') shots.push({ owner: f, x: f.x + f.face * 50, y: y + 10, vx: f.face * 6, dmg: 13, r: 28, kind: k, life: 32 });
  if (k === 'orb') shots.push({ owner: f, x: f.x + f.face * 40, y: y - 10, vx: f.face * 5, dmg: 11, r: 18, kind: k, life: 200 });
  f.cd = 110; sfx.zap();
}

function updateFighter(f, o) {
  const canAct = roundState === 'fight';
  const inp = canAct ? (f.cpu ? cpuInput(f, o) : humanInput(f.ctrl)) : {};
  const onGround = f.y >= FLOOR;
  if (f.cd > 0) f.cd--;
  if (f.comboT > 0) f.comboT--;
  if (f.flash > 0) f.flash--;

  if (f.state === 'ko') { /* just fall over */ }
  else if (f.state === 'hurt') { if (--f.st <= 0) f.state = 'idle'; }
  else if (MOVES[f.state]) {
    const m = MOVES[f.state];
    f.st++;
    if (onGround) f.vx *= 0.7;
    if (f.state === 'special' && f.st === m.start) fireSpecial(f);
    if (f.state !== 'special' && !f.hitDone && f.st >= m.start && f.st < m.start + m.active) {
      const hb = { x: f.face > 0 ? f.x + 10 : f.x - 10 - m.range, y: f.y - m.top, w: m.range, h: m.top - m.bot };
      if (o.state !== 'ko' && overlap(hb, hurtbox(o))) {
        f.hitDone = true;
        f.state === 'punch' ? sfx.punch() : sfx.kick();
        landHit(f, o, m.dmg * f.ch.power, m.kb, f.x + f.face * (m.range - 5), f.y - (m.top + m.bot) / 2, f.state === 'kick');
      }
    }
    if (f.st >= m.start + m.active + m.end) f.state = 'idle';
  } else {
    // free to move
    if (inp.down && onGround) { f.state = 'block'; f.vx = 0; }
    else {
      f.state = onGround ? (inp.left || inp.right ? 'walk' : 'idle') : 'jump';
      f.vx = ((inp.right ? 1 : 0) - (inp.left ? 1 : 0)) * f.ch.speed;
      if (inp.up && onGround) { f.vy = -f.ch.jump; sfx.jump(); }
    }
    if (inp.punch) { f.state = 'punch'; f.st = 0; f.hitDone = false; sfx.swish(); }
    else if (inp.kick) { f.state = 'kick'; f.st = 0; f.hitDone = false; sfx.swish(); }
    else if (inp.special && f.cd === 0) { f.state = 'special'; f.st = 0; }
    if (f.state !== 'block' && !MOVES[f.state] && f.state !== 'jump' && !inp.down) {}
    if (onGround && f.state !== 'block') f.face = o.x > f.x ? 1 : -1;
  }
  f.vy += GRAV; f.y += f.vy;
  if (f.y >= FLOOR) { f.y = FLOOR; f.vy = 0; if (f.state === 'hurt' || f.state === 'ko') f.vx *= 0.8; }
  f.x += f.vx;
  if (f.state === 'hurt') f.vx *= 0.88;
  f.x = Math.max(40, Math.min(W - 40, f.x));
}

function burst(x, y, colors, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 7, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 25 + Math.random() * 15, color: colors[i % colors.length], size: 4 + Math.random() * 4 });
  }
}

function updateFight() {
  roundT++;
  if (roundState === 'intro' && roundT > 100) { roundState = 'fight'; roundT = 0; }
  if (roundState === 'fight') {
    timer--;
    if (timer <= 0) {
      const [a, b] = fighters;
      roundState = 'ko'; roundT = 0; sfx.bell();
      if (a.hp !== b.hp) (a.hp > b.hp ? a : b).wins++;
    }
  }
  const [a, b] = fighters;
  updateFighter(a, b); updateFighter(b, a);
  // don't walk through each other
  const dx = b.x - a.x;
  if (Math.abs(dx) < 50 && Math.abs(a.y - b.y) < 90 && a.state !== 'ko' && b.state !== 'ko') {
    const push = (50 - Math.abs(dx)) / 2 * Math.sign(dx || 1);
    a.x -= push; b.x += push;
  }
  for (const s of shots) {
    s.x += s.vx; s.life--;
    if (s.kind === 'orb') s.y += Math.sin(s.life * 0.15) * 2;
    const target = s.owner === a ? b : a;
    if (target.state !== 'ko' && overlap({ x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 }, hurtbox(target)) && roundState !== 'ko') {
      s.life = 0; sfx.punch();
      landHit(s.owner, target, s.dmg * s.owner.ch.power, 6, s.x, s.y, false);
    }
    for (const t of shots) if (t !== s && t.owner !== s.owner && Math.abs(t.x - s.x) < t.r + s.r && Math.abs(t.y - s.y) < t.r + s.r) {
      s.life = t.life = 0; burst(s.x, s.y, ['#fff', '#ffeb3b'], 10, 4);
    }
    if (s.x < -50 || s.x > W + 50) s.life = 0;
  }
  shots = shots.filter(s => s.life > 0);
  if (roundState === 'ko' && roundT > 160) {
    const champ = fighters.find(f => f.wins >= 2);
    if (champ) { matchWinner = champ; scene = 'results'; roundT = 0; sfx.cheer(); }
    else { round++; startRound(); }
  }
}

function update() {
  frame++;
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const p of pops) { p.y -= 0.8; p.t--; }
  pops = pops.filter(p => p.t > 0);
  if (shake > 0) shake--;

  const ok = pressed.has(' ') || pressed.has('Enter');
  // on the iPad: 2-player games get a set of buttons on each side
  const tpWant = mode === 'duo' && scene !== 'title' ? 'two' : 'one';
  if (tpWant !== tpMode) { tpMode = tpWant; if (window.touchpadMode) touchpadMode(tpWant); }
  if (scene === 'title') {
    if (pressed.has('ArrowUp') || pressed.has('ArrowDown')) { menuSel = 1 - menuSel; sfx.click(); }
    if (ok) { mode = menuSel ? 'duo' : 'solo'; scene = 'select'; ready = [false, false]; sel = [0, 1]; sfx.click(); }
  } else if (scene === 'select') {
    const pick = (i, left, right, go) => {
      if (ready[i]) return;
      if (pressed.has(left)) { sel[i] = (sel[i] + 3) % 4; sfx.click(); }
      if (pressed.has(right)) { sel[i] = (sel[i] + 1) % 4; sfx.click(); }
      if (go.some(k => pressed.has(k))) { ready[i] = true; sfx.punch(); }
    };
    if (mode === 'solo') {
      pick(0, 'ArrowLeft', 'ArrowRight', [' ', 'Enter', 'z']);
      if (ready[0]) { const others = [0, 1, 2, 3].filter(i => i !== sel[0]); sel[1] = others[Math.floor(Math.random() * 3)]; startMatch(); }
    } else {
      pick(0, 'a', 'd', ['f']);
      pick(1, 'ArrowLeft', 'ArrowRight', [',', ' ', 'Enter']);
      if (ready[0] && ready[1]) startMatch();
    }
    if (pressed.has('Escape')) scene = 'title';
  } else if (scene === 'fight') {
    if (pressed.has('Escape')) scene = 'title';
    else updateFight();
  } else if (scene === 'results') {
    roundT++;
    if (frame % 30 === 0) burst(Math.random() * W, Math.random() * 200, ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'], 16, 5);
    if (roundT > 60 && ok) startMatch();
    if (pressed.has('Escape')) { scene = 'select'; ready = [false, false]; }
  }
  pressed.clear();
}

// ---------- Drawing ----------
function roundRect(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function limb(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

// Draws a fighter facing right with feet at (0, 0)
function drawBody(ci, state, st, t) {
  const c = CHARS[ci], col = c.color, bob = state === 'idle' ? Math.sin(t * 0.1) * 2 : 0;
  const walk = state === 'walk' ? Math.sin(t * 0.3) * 12 : 0;
  const m = MOVES[state], active = m && st >= m.start;
  const dark = ci === 0 ? '#1565c0' : ci === 1 ? '#263238' : ci === 2 ? '#388e3c' : '#6a1b9a';
  ctx.save();
  if (state === 'hurt') ctx.rotate(-0.15);
  if (state === 'block') ctx.translate(-4, 0);
  // tail for the dino
  if (ci === 2) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-14, -45); ctx.quadraticCurveTo(-55, -30, -60, -8); ctx.lineTo(-10, -30); ctx.fill(); }
  // legs
  const kickOut = state === 'kick' && active;
  limb(-8, -45, -8 - walk * 0.6, 0, 13, dark);
  if (kickOut) limb(8, -45, 70, -45, 14, dark); else if (state === 'jump') limb(8, -45, 18, -14, 13, dark); else limb(8, -45, 8 + walk * 0.6, 0, 13, dark);
  // body
  if (ci === 3) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-22, -40 + bob); ctx.lineTo(22, -40 + bob); ctx.lineTo(10, -88 + bob); ctx.lineTo(-10, -88 + bob); ctx.fill(); }
  else roundRect(-20, -88 + bob, 40, 48, 10, col);
  if (ci === 0) { roundRect(-10, -78 + bob, 20, 14, 3, '#0d47a1'); circle(0, -71 + bob, 4, frame % 30 < 15 ? '#ff1744' : '#ffeb3b'); }
  if (ci === 1) { ctx.fillStyle = '#263238'; ctx.fillRect(-20, -70 + bob, 40, 30); ctx.fillStyle = '#e53935'; ctx.fillRect(-20, -58 + bob, 40, 5); }
  if (ci === 2) { ctx.fillStyle = '#c5e1a5'; ctx.beginPath(); ctx.ellipse(6, -62 + bob, 12, 18, 0, 0, 7); ctx.fill(); }
  // back arm
  const armY = -78 + bob;
  if (state === 'block') limb(-6, armY, 22, armY - 22, 11, dark);
  else limb(-6, armY, -18, armY + 26, 11, dark);
  // head
  const hy = -104 + bob;
  if (ci === 0) {
