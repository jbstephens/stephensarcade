function buildTrack(t, ti) {
  const P = t.pts, n = P.length, dense = [];
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    for (let k = 0; k < 40; k++) {
      const s = k / 40, s2 = s * s, s3 = s2 * s;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * s + (2 * a - 5 * b + 4 * c - d) * s2 + (-a + 3 * b - 3 * c + d) * s3);
      dense.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  // even spacing: one path point every STEP pixels
  const cum = [0];
  for (let i = 1; i <= dense.length; i++) { const a = dense[i - 1], b = dense[i % dense.length]; cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
  const L = cum[dense.length], N = Math.round(L / STEP), path = [];
  let j = 0;
  for (let i = 0; i < N; i++) {
    const d = i * L / N;
    while (cum[j + 1] < d) j++;
    const a = dense[j], b = dense[(j + 1) % dense.length], f = (d - cum[j]) / (cum[j + 1] - cum[j] || 1);
    path.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
  }
  t.path = path; t.N = N; t.len = L;
  t.angs = path.map((p, i) => { const a = path[(i - 1 + N) % N], b = path[(i + 1) % N]; return Math.atan2(b[1] - a[1], b[0] - a[0]); });
  t.elev = path.map((_, i) => {
    let e = 0;
    for (const [a, b, h] of t.hills) { const f = i / N; if (f > a && f < b) e += h * Math.sin(Math.PI * (f - a) / (b - a)); }
    return e;
  });
  t.boostIdx = t.boosts.map(b => Math.floor(b * N));
  t.rampIdx = t.ramps.map(b => Math.floor(b * N));
  const xs = path.map(p => p[0]), ys = path.map(p => p[1]);
  t.minX = Math.min(...xs) - 500; t.maxX = Math.max(...xs) + 500; t.minY = Math.min(...ys) - 500; t.maxY = Math.max(...ys) + 500;
  const R = rng(ti * 977 + 13);
  t.decos = [];
  let tries = 0;
  while (t.decos.length < 170 && tries++ < 5000) {
    const x = t.minX + R() * (t.maxX - t.minX), y = t.minY + R() * (t.maxY - t.minY);
    let ok = true;
    for (let i = 0; i < N; i += 3) if (Math.abs(path[i][0] - x) < ROAD / 2 + 80 && Math.hypot(path[i][0] - x, path[i][1] - y) < ROAD / 2 + 80) { ok = false; break; }
    if (ok) t.decos.push({ x, y, s: 0.7 + R() * 0.7, k: Math.floor(R() * 4), r: R() });
  }
  t.decos.sort((a, b) => a.y - b.y);
}

    rk.idx = nearest(rk.x, rk.y, rk.idx, 20)[0];

    for (const c of racers) {

}

function endRace() {

  setScene('results');
}

function cupStandings() { return fieldChars().map(ch => ({ ch, pts: cupPts[ch] || 0 })).sort((a, b) => b.pts - a.pts || (a.ch === charSel ? -1 : b.ch === charSel ? 1 : 0)); }
function finishCup() {

  const old = SAVE.cups[cup.id];

// ---------- Menus: big tappable buttons (also arrows + Enter) ----------
function inBtn(b, p) { return p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h; }
function menuInput() {
  if (!buttons.length) return;
  if (click) { const i = buttons.findIndex(b => inBtn(b, click)); if (i >= 0) { menuSel = i; sfx.click(); buttons[i].act(false); } return; }
  if (menuSel >= buttons.length) menuSel = 0;
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  for (const k in dirs) if (pressed.has(k)) {
    const [dx, dy] = dirs[k], a = buttons[menuSel], ax = a.x + a.w / 2, ay = a.y + a.h / 2;
    let best = -1, bs = Infinity;
    buttons.forEach((b, i) => {
      if (i === menuSel || b.noKey) return;
      const vx = b.x + b.w / 2 - ax, vy = b.y + b.h / 2 - ay, along = vx * dx + vy * dy, side = Math.abs(vx * dy - vy * dx);
      if (along <= 4) return;
      const sc = along + side * 2.5;
      if (sc < bs) { bs = sc; best = i; }
    });
    if (best >= 0) { menuSel = best; sfx.click(); if (buttons[best].focus) buttons[best].focus(); }
    return;
  }
  if (OK()) { const b = buttons[menuSel]; if (b) { sfx.click(); b.act(true); } return; }
  if (pressed.has('Escape') && scene !== 'race') goBack();
}
function goBack() {
  sfx.click();

  else if (scene === 'char') setScene('mode');
  else if (scene === 'cup' || scene === 'track') setScene('char');
  else setScene('mode');
}
function btn(x, y, w, h, label, color, act, opts = {}) {
  const i = buttons.length, b = { x, y, w, h, act, focus: opts.focus, noKey: opts.noKey };
  buttons.push(b);
  const on = i === menuSel && !opts.noKey;
  if (opts.draw !== false) {
    if (on) roundRect(x - 6, y - 6, w + 12, h + 12, 18, '#fff');
    roundRect(x, y + 5, w, h, 14, 'rgba(0,0,0,.3)');
    roundRect(x, y, w, h, 14, color);
    if (label) text(label, x + w / 2, y + h / 2 + (opts.size || 28) * 0.36, opts.size || 28);
  }

}

function update() {
  frame++; sceneT++;
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 600) particles.splice(0, particles.length - 600);
  for (const p of popups) { p.life--; p.y -= 0.5; }
  popups = popups.filter(p => p.life > 0);
  // the sound button works everywhere
  if (click && click.x > W - 58 && click.y < 54) { musicOn = !musicOn; click = null; }

  if (scene === 'title') {
    if (sceneT > 10 && (OK() || click)) { sfx.go(); setScene('mode'); }
  } else if (scene === 'race') updateRace();
  else {
    if (lockHintT > 0) lockHintT--;
    if (goldHintT > 0) goldHintT--;
    if (scene === 'char' && (pressed.has('g') || pressed.has('G'))) toggleGold();   // G = gold on/off
    if (scene === 'char' && (pressed.has('l') || pressed.has('L'))) { sfx.click(); cycleLook(1); }   // L = next look
    menuInput();

}

const goldCv = document.createElement('canvas'); goldCv.width = goldCv.height = 128;

// turn every colour on the little canvas into a gold shade (darks stay dark so eyes are easy to see), plus a moving shine streak

    let r, gg, b;

    else if (L < 0.8) { const t = (L - 0.5) / 0.3; r = 255; gg = mix(179, 215, t); b = mix(0, 64, t); }    // #ffb300 → #ffd740

function drawRacer(c) {
  const el = track.elev[c.idx] || 0, s = 1 + (c.z + el) / 110, lift = c.z * 0.9 + el * 0.5;
  // shadow
  ctx.fillStyle = `rgba(0,0,0,${c.z > 0 ? 0.18 : 0.28})`; ctx.beginPath(); ctx.ellipse(c.x + 4 + c.z * 0.3, c.y + 6 + c.z * 0.4, 26, 16, c.ang, 0, 7); ctx.fill();
  const x = c.x, y = c.y - lift, ang = c.ang + c.spinRot;
  if (c.safe > 0 && c.spin === 0 && frame % 8 < 3) ctx.globalAlpha = 0.45;
  if (c.wobble > 0 && frame % 6 < 3) { ctx.globalAlpha = 0.6; drawKart({ color: '#ff4081' }, x + 4, y, ang, s); drawKart({ color: '#00e5ff' }, x - 4, y, ang, s); ctx.globalAlpha = 1; }
  drawKart(c, x, y, ang, s);

  }

  if (c.magnet > 0 && frame % 20 < 14) emoji('🧲', x + 22, y - 30, 16);
  if (c.me && !c.finished) tri(x - 8, y - 46 * s, x + 8, y - 46 * s, x, y - 36 * s, '#ffd740');
}

function drawDeco(d) {

    else if (d.k === 2) { ellipse(x, y + 10 * s, 40 * s, 12 * s, 'rgba(0,0,0,.2)'); ctx.fillStyle = '#eceff1'; ctx.beginPath(); ctx.arc(x, y + 10 * s, 36 * s, Math.PI, 0); ctx.fill(); ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.arc(x, y + 10 * s, 18 * s, Math.PI, 0); ctx.fill(); ctx.fillStyle = '#ff5252'; ctx.fillRect(x - 2, y - 40 * s, 4, 16 * s); }
    else { ctx.fillStyle = '#b0bec5'; ctx.fillRect(x - 3, y - 24 * s, 6, 30 * s); ellipse(x, y - 28 * s, 22 * s, 10 * s, '#eceff1', -0.3); circle(x, y - 28 * s, 4 * s, d.r > 0.5 ? '#ff5252' : '#69f0ae'); }
  } else if (th === 'pizza') {

      tri(-34, -26, 34, -26, 0, 40, '#ffca28'); ctx.fillStyle = '#d84315'; ctx.fillRect(-36, -32, 72, 10);
      circle(-10, -10, 7, '#e53935'); circle(12, -8, 7, '#e53935'); circle(1, 14, 6, '#e53935'); circle(3, -14, 3, '#33691e');
      ctx.restore();
    } else if (d.k === 2) { circle(x, y, 22 * s, '#c62828'); circle(x - 6 * s, y - 6 * s, 5 * s, '#ef5350'); circle(x + 7 * s, y + 4 * s, 4 * s, '#b71c1c'); }
    else {   // a hungry alien waving
      const bob = Math.sin(frame * 0.08 + x) * 3;
      ellipse(x, y + bob, 18 * s, 20 * s, ['#7cb342', '#ab47bc', '#26c6da', '#ff7043'][Math.floor(d.r * 4)]);
      circle(x - 6 * s, y - 4 * s + bob, 5 * s, '#fff'); circle(x + 6 * s, y - 4 * s + bob, 5 * s, '#fff');
      circle(x - 5 * s, y - 3 * s + bob, 2.4 * s, '#000'); circle(x + 7 * s, y - 3 * s + bob, 2.4 * s, '#000');
      ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y + 6 * s + bob, 5 * s, 0.2, Math.PI - 0.2); ctx.stroke();
    }
  } else if (th === 'castle') {
    if (d.k === 0) {   // castle tower
      circle(x + 5, y + 8, 34 * s, 'rgba(0,0,0,.18)'); circle(x, y, 32 * s, '#9e9e9e'); circle(x, y, 24 * s, '#bdbdbd');
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.fillStyle = '#757575'; ctx.fillRect(x + Math.cos(a) * 28 * s - 5, y + Math.sin(a) * 28 * s - 5, 10, 10); }
      tri(x - 20 * s, y, x + 20 * s, y, x, y - 46 * s, '#c62828'); ctx.fillStyle = '#5d4037'; ctx.fillRect(x - 1, y - 66 * s, 2, 22 * s); tri(x, y - 66 * s, x + 16 * s, y - 60 * s, x, y - 54 * s, '#ffd740');
    } else if (d.k === 1) { circle(x + 4, y + 6, 26 * s, 'rgba(0,0,0,.15)'); circle(x, y, 26 * s, '#2e7d32'); circle(x - 7 * s, y - 7 * s, 12 * s, '#43a047'); }
    else if (d.k === 2) { ellipse(x, y, 46 * s, 26 * s, '#4fc3f7'); ellipse(x - 10 * s, y - 6 * s, 14 * s, 5 * s, '#b3e5fc'); }   // moat pond
    else { roundRect(x - 18 * s, y - 14 * s, 36 * s, 28 * s, 4, '#8d6e63'); ctx.fillStyle = '#ffd740'; ctx.fillRect(x - 18 * s, y - 2 * s, 36 * s, 4 * s); }   // treasure chest
  } else if (th === 'spooky') {
    if (d.k === 0 || d.k === 3) { roundRect(x - 14 * s, y - 30 * s, 28 * s, 36 * s, 12 * s, '#78909c'); ctx.fillStyle = '#546e7a'; ctx.fillRect(x - 18 * s, y + 4 * s, 36 * s, 6 * s); text('BOO', x, y - 8 * s, 10 * s, '#cfd8dc'); }
    else if (d.k === 1) {   // pumpkin
      ellipse(x, y, 22 * s, 17 * s, '#ff9800'); ctx.fillStyle = '#33691e'; ctx.fillRect(x - 2, y - 22 * s, 4, 8 * s);
      const glow = frame % 60 < 50 ? '#ffee58' : '#ffa000';
      tri(x - 11 * s, y - 2 * s, x - 5 * s, y - 2 * s, x - 8 * s, y - 9 * s, glow); tri(x + 11 * s, y - 2 * s, x + 5 * s, y - 2 * s, x + 8 * s, y - 9 * s, glow);
      ctx.fillStyle = glow; ctx.fillRect(x - 9 * s, y + 4 * s, 18 * s, 4 * s);
    } else {   // spooky tree with peeking eyes
      ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 7 * s; ctx.lineCap = 'round'; ctx.beginPath();
      ctx.moveTo(x, y + 20 * s); ctx.lineTo(x, y - 20 * s); ctx.lineTo(x - 18 * s, y - 38 * s); ctx.moveTo(x, y - 10 * s); ctx.lineTo(x + 20 * s, y - 30 * s); ctx.stroke();
      if ((frame + d.r * 300) % 300 < 260) { circle(x - 5, y, 3, '#ffeb3b'); circle(x + 5, y, 3, '#ffeb3b'); }
    }
  } else if (th === 'meadow') {
    if (d.k === 0) { for (let k = 0; k < 5; k++) { const a = k * 1.26; circle(x + Math.cos(a) * 9 * s, y + Math.sin(a) * 9 * s, 7 * s, ['#ff80ab', '#ffd740', '#b388ff', '#ff8a65'][Math.floor(d.r * 4)]); } circle(x, y, 6 * s, '#fff59d'); }
    else if (d.k === 1) { ctx.fillStyle = '#fff3e0'; ctx.fillRect(x - 6 * s, y - 4 * s, 12 * s, 18 * s); ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(x, y - 2 * s, 20 * s, Math.PI, 0); ctx.fill(); circle(x - 8 * s, y - 10 * s, 3.5 * s, '#fff'); circle(x + 7 * s, y - 13 * s, 3 * s, '#fff'); }
    else if (d.k === 2) { circle(x + 4, y + 6, 24 * s, 'rgba(0,0,0,.12)'); circle(x, y, 24 * s, '#43a047'); circle(x - 10 * s, y - 4 * s, 15 * s, '#66bb6a'); circle(x + 9 * s, y + 6 * s, 3 * s, '#e53935'); circle(x - 4 * s, y + 10 * s, 3 * s, '#e53935'); }
    else {   // a little monster pal bouncing

    const cols = ['#00e5ff', '#ff4081', '#b2ff59', '#ffd740'];
    if (d.k <= 1) {   // floating neon cube
      const bob = Math.sin(frame * 0.05 + d.r * 10) * 6, sz = 26 * s, jit = (frame + d.r * 100) % 90 < 4 ? 6 : 0;
      ctx.strokeStyle = cols[Math.floor(d.r * 4)]; ctx.lineWidth = 3;
      ctx.strokeRect(x - sz / 2 + jit, y - sz / 2 + bob, sz, sz); ctx.strokeRect(x - sz / 2 + 8 + jit, y - sz / 2 - 8 + bob, sz, sz);
      ctx.fillStyle = cols[Math.floor(d.r * 4)] + '33'; ctx.fillRect(x - sz / 2 + jit, y - sz / 2 + bob, sz, sz);
    } else if (d.k === 2) { for (let k = 0; k < 6; k++) { ctx.fillStyle = cols[(k + Math.floor(frame / 20)) % 4]; ctx.fillRect(x + ((k * 37) % 40) - 20, y + ((k * 23) % 40) - 20, 8, 8); } }
    else { star(x, y, 9 * s * (0.8 + 0.2 * Math.sin(frame * 0.1 + d.r * 9)), '#fff59d'); }
  }
}

function drawGround() {
  const t = track, x0 = cam.x - W / ZOOM / 2 - 50, y0 = cam.y - H / ZOOM / 2 - 100, w = W / ZOOM + 100, h = H / ZOOM + 200;
  ctx.fillStyle = t.ground; ctx.fillRect(x0, y0, w, h);
  if (t.theme === 'glitch') {
    ctx.strokeStyle = 'rgba(124,77,255,.35)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = Math.floor(x0 / 120) * 120; x < x0 + w; x += 120) { ctx.moveTo(x, y0); ctx.lineTo(x, y0 + h); }
    for (let y = Math.floor(y0 / 120) * 120; y < y0 + h; y += 120) { ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); }
    ctx.stroke();
  } else {
    ctx.fillStyle = t.ground2;
    for (let x = Math.floor(x0 / 400) * 400; x < x0 + w; x += 400) ctx.fillRect(x, y0, 200, h);
  }
}

function drawRoad() {
  const t = track;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (t.neon) { tracePath(t); ctx.strokeStyle = t.neon + '55'; ctx.lineWidth = ROAD + 60; ctx.stroke(); }
  tracePath(t); ctx.strokeStyle = t.curb[0]; ctx.lineWidth = ROAD + 26; ctx.stroke();
  tracePath(t); ctx.strokeStyle = t.curb[1]; ctx.lineWidth = ROAD + 26; ctx.setLineDash([34, 34]); ctx.stroke(); ctx.setLineDash([]);
  tracePath(t); ctx.strokeStyle = t.road; ctx.lineWidth = ROAD; ctx.stroke();
  // hills: lighter road the higher it goes
  for (const [a, b, hgt] of t.hills) {
    const i0 = Math.floor(a * t.N), i1 = Math.ceil(b * t.N);
    for (let i = i0; i < i1; i += 4) {
      const e = t.elev[i % t.N] / hgt;
      tracePath(t, 1, 0, 0, i, i + 5); ctx.strokeStyle = `rgba(255,255,255,${0.22 * e})`; ctx.lineWidth = ROAD; ctx.lineCap = 'butt'; ctx.stroke();
    }
    ctx.lineCap = 'round';
  }
  tracePath(t); ctx.strokeStyle = t.line; ctx.globalAlpha = 0.6; ctx.lineWidth = 4; ctx.setLineDash([40, 40]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  // start/finish line
  const [sx, sy, sa] = pointAt(0);
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(sa);
  for (let i = 0; i < 18; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? '#000' : '#fff'; ctx.fillRect(j * 12 - 12, -ROAD / 2 + i * (ROAD / 18), 12, ROAD / 18 + 0.5); }
  ctx.restore();
  // boost pads
  for (const b of t.boostIdx) {
    const [bx, by, ba] = pointAt(b);
    ctx.save(); ctx.translate(bx, by); ctx.rotate(ba);
    roundRect(-40, -34, 80, 68, 10, `rgba(255,214,0,${0.6 + 0.3 * Math.sin(frame * 0.2)})`);
    ctx.strokeStyle = '#ff6d00'; ctx.lineWidth = 7;
    for (const o of [-20, 4]) { ctx.beginPath(); ctx.moveTo(o, -20); ctx.lineTo(o + 16, 0); ctx.lineTo(o, 20); ctx.stroke(); }
    ctx.restore();
  }
  // jump ramps
  for (const r of t.rampIdx) {
    const [rx, ry, ra] = pointAt(r - 3);
    ctx.save(); ctx.translate(rx, ry); ctx.rotate(ra);
    roundRect(-30, -ROAD / 2, 36, ROAD, 6, '#ff7043');
    for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#fff' : '#ffd740'; ctx.fillRect(-30 + 6, -ROAD / 2 + k * ROAD / 6 + 6, 24, ROAD / 6 - 12); }
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(6, -ROAD / 2, 8, ROAD);
    ctx.restore();
  }
}

function drawBox(b) {
  const bob = Math.sin(frame * 0.08 + b.x) * 4, sz = 30;
  ctx.save(); ctx.translate(b.x, b.y - 10 + bob); ctx.rotate(Math.sin(frame * 0.03 + b.y) * 0.3);
  ellipse(2, 26 - bob, 16, 6, 'rgba(0,0,0,.25)');
  const hue = (frame * 4 + b.x) % 360;
  ctx.fillStyle = `hsl(${hue},90%,60%)`; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-sz / 2, -sz / 2, sz, sz, 6) : ctx.rect(-sz / 2, -sz / 2, sz, sz); ctx.fill();
  ctx.strokeStyle = `hsl(${(hue + 120) % 360},90%,80%)`; ctx.lineWidth = 3; ctx.stroke();
  text('?', 0, 9, 24, '#fff');
  ctx.restore();
}

function drawWorld() {
  const t = track;
  ctx.save();
  ctx.translate(W / 2, H / 2 + 40); ctx.scale(ZOOM, ZOOM); ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  const vis = (x, y, m = 120) => Math.abs(x - cam.x) < W / ZOOM / 2 + m && Math.abs(y - cam.y) < H / ZOOM / 2 + m + 60;
  drawGround();
  for (const d of t.decos) if (vis(d.x, d.y)) drawDeco(d);
  drawRoad();
  for (const co of coins) if (co.t === 0 && vis(co.x, co.y)) {
    const w = Math.abs(Math.cos(frame * 0.08 + co.x)) * 11 + 2;
    ellipse(co.x, co.y, w, 12, '#ffb300'); ellipse(co.x, co.y, Math.max(1, w - 4), 8, '#ffe082');
  }
  for (const bx of boxes) if (bx.t === 0 && vis(bx.x, bx.y)) drawBox(bx);
  for (const bn of bananas) if (vis(bn.x, bn.y)) {
    ctx.save(); ctx.translate(bn.x, bn.y);
    ellipse(2, 5, 16, 6, 'rgba(0,0,0,.2)');
    ctx.strokeStyle = '#fdd835'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, -10, 14, 0.5, 2.6); ctx.stroke();
    ctx.strokeStyle = '#fbc02d'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-3, 2); ctx.lineTo(-14, 10); ctx.moveTo(3, 2); ctx.lineTo(14, 10); ctx.stroke();
    circle(0, 3, 4, '#8d6e63');
    ctx.restore();
  }
  for (const p of particles) if (p.world) { ctx.globalAlpha = Math.max(0, p.life / p.max); circle(p.x, p.y, p.size, p.color); }
  ctx.globalAlpha = 1;
  const order = racers.slice().sort((a, b) => a.y - b.y);
  for (const c of order) if (vis(c.x, c.y)) drawRacer(c);
  for (const rk of rockets) {
    ctx.save(); ctx.translate(rk.x, rk.y - 14); ctx.rotate(rk.ang);
    tri(-14, -6, -26 - Math.random() * 10, 0, -14, 6, '#ffab40');
    roundRect(-16, -7, 30, 14, 7, '#eceff1'); tri(12, -7, 24, 0, 12, 7, '#ff5252'); tri(-16, -7, -10, -13, -8, -7, '#ff5252'); tri(-16, 7, -10, 13, -8, 7, '#ff5252');
    circle(2, 0, 3.5, '#40c4ff');
    ctx.restore();
  }
  ctx.restore();
}

function drawMinimap() {
  const t = track, bw = 170, bh = 120, x0 = W - bw - 14, y0 = 62;
  const s = Math.min((bw - 20) / (t.maxX - t.minX - 1000), (bh - 20) / (t.maxY - t.minY - 1000));
  const ox = x0 + bw / 2 - (t.minX + t.maxX) / 2 * s, oy = y0 + bh / 2 - (t.minY + t.maxY) / 2 * s;
  roundRect(x0, y0, bw, bh, 12, 'rgba(0,0,0,.45)');
  tracePath(t, s, ox, oy); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.stroke();
  const [fx, fy] = t.path[0]; ctx.fillStyle = '#ff5252'; ctx.fillRect(ox + fx * s - 2, oy + fy * s - 5, 4, 10);
  for (const c of racers.slice().reverse()) { if (c.me) continue; circle(ox + c.x * s, oy + c.y * s, 4.5, c.color); }
  circle(ox + player.x * s, oy + player.y * s, 7, '#fff'); circle(ox + player.x * s, oy + player.y * s, 5, player.color);
}

function drawHUD() {
  const solo = mode === 'trial';
  // place, lap, time
  roundRect(10, 10, 250, 104, 14, 'rgba(0,0,0,.45)');
  const lap = Math.min(LAPS, Math.max(1, Math.floor(player.prog / track.N) + 1));
  text(`Lap ${lap}/${LAPS}`, 24, 44, 30, lap === LAPS ? '#ffd740' : '#fff', 'left');
  text(fmtTime(raceTime), 24, 76, 22, '#ffe082', 'left');
  // coins
  circle(36, 96, 10, '#ffb300'); circle(36, 96, 6, '#ffe082');
  text(`x ${player.coins}`, 52, 104, 20, player.coins >= 10 ? '#ffd740' : '#fff', 'left');
  if (!solo) {
    const place = player.finished ? finishOrder.indexOf(player) + 1 : player.place;
    const pc = ['', '#ffd740', '#e0e0e0', '#ffab40'][place] || '#ffffff';
    text(ORD[place], 248, 96, 64, pc, 'right');
  }
  // item slot
  const ix = W / 2 - 46, iy = 10;
  roundRect(ix - 4, iy - 4, 100, 100, 20, 'rgba(255,255,255,.75)');
  roundRect(ix, iy, 92, 92, 16, 'rgba(20,16,42,.8)');
  if (player.roulette > 0) emoji(ITEMS[ITEM_KEYS[Math.floor(frame / 4) % ITEM_KEYS.length]].icon, ix + 46, iy + 48, 52);
  else if (player.item) { emoji(ITEMS[player.item].icon, ix + 46, iy + 46 + Math.sin(frame * 0.15) * 2, 56); text(ITEMS[player.item].name, ix + 46, iy + 120, 18, '#fff'); text('press ITEM / SPACE', ix + 46, iy + 140, 14, '#b2ff59'); }
  else text(solo ? '⏱' : '?', ix + 46, iy + 60, 40, 'rgba(255,255,255,.3)');
  // racer list
  if (!solo) {
    const st = standings();
    roundRect(10, 124, 150, st.length * 32 + 10, 12, 'rgba(0,0,0,.35)');
    st.forEach((r, i) => {
      const y = 146 + i * 32;
      if (r.me) roundRect(14, y - 15, 142, 30, 10, 'rgba(255,215,64,.45)');
      text(String(i + 1), 30, y + 7, 18, '#fff');
      drawHead(r.ch, 58, y, 0.85);
      text(r.me ? 'YOU' : RACERS[r.ch].name, 76, y + 7, 15, r.me ? '#ffd740' : '#fff', 'left');
    });
  }
  drawMinimap();
  // drift meter
  if (player.drift) {
    const f = Math.min(1, player.driftT / 100);
    roundRect(W / 2 - 100, H - 46, 200, 24, 10, 'rgba(0,0,0,.5)');
    roundRect(W / 2 - 96, H - 42, 192 * f, 16, 8, player.driftT > 100 ? '#ff9100' : player.driftT > 45 ? '#40c4ff' : '#b0bec5');
    text('DRIFT!', W / 2, H - 52, 20, player.driftT > 100 ? '#ff9100' : '#40c4ff');
  }
  if (player.boost > 0) text('ZOOM!', W / 2, H - 70, 30, '#ffab40');
  if (glitchFx > 0) for (let i = 0; i < 6; i++) { ctx.fillStyle = ['rgba(255,64,129,.25)', 'rgba(0,229,255,.25)'][i % 2]; ctx.fillRect(0, Math.random() * H, W, 6 + Math.random() * 18); }
  // countdown + banners
  if (countdown > 0) {
    const n = Math.ceil(countdown / 60) - 1;
    if (n > 0) text(String(n), W / 2, 270, 150, ['', '#69f0ae', '#ffd740', '#ff5252'][n]);
    else text('GET READY!', W / 2, 260, 64, '#fff');
    text(track.name, W / 2, 330, 32, '#fff');

let last = performance.now(), acc = 0;
function loop(now) {
