<script>TOUCHPAD = { dpad: true, north: ['=', 'ZOOM +'], south: ['-', 'ZOOM −'], start: null };</script>

  if (nav.getGamepads !== filtered) {

  }

<script src="touchpad.js?v=2"></script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #10172a; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
  }
  canvas {
    width: min(100vw, calc(100vh * 960 / 520));
    height: auto; display: block; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: crosshair;
  }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 32, WORLD_COLS = 120, ROWS = 30, GROUND_Y = ROWS * T, PAL_Y = 416;
const ZOOMS = [1, 0.75, 0.5, 0.35];

// ---------- Sound ----------
let actx = null;
function startAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function note(freq, start, dur, wave = 'square', vol = 0.08, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  place: () => note(500 + Math.random() * 200, 0, 0.06, 'triangle', 0.12),
  erase: () => note(300, 0, 0.08, 'sawtooth', 0.05, 120),
  pick:  () => note(800, 0, 0.05, 'square', 0.05),
  stamp: () => [523, 659, 784].forEach((f, i) => note(f, i * 0.07, 0.15, 'square', 0.07)),
  bark:  () => { note(400, 0, 0.07, 'sawtooth', 0.1, 250); note(380, 0.1, 0.07, 'sawtooth', 0.1, 230); },
  hi:    () => { note(700, 0, 0.08, 'sine', 0.1); note(900, 0.09, 0.1, 'sine', 0.1); },
};

// ---------- Blocks ----------
// Walls go on the BACK layer. Everything else goes on the FRONT layer, in front of walls.
const ITEMS = [
  { id: 'brick', name: 'Brick Wall', layer: 'back' },
  { id: 'wood', name: 'Wood Wall', layer: 'back' },
  { id: 'stone', name: 'Stone Wall', layer: 'back' },
  { id: 'white', name: 'White Wall', layer: 'back' },
  { id: 'blue', name: 'Blue Wall', layer: 'back' },
  { id: 'gold', name: 'GOLD Wall', layer: 'back' },
  { id: 'window', name: 'Window', layer: 'front' },
  { id: 'door', name: 'Door', layer: 'front' },
  { id: 'roofL', name: 'Roof (left)', layer: 'front' },
  { id: 'roofR', name: 'Roof (right)', layer: 'front' },
  { id: 'roofT', name: 'Flat Roof', layer: 'front' },
  { id: 'floor', name: 'Floor', layer: 'front' },
  { id: 'stairs', name: 'Stairs', layer: 'front' },
  { id: 'column', name: 'Fancy Column', layer: 'front', row: 2 },
  { id: 'chimney', name: 'Chimney', layer: 'front', row: 2 },
  { id: 'flag', name: 'Flag', layer: 'front', row: 2 },
  { id: 'fence', name: 'Fence', layer: 'front', row: 2 },
  { id: 'lamp', name: 'Lamp', layer: 'front', row: 2 },
  { id: 'bed', name: 'Bed', layer: 'front', row: 2 },
  { id: 'sofa', name: 'Sofa', layer: 'front', row: 2 },
  { id: 'tv', name: 'TV', layer: 'front', row: 2 },
  { id: 'plant', name: 'Plant', layer: 'front', row: 2 },
  { id: 'flowers', name: 'Flowers', layer: 'front', row: 2 },
  { id: 'tree', name: 'Tree', layer: 'front', row: 2 },
  { id: 'pool', name: 'Pool', layer: 'front', row: 2 },
  { id: 'person', name: 'Person', layer: 'entity', row: 2 },
  { id: 'dog', name: 'Dog', layer: 'entity', row: 2 },
];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const TOOLS = [
  { id: 'eraser', name: 'Eraser (or right-click)', row: 1 },
  { id: 'undo', name: 'Undo', row: 1 },
  { id: 'night', name: 'Day / Night', row: 1 },
  { id: 'clear', name: 'Clear everything', row: 1 },
  { id: 'zoomIn', name: 'Zoom in', row: 1 },
  { id: 'zoomOut', name: 'Zoom out (see more!)', row: 1 },
  { id: 'house', name: 'Quick House!', row: 2 },
  { id: 'mansion', name: 'MANSION!', row: 2 },
];

// Ready-made buildings: back layer letters / front layer letters
const BACK_KEY = { b: 'brick', o: 'wood', s: 'stone', h: 'white', u: 'blue', g: 'gold' };
const FRONT_KEY = { w: 'window', d: 'door', L: 'roofL', R: 'roofR', T: 'roofT', f: 'floor', S: 'stairs', c: 'column',
                    C: 'chimney', F: 'flag', n: 'fence', l: 'lamp', B: 'bed', s: 'sofa', v: 'tv', p: 'plant', r: 'flowers', t: 'tree', P: 'pool' };
const STAMPS = {
  house: {
    back:  ["      ", "  bb  ", " bbbb ", "bbbbbb", "bbbbbb"],
    front: ["  LR  ", " L  RC", "L    R", " w  w ", " l d p"],
  },
  mansion: {
    back:  ["              ", "              ", "      hh      ", "  hhhhhhhhhh  ", "hhhhhhhhhhhhhh", "hhhhhhhhhhhhhh", "hhhhhhhhhhhhhh", "hhhhhhhhhhhhhh", "hhhhhhhhhhhhhh"],
    front: ["      F       ", "     LTTR     ", "     cwwc     ", "LTTTTTTTTTTTTR", " w B w  w l w ", " v  s   S  p ", "ffffffffSfffff", " w c w  w c w ", "rp l  dd   pr"],
  },
};

// ---------- World ----------
let zoomI = 0, zoom = 1, camX = 0, camY = 0, camTX = 0, camTY = 0;
let back, front, entities, night = false, selected = 'brick', tool = null;
let mouse = { x: 0, y: 0, down: false, button: 0, inBuild: false }, frame = 0, history = [], clearArmed = 0, tip = '', tipT = 0;
let changedThisStroke = false;

function emptyGrid() { return Array.from({ length: ROWS }, () => Array(WORLD_COLS).fill(null)); }
function load() {
  back = emptyGrid(); front = emptyGrid(); entities = [];
  try {
    const s = JSON.parse(localStorage.getItem('buildIt') || 'null');
    if (s) {
      night = !!s.night;
      const dy = ROWS - s.back.length;           // older saves were smaller: put them on the ground of the big world
      for (let y = 0; y < s.back.length; y++) for (let x = 0; x < Math.min(WORLD_COLS, s.back[y].length); x++) {
        back[y + dy][x] = s.back[y][x]; front[y + dy][x] = s.front[y][x];
      }
      entities = (s.entities || []).map(e => ({ ...e, y: e.y + dy * T }));
    }
  } catch (_) {}
}
function save() {
  try { localStorage.setItem('buildIt', JSON.stringify({ back, front, entities, night })); } catch (_) {}
}
function snapshot() {
  history.push(JSON.stringify({ back, front, entities }));
  if (history.length > 60) history.shift();
}
function undo() {
  const s = history.pop();
  if (!s) return;
  ({ back, front, entities } = JSON.parse(s));
  save(); sfx.erase();
}
load();

const viewW = () => W / zoom, viewH = () => PAL_Y / zoom;
function clampCam(x, y) {
  return [Math.max(0, Math.min(WORLD_COLS * T - viewW(), x)), Math.max(Math.min(0, GROUND_Y + 2 * T - viewH()), Math.min(GROUND_Y + 2 * T - viewH(), y))];
}
function setZoom(i) {
  const cx = camTX + viewW() / 2, by = camTY + viewH();      // keep the same middle / bottom in view
  zoomI = Math.max(0, Math.min(ZOOMS.length - 1, i)); zoom = ZOOMS[zoomI];
  [camTX, camTY] = clampCam(cx - viewW() / 2, by - viewH());
  [camX, camY] = [camTX, camTY];
}
function cellAt(mx, my) {
  if (my < 0 || my >= PAL_Y) return null;
  const wy = my / zoom + camY;
  if (wy < 0 || wy >= GROUND_Y) return null;
  const cx = Math.floor((mx / zoom + camX) / T), cy = Math.floor(wy / T);
  if (cx < 0 || cx >= WORLD_COLS || cy < 0 || cy >= ROWS) return null;
  return [cx, cy];
}

function placeAt(cx, cy) {
  const it = ITEM[selected];
  if (it.layer === 'entity') return;
  const grid = it.layer === 'back' ? back : front;
  if (grid[cy][cx] === selected) return;
  if (!changedThisStroke) { snapshot(); changedThisStroke = true; }
  grid[cy][cx] = selected; sfx.place();
  sparkle(cx * T + 16, cy * T + 16);
}
function eraseAt(cx, cy, mx, my) {
  const before = entities.length;
  const wx = mx / zoom + camX, wy = my / zoom + camY;
  const hitEnt = entities.findIndex(e => Math.abs(e.x - wx) < 14 && wy > e.y - 30 && wy < e.y + 4);
  if (hitEnt >= 0) { if (!changedThisStroke) { snapshot(); changedThisStroke = true; } entities.splice(hitEnt, 1); sfx.erase(); return; }
  if (front[cy][cx] || back[cy][cx]) {
    if (!changedThisStroke) { snapshot(); changedThisStroke = true; }
    if (front[cy][cx]) front[cy][cx] = null; else back[cy][cx] = null;
    sfx.erase();
  }
}
function stampAt(name, cx, cy) {
  const s = STAMPS[name], h = s.back.length, w = s.back[0].length;
  const x0 = cx - Math.floor(w / 2), y0 = cy - h + 1;
  snapshot();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const gx = x0 + x, gy = y0 + y;
    if (gx < 0 || gx >= WORLD_COLS || gy < 0 || gy >= ROWS) continue;
    const b = BACK_KEY[s.back[y][x]], f = FRONT_KEY[s.front[y][x]];
    if (b) back[gy][gx] = b;
    if (f) front[gy][gx] = f;
  }
  sfx.stamp(); save();
  for (let i = 0; i < 25; i++) sparkle((x0 + Math.random() * w) * T, (y0 + Math.random() * h) * T);
}
function addEntity(kind, cx, cy) {
  if (entities.length >= 40) { showTip('That is a lot of friends! Erase some first.'); return; }
  snapshot();
  entities.push({ kind, x: cx * T + 16, y: (cy + 1) * T, dir: Math.random() < 0.5 ? -1 : 1, vy: 0,
                  color: ['#e53935', '#1e88e5', '#43a047', '#fdd835', '#8e24aa', '#ff6f00'][Math.floor(Math.random() * 6)],
                  hair: ['#3e2723', '#fdd835', '#d84315', '#212121'][Math.floor(Math.random() * 4)], t: Math.random() * 100, pause: 0 });
  kind === 'dog' ? sfx.bark() : sfx.hi();
  save();
}
function showTip(t) { tip = t; tipT = 150; }

// ---------- Little people and dogs walk around ----------
const STANDABLE = new Set(['floor', 'roofT', 'stairs', 'roofL', 'roofR', 'pool', 'fence']);
function supportAt(cx, cy) {   // can someone standing in cell (cx, cy) stand there?
  if (cy >= ROWS - 1 + 1) return true;
  const below = cy + 1;
  if (below >= ROWS) return true;                                  // the ground
  if (cx < 0 || cx >= WORLD_COLS) return false;
  if (STANDABLE.has(front[below][cx])) return true;
  return !!back[below][cx] && !back[cy][cx];                       // on top of a wall, from outside
}
function updateEntities() {
  for (const e of entities) {
    e.t++;
    const cx = Math.floor(e.x / T), cy = Math.floor((e.y - 1) / T);
    if (!supportAt(cx, cy)) { e.vy = Math.min(e.vy + 0.5, 8); e.y += e.vy; if (e.y > GROUND_Y) e.y = GROUND_Y; continue; }
    e.vy = 0; e.y = (cy + 1) * T;
    if (e.pause > 0) { e.pause--; continue; }
    if (Math.random() < 0.004) { e.pause = 60 + Math.random() * 120; if (e.kind === 'dog' && Math.random() < 0.3) sfx.bark(); }
    const speed = e.kind === 'dog' ? 1.1 : 0.6, nx = e.x + e.dir * speed, ncx = Math.floor((nx + e.dir * 8) / T);
    if (ncx < 0 || ncx >= WORLD_COLS || !supportAt(ncx, cy) || front[cy][ncx] === 'pool' || (front[cy][ncx] === 'door' && Math.random() < 0.01)) e.dir *= -1;
    else e.x = nx;
  }
}

// ---------- Input ----------
let parts = [];
function sparkle(x, y) {
  for (let i = 0; i < 4; i++) parts.push({ x, y, vx: (Math.random() - .5) * 3, vy: (Math.random() - .5) * 3, life: 20, color: ['#fff', '#ffd740', '#69f0ae'][i % 3] });
}
function canvasPos(e) {
  const r = C.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
function paletteHit(mx, my) {
  for (const [i, it] of paletteLayout().entries()) if (mx > it.x && mx < it.x + 40 && my > it.y && my < it.y + 40) return it;
  return null;
}
function paletteLayout() {
  const out = [];
  let x1 = 10, x2 = 10;
  for (const it of ITEMS) {
    if (it.row === 2) { out.push({ ...it, kind: 'item', x: x2, y: PAL_Y + 54 }); x2 += 44; }
    else { out.push({ ...it, kind: 'item', x: x1, y: PAL_Y + 8 }); x1 += 44; }
  }
  x1 += 20; x2 += 20;
  for (const t of TOOLS) {
    if (t.row === 2) { out.push({ ...t, kind: 'tool', x: x2, y: PAL_Y + 54 }); x2 += 44; }
    else { out.push({ ...t, kind: 'tool', x: x1, y: PAL_Y + 8 }); x1 += 44; }
  }
  return out;
}
function scroll(dx, dy = 0) { [camTX, camTY] = clampCam(camTX + dx * 8 * T / zoom, camTY + dy * 5 * T); }

C.addEventListener('contextmenu', e => e.preventDefault());
C.addEventListener('mousedown', e => {
  startAudio();
  const [mx, my] = canvasPos(e);
  mouse.down = true; mouse.button = e.button; changedThisStroke = false;
  if (my >= PAL_Y) {
    const hit = paletteHit(mx, my);
    if (!hit) return;
    sfx.pick();
    if (hit.kind === 'item') { selected = hit.id; tool = null; }
    else if (hit.id === 'eraser') tool = 'eraser';
    else if (hit.id === 'undo') undo();
    else if (hit.id === 'night') { night = !night; save(); }
    else if (hit.id === 'zoomIn') setZoom(zoomI - 1);
    else if (hit.id === 'zoomOut') setZoom(zoomI + 1);
    else if (hit.id === 'clear') {
      if (clearArmed > 0) { snapshot(); back = emptyGrid(); front = emptyGrid(); entities = []; save(); clearArmed = 0; showTip('All clear! (Undo brings it back)'); }
      else { clearArmed = 180; showTip('Click the trash can AGAIN to clear everything!'); }
    }
    else if (hit.id === 'house' || hit.id === 'mansion') { tool = hit.id; showTip('Click where you want it! The bottom goes where you click.'); }
    mouse.down = false;
    return;
  }
  for (const b of scrollButtons()) if (mx > b.x && mx < b.x + b.w && my > b.y && my < b.y + b.h) { scroll(b.dx, b.dy); mouse.down = false; return; }
  if (inMinimap(mx, my)) { jumpMinimap(mx, my); mouse.down = false; return; }
  const cell = cellAt(mx, my);
  if (!cell) return;
  if (e.button === 2 || tool === 'eraser') eraseAt(cell[0], cell[1], mx, my);
  else if (tool === 'house' || tool === 'mansion') { stampAt(tool, cell[0], cell[1]); tool = null; mouse.down = false; }
  else if (ITEM[selected].layer === 'entity') { addEntity(selected, cell[0], cell[1]); mouse.down = false; }
  else placeAt(cell[0], cell[1]);
});
C.addEventListener('mousemove', e => {
  const [mx, my] = canvasPos(e);
  mouse.x = mx; mouse.y = my;
  if (!mouse.down) return;
  const cell = cellAt(mx, my);
  if (!cell) return;
  if (mouse.button === 2 || tool === 'eraser') eraseAt(cell[0], cell[1], mx, my);
  else if (ITEM[selected].layer !== 'entity' && !tool) placeAt(cell[0], cell[1]);
});
C.addEventListener('wheel', e => {
  e.preventDefault();
  [camTX, camTY] = clampCam(camTX + (e.shiftKey ? e.deltaY : e.deltaX) / zoom, camTY + (e.shiftKey ? 0 : e.deltaY) / zoom);
}, { passive: false });
function scrollButtons() {
  return [{ x: 4, y: 168, w: 30, h: 80, dx: -1, dy: 0, label: '◀' }, { x: W - 34, y: 168, w: 30, h: 80, dx: 1, dy: 0, label: '▶' },
          { x: W / 2 - 40, y: 86, w: 80, h: 28, dx: 0, dy: -1, label: '▲' }, { x: W / 2 - 40, y: PAL_Y - 34, w: 80, h: 28, dx: 0, dy: 1, label: '▼' }];
}
const MM = { x: W - 160, y: 8, s: 1.2 };
const inMinimap = (mx, my) => mx > MM.x && mx < MM.x + WORLD_COLS * MM.s && my > MM.y && my < MM.y + ROWS * MM.s + 4;
function jumpMinimap(mx, my) {
  [camTX, camTY] = clampCam((mx - MM.x) / MM.s * T - viewW() / 2, (my - MM.y) / MM.s * T - viewH() / 2);
}
addEventListener('mouseup', () => { if (mouse.down && changedThisStroke) save(); mouse.down = false; });
addEventListener('keydown', e => {
  startAudio();
  if (e.key === 'ArrowLeft') { scroll(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { scroll(1); e.preventDefault(); }
  if (e.key === 'ArrowUp') { scroll(0, -1); e.preventDefault(); }
  if (e.key === 'ArrowDown') { scroll(0, 1); e.preventDefault(); }
  if (e.key === '+' || e.key === '=') setZoom(zoomI - 1);
  if (e.key === '-' || e.key === '_') setZoom(zoomI + 1);
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { undo(); e.preventDefault(); }
  if (e.key === 'n' || e.key === 'N') { night = !night; save(); }
  if (e.key === 'Escape') tool = null;
});

// ---------- Drawing ----------
function roundRect(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

// Draws one block in a 32x32 box at (x, y)
function drawItem(id, x, y) {
  switch (id) {
    case 'brick':
      ctx.fillStyle = '#c0504d'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#e6d5c3';
      ctx.fillRect(x, y + 10, T, 2); ctx.fillRect(x, y + 21, T, 2); ctx.fillRect(x, y + 31, T, 1);
      ctx.fillRect(x + 15, y, 2, 10); ctx.fillRect(x + 6, y + 12, 2, 9); ctx.fillRect(x + 24, y + 12, 2, 9); ctx.fillRect(x + 15, y + 23, 2, 8); break;
    case 'wood':
      ctx.fillStyle = '#b07a4a'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#8a5a30';
      for (let i = 0; i < 4; i++) ctx.fillRect(x, y + i * 8 + 7, T, 1.5);
      ctx.fillRect(x + 20, y, 1.5, 8); ctx.fillRect(x + 8, y + 8, 1.5, 8); ctx.fillRect(x + 24, y + 16, 1.5, 8); break;
    case 'stone':
      ctx.fillStyle = '#9e9e9e'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#757575';
      ctx.fillRect(x, y + 15, T, 2); ctx.fillRect(x + 12, y, 2, 15); ctx.fillRect(x + 22, y + 17, 2, 15);
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(x + 2, y + 2, 8, 3); break;
    case 'white':
      ctx.fillStyle = '#f5f0e6'; ctx.fillRect(x, y, T, T); ctx.fillStyle = 'rgba(0,0,0,.05)'; ctx.fillRect(x, y + 30, T, 2); break;
    case 'blue':
      ctx.fillStyle = '#64b5f6'; ctx.fillRect(x, y, T, T); ctx.fillStyle = 'rgba(255,255,255,.25)'; for (let i = 0; i < 4; i++) ctx.fillRect(x + i * 8 + 3, y, 2, T); break;
    case 'gold':
      ctx.fillStyle = '#ffca28'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#ffe082'; ctx.fillRect(x + 3, y + 3, 10, 4);
      ctx.fillStyle = '#ffa000'; ctx.fillRect(x, y + 30, T, 2); ctx.fillRect(x + 30, y, 2, T);
      if ((frame + x) % 120 < 10) circle(x + 22, y + 10, 3, '#fff'); break;
    case 'window':
      roundRect(x + 4, y + 4, 24, 24, 3, '#6d4c41');
      ctx.fillStyle = night ? '#ffe082' : '#b3e5fc'; ctx.fillRect(x + 7, y + 7, 18, 18);
      ctx.fillStyle = '#6d4c41'; ctx.fillRect(x + 15, y + 7, 2, 18); ctx.fillRect(x + 7, y + 15, 18, 2); break;
    case 'door':
      roundRect(x + 6, y + 2, 20, 30, [8, 8, 0, 0], '#8d5a2b');
