<canvas id="game" width="960" height="520"></canvas>
<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, COLS = 20, ROWS = 12, FW = COLS * T, FY = 40;   // field is 800 x 480, starting at y = 40
let frame = 0;
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);

// ---------- Sound ----------
function bankCoin(n = 1) { try { const c = JSON.parse(localStorage.getItem('gfCoins') || '{}'); c.castle = (c.castle || 0) + n; localStorage.setItem('gfCoins', JSON.stringify(c)); } catch (_) {} }   // coins for the Bundle Room in the Game Factory book
function bundleHas(j) { try { return (JSON.parse(localStorage.getItem('gfBundles') || '{}').opened || []).includes('castle-' + j); } catch (_) { return false; } }   // unlocked in the Bundle Room
// Tower hats (Bundle Room) - every tower you build wears the hat you pick on the title screen
const LOOKS = [
  { id: 'normal', name: 'No Hat', b: -1 },
  { id: 'party', name: 'Party Hats', b: 0 }, { id: 'tophat', name: 'Top Hats', b: 0 },
  { id: 'crown', name: 'Crowns', b: 1 }, { id: 'cowboy', name: 'Cowboy Hats', b: 1 },
];
const BUNDLE_NAMES = ['Tower Hat Pack', 'Royal Hat Pack', 'MEGA Robo Tower Pack'];
const lookOpen = L => L.b < 0 || bundleHas(L.b);
const roboOpen = () => bundleHas(2);   // the Robo Laser Tower
function loadLook() {
  try {
    const id = (JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}).castle;
    const L = LOOKS.find(o => o.id === id);
    return L && lookOpen(L) ? L.id : 'normal';
  } catch (_) { return 'normal'; }
}
function saveLook() {
  try { const o = JSON.parse(localStorage.getItem('gfLooks') || '{}') || {}; o.castle = myLook; localStorage.setItem('gfLooks', JSON.stringify(o)); } catch (_) {}
}
let myLook = loadLook(), lookView = Math.max(0, LOOKS.findIndex(o => o.id === myLook));
function cycleLook(d) {   // browse hats; only unlocked ones get picked
  lookView = (lookView + d + LOOKS.length) % LOOKS.length;
  if (lookOpen(LOOKS[lookView])) { myLook = LOOKS[lookView].id; saveLook(); }
}
let actx = null, musicOn = true, nextNote = 0, mStep = 0;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } return actx; }
function note(f, start, dur, wave = 'square', vol = 0.06, slide = null) {
  if (!actx) return;
  const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol; src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}
let sndBudget = 0;   // so 20 towers firing at once don't get too loud
const sfx = {
  click: () => note(700, 0, 0.05, 'square', 0.04),
  build: () => { note(300, 0, 0.1, 'square', 0.08); note(450, 0.1, 0.15, 'square', 0.08); },
  arrow: () => { if (sndBudget-- > 0) noise(0.06, 0.15, 3000); },
  boom: () => { if (sndBudget-- > 0) { noise(0.3, 0.5, 300); } },
  ice: () => { if (sndBudget-- > 0) note(1800, 0, 0.1, 'sine', 0.03, 2600); },
  zap: () => { if (sndBudget-- > 0) note(200, 0, 0.12, 'sawtooth', 0.04, 1200); },
  laser: () => { if (sndBudget-- > 0) note(1400, 0, 0.1, 'square', 0.03, 500); },
  poof: () => { if (sndBudget-- > 0) note(500, 0, 0.1, 'triangle', 0.06, 900); },
  coin: () => note(1500, 0, 0.05, 'square', 0.025),
  ouch: () => { noise(0.2, 0.4, 200); note(200, 0, 0.3, 'sawtooth', 0.08, 80); },
  horn: () => { note(392, 0, 0.25, 'sawtooth', 0.07); note(523, 0.25, 0.4, 'sawtooth', 0.07); },
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.12, 0.25, 'square', 0.08)),
  lose: () => [523, 494, 466, 440].forEach((f, i) => note(f, i * 0.25, 0.35, 'triangle', 0.1)),
  upgrade: () => [660, 880, 1100, 1320].forEach((f, i) => note(f, i * 0.05, 0.1, 'square', 0.05)),
};
const TUNE = [62, 0, 65, 69, 0, 67, 65, 0, 64, 0, 62, 64, 65, 0, 0, 0, 69, 0, 72, 74, 0, 72, 70, 0, 69, 0, 67, 65, 64, 0, 0, 0];
function playMusic() {
  if (!actx || !musicOn || scene === 'title') return;
  if (nextNote < actx.currentTime) nextNote = actx.currentTime + 0.05;
  while (nextNote < actx.currentTime + 0.2) {
    const t = nextNote - actx.currentTime, m = TUNE[mStep % TUNE.length];
    if (m) note(440 * Math.pow(2, (m - 69) / 12), t, 0.22, 'triangle', 0.035);
    if (mStep % 8 === 0) note(440 * Math.pow(2, ([38, 41, 43, 36][(mStep / 8) % 4] - 69) / 12), t, 1.2, 'sine', 0.07);
    nextNote += 0.19; mStep++;
  }
}

// ---------- Maps ----------
const MAPS = [
  { name: 'Grassy Hills', grass: ['#7cc35a', '#74b952'], path: '#e0c08a', path2: '#d4b27a', deco: 'tree', hp: 1,
    pts: [[-1, 2], [5, 2], [5, 8], [11, 8], [11, 3], [16, 3], [16, 9], [18, 9]] },
  { name: 'Snowy Pass', grass: ['#eef4fa', '#e3ecf5'], path: '#b0bec5', path2: '#a3b2ba', deco: 'pine', hp: 1.35,
    pts: [[-1, 6], [3, 6], [3, 1], [8, 1], [8, 10], [13, 10], [13, 4], [16, 4], [16, 8], [18, 8]] },
  { name: 'Lava Land', grass: ['#5d4037', '#55392f'], path: '#3e2723', path2: '#33201b', deco: 'lava', hp: 1.75,
    pts: [[-1, 1], [16, 1], [16, 4], [2, 4], [2, 7], [16, 7], [16, 10], [18, 10]] },
];
const WAVES = 10;

// ---------- Towers ----------
const TOWERS = {
  archer:    { name: 'Archer', icon: '🏹', cost: 30, up: [25, 40], range: [125, 145, 165], dmg: [4, 7, 11], rate: [28, 24, 20], color: '#8d6e63', desc: 'Shoots arrows fast' },
  cannon:    { name: 'Cannon', icon: '💣', cost: 50, up: [40, 60], range: [110, 125, 140], dmg: [9, 15, 24], rate: [70, 62, 54], color: '#546e7a', desc: 'BOOM! Hits a group' },
  ice:       { name: 'Ice', icon: '❄️', cost: 40, up: [30, 45], range: [100, 115, 130], dmg: [1, 2, 3], rate: [45, 42, 38], color: '#4fc3f7', desc: 'Freezes monsters slow' },
  lightning: { name: 'Lightning', icon: '⚡', cost: 80, up: [60, 90], range: [130, 145, 160], dmg: [6, 9, 14], rate: [52, 46, 40], color: '#ab47bc', desc: 'Zaps 3+ monsters' },
  robo:      { name: 'Robo Laser', icon: '🤖', cost: 60, up: [45, 70], range: [140, 155, 170], dmg: [7, 11, 17], rate: [46, 41, 36], color: '#2979ff', desc: 'Robo zaps LASERS far away' },   // MEGA Robo Tower Pack
};
const MONSTERS = {
  slime: { hp: 14, speed: 0.9, reward: 4, size: 15 },
  bat:   { hp: 9, speed: 1.7, reward: 4, size: 13 },
  troll: { hp: 60, speed: 0.55, reward: 10, size: 20 },
  ghost: { hp: 26, speed: 1.15, reward: 6, size: 16 },
  boss:  { hp: 420, speed: 0.42, reward: 60, size: 30 },
};

// ---------- Save ----------
let SAVE = { stars: [0, 0, 0] };
try { const s = JSON.parse(localStorage.getItem('castleDefense') || 'null'); if (s) SAVE = s; } catch (_) {}
function save() { try { localStorage.setItem('castleDefense', JSON.stringify(SAVE)); } catch (_) {} }

// ---------- Game state ----------
let scene = 'title', mapI = 0, M = null, pathTiles, pathPx, pathLen, decos;
let gold = 0, hearts = 20, wave = 0, waveActive = false, spawnQueue = [], spawnT = 0;
let monsters = [], towers = [], shots = [], effects = [], particles = [], floaters = [];
let placing = null, selected = null, speed = 1, mouse = { x: 0, y: 0 }, msg = '', msgT = 0, resultStars = 0;

function startMap(i) {
  mapI = i; M = MAPS[i];
  pathTiles = new Set(); pathPx = [];
  const P = M.pts;
  for (let k = 0; k < P.length - 1; k++) {
    let [x, y] = P[k]; const [x2, y2] = P[k + 1];
    while (x !== x2 || y !== y2) { pathTiles.add(x + ',' + y); x += Math.sign(x2 - x); y += Math.sign(y2 - y); }
  }
  pathTiles.add(P[P.length - 1].join(','));
  for (const [x, y] of P) pathPx.push([x * T + T / 2, FY + y * T + T / 2]);
  pathLen = 0; for (let k = 1; k < pathPx.length; k++) pathLen += dist(...pathPx[k - 1], ...pathPx[k]);
  // castle sits on the last two columns
  const [cx, cy] = P[P.length - 1];
  for (let y = cy - 1; y <= cy + 1; y++) for (let x = 18; x <= 19; x++) pathTiles.add(x + ',' + y);
  decos = [];
  for (let k = 0; k < 26; k++) { const x = ri(0, COLS - 1), y = ri(0, ROWS - 1); if (!pathTiles.has(x + ',' + y)) decos.push({ x, y, s: 0.6 + Math.random() * 0.4 }); }
  gold = 120; hearts = 20; wave = 0; waveActive = false; spawnQueue = []; spawnT = 0;
  monsters = []; towers = []; shots = []; effects = []; particles = []; floaters = [];
  placing = null; selected = null; speed = 1;
  scene = 'play';
  say('Pick a tower on the right, then click the grass to build it!');
}
function say(t) { msg = t; msgT = 220; }
const tileFree = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !pathTiles.has(x + ',' + y) && !towers.some(t => t.x === x && t.y === y);

function makeWave(n) {
  const list = [];
  const count = 6 + n * 2;
  for (let i = 0; i < count; i++) {
    let type = 'slime';
    const r = Math.random();
    if (n >= 2 && r < 0.3) type = 'bat';
    if (n >= 4 && r > 0.82) type = 'troll';
    if (n >= 6 && r > 0.55 && r < 0.72) type = 'ghost';
    list.push(type);
  }
  if (n === 5) list.push('troll', 'troll');
  if (n === WAVES) list.push('boss');
  return list;
}
function startWave() {
  if (waveActive || wave >= WAVES) return;
  wave++; waveActive = true; spawnQueue = makeWave(wave); spawnT = 30;
  sfx.horn();
  say(wave === WAVES ? '👑 BOSS WAVE! King Blob is coming!' : `Wave ${wave}! Here they come!`);
}
function spawn(type) {
  const base = MONSTERS[type], hp = Math.round(base.hp * (1 + (wave - 1) * 0.2) * M.hp);
  monsters.push({ type, hp, max: hp, speed: base.speed, d: 0, x: pathPx[0][0], y: pathPx[0][1], slow: 0, slowAmt: 1, size: base.size, reward: base.reward, wob: Math.random() * 7 });
}
function posAt(d) {
  for (let k = 1; k < pathPx.length; k++) {
    const seg = dist(...pathPx[k - 1], ...pathPx[k]);
    if (d <= seg) { const f = d / seg; return [pathPx[k - 1][0] + (pathPx[k][0] - pathPx[k - 1][0]) * f, pathPx[k - 1][1] + (pathPx[k][1] - pathPx[k - 1][1]) * f]; }
    d -= seg;
  }
  return pathPx[pathPx.length - 1];
}

function hurt(m, dmg) {
  if (m.dead) return;
  m.hp -= dmg; m.flash = 6;
  if (m.hp <= 0) {
    m.dead = true; gold += m.reward; sfx.poof(); sfx.coin(); bankCoin();
    floaters.push({ x: m.x, y: m.y - 20, t: `+${m.reward}`, life: 45 });
    for (let i = 0; i < 10; i++) { const a = Math.random() * 7, s = Math.random() * 3 + 1; particles.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, c: pick(['#fff', '#ffd740', '#b2ff59']), star: Math.random() < 0.5 }); }
    if (m.type === 'boss') { for (let i = 0; i < 40; i++) { const a = Math.random() * 7, s = Math.random() * 6 + 1; particles.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 60, c: pick(['#ffd740', '#e040fb', '#fff']), star: true }); } }
  }
}
function towerStat(t, key) { return TOWERS[t.type][key][t.level - 1]; }
function target(t) {
  const r = towerStat(t, 'range'), cx = t.x * T + T / 2, cy = FY + t.y * T + T / 2;
  let best = null;
  for (const m of monsters) if (!m.dead && dist(cx, cy, m.x, m.y) <= r && (!best || m.d > best.d)) best = m;   // the one closest to the castle
  return best;
}
function fire(t) {
  const m = target(t); if (!m) return false;
  const cx = t.x * T + T / 2, cy = FY + t.y * T + T / 2, dmg = towerStat(t, 'dmg');
  t.aim = Math.atan2(m.y - cy, m.x - cx);
  if (t.type === 'archer') { shots.push({ kind: 'arrow', x: cx, y: cy - 10, m, dmg, speed: 9 }); sfx.arrow(); }
  if (t.type === 'ice') { shots.push({ kind: 'ice', x: cx, y: cy - 10, m, dmg, speed: 7, slow: [0.55, 0.45, 0.35][t.level - 1], slowT: [90, 120, 150][t.level - 1] }); sfx.ice(); }
  if (t.type === 'cannon') { shots.push({ kind: 'ball', sx: cx, sy: cy - 8, tx: m.x, ty: m.y, t: 0, dur: 30, dmg, splash: 48 + t.level * 6 }); sfx.boom(); }
  if (t.type === 'robo') {   // instant laser beam from Robo's eyes
    effects.push({ kind: 'laser', x1: cx + Math.cos(t.aim) * 4, y1: cy - 25, x2: m.x, y2: m.y, life: 10 });
    for (let i = 0; i < 5; i++) particles.push({ x: m.x, y: m.y, vx: Math.random() * 3 - 1.5, vy: Math.random() * 3 - 1.5, life: 16, c: pick(['#ff5252', '#40c4ff', '#fff']) });
    hurt(m, dmg); sfx.laser();
  }
  if (t.type === 'lightning') {
    const chain = [m], n = 2 + t.level;
    while (chain.length < n) {
      const last = chain[chain.length - 1];
      let next = null;
      for (const o of monsters) if (!o.dead && !chain.includes(o) && dist(last.x, last.y, o.x, o.y) < 90 && (!next || dist(last.x, last.y, o.x, o.y) < dist(last.x, last.y, next.x, next.y))) next = o;
      if (!next) break; chain.push(next);
    }
    const pts = [[cx, cy - 16], ...chain.map(c => [c.x, c.y])];
    effects.push({ kind: 'zap', pts, life: 10 });
    chain.forEach(c => hurt(c, dmg)); sfx.zap();
  }
  return true;
}

function updatePlay() {
  sndBudget = 3;
  if (msgT > 0) msgT--;
  // spawn
  if (waveActive && spawnQueue.length && --spawnT <= 0) { const type = spawnQueue.shift(); spawn(type); spawnT = type === 'bat' ? 26 : type === 'boss' ? 90 : 42; }
  // monsters walk
  for (const m of monsters) {
    if (m.dead) continue;
    if (m.slow > 0) m.slow--; else m.slowAmt = 1;
    m.d += m.speed * m.slowAmt; m.wob += 0.15;
    [m.x, m.y] = posAt(m.d);
    if (m.flash > 0) m.flash--;
    if (m.d >= pathLen) {
      m.dead = true; m.escaped = true; const lost = m.type === 'boss' ? 5 : m.type === 'troll' ? 2 : 1;
      hearts = Math.max(0, hearts - lost); sfx.ouch(); floaters.push({ x: 760, y: m.y - 30, t: `-${lost} ❤️`, life: 60, red: true });
    }
  }
  monsters = monsters.filter(m => !m.dead);
  // towers
  for (const t of towers) { if (t.cd > 0) t.cd--; else if (fire(t)) t.cd = towerStat(t, 'rate'); }
  // shots
  for (const s of shots) {
    if (s.kind === 'ball') {
      s.t++; const k = s.t / s.dur;
      s.x = s.sx + (s.tx - s.sx) * k; s.y = s.sy + (s.ty - s.sy) * k - Math.sin(k * Math.PI) * 50;
      if (k >= 1) { s.done = true; effects.push({ kind: 'boom', x: s.tx, y: s.ty, r: s.splash, life: 18 }); for (const m of monsters) if (dist(m.x, m.y, s.tx, s.ty) < s.splash) hurt(m, s.dmg); }
    } else {
      if (s.m.dead) { s.done = true; continue; }
      const dx = s.m.x - s.x, dy = s.m.y - s.y, d = Math.hypot(dx, dy);
      s.ang = Math.atan2(dy, dx);
      if (d < s.speed + 4) { s.done = true; hurt(s.m, s.dmg); if (s.kind === 'ice') { s.m.slow = s.slowT; s.m.slowAmt = Math.min(s.m.slowAmt, s.slow); for (let i = 0; i < 4; i++) particles.push({ x: s.m.x, y: s.m.y, vx: Math.random() * 2 - 1, vy: Math.random() * 2 - 1, life: 20, c: '#b3e5fc' }); } }
      else { s.x += dx / d * s.speed; s.y += dy / d * s.speed; }
    }
  }
  shots = shots.filter(s => !s.done);
  // wave over?
  if (waveActive && !spawnQueue.length && !monsters.length) {
    waveActive = false;
    const bonus = 20 + wave * 3; gold += bonus;
    if (wave >= WAVES) { winMap(); return; }
    say(`Wave ${wave} cleared! +${bonus} bonus gold! Press START WAVE when ready.`);
    sfx.upgrade();
  }
  if (hearts <= 0) { scene = 'lose'; sfx.lose(); }
}
function winMap() {
  resultStars = hearts >= 15 ? 3 : hearts >= 8 ? 2 : 1;
  SAVE.stars[mapI] = Math.max(SAVE.stars[mapI] || 0, resultStars); save();
  scene = 'win'; sfx.win();
  for (let i = 0; i < 90; i++) particles.push({ x: Math.random() * W, y: -Math.random() * 200, vx: Math.random() - .5, vy: Math.random() * 2 + 1, life: 220, c: pick(['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb']) });
}

// ---------- Buttons & input ----------
let buttons = [];
function btn(x, y, w, h, o) { buttons.push({ x, y, w, h, ...o }); }
function buildButtons() {
  buttons = [];
  if (scene === 'title') {
    btn(W / 2 - 150, 390, 300, 70, { label: '▶ Defend the castle!', fn: () => { scene = 'maps'; }, color: '#e53935', big: true });
    btn(686, 236, 52, 52, { label: '◀', fn: () => cycleLook(-1), color: '#7e57c2', big: true });   // tower hat picker
    btn(862, 236, 52, 52, { label: '▶', fn: () => cycleLook(1), color: '#7e57c2', big: true });
  }
  else if (scene === 'maps') {
    MAPS.forEach((m, i) => { const open = i === 0 || SAVE.stars[i - 1] > 0; btn(60 + i * 290, 150, 260, 230, { mapCard: i, open, fn: () => { if (open) startMap(i); else sfx.ouch(); } }); });
    btn(20, 20, 120, 44, { label: '◀ Back', fn: () => { scene = 'title'; }, color: '#546e7a' });
  } else if (scene === 'play') {
    Object.keys(TOWERS).forEach((k, i) => btn(812, 108 + i * 56, 136, 52, { tower: k, fn: () => {
      if (k === 'robo' && !roboOpen()) { placing = null; sfx.ouch(); return say(`🔒 Open the ${BUNDLE_NAMES[2]} in the Bundle Room!`); }
      placing = placing === k ? null : k; selected = null; } }));
    btn(812, 392, 136, 52, { label: waveActive ? `Wave ${wave}...` : wave >= WAVES ? 'Done!' : '▶ START WAVE', fn: startWave, color: waveActive ? '#78909c' : '#e53935', bold: true });
    btn(812, 452, 64, 40, { label: speed === 1 ? '▶ 1x' : '⏩ 2x', fn: () => { speed = speed === 1 ? 2 : 1; }, color: '#5c6bc0' });
