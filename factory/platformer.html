      horns: int(m.horns, 0, 3, 0),
      mouth: int(m.mouth, 0, 2, 0),
      wings: !!m.wings,

  LOOKS[LOOKS.length - 1].name = '🧪 ' + (myMonster ? myMonster.name : 'My Monster');
}

function goldShine(x, y, w, h) {                       // a shiny streak sliding across (draw it while clipped to the hero)
  const t = (frame % 140) / 90; if (t > 1) return;
  const sx = x - h * 0.6 + t * (w + h * 1.2);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 8, y); ctx.lineTo(sx + 8 - h * 0.5, y + h); ctx.lineTo(sx - h * 0.5, y + h); ctx.fill();
}
function goldSparkles(x, y, w, h) {                    // little twinkles pop up around the hero now and then
  for (let i = 0; i < 3; i++) {
    const n = frame + i * 41, ph = n % 70; if (ph > 24) continue;
    const s = Math.floor(n / 70) * 3.7 + i * 1.9;
    const sx = x + w * (0.5 + 0.75 * Math.sin(s * 12.99)), sy = y + h * (0.5 + 0.7 * Math.sin(s * 78.23));
    const r = Math.sin(ph / 24 * Math.PI) * 5 + 0.5, q = r * 0.28;

    ctx.beginPath(); ctx.moveTo(sx, sy - r); ctx.lineTo(sx + q, sy - q); ctx.lineTo(sx + r, sy); ctx.lineTo(sx + q, sy + q);

function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

];

const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = bossState === 'fight';
  const stepDur = 60 / (fight ? 165 : 130) / 2, shift = fight ? -3 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length], a = ARP[step % ARP.length];
    note(midi(a + shift), t, stepDur * 0.8, 'triangle', 0.035);
    if (m) note(midi(m + shift), t, stepDur * 3, 'sine', 0.07);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.09);
    nextNoteTime += stepDur; step++;
  }
}

addEventListener('keydown', e => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (!keys.jump) jumpPressed = true;
    keys.jump = true;
    e.preventDefault();
  }
  if (k === 'Enter') jumpPressed = true;
  if (state === 'title' && !e.repeat) {                // pick your look: ← → (or the D-pad) or L
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') cycleLook(-1);
    if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'l' || k === 'L') cycleLook(1);
    if (k === 'g' || k === 'G') toggleGold();          // ✨ Gold Robo on/off
  }

  if ((k === 'r' || k === 'R') && state === 'play') loadLevel(levelIndex);

let camX = 0, particles = [], timer = 0, frame = 0, helpTimer = 0;
const ARENA = 24;
let arenaStart = 0, bossState = 'none', boss = null, shots = [], bossBanner = 0, bannerText = '', shake = 0;

const isSolidCh = ch => ch === '#' || ch === '=' || ch === 'W';
function tileSolid(tx, ty) {
  if (tx < 0 || tx >= cols) return true;
  if (ty < 0 || ty >= rows) return false;
  return isSolidCh(map[ty][tx]);
}
// Finds the ground under a spot. If there is none, builds some so things never float over a hole.
function groundRow(x, y) {
  for (let r = y; r < rows; r++) if (isSolidCh(map[r][x])) return r;
  map[rows - 2][x] = map[rows - 1][x] = '#';
  return rows - 2;
}

function loadLevel(i) {
  const L = LEVELS[i];
  rows = L.map.length;
  cols = Math.max(...L.map.map(r => r.length)) + 2;
  map = L.map.map(r => r.padEnd(cols, ' ').split(''));
  // Boss arena: flat floor at the end of the level, rocket lands there after the boss is beaten
  const groundEnd = map[rows - 2].lastIndexOf('#') + 1;
  arenaStart = cols;
  cols += ARENA;
  map = map.map(r => r.concat(Array(ARENA).fill(' ')));
  for (let x = groundEnd; x < cols; x++) map[rows - 2][x] = map[rows - 1][x] = '#';
  bossState = 'none'; boss = null; shots = []; bossBanner = 0; shake = 0;
  coins = []; enemies = []; springs = []; spikes = []; particles = []; portal = null; gKey = null;
  let start = { x: 3, y: 10 }, c = null;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = map[y][x];
    if (ch === 'o') coins.push({ x: x * T + T / 2, y: y * T + T / 2, got: false });
    else if (ch === 'E') enemies.push({ x: x * T + 6, y: y * T + 12, w: 28, h: 28, vx: -1.2, vy: 0, dead: 0 });
    else if (ch === 'B') springs.push({ x, y });
    else if (ch === '^') spikes.push({ x, y });
    else if (ch === 'P') start = { x, y };
    else if (ch === 'C') c = { x, y };
    else if (ch === 'K') { if (!hasKey()) gKey = { x: x * T + T / 2, y: y * T + T / 2 }; }
    else if (ch === 'S') portal = { x: x * T - 10, y: y * T - 20, w: 60, h: 70 };
    if (!isSolidCh(ch)) map[y][x] = ' ';
  }
  springs = springs.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T + 5, y: g * T - 20, w: 30, h: 20, squish: 0 }; });
  spikes = spikes.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T, y: (g - 1) * T }; });
  const pg = groundRow(start.x, start.y);
  player = { x: start.x * T + 6, y: pg * T - 36, w: 28, h: 36, vx: 0, vy: 0, onGround: false,
             face: 1, coyote: 0, buffer: 0, jumping: false, inv: 0, squash: 1, hover: 70, hovering: false };
  respawn = { x: player.x, y: player.y };
  flag = { x: (cols - 4) * T + T / 2, y: (rows - 2) * T, drop: 600 };
  checkpoint = null;
  if (c) { const g = groundRow(c.x, c.y); checkpoint = { x: c.x * T + T / 2, y: g * T, reached: false }; }
  levelCoins = 0;
  camX = 0;
  state = 'play';
  helpTimer = levelIndex === 0 ? 400 : 0;
}

// ---------- Physics ----------
function overlapsSolid(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(tx, ty)) return true;
  return false;
}
function moveX(e) {
  e.x += e.vx;
  if (!overlapsSolid(e)) return false;
  if (e.vx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w;
  else e.x = (Math.floor(e.x / T) + 1) * T;
  e.vx = 0;
  return true;
}
function moveY(e) {
  e.y += e.vy;
  e.onGround = false;
  if (!overlapsSolid(e)) return;
  if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.onGround = true; }
  else e.y = (Math.floor(e.y / T) + 1) * T;
  e.vy = 0;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: camX + Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: cols[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

function startBoss() {
  const B = LEVELS[levelIndex].boss;
  bossState = 'fight'; shots = []; helpTimer = 0;
  bossBanner = 150; bannerText = 'BOSS: ' + B.name + '!';
  for (let y = 0; y < rows - 2; y++) map[y][arenaStart] = 'W';   // laser wall closes behind you
  respawn = { x: (arenaStart + 2) * T, y: (rows - 2) * T - player.h };
  const [w, h] = { blob: [90, 80], crab: [110, 64], ufo: [130, 56] }[B.type];
  boss = { type: B.type, name: B.name, hp: B.hp, maxHp: B.hp, look: B.look || '', w, h, x: (arenaStart + 17) * T,
           y: B.type === 'ufo' ? -80 : -120, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, pause: 0,
           mode: 'up', modeT: 0, dying: 0 };
  sfx.boss();
}

function bossShoot(b, n) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  for (let i = 0; i < n; i++) {
    const ang = a + (i - (n - 1) / 2) * 0.35;
    shots.push({ x: cx, y: cy, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4, r: 9 });
  }
}

function updateBoss() {
  const p = player, b = boss;
  if (bossBanner > 0) bossBanner--;
  if (bossState === 'defeated' && flag.drop > 0) {
    flag.drop = Math.max(0, flag.drop - 8);
    if (flag.drop === 0) { sfx.land(); shake = 10; burst(flag.x, flag.y, ['#cfd8dc', '#fff'], 20, 4); }
  }
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffea00', '#ff9100', '#fff'], 10, 5);
    if (b.dying > 80) {
      burst(b.x + b.w / 2, b.y + b.h / 2, ['#ffea00', '#ff9100', '#fff', '#7df9ff'], 50, 8);
      boss = null; bossState = 'defeated'; shake = 20;
      bossBanner = 150; bannerText = 'You beat ' + b.name + '!'; bossSticker(b.name);
      for (let y = 0; y < rows; y++) if (map[y][arenaStart] === 'W') map[y][arenaStart] = ' ';
      confetti();
    }
    return;
  }
  const angry = Math.min(3, b.maxHp - b.hp);   // bosses get faster as they get hurt (but not too fast)
  const left = (arenaStart + 1) * T, right = cols * T;
  if (b.type === 'ufo') {
    b.modeT++;
    const lowY = (rows - 2) * T - b.h - 50;
    if (b.mode === 'fly') {
      b.x += b.dir * (2.5 + angry * 0.5);
      if (b.x < left + 20 || b.x + b.w > right - 20) b.dir = -b.dir;
      b.y = 100 + Math.sin(b.t * 0.05) * 15;
      if (b.t % Math.max(40, 70 - angry * 10) === 0) shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: 0, vy: 1, r: 10, bomb: true });
      if (b.modeT > 280) { b.mode = 'down'; b.modeT = 0; }
    } else if (b.mode === 'down') {
      b.y += 3;
      if (b.y >= lowY) { b.y = lowY; b.mode = 'low'; b.modeT = 0; }
    } else if (b.mode === 'low') {
      b.x += Math.sign(p.x - b.x - b.w / 2 + p.w / 2) * 0.8;
      b.y = lowY + Math.sin(b.t * 0.1) * 4;
      if (b.modeT > 160) { b.mode = 'up'; b.modeT = 0; }
    } else {
      b.y -= 3;
      if (b.y <= 100) { b.mode = 'fly'; b.modeT = 0; }
    }
  } else {
    const speed = (b.type === 'blob' ? 1.6 : 2.2) + angry * 0.4;
    b.vy = Math.min(b.vy + GRAV, MAXFALL);
    if (b.pause > 0) {
      b.pause--; b.vx = 0;
      if (b.pause === 20) { bossShoot(b, 3); sfx.hover(); }
    } else b.vx = b.dir * speed;
    if (moveX(b)) b.dir = -b.dir;
    moveY(b);
    if (b.type === 'blob' && b.onGround && b.t % 110 === 0) { b.vy = -11; }
    if (b.type === 'blob' && b.onGround && b.vy === 0 && b.landed === false) { shake = 6; sfx.land(); }
    b.landed = b.onGround;
    if (b.type === 'crab' && b.t % Math.max(90, 140 - angry * 15) === 0) b.pause = 40;
  }
  // Bop the boss on the head!
  if (overlap(p, b) && b.hurt === 0 && state === 'play') {
    if (p.vy > 0 && p.y + p.h - p.vy <= b.y + 20) {
      b.hp--; b.hurt = 70; p.vy = -12; p.jumping = false; shake = 12;
      sfx.bossHit();
      burst(p.x + p.w / 2, b.y, ['#ffea00', '#fff', '#7df9ff'], 16, 5);
      if (b.type === 'ufo') { b.mode = 'up'; b.modeT = 0; }
      if (b.hp <= 0) { b.dying = 1; shots = []; sfx.bossDie(); }
    } else hurt();
  }
}

function updateShots() {
  const p = player;
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy;
    if (s.bomb) s.vy = Math.min(s.vy + 0.25, 10);
    if (tileSolid(Math.floor(s.x / T), Math.floor((s.y + s.r) / T)) || s.y > H + 40) {
      s.gone = true; burst(s.x, s.y, ['#ff9100', '#ffea00'], 8, 3);
    }
    const dx = s.x - (p.x + p.w / 2), dy = s.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < (s.r + 13) ** 2 && state === 'play' && p.inv === 0) { s.gone = true; hurt(); }
  }
  shots = shots.filter(s => !s.gone);
}

function hurt() {
  if (player.inv > 0 || state !== 'play') return;
  state = 'dying'; timer = 0;
  sfx.ouch();
  burst(player.x + 14, player.y + 18, ['#ffffff', '#7df9ff', '#2979ff'], 20, 5);
}

function updatePlay() {
  const p = player;
  const target = (keys.right - keys.left) * SPEED;
  p.vx += (target - p.vx) * (p.onGround ? 0.3 : 0.15);
  if (keys.right) p.face = 1; else if (keys.left) p.face = -1;

  if (jumpPressed) p.buffer = 8; else p.buffer--;
  jumpPressed = false;
  if (p.onGround) p.coyote = 6; else p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7;
    sfx.jump();
    burst(p.x + 14, p.y + p.h, ['#7df9ff', '#fff'], 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;
  if (p.vy >= 0) p.jumping = false;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  // Hold jump while falling to hover with jet boots!
  p.hovering = !p.onGround && keys.jump && p.vy > 0 && p.hover > 0;
  if (p.hovering) {
    p.vy = Math.min(p.vy, 0.6); p.hover--;
    if (frame % 2) particles.push({ x: p.x + 6 + Math.random() * 16, y: p.y + p.h + 4, vx: (Math.random() - .5),
                                    vy: 2 + Math.random() * 2, life: 14, color: frame % 4 ? '#7df9ff' : '#ffffff', size: 4 });
    if (frame % 4 === 0) sfx.hover();
  }

  const wasInAir = !p.onGround;
  moveX(p); moveY(p);
  if (p.onGround && wasInAir) p.squash = 1.3;
  if (p.onGround) p.hover = look === 'boo' ? 220 : 70;   // Boo floats three times longer!
  p.squash += (1 - p.squash) * 0.2;
  if (p.inv > 0) p.inv--;

  // Coins
  for (const c of coins) {
    if (c.got) continue;
    const dx = c.x - (p.x + p.w / 2), dy = c.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 28 * 28) {
      c.got = true; levelCoins++; totalCoins++; bankCoin();
      sfx.coin();
      burst(c.x, c.y, ['#ffd740', '#fff59d'], 8, 3);
    }
  }

  // 🔑 The hidden golden key
  if (gKey && overlap(p, { x: gKey.x - 20, y: gKey.y - 20, w: 40, h: 40 })) {
    burst(gKey.x, gKey.y, ['#ffd740', '#fff59d', '#fff'], 24, 4);
    gKey = null; keyCount = foundKey(); keyBanner = 150;
    [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.1, 0.25, 'square', 0.1)); note(2093, 0.42, 0.4, 'sine', 0.12);
  }

  // Springs
  for (const s of springs) {
    if (s.squish > 0) s.squish--;
    if (p.vy > 0 && overlap(p, s) && p.y + p.h - p.vy <= s.y + 10) {
      p.y = s.y - p.h; p.vy = -SPRING; p.jumping = false; s.squish = 10;
      sfx.spring();
    }
  }

  // Spikes
  for (const s of spikes) if (overlap(p, { x: s.x + 6, y: s.y + 22, w: 28, h: 18 })) hurt();

  // Monsters
  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.vy = Math.min(e.vy + GRAV, MAXFALL);
    const old = e.vx;
    if (moveX(e)) e.vx = -old;
    moveY(e);
    if (e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!tileSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
    }
    if (e.y > rows * T + 200) e.gone = true;
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 12) {
        e.dead = 1; p.vy = -10; p.jumping = false;
        sfx.stomp();
        burst(e.x + 14, e.y + 20, ['#76ff03', '#ccff90', '#fff'], 12, 3);
      } else hurt();
    }
  }
  enemies = enemies.filter(e => !e.gone && e.dead < 30);

  // Checkpoint
  if (checkpoint && !checkpoint.reached && overlap(p, { x: checkpoint.x - 10, y: checkpoint.y - 80, w: 24, h: 80 })) {
    checkpoint.reached = true;
    respawn = { x: checkpoint.x - 14, y: checkpoint.y - p.h };
    sfx.check();
    burst(checkpoint.x, checkpoint.y - 70, ['#ffd740', '#fff'], 14, 3);
  }

  // Finish flag
  if (bossState === 'none' && p.x > (arenaStart + 4) * T) startBoss();
  updateBoss();
  updateShots();

  if (bossState === 'defeated' && flag.drop === 0 && overlap(p, { x: flag.x - 28, y: flag.y - 130, w: 56, h: 130 })) {
    state = 'levelDone'; timer = 0;
    sfx.win(); confetti();
  }

  if (p.y > rows * T + 60) hurt();
  if (helpTimer > 0) helpTimer--;
}

function update() {
  frame++;
  if (stickerNew > 0) stickerNew--;
  if (keyBanner > 0) keyBanner--;
  if (goldNope > 0) goldNope--;
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += pt.confetti ? 0.05 : 0.2;
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);

  if (state === 'title' || state === 'win') {
    if (jumpPressed) {
      jumpPressed = false;
      if (state === 'win') totalCoins = 0;
      levelIndex = 0; loadLevel(0);
    }
    if (state === 'win' && frame % 90 === 0) confetti();
    return;
  }
  if (state === 'dying') {
    timer++;
    if (timer > 50) {
      Object.assign(player, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 90 });
      shots = [];
      state = 'play';
    }
  } else if (state === 'levelDone') {
    timer++;
    if (timer > 60 && jumpPressed || timer > 240) {
      levelIndex = levelIndex === MAIN_LEVELS ? secretBack + 1 : levelIndex + 1;
      if (levelIndex >= MAIN_LEVELS) { state = 'win'; confetti(); trophy('roboWin'); codeSeen('gloop'); }
      else loadLevel(levelIndex);
    }
    jumpPressed = false;
  } else if (state === 'play') {
    updatePlay();
    if (portal && state === 'play' && overlap(player, portal)) {   // found the secret!
      secretBack = levelIndex; trophy('roboSecret'); sfx.coin(); setTimeout(sfx.coin, 150); setTimeout(sfx.coin, 300);
      levelIndex = MAIN_LEVELS; loadLevel(MAIN_LEVELS); bossBanner = 180; bannerText = '🤫 SECRET LEVEL!'; confetti();
    }
  }

  const target = player.x + player.w / 2 - W / 2;
  const minX = bossState === 'fight' ? arenaStart * T : 0;
  camX += (Math.max(minX, Math.min(cols * T - W, target)) - camX) * 0.12;
  if (shake > 0) shake--;
}

// ---------- Drawing ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}

function drawBackground(L) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // twinkly stars
  for (let i = 0; i < 90; i++) {
    const sx = ((i * 137.5 - camX * (0.03 + (i % 3) * 0.03)) % W + W) % W;
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.sin(frame * 0.04 + i * 1.7)})`;
    const sz = i % 7 === 0 ? 3 : 2;
    ctx.fillRect(sx, (i * 71) % 400, sz, sz);
  }

  // shooting star
  const ss = frame % 420;
  if (ss < 40) {
    const sx = 900 - ss * 18, sy = 40 + ss * 5;
    const tail = ctx.createLinearGradient(sx, sy, sx + 90, sy - 25);
    tail.addColorStop(0, '#fff'); tail.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = tail; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 90, sy - 25); ctx.stroke();
  }

  // big ringed planet
  const px = 780 - camX * 0.04, py = 120;
  ctx.fillStyle = L.planet;
  ctx.beginPath(); ctx.arc(px, py, 55, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.arc(px + 15, py + 10, 50, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(px, py, 95, 20, -0.3, 0, 7); ctx.stroke();
  // little moon
  ctx.fillStyle = '#cfd8dc';
  ctx.beginPath(); ctx.arc(220 - camX * 0.07, 80, 18, 0, 7); ctx.fill();
  ctx.fillStyle = '#b0bec5';
  ctx.beginPath(); ctx.arc(214 - camX * 0.07, 76, 5, 0, 7); ctx.arc(226 - camX * 0.07, 88, 4, 0, 7); ctx.fill();

  // alien mountains
  for (const [color, speed, height, size] of [[L.hill, 0.3, 340, 90], [L.hill2, 0.5, 400, 60]]) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) {
      const wx = x + camX * speed, t = (wx / size) % 2;
      ctx.lineTo(x, height - (t < 1 ? t : 2 - t) * 70 - Math.sin(wx / 37) * 10);
    }
    ctx.lineTo(W, H); ctx.fill();
  }
}

function drawTiles(L) {
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(cols - 1, Math.ceil((camX + W) / T));
  for (let y = 0; y < rows; y++) for (let x = c0; x <= c1; x++) {
    const ch = map[y][x], px = x * T, py = y * T;
    if (ch === 'W') {                                  // laser wall
      ctx.fillStyle = `rgba(255,23,68,${0.4 + 0.3 * Math.sin(frame * 0.3 + y)})`;
      ctx.fillRect(px + 12, py, 16, T);
      ctx.fillStyle = '#ffcdd2'; ctx.fillRect(px + 18, py, 4, T);
    } else if (ch === '#') {
      ctx.fillStyle = L.dirt; ctx.fillRect(px, py, T + 1, T + 1);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(px, py, 2, T); ctx.fillRect(px, py + T - 2, T, 2);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(px + 6, py + 8, 3, 3); ctx.fillRect(px + 31, py + 8, 3, 3);
      ctx.fillRect(px + 6, py + 30, 3, 3); ctx.fillRect(px + 31, py + 30, 3, 3);
      if (y === 0 || map[y - 1][x] !== '#') {
        ctx.fillStyle = '#2a2f45'; ctx.fillRect(px, py, T + 1, 8);
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(frame * 0.05 + x * 0.5);
        ctx.fillStyle = L.grass; ctx.fillRect(px, py + 2, T + 1, 4);
        ctx.globalAlpha = 1;
      }
    } else if (ch === '=') {
      roundRect(px + 1, py + 1, T - 2, T - 2, 6, '#1e2a4a');
      ctx.strokeStyle = L.grass; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(px + 2, py + 2, T - 4, T - 4, 6); ctx.stroke();
      ctx.fillStyle = (frame / 20 + x) % 4 < 2 ? L.grass : '#ffffff';
      ctx.beginPath(); ctx.arc(px + T / 2, py + T / 2, 5, 0, 7); ctx.fill();
    }
  }
}

function drawCoin(x, y, t) {
  const w = Math.abs(Math.cos(t)) * 12 + 2;
  ctx.fillStyle = 'rgba(255,215,64,.25)';
  ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffb300';
  ctx.beginPath(); ctx.ellipse(x, y, w, 14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.ellipse(x, y, w * 0.6, 9, 0, 0, 7); ctx.fill();
}

function drawEnemy(e) {
  const squash = e.dead ? 0.3 : 1 + Math.sin(frame * 0.2 + e.x) * 0.06;
  const h = e.h * squash, y = e.y + e.h - h;
  roundRect(e.x, y, e.w, h, [14, 14, 6, 6], '#64dd17');
  if (e.dead) return;
  const d = e.vx > 0 ? 3 : -3;
  ctx.strokeStyle = '#33691e'; ctx.lineWidth = 2;     // wiggly antenna
  const ax = e.x + 14 + Math.sin(frame * 0.15 + e.x) * 4;
  ctx.beginPath(); ctx.moveTo(e.x + 14, y + 2); ctx.lineTo(ax, y - 10); ctx.stroke();
  ctx.fillStyle = '#ff4081';
  ctx.beginPath(); ctx.arc(ax, y - 11, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';                              // one big eye
  ctx.beginPath(); ctx.arc(e.x + 14 + d, y + 12, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(e.x + 15 + d * 1.3, y + 13, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#33691e';                           // feet
  const step = Math.sin(frame * 0.3) * 3;
  ctx.fillRect(e.x + 3 + step, e.y + e.h - 4, 8, 4);
  ctx.fillRect(e.x + 17 - step, e.y + e.h - 4, 8, 4);
}

function drawPlayer(p) {
  if (state === 'dying' || state === 'levelDone') return;
  if (p.inv > 0 && Math.floor(frame / 4) % 2) return;
  drawLook(p, look);
}

function drawLook(p, id, gold = isGold()) {
  const sx = 1 / p.squash, sy = p.squash;
  const w = p.w * sx, h = p.h * sy;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  goldDraw = gold;
  if (id === 'monster') {                              // 🧪 My Monster from the Mad Science Lab
    const cfg = myMonster || { body: 0, color: '#66bb6a', eyes: 2, horns: 0, mouth: 0, wings: false };
    const hat = monsterHat && lookOpen(LOOKS.find(l => l.id === monsterHat)) ? monsterHat : '';
    if (p.hovering && !cfg.wings) {                    // no wings? jet boots then!
      const f = 8 + Math.random() * 8;
      ctx.fillStyle = gc('#7df9ff', '#ffe57f');
      for (const fx of [x + 7, x + w - 7]) { ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill(); }
    }
    const top = drawMonsterLook(cfg, x, y, w, h, p.face || 1, frame, {
      gold, hat: !!hat, fly: !!p.hovering || (p.onGround === false && Math.abs(p.vy || 0) > 0.5),
      idle: p.onGround !== false && Math.abs(p.vx || 0) < 0.5, walk: p.onGround !== false && Math.abs(p.vx || 0) >= 0.5 });
    if (hat) drawHat(hat, x + w / 2, top + 1, w + 4, p.face || 1);
    if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8);
    goldDraw = false; return;
  }
  if (id === 'pinch') { drawPinch(p, x, y, w, h); if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return; }
  if (id === 'boo') {                                  // 👻 Boo the Ghost: see-through, wavy tail, floats extra long
    const t = frame * 0.15, f = p.face || 1;
    ctx.save(); ctx.globalAlpha = 0.85;
    ctx.fillStyle = gold ? '#ffd740' : '#f5f9ff'; ctx.beginPath();
    ctx.moveTo(x, y + h); ctx.lineTo(x, y + 14); ctx.arc(x + w / 2, y + 14, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h);
    for (let k = 0; k < 4; k++) ctx.lineTo(x + w - (k + 0.5) * w / 4, y + h - 6 + Math.sin(t + k) * 3), ctx.lineTo(x + w - (k + 1) * w / 4, y + h);
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.ellipse(x + w / 2 - 6 + f * 2, y + 14, 3, 4.5, 0, 0, 7); ctx.ellipse(x + w / 2 + 6 + f * 2, y + 14, 3, 4.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w / 2 + f * 2, y + 24, 4, 3, 0, 0, 7); ctx.fill();
    ctx.restore();
    if (monsterHat) drawHat(monsterHat, x + w / 2, y + 1, w + 4, f);
    if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return;
  }
  if (p.hovering) {                                    // jet boot flames
    const f = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.fillStyle = gc('#3d5afe', '#ff8f00');            // legs
  ctx.fillRect(x + 4, y + h - 7, 8, 7); ctx.fillRect(x + w - 12, y + h - 7, 8, 7);
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6, gc('#f5f7ff', '#ffb300'));   // body
  ctx.fillStyle = gc('#2979ff', '#fff');               // chest light
  ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.7, 3, 0, 7); ctx.fill();
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00')); // ear pods
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00'));
  roundRect(x - 2, y, w + 4, h * 0.55, 12, gc('#ffffff', '#ffd740'));  // big round head
  if (gold) {                                          // ✨ shiny streak + a white highlight
    ctx.save(); ctx.beginPath(); ctx.roundRect(x - 2, y, w + 4, h * 0.55, 12); ctx.roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6); ctx.clip();
    goldShine(x - 2, y, w + 4, h * 0.9); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 3, 3, 1.6, -0.5, 0, 7); ctx.fill();
  }
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9, '#111827');  // dark visor
  const ex = x + w / 2 + p.face * 3, ey = y + h * 0.27;  // glowing eyes
  const blink = frame % 180 < 6 ? 1 : 5;
  ctx.fillStyle = '#40c4ff';
  ctx.beginPath(); ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();
  if (id !== 'normal') drawHat(id, x + w / 2, y + 1, w + 4, p.face);
  if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8);
  goldDraw = false;
}

// Hats: cx = middle of the head, top = top of the head, hw = head width, face = 1 right / -1 left
function drawHat(id, cx, top, hw, face) {
  ctx.save();
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1.5;
  const shape = (fill, f) => { ctx.fillStyle = fill; ctx.beginPath(); f(); ctx.fill(); ctx.stroke(); };
  if (id === 'tophat') {
    shape('#212121', () => ctx.ellipse(cx, top, hw * 0.62, 4, 0, 0, 7));          // brim
    shape('#212121', () => ctx.rect(cx - hw * 0.36, top - 22, hw * 0.72, 22));     // tall part
    ctx.fillStyle = '#e53935'; ctx.fillRect(cx - hw * 0.36, top - 8, hw * 0.72, 5);  // red band
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(cx - hw * 0.28, top - 20, 3, 10);
  } else if (id === 'cap') {
    shape('#e53935', () => ctx.ellipse(cx + face * hw * 0.45, top + 1, hw * 0.4, 3.5, 0, 0, 7));  // bill sticks out the way you face
    shape('#ff1744', () => ctx.arc(cx, top + 2, hw * 0.48, Math.PI, 0));                         // dome
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, top + 2 - hw * 0.48, 2.5, 0, 7); ctx.fill();  // button
    ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(cx - face * 3, top - 5, 3, 0, 7); ctx.fill();   // star badge
  } else if (id === 'cowboy') {
    shape('#8d5524', () => {                                                       // curvy brim
      ctx.moveTo(cx - hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx - hw * 0.6, top + 4, cx, top + 3);
      ctx.quadraticCurveTo(cx + hw * 0.6, top + 4, cx + hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx + hw * 0.6, top - 1, cx, top - 1);
      ctx.quadraticCurveTo(cx - hw * 0.6, top - 1, cx - hw * 0.8, top - 6);
    });
    shape('#a0682f', () => {                                                       // crown with a dent
      ctx.moveTo(cx - hw * 0.34, top);
      ctx.lineTo(cx - hw * 0.3, top - 15);
      ctx.quadraticCurveTo(cx, top - 10, cx + hw * 0.3, top - 15);
      ctx.lineTo(cx + hw * 0.34, top);
      ctx.closePath();
    });
    ctx.fillStyle = '#4e342e'; ctx.fillRect(cx - hw * 0.33, top - 5, hw * 0.66, 3);   // band
  } else if (id === 'crown') {
    shape('#ffd740', () => {
      ctx.moveTo(cx - hw * 0.42, top + 1);
      ctx.lineTo(cx - hw * 0.46, top - 14);
      ctx.lineTo(cx - hw * 0.22, top - 6);
      ctx.lineTo(cx, top - 18);
      ctx.lineTo(cx + hw * 0.22, top - 6);
      ctx.lineTo(cx + hw * 0.46, top - 14);
      ctx.lineTo(cx + hw * 0.42, top + 1);
      ctx.closePath();
    });
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(cx, top - 3, 2.6, 0, 7); ctx.fill();   // jewels
    ctx.fillStyle = '#2979ff'; ctx.beginPath(); ctx.arc(cx - hw * 0.25, top - 2, 2, 0, 7); ctx.arc(cx + hw * 0.25, top - 2, 2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// 🧪 My Monster: draws a monster from the Mad Science Lab recipe in the box (x, y, w, h).
// cfg = { body 0 blob / 1 square / 2 tall bean / 3 spiky ball, color '#hex', eyes 1-3, horns 0 none / 1 horns / 2 antennae / 3 crown, mouth 0 smile / 1 fangs / 2 big open, wings }
// face = 1 right / -1 left, t = a frame counter. opt = { gold, fly (flap fast), idle (bounce), walk (step), hat (skip the crown) }
// Returns the y of the top of its head (so a hat can sit there).
function drawMonsterLook(cfg, x, y, w, h, face, t, opt = {}) {
  const shade = (hex, k) => {                          // darker (k < 1) or lighter (k > 1) version of a #hex color
    let c = String(hex).replace('#', ''); if (c.length === 3) c = c.replace(/./g, ch => ch + ch);
    const n = parseInt(c, 16); if (!Number.isFinite(n)) return hex;
    const f = v => Math.max(0, Math.min(255, Math.round(k < 1 ? v * k : v + (255 - v) * (k - 1))));
    return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
  };
  const col = opt.gold ? '#ffc107' : (cfg.color || '#66bb6a'), dark = opt.gold ? '#ff8f00' : shade(col, 0.62);
  const bounce = opt.idle ? Math.sin(t * 0.12) * 1.3 : 0;
  const yb = -4, yt = -h + 3 + bounce;                 // local coords: (0, 0) = feet in the middle
  let top = yt;
  ctx.save();
  ctx.translate(x + w / 2, y + h); ctx.scale(face < 0 ? -1 : 1, 1);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // little stubby feet
  const step = opt.walk ? Math.sin(t * 0.4) * 2 : 0;
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-w * 0.24, -2.5 - Math.max(0, step), 5, 3, 0, 0, 7); ctx.ellipse(w * 0.24, -2.5 - Math.max(0, -step), 5, 3, 0, 0, 7); ctx.fill();
  // bat wings (behind the body)
  if (cfg.wings) {
    const a = opt.fly ? Math.sin(t * 0.6) * 0.6 : Math.sin(t * 0.08) * 0.15;
    for (const sd of [-1, 1]) {
      ctx.save(); ctx.translate(sd * w * 0.36, yt + (yb - yt) * 0.38); ctx.rotate(sd * (a - 0.15)); ctx.scale(sd, 1);
      ctx.fillStyle = dark; ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(12, -9); ctx.lineTo(17, -2);
      ctx.quadraticCurveTo(13, -1, 12, 4); ctx.quadraticCurveTo(9, 1, 6, 6); ctx.quadraticCurveTo(4, 2, 0, 6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shade(dark, 0.7); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(1, 1); ctx.lineTo(12, -8); ctx.stroke();
      ctx.restore();
    }
  }
  // the body
  ctx.beginPath();
  if (cfg.body === 1) {                                // square
    ctx.roundRect(-w / 2, yt, w, yb - yt, 5);
  } else if (cfg.body === 2) {                         // tall bean
    top = yt - 2; ctx.ellipse(0, (top + yb) / 2, w * 0.4, (yb - top) / 2, 0, 0, 7);
  } else if (cfg.body === 3) {                         // spiky ball
    const R = Math.max(6, Math.min(w * 0.42, (yb - yt) / 2 - 2)), cy = yb - R;
    ctx.fillStyle = dark;
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 + 0.3, a1 = a - 0.25, a2 = a + 0.25;
      ctx.moveTo(Math.cos(a1) * R * 0.9, cy + Math.sin(a1) * R * 0.9); ctx.lineTo(Math.cos(a) * (R + 5), cy + Math.sin(a) * (R + 5)); ctx.lineTo(Math.cos(a2) * R * 0.9, cy + Math.sin(a2) * R * 0.9);
    }
    ctx.fill(); ctx.beginPath();
    ctx.arc(0, cy, R, 0, 7); top = cy - R;
  } else {                                             // blob: round top + a wiggly bottom
    const r = Math.min(w / 2, (yb - yt) * 0.6), wig = Math.sin(t * 0.15) * 1;
    ctx.moveTo(-w / 2, yb); ctx.lineTo(-w / 2, yt + r);
    ctx.ellipse(0, yt + r, w / 2, r, 0, Math.PI, 0);
    ctx.lineTo(w / 2, yb);
    ctx.quadraticCurveTo(w * 0.33, yb + 3 + wig, w / 6, yb); ctx.quadraticCurveTo(0, yb + 3 - wig, -w / 6, yb); ctx.quadraticCurveTo(-w * 0.33, yb + 3 + wig, -w / 2, yb);
    ctx.closePath();
  }
  ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.35)';             // shiny spot
  ctx.beginPath(); ctx.ellipse(-w * 0.2, top + (yb - top) * 0.22, 3.5, 2, -0.5, 0, 7); ctx.fill();
  if (opt.gold) {                                      // a sliding gold glint
    const g = (t % 120) / 120; ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(-w / 2 + g * w, top + (yb - top) * 0.5, 2, (yb - top) * 0.3, 0.4, 0, 7); ctx.fill();
  }
  // horns / antennae / crown
  if (cfg.horns === 1) {
    ctx.fillStyle = '#fff8e1'; ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 1;
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sd * w * 0.12, top + 3); ctx.quadraticCurveTo(sd * w * 0.3, top - 3, sd * w * 0.4, top - 10); ctx.quadraticCurveTo(sd * w * 0.34, top + 1, sd * w * 0.3, top + 5); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  } else if (cfg.horns === 2) {
    ctx.strokeStyle = dark; ctx.lineWidth = 2;
    const wob = Math.sin(t * 0.1) * 1.5;
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sd * 4, top + 2); ctx.quadraticCurveTo(sd * 5, top - 6, sd * 9 + wob, top - 11); ctx.stroke();
      ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(sd * 9 + wob, top - 11, 3, 0, 7); ctx.fill();
    }
  } else if (cfg.horns === 3 && !opt.hat) {
    ctx.fillStyle = '#ffd740'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-8, top + 2); ctx.lineTo(-9, top - 8); ctx.lineTo(-4, top - 3); ctx.lineTo(0, top - 11); ctx.lineTo(4, top - 3); ctx.lineTo(9, top - 8); ctx.lineTo(8, top + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(0, top - 2, 1.8, 0, 7); ctx.fill();
  }
  // eyes (looking the way it walks)
  const bodyH = yb - top, ey = top + bodyH * 0.34, fx = 2;
  const blink = t % 200 < 6;
  const eyes = cfg.eyes === 1 ? [[fx, ey, 6]] : cfg.eyes === 3 ? [[fx - 7, ey + 1, 3.6], [fx, ey - 2, 3.6], [fx + 7, ey + 1, 3.6]] : [[fx - 5.5, ey, 4.3], [fx + 5.5, ey, 4.3]];
  for (const [ex, eyy, r] of eyes) {
    if (blink) { ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ex - r, eyy); ctx.lineTo(ex + r, eyy); ctx.stroke(); continue; }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, eyy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#1b1b2f'; ctx.beginPath(); ctx.arc(ex + r * 0.35, eyy + 0.5, r * 0.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + r * 0.15, eyy - r * 0.2, r * 0.18, 0, 7); ctx.fill();
  }
  // mouth
  const my = top + bodyH * 0.68;
  if (cfg.mouth === 2) {                               // big open mouth
    ctx.fillStyle = '#3b0a0a'; ctx.beginPath(); ctx.ellipse(fx, my, 6, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff6f91'; ctx.beginPath(); ctx.ellipse(fx, my + 2.5, 3.5, 1.8, 0, 0, 7); ctx.fill();
  } else {
    ctx.strokeStyle = '#3b0a0a'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(fx, my - 3, 5, 0.25, Math.PI - 0.25); ctx.stroke();
    if (cfg.mouth === 1) {                             // two little fangs
      ctx.fillStyle = '#fff';
      for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(fx + sd * 3.6 - 1.5, my - 0.6); ctx.lineTo(fx + sd * 3.6 + 1.5, my - 0.9); ctx.lineTo(fx + sd * 3.2, my + 3); ctx.closePath(); ctx.fill(); }
    }
  }
  ctx.fillStyle = 'rgba(255,128,171,.5)';              // rosy cheeks
  ctx.beginPath(); ctx.arc(fx - 9, my - 2, 2, 0, 7); ctx.arc(fx + 9, my - 2, 2, 0, 7); ctx.fill();
  ctx.restore();
  return y + h + top;
}

// Captain Pinch: a small friendly crab, same size box as Robo
function drawPinch(p, x, y, w, h) {
  const cx = x + w / 2, f = p.face || 1;
  if (p.hovering) {                                    // still has jet boots!
    const fl = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + fl); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.strokeStyle = gc('#b71c1c', '#ff8f00'); ctx.lineWidth = 2.5; ctx.lineCap = 'round';   // little legs
  const k = Math.abs(p.vx || 0) > 0.5 ? Math.sin(frame * 0.4) * 2 : 0;
  for (const s of [-1, 1]) for (let i = 0; i < 2; i++) {
    ctx.beginPath(); ctx.moveTo(cx + s * (5 + i * 4), y + h * 0.78);
    ctx.lineTo(cx + s * (11 + i * 4), y + h - 1 + (i ? k : -k)); ctx.stroke();
  }
  const wave = Math.sin(frame * 0.12) * 0.25;
  for (const s of [-1, 1]) {                           // claws up high
    ctx.strokeStyle = gc('#d32f2f', '#ff8f00'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx + s * w * 0.32, y + h * 0.6); ctx.lineTo(cx + s * w * 0.5, y + h * 0.38); ctx.stroke();
    ctx.fillStyle = gc('#ff5252', '#ffd740');
    ctx.beginPath(); ctx.arc(cx + s * w * 0.52, y + h * 0.3, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a0b2e';                         // claw pinch gap
    ctx.beginPath(); ctx.moveTo(cx + s * w * 0.52, y + h * 0.3);
    ctx.arc(cx + s * w * 0.52, y + h * 0.3, 6.5, -Math.PI / 2 - 0.35 - wave, -Math.PI / 2 + 0.35 + wave); ctx.fill();
  }
  ctx.fillStyle = gc('#ff1744', '#ffb300');           // round shell body
  ctx.beginPath(); ctx.ellipse(cx, y + h * 0.66, w * 0.46, h * 0.24, 0, 0, 7); ctx.fill();
  if (goldDraw) { ctx.save(); ctx.clip(); goldShine(cx - w * 0.46, y + h * 0.42, w * 0.92, h * 0.48); ctx.restore(); }
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.ellipse(cx - f * 5, y + h * 0.58, 5, 3, -0.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff8a80';                           // rosy cheeks
  ctx.beginPath(); ctx.arc(cx - 8, y + h * 0.7, 2.5, 0, 7); ctx.arc(cx + 8, y + h * 0.7, 2.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 1.8;    // smile
  ctx.beginPath(); ctx.arc(cx + f * 1, y + h * 0.68, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.strokeStyle = gc('#b71c1c', '#ff8f00'); ctx.lineWidth = 2.5;    // eye stalks
  ctx.beginPath(); ctx.moveTo(cx - 5, y + h * 0.5); ctx.lineTo(cx - 6, y + h * 0.3);
  ctx.moveTo(cx + 5, y + h * 0.5); ctx.lineTo(cx + 6, y + h * 0.3); ctx.stroke();
  const blink = frame % 180 < 6 ? 1 : 4;
  for (const ex of [cx - 6, cx + 6]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, y + h * 0.3, 4.5, blink + 0.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + f * 1.5, y + h * 0.31, Math.min(2.2, blink / 2 + 0.3), 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#ffd740';                           // tiny captain hat, just like the big boss
  ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(cx - 7, y - 4, 14, 6); ctx.fill(); ctx.stroke();
  ctx.fillRect(cx - 9 + f * 2, y + 1, 18, 2.5);
  ctx.fillStyle = '#1565c0'; ctx.fillRect(cx - 7, y - 1, 14, 2);
  ctx.lineCap = 'butt';
}

function drawRocket(f) {
  if (bossState !== 'defeated') return;                 // rocket only comes after the boss is beaten
  const lift = state === 'levelDone' ? timer * timer * 0.04 : 0;
  const x = f.x, y = f.y - lift - f.drop;
  if (lift > 0 || f.drop > 0 || frame % 6 < 3) {        // engine flame
    const fl = lift > 0 || f.drop > 0 ? 30 + Math.random() * 20 : 6;
    ctx.fillStyle = '#ffab40';
    ctx.beginPath(); ctx.moveTo(x - 12, y - 6); ctx.lineTo(x, y + fl); ctx.lineTo(x + 12, y - 6); ctx.fill();
  }
  ctx.fillStyle = '#ff5252';                           // fins
  ctx.beginPath(); ctx.moveTo(x - 18, y - 40); ctx.lineTo(x - 32, y); ctx.lineTo(x - 18, y - 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 18, y - 40); ctx.lineTo(x + 32, y); ctx.lineTo(x + 18, y - 8); ctx.fill();
  roundRect(x - 20, y - 100, 40, 94, 18, '#eceff1');   // body
  ctx.fillStyle = '#ff5252';                           // nose cone
  ctx.beginPath(); ctx.moveTo(x - 19, y - 88); ctx.quadraticCurveTo(x, y - 140, x + 19, y - 88); ctx.fill();
  ctx.fillStyle = '#546e7a';
  ctx.beginPath(); ctx.arc(x, y - 62, 12, 0, 7); ctx.fill();
  ctx.fillStyle = '#40c4ff';                           // window
  ctx.beginPath(); ctx.arc(x, y - 62, 8, 0, 7); ctx.fill();
  if (state === 'levelDone') {                         // our robot inside the window
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y - 62, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.arc(x, y - 62, 5, 0, 7); ctx.fill();
  }
}

function drawBeacon(c) {
  ctx.fillStyle = '#78909c'; ctx.fillRect(c.x - 3, c.y - 70, 6, 70);
  ctx.fillRect(c.x - 12, c.y - 6, 24, 6);
  if (c.reached) {
    ctx.fillStyle = `rgba(105,240,174,${0.25 + 0.15 * Math.sin(frame * 0.15)})`;
    ctx.beginPath(); ctx.arc(c.x, c.y - 76, 22, 0, 7); ctx.fill();
  }
  ctx.fillStyle = c.reached ? '#69f0ae' : '#607d8b';
  ctx.beginPath(); ctx.arc(c.x, c.y - 76, 10, 0, 7); ctx.fill();
}

function drawSpring(s) {
  const sq = s.squish > 0 ? 6 : 0;
  roundRect(s.x - 2, s.y + 8, s.w + 4, s.h - 8, 4, '#37474f');
  ctx.fillStyle = s.squish > 0 ? '#ffffff' : '#7df9ff';
  ctx.fillRect(s.x, s.y + 4 + sq, s.w, 5);
  ctx.strokeStyle = `rgba(125,249,255,${0.5 + 0.5 * Math.sin(frame * 0.2)})`; ctx.lineWidth = 3;
  for (let i = 0; i < 2; i++) {                        // up arrows
    const ay = s.y - 8 - i * 10 - (frame % 30) / 3;
    ctx.beginPath(); ctx.moveTo(s.x + 7, ay + 6); ctx.lineTo(s.x + 15, ay); ctx.lineTo(s.x + 23, ay + 6); ctx.stroke();
  }
}

function drawSpikes(s) {
  ctx.fillStyle = frame % 20 < 10 ? '#ff1744' : '#ff8a80'; ctx.strokeStyle = '#7f0000'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(s.x + 2 + i * 12, s.y + T);
    ctx.lineTo(s.x + 8 + i * 12, s.y + 18);
    ctx.lineTo(s.x + 14 + i * 12, s.y + T);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function drawBoss(b) {
  if (b.hurt > 0 && Math.floor(frame / 4) % 2) return;
  ctx.save();
  if (b.dying) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  const look = Math.sign(player.x - b.x - b.w / 2) * 4;
  const cx = b.x + b.w / 2;
  if (false) {
  } else if (b.type === 'blob') {
    // every gloop has its own colors + a special trick (real colors, so it works on the iPad too)
    const P = { glitch: ['#00e676', '#00a152', '#ff00ff', '#004d26'], mirror: ['#b3e5fc', '#4fc3f7', '#e1f5fe', '#01579b'],
                byte: ['#ffb300', '#ff6f00', '#76ff03', '#5d4037'], magma: ['#ff6d00', '#dd2c00', '#ffd740', '#3e2723'],
                golden: ['#ffd740', '#ffa000', '#fff8e1', '#6d4c41'] }[b.look] || ['#7c4dff', '#651fff', '#ffd740', '#311b92'];
    const [body, dark, crownC, mouthC] = P;
    const wob = Math.sin(frame * 0.15) * 4;
    if (b.look === 'glitch')                           // pink + cyan glitch copies jitter behind it
      for (const [dx, col] of [[-6, 'rgba(255,0,255,.45)'], [6, 'rgba(0,229,255,.45)']])
        roundRect(b.x - wob / 2 + dx + (frame % 20 < 3 ? dx : 0), b.y + wob, b.w + wob, b.h - wob, [45, 45, 14, 14], col);
    if (b.look === 'mirror') {                         // a see-through mirror twin floats beside it
      ctx.globalAlpha = 0.3; roundRect(b.x - wob / 2 - 34 * Math.sign(look || 1), b.y + wob - 6, b.w + wob, b.h - wob, [45, 45, 14, 14], '#e1f5fe'); ctx.globalAlpha = 1;
    }
    if (b.look === 'byte') {                           // built out of chunky pixels
      const px = 10;
      for (let yy = 0; yy < b.h - wob; yy += px) for (let xx = 0; xx < b.w + wob; xx += px) {
        const rx = (xx + px / 2 - (b.w + wob) / 2) / ((b.w + wob) / 2), ry = (yy + px / 2 - (b.h - wob) * 0.55) / ((b.h - wob) * 0.6);
        if (rx * rx + ry * ry > 1.05 && yy < (b.h - wob) * 0.6) continue;
        ctx.fillStyle = (xx / px + yy / px) % 2 ? body : dark; ctx.fillRect(b.x - wob / 2 + xx, b.y + wob + yy, px, px);
      }
    } else roundRect(b.x - wob / 2, b.y + wob, b.w + wob, b.h - wob, [45, 45, 14, 14], body);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(b.x + 25, b.y + 22 + wob, 12, 7, -0.5, 0, 7); ctx.fill();
    if (b.look === 'mirror') {                         // shiny mirror stripes
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 5;
      for (const o of [52, 66]) { ctx.beginPath(); ctx.moveTo(b.x + o, b.y + 44 + wob); ctx.lineTo(b.x + o + 16, b.y + 20 + wob); ctx.stroke(); }
    }
    if (b.look === 'glitch') {                         // green pixel bits pop off it
      for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#ff00ff' : '#00e5ff'; ctx.fillRect(b.x + ((k * 37 + frame) % b.w), b.y + 46 + wob + ((k * 13) % 26), 7, 7); }
    }
    if (b.look === 'magma') {                          // glowing lava drips and cracks
      ctx.fillStyle = '#ffea00';
      for (let k = 0; k < 4; k++) { const dy = (frame * 0.6 + k * 17) % 22; ctx.beginPath(); ctx.arc(b.x + 14 + k * 21, b.y + b.h - 4 + dy, 5 - dy / 6, 0, 7); ctx.fill(); }
      ctx.strokeStyle = '#ffea00'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(b.x + 12, b.y + 50 + wob); ctx.lineTo(b.x + 24, b.y + 58 + wob); ctx.lineTo(b.x + 20, b.y + 68 + wob); ctx.stroke();
    }
    if (b.look === 'golden') {                         // twinkly gold sparkles
      ctx.fillStyle = '#fff';
      for (let k = 0; k < 4; k++) { const tw = (frame + k * 15) % 60 < 30 ? 6 : 3, sx = b.x + [8, 80, 70, 14][k], sy = b.y + [20, 14, 62, 64][k] + wob;
        ctx.fillRect(sx - tw, sy - 1, tw * 2, 2); ctx.fillRect(sx - 1, sy - tw, 2, tw * 2); }
    }
    if (b.look === 'byte') { ctx.fillStyle = '#3e2723'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center'; ctx.fillText(frame % 40 < 20 ? '0101' : '1010', cx, b.y + 74 + wob); }
    ctx.fillStyle = crownC;                            // crown
    if (b.look === 'glitch' || b.look === 'byte') {   // a blocky pixel crown
      for (let i = 0; i < 5; i++) ctx.fillRect(cx - 25 + i * 10, b.y + wob - (i % 2 ? 6 : 18), 9, i % 2 ? 12 : 24);
    } else {
      ctx.beginPath(); ctx.moveTo(cx - 25, b.y + 6 + wob);
      for (let i = 0; i <= 4; i++) ctx.lineTo(cx - 25 + i * 12.5, b.y + wob - (i % 2 ? 4 : 22));
      ctx.lineTo(cx + 25, b.y + 6 + wob); ctx.fill();
      if (b.look === 'mirror') { ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2; ctx.stroke(); }
    }
    for (const ex of [cx - 18, cx + 18]) {
      if (b.look === 'glitch') {                       // square pixel eyes
        ctx.fillStyle = '#fff'; ctx.fillRect(ex - 11, b.y + 21 + wob, 22, 22);
        ctx.fillStyle = '#ff1744'; ctx.fillRect(ex - 5 + look, b.y + 28 + wob, 10, 10);
      } else {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, b.y + 32 + wob, 11, 0, 7); ctx.fill();
        ctx.fillStyle = b.look === 'mirror' ? '#0277bd' : '#000'; ctx.beginPath(); ctx.arc(ex + look, b.y + 34 + wob, 5, 0, 7); ctx.fill();
      }
    }
    if (b.look === 'byte') {                           // pixel sunglasses
      ctx.fillStyle = '#000'; ctx.fillRect(cx - 32, b.y + 24 + wob, 28, 12); ctx.fillRect(cx + 4, b.y + 24 + wob, 28, 12); ctx.fillRect(cx - 4, b.y + 27 + wob, 8, 4);
    }
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx - 30, b.y + 16 + wob); ctx.lineTo(cx - 8, b.y + 24 + wob);
    ctx.moveTo(cx + 30, b.y + 16 + wob); ctx.lineTo(cx + 8, b.y + 24 + wob); ctx.stroke();
    ctx.fillStyle = mouthC;
    if (b.look === 'glitch') {                         // zig-zag glitch mouth
      ctx.strokeStyle = mouthC; ctx.lineWidth = 4; ctx.beginPath();
      for (let i = 0; i <= 5; i++) ctx.lineTo(cx - 20 + i * 8, b.y + 58 + wob + (i % 2 ? -5 : 5));
      ctx.stroke();
    } else { ctx.beginPath(); ctx.ellipse(cx, b.y + 58 + wob, 18, 8, 0, 0, 7); ctx.fill(); }
  } else if (b.type === 'crab') {
    const P = { flip: ['#76ff03', '#33691e', '#c6ff00', '#2979ff'], static: ['#aa00ff', '#4a148c', '#ea80fc', '#ffea00'],
                byte: ['#1de9b6', '#00695c', '#64ffda', '#ff4081'], frosty: ['#4fc3f7', '#01579b', '#b3e5fc', '#ff4081'] }[b.look] || ['#ff1744', '#b71c1c', '#ff5252', '#ffd740'];
    const [shell, leg, claw, hat] = P, blocky = b.look === 'byte';
    ctx.strokeStyle = leg; ctx.lineWidth = 5;         // legs
    for (let i = 0; i < 3; i++) for (const s of [-1, 1]) {
      const k = Math.sin(frame * 0.3 + i) * 5;
      ctx.beginPath(); ctx.moveTo(cx + s * 25, b.y + 40); ctx.lineTo(cx + s * (40 + i * 10), b.y + 48 + k); ctx.lineTo(cx + s * (45 + i * 10), b.y + b.h); ctx.stroke();
    }
    const snap = b.pause > 0 ? Math.sin(frame * 0.8) * 0.4 : Math.sin(frame * 0.1) * 0.2;
    for (const s of [-1, 1]) {                         // claws
      ctx.fillStyle = claw;
      if (blocky) { ctx.fillRect(cx + s * 58 - 16, b.y - 8, 32, 32); ctx.fillStyle = '#1a0b2e'; ctx.fillRect(cx + s * 58 - 4, b.y - 8, 8, 14 + snap * 20); }
      else {
        ctx.beginPath(); ctx.arc(cx + s * 58, b.y + 8, 16, 0, 7); ctx.fill();
        ctx.fillStyle = '#1a0b2e';
        ctx.beginPath(); ctx.moveTo(cx + s * 58, b.y + 8); ctx.arc(cx + s * 58, b.y + 8, 17, -Math.PI / 2 - 0.3 - snap, -Math.PI / 2 + 0.3 + snap); ctx.fill();
      }
      if (b.look === 'static' && frame % 12 < 8) {    // crackly sparks on the claws
        ctx.strokeStyle = '#ffea00'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(cx + s * 58, b.y - 10); ctx.lineTo(cx + s * 66, b.y - 20); ctx.lineTo(cx + s * 56, b.y - 24); ctx.lineTo(cx + s * 64, b.y - 36); ctx.stroke();
      }
    }
    ctx.fillStyle = shell;
    if (blocky) ctx.fillRect(cx - b.w / 2 + 12, b.y + 14, b.w - 24, 46);
    else { ctx.beginPath(); ctx.ellipse(cx, b.y + 36, b.w / 2 - 12, 24, 0, 0, 7); ctx.fill(); }
    if (b.look === 'static') {                         // lightning bolt on the shell
      ctx.fillStyle = '#ffea00'; ctx.beginPath();
      ctx.moveTo(cx + 4, b.y + 18); ctx.lineTo(cx - 12, b.y + 38); ctx.lineTo(cx - 1, b.y + 38); ctx.lineTo(cx - 6, b.y + 56); ctx.lineTo(cx + 12, b.y + 32); ctx.lineTo(cx + 1, b.y + 32); ctx.fill();
    }
    if (b.look === 'flip') {                           // up-down flip arrows on the shell
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⇅', cx, b.y + 46);
    }
    if (b.look === 'frosty') {                         // icicles + snowflake
      ctx.fillStyle = '#e1f5fe';
      for (let k = 0; k < 6; k++) { const ix = cx - 36 + k * 14; ctx.beginPath(); ctx.moveTo(ix - 5, b.y + 54); ctx.lineTo(ix + 5, b.y + 54); ctx.lineTo(ix, b.y + 66 + (k % 2) * 6); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('❄', cx, b.y + 46);
    }
    if (b.look === 'byte') { ctx.fillStyle = '#004d40'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center'; ctx.fillText('0110', cx, b.y + 50); }
    ctx.strokeStyle = leg; ctx.lineWidth = 4;         // eye stalks
    ctx.beginPath(); ctx.moveTo(cx - 12, b.y + 20); ctx.lineTo(cx - 14, b.y + 2); ctx.moveTo(cx + 12, b.y + 20); ctx.lineTo(cx + 14, b.y + 2); ctx.stroke();
    for (const ex of [cx - 14, cx + 14]) {
      ctx.fillStyle = '#fff';
      if (blocky) ctx.fillRect(ex - 8, b.y - 8, 16, 16); else { ctx.beginPath(); ctx.arc(ex, b.y, 8, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#000';
      if (blocky) ctx.fillRect(ex - 3 + look / 2, b.y - 3, 7, 7); else { ctx.beginPath(); ctx.arc(ex + look / 2, b.y + 1, 4, 0, 7); ctx.fill(); }
    }
    ctx.fillStyle = hat;
    if (b.look === 'flip') {                           // a propeller beanie that spins
      ctx.beginPath(); ctx.arc(cx, b.y - 12, 14, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#ffea00'; ctx.fillRect(cx - 2, b.y - 32, 4, 8);
      const sp = Math.cos(frame * 0.4) * 16; ctx.fillStyle = '#ff4081'; ctx.fillRect(cx - Math.abs(sp), b.y - 34, Math.abs(sp) * 2, 4);
    } else if (b.look === 'static') {                  // spiky staticky hair
      ctx.strokeStyle = hat; ctx.lineWidth = 3; ctx.beginPath();
      for (let i = -3; i <= 3; i++) { ctx.moveTo(cx + i * 5, b.y - 10); ctx.lineTo(cx + i * 8 + Math.sin(frame * 0.5 + i) * 2, b.y - 28); }
      ctx.stroke();
    } else if (b.look === 'frosty') {                  // a cozy pink winter hat with a pompom
      ctx.beginPath(); ctx.arc(cx, b.y - 10, 15, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(cx - 16, b.y - 12, 32, 6); ctx.beginPath(); ctx.arc(cx, b.y - 27, 6, 0, 7); ctx.fill();
    } else if (b.look === 'byte') {                    // a little pixel antenna
      ctx.fillRect(cx - 2, b.y - 30, 4, 18); ctx.fillRect(cx - 6, b.y - 36, 12, 8);
    } else ctx.fillRect(cx - 16, b.y - 22, 32, 8);      // captain hat
  } else {
    const P = { warp: ['#7c4dff', '#4527a0', 'rgba(234,128,252,.5)', '#ff80ab'], circuit: ['#ff9100', '#e65100', 'rgba(255,255,141,.5)', '#eceff1'],
               mother: ['#43a047', '#1b5e20', 'rgba(178,255,89,.45)', '#ce93d8'] }[b.look]
      || ['#90a4ae', '#546e7a', 'rgba(125,249,255,.5)', '#76ff03'];
    const [hull, belly, dome, pilot] = P;
    if (b.mode === 'low') {                            // tractor beam glow
      ctx.fillStyle = b.look === 'warp' ? 'rgba(234,128,252,.18)' : 'rgba(125,249,255,.15)';
      ctx.beginPath(); ctx.moveTo(cx - 30, b.y + b.h); ctx.lineTo(cx - 60, b.y + b.h + 60); ctx.lineTo(cx + 60, b.y + b.h + 60); ctx.lineTo(cx + 30, b.y + b.h); ctx.fill();
    }
    if (b.look === 'warp') {                           // swirly warp rings spin around it
      ctx.strokeStyle = '#ea80fc'; ctx.lineWidth = 3;
      for (let k = 0; k < 2; k++) { ctx.beginPath(); ctx.ellipse(cx, b.y + 34, b.w / 2 + 14 + k * 10, 10 + k * 4, Math.sin(frame * 0.05 + k) * 0.3, 0, 7); ctx.stroke(); }
    }
    ctx.fillStyle = dome;                              // glass dome
    ctx.beginPath(); ctx.arc(cx, b.y + 24, 30, Math.PI, 0); ctx.fill();
    if (b.look === 'circuit') {                        // a little robot pilot
      ctx.fillStyle = pilot; ctx.fillRect(cx - 12, b.y + 6, 24, 22);
      ctx.fillStyle = '#263238'; ctx.fillRect(cx - 9, b.y + 11, 18, 9);
      ctx.fillStyle = '#ff1744'; ctx.fillRect(cx - 6 + look / 2, b.y + 13, 4, 4); ctx.fillRect(cx + 2 + look / 2, b.y + 13, 4, 4);
      ctx.fillStyle = '#ffea00'; ctx.fillRect(cx - 1, b.y - 2, 2, 8);
    } else {
      ctx.fillStyle = pilot;                           // alien pilot
      ctx.beginPath(); ctx.arc(cx, b.y + 18, 13, 0, 7); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(cx - 5 + look / 2, b.y + 16, 3, 5, 0, 0, 7); ctx.ellipse(cx + 5 + look / 2, b.y + 16, 3, 5, 0, 0, 7); ctx.fill();
      if (b.look === 'warp') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + 9, b.y + 6, 4, 0, 7); ctx.fill(); }   // antenna ball
    }
    ctx.fillStyle = hull;                              // saucer
    ctx.beginPath(); ctx.ellipse(cx, b.y + 34, b.w / 2, 18, 0, 0, 7); ctx.fill();
    ctx.fillStyle = belly;
    ctx.beginPath(); ctx.ellipse(cx, b.y + 40, b.w / 2 - 10, 9, 0, 0, Math.PI); ctx.fill();
    if (b.look === 'warp') {                           // a spinning portal swirl underneath
      ctx.strokeStyle = '#ea80fc'; ctx.lineWidth = 3; ctx.beginPath();
      for (let a = 0; a < 12; a += 0.3) ctx.lineTo(cx + Math.cos(a + frame * 0.15) * a * 1.6, b.y + 44 + Math.sin(a + frame * 0.15) * a * 0.5);
      ctx.stroke();
    }
    if (b.look === 'mother') {                         // the boss of all saucers wears a crown
      ctx.fillStyle = '#ffd740'; ctx.beginPath(); ctx.moveTo(cx - 14, b.y - 2);
      for (let i = 0; i <= 4; i++) ctx.lineTo(cx - 14 + i * 7, b.y - (i % 2 ? 6 : 16));
      ctx.lineTo(cx + 14, b.y - 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('MAX', cx, b.y + 52);
    }
    if (b.look === 'circuit') {                        // circuit-board lines on the hull
      ctx.strokeStyle = '#ffe0b2'; ctx.lineWidth = 2; ctx.beginPath();
      for (const s of [-1, 1]) { ctx.moveTo(cx + s * 12, b.y + 30); ctx.lineTo(cx + s * 30, b.y + 30); ctx.lineTo(cx + s * 38, b.y + 38); ctx.lineTo(cx + s * 52, b.y + 38); }
      ctx.stroke();
    }
    for (let i = 0; i < 6; i++) {
      const on = (Math.floor(frame / 8) + i) % 3 === 0;
      ctx.fillStyle = b.look === 'circuit' ? (on ? '#76ff03' : '#1b5e20') : b.look === 'warp' ? (on ? '#fff' : '#ea80fc') : (on ? '#ffea00' : '#ff4081');
      ctx.beginPath(); ctx.arc(b.x + 15 + i * 20, b.y + 34, 4, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

function drawShots() {
  for (const s of shots) {
    ctx.fillStyle = s.bomb ? '#263238' : 'rgba(255,64,129,.4)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + (s.bomb ? 0 : 4), 0, 7); ctx.fill();
    ctx.fillStyle = s.bomb ? (frame % 10 < 5 ? '#ff1744' : '#ffea00') : '#ff80ab';
    ctx.beginPath(); ctx.arc(s.x, s.y - (s.bomb ? s.r : 0), s.bomb ? 4 : s.r - 2, 0, 7); ctx.fill();
  }
}

function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

        var p = null;
        try { p = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) {}
        hub.pads = p || NONE;
        for (var i = 0; i < hub.fns.length; i++) { try { hub.fns[i](now, hub.pads); } catch (e) {} }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  }
  var last = performance.now(), leaving = false, player = null;
  function bump() { last = performance.now(); }
  window.addEventListener('keydown', bump, { capture: true });
  window.addEventListener('pointerdown', bump, { capture: true });
  window.addEventListener('touchstart', bump, { capture: true, passive: true });
  function padActive(pads) {
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (!gp || gp.connected === false) continue;
      for (var b = 0; b < gp.buttons.length; b++) if (gp.buttons[b].pressed) return true;
      for (var a = 0; a < gp.axes.length; a++) if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  hub.fns.push(function (now, pads) {
    if (leaving) return;
    if (IS_BOOK) {                     // while a game is open its own overlay owns the idle timer
      if (!player) player = document.getElementById('player');
      if (player && player.classList.contains('open')) { last = now; return; }
    }
    if (padActive(pads)) last = now;
    if (now - last < IDLE_MS) return;
    leaving = true;
    var g = false;
    try { g = window.parent !== window && typeof window.parent.closeGame === 'function'; } catch (e) {}
    if (g) { try { window.parent.closeGame(); } catch (e) {} }
    else location.href = '/';          // pagehide fires -> games persist their state
  });
})();
</script>
