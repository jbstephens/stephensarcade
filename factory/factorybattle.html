      if (z.t > 24) z.dead = true;
    } else if (z.type === 'beam') {
      if (z.t === 0) { sfx.laser(); F.shake = Math.max(F.shake, z.a.big ? 10 : 5); }
      if (z.t >= 0 && z.t < 26) {
        const inX = z.face > 0 ? h.x > z.x : h.x < z.x;
        if (inX && h.y > z.y - z.th / 2) hurtHero(z.a.dmg, z.x);

      if (z.t > 30) z.dead = true;
    }
  }

  F.fx = F.fx.filter(p => p.life > 0);
}

// ---------- the whole fight, one step ----------
function updateFight() {
  F.t++; if (F.shake > 0) F.shake *= 0.85; if (F.shake < 0.5) F.shake = 0; if (F.flash > 0) F.flash--;
  if (F.phase === 'intro' && F.t > 100) { F.phase = 'fight'; F.t = 0; }
  updateHero(); updateVillain(); updateShots();
  const v = F.vil;
  if (v.ai !== 'ko') v.x = clamp(v.x, LEFT + v.def.w / 2, RIGHT - v.def.w / 2);
  if (F.phase === 'ko') {
    if (F.t === 80) { v.hidden = true; v.gone = true; cloud(v.x, v.y - v.def.h / 2, 26); sfx.poof(); pop(v.x, v.y - v.def.h / 2, 'POOF!', '#fff', 50); }
    if (F.t === 110) { F.phase = 'win'; F.t = 0; sfx.win(); fightWon(); }
  }
}

let scene = 'title', sceneT = 0, sel = 0, btns = [], paused = false;

function allVillains() { return save.champ ? VILLAINS.concat([BOSS]) : VILLAINS; }
function startTower(hero) {
  tower.hero = hero; tower.i = 0;

  go('tower');
}

function nextHero() { return mode === 'tower' ? tower.hero : HEROES[heroPick]; }

  const v = F.vil.def;
  save.wins = (save.wins || 0) + 1; save.beaten[v.id] = 1;
  if (F.mode === 'tower') {
    tower.i++;
    if (tower.i >= tower.list.length) { save.towerWins[tower.hero.id] = 1; save.champ = true; trophy('battleWin'); }
  }

// ---------- buttons (tap them, or pick with the arrows + SPACE/ENTER) ----------
function button(x, y, w, h, label, color, fn, size = 28) {
  const i = btns.length, on = i === sel;
  btns.push({ x, y, w, h, fn });
  const bob = on ? Math.sin(frame * 0.15) * 3 : 0;
  rr(x, y + 6 + bob, w, h, 18, shade(color, -0.35));
  rr(x, y + bob, w, h, 18, color, on ? '#fff' : 'rgba(255,255,255,.5)', on ? 6 : 3);
  if (typeof label === 'function') label(x, y + bob); else text(label, x + w / 2, y + h / 2 + bob, size);
  if (on) text('▶', x - 22, y + h / 2 + bob, 26, '#fff');
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt > 0 ? 255 : 0, k = Math.abs(amt);
  r = Math.round(r + (t - r) * k); g = Math.round(g + (t - g) * k); b = Math.round(b + (t - b) * k);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function moveSel(dx, dy) {                       // jump to the nearest button in that direction
  const cur = btns[sel]; if (!cur) { sel = 0; return; }
  const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
  let best = -1, bd = 1e9;
  btns.forEach((b, i) => {
    if (i === sel) return;
    const bx = b.x + b.w / 2 - cx, by = b.y + b.h / 2 - cy;
    const along = bx * dx + by * dy, side = Math.abs(bx * dy) + Math.abs(by * dx);
    if (along <= 5) return;
    const dd = along + side * 2.5;
    if (dd < bd) { bd = dd; best = i; }
  });
  if (best >= 0) { sel = best; sfx.click(); }
}
function pressSel() { const b = btns[sel]; if (b) { sfx.pick(); b.fn(); } }
function keyPress(k) {
  if (scene === 'fight' && F && !paused) {
    if (F.phase === 'fight' || F.phase === 'intro') {
      if (k === 'Escape') { paused = true; sel = 0; sfx.click(); return; }
      if (F.phase !== 'fight') return;
      if (k === ' ' || k === 'Enter') heroHit();
      else if (k === 'z' || k === 'ArrowUp') heroJump();
      else if (k === 'x') heroZap();
      else if (k === 'c') heroSuper();
      return;
    }
    if (F.t < 70) return;                       // wait a moment after K.O. so button-mashing doesn't skip ahead
  }
  if (k === 'ArrowLeft') moveSel(-1, 0); else if (k === 'ArrowRight') moveSel(1, 0);
  else if (k === 'ArrowUp') moveSel(0, -1); else if (k === 'ArrowDown') moveSel(0, 1);
  else if (k === ' ' || k === 'Enter') { if (scene === 'vs') startFight(nextHero(), nextVillain(), mode); else pressSel(); }
  else if (k === 'Escape') { if (paused) paused = false; else if (scene !== 'title') { sfx.click(); go('title'); } }
}
function tapAnywhere() { if (scene === 'vs' && sceneT > 20) startFight(nextHero(), nextVillain(), mode); }

// ---------- update ----------
function update() {
  frame++; sceneT++;
  if (stickerNew > 0) stickerNew--;
  if (goldHintT > 0) goldHintT--;
  if (scene === 'fight' && F && !paused) updateFight();
  if (scene === 'vs' && sceneT === 150) startFight(nextHero(), nextVillain(), mode);
  if (scene === 'champ' && sceneT % 40 === 1) for (let i = 0; i < 12; i++) confetti.push({ x: rand(0, W), y: -10, vx: rand(-1, 1), vy: rand(2, 5), c: pick(['#ff4081', '#ffea00', '#00e5ff', '#76ff03', '#e040fb']), r: rand(0, 7) });
  for (const c of confetti) { c.x += c.vx; c.y += c.vy; c.r += 0.1; }
  confetti = confetti.filter(c => c.y < H + 20);
}

function backBtn() { button(20, 20, 120, 50, '◀ BACK', '#546e7a', () => go('title'), 22); }
