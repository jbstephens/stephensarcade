<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LOOK LAB — Pi rendering budget instrument</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: #0a0c14; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 10px; top: 10px; z-index: 10;
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: #cfe3ff;
    background: rgba(8,10,18,0.72); padding: 8px 12px; border-radius: 6px;
    white-space: pre; pointer-events: none;
  }
</style>
<script src="three.min.js"></script>
</head>
<body>
<div id="hud">look lab booting…</div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   LOOK LAB — the Pi rendering-budget instrument (2026-09-12).
   A synthetic alpine scene calibrated to Powder Peak's worst vista
   (~30-45 draw calls, ~30k tris, big terrain, moving character, scenery)
   with every candidate "look upgrade" behind a runtime toggle, so each
   effect's fps cost can be measured on the real kiosk one variable at a
   time (CDP: __lab.set({...}), read __lab.fps/calls/tris).

   Toggles:
     tone:   'none' | 'aces'         tone mapping + sRGB output
     mat:    'basic' | 'lambert'     baked-unlit (house style) vs lit path
     shadow: 0 | 1024 | 2048         one directional shadow map (forces lambert)
     post:   0 | 1                   single fullscreen pass (vignette+grade)
     glow:   0 | 1                   additive fake-bloom sprites
     ao:     0 | 1                   baked vertex AO / cavity darkening
     sky:    0 | 1                   gradient sky dome (vs flat clear color)
     density: 1 | 4 | 16             scenery amount ×
     scenery: 'merged' | 'instanced' one merged mesh vs InstancedMesh
   Query params: ?aa=1 (MSAA context — needs reload), ?preset=pretty|flat
   ═══════════════════════════════════════════════════════════════════════ */
'use strict';
const QS = new URLSearchParams(location.search);
const AA = QS.get('aa') === '1';

const CFG = {
  tone: 'none', mat: 'basic', shadow: 0, post: 0,
  glow: 0, ao: 0, sky: 0, density: 1, scenery: 'merged',
};

const renderer = new THREE.WebGLRenderer({ antialias: AA, powerPreference: 'high-performance' });
renderer.info.autoReset = false;   /* manual reset: post pass = 2 renders, count both */
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fa8c8);
scene.fog = new THREE.Fog(0x8fa8c8, 90, 340);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.5, 900);
/* fixed worst-vista camera: low over the slope, long sightline through
   scenery into fog — the framing that costs the most fill + draws */
camera.position.set(-38, 16, 84);
camera.lookAt(8, 2, -40);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); buildPostTarget();
});

/* ── lights (only the lambert path reads them) ── */
const hemi = new THREE.HemisphereLight(0xbfd4ee, 0x4a4238, 0.9);
const sun = new THREE.DirectionalLight(0xffd9a8, 0.95);
sun.position.set(-60, 90, 40);
sun.castShadow = false;
sun.shadow.camera.left = -90; sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90; sun.shadow.camera.bottom = -90;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 260;
sun.shadow.bias = -0.0015;
scene.add(hemi, sun, sun.target);

/* ── analytic terrain (one mesh, ~18k tris) — the Powder Peak recipe ── */
function terrainH(x, z) {
  return 6 * Math.sin(x * 0.021) * Math.cos(z * 0.017)
       + 3 * Math.sin(x * 0.052 + 1.7) * Math.sin(z * 0.043)
       + 1.2 * Math.sin(x * 0.13 + z * 0.11)
       + 0.35 * Math.sin(x * 0.41) * Math.cos(z * 0.37)
       - z * 0.06;   /* gentle downhill toward the vista */
}
const T_SEG = 96, T_SIZE = 320;
const terrainGeo = new THREE.PlaneGeometry(T_SIZE, T_SIZE, T_SEG, T_SEG);
terrainGeo.rotateX(-Math.PI / 2);
{
  const p = terrainGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terrainH(p.getX(i), p.getZ(i)));
  terrainGeo.computeVertexNormals();
}
/* vertex colors: height/slope ramp; AO toggle darkens cavities (second-
   derivative approximation) — the "baked look" candidate, free per frame */
const SNOW = new THREE.Color(0xe8f0fa), SNOW_LO = new THREE.Color(0xb9c9e2),
      ROCK = new THREE.Color(0x7a7f8c), PINEGROUND = new THREE.Color(0x9fb4c4);
function paintTerrain(ao) {
  const p = terrainGeo.attributes.position, n = terrainGeo.attributes.normal;
  const colors = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const up = n.getY(i);                       /* 1 = flat, small = cliff */
    c.copy(up < 0.82 ? ROCK : (y > 4 ? SNOW : (y > -6 ? SNOW_LO : PINEGROUND)));
    if (up >= 0.82) c.lerp(SNOW, Math.min(1, Math.max(0, (y + 2) / 10)) * 0.5);
    if (ao) {
      const e = 3.4;
      const lap = terrainH(x + e, z) + terrainH(x - e, z) + terrainH(x, z + e) + terrainH(x, z - e) - 4 * y;
      const cav = Math.min(0.42, Math.max(0, lap * 0.10));       /* hollows darken */
      const ridge = Math.min(0.14, Math.max(0, -lap * 0.05));    /* crests brighten */
      c.multiplyScalar(1 - cav).multiplyScalar(1 + ridge);
      c.lerp(new THREE.Color(0x4d5f88), cav * 0.55);             /* cool shadows, warm light */
    }
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
paintTerrain(false);
const matBasicT = new THREE.MeshBasicMaterial({ vertexColors: true });
const matLambT = new THREE.MeshLambertMaterial({ vertexColors: true });
const terrain = new THREE.Mesh(terrainGeo, matBasicT);
terrain.receiveShadow = true;
scene.add(terrain);

/* ── scenery: pines + rocks, same geometry through two pipelines ── */
function pineGeo() {
  const g = [];
  const trunk = new THREE.CylinderGeometry(0.22, 0.3, 1.6, 5); trunk.translate(0, 0.8, 0);
  g.push(trunk);
  for (let t = 0; t < 3; t++) {
    const cone = new THREE.ConeGeometry(1.7 - t * 0.45, 2.0, 6);
    cone.translate(0, 2.0 + t * 1.15, 0);
    g.push(cone);
  }
  return mergeGeos(g);
}
function rockGeo() { const r = new THREE.IcosahedronGeometry(0.9, 0); r.scale(1.3, 0.8, 1.0); return r; }
function mergeGeos(list) {   /* minimal non-indexed merge (r147 has no bundled utils) */
  let total = 0;
  const flat = list.map(g => g.toNonIndexed());
  for (const g of flat) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), norm = new Float32Array(total * 3);
  let off = 0;
  for (const g of flat) {
    pos.set(g.attributes.position.array, off * 3);
    norm.set(g.attributes.normal.array, off * 3);
    off += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(norm, 3));
  return out;
}
function colorize(geo, color, jitter) {   /* per-vertex color w/ slight value jitter per Y */
  const p = geo.attributes.position, c = new THREE.Color();
  const colors = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    c.copy(color).multiplyScalar(1 - jitter + jitter * Math.min(1, p.getY(i) / 5 + 0.6));
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}
const PINE = colorize(pineGeo(), new THREE.Color(0x2f5d46), 0.35);
const ROCKG = colorize(rockGeo(), new THREE.Color(0x6d7280), 0.25);

/* deterministic placement (seeded LCG — no Math.random, reproducible runs) */
let seed = 1234567;
const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const SPOTS = [];
for (let i = 0; i < 960; i++) {
  const x = (rnd() - 0.5) * 300, z = (rnd() - 0.5) * 300;
  const y = terrainH(x, z);
  SPOTS.push({ x, y, z, rock: rnd() < 0.3, s: 0.7 + rnd() * 0.9, rot: rnd() * Math.PI * 2 });
}
const matBasicS = new THREE.MeshBasicMaterial({ vertexColors: true });
const matLambS = new THREE.MeshLambertMaterial({ vertexColors: true });

const sceneryGroups = {};   /* '<mode><count>' → group/mesh list */
function buildScenery(mode, count) {
  const key = mode + count;
  if (sceneryGroups[key]) return sceneryGroups[key];
  const grp = new THREE.Group();
  const spots = SPOTS.slice(0, count);
  if (mode === 'instanced') {
    for (const [geo, filter] of [[PINE, s => !s.rock], [ROCKG, s => s.rock]]) {
      const sel = spots.filter(filter);
      const im = new THREE.InstancedMesh(geo, matBasicS, sel.length);
      const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
      sel.forEach((s, i) => {
        q.setFromAxisAngle(up, s.rot);
        m4.compose(new THREE.Vector3(s.x, s.y, s.z), q, new THREE.Vector3(s.s, s.s, s.s));
        im.setMatrixAt(i, m4);
      });
      im.castShadow = true;
      grp.add(im);
    }
  } else {
    /* merged: one static geometry per kind — the current house style */
    for (const [geo, filter] of [[PINE, s => !s.rock], [ROCKG, s => s.rock]]) {
      const parts = spots.filter(filter).map(s => {
        const g = geo.clone();
        g.applyMatrix4(new THREE.Matrix4().compose(
          new THREE.Vector3(s.x, s.y, s.z),
          new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), s.rot),
          new THREE.Vector3(s.s, s.s, s.s)));
        return g;
      });
      if (!parts.length) continue;
      /* colors survive the merge */
      let total = 0; for (const g of parts) total += g.attributes.position.count;
      const pos = new Float32Array(total * 3), norm = new Float32Array(total * 3), col = new Float32Array(total * 3);
      let off = 0;
      for (const g of parts) {
        pos.set(g.attributes.position.array, off * 3);
        norm.set(g.attributes.normal.array, off * 3);
        col.set(g.attributes.color.array, off * 3);
        off += g.attributes.position.count;
      }
      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      merged.setAttribute('normal', new THREE.BufferAttribute(norm, 3));
      merged.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mesh = new THREE.Mesh(merged, matBasicS);
      mesh.castShadow = true;
      grp.add(mesh);
    }
  }
  grp.visible = false;
  scene.add(grp);
  sceneryGroups[key] = grp;
  return grp;
}
let activeScenery = null;

/* ── the skier stand-in: simple articulated figure orbiting the vista ── */
const matBasicC = new THREE.MeshBasicMaterial({ vertexColors: true });
const matLambC = new THREE.MeshLambertMaterial({ vertexColors: true });
const skier = new THREE.Group();
{
  const body = new THREE.Mesh(colorize(new THREE.CapsuleGeometry(0.45, 1.0, 3, 8), new THREE.Color(0xc44536), 0.3), matBasicC);
  body.position.y = 1.3;
  const head = new THREE.Mesh(colorize(new THREE.SphereGeometry(0.34, 10, 8), new THREE.Color(0xe8b88a), 0.2), matBasicC);
  head.position.y = 2.35;
  const skiL = new THREE.Mesh(colorize(new THREE.BoxGeometry(0.18, 0.06, 2.4), new THREE.Color(0x2b6cb0), 0.2), matBasicC);
  const skiR = skiL.clone(); skiL.position.set(-0.28, 0.05, 0.2); skiR.position.set(0.28, 0.05, 0.2);
  skier.add(body, head, skiL, skiR);
  skier.traverse(o => { if (o.isMesh) o.castShadow = true; });
}
scene.add(skier);

/* ── gradient sky dome (fog-matched horizon → deep zenith) ── */
const skyDome = (() => {
  const g = new THREE.SphereGeometry(600, 24, 12);
  const p = g.attributes.position, colors = new Float32Array(p.count * 3);
  const zen = new THREE.Color(0x39598f), hor = new THREE.Color(0xd9b8a0), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const t = Math.max(0, Math.min(1, p.getY(i) / 600 * 1.6 + 0.25));
    c.copy(hor).lerp(zen, t);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false }));
  m.visible = false;
  scene.add(m);
  return m;
})();

/* ── fake bloom: additive glow sprites at lantern points ── */
const glowGroup = (() => {
  const cnv = document.createElement('canvas'); cnv.width = cnv.height = 64;
  const g2 = cnv.getContext('2d');
  const grad = g2.createRadialGradient(32, 32, 2, 32, 32, 31);
  grad.addColorStop(0, 'rgba(255,214,140,0.95)');
  grad.addColorStop(0.35, 'rgba(255,178,90,0.4)');
  grad.addColorStop(1, 'rgba(255,150,60,0)');
  g2.fillStyle = grad; g2.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cnv);
  const mat = new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  const grp = new THREE.Group();
  for (let i = 0; i < 14; i++) {
    const x = (rnd() - 0.5) * 220, z = (rnd() - 0.5) * 220;
    const s = new THREE.Sprite(mat);
    s.position.set(x, terrainH(x, z) + 2.2, z);
    s.scale.setScalar(5 + rnd() * 3);
    grp.add(s);
  }
  grp.visible = false;
  scene.add(grp);
  return grp;
})();

/* ── the one-pass post chain: vignette + warm grade + saturation ── */
let rt = null, postScene = null, postCam = null, postMat = null;
function buildPostTarget() {
  if (rt) rt.dispose();
  rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { depthBuffer: true });
  if (postMat) postMat.uniforms.tDiffuse.value = rt.texture;
}
function buildPost() {
  buildPostTarget();
  postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  postMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: rt.texture },
      vig: { value: 0.42 }, sat: { value: 1.12 },
      lift: { value: new THREE.Vector3(0.012, 0.008, 0.02) },
      gain: { value: new THREE.Vector3(1.05, 1.0, 0.94) },
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float vig, sat;
      uniform vec3 lift, gain; varying vec2 vUv;
      void main(){
        vec3 c = texture2D(tDiffuse, vUv).rgb;
        c = c * gain + lift;                                   /* warm grade */
        float g = dot(c, vec3(0.299, 0.587, 0.114));
        c = mix(vec3(g), c, sat);                              /* saturation */
        vec2 d = vUv - 0.5;
        c *= 1.0 - vig * smoothstep(0.28, 0.72, dot(d, d) * 2.2);  /* vignette */
        gl_FragColor = vec4(c, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });
  postScene = new THREE.Scene();
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
}
buildPost();

/* ── config application ── */
function allMaterialsNeedUpdate() {
  scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
}
function applyCfg(c) {
  Object.assign(CFG, c || {});
  if (CFG.shadow > 0 && CFG.mat !== 'lambert') CFG.mat = 'lambert';   /* basic can't receive */
  /* tone mapping + output encoding */
  renderer.toneMapping = CFG.tone === 'aces' ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.outputEncoding = CFG.tone === 'aces' ? THREE.sRGBEncoding : THREE.LinearEncoding;
  /* material pipeline */
  const lit = CFG.mat === 'lambert';
  terrain.material = lit ? matLambT : matBasicT;
  skier.traverse(o => { if (o.isMesh) o.material = lit ? matLambC : matBasicC; });
  /* shadows */
  renderer.shadowMap.enabled = CFG.shadow > 0;
  sun.castShadow = CFG.shadow > 0;
  if (CFG.shadow > 0) {
    sun.shadow.mapSize.set(CFG.shadow, CFG.shadow);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  /* scenery */
  const count = Math.min(960, 60 * CFG.density);
  const grp = buildScenery(CFG.scenery, count);
  if (activeScenery && activeScenery !== grp) activeScenery.visible = false;
  grp.visible = true;
  activeScenery = grp;
  grp.traverse(o => { if (o.isMesh || o.isInstancedMesh) o.material = lit ? matLambS : matBasicS; });
  /* AO bake, sky, glow */
  paintTerrain(!!CFG.ao);
  skyDome.visible = !!CFG.sky;
  scene.background = CFG.sky ? null : new THREE.Color(0x8fa8c8);
  glowGroup.visible = !!CFG.glow;
  allMaterialsNeedUpdate();
  hudDirty = true;
}

/* presets for eyeballing */
const PRESETS = {
  flat:   { tone: 'none', mat: 'basic', shadow: 0, post: 0, glow: 0, ao: 0, sky: 0, density: 1, scenery: 'merged' },
  pretty: { tone: 'aces', mat: 'lambert', shadow: 1024, post: 1, glow: 1, ao: 1, sky: 1, density: 4, scenery: 'instanced' },
};
if (QS.get('preset') && PRESETS[QS.get('preset')]) Object.assign(CFG, PRESETS[QS.get('preset')]);

/* ── loop, fps meter, HUD, external API ── */
const hud = document.getElementById('hud');
let hudDirty = true, frames = 0, fpsAcc = 0, fps = 0, last = performance.now();
let simT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsAcc += dt; frames++;
  if (fpsAcc >= 1.0) { fps = frames / fpsAcc; frames = 0; fpsAcc = 0; hudDirty = true; }
  simT += dt;
  /* skier carves an orbit through the vista — a real moving shadow caster */
  const a = simT * 0.5, r = 26;
  const sx = 8 + Math.cos(a) * r, sz = -8 + Math.sin(a) * r;
  skier.position.set(sx, terrainH(sx, sz), sz);
  skier.rotation.y = -a + Math.PI / 2;
  skier.rotation.z = Math.sin(simT * 2.2) * 0.1;
  sun.target.position.set(sx, 0, sz);           /* shadow box follows */
  sun.position.set(sx - 60, 90, sz + 40);
  renderer.info.reset();
  if (CFG.post) {
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  } else {
    renderer.render(scene, camera);
  }
  window.__lab.fps = fps;
  window.__lab.calls = renderer.info.render.calls;
  window.__lab.tris = renderer.info.render.triangles;
  if (hudDirty) {
    hudDirty = false;
    hud.textContent =
      `LOOK LAB  ${fps.toFixed(1)} fps  ${window.__lab.calls} calls  ${(window.__lab.tris / 1000).toFixed(1)}k tris\n` +
      `tone:${CFG.tone} mat:${CFG.mat} shadow:${CFG.shadow} post:${CFG.post} glow:${CFG.glow}\n` +
      `ao:${CFG.ao} sky:${CFG.sky} density:${CFG.density} scenery:${CFG.scenery} aa:${AA ? 1 : 0}`;
  }
}
window.__lab = {
  fps: 0, calls: 0, tris: 0,
  cfg: CFG,
  set: c => { applyCfg(c); return JSON.parse(JSON.stringify(CFG)); },
  preset: n => { applyCfg(PRESETS[n]); return n; },
};
applyCfg({});
requestAnimationFrame(frame);
</script>
</body>
</html>
