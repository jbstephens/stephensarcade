function startGame(fromSave) {
  resetState();
  genWorld();
  if (fromSave) load();
  spawnCritters();
  syncResidents();
  scene = 'play';
  document.getElementById('title').classList.add('hide');
  document.body.classList.add('in-play');
  if (!document.body.classList.contains('input-touch')) document.body.classList.add('input-kb');
  hudDirty = true;
  updateGoalUI();
  if (!fromSave) {
    setTimeout(() => banner('THE SUNNY SHALLOWS!', 'Chop kelp! Build a home! Dive deep!'), 600);
    setTimeout(() => toast('SWIM TO THE KELP AND PRESS X! 🌿'), 3200);
  } else toast('WELCOME BACK, CAPTAIN! 🌊');
}
function resetState() {
  res = { kelp: 0, stone: 0, snacks: 0, pearl: 0, scrap: 0, glow: 0, crystal: 0 };
  life = { ...res };
  buildings = []; residents = []; crates = []; particles = []; tacos = [];
  gear = 1; pop = 0; goalI = 0;
  cratesOpened = 0; kelpCut = 0; greeted = 0; tacosFired = 0; whalesHi = 0;
  ruinsFixed = [false, false, false]; saucerStage = 0; blastDone = false; petAdopted = false;
  hats = []; hatWorn = -1;
  visitedZones = [true, false, false, false, false, false, false];
  wreckFound = cityFound = saucerFound = false;
  playT = 0; placing = null; panelMode = null;
  pet.on = false; whale.on = false; whaleTimer = 40;
  player.x = WORLD_W / 2; player.y = 120; player.vx = player.vy = 0;
  cam.x = player.x; cam.y = player.y;
}

/* ═══════════ UPDATE ═══════════ */
let blast = null;   // blastoff cinematic state
function startBlastoff() {
  if (blast) return;
  scene = 'blastoff';
  closePanel(); placing = null;
  blast = { t: 0, y: POI.saucer.y - 50, x: POI.saucer.x, vy: 0, fireworks: [], fwT: 0, done: false };
  SFX.rumble();
}

function update(dt) {
  playT += dt;
  ambientTick(dt);

  if (scene === 'blastoff') { updateBlastoff(dt); updateParticles(dt); return; }

  /* ── player swim physics ── */
  const frozen = panelMode !== null;
  const [ix, iy] = frozen ? [0, 0] : inputVec();
  const ACC = 620, MAX = 270;
  player.vx += ix * ACC * dt;
  player.vy += iy * ACC * dt;
  if (player.y < 0) player.vy += 700 * dt;              // gravity above the surface
  const drag = Math.pow(.12, dt);
  player.vx *= drag; player.vy *= drag;
  const spd = Math.hypot(player.vx, player.vy);
  if (spd > MAX) { player.vx *= MAX / spd; player.vy *= MAX / spd; }
  const wasAbove = player.y < 0;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  if (wasAbove !== (player.y < 0) && Math.abs(player.vy) > 120) { SFX.splash(); puff(player.x, 0, 12, 'bubble'); }
  /* canyon walls + floor */
  const wl = wallL(player.y) + 26, wr = wallR(player.y) - 26;
  if (player.x < wl) { player.x = wl; player.vx = Math.abs(player.vx) * .3; }
  if (player.x > wr) { player.x = wr; player.vx = -Math.abs(player.vx) * .3; }
  if (player.y > WORLD_BOTTOM - 40) { player.y = WORLD_BOTTOM - 40; player.vy = -Math.abs(player.vy) * .3; }
  if (player.y < -240) { player.y = -240; player.vy = 0; }
  if (Math.abs(ix) > .1) player.face = ix > 0 ? 1 : -1;
  player.tilt = lerp(player.tilt, clamp(player.vy / 400, -.5, .5) * player.face, 1 - Math.pow(.002, dt));
  player.swimT += dt * (1 + spd / 90);
  player.warnT = Math.max(0, player.warnT - dt);
  /* bubble trail */
  bubbleT -= dt;
  if (bubbleT <= 0 && player.y > 6) {
    bubbleT = spd > 60 ? .12 : .5;
    particles.push({ x: player.x - player.face * 16, y: player.y - 8, vx: rnd(-8, 8), vy: rnd(-50, -30),
      life: 0, maxlife: rnd(.8, 1.8), kind: 'bubble', size: rnd(1.5, 4), hue: 0 });
  }

  /* camera */
  const k = 1 - Math.pow(.0018, dt);
  cam.x = lerp(cam.x, player.x, k);
  cam.y = lerp(cam.y, player.y, k);
  const halfW = VW / 2 / SCALE, halfH = VH / 2 / SCALE;
  cam.x = clamp(cam.x, halfW * .35, WORLD_W - halfW * .35);
  cam.y = clamp(cam.y, -halfH * .6, WORLD_BOTTOM - halfH + 80);
  shake = Math.max(0, shake - dt * 14);

  if (!frozen) { tickZones(); }
  tickEconomy(dt);
  if (GOALS[goalI] && GOALS[goalI].live) updateGoalUI();
  tickGoals();
  for (const b of buildings) b.t += dt;

  /* ── crates fall + bob ── */
  for (const c of crates) {
    c.t += dt;
    let landY = WORLD_BOTTOM - 30;
    for (const l of ledges) {
      if (c.x > l.x && c.x < l.x + l.w && l.y > c.y - 10 && l.y < landY) landY = l.y;
    }
    /* never sink below the captain's dive limit — hover instead */
    landY = Math.min(landY, GEAR[gear].maxDepth - 100);
    if (c.y < landY - 14) c.y += 60 * dt; else c.y = landY - 14 + Math.sin(c.t * 2) * 2;
  }

  /* ── nodes respawn ── */
  for (const nd of nodes) {
    nd.t += dt;
    if (nd.dead) { nd.respawn -= dt; if (nd.respawn <= 0) { nd.dead = 0; nd.hp = nd.maxhp; puff(nd.x, nd.y - 16, 6, 'bubble'); } }
  }

  /* ── residents drift near home, wave at you ── */
  for (const r of residents) {
    r.ph += dt;
    const tx = r.hx + Math.sin(r.ph * .43 + r.hue) * 52;
    const ty = r.hy + Math.sin(r.ph * .61 + r.hue * 2) * 22;
    r.x = lerp(r.x, tx, 1 - Math.pow(.3, dt));
    r.y = lerp(r.y, ty, 1 - Math.pow(.3, dt));
    r.waveT = Math.max(0, r.waveT - dt); r.heartT = Math.max(0, r.heartT - dt);
    if (r.waveT === 0 && dist(player.x, player.y, r.x, r.y) < 120 && Math.random() < dt * .5) r.waveT = 1;
  }

  /* ── critters ── */
  for (const f of fishSchools) {
    f.x += f.vx * dt; f.ph += dt;
    if (f.x < -140) { f.x = -140; f.vx = Math.abs(f.vx); }
    if (f.x > WORLD_W + 140) { f.x = WORLD_W + 140; f.vx = -Math.abs(f.vx); }
    /* tacos attract fish! */
    for (const tc of tacos) if (Math.abs(tc.y - f.y) < 260 && Math.abs(tc.x - f.x) < 420)
      f.vx += Math.sign(tc.x - f.x) * 30 * dt;
  }
  for (const j of jellies) {
    j.ph += dt;
    j.y -= (8 + Math.sin(j.ph * 1.7) * 6) * dt;
    j.x += Math.sin(j.ph * .5) * 10 * dt;
    if (j.y < 1750) j.y = 5900 + rnd(0, 300);
  }
  for (const cb of crabs) {
    cb.ph += dt;
    cb.sx += cb.dir * dt * .04;
    if (cb.sx < .08 || cb.sx > .92) cb.dir *= -1;
  }

  /* ── Blub the pet ── */
  if (pet.on) {
    pet.ph += dt;
    const tx = player.x - player.face * 52, ty = player.y - 16 + Math.sin(pet.ph * 2.2) * 8;
    pet.vx = lerp(pet.vx, (tx - pet.x) * 4, 1 - Math.pow(.01, dt));
    pet.vy = lerp(pet.vy, (ty - pet.y) * 4, 1 - Math.pow(.01, dt));
    pet.x += pet.vx * dt; pet.y += pet.vy * dt;
  }

  /* ── the whale ── */
  whaleTimer -= dt;
  if (!whale.on && whaleTimer <= 0) {
    whale.on = true; whale.t = 0; whale.greetT = 0;
    whale.dir = Math.random() < .5 ? 1 : -1;
    whale.x = whale.dir > 0 ? -320 : WORLD_W + 320;
    whale.y = rnd(900, 2400);
    if (Math.abs(whale.y - player.y) < 900) SFX.whale();
  }
  if (whale.on) {
    whale.t += dt; whale.greetT = Math.max(0, whale.greetT - dt);
    whale.x += whale.dir * 46 * dt;
    whale.y += Math.sin(whale.t * .5) * 12 * dt;
    if (whale.t > 3 && Math.random() < dt * .3)
      particles.push({ x: whale.x + whale.dir * 60, y: whale.y - 40, vx: 0, vy: -60, life: 0, maxlife: 2, kind: 'bubble', size: rnd(3, 7), hue: 0 });
    if (whale.x < -400 || whale.x > WORLD_W + 400) { whale.on = false; whaleTimer = rnd(70, 130); }
  }

  /* ── flying tacos ── */
  for (let i = tacos.length - 1; i >= 0; i--) {
    const tc = tacos[i];
    tc.life += dt;
    tc.vy += 240 * dt; tc.vy *= Math.pow(.5, dt);
    tc.x += tc.vx * dt; tc.y += tc.vy * dt;
    if (tc.life > 2.6) {
      puff(tc.x, tc.y, 8, 'spark', 45); heart(tc.x, tc.y);
      floatText(tc.x, tc.y, 'NOM NOM!', '#ffd85e');
      tacos.splice(i, 1);
    }
  }

  updateParticles(dt);

  /* autosave */
  saveTimer += dt;
  if (saveTimer > 6) { saveTimer = 0; save(); }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life > p.maxlife) { particles.splice(i, 1); continue; }
    if (p.kind === 'bubble') { p.vy -= 40 * dt; p.x += Math.sin((p.life * 6) + p.size) * 12 * dt; }
    if (p.kind === 'confetti') p.vy += 160 * dt;
    if (p.kind === 'heart') p.vy -= 10 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  if (particles.length > 400) particles.splice(0, particles.length - 400);
}

/* ── blastoff cinematic: up through every zone, out of the sea, into the stars ── */
function updateBlastoff(dt) {
  const b = blast;
  b.t += dt;
  if (b.t > 1.2) {
    if (b.done) b.vy *= Math.pow(.08, dt);          // ease to a hover among the stars
    else b.vy = Math.min(b.vy + 260 * dt, 620);
    b.y -= b.vy * dt;
  }
  if (b.t < 3 && Math.random() < dt * 20) shake = 3;
  /* exhaust bubbles / sparks */
  if (b.y > 0) {
    for (let i = 0; i < 3; i++)
      particles.push({ x: b.x + rnd(-40, 40), y: b.y + 46, vx: rnd(-30, 30), vy: rnd(80, 200), life: 0,
        maxlife: rnd(.5, 1.2), kind: 'bubble', size: rnd(3, 8), hue: 0 });
  } else {
    for (let i = 0; i < 2; i++)
      particles.push({ x: b.x + rnd(-26, 26), y: b.y + 46, vx: rnd(-20, 20), vy: rnd(120, 260), life: 0,
        maxlife: rnd(.3, .8), kind: 'spark', size: rnd(2, 6), hue: rnd(20, 55) });
  }
  if (b.y < 10 && b.y > -30 && !b.splashed) { b.splashed = true; SFX.splash(); shake = 8; puff(b.x, 0, 40, 'bubble'); }
  /* camera chases the saucer */
  cam.x = lerp(cam.x, b.x, 1 - Math.pow(.001, dt));
  cam.y = lerp(cam.y, b.y - 60, 1 - Math.pow(.0005, dt));
  /* fireworks in the sky */
  if (b.y < -700) {
    b.fwT -= dt;
    if (b.fwT <= 0) {
      b.fwT = rnd(.3, .7);
      const fx = b.x + rnd(-500, 500), fy = b.y + rnd(-320, 240);
      const hue = rnd(0, 360);
      for (let i = 0; i < 26; i++) {
        const a = rnd(0, TAU), sp2 = rnd(40, 190);
        particles.push({ x: fx, y: fy, vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2, life: 0,
          maxlife: rnd(.8, 1.6), kind: 'confetti', size: rnd(2.5, 5), hue });
      }
      SFX.pop();
    }
  }
  if (b.y < -1500 && !b.done) {
    b.done = true;
    blastDone = true;
    banner('YOU DID IT, CAPTAIN!', '🛸 TO BE CONTINUED… 🛸');
    SFX.gearUp();
    setTimeout(() => {
      blast = null;
      scene = 'play';
      player.x = POI.saucer.x; player.y = POI.saucer.y - 120;
      player.vx = player.vy = 0;
      cam.x = player.x; cam.y = player.y;
      tickGoals(); save();
      setTimeout(() => toast('THE SAUCER CAME BACK FOR YOU — FREE PLAY TIME! 🌊', 'gold'), 1200);
    }, 4200);
  }
}

/* ═══════════ RENDER — world layer (called inside camera transform) ═══════════ */
let now = 0;   // global animation clock (seconds)

function rockColor(y, dark) {
  const z = zoneAt(y);
  const base = ['#3b6f70', '#2f5c63', '#274a5c', '#233d52', '#1c2b40', '#3a2c33', '#2c3550'][z];
  return dark ? shade(base, -.25) : base;
}
function topColor(y) {
  const z = zoneAt(y);
  return ['#e8d48f', '#7fc26b', '#5e8f7a', '#8a7a5e', '#3f5f77', '#c96f3f', '#8fa7c9'][z];
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  r = clamp(r + r * amt | 0, 0, 255); g = clamp(g + g * amt | 0, 0, 255); b = clamp(b + b * amt | 0, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function viewRange() {
  const halfW = VW / 2 / SCALE + 80, halfH = VH / 2 / SCALE + 80;
  return { x0: cam.x - halfW, x1: cam.x + halfW, y0: cam.y - halfH, y1: cam.y + halfH };
}

/* canyon walls with parallax layers */
function drawWalls(v) {
  const yTop = Math.max(0, v.y0), yBot = Math.min(WORLD_BOTTOM, v.y1);
  if (yBot <= yTop) return;
  /* far parallax silhouettes */
  for (const [par, dk] of [[.45, -.45], [.72, -.28]]) {
    ctx.fillStyle = shade('#1a3a52', dk) ;
    ctx.globalAlpha = .5;
    ctx.beginPath();
    let started = false;
    for (let y = yTop; y <= yBot + 26; y += 26) {
      const py = cam.y + (y - cam.y) ;    // same y; parallax on x only
      const x = cam.x + (wallL(y * 1.3 + 400) * 1.15 - cam.x) * par;
      if (!started) { ctx.moveTo(v.x0 - 50, py); started = true; }
      ctx.lineTo(x + 60, py);
    }
    ctx.lineTo(v.x0 - 50, yBot + 26); ctx.closePath(); ctx.fill();
    ctx.beginPath(); started = false;
    for (let y = yTop; y <= yBot + 26; y += 26) {
      const x = cam.x + (wallR(y * 1.3 + 400) * .92 + WORLD_W * .08 - cam.x) * par;
      if (!started) { ctx.moveTo(v.x1 + 50, y); started = true; }
      ctx.lineTo(x - 60, y);
    }
    ctx.lineTo(v.x1 + 50, yBot + 26); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /* main walls */
  for (const side of [0, 1]) {
    ctx.beginPath();
    let first = true;
    for (let y = yTop; y <= yBot + 26; y += 26) {
      const x = side === 0 ? wallL(y) : wallR(y);
      if (first) { ctx.moveTo(side === 0 ? v.x0 - 60 : v.x1 + 60, yTop); ctx.lineTo(x, yTop); first = false; }
      ctx.lineTo(x, y);
    }
    ctx.lineTo(side === 0 ? v.x0 - 60 : v.x1 + 60, yBot + 26);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, yTop, 0, yBot);
    g.addColorStop(0, rockColor(yTop)); g.addColorStop(1, rockColor(yBot));
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 3; ctx.stroke();
  }
  /* the sea floor */
  if (v.y1 > WORLD_BOTTOM - 200) {
    ctx.fillStyle = '#131c33';
    ctx.beginPath();
    ctx.moveTo(v.x0 - 60, WORLD_BOTTOM + 200);
    for (let x = Math.max(0, v.x0); x <= Math.min(WORLD_W, v.x1) + 40; x += 40)
      ctx.lineTo(x, WORLD_BOTTOM - 20 + Math.sin(x * .01) * 14 - (Math.abs(x - POI.saucer.x) < 240 ? -34 : 0));
    ctx.lineTo(v.x1 + 60, WORLD_BOTTOM + 200);
    ctx.closePath(); ctx.fill();
  }
}

function drawLedge(l) {
  const x = l.x, y = l.y, w = l.w;
  if (l.kind === 'wreck') { drawWreck(l); return; }
  const h = 30;
  /* rock slab */
  const g = ctx.createLinearGradient(0, y, 0, y + h + 26);
  g.addColorStop(0, rockColor(y)); g.addColorStop(1, rockColor(y, true));
  ctx.fillStyle = g;
  rr(ctx, x - 8, y, w + 16, h, 14); ctx.fill();
  /* dangling rock bumps */
  ctx.beginPath();
  for (let i = 0; i < w / 46; i++) {
    const bx = x + 14 + i * 46 + Math.sin(i * 7 + x) * 8;
    ctx.moveTo(bx, y + h - 4);
    ctx.arc(bx, y + h - 4, 12 + Math.sin(i * 3 + x * .1) * 5, 0, Math.PI);
  }
  ctx.fill();
  /* surface topping */
  ctx.fillStyle = topColor(y);
  rr(ctx, x - 8, y - 3, w + 16, 10, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  rr(ctx, x - 4, y - 3, w + 8, 3, 2); ctx.fill();
}

function drawWreck(l) {
  const cx2 = l.x + l.w / 2, y = l.y;
  ctx.save(); ctx.translate(cx2, y);
  /* hull */
  ctx.fillStyle = '#5b4130';
  ctx.beginPath();
  ctx.moveTo(-l.w / 2, 0);
  ctx.quadraticCurveTo(-l.w / 2 + 30, 84, 0, 92);
  ctx.quadraticCurveTo(l.w / 2 - 30, 84, l.w / 2, -14);
  ctx.lineTo(l.w / 2 - 24, -18); ctx.lineTo(-l.w / 2, 4);
  ctx.closePath(); ctx.fill();
  /* planks */
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 3;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(-l.w / 2 + 12, i * 20);
    ctx.quadraticCurveTo(0, i * 20 + 16, l.w / 2 - 16, i * 18 - 10); ctx.stroke();
  }
  /* deck */
  ctx.fillStyle = '#7a5a3d';
  rr(ctx, -l.w / 2, -8, l.w, 12, 5); ctx.fill();
  /* broken masts */
  ctx.fillStyle = '#4a3526';
  ctx.save(); ctx.rotate(-.18); ctx.fillRect(-l.w / 4 - 7, -150, 14, 146); ctx.restore();
  ctx.save(); ctx.translate(l.w / 4, -8); ctx.rotate(.5); ctx.fillRect(-6, -90, 12, 92); ctx.restore();
  /* tattered flag */
  ctx.fillStyle = '#2b2b33';
  ctx.beginPath();
  const fx = -l.w / 4 - 27 , fy = -150 + 6;
  ctx.moveTo(fx + 22, fy);
  ctx.quadraticCurveTo(fx + 60 + Math.sin(now * 2) * 8, fy + 12, fx + 22 + 52, fy + 26);
  ctx.lineTo(fx + 22, fy + 20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8e8e8';
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('☠', fx + 44, fy + 17);
  /* portholes */
  for (let i = -1; i <= 1; i++) {
    ctx.fillStyle = '#20303c';
    ctx.beginPath(); ctx.arc(i * 90, 40, 11, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();
}

/* ── ruins (lost city) ── */
function drawRuin(ru) {
  const fixed = ruinsFixed[ru.i];
  ctx.save(); ctx.translate(ru.x, ru.y);
  /* pedestal */
  ctx.fillStyle = '#5a6d94'; rr(ctx, -80, -10, 160, 22, 8); ctx.fill();
  ctx.fillStyle = '#48597c'; rr(ctx, -66, -22, 132, 14, 6); ctx.fill();
  if (fixed) {
    /* restored monument: arch with glowing crystal */
    ctx.fillStyle = '#7d92bd';
    rr(ctx, -58, -118, 20, 98, 6); ctx.fill();
    rr(ctx, 38, -118, 20, 98, 6); ctx.fill();
    rr(ctx, -66, -134, 132, 24, 10); ctx.fill();
    const pulse = .6 + Math.sin(now * 3 + ru.i) * .4;
    ctx.fillStyle = `rgba(120,255,230,${.5 + pulse * .4})`;
    ctx.beginPath(); ctx.arc(0, -74, 15 + pulse * 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#eafffa';
    ctx.beginPath(); ctx.arc(0, -74, 8, 0, TAU); ctx.fill();
  } else {
    /* broken columns + rubble */
    ctx.fillStyle = '#68799e';
    ctx.save(); ctx.rotate(-.08); rr(ctx, -58, -86, 20, 66, 6); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(44, -20); ctx.rotate(.6); rr(ctx, -10, -52, 20, 52, 6); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#55658a';
    ctx.beginPath(); ctx.arc(-6, -26, 14, 0, TAU); ctx.arc(16, -20, 10, 0, TAU); ctx.fill();
    /* faint sad glow */
    ctx.fillStyle = `rgba(120,255,230,${.25 + Math.sin(now * 2) * .1})`;
    ctx.beginPath(); ctx.arc(0, -40, 6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ── the saucer ── */
function drawSaucer(x, y, stage, flying) {
  ctx.save(); ctx.translate(x, y);
  if (!flying) ctx.rotate(stage >= 3 ? Math.sin(now * 1.4) * .03 : -.09);
  const hover = stage >= 3 && !flying ? Math.sin(now * 2) * 6 - 8 : 0;
  ctx.translate(0, hover);
  /* glow under when powered */
  if (stage >= 2) {
    const p = .5 + Math.sin(now * 5) * .3;
    ctx.fillStyle = `rgba(120,255,160,${.14 + p * .12})`;
    ctx.beginPath(); ctx.ellipse(0, 44, 120, 34, 0, 0, TAU); ctx.fill();
  }
  /* dish */
  const g = ctx.createLinearGradient(0, -8, 0, 46);
  g.addColorStop(0, '#cdd8e4'); g.addColorStop(.5, '#93a5b8'); g.addColorStop(1, '#5c6b7e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 18, 128, 40, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, 8, 116, 26, 0, Math.PI, TAU); ctx.stroke();
  /* dome */
  ctx.fillStyle = stage >= 2 ? 'rgba(150,240,190,.85)' : 'rgba(140,170,200,.6)';
  ctx.beginPath(); ctx.arc(0, -6, 52, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(-18, -26, 12, 0, TAU); ctx.fill();
  /* rim lights */
  for (let i = -3; i <= 3; i++) {
    const on = stage >= 3 ? (Math.floor(now * 4 + i) % 3 === 0) : stage >= 2 && i % 2 === 0;
    ctx.fillStyle = on ? '#aaffcf' : '#3d4a58';
    ctx.beginPath(); ctx.ellipse(i * 34, 30, 9, 7, 0, 0, TAU); ctx.fill();
  }
  /* hull cracks until stage 1 */
  if (stage < 1) {
    ctx.strokeStyle = '#3a444f'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-70, 16); ctx.lineTo(-46, 28); ctx.lineTo(-58, 40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(50, 8); ctx.lineTo(72, 22); ctx.stroke();
    ctx.fillStyle = '#3a444f';
    ctx.beginPath(); ctx.ellipse(28, 34, 16, 8, .3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ── crates ── */
function drawCrate(c) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.sin(c.t * 1.5) * .06);
  ctx.fillStyle = '#c98f3f'; rr(ctx, -20, -18, 40, 36, 6); ctx.fill();
  ctx.fillStyle = '#a06d28'; rr(ctx, -20, -6, 40, 8, 2); ctx.fill();
  ctx.strokeStyle = '#7e5015'; ctx.lineWidth = 3; rr(ctx, -20, -18, 40, 36, 6); ctx.stroke();
  ctx.fillStyle = '#ffe9a3';
  ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('★', 0, 1);
  /* sparkle */
  const s = Math.sin(now * 5 + c.x) * .5 + .5;
  ctx.fillStyle = `rgba(255,255,210,${s * .9})`;
  ctx.beginPath(); ctx.arc(14, -14, 2.5 + s * 2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ── harvest nodes ── */
function drawNode(nd) {
  if (nd.dead) return;
  const frac = nd.hp / nd.maxhp;
  ctx.save(); ctx.translate(nd.x, nd.y);
  if (nd.kind === 'kelp') {
    const hgt = 46 + frac * 40;
    ctx.strokeStyle = '#3f9b47'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let s = -1; s <= 1; s++) {
      ctx.beginPath(); ctx.moveTo(s * 7, 0);
      for (let seg = 1; seg <= 4; seg++) {
        const yy = -hgt * seg / 4;
        ctx.lineTo(s * 7 + Math.sin(now * 1.8 + nd.ph + seg + s) * (5 + seg * 3), yy);
      }
      ctx.stroke();
    }
    ctx.fillStyle = '#54c25e';
    for (let s = -1; s <= 1; s++) {
      const tx = s * 7 + Math.sin(now * 1.8 + nd.ph + 4 + s) * 17;
      ctx.beginPath(); ctx.ellipse(tx, -hgt, 7, 12, Math.sin(now + s) * .4, 0, TAU); ctx.fill();
    }
  } else if (nd.kind === 'stone') {
    ctx.fillStyle = '#8d9aa8';
    ctx.beginPath(); ctx.arc(-8, -10 * frac, 13 * frac + 5, 0, TAU); ctx.arc(9, -7 * frac, 10 * frac + 4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(-11, -13 * frac, 4, 0, TAU); ctx.fill();
  } else if (nd.kind === 'scrap') {
    ctx.fillStyle = '#96794f';
    ctx.beginPath(); ctx.arc(0, -8, 15 * frac + 4, 0, Math.PI, true); ctx.fill();
    ctx.fillStyle = '#c2c8ce';
    gearShape(ctx, -8, -16 * frac, 8, 6);
    gearShape(ctx, 8, -10 * frac, 6, 6);
  } else if (nd.kind === 'glow') {
    const p = .6 + Math.sin(now * 3 + nd.ph) * .4;
    ctx.fillStyle = `rgba(140,255,190,${.35 + p * .3})`;
    ctx.beginPath(); ctx.arc(0, -12, 16 + p * 5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b6ffd2';
    ctx.beginPath(); ctx.arc(0, -12, 8 * frac + 3, 0, TAU); ctx.fill();
  } else if (nd.kind === 'crystal') {
    ctx.fillStyle = '#b98fff';
    for (const [dx, h, w2] of [[-10, 26, 8], [2, 38, 10], [13, 20, 7]]) {
      ctx.beginPath();
      ctx.moveTo(dx - w2 * frac, 0); ctx.lineTo(dx, -h * frac - 6); ctx.lineTo(dx + w2 * frac, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.moveTo(2, -38 * frac - 6); ctx.lineTo(5, -20); ctx.lineTo(-1, -18); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function gearShape(c, x, y, r, teeth) {
  c.save(); c.translate(x, y);
  c.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const rr2 = i % 2 ? r : r * .7, a = i / (teeth * 2) * TAU;
    c.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
  }
  c.closePath(); c.fill();
  c.restore();
}

/* ── decorations ── */
function drawDeco(d) {
  ctx.save(); ctx.translate(d.x, d.y); ctx.scale(d.flip ? -d.s : d.s, d.s);
  switch (d.kind) {
    case 'coral':
      ctx.strokeStyle = ['#ff7f6b', '#ff9d5c', '#f76fa0'][(d.ph * 10 | 0) % 3];
      ctx.lineWidth = 7; ctx.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(i * 6, 0);
        ctx.quadraticCurveTo(i * 14, -18, i * 18 + Math.sin(now + d.ph) * 2, -34 - Math.abs(i) * -8);
        ctx.stroke();
      }
      break;
    case 'shell':
      ctx.fillStyle = '#ffd9e8';
      ctx.beginPath(); ctx.arc(0, -6, 10, Math.PI, TAU); ctx.fill();
      ctx.strokeStyle = '#e8a0bc'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(0, -16); ctx.moveTo(6, -8); ctx.lineTo(0, -16); ctx.stroke();
      break;
    case 'bigkelp':
      ctx.strokeStyle = 'rgba(46,124,58,.85)'; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0);
      for (let seg = 1; seg <= 6; seg++)
        ctx.lineTo(Math.sin(now * 1.2 + d.ph + seg * .8) * (6 + seg * 5), -seg * 34);
      ctx.stroke();
      break;
    case 'fan':
      ctx.fillStyle = 'rgba(180,120,220,.55)';
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-38, -30, -20 + Math.sin(now + d.ph) * 3, -52);
      ctx.quadraticCurveTo(0, -40, 20 + Math.sin(now + d.ph) * 3, -52);
      ctx.quadraticCurveTo(38, -30, 0, 0); ctx.fill();
      break;
    case 'glowshroom': {
      const p = .5 + Math.sin(now * 2.4 + d.ph) * .5;
      ctx.fillStyle = '#7e8fae'; rr(ctx, -3, -18, 6, 18, 3); ctx.fill();
      ctx.fillStyle = `rgba(110,220,255,${.55 + p * .35})`;
      ctx.beginPath(); ctx.arc(0, -20, 12, Math.PI, TAU); ctx.fill();
      break; }
    case 'vent': {
      ctx.fillStyle = '#4a3a3d';
      ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-9, -46); ctx.lineTo(9, -46); ctx.lineTo(20, 0); ctx.closePath(); ctx.fill();
      const p = .5 + Math.sin(now * 6 + d.ph) * .5;
      ctx.fillStyle = `rgba(255,140,50,${.5 + p * .5})`;
      ctx.beginPath(); ctx.ellipse(0, -46, 8, 5 + p * 4, 0, 0, TAU); ctx.fill();
      if (Math.random() < .1)
        particles.push({ x: d.x + rnd(-5, 5), y: d.y - 48, vx: rnd(-6, 6), vy: rnd(-70, -40), life: 0,
          maxlife: rnd(.6, 1.4), kind: 'ember', size: rnd(2, 4), hue: rnd(18, 40) });
      break; }
    case 'column':
      ctx.fillStyle = '#7386ac';
      rr(ctx, -9, -60, 18, 60, 4); ctx.fill();
      rr(ctx, -14, -66, 28, 9, 3); ctx.fill();
      rr(ctx, -14, -4, 28, 8, 3); ctx.fill();
      break;
    case 'rock':
      ctx.fillStyle = shade(rockColor(d.y), -.12);
      ctx.beginPath(); ctx.arc(0, -7, 12, 0, TAU); ctx.arc(10, -4, 8, 0, TAU); ctx.fill();
      break;
    case 'wallglow': {
      const p = .5 + Math.sin(now * 2 + d.ph) * .5;
      ctx.fillStyle = `rgba(90,220,255,${.35 + p * .4})`;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(i * 9, i * 12 - 10, 3.5 + p * 1.5, 0, TAU); ctx.fill(); }
      break; }
  }
  ctx.restore();
}

/* ── home buoy at the surface ── */
function drawBuoy() {
  const x = POI.buoy.x, y = Math.sin(now * 1.3) * 5;
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(now * 1.1) * .07);
  ctx.fillStyle = '#e85d4a';
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 26, -.6, .6); ctx.arc(0, 0, 14, .6, -.6, true); ctx.fill();
  ctx.fillStyle = '#c9c9c9'; ctx.fillRect(-3, -52, 6, 30);
  ctx.fillStyle = '#ffd85e';
  ctx.beginPath(); ctx.moveTo(3, -52); ctx.lineTo(34, -44); ctx.lineTo(3, -36); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ═══════════ RENDER — buildings (also reused for menu icons) ═══════════ */
function drawBuilding(c, key, t, active) {
  /* drawn with origin at ledge surface, building rises upward. width ≈ 80 */
  const A = active !== false;
  const bob = Math.sin(t * 2) * 1.5;
  switch (key) {
    case 'bubbledome': {
      c.fillStyle = 'rgba(150,220,255,.35)';
      c.beginPath(); c.arc(0, -6, 34, Math.PI, TAU); c.fill();
      c.strokeStyle = 'rgba(220,245,255,.8)'; c.lineWidth = 3;
      c.beginPath(); c.arc(0, -6, 34, Math.PI, TAU); c.stroke();
      c.fillStyle = '#f2b46b'; rr(c, -26, -8, 52, 8, 3); c.fill();
      c.fillStyle = '#ff8c5a'; rr(c, -10, -30, 20, 24, 8); c.fill();     // little house inside
      c.fillStyle = '#ffe9a3'; c.beginPath(); c.arc(0, -20, 4, 0, TAU); c.fill();
      break; }
    case 'kelpfarm': {
      c.fillStyle = '#8a6a45'; rr(c, -34, -8, 68, 8, 3); c.fill();
      c.strokeStyle = '#46b050'; c.lineWidth = 5; c.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        c.beginPath(); c.moveTo(i * 13, -6);
        c.quadraticCurveTo(i * 13 + Math.sin(t * 2 + i) * 6, -26, i * 13 + Math.sin(t * 2 + i) * 10, -42 - (i % 2) * 8);
        c.stroke();
      }
      break; }
    case 'rockcracker': {
      c.fillStyle = '#6b7885'; rr(c, -28, -34, 56, 34, 6); c.fill();
      const jaw = A ? Math.abs(Math.sin(t * 3)) * 10 : 2;
      c.fillStyle = '#48525c'; rr(c, -20, -52 + jaw, 40, 16, 4); c.fill();
      c.fillStyle = '#dce4ea';
      for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(i * 12 - 4, -36 + jaw); c.lineTo(i * 12, -28 + jaw); c.lineTo(i * 12 + 4, -36 + jaw); c.fill(); }
      c.fillStyle = '#8d9aa8'; c.beginPath(); c.arc(0, -12, 9, 0, TAU); c.fill();
      break; }
    case 'snackshack': {
      c.fillStyle = '#e8b34b'; rr(c, -30, -34, 60, 34, 5); c.fill();
      c.fillStyle = '#7ec9e8'; rr(c, -20, -26, 40, 12, 3); c.fill();
      c.fillStyle = '#d1543f';
      c.beginPath(); c.moveTo(-38, -34); c.lineTo(0, -56); c.lineTo(38, -34); c.closePath(); c.fill();
      /* taco sign */
      c.save(); c.translate(0, -62 + bob); c.rotate(Math.sin(t * 1.5) * .1);
      c.fillStyle = '#ffd85e'; c.beginPath(); c.arc(0, 0, 11, .15 * Math.PI, .85 * Math.PI, true); c.fill();
      c.fillStyle = '#5fae4c'; c.beginPath(); c.arc(0, -1, 8, Math.PI, TAU); c.fill();
      c.restore();
      break; }
    case 'gearstation': {
      c.fillStyle = '#3e6a8a'; rr(c, -30, -46, 60, 46, 7); c.fill();
      c.fillStyle = A ? '#8ff0d4' : '#44585f'; rr(c, -20, -38, 40, 16, 4); c.fill();
      c.fillStyle = '#0a3245';
      c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.fillText('GEAR', 0, -26);
      /* helmet on a peg */
      c.fillStyle = '#ffd85e'; c.beginPath(); c.arc(0, -56 + bob, 10, 0, TAU); c.fill();
      c.fillStyle = '#9fe8ff'; c.beginPath(); c.arc(2, -56 + bob, 5, 0, TAU); c.fill();
      break; }
    case 'clamranch': {
      c.strokeStyle = '#b08a5a'; c.lineWidth = 4;
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 16, 0); c.lineTo(i * 16, -18); c.stroke(); }
      c.beginPath(); c.moveTo(-34, -14); c.lineTo(34, -14); c.stroke();
      const open = A ? (Math.sin(t * 2) * .5 + .5) : .1;
      for (const dx of [-16, 8]) {
        c.fillStyle = '#c9a0d8';
        c.beginPath(); c.arc(dx, -4, 11, Math.PI, TAU); c.fill();
        c.save(); c.translate(dx, -4); c.rotate(-open * .8);
        c.beginPath(); c.arc(0, 0, 11, Math.PI, TAU); c.fillStyle = '#e0bce8'; c.fill(); c.restore();
        if (open > .5) { c.fillStyle = '#fff'; c.beginPath(); c.arc(dx, -7, 3, 0, TAU); c.fill(); }
      }
      break; }
    case 'coralcondo': {
      c.fillStyle = '#f2739b'; rr(c, -20, -78, 40, 78, 9); c.fill();
      c.fillStyle = '#ff9d5c'; rr(c, -26, -46, 52, 12, 6); c.fill();
      c.fillStyle = '#ffe9a3';
      for (let fy = -68; fy <= -20; fy += 16) for (const fx of [-10, 6])
        rr(c, fx, fy, 8, 9, 3), c.fill();
      c.fillStyle = '#5fae4c';
      c.beginPath(); c.arc(0, -82, 9, Math.PI, TAU); c.fill();
      break; }
    case 'crabcafe': {
      c.fillStyle = '#d16a4a'; rr(c, -30, -32, 60, 32, 6); c.fill();
      c.fillStyle = '#ffe9a3'; rr(c, -22, -24, 20, 12, 3); c.fill();
      c.fillStyle = '#a34a30'; rr(c, -34, -40, 68, 10, 4); c.fill();
      /* chef crab on the roof */
      const wave = Math.sin(t * 4) * .5;
      c.save(); c.translate(12, -48 + bob);
      c.fillStyle = '#ff5f4a'; c.beginPath(); c.ellipse(0, 0, 11, 8, 0, 0, TAU); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-4, -4, 2.6, 0, TAU); c.arc(4, -4, 2.6, 0, TAU); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(-4, -4, 1.2, 0, TAU); c.arc(4, -4, 1.2, 0, TAU); c.fill();
      c.strokeStyle = '#ff5f4a'; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(9, -2); c.quadraticCurveTo(16, -8 - wave * 8, 18, -12 - wave * 8); c.stroke();
      c.fillStyle = '#fff'; rr(c, -6, -16, 12, 8, 3); c.fill();   // chef hat
      c.restore();
      break; }
    case 'scrapyard': {
      c.fillStyle = '#96794f';
      c.beginPath(); c.arc(-10, -8, 16, Math.PI, TAU); c.arc(14, -6, 11, Math.PI, TAU); c.fill();
      c.fillStyle = '#c2c8ce';
      gearShape(c, -16, -22, 9, 6); gearShape(c, 4, -14, 7, 6);
      c.fillStyle = '#7d8894'; rr(c, 20, -44, 8, 40, 3); c.fill();
      const swing = A ? Math.sin(t * 1.5) * .3 : 0;
      c.save(); c.translate(24, -44); c.rotate(swing);
      c.fillStyle = '#7d8894'; rr(c, -26, -6, 26, 6, 2); c.fill();
      c.strokeStyle = '#4a545e'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-24, 0); c.lineTo(-24, 14); c.stroke();
      c.fillStyle = '#e8b34b'; c.beginPath(); c.arc(-24, 18, 5, 0, TAU); c.fill();
      c.restore();
      break; }
    case 'eelpen': {
      c.fillStyle = 'rgba(140,220,255,.25)'; rr(c, -32, -44, 64, 44, 8); c.fill();
      c.strokeStyle = 'rgba(220,245,255,.7)'; c.lineWidth = 3; rr(c, -32, -44, 64, 44, 8); c.stroke();
      /* eel */
      c.strokeStyle = '#d8e84b'; c.lineWidth = 6; c.lineCap = 'round';
      c.beginPath();
      for (let i = 0; i <= 8; i++) {
        const ex = -22 + i * 5.5, ey = -22 + Math.sin(t * (A ? 5 : 1) + i * .9) * 8;
        i ? c.lineTo(ex, ey) : c.moveTo(ex, ey);
      }
      c.stroke();
      c.fillStyle = '#000'; c.beginPath(); c.arc(22, -22 + Math.sin(t * (A ? 5 : 1) + 7.2) * 8 - 1, 1.5, 0, TAU); c.fill();
      if (A && Math.sin(t * 5) > .8) {
        c.strokeStyle = '#fffb8f'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(-10, -40); c.lineTo(-4, -32); c.lineTo(-10, -26); c.stroke();
      }
      break; }
    case 'glowlamp': {
      c.fillStyle = '#5d6b7a'; rr(c, -4, -52, 8, 52, 3); c.fill();
      rr(c, -12, -6, 24, 6, 2); c.fill();
      const p = A ? .7 + Math.sin(t * 3) * .3 : .1;
      c.fillStyle = `rgba(255,238,150,${.25 + p * .3})`;
      c.beginPath(); c.arc(0, -60, 20 + p * 4, 0, TAU); c.fill();
      c.fillStyle = A ? '#fff3b0' : '#6a7683';
      c.beginPath(); c.arc(0, -60, 10, 0, TAU); c.fill();
      break; }
    case 'bubblevator': {
      c.fillStyle = 'rgba(140,220,255,.22)'; rr(c, -18, -84, 36, 84, 16); c.fill();
      c.strokeStyle = 'rgba(220,245,255,.75)'; c.lineWidth = 3; rr(c, -18, -84, 36, 84, 16); c.stroke();
      c.fillStyle = '#3e6a8a'; rr(c, -22, -8, 44, 8, 3); c.fill(); rr(c, -22, -90, 44, 8, 3); c.fill();
      for (let i = 0; i < 4; i++) {
        const by = -((t * 40 + i * 22) % 76) - 6;
        c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2;
        c.beginPath(); c.arc(Math.sin(i * 2.4) * 8, by, 4 + (i % 3), 0, TAU); c.stroke();
      }
      break; }
    case 'glowgarden': {
      c.fillStyle = '#4a5a74'; rr(c, -34, -8, 68, 8, 4); c.fill();
      for (let i = -2; i <= 2; i++) {
        const p = .5 + Math.sin(t * 2.5 + i * 1.3) * .5;
        c.strokeStyle = '#5fae7c'; c.lineWidth = 4; c.lineCap = 'round';
        c.beginPath(); c.moveTo(i * 14, -6); c.quadraticCurveTo(i * 14 + 3, -18, i * 14 + Math.sin(t + i) * 4, -26 - (i % 2) * 8); c.stroke();
        c.fillStyle = `rgba(140,255,190,${.5 + p * .5})`;
        c.beginPath(); c.arc(i * 14 + Math.sin(t + i) * 4, -28 - (i % 2) * 8, 5 + p * 2, 0, TAU); c.fill();
      }
      break; }
    case 'jellydisco': {
      c.fillStyle = 'rgba(180,140,255,.3)';
      c.beginPath(); c.arc(0, -8, 36, Math.PI, TAU); c.fill();
      c.strokeStyle = 'rgba(220,200,255,.8)'; c.lineWidth = 3;
      c.beginPath(); c.arc(0, -8, 36, Math.PI, TAU); c.stroke();
      c.fillStyle = '#5a4a8a'; rr(c, -40, -10, 80, 10, 4); c.fill();
      /* disco ball */
      const hue = (t * 120) % 360;
      c.fillStyle = A ? `hsl(${hue},80%,70%)` : '#8a8a9a';
      c.beginPath(); c.arc(0, -30, 8, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(0, -38); c.lineTo(0, -42); c.stroke();
      /* dancing jelly */
      if (A) {
        const jy = -14 + Math.sin(t * 6) * 4;
        c.fillStyle = `hsla(${(hue + 180) % 360},80%,75%,.9)`;
        c.beginPath(); c.arc(14, jy, 7, Math.PI, TAU); c.fill();
        c.strokeStyle = c.fillStyle; c.lineWidth = 2;
        for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(14 + i * 4, jy); c.lineTo(14 + i * 5, jy + 8 + Math.sin(t * 8 + i) * 2); c.stroke(); }
      }
      break; }
    case 'tacocannon': {
      c.fillStyle = '#5d6b7a';
      c.beginPath(); c.arc(-10, -10, 12, 0, TAU); c.fill();
      c.save(); c.translate(-10, -12); c.rotate(-.7 + Math.sin(t) * .06);
      const g2 = c.createLinearGradient(0, -8, 0, 8);
      g2.addColorStop(0, '#8d9aa8'); g2.addColorStop(1, '#5d6b7a');
      c.fillStyle = g2; rr(c, 0, -9, 44, 18, 8); c.fill();
      c.fillStyle = '#ffd85e'; c.beginPath(); c.arc(46, 0, 7, .15 * Math.PI, .85 * Math.PI, true); c.fill();
      c.restore();
      c.fillStyle = '#48525c'; c.beginPath(); c.arc(-10, -6, 5, 0, TAU); c.fill();
      break; }
    case 'ventturbine': {
      c.fillStyle = '#4a3a3d';
      c.beginPath(); c.moveTo(-16, 0); c.lineTo(-7, -26); c.lineTo(7, -26); c.lineTo(16, 0); c.closePath(); c.fill();
      c.save(); c.translate(0, -44); c.rotate(A ? t * 4 : .3);
      c.fillStyle = '#c2c8ce';
      for (let i = 0; i < 4; i++) { c.rotate(TAU / 4); c.beginPath(); c.ellipse(0, -13, 5, 13, 0, 0, TAU); c.fill(); }
      c.fillStyle = '#ffd85e'; c.beginPath(); c.arc(0, 0, 5, 0, TAU); c.fill();
      c.restore();
      const p = .5 + Math.sin(t * 6) * .5;
      c.fillStyle = `rgba(255,140,50,${.3 + p * .4})`;
      c.beginPath(); c.ellipse(0, -27, 6, 4 + p * 3, 0, 0, TAU); c.fill();
      break; }
    case 'crystaldrill': {
      c.fillStyle = '#5d6b7a';
      c.beginPath(); c.moveTo(-26, 0); c.lineTo(0, -52); c.lineTo(26, 0); c.closePath(); c.fill();
      c.strokeStyle = '#3d4750'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-13, -26); c.lineTo(13, -26); c.stroke();
      const spin = A ? t * 10 : 0;
      c.save(); c.translate(0, -14);
      c.fillStyle = '#dce4ea';
      c.beginPath();
      for (let i = 0; i < 3; i++) { const a = spin + i * TAU / 3; c.lineTo(Math.cos(a) * 9, -Math.abs(Math.sin(a) * 4) + 4); }
      c.closePath(); c.fill();
      c.restore();
      c.fillStyle = '#b98fff';
      c.beginPath(); c.moveTo(-18, 0); c.lineTo(-13, -12); c.lineTo(-8, 0); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(8, 0); c.lineTo(14, -15); c.lineTo(20, 0); c.closePath(); c.fill();
      break; }
    case 'hotspring': {
      c.fillStyle = '#8d9aa8';
      c.beginPath(); c.ellipse(0, -8, 34, 13, 0, 0, TAU); c.fill();
      c.fillStyle = '#67e8f0';
      c.beginPath(); c.ellipse(0, -9, 27, 9, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,.5)';
      for (let i = 0; i < 3; i++) {
        const by = -14 - ((t * 26 + i * 17) % 34);
        c.beginPath(); c.arc(-12 + i * 12, by, 3 + i, 0, TAU); c.fill();
      }
      /* happy soaker */
      c.fillStyle = '#ffcf9f'; c.beginPath(); c.arc(8, -16 + Math.sin(t * 2) * 1.5, 6, 0, TAU); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(6, -17, 1, 0, TAU); c.arc(10, -17, 1, 0, TAU); c.fill();
      break; }
  }
  if (!A) {
    c.fillStyle = 'rgba(20,30,40,.45)'; c.beginPath(); c.arc(0, -30, 40, 0, TAU); c.fill();
    c.fillStyle = '#ffd85e'; c.font = 'bold 18px sans-serif'; c.textAlign = 'center';
    c.fillText('⚡?', 0, -26);
  }
}

function drawBuildings(v) {
  for (const b of buildings) {
    const l = ledges[b.ledge], x = l.slots[b.slot].x, y = l.y;
    if (x < v.x0 - 100 || x > v.x1 + 100 || y < v.y0 - 140 || y > v.y1 + 140) continue;
    ctx.save(); ctx.translate(x, y + (l.kind === 'wreck' ? -8 : 0));
    drawBuilding(ctx, b.key, b.t, b.active);
    ctx.restore();
    /* ambient bubbles from homes */
    if (BLD[b.key].pop && Math.random() < .01)
      particles.push({ x: x + rnd(-14, 14), y: y - 40, vx: 0, vy: rnd(-40, -25), life: 0, maxlife: rnd(.8, 1.6), kind: 'bubble', size: rnd(2, 4), hue: 0 });
  }
}

/* menu icons: render each building into its little canvas */
function drawMenuIcons() {
  document.querySelectorAll('#panel canvas[data-bld]').forEach(cv => {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, 104, 104);
    c.save(); c.translate(52, 88); c.scale(.85, .85);
    drawBuilding(c, cv.dataset.bld, 1.2, true);
    c.restore();
  });
}

/* ═══════════ RENDER — critters, friends, the captain ═══════════ */
function drawFish(x, y, s, hue, ph, dir) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir * s, s);
  const wig = Math.sin(now * 8 + ph);
  ctx.fillStyle = `hsl(${hue},70%,60%)`;
  ctx.beginPath(); ctx.ellipse(0, 0, 11, 6.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(-16, -5 + wig * 2.5); ctx.lineTo(-16, 5 + wig * 2.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `hsl(${hue + 30},70%,72%)`;
  ctx.beginPath(); ctx.ellipse(2, -2, 5, 3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(6, -1.5, 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6.8, -1.5, 1.2, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawSchool(f, v) {
  if (f.x < v.x0 - 200 || f.x > v.x1 + 200 || f.y < v.y0 - 100 || f.y > v.y1 + 100) return;
  const dir = f.vx > 0 ? 1 : -1;
  for (let i = 0; i < f.n; i++) {
    const ox = -dir * (i % 3) * 24 - dir * (i / 3 | 0) * 18;
    const oy = ((i * 37) % 5 - 2) * 14 + Math.sin(now * 2 + f.ph + i) * 6;
    drawFish(f.x + ox, f.y + oy, .9 + (i % 3) * .15, f.hue + i * 6, f.ph + i, dir);
  }
}
function drawJelly(j, v) {
  if (j.x < v.x0 - 60 || j.x > v.x1 + 60 || j.y < v.y0 - 80 || j.y > v.y1 + 80) return;
  const p = Math.sin(now * 2.2 + j.ph) * .5 + .5;
  ctx.save(); ctx.translate(j.x, j.y);
  ctx.fillStyle = `hsla(${j.hue},80%,72%,.55)`;
  ctx.beginPath(); ctx.ellipse(0, 0, 13 + p * 3, 11 - p * 2, 0, Math.PI, TAU); ctx.fill();
  ctx.strokeStyle = `hsla(${j.hue},80%,80%,.5)`; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i * 5, 0);
    ctx.quadraticCurveTo(i * 5 + Math.sin(now * 3 + i + j.ph) * 4, 10, i * 6 + Math.sin(now * 3 + i * 2 + j.ph) * 6, 20 + p * 4);
    ctx.stroke();
  }
  ctx.restore();
}
function drawCrab(cb) {
  const l = ledges[cb.li]; if (!l) return;
  const x = l.x + cb.sx * l.w, y = l.y - 4;
  ctx.save(); ctx.translate(x, y);
  const step = Math.sin(now * 10) * 2;
  ctx.fillStyle = '#ff6b52';
  ctx.beginPath(); ctx.ellipse(0, -6, 10, 7, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#ff6b52'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(s * 7, -4 - i * 2);
    ctx.lineTo(s * (13 + i * 2), 0 + (i === 1 ? step * s : -step * s) * .5); ctx.stroke();
  }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3, -11, 2.6, 0, TAU); ctx.arc(3, -11, 2.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-3, -11, 1.2, 0, TAU); ctx.arc(3, -11, 1.2, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawBlubAt(x, y, big) {
  ctx.save(); ctx.translate(x, y);
  const s = big ? 1.25 : .9, wig = Math.sin(now * 3);
  ctx.scale(s * (pet.on && pet.vx < -6 ? -1 : 1), s);
  /* lure */
  ctx.strokeStyle = '#8fa4b8'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(2, -14); ctx.quadraticCurveTo(10, -30, 18, -26 + wig * 2); ctx.stroke();
  const p = .6 + Math.sin(now * 4) * .4;
  ctx.fillStyle = `rgba(160,240,255,${.5 + p * .5})`;
  ctx.beginPath(); ctx.arc(18, -26 + wig * 2, 6 + p * 2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#eafcff'; ctx.beginPath(); ctx.arc(18, -26 + wig * 2, 3, 0, TAU); ctx.fill();
  /* body */
  ctx.fillStyle = '#4a5f8a';
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-24, -7 + wig * 3); ctx.lineTo(-24, 7 + wig * 3); ctx.closePath(); ctx.fill();
  /* giant googly eyes */
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -4, 6.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6.5, -4, 3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7.5, -5, 1.2, 0, TAU); ctx.fill();
  /* big happy mouth */
  ctx.strokeStyle = '#2b3a55'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(6, 3, 7, .1 * Math.PI, .8 * Math.PI); ctx.stroke();
  /* stubby teeth (friendly!) */
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(3, 8); ctx.lineTo(5, 11); ctx.lineTo(7, 8); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawWhale(v) {
  if (!whale.on) return;
  if (whale.x < v.x0 - 400 || whale.x > v.x1 + 400 || whale.y < v.y0 - 250 || whale.y > v.y1 + 250) return;
  ctx.save(); ctx.translate(whale.x, whale.y); ctx.scale(whale.dir, 1);
  const wig = Math.sin(whale.t * 1.6);
  ctx.fillStyle = '#5b7fa6';
  ctx.beginPath();
  ctx.moveTo(150, -10);
  ctx.quadraticCurveTo(80, -75, -60, -55);
  ctx.quadraticCurveTo(-160, -38, -190, 0 + wig * 8);
  ctx.quadraticCurveTo(-160, 30, -60, 42);
  ctx.quadraticCurveTo(80, 52, 150, 18);
  ctx.quadraticCurveTo(170, 4, 150, -10);
  ctx.closePath(); ctx.fill();
  /* tail */
  ctx.beginPath();
  ctx.moveTo(-180, 0 + wig * 8);
  ctx.quadraticCurveTo(-230, -34 + wig * 14, -252, -20 + wig * 14);
  ctx.quadraticCurveTo(-232, 2 + wig * 10, -222, 4 + wig * 10);
  ctx.quadraticCurveTo(-232, 8 + wig * 10, -250, 30 + wig * 10);
  ctx.quadraticCurveTo(-224, 34 + wig * 8, -180, 12 + wig * 8);
  ctx.closePath(); ctx.fill();
  /* belly */
  ctx.fillStyle = '#a8c6dd';
  ctx.beginPath(); ctx.ellipse(-10, 30, 130, 18, .02, 0, Math.PI); ctx.fill();
  /* fin */
  ctx.fillStyle = '#4a6c92';
  ctx.beginPath(); ctx.moveTo(-10, 20); ctx.quadraticCurveTo(-40, 60 + wig * 6, -14, 64 + wig * 6);
  ctx.quadraticCurveTo(8, 50, 14, 26); ctx.closePath(); ctx.fill();
  /* eye + smile */
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(96, -6, 9, 0, TAU); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(99, -5, 4.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#2b3a55'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(108, 14, 22, .25 * Math.PI, .65 * Math.PI); ctx.stroke();
  if (whale.greetT > 0) {
    ctx.fillStyle = '#ff6b8a'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.save(); ctx.scale(whale.dir, 1);
    ctx.fillText('♥', whale.dir * 40, -95 - (1.5 - whale.greetT) * 30);
    ctx.restore();
  }
  ctx.restore();
}

function drawResident(r) {
  ctx.save(); ctx.translate(r.x, r.y);
  const dir = player.x > r.x ? 1 : -1;
  ctx.scale(dir, 1);
  const wig = Math.sin(now * 4 + r.ph);
  /* tail */
  ctx.fillStyle = `hsl(${r.hue},65%,55%)`;
  ctx.beginPath(); ctx.moveTo(-2, 8);
  ctx.quadraticCurveTo(-14, 12 + wig * 3, -18, 20 + wig * 4);
  ctx.quadraticCurveTo(-10, 20, -2, 16); ctx.closePath(); ctx.fill();
  /* body */
  ctx.fillStyle = `hsl(${r.hue},65%,62%)`;
  rr(ctx, -7, -6, 14, 18, 6); ctx.fill();
  /* head */
  ctx.fillStyle = '#ffcf9f'; ctx.beginPath(); ctx.arc(0, -13, 8, 0, TAU); ctx.fill();
  ctx.fillStyle = `hsl(${(r.hue + 120) % 360},60%,45%)`;
  ctx.beginPath(); ctx.arc(0, -16, 8, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(3, -13, 1.4, 0, TAU); ctx.arc(-2, -13, 1.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a20'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(1, -10, 3, .2 * Math.PI, .8 * Math.PI); ctx.stroke();
  /* waving arm */
  ctx.strokeStyle = '#ffcf9f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  if (r.waveT > 0) {
    ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(12, -14 + Math.sin(now * 12) * 4); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(11, 4); ctx.stroke();
  }
  if (r.heartT > 0) {
    ctx.fillStyle = '#ff6b8a'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('♥', 0, -30 - (1.2 - r.heartT) * 20);
  }
  ctx.restore();
}

/* ── hats! ── */
function drawHat(c, key) {
  /* drawn above origin = top of head */
  switch (key) {
    case 'party':
      c.fillStyle = '#ff5f9e'; c.beginPath(); c.moveTo(-8, 0); c.lineTo(0, -18); c.lineTo(8, 0); c.closePath(); c.fill();
      c.fillStyle = '#ffe95e'; c.beginPath(); c.arc(0, -18, 3.4, 0, TAU); c.fill();
      break;
    case 'pirate':
      c.fillStyle = '#2b2b33';
      c.beginPath(); c.moveTo(-13, 0); c.quadraticCurveTo(0, -16, 13, 0);
      c.quadraticCurveTo(15, -4, 12, -6); c.quadraticCurveTo(0, -22, -12, -6);
      c.quadraticCurveTo(-15, -4, -13, 0); c.closePath(); c.fill();
      c.fillStyle = '#fff'; c.font = 'bold 8px sans-serif'; c.textAlign = 'center'; c.fillText('☠', 0, -5);
      break;
    case 'viking':
      c.fillStyle = '#8d9aa8'; c.beginPath(); c.arc(0, 0, 10, Math.PI, TAU); c.fill();
      c.fillStyle = '#ffe9a3';
      c.beginPath(); c.moveTo(-9, -3); c.quadraticCurveTo(-17, -10, -14, -18); c.quadraticCurveTo(-9, -12, -7, -6); c.fill();
      c.beginPath(); c.moveTo(9, -3); c.quadraticCurveTo(17, -10, 14, -18); c.quadraticCurveTo(9, -12, 7, -6); c.fill();
      break;
    case 'chef':
      c.fillStyle = '#fff';
      rr(c, -8, -8, 16, 8, 2); c.fill();
      c.beginPath(); c.arc(-5, -10, 5, 0, TAU); c.arc(0, -12, 6, 0, TAU); c.arc(5, -10, 5, 0, TAU); c.fill();
      break;
    case 'crown':
      c.fillStyle = '#ffd85e';
      c.beginPath(); c.moveTo(-10, 0); c.lineTo(-10, -10); c.lineTo(-5, -4); c.lineTo(0, -12); c.lineTo(5, -4); c.lineTo(10, -10); c.lineTo(10, 0);
      c.closePath(); c.fill();
      c.fillStyle = '#ff5f9e'; c.beginPath(); c.arc(0, -3, 2, 0, TAU); c.fill();
      break;
    case 'prop': {
      c.fillStyle = '#5eb0ff'; c.beginPath(); c.arc(0, -2, 8, Math.PI, TAU); c.fill();
      c.strokeStyle = '#3d4750'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(0, -8); c.lineTo(0, -12); c.stroke();
      const a = now * 12;
      c.fillStyle = '#ffe95e';
      c.save(); c.translate(0, -13); c.scale(Math.cos(a), 1);
      c.beginPath(); c.ellipse(0, 0, 10, 3, 0, 0, TAU); c.fill(); c.restore();
      break; }
  }
}

  { body: '#c98f3f', helm: '#e8c87a',   acc: '#8a5a20' },   // brass diver
  { body: '#4ade9e', helm: '#b0ffe0',   acc: '#1f8a5c' },   // glow suit
  { body: '#ff6b52', helm: '#ffc9a3',   acc: '#a83a20' },   // magma suit
  { body: '#ffd85e', helm: '#fff3c0',   acc: '#c9962a' },   // ancient armor
];
function drawPlayer() {
  const s = SUIT[gear];
  ctx.save(); ctx.translate(player.x, player.y);
  ctx.rotate(player.tilt);
  ctx.scale(player.face, 1);
  const kick = Math.sin(player.swimT * 6);
  /* flippers */
  ctx.fillStyle = s.acc;
  ctx.save(); ctx.translate(-13, 10); ctx.rotate(kick * .5 + .2);
  ctx.beginPath(); ctx.ellipse(-7, 0, 10, 4, 0, 0, TAU); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(-13, 4); ctx.rotate(-kick * .5 + .1);
  ctx.beginPath(); ctx.ellipse(-7, 0, 10, 4, 0, 0, TAU); ctx.fill(); ctx.restore();
  /* tank */
  if (gear >= 2) { ctx.fillStyle = s.acc; rr(ctx, -16, -12, 8, 18, 4); ctx.fill(); }
  /* body */
  ctx.fillStyle = s.body;
  rr(ctx, -12, -8, 24, 22, 9); ctx.fill();
  if (gear === 6) {                                    // ancient armor filigree
    ctx.strokeStyle = '#fff3c0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 2, 6, 0, TAU); ctx.stroke();
  }
  /* arms reach forward while moving */
  ctx.strokeStyle = s.body; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(15, 2 + kick * 2); ctx.stroke();
  /* head */
  ctx.fillStyle = '#ffcf9f'; ctx.beginPath(); ctx.arc(2, -16, 9, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6b4a2a'; ctx.beginPath(); ctx.arc(0, -20, 9, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6, -17, 1.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a20'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(4, -13, 3.4, .1 * Math.PI, .7 * Math.PI); ctx.stroke();
  /* helmet */
  if (gear === 1) {                                    // snorkel + mask
    ctx.strokeStyle = s.acc; ctx.lineWidth = 2.5;
    ctx.strokeRect(3, -20, 8, 6);
    ctx.beginPath(); ctx.moveTo(-2, -22); ctx.lineTo(-2, -28); ctx.lineTo(4, -28); ctx.stroke();
  } else {
    ctx.fillStyle = s.helm ? s.helm + '' : '#fff';
    ctx.globalAlpha = .4;
    ctx.beginPath(); ctx.arc(2, -16, 13, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = s.helm; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(2, -16, 13, 0, TAU); ctx.stroke();
    if (gear === 3) {                                  // brass rivets
      ctx.fillStyle = '#8a5a20';
      for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.beginPath(); ctx.arc(2 + Math.cos(a) * 13, -16 + Math.sin(a) * 13, 1.6, 0, TAU); ctx.fill(); }
    }
    if (gear >= 4) {                                   // headlamp
      ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(11, -22, 3.4, 0, TAU); ctx.fill();
    }
  }
  /* hat rides on top of everything */
  if (hatWorn >= 0) {
    ctx.save(); ctx.translate(2, gear === 1 ? -25 : -29);
    drawHat(ctx, HATS[hatWorn].key);
    ctx.restore();
  }
  ctx.restore();
  /* too-deep warning */
  if (player.warnT > 0) {
    ctx.fillStyle = `rgba(255,80,80,${.6 + Math.sin(now * 10) * .3})`;
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('TOO DEEP! UPGRADE YOUR SUIT!', player.x, player.y - 52);
  }
}

/* ── particles ── */
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.life / p.maxlife;
    if (p.kind === 'bubble') {
      ctx.strokeStyle = `rgba(220,245,255,${a * .7})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke();
    } else if (p.kind === 'spark' || p.kind === 'ember') {
      ctx.fillStyle = `hsla(${p.hue},90%,65%,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a + .5, 0, TAU); ctx.fill();
    } else if (p.kind === 'confetti') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 6 + p.size);
      ctx.fillStyle = `hsla(${p.hue},85%,65%,${a})`;
      ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
      ctx.restore();
    } else if (p.kind === 'heart') {
      ctx.fillStyle = `rgba(255,107,138,${a})`;
      ctx.font = `bold ${p.size + 4}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('♥', p.x, p.y);
    } else if (p.kind === 'text') {
      ctx.font = `bold ${p.size}px 'Arial Rounded MT Bold','Trebuchet MS',sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = `rgba(4,18,32,${a * .8})`;
      ctx.strokeText(p.txt, p.x, p.y);
      ctx.fillStyle = p.color || '#ffe9a3'; ctx.globalAlpha = a; ctx.fillText(p.txt, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }
  /* flying tacos */
  for (const tc of tacos) {
    ctx.save(); ctx.translate(tc.x, tc.y); ctx.rotate(tc.life * 8);
    ctx.fillStyle = '#ffd85e'; ctx.beginPath(); ctx.arc(0, 0, 9, .15 * Math.PI, .85 * Math.PI, true); ctx.fill();
    ctx.fillStyle = '#5fae4c'; ctx.beginPath(); ctx.arc(0, -1, 6.5, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#d1543f'; ctx.beginPath(); ctx.arc(-2, -3, 2, 0, TAU); ctx.arc(3, -3.5, 2, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ═══════════ RENDER — frame composition ═══════════ */
const w2sx = wx => (wx - cam.x) * SCALE + VW / 2;
const w2sy = wy => (wy - cam.y) * SCALE + VH / 2;

const STARS = (() => { const R = mulberry(4); const a = [];
  for (let i = 0; i < 140; i++) a.push([R() * 2400 - 240, -R() * 2600 - 40, R()]); return a; })();

function ambientDark(y) {
  const stops = [[1700, 0], [2600, .42], [3500, .62], [4400, .8], [5000, .82], [5600, .72], [6400, .68]];
  if (y <= stops[0][0]) return 0;
  for (let i = 1; i < stops.length; i++)
    if (y <= stops[i][0]) {
      const [y0, a0] = stops[i - 1], [y1, a1] = stops[i];
      return a0 + (a1 - a0) * (y - y0) / (y1 - y0);
    }
  return stops[stops.length - 1][1];
}

function drawBackdrop() {
  const surfY = w2sy(0);
  /* sky */
  if (surfY > 0) {
    const alt = clamp(-cam.y / 1200, 0, 1);
    const g = ctx.createLinearGradient(0, 0, 0, Math.max(surfY, 1));
    g.addColorStop(0, hexLerp('#8fd4ff', '#070718', alt));
    g.addColorStop(1, hexLerp('#d4efff', '#141438', alt));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, Math.ceil(surfY));
    /* sun */
    if (alt < .7) {
      ctx.globalAlpha = 1 - alt;
      const sx = w2sx(1560), sy = w2sy(-260);
      const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 90);
      sg.addColorStop(0, '#fff8d0'); sg.addColorStop(.25, '#ffe9a3'); sg.addColorStop(1, 'rgba(255,233,163,0)');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 90, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    /* stars come out when you fly high */
    if (alt > .25) {
      ctx.fillStyle = '#fff';
      for (const [sx2, sy2, tw] of STARS) {
        const px = w2sx(sx2), py = w2sy(sy2);
        if (py < 0 || py > surfY || px < -10 || px > VW + 10) continue;
        ctx.globalAlpha = (alt - .25) / .75 * (.4 + .6 * Math.abs(Math.sin(now * 2 + tw * 9)));
        ctx.fillRect(px, py, 2, 2);
      }
      ctx.globalAlpha = 1;
    }
    /* clouds */
    ctx.fillStyle = `rgba(255,255,255,${.5 * (1 - alt)})`;
    for (let i = 0; i < 4; i++) {
      const cx2 = w2sx(((i * 560 + now * 7) % 2400) - 240), cy2 = w2sy(-140 - i * 90);
      if (cy2 > -40 && cy2 < surfY) {
        ctx.beginPath();
        ctx.ellipse(cx2, cy2, 70, 16, 0, 0, TAU);
        ctx.ellipse(cx2 + 40, cy2 - 10, 45, 14, 0, 0, TAU);
        ctx.fill();
      }
    }
  }
  /* water */
  if (surfY < VH) {
    const top = Math.max(0, surfY);
    const wy0 = Math.max(0, cam.y + (top - VH / 2) / SCALE);
    const wy1 = cam.y + (VH - VH / 2) / SCALE;
    const g = ctx.createLinearGradient(0, top, 0, VH);
    g.addColorStop(0, waterColor(wy0));
    g.addColorStop(.5, waterColor((wy0 + wy1) / 2));
    g.addColorStop(1, waterColor(wy1));
    ctx.fillStyle = g;
    ctx.fillRect(0, top, VW, VH - top);
  }
  /* surface waves */
  if (surfY > -30 && surfY < VH + 30) {
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let x = 0; x <= VW; x += 14)
      ctx.lineTo(x, surfY + Math.sin(x * .02 + now * 2.2) * 4 * SCALE);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.fillRect(0, surfY, VW, 10 * SCALE);
  }
  /* god rays near the surface */
  if (cam.y < 1100 && cam.y > -400) {
    const fade = clamp(1 - cam.y / 1100, 0, 1) * .16;
    ctx.save();
    for (let i = 0; i < 5; i++) {
      const bx = w2sx(((i * 430 + 160) % WORLD_W)) + Math.sin(now * .3 + i) * 40;
      ctx.fillStyle = `rgba(255,255,230,${fade * (.5 + .5 * Math.sin(now * .6 + i * 2))})`;
      ctx.beginPath();
      ctx.moveTo(bx - 24, Math.max(surfY, -10));
      ctx.lineTo(bx + 24, Math.max(surfY, -10));
      ctx.lineTo(bx + 150, VH); ctx.lineTo(bx - 60, VH);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  /* drifting motes */
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  for (let i = 0; i < 24; i++) {
    const mx = (i * 173.3 + now * 6) % (VW + 40) - 20;
    const my = (i * 97.7 - now * 3 + cam.y * -.3 * SCALE) % (VH + 40);
    ctx.fillRect(mx, my < 0 ? my + VH + 40 : my, 2, 2);
  }
}

/* collect this frame's light sources (world coords) */
function collectLights(v) {
  const L = [];
  const add = (x, y, r, cr, cg, cb, i2) =>
    { if (x > v.x0 - r && x < v.x1 + r && y > v.y0 - r && y < v.y1 + r) L.push({ x, y, r, cr, cg, cb, i: i2 }); };
  add(player.x, player.y, gear >= 4 ? 300 : 150, 200, 230, 255, gear >= 4 ? .95 : .7);
  if (pet.on) add(pet.x, pet.y, 130, 160, 240, 255, .8);
  else add(POI.blub.x, POI.blub.y, 120, 160, 240, 255, .8);
  for (const b of buildings) {
    const d = BLD[b.key]; if (!d.light || !b.active) continue;
    const l = ledges[b.ledge];
    const col = b.key === 'jellydisco' ? [200, 140, 255] : b.key === 'glowgarden' ? [140, 255, 190] : [255, 238, 150];
    add(l.slots[b.slot].x, l.y - 40, d.light, col[0], col[1], col[2], .9);
  }
  for (const nd of nodes) {
    if (nd.dead) continue;
    if (nd.kind === 'glow') add(nd.x, nd.y - 12, 110, 140, 255, 190, .8);
    if (nd.kind === 'crystal') add(nd.x, nd.y - 16, 100, 185, 143, 255, .7);
  }
  for (const d of decos) {
    if (d.kind === 'vent') add(d.x, d.y - 40, 150, 255, 140, 50, .55 + Math.sin(now * 6 + d.ph) * .2);
    if (d.kind === 'glowshroom') add(d.x, d.y - 20, 90, 110, 220, 255, .7);
    if (d.kind === 'wallglow') add(d.x, d.y, 70, 90, 220, 255, .5);
  }
  for (const j of jellies) if (j.y > 2400) add(j.x, j.y, 60, 200, 170, 255, .5);
  for (const ru of ruins) add(ru.x, ru.y - 70, ruinsFixed[ru.i] ? 240 : 90, 120, 255, 230, ruinsFixed[ru.i] ? .95 : .4);
  if (saucerStage >= 2 || blast) add(blast ? blast.x : POI.saucer.x, blast ? blast.y : POI.saucer.y - 20, 280, 140, 255, 170, .9);
  else if (cityFound || player.y > 5800) add(POI.saucer.x, POI.saucer.y - 20, 140, 140, 255, 170, .5 + Math.sin(now * 2) * .2);
  for (const c of crates) add(c.x, c.y, 90, 255, 233, 163, .7);
  return L;
}

function drawLighting(v) {
  const dark = ambientDark(cam.y);
  if (dark < .04) return;
  const lights = collectLights(v);
  const f = DPR / 2;                        // screen→lightmap factor
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.globalCompositeOperation = 'source-over';
  lctx.fillStyle = `rgba(1,4,12,${dark})`;
  lctx.clearRect(0, 0, lightCv.width, lightCv.height);
  lctx.fillRect(0, 0, lightCv.width, lightCv.height);
  lctx.globalCompositeOperation = 'destination-out';
  for (const l of lights) {
    const sx = w2sx(l.x) * f, sy = w2sy(l.y) * f, sr = l.r * SCALE * f;
    const g = lctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    g.addColorStop(0, `rgba(0,0,0,${l.i})`);
    g.addColorStop(.6, `rgba(0,0,0,${l.i * .5})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g;
    lctx.beginPath(); lctx.arc(sx, sy, sr, 0, TAU); lctx.fill();
  }
  ctx.drawImage(lightCv, 0, 0, VW, VH);
  /* colored glow pass */
  ctx.globalCompositeOperation = 'lighter';
  for (const l of lights) {
    const sx = w2sx(l.x), sy = w2sy(l.y), sr = l.r * SCALE * .8;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    g.addColorStop(0, `rgba(${l.cr},${l.cg},${l.cb},${.14 * l.i * dark})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* placement ghost overlay (world coords) */
function drawPlacing() {
  if (!placing) return;
  for (let i = 0; i < placing.cands.length; i++) {
    const c = placing.cands[i];
    if (i === placing.sel) continue;
    ctx.fillStyle = 'rgba(140,220,255,.4)';
    ctx.beginPath(); ctx.arc(c.x, c.y - 10, 8 + Math.sin(now * 4) * 2, 0, TAU); ctx.fill();
  }
  const c = placing.cands[placing.sel];
  const ok = canAfford(BLD[placing.key].cost) && !ledges[c.li].slots[c.si].bld;
  ctx.save(); ctx.translate(c.x, c.y);
  ctx.globalAlpha = .55 + Math.sin(now * 5) * .12;
  drawBuilding(ctx, placing.key, now, true);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = ok ? '#7fff9e' : '#ff8f8f'; ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  rr(ctx, -44, -86, 88, 90, 12); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('◀', -60, -34); ctx.fillText('▶', 60, -34);
  ctx.restore();
}

/* bouncing ✕ prompt over the nearest interactable */
function drawPrompt() {
  if (placing || panelMode) return;
  let best = null, bd = 1e9;
  const consider = (x, y, r, yOff) => {
    const d = dist(player.x, player.y, x, y);
    if (d < r && d < bd) { bd = d; best = { x, y: y + (yOff || 0) }; }
  };
  for (const c of crates) consider(c.x, c.y, 90, -40);
  if (!petAdopted) consider(POI.blub.x, POI.blub.y, 110, -52);
  if (whale.on) consider(whale.x, whale.y, 260, -110);
  for (const r of residents) consider(r.x, r.y, 70, -44);
  for (const ru of ruins) if (!ruinsFixed[ru.i]) consider(ru.x, ru.y - 40, 110, -110);
  if (saucerFound && saucerStage < 3) consider(POI.saucer.x, POI.saucer.y - 50, 170, -120);
  if (saucerStage >= 3 && scene === 'play') consider(POI.saucer.x, POI.saucer.y - 50, 170, -130);
  for (const b of buildings) if (BLD[b.key].interact) {
    const l = ledges[b.ledge];
    consider(l.slots[b.slot].x, l.y - 34, 95, -70);
  }
  for (const nd of nodes) if (!nd.dead) consider(nd.x, nd.y - 24, 90, -70);
  if (!best) return;
  const by = best.y - 14 + Math.sin(now * 5) * 5;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.arc(best.x, by, 13, 0, TAU); ctx.fill();
  ctx.fillStyle = '#0a3245'; ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('✕', best.x, by + 1);
  ctx.textBaseline = 'alphabetic';
}

/* depth gauge (screen space) */
function drawGauge() {
  const gh = VH * .52, gx = VW - 26, gy = VH * .24, gw = 10;
  ctx.fillStyle = 'rgba(4,18,32,.55)';
  rr(ctx, gx - 3, gy - 3, gw + 6, gh + 6, 7); ctx.fill();
  for (let z = 0; z < ZONES.length; z++) {
    const y0 = gy + ZONES[z].y0 / WORLD_BOTTOM * gh, y1 = gy + ZONES[z].y1 / WORLD_BOTTOM * gh;
    ctx.fillStyle = waterColor((ZONES[z].y0 + ZONES[z].y1) / 2);
    ctx.fillRect(gx, y0, gw, y1 - y0 - 1);
    if (visitedZones[z]) { ctx.fillStyle = 'rgba(255,233,163,.9)'; ctx.fillRect(gx + gw - 2.5, y0, 2.5, y1 - y0 - 1); }
  }
  /* pressure lock */
  const lim = GEAR[gear].maxDepth;
  if (lim < WORLD_BOTTOM) {
    const ly = gy + lim / WORLD_BOTTOM * gh;
    ctx.strokeStyle = '#ff8f8f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(gx - 5, ly); ctx.lineTo(gx + gw + 5, ly); ctx.stroke();
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🔒', gx + gw / 2, ly + 13);
  }
  /* you-are-here */
  const py = gy + clamp(player.y, 0, WORLD_BOTTOM) / WORLD_BOTTOM * gh;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(gx - 4, py); ctx.lineTo(gx - 11, py - 5); ctx.lineTo(gx - 11, py + 5);
  ctx.closePath(); ctx.fill();
}

/* ───── the frame ───── */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackdrop();
  const v = viewRange();
  ctx.save();
  const shx = shake > 0 ? rnd(-shake, shake) : 0, shy = shake > 0 ? rnd(-shake, shake) : 0;
  ctx.translate(VW / 2 + shx, VH / 2 + shy);
  ctx.scale(SCALE, SCALE);
  ctx.translate(-cam.x, -cam.y);

  drawWalls(v);
  drawBuoy();
  for (const l of ledges)
    if (l.y > v.y0 - 160 && l.y < v.y1 + 160 && l.x < v.x1 + 60 && l.x + l.w > v.x0 - 60) drawLedge(l);
  for (const d of decos)
    if (d.y > v.y0 - 220 && d.y < v.y1 + 100 && d.x > v.x0 - 100 && d.x < v.x1 + 100) drawDeco(d);
  for (const ru of ruins)
    if (ru.y > v.y0 - 180 && ru.y < v.y1 + 60) drawRuin(ru);
  drawBuildings(v);
  for (const nd of nodes)
    if (nd.y > v.y0 - 120 && nd.y < v.y1 + 60 && nd.x > v.x0 - 60 && nd.x < v.x1 + 60) drawNode(nd);
  /* the saucer (or the flying saucer) */
  if (blast) drawSaucer(blast.x, blast.y, 3, true);
  else if (POI.saucer.y - 140 < v.y1) drawSaucer(POI.saucer.x, POI.saucer.y - 26, saucerStage, false);

  for (const f of fishSchools) drawSchool(f, v);
  for (const j of jellies) drawJelly(j, v);
  for (const cb of crabs) { const l = ledges[cb.li]; if (l && l.y > v.y0 - 60 && l.y < v.y1 + 60) drawCrab(cb); }
  drawWhale(v);
  for (const r of residents)
    if (r.y > v.y0 - 60 && r.y < v.y1 + 60) drawResident(r);
  if (pet.on) drawBlubAt(pet.x, pet.y, false);
  else if (POI.blub.y > v.y0 - 80 && POI.blub.y < v.y1 + 80) drawBlubAt(POI.blub.x, POI.blub.y + Math.sin(now * 1.6) * 8, true);
  for (const c of crates)
    if (c.y > v.y0 - 60 && c.y < v.y1 + 60) drawCrate(c);
  if (scene === 'play') drawPlayer();
  drawParticles();
  if (scene === 'play') { drawPlacing(); drawPrompt(); }
  ctx.restore();

  drawLighting(v);

  if (scene !== 'title') drawGauge();
  /* pressure warning vignette */
  if (player.warnT > 0 && scene === 'play') {
    ctx.fillStyle = `rgba(255,40,40,${player.warnT * .18 * (1 + Math.sin(now * 12) * .5)})`;
    ctx.fillRect(0, 0, VW, VH);
  }
}

/* ═══════════ MAIN LOOP + BOOT ═══════════ */
let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(1 / 30, (ts - lastT) / 1000 || 0);
  lastT = ts;
  now = ts / 1000;
  if (scene === 'title') {
    cam.x = WORLD_W / 2;
    cam.y = 420 + Math.sin(now * .12) * 260;
    for (const f of fishSchools) {
      f.x += f.vx * (1 / 60); f.ph += 1 / 60;
      if (f.x < -140 || f.x > WORLD_W + 140) f.vx *= -1;
    }
    updateParticles(dt);
  } else {
    update(dt);
    refreshHUD();
  }
  render();
}

document.addEventListener('visibilitychange', () => { if (document.hidden && scene !== 'title') save(); });
addEventListener('mousedown', ensureAudio, { once: true });

resize();
genWorld();
spawnCritters();
buildTitleBtns();
updateGoalUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
