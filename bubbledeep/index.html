<!DOCTYPE html>

<head>

<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none;
      -webkit-user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }

  canvas#game { position:fixed; inset:0; width:100vw; height:100vh; display:block; }

  /* ── HUD top bar ── */
  #hud { position:fixed; top:0; left:0; right:0; height:52px; display:none; align-items:center;
      gap:8px; padding:0 12px; background:linear-gradient(180deg, rgba(3,16,30,.92), rgba(3,16,30,.78));
      border-bottom:2px solid rgba(120,220,255,.18); z-index:20; pointer-events:none; }
  body.in-play #hud { display:flex; }
  #gearBadge { display:flex; flex-direction:column; justify-content:center; min-width:150px;
      pointer-events:auto; }
  #gearBadge .g1 { color:#ffd85e; font-size:17px; font-weight:bold; letter-spacing:.5px;

  #gearBadge .g2 { color:#8fd8ff; font-size:10px; letter-spacing:.4px; white-space:nowrap; }
  .chip { display:flex; align-items:center; gap:5px; background:rgba(10,40,66,.75);

      transition:transform .15s; white-space:nowrap; }
  .chip .ico { font-size:16px; line-height:1; }
  .chip.bump { transform:scale(1.18); }
  .chip .sub { font-size:10px; color:#9fd4ef; font-weight:normal; margin-left:2px; }

  /* ── goal strip ── */
  #goal { position:fixed; top:60px; left:10px; z-index:20; display:none; align-items:center; gap:8px;

  /* ── hint bar ── */
  #hints { position:fixed; left:12px; bottom:10px; z-index:20; display:none; color:#bfe6f7;

  /* ── toasts ── */

  .toast.out { opacity:0; transform:translateY(-14px); transition:all .4s ease; }
  @keyframes toastIn { from{opacity:0; transform:translateY(-16px) scale(.9)} to{opacity:1} }

  /* ── big banner (zone / gear announcements) ── */
  #banner { position:fixed; top:26%; left:50%; transform:translate(-50%,-50%) scale(.7); z-index:45;
      text-align:center; opacity:0; pointer-events:none; transition:all .35s cubic-bezier(.2,1.6,.4,1); }
  #banner.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #banner .b1 { font-size:44px; font-weight:bold; color:#fff; letter-spacing:2px;
      text-shadow:0 0 24px rgba(110,220,255,.9), 0 4px 0 rgba(0,40,80,.9), 0 6px 18px rgba(0,0,0,.6); }
  #banner .b2 { font-size:17px; color:#ffe9a3; margin-top:6px; letter-spacing:1px;
      text-shadow:0 2px 6px rgba(0,0,0,.8); }

  /* ── generic panel (build menu, gear station, stats…) ── */
  #panelWrap { position:fixed; inset:0; z-index:50; display:none; align-items:center;
      justify-content:center; background:rgba(2,10,20,.55); backdrop-filter:blur(2px); }
  #panelWrap.show { display:flex; }
  #panel { background:linear-gradient(180deg,#0b2c48,#07203a); border:3px solid #6fd6ff;
      border-radius:22px; padding:18px 20px; min-width:340px; max-width:min(94vw,720px);
      max-height:86vh; overflow-y:auto; box-shadow:0 10px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15); }
  #panel h2 { color:#8fe0ff; font-size:21px; letter-spacing:1px; margin-bottom:4px;

  .bItem.cant { opacity:.45; }

  .pbtn { display:inline-block; background:linear-gradient(180deg,#ffd85e,#f0a63a); color:#4a2c00;

      font-family:inherit; letter-spacing:.5px; cursor:pointer; box-shadow:0 3px 0 #a86e14, 0 5px 12px rgba(0,0,0,.4);

  .pbtn:active { transform:translateY(2px); box-shadow:0 1px 0 #a86e14; }
  .pbtn.blue { background:linear-gradient(180deg,#6fd6ff,#2e90cf); color:#03283f; box-shadow:0 3px 0 #14567e, 0 5px 12px rgba(0,0,0,.4); }
  .pbtn.ghost { background:rgba(255,255,255,.1); color:#bfe6f7; box-shadow:none; border:2px solid rgba(140,220,255,.3); }
  .pbtn:disabled { filter:grayscale(.8); opacity:.5; cursor:default; }
  #panel .rowBtns { display:flex; gap:10px; margin-top:12px; justify-content:flex-end; }
  .statRow { display:flex; justify-content:space-between; color:#dff2fc; font-size:14.5px;

  .statRow b { color:#ffe9a3; }

  /* ── title screen ── */
  #title { position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;

  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  #titleLogo .t1 { font-size:min(11vw,86px); font-weight:bold; letter-spacing:6px; color:#fff;
      text-shadow:0 0 34px rgba(110,225,255,.95), 0 6px 0 #0a3a5e, 0 10px 26px rgba(0,0,0,.7); }
  #titleLogo .t1 .df { color:#7ff0d4; }
  #titleLogo .t2 { font-size:min(3.4vw,17px); color:#ffe9a3; letter-spacing:3px; margin-top:10px;

  #titleBtns { display:flex; flex-direction:column; gap:14px; align-items:center; }

      box-shadow:0 4px 10px rgba(0,0,0,.4); pointer-events:none; }
  .tbtn { position:fixed; width:74px; height:74px; border-radius:50%; border:3px solid rgba(255,255,255,.35);
      color:#fff; font-size:13px; font-weight:bold; font-family:inherit; letter-spacing:.5px;
      display:flex; align-items:center; justify-content:center; pointer-events:auto;
      text-shadow:0 2px 3px rgba(0,0,0,.6); box-shadow:0 4px 12px rgba(0,0,0,.35); }
  #tbA { right:26px; bottom:56px; background:radial-gradient(circle at 35% 30%, #ffe289, #e89a2b); }

<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="gearBadge"><div class="g1">GEAR 1</div><div class="g2">SNORKEL KID</div></div>
  <div id="chips"></div>
  <div id="hudRight"></div>
</div>
<div id="goal"><span class="star">⭐</span><span id="goalTxt">GOAL</span></div>
<div id="hints">ARROWS/WASD SWIM · X TALK+GRAB · C BUILD · V STATS · M SOUND</div>
<div id="toasts"></div>
<div id="banner"><div class="b1"></div><div class="b2"></div></div>
<div id="panelWrap"><div id="panel"></div></div>

<div id="title">
  <div id="titleLogo">
    <div class="t1">BUBBLE<span class="df">DEEP</span></div>
    <div class="t2">🌊 AN ISLANDFORGE ADVENTURE 🌊</div>
  </div>
  <div id="titleBtns"></div>

</div>

<div id="tc">
  <div id="joyBase"></div><div id="joyKnob"></div>
  <button class="tbtn" id="tbA">GRAB</button>
  <button class="tbtn" id="tbB">BUILD</button>
  <button class="tbtn" id="tbStats">📊</button>

<script>
'use strict';
/* ═════════════════════════════════════════════════════════════════════
   BUBBLEDEEP — sequel to IslandForge.
   One static file. Canvas 2D, no libraries. Dive down, gear up, build a
   glowing canyon civilization, find the thing at the bottom of the sea.
   ═════════════════════════════════════════════════════════════════════ */

/* ───── canvas boot ───── */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1, SCALE = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = VW * DPR; canvas.height = VH * DPR;
  SCALE = Math.max(.72, Math.min(VW / 1280, VH / 800, 1.15));
  lightCv.width = Math.ceil(VW * DPR / 2); lightCv.height = Math.ceil(VH * DPR / 2);
}
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
addEventListener('resize', resize);

/* ───── tiny helpers ───── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.random() * arr.length | 0];
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexLerp(h1, h2, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const a = p(h1), b = p(h2);
  return `rgb(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0})`;
}
function rr(c, x, y, w, h, r) {           // rounded-rect path helper
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ═══════════ AUDIO — tiny WebAudio synth, started on first input ═══════════ */
let actx = null, master = null, muted = false;
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = .5; master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(f, dur, type = 'sine', vol = .2, delay = 0, slide = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + .05);
}
function noiseHit(dur = .12, vol = .18, delay = 0, hp = 400) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay, n = actx.sampleRate * dur | 0;
  const buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(); s.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = actx.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
const SFX = {
  blip:   () => tone(660, .07, 'square', .12),
  bloop:  () => { tone(300, .12, 'sine', .22, 0, 160); },
  pop:    () => { tone(520, .09, 'sine', .25, 0, 300); noiseHit(.05, .08, 0, 1200); },
  chop:   () => { noiseHit(.09, .2, 0, 300); tone(180, .07, 'triangle', .18); },
  build:  () => { tone(240, .1, 'triangle', .22); tone(360, .12, 'triangle', .2, .09); tone(480, .16, 'triangle', .2, .19); },
  deny:   () => { tone(200, .12, 'square', .12); tone(150, .16, 'square', .12, .1); },
  ui:     () => tone(520, .05, 'square', .08),
  goal:   () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .22, i * .09)); },
  gearUp: () => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'triangle', .22, i * .1)); noiseHit(.3, .1, .5, 300); },
  crate:  () => { tone(784, .1, 'square', .15); tone(988, .1, 'square', .15, .09); tone(1319, .22, 'square', .18, .18); },
  zap:    () => { tone(1200, .08, 'sawtooth', .1, 0, -800); },
  splash: () => { noiseHit(.35, .25, 0, 250); },
  hi:     () => { tone(880, .09, 'sine', .18); tone(1175, .13, 'sine', .18, .08); },
  whale:  () => { tone(140, 1.4, 'sine', .25, 0, 90); tone(210, 1.2, 'sine', .12, .3, 60); },
  teleport:() => { tone(400, .4, 'sine', .2, 0, 700); noiseHit(.3, .12, 0, 900); },
  rumble: () => { tone(60, .8, 'sawtooth', .18, 0, -20); noiseHit(.6, .2, 0, 80); },
};
let ambT = 0;
function ambientTick(dt) {          // occasional soft background bloops
  if (!actx || muted) return;
  ambT -= dt;
  if (ambT <= 0) { ambT = rnd(2.5, 7); tone(rnd(180, 420), .5, 'sine', .025, 0, rnd(40, 120)); }
}

/* ═══════════ DATA — zones, resources, gear, buildings, goals ═══════════ */
const WORLD_W = 1920, WORLD_BOTTOM = 6400;

const ZONES = [
  { name: 'THE SUNNY SHALLOWS', sub: 'Chop kelp! Blow bubbles!',            y0: 0,    y1: 800  },
  { name: 'THE KELP FOREST',    sub: 'Whoa, it goes deeper…',               y0: 800,  y1: 1700 },
  { name: 'THE TWILIGHT ZONE',  sub: 'Spooky! (the fun kind of spooky)',    y0: 1700, y1: 2600 },
  { name: 'THE WRECK REEF',     sub: 'A real sunken pirate ship!',          y0: 2600, y1: 3500 },
  { name: 'THE GLOWING ABYSS',  sub: 'Bring a light, buddy!',               y0: 3500, y1: 4400 },
  { name: 'THE BOILING VENTS',  sub: 'Hot hot hot! Free power though!',     y0: 4400, y1: 5300 },
  { name: 'THE LOST CITY',      sub: 'Somebody lived here long, long ago…', y0: 5300, y1: 6400 },
];
/* water colour stops by depth (surface → floor) */
const WATER_STOPS = [
  [0,    '#37b6e8'], [800, '#2490c4'], [1700, '#17699e'], [2600, '#114e7e'],
  [3500, '#092c50'], [4400, '#051a35'], [5300, '#041226'], [6400, '#030b1c'],
];
function waterColor(y) {
  if (y <= 0) return WATER_STOPS[0][1];
  for (let i = 1; i < WATER_STOPS.length; i++) {
    if (y <= WATER_STOPS[i][0]) {
      const [d0, c0] = WATER_STOPS[i - 1], [d1, c1] = WATER_STOPS[i];
      return hexLerp(c0, c1, (y - d0) / (d1 - d0));
    }
  }
  return WATER_STOPS[WATER_STOPS.length - 1][1];
}
const zoneAt = y => { for (let i = ZONES.length - 1; i >= 0; i--) if (y >= ZONES[i].y0) return i; return 0; };

/* resources — shown in HUD only once discovered */
const RESDEF = {
  kelp:    { ico: '🌿', name: 'KELP' },
  stone:   { ico: '🪨', name: 'STONE' },
  snacks:  { ico: '🌮', name: 'SNACKS' },
  pearl:   { ico: '🫧', name: 'PEARLS' },
  scrap:   { ico: '🔩', name: 'SCRAP' },
  glow:    { ico: '✨', name: 'GLOW GOO' },
  crystal: { ico: '💎', name: 'CRYSTALS' },
};
const RES_KEYS = Object.keys(RESDEF);

/* gear ladder — the "ages" of DEEPFORGE. maxDepth gates the dive. */
const GEAR = [
  null,
  { name: 'SNORKEL KID',   sub: 'Just you, a snorkel, and big dreams', maxDepth: 880,  cost: {} },
  { name: 'BUBBLE SUIT',   sub: 'Dive into the Kelp Forest!',          maxDepth: 1780, cost: { kelp: 30, stone: 15 } },
  { name: 'BRASS DIVER',   sub: 'Twilight Zone + the Wreck Reef!',     maxDepth: 3580, cost: { stone: 50, pearl: 6 } },
  { name: 'GLOW SUIT',     sub: 'Lights on — into the Abyss!',         maxDepth: 4480, cost: { scrap: 35, pearl: 12 } },
  { name: 'MAGMA SUIT',    sub: 'The Boiling Vents can\'t boil YOU!',  maxDepth: 5380, cost: { scrap: 50, glow: 20 } },
  { name: 'ANCIENT ARMOR', sub: 'Forged for the Lost City itself',     maxDepth: 99999, cost: { crystal: 20, glow: 25, pearl: 20 } },
];

/* buildings — placed in ledge slots. gear = unlock level. */
const BLD = {

/* ═══════════ WORLD GENERATION (deterministic — seed 7) ═══════════ */
function wallL(y) {
  if (y < 0) return -60;
  const taper = clamp(y / 400, 0, 1);      // canyon opens wide at the surface
  return (150 + Math.sin(y * .00185) * 85 + Math.sin(y * .00057 + 2) * 110 + Math.sin(y * .011) * 16) * taper - 60 * (1 - taper);
}
function wallR(y) {
  if (y < 0) return WORLD_W + 60;
  const taper = clamp(y / 400, 0, 1);
  return WORLD_W - (150 + Math.sin(y * .00171 + 5) * 85 + Math.sin(y * .00061) * 110 + Math.sin(y * .013 + 1) * 16) * taper + 60 * (1 - taper);
}

let ledges = [];       // {x, y, w, slots:[{x, bld|null}], zone, kind}
let nodes = [];        // harvest {kind,x,y,hp,maxhp,t,dead,respawn}
let decos = [];        // pure decoration {kind,x,y,s,ph,flip}
let ruins = [];        // {x,y,i}
let POI = {};          // wreck, saucer, blub, buoy

function genWorld() {
  const R = mulberry(7);
  ledges = []; nodes = []; decos = []; ruins = [];
  const addLedge = (x, y, w, kind) => {
    const l = { x, y, w, zone: zoneAt(y), kind: kind || 'rock', slots: [] };
    /* slot centers: start 44 in, every 88px */
    for (let i = 0; x + 44 + i * 88 + 44 <= x + w; i++) l.slots.push({ x: x + 44 + i * 88, bld: null });
    ledges.push(l); return l;
  };
  /* per-zone ledges hugging the canyon walls, alternating sides */
  for (let z = 0; z < ZONES.length; z++) {
    const { y0, y1 } = ZONES[z];
    const n = z === 6 ? 5 : 6;
    for (let i = 0; i < n; i++) {
      const y = y0 + 90 + (i + .5) / n * (y1 - y0 - 160) + R() * 50 - 25;
      const side = (i + z) % 2, w = 240 + R() * 220;
      if (side === 0) addLedge(wallL(y) + 8, y, w);
      else            addLedge(wallR(y) - 8 - w, y, w);
      if (R() < .38) {                                     // mid-canyon floater
        const fw = 170 + R() * 130;
        const fx = clamp(WORLD_W / 2 + (R() - .5) * 500, wallL(y) + w + 80, wallR(y) - fw - 80);
        if (fx > wallL(y) + 60 && fx + fw < wallR(y) - 60) addLedge(fx, y + 55 + R() * 40, fw, 'float');
      }
    }
  }
  /* the sea floor — wide buildable terraces at the very bottom */
  addLedge(wallL(6280) + 10, 6290, 560, 'floor');
  addLedge(wallR(6280) - 570, 6290, 560, 'floor');

  /* POIs */
  POI.buoy = { x: WORLD_W / 2, y: 40 };
  const wreckLedge = addLedge(WORLD_W / 2 - 330, 3060, 660, 'wreck');   // build ON the wreck deck!
  POI.wreck = { x: WORLD_W / 2, y: 3060 };
  POI.blub = { x: WORLD_W / 2 + rnd(-1, 1) * 0 + 240, y: 3980 };
  POI.saucer = { x: WORLD_W / 2, y: 6300 };
  /* keep the crater clear: no ledges within 260px of saucer x on the floor */

  /* lost-city ruins: three broken monuments on their own pedestals */
  const ruinYs = [5480, 5760, 6040];
  for (let i = 0; i < 3; i++) {
    const side = i % 2 ? -1 : 1;
    const rx = WORLD_W / 2 + side * (260 + R() * 160);
    ruins.push({ x: rx, y: ruinYs[i], i });
  }

  /* harvest nodes per zone */
  const nodeSpots = (zMin, zMax, cnt2, kind) => {
    let placed = 0, guard = 0;
    while (placed < cnt2 && guard++ < 400) {
      const l = pick(ledges);
      if (l.y < ZONES[zMin].y0 || l.y > ZONES[zMax].y1 - 40 || l.kind === 'wreck' && kind !== 'scrap') continue;
      const nx = l.x + 30 + R() * (l.w - 60);
      if (nodes.some(nd => Math.abs(nd.x - nx) < 60 && Math.abs(nd.y - l.y) < 40)) continue;
      nodes.push({ kind, x: nx, y: l.y, hp: 3, maxhp: 3, t: R() * 9, dead: 0, ph: R() * TAU });
      placed++;
    }
  };
  nodeSpots(0, 1, 14, 'kelp');
  nodeSpots(0, 2, 10, 'stone');
  nodeSpots(2, 3, 8, 'scrap');
  nodeSpots(4, 4, 8, 'glow');
  nodeSpots(5, 5, 8, 'crystal');

  /* decorations */
  const decoKinds = [
    [0, 0, 26, 'coral'], [0, 1, 16, 'shell'], [1, 1, 30, 'bigkelp'], [2, 3, 14, 'fan'],
    [4, 4, 12, 'glowshroom'], [5, 5, 10, 'vent'], [6, 6, 14, 'column'], [0, 6, 40, 'rock'],
  ];
  for (const [z0, z1, cnt3, kind] of decoKinds) {
    for (let i = 0; i < cnt3; i++) {
      const l = pick(ledges);
      if (l.zone < z0 || l.zone > z1) { i--; if (i < -200) break; continue; }
      decos.push({ kind, x: l.x + 14 + R() * (l.w - 28), y: l.y, s: .7 + R() * .7, ph: R() * TAU, flip: R() < .5 });
    }
  }
  /* wall barnacle lights for the abyss */
  for (let i = 0; i < 26; i++) {
    const y = 3500 + R() * 2800, side = R() < .5;
    decos.push({ kind: 'wallglow', x: side ? wallL(y) + 6 : wallR(y) - 6, y, s: .5 + R(), ph: R() * TAU, flip: side });
  }
}

/* free slot lookup for placement */
function freeSlots(nearX, nearY, range, wide) {
  const out = [];
  for (let li = 0; li < ledges.length; li++) {
    const l = ledges[li];
    if (Math.abs(l.y - nearY) > range) continue;
    for (let si = 0; si < l.slots.length; si++) {
      const s = l.slots[si];
      if (s.bld !== null) continue;
      if (Math.abs(POI.saucer.x - s.x) < 240 && Math.abs(POI.saucer.y - l.y) < 200) continue;
      if (nodes.some(nd => !nd.dead && Math.abs(nd.x - s.x) < 55 && Math.abs(nd.y - l.y) < 30)) continue;
      if (ruins.some(r => Math.abs(r.x - s.x) < 90 && Math.abs(r.y - l.y) < 60)) continue;
      const d = dist(nearX, nearY, s.x, l.y);
      if (d < range) out.push({ li, si, x: s.x, y: l.y, d });
    }
  }
  out.sort((a, b) => a.d - b.d);
  return out.slice(0, 14);
}

function syncResidents() {   // visible fish-folk ≈ pop, capped, anchored near homes
  const homes = buildings.filter(b => BLD[b.key].pop);
  const want = Math.min(pop, homes.length * 3, 24);
  while (residents.length > want) residents.pop();
  const R = mulberry(31 + residents.length);
  while (residents.length < want && homes.length) {
    const h = homes[residents.length % homes.length];
    const l = ledges[h.ledge];
    const hx = l.slots[h.slot].x, hy = l.y - 40;
    residents.push({ x: hx + rnd(-40, 40), y: hy + rnd(-30, 10), hx, hy,
      name: NAMES[(residents.length * 7 + 3) % NAMES.length], hue: (residents.length * 47) % 360,
      ph: rnd(0, TAU), waveT: 0, heartT: 0 });
  }
}

function puff(x, y, n, kind, hue) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), sp = rnd(20, 90);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0,
      maxlife: rnd(.5, 1.1), kind: kind || 'spark', size: rnd(2, 5), hue: hue ?? rnd(30, 60) });
  }
}
function floatText(x, y, txt, color) {
  particles.push({ x, y, vx: 0, vy: -46, life: 0, maxlife: 1.3, kind: 'text', txt, hue: 0, color: color || '#ffe9a3', size: 15 });

  particles.push({ x, y, vx: rnd(-12, 12), vy: -55, life: 0, maxlife: 1.4, kind: 'heart', size: rnd(9, 13), hue: 0 });

function confetti(x, y, n) {

    particles.push({ x: x + rnd(-30, 30), y: y + rnd(-20, 20), vx: rnd(-90, 90), vy: rnd(-160, -40),

/* ═══════════ ECONOMY + SYSTEMS ═══════════ */
let popTimer = 0, saveTimer = 0, hudDirty = true;
function gain(k, n, x, y) {
  const before = life[k];
  res[k] += n; life[k] += n;
  if (x !== undefined) floatText(x, y, '+' + n + ' ' + RESDEF[k].ico);
  if (before === 0 && life[k] > 0) hudDirty = true;
  bumpChip(k);
}
function canAfford(cost) { return Object.entries(cost).every(([k, v]) => res[k] >= v); }
function pay(cost) { for (const [k, v] of Object.entries(cost)) res[k] -= v; hudDirty = true; }
function costStr(cost) {
  return Object.entries(cost).map(([k, v]) =>
    `<span class="${res[k] >= v ? '' : 'no'}">${v} ${RESDEF[k].ico}</span>`).join(' ');
}

function popCap() { return buildings.reduce((s, b) => s + (BLD[b.key].pop || 0), 0); }

function tickEconomy(dt) {
  voltsMake = 0; voltsUse = 0;
  for (const b of buildings) { const d = BLD[b.key]; if (d.volts) voltsMake += d.volts; }
  let budget = voltsMake;
  for (const b of buildings) {
    const d = BLD[b.key];
    b.active = true;
    if (d.usevolts) {
      if (budget >= d.usevolts) { budget -= d.usevolts; voltsUse += d.usevolts; }
      else b.active = false;
    }
  }
  for (const b of buildings) {
    if (!b.active) continue;
    const d = BLD[b.key];
    if (d.cons) {
      let ok = Object.entries(d.cons).every(([k, v]) => res[k] >= v * dt);
      if (!ok) { b.active = false; continue; }
      for (const [k, v] of Object.entries(d.cons)) res[k] -= v * dt;
    }
    if (d.prod) for (const [k, v] of Object.entries(d.prod)) {
      const before = life[k];
      res[k] += v * dt; life[k] += v * dt;
      if (before === 0) hudDirty = true;
    }
  }
  /* population: grows when there's room and snacks in the pantry */
  popTimer += dt;
  if (popTimer > 3) {
    popTimer = 0;
    if (pop < popCap() && res.snacks >= 1) {
      res.snacks -= 1; pop++;
      syncResidents(); hudDirty = true;
      const homes = buildings.filter(b => BLD[b.key].pop);
      if (homes.length) {
        const h = pick(homes), l = ledges[h.ledge];
        puff(l.slots[h.slot].x, l.y - 30, 6, 'bubble');
        floatText(l.slots[h.slot].x, l.y - 60, '+1 👋');
      }
    }
  }
  /* nibbling: fish-folk snack slowly (never starve — kid friendly) */
  res.snacks = Math.max(0, res.snacks - pop * .012 * dt);
}

function spawnCrate(idx) {
  const x = clamp(player.x + rnd(-120, 120), wallL(player.y) + 60, wallR(player.y) - 60);
  crates.push({ x, y: Math.max(30, player.y - 200), vy: 30, idx, t: 0 });
}
function openCrate(c) {
  crates.splice(crates.indexOf(c), 1);
  cratesOpened++;
  SFX.crate(); confetti(c.x, c.y, 30);
  if (HAT_CRATES[c.idx] !== undefined && !hats.includes(HAT_CRATES[c.idx])) {

    hats.push(h); hatWorn = h;

  } else {
    const loot = {};

      loot[k] = (loot[k] || 0) + [12, 8, 10, 3, 8, 5, 3][RES_KEYS.indexOf(k)];
    }
    let dy = 0;
    for (const [k, v] of Object.entries(loot)) { gain(k, v); floatText(c.x, c.y - 20 - dy, '+' + v + ' ' + RESDEF[k].ico); dy += 26; }
  }
}

/* zone discovery + depth limit */
function tickZones() {
  const z = zoneAt(player.y);

    visitedZones[z] = true;
    banner(ZONES[z].name + '!', ZONES[z].sub);

  if (!wreckFound && dist(player.x, player.y, POI.wreck.x, POI.wreck.y - 80) < 320) {

  }
  if (!cityFound && player.y > 5400) {

/* ═══════════ SAVE / LOAD ═══════════ */
const SAVE_KEY = 'bubbledeep-save-v1';
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, res, life, gear, pop, goalI, cratesOpened, kelpCut, greeted, tacosFired, whalesHi,
      ruinsFixed, saucerStage, blastDone, petAdopted, hats, hatWorn, visitedZones,
      wreckFound, cityFound, saucerFound, playT,
      px: player.x, py: player.y,
      buildings: buildings.map(b => ({ k: b.key, l: b.ledge, s: b.slot })),
    }));
  } catch (e) {}
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return false;
    res = { ...res, ...d.res }; life = { ...life, ...d.life };
    gear = d.gear; pop = d.pop; goalI = d.goalI; cratesOpened = d.cratesOpened;
    kelpCut = d.kelpCut; greeted = d.greeted; tacosFired = d.tacosFired || 0; whalesHi = d.whalesHi || 0;
    ruinsFixed = d.ruinsFixed; saucerStage = d.saucerStage; blastDone = d.blastDone;
    petAdopted = d.petAdopted; hats = d.hats || []; hatWorn = d.hatWorn ?? -1;
    visitedZones = d.visitedZones; wreckFound = d.wreckFound; cityFound = d.cityFound;
    saucerFound = d.saucerFound; playT = d.playT || 0;
    player.x = d.px; player.y = Math.min(d.py, GEAR[gear].maxDepth - 50);
    buildings = [];
    for (const b of d.buildings) {
      if (!BLD[b.k] || !ledges[b.l] || !ledges[b.l].slots[b.s]) continue;
      const nb = { key: b.k, ledge: b.l, slot: b.s, t: rnd(0, 9), active: true };
      ledges[b.l].slots[b.s].bld = nb;
      buildings.push(nb);
    }
    if (petAdopted) { pet.on = true; pet.x = player.x + 40; pet.y = player.y; }
    syncResidents();
    return true;
  } catch (e) { return false; }
}
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ═══════════ INPUT ═══════════ */
const keys = {};
let joy = { on: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
let placing = null;                 // {key, cands, sel}
let panelMode = null;               // 'build' | 'gear' | 'stats' | 'elevator' | 'pause' | 'confirm'

function inputVec() {
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  if (joy.on) { dx += joy.dx; dy += joy.dy; }
  if (PADS) for (const pd of PADS) if (pd && pd.connected) {
    const lx = pd.axis('lx'), ly = pd.axis('ly');
    if (Math.abs(lx) > .18) dx += lx;
    if (Math.abs(ly) > .18) dy += ly;
  }
  const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  return [dx, dy];
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.code] = true;
  ensureAudio();
  document.body.classList.add('input-kb'); document.body.classList.remove('input-touch');
  const map = { KeyX: 'south', Space: 'south', KeyZ: 'east', Escape: 'east', KeyC: 'west', KeyB: 'west',
                KeyV: 'north', Enter: 'south', KeyM: 'mute', KeyP: 'start',
                ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (map[e.code]) onBtn(map[e.code]);
  if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* gamepads — guarded; the arcade shell hosts controller.js */
const AC = window.ArcadeController || null;
const PADS = AC ? [AC.pad(0), AC.pad(1)] : null;
if (AC) AC.on('press', e => { if (e.padIndex > 1) return; ensureAudio(); onBtn(e.button); });

/* touch: left-half joystick + DOM buttons */
function touchStart(ev) {
  ensureAudio();
  document.body.classList.add('input-touch'); document.body.classList.remove('input-kb');
  for (const t of ev.changedTouches) {
    if (t.clientX < VW * .45 && !joy.on) {
      joy.on = true; joy.id = t.identifier; joy.cx = t.clientX; joy.cy = t.clientY; joy.dx = joy.dy = 0;
      styleJoy(t.clientX, t.clientY, t.clientX, t.clientY);
    }
  }
}
function touchMove(ev) {
  for (const t of ev.changedTouches) if (joy.on && t.identifier === joy.id) {
    let dx = (t.clientX - joy.cx) / 46, dy = (t.clientY - joy.cy) / 46;
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    joy.dx = dx; joy.dy = dy;
    styleJoy(joy.cx, joy.cy, joy.cx + dx * 46, joy.cy + dy * 46);
  }
  ev.preventDefault();
}
function touchEnd(ev) {
  for (const t of ev.changedTouches) if (joy.on && t.identifier === joy.id) {
    joy.on = false; joy.dx = joy.dy = 0;
    document.getElementById('joyBase').style.opacity = document.getElementById('joyKnob').style.opacity = '';
  }
}
function styleJoy(bx, by, kx, ky) {
  const base = document.getElementById('joyBase'), knob = document.getElementById('joyKnob');
  base.style.left = (bx - 64) + 'px'; base.style.top = (by - 64) + 'px'; base.style.bottom = 'auto'; base.style.opacity = 1;
  knob.style.left = (kx - 28) + 'px'; knob.style.top = (ky - 28) + 'px'; knob.style.bottom = 'auto'; knob.style.opacity = 1;
}
canvas.addEventListener('touchstart', touchStart, { passive: true });
canvas.addEventListener('touchmove', touchMove, { passive: false });
canvas.addEventListener('touchend', touchEnd);
canvas.addEventListener('touchcancel', touchEnd);
function bindTb(id, b) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', ev => { ev.preventDefault(); ensureAudio(); onBtn(b); }, { passive: false });
  el.addEventListener('mousedown', ev => { ev.preventDefault(); onBtn(b); });
}
bindTb('tbA', 'south'); bindTb('tbB', 'west'); bindTb('tbStats', 'north');

/* unified button handler */
function onBtn(b) {
  if (b === 'mute') { muted = !muted; toast(muted ? '🔇 SOUND OFF' : '🔊 SOUND ON'); return; }
  if (scene === 'title') { titleBtn(b); return; }
  if (scene === 'blastoff') return;
  if (panelMode) { panelBtn(b); return; }
  if (placing) { placeBtn(b); return; }
  if (b === 'south') interact();
  else if (b === 'west') openBuildMenu();
  else if (b === 'north') openStats();
  else if (b === 'start' || b === 'east') openPause();
}

/* ═══════════ INTERACTION (X button) — the NEAREST thing wins ═══════════ */
function interact() {
  const px = player.x, py = player.y;
  const acts = [];
  const add = (x, y, r, fn) => { const d2 = dist(px, py, x, y); if (d2 < r) acts.push({ d: d2, fn }); };
  for (const c of crates) add(c.x, c.y, 80, () => openCrate(c));
  if (!petAdopted) add(POI.blub.x, POI.blub.y, 110, () => {
    if (res.snacks >= 5) {
      res.snacks -= 5; petAdopted = true; pet.on = true; pet.x = POI.blub.x; pet.y = POI.blub.y;
      banner('BLUB JOINED YOU!', 'Your glowing best friend forever! 💛');
      SFX.gearUp(); heart(POI.blub.x, POI.blub.y - 30); hudDirty = true;
    } else { floatText(POI.blub.x, POI.blub.y - 60, 'BLUB WANTS 5 🌮!', '#8fd8ff'); SFX.bloop(); }
  });
  if (whale.on) add(whale.x, whale.y, 260, () => {
    whale.greetT = 1.5; whalesHi++; heart(whale.x, whale.y - 90); heart(px, py - 40);
    SFX.whale(); floatText(whale.x, whale.y - 130, 'WHALE SAYS HELLOOOO', '#8fd8ff');
  });
  for (const r of residents) add(r.x, r.y, 70, () => {
    r.heartT = 1.2; r.waveT = 1.2; greeted++;
    heart(r.x, r.y - 34); SFX.hi(); floatText(r.x, r.y - 56, 'HI ' + r.name + '!');
  });
  for (const ru of ruins) if (!ruinsFixed[ru.i]) add(ru.x, ru.y - 40, 110, () => {
    const cost = RUIN_COSTS[ru.i];
    if (canAfford(cost)) {
      pay(cost); ruinsFixed[ru.i] = true;
      SFX.gearUp(); confetti(ru.x, ru.y - 60, 30); shake = 5;
      toast('🏛️ RUIN RESTORED! (' + ruinsFixed.filter(f => f).length + '/3)', 'gold');
      if (ruinsFixed.every(f => f)) banner('THE CITY AWAKENS!', 'Deep below, something hums to life…');
    } else { floatText(ru.x, ru.y - 80, 'NEEDS ' + Object.entries(cost).map(([k, v]) => v + ' ' + RESDEF[k].ico).join(' '), '#ff9f9f'); SFX.deny(); }
  });
  if (saucerFound) add(POI.saucer.x, POI.saucer.y - 50, 170, () => {
    if (saucerStage >= 3) { startBlastoff(); return; }
    const st = SAUCER_STAGES[saucerStage];
    if (canAfford(st.cost)) {
      pay(st.cost); saucerStage++;
      SFX.build(); SFX.rumble(); shake = 6; confetti(POI.saucer.x, POI.saucer.y - 60, 26);
      toast('🛸 ' + st.label + ' — STAGE ' + saucerStage + '/3 DONE!', 'gold');
      if (saucerStage >= 3) banner('THE SAUCER IS READY!', 'Press X to BLAST OFF, Captain!');
    } else {
      floatText(POI.saucer.x, POI.saucer.y - 130,
        st.label + ': ' + Object.entries(st.cost).map(([k, v]) => v + ' ' + RESDEF[k].ico).join(' '), '#9fe8ff');
      SFX.bloop();
    }
  });
  for (const b of buildings) {
    const d = BLD[b.key]; if (!d.interact) continue;
    const l = ledges[b.ledge], bx = l.slots[b.slot].x, by = l.y - 34;
    add(bx, by, 95, () => {
      if (d.interact === 'gear') openGearPanel();
      else if (d.interact === 'elevator') openElevator(b);
      else if (d.interact === 'taco') {
        if (res.snacks >= 1) {
          res.snacks--; tacosFired++; hudDirty = true;
          SFX.pop(); shake = 3;
          tacos.push({ x: bx, y: by - 20, vx: player.face * rnd(200, 320), vy: rnd(-260, -160), life: 0 });
        } else { floatText(bx, by - 50, 'NEED 1 🌮!', '#ff9f9f'); SFX.deny(); }
      }
    });
  }
  for (const nd of nodes) if (!nd.dead) add(nd.x, nd.y - 24, 90, () => harvest(nd));
  if (!acts.length) { SFX.blip(); return; }
  acts.sort((a, b) => a.d - b.d);
  acts[0].fn();
}

const NODE_YIELD = { kelp: ['kelp', 2], stone: ['stone', 2], scrap: ['scrap', 2], glow: ['glow', 2], crystal: ['crystal', 1] };
function harvest(nd) {
  nd.hp--;
  const [k, n] = NODE_YIELD[nd.kind];
  gain(k, n, nd.x, nd.y - 40);
  if (nd.kind === 'kelp') kelpCut += n;
  SFX.chop();
  puff(nd.x, nd.y - 20, 5, 'bubble');
  if (nd.hp <= 0) { nd.dead = 1; nd.respawn = rnd(18, 32); SFX.pop(); }
}

/* ═══════════ BUILD PLACEMENT ═══════════ */
function startPlacing(key) {
  const cands = freeSlots(player.x, player.y, 520);
  if (!cands.length) { toast('NO ROOM NEARBY — SWIM TO A LEDGE!'); SFX.deny(); return; }
  placing = { key, cands, sel: 0 };
  closePanel();
  toast('◀ ▶ PICK A SPOT · X BUILD · Z CANCEL');
}
function placeBtn(b) {
  if (b === 'left' || b === 'up') { placing.sel = (placing.sel + placing.cands.length - 1) % placing.cands.length; SFX.ui(); }
  else if (b === 'right' || b === 'down') { placing.sel = (placing.sel + 1) % placing.cands.length; SFX.ui(); }
  else if (b === 'south') {
    const c = placing.cands[placing.sel], d = BLD[placing.key];
    if (!canAfford(d.cost)) { SFX.deny(); toast('NOT ENOUGH STUFF YET!'); placing = null; return; }
    if (ledges[c.li].slots[c.si].bld) { SFX.deny(); placing = null; return; }
    pay(d.cost);
    const nb = { key: placing.key, ledge: c.li, slot: c.si, t: 0, active: true };
    ledges[c.li].slots[c.si].bld = nb;
    buildings.push(nb);
    SFX.build(); puff(c.x, c.y - 30, 14, 'bubble'); confetti(c.x, c.y - 40, 10);
    if (d.pop) syncResidents();
    placing = null; hudDirty = true;
    save();
  }
  else if (b === 'east' || b === 'west') { placing = null; SFX.ui(); }
}

/* ═══════════ UI — toasts, banner, HUD, panels ═══════════ */
function toast(msg, cls) {
  const t = document.createElement('div');
  t.className = 'toast' + (cls ? ' ' + cls : '');
  t.textContent = msg;
  const box = document.getElementById('toasts');
  box.appendChild(t);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(() => t.classList.add('out'), 2600);
  setTimeout(() => t.remove(), 3100);
}
let bannerTimer = null;
function banner(t1, t2) {
  const b = document.getElementById('banner');
  b.querySelector('.b1').textContent = t1;
  b.querySelector('.b2').textContent = t2 || '';

/* HUD chips (created lazily as resources are discovered) */
const chipEls = {};
function rebuildHUD() {
  const box = document.getElementById('chips');

    if (life[k] <= 0) continue;

function refreshHUD() {

/* panel plumbing */

  panelEl.innerHTML = html;

}
