<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
  :root {
    --bg: #0a0e27;
    --panel: #151a36;
    --panel-2: #1d2347;
    --yellow: #ffd23f;
    --cyan: #5fefff;
    --red: #ff4571;
    --green: #5dd66c;
    --magenta: #c45fff;
    --text: #f4f4f4;
    --dim: #6c7099;
    /* Base (unscaled) card size. Height/width-capped so the focused card
       (base × 1.35) always fits between the header and the dots — big on
       a 720p TV (~310px), a bit smaller on iPad portrait and phones. */
    --card: min(240px, 32vh, 42vw);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Press Start 2P', 'Courier New', monospace;
    overflow: hidden;
    -webkit-font-smoothing: none;
  }
  body {
    display: grid;
    place-items: center;
    padding:
      max(2vmin, env(safe-area-inset-top))
      max(2vmin, env(safe-area-inset-right))
      max(2vmin, env(safe-area-inset-bottom))
      max(2vmin, env(safe-area-inset-left));
    position: relative;
  }
  /* CRT scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.20) 3px,
      rgba(0,0,0,0) 4px
    );
    z-index: 999;
  }
  /* vignette */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 998;
  }
  .console {
    width: min(1240px, 98vw);
    height: min(96vh, 900px);
    max-height: 96vh;
    background: var(--panel);
    border: 6px solid var(--yellow);
    box-shadow:
      0 0 0 4px var(--bg),
      0 0 0 10px var(--cyan),
      0 0 60px rgba(95,239,255,0.20);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    z-index: 1;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 4px dashed var(--panel-2);
    padding-bottom: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .led {
    width: 14px;
    height: 14px;
    background: var(--green);
    box-shadow: 0 0 16px var(--green);
    animation: blink 1.6s infinite;
  }
  @keyframes blink {
    0%, 75% { opacity: 1; }
    76%, 100% { opacity: 0.25; }
  }
  .title {
    font-size: clamp(14px, 2.4vw, 24px);
    color: var(--yellow);
    letter-spacing: 3px;
    text-shadow: 3px 3px 0 var(--red);
    line-height: 1;
  }
  .subtitle {
    font-size: 8px;
    color: var(--cyan);
    margin-top: 8px;
    letter-spacing: 2px;
  }
  .coin {
    font-size: 9px;
    color: var(--dim);
    text-align: right;
    line-height: 1.9;
  }
  .coin .credits { color: var(--yellow); }
  .coin .ready { color: var(--green); animation: blink 1s infinite; }
  /* ── Console-style horizontal carousel ─────────────────────────────
     Cards are built once and positioned purely with translateX + scale
     (GPU-composited); navigating only rewrites transforms/opacity, so
     the Pi never re-runs layout mid-slide and idles with zero rAF work. */
  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    /* bleed to the console frame so cards slide under the bezel */
    margin: 0 -24px;
  }
  .carousel {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    touch-action: none;          /* we handle horizontal swipes ourselves */
    user-select: none;
    -webkit-user-select: none;
  }
  .track { position: absolute; inset: 0; }
  .card {
    position: absolute;
    left: 50%;
    top: 44%;                    /* nudged up to leave room for the caption */
    width: var(--card);
    height: var(--card);
    margin-left: calc(var(--card) / -2);
    margin-top: calc(var(--card) / -2);
    background: var(--panel-2);
    border: 4px solid var(--dim);
    cursor: pointer;
    outline: none;
    opacity: 0;
    will-change: transform, opacity;
    transition:
      transform 0.34s cubic-bezier(0.22, 0.9, 0.32, 1),
      opacity   0.34s ease,
      border-color 0.15s;
  }
  /* during a pointer drag (and on wrap-around teleports) cards move
     instantly — the eased transition only runs on real slides */
  .carousel.dragging .card,
  .card.snap { transition: none; }
  .card:hover { border-color: var(--text); }
  .card.selected {
    border-color: var(--yellow);
    box-shadow:
      8px 8px 0 var(--red),
      0 0 44px rgba(255, 210, 63, 0.28);
  }
  .icon {
    width: 100%;
    height: 100%;
    display: block;
  }
  .caption {
    position: absolute;
    top: calc(100% + 14px);
    left: 50%;
    width: 170%;
    transform: translateX(-50%);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 9px;
    opacity: 0;
    transition: opacity 0.25s ease 0.05s;
    pointer-events: none;
  }
  .card.selected .caption { opacity: 1; }
  .card-title {
    font-size: 11px;
    color: var(--text);
    letter-spacing: 1px;
    line-height: 1.5;
  }
  .card.selected .card-title::before { content: '\25B6 '; color: var(--yellow); }
  .card.selected .card-title::after  { content: ' \25C0'; color: var(--yellow); }
  .card-genre {
    font-size: 8px;
    color: var(--cyan);
    letter-spacing: 1px;
  }
  .card-status {
    font-size: 8px;
    color: var(--yellow);
    letter-spacing: 1px;
    animation: blink 0.7s infinite;
  }
  /* TV-style position dots */
  .dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 8px 0 2px;
  }
  .dot {
    width: 10px;
    height: 10px;
    background: var(--panel-2);
    border: 2px solid var(--dim);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .dot.active {
    background: var(--yellow);
    border-color: var(--yellow);
    transform: scale(1.3);
    box-shadow: 0 0 12px rgba(255, 210, 63, 0.55);
  }
  /* console mode convention: pads drive the UI, hide the pointer */
  body.input-pad, body.input-pad * { cursor: none !important; }
  /* Install prompt (iOS Add to Home Screen) */
  .install-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 7px;
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    padding: 5px 8px;
    margin-top: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.1s, color 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .install-chip:hover, .install-chip:focus-visible {
    background: var(--cyan);
    color: var(--bg);
    outline: none;
  }
  .install-chip[hidden] { display: none !important; }
  #install-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    z-index: 1000;
    display: grid;
    place-items: center;
    padding: 4vmin;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #install-overlay[hidden] { display: none; }
  .install-card {
    background: var(--panel);
    border: 4px solid var(--yellow);
    box-shadow:
      0 0 0 2px var(--bg),
      0 0 0 6px var(--red),
      6px 6px 0 rgba(0,0,0,0.5);
    padding: 28px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .install-title {
    font-size: 13px;
    color: var(--yellow);
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--red);
    line-height: 1.2;
  }
  .install-sub {
    font-size: 8px;
    color: var(--cyan);
    letter-spacing: 1px;
    margin: 12px 0 22px;
  }
  .install-steps {
    list-style: none;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 0 0 22px 0;
    padding: 0;
  }
  .install-steps li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--text);
    line-height: 1.4;
  }
  .step-num {
    background: var(--yellow);
    color: var(--bg);
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    font-size: 9px;
    flex: 0 0 22px;
  }
  .step-text { flex: 1; }
  .share-icon {
    width: 22px;
    height: 26px;
    flex: 0 0 22px;
  }
  .share-icon path, .share-icon line, .share-icon polyline {
    stroke: var(--cyan);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .addhome-mini {
    font-size: 7px;
    background: var(--panel-2);
    padding: 5px 7px;
    border: 2px solid var(--dim);
    color: var(--cyan);
    letter-spacing: 1px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .install-dismiss {
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 2px;
    background: var(--green);
    color: var(--bg);
    border: 4px solid var(--green);
    padding: 12px 22px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .install-dismiss:hover, .install-dismiss:focus-visible {
    background: var(--bg);
    color: var(--green);
    outline: none;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 8px;
    color: var(--dim);
    border-top: 4px dashed var(--panel-2);
    padding-top: 16px;
    letter-spacing: 1px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hints { display: flex; gap: 18px; flex-wrap: wrap; }
  .key {
    display: inline-block;
    padding: 4px 6px;
    background: var(--panel-2);
    border: 2px solid var(--dim);
    color: var(--text);
    margin-right: 4px;
  }
  @media (max-width: 520px) {
    .console { padding: 16px; gap: 14px; }
    .stage { margin: 0 -16px; }
    .card-title { font-size: 9px; }
    .card-genre { font-size: 7px; }
    .card-status { font-size: 7px; }
    .dots { gap: 9px; }
    .dot { width: 8px; height: 8px; }
    .hints { display: none; }
  }
</style>
</head>
<body>
  <main class="console" aria-label="Game console home screen">
    <div class="header">
      <div class="brand">
        <div class="led" aria-hidden="true"></div>
        <div>
          <div class="title">STEPHENS ARCADE</div>
          <div class="subtitle">8-BIT FAMILY SYSTEM</div>
        </div>
      </div>
      <div class="coin">
        <div>CREDITS <span class="credits">&#8734;</span></div>
        <div><span class="ready">P1 READY</span></div>
        <button type="button" class="install-chip" id="install-chip" hidden>&#9660; ADD TO HOME</button>
      </div>
    </div>

    <div class="stage">
      <div class="carousel" id="carousel" role="listbox" aria-label="Game carousel">
        <div class="track" id="track"></div>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>

    <div class="footer">
      <div class="hints">
        <span><span class="key">&#9664;</span><span class="key">&#9654;</span> SELECT</span>
        <span><span class="key">&#9166;</span> START</span>
      </div>
      <div>&copy; STEPHENS BROS. &middot; V1.0</div>
    </div>
  </main>

  <div id="install-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="install-title">
    <div class="install-card">
      <div class="install-title" id="install-title">ADD TO HOME SCREEN</div>
      <div class="install-sub">INSTALL STEPHENS ARCADE AS AN APP</div>
      <ol class="install-steps">
        <li>
          <span class="step-num">1</span>
          <span class="step-text">TAP THE SHARE BUTTON IN SAFARI</span>
          <svg class="share-icon" viewBox="0 0 24 28" aria-hidden="true">
            <line x1="12" y1="3" x2="12" y2="17"/>
            <polyline points="6,9 12,3 18,9"/>
            <path d="M5 12 L5 25 L19 25 L19 12"/>
          </svg>
        </li>
        <li>
          <span class="step-num">2</span>
          <span class="step-text">SCROLL DOWN AND TAP</span>
          <span class="addhome-mini">+ ADD TO HOME SCREEN</span>
        </li>
        <li>
          <span class="step-num">3</span>
          <span class="step-text">TAP "ADD" TO PIN THE ARCADE</span>
        </li>
      </ol>
      <button type="button" class="install-dismiss" id="install-dismiss">GOT IT</button>
    </div>
  </div>

<script>
// Low-effects mode for the Pi console: the kiosk loads the arcade with
// ?fx=low, and this persists the flag so every game on the origin sees it
// (games apply it via the injected __arcade_lowfx overlay). ?fx=full undoes.
try {
  if (/[?&]fx=low\b/.test(location.search)) localStorage.setItem('arcade_lowfx', '1');
  else if (/[?&]fx=full\b/.test(location.search)) localStorage.setItem('arcade_lowfx', '0');
  if (localStorage.getItem('arcade_lowfx') === '1') {
    // Console mode: no mouse exists, so never show a cursor.
    document.head.insertAdjacentHTML('beforeend', '<style>* { cursor: none !important; }</style>');
  }
} catch (e) {}

// Tile data lives in games.json (hand-edited source of truth). The bundle
// script generates games.js from it — a tiny shim that sets window.GAMES_DATA
// — and we load it via a <script> tag in <head>. Adding a new game is one
// entry in games.json plus an icon builder below; nothing to touch here.
let GAMES = window.GAMES_DATA || [];

// Icons rendered onto a 180x180 canvas, then cached as data URLs.
// The Phaser Wars icon is ported verbatim from fightinggame.html's
// installAppIcon() so it matches the in-game iPad/home-screen icon.
// The baseball icon uses the same space backdrop + glow language to feel
// like a matching set: a wood bat crossed with a flaming comet baseball.
// The meteor icon goes vertical (rock + rising plume) so its silhouette
// reads as distinct from the two crossed-diagonal compositions. The
// rocket icon inverts it (body up top, exhaust below) so meteor + rocket
// read as a matched pair rather than a duplicate at thumbnail size.
// The quarry icon goes isometric (3D stacked cubes) — a third silhouette
// family that doesn't compete with either the crossed pair or the
// vertical pair.
// The ghost icon is the first character-silhouette in the lineup, with a
// purple glow pulled from Ghost Patrol's own theme color.
const ICON_CACHE = {};

function drawSpaceBackdrop(cx) {
  cx.fillStyle = '#0a0a20';
  cx.fillRect(0, 0, 180, 180);
  const grd = cx.createRadialGradient(90, 90, 30, 90, 90, 135);
  grd.addColorStop(0, '#252560');
  grd.addColorStop(1, '#000');
  cx.fillStyle = grd;
  cx.fillRect(0, 0, 180, 180);
  for (let i = 0; i < 30; i++) {
    cx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.55})`;
    cx.beginPath();
    cx.arc(Math.random() * 180, Math.random() * 180, Math.random() * 1.4 + 0.4, 0, Math.PI * 2);
    cx.fill();
  }
}

const ICON_BUILDERS = {
  // Fallen Moon — dusk over the dry bay: crescent shard, first star, village
  moon(cx) {
    // dusk gradient sky (the game's payoff moment)
    const sky = cx.createLinearGradient(0, 0, 0, 180);
    sky.addColorStop(0, '#5a6a9a'); sky.addColorStop(0.55, '#c9a27e');
    sky.addColorStop(1, '#e8c9a0');
    cx.fillStyle = sky; cx.fillRect(0, 0, 180, 180);
    // the crescent horn: pale glass crescent, glowing
    cx.save();
    cx.translate(112, 58); cx.rotate(-0.35);
    cx.fillStyle = '#f2ead8';
    cx.beginPath(); cx.arc(0, 0, 34, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#8d97b8';                        // dusk-sky bite
    cx.globalCompositeOperation = 'source-atop';
    cx.beginPath(); cx.arc(-16, -8, 30, 0, Math.PI * 2); cx.fill();
    cx.globalCompositeOperation = 'source-over';
    cx.restore();
    // repaint the bite with sky so the crescent floats
    cx.save();
    cx.translate(112, 58); cx.rotate(-0.35);
    const bite = cx.createLinearGradient(-40, -40, -4, 20);
    bite.addColorStop(0, '#5f6f9d'); bite.addColorStop(1, '#a08a92');
    cx.fillStyle = bite;
    cx.beginPath(); cx.arc(-16, -8, 29, 0, Math.PI * 2); cx.fill();
    cx.restore();
    // the first star: small point + cross flare
    cx.fillStyle = '#fff';
    cx.fillRect(43, 34, 3, 3);
    cx.globalAlpha = 0.7;
    cx.fillRect(44, 26, 1, 19); cx.fillRect(36, 35, 19, 1);
    cx.globalAlpha = 1;
    // dry-bay ground, cracked-mud lines, village silhouette
    cx.fillStyle = '#c8ab84'; cx.fillRect(0, 132, 180, 48);
    cx.strokeStyle = 'rgba(122,95,66,0.55)'; cx.lineWidth = 2;
    cx.beginPath();
    cx.moveTo(12, 150); cx.lineTo(52, 158); cx.lineTo(88, 150);
    cx.moveTo(60, 172); cx.lineTo(104, 164); cx.lineTo(150, 172);
    cx.stroke();
    // two houses + lighthouse, hard dusk shadows stretching right
    cx.fillStyle = 'rgba(60,52,88,0.42)';
    cx.fillRect(34, 126, 34, 5); cx.fillRect(104, 128, 40, 5);
    cx.fillStyle = '#efe6d6';
    cx.fillRect(24, 110, 22, 20); cx.fillRect(96, 112, 22, 18);
    cx.fillStyle = '#a8422e';
    cx.beginPath(); cx.moveTo(20, 112); cx.lineTo(35, 100); cx.lineTo(50, 112); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(92, 114); cx.lineTo(107, 103); cx.lineTo(122, 114); cx.closePath(); cx.fill();
    cx.fillStyle = '#f4efe4'; cx.fillRect(146, 96, 10, 34);   // lighthouse
    cx.fillStyle = '#a8422e'; cx.fillRect(144, 90, 14, 8);
    cx.fillStyle = '#ffd889'; cx.fillRect(148, 92, 6, 4);
  },

  // Powder Peak — alpenglow sky over a low-poly slope, red-jacket skier carving spray
  powder(cx) {
    // alpenglow sky bands (peach → pink → lavender)
    cx.fillStyle = '#ffd9a0'; cx.fillRect(0, 0, 180, 44);
    cx.fillStyle = '#ffb9a4'; cx.fillRect(0, 44, 180, 26);
    cx.fillStyle = '#e8a8c8'; cx.fillRect(0, 70, 180, 22);
    cx.fillStyle = '#b8a8e0'; cx.fillRect(0, 92, 180, 30);
    // low sun with faked halo
    cx.fillStyle = 'rgba(255,220,140,0.45)'; cx.beginPath(); cx.arc(132, 46, 22, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#fff0b8'; cx.beginPath(); cx.arc(132, 46, 12, 0, Math.PI * 2); cx.fill();
    // far peaks (dusky slate, snow caps)
    cx.fillStyle = '#7a6a96';
    cx.beginPath(); cx.moveTo(-10, 96); cx.lineTo(38, 40); cx.lineTo(86, 96); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(70, 96); cx.lineTo(126, 52); cx.lineTo(184, 96); cx.closePath(); cx.fill();
    cx.fillStyle = '#f3ecfa';
    cx.beginPath(); cx.moveTo(26, 54); cx.lineTo(38, 40); cx.lineTo(50, 54); cx.lineTo(38, 60); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(114, 62); cx.lineTo(126, 52); cx.lineTo(139, 62); cx.lineTo(126, 68); cx.closePath(); cx.fill();
    // foreground piste: two big faceted snow planes
    cx.fillStyle = '#e9ecfb';
    cx.beginPath(); cx.moveTo(0, 96); cx.lineTo(180, 96); cx.lineTo(180, 180); cx.lineTo(0, 180); cx.closePath(); cx.fill();
    cx.fillStyle = '#d4dbf5';
    cx.beginPath(); cx.moveTo(0, 180); cx.lineTo(70, 96); cx.lineTo(180, 130); cx.lineTo(180, 180); cx.closePath(); cx.fill();
    cx.fillStyle = '#c3cbec';
    cx.beginPath(); cx.moveTo(96, 180); cx.lineTo(180, 130); cx.lineTo(180, 180); cx.closePath(); cx.fill();
    // snow-capped pines flanking the run
    for (const [tx, ty, s] of [[22, 104, 1], [152, 112, 0.8]]) {
      cx.fillStyle = '#5a3a22'; cx.fillRect(tx - 3 * s, ty + 26 * s, 6 * s, 8 * s);
      cx.fillStyle = '#2c6e46';
      cx.beginPath(); cx.moveTo(tx - 16 * s, ty + 28 * s); cx.lineTo(tx, ty - 4 * s); cx.lineTo(tx + 16 * s, ty + 28 * s); cx.closePath(); cx.fill();
      cx.beginPath(); cx.moveTo(tx - 12 * s, ty + 12 * s); cx.lineTo(tx, ty - 14 * s); cx.lineTo(tx + 12 * s, ty + 12 * s); cx.closePath(); cx.fill();
      cx.fillStyle = '#f3f6ff';
      cx.beginPath(); cx.moveTo(tx - 6 * s, ty - 5 * s); cx.lineTo(tx, ty - 14 * s); cx.lineTo(tx + 6 * s, ty - 5 * s); cx.closePath(); cx.fill();
    }

    cx.fill();

    // craters
    cx.fillStyle = '#2a1810';
    for (const [px, py, r] of [[-10, 6, 5.5], [12, 0, 4], [-16, 18, 3.5], [16, 16, 3]]) {
      cx.beginPath();
      cx.arc(px, py, r, 0, Math.PI * 2);
      cx.fill();
    }
    cx.restore();
  },

  // ascending rocket — body up top, exhaust below. Colors lifted from the
  // game's own favicon (red body, cyan porthole, yellow fins/flame).
  rocket(cx) {
    // exhaust plume below the rocket (drawn first so the rocket body
    // covers the top of the flame)
    function drawFlame(width, length, color, blur) {
      cx.save();
      cx.translate(90, 118);
      cx.shadowBlur = blur;
      cx.shadowColor = color;
      cx.fillStyle = color;
      cx.beginPath();
      cx.moveTo(-width, 0);
      cx.quadraticCurveTo(-width * 0.4, length * 0.55, 0, length);
      cx.quadraticCurveTo(width * 0.4, length * 0.55, width, 0);
      cx.quadraticCurveTo(0, -width * 0.6, -width, 0);
      cx.closePath();
      cx.fill();
      cx.restore();
    }
    drawFlame(24, 56, '#ff5e1a', 28);
    drawFlame(15, 44, '#ffd23f', 18);
    drawFlame( 6, 32, '#fff7c2',  0);

    cx.save();
    cx.translate(90, 90);

    // main body — pointed nose, rounded shoulders, slight taper
    cx.shadowBlur = 24;
    cx.shadowColor = '#ff4571';
    cx.fillStyle = '#ff4571';
    cx.beginPath();
    cx.moveTo(0, -58);
    cx.quadraticCurveTo(24, -36, 24, -10);
    cx.lineTo(24, 26);
    cx.lineTo(-24, 26);
    cx.lineTo(-24, -10);
    cx.quadraticCurveTo(-24, -36, 0, -58);
    cx.closePath();
    cx.fill();

    // left-edge body sheen
    cx.shadowBlur = 0;
    cx.fillStyle = 'rgba(255,210,220,0.55)';
    cx.fillRect(-19, -32, 5, 56);

    // porthole — cyan ring, dark inset, cyan core, white spec
    cx.shadowBlur = 14;
    cx.shadowColor = '#5fefff';
    cx.fillStyle = '#5fefff';
    cx.beginPath();
    cx.arc(0, -8, 12, 0, Math.PI * 2);
    cx.fill();
    cx.shadowBlur = 0;
    cx.fillStyle = '#0a0e27';
    cx.beginPath();
    cx.arc(0, -8, 9, 0, Math.PI * 2);
    cx.fill();
    cx.fillStyle = '#5fefff';
    cx.beginPath();
    cx.arc(0, -8, 5.5, 0, Math.PI * 2);
    cx.fill();
    cx.fillStyle = 'rgba(255,255,255,0.95)';
    cx.beginPath();
    cx.arc(-2.5, -10.5, 2.2, 0, Math.PI * 2);
    cx.fill();

    // fins — yellow triangles flaring from the base
    cx.fillStyle = '#ffd23f';
    cx.beginPath();
    cx.moveTo(-24,   6);
    cx.lineTo(-40,  30);
    cx.lineTo(-24,  30);
    cx.closePath();
    cx.fill();
    cx.beginPath();
    cx.moveTo( 24,   6);
    cx.lineTo( 40,  30);
    cx.lineTo( 24,  30);
    cx.closePath();
    cx.fill();

    // engine bell at the base
    cx.fillStyle = '#2a1a0a';
    cx.fillRect(-10, 26, 20, 6);

    cx.restore();
  },

  // isometric stack of 3 stone cubes in an L-tromino shape (two on the
  // floor, one stacked on the left) — reads as "quarry blocks" without
  // borrowing from any of the existing icons.
  quarry(cx) {
    function drawCube(x, y, s) {
      const w = s * 0.866;
      const h = s * 0.5;
      // top face (rhombus)
      cx.fillStyle = '#8a8aa0';
      cx.beginPath();
      cx.moveTo(x,     y);
      cx.lineTo(x + w, y - h);
      cx.lineTo(x,     y - 2 * h);
      cx.lineTo(x - w, y - h);
      cx.closePath();
      cx.fill();
      // right face (darker than top)
      cx.fillStyle = '#5e5e72';
      cx.beginPath();
      cx.moveTo(x,     y);
      cx.lineTo(x + w, y - h);
      cx.lineTo(x + w, y - h + s);
      cx.lineTo(x,     y + s);
      cx.closePath();
      cx.fill();
      // left face (darkest)
      cx.fillStyle = '#3e3e54';
      cx.beginPath();
      cx.moveTo(x,     y);
      cx.lineTo(x - w, y - h);
      cx.lineTo(x - w, y - h + s);
      cx.lineTo(x,     y + s);
      cx.closePath();
      cx.fill();
      // top-edge highlights (cool cyan-tinted to tie into family glow)
      cx.strokeStyle = 'rgba(180,200,220,0.85)';
      cx.lineWidth = 1.5;
      cx.beginPath();
      cx.moveTo(x - w, y - h);
      cx.lineTo(x,     y - 2 * h);
      cx.lineTo(x + w, y - h);
      cx.stroke();
      cx.beginPath();
      cx.moveTo(x, y - 2 * h);
      cx.lineTo(x, y);
      cx.stroke();
      // stone texture marks on the top face
      cx.fillStyle = '#2a2a36';
      cx.fillRect(x - 5, y - h - 1, 3, 3);
      cx.fillRect(x + 5, y - h * 1.5, 2.5, 2.5);
      cx.fillRect(x - w * 0.5, y - h * 0.7, 2, 2);
    }

    const s = 34;
    const w = s * 0.866;
    const h = s * 0.5;
    // anchor (TF of the bottom-front-left cube)
    const ax = 60, ay = 140;

    // soft cyan glow under the whole stack — ties into the family glow
    cx.save();
    cx.shadowBlur = 26;
    cx.shadowColor = '#5fefff';

    // draw order: back cube first, then front-left cube, then the stacked
    // cube on top — painters' algorithm in iso space.
    drawCube(ax + w,   ay - h, s);   // back-right (floor)
    drawCube(ax,       ay,     s);   // front-left (floor)
    drawCube(ax,       ay - s, s);   // top of front-left

    cx.restore();
  },

  // big centered ghost with a scalloped tail, two eyes, and a small "oh"
  // mouth. Purple glow pulled from Ghost Patrol's own theme color.
  ghost(cx) {
    cx.save();
    cx.translate(90, 92);

    // body — sheet-ghost silhouette
    cx.shadowBlur = 32;
    cx.shadowColor = '#c45fff';
    cx.fillStyle = '#f0f0ff';
    cx.beginPath();
    cx.moveTo(-38, 0);
    // dome head (bezier from left shoulder over the top to right shoulder)
    cx.bezierCurveTo(-38, -56, 38, -56, 38, 0);
    // right side straight down to the bottom waveline
    cx.lineTo(38, 28);
    // 4 scalloped bumps along the bottom (the "tail" of the ghost)
    cx.quadraticCurveTo( 28, 44,  19, 28);
    cx.quadraticCurveTo(  9, 44,   0, 28);
    cx.quadraticCurveTo( -9, 44, -19, 28);
    cx.quadraticCurveTo(-28, 44, -38, 28);
    cx.closePath();
    cx.fill();

    // eyes — black ovals with a small white catchlight
    cx.shadowBlur = 0;
    cx.fillStyle = '#0a0a20';
    cx.beginPath();
    cx.ellipse(-13, -12, 7, 10, 0, 0, Math.PI * 2);
    cx.fill();
    cx.beginPath();
    cx.ellipse( 13, -12, 7, 10, 0, 0, Math.PI * 2);
    cx.fill();
    cx.fillStyle = '#ffffff';
    cx.beginPath();
    cx.arc(-15, -15, 2, 0, Math.PI * 2);
    cx.fill();
    cx.beginPath();
    cx.arc( 11, -15, 2, 0, Math.PI * 2);
    cx.fill();

    // small surprised "oh" mouth
    cx.fillStyle = '#0a0a20';
    cx.beginPath();
    cx.ellipse(0, 8, 5, 7, 0, 0, Math.PI * 2);
    cx.fill();

    cx.restore();
  }
};

// Home-screen icon for iPad / iPhone "Add to Home Screen" and the browser
// tab favicon. Built on the same dark space backdrop as the game tiles so
// the console reads as a matching set: a glowing red ball-top arcade
// joystick on a starfield. Drawn at 180x180 (Apple's recommended size).
(function installAppIcon() {
  const c = document.createElement('canvas');
  c.width = c.height = 180;
  const cx = c.getContext('2d');

  drawSpaceBackdrop(cx);

  // joystick base (dark metal plate with a top highlight and bottom shadow)
  cx.fillStyle = '#222';
  cx.fillRect(38, 130, 104, 24);
  cx.fillStyle = '#3a3a3a';
  cx.fillRect(38, 130, 104, 5);
  cx.fillStyle = '#000';
  cx.fillRect(38, 150, 104, 4);
  // base bolts
  cx.fillStyle = '#888';
  cx.fillRect(46, 140, 4, 4);
  cx.fillRect(130, 140, 4, 4);

  // collar where the stick enters the base
  cx.fillStyle = '#111';
  cx.fillRect(74, 122, 32, 12);
  cx.fillStyle = '#444';
  cx.fillRect(74, 122, 32, 3);

  // stick (silver column with a gradient)
  const stickGrd = cx.createLinearGradient(82, 0, 98, 0);
  stickGrd.addColorStop(0, '#666');
  stickGrd.addColorStop(0.5, '#dcdcdc');
  stickGrd.addColorStop(1, '#666');
  cx.fillStyle = stickGrd;
  cx.fillRect(82, 58, 16, 70);

  // ball top — red, glowing (same shadow language as the saber blade)
  cx.shadowBlur = 32;
  cx.shadowColor = '#ff5252';
  cx.fillStyle = '#ff3a3a';
  cx.beginPath();
  cx.arc(90, 52, 30, 0, Math.PI * 2);
  cx.fill();
  cx.shadowBlur = 0;

  // specular highlights on the ball
  cx.fillStyle = 'rgba(255,255,255,0.55)';
  cx.beginPath();
  cx.arc(80, 42, 8, 0, Math.PI * 2);
  cx.fill();
  cx.fillStyle = 'rgba(255,255,255,0.9)';
  cx.beginPath();
  cx.arc(78, 40, 3, 0, Math.PI * 2);
  cx.fill();

  const url = c.toDataURL('image/png');
  document.querySelectorAll(
    'link[rel="apple-touch-icon"], link[rel="apple-touch-icon-precomposed"], link[rel="icon"]'
  ).forEach(l => l.remove());
  const links = [
    { rel: 'apple-touch-icon',             href: url, sizes: '180x180' },
    { rel: 'apple-touch-icon-precomposed', href: url, sizes: '180x180' },
    { rel: 'icon', type: 'image/png',      href: url, sizes: '180x180' }
  ];
  for (const cfg of links) {
    const link = document.createElement('link');
    Object.entries(cfg).forEach(([k, v]) => link.setAttribute(k, v));
    document.head.appendChild(link);
  }
})();

// Fallback tile art for games that don't have a hand-drawn icon yet — same
// starfield as the rest, with the game's first letter as a chunky glyph.
// Lets new games go live the moment they're added to games.json; the real
// icon can be designed any time after.
function drawDefaultIcon(cx, title) {
  const letter = (title || '?').charAt(0).toUpperCase();
  cx.font = 'bold 110px "Press Start 2P", "Courier New", monospace';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillStyle = '#ff4571';
  cx.fillText(letter, 94, 96);
  cx.fillStyle = '#ffd23f';
  cx.fillText(letter, 90, 92);
}

function buildIcon(name, title) {
  const key = (name || '') + '|' + (title || '');
  if (ICON_CACHE[key]) return ICON_CACHE[key];
  // Carousel cards show the art at ~310px, so rasterize the 180x180 icon
  // designs at 2x — every builder still draws in its native 180 space.
  const c = document.createElement('canvas');
  c.width = c.height = 360;
  const cx = c.getContext('2d');
  cx.scale(2, 2);
  drawSpaceBackdrop(cx);
  const fn = ICON_BUILDERS[name];
  if (fn) fn(cx);
  else drawDefaultIcon(cx, title);
  ICON_CACHE[key] = c.toDataURL('image/png');
  return ICON_CACHE[key];
}

// ── Carousel engine ─────────────────────────────────────────────────
// Cards are built ONCE; every subsequent update (nav / drag / resize)
// only rewrites transform + opacity. Slides ride CSS transitions, so
// there is no rAF loop while the menu idles. Focus wraps end-to-end
// for any game count: each card sits at its shortest circular offset
// from the focused one, and cards past VISIBLE_RANGE fade out.
const FOCUS_SCALE = 1.35;
const NEIGHBOR_SCALE = 0.84;
const FAR_SCALE = 0.72;
const VISIBLE_RANGE = 2;               // |offset| beyond this is hidden

let selected = 0;
let cards = [];
let slotW = 280;                        // px between slots; measured in measure()
let dragX = 0;                          // live pointer-drag offset

const carouselEl = document.getElementById('carousel');
const trackEl = document.getElementById('track');
const dotsEl = document.getElementById('dots');

// Shortest signed circular distance from the focused card to card i.
function circularOffset(i) {
  const n = GAMES.length;
  let d = i - selected;
  if (d > n / 2) d -= n;
  else if (d < -n / 2) d += n;
  return d;
}

// Continuous scale/opacity curves over |effective offset| so a live drag
// morphs cards smoothly; at integer offsets they land on the fixed steps.
function scaleFor(t) {
  if (t < 1) return FOCUS_SCALE + (NEIGHBOR_SCALE - FOCUS_SCALE) * t;
  if (t < 2) return NEIGHBOR_SCALE + (FAR_SCALE - NEIGHBOR_SCALE) * (t - 1);
  return FAR_SCALE;
}
function opacityFor(t) {
  if (t < 1) return 1 - 0.28 * t;
  if (t < 2) return 0.72 - 0.34 * (t - 1);
  if (t < VISIBLE_RANGE + 1) return 0.38 * (VISIBLE_RANGE + 1 - t);
  return 0;
}

function layout() {
  if (!GAMES.length) return;
  let snapped = false;
  cards.forEach((el, i) => {
    const d = circularOffset(i);
    // A wrap-around teleports a card from one edge to the other. It is
    // invisible (or a clipped sliver) at both ends, so skip the eased
    // transition for that card only — everything else slides normally.
    if (el._d !== null && Math.abs(d - el._d) > 1) {
      el.classList.add('snap');
      snapped = true;
    }
    el._d = d;
    const eff = d + dragX / slotW;   // effective offset incl. live drag
    const a = Math.abs(eff);
    el.style.transform = `translateX(${d * slotW + dragX}px) scale(${scaleFor(a)})`;
    el.style.opacity = String(opacityFor(a));
    el.style.zIndex = String(100 - Math.round(a));
    el.classList.toggle('selected', d === 0);
  });
  if (snapped) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      cards.forEach(el => el.classList.remove('snap'));
    }));
  }
  for (let i = 0; i < dotsEl.children.length; i++) {
    dotsEl.children[i].classList.toggle('active', i === selected);
  }
}

// Slot pitch derives from the real (media-query-sized) card width, so the
// carousel re-spaces itself on rotation / window resize.
function measure() {
  const w = cards[0] ? cards[0].offsetWidth : 240;
  slotW = Math.round(w * 1.22);
}

function buildCarousel() {
  trackEl.innerHTML = GAMES.map((g, i) => `
    <div class="card" data-i="${i}" tabindex="0" role="option" aria-label="Launch ${g.title}">
      <img class="icon" src="${buildIcon(g.icon, g.title)}" alt="" draggable="false">
      <div class="caption">
        <div class="card-title">${g.title}</div>
        <div class="card-genre">${g.genre}</div>
        <div class="card-status">${g.status}</div>
      </div>
    </div>
  `).join('');
  cards = Array.from(trackEl.children);
  cards.forEach(el => {
    el._d = null;
    // Tab / assistive focus recenters the carousel on that card.
    el.addEventListener('focus', () => {
      carouselEl.scrollLeft = 0;   // overflow:hidden still scrolls on focus
      const i = +el.dataset.i;
      if (i !== selected) { selected = i; layout(); }
    });
  });
  dotsEl.innerHTML = GAMES.map((g, i) => `<div class="dot" data-i="${i}"></div>`).join('');
  Array.from(dotsEl.children).forEach(dot => {
    dot.addEventListener('click', () => {
      const i = +dot.dataset.i;
      if (i !== selected) { selected = i; layout(); beep(660, 0.05); }
    });
  });
  measure();
  layout();
}

function launch() {
  const game = GAMES[selected];
  if (!game) return;
  beep(440, 0.08);
  setTimeout(() => beep(660, 0.08), 80);
  document.body.style.transition = 'opacity 0.25s';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = 'games/' + game.slug + '/'; }, 260);
}

function navMenu(step) {
  const n = GAMES.length;
  if (n < 2) return;
  selected = (selected + step + n) % n;
  layout();
  beep(660, 0.05);
}

// Keyboard — left/right slides, Enter/Space launches. Up/down are eaten
// (reserved for future rows) so the page never scrolls.
document.addEventListener('keydown', (e) => {
  if (!GAMES.length) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); navMenu(+1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); navMenu(-1); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); launch(); }
});

// Gamepad menu nav — d-pad left/right slides, south (X / A) or start
// launches. Up/down reserved for future rows. Either pad can drive.
if (window.ArcadeController) {
  window.ArcadeController.on('press', (e) => {
    if (e.button === 'right') navMenu(+1);
    else if (e.button === 'left') navMenu(-1);
    else if (e.button === 'south' || e.button === 'start') launch();
  });
  // Analog stick nav: controller.js only fires digital press events, so we
  // sample the left stick at ~15Hz (edge-trigger + hold-repeat). This is a
  // timer, not rAF work, and costs nothing while pads are idle.
  let stickDir = 0, stickNext = 0;
  setInterval(() => {
    let v = 0;
    for (let p = 0; p < 4; p++) {
      const a = window.ArcadeController.pad(p).axis('lx');
      if (Math.abs(a) > Math.abs(v)) v = a;
    }
    const dir = v > 0.5 ? 1 : v < -0.5 ? -1 : 0;
    const now = performance.now();
    if (dir !== stickDir) {
      stickDir = dir;
      if (dir) { navMenu(dir); stickNext = now + 400; }
    } else if (dir && now >= stickNext) {
      navMenu(dir);
      stickNext = now + 170;
    }
  }, 66);
}

// Touch / mouse: horizontal drag scrubs the carousel live (transitions
// suspended via .dragging), release snaps to the nearest slot; a quick
// flick advances one. A tap focuses a card — tapping the focused card
// launches it, which also keeps plain desktop clicks working.
let ptrId = null, ptrStartX = 0, ptrStartT = 0, ptrStartSel = 0, ptrMoved = false;

carouselEl.addEventListener('pointerdown', (e) => {
  if (!GAMES.length || ptrId !== null) return;
  // don't let mousedown DOM-focus the card — its focus handler would
  // re-center mid-gesture and turn a first tap into an instant launch
  e.preventDefault();
  ptrId = e.pointerId;
  ptrStartX = e.clientX;
  ptrStartT = performance.now();
  ptrStartSel = selected;
  ptrMoved = false;
  try { carouselEl.setPointerCapture(ptrId); } catch (_) {}
});

carouselEl.addEventListener('pointermove', (e) => {
  if (e.pointerId !== ptrId) return;
  const dx = e.clientX - ptrStartX;
  if (!ptrMoved && Math.abs(dx) < 8) return;   // tap dead-zone
  ptrMoved = true;
  carouselEl.classList.add('dragging');
  const max = 2 * slotW;                        // at most 2 slots per gesture
  dragX = Math.max(-max, Math.min(max, dx));
  layout();
});

function endDrag(e) {
  if (e.pointerId !== ptrId) return;
  ptrId = null;
  carouselEl.classList.remove('dragging');
  if (ptrMoved) {
    const dt = performance.now() - ptrStartT;
    let slots = Math.round(-dragX / slotW);
    if (slots === 0 && dt < 250 && Math.abs(dragX) > 30) {
      slots = dragX < 0 ? 1 : -1;               // quick flick = one slot
    }
    dragX = 0;
    const n = GAMES.length;
    if (slots !== 0 && n > 1) {
      selected = (selected + slots + n) % n;
      beep(660, 0.05);
    }
    layout();
  } else if (e.type === 'pointerup' && performance.now() - ptrStartT < 600) {
    // pointer capture retargets the event, so hit-test the release point
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const card = hit && hit.closest('.card');
    if (card) {
      const i = +card.dataset.i;
      if (i === ptrStartSel) launch();
      else { selected = i; layout(); beep(660, 0.05); }
    }
  }
}
carouselEl.addEventListener('pointerup', endDrag);
carouselEl.addEventListener('pointercancel', endDrag);

// Desktop trackpads / wheels nudge the carousel one slot at a time.
let wheelAcc = 0, wheelLock = 0;
carouselEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const now = performance.now();
  if (now < wheelLock) return;
  wheelAcc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(wheelAcc) > 50) {
    navMenu(wheelAcc > 0 ? +1 : -1);
    wheelAcc = 0;
    wheelLock = now + 180;
  }
}, { passive: false });

let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { measure(); layout(); }, 100);
});

let audioCtx;
function beep(freq, dur) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.value = 0.05;
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (_) {}
}

buildCarousel();

// ───── Install / Add-to-Home-Screen prompt ─────
// We can detect when the launcher is *currently running* in standalone mode
// (display-mode: standalone, or iOS-specific navigator.standalone). We cannot
// detect that the user previously installed it but is visiting via Safari —
// so we pair detection with a localStorage dismissal flag set by "GOT IT".
// iOS Safari has no programmatic install prompt; the chip opens an overlay
// with instructions for the Share → Add to Home Screen flow.
(function setupInstallUI() {
  const STORAGE_KEY = 'arcade_install_dismissed';
  const chip = document.getElementById('install-chip');
  const overlay = document.getElementById('install-overlay');
  const dismissBtn = document.getElementById('install-dismiss');
  if (!chip || !overlay || !dismissBtn) return;

  const isStandalone =
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;

  // iPad on modern iOS reports as MacIntel with touch points; cover both.
  const isIOS =
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  let dismissed = false;
  try { dismissed = localStorage.getItem(STORAGE_KEY) === '1'; } catch (_) {}

  if (!isStandalone && !dismissed && isIOS) {
    chip.hidden = false;
  }

  chip.addEventListener('click', () => {
    overlay.hidden = false;
  });
  dismissBtn.addEventListener('click', () => {
    overlay.hidden = true;
    chip.hidden = true;
    try { localStorage.setItem(STORAGE_KEY, '1'); } catch (_) {}
  });
  // Tap the dim backdrop to close without dismissing forever.
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.hidden = true;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !overlay.hidden) overlay.hidden = true;
  });
})();
</script>
</body>
