  // ---- portrait generator (32x32 dialogue bust) --------------------------
  function bakePortrait(P) {
    const S = 32; const c = K.makeCanvas(S, S); const ctx = c.getContext('2d');
    const cx = 16;
    const base = P_GEO[P.age], fb = FACES[P.face];
    const skin = K.ramp(SKINS[P.skin]), hair = K.ramp(P.hair);
    const prim = K.ramp(P.primary), acc = K.ramp(P.accent);
    const bd = BUILD[P.build];
    // head shape = age band reshaped by the face base
    const hw = Math.max(10, Math.min(16, base.hw + fb.dw));
    const hh = Math.max(12, Math.min(18, base.hh + fb.dh));
    const hy = base.hy, hb = hy + hh, hx = cx - (hw >> 1);
    const browThick = base.brow + fb.brow;

    // backing panel, tinted by the garb colour so speakers differ at a glance
    px(ctx, 0, 0, S, S, K.DEEP_DUSK);
    K.dither2(ctx, 0, 0, S, S, prim.out, 0.4);

    // shoulders + role collar
    const shW = Math.max(14, Math.min(28, base.shW + bd * 2));
    const shX = cx - (shW >> 1), shY = 24 + base.shDrop;
    portraitGarb(ctx, P, prim, acc, shX, shY, shW, cx);

    // neck + face slab
    px(ctx, cx - 2, hb - 1, 4, shY - (hb - 1), skin.lo);
    px(ctx, hx, hy, hw, hh, skin.mid);
    K.dither(ctx, hx, hb - 3, hw, 3, skin.mid, skin.lo);
    px(ctx, hx, hy, hw, 1, skin.hi);
    // jaw / chin shape by face base
    if (fb.jaw === 'taper') { px(ctx, hx, hb - 3, 1, 3, skin.lo); px(ctx, hx + hw - 1, hb - 3, 1, 3, skin.lo); px(ctx, hx + 1, hb - 1, hw - 2, 1, skin.lo); }
    else if (fb.jaw === 'round') { px(ctx, hx + 1, hb - 1, hw - 2, 1, skin.hi); px(ctx, hx, hb - 2, 1, 1, skin.lo); px(ctx, hx + hw - 1, hb - 2, 1, 1, skin.lo); }
    else { px(ctx, hx, hb - 2, hw, 1, skin.lo); px(ctx, hx, hb - 4, 1, 4, skin.lo); px(ctx, hx + hw - 1, hb - 4, 1, 4, skin.lo); } // square jaw

    // gaunt hollows (elder) / round cheeks (child)
    if (base.gaunt) { px(ctx, hx + 1, hy + base.eyeY + 1, 1, hh - base.eyeY - 3, skin.lo); px(ctx, hx + hw - 2, hy + base.eyeY + 1, 1, hh - base.eyeY - 3, skin.lo); }
    if (base.cheek) { px(ctx, hx + 1, hy + base.eyeY + 3, 2, 2, skin.hi); px(ctx, hx + hw - 3, hy + base.eyeY + 3, 2, 2, skin.hi); }

    // eyes — spacing (eyeGap) + height (eyeH) vary by face base
    const eY = hy + base.eyeY, eS = base.eyeS;
    const eh = Math.max(2, Math.min(4, eS + fb.eyeH));
    const inset = Math.max(1, 2 - fb.eyeGap);
    const elx = hx + inset, erx = hx + hw - inset - eS;
    px(ctx, elx, eY, eS, eh, K.DEEP_DUSK); px(ctx, erx, eY, eS, eh, K.DEEP_DUSK);
    px(ctx, elx, eY, 1, 1, K.FIRST_FLAME); px(ctx, erx, eY, 1, 1, K.FIRST_FLAME);
    if (browThick) { px(ctx, elx - 1, eY - browThick, eS + 1, browThick, hair.lo); px(ctx, erx, eY - browThick, eS + 1, browThick, hair.lo); }
    // nose (length by base) + mouth (width by base)
    px(ctx, cx - 1, eY + eh, 1, 1 + fb.nose, skin.lo);
    const mW = Math.max(3, (base.cheek ? 3 : 5) + fb.mouth);
    px(ctx, cx - (mW >> 1), hb - 3, mW, 1, skin.out);

    // freckles (youth/child charm)
    if (P.feature === 'freckles') { px(ctx, hx + 2, eY + eh + 1, 1, 1, skin.out); px(ctx, hx + 4, eY + eh + 2, 1, 1, skin.out); px(ctx, hx + hw - 3, eY + eh + 1, 1, 1, skin.out); px(ctx, hx + hw - 5, eY + eh + 2, 1, 1, skin.out); }
    // age lines (elder)
    if (base.lines) {
      px(ctx, hx + 2, hy + 2, hw - 4, 1, skin.out);              // forehead crease
      px(ctx, elx - 1, eY + eh, 1, 1, skin.out); px(ctx, erx + eS, eY + eh, 1, 1, skin.out); // crow's feet
      px(ctx, hx + 3, eY + eh + 2, 1, 2, skin.out); px(ctx, hx + hw - 4, eY + eh + 2, 1, 2, skin.out); // nasolabial
    }

    portraitHair(ctx, P, hair, hx, hy, hw, hh, cx);
    portraitFeature(ctx, P, skin, hair, prim, acc, hx, hy, hw, hh, eY, eS, eh, elx, erx, cx);

    K.outlineRect(ctx, 0, 0, S, S, K.LANTERN);                   // 1px lantern-warm frame
    return c;
  }

  function portraitGarb(ctx, P, prim, acc, shX, shY, shW, cx) {
    px(ctx, shX, shY, shW, 32 - shY, prim.mid);
    px(ctx, shX, shY, shW, 2, prim.hi);
    K.dither(ctx, shX, shY + 2, shW, 32 - shY - 2, prim.mid, prim.lo);
    switch (P.garb) {
      case 'armor': {
        px(ctx, shX, shY, 4, 5, STEEL.mid); px(ctx, shX + shW - 4, shY, 4, 5, STEEL.mid);   // pauldrons
        px(ctx, shX, shY, 4, 1, STEEL.spec); px(ctx, shX + shW - 4, shY, 4, 1, STEEL.spec);
        px(ctx, cx - 3, shY, 6, 3, IRON.hi); px(ctx, cx - 1, shY + 1, 2, 2, acc.mid);       // gorget + ember rivet
        break;
      }
      case 'robe':
        px(ctx, cx - 5, shY, 10, 3, prim.lo);                   // draped collar
        px(ctx, cx - 1, shY, 2, 32 - shY, acc.mid); px(ctx, cx - 1, shY, 1, 32 - shY, acc.hi); // trim
        break;
      case 'apron':
        px(ctx, cx - 4, shY, 8, 32 - shY, acc.mid);             // apron bib
        K.dither(ctx, cx - 4, shY + 2, 8, 32 - shY - 2, acc.mid, acc.lo);
        px(ctx, cx - 4, shY, 1, 32 - shY, acc.hi); px(ctx, cx - 5, shY, 1, 3, prim.hi); px(ctx, cx + 4, shY, 1, 3, prim.hi);
        break;
      case 'coat':
        px(ctx, cx - 5, shY, 4, 6, acc.mid); px(ctx, cx + 1, shY, 4, 6, acc.mid);           // lapels
        px(ctx, cx - 5, shY, 1, 6, acc.hi); px(ctx, cx + 4, shY, 1, 6, acc.hi);
        px(ctx, cx - 1, shY + 1, 2, 32 - shY, prim.lo);
        break;
      case 'dress':
        px(ctx, cx - 4, shY, 8, 2, acc.mid);                    // neckline
        px(ctx, cx - 2, shY + 2, 4, 3, acc.lo);
        break;
      case 'cloak':
        px(ctx, cx - 5, shY, 10, 2, prim.lo);
        px(ctx, cx - 2, shY, 4, 3, acc.mid); px(ctx, cx - 1, shY, 2, 2, acc.hi);            // throat clasp
        break;
      case 'tunic':
        px(ctx, cx - 3, shY, 6, 2, acc.mid); px(ctx, cx - 1, shY + 2, 2, 3, prim.lo);       // collar + placket
        break;
      case 'rags':
        px(ctx, shX + 2, shY + 3, 2, 2, K.DEEP_DUSK); px(ctx, shX + shW - 4, shY + 2, 2, 3, K.DEEP_DUSK); // torn holes
        px(ctx, cx - 4, shY, 3, 2, acc.lo); px(ctx, cx + 2, shY + 1, 3, 2, acc.lo);
        break;
    }
  }

  function portraitHair(ctx, P, hair, hx, hy, hw, hh, cx) {
    if (P.style === 'bald') { px(ctx, hx + 2, hy - 1, hw - 4, 1, hair.lo); return; } // pate shine only
    const top = hy - 1;
    switch (P.style) {
      case 'crop':
        px(ctx, hx, top, hw, 3, hair.mid); px(ctx, hx, top, hw, 1, hair.hi);
        break;
      case 'short':
        px(ctx, hx - 1, top, hw + 2, 4, hair.mid); px(ctx, hx - 1, top, hw + 2, 1, hair.hi);
        px(ctx, hx - 1, hy + 1, 2, 5, hair.mid); px(ctx, hx + hw - 1, hy + 1, 2, 5, hair.mid);
        break;
      case 'mop':
        px(ctx, hx - 1, top - 1, hw + 2, 5, hair.mid); px(ctx, hx - 1, top - 1, hw + 2, 1, hair.hi);
        px(ctx, hx + 1, hy + 2, hw - 2, 1, hair.lo);            // ragged fringe over brow
        px(ctx, hx - 1, hy + 1, 2, 6, hair.mid); px(ctx, hx + hw - 1, hy + 1, 2, 6, hair.mid);
        break;
      case 'long':
        px(ctx, hx - 1, top, hw + 2, 4, hair.mid); px(ctx, hx - 1, top, hw + 2, 1, hair.hi);
        px(ctx, hx - 2, hy, 3, hh + 4, hair.mid); px(ctx, hx + hw - 1, hy, 3, hh + 4, hair.mid); // frames past shoulders
        px(ctx, hx - 2, hy, 1, hh + 4, hair.hi);
        break;
      case 'tied':
        px(ctx, hx - 1, top, hw + 2, 3, hair.mid); px(ctx, hx - 1, top, hw + 2, 1, hair.hi);
        px(ctx, hx + hw - 1, hy + 1, 3, 7, hair.mid); px(ctx, hx + hw, hy + 2, 1, 5, hair.lo); // tail to one side
        break;
      case 'braid':
        px(ctx, hx - 1, top, hw + 2, 3, hair.mid); px(ctx, hx - 1, top, hw + 2, 1, hair.hi);
        for (let b = 0; b < 5; b++) px(ctx, hx - 2, hy + 2 + b * 2, 2, 2, b & 1 ? hair.lo : hair.mid); // braid down left
        break;
      case 'bun':
        px(ctx, hx, top, hw, 3, hair.mid); px(ctx, hx, top, hw, 1, hair.hi);
        px(ctx, cx - 2, top - 3, 4, 3, hair.mid); px(ctx, cx - 2, top - 3, 4, 1, hair.hi); // bun bump at crown
        break;
      case 'wild':
        for (let s = 0; s < hw + 3; s += 2) px(ctx, hx - 1 + s, top - ((s & 3) === 0 ? 3 : 1), 2, 4, hair.mid); // spiky crown
        px(ctx, hx - 2, hy, 2, 7, hair.mid); px(ctx, hx + hw, hy, 2, 7, hair.mid);
        px(ctx, hx - 1, top, hw + 2, 1, hair.hi);
        break;
      case 'coif':
        px(ctx, hx, top, hw, 4, hair.mid); px(ctx, hx, top, hw, 1, hair.hi);
        px(ctx, hx, hy + 2, 1, 6, hair.lo); px(ctx, hx + hw - 1, hy + 2, 1, 6, hair.lo);    // neat cap sides
        break;
    }
  }

  function portraitFeature(ctx, P, skin, hair, prim, acc, hx, hy, hw, hh, eY, eS, eh, elx, erx, cx) {
    const hb = hy + hh;
    switch (P.feature) {
      case 'hood':
        px(ctx, hx - 3, hy - 3, hw + 6, 5, prim.lo); px(ctx, hx - 3, hy - 3, hw + 6, 1, prim.hi);
        px(ctx, hx - 3, hy - 3, 3, hh + 4, prim.lo); px(ctx, hx + hw, hy - 3, 3, hh + 4, prim.lo);
        px(ctx, cx - 1, hy - 3, 3, 3, acc.mid);                 // hood clasp
        break;
      case 'helm':
        px(ctx, hx - 1, hy - 2, hw + 2, 4, IRON.mid); px(ctx, hx - 1, hy - 2, hw + 2, 1, IRON.hi);
        px(ctx, hx - 1, hy + 2, hw + 2, 2, IRON.lo);            // brow guard
        px(ctx, cx - 3, eY, 6, 1, acc.mid);                     // ember visor slit glow
        px(ctx, cx - 1, hy - 5, 2, 4, acc.lo);                  // crest
        break;
      case 'crown':
        px(ctx, hx, hy - 2, hw, 2, acc.lo);
        for (let s = 0; s < hw; s += 3) px(ctx, hx + s, hy - 4, 1, 2, acc.hi); // spiked band
        px(ctx, cx, hy - 3, 1, 1, K.FIRST_FLAME);
        break;
      case 'veil':
        K.dither2(ctx, hx - 2, hy - 2, hw + 4, hh, acc.lo, 0.5);
        px(ctx, hx - 2, hy - 2, hw + 4, 1, acc.mid);
        break;
      case 'goggles':
        px(ctx, elx - 1, eY - 1, eS + 2, eh + 2, acc.mid); px(ctx, erx - 1, eY - 1, eS + 2, eh + 2, acc.mid);
        px(ctx, elx, eY, eS, eh, K.DEEP_DUSK); px(ctx, erx, eY, eS, eh, K.DEEP_DUSK);
        px(ctx, elx + eS + 1, eY, erx - elx - eS - 1, 1, acc.hi);
        break;
      case 'spectacles':
        K.outlineRect(ctx, elx - 1, eY - 1, eS + 2, eh + 2, acc.hi);
        K.outlineRect(ctx, erx - 1, eY - 1, eS + 2, eh + 2, acc.hi);
        px(ctx, elx + eS + 1, eY, erx - elx - eS - 1, 1, acc.mid); // bridge
        break;
      case 'eyepatch':
        px(ctx, erx - 1, eY - 1, eS + 2, eh + 2, K.DEEP_DUSK);
        px(ctx, hx, eY - 2, hw, 1, DARK.mid);                   // strap
        break;
      case 'beard':
        px(ctx, hx, hb - 5, hw, 5, hair.mid); K.dither(ctx, hx, hb - 3, hw, 4, hair.mid, hair.lo);
        px(ctx, hx + 1, hb - 6, hw - 2, 1, hair.hi);
        px(ctx, cx - (P.age === 'child' ? 1 : 2), hb - 3, P.age === 'child' ? 3 : 5, 1, skin.out); // mouth kept in the beard
        break;
      case 'stubble':
        K.dither2(ctx, hx + 1, hb - 4, hw - 2, 4, hair.lo, 0.4);
        break;
      case 'soot':
        px(ctx, hx + 2, eY + eh + 1, 3, 1, K.ramp('#333').lo); px(ctx, hx + hw - 5, hb - 4, 2, 1, K.ramp('#333').lo);
        break;
      case 'facepaint':
        px(ctx, hx, eY - 1, hw, 1, acc.mid);
        px(ctx, cx - 1, eY - 2, 2, 1, acc.hi);
        break;
    }
  }

  // ---- overworld NPC sprite generator (20x30, 2-frame idle breathing) -----
  // Matches the repo's NPC draw convention exactly (states.js draws
  // `<tag>.idle.down.<f>.rim`): a down-facing 2-frame idle with distinguishing
  // silhouette by age/build/garb + a role prop, rim-lit for the carried lantern.
  function bakeNpc(P, frame) {
    const c = K.makeCanvas(W, H); const ctx = c.getContext('2d');
    const cx = 10;
    const geo = S_GEO[P.age], fb = FACES[P.face];
    const breathe = frame;                                      // frame 1 lifts torso/head 1px
    const skin = K.ramp(SKINS[P.skin]), hair = K.ramp(P.hair);
    const prim = K.ramp(P.primary), acc = K.ramp(P.accent);
    const bd = BUILD[P.build];
    const torsoW = Math.max(8, Math.min(12, 10 + bd));
    const headY = geo.top + geo.stoop - breathe;
    const hh = geo.hh;
    const hw = Math.max(8, Math.min(12, geo.hw + fb.dw));       // face base shapes the head silhouette
    const bodyY = headY + hh;
    const groundY = H - 1;

    const covering = P.garb === 'robe' || P.garb === 'dress' || P.garb === 'cloak';
    // legs first (visible only when the garb doesn't sweep the ground)
    if (!covering) {
      const legY = bodyY + geo.bodyH, legH = groundY - legY;
      px(ctx, cx - 4, legY, 3, legH, DARK.mid); px(ctx, cx + 1, legY, 3, legH, DARK.mid);
      px(ctx, cx - 4, groundY - 2, 3, 2, BOOT.mid); px(ctx, cx + 1, groundY - 2, 3, 2, BOOT.mid);
    }
    spriteBody(ctx, P, prim, acc, skin, cx, bodyY, torsoW, geo, groundY, covering);
    spriteProp(ctx, P, cx, bodyY, headY, hh, acc, skin);
    spriteHead(ctx, P, skin, hair, prim, acc, cx, headY, hw, hh);

    K.outline(c, K.ramp('#241a2e').out);                        // dusk-violet outline, never black
    return c;
  }

  function spriteBody(ctx, P, prim, acc, skin, cx, bodyY, tw, geo, groundY, covering) {
    const x = cx - (tw >> 1);
    // arms (skin cuffs + sleeve) — drawn under the torso edges
    px(ctx, x - 2, bodyY + 1, 2, geo.bodyH - 1, prim.lo);
    px(ctx, x + tw, bodyY + 1, 2, geo.bodyH - 1, prim.lo);
    px(ctx, x - 2, bodyY + geo.bodyH - 2, 2, 2, skin.mid); px(ctx, x + tw, bodyY + geo.bodyH - 2, 2, 2, skin.mid);

    if (covering) {
      const h = groundY - bodyY;
      px(ctx, x - 1, bodyY, tw + 2, h, prim.mid);
      K.dither(ctx, x - 1, bodyY + 2, tw + 2, h - 2, prim.mid, prim.lo);
      px(ctx, x - 1, bodyY, tw + 2, 2, prim.hi);
      if (P.garb === 'robe') { px(ctx, cx - 1, bodyY, 2, h, acc.mid); px(ctx, cx - 1, bodyY, 1, h, acc.hi); }
      else if (P.garb === 'dress') { px(ctx, x - 1, bodyY + 5, tw + 2, 1, acc.mid); px(ctx, x - 2, bodyY + 5, tw + 4, h - 5, prim.mid); K.dither(ctx, x - 2, bodyY + 7, tw + 4, h - 7, prim.mid, prim.lo); }
      else { px(ctx, x - 2, bodyY, 3, 6, prim.lo); px(ctx, x + tw - 1, bodyY, 3, 6, prim.lo); px(ctx, cx - 2, bodyY, 4, 3, acc.mid); } // cloak drape + clasp
      return;
    }
    const th = geo.bodyH;
    px(ctx, x, bodyY, tw, th, prim.mid);
    K.dither(ctx, x, bodyY + 2, tw, th - 2, prim.mid, prim.lo);
    px(ctx, x, bodyY, tw, 2, prim.hi);
    switch (P.garb) {
      case 'armor':
        px(ctx, x, bodyY, tw, 3, STEEL.mid); px(ctx, x, bodyY, tw, 1, STEEL.spec);          // breastplate top
        px(ctx, x - 1, bodyY, 3, 3, STEEL.mid); px(ctx, x + tw - 2, bodyY, 3, 3, STEEL.mid); // pauldrons
        px(ctx, cx - 1, bodyY + 3, 2, 2, acc.mid); px(ctx, cx - 1, bodyY + 3, 1, 1, K.FIRST_FLAME); // ember heart
        break;
      case 'apron':
        px(ctx, cx - 3, bodyY + 3, 6, th - 3 + 4, acc.mid);
        K.dither(ctx, cx - 3, bodyY + 4, 6, th, acc.mid, acc.lo);
        px(ctx, cx - 3, bodyY + 3, 6, 1, acc.hi);
        break;
      case 'coat':
        px(ctx, x, bodyY, tw, th + 4, prim.mid); K.dither(ctx, x, bodyY + 3, tw, th + 1, prim.mid, prim.lo); // longer coat skirt
        px(ctx, cx, bodyY, 1, th + 4, acc.lo); px(ctx, x + 1, bodyY + 1, 2, 4, acc.mid);    // seam + lapel
        break;
      case 'tunic':
        px(ctx, x, bodyY + th - 1, tw, 1, acc.mid);                                          // belt
        for (let s = 0; s < tw - 2; s += 3) px(ctx, x + 1 + s, bodyY + 2, 1, 1, acc.lo);
        break;
      case 'rags':
        for (let s = 0; s < tw; s += 3) px(ctx, x + s, bodyY + th - 1 + (s & 1), 2, 2, K.DEEP_DUSK); // torn hem
        px(ctx, x + 1, bodyY + 2, 2, 1, acc.lo);
        break;
    }
  }

  function spriteHead(ctx, P, skin, hair, prim, acc, cx, headY, hw, hh) {
    const hx = cx - (hw >> 1);
    px(ctx, hx, headY, hw, hh, skin.mid);
    K.dither(ctx, hx, headY + hh - 3, hw, 3, skin.mid, skin.lo);
    px(ctx, hx, headY, hw, 1, skin.hi);
    px(ctx, hx + 1, headY + 4, 2, 2, K.DEEP_DUSK); px(ctx, hx + hw - 3, headY + 4, 2, 2, K.DEEP_DUSK);
    px(ctx, hx + 1, headY + 4, 1, 1, K.FIRST_FLAME);

    if (P.style !== 'bald' && P.feature !== 'hood' && P.feature !== 'helm') {
      px(ctx, hx - 1, headY - 1, hw + 2, 3, hair.mid); px(ctx, hx - 1, headY - 1, hw + 2, 1, hair.hi);
      if (P.style === 'long') { px(ctx, hx - 1, headY, 2, hh + 3, hair.mid); px(ctx, hx + hw - 1, headY, 2, hh + 3, hair.mid); }
      else if (P.style === 'tied') { px(ctx, hx + hw - 1, headY + 1, 2, 5, hair.mid); }
      else if (P.style === 'braid') { for (let b = 0; b < 4; b++) px(ctx, hx - 1, headY + 2 + b * 2, 2, 2, b & 1 ? hair.lo : hair.mid); }
      else if (P.style === 'bun') { px(ctx, cx - 1, headY - 3, 3, 3, hair.mid); }
      else if (P.style === 'wild') { for (let s = 0; s < hw; s += 2) px(ctx, hx + s, headY - 2 - ((s & 3) === 0 ? 1 : 0), 2, 3, hair.mid); }
      else if (P.style === 'mop') { px(ctx, hx, headY + 1, hw, 1, hair.lo); px(ctx, hx - 1, headY, 2, 5, hair.mid); px(ctx, hx + hw - 1, headY, 2, 5, hair.mid); }
    }
    if (P.feature === 'beard') { px(ctx, hx, headY + hh - 3, hw, 4, hair.mid); px(ctx, hx + 1, headY + hh - 4, hw - 2, 1, hair.hi); }
    if (P.feature === 'hood') {
      px(ctx, hx - 2, headY - 2, hw + 4, 5, prim.lo); px(ctx, hx - 2, headY - 2, hw + 4, 1, prim.hi);
      px(ctx, hx - 2, headY - 2, 2, hh + 2, prim.lo); px(ctx, hx + hw, headY - 2, 2, hh + 2, prim.lo);
    } else if (P.feature === 'helm') {
      px(ctx, hx - 1, headY - 1, hw + 2, 4, IRON.mid); px(ctx, hx - 1, headY - 1, hw + 2, 1, IRON.hi);
      px(ctx, hx + 1, headY + 3, hw - 2, 1, acc.mid);
      px(ctx, cx - 1, headY - 3, 2, 3, acc.lo);
    } else if (P.feature === 'crown') {
      for (let s = 0; s < hw; s += 3) px(ctx, hx + s, headY - 2, 1, 2, acc.hi);
      px(ctx, hx, headY - 1, hw, 1, acc.lo);
    } else if (P.feature === 'veil') {
      K.dither2(ctx, hx - 1, headY - 1, hw + 2, hh, acc.lo, 0.5);
    } else if (P.feature === 'spectacles' || P.feature === 'goggles') {
      px(ctx, hx + 1, headY + 4, 2, 2, acc.hi); px(ctx, hx + hw - 3, headY + 4, 2, 2, acc.hi);
      px(ctx, hx + 1, headY + 4, 2, 1, K.DEEP_DUSK); px(ctx, hx + hw - 3, headY + 4, 2, 1, K.DEEP_DUSK);
    }
  }

  function spriteProp(ctx, P, cx, bodyY, headY, hh, acc, skin) {
    const rx = cx + 6;                                          // held out to the figure's right
    switch (P.prop) {
      case 'staff':
        px(ctx, rx, headY - 1, 2, 30 - headY, WOOD.mid); px(ctx, rx, headY - 1, 1, 30 - headY, WOOD.hi);
        px(ctx, rx - 1, headY - 2, 4, 3, acc.mid); px(ctx, rx, headY - 2, 2, 1, K.LANTERN);
        break;
      case 'sword':
        for (let s = 0; s < 9; s++) px(ctx, rx - (s * 0.4 | 0), bodyY - 4 + s, 1, 1, STEEL.mid); // sheathed on back
        px(ctx, rx, bodyY - 4, 2, 2, acc.mid);
        break;
      case 'pike':
        px(ctx, rx + 1, headY - 3, 2, 30 - headY + 2, IRON.mid); px(ctx, rx + 1, headY - 5, 2, 3, STEEL.hi);
        break;
      case 'hammer':
        px(ctx, rx, bodyY, 2, 8, WOOD.mid);
        px(ctx, rx - 1, bodyY - 1, 4, 3, STEEL.hi); px(ctx, rx - 1, bodyY - 1, 4, 1, STEEL.spec);
        break;
      case 'ladle':
        px(ctx, rx, bodyY - 1, 1, 8, WOOD.mid); px(ctx, rx - 1, bodyY + 6, 3, 3, STEEL.mid); px(ctx, rx - 1, bodyY + 6, 3, 1, STEEL.hi);
        break;
      case 'net':
        px(ctx, rx + 1, headY, 1, 30 - headY, WOOD.mid);
        for (let a = 0; a < 5; a++) { px(ctx, rx - 2, bodyY + a, 6, 1, acc.lo); px(ctx, rx - 2 + a, bodyY, 1, 6, acc.lo); }
        break;
      case 'book':
        px(ctx, rx - 1, bodyY + 3, 5, 5, acc.mid); px(ctx, rx - 1, bodyY + 3, 5, 1, acc.hi); px(ctx, rx + 1, bodyY + 3, 1, 5, K.FIRST_FLAME);
        break;
      case 'lantern': {
        const ly = bodyY + 2;
        px(ctx, rx, ly, 4, 6, K.ramp('#2a1c12').mid); K.outlineRect(ctx, rx, ly, 4, 6, K.ramp('#2a1c12').out);
        K.pxGlowSq(ctx, rx + 2, ly + 3, 6, K.LANTERN, 4); px(ctx, rx + 1, ly + 2, 2, 3, K.LANTERN); px(ctx, rx + 1, ly + 2, 1, 1, K.FIRST_FLAME);
        break;
      }
      case 'spyglass':
        for (let s = 0; s < 6; s++) px(ctx, rx - 1 + s, headY + 2 + s, 2, 2, STEEL.mid); px(ctx, rx + 5, headY + 8, 2, 2, K.FIRST_FLAME);
        break;
      case 'cane':
        px(ctx, rx, headY + 4, 2, 26 - headY, WOOD.mid); px(ctx, rx - 1, headY + 3, 3, 2, WOOD.hi); // crook
        break;
      case 'basket':
        px(ctx, rx - 1, bodyY + 4, 6, 5, WOOD.mid); K.dither(ctx, rx - 1, bodyY + 5, 6, 4, WOOD.mid, WOOD.lo);
        px(ctx, rx, bodyY + 2, 4, 2, acc.lo); px(ctx, rx - 1, bodyY + 4, 6, 1, WOOD.hi);
        break;
      case 'scroll':
        px(ctx, rx, bodyY + 3, 5, 3, acc.hi); px(ctx, rx, bodyY + 3, 1, 3, acc.lo); px(ctx, rx + 4, bodyY + 3, 1, 3, acc.lo);
        break;
      case 'lute':
        px(ctx, rx, bodyY + 2, 5, 5, WOOD.mid); px(ctx, rx + 1, bodyY + 2, 3, 1, WOOD.hi); px(ctx, rx + 2, bodyY, 1, 3, WOOD.lo);
        px(ctx, rx + 2, bodyY + 4, 1, 1, acc.hi);
        break;
      case 'waterskin':
        px(ctx, rx, bodyY + 4, 4, 5, acc.mid); K.dither(ctx, rx, bodyY + 5, 4, 4, acc.mid, acc.lo); px(ctx, rx + 1, bodyY + 3, 2, 1, WOOD.mid);
        break;
      case 'charm':
        px(ctx, rx + 1, bodyY + 1, 1, 4, STEEL.mid); px(ctx, rx, bodyY + 5, 3, 3, acc.mid); px(ctx, rx + 1, bodyY + 6, 1, 1, K.FIRST_FLAME);
        break;
    }
  }

  // ---- build (baked once at load) ----------------------------------------
  let built = null;
  function build() {
    if (built) return built;
    if (!K.font.meta.ready) K.font.bake();
    const atlas = new SS.Atlas(512);
    const meta = {};
    for (const P of PEOPLE) {
      for (let f = 0; f < 2; f++) {
        const base = bakeNpc(P, f);
        atlas.add(`${P.tag}.idle.down.${f}`, base);
        atlas.add(`${P.tag}.idle.down.${f}.rim`, K.rim(base, 'r', K.LANTERN));
      }
      atlas.add(`portrait.${P.tag}`, bakePortrait(P));
      meta[P.tag] = { tag: P.tag, name: P.name, age: P.age, build: P.build, skin: P.skin, face: P.face, garb: P.garb, feature: P.feature, prop: P.prop };
    }
    built = { atlas, list: PEOPLE.map(p => p.tag), meta };
    return built;
  }

  // ---- portrait contact sheet (director review) --------------------------
  // Draws a labelled 8-col grid of all 44 portraits (each 32x32 shown at 2x =
  // 64px, the dialogue-box display size; labelled name/age/skin/face+feature)
  // plus a bottom strip of overworld NPC sprites, onto a 1280x720 review canvas.
  // Read-only w.r.t. game state — it only builds the sprite atlas and paints its
  // own overlay.
  function debugContactSheet(ctx) {
    const b = build();
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#12101c'; ctx.fillRect(0, 0, 1280, 720);
    const label = (s, x, y, col) => K.font.text(ctx, s, x | 0, y | 0, col || '#c8c2d4', 1);
    label('SHATTERED SUN  -  NPC PORTRAIT CONTACT SHEET  (A03)', 12, 8, K.LANTERN);
    label('44 NAMED  -  PARAM-GENERATED; SPREAD OF SKIN TONES + FACE BASES, READS BY AGE / ROLE', 12, 20, '#8f8aa0');

    const cols = 8, cw = 158, ch = 78, gx = 12, gy = 36, ps = 2;
    b.list.forEach((tag, k) => {
      const m = b.meta[tag];
      const col = k % cols, row = (k / cols) | 0;
      const cxp = gx + col * cw, cyp = gy + row * ch;
      ctx.fillStyle = (k & 1) ? '#181521' : '#1d1a28'; ctx.fillRect(cxp, cyp, cw - 4, ch - 4);
      const pf = b.atlas.get('portrait.' + tag);
      ctx.drawImage(pf.sheet, pf.sx, pf.sy, pf.w, pf.h, cxp + 6, cyp + 4, pf.w * ps, pf.h * ps);
      const tx = cxp + 6 + pf.w * ps + 6;
      label(m.name.length > 12 ? m.name.slice(0, 12) : m.name, tx, cyp + 6, K.LANTERN);
      label(m.age, tx, cyp + 18, '#8fbf9a');
      label(m.skin, tx, cyp + 30, '#c0a488');
      label(m.face + (m.feature ? '/' + m.feature : ''), tx, cyp + 42, '#9a94b0');
    });

    // bottom strip: overworld idle sprites (rim-lit), at 2x
    const stripY = gy + 6 * ch + 8;
    ctx.fillStyle = '#0e0c16'; ctx.fillRect(12, stripY - 2, 1256, 720 - stripY);
    label('OVERWORLD NPC SPRITES  (idle, rim-lit, 20x30 @2x) - silhouette varies by age / build / garb / prop', 18, stripY, '#8f8aa0');
    const per = 22, sw = Math.floor(1256 / per), ss = 2;
    b.list.forEach((tag, k) => {
      const rowk = (k / per) | 0, colk = k % per;
      const f = b.atlas.get(`${tag}.idle.down.0.rim`);
      const sx = 18 + colk * sw, sy = (stripY + 14) + rowk * ((H * ss) + 8);
      ctx.drawImage(f.sheet, f.sx, f.sy, f.w, f.h, sx, sy, f.w * ss, f.h * ss);
    });
    return b;
  }

  SS.NPCs = { build, debugContactSheet, list: () => build().list, meta: () => build().meta };
})();


// ===== src/art/interior.js =====
// Interior tileset + furniture generator (R01/A01 enabler). Indoor rooms are
// FLAT ROOMS, not the director's continuous moor painting: a plank/flagstone
// floor with grain, enclosing walls that read as walls (lit top cap + wainscot
// baseboard + outline), a hearth whose warm light is BAKED with pxGlowSq (never
// shadowBlur), a stone threshold, and a handful of y-sorted furniture statics
// (table, stool, shelf, cot) plus a woven rug. Cozy-warm — Lanternwick is "the
// last honest light", and Elder Maren's hearth-lantern cradles the First Flame.
//
// This module lives beside (never inside) the director-owned src/art/tiles.js.
// It returns the SAME shape SS.Region.load consumes from SS.Tiles.build(), so
// region.js selects it for any region whose `tileset` is "interior" with no
// special-casing in the tile pipeline. TS is 24 to match the shared engine.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  const TS = 24;

  function hash2(x, y) { let h = (x * 374761393 + y * 668265263) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return (h ^ (h >>> 16)) >>> 0; }
  function mixHex(a, b, t) {
    const A = K.hexToRgb(a), B = K.hexToRgb(b);
    return K.rgbToHex(A.r + (B.r - A.r) * t, A.g + (B.g - A.g) * t, A.b + (B.b - A.b) * t);
  }

  // ---- floors ------------------------------------------------------------
  // Wood plank floor: horizontal courses with a dark seam, per-plank tone
  // jitter, seeded grain streaks and the odd knot — three variants keep the
  // field from ever reading as a repeated stamp (art-bible anti-repeat rule).
  // DIRECTOR'S LAW — QUIET FLOORS: the floor is the stage, never the actor.
  // One tone family in a whisper-narrow value band, seams as the only strong
  // line, grain nearly subliminal. Objects get the contrast budget.
  function woodPlank(seed) {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp('#5e4229');
    const base = mixHex(r.mid, r.lo, 0.25);
    const tones = [base, mixHex(base, r.hi, 0.08), mixHex(base, r.lo, 0.12)];
    const rnd = K.mulberry32((seed || 1) >>> 0);
    K.pxRect(ctx, 0, 0, TS, TS, base);
    for (let py = 0; py < TS; py += 6) {
      const tone = tones[(rnd() * tones.length) | 0];
      K.pxRect(ctx, 0, py, TS, 5, tone);
      K.pxRect(ctx, 0, py + 5, TS, 1, mixHex(base, r.out, 0.55));   // seam
      K.pxNoise(ctx, 0, py, TS, 5, [mixHex(tone, r.lo, 0.5)], seed + py, 0.015);  // whisper grain
      const ends = 8 + ((rnd() * 8) | 0);
      K.pxRect(ctx, ends, py, 1, 5, mixHex(base, r.out, 0.4));      // soft board end
      if (rnd() < 0.08) { const kx = 3 + ((rnd() * (TS - 6)) | 0); K.pxRect(ctx, kx, py + 2, 2, 1, mixHex(base, r.out, 0.5)); }  // rare knot
    }
    return c;
  }

  // Flagstone floor: dusty cool stones with knocked-out corners over a dark
  // mortar bed — reads as swept stone near the hearth and door.
  function flagstone(seed) {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp('#5d5862');
    const rnd = K.mulberry32((seed || 3) >>> 0);
    K.pxRect(ctx, 0, 0, TS, TS, r.out);                          // mortar
    for (let gy = 0; gy < TS; gy += 6) {
      let gx = -((rnd() * 5) | 0);
      while (gx < TS) {
        const sw = 5 + ((rnd() * 4) | 0);
        const tone = rnd() < 0.28 ? r.lo : (rnd() < 0.14 ? mixHex(r.mid, r.hi, 0.5) : r.mid);
        K.pxRect(ctx, gx, gy, sw - 1, 5, tone);
        ctx.fillStyle = r.out;
        ctx.fillRect(gx, gy, 1, 1); ctx.fillRect(gx + sw - 2, gy, 1, 1);
        ctx.fillRect(gx, gy + 4, 1, 1); ctx.fillRect(gx + sw - 2, gy + 4, 1, 1);
        if (rnd() < 0.4) K.pxRect(ctx, gx + 1, gy, sw - 3, 1, r.hi);
        gx += sw;
      }
    }
    K.pxNoise(ctx, 0, 0, TS, TS, [r.lo], seed + 7, 0.03);
    return c;
  }

  // Threshold: swept flagstone catching a warm sliver of light from the door —
  // the tile the player walks out on (the interior's return exit sits over it).
  function threshold(seed) {
    const c = flagstone(seed); const ctx = c.getContext('2d');
    K.pxRect(ctx, 3, TS - 3, TS - 6, 2, mixHex('#5d5862', K.LANTERN, 0.25));   // warm spill
    K.pxRect(ctx, 5, TS - 4, TS - 10, 1, mixHex('#5d5862', K.LANTERN, 0.4));
    return c;
  }

  // Woven rug: warm red field with an amber motif that tiles seamlessly, so a
  // run of rug tiles reads as one carpet leading the eye door -> table -> hearth.
  function rugTile() {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp('#7a3330'), amber = K.ramp('#b5763a');
    K.pxRect(ctx, 0, 0, TS, TS, r.mid);
    K.dither2(ctx, 0, 0, TS, TS, r.lo, 0.5);                     // weave
    // centred diamond motif (symmetric -> butts cleanly against neighbours)
    for (let i = 0; i <= 5; i++) {
      const y = 12 - i, y2 = 12 + i;
      K.pxRect(ctx, 12 - (5 - i), y, (5 - i) * 2 + 1, 1, amber.mid);
      K.pxRect(ctx, 12 - (5 - i), y2, (5 - i) * 2 + 1, 1, amber.mid);
    }
    K.pxRect(ctx, 11, 11, 3, 3, amber.hi);
    // corner ticks -> when four tiles meet the motif repeats as a lattice
    for (const [cx, cy] of [[1, 1], [TS - 2, 1], [1, TS - 2], [TS - 2, TS - 2]]) K.pxRect(ctx, cx, cy, 1, 1, amber.mid);
    return c;
  }

  // ---- walls -------------------------------------------------------------
  // Cool grey-violet STONE masonry — deliberately cold against the warm wood
  // floor so the border ring reads unmistakably as an enclosing wall (the
  // art-bible palette recipe: cool moody surfaces, warm light as the accent).
  // Offset brick courses over a dark mortar bed, a lit crown along the top, and
  // a dark outline; the rarer variant carries a warm wall sconce so no run of
  // wall is plain material.
  // DIRECTOR'S LAW — walls sit a full value step DARKER than the floor and
  // flatter than anything standing in front of them; the lit crown alone says
  // "vertical surface", and the sconce variant carries the room's warm pulse.
  function wallTile(variant) {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp('#3e3947');
    const rnd = K.mulberry32(variant ? 23 : 11);
    K.pxRect(ctx, 0, 0, TS, TS, r.lo);
    for (let gy = 0; gy < TS; gy += 6) {
      let gx = (gy % 12 === 0) ? 0 : -6;
      while (gx < TS) {
        const bw = 8 + ((rnd() * 4) | 0);
        const tone = rnd() < 0.25 ? mixHex(r.lo, r.out, 0.4) : mixHex(r.lo, r.mid, 0.35);
        K.pxRect(ctx, gx + 1, gy + 1, bw - 2, 4, tone);
        gx += bw;
      }
      K.pxRect(ctx, 0, gy + 5, TS, 1, mixHex(r.lo, r.out, 0.5));  // soft course line
    }
    K.pxRect(ctx, 0, 0, TS, 2, r.mid);                           // lit crown (only strong line)
    K.pxRect(ctx, 0, 0, TS, 1, r.hi);
    if (variant) {                                               // warm iron wall sconce
      K.pxGlowSq(ctx, TS / 2, 10, 6, K.LANTERN, 4);
      K.pxRect(ctx, TS / 2 - 1, 9, 2, 4, K.EMBER);
      K.pxRect(ctx, TS / 2 - 2, 13, 4, 2, r.out);
    }
    return c;
  }

  // ---- furniture statics (y-sorted with entities by the play state) ------
  function contact(ctx, x, y, w) { K.dither2(ctx, x, y, w, 4, K.DEEP_DUSK, 0.55); }

  // The hearth-lantern: stone surround, a dark firebox, logs, and the sacred
  // little lantern cradling the First Flame — its warmth BAKED as stepped square
  // glow (ember -> lantern -> reserved First-Flame-white core). Never shadowBlur.
  function hearthSprite() {
    const c = K.makeCanvas(46, 50); const ctx = c.getContext('2d');
    const stone = K.ramp('#6a6270'), dark = K.ramp('#241a20'), wood = K.ramp('#5a4230');
    contact(ctx, 6, 46, 34);
    // baked firelight halo first, so the stonework reads lit from within
    K.pxGlowSq(ctx, 23, 34, 18, K.EMBER, 5);
    K.pxGlowSq(ctx, 23, 34, 11, K.LANTERN, 4);
    // stone surround (chimney breast + hearthstone)
    K.pxBlock(ctx, 4, 6, 38, 10, stone);                         // mantel breast
    K.pxRect(ctx, 2, 14, 42, 30, stone.lo); K.outlineRect(ctx, 2, 14, 42, 30, stone.out);
    K.dither2(ctx, 3, 15, 40, 28, stone.mid, 0.3);
    K.pxRect(ctx, 2, 14, 42, 2, stone.hi);                       // lit mantel lip
    // firebox
    K.pxRect(ctx, 12, 20, 22, 22, dark.lo); K.outlineRect(ctx, 12, 20, 22, 22, dark.out);
    // logs
    K.pxRect(ctx, 14, 38, 18, 3, wood.mid); K.pxRect(ctx, 16, 35, 14, 3, wood.lo);
    K.pxRect(ctx, 14, 38, 18, 1, wood.hi);
    // the hearth-lantern (First-Flame white core is reserved — canon-correct here)
    K.pxRect(ctx, 20, 26, 6, 10, dark.mid); K.outlineRect(ctx, 20, 26, 6, 10, K.ramp('#8a7a4a').out);
    K.pxRect(ctx, 21, 28, 4, 6, K.ramp(K.LANTERN).mid);
    K.pxRect(ctx, 22, 29, 2, 3, K.EMBER);
    K.pxRect(ctx, 22, 30, 1, 1, K.FIRST_FLAME);                  // the seed of the sun
    K.pxRect(ctx, 22, 24, 2, 2, K.ramp('#8a7a4a').hi);           // handle
    return c;
  }

  // Dining table sized to the tile world: a ~2x1-tile board (50x34, spans two
  // tiles wide, anchored on its single solid foot tile and overhanging like a
  // tree). Four turned legs, a warm-lit top dressed with a bowl, a loaf and a
  // stub candle so no table reads bare.
  function tableSprite() {
    const c = K.makeCanvas(50, 34); const ctx = c.getContext('2d');
    const wood = K.ramp('#5a4028'), pewter = K.ramp('#8a8a94'), bread = K.ramp('#7a5a34');
    contact(ctx, 4, 29, 42);
    K.pxRect(ctx, 6, 20, 4, 10, wood.out); K.pxRect(ctx, 40, 20, 4, 10, wood.out);   // front legs
    K.pxRect(ctx, 15, 21, 3, 8, wood.lo); K.pxRect(ctx, 32, 21, 3, 8, wood.lo);       // rear legs
    K.pxRect(ctx, 3, 17, 44, 4, wood.lo);                        // apron/skirt
    K.pxBlock(ctx, 1, 8, 48, 10, wood);                          // plank top
    K.pxRect(ctx, 1, 8, 48, 1, wood.spec);
    K.pxRect(ctx, 24, 8, 1, 10, wood.out);                       // centre plank seam
    // dressing so the top reads laid, not bare
    K.pxRect(ctx, 8, 5, 9, 4, pewter.mid); K.pxRect(ctx, 9, 5, 7, 1, pewter.hi);      // bowl
    K.pxRect(ctx, 10, 6, 5, 2, pewter.lo);
    K.pxRect(ctx, 20, 5, 8, 4, bread.mid); K.pxRect(ctx, 20, 5, 8, 1, bread.hi);      // loaf
    K.pxGlowSq(ctx, 39, 6, 5, K.LANTERN, 3);                     // candle glow BAKED
    K.pxRect(ctx, 38, 3, 2, 5, K.ramp('#d8c28a').mid); K.pxRect(ctx, 38, 2, 2, 1, K.EMBER);
    return c;
  }

  function stoolSprite() {
    const c = K.makeCanvas(16, 18); const ctx = c.getContext('2d');
    const wood = K.ramp('#5a4028');
    contact(ctx, 2, 15, 12);
    K.pxRect(ctx, 3, 12, 2, 4, wood.out); K.pxRect(ctx, 11, 12, 2, 4, wood.out);
    K.pxBlock(ctx, 2, 7, 12, 6, wood);
    K.pxRect(ctx, 2, 7, 12, 1, wood.spec);
    return c;
  }

  // A proper ladder-back chair (16x26 — one tile wide, a tile-and-change tall so
  // it reads as a seat you pull up to a table, not a stub stool).
  function chairSprite() {
    const c = K.makeCanvas(16, 26); const ctx = c.getContext('2d');
    const wood = K.ramp('#5a4028');
    contact(ctx, 2, 22, 12);
    K.pxRect(ctx, 3, 3, 2, 20, wood.mid); K.pxRect(ctx, 11, 3, 2, 20, wood.mid);   // back posts
    K.pxRect(ctx, 3, 3, 10, 2, wood.hi);                         // top rail (lit)
    K.pxRect(ctx, 4, 8, 8, 2, wood.lo); K.pxRect(ctx, 4, 11, 8, 2, wood.lo);       // ladder slats
    K.pxBlock(ctx, 2, 14, 12, 5, wood);                          // seat
    K.pxRect(ctx, 3, 19, 2, 4, wood.out); K.pxRect(ctx, 11, 19, 2, 4, wood.out);   // front legs
    return c;
  }

  // Standing shelf/dresser — a full 1x2-tile press (28x52) of four boards stacked
  // with crockery, jars and a couple of leaning books, anchored on its foot tile
  // and rising up the wall like a tall static.
  function shelfSprite() {
    const c = K.makeCanvas(28, 52); const ctx = c.getContext('2d');
    const wood = K.ramp('#4f3a24');
    const jars = [K.ramp('#7ea0a8'), K.ramp('#b5763a'), K.ramp('#9a7aa0'), K.ramp('#8fb08a'), K.ramp('#8a5040')];
    contact(ctx, 2, 48, 24);
    K.pxRect(ctx, 1, 1, 26, 50, wood.lo); K.outlineRect(ctx, 1, 1, 26, 50, wood.out);
    K.pxRect(ctx, 1, 1, 26, 2, wood.hi);                         // lit top edge
    K.pxRect(ctx, 1, 1, 2, 50, wood.mid); K.pxRect(ctx, 25, 1, 2, 50, wood.lo);    // side stiles
    for (let s = 0; s < 4; s++) {
      const sy = 5 + s * 11;
      K.pxRect(ctx, 2, sy + 9, 24, 2, wood.out);                 // shelf board
      K.pxRect(ctx, 2, sy + 9, 24, 1, wood.mid);
      const rnd = K.mulberry32(s + 1);
      if (s === 3) {                                             // bottom board: leaning books
        let bx = 4;
        while (bx < 22) {
          const bw = 2 + ((rnd() * 2) | 0), bh = 6 + ((rnd() * 3) | 0);
          const j = jars[(rnd() * jars.length) | 0];
          K.pxRect(ctx, bx, sy + 9 - bh, bw, bh, j.lo); K.pxRect(ctx, bx, sy + 9 - bh, bw, 1, j.hi);
          bx += bw + 1;
        }
      } else {                                                   // jars + crocks
        let jx = 4;
        while (jx < 23) {
          const j = jars[(rnd() * jars.length) | 0]; const jw = 3 + ((rnd() * 2) | 0), jh = 5 + ((rnd() * 3) | 0);
          K.pxRect(ctx, jx, sy + 9 - jh, jw, jh, j.mid); K.pxRect(ctx, jx, sy + 9 - jh, jw, 1, j.hi);
          K.pxRect(ctx, jx, sy + 9 - jh, 1, jh, j.lo);
          jx += jw + 2;
        }
      }
    }
    return c;
  }

  // A proper bed at tile scale (52x32 — a ~2x1-tile footprint): head/foot posts,
  // a plump mattress, a bolster pillow and a folded wool blanket over the foot.
  function cotSprite() {
    const c = K.makeCanvas(52, 32); const ctx = c.getContext('2d');
    const wood = K.ramp('#4f3a24'), linen = K.ramp('#8f94a4'), blanket = K.ramp('#8a5040');
    contact(ctx, 4, 27, 44);
    K.pxRect(ctx, 3, 4, 5, 24, wood.mid); K.pxRect(ctx, 44, 8, 4, 20, wood.mid);   // headboard + foot post
    K.pxRect(ctx, 3, 4, 5, 2, wood.hi); K.pxRect(ctx, 44, 8, 4, 1, wood.hi);
    K.outlineRect(ctx, 3, 4, 5, 24, wood.out);                   // headboard slab
    K.pxRect(ctx, 7, 12, 38, 14, linen.lo);                      // mattress
    K.pxRect(ctx, 7, 12, 38, 2, linen.hi);
    K.pxRect(ctx, 7, 24, 38, 2, linen.out);                      // mattress underside shadow
    K.pxRect(ctx, 9, 10, 14, 9, linen.hi); K.outlineRect(ctx, 9, 10, 14, 9, linen.out);   // bolster pillow
    K.dither2(ctx, 10, 12, 12, 5, linen.mid, 0.3);
    K.pxRect(ctx, 26, 13, 19, 13, blanket.mid);                  // folded blanket over foot
    K.pxRect(ctx, 26, 13, 19, 1, blanket.hi);
    K.pxRect(ctx, 26, 13, 1, 13, blanket.hi);
    K.dither2(ctx, 27, 14, 18, 11, blanket.lo, 0.3);
    return c;
  }

  // Loose furnishings — a staved barrel, a nailed crate and an iron-bound chest —
  // scattered along walls so store-rooms and work-corners read lived-in and full.
  function barrelSprite() {
    const c = K.makeCanvas(22, 30); const ctx = c.getContext('2d');

    K.pxRect(ctx, 4, 4, 14, 1, wood.hi);
    K.pxRect(ctx, 2, 9, 18, 2, hoop.mid); K.pxRect(ctx, 2, 9, 18, 1, hoop.hi);     // hoops
    K.pxRect(ctx, 2, 19, 18, 2, hoop.mid); K.pxRect(ctx, 2, 19, 18, 1, hoop.hi);
    K.pxRect(ctx, 6, 3, 10, 3, wood.mid); K.dither2(ctx, 6, 3, 10, 3, wood.hi, 0.4);   // lid

  function crateSprite() {

    K.pxRect(ctx, 2, 11, 20, 1, wood.out);                       // plank seam

  function chestSprite() {
    const c = K.makeCanvas(30, 24); const ctx = c.getContext('2d');

  // ---- smithy furniture (Sera's workshop) --------------------------------
  // Sera's forge has been cold since the Shattering, so her workshop reads
  // COLD-industrial: iron greys and steel-blue against the warm wood floor, the
  // one warm accent saved for the unfinished hilt on her bench. The forge ships
  // in a dead-grey COLD variant; a LIT variant (ember/lantern glow BAKED with
  // pxGlowSq, never shadowBlur) is baked alongside it, ready for the day the
  // cold-forge side quest wakes the fire. Every surface is crunch-kit ramps +
  // dither + outline per the art-bible — no gradients, no soft shadows.

  // The anvil: a horned iron anvil on a wood stump, its working face a bright
  // polished-steel band (the one thing in a cold forge that still catches light).
  function anvilSprite() {
    const c = K.makeCanvas(34, 30); const ctx = c.getContext('2d');
    const iron = K.ramp('#565560'), stump = K.ramp('#4a3624'), steel = K.ramp('#7f8593');
    contact(ctx, 4, 26, 26);
    K.pxRect(ctx, 9, 20, 16, 8, stump.lo); K.outlineRect(ctx, 9, 20, 16, 8, stump.out);   // stump
    K.pxRect(ctx, 9, 20, 16, 1, stump.hi);

    K.pxRect(ctx, 14, 14, 6, 7, iron.lo); K.outlineRect(ctx, 14, 14, 6, 7, iron.out);      // waist

  // The forge itself: stone hearth-block under an iron chimney hood. lit=false is
  // the dead cold hearth (grey ash, a few clinkers); lit=true bakes the ember bed
  // and firelight halo for after the forge is woken.
  function forgeSprite(lit) {
    const c = K.makeCanvas(46, 54); const ctx = c.getContext('2d');
    const stone = K.ramp('#605a66'), dark = K.ramp('#20191f'), iron = K.ramp('#4a4954'), ash = K.ramp('#6d6a74');
    contact(ctx, 5, 50, 36);
    if (lit) {                                                    // baked firelight FIRST so stone reads lit from within
      K.pxGlowSq(ctx, 23, 34, 17, K.EMBER, 5);
      K.pxGlowSq(ctx, 23, 35, 10, K.LANTERN, 4);
    }
    K.pxRect(ctx, 12, 0, 22, 6, iron.lo); K.outlineRect(ctx, 12, 0, 22, 6, iron.out);      // chimney hood
    K.pxRect(ctx, 15, 6, 16, 6, iron.mid); K.pxRect(ctx, 12, 0, 22, 1, iron.hi);
    K.pxRect(ctx, 3, 18, 40, 30, stone.lo); K.outlineRect(ctx, 3, 18, 40, 30, stone.out);  // stone body
    K.dither2(ctx, 4, 19, 38, 28, stone.mid, 0.3);
    K.pxRect(ctx, 3, 18, 40, 2, stone.hi);                                                  // lit lip
    K.pxRect(ctx, 13, 24, 20, 18, dark.lo); K.outlineRect(ctx, 13, 24, 20, 18, dark.out);  // firebox
    if (lit) {
      K.pxRect(ctx, 15, 36, 16, 5, K.EMBER);
      K.dither2(ctx, 15, 33, 16, 4, K.EMBER, 0.6);
      K.pxRect(ctx, 19, 31, 3, 4, K.LANTERN); K.pxRect(ctx, 24, 32, 2, 3, K.LANTERN);
      K.pxRect(ctx, 20, 30, 2, 2, K.ramp(K.LANTERN).spec);                                  // brightest tongue (lantern-warm, not reserved white)
    } else {
      K.pxRect(ctx, 15, 37, 16, 4, ash.lo);                                                // dead grey ash bed
      K.dither2(ctx, 15, 35, 16, 5, ash.out, 0.5);
      K.pxRect(ctx, 18, 36, 3, 2, ash.mid); K.pxRect(ctx, 24, 37, 2, 2, ash.mid);          // cold clinkers
    }
    return c;
  }
  function forgeColdSprite() { return forgeSprite(false); }
  function forgeLitSprite() { return forgeSprite(true); }

  // Bellows: wood paddle-boards over a leather accordion, an iron nozzle aimed
  // where the forge would draw its draught.
  function bellowsSprite() {
    const c = K.makeCanvas(34, 26); const ctx = c.getContext('2d');

    contact(ctx, 3, 22, 26);
    K.pxRect(ctx, 4, 16, 3, 7, wood.out); K.pxRect(ctx, 18, 16, 3, 7, wood.out);           // legs

    K.outlineRect(ctx, 3, 10, 18, 11, leather.out);
    K.pxRect(ctx, 21, 13, 10, 3, iron.mid); K.pxRect(ctx, 21, 13, 10, 1, iron.hi);         // nozzle

  // Quench barrel: hooped staves, a still skin of cold water, a pair of tongs
  // resting across the rim.
  function quenchSprite() {
    const c = K.makeCanvas(26, 30); const ctx = c.getContext('2d');

    contact(ctx, 3, 26, 20);

    K.pxRect(ctx, 4, 9, 18, 2, hoop.mid); K.pxRect(ctx, 4, 9, 18, 1, hoop.hi);             // hoops
    K.pxRect(ctx, 4, 20, 18, 2, hoop.mid); K.pxRect(ctx, 4, 20, 18, 1, hoop.hi);
    K.pxRect(ctx, 7, 6, 12, 3, water.lo); K.pxRect(ctx, 8, 6, 10, 1, water.hi);            // cold water

  // Tool rack: a peg-board of hung hammers, tongs and a file against the wall.

    K.pxRect(ctx, 7, 10, 2, 14, wood.mid); K.pxRect(ctx, 5, 9, 6, 4, iron.mid); K.pxRect(ctx, 5, 9, 6, 1, iron.hi);   // hammer
    K.pxRect(ctx, 14, 10, 1, 16, iron.mid); K.pxRect(ctx, 16, 10, 1, 16, iron.mid); K.pxRect(ctx, 13, 24, 4, 2, iron.lo);   // tongs
    K.pxRect(ctx, 21, 11, 2, 14, steel.mid); K.pxRect(ctx, 21, 11, 2, 1, steel.hi); K.dither2(ctx, 21, 13, 2, 10, steel.lo, 0.5);   // file

  // Weapon rack: an A-frame standing three finished blades hilt-up — the proof of

    const c = K.makeCanvas(30, 42); const ctx = c.getContext('2d');
    const wood = K.ramp('#4f3a24'), steel = K.ramp('#828896'), bronze = K.ramp('#8a6a3a');

  // Workbench: a heavy bench with a leg-vise and, laid across it under a single
  // warm kiss of light, the unfinished FATHER'S HILT — crossguard and wound grip
