window.CONTENT = {"bosses":{"boss.ashen-king":{"id":"boss.ashen-king","name":"Ashen King","spriteFamily":"ashen-king","region":"region.solmere","dungeon":"The Sun Forge","ledger":"B06","hp":80,"phases":2,"telegraphMs":520,"signatureAttack":"two-handed greatsword commitment","resolve":"duel","humanName":"Sir Corvane","kind":"person"},"boss.beacon-wraith":{"id":"boss.beacon-wraith","name":"Beacon Wraith","spriteFamily":"beacon-wraith","region":"region.fallen-beacon-spire","dungeon":"Fallen Beacon","ledger":"B01","behavior":"boss-wraith","hp":10,"phases":1,"contactDamage":0,"speed":0.5,"telegraphMs":700,"signatureAttack":"beacon-flare wail and light-slam","weakness":"light","kind":"spirit","params":{"aggroRange":480,"telegraphMs":700,"slamMs":260,"slamReach":46,"slamDamage":1,"recoverMs":760,"cooldownMs":1300,"leash":150,"lightRadius":110},"drops":[]},"boss.cinder-eel-leviathan":{"id":"boss.cinder-eel-leviathan","name":"Cinder-Eel Leviathan","spriteFamily":"cinder-eel-leviathan","region":"region.sunken-cauldron","dungeon":"The Ember Deep","ledger":"B05","hp":65,"phases":2,"telegraphMs":600,"signatureAttack":"rearing lunge-dive","arena":"water","kind":"beast"},"boss.glass-colossus":{"id":"boss.glass-colossus","name":"Glass Colossus","spriteFamily":"glass-colossus","region":"region.cinder-steppe","dungeon":"The Glasskiln","ledger":"B03","hp":60,"phases":2,"telegraphMs":560,"signatureAttack":"shatter-slam","mechanic":"shatters and reforms between phases","kind":"automaton"},"boss.mothqueen":{"id":"boss.mothqueen","name":"The Mothqueen","spriteFamily":"mothqueen","region":"region.mothqueens-hollow","dungeon":"Mothqueen's Hollow","ledger":"B02","behavior":"boss-mothqueen","hp":12,"phases":2,"contactDamage":1,"speed":0.45,"clearedFlag":"d02_cleared","telegraphMs":720,"signatureAttack":"cinder spore-burst","weakness":"item.lantern","kind":"host","resolve":"cure","target":"the cinder parasite, not the host","params":{"aggroRange":460,"telegraphMs":720,"sporeMs":260,"sporeDamage":1,"sporeSpeed":2.4,"recoverMs":760,"cooldownMs":1300,"leash":170,"lanternRadius":120,"phase2Hp":6},"drops":[]},"boss.pale-astronomer":{"id":"boss.pale-astronomer","name":"Pale Astronomer","spriteFamily":"pale-astronomer","region":"region.frostreach","dungeon":"The Pale Observatory","ledger":"B04","hp":55,"phases":2,"telegraphMs":700,"signatureAttack":"lens beam","mechanic":"frozen vigil; break line-of-sight to the lens","kind":"spirit"},"boss.smolder":{"id":"boss.smolder","name":"The Smolder","spriteFamily":"smolder","region":"region.solmere","dungeon":"The Sun Forge","ledger":"B07","hp":120,"phases":2,"telegraphMs":680,"signatureAttack":"light-eating beam","mechanic":"finale requires the lantern beam; phase 2 splits the maw","kind":"devourer"}},"characters":{"npc.lanternwick.brand":{"id":"npc.lanternwick.brand","name":"Brand","portrait":"brand","home":"region.duskmoor-slice","pos":null,"voice":"broad worried farmer; plain heavy sentences; counts and re-counts; partner to Tamsin; senses the lamb-taker is grieving, not hunting","dialogue":[{"req":["quest-done:q.side.duskmoor.missing-lamb","flag:q_beacon_done"],"dlg":"dlg.brand.beacon"},{"req":["quest-done:q.side.duskmoor.missing-lamb"],"dlg":"dlg.brand.lamb-home"},{"req":["quest:q.side.duskmoor.missing-lamb>=1"],"dlg":"dlg.brand.tasked"},{"req":[],"dlg":"dlg.brand.opening"}],"epilogueLine":"Brand counts his flock once, gets the right number, and for the first time in years does not count them again."},"npc.gloamwood.fennick":{"id":"npc.gloamwood.fennick","name":"Fennick","portrait":"fennick","home":"region.gloamwood","pos":null,"voice":"dry, tender moth-tender; jokes to cover the worry; feels the same growing quiet between him and Isolde and won't name it first","dialogue":[{"req":["flag:silent_station_cured"],"dlg":"dlg.gloam.fennick.healed"},{"req":["quest-done:q.main.03-marens-map","!flag:silent_station_cured"],"dlg":"dlg.gloam.fennick.silent"},{"req":[],"dlg":"dlg.gloam.fennick.opening"}],"epilogueLine":"Fennick lets Isolde finish his sentence, then finishes hers back - and the waystation lamps seem to burn a shade steadier for it."},"npc.gloamwood.grub":{"id":"npc.gloamwood.grub","name":"Grub","portrait":"grub","home":"region.gloamwood","pos":null,"voice":"scrappy forager kid, loud and bright against the dark; trades mushrooms and shortcuts; treats the deep wood like a room with the lamp out","dialogue":[{"req":["flag:met_hermit"],"dlg":"dlg.gloam.grub.known"},{"req":[],"dlg":"dlg.gloam.grub.opening"}],"epilogueLine":"Grub charges full price for a shortcut nobody needs anymore, then throws in the map for free and calls it a slow day."},"npc.gloamwood.hermit":{"id":"npc.gloamwood.hermit","name":"The Hermit of the Foxfire","portrait":"hermit-foxfire","home":"region.gloamwood","pos":null,"voice":"weathered ex-Keeper groundskeeper; cryptic but kind; tends the foxfire and never lies, though he gives the truth a piece at a time","dialogue":[{"req":["flag:ready_for_mothqueen","!flag:mothqueen_sent"],"dlg":"dlg.gloam.hermit.mothqueen"},{"req":["flag:met_hermit"],"dlg":"dlg.gloam.hermit.met"},{"req":[],"dlg":"dlg.gloam.hermit.opening"}],"epilogueLine":"The Hermit banks the foxfire low and stands a long while in the new dawn-light, saying nothing, letting it find his face."},"npc.gloamwood.isolde":{"id":"npc.gloamwood.isolde","name":"Isolde","portrait":"isolde","home":"region.gloamwood","pos":null,"voice":"warm, watchful moth-tender; tends the colony and the travelers who pass; carries a quiet worry about the silence growing between her and Fennick","dialogue":[{"req":["flag:silent_station_cured"],"dlg":"dlg.gloam.isolde.healed"},{"req":["quest-done:q.main.03-marens-map","!flag:silent_station_cured"],"dlg":"dlg.gloam.isolde.silent"},{"req":[],"dlg":"dlg.gloam.isolde.opening"}],"epilogueLine":"Isolde hangs a second lamp at the waystation and finishes Fennick's sentence out loud, on purpose, just to watch him grin."},"npc.lanternwick.lowry":{"id":"npc.lanternwick.lowry","name":"Innkeep Lowry","portrait":"lowry","home":"region.lanternwick-inn-interior","pos":null,"voice":"widowed innkeep; caretaker warmth, feeds first and argues never; keeps a window-lamp lit so one warm door always stays open","dialogue":[{"req":["flag:q_beacon_done"],"dlg":"dlg.lowry.beacon"},{"req":["flag:q_guttering_done"],"dlg":"dlg.lowry.guttering"},{"req":[],"dlg":"dlg.lowry.opening"}],"epilogueLine":"Lowry blows out her window-lamp for the first time in thirty-four years - the sky is doing her job now."},"npc.lanternwick.maren":{"id":"npc.lanternwick.maren","name":"Elder Maren","portrait":"maren","home":"region.duskmoor-slice","pos":null,"voice":"proverbs and gentle evasions; warm but tired; hides a keeper's guilt","dialogue":[{"req":["quest-done:q.main.03-marens-map"],"dlg":"dlg.maren.map-done"},{"req":["quest:q.main.03-marens-map>=1"],"dlg":"dlg.maren.map-onway"},{"req":["flag:q_beacon_done","!flag:marens_map_given"],"dlg":"dlg.maren.marens-map"},{"req":["flag:q_beacon_done"],"dlg":"dlg.maren.beacon-done"},{"req":["quest:q.main.02-fallen-beacon>=1"],"dlg":"dlg.maren.beacon-return"},{"req":["quest-done:q.main.01-guttering"],"dlg":"dlg.maren.beacon"},{"req":["quest:q.main.01-guttering>=1"],"dlg":"dlg.maren.tasked"},{"req":[],"dlg":"dlg.maren.opening"}],"epilogueLine":"Maren's hall stands quiet now, the hearth she guarded steady at last - and someone has left the door open to the light."},"npc.gloamwood.mothqueen":{"id":"npc.gloamwood.mothqueen","name":"The Mothqueen","portrait":"mothqueen","home":"region.mothqueens-hollow","pos":null,"voice":"ancient and vast; speaks in seasons and in mending; amusement like rustling leaves; when she speaks, the whole grove speaks with her","dialogue":[{"req":["flag:mothqueen_cured","!flag:mothqueen_thanked"],"dlg":"dlg.mothqueen.cured"},{"req":["flag:mothqueen_cured"],"dlg":"dlg.mothqueen.ally"},{"req":[],"dlg":"dlg.mothqueen.grove"}],"epilogueLine":"The Mothqueen keeps her grove, greener each season, and the truth beside it - the last green light in the north, waiting for word that the sun burns again."},"npc.lanternwick.old-wick":{"id":"npc.lanternwick.old-wick","name":"Old Wick","portrait":"old-wick","home":"region.duskmoor-slice","pos":null,"voice":"gentle wondering elder; short awed sentences; remembers the true dawn and is half-believed; hopeful, never bitter","dialogue":[{"req":["flag:q_beacon_done"],"dlg":"dlg.old-wick.beacon"},{"req":["flag:lantern_tended"],"dlg":"dlg.old-wick.tended"},{"req":[],"dlg":"dlg.old-wick.opening"}],"epilogueLine":"Old Wick scrubs the little shrine bright and sets it facing east, and this time the morning agrees with him."},"npc.lanternwick.petch":{"id":"npc.lanternwick.petch","name":"Petch","portrait":"petch","home":"region.duskmoor-slice","pos":null,"voice":"nervous jokes, quick denials; map-seller who oddly knows the capital's every gate; unease he can't quite hide","dialogue":[{"req":["flag:q_beacon_done"],"dlg":"dlg.petch.beacon"},{"req":["flag:q_guttering_done"],"dlg":"dlg.petch.guttering"},{"req":[],"dlg":"dlg.petch.opening"}],"epilogueLine":"Petch redraws every map with the capital's true gates marked plain, and signs this one with his real name."},"npc.lanternwick.poll":{"id":"npc.lanternwick.poll","name":"Poll","portrait":"poll","home":"region.duskmoor-slice","pos":null,"voice":"breathless eager kid; run-on excitement, capital-letter emphasis; Fin's friend; wants to come along, runs letters","dialogue":[{"req":["quest-done:q.side.duskmoor.postal","flag:q_beacon_done"],"dlg":"dlg.poll.beacon"},{"req":["quest-done:q.side.duskmoor.postal"],"dlg":"dlg.poll.postal-done"},{"req":["quest:q.side.duskmoor.postal>=2"],"dlg":"dlg.poll.postal-b"},{"req":["quest:q.side.duskmoor.postal>=1"],"dlg":"dlg.poll.postal-a"},{"req":[],"dlg":"dlg.poll.opening"}],"epilogueLine":"Poll delivers the last letter at a dead run - COME OUT, it says - and half the village comes out to watch the sun."},"npc.lanternwick.reeve":{"id":"npc.lanternwick.reeve","name":"Auntie Reeve","portrait":"reeve","home":"region.duskmoor-slice","pos":null,"voice":"blunt herbalist; clipped orders, dry warmth under the gruff; potion-shop tutorial energy; lonely for Sera's visits","shop":"shop.reeve-herbstall","dialogue":[{"req":["quest-done:q.side.duskmoor.cold-forge","flag:q_beacon_done"],"dlg":"dlg.reeve.beacon"},{"req":["quest-done:q.side.duskmoor.cold-forge"],"dlg":"dlg.reeve.supper"},{"req":["quest:q.side.duskmoor.cold-forge>=1","flag:reeve_invited"],"dlg":"dlg.reeve.seed-given"},{"req":["quest:q.side.duskmoor.cold-forge>=1"],"dlg":"dlg.reeve.cold-forge"},{"req":[],"dlg":"dlg.reeve.opening"}],"epilogueLine":"Reeve climbs Sera's hill without a single ailment to complain of, and stays for supper anyway."},"npc.lanternwick.sera":{"id":"npc.lanternwick.sera","name":"Sera","portrait":"sera","home":"region.duskmoor-slice","pos":null,"voice":"smith's dry wit; blunt kindness under the grumbling; misses the heat of a real forge","dialogue":[{"req":["quest-done:q.side.duskmoor.cold-forge","flag:q_beacon_done"],"dlg":"dlg.sera.beacon"},{"req":["quest-done:q.side.duskmoor.cold-forge"],"dlg":"dlg.sera.forge-lit"},{"req":[],"dlg":"dlg.sera.opening"}],"epilogueLine":"Sera's forge roars again, and she pretends the smoke is why her eyes are wet."},"npc.lanternwick.tamsin":{"id":"npc.lanternwick.tamsin","name":"Tamsin","portrait":"tamsin","home":"region.duskmoor-slice","pos":null,"voice":"steady and wry; does noticing while Brand does worrying; dry deadpan kindness; partner to Brand","dialogue":[{"req":["quest-done:q.side.duskmoor.missing-lamb"],"dlg":"dlg.tamsin.lamb-home"},{"req":["quest:q.side.duskmoor.missing-lamb>=2"],"dlg":"dlg.tamsin.missing-lamb-offer"},{"req":["quest:q.side.duskmoor.missing-lamb>=1"],"dlg":"dlg.tamsin.missing-lamb"},{"req":["flag:q_beacon_done"],"dlg":"dlg.tamsin.beacon"},{"req":[],"dlg":"dlg.tamsin.opening"}],"epilogueLine":"Tamsin watches the first true dawn, elbows Brand, and says only, 'Told you it wasn't a tragedy.'"}},"cutscenes":{"cut.beacon-laid-to-rest":{"id":"cut.beacon-laid-to-rest","skippable":true,"steps":[{"cmd":"camera","shake":4},{"cmd":"wait","ms":350},{"cmd":"say","text":"The grief comes apart like a held breath let go. The hollow voice, softer now: ...the light is kept. I can put it down at last."},{"cmd":"say","speaker":"kes","text":"Rest, Keeper. We'll carry it from here."},{"cmd":"say","text":"Fin steps past Kes and lifts the hearth-lantern toward the kneeling Keeper. Its warm gold spills across the fading dark."},{"cmd":"say","text":"The Keeper stares. That light... that's no shard-fire. Where did you—"},{"cmd":"say","text":"Then, softer, almost smiling as he goes: Keep it lit, lanternbearers. Keep it lit."},{"cmd":"say","text":"Where the Wraith stood, a splinter of the Sunshard hangs in the air, burning cold and bright. Fin reaches for it."},{"cmd":"say","speaker":"fin","text":"It's - heavy. Heavier than it looks. Like it's looking back at me, Kes. I don't like how it wants to be held."},{"cmd":"say","speaker":"kes","text":"Then I'll carry it. Wrap it, keep it dark. Come on - home, before the moor forgets us."},{"cmd":"effects","effects":[{"give":"item.shard-sliver","n":1},{"set":{"d01_cleared":true}}]}]},"cut.beacon-wake":{"id":"cut.beacon-wake","skippable":true,"steps":[{"cmd":"camera","to":{"x":12,"y":5},"ms":900},{"cmd":"wait","ms":300},{"cmd":"say","speaker":"fin","text":"Kes... there's a shape in the cold. Standing on the beacon-stand, like it never left its post."},{"cmd":"say","speaker":"kes","text":"It's the Keeper. Old Wick warned us - do not wake it."},{"cmd":"say","text":"The dark stirs. A hollow voice, dry as blown ash: WHO COMES TO MY POST? WHO LETS THE DARK IN?"},{"cmd":"sfx","ref":"hit"},{"cmd":"say","speaker":"fin","text":"Too late for quiet - Kes, it flinched from my lantern! It hates the light. Light everything, light it all up!"},{"cmd":"effects","effects":[{"set":{"d01_wraith_woke":true}}]},{"cmd":"camera","to":{"x":12,"y":8},"ms":600}]},"cut.duskmoor-open":{"id":"cut.duskmoor-open","skippable":true,"steps":[{"cmd":"camera","to":{"x":33,"y":17},"ms":1100},{"cmd":"wait","ms":300},{"cmd":"say","speaker":"fin","text":"Kes - the shrine-flame's doing the shivery thing. It's never done that. Not once in our whole lives."},{"cmd":"say","speaker":"kes","text":"I see it. The whole village sees it. Come on - up to the front."},{"cmd":"say","speaker":"fin","text":"You think it's the thing that eats the light? The Ember-Glutton, out past the moor?"},{"cmd":"say","speaker":"kes","text":"There's no such thing, Fin. Eyes front."},{"cmd":"say","speaker":"npc.lanternwick.old-wick","text":"It never does that. Thirty-four years I've kept this shrine. It never does that."},{"cmd":"say","speaker":"fin","text":"It's scared."},{"cmd":"say","speaker":"npc.lanternwick.sera","text":"Flames don't get scared, Fin."},{"cmd":"say","speaker":"fin","text":"This one does. Look at it."},{"cmd":"sfx","ref":"chime"},{"cmd":"wait","ms":500},{"cmd":"say","text":"For one breath the little flame stands up straight. The gathered village lets out the same held breath at once."},{"cmd":"say","speaker":"npc.lanternwick.maren","text":"Everyone home. It's late."},{"cmd":"say","speaker":"npc.lanternwick.maren","text":"Kes. Fin. Not you two."},{"cmd":"say","speaker":"npc.lanternwick.maren","text":"There's a tower on the north moor. The Fallen Beacon. Deep down, something still burns there - a sliver of the old light."},{"cmd":"say","speaker":"kes","text":"You want us to bring it here."},{"cmd":"say","speaker":"npc.lanternwick.maren","text":"I want yesterday back. But I'll settle for the sliver."},{"cmd":"say","speaker":"fin","text":"What happens if the lantern goes out?"},{"cmd":"say","speaker":"npc.lanternwick.maren","text":"Ask me again when you're back. Come to me first - there's a small thing to do before any moor."},{"cmd":"camera","to":{"x":30,"y":20},"ms":900},{"cmd":"effects","effects":[{"set":{"slice_intro":true}}]}]},"cut.mothqueen-cured":{"id":"cut.mothqueen-cured","skippable":true,"steps":[{"cmd":"camera","to":{"x":12,"y":4},"ms":900},{"cmd":"wait","ms":300},{"cmd":"say","text":"The lantern's beam finds the black parasite and burns it off her thorax - not a killing blow but a cleansing one. It curls to ash and blows away."},{"cmd":"say","text":"She refolds her wings, slow and enormous. When she speaks, the whole grove speaks with her - every leaf and moth murmuring her words."},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"Thirty-four winters that thing chewed on me. And two children pull it out in a night."},{"cmd":"say","speaker":"fin","text":"We're not children. He's THIRTEEN."},{"cmd":"say","text":"Something like amusement rustles through the leaves."},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"My apologies. Elders, then."},{"cmd":"say","speaker":"kes","text":"Maren said you remember the old sun. She said you'd help us relight it."},{"cmd":"say","text":"The whole grove goes utterly still."},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"Relight."},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"Elder-child, the sun did not fall. The sun was BROKEN."},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"Broken like bread is broken. On purpose. By the ones sworn to keep it."},{"cmd":"say","speaker":"kes","text":"The Sun-Keepers? Why would they-"},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"I have guarded their reasons for a lifetime without knowing them. The shard they gave me poisoned me and I guarded it still."},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"If you would know WHY - the sky-watchers wrote everything in their cold tower. Ask the north, if any of it survives."},{"cmd":"say","text":"Fin's voice goes small."},{"cmd":"say","speaker":"fin","text":"Did they break it because something's wrong with it?"},{"cmd":"say","text":"She looks at Fin a long moment."},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"The young ask the right questions first. It is why the old keep them close."},{"cmd":"say","text":"She breathes on you, and a cloak of living glow-moth wings settles over your shoulders - light as ash, tugging upward, wanting the open air and the gaps."},{"cmd":"effects","effects":[{"give":"item.moth-cloak","n":1},{"set":{"has_moth_cloak":true}},{"set":{"mothqueen_cured":true}},{"set":{"d02_cleared":true}},{"set":{"spark_mothqueen":true}},{"set":{"revelation_1":true}}]}]},"cut.mothqueen-intro":{"id":"cut.mothqueen-intro","skippable":true,"steps":[{"cmd":"camera","to":{"x":12,"y":3},"ms":1000},{"cmd":"wait","ms":350},{"cmd":"say","text":"The Hollow Heart. A great bloom hangs where the tree's pulse should beat. Something vast is folded into it - wings, and a black crust that is not bark."},{"cmd":"say","speaker":"fin","text":"Kes. That's not a bloom. It's breathing."},{"cmd":"sfx","ref":"hit"},{"cmd":"camera","shake":4},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"Light. After so long. The little flame that walks. Come to feed me, or to burn me?"},{"cmd":"say","speaker":"kes","text":"Neither. We came to help. Fin - the shard-crust on her, it's the same black as the parasites. She's not the sickness. She's carrying it."},{"cmd":"say","speaker":"npc.gloamwood.mothqueen","text":"It moves my wings now, child, not I. Stand clear of the ash it spits - and if your light is true, aim it at the black. At the BLACK. Not at me."},{"cmd":"effects","effects":[{"set":{"d02_queen_woke":true}}]},{"cmd":"camera","to":{"x":12,"y":6},"ms":600}]},"cut.sliver-recoil":{"id":"cut.sliver-recoil","skippable":true,"steps":[{"cmd":"camera","to":{"x":33,"y":17},"ms":800},{"cmd":"wait","ms":300},{"cmd":"say","text":"Maren takes the sliver and feeds it to the lantern. The hearth-flame rears back - away from it - like a hand snatched from a hot stove."},{"cmd":"sfx","ref":"hit"},{"cmd":"camera","shake":4},{"cmd":"wait","ms":350},{"cmd":"say","text":"The village gasps. Then the flame settles again, smaller now, and wary of the cold-burning splinter beside it."},{"cmd":"say","speaker":"fin","text":"It doesn't like it."},{"cmd":"say","speaker":"npc.lanternwick.maren","text":"No. It remembers it."},{"cmd":"say","speaker":"kes","text":"Remembers what?"},{"cmd":"say","speaker":"npc.lanternwick.maren","text":"Enough for tonight. It's held."},{"cmd":"say","text":"She waits until the boys are gone. Then, alone, she leans close to the small stubborn flame and speaks so only it can hear."},{"cmd":"say","speaker":"npc.lanternwick.maren","text":"I'm sorry. A little longer."},{"cmd":"effects","effects":[{"set":{"sliver_taken":true}}]}]}},"dialogue":{"dlg.beacon-approach":{"id":"dlg.beacon-approach","speaker":"npc.lanternwick.old-wick","nodes":[{"id":"n1","text":"That trail runs out to the Fallen Beacon. A Keeper died at his post there, long ago - keeping the light so the moor could find its way home.","next":"n2"},{"id":"n2","text":"His grief never went out. It sits in the dark like a cold coal, and it does not care to be disturbed. So heed the old rule, children.","next":"n3"},{"id":"n3","text":"Do not wake it. Keep a lit brazier's warmth between you and it, and it cannot touch you. Go dark, and it surely will."}]},"dlg.beacon-keeper":{"id":"dlg.beacon-keeper","nodes":[{"id":"n1","text":"A Keeper's inscription, cut deep and proud into the lintel: HERE THE LIGHT IS KEPT, AGAINST ALL DARK, WHILE ONE OF US STANDS.","next":"n2"},{"id":"n2","text":"Below it, scratched later by a shaking hand, the letters raw and crooked: DO NOT WAKE IT. THE LIGHT IS ALL IT HAS LEFT."}]},"dlg.beacon-line":{"id":"dlg.beacon-line","nodes":[{"id":"n1","text":"Cold braziers stand in a row down the old signal-hall. A worn plaque: LIGHT THE BEACON-LINE NORTH TO SOUTH, SO THE FLAME CARRIES CLEAN TO THE SEA.","next":"n2"},{"id":"n2","text":"The northmost brazier is the one nearest the stair. Kindle them in that order, and the grief-cold sealing the key-niche will let go."}]},"dlg.brand.beacon":{"id":"dlg.brand.beacon","speaker":"npc.lanternwick.brand","nodes":[{"id":"n1","text":"Lamb's home and old light's back at the shrine. The flock felt it - lay down calm, all at once. I counted them once. Right number. I let it be."}]},"dlg.brand.lamb-home":{"id":"dlg.brand.lamb-home","speaker":"npc.lanternwick.brand","nodes":[{"id":"n1","text":"The lamb walked home on her own last night, calm as you like. I counted the flock once, got the right number - and I did not count again. First time in years."}]},"dlg.brand.opening":{"id":"dlg.brand.opening","speaker":"npc.lanternwick.brand","nodes":[{"id":"n1","text":"You're Maren's boys. Good - sharper eyes than mine, maybe. A lamb's gone from the fold three nights running, and the gate's never once been open.","next":"n2"},{"id":"n2","text":"I've counted the latch a hundred times. It holds.","choices":[{"text":"A wolf, then?","next":"n3"},{"text":"Three nights straight?","next":"n4"},{"text":"We'll find your lamb.","next":"n5","effects":[{"quest":{"id":"q.side.duskmoor.missing-lamb"},"start":true}]}]},{"id":"n3","text":"No wolf shuts the latch behind it. No wolf leaves the lamb FED, neither - I found wool in the far bog, full-bellied and calm. That's not eating. That's tending.","next":"n5"},{"id":"n4","text":"Same hour each night, Tamsin says. She's steadier about it than me. Me, I count them twice, then lie awake counting them again.","next":"n5"},{"id":"n5","text":"If your road takes you past the south bog - look, don't poke. Something out there's lonely, not hungry. I can tell the difference now. Wish I couldn't."}]},"dlg.brand.tasked":{"id":"dlg.brand.tasked","speaker":"npc.lanternwick.brand","nodes":[{"id":"n1","text":"You are really going out there? Bless you. Ask Tamsin before the bog - she is up in the north pasture, and she watches far better than I fret. Which is a lot."}]},"dlg.gloam.fennick.healed":{"id":"dlg.gloam.fennick.healed","speaker":"npc.gloamwood.fennick","nodes":[{"id":"n1","text":"You did it, lad. You burned that rot from the heart-frame, and the whole colony breathes as one glow again. Isolde - tell them what you told me at supper.","next":"n2"},{"id":"n2","speaker":"npc.gloamwood.isolde","text":"That the quiet feels like resting now, not losing. I reached to finish his sentence, and the end was just there. Waiting. Right where it always used to -","next":"n3"},{"id":"n3","text":"- used to be. You hear that? She reached, and it came. I've got my wife's voice back inside my own skull, right where I keep it.","next":"n4"},{"id":"n4","speaker":"npc.gloamwood.isolde","text":"And he's got mine. Come to my lamp before the deep wood - I've a jar of the loft's own glow-moths set aside for you, drowsy and kind. Our proper thanks.","next":"n5"},{"id":"n5","text":"In the black places where your lantern quits, those moths hold a soft green light around you. Go on to her now, before I'm the one who starts -","next":"n6"},{"id":"n6","speaker":"npc.gloamwood.isolde","text":"- before you start weeping into your beard, old man. Go safe, child. And thank you - for handing us back the ends of our own sentences."}]},"dlg.gloam.fennick.opening":{"id":"dlg.gloam.fennick.opening","speaker":"npc.gloamwood.fennick","nodes":[{"id":"n1","text":"Isolde send you down my end? She frets at the far lamp when she can't see me. I let her - it gives her something to do besides fret at me.","next":"n2"},{"id":"n2","text":"Mind the moths near the oil; they'll drink a lamp dry, the greedy little angels. Here - top off your lantern before the deep wood. You'll want the reach.","next":"n3"},{"id":"n3","text":"She thinks I haven't noticed we've gone quiet, she and I. I've noticed. Thirty years of her finishing my thoughts, and now I reach for one and it's just mine.","next":"n4"},{"id":"n4","text":"Don't tell her I said so. Tell her the moths behaved. Go safe, boys - and if the grove lets you in, mind your manners. The Mothqueen is older than grief."}]},"dlg.gloam.fennick.silent":{"id":"dlg.gloam.fennick.silent","speaker":"npc.gloamwood.fennick","nodes":[{"id":"n1","text":"Isolde send you down my end? Used to be she'd finish my thought before I found it. Now I hand her half a sentence and she just looks at me, waiting.","next":"n2"},{"id":"n2","text":"Ah, don't mind me grumbling at the dark. What did you need, lad?","choices":[{"text":"Isolde sent me - I'm to burn the rot. Walk me up.","req":["flag:silent_station_asked","!flag:silent_station_cured"],"next":"nUp","effects":[{"set":{"silent_station_toloft":true}}]},{"text":"Have you two gone quiet, you and Isolde?","req":["!flag:silent_station_asked"],"next":"nW1"},{"text":"Rest easy. I'll leave you to the lamps.","req":["!flag:silent_station_asked"],"next":"nBye"}]},{"id":"nUp","text":"Aye. I can't leave the near lamp dark, but I'll climb the stair with you and point out the rotted heart-frame. Come on - mind the low beam."},{"id":"nW1","text":"And I look back, and neither of us can find the - the word. The end of it. Thirty years, and I've misplaced the ends of my own sentences. My fault, I reckon.","next":"nW2"},{"id":"nW2","text":"Isolde's the one to ask - if her words hold long enough to ask her. Go on to her at the near lamp. She frets better than she rests."},{"id":"nBye","text":"Go on, then. The deep wood won't wait, and the moths won't feed themselves. Safe roads, lad."}]},"dlg.gloam.moth-frame":{"id":"dlg.gloam.moth-frame","nodes":[{"id":"n1","text":"A silk-frame hangs over the coals, its glow-moths gone dark. A black rind creeps across the silk - cinder-ash, the same rot that once poisoned the Mothqueen.","next":"n2"},{"id":"n2","text":"This is the heart-frame, where new moths learn the colony's shared light. The rot frays that lesson - no wonder the tenders below have lost each other's rhythm.","choices":[{"text":"Hold the lantern to the rot and burn it out.","req":["quest:q.side.gloamwood.silent-station>=1","!flag:silent_station_cured"],"next":"n3","effects":[{"set":{"silent_station_cured":true,"silent_station_toloft":true}}]},{"text":"Best not touch it blind - learn what it is first.","next":"n4"}]},{"id":"n3","text":"Lantern-fire licks the rind and it curls back, hissing thin. The clean moths flare gold and pulse as one again, breathing together. The heart-frame is whole."},{"id":"n4","text":"The rot waits, patient as ash. Whatever it's unmaking, it will finish if no one puts fire to it. Come back knowing the enemy, with a lantern and a reason."}]},"dlg.gloam.grove-gate":{"id":"dlg.gloam.grove-gate","nodes":[{"id":"n1","text":"The grove-gate is a knot of living wood, laced shut with silver moths that do not scatter at your step. They only watch - hundreds of small eyes, weighing you.","next":"n2"},{"id":"n2","text":"There is no latch, no lock, nothing a hand could force. A gate like this opens to no hand. It opens to a need it judges true - and it has not judged yours.","next":"n3"},{"id":"n3","text":"So the moths keep their counsel and the way stays shut. The grove is not being cruel - it is being certain. And in a wood this old, certainty is never quick."}]},"dlg.gloam.grub.known":{"id":"dlg.gloam.grub.known","speaker":"npc.gloamwood.grub","nodes":[{"id":"n1","text":"You talked to the old foxfire man, yeah? Then you'll be wanting the grove. Course you will. Everybody wants the grove - nobody knows the back way but me.","next":"n2"},{"id":"n2","text":"A root-tunnel skips the sealed path and comes up under the Mothqueen's gate. Won't open it - nothing does but her - but I'll get you to the doorstep."}]},"dlg.gloam.grub.opening":{"id":"dlg.gloam.grub.opening","speaker":"npc.gloamwood.grub","nodes":[{"id":"n1","text":"Oi! Not there - that's a whistlecap ring, worth three shortcuts and a favor. Crush it and you owe me. Name's Grub. I know every hole in this wood.","next":"n2"},{"id":"n2","text":"Foxfire caps, jump-mushrooms, dry-socks lichen - I forage it, I trade it. And tunnels. I know tunnels the moths don't. Everybody needs a tunnel eventually.","next":"n3"},{"id":"n3","text":"Coin's boring. Bring me something the deep dark chewed up, and I'll scratch you a shortcut in the dirt. Best rate in the wood. Only rate in the wood, but still.","next":"n4"},{"id":"n4","text":"Everyone down here whispers. Not me. Dark's just a room with the lamp out - learn where the furniture is, and you run straight through it. Watch me sometime."}]},"dlg.gloam.hermit.met":{"id":"dlg.gloam.hermit.met","speaker":"npc.gloamwood.hermit","nodes":[{"id":"n1","text":"Still here? The grove's east, past the moth-tenders' lamps. Go careful - the dark in this wood is old, and it was awake long before the sun ever guttered.","next":"n2"},{"id":"n2","text":"And when the Mothqueen tells you a thing that turns your stomach - believe her. I've had thirty-four years to call it a lie, and I never once could."}]},"dlg.gloam.hermit.mothqueen":{"id":"dlg.gloam.hermit.mothqueen","speaker":"npc.gloamwood.hermit","nodes":[{"id":"n1","text":"The moths have parted. Thirty-four years that gate stayed shut, and it opens for two lantern-children. She must feel the old light on you.","next":"n2"},{"id":"n2","text":"Go in, then. But hear me: the thing that hurts her is not her. A black rot fastened on her long ago, and she has worn it so long she forgets it can come off.","next":"n3"},{"id":"n3","text":"Your brother carries a lantern. Good. Light is the only knife that cuts the rot and spares the queen. Burn what fastened on her - never her.","choices":[{"text":"We'll go to her.","effects":[{"quest":"q.main.04-mothqueen","start":true},{"set":{"mothqueen_sent":true}}],"next":"n4"},{"text":"The rot is burned out; she stands free.","req":["!flag:slice_intro"],"effects":[{"set":{"d02_cleared":true}},{"set":{"revelation_1":true}}]},{"text":"What is she?","next":"n3b"}]},{"id":"n3b","text":"Older than the moor. She remembers the sun when it stood whole. That is why Maren sent you - and why I tend a lonely fire this close to a queen. Someone should.","next":"n3"},{"id":"n4","text":"Go gently. She has hurt a long, long while. When the rot is gone and she can think her own thoughts again - listen. She will tell you a hard thing."}]},"dlg.gloam.hermit.opening":{"id":"dlg.gloam.hermit.opening","speaker":"npc.gloamwood.hermit","nodes":[{"id":"n1","text":"Step soft, boys. The foxfire's shy, and it's the only honest light down here. I've tended it since the day I stopped tending a greater one.","next":"n2"},{"id":"n2","text":"That flame you carry, though. I knew a light like it once, up close, before it went out of the world. Where did two boys come by a Keeper's spark?","choices":[{"text":"Elder Maren gave it to us. She said you remember the old sun.","next":"n3"},{"text":"A Keeper's spark - what do you mean?","next":"n2b"}]},{"id":"n2b","text":"I swept the Sun-Keepers' halls in the years before the dark. A groundskeeper knows a Keeper's light on sight, same as I know my own hands.","next":"n3"},{"id":"n3","text":"Maren. Still tending her secret after all this time. Then she'll have handed you half a truth and kept the other half warm. That's her way.","next":"n4"},{"id":"n4","text":"So hear the half she skips. A sun does not simply fall. A thing that great does not go dark on its own, in the night, with no one near.","next":"n5"},{"id":"n5","text":"It didn't just fall, boy. Somewhere, someone let it. That's as far as my knowing goes - I kept the floors, not the reasons.","next":"n6"},{"id":"n6","text":"One still living remembers the reasons - the Mothqueen, in the sealed grove to the east. She knows more than I ever did, and her gate opens only to a true need.","effects":[{"set":{"met_hermit":true}}]}]},"dlg.gloam.isolde.healed":{"id":"dlg.gloam.isolde.healed","speaker":"npc.gloamwood.isolde","nodes":[{"id":"n1","text":"There you are - the one who climbed to the loft and burned the rot out of the heart-frame. The colony pulses as one light again. And so, it seems, do we.","next":"n2"},{"id":"n2","speaker":"npc.gloamwood.fennick","text":"So do we. She started that thought, and I -","next":"n3"},{"id":"n3","text":"- and he finished it. Out loud, without me reaching into the dark for the end of him. First time in a whole season.","next":"n4"},{"id":"n4","speaker":"npc.gloamwood.fennick","text":"The end was right where you left it, love. Thirty years it lived in your mouth and mine. The moths had only forgotten how to carry it across.","next":"n5"},{"id":"n5","text":"And now they remember, and so do we. Here - a jar of the loft's glow-moths, drowsy and kind. Where your lantern fails, they'll keep a green hush of light.","next":"n6"},{"id":"n6","speaker":"npc.gloamwood.fennick","text":"Down in the black places, hold it up. No corner of a dark room stays wholly dark with our moths riding your pack. Go safe, the both of you, and mind -","next":"n7"},{"id":"n7","text":"- mind the dark doesn't learn your names. There, you heard it: he starts it, I land it. Good as thirty years gone."}]},"dlg.gloam.isolde.opening":{"id":"dlg.gloam.isolde.opening","speaker":"npc.gloamwood.isolde","nodes":[{"id":"n1","text":"Don't swat, just walk slow, and the moths will part for you. We keep the colony here; they keep the road lit. It's a fair trade, most nights.","next":"n2"},{"id":"n2","text":"You're bound for the deep wood - everyone bound for the deep wood stops at our lamps first. Warm your hands. And promise me you'll come back out of it.","next":"n3"},{"id":"n3","text":"That's Fennick, off at the far lamp. Thirty years I could finish his sentences before he found the ends of them himself. Lately I've stopped.","next":"n4"},{"id":"n4","text":"The dark gets into a marriage same as a wood. But you didn't come for an old woman's frets - you came for the way on. Seek the Hermit, past the third lamp.","next":"n5"},{"id":"n5","text":"He knew the old Keepers; we only ever knew the moths. If it's the grove you want, it's him you want first. Go safe, and mind the dark doesn't learn your names."}]},"dlg.gloam.isolde.silent":{"id":"dlg.gloam.isolde.silent","speaker":"npc.gloamwood.isolde","nodes":[{"id":"n1","text":"You came down the loft-stair? Sit a moment. Fennick's off at the far lamp - I'd call to him, but lately when I call, the words come out wrong.","next":"n2"},{"id":"n2","text":"Thirty years I could end his sentences before he found the ends himself. Now I reach to help and the thought just - it's gone. Something eats it mid-air.","next":"n3"},{"id":"n3","text":"Don't mind an old woman fretting at the dark. You had a question, I think.","choices":[{"text":"Something IS eating it. Let me see the colony.","req":["!flag:silent_station_asked"],"next":"n4","effects":[{"quest":{"id":"q.side.gloamwood.silent-station"},"start":true},{"set":{"silent_station_asked":true}}]},{"text":"I'm still hunting the rot. I'll be back.","req":["flag:silent_station_asked"],"next":"n5"},{"text":"Long years do that. Be gentle on yourself.","next":"n6"}]},{"id":"n4","text":"You feel it too - so I'm not just gone dull. Climb the loft-stair. If rot's crept into the silk-frames, burn it clean. Before it takes the last of what we -"},{"id":"n5","text":"Bless you. The loft-stair's right behind me. Whatever's chewing the quiet up there, put your lantern to it. I'll keep starting sentences till you mend the ends."},{"id":"n6","text":"You're kind. But I know my own voice, and half of it's gone missing. Go safe on your road. I'll be here, holding a thought I can't -"}]},"dlg.lowry.beacon":{"id":"dlg.lowry.beacon","speaker":"npc.lanternwick.lowry","nodes":[{"id":"n1","text":"You went into the dark and carried a piece of the light home. Bless you both. I kept the window-lamp lit the whole while - a door to come back to.","next":"n2"},{"id":"n2","text":"Now eat. You look like two boys who wrestled a tower and skipped supper. The world sits easier on hot broth. It always has."}]},"dlg.lowry.guttering":{"id":"dlg.lowry.guttering","speaker":"npc.lanternwick.lowry","nodes":[{"id":"n1","text":"The big flame's steady again, and it was you two who did it. Sit anyway. Steady flame or no, my pot's on and my door's open. That much never changes."}]},"dlg.lowry.opening":{"id":"dlg.lowry.opening","speaker":"npc.lanternwick.lowry","nodes":[{"id":"n1","text":"In from the dark, both of you - sit, sit. Lowry's kitchen never closed a night in its life, and it won't start with you two shivering in my doorway.","next":"n2"},{"id":"n2","text":"Now. What'll it be?","choices":[{"text":"Something hot?","next":"n3"},{"text":"Late night, Lowry?","next":"n4"}]},{"id":"n3","text":"Barley broth and bread you could stand a spoon in. No coin - Maren's boys eat on the house, and don't argue with a widow in her own kitchen. You'll lose.","next":"n5"},{"id":"n4","text":"Every night's late here, love. I keep a lamp in the window and a pot on the coals. If the big flame ever falters, folk should still find one warm door open.","next":"n5"},{"id":"n5","text":"Eat. Rest your feet. Whatever Maren's sending you off to do can wait for broth. Everything sits easier on a full stomach - even the end of the world."}]},"dlg.maren.beacon-done":{"id":"dlg.maren.beacon-done","speaker":"npc.lanternwick.maren","nodes":[{"id":"n1","text":"The hearth holds, and the sliver sulks beside it like a strange dog that won't be petted. You did a hard thing well.","next":"n2"},{"id":"n2","text":"Rest tonight. There are questions in that cold splinter I am not ready to ask aloud - and answers I have kept too long. Soon. Not tonight."}]},"dlg.maren.beacon-return":{"id":"dlg.maren.beacon-return","speaker":"npc.lanternwick.maren","nodes":[{"id":"n1","text":"You went down into it, then. Let me see what the old dark was keeping.","choices":[{"text":"Hold up the sliver.","req":["item:item.shard-sliver"],"effects":[{"take":"item.shard-sliver"},{"set":{"sliver_offered":true}}]},{"text":"The beacon is dark now, and the sliver is ours.","req":["!flag:slice_intro"],"effects":[{"set":{"d01_cleared":true}},{"set":{"sliver_offered":true}}]},{"text":"Not yet.","next":"n2"}]},{"id":"n2","text":"Then the moor is not done with you. Go back down - the old light is worth the walking dark. I'll keep the wick trimmed till you're home."}]},"dlg.maren.beacon":{"id":"dlg.maren.beacon","speaker":"npc.lanternwick.maren","nodes":[{"id":"n1","text":"The flame stands steadier now. Steady enough to leave for a night. You remember what I asked at the shrine.","next":"n2"},{"id":"n2","text":"The Fallen Beacon, out on the north moor. It answered the dawn, once. Deep down a sliver of the old light still burns.","choices":[{"text":"We'll bring it back.","next":"n3","effects":[{"quest":"q.main.02-fallen-beacon","start":true},{"set":{"beacon_errand":true}}]},{"text":"What's down there?","next":"n4"}]},{"id":"n3","text":"The moor bites - wisps and worse. Let Kes's blade scatter what comes, and keep close. The trail begins north of the square, past the old cottages.","next":"n5"},{"id":"n4","text":"A keeper who never left his post, they say. Be gentle if you can. The old light was somebody's duty long before it was our need.","next":"n3"},{"id":"n5","text":"Bring the sliver home to me, and we'll feed it to the hearth together. Go while the flame holds."}]},"dlg.maren.map-done":{"id":"dlg.maren.map-done","speaker":"npc.lanternwick.maren","nodes":[{"id":"n1","text":"So you found the wood-road, and the wood let you pass. Further than I ever dared go back. There's a courage in you two that I traded away for safety, long ago.","next":"n2"},{"id":"n2","text":"Whatever the Mothqueen shows you, hold onto it, even when it's heavy. I carried a light and a silence thirty-four years - and the silence weighed the most."}]},"dlg.maren.map-onway":{"id":"dlg.maren.map-onway","speaker":"npc.lanternwick.maren","nodes":[{"id":"n1","text":"East, into the Gloamwood - the wood-road's on my map. Go slow where the lamps thin. The dark out there is old, older than the Shattering, and it does not sleep.","next":"n2"},{"id":"n2","text":"Find the moth-tenders' waystation - warm the lantern, ask the way to the grove. Then the Mothqueen, if the wood lets you. I'll keep the hearth till you're home."}]},"dlg.maren.marens-map":{"id":"dlg.maren.marens-map","speaker":"npc.lanternwick.maren","nodes":[{"id":"n1","text":"The sliver sleeps by the hearth now, and I've had a night to be a coward about it. Sit. There's a place I can send you, and a thing I can't yet make myself say.","next":"n2"},{"id":"n2","text":"You felt the flame flinch from that splinter. You'll want to know why. I could give you a piece of it - but a piece from me is only a scared old woman's guess.","next":"n3"},{"id":"n3","text":"Deep in the Gloamwood there's a grove, and something in it as old as the first dawn. The Mothqueen. She kept the watch when I was a girl. She remembers the sun.","next":"n4"},{"id":"n4","text":"She is the only other soul still living who was THERE. I'm giving you my map, and the road east, if you'll take them. Will you go and ask her?","choices":[{"text":"We'll go.","next":"n5","effects":[{"quest":"q.main.03-marens-map","start":true},{"set":{"marens_map_given":true}},{"set":{"gloam_road_open":true}}]},{"text":"What aren't you telling us?","next":"n4b"}]},{"id":"n4b","text":"That I'm tired, and afraid, and the answer you chase has my own name tangled somewhere inside it. Ask me again when you're home. Tonight, just take the road.","next":"n4"},{"id":"n5","text":"Then here - my own map, from when these feet still walked that far. The wood-road east, the moth-tenders' lamps, the clean water. Go carefully. Come home to me."}]},"dlg.maren.opening":{"id":"dlg.maren.opening","speaker":"npc.lanternwick.maren","nodes":[{"id":"n1","text":"Kes. Fin. Come in from the dusk before it gets into you.","next":"n2"},{"id":"n2","text":"You saw the shrine-flame shiver. Thirty-four years it has burned, and tonight it flinched like a cold child.","choices":[{"text":"What can we do?","next":"n3","effects":[{"quest":"q.main.01-guttering","start":true},{"set":{"maren_asked":true}},{"set":{"chores_begun":true}}]},{"text":"Is it going out?","next":"n4"}]},{"id":"n3","text":"Small hands, steady hands. First go and greet Old Wick at the shrine - he tends the little flame and will show you its fret.","next":"n5"},{"id":"n4","text":"Not while two brave boys keep it fed. Nothing honest dies while someone still tends it.","next":"n3"},{"id":"n5","text":"Then fetch lamp-oil from Sera at the forge, up the hill, and bring it back to me. We'll trim the wick together.","next":"n6"},{"id":"n6","text":"Go on now - your feet know the way, and your hands will learn the rest. And Fin, do not name the dark tonight. Names answer when you call them."}]},"dlg.maren.tasked":{"id":"dlg.maren.tasked","speaker":"npc.lanternwick.maren","nodes":[{"id":"n1","text":"Still guttering. But you came back, and that counts for more than oil ever could.","choices":[{"text":"We have the oil.","req":["item:item.lantern-oil"],"next":"n2","effects":[{"take":"item.lantern-oil"},{"set":{"lantern_tended":true}}]},{"text":"Not yet.","next":"n3"}]},{"id":"n2","text":"Good. Pour it slow. A flame this old does not care to be startled. There - see how it stands up straight again?"},{"id":"n3","text":"Sera keeps it by the cold forge, east of the square. She will grumble at you. Let her - it is how she says she cares."}]},"dlg.mothqueen.ally":{"id":"dlg.mothqueen.ally","speaker":"npc.gloamwood.mothqueen","nodes":[{"id":"n1","text":"Back again, and the grove knows your step now - it quiets for you. Sit if you like. The moss keeps no clock, and I have nowhere left to hurry.","choices":[{"text":"Any wisdom for the road?","next":"n2"},{"text":"Tell us about the north again.","next":"n3"},{"text":"We should get moving.","next":"n4"}]},{"id":"n2","text":"Move like the seasons. Do not fight winter head-on - outlast it. Every long dark I have ever known ended, and not one of them asked my leave to do it."},{"id":"n3","text":"The cold tower, if it stands. The sky-watchers wrote the why on its walls. Ask the north - and mind the cold; it is a poison too, only slower than mine was."},{"id":"n4","text":"Before you go - Fin. Keep asking your questions out loud. Your brother swings the lantern, but you are the one who will know where to point it."}]},"dlg.mothqueen.cured":{"id":"dlg.mothqueen.cured","speaker":"npc.gloamwood.mothqueen","nodes":[{"id":"n1","text":"The poison is gone. Thirty-four winters it drank from me - and now, spring, all at once. I had forgotten the taste of my own thoughts.","next":"n2"},{"id":"n2","text":"Feel how the grove leans toward you? Every leaf has turned. When I am glad, the whole wood is glad, and it has been a long age since it was glad.","next":"n3"},{"id":"n3","text":"You carry the hard half of the truth from me now: the sun did not fall. It was broken, on purpose, by the very hands sworn to keep it. Hold it gently.","next":"n4"},{"id":"n4","text":"Maren sent you to relight it. Then relight it - and I will help. My roots are this grove, the last green thing for a hundred miles, so I cannot walk with you.","next":"n5"},{"id":"n5","text":"I can be your first spark. Take the light I give freely. Every pilgrim after you kindles from the one before - that is how a dark world learns to burn again.","next":"n6"},{"id":"n6","text":"As for WHY the keepers broke the thing they kept - I never learned it. I only guarded their reasons, poisoned, and kept my silence for a lifetime.","choices":[{"text":"Where do we find the why?","next":"n7"},{"text":"Then we'll carry the how, and hunt the why ourselves.","next":"n7b"}]},{"id":"n7","text":"North. Past the steppe, where the cold bites the marrow, the sky-watchers kept a pale tower and wrote down all they saw. Ask the north, if any of it survives.","next":"n8"},{"id":"n7b","text":"Good. Then go north for it. The sky-watchers in their cold tower set down all they knew. Ask them - ask the north, if any of it still survives.","next":"n8"},{"id":"n8","text":"And the small one. Fin. You asked whether they broke it because something was wrong with it. Keep that question close. The young ask the right ones first.","next":"n9"},{"id":"n9","text":"Go now, elders. Winter is long, but it is only ever a season. Even a broken sun is a thing that can be mended - even this grove was once ash.","effects":[{"set":{"mothqueen_thanked":true}}]}]},"dlg.mothqueen.grove":{"id":"dlg.mothqueen.grove","speaker":"npc.gloamwood.mothqueen","nodes":[{"id":"n1","text":"The grove holds its breath. Deep in the dark of the leaves, great wings shift and go still. This is not the hour, small lights. Come when you are ready."}]},"dlg.old-wick.beacon":{"id":"dlg.old-wick.beacon","speaker":"npc.lanternwick.old-wick","nodes":[{"id":"n1","text":"You brought a splinter of the old light home. I felt it - the shrine-fire leaned toward the hearth like a flower to morning. I am not ashamed to weep.","next":"n2"},{"id":"n2","text":"I will scrub the east stone bright and set it for the dawn. Tell Maren an old fool is getting ready at last. She will not laugh this time."}]},"dlg.old-wick.opening":{"id":"dlg.old-wick.opening","speaker":"npc.lanternwick.old-wick","nodes":[{"id":"n1","text":"Careful by the flame, lads. It's fretful tonight - and an old light frets like an old man, all at once and about everything.","effects":[{"set":{"tut_greeted":true}}],"next":"n2"},{"id":"n2","text":"You'll humour me a moment? Nobody young ever does.","choices":[{"text":"You remember the real sun?","next":"n3"},{"text":"How old is this shrine-fire?","next":"n4"}]},{"id":"n3","text":"I do. Gold everywhere, warm on your neck, no lantern needed. The young ones smile and call me dreaming. Let them. I know what I stood in.","next":"n5"},{"id":"n4","text":"Older than the village. The hearth-lantern's one flame - Maren guards it, I tend it. That east-stone, though, is mine: it marks which way morning waits.","next":"n5"},{"id":"n5","text":"One day I'll scrub this old stone bright and set it for a true dawn. Daft, Maren says. But I mean to be ready when the sky changes its mind."}]},"dlg.old-wick.tended":{"id":"dlg.old-wick.tended","speaker":"npc.lanternwick.old-wick","nodes":[{"id":"n1","text":"I saw it from here - the big flame stood up straight and proud! Thirty-four years, and it's never stood taller. That's a morning-feeling, that is.","next":"n2"},{"id":"n2","text":"Go on, tell Maren an old fool wept at his shrine over a steadier flame. She'll pretend she didn't do the very same."}]},"dlg.petch.beacon":{"id":"dlg.petch.beacon","speaker":"npc.lanternwick.petch","nodes":[{"id":"n1","text":"You woke something in that beacon and laid it to rest. Brave. Light like that carries, though, and the capital has ears. Keep to the marked paths.","next":"n2"},{"id":"n2","text":"Do not ask how a moor mapmaker knows what the capital hears. I keep telling myself I do not know the answer. I am not certain I believe me."}]},"dlg.petch.guttering":{"id":"dlg.petch.guttering","speaker":"npc.lanternwick.petch","nodes":[{"id":"n1","text":"Flame's holding again? Good. Roads stay quiet when the light's steady. Not that I watch the roads. I only draw them. That is the whole job. Truly."}]},"dlg.petch.opening":{"id":"dlg.petch.opening","speaker":"npc.lanternwick.petch","nodes":[{"id":"n1","text":"Maps! Every road in Duskmoor, drawn by a man who'd rather draw them than walk them. Petch. Buying? Browsing? Not the law, are you? No. Of course not.","next":"n2"},{"id":"n2","text":"So. Which is it?","choices":[{"text":"Just looking.","next":"n3"},{"text":"You know the capital well.","next":"n4"}]},{"id":"n3","text":"Look all you like. A map's a promise the road usually breaks, but mine break gentler than most. Keep to the marked paths and the moor stays friendly-ish.","next":"n5"},{"id":"n4","text":"Solmere? Heh. I hear things. Which gate sticks, which wall the guards don't watch. Don't ask how a moor mapmaker knows all that. I don't much like the answer.","next":"n5"},{"id":"n5","text":"Anyway! Duskmoor maps. Cheerful subject. Take one when you've coin - the roads out of here get interesting, and I mean that the worrying way."}]},"dlg.poll.beacon":{"id":"dlg.poll.beacon","speaker":"npc.lanternwick.poll","nodes":[{"id":"n1","text":"You went in the DEAD BEACON and came back?! Biggest news the network has EVER run. Tock won't believe it. Next time you take me - I'm fast enough NOW."}]},"dlg.poll.opening":{"id":"dlg.poll.opening","speaker":"npc.lanternwick.poll","nodes":[{"id":"n1","text":"Kes! Is Fin coming out? Tell him I ran letters clear to the crossroads and back and a moor-wisp did NOT get me. Not even close-ish.","next":"n2"},{"id":"n2","text":"Well? Is he?","choices":[{"text":"You carry letters?","next":"n3"},{"text":"It's not safe out there, Poll.","next":"n4"},{"text":"I'll carry your letters.","next":"n6","effects":[{"quest":{"id":"q.side.duskmoor.postal"},"start":true},{"give":"item.letter-satchel","n":1}]}]},{"id":"n3","text":"Somebody has to! Tock keeps the far end, past the moor. Two kids, one road, all the news - that's a proper network. Put in a good word for me?","next":"n5"},{"id":"n4","text":"You sound like my gran. I'm FAST, and I know every dry path. When you go adventuring, take me - I'll carry things. I'm the best at carrying things.","next":"n5"},{"id":"n5","text":"Just tell Fin there's a letter with his name on it. It's from me. It only says COME OUT. But it's official, so he has to."},{"id":"n6","text":"YES! Here, take the whole satchel - do not lose it, Tock is counting on us. Crossroads, past the moor. You are the BEST."}]},"dlg.poll.postal-a":{"id":"dlg.poll.postal-a","speaker":"npc.lanternwick.poll","nodes":[{"id":"n1","text":"You will REALLY run them? Best day ever. Tock keeps the far end past the moor - get the satchel to the crossroads and she takes it from there. Easy!","next":"n2"},{"id":"n2","text":"Oh - one thing first. Sort them, would you? Make sure none spilled. I packed in a hurry and I do NOT want a letter reaching the wrong kid.","choices":[{"text":"Sort through the satchel.","req":["item:item.letter-satchel"],"next":"n3","effects":[{"set":{"letter_unnamed_read":true}}]}]},{"id":"n3","text":"Wait - that one. The one with no name. That is - that is nothing. Old scrap. Leave it be, all right? Just carry the rest. Please?"}]},"dlg.poll.postal-b":{"id":"dlg.poll.postal-b","speaker":"npc.lanternwick.poll","nodes":[{"id":"n1","text":"You read it, did you not. ...It is mine. I wrote it moons ago. It only asks them to let me go with the real runners. Fast as I am. Ready as I am.","next":"n2"},{"id":"n2","text":"Only there is nobody to hand it to. Gran says no, the elders do not listen to kids. So it just rides around in the bag going nowhere. Stupid.","choices":[{"text":"It is not stupid. Give it here - I will speak for you.","next":"n3","effects":[{"set":{"spoke_for_poll":true}}]}]},{"id":"n3","text":"You would... you would really tell them? Kes. KES. Say yes and I will run to Frostreach and back before you blink. I will not let the network down. Ever."}]},"dlg.poll.postal-done":{"id":"dlg.poll.postal-done","speaker":"npc.lanternwick.poll","nodes":[{"id":"n1","text":"Official runner now. OFFICIAL! Gran cried, the good kind. Me and Tock watch every dry path to the crossroads - anything moves out there, we will know first."}]},"dlg.reeve.beacon":{"id":"dlg.reeve.beacon","speaker":"npc.lanternwick.reeve","nodes":[{"id":"n1","text":"Back from that tower in one piece? Sit, let me see those hands. Steady - good. Even my lonely hill felt that light come home. Do not let it swell your heads."}]},"dlg.reeve.cold-forge":{"id":"dlg.reeve.cold-forge","speaker":"npc.lanternwick.reeve","nodes":[{"id":"n1","text":"So Sera wants her fire back? No. Her forge dies and up my hill she climbs to grumble at me. It is the only company the wind ever sends me.","next":"n2"},{"id":"n2","text":"A fire-seed would end that. She would have no reason to visit. So the seed stays in my jar, and the smith stays lonely. We both do.","choices":[{"text":"Then come to the smithy. Sera keeps a chair by the fire for you.","next":"n3"},{"text":"Just hand over the seed.","next":"n4"}]},{"id":"n3","text":"...She does, does she. A chair. Take it, then - this seed only catches from a fire freely shared, never a taken one, so I give it freely. Tell her seven.","effects":[{"give":"item.forge-seed","n":1},{"set":{"reeve_invited":true}}]},{"id":"n4","text":"No. A seed like this doesn't catch for grabbing hands, and neither do I. Come back when you have a kinder reason than a chore."}]},"dlg.reeve.opening":{"id":"dlg.reeve.opening","speaker":"npc.lanternwick.reeve","nodes":[{"id":"n1","text":"Two of Maren's errand-boys, and neither one bleeding for once. I'm Reeve. Want a tonic, say so plain, and drink it without the face.","next":"n2"},{"id":"n2","text":"Well? Speak up, I've herbs drying.","choices":[{"text":"Show me the stall.","next":"n6"},{"text":"What have you got?","next":"n3"},{"text":"You know Sera?","next":"n4"}]},{"id":"n6","text":"Coin out, then. Tonics on the left, honey for the little one, and mind you don't finger the dwale.","effects":[{"shop":"shop.reeve-herbstall"}]},{"id":"n3","text":"Bittergrass for cuts, dwale for bad dreams, and a red one I don't name. Drink a healing draught when you're HURT, not when you're scared. Big difference.","next":"n5"},{"id":"n4","text":"That cold-forge grump? She climbs my hill to complain her fire's out. Mend it and she'd have no reason to visit. Don't tell her I said the hill gets lonely.","next":"n5"},{"id":"n5","text":"Right, off with you. Come back green in the face and I'll know which one of you didn't listen."}]},"dlg.reeve.seed-given":{"id":"dlg.reeve.seed-given","speaker":"npc.lanternwick.reeve","nodes":[{"id":"n1","text":"Well? Is her forge roaring yet, or are you still cradling my fire-seed like a warm egg? Go on, up the hill. And do not tell her I asked after her."}]},"dlg.reeve.supper":{"id":"dlg.reeve.supper","speaker":"npc.lanternwick.reeve","nodes":[{"id":"n1","text":"Heard that forge roar clear down here. Good. I will be up her hill by seven with the good bread - and if she pretends she never asked me, well, so will I."}]},"dlg.sera.beacon":{"id":"dlg.sera.beacon","speaker":"npc.lanternwick.sera","nodes":[{"id":"n1","text":"Forge roaring and old light back on the moor in one week. My iron hums when it's near that spark. Bring me steel worth it and I'll teach it manners."}]},"dlg.sera.forge-lit":{"id":"dlg.sera.forge-lit","speaker":"npc.lanternwick.sera","nodes":[{"id":"n1","text":"Hear that roar? A real fire, at last. Reeve is coming up for supper - says it like it was my notion. Fine. Bring me good steel now and I will teach it manners."}]},"dlg.sera.opening":{"id":"dlg.sera.opening","speaker":"npc.lanternwick.sera","nodes":[{"id":"n1","text":"Two shadows in my doorway. Let me guess - Maren sent you down for oil.","choices":[{"text":"The lantern's guttering.","next":"n2"},{"text":"How did you know?","next":"n3"},{"text":"Your forge has gone dark and cold.","req":["!flag:cold_forge_asked"],"next":"cf1"},{"text":"The seed's ready - wake your forge.","req":["item:item.forge-seed"],"next":"cf3"}]},{"id":"n2","text":"It always is, this time of year. Here, take the jar. Tell her the forge says hello - cold, but it remembers her.","effects":[{"give":"item.lantern-oil","n":1},{"set":{"sera_gave_oil":true}}]},{"id":"n3","text":"Because it is the only reason anyone still climbs my hill. Take the oil and go warm the old woman's window.","effects":[{"give":"item.lantern-oil","n":1},{"set":{"sera_gave_oil":true}}]},{"id":"cf1","text":"Two winters cold. No wick, no coal, no honest heat. A smith with a dead forge is just a woman with heavy arms and nothing to hit.","choices":[{"text":"Let's relight it.","next":"cf2","effects":[{"set":{"cold_forge_asked":true}},{"quest":{"id":"q.side.duskmoor.cold-forge"},"start":true}]},{"text":"Another day, maybe."}]},{"id":"cf2","text":"You mean it? Then I need a fire-seed, and Reeve hoards one like a dragon on an egg. Sweet-talk it out of the old crow, then bring it here to me."},{"id":"cf3","text":"You did it. You actually did it. Stand back - this old hearth remembers how to breathe. There. THERE. Warm again. Reeve is coming to supper, is she? ...Good.","effects":[{"take":"item.forge-seed"},{"set":{"forge_kindled":true}}]}]},"dlg.tamsin.beacon":{"id":"dlg.tamsin.beacon","speaker":"npc.lanternwick.tamsin","nodes":[{"id":"n1","text":"So the light's home. I felt the whole moor ease the night you did it - I noticed before Brand did. You do steady work. Do not tell Brand I said so."}]},"dlg.tamsin.lamb-home":{"id":"dlg.tamsin.lamb-home","speaker":"npc.lanternwick.tamsin","nodes":[{"id":"n1","text":"Lamb is back in the fold and the bog has gone quiet - the good kind of quiet. I told Brand it was no tragedy. He is only now believing me. Thank you, both."}]},"dlg.tamsin.missing-lamb-offer":{"id":"dlg.tamsin.missing-lamb-offer","speaker":"npc.lanternwick.tamsin","nodes":[{"id":"n1","text":"I will walk you out - Brand would only weep in the reeds. There. See him? Grey as fog, still herding your lamb home gentle as anything.","next":"n2"},{"id":"n2","text":"He died in the first Dusk winter and never learned he could stop. Poor old soul. Go on - hold the crook out. Let him be the one to take it.","choices":[{"text":"Hold the crook out to him.","req":["item:item.shepherds-crook"],"next":"n3","effects":[{"take":"item.shepherds-crook"},{"set":{"crook_offered":true}}]}]},{"id":"n3","text":"He takes it like it is the first warm thing in a hundred winters. Sets the lamb down soft. And then he is gone - just gone. Rest now, old drover. You are done."}]},"dlg.tamsin.missing-lamb":{"id":"dlg.tamsin.missing-lamb","speaker":"npc.lanternwick.tamsin","nodes":[{"id":"n1","text":"So Brand set you on it. Listen - whatever takes the lamb walks the same round each night, careful as a shepherd. You do not hunt a thing like that.","next":"n2"},{"id":"n2","text":"Take this. The old crook from the fold - it belonged to a drover long past needing it. When you find him out in the bog, do not fight. Offer it back to him.","effects":[{"give":"item.shepherds-crook","n":1}]}]},"dlg.tamsin.opening":{"id":"dlg.tamsin.opening","speaker":"npc.lanternwick.tamsin","nodes":[{"id":"n1","text":"Don't mind Brand's fretting - he'd fret a sunrise was overdue, if we still had one. I'm Tamsin. The lamb's a puzzle, not a tragedy. Not yet.","next":"n2"},{"id":"n2","text":"Ask me plain, I'll answer plain.","choices":[{"text":"You're not worried?","next":"n3"},{"text":"Any idea who's taking it?","next":"n4"}]},{"id":"n3","text":"Worrying's Brand's job. I do noticing. And the taker walks the same path each night, careful as a shepherd on his rounds. Careful things, you can reason with.","next":"n5"},{"id":"n4","text":"Whoever it is knows sheep better than we do - puts them back where they sleep. If you go looking, bring the crook by the gate. Feels right to offer it back.","next":"n5"},{"id":"n5","text":"And keep Brand out of the bog. He'll go all teary, and then I'll have two lost lambs to walk home."}]}},"enemies":{"enemy.ash-hound":{"id":"enemy.ash-hound","name":"Ash Hound","hp":4,"contactDamage":2,"speed":1.1,"behavior":"chase","params":{"aggroRange":150,"telegraphMs":280,"pounceSpeed":2.2,"pounceMs":240},"spriteFamily":"ash-hound","drops":[{"embers":2,"chance":0.6}],"lowfxSafe":true},"enemy.cinder-crow":{"id":"enemy.cinder-crow","name":"Cinder Crow","hp":2,"contactDamage":1,"speed":1.2,"behavior":"swoop","params":{"aggroRange":200,"orbitRadius":60,"telegraphMs":260,"diveSpeed":3,"diveMs":320,"climbMs":500},"spriteFamily":"cinder-crow","drops":[{"embers":1,"chance":0.5}],"lowfxSafe":true},"enemy.cinder-eel":{"id":"enemy.cinder-eel","name":"Cinder Eel","hp":5,"contactDamage":2,"speed":1,"behavior":"weave","params":{"aggroRange":160,"weaveAmp":22,"weaveFreq":0.08,"waterbound":true,"telegraphMs":300,"lungeSpeed":2.6},"spriteFamily":"cinder-eel","drops":[{"embers":2,"chance":0.6}],"lowfxSafe":true},"enemy.cinder-parasite":{"id":"enemy.cinder-parasite","name":"Cinder Parasite","hp":3,"contactDamage":1,"speed":0.5,"behavior":"ambush","params":{"aggroRange":64,"buriedUntilMs":700,"telegraphMs":300,"lungeSpeed":1.8,"lungeMs":220},"spriteFamily":"cinder-parasite","drops":[{"embers":2,"chance":0.5},{"heart":1,"chance":0.25}],"lowfxSafe":true},"enemy.cindermarch-footman":{"id":"enemy.cindermarch-footman","name":"Cindermarch Footman","hp":6,"contactDamage":2,"speed":0.8,"behavior":"chase","params":{"aggroRange":150,"telegraphMs":320,"attackReach":16,"attackDamage":2,"recoverMs":300},"spriteFamily":"cindermarch-footman","drops":[{"embers":3,"chance":0.7}],"lowfxSafe":true},"enemy.cindermarch-pikeman":{"id":"enemy.cindermarch-pikeman","name":"Cindermarch Pikeman","hp":7,"contactDamage":2,"speed":0.5,"behavior":"guard","params":{"aggroRange":140,"guardReach":28,"telegraphMs":380,"thrustDamage":2,"blockFront":true,"recoverMs":360},"spriteFamily":"cindermarch-pikeman","drops":[{"embers":3,"chance":0.7}],"lowfxSafe":true},"enemy.ember-moth":{"id":"enemy.ember-moth","name":"Ember Moth","hp":1,"contactDamage":1,"speed":1.3,"behavior":"swarm","params":{"aggroRange":120,"jitter":0.5,"flockWith":"ember-moth","flockRadius":40},"spriteFamily":"ember-moth","drops":[{"embers":1,"chance":0.4},{"heart":1,"chance":0.25}],"lowfxSafe":true},"enemy.ember-urchin":{"id":"enemy.ember-urchin","name":"Ember Urchin","hp":4,"contactDamage":2,"speed":0.4,"behavior":"charge","params":{"aggroRange":150,"telegraphMs":420,"chargeSpeed":2.6,"chargeMs":700,"recoverMs":500},"spriteFamily":"ember-urchin","drops":[{"embers":2,"chance":0.6}],"lowfxSafe":true},"enemy.frost-revenant":{"id":"enemy.frost-revenant","name":"Frost Revenant","hp":10,"contactDamage":3,"speed":0.3,"behavior":"chase","params":{"aggroRange":110,"telegraphMs":520,"armorFront":true,"smashReach":16},"spriteFamily":"frost-revenant","drops":[{"embers":4,"chance":0.8},{"item":"item.lantern-oil","chance":0.08}],"lowfxSafe":true},"enemy.glass-wraith":{"id":"enemy.glass-wraith","name":"Glass Wraith","hp":5,"contactDamage":2,"speed":0.5,"behavior":"skirmish","params":{"aggroRange":180,"standoff":90,"telegraphMs":400,"projectile":{"speed":2.4,"damage":1,"life":90}},"spriteFamily":"glass-wraith","drops":[{"embers":3,"chance":0.6},{"heart":1,"chance":0.25}],"lowfxSafe":true},"enemy.glutton-spawn":{"id":"enemy.glutton-spawn","name":"Glutton Spawn","hp":3,"contactDamage":2,"speed":0.7,"behavior":"drift","params":{"aggroRange":150,"hoverAmp":5,"phaseTerrain":true,"biteRange":18,"telegraphMs":340,"eatsLight":true},"spriteFamily":"glutton-spawn","drops":[{"embers":2,"chance":0.5}],"lowfxSafe":true},"enemy.moor-shambler":{"id":"enemy.moor-shambler","name":"Moor Shambler","hp":8,"contactDamage":2,"speed":0.35,"behavior":"chase","params":{"aggroRange":90,"wakeMs":400,"telegraphMs":480,"smashReach":18},"spriteFamily":"moor-shambler","drops":[{"embers":3,"chance":0.7},{"item":"item.lantern-oil","chance":0.06},{"heart":1,"chance":0.25}],"lowfxSafe":true},"enemy.wisp":{"id":"enemy.wisp","name":"Marsh Wisp","hp":2,"contactDamage":1,"speed":0.6,"behavior":"drift","params":{"aggroRange":130,"hoverAmp":6,"phaseTerrain":true,"lureWander":0.4},"spriteFamily":"wisp","drops":[{"embers":1,"chance":0.5},{"heart":1,"chance":0.25}],"lowfxSafe":true}},"items":{"item.dawn-blade":{"id":"item.dawn-blade","name":"Dawn Blade","kind":"gear","desc":"Forged in the Sun Forge from the Beacon's shard-sliver and a thread of the First Flame. It cuts shadow the way morning cuts a long night.","icon":"sword","equipSlot":"weapon"},"item.dawn-ember":{"id":"item.dawn-ember","name":"Dawn Ember","kind":"upgrade","desc":"A mote of kept dawnlight, hard as amber. Fold it against your heart and it hangs one more heart on the string of your life.","icon":"heart","effects":[{"max-hearts":1}]},"item.dawnward-charm":{"id":"item.dawnward-charm","name":"Dawnward Charm","kind":"charm","desc":"A pinch of shrine-ash in a locket, Old Wick's blessing. Stand still and breathe, and the lantern coaxes one cracked heart slowly whole.","icon":"charm-dawnward","equipSlot":"charm","shopPrice":90},"item.ember-game-charm":{"id":"item.ember-game-charm","name":"Ember-Game Charm","kind":"charm","desc":"A worn wooden token from the caravan kids' game. Embers you scatter glow stubborn on the ground, waiting longer for you to gather them up.","icon":"charm-ember-game","equipSlot":"charm"},"item.ember-heart-charm":{"id":"item.ember-heart-charm","name":"Ember-Heart Charm","kind":"charm","desc":"A knot of red ember-glass on a pin. Foes you strike down spill a few more embers than they ought, the moor's small, warm mercy.","icon":"charm-ember-heart","equipSlot":"charm","shopPrice":55},"item.ember-pouch":{"id":"item.ember-pouch","name":"Deep Ember-Pouch","kind":"upgrade","desc":"A deep-stitched leather purse from the outfitter. It swallows a hundred more embers before it ever thinks of jingling full.","icon":"pouch","effects":[{"max-embers":100}],"shopPrice":60},"item.fathers-blade":{"id":"item.fathers-blade","name":"Father's Blade","kind":"gear","desc":"The brothers' father's blade, its hilt at last finished at Sera's roaring forge. It remembers a steadier hand and lends you some of it.","icon":"sword","equipSlot":"weapon"},"item.ferrymans-charm":{"id":"item.ferrymans-charm","name":"Ferryman's Charm","kind":"charm","desc":"A coin Gale gives every passenger 'for the crossing.' Waves, blasts, and hard shoves no longer knock you off your feet.","icon":"charm-ferryman","equipSlot":"charm","shopPrice":50},"item.fin-sling":{"id":"item.fin-sling","name":"Fin's Sling","kind":"gear","desc":"Fin's leather sling and a pocket of moor-stones. He can knock a fox-apple off a branch at thirty paces, and he will, just to prove it.","icon":"sling","equipSlot":"weapon"},"item.forge-seed":{"id":"item.forge-seed","name":"Forge-Seed","kind":"quest","desc":"A banked ember-seed from Reeve's stores. It won't catch from a cold striker - only from a fire set beside it and freely shared.","icon":"spark"},"item.forged-papers":{"id":"item.forged-papers","name":"Forged Fisher's Papers","kind":"key","desc":"Fisher's papers forged in Lune's careful hand. Good enough to walk frostbitten strangers straight past Marshal Brask's inspection.","icon":"papers"},"item.foxfire-cap":{"id":"item.foxfire-cap","name":"Foxfire Cap","kind":"consumable","desc":"One of Grub's glowcaps, eaten raw on a dare. For a spell the hearth-lantern flares wide and white, pushing the dark far back.","icon":"mushroom","effects":[{"set":{"buff_brightlight":true}}],"shopPrice":12},"item.frost-bell":{"id":"item.frost-bell","name":"Frost Bell","kind":"gear","desc":"A single silver bell from the Pale Observatory. One ring stills running water to ice and holds a charging foe mid-step, just long enough.","icon":"bell"},"item.glowmoth-jar":{"id":"item.glowmoth-jar","name":"Glow-Moth in a Jar","kind":"charm","desc":"A jar of drowsy glow-moths from the waystation. Even with the lantern down, dark rooms keep a soft green hush of light around you.","icon":"charm-glowmoth","equipSlot":"charm"},"item.hearth-lantern":{"id":"item.hearth-lantern","name":"Hearth-Lantern","kind":"gear","desc":"The little brass lantern from the shrine, warm as a held hand. Its flame is older and kinder than any fire in Solmere, and Fin never sets it down.","icon":"lantern"},"item.iron-shot":{"id":"item.iron-shot","name":"Cast-Iron Shot","kind":"upgrade","desc":"A pouch of Sera's cast-iron shot for Fin's sling. Heavier than moor-stones, they crack shells and stubborn skulls that pebbles only annoyed.","icon":"shot","effects":[{"sling-power":1}]},"item.keeper-signet":{"id":"item.keeper-signet","name":"Keeper's Signet","kind":"key","desc":"A Sun-Keeper's signet ring, its sun-sigil worn smooth. Pressed to a sealed Keeper door, it remembers the old order and lets you pass.","icon":"key-signet"},"item.kilnhook":{"id":"item.kilnhook","name":"Kilnhook","kind":"gear","desc":"A grapnel of fused Glasskiln glass on a whisker-thin line. Hook a ring or post and it reels you across a drop before the line even sings.","icon":"hook"},"item.kindled-charm":{"id":"item.kindled-charm","name":"Kindled Charm","kind":"charm","desc":"Two wicks braided to share one flame. Kneel by a fallen partner and you raise them in half the time, light shared, lightly given.","icon":"charm-kindled","equipSlot":"charm","shopPrice":65},"item.lantern-mantle":{"id":"item.lantern-mantle","name":"Lantern Mantle","kind":"upgrade","desc":"A brass mantle Sera hammers to fit the hearth-lantern. It throws the warm circle of light wider, so less of the dusk can hide from you.","icon":"lantern","effects":[{"light-radius":1}]},"item.lantern-oil":{"id":"item.lantern-oil","name":"Lamp-Oil","kind":"consumable","desc":"A clay jar of clear oil from Sera's stores. Enough to feed the hearth-lantern one more night.","icon":"oil"},"item.lantern-reservoir":{"id":"item.lantern-reservoir","name":"Lantern Reservoir","kind":"upgrade","desc":"A deeper oil well Sera fits beneath the wick. The hearth-lantern now burns twice as long between fills, sparing your oil.","icon":"lantern","effects":[{"lantern-capacity":2}]},"item.letter-satchel":{"id":"item.letter-satchel","name":"Poll's Letter-Satchel","kind":"quest","desc":"A canvas bag stuffed with the kids' post: dares, drawings, and one letter with no name on it that Poll never meant for you to find.","icon":"seed-spark"},"item.martas-stew":{"id":"item.martas-stew","name":"Marta's Hearth Stew","kind":"consumable","desc":"Marta's hearth stew, ladled with a scolding to eat it hot. Fills every heart and leaves a full-belly warmth that shrugs off a few blows.","icon":"food","effects":[{"heal":"full"},{"set":{"buff_hearty":true}}]},"item.moor-honey":{"id":"item.moor-honey","name":"Moor-Honey Comb","kind":"consumable","desc":"A comb of dark moor-honey, still warm from the hive. Two hearts' worth of sweetness, and a sting you can taste for an hour.","icon":"food","effects":[{"heal":2}],"shopPrice":8},"item.moor-walkers-charm":{"id":"item.moor-walkers-charm","name":"Moor-Walker's Charm","kind":"charm","desc":"A sole-stone from an old drover. Bog, ash, and snow stop clutching at your boots, and you cross rough ground a half-step quicker.","icon":"charm-moor-walker","equipSlot":"charm","shopPrice":45},"item.moth-cloak":{"id":"item.moth-cloak","name":"Moth Cloak","kind":"gear","desc":"A cloak of living glow-moth wings, the Mothqueen's gift. Spread your arms and the moor's updrafts carry you across gaps like drifting ash.","icon":"cloak","equipSlot":"cloak"},"item.ottolines-draught":{"id":"item.ottolines-draught","name":"Ottoline's Hush-Draught","kind":"consumable","desc":"Ottoline calls it a curse; it is a kindness. Drink it and, for a short while, hunting eyes slide right off you and lose your trail.","icon":"potion","effects":[{"set":{"buff_unseen":true}}],"shopPrice":30},"item.reeves-tonic":{"id":"item.reeves-tonic","name":"Reeve's Bitter Tonic","kind":"consumable","desc":"Auntie Reeve's bitter green tonic. Foul going down, but it knits four hearts closed and clears the ash-cough from your chest.","icon":"potion","effects":[{"heal":4}],"shopPrice":25},"item.seed-spark":{"id":"item.seed-spark","name":"Seed-Spark","kind":"quest","desc":"A seed of something old, carried in the cold heart of the lantern. It sleeps. It is not yours to wake tonight.","icon":"seed-spark"},"item.shard-cinder-steppe":{"id":"item.shard-cinder-steppe","name":"Sunshard of the Cinder Steppe","kind":"quest","desc":"The Cinder Steppe's Sunshard, which fell so hot it fused a canyon into glass. It still throws off a dry, tooth-grinding glass-storm heat.","icon":"sunshard"},"item.shard-duskmoor":{"id":"item.shard-duskmoor","name":"Sunshard of Duskmoor","kind":"quest","desc":"Duskmoor's Sunshard, that steeped the whole moor in its deepest amber gloom. Heavy as a sleeping coal, and every bit as patient.","icon":"sunshard"},"item.shard-frostreach":{"id":"item.shard-frostreach","name":"Sunshard of Frostreach","kind":"quest","desc":"Frostreach's Sunshard, its light almost spent, a dim and dying ember of a thing, and a cold preview of what the Smolder leaves behind.","icon":"sunshard"},"item.shard-gloamwood":{"id":"item.shard-gloamwood","name":"Sunshard of Gloamwood","kind":"quest","desc":"Gloamwood's Sunshard, guarded thirty-four years in the Mothqueen's grove, and slowly poisoning her all that while. It hums with foxfire green.","icon":"sunshard"},"item.shard-sliver":{"id":"item.shard-sliver","name":"Shard-Sliver","kind":"quest","desc":"A splinter chipped from Duskmoor's Sunshard, still burning cold in the Fallen Beacon. Enough light to feed the lantern, and one day to edge a blade.","icon":"shard-sliver"},"item.shard-sunken-cauldron":{"id":"item.shard-sunken-cauldron","name":"Sunshard of the Sunken Cauldron","kind":"quest","desc":"The fifth Sunshard, that punched into the sea off the Sunken Cauldron and boils it from below. It sweats and steams in your hands.","icon":"sunshard"},"item.shepherds-charm":{"id":"item.shepherds-charm","name":"Shepherd's Charm","kind":"charm","desc":"A shepherd's whistle carved from a lamb's horn. Beasts near you pause, ears twitching, before their first strike, as if they half-know your name.","icon":"charm-shepherd","equipSlot":"charm"},"item.shepherds-crook":{"id":"item.shepherds-crook","name":"Old Shepherd's Crook","kind":"quest","desc":"A worn hook-staff from Brand's fold, its handle rubbed pale by hands long gone. It is not yours to keep. It is yours to give back.","icon":"seed-spark"},"item.spark-caravan":{"id":"item.spark-caravan","name":"Caravan Spark","kind":"quest","desc":"A coal from the Caravanserai's ever-moving hearth, carried out by Ash and Cinder. Warmth passed hand to hand, just as their game taught.","icon":"spark"},"item.spark-foxfire":{"id":"item.spark-foxfire","name":"Foxfire Spark","kind":"quest","desc":"A curl of the Mothqueen's own foxfire, cupped in the lantern. Cool, green, and patient, the whole forest's light given gladly.","icon":"spark"},"item.spark-inn":{"id":"item.spark-inn","name":"Inn-Hearth Spark","kind":"quest","desc":"A tongue of flame from Lowry's gutter-lit inn, the first hearth you ever knew. Small, and enough, home's own light sent along with you.","icon":"spark"},"item.spark-watchfire":{"id":"item.spark-watchfire","name":"Watch-Fire Spark","kind":"quest","desc":"An ember from the Solmere resistance's hidden watch-fire, slipped to you in the dark, the occupied city's stubborn, banked defiance.","icon":"spark"},"item.spark-waystation":{"id":"item.spark-waystation","name":"Waystation Spark","kind":"quest","desc":"A mote of moth-light from Isolde and Fennick's waystation lamp, offered for the road. It flickers like two people finishing one thought.","icon":"spark"},"item.spark-whale-oil":{"id":"item.spark-whale-oil","name":"Whale-Oil Spark","kind":"quest","desc":"A drop of Brinehollow's whale-oil flame, brought to the lantern by Vesh herself, the deserter's first freely given light.","icon":"spark"},"item.storysingers-charm":{"id":"item.storysingers-charm","name":"Storysinger's Charm","kind":"charm","desc":"A brass reed from Ime's pipe. Her tune lingers in your pocket, so every charm's gift and every hot meal's warmth last a breath longer.","icon":"charm-storysinger","equipSlot":"charm","shopPrice":80},"item.tide-boots":{"id":"item.tide-boots","name":"Tide Boots","kind":"gear","desc":"Lead-soled boots the divers wear. In them you sink past the current and walk the riverbed and sea floor as easily as a dusk road.","icon":"boots","equipSlot":"boots"},"item.tide-chowder":{"id":"item.tide-chowder","name":"Scald's Tide Chowder","kind":"consumable","desc":"Scald's tide chowder, thick with things the sea gave up. For a while the steam-vents' heat and the deep's cold both sit lighter on you.","icon":"food","effects":[{"set":{"buff_seaproof":true}}]},"item.tinders-charm":{"id":"item.tinders-charm","name":"Tinder's Charm","kind":"charm","desc":"
