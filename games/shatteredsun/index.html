    players.kes.active = true;
    projectiles = new SS.Pool(32, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0 }));
    // two baked lantern-glow frames for Fin (drawImage only in the hot path)
    glowFrames = [glow(9), glow(11)];
    downIcon = bakeDownIcon();
    return { atlas: H.atlas };
  }
  function glow(rad) { const s = 40; const c = K.makeCanvas(s, s); K.pxGlowSq(c.getContext('2d'), s / 2, s / 2, rad, K.LANTERN, 5); return c; }

  // A guttering-lantern glyph that floats over a downed hero — reads as "their
  // light has gone out". Baked once (stepped square glow, never shadowBlur).
  function bakeDownIcon() {
    const c = K.makeCanvas(14, 16); const ctx = c.getContext('2d');
    K.pxGlowSq(ctx, 7, 9, 4, '#5a3a24', 3);              // faint cold halo
    K.pxRect(ctx, 5, 2, 4, 2, '#6a6272');                // cold metal handle
    K.pxRect(ctx, 6, 3, 2, 2, '#6a6272');                // hook
    K.pxRect(ctx, 4, 5, 6, 8, '#2a2030');                // dim casing
    K.outlineRect(ctx, 4, 5, 6, 8, '#4a3c48');
    K.pxRect(ctx, 6, 9, 2, 3, K.EMBER);                  // low, guttering ember
    K.pxRect(ctx, 6, 8, 2, 1, K.LANTERN);
    return c;
  }

  function resetTo(region) {
    players.kes.x = region.spawn.x; players.kes.y = region.spawn.y;
    players.kes.action = 'idle'; players.kes.facing = 'down';
    const s2 = region.spawn2 || region.spawn;
    players.fin.x = s2.x + 14; players.fin.y = s2.y;
    clearCoop(players.kes); clearCoop(players.fin);
  }
  // reset the transient co-op flags on a hero (used by spawn/join/restore)
  function clearCoop(pl) { pl.downed = false; pl.reviveT = 0; pl.channeling = false; pl.leaving = false; }

  function joinFin() {
    if (players.fin.active) return false;
    players.fin.active = true; players.fin.hp = players.fin.maxhp = 6;
    players.fin.x = players.kes.x - 16; players.fin.y = players.kes.y;
    players.fin.action = 'idle'; players.fin.moving = false;
    clearCoop(players.fin);
    SS.Audio && SS.Audio.sfx('join');
    return true;
  }

  function activeList() { const a = []; if (players.kes.active) a.push(players.kes); if (players.fin.active) a.push(players.fin); return a; }

  // opts.suppress[which] = true when the play state consumed South as an interact
  function update(world, opts) {
    opts = opts || {};
    const I = SS.Input;
    // the party's collision view (cloak-aware: gaps are passable once the
    // Moth-Cloak is earned). Resolved once per step; enemies keep the plain grid.
    const moveWorld = cloakView(world);
    // P2 drop-in
    if (!players.fin.active && I.pressed(1, 'join')) joinFin();
    // P2 drop-out + revive channels + fail-state, resolved BEFORE movement so a
    // channeling reviver / a leaving partner / a downed hero is frozen this step.
    updateCoop();

    for (const pl of activeList()) {
      const p = pl.pad;
      if (pl.iframes > 0) pl.iframes--;

      // a downed hero collapses in place: no movement, no actions, immune to
      // further harm (enemies.js already skips pl.downed). Revive/fail handled above.
      if (pl.downed) { pl.action = 'downed'; pl.moving = false; pl.animT++; continue; }
      // reviving a partner or charging a drop-out roots the hero (and swallows
      // the held South so it can't double as a sword swing).
      if (pl.channeling || pl.leaving) { pl.action = 'idle'; pl.moving = false; pl.animT++; continue; }

      if (pl.action === 'attack') {
        pl.attackTimer--;
        updateHitbox(pl);
        if (pl.attackTimer <= 0) { pl.action = 'idle'; pl.hb.active = false; pl.hitApplied = false; }
      } else if (pl.action === 'roll') {
        pl.rollTimer--;
        moveEntity(moveWorld, pl, pl.rvx, pl.rvy);
        if (pl.rollTimer <= 0) pl.action = 'idle';
      } else {
        // ---- polling movement ----
        const ax = I.axis(p);
        let dx = ax.x, dy = ax.y;
        const mag = Math.hypot(dx, dy);
        if (mag > 1) { dx /= mag; dy /= mag; }
        pl.moving = mag > 0.1;
        if (pl.moving) { pl.facing = M.dir4(dx, dy) || pl.facing; pl.action = 'walk'; }
        else pl.action = 'idle';
        moveEntity(moveWorld, pl, dx * WALK, dy * WALK);

        // ---- actions (press-events) ----
        const suppress = opts.suppress && opts.suppress[pl.which];
        if (!suppress && I.pressed(p, 'attack')) {
          if (pl.which === 'kes') { pl.action = 'attack'; pl.attackTimer = 18; pl.hitApplied = false; SS.Audio && SS.Audio.sfx('sword'); }
          else finFire(pl);
        } else if (I.pressed(p, 'roll')) {
          const rv = M.DIR_VEC[pl.facing];
          pl.action = 'roll'; pl.rollTimer = 14; pl.iframes = 14; pl.rvx = rv[0] * ROLL; pl.rvy = rv[1] * ROLL;
          SS.Audio && SS.Audio.sfx('roll');
        }
      }
      // Dawnward Charm (E14): stand still, breathe, and the lantern coaxes one
      // cracked heart slowly whole. Only while idle, unhurt, and below full —
      // any motion or a fresh wound resets the count (a boolean read, no alloc).
      if (SS.State && SS.State.hasCharm('item.dawnward-charm') &&
          pl.action === 'idle' && !pl.moving && pl.iframes === 0 && pl.hp > 0 && pl.hp < pl.maxhp) {
        if (++pl.regenT >= DAWNWARD_REGEN) { pl.regenT = 0; pl.hp++; SS.Audio && SS.Audio.sfx('select'); }
      } else pl.regenT = 0;
      pl.animT++;
    }

    // projectiles
    projectiles.forEach(pr => {
      pr.x += pr.vx; pr.y += pr.vy; pr.life--;
      const tx = (pr.x / world.tileSize) | 0, ty = (pr.y / world.tileSize) | 0;
      if (pr.life <= 0 || world.solidAt(tx, ty)) projectiles.release(pr);
    });
  }

  // ---- co-op: down / revive / drop-out / fail-state ----------------------
  function updateCoop() {
    handleDropOut();
    // each downed hero has exactly one possible reviver (the other player)
    channelRevive(players.kes, players.fin);
    channelRevive(players.fin, players.kes);
    checkFailState();
  }

  // C05 calls this when a hero's hp reaches 0: they go DOWN, not dead and not
  // instantly respawned. They stay put, harmless-but-safe, until a partner
  // revives them or the fail-state restores the party.
  function down(pl) {
    if (!pl || pl.downed) return;
    pl.downed = true; pl.hp = 0;
    pl.action = 'downed'; pl.moving = false;
    pl.reviveT = 0; pl.channeling = false;
    pl.attackTimer = 0; pl.rollTimer = 0; pl.iframes = 0;
    if (pl.hb) pl.hb.active = false;
  }

  // an active, standing reviver adjacent to a downed target and HOLDING South
  // fills the target's revive meter; letting go (or stepping away) bleeds it off.
  function channelRevive(reviver, target) {
    reviver.channeling = false;
    if (!reviver.active || reviver.downed || !target.active || !target.downed) return;
    const dx = target.x - reviver.x, dy = target.y - reviver.y;
    const rr = REVIVE_RANGE + reviver.r + target.r;
    if (dx * dx + dy * dy <= rr * rr && SS.Input.down(reviver.pad, 'confirm')) {
      reviver.channeling = true;
      if (target.reviveT === 0) SS.Audio && SS.Audio.sfx('select');   // a soft blip as the channel begins
      if (++target.reviveT >= reviveTicks()) reviveDone(target);
    } else if (target.reviveT > 0) {
      target.reviveT = Math.max(0, target.reviveT - REVIVE_DECAY);
    }
  }

  function reviveDone(pl) {
    pl.downed = false; pl.reviveT = 0; pl.channeling = false;
    pl.hp = REVIVE_HP; pl.action = 'idle'; pl.moving = false;
    pl.iframes = REVIVE_IFRAMES;
    SS.Audio && SS.Audio.sfx('chime');
  }

  // fail-state: when every ACTIVE hero is down (both in 2P, or the lone hero in
  // 1P), hold a brief beat then restore the last E08 checkpoint and stand the
  // party back up at a safe spot — the "combat can't soft-lock" guarantee.
  function checkFailState() {
    const list = activeList();
    if (!list.length) { failT = 0; return; }
    for (let i = 0; i < list.length; i++) if (!list[i].downed) { failT = 0; return; }
    if (++failT >= DOWN_FAIL_TICKS) { failT = 0; restoreCheckpoint(); }
  }

  function restoreCheckpoint() {
    const rg = SS.Game.region;
    const finWasActive = players.fin.active;
    const slot = (SS.State && SS.State.slot) || 1;
    const payload = SS.Save && SS.Save.read(slot);
    if (payload) SS.Save.apply(payload);   // the real E08 load path (last checkpoint)
    else resetTo(rg);                      // no checkpoint yet -> region spawn, full light
    players.kes.active = true;
    if (finWasActive) players.fin.active = true;   // a mid-run co-op partner isn't dropped by the restore
    standUp(players.kes);
    if (players.fin.active) { standUp(players.fin); players.fin.x = players.kes.x - 16; players.fin.y = players.kes.y; }
    SS.Audio && SS.Audio.sfx('chime');
  }

  function standUp(pl) {
    clearCoop(pl);
    pl.action = 'idle'; pl.moving = false; pl.attackTimer = 0; pl.rollTimer = 0;
    if (pl.hb) pl.hb.active = false;
    pl.hp = pl.maxhp; pl.iframes = 90;     // full light + mercy invuln (non-punishing)
  }

  // Graceful P2 drop-out: an intentional two-button hold on pad(1) — North
  // (item) + East (cancel) — for ~0.75s returns the party to solo. This combo
  // is never shell-reserved (not SELECT+START, not PS/home) and is not a gesture
  // any fight asks for, so it can't fire by accident. Fin's position/facing are
  // left intact for a clean later re-join; the loop freezes him while charging.
  function handleDropOut() {
    const fin = players.fin;
    if (!fin.active || fin.downed) { dropoutT = 0; fin.leaving = false; return; }
    const I = SS.Input;
    if (I.down(1, 'item') && I.down(1, 'cancel')) {
      fin.leaving = true;
      if (++dropoutT >= DROPOUT_TICKS) dropFin();
    } else { dropoutT = 0; fin.leaving = false; }
  }

  function dropFin() {
    const fin = players.fin;
    fin.active = false; dropoutT = 0;
    fin.action = 'idle'; fin.moving = false;
    clearCoop(fin);
    if (fin.hb) fin.hb.active = false;
    SS.Audio && SS.Audio.sfx('menuClose');
  }

  // Warp-to-partner: the shared camera clamps to the party midpoint (states.js).
  // If the heroes separate farther than the shared viewport can hold — or a
  // camera lock pins the view to a sub-rect one hero is outside of — the trailing
  // hero is popped to a valid tile beside the lead so both stay on the one screen.
  // Called by the play state each frame AFTER the camera is positioned.
  function keepTogether(region, cam) {
    const list = activeList();
    if (list.length < 2) return;
    let lead = null;
    for (let i = 0; i < list.length; i++) if (!list[i].downed) { lead = list[i]; break; }
    if (!lead) return;   // everyone down -> fail-state owns this
    const maxX = cam.w - 2 * WARP_MARGIN, maxY = cam.h - 2 * WARP_MARGIN;
    for (let i = 0; i < list.length; i++) {
      const pl = list[i]; if (pl === lead) continue;
      const separated = Math.abs(pl.x - lead.x) > maxX || Math.abs(pl.y - lead.y) > maxY;
      const outsideLock = cam.lock && (pl.x < cam.lock.x || pl.x > cam.lock.x + cam.lock.w || pl.y < cam.lock.y || pl.y > cam.lock.y + cam.lock.h);
      if (separated || outsideLock) warpTo(region, pl, lead);
    }
  }

  function warpTo(region, pl, lead) {
    const TS = region.tileSize;
    // prefer beside the lead; fall back through diagonals to a non-solid tile so
    // a hero is never warped into a wall.
    const cands = [[-18, 0], [18, 0], [0, -18], [0, 18], [-18, -18], [18, 18], [-18, 18], [18, -18], [0, 0]];
    for (let i = 0; i < cands.length; i++) {
      const nx = lead.x + cands[i][0], ny = lead.y + cands[i][1];
      if (!region.solidAt((nx / TS) | 0, (ny / TS) | 0)) { pl.x = nx; pl.y = ny; break; }
    }
    pl.moving = false;
    if (!pl.downed) pl.action = 'idle';
    if (pl.iframes < 12) pl.iframes = 12;   // the i-frame blink reads as a quick pop, not a jarring cut
    SS.Audio && SS.Audio.sfx('join');
  }

  // read-only co-op introspection for the harness (never writes state)
  function isDowned(which) { const pl = players[which]; return !!(pl && pl.downed); }
  function reviveProgress(which) { const pl = players[which]; return pl ? Math.min(1, pl.reviveT / REVIVE_TICKS) : 0; }

  function finFire(pl) {
    const pr = projectiles.obtain(); if (!pr) return;
    const v = M.DIR_VEC[pl.facing];
    pr.x = pl.x + v[0] * 8; pr.y = pl.y + v[1] * 8; pr.vx = v[0] * 4; pr.vy = v[1] * 4; pr.life = 40;
    SS.Audio && SS.Audio.sfx('sling');
  }

  function updateHitbox(pl) {
    // mid-swing frames carry the hitbox in front of the hero
    const f = attackFrame(pl);
    if (f === 1) {
      const v = M.DIR_VEC[pl.facing];
      pl.hb.active = true; pl.hb.x = pl.x + v[0] * 12; pl.hb.y = pl.y + v[1] * 12; pl.hb.r = 9;
    } else pl.hb.active = false;
  }

  function moveEntity(world, pl, dx, dy) { SS.Entities.moveVsTiles(world, pl, dx, dy); }

  function attackFrame(pl) { return Math.min(2, Math.floor((18 - pl.attackTimer) / 6)); }
  function frameIndex(pl) {
    if (pl.action === 'attack') return attackFrame(pl);
    if (pl.action === 'roll') return Math.min(1, Math.floor((14 - pl.rollTimer) / 7));
    if (pl.action === 'walk') return Math.floor(pl.animT / 8) % 4;
    return 0; // idle -> walk frame 0
  }
  function frameName(pl) {
    const action = pl.action === 'idle' ? 'walk' : pl.action;
    const dirKey = (pl.facing === 'left' || pl.facing === 'right') ? 'side' : pl.facing;
    return `${pl.which}.${action}.${dirKey}.${frameIndex(pl)}`;
  }

  // draw one player (called in y-sorted order by play state)
  function drawOne(ctx, pl, atlas) {
    if (pl.downed) { drawDowned(ctx, pl, atlas); return; }
    // hard dithered contact shadow (never a smooth ellipse)
    K.dither2(ctx, (pl.x - 7) | 0, (pl.y + 9) | 0, 14, 5, K.DEEP_DUSK, 0.6);
    // Fin lantern glow under/beside him (baked frame, drawImage only)
    if (pl.which === 'fin') {
      const g = glowFrames[Math.floor(pl.animT / 18) % 2];
      ctx.drawImage(g, (pl.x + 6 - g.width / 2) | 0, (pl.y - 2 - g.height / 2) | 0);
    }
    const flip = pl.facing === 'left';
    const name = frameName(pl) + '.rim'; // rim-light variant (world lit by lantern)
    const dx = (pl.x - SS.Heroes.W / 2) | 0, dy = (pl.y - SS.Heroes.H + 8) | 0;
    if (pl.iframes > 0 && (pl.animT & 2)) return; // i-frame blink
    if (flip) atlas.drawFlipped(ctx, name, dx, dy); else atlas.draw(ctx, name, dx, dy);
  }

  // a downed hero: slumped + dimmed sprite, a guttering-lantern indicator, and
  // (once a partner starts channeling) a segmented revive bar. All drawImage /
  // fillRect — no shadowBlur, no per-frame path ops.
  function drawDowned(ctx, pl, atlas) {
    K.dither2(ctx, (pl.x - 9) | 0, (pl.y + 8) | 0, 18, 5, K.DEEP_DUSK, 0.65);   // wider collapsed shadow
    const name = pl.which + '.walk.down.0.rim';
    const dx = (pl.x - SS.Heroes.W / 2) | 0, dy = (pl.y - SS.Heroes.H + 8 + 7) | 0;   // slumped lower
    ctx.globalAlpha = 0.5;
    atlas.draw(ctx, name, dx, dy);
    ctx.globalAlpha = 1;
    const lowfx = SS.lowfx();
    const bob = lowfx ? 0 : Math.round(Math.sin(pl.animT / 14) * 2);
    ctx.drawImage(downIcon, (pl.x - downIcon.width / 2) | 0, (pl.y - SS.Heroes.H + 2 + bob) | 0);
    if (pl.reviveT > 0) {
      const segs = 8, sw = 3, gap = 1, total = segs * (sw + gap) - gap;
      const bx = (pl.x - total / 2) | 0, by = (pl.y - SS.Heroes.H - 4) | 0;
      const filled = Math.round((pl.reviveT / reviveTicks()) * segs);
      K.pxRect(ctx, bx - 1, by - 1, total + 2, sw + 2, K.DEEP_DUSK);
      for (let i = 0; i < segs; i++) K.pxRect(ctx, bx + i * (sw + gap), by, sw, sw, i < filled ? K.LANTERN : '#3a3248');
    }
  }

  function drawProjectiles(ctx) {
    const r = K.ramp('#c9d0da');
    projectiles.forEach(pr => { K.pxRect(ctx, (pr.x - 1) | 0, (pr.y - 1) | 0, 3, 3, r.hi); K.pxRect(ctx, pr.x | 0, pr.y | 0, 1, 1, r.spec); });
  }

  SS.Players = {
    init, resetTo, update, joinFin, drawOne, drawProjectiles,
    down, keepTogether, isDowned, reviveProgress,
    get: () => players, activeList, projectiles: () => projectiles,
  };
})();


// ===== src/game/enemies.js =====
// C05 — Enemy runtime + AI. A pooled enemy system: enemies are plain objects
// living in a fixed backing pool (E05 SS.Pool), spawned from region data, ticked
// each fixed 60Hz step, and y-sorted into the play draw with the same rim/flash
// conventions as the hero. ZERO hot-loop allocations: every field an enemy needs
// (velocity, knockback, aim, timers, cached distance-to-target) is created once
// at spawn and mutated in place; the update/draw loops iterate pool.items with
// plain for-loops (never Pool.forEach, which would allocate a closure each tick).
//
// Nine genuinely distinct behaviors — not one chase with different speeds:
//   chase     pursue + slide vs walls, telegraphed smash / pounce in reach
//   drift     terrain-phasing float + gentle lure wander (ghosts), optional bite
//   swarm     fast erratic flock: approach + jitter + separation from swarmers
//   ambush    dormant until aggroRange, telegraphed lunge, crawls home on a miss
//   skirmish  kite to standoff, telegraph, fire an enemy projectile, retreat
//   charge    telegraphed straight dash, recovers on a wall or max distance
//   weave     serpentine sine advance, area-leashed, short lunge in reach
//   swoop     aerial orbit at a radius, telegraphed dive, climb back out
//   guard     hold position, frontal reach thrust, blocks frontal hits
// The telegraph frame (`.tele`) + a readable wind-up window (telegraphMs) make
// every attack fair and kid-legible.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;

  // ---- tuning constants (px/tick + tick counts at 60Hz) -----------------
  const SWORD_DMG = 2;              // Kes melee swing
  const SLING_DMG = 1;              // Fin projectile
  const ENEMY_IFRAMES = 10;         // brief invulnerability after a hit (>swing hb window => one hit per swing)
  const HURT_TICKS = 8;             // stagger duration
  const KNOCK = 2.4;                // knockback impulse
  const ATTACK_TICKS = 10;          // default active-strike window
  const PLAYER_HURT_IFRAMES = 48;   // player invuln after taking a hit (matches blink)
  const POOF_LIFE = 22;
  const POOF_LIFE_LOWFX = 10;       // E16: a shorter, cheaper death-poof under lowfx (a kill still reads, less overlap)
  const HEART_LIFE = 600;           // heart pickup lingers ~10s at 60Hz, then guts out
  const HEART_HEAL = 1;             // a heart pickup mends one heart (kid-forgiving healing economy)
  const HEART_R = 9;                // pickup radius (generous — a kid brushes it and it takes)
  const MAX_ENEMIES = 24, MAX_ESHOTS = 24, MAX_POOFS = 12, MAX_PICKUPS = 8;
  const T = ms => Math.max(1, Math.round((ms || 0) * 0.06));   // ms -> ticks

  const circleHit = SS.Entities.circleHit;
  const moveVsTiles = SS.Entities.moveVsTiles;

  let pool = null, shots = null, poofs = null, pickups = null;
  let META = null, enemyAtlas = null, poofFrames = null, heartFrame = null;
  let bossAtlas = null, bossMETA = null;   // lazy — nothing bakes until a boss actually spawns
  let bossState = 'none';                   // 'none' | 'alive' | 'dead' (persists past the pool release for the director)
  let spawned = 0;
  let teleSeen = Object.create(null);   // sticky record of which refs have entered a telegraph (read-only introspection)

  function ensureBossArt() {
    if (bossAtlas) return;
    const b = SS.Bosses.build();
    bossAtlas = b.atlas; bossMETA = b.families;
  }

  // ---- factory: one enemy slot with ALL fields pre-created --------------
  function makeEnemy() {
    return {
      alive: false, isEnemy: true,
      ref: '', def: null, p: null, fam: '', meta: null, behavior: 'chase',
      x: 0, y: 0, r: 6, hx: 0, hy: 0,
      vx: 0, vy: 0, kx: 0, ky: 0,
      hp: 1, maxhp: 1, faceX: -1, aimX: -1, aimY: 0,
      state: 'idle', stateT: 0, animT: 0, iframes: 0, flash: 0, moving: false,
      phase: false, seed: 0, wakeT: 0, cool: 0, orbitA: 0, blockFront: false,
      teleT: 18,
      // data-driven entity conditions (region entity props): a passive enemy
      // never aggros/attacks — it only slow-wanders (the missing-lamb shepherd
      // must not be murdered mid-quest). passiveCond is re-evaluated live so a
      // quest advance calms it the same frame; null cond => never passive.
      passive: false, passiveCond: null,
      // boss extension (B01) — created once, mutated in place (zero hot-loop alloc)
      isBoss: false, bossMeta: null, vulnerable: false, homeX: 0, homeY: 0,
      // per-tick cached target (mutated in place, never allocated)
      _dist: 0, _tx: 0, _ty: 0, _has: false, hitX: false, hitY: false,
    };
  }

  function init() {
    const built = SS.Enemies.build();
    META = built.families;
    enemyAtlas = built.atlas;
    pool = new SS.Pool(MAX_ENEMIES, makeEnemy);
    shots = new SS.Pool(MAX_ESHOTS, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, dmg: 0 }));
    poofs = new SS.Pool(MAX_POOFS, () => ({ x: 0, y: 0, life: 0, life0: POOF_LIFE }));
    pickups = new SS.Pool(MAX_PICKUPS, () => ({ x: 0, y: 0, life: 0, seed: 0 }));
    poofFrames = bakePoof();
    heartFrame = bakeHeartPickup();
    return { atlas: enemyAtlas };
  }

  // A dropped heart pickup: a chunky pixel heart with a baked warm glow (the
  // glow is pxGlowSq-baked into the sprite ONCE — never a per-frame shadowBlur,
  // so it's lowfx-safe: the draw hot path is a single drawImage).
  function bakeHeartPickup() {
    const S = 20, c = K.makeCanvas(S, S), ctx = c.getContext('2d'), cx = S / 2, cy = S / 2 + 1;
    K.pxGlowSq(ctx, cx | 0, cy | 0, 7, K.EMBER, 4);
    // 7x6 chunky heart (two lobes + a taper), first-flame core over ember body
    const rows = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
    const ox = (cx - 3.5) | 0, oy = (cy - 3) | 0;
    for (let r = 0; r < rows.length; r++) for (let col = 0; col < 7; col++) {
      if (rows[r][col] !== 'X') continue;
      K.pxRect(ctx, ox + col, oy + r, 1, 1, r <= 1 ? K.FIRST_FLAME : K.EMBER);
    }
    K.pxRect(ctx, ox + 2, oy + 1, 1, 1, K.LANTERN);   // a bright glint on the left lobe
    return c;
  }

  // baked ash-and-ember death burst (stepped square glow — no shadowBlur)
  function bakePoof() {
    const frames = [], S = 30, n = 4;
    for (let k = 0; k < n; k++) {
      const c = K.makeCanvas(S, S);
      const ctx = c.getContext('2d');
      const rad = 3 + k * 5;
      K.pxGlowSq(ctx, S / 2, S / 2, rad, k < 2 ? K.EMBER : '#6a6272', 4);
      if (k < 3) K.pxGlowSq(ctx, S / 2, S / 2, Math.max(2, rad - 4), K.LANTERN, 3);
      frames.push(c);
    }
    return frames;
  }

  // ---- spawn / load / reset ---------------------------------------------
  function reset() { if (pool) pool.clear(); if (shots) shots.clear(); if (poofs) poofs.clear(); if (pickups) pickups.clear(); spawned = 0; bossState = 'none'; teleSeen = Object.create(null); }

  function spawn(spec) {
    const def = spec.def; if (!def) return null;
    let meta;
    if (spec.boss) {
      // Cleared bosses never refight. Each boss names its own cleared-flag
      // (Mothqueen -> d02_cleared); the Beacon Wraith has none, so it falls back
      // to d01_cleared and its D01 behavior is unchanged.
      const clearedFlag = (def && def.clearedFlag) || 'd01_cleared';
      if (SS.State && SS.State.getFlag(clearedFlag)) return null;
      ensureBossArt(); meta = bossMETA[def.spriteFamily];
    }
    else meta = META[def.spriteFamily];
    if (!meta) return null;
    const e = pool.obtain(); if (!e) return null;
    const p = def.params || {};
    e.ref = spec.ref; e.def = def; e.p = p; e.fam = def.spriteFamily; e.meta = meta;
    e.isBoss = !!spec.boss; e.bossMeta = e.isBoss ? meta : null; e.vulnerable = false;
    e.behavior = def.behavior || 'chase';
    e.x = e.hx = e.homeX = spec.x; e.y = e.hy = e.homeY = spec.y;
    e.r = e.isBoss ? clamp(Math.round(meta.w * 0.24), 10, 16) : clamp(Math.round(meta.w * 0.28), 5, 11);
    e.hp = e.maxhp = def.hp;
    e.vx = e.vy = e.kx = e.ky = 0;
    e.faceX = -1; e.aimX = -1; e.aimY = 0;
    e.state = 'idle'; e.stateT = 0; e.animT = (Math.random() * 60) | 0;
    e.iframes = 0; e.flash = 0; e.moving = false;
    e.phase = e.isBoss ? false : (!!p.phaseTerrain || e.behavior === 'swoop');
    e.blockFront = !!(p.blockFront || p.armorFront);
    e.seed = Math.random() * 6.283;
    e.wakeT = T(p.wakeMs || p.buriedUntilMs || 0);
    e.cool = 0; e.orbitA = Math.random() * 6.283;
    e.teleT = T(p.telegraphMs || 300);
    // data-driven passive condition from the region entity's props (absentWhen
    // is handled at region-load so an absent enemy never becomes a spec). null
    // when unset — only enemies that carry the prop pay the per-tick eval.
    const props = spec.props || {};
    e.passiveCond = props.passiveWhen || null;
    e.passive = e.passiveCond ? (SS.Cond ? SS.Cond.eval(e.passiveCond) : false) : false;
    if (e.isBoss) bossState = 'alive';
    spawned++;
    return e;
  }

  // read region.enemySpecs (resolved by region.js) and populate the encounter
  function load(region) {
    reset();
    const specs = (region && region.enemySpecs) || [];
    for (let i = 0; i < specs.length; i++) {
      const s = specs[i];
      // data-driven entity condition `absentWhen` (shared SS.Cond mini-language,
      // rides in the region entity's props): when it holds, the enemy is simply
      // not spawned — e.g. the missing-lamb shepherd once he is laid to rest.
      // Evaluated at load; regions reload on entry, so an absent enemy reappears
      // or stays gone the next time the region is entered. (passiveWhen is the
      // live-evaluated sibling, wired in spawn() + the update loop.)
      const aw = s.props && s.props.absentWhen;
      if (aw && SS.Cond && SS.Cond.eval(aw)) continue;
      spawn(s);
    }
  }

  // ---- small helpers (allocation-free) ----------------------------------
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  function clampWorld(e, region) {
    const r = e.r;
    if (e.x < r) e.x = r; else if (e.x > region.worldW - r) e.x = region.worldW - r;
    if (e.y < r) e.y = r; else if (e.y > region.worldH - r) e.y = region.worldH - r;
  }
  function faceTarget(e) { if (e._tx < e.x - 1) e.faceX = -1; else if (e._tx > e.x + 1) e.faceX = 1; }
  function lockAim(e) {
    const dx = e._tx - e.x, dy = e._ty - e.y, L = Math.hypot(dx, dy) || 1;
    e.aimX = dx / L; e.aimY = dy / L; e.faceX = e.aimX < 0 ? -1 : 1;
  }
  function approach(e, tx, ty, sp) { const dx = tx - e.x, dy = ty - e.y, L = Math.hypot(dx, dy) || 1; e.vx = dx / L * sp; e.vy = dy / L * sp; }
  function retreat(e, sp) { const dx = e.x - e._tx, dy = e.y - e._ty, L = Math.hypot(dx, dy) || 1; e.vx = dx / L * sp; e.vy = dy / L * sp; }
  function steerTo(e, tx, ty, sp) { const dx = tx - e.x, dy = ty - e.y, L = Math.hypot(dx, dy) || 1; e.vx = dx / L * sp; e.vy = dy / L * sp; }
  function enterTele(e) { e.state = 'tele'; e.stateT = e.teleT; e.vx = e.vy = 0; faceTarget(e); }
  function stepTele(e, atkTicks) { e.vx = e.vy = 0; if (--e.stateT <= 0) { lockAim(e); e.state = 'attack'; e.stateT = atkTicks; } }
  function enterRecover(e, ms) { e.state = 'recover'; e.stateT = T(ms); e.vx = e.vy = 0; }
  function tickRecover(e) { e.vx = e.vy = 0; if (--e.stateT <= 0) e.state = e._has ? 'aggro' : 'idle'; }

  // apply a reach strike to any active, non-invulnerable player in range
  function reachHit(e, P, reach, dmg) {
    hurtCheck(e, P.kes, reach, dmg);
    hurtCheck(e, P.fin, reach, dmg);
  }
  function hurtCheck(e, pl, reach, dmg) {
    if (!pl.active || pl.downed || pl.iframes > 0) return;
    const dx = pl.x - e.x, dy = pl.y - e.y, rr = reach + e.r + pl.r;
    if (dx * dx + dy * dy < rr * rr) hurtPlayer(pl, dmg);
  }

  // B01 — is the Wraith standing in light? Its lantern-weakness IS the fight:
  // Fin's carried hearth-lantern (co-op) OR any lit beacon-brazier (solo Kes can
  // light them) within lightRadius exposes the grief-ghost so a blade can bite.
  function bossLit(e, region, P) {
    const R = e.p.lightRadius || 96, R2 = R * R;
    if (P.fin.active && !P.fin.downed) { const dx = P.fin.x - e.x, dy = P.fin.y - e.y; if (dx * dx + dy * dy < R2) return true; }
    const objs = region.objects;
    if (objs) {
      // A single lit brazier exposes the Wraith within its glow; but once EVERY
      // arena brazier burns, the fallen beacon is relit and the whole Spire
      // floods with light — the grief-ghost has no dark left to hide in and
      // stays exposed, so the fight resolves as a fair trade of blows.
      let arenaTotal = 0, arenaOn = 0;
      for (let i = 0; i < objs.length; i++) {
        const o = objs[i];
        if (o.kind !== 'brazier') continue;
        if (o.group === 'arena') { arenaTotal++; if (o.on) arenaOn++; }
        if (o.on) { const dx = o.cx - e.x, dy = (o.y - 16) - e.y; if (dx * dx + dy * dy < R2) return true; }
      }
      if (arenaTotal > 0 && arenaOn === arenaTotal) return true;
    }
    return false;
  }

  // B02 — is the cinder parasite exposed? The Mothqueen (the host) is warded
  // UNLESS the parasite riding her is lit: Fin's carried lantern within
  // lanternRadius, a lit bloom/bulb (a `brazier` fixture) within radius, or the
  // whole ring of arena bulbs kindled. So the cure IS "keep her in the light,
  // then strike the rot" — the damage gate burns the parasite off, never her.
  // Mirrors bossLit but reads the Mothqueen's lanternRadius param.
  function parasiteExposed(e, region, P) {
    const R = e.p.lanternRadius || 96, R2 = R * R;
    if (P.fin.active && !P.fin.downed) { const dx = P.fin.x - e.x, dy = P.fin.y - e.y; if (dx * dx + dy * dy < R2) return true; }
    const objs = region.objects;
    if (objs) {
      let arenaTotal = 0, arenaOn = 0;
      for (let i = 0; i < objs.length; i++) {
        const o = objs[i];
        if (o.kind !== 'brazier') continue;
        if (o.group === 'arena') { arenaTotal++; if (o.on) arenaOn++; }
        if (o.on) { const dx = o.cx - e.x, dy = (o.y - 16) - e.y; if (dx * dx + dy * dy < R2) return true; }
      }
      if (arenaTotal > 0 && arenaOn === arenaTotal) return true;
    }
    return false;
  }

  // ---- the nine behaviors (+ the B01/B02 bosses) -------------------------
  const BEH = {
    // BEACON WRAITH: a grief-ghost bound to the fallen beacon. INVULNERABLE in
    // the dark (grief-cold wards it); expose it to light to make it bite-able,
    // then strike. Floats toward the nearest hero, telegraphs a wailing light-
    // slam (the `.tele` frame + a fair wind-up), and is leashed to the arena so
    // it can't wander the ruin. Dormant until the arena beat wakes it.
    'boss-wraith'(e, world, region, P) {
      const p = e.p, def = e.def;
      if (!SS.State || !SS.State.getFlag('d01_wraith_woke')) { e.state = 'dormant'; e.vx = e.vy = 0; e.moving = false; e.vulnerable = false; return; }
      e.vulnerable = bossLit(e, region, P);
      const slamReach = p.slamReach || 46, slamDmg = p.slamDamage || def.contactDamage;
      switch (e.state) {
        case 'tele': stepTele(e, T(p.slamMs || 260)); return;
        case 'attack':
          e.vx = e.vy = 0;
          reachHit(e, P, slamReach, slamDmg);
          if (--e.stateT <= 0) { enterRecover(e, p.recoverMs || 700); e.cool = T(p.cooldownMs || 1300); }
          return;
        case 'recover': tickRecover(e); return;
        default: {
          if (!e._has) { e.state = 'idle'; e.vx = e.vy = 0; return; }
          e.state = 'aggro'; faceTarget(e);
          const hdx = e.homeX - e.x, hdy = e.homeY - e.y;
          if (Math.hypot(hdx, hdy) > (p.leash || 160)) { approach(e, e.homeX, e.homeY, def.speed * 1.25); return; }
          if (e.cool > 0) e.cool--;
          else if (e._dist < (p.aggroRange || 400) && e.meta.anims.tele) { enterTele(e); return; }
          approach(e, e._tx, e._ty, def.speed);
          return;
        }
      }
    },

    // THE MOTHQUEEN (B02): a cure-boss, not a kill. Her host body is WARDED;
    // only the cinder parasite riding her can be struck, and only while it is
    // lit (Fin's lantern / a bloom within lanternRadius / all arena bulbs). She
    // drifts toward the nearest hero (leashed to her hollow), winds up a fair
    // telegraph, then coughs a SPORE-BURST from the shared shot pool. Phase 2
    // (host worn past phase2Hp) flares the parasite: shorter cooldown + a wider
    // wing-gust spread. Dormant until the intro cutscene wakes her. Reducing her
    // to 0 doesn't kill her — it burns the parasite off (the director plays the
    // cure); the `!e.vulnerable` gate in damageEnemy enforces "only when lit".
    'boss-mothqueen'(e, world, region, P) {
      const p = e.p, def = e.def;
      if (!SS.State || !SS.State.getFlag('d02_queen_woke')) { e.state = 'dormant'; e.vx = e.vy = 0; e.moving = false; e.vulnerable = false; return; }
      e.vulnerable = parasiteExposed(e, region, P);
      // phase 2 derived from hp (monotonic) — NOT stored on e.phase, which means
      // terrain-phasing in the mover and would let the boss clip walls/gaps.
      const wide = e.hp <= (p.phase2Hp || 6);
      switch (e.state) {
        case 'tele':
          e.vx = e.vy = 0;
          if (--e.stateT <= 0) { lockAim(e); fireSpores(e, p, wide); e.state = 'attack'; e.stateT = T(p.sporeMs || 220); }
          return;
        case 'attack':
          e.vx = e.vy = 0;
          if (--e.stateT <= 0) { enterRecover(e, p.recoverMs || 700); e.cool = T((p.cooldownMs || 1300) * (wide ? 0.55 : 1)); }
          return;
        case 'recover': tickRecover(e); return;
        default: {
          if (!e._has) { e.state = 'idle'; e.vx = e.vy = 0; return; }
          e.state = 'aggro'; faceTarget(e);
          const hdx = e.homeX - e.x, hdy = e.homeY - e.y;
          if (Math.hypot(hdx, hdy) > (p.leash || 180)) { approach(e, e.homeX, e.homeY, def.speed * 1.25); return; }
          if (e.cool > 0) e.cool--;
          else if (e._dist < (p.aggroRange || 420) && e.meta.anims.tele) { enterTele(e); return; }
          approach(e, e._tx, e._ty, def.speed);
          return;
        }
      }
    },

    // pursue nearest player, slide vs walls; telegraphed smash (stationary) or
    // pounce (mobile dash) when in range if the family carries a tell.
    chase(e, world, region, P) {
      const p = e.p, def = e.def;
      const reach = p.smashReach || p.attackReach || 0;
      const pounce = p.pounceSpeed || 0;
      const dmg = p.attackDamage || def.contactDamage;
      switch (e.state) {
        case 'tele': stepTele(e, pounce ? T(p.pounceMs || 220) : ATTACK_TICKS); return;
        case 'attack':
          if (pounce) { e.vx = e.aimX * pounce; e.vy = e.aimY * pounce; if (e.hitX || e.hitY || --e.stateT <= 0) enterRecover(e, p.recoverMs || 300); }
          else { reachHit(e, P, reach, dmg); if (--e.stateT <= 0) enterRecover(e, p.recoverMs || 300); }
          return;
        case 'recover': tickRecover(e); return;
        case 'waking': if (--e.stateT <= 0) e.state = 'aggro'; return;
        default:
          if (!e._has || e._dist > p.aggroRange * 1.3) { e.state = 'idle'; e.vx = e.vy = 0; return; }
          if (e.state === 'idle' && e.wakeT > 0) { e.state = 'waking'; e.stateT = e.wakeT; return; }
          e.state = 'aggro'; faceTarget(e);
          if (e.meta.anims.tele) {
            if (pounce) { if (e._dist < p.aggroRange * 0.75 && e._dist > reach + e.r + 6) { enterTele(e); return; } }
            else if (reach && e._dist < reach + e.r + 8) { enterTele(e); return; }
          }
          approach(e, e._tx, e._ty, def.speed);
          return;
      }
    },

    // terrain-phasing float: gentle sine bob + lure wander; drifts toward a
    // player when aggroed; glutton-kin add a telegraphed bite.
    drift(e, world, region, P) {
      const p = e.p, def = e.def;
      if (e.state === 'tele') { stepTele(e, ATTACK_TICKS); return; }
      if (e.state === 'attack') {
        e.vx = e.aimX * def.speed * 2.2; e.vy = e.aimY * def.speed * 2.2;
        reachHit(e, P, p.biteRange || 10, def.contactDamage);
        if (--e.stateT <= 0) enterRecover(e, 300); return;
      }
      if (e.state === 'recover') { tickRecover(e); return; }
      const bob = Math.cos(e.animT * 0.11 + e.seed) * (p.hoverAmp ? p.hoverAmp * 0.03 : 0.15);
      if (e._has && e._dist < p.aggroRange) {
        e.state = 'aggro'; faceTarget(e);
        const wob = Math.sin(e.animT * 0.05 + e.seed) * (p.lureWander || 0.3);
        const dx = e._tx - e.x, dy = e._ty - e.y, L = Math.hypot(dx, dy) || 1;
        e.vx = (dx / L) * def.speed + (-dy / L) * wob;
        e.vy = (dy / L) * def.speed + (dx / L) * wob + bob;
        if (e.meta.anims.tele && p.biteRange && e._dist < p.biteRange + e.r + 8) enterTele(e);
      } else {
        e.state = 'idle';
        e.vx = Math.sin(e.animT * 0.04 + e.seed) * def.speed * 0.5 + (e.hx - e.x) * 0.002;
        e.vy = Math.cos(e.animT * 0.03 + e.seed) * def.speed * 0.4 + (e.hy - e.y) * 0.002 + bob;
      }
    },

    // fast erratic flock: straight approach + per-enemy jitter + separation
    // from other live swarmers (iterate items directly — no closure).
    swarm(e, world, region, P) {
      const p = e.p, def = e.def;
      if (!e._has || e._dist > p.aggroRange * 1.4) {
        e.state = 'idle';
        e.vx = (e.hx - e.x) * 0.01 + Math.sin(e.animT * 0.2 + e.seed) * def.speed * 0.5;
        e.vy = (e.hy - e.y) * 0.01 + Math.cos(e.animT * 0.17 + e.seed) * def.speed * 0.5;
        return;
      }
      e.state = 'aggro'; faceTarget(e);
      const dx = e._tx - e.x, dy = e._ty - e.y, L = Math.hypot(dx, dy) || 1;
      let vx = (dx / L) * def.speed, vy = (dy / L) * def.speed;
      const j = p.jitter || 0.4;
      vx += Math.sin(e.animT * 0.5 + e.seed) * def.speed * j;
      vy += Math.cos(e.animT * 0.47 + e.seed) * def.speed * j;
      const items = pool.items, fr = p.flockRadius || 40, fr2 = fr * fr;
      for (let i = 0; i < items.length; i++) {
        const o = items[i];
        if (!o.alive || o === e || o.behavior !== 'swarm') continue;
        const sx = e.x - o.x, sy = e.y - o.y, d2 = sx * sx + sy * sy;
        if (d2 > 0 && d2 < fr2) { const d = Math.sqrt(d2); vx += (sx / d) * def.speed * 0.6 * (1 - d / fr); vy += (sy / d) * def.speed * 0.6 * (1 - d / fr); }
      }
      e.vx = vx; e.vy = vy;
    },

    // dormant/hidden until a player enters aggroRange, then a telegraphed lunge;
    // if it lands nothing it crawls back to its rest point and re-buries.
    ambush(e, world, region, P) {
      const p = e.p, def = e.def;
      switch (e.state) {
        case 'tele': stepTele(e, T(p.lungeMs || 220)); return;
        case 'attack':
          e.vx = e.aimX * (p.lungeSpeed || 1.8); e.vy = e.aimY * (p.lungeSpeed || 1.8);
          if (--e.stateT <= 0) { e.state = 'return'; }
          return;
        case 'return': {
          const dx = e.hx - e.x, dy = e.hy - e.y, L = Math.hypot(dx, dy);
          if (L > 2) { e.vx = (dx / L) * def.speed; e.vy = (dy / L) * def.speed; }
          else { e.vx = e.vy = 0; e.state = 'idle'; e.wakeT = T(p.buriedUntilMs || 500); }
          return;
        }
        default:
          e.vx = e.vy = 0;
          if (e.wakeT > 0) { e.wakeT--; return; }
          if (e._has && e._dist < p.aggroRange) { faceTarget(e); enterTele(e); }
          return;
      }
    },

    // kite to a standoff band, telegraph, fire a projectile from its own pool,
    // retreat when a player closes inside the band.
    skirmish(e, world, region, P) {
      const p = e.p, def = e.def, so = p.standoff || 90;
      switch (e.state) {
        case 'tele':
          e.vx = e.vy = 0;
          if (--e.stateT <= 0) { fireProjectile(e, p.projectile); enterRecover(e, 260); }
          return;
        case 'recover': tickRecover(e); return;
        default:
          if (!e._has || e._dist > p.aggroRange) { e.state = 'idle'; e.vx = (e.hx - e.x) * 0.01; e.vy = (e.hy - e.y) * 0.01; return; }
          e.state = 'aggro'; faceTarget(e);
          if (e._dist < so * 0.72) retreat(e, def.speed);
          else if (e._dist > so * 1.15) approach(e, e._tx, e._ty, def.speed * 0.7);
          else { e.vx = e.vy = 0; if (e.cool > 0) e.cool--; else enterTele(e); }
          return;
      }
    },

    // telegraphed straight dash aimed at a player; recovers when it hits a wall
    // or travels its max window.
    charge(e, world, region, P) {
      const p = e.p, def = e.def;
      switch (e.state) {
        case 'tele': stepTele(e, T(p.chargeMs || 600)); return;
        case 'attack':
          e.vx = e.aimX * (p.chargeSpeed || 2.5); e.vy = e.aimY * (p.chargeSpeed || 2.5);
          if (e.hitX || e.hitY || --e.stateT <= 0) enterRecover(e, p.recoverMs || 500);
          return;
        case 'recover': tickRecover(e); return;
        default:
          if (!e._has || e._dist > p.aggroRange) { e.state = 'idle'; e.vx = e.vy = 0; return; }
          e.state = 'aggro'; faceTarget(e);
          if (e._dist < p.aggroRange) { enterTele(e); return; }
          approach(e, e._tx, e._ty, def.speed);
          return;
      }
    },

    // serpentine sine advance, leashed to its home area (waterbound feel); a
    // short lunge when a player is right on top of it.
    weave(e, world, region, P) {
      const p = e.p, def = e.def;
      switch (e.state) {
        case 'tele': stepTele(e, T(140)); return;
        case 'attack':
          e.vx = e.aimX * (p.lungeSpeed || 2.4); e.vy = e.aimY * (p.lungeSpeed || 2.4);
          reachHit(e, P, e.r, def.contactDamage);
          if (--e.stateT <= 0) enterRecover(e, 300);
          return;
        case 'recover': tickRecover(e); return;
        default:
          if (!e._has || e._dist > p.aggroRange) { e.state = 'idle'; weaveMove(e, e.hx, e.hy, def.speed * 0.5, p); return; }
          e.state = 'aggro'; faceTarget(e);
          if (e.meta.anims.tele && e._dist < e.r + 18) { enterTele(e); return; }
          weaveMove(e, e._tx, e._ty, def.speed, p);
          return;
      }
    },

    // aerial orbit at a radius, periodic telegraphed dive, then climb back out.
    swoop(e, world, region, P) {
      const p = e.p, def = e.def, orad = p.orbitRadius || 60;
      switch (e.state) {
        case 'tele': stepTele(e, T(p.diveMs || 300)); return;
        case 'attack':
          e.vx = e.aimX * (p.diveSpeed || 3); e.vy = e.aimY * (p.diveSpeed || 3);
          reachHit(e, P, e.r + 2, def.contactDamage);
          if (--e.stateT <= 0) { e.state = 'climb'; e.stateT = T(p.climbMs || 500); }
          return;
        case 'climb': {
          const cx = e._has ? e._tx : e.hx, cy = e._has ? e._ty : e.hy;
          const ang = Math.atan2(e.y - cy, e.x - cx);
          steerTo(e, cx + Math.cos(ang) * orad, cy + Math.sin(ang) * orad, def.speed * 1.4);
          if (--e.stateT <= 0) e.state = 'orbit';
          return;
        }
        default:
          if (!e._has || e._dist > p.aggroRange) { e.state = 'idle'; steerTo(e, e.hx, e.hy, def.speed); return; }
          e.state = 'orbit'; faceTarget(e); e.orbitA += 0.035;
          steerTo(e, e._tx + Math.cos(e.orbitA) * orad, e._ty + Math.sin(e.orbitA) * orad, def.speed * 1.3);
          if (e.cool > 0) e.cool--; else { enterTele(e); e.cool = T(1600); }
          return;
      }
    },

    // holds its post, turns to face the threat, blocks frontal hits, and thrusts
    // its reach weapon when a player is in front and in range.
    guard(e, world, region, P) {
      const p = e.p, def = e.def, reach = p.guardReach || 24;
      switch (e.state) {
        case 'tele': stepTele(e, ATTACK_TICKS); return;
        case 'attack': reachHit(e, P, reach, p.thrustDamage || def.contactDamage); if (--e.stateT <= 0) enterRecover(e, p.recoverMs || 340); return;
        case 'recover': tickRecover(e); return;
        default:
          e.vx = e.vy = 0;
          if (!e._has || e._dist > p.aggroRange) { e.state = 'idle'; return; }
          e.state = 'aggro'; faceTarget(e);
          const front = Math.sign(e._tx - e.x) === e.faceX || Math.abs(e._tx - e.x) < 6;
          if (front && e._dist < reach + e.r + 8) enterTele(e);
          return;
      }
    },
  };

  function weaveMove(e, tx, ty, sp, p) {
    const dx = tx - e.x, dy = ty - e.y, L = Math.hypot(dx, dy) || 1;
    const nx = dx / L, ny = dy / L;
    const wob = Math.sin(e.animT * (p.weaveFreq || 0.08) * 6.283 + e.seed) * (p.weaveAmp ? p.weaveAmp * 0.045 : 0.8);
    e.vx = nx * sp + (-ny) * wob + (e.hx - e.x) * 0.004;
    e.vy = ny * sp + (nx) * wob + (e.hy - e.y) * 0.004;
  }

  // ---- combat resolution -------------------------------------------------
  function blocksHit(e, srcX) { return e.blockFront && Math.sign(srcX - e.x) === e.faceX; }

  function damageEnemy(e, dmg, sx, sy) {
    if (e.iframes > 0) return;
    // B01: the Beacon Wraith is warded by grief-cold — a blade only bites while
    // it stands in light (Fin's lantern / a lit brazier). A cold "clink" tells
    // the player their steel glanced off the dark. The lantern-weakness IS the gate.
    if (e.isBoss && !e.vulnerable) { e.iframes = 8; SS.Audio && SS.Audio.sfx('hit'); return; }
    if (blocksHit(e, sx)) { e.flash = 4; e.iframes = 6; SS.Audio && SS.Audio.sfx('hit'); return; }  // frontal parry: no damage
    e.hp -= dmg; e.flash = 6; e.iframes = ENEMY_IFRAMES;
    SS.Audio && SS.Audio.sfx('enemyHit');
    if (e.hp <= 0) { killEnemy(e); return; }
    const dx = e.x - sx, dy = e.y - sy, L = Math.hypot(dx, dy) || 1;
    e.kx = (dx / L) * KNOCK; e.ky = (dy / L) * KNOCK; e.state = 'hurt'; e.stateT = HURT_TICKS;
  }

  function killEnemy(e) {
    spawnPoof(e.x, e.y);
    rollDrops(e.def, e.x, e.y);
    if (e.def.hp >= 8) SS.Renderer.cam.shake(2);   // heavy foes land with weight (cam self-gates lowfx)
    if (e.isBoss) {
      bossState = 'dead';                          // persists past the release for the dungeon director
      SS.Renderer.cam.shake(5);
      // the grief comes apart in three bursts — under lowfx the two extra
      // decorative bursts are dropped (the boss still visibly poofs at center).
      if (!SS.lowfx()) { spawnPoof(e.x - 10, e.y - 22); spawnPoof(e.x + 10, e.y - 12); }
    }
    e.state = 'dead';
    pool.release(e);
  }

  function rollDrops(def, x, y) {
    const drops = def.drops || [];
    // Ember-Heart Charm (E14): a struck-down foe spills a few more embers than
    // it ought. Read the equipped-set boolean once — no per-drop allocation.
    const emberHeart = SS.State && SS.State.hasCharm('item.ember-heart-charm');
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      if (Math.random() < (d.chance || 0)) {
        if (d.item) SS.State.give(d.item);
        else if (d.heart) spawnHeart(x, y);   // a mended-heart pickup (kid-forgiving healing economy)
        else if (typeof d.embers === 'number') SS.State.addEmbers(emberHeart ? d.embers + Math.max(1, Math.round(d.embers * 0.5)) : d.embers);
      }
    }
  }

  // spawn a heart pickup at a death spot (pooled — no allocation on a hot kill)
  function spawnHeart(x, y) {
    const h = pickups.obtain(); if (!h) return;
    h.x = x; h.y = y; h.life = HEART_LIFE; h.seed = Math.random() * 6.283;
  }

  function hurtPlayer(pl, dmg) {
    if (pl.iframes > 0 || pl.downed) return;
    // Warden's Charm (E14): every blow that lands on a hero lands a little
    // softer (never below 1, so a hit always stings — kid-legible, not immunity).
    if (SS.State && SS.State.hasCharm('item.wardens-charm') && dmg > 1) dmg -= 1;
    pl.hp -= dmg; pl.iframes = PLAYER_HURT_IFRAMES;
    SS.Audio && SS.Audio.sfx('hurt');
    SS.Renderer.cam.shake(2);
    // E09: hitting 0 hp DOWNS the hero (collapse in place, revivable by a
    // partner). Player.down owns the down/revive/fail-state flow — combat just
    // reports the knockout here.
    if (pl.hp <= 0) SS.Players.down(pl);
  }

  function fireProjectile(e, spec) {
    spec = spec || { speed: 2, damage: 1, life: 80 };
    const s = shots.obtain(); if (!s) return;
    const dx = e._tx - e.x, dy = e._ty - e.y, L = Math.hypot(dx, dy) || 1;
    s.x = e.x + (dx / L) * (e.r + 2); s.y = e.y + (dy / L) * (e.r + 2);
    s.vx = (dx / L) * (spec.speed || 2); s.vy = (dy / L) * (spec.speed || 2);
    s.life = spec.life || 80; s.dmg = spec.damage || 1;
    e.cool = T(700);
    SS.Audio && SS.Audio.sfx('sling');
  }

  // B02 — the Mothqueen's spore-burst: N pooled projectiles fanned around the
  // aim (locked at telegraph end). Phase 2's wing-gust throws more, wider. All
  // from the shared shots pool with scalar trig — zero allocation.
  function fireSpores(e, p, wide) {
    const n = wide ? 5 : 3;
    const arc = wide ? 1.4 : 0.7;                 // total spread (radians)
    const sp = p.sporeSpeed || 1.6, dmg = p.sporeDamage || 1, life = p.sporeLife || 96;
    const base = Math.atan2(e.aimY, e.aimX);      // aimX/aimY set by lockAim
    const step = n > 1 ? arc / (n - 1) : 0, start = base - arc / 2;
    for (let i = 0; i < n; i++) {
      const s = shots.obtain(); if (!s) break;
      const a = start + step * i, cx = Math.cos(a), cy = Math.sin(a);
      s.x = e.x + cx * (e.r + 2); s.y = e.y + cy * (e.r + 2);
      s.vx = cx * sp; s.vy = cy * sp;
      s.life = life; s.dmg = dmg;
    }
    SS.Audio && SS.Audio.sfx('sling');
  }

  function spawnPoof(x, y) { const p = poofs.obtain(); if (!p) return; p.x = x; p.y = y; p.life = p.life0 = SS.lowfx() ? POOF_LIFE_LOWFX : POOF_LIFE; }

  // ---- fixed-step update -------------------------------------------------
  function update(region) {
    const world = region, P = SS.Players.get(), items = pool.items;
    for (let i = 0; i < items.length; i++) {
      const e = items[i]; if (!e.alive) continue;
      if (e.iframes > 0) e.iframes--;
      if (e.flash > 0) e.flash--;
      e.animT++;
      // nearest active, standing player (scalar; stash on e — no allocation)
      let bd = Infinity, tx = e.x, ty = e.y, has = false;
      if (P.kes.active && !P.kes.downed) { const dx = P.kes.x - e.x, dy = P.kes.y - e.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; tx = P.kes.x; ty = P.kes.y; has = true; } }
      if (P.fin.active && !P.fin.downed) { const dx = P.fin.x - e.x, dy = P.fin.y - e.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; tx = P.fin.x; ty = P.fin.y; has = true; } }
      e._dist = Math.sqrt(bd); e._tx = tx; e._ty = ty; e._has = has;
      e.vx = 0; e.vy = 0;

      if (e.state === 'hurt') {
        if (e.phase) { e.x += e.kx; e.y += e.ky; clampWorld(e, region); }
        else moveVsTiles(world, e, e.kx, e.ky);
        e.kx *= 0.72; e.ky *= 0.72;
        if (--e.stateT <= 0) e.state = has ? 'aggro' : 'idle';
      } else {
        // live-evaluate the data-driven passive condition (only enemies that
        // carry passiveWhen pay this) so advancing the quest calms it the same
        // frame — a passive enemy never runs its combat AI, only slow-wanders.
        if (e.passiveCond) e.passive = SS.Cond ? SS.Cond.eval(e.passiveCond) : e.passive;
        if (e.passive) passiveWander(e);
        else (BEH[e.behavior] || BEH.chase)(e, world, region, P);
        if (e.vx !== 0 || e.vy !== 0) {
          if (e.phase) { e.x += e.vx; e.y += e.vy; clampWorld(e, region); e.hitX = e.hitY = false; }
          else moveVsTiles(world, e, e.vx, e.vy);
        }
      }
      e.moving = (Math.abs(e.vx) + Math.abs(e.vy)) > 0.12 || e.state === 'hurt';
      if (e.state === 'tele') teleSeen[e.ref] = true;   // latch the wind-up for review/harness (transient, robust to rAF throttling)

      // contact damage: touching any live, non-dormant enemy hurts a vulnerable
      // player (a sleeping Wraith is harmless until the arena beat wakes it; the
      // grief-ghost boss itself deals 0 on touch — only its telegraphed light-
      // slam wounds you, so you can trade blows and just read the tell). A
      // passive enemy (the mourning shepherd) never harms the party on contact.
      if (e.state !== 'dead' && e.state !== 'dormant' && !e.passive && e.def.contactDamage > 0) {
        contact(e, P.kes);
        contact(e, P.fin);
      }
    }

    weaponVsEnemies(P);
    updateShots(world, P);
    updatePoofs();
    updatePickups(P);
  }

  // gentle slow-wander for a passive enemy: idle drift anchored to its home
  // point, no aggro, no telegraph, no attack (the mourning shepherd wanders the
  // bog but never charges the party).
  function passiveWander(e) {
    const sp = (e.def.speed || 0.3) * 0.4;
    e.state = 'idle';
    e.vx = Math.sin(e.animT * 0.02 + e.seed) * sp + (e.hx - e.x) * 0.004;
    e.vy = Math.cos(e.animT * 0.017 + e.seed) * sp + (e.hy - e.y) * 0.004;
  }

  // heart pickups: tick life, gutter out at 0, and mend a heart on any standing
  // hero that still has room and brushes one (chime on take). Pooled + scalar —
  // zero hot-loop allocation.
  function updatePickups(P) {
    const it = pickups.items;
    for (let i = 0; i < it.length; i++) {
      const h = it[i]; if (!h.alive) continue;
      if (--h.life <= 0) { pickups.release(h); continue; }
      if (takeHeart(h, P.kes) || takeHeart(h, P.fin)) pickups.release(h);
    }
  }
  function takeHeart(h, pl) {
    if (!pl.active || pl.downed || pl.hp >= pl.maxhp) return false;
    if (circleHit(h.x, h.y, HEART_R, pl.x, pl.y, pl.r)) {
      pl.hp = Math.min(pl.maxhp, pl.hp + HEART_HEAL);
      SS.Audio && SS.Audio.sfx('chime');
      return true;
    }
    return false;
  }

  function contact(e, pl) {
    if (!pl.active || pl.downed || pl.iframes > 0) return;
    if (circleHit(e.x, e.y, e.r, pl.x, pl.y, pl.r)) hurtPlayer(pl, e.def.contactDamage);
  }

  function weaponVsEnemies(P) {
    const items = pool.items;
    // per-hit damage read once (allocation-free): Tinder's Charm adds a tinder-
    // flash of bite to Kes's blade; {sling-power} upgrades weight Fin's shot.
    const swordDmg = SWORD_DMG + (SS.State && SS.State.hasCharm('item.tinders-charm') ? 1 : 0);
    const slingDmg = SLING_DMG + (SS.State ? (SS.State.slingPower || 0) : 0);
    // Kes sword hitbox (live mid-swing) — enemy iframes ensure one hit per swing
    const k = P.kes;
    if (k.active && k.hb.active) {
      for (let i = 0; i < items.length; i++) {
        const e = items[i]; if (!e.alive || e.iframes > 0) continue;
        if (circleHit(k.hb.x, k.hb.y, k.hb.r, e.x, e.y, e.r)) damageEnemy(e, swordDmg, k.x, k.y);
      }
    }
    // Fin sling projectiles — consumed on any enemy contact
    const pr = SS.Players.projectiles();
    if (pr) {
      const pi = pr.items;
      for (let j = 0; j < pi.length; j++) {
        const s = pi[j]; if (!s.alive) continue;
        for (let i = 0; i < items.length; i++) {
          const e = items[i]; if (!e.alive) continue;
          if (circleHit(s.x, s.y, 2, e.x, e.y, e.r)) { if (!blocksHit(e, s.x)) damageEnemy(e, slingDmg, s.x, s.y); pr.release(s); break; }
        }
      }
    }
  }

  function updateShots(world, P) {
    const it = shots.items;
    for (let j = 0; j < it.length; j++) {
      const s = it[j]; if (!s.alive) continue;
      s.x += s.vx; s.y += s.vy; s.life--;
      const tx = (s.x / world.tileSize) | 0, ty = (s.y / world.tileSize) | 0;
      if (s.life <= 0 || world.solidAt(tx, ty)) { shots.release(s); continue; }
      if (shotHit(s, P.kes) || shotHit(s, P.fin)) shots.release(s);
    }
  }
  function shotHit(s, pl) {
    if (!pl.active || pl.downed || pl.iframes > 0) return false;
    if (circleHit(s.x, s.y, 2, pl.x, pl.y, pl.r)) { hurtPlayer(pl, s.dmg); return true; }
    return false;
  }

  function updatePoofs() { const it = poofs.items; for (let i = 0; i < it.length; i++) { const p = it[i]; if (!p.alive) continue; if (--p.life <= 0) poofs.release(p); } }

  // ---- draw --------------------------------------------------------------
  // push live, on-screen enemies into the play draw list (y-sorted with world)
  function collectDrawList(list, cam) {
    const items = pool.items, m = 40;
    for (let i = 0; i < items.length; i++) {
      const e = items[i]; if (!e.alive) continue;
      if (e.x < cam.x - m || e.x > cam.x + cam.w + m || e.y < cam.y - m || e.y > cam.y + cam.h + m) continue;
      list.push(e);
    }
  }

  function frameFor(e) {
    const a = e.meta.anims;
    if ((e.state === 'tele' || e.state === 'attack') && a.tele) return 'tele.0';
    if (e.moving && a.move) return 'move.' + ((e.animT >> 3) % a.move);
    return 'idle.' + ((e.animT >> 4) % (a.idle || 1));
  }

  // The Beacon Wraith draws from the SS.Bosses atlas: the `.rim` (warm) variant
  // when it stands in light (VULNERABLE — strike now), the plain cold variant
  // when warded, and the white `.flash` on a landed hit. The `.tele.0` frame is
  // its readable wailing light-slam wind-up.
  function drawBoss(ctx, e) {
    const meta = e.bossMeta, a = meta.anims;
    K.dither2(ctx, (e.x - meta.w * 0.32) | 0, (e.y - 1) | 0, (meta.w * 0.64) | 0, 5, K.DEEP_DUSK, 0.6);
    const action = (e.state === 'tele' || e.state === 'attack') ? 'tele.0' : 'idle.' + ((e.animT >> 4) % (a.idle || 1));
    const variant = e.flash > 0 ? '.flash' : (e.vulnerable ? '.rim' : '');
    const name = e.fam + '.' + action + variant;
    const ax = meta.anchor.x, ay = meta.anchor.y;
    if (e.faceX < 0) bossAtlas.drawFlipped(ctx, name, (e.x - (meta.w - ax)) | 0, (e.y - ay) | 0);
    else bossAtlas.draw(ctx, name, (e.x - ax) | 0, (e.y - ay) | 0);
  }

  // called by the play y-sort; same rim (lantern-lit world) / flash (hit) rule
  // as the hero, hard dithered contact shadow (never a smooth ellipse).
  function drawOne(ctx, e) {
    if (e.isBoss) { drawBoss(ctx, e); return; }
    const meta = e.meta;
    K.dither2(ctx, (e.x - meta.w * 0.35) | 0, (e.y - 1) | 0, (meta.w * 0.7) | 0, 4, K.DEEP_DUSK, 0.55);
    const name = e.fam + '.' + frameFor(e) + (e.flash > 0 ? '.flash' : '.rim');
    const ax = meta.anchor.x, ay = meta.anchor.y;
    if (e.faceX < 0) enemyAtlas.drawFlipped(ctx, name, (e.x - (meta.w - ax)) | 0, (e.y - ay) | 0);
    else enemyAtlas.draw(ctx, name, (e.x - ax) | 0, (e.y - ay) | 0);
  }

  function drawShots(ctx) {
    const it = shots.items, r = K.ramp('#8fd0c8');
    for (let j = 0; j < it.length; j++) {
      const s = it[j]; if (!s.alive) continue;
      K.pxRect(ctx, (s.x - 2) | 0, (s.y - 1) | 0, 4, 2, r.mid);
      K.pxRect(ctx, (s.x - 1) | 0, (s.y - 2) | 0, 2, 4, r.hi);
      K.pxRect(ctx, s.x | 0, s.y | 0, 1, 1, K.FIRST_FLAME);
    }
  }

  function drawPoofs(ctx) {
    const it = poofs.items, n = poofFrames.length;
    for (let i = 0; i < it.length; i++) {
      const p = it[i]; if (!p.alive) continue;
      let fi = ((1 - p.life / p.life0) * n) | 0; if (fi >= n) fi = n - 1; if (fi < 0) fi = 0;
      const f = poofFrames[fi];
      ctx.drawImage(f, (p.x - f.width / 2) | 0, (p.y - f.height / 2) | 0);
    }
  }

  // dropped heart pickups (baked glow sprite; gentle bob + a low-life flicker
  // that reads as "grab it before it guts out"). One drawImage each, lowfx-safe.
  function drawPickups(ctx) {
    const it = pickups.items, lowfx = SS.lowfx();
    for (let i = 0; i < it.length; i++) {
      const h = it[i]; if (!h.alive) continue;
      if (h.life < 90 && ((h.life >> 3) & 1)) continue;   // flicker in the last ~1.5s
      const bob = lowfx ? 0 : Math.round(Math.sin(h.life * 0.08 + h.seed) * 2);
      ctx.drawImage(heartFrame, (h.x - heartFrame.width / 2) | 0, (h.y - heartFrame.height / 2 - 6 + bob) | 0);
    }
  }

  // ---- read-only introspection for main.js debug + harness --------------
  function info(e) { return { ref: e.ref, x: Math.round(e.x), y: Math.round(e.y), hp: e.hp, maxhp: e.maxhp, state: e.state, behavior: e.behavior, iframes: e.iframes, passive: !!e.passive }; }
  function aliveCount() { return pool ? pool.liveCount : 0; }
  function spawnedCount() { return spawned; }
  function list() { const out = [], it = pool.items; for (let i = 0; i < it.length; i++) if (it[i].alive) out.push(info(it[i])); return out; }
  function nearestInfo(x, y) {
    const it = pool.items; let best = null, bd = Infinity;
    for (let i = 0; i < it.length; i++) { const e = it[i]; if (!e.alive) continue; const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = e; } }
    if (!best) return null; const r = info(best); r.dist = Math.round(Math.sqrt(bd)); return r;
  }
  function hpAt(i) { const it = pool.items; let n = 0; for (let j = 0; j < it.length; j++) if (it[j].alive) { if (n === i) return it[j].hp; n++; } return null; }
  function telegraphSeen(ref) { return ref ? !!teleSeen[ref] : Object.keys(teleSeen); }
  function poofCount() { return poofs ? poofs.liveCount : 0; }   // E16: live death-poof particles (read-only)
  function pickupCount() { return pickups ? pickups.liveCount : 0; }   // live heart pickups (read-only, harness)
  function pickupList() { const out = [], it = pickups ? pickups.items : []; for (let i = 0; i < it.length; i++) { const h = it[i]; if (h.alive) out.push({ x: Math.round(h.x), y: Math.round(h.y), life: h.life }); } return out; }

  // ---- boss introspection (B01) — read-only for the dungeon director + harness
  function bossInfo() {
    const it = pool.items;
    for (let i = 0; i < it.length; i++) { const e = it[i]; if (e.alive && e.isBoss) return { ref: e.ref, name: e.def.name, hp: e.hp, maxhp: e.maxhp, state: e.state, vulnerable: e.vulnerable, x: Math.round(e.x), y: Math.round(e.y) }; }
    return null;
  }
  function bossStatus() { return bossState; }   // 'none' | 'alive' | 'dead'

  SS.EnemyMgr = {
    init, load, reset, update, spawn,
    collectDrawList, drawOne, drawShots, drawPoofs, drawPickups,
    aliveCount, spawnedCount, list, nearestInfo, hpAt, telegraphSeen, poofCount, pickupCount, pickupList,
    bossInfo, bossStatus,
  };
})();


// ===== src/game/hud.js =====
// HUD — hearts (P1 top-left / P2 top-right), ember count, active-quest hint.
// Baked icons + bitmap font only (no system fonts). Seeds E12.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  let icons = null;

  function bakeHeart(full) {
    const s = 9; const c = K.makeCanvas(s, s); const ctx = c.getContext('2d');
    const r = full ? K.ramp('#d8384c') : K.ramp('#3a2c3a');
    // chunky pixel heart
    const rows = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
    for (let y = 0; y < rows.length; y++) for (let x = 0; x < 7; x++) {
      if (rows[y][x] === '#') ctx.fillStyle = (y === 0 || (y === 1 && x < 4)) ? r.hi : r.mid, ctx.fillRect(x + 1, y + 1, 1, 1);
    }
    if (full) ctx.fillStyle = r.spec, ctx.fillRect(2, 2, 1, 1);
    K.outline(c, K.ramp('#1a0e14').out);
    return c;
  }
  function bakeEmber() {
    const s = 9; const c = K.makeCanvas(s, s); const ctx = c.getContext('2d');
    const r = K.ramp(K.EMBER);
    const rows = ['...#...', '..###..', '.#####.', '#######', '#######', '.#####.'];
    for (let y = 0; y < rows.length; y++) for (let x = 0; x < 7; x++) if (rows[y][x] === '#') ctx.fillStyle = y < 2 ? r.spec : r.mid, ctx.fillRect(x + 1, y + 1, 1, 1);
    K.outline(c, K.ramp('#3a1e08').out);
    return c;
  }
  function init() { icons = { heartFull: bakeHeart(true), heartEmpty: bakeHeart(false), ember: bakeEmber() }; }

  function drawHearts(ctx, pl, x, y, rightAlign) {
    const n = pl.maxhp; const each = 10;
    for (let i = 0; i < n; i++) {
      const hx = rightAlign ? x - (n - i) * each : x + i * each;
      ctx.drawImage(i < pl.hp ? icons.heartFull : icons.heartEmpty, hx, y);
    }
  }

  const M = 8; // 8px internal-res safe margin on every edge (art-bible)
  function panel(ctx, x, y, w, h) { ctx.globalAlpha = 0.72; K.pxRect(ctx, x, y, w, h, K.DEEP_DUSK); ctx.globalAlpha = 1; K.outlineRect(ctx, x, y, w, h, '#3a3248'); }

  function draw(ctx) {
    if (!icons) init();
    const W = SS.Renderer.SCREEN_W;
    const P = SS.Players.get();
    // P1 panel: name + hearts + embers (top-left, inside the safe margin)
    const p1w = Math.max(P.kes.maxhp * 10, 44) + 6;
    panel(ctx, M, M, p1w, 34);
    K.font.text(ctx, 'KES', M + 4, M + 3, K.LANTERN, 1);
    drawHearts(ctx, P.kes, M + 4, M + 12, false);
    ctx.drawImage(icons.ember, M + 4, M + 23);
    K.font.text(ctx, String(SS.State ? SS.State.embers : 0), M + 15, M + 24, '#f4d38c', 1);

// ===== src/game/states.js =====
// E04 — Game state machine + states. Stack-based: title -> save-select stub
// -> play; play <-> pause; play <-> dialogue; play <-> cutscene. Overlays
// (pause/dialogue/cutscene) draw over the frozen play world beneath them.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;

  // ---- state manager (stack) --------------------------------------------
  const stack = [];

    push(s) { stack.push(s); if (s.enter) s.enter(); },
    pop() { const s = stack.pop(); if (s && s.exit) s.exit(); return s; },
    replace(s) { this.pop(); this.push(s); },
    reset(s) { while (stack.length) this.pop(); this.push(s); },
    top() { return stack[stack.length - 1]; },
    name() { const t = this.top(); return t ? t.name : null; },
    depth() { return stack.length; },
    update() { const t = this.top(); if (t && t.update) t.update(); },

  };

  // ---- helpers -----------------------------------------------------------
  function midpoint() {
    const list = SS.Players.activeList(); let mx = 0, my = 0;

    return { x: mx / list.length, y: my / list.length };
  }
  function npcDialogue(ref) {
    const ch = SS.reg('characters', ref);

    return null;
  }
  function findInteract(pl, region) {
    const v = SS.math.DIR_VEC[pl.facing]; const fx = pl.x + v[0] * 12, fy = pl.y + v[1] * 12;
    let best = null, bd = 24 * 24;
    for (const n of region.npcs) { const d = SS.math.dist2(fx, fy, n.x, n.y); if (d < bd) { bd = d; best = { type: 'npc', ent: n }; } }
    for (const t of region.triggers) { const d = SS.math.dist2(fx, fy, t.x, t.y); if (d < bd) { bd = d; best = { type: 'trigger', ent: t }; } }

    // interactables too; a taken key drops out of the world entirely.
    for (const o of region.objects) { if (o.taken) continue; const d = SS.math.dist2(fx, fy, o.cx, o.y - 14); if (d < bd) { bd = d; best = { type: 'object', ent: o }; } }
    return best;
  }
  function actorsMap() { const p = SS.Players.get(); const m = { kes: p.kes, fin: p.fin }; for (const n of SS.Game.region.npcs) { m[n.ref] = n; m[n.ref.split('.').pop()] = n; } return m; }

  // Cross to a linked region when the lead hero (P1) walks onto an exit rect.
  // Exit rects are TILE-space [tx,ty,w,h]; `req` gates them via SS.Cond. The
  // brief post-arrival cooldown (State._exitCooldown) means landing on/near the
  // return exit can't instantly bounce you back. An exit whose target region has
  // no authored content yet is a no-op (e.g. the slice's edge to region.duskmoor
  // until R01 lands), so walking there does nothing rather than erroring.
  function checkExitTransition(region) {
    const S = SS.State;
    if (S._exitCooldown > 0) { S._exitCooldown--; return false; }
    const exits = region.exits; if (!exits || !exits.length) return false;
    const kes = SS.Players.get().kes, TS = region.tileSize;
    for (let i = 0; i < exits.length; i++) {
      const ex = exits[i]; if (!ex || !ex.to || !ex.to.region || !ex.rect) continue;
      const r = ex.rect, x0 = r[0] * TS, y0 = r[1] * TS, x1 = (r[0] + r[2]) * TS, y1 = (r[1] + r[3]) * TS;

  // step per push works on every input source with no local edge-tracking.

  function navMenu(state, n) {

  function desiredMusic() {

    // and it is still alive; on its defeat (bossStatus 'dead') or on leaving the

    if (SS.EnemyMgr && (SS.State.getFlag('d01_wraith_woke') || SS.State.getFlag('d02_queen_woke')) && SS.EnemyMgr.bossStatus() === 'alive') return 'music.boss';

  // boss->region, region->region). Re-asserting the same id every frame would
  // fight any deliberate external playMusic (and re-trigger the loop), so the
  // last-applied id is remembered and an unchanged desire is a pure no-op.
  let _appliedMusic = null;
  function applyMusic() {
    if (!SS.Audio || !SS.Audio.isUnlocked()) return;
    const id = desiredMusic();
    if (id && id !== _appliedMusic) { SS.Audio.playMusic(id); _appliedMusic = id; }
  }
  SS.desiredMusic = desiredMusic;   // read-only introspection for the harness

  // ---- title -------------------------------------------------------------
  let titleBg = null;
  function bakeTitleBg() {
    const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
    const c = K.makeCanvas(W, H); const ctx = c.getContext('2d');
    // dusk sky gradient baked as hard bands (no runtime gradient)
    const bands = ['#1a1226', '#241830', '#2e1d34', '#3a2436', '#46283a'];
    for (let i = 0; i < bands.length; i++) K.pxRect(ctx, 0, i * (H / bands.length), W, H / bands.length + 1, bands[i]);

  // True when a physical pad is present from EITHER source (shell controller lib

  function padPresent() {

    let x = (cx - glyphLineWidth(segs) / 2) | 0;

    for (let i = 0; i < segs.length; i++) {
      if (i) x += 9;

  const title = {
    name: 'title', t: 0, sel: 0, opts: ['PRESS START', 'SETTINGS'],
    enter() { if (!titleBg) titleBg = bakeTitleBg(); if (!titleGlyphs) titleGlyphs = bakeTitleGlyphs(); this.t = 0; this.sel = 0; applyMusic(); },
    update() {
      this.t++;
      const I = SS.Input;
      // Kindle the title theme the instant the first gesture unlocks audio
      // (pre-gesture this no-ops, so the initial attract screen stays silent).
      applyMusic();
      navMenu(this, this.opts.length);

    },
    draw(ctx) {

      // (bright, glyphs inline) and keyboard drops to a dim reference line; with
      // no pad the keyboard legend stays primary so desktop players are served.
      const cx = W / 2;

  const saveSelect = {
