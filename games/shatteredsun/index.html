A flint chip that never dulls. The first blow you strike after raising the lantern high falls with a tinder-flash of extra bite.","icon":"charm-tinder","equipSlot":"charm","shopPrice":70},"item.wardens-charm":{"id":"item.wardens-charm","name":"Warden's Charm","kind":"charm","desc":"A city-guard's dented buckle. It teaches your guard a guardsman's patience, so every blow that lands on you lands a little softer.","icon":"charm-warden","equipSlot":"charm","shopPrice":60},"item.whale-oil-flask":{"id":"item.whale-oil-flask","name":"Whale-Oil Flask","kind":"consumable","desc":"A stoppered flask of Brinehollow whale-oil. It burns slow and clean, feeding the hearth-lantern two full nights on a single fill.","icon":"oil","effects":[{"lantern-fuel":2}],"shopPrice":20},"item.whalers-charm":{"id":"item.whalers-charm","name":"Whaler's Charm","kind":"charm","desc":"A vial of whale-oil worn on a cord, Jorun's thanks. Frostreach's cold bites slower through it, and ice-slick ground drags at your steps less.","icon":"charm-whaler","equipSlot":"charm"},"item.worn-shortsword":{"id":"item.worn-shortsword","name":"Worn Shortsword","kind":"gear","desc":"Kes's everyday blade, nicked more from splitting kindling than fighting. Light, honest, and just long enough to keep trouble at arm's reach.","icon":"sword","equipSlot":"weapon"}},"music":{"music.boss":{"id":"music.boss","tempo":138,"key":"E minor","loops":{"bass":[["E2",2],["E2",2],["E2",2],["G2",2],["E2",2],["E2",2],["F#2",2],["G2",2],["A2",2],["A2",2],["G2",2],["F#2",2],["E2",2],["E2",2],["D2",2],["E2",2]],"lead":[[0,4],["E5",2],["E5",2],["G5",2],["E5",2],["F#5",2],["E5",2],["G5",2],["A5",2],["B5",4],["A5",2],["G5",2],["F#5",4],["E5",2],["G5",2],["E5",2],["D5",2],["E5",2],["F#5",2],["G5",4],["A5",2],["G5",2],["F#5",2],["E5",2],["D5",4],["B4",4],["E5",2],["E5",2],["G5",2],["E5",2],["F#5",2],["E5",2],["D5",2],["E5",2],["G5",2],["A5",2],["B5",2],["C6",2],["B5",4],["A5",4],["B5",2],["A5",2],["G5",2],["F#5",2],["E5",2],["D5",2],["C5",2],["B4 "npc.lanternwick.maren","region":"region.duskmoor-slice","journalSummary":"The hearth-lantern is failing. Maren asked us to greet Old Wick, fetch lamp-oil from Sera, and tend the wick.","motivation":"The last honest light in Lanternwick is going out, and Maren cannot climb to the shrine alone.","stages":[{"id":"s1","objective":"Get lamp-oil from Sera","hint":"Greet Old Wick at the shrine first, then climb to Sera's cold forge east of the square.","trigger":{"type":"item","item":"item.lantern-oil"},"marker":{"npc":"npc.lanternwick.sera"},"effects":[]},{"id":"s2","objective":"Bring the oil back to Maren","hint":"Elder Maren waits by the hearth-lantern shrine.","trigger":{"type":"talk","npc":"npc.lanternwick.maren","req":["flag:lantern_tended"]},"marker":{"npc":"npc.lanternwick.maren"},"effects":[]}],"rewards":[{"embers":15}],"continuity":[{"set":{"q_guttering_done":true}},{"set":{"chores_done":true}}]},"q.main.02-fallen-beacon":{"id":"q.main.02-fallen-beacon","title":"The Fallen Beacon","category":"main","giver":"npc.lanternwick.maren","region":"region.duskmoor-slice","journalSummary":"The lantern needs a sliver of the old light. Maren sent us to the Fallen Beacon on the north moor to bring one home.","motivation":"The beacon once answered the dawn. Deep in its dark, a splinter of the old sun still burns - enough, Maren hopes, to keep the hearth alight a while longer.","stages":[{"id":"s1","objective":"Descend the Fallen Beacon and take the sliver of old light","hint":"The dead tower stands on the north moor, past the old cottages. Follow the beacon-trail down and clear whatever keeps the light.","trigger":{"type":"flag","flag":"d01_cleared"},"effects":[]},{"id":"s2","objective":"Carry the sliver home to Maren at the shrine","hint":"Maren waits by the hearth-lantern. Bring her the sliver.","trigger":{"type":"flag","flag":"sliver_offered"},"marker":{"npc":"npc.lanternwick.maren"},"effects":[{"cutscene":"cut.sliver-recoil"}]}],"rewards":[{"embers":25}],"continuity":[{"set":{"q_beacon_done":true}}]},"q.main.03-marens-map":{"id":"q.main.03-marens-map","title":"Maren's Map","category":"main","giver":"npc.lanternwick.maren","region":"region.duskmoor-slice","journalSummary":"The sliver won’t hold the lantern long. Maren drew a wood-road east into the Gloamwood: find the one who remembers the old sun, and leave the sealed grove be.","motivation":"Maren tells a half-truth: a hermit in the Gloamwood recalls how the sun died. Whatever she and the moth-tenders hide, the road east is the lantern’s last hope.","stages":[{"id":"s1","objective":"Follow the wood-road east into the Gloamwood","hint":"Take the road out the east edge of Lanternwick. Follow the lantern-light under the trees to the moth-tenders' waystation.","trigger":{"type":"enter","area":"area.gloam-waystation"},"effects":[]},{"id":"s2","objective":"Find the one in the wood who remembers the old sun","hint":"The moth-tenders speak of a hermit who keeps the foxfire near the deep grove. Seek the Hermit of the Foxfire.","trigger":{"type":"talk","npc":"npc.gloamwood.hermit"},"marker":{"npc":"npc.gloamwood.hermit"},"effects":[{"set":{"met_hermit":true}}]},{"id":"s3","objective":"Reach the Mothqueen's sealed grove","hint":"Follow the tended lanterns to the grove gate the moths keep watch over.","trigger":{"type":"enter","area":"area.grove-gate"},"effects":[{"set":{"reached_grove_gate":true}}]}],"rewards":[{"embers":30}],"continuity":[{"set":{"q_marens_map_done":true}},{"set":{"ready_for_mothqueen":true}}]},"q.main.04-mothqueen":{"id":"q.main.04-mothqueen","title":"The Mothqueen's Hollow","category":"main","giver":"npc.gloamwood.hermit","region":"region.gloamwood","journalSummary":"The Hermit says the one who remembers the old sun is sealed in the deep grove, too sick to speak. Cure the Mothqueen, and learn what she knows.","motivation":"A shard has poisoned the Mothqueen for thirty-four winters. The Hermit swears she alone recalls how the sun died - if the lantern can first cure her.","stages":[{"id":"s1","objective":"Enter the Mothqueen's grove","hint":"The grove-gate opens now that the moth-tenders trust you. Follow the tended lanterns north through the gate and down into the living Hollow.","trigger":{"type":"enter","area":"area.hollow-heart"},"effects":[{"set":{"reached_mothqueen":true}}]},{"id":"s2","objective":"Cure the Mothqueen with the lantern's light","hint":"Wake the bloom-buds crown to root to free the cocoon-key, then reach the Hollow Heart. Burn the black parasite off her with the lantern - never a killing blow.","trigger":{"type":"flag","flag":"d02_cleared"},"effects":[]},{"id":"s3","objective":"Learn what the Mothqueen remembers","hint":"The sickness is gone and she is speaking. Hear her out - about the old sun, and who broke it.","trigger":{"type":"flag","flag":"revelation_1"},"marker":{"npc":"npc.gloamwood.mothqueen"},"effects":[]}],"rewards":[{"embers":40}],"continuity":[{"set":{"q_mothqueen_done":true}},{"set":{"mothqueen_ally":true}}]},"q.side.duskmoor.cold-forge":{"id":"q.side.duskmoor.cold-forge","title":"The Cold Forge","category":"side","giver":"npc.lanternwick.sera","region":"region.duskmoor-slice","journalSummary":"Sera's forge has gone dark. She needs a fire-seed from Auntie Reeve to wake it, but Reeve is keeping the fire out on purpose.","motivation":"A smith with no fire is only half herself, and the two loneliest women on the hill are each too proud to say why they visit.","stages":[{"id":"s1","objective":"Coax a fire-seed out of Auntie Reeve","hint":"Reeve keeps her tonics in the square. She will not part with the seed for the asking - find her the real reason.","trigger":{"type":"item","item":"item.forge-seed"},"marker":{"npc":"npc.lanternwick.reeve"},"effects":[]},{"id":"s2","objective":"Bring the forge-seed to Sera and wake the forge","hint":"Sera works the cold forge up the hill, east of the square.","trigger":{"type":"talk","npc":"npc.lanternwick.sera","req":["flag:forge_kindled"]},"marker":{"npc":"npc.lanternwick.sera"},"effects":[]}],"rewards":[{"give":"item.kindled-charm","n":1},{"embers":20}],"continuity":[{"set":{"forge_relit":true}},{"set":{"charm_upgrades":true}}]},"q.side.duskmoor.missing-lamb":{"id":"q.side.duskmoor.missing-lamb","title":"The Lamb in the Bog","category":"side","giver":"npc.lanternwick.brand","region":"region.duskmoor-slice","journalSummary":"A lamb vanishes from Brand's fold each night through a shut gate, found fed and calm in the south bog. Something out there is tending it, not eating it.","motivation":"The taker is no wolf. It is a shepherd who died in the first Dusk winter and never stopped doing his rounds - and he is owed a kindness, not a fight.","stages":[{"id":"s1","objective":"Ask Tamsin what walks the moor at night","hint":"Tamsin keeps the fold with Brand, up in the north pasture. She does the noticing.","trigger":{"type":"item","item":"item.shepherds-crook"},"marker":{"npc":"npc.lanternwick.tamsin"},"effects":[]},{"id":"s2","objective":"Take the crook to the south bog and offer it back","hint":"Do not fight him. Hold the crook out and let him take it. Tamsin will walk you there.","trigger":{"type":"flag","flag":"crook_offered"},"marker":{"npc":"npc.lanternwick.tamsin"},"effects":[]}],"rewards":[{"give":"item.shepherds-charm","n":1},{"embers":15}],"continuity":[{"set":{"lamb_home":true}},{"set":{"shepherd_at_rest":true}}]},"q.side.duskmoor.postal":{"id":"q.side.duskmoor.postal","title":"The Long Road Post","category":"side","giver":"npc.lanternwick.poll","region":"region.duskmoor-slice","journalSummary":"Poll runs the kids' letter-network across the moor to Runner Tock. She handed us her satchel to carry - and one letter in it has no name on it.","motivation":"The unnamed letter is Poll's own: a plea, in her hand, begging to be let past the village edge with the runners. She never had anyone to give it to.","stages":[{"id":"s1","objective":"Sort through Poll's satchel","hint":"Poll waits in the square. Look through the letters she gave you - all of them.","trigger":{"type":"flag","flag":"letter_unnamed_read"},"marker":{"npc":"npc.lanternwick.poll"},"effects":[]},{"id":"s2","objective":"Give Poll her own letter back","hint":"The unnamed letter is hers. Hand it back, and speak for her to the ones who decide.","trigger":{"type":"talk","npc":"npc.lanternwick.poll","req":["flag:spoke_for_poll"]},"marker":{"npc":"npc.lanternwick.poll"},"effects":[]}],"rewards":[{"give":"item.moor-walkers-charm","n":1},{"embers":15}],"continuity":[{"set":{"poll_runner":true}},{"set":{"kids_network_seeded":true}},{"take":"item.letter-satchel"}]},"q.side.gloamwood.silent-station":{"id":"q.side.gloamwood.silent-station","title":"The Silent Station","category":"side","giver":"npc.gloamwood.isolde","region":"region.gloamwood","journalSummary":"Isolde and Fennick have stopped finishing each other's sentences. A cinder-rot has crept into the waystation's moth colony - burn it out and the pair may mend.","motivation":"Thirty years the moth-tenders spoke as one voice. The cinder-ash that poisoned the Mothqueen now gnaws the colony that taught them - neither will name it.","stages":[{"id":"s1","objective":"Ask Fennick to take you up to the moth-loft","hint":"Fennick keeps the far lamp at the waystation clearing. He can't leave the lamps dark, but he'll climb the loft-stair with you.","trigger":{"type":"flag","flag":"silent_station_toloft"},"marker":{"npc":"npc.gloamwood.fennick"},"effects":[{"teleport":{"region":"region.gloamwood-waystation-interior","x":11,"y":11,"facing":"up"}}]},{"id":"s2","objective":"Burn the cinder-rot from the colony's heart-frame","hint":"The blighted heart-frame hangs over the coals in the loft. Put your lantern to the black rind and burn it clean.","trigger":{"type":"flag","flag":"silent_station_cured"},"marker":{},"effects":[]},{"id":"s3","objective":"Return to Isolde and hear if the quiet has lifted","hint":"Isolde keeps the near lamp at the waystation clearing, down the loft-stair.","trigger":{"type":"talk","npc":"npc.gloamwood.isolde","req":["flag:silent_station_cured"]},"marker":{"npc":"npc.gloamwood.isolde"},"effects":[]}],"rewards":[{"give":"item.glowmoth-jar","n":1},{"embers":15}],"continuity":[{"set":{"silent_station_done":true}},{"light-radius":1}]}},"regions":{"region.duskmoor-slice":{"id":"region.duskmoor-slice","name":"Lanternwick Square","tileset":"duskmoor","music":"music.duskmoor","palette":"duskmoor","width":60,"height":40,"map":["############################################################","#..........................................................#","#....t............t.K.......................ffffffff.......#","#.......................t...................fGGGGGGft......#","#...........................................fGGGGGGf.......#","#.........BBBBBB......................BBBBBBffffffff.......#","#.........BBBBBB.\"\"...................BBBBBB...............#","#.........BBBBBB......................BBBBBB...............#","#.........BBBBBB......................BBBBBB.....\"\"........#","#.........BBBBBB......................BBBBBB...............#","#...........bb...........................bb................#","#...........bb...........................bb................#","#...........bb...........................bb............t...#","#...........bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb................#","#......t.....................,,,,,,,,,.....................#","#..........................L,,,,,,,,,,,,...................#","#.........................,,,,,,,,,,,,,,,..................#","#.....BBBBBB..............,,,,,,,S,,,,,,,.....T............#","#.....BBBBBB..............,,W,,,,,,,,,,,,..................#","#.....BBBBBB..............,,,,,,,,,,,,,,,..................#","#.....BBBBBB...............,,,,,,,,,,,,L...................#","#.....BBBBBB.................,,,,,,,,,.....................#","#........bbbbbbbbbbbbbbbbbbbbbbb...........................#","#.............................bb....................bbbbbbbb","#..t........................   <script>
// ===== src/art/kit.js =====
// A00 — THE CRUNCH KIT. The visual identity of Shattered Sun.
// Integer-grid primitives, 5-step hue-shifted ramps, dither, speckle, ridges,
// stepped square glow, rim-light, dark-violet outline, and a 6x8 bitmap font.
// Every sprite in the game is built from these primitives. No runtime
// gradients on sprites; no shadowBlur; no smooth radials. See docs/art-bible.md.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});

  // ---- color math -------------------------------------------------------
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    return { r: parseInt(hex.slice(0, 2), 16), g: parseInt(hex.slice(2, 4), 16), b: parseInt(hex.slice(4, 6), 16) };
  }
  function rgbToHex(r, g, b) {
    const h = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
    return '#' + h(r) + h(g) + h(b);
  }
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0; const l = (max + min) / 2;
    const d = max - min;
    if (d !== 0) {
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return { h, s, l };
  }
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
  }
  // shortest-path hue lerp toward a target hue by t (0..1)
  function lerpHue(h, target, t) {
    let d = ((target - h + 540) % 360) - 180;
    return h + d * t;
  }
  const clamp01 = v => Math.max(0, Math.min(1, v));

  const DUSK_VIOLET = 268;   // shadows shift toward here
  const WARM = 38;           // highlights shift toward here (lantern amber)

  // ramp(base) -> 5 hue-shifted steps. NEVER flat-lightness ramps.
  function ramp(base) {
    const { r, g, b } = hexToRgb(base);
    const { h, s, l } = rgbToHsl(r, g, b);
    function step(dl, hueTarget, hueAmt, dSat) {
      const nh = lerpHue(h, hueTarget, hueAmt);
      const ns = clamp01(s + (dSat || 0));
      const nl = clamp01(l + dl);
      const c = hslToRgb(nh, ns, nl);
      return rgbToHex(c.r, c.g, c.b);
    }
    return {
      out:  step(-0.42, DUSK_VIOLET, 0.55, 0.06),  // deepest dusk-violet shadow
      lo:   step(-0.20, DUSK_VIOLET, 0.28, 0.04),  // slight violet
      mid:  base,                                  // true tone
      hi:   step(+0.18, WARM, 0.30, 0.02),         // warm highlight
      spec: step(+0.34, WARM, 0.55, 0.10),         // near lantern-warm spec
    };
  }

  // ---- seeded rng -------------------------------------------------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- primitives -------------------------------------------------------
  function pxRect(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
  }

  // checkerboard two-tone fill (hard crunch texture)
  function dither(ctx, x, y, w, h, colA, colB) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        ctx.fillStyle = ((i + j) & 1) ? colB : colA;
        ctx.fillRect(x + i, y + j, 1, 1);
      }
    }
  }

  // 2x2 ordered dither of a single color at a density 0..1 (soft-shadow falloff)
  const BAYER2 = [[0, 2], [3, 1]];
  function dither2(ctx, x, y, w, h, color, density) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    const thr = clamp01(density) * 4;
    ctx.fillStyle = color;
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        if (BAYER2[j & 1][i & 1] < thr) ctx.fillRect(x + i, y + j, 1, 1);
      }
    }
  }

  // seeded speckle grain across a rect using a palette of colors
  function pxNoise(ctx, x, y, w, h, colors, seed, density) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    const rnd = mulberry32((seed || 1) >>> 0);
    const d = density == null ? 0.25 : density;
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        if (rnd() < d) {
          ctx.fillStyle = colors[(rnd() * colors.length) | 0];
          ctx.fillRect(x + i, y + j, 1, 1);
        }
      }
    }
  }

  // pxBlock: outline + lit cap + dithered midriff + shadow belly. The bread &
  // butter of crunchy solids (used for cottages, chests, tile edges, HUD).
  function pxBlock(ctx, x, y, w, h, r) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    const capH = Math.max(1, Math.round(h * 0.28));
    const midH = Math.max(1, Math.round(h * 0.42));
    pxRect(ctx, x, y, w, capH, r.hi);                 // lit cap
    dither(ctx, x, y + capH, w, midH, r.mid, r.lo);   // dithered midriff
    pxRect(ctx, x, y + capH + midH, w, h - capH - midH, r.out); // shadow belly
    // 1px spec kiss on the top edge
    pxRect(ctx, x + 1, y, w - 2, 1, r.spec);
    outlineRect(ctx, x, y, w, h, r.out);
  }

  // stepped ridge silhouette (skylines / parallax hills), seeded
  function pxRidge(ctx, x, y, w, h, r, seed, step) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    step = step || 3;
    const rnd = mulberry32((seed || 7) >>> 0);
    let level = Math.round(h * 0.5);
    for (let i = 0; i < w; i += step) {
      level += Math.round((rnd() - 0.5) * 4);
      if (level < 2) level = 2; if (level > h - 1) level = h - 1;
      const top = y + h - level;
      pxRect(ctx, x + i, top, step, level, r.lo);
      pxRect(ctx, x + i, top, step, 1, r.mid);   // lit crest
    }
  }

  // stepped SQUARE glow — hard radial banding, never a smooth radial gradient.
  // draws concentric squares darkening outward from color to transparent.
  function pxGlowSq(ctx, cx, cy, radius, color, steps) {
    cx |= 0; cy |= 0; radius |= 0; steps = steps || 5;
    const { r, g, b } = hexToRgb(color);
    for (let s = steps; s >= 1; s--) {
      const t = s / steps;
      const rad = Math.round(radius * t);
      const a = (1 - t) * (1 - t) * 0.85 + 0.05; // brighter at core, banded
      ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${a.toFixed(3)})`;
      ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    }
  }

  // 1px dark-violet outline around opaque pixels of a canvas (returns same canvas)
  function outline(canvas, color) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const src = ctx.getImageData(0, 0, w, h);
    const dst = ctx.createImageData(w, h);
    dst.data.set(src.data);
    const { r, g, b } = hexToRgb(color);
    const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src.data[(y * w + x) * 4 + 3];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (src.data[i + 3] === 0) {
          if (A(x - 1, y) || A(x + 1, y) || A(x, y - 1) || A(x, y + 1)) {
            dst.data[i] = r; dst.data[i + 1] = g; dst.data[i + 2] = b; dst.data[i + 3] = 255;
          }
        }
      }
    }
    ctx.putImageData(dst, 0, 0);
    return canvas;
  }
  function outlineRect(ctx, x, y, w, h, color) {
    pxRect(ctx, x, y, w, 1, color);
    pxRect(ctx, x, y + h - 1, w, 1, color);
    pxRect(ctx, x, y, 1, h, color);
    pxRect(ctx, x + w - 1, y, 1, h, color);
  }

  // rim(sprite, dir): bake a warm 1px rim-light on the lit side. dir: 'l'|'r'.
  // Returns a NEW canvas so callers keep both plain + rim variants.
  function rim(canvas, dir, color) {
    const w = canvas.width, h = canvas.height;
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const octx = out.getContext('2d');
    octx.drawImage(canvas, 0, 0);
    const sctx = canvas.getContext('2d');
    const src = sctx.getImageData(0, 0, w, h);
    const img = octx.getImageData(0, 0, w, h);
    const { r, g, b } = hexToRgb(color || '#f4d38c');
    const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src.data[(y * w + x) * 4 + 3];
    const dx = dir === 'r' ? 1 : -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (src.data[i + 3] > 0 && A(x + dx, y) === 0) {
          // lit-side edge pixel — warm it
          img.data[i] = (img.data[i] + r) >> 1;
          img.data[i + 1] = (img.data[i + 1] + g) >> 1;
          img.data[i + 2] = (img.data[i + 2] + b) >> 1;
          img.data[i + 3] = 255;
        }
        // top edge also catches light
        if (src.data[i + 3] > 0 && A(x, y - 1) === 0) {
          img.data[i] = Math.min(255, img.data[i] + r * 0.4);
          img.data[i + 1] = Math.min(255, img.data[i + 1] + g * 0.4);
          img.data[i + 2] = Math.min(255, img.data[i + 2] + b * 0.4);
        }
      }
    }
    octx.putImageData(img, 0, 0);
    return out;
  }

    const w = canvas.width, h = canvas.height;
    const out = document.createElement('canvas');
    out.width = w; out.height = h;

    octx.drawImage(canvas, 0, 0);
    const img = octx.getImageData(0, 0, w, h);
    const { r, g, b } = hexToRgb(color || '#e8ecf1');
    for (let i = 0; i < img.data.length; i += 4) {
      if (img.data[i + 3] > 0) { img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; }
    }
    octx.putImageData(img, 0, 0);

  const FONT = { cw: 6, ch: 8, gw: 5, gh: 7, atlas: null, ready: false, tint: {} };
  function bakeFont() {
    const codes = [];
    for (let c = 32; c <= 126; c++) codes.push(String.fromCharCode(c));
    const atlas = makeCanvas(FONT.cw * codes.length, FONT.ch);
    const ctx = atlas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    codes.forEach((ch, idx) => {
      const g = GLYPHS[ch] || GLYPHS['?'];
      const ox = idx * FONT.cw;
      for (let y = 0; y < FONT.gh; y++) {
        const row = g[y];
        for (let x = 0; x < FONT.gw; x++) {
          if (row[x] === '#') ctx.fillRect(ox + x, y, 1, 1);
        }
      }
    });
    FONT.atlas = atlas;
    FONT.ready = true;
  }
  // tinted copy of the white font atlas, cached per color
  function tintedFont(color) {
    if (FONT.tint[color]) return FONT.tint[color];
    const src = FONT.atlas;
    const c = makeCanvas(src.width, src.height);
    const cx = c.getContext('2d');
    cx.drawImage(src, 0, 0);
    cx.globalCompositeOperation = 'source-in';
    cx.fillStyle = color;
    cx.fillRect(0, 0, c.width, c.height);
    cx.globalCompositeOperation = 'source-over';
    FONT.tint[color] = c;
    return c;
  }
  function textWidth(str, scale) {
    scale = scale || 1;
    return str.length * FONT.cw * scale;
  }
  // draw text from the bitmap atlas — NO system fonts anywhere in-game.
  function text(ctx, str, x, y, color, scale) {
    scale = scale || 1;
    x |= 0; y |= 0;
    const atlas = tintedFont(color || '#e8ecf1');
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code < 32 || code > 126) continue;
      const sx = (code - 32) * FONT.cw;
      ctx.drawImage(atlas, sx, 0, FONT.cw, FONT.ch, x + i * FONT.cw * scale, y, FONT.cw * scale, FONT.ch * scale);
    }
  }
  // word-wrap into lines that fit maxWidthPx (used by dialogue)
  function wrap(str, maxWidthPx, scale) {
    scale = scale || 1;
    const words = String(str).split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (textWidth(test, scale) > maxWidthPx && line) { lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

// ===== src/engine/math.js =====
// Math helpers. Allocation-free where it matters (hot loops call clamp/len only).
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
  const len = (x, y) => Math.sqrt(x * x + y * y);
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
  // 4-dir from a stick/dpad vector; returns 'down'|'up'|'left'|'right' or null
  function dir4(dx, dy) {
    if (dx === 0 && dy === 0) return null;
    return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
  }
  const DIR_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  SS.math = { clamp, lerp, sign, len, dist2, dir4, DIR_VEC };
})();


// ===== src/engine/pools.js =====
// E05 helper — object pools so hot loops allocate ZERO objects per frame.
// A pool owns a fixed backing array of pre-constructed slots; obtain() returns
// a dead slot (marked alive), release()/sweep recycle. Iterate with forEach.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});

  class Pool {
    constructor(size, factory, reset) {
      this.items = new Array(size);
      this.reset = reset;
      for (let i = 0; i < size; i++) { const o = factory(); o.alive = false; this.items[i] = o; }
      this.max = size;
      this.liveCount = 0;
    }
    obtain() {
      const items = this.items;
      for (let i = 0; i < items.length; i++) {
        if (!items[i].alive) {
          const o = items[i];
          if (this.reset) this.reset(o);
          o.alive = true;
          this.liveCount++;
          return o;
        }
      }
      return null; // pool exhausted — hot path never grows the array
    }
    release(o) { if (o.alive) { o.alive = false; this.liveCount--; } }
    forEach(fn) {
      const items = this.items;
      for (let i = 0; i < items.length; i++) if (items[i].alive) fn(items[i], i);
    }
    clear() { const items = this.items; for (let i = 0; i < items.length; i++) items[i].alive = false; this.liveCount = 0; }
  }

  SS.Pool = Pool;
})();


// ===== src/engine/input.js =====
// E03 — Input. House control law:
//  - ArcadeController (loaded from the shell) used when present, every use
//    guarded with `if (window.ArcadeController)`; deterministic own-edge
//    detection at fixed step; standard-mapping navigator.getGamepads fallback.
//  - pad(0)=P1 Kes, pad(1)=P2 Fin. Press-events for menu/action edges,
//    polling for movement. START=pause, South=confirm.
//  - NEVER binds SELECT+START held together, nor the PS/home button.
//  - Keyboard P1 (arrows/WASD + Z=South + X=East + Enter=START) and
//    P2 (IJKL + N=South + M=East). Touch: virtual stick + 2 buttons,
//    visible only on touch devices, drives P1.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

  const BTN = { south: 0, east: 1, west: 2, north: 3, l1: 4, r1: 5, l2: 6, r2: 7,
    select: 8, start: 9, l3: 10, r3: 11, up: 12, down: 13, left: 14, right: 15, home: 16 };
  const BTN_NAMES = Object.keys(BTN);
  const DEAD = 0.30;

  // action -> gamepad button name. (home/select+start intentionally unmapped.)
  const ACT_BTN = { confirm: 'south', attack: 'south', cancel: 'east', roll: 'east',
    item: 'north', pause: 'start', join: 'south' };

  // Keyboard: per-player key -> action(s). Movement handled by held-key polling.
  const KEY_P1 = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    KeyZ: 'south', KeyX: 'east', KeyC: 'north', Enter: 'start',
  };
  const KEY_P2 = {
    KeyI: 'up', KeyK: 'down', KeyJ: 'left', KeyL: 'right',
    KeyN: 'south', KeyM: 'east',
  };

  // per-player fixed-step button snapshots
  const pads = [newSnap(), newSnap()];
  function newSnap() { return { connected: false, curr: new Array(17).fill(false), prev: new Array(17).fill(false), lx: 0, ly: 0 }; }

  // keyboard held + edge sets (edges cleared each update())
  const kbDown = new Set();       // physical codes currently held
  const kbEdge = new Set();       // codes pressed since last update()
  let touchDevice = false;

  // ---- menu navigation edges (E13) ---------------------------------------
  // Debounced directional press-events for menus, derived from the SAME sources
  // axis() aggregates (dpad buttons, analog stick past a hysteresis threshold,
  // keyboard arrows/WASD/IJKL, touch stick) so every menu is navigable on every
  // device. Computed at the fixed step — deterministic own-edge, exactly like
  // the button edges, never read per-rAF. Each push yields ONE edge; holding
  // past NAV_DELAY steps then auto-repeats every NAV_RATE steps. The delay is
  // wide enough that a short discrete tap can never auto-repeat, so a fixed-hold
  // press moves a menu by exactly one step regardless of how many update steps
  // a throttled rAF batches (the harness relies on this determinism).
  const NAV_ON = 0.55, NAV_OFF = 0.35;   // analog hysteresis (enter / release)
  const NAV_DELAY = 45, NAV_RATE = 7;    // fixed steps before / between repeats
  const nav = [newNav(), newNav()];
  function newNav() {
    return {
      up:    { on: false, t: 0, edge: false },
      down:  { on: false, t: 0, edge: false },
      left:  { on: false, t: 0, edge: false },
      right: { on: false, t: 0, edge: false },
      latchX: 0, latchY: 0,               // hysteresis latch of the analog axes
    };
  }
  // hysteresis latch: fires (-1/1) once the axis crosses NAV_ON, releases to 0
  // only after it returns inside NAV_OFF — one edge per analog push, no storms.
  function navLatch(latch, v) {
    if (latch === 0) return v > NAV_ON ? 1 : v < -NAV_ON ? -1 : 0;
    if (latch > 0) return v < NAV_OFF ? 0 : 1;
    return v > -NAV_OFF ? 0 : -1;
  }
  function navDir(st, raw) {
    st.edge = false;
    if (raw) {
      if (!st.on) { st.on = true; st.t = 0; st.edge = true; }       // rising edge
      else if (++st.t >= NAV_DELAY && (st.t - NAV_DELAY) % NAV_RATE === 0) st.edge = true;
    } else { st.on = false; st.t = 0; }
  }
  function updateNav() {
    for (let p = 0; p < 2; p++) {
      const n = nav[p], snap = pads[p];
      const lx = snap.connected ? snap.lx : 0, ly = snap.connected ? snap.ly : 0;
      n.latchX = navLatch(n.latchX, lx);
      n.latchY = navLatch(n.latchY, ly);
      const tdx = (p === 0 && touch.active) ? touch.dx : 0;
      const tdy = (p === 0 && touch.active) ? touch.dy : 0;
      navDir(n.left,  padDown(p, 'left')  || kbHeld(p, 'left')  || n.latchX < 0 || tdx < -0.5);
      navDir(n.right, padDown(p, 'right') || kbHeld(p, 'right') || n.latchX > 0 || tdx > 0.5);
      navDir(n.up,    padDown(p, 'up')    || kbHeld(p, 'up')    || n.latchY < 0 || tdy < -0.5);
      navDir(n.down,  padDown(p, 'down')  || kbHeld(p, 'down')  || n.latchY > 0 || tdy > 0.5);
    }
  }

  // ---- gamepad reading (ArcadeController-preferred, fallback to raw) ----
  function readLogical(logical) {
    if (window.ArcadeController) {
      const p = window.ArcadeController.pad(logical);
      if (p && p.connected) {
        const curr = new Array(17).fill(false);
        for (const name of BTN_NAMES) curr[BTN[name]] = !!p.button(name);
        return { connected: true, curr, lx: p.axis('lx') || 0, ly: p.axis('ly') || 0 };
      }
      return null;
    }
    return readRaw(logical);
  }
  // fallback: standard-mapping pads in connection order
  function readRaw(logical) {
    const gps = (navigator.getGamepads && navigator.getGamepads()) || [];
    const connected = [];
    for (const g of gps) if (g && g.connected && g.mapping === 'standard') connected.push(g);
    const g = connected[logical];
    if (!g) return null;
    const curr = new Array(17).fill(false);
    for (let i = 0; i < g.buttons.length && i < 17; i++) curr[i] = g.buttons[i].pressed || g.buttons[i].value > 0.5;
    const ax = g.axes || [];
    return { connected: true, curr, lx: ax[0] || 0, ly: ax[1] || 0 };
  }

  // ---- fixed-step update: snapshot pad edges, then clear kb edges --------
  function update() {
    for (let p = 0; p < 2; p++) {
      const snap = pads[p];
      snap.prev = snap.curr;
      const read = readLogical(p);
      if (read) {
        snap.connected = true; snap.curr = read.curr; snap.lx = read.lx; snap.ly = read.ly;
      } else {
        snap.connected = false; snap.curr = new Array(17).fill(false); snap.lx = 0; snap.ly = 0;
      }

  }
  function endFrame() { kbEdge.clear(); } // call AFTER states consumed edges

  // ---- queries -----------------------------------------------------------

  // held button on pad p
  function padDown(p, name) { return pads[p].curr[BTN[name]]; }
  // edge (this-step) on pad p
  function padJust(p, name) { const i = BTN[name]; return pads[p].curr[i] && !pads[p].prev[i]; }

  // keyboard held for player p action-name
  function kbHeld(p, actName) {
    const map = p === 0 ? KEY_P1 : KEY_P2;
    for (const code in map) if (map[code] === actName && kbDown.has(code)) return true;
    return false;
  }
  function kbJust(p, actName) {
    const map = p === 0 ? KEY_P1 : KEY_P2;

  // movement vector for player p (analog + dpad + keyboard + touch stick)

      if (Math.abs(snap.ly) > DEAD) y += snap.ly;
      if (padDown(p, 'left')) x -= 1; if (padDown(p, 'right')) x += 1;
      if (padDown(p, 'up')) y -= 1; if (padDown(p, 'down')) y += 1;
    }
    if (kbHeld(p, 'left')) x -= 1; if (kbHeld(p, 'right')) x += 1;
    if (kbHeld(p, 'up')) y -= 1; if (kbHeld(p, 'down')) y += 1;
    if (p === 0 && touch.active) { x += touch.dx; y += touch.dy; }
    x = clamp(x, -1, 1); y = clamp(y, -1, 1);
    return { x, y };
  }

  // edge for a semantic action for player p (press-event stream)
  function pressed(p, action) {
    // menu directions: debounced own-edge computed in updateNav() (see above)
    const n = nav[p][action];
    if (n) return n.edge;
    const btn = ACT_BTN[action];
    if (btn && padJust(p, btn)) return true;
    // keyboard: map action -> south/east/north/start
    const keyName = action === 'confirm' || action === 'attack' || action === 'join' ? 'south'
      : action === 'cancel' || action === 'roll' ? 'east'
      : action === 'item' ? 'north'
      : action === 'pause' ? 'start' : null;
    if (keyName && kbJust(p, keyName)) return true;
    if (p === 0 && action === 'confirm' && touch.btnA.justPressed) return true;
    if (p === 0 && action === 'attack' && touch.btnA.justPressed) return true;
    if (p === 0 && action === 'roll' && touch.btnB.justPressed) return true;
    if (p === 0 && action === 'pause' && touch.pause.justPressed) return true;
    return false;
  }
  // held semantic action (hold-to-skip cutscene, hold-to-revive)
  function down(p, action) {
    const n = nav[p][action];
    if (n) return n.on;          // menu direction currently held (any source)
    const btn = ACT_BTN[action];
    if (btn && padDown(p, btn)) return true;
    const keyName = action === 'confirm' || action === 'attack' ? 'south'
      : action === 'cancel' || action === 'roll' ? 'east'
      : action === 'item' ? 'north' : action === 'pause' ? 'start' : null;
    if (keyName && kbHeld(p, keyName)) return true;
    if (p === 0 && (action === 'confirm' || action === 'attack') && touch.btnA.down) return true;
    if (p === 0 && action === 'roll' && touch.btnB.down) return true;
    return false;
  }
  // either player edge (menus / global skip)
  function anyPressed(action) { return pressed(0, action) || pressed(1, action); }

  function inputSource() {
    if (window.ArcadeController && window.ArcadeController.currentInputSource)
      return window.ArcadeController.currentInputSource();
    if (pads[0].connected || pads[1].connected) return 'gamepad';
    if (touchDevice) return 'touch';
    return 'keyboard';
  }

  // ---- touch: virtual stick (left) + 2 buttons (right) + pause -----------
  const touch = {
    active: false, dx: 0, dy: 0,
    stickId: null, sx: 0, sy: 0,
    btnA: zone(), btnB: zone(), pause: zone(),
  };
  function zone() { return { down: false, justPressed: false, _id: null, x: 0, y: 0, r: 0 }; }

  // touch layout in DISPLAY pixels (1280x720); recomputed on resize
  const T = { stickCx: 150, stickCy: 560, stickR: 90,
    aX: 1120, aY: 540, bX: 1030, bY: 610, btnR: 52,
    pauseX: 1230, pauseY: 40, pauseR: 34 };
  function layoutTouch(w, h) {
    T.stickCx = 150; T.stickCy = h - 160; T.stickR = 90;
    T.aX = w - 160; T.aY = h - 180; T.bX = w - 250; T.bY = h - 110; T.btnR = 52;
    T.pauseX = w - 50; T.pauseY = 40; T.pauseR = 34;
    touch.btnA.x = T.aX; touch.btnA.y = T.aY; touch.btnA.r = T.btnR;
    touch.btnB.x = T.bX; touch.btnB.y = T.bY; touch.btnB.r = T.btnR;
    touch.pause.x = T.pauseX; touch.pause.y = T.pauseY; touch.pause.r = T.pauseR;
  }
  function hit(z, x, y) { const dx = x - z.x, dy = y - z.y; return dx * dx + dy * dy <= z.r * z.r; }

  function onTouchStart(e) {
    touchDevice = true;
    for (const t of e.changedTouches) {
      const { x, y } = toDisplay(t);
      if (x < T.stickCx + T.stickR * 2 && touch.stickId == null) {
        touch.stickId = t.identifier; touch.sx = x; touch.sy = y; touch.active = true; touch.dx = 0; touch.dy = 0;
        continue;
      }
      for (const z of [touch.btnA, touch.btnB, touch.pause]) {
        if (z._id == null && hit(z, x, y)) { z._id = t.identifier; z.down = true; z.justPressed = true; }
      }
    }
    if (e.cancelable) e.preventDefault();
  }
  function onTouchMove(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.stickId) {
        const { x, y } = toDisplay(t);
        let dx = (x - touch.sx) / T.stickR, dy = (y - touch.sy) / T.stickR;
        const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
        touch.dx = Math.abs(dx) > 0.25 ? dx : 0; touch.dy = Math.abs(dy) > 0.25 ? dy : 0;
      }
    }
    if (e.cancelable) e.preventDefault();
  }
  function onTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.stickId) { touch.stickId = null; touch.active = false; touch.dx = 0; touch.dy = 0; }
      for (const z of [touch.btnA, touch.btnB, touch.pause]) if (z._id === t.identifier) { z._id = null; z.down = false; }
    }
  }
  let displayCanvas = null;
  function toDisplay(t) {
    const r = displayCanvas.getBoundingClientRect();
    return { x: (t.clientX - r.left) / r.width * displayCanvas.width, y: (t.clientY - r.top) / r.height * displayCanvas.height };
  }
  // clear per-step touch edges (called at endFrame)
  function clearTouchEdges() { touch.btnA.justPressed = touch.btnB.justPressed = touch.pause.justPressed = false; }

  // draw the virtual controls (only on touch devices) — bitmap font labels
  function drawTouch(ctx) {
    if (!touchDevice) return;
    const kit = SS.kit;
    ctx.save();
    ctx.globalAlpha = 0.55;
    // stick base
    ringSquare(ctx, T.stickCx, T.stickCy, T.stickR, '#1a1526');
    ringSquare(ctx, T.stickCx + touch.dx * T.stickR * 0.5, T.stickCy + touch.dy * T.stickR * 0.5, T.stickR * 0.45, '#f4d38c');
    // buttons
    ringSquare(ctx, touch.btnA.x, touch.btnA.y, T.btnR, touch.btnA.down ? '#ff9a3c' : '#2a2136');
    ringSquare(ctx, touch.btnB.x, touch.btnB.y, T.btnR, touch.btnB.down ? '#ff9a3c' : '#2a2136');
    ringSquare(ctx, touch.pause.x, touch.pause.y, T.pauseR, '#2a2136');
    ctx.globalAlpha = 1;
    kit.font.text(ctx, 'A', touch.btnA.x - 6, touch.btnA.y - 8, '#f4d38c', 2);
    kit.font.text(ctx, 'B', touch.btnB.x - 6, touch.btnB.y - 8, '#f4d38c', 2);
    kit.font.text(ctx, '||', touch.pause.x - 6, touch.pause.y - 4, '#f4d38c', 1);
    ctx.restore();
  }
  function ringSquare(ctx, cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.fillRect((cx - r) | 0, (cy - r) | 0, (r * 2) | 0, (r * 2) | 0);
    SS.kit.outlineRect(ctx, (cx - r) | 0, (cy - r) | 0, (r * 2) | 0, (r * 2) | 0, '#0d0a14');
  }

  function init(canvas) {
    displayCanvas = canvas;
    touchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    layoutTouch(canvas.width, canvas.height);
    window.addEventListener('keydown', e => {
      const code = e.code;
      if (KEY_P1[code] || KEY_P2[code]) {
        if (!e.repeat) kbEdge.add(code);
        kbDown.add(code);
        e.preventDefault();
      }
    }, { capture: true });
    window.addEventListener('keyup', e => { kbDown.delete(e.code); }, { capture: true });
    window.addEventListener('blur', () => { kbDown.clear(); });
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
  }

  SS.Input = {
    init, update, endFrame: () => { endFrame(); clearTouchEdges(); },
    axis, pressed, down, anyPressed, padConnected, inputSource, drawTouch, layoutTouch,
    isTouchDevice: () => touchDevice,
    // test seam: harness reads these to ASSERT outcomes (never to drive mechanics)
    _debug: { pads, kbDown },
  };
})();


// ===== src/engine/audio.js =====
// Audio — WebAudio synth engine (E10). The AudioContext is created LAZILY on
// the first real player gesture (via unlock(), wired in main.js and the
// title/save states) and every WebAudio call is wrapped so a missing,
// suspended, or muted context degrades to silence and NEVER throws. That
// keeps the headless --mute-audio harness clean (zero console errors) and
// satisfies the "no context before input" rule.
//
// Structure:
//   destination
//     └─ masterGain (respects mute + ss_vol_master)
//          ├─ musicGain (ss_vol_music)  ← sequencer voices
//          └─ sfxGain   (ss_vol_sfx)    ← one-shot cues + dialogue blips
//
// The music sequencer is a lookahead scheduler: a 25ms setInterval walks a
// pre-computed per-voice step grid and schedules note onsets ~120ms ahead on
// the audio clock, so loops are seamless and the render thread never
// allocates oscillators per frame.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});

  let ctx = null, masterGain = null, musicGain = null, sfxGain = null;
  let noiseBuffer = null, muted = false, unlocked = false;
  let music = null, timer = null;
  const LOOKAHEAD = 0.12;      // seconds scheduled ahead of the audio clock
  const TICK_MS = 25;          // scheduler wake interval

  // ---- persisted volumes (read at load; no context needed) ---------------
  const DEFAULTS = { master: 0.6, music: 0.5, sfx: 0.8 };
  const KEY = { master: 'ss_vol_master', music: 'ss_vol_music', sfx: 'ss_vol_sfx' };
  const vol = { master: DEFAULTS.master, music: DEFAULTS.music, sfx: DEFAULTS.sfx };
  (function readVolumes() {
    for (const k in KEY) {
      try {
        const raw = localStorage.getItem(KEY[k]);
        if (raw != null) { const v = parseFloat(raw); if (isFinite(v)) vol[k] = Math.max(0, Math.min(1, v)); }
      } catch (e) {}
    }
  })();

  // ---- lazy context -------------------------------------------------------
  function ensure() {
    if (ctx) return ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      masterGain = ctx.createGain();
      masterGain.gain.value = muted ? 0 : vol.master;
      masterGain.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = vol.music; musicGain.connect(masterGain);
      sfxGain = ctx.createGain(); sfxGain.gain.value = vol.sfx; sfxGain.connect(masterGain);
      // one shared white-noise buffer for percussive cues (built once)
      const len = Math.floor((ctx.sampleRate || 44100) * 0.4);
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate || 44100);
      const d = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
    return ctx;
  }

  // Call from a real input gesture: create + resume the context so audio is
  // permitted from here on. WHICH track plays is not decided here — the game
  // state machine owns that (states.js desiredMusic/applyMusic), so the same
  // gesture that unlocks audio kindles the title theme on the title/save-select
  // screens, the region theme in play, and the boss theme in the arena fight.
  function unlock() {
    unlocked = true;
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
  }

  const now = () => (ctx ? ctx.currentTime : 0);

  // ---- synth primitives (all silent unless the context is running) --------
  function note(freq, dur, type, gain, when, dest, glideTo) {
    if (muted || !ctx || ctx.state !== 'running' || !freq) return;
    try {
      const t = when || ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
      const peak = gain || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
      g.gain.setValueAtTime(peak, t + Math.max(0.006, dur - 0.05));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || sfxGain);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }

  function noiseHit(dur, gain, filterType, freq, when, dest) {
    if (muted || !ctx || ctx.state !== 'running' || !noiseBuffer) return;
    try {
      const t = when || ctx.currentTime;
      const s = ctx.createBufferSource(); s.buffer = noiseBuffer;
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      if (filterType) { const f = ctx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; s.connect(f); f.connect(g); }
      else s.connect(g);
      g.connect(dest || sfxGain);
      s.start(t); s.stop(t + dur + 0.02);
    } catch (e) {}
  }

  // ---- dialogue voice blips -----------------------------------------------
  // Each speaker voice maps to a distinct base pitch + waveform (dialogue.js
  // picks the voice per speaker). A tiny pitch wobble reads as speech.
  const VOICE = {
    default: { base: 330, type: 'square' },
    proverb: { base: 240, type: 'triangle' },   // Maren — low, warm
    bright:  { base: 470, type: 'square' },      // Sera — sharp
    kid:     { base: 560, type: 'square' },      // Fin / caravan kids — high
    old:     { base: 210, type: 'triangle' },    // elders — slow, deep
  };
  let blipTick = 0;
  function blip(voiceNote) {
    const v = VOICE[voiceNote] || VOICE.default;
    const f = v.base * (1 + ((blipTick++ % 3) - 1) * 0.04);
    note(f, 0.05, v.type, 0.06, 0, sfxGain);
  }

  // ---- one-shot SFX set ---------------------------------------------------
  // Short, distinct, non-fatiguing cues. Unknown names are a safe no-op.
  const SFX = {
    sword: () => { note(180, 0.10, 'sawtooth', 0.13); note(520, 0.06, 'square', 0.05); },
    sling: () => { note(720, 0.07, 'square', 0.08, 0, 0, 1180); },
    roll:  () => { note(150, 0.16, 'triangle', 0.09, 0, 0, 90); noiseHit(0.10, 0.04, 'lowpass', 600); },
    hit:   () => { note(90, 0.12, 'square', 0.12); },
    enemyHit: () => { note(210, 0.06, 'square', 0.10); noiseHit(0.06, 0.07, 'bandpass', 2200); },
    hurt:  () => { note(320, 0.20, 'sawtooth', 0.13, 0, 0, 150); noiseHit(0.08, 0.05, 'highpass', 1100); },
    select: () => { note(440, 0.05, 'square', 0.07); },
    confirm: () => { note(660, 0.08, 'square', 0.09); },
    join:  () => { const t = now(); note(523, 0.08, 'square', 0.10, t); note(784, 0.14, 'square', 0.08, t + 0.06); },
    chime: () => { const t = now(); note(880, 0.12, 'triangle', 0.10, t); note(1320, 0.22, 'triangle', 0.06, t + 0.05); },
    pickup: () => { const t = now(); note(660, 0.09, 'triangle', 0.10, t); note(990, 0.18, 'triangle', 0.08, t + 0.07); },
    menuOpen: () => { note(420, 0.07, 'triangle', 0.08, 0, 0, 650); },
    menuClose: () => { note(650, 0.07, 'triangle', 0.08, 0, 0, 400); },
    error: () => { const t = now(); note(180, 0.09, 'sawtooth', 0.10, t); note(120, 0.15, 'sawtooth', 0.10, t + 0.08); },
    questComplete: () => {
      const t = now();
      note(523, 0.12, 'triangle', 0.10, t);        // C5
      note(659, 0.12, 'triangle', 0.10, t + 0.09); // E5
      note(784, 0.12, 'triangle', 0.10, t + 0.18); // G5
      note(1047, 0.32, 'triangle', 0.12, t + 0.27); // C6
    },
  };
  SFX.deny = SFX.error;     // alias: rejected action
  function sfx(name) { const f = SFX[name]; if (f) f(); }

  // ---- music sequencer ----------------------------------------------------
  // Note-name → frequency (A4 = 440). Supports sharps/flats: "D2", "Bb2", "F#5".
  const SEMI = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
  function noteFreq(name) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
    if (!m) return 0;
    const semi = SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) - 4) * 12;
    return 440 * Math.pow(2, semi / 12);
  }

  // Expand a loop of [token, steps] cells into a step-grid: onset events at
  // their start step, nulls for rests and sustained continuations. Pre-parses
  // note frequencies so the scheduler hot path only reads objects.
  function buildGrid(loop, kind, stepDur) {
    const grid = [];
    (loop || []).forEach(cell => {
      const tok = cell[0], steps = Math.max(1, cell[1] | 0);
      let ev = null;
      if (!(tok === 0 || tok === '-' || tok == null)) {
        ev = kind === 'perc' ? { drum: String(tok), dur: steps * stepDur }
                             : { freq: noteFreq(String(tok)), dur: steps * stepDur };
      }
      grid.push(ev);
      for (let i = 1; i < steps; i++) grid.push(null);
    });
    return grid;
  }

  function buildTrack(id, t) {
    const tempo = t.tempo || 90;
    const stepDur = 60 / tempo / 4;   // one grid cell = a sixteenth note
    const voices = [];
    const L = t.loops || {};
    if (L.bass) voices.push({ kind: 'bass', grid: buildGrid(L.bass, 'bass', stepDur) });
    if (L.lead) voices.push({ kind: 'lead', grid: buildGrid(L.lead, 'lead', stepDur) });
    if (L.perc) voices.push({ kind: 'perc', grid: buildGrid(L.perc, 'perc', stepDur) });
    voices.forEach(v => { v.len = v.grid.length || 1; });
    return { id, voices, stepDur, stepCursor: 0, nextStepTime: 0 };
  }

  function playVoice(v, ev, when) {
    if (v.kind === 'perc') {
      if (ev.drum === 'k') note(120, 0.12, 'sine', 0.17, when, musicGain, 45);
      else if (ev.drum === 'h') noiseHit(0.035, 0.05, 'highpass', 7000, when, musicGain);
      else if (ev.drum === 's') noiseHit(0.13, 0.09, 'bandpass', 1800, when, musicGain);
    } else {
      const type = v.kind === 'bass' ? 'triangle' : 'triangle';
      const gain = v.kind === 'bass' ? 0.16 : 0.12;
      note(ev.freq, ev.dur, type, gain, when, musicGain);
    }
  }

  function scheduleStep(cursor, when) {
    for (let i = 0; i < music.voices.length; i++) {
      const v = music.voices[i];
      const ev = v.grid[cursor % v.len];
      if (ev) playVoice(v, ev, when);
    }
  }

  function tick() {
    if (!music || !ctx || ctx.state !== 'running') return;
    if (music.nextStepTime === 0) music.nextStepTime = ctx.currentTime + 0.05;
    // reschedule if the clock ran past our cursor (e.g. after a resume)
    if (music.nextStepTime < ctx.currentTime) music.nextStepTime = ctx.currentTime + 0.02;
    while (music.nextStepTime < ctx.currentTime + LOOKAHEAD) {
      scheduleStep(music.stepCursor, music.nextStepTime);
      music.stepCursor++;
      music.nextStepTime += music.stepDur;
    }
  }

  function startScheduler() { if (!timer) timer = setInterval(tick, TICK_MS); }

  function playMusic(id) {
    if (music && music.id === id) return;             // already playing it
    const track = window.CONTENT && window.CONTENT.music && window.CONTENT.music[id];
    if (!track) return;                               // unknown id: no-op
    music = buildTrack(id, track);
    // short fade-in (doubles as the swap "crossfade" when changing tracks)
    if (musicGain && ctx) {
      try {
        const t = ctx.currentTime;
        musicGain.gain.cancelScheduledValues(t);
        musicGain.gain.setValueAtTime(0.0001, t);
        musicGain.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol.music), t + 0.4);
      } catch (e) {}
    }
    startScheduler();
  }

  function stopMusic() {
    if (!music) return;
    if (musicGain && ctx) {
      try {
        const t = ctx.currentTime;
        musicGain.gain.cancelScheduledValues(t);
        musicGain.gain.setValueAtTime(musicGain.gain.value, t);
        musicGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      } catch (e) {}
    }
    music = null;
    if (timer) { clearInterval(timer); timer = null; }
  }

  // ---- volume settings (persisted) ----------------------------------------
  function setVolume(kind, v) {
    if (!(kind in vol)) return;
    const val = Math.max(0, Math.min(1, +v));
    if (!isFinite(val)) return;
    vol[kind] = val;
    try { localStorage.setItem(KEY[kind], String(val)); } catch (e) {}
    if (!ctx) return;
    try {
      if (kind === 'master') masterGain.gain.value = muted ? 0 : val;
      else if (kind === 'music') musicGain.gain.value = val;
      else if (kind === 'sfx') sfxGain.gain.value = val;

// ===== src/engine/renderer.js =====
// E02 — Renderer. Internal 640x360 canvas, EXACT 2x integer blit to the
// 1280x720 display (largest integer scale + black letterbox on other
// viewports), imageSmoothingEnabled=false everywhere. Camera with region
// bounds clamp + per-area camera locks. Plus a shelf-packing Atlas.

    displayCtx: () => dctx,
    display: () => display,

  };

})();


// ===== src/engine/entities.js =====
// E05 — Entities, collision, spatial hash. Everything here is written to make
// ZERO allocations per frame in the hot path: fixed backing arrays reused via
// length=0, scalar-only collision math, caller-supplied scratch buffers.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});

  // circle vs circle overlap (entity pairs)
  function circleHit(ax, ay, ar, bx, by, br) {
    const dx = ax - bx, dy = ay - by, r = ar + br;
    return dx * dx + dy * dy < r * r;
  }

  // Move an entity (treated as an axis-aligned box of half-extent e.r) against
  // the region solidity grid, axis-separated so it slides along walls. Sets
  // e.hitX / e.hitY collision flags. No allocations.
  function moveVsTiles(world, e, dx, dy) {
    const TS = world.tileSize;
    e.hitX = false; e.hitY = false;
    // ---- X axis ----
    if (dx !== 0) {
      e.x += dx;
      const top = Math.floor((e.y - e.r) / TS), bot = Math.floor((e.y + e.r - 0.001) / TS);
      if (dx > 0) {
        const tx = Math.floor((e.x + e.r) / TS);
        for (let ty = top; ty <= bot; ty++) if (world.solidAt(tx, ty)) { e.x = tx * TS - e.r - 0.001; e.hitX = true; break; }
      } else {
        const tx = Math.floor((e.x - e.r) / TS);
        for (let ty = top; ty <= bot; ty++) if (world.solidAt(tx, ty)) { e.x = (tx + 1) * TS + e.r + 0.001; e.hitX = true; break; }
      }
    }
    // ---- Y axis ----
    if (dy !== 0) {
      e.y += dy;
      const left = Math.floor((e.x - e.r) / TS), right = Math.floor((e.x + e.r - 0.001) / TS);
      if (dy > 0) {
        const ty = Math.floor((e.y + e.r) / TS);
        for (let tx = left; tx <= right; tx++) if (world.solidAt(tx, ty)) { e.y = ty * TS - e.r - 0.001; e.hitY = true; break; }
      } else {
        const ty = Math.floor((e.y - e.r) / TS);
        for (let tx = left; tx <= right; tx++) if (world.solidAt(tx, ty)) { e.y = (ty + 1) * TS + e.r + 0.001; e.hitY = true; break; }
      }
    }
  }

  // Spatial hash over a fixed grid. Buckets are reused arrays (length=0 to
  // clear) so rebuild() and query() never allocate during play.
  class SpatialHash {
    constructor(cellSize, worldW, worldH) {
      this.cell = cellSize;
      this.cols = Math.max(1, Math.ceil(worldW / cellSize));
      this.rows = Math.max(1, Math.ceil(worldH / cellSize));
      this.buckets = new Array(this.cols * this.rows);
      for (let i = 0; i < this.buckets.length; i++) this.buckets[i] = [];
      this._out = []; // reusable query result
    }
    _idx(cx, cy) {
      if (cx < 0) cx = 0; else if (cx >= this.cols) cx = this.cols - 1;
      if (cy < 0) cy = 0; else if (cy >= this.rows) cy = this.rows - 1;
      return cy * this.cols + cx;
    }
    clear() { const b = this.buckets; for (let i = 0; i < b.length; i++) b[i].length = 0; }
    insert(e) { this.buckets[this._idx((e.x / this.cell) | 0, (e.y / this.cell) | 0)].push(e); }

    query(x, y, r) {
      const out = this._out; out.length = 0;
      const c = this.cell;
      const x0 = ((x - r) / c) | 0, x1 = ((x + r) / c) | 0;
      const y0 = ((y - r) / c) | 0, y1 = ((y + r) / c) | 0;
      for (let cy = y0; cy <= y1; cy++)

          const b = this.buckets[this._idx(cx, cy)];
          for (let i = 0; i < b.length; i++) out.push(b[i]);
        }
      return out;
    }
  }

  SS.Entities = { circleHit, moveVsTiles, SpatialHash };
})();

      K.pxRect(ctx, rx, ry, rw, 1, sheen.mid);               // bright ripple crest
      K.pxRect(ctx, rx + 1, ry + 1, rw - 2, 1, water.mid);   // shaded trough beneath
    }
    // 3) sky + lantern reflections on the surface
    K.pxRect(ctx, 5 + (rnd() * 6 | 0), 6 + (rnd() * 4 | 0), 3, 1, sheen.spec);
    K.pxRect(ctx, 14 + (rnd() * 6 | 0), 15 + (rnd() * 4 | 0), 2, 1, K.ramp(K.LANTERN).lo);
    K.pxNoise(ctx, 0, 0, TS, TS, [sheen.hi], (seed || 31) + 3, 0.02);   // fine sparkle
    // 4) reeds & cattails standing in the water, each with a broken reflection
    const reeds = 2 + (rnd() * 3 | 0);
    for (let i = 0; i < reeds; i++) {
      const bx = 2 + (rnd() * (TS - 4)) | 0;
      const bh = 6 + (rnd() * 7 | 0), by = TS - bh - (rnd() * 3 | 0);
      K.pxRect(ctx, bx, by, 1, bh, reed.lo);                 // stalk
      K.pxRect(ctx, bx, by, 1, 2, reed.mid);                 // lit tip
      if (rnd() < 0.5) { K.pxRect(ctx, bx, by, 1, 3, catt.mid); K.pxRect(ctx, bx, by - 1, 1, 1, catt.hi); }
      if (rnd() < 0.6) K.pxRect(ctx, bx - 1, by + 2, 1, 1, reed.lo);   // blade
      if (rnd() < 0.6) K.pxRect(ctx, bx + 1, by + 3, 1, 1, reed.mid);
      if (by + bh < TS - 1) K.pxRect(ctx, bx, by + bh, 1, 1, reed.out); // reflection
    }
    return c;
  }

  // ---- OBJECT sprites (y-sorted with entities) ---------------------------
  function treeSprite(seed) {
    // foliage as overlapping CLUMPS, not stacked slabs — silhouette first
    const c = K.makeCanvas(44, 54); const ctx = c.getContext('2d');
    const wood = K.ramp('#4c3b2a'), leaf = K.ramp(PAL.leaf);
    const rnd = K.mulberry32(seed);
    K.dither2(ctx, 9, 50, 26, 4, K.DEEP_DUSK, 0.5);                  // contact shadow
    K.pxRect(ctx, 19, 34, 5, 16, wood.lo); K.pxRect(ctx, 19, 34, 2, 16, wood.mid); // trunk
    K.pxRect(ctx, 16, 48, 11, 2, wood.out);                          // root flare
    // canopy: irregular clumps, each individually shaded (lo body, mid cap,
    // out under-shadow) so the foliage reads as clusters, not one silhouette
    const clumps = [];
    for (let i = 0; i < 9; i++) {
      const cw2 = 12 + (rnd() * 14 | 0), ch2 = 7 + (rnd() * 6 | 0);
      const cx2 = 4 + (rnd() * (36 - cw2)) | 0;
      const cy2 = 2 + (rnd() * 24) | 0;
      clumps.push([cx2, cy2, cw2, ch2]);
    }
    clumps.sort((a, b) => (b[1] + b[3]) - (a[1] + a[3]));            // bottom clumps first
    for (const [x, y, w, h] of clumps) {
      K.pxRect(ctx, x, y, w, h, leaf.lo);
      K.pxRect(ctx, x + 1, y - 1, w - 2, 1, leaf.lo);
      K.pxRect(ctx, x + 2, y, w - 4, 2, leaf.mid);                   // every clump gets a lit cap
      K.pxRect(ctx, x + 1, y + h - 1, w - 2, 1, leaf.out);           // and an under-shadow
    }
    // top-of-crown light pass
    for (const [x, y, w] of clumps) {
      if (y > 14) continue;
      K.pxRect(ctx, x + 2, y, Math.max(4, w - 6), 2, mixHex(leaf.mid, leaf.hi, 0.6));
      K.pxNoise(ctx, x + 2, y, w - 4, 3, [leaf.hi], seed + y, 0.12);
    }
    K.pxNoise(ctx, 8, 3, 28, 5, [leaf.spec], seed + 3, 0.05);        // crown glints
    return c;
  }
  // dusk grading: violet multiply baked onto world art (chunks/statics) so
  // regions read as paintings and carried light (heroes, glows) pops. BAKE
  // time only — the runtime hot path never composites.
  function duskTint(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = PAL.tintA;
    ctx.fillStyle = PAL.tint;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    return canvas;
  }

  // ---- THE FALLEN BEACON (landmark static; Act-1's most important marker) --
  function beaconTowerSprite() {
    // A FALLEN Keeper signal-tower: a broken stone shaft, its crown sheared off
    // when the sun shattered, the fire-basket toppled cold on its high shoulder,
    // tumbled masonry heaped at the foot, and a dark doorway arch at the base —
    // the way IN. Taller than any tree so it reads as a landmark from screens
    // away. Anchored by its foot tile; dusk grade is baked by region.js.
    const W = 52, H = 72;
    const c = K.makeCanvas(W, H); const ctx = c.getContext('2d');
    const stone = K.ramp('#6e6678');
    const iron = K.ramp('#3a3040');
    const cold = K.ramp('#4f7f92');            // dead beacon: cold ash-light, never warm
    const rnd = K.mulberry32(73);
    const sx = 15, sw = 22, sTop = 16, sBot = 66;

    // contact shadow on the moor
    K.dither2(ctx, 5, H - 6, W - 10, 6, K.DEEP_DUSK, 0.5);

    // tumbled masonry heaped around the foot (spread wider than the shaft)
    const rubble = [[3, 60, 8, 6], [7, 65, 9, 6], [37, 61, 8, 7], [42, 65, 8, 6], [13, 66, 7, 6], [31, 66, 8, 6]];
    for (const [rx, ry, rw, rh] of rubble) K.pxBlock(ctx, rx, ry, rw, rh, stone);

    // the shaft — a stone cylinder, left-lit, right sinking into dusk shadow
    K.pxRect(ctx, sx, sTop, sw, sBot - sTop, stone.lo);
    K.pxRect(ctx, sx, sTop, 6, sBot - sTop, stone.mid);
    K.pxRect(ctx, sx, sTop, 2, sBot - sTop, stone.hi);
    K.pxRect(ctx, sx + sw - 6, sTop, 6, sBot - sTop, stone.out);

    // shear the crown: snapped high on the left, collapsed away to the right
    for (let i = 0; i < sw; i++) {
      let cut = i < 7 ? 0 : (i - 7) * 1.15;
      cut = Math.max(0, Math.min(15, (cut + rnd() * 3 - 1) | 0));
      if (cut > 0) ctx.clearRect(sx + i, sTop, 1, cut);
      K.pxRect(ctx, sx + i, sTop + cut, 1, 1, stone.hi);              // lit broken crest
      K.pxRect(ctx, sx + i, sTop + cut + 1, 1, 1, stone.lo);
    }

    // masonry courses + staggered vertical joints
    for (let gy = sTop + 5; gy < sBot; gy += 6) {
      K.pxRect(ctx, sx, gy, sw, 1, stone.out);
      for (let jx = sx + 2 + ((gy & 1) ? 5 : 0); jx < sx + sw - 2; jx += 10) K.pxRect(ctx, jx, gy - 4, 1, 4, stone.out);
    }
    K.pxNoise(ctx, sx + 1, sTop + 2, sw - 2, sBot - sTop - 3, [stone.out, stone.spec], 7, 0.05);

    // the fracture that felled it — a jagged crack down the lit face
    let fx = sx + 12;
    for (let y = sTop + 2; y < sBot - 6; y += 2) {
      fx += (rnd() * 2 - 0.8);
      const fxi = fx | 0;
      K.pxRect(ctx, fxi, y, 1, 2, K.DEEP_DUSK);
      K.pxRect(ctx, fxi + 1, y, 1, 1, stone.hi);
    }

    // dark doorway arch at the foot — the way IN, dead-centered on the foot tile
    const dw = 12, dxx = (sx + (sw - dw) / 2) | 0, dTop = 44, dBot = sBot;
    K.pxRect(ctx, dxx - 1, dTop, 1, dBot - dTop, stone.out);          // jambs
    K.pxRect(ctx, dxx + dw, dTop, 1, dBot - dTop, stone.out);
    K.pxRect(ctx, dxx - 3, dTop - 2, dw + 6, 3, stone.hi);            // lintel
    K.pxRect(ctx, dxx - 3, dTop - 2, dw + 6, 1, stone.spec);
    K.pxRect(ctx, dxx, dTop + 3, dw, dBot - dTop - 3, K.DEEP_DUSK);   // the dark
    K.pxRect(ctx, dxx + 2, dTop, dw - 4, 4, K.DEEP_DUSK);             // arched head
    K.pxRect(ctx, dxx + 4, dTop - 1, dw - 8, 2, K.DEEP_DUSK);
    K.pxRect(ctx, dxx + (dw >> 1) - 1, dBot - 5, 2, 2, cold.lo);      // a cold sliver deep within

    // the toppled fire-basket on the tall left shoulder — cold, long dead
    const bx = sx + 1, by = sTop - 9;
    K.pxRect(ctx, bx, by + 7, 11, 2, iron.lo);                        // bowl
    K.pxRect(ctx, bx + 1, by + 6, 9, 1, iron.mid);
    K.pxRect(ctx, bx + 1, by + 2, 2, 5, iron.mid);                   // cage bars
    K.pxRect(ctx, bx + 8, by + 1, 2, 6, iron.mid);
    K.pxRect(ctx, bx + 4, by, 2, 4, iron.lo);                        // snapped bar
    K.outlineRect(ctx, bx, by + 6, 11, 3, iron.out);
    K.pxRect(ctx, bx + 3, by + 6, 5, 1, cold.lo);                    // cold ash
    K.pxRect(ctx, bx + 5, by + 6, 1, 1, cold.mid);                   // one dim ember

    // grounding shadow line under the shaft
    K.pxRect(ctx, sx - 1, sBot - 1, sw + 2, 1, K.DEEP_DUSK);
    return c;
  }

  // ---- COTTAGE (whole-object sprite; de-gridded walls) -------------------
  function buildCottage(wpx, hpx, variant) {
    const c = K.makeCanvas(wpx, hpx + 8); const ctx = c.getContext('2d');
    const wall = K.ramp(variant === 'smithy' ? '#7a6650' : '#87725a');
    const beam = K.ramp('#4a3423');
    const roof = K.ramp(variant === 'smithy' ? '#584a54' : '#6e3d38');
    const roofHi = K.ramp(variant === 'smithy' ? '#8a7a86' : '#8a5a4e');
    const trim = K.ramp(variant === 'smithy' ? '#8a4a2c' : '#d0902f');

    const eave = 6;
    const roofBottom = Math.round(hpx * 0.42);
    const wallTop = roofBottom - 4;
    const wallBottom = hpx;

    K.dither2(ctx, eave, hpx - 2, wpx - eave * 2, 8, K.DEEP_DUSK, 0.55);

    // wall: plaster with subtle texture, corner posts + sill only (no grid)
    const wx0 = eave + 2, wx1 = wpx - eave - 2, ww = wx1 - wx0;
    K.pxRect(ctx, wx0, wallTop, ww, wallBottom - wallTop, wall.mid);
    K.dither2(ctx, wx0, wallTop, ww, wallBottom - wallTop, wall.lo, 0.15);
    K.pxNoise(ctx, wx0 + 2, wallTop + 8, ww - 4, wallBottom - wallTop - 10, [wall.lo, wall.hi], 9, 0.05);
    K.pxRect(ctx, wx0, wallTop, 3, wallBottom - wallTop, beam.mid);
    K.pxRect(ctx, wx1 - 3, wallTop, 3, wallBottom - wallTop, beam.lo);
    K.pxRect(ctx, wx0, wallBottom - 4, ww, 4, beam.lo);
    K.dither2(ctx, wx0, wallTop, ww, 6, K.DEEP_DUSK, 0.6);            // eave shadow

    // two lit windows flanking the door (one for smithy + tool rack)
    const winW = 16, winY = wallTop + 12;
    const winXs = variant === 'smithy' ? [wx0 + 10] : [wx0 + 10, wx1 - 10 - winW];
    for (const winX of winXs) {
      K.pxGlowSq(ctx, winX + 8, winY + 8, 11, K.LANTERN, 5);
      K.pxRect(ctx, winX, winY, winW, winW, K.DEEP_DUSK);
      K.pxRect(ctx, winX + 2, winY + 2, winW - 4, winW - 4, trim.hi);
      K.pxRect(ctx, winX + 7, winY + 2, 2, winW - 4, beam.mid); K.pxRect(ctx, winX + 2, winY + 7, winW - 4, 2, beam.mid);
      K.pxRect(ctx, winX - 2, winY - 1, 2, winW + 2, beam.lo); K.pxRect(ctx, winX + winW, winY - 1, 2, winW + 2, beam.lo);
      K.outlineRect(ctx, winX, winY, winW, winW, beam.out);
    }
    if (variant === 'smithy') {   // tool rack where the second window would be
      const rx = wx1 - 22;
      K.pxRect(ctx, rx, winY, 12, 2, beam.mid);
      K.pxRect(ctx, rx + 1, winY + 2, 2, 10, K.ramp('#8a8a94').mid);  // hung tongs
      K.pxRect(ctx, rx + 6, winY + 2, 2, 12, K.ramp('#8a8a94').lo);   // hammer haft
      K.pxRect(ctx, rx + 5, winY + 12, 4, 3, K.ramp('#8a8a94').hi);   // hammer head
    }

    // door: focal point, centered
    const doorW = 18, doorH = 26, doorX = Math.round((wpx - doorW) / 2), doorY = wallBottom - doorH;
    K.pxRect(ctx, doorX - 3, doorY - 4, doorW + 6, 4, beam.mid);
    K.pxRect(ctx, doorX - 3, doorY - 4, doorW + 6, 1, beam.hi);
    const dr = K.ramp('#4a3526');
    K.pxRect(ctx, doorX, doorY, doorW, doorH, dr.mid);
    K.dither(ctx, doorX + 1, doorY + 2, doorW - 2, doorH - 3, dr.mid, dr.lo);
    K.pxRect(ctx, doorX + (doorW >> 1), doorY, 1, doorH, dr.out);
    K.pxRect(ctx, doorX + doorW - 5, doorY + (doorH >> 1), 2, 2, trim.spec);
    K.pxRect(ctx, doorX, doorY + doorH - 2, doorW, 2, K.LANTERN);     // light under the door
    K.outlineRect(ctx, doorX, doorY, doorW, doorH, dr.out);
    K.pxRect(ctx, doorX - 4, wallBottom - 3, doorW + 8, 4, K.ramp('#6a6270').mid);
    K.pxRect(ctx, doorX - 4, wallBottom - 3, doorW + 8, 1, K.ramp('#6a6270').hi);

    // roof: full-width slab with shingle rows, ridge highlight, dark eave
    const rTop = Math.round(hpx * 0.08);
    K.pxRect(ctx, 0, rTop, wpx, roofBottom - rTop, roof.mid);
    for (let gy = rTop; gy < roofBottom; gy += 5) { K.pxRect(ctx, 0, gy, wpx, 4, roof.lo); K.pxRect(ctx, 0, gy, wpx, 1, roof.mid); }
    K.pxNoise(ctx, 0, rTop, wpx, roofBottom - rTop, [roof.out, roofHi.hi], 18, 0.08);
    K.pxRect(ctx, 0, rTop, wpx, 3, roofHi.hi);
    K.pxRect(ctx, 0, rTop, wpx, 1, roofHi.spec);
    K.pxRect(ctx, 0, roofBottom - 2, wpx, 2, roof.out);
    K.outlineRect(ctx, 0, rTop, wpx, roofBottom - rTop, K.ramp('#2a1614').out);

    // chimney
    const chX = variant === 'smithy' ? wpx - 22 : 10, chW = variant === 'smithy' ? 14 : 10;
    K.pxRect(ctx, chX, rTop - 12, chW, 14, K.ramp('#5a4436').mid);
    K.pxRect(ctx, chX, rTop - 12, chW, 2, K.ramp('#5a4436').hi);
    K.outlineRect(ctx, chX, rTop - 12, chW, 14, K.ramp('#2a1c12').out);
    if (variant === 'smithy') K.pxRect(ctx, chX + 2, rTop - 12, chW - 4, 2, K.EMBER);

// ===== src/art/gloamwood.js =====

// 3). Promotes that review vignette to a real, region.js-compatible tileset.
// KEY IDEA (identical to src/art/tiles.js, the director's moor): the forest
// FLOOR is PAINTED CONTINUOUSLY per chunk from position-seeded value noise — it
// never tile-stamps and never repeats. The value band is narrow around mid;
// colour variety is equal-VALUE hue drifts (moss/leaf/root), NOT per-pixel
// speckle; mist pools in low-noise hollows; canopy shadow comes from an
// independent noise field; roots are heavy contour tangles. Trunks, trees,
// root-arches, stumps, moth-lanterns and the sealed grove-gate are whole OBJECT
// sprites, y-sorted with the party by the play state. Gloamwood is the DARKEST

(function () {

  // ---- Haunted Thicket palette (director's pick, contact-sheet option 3) ----
  const FLOOR = '#3a3548', CANOPY = '#191524', MIST = '#585470', LITTER = '#45405a', MOSS2 = '#3e4a48';
  const FOX_GLOW = '#a8ccff', FOX_CORE = '#eaf4ff';                 // cold foxfire fungus
  const MOTH = '#e0a0d0', MOTH_CORE = '#f0c8e0', MOTHQUEEN = '#c86aa0'; // warm-pink moth accent
  const DUSK_TINT = '#241c40', DUSK_A = 0.16;                       // darkest region — baked dark

  const R = K.ramp(FLOOR);

  // moss-edge lips stamped where a ground tile borders painted floor
  function bakeLips() {
    const mk = (w, h) => { const c = K.makeCanvas(w, h); return [c, c.getContext('2d')]; };
    const rnd = K.mulberry32(53);

  // ---- ground stamps (walkable — kept legible so routes/NPCs stay readable) -
  function pathTile(seed) {

  function boardwalkTile() {

  // ---- flat overlay: foxfire (the signature cold light, baked flat) ---------

  function duskTint(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.save();

  }
  function gloamTree(seed) {
    // TALL, dark, canopy-CLOSED tree with a drooping crown and hanging vines —
    // deliberately NOT Duskmoor's rounded green clump-tree. Foliage is violet-
    // black (CANOPY), lit caps are cold moss-green, silhouette reads dense.
    const c = K.makeCanvas(46, 68); const ctx = c.getContext('2d');
    const wood = K.ramp('#332838'), leaf = K.ramp(CANOPY), lit = K.ramp(MOSS2);
    const rnd = K.mulberry32(seed);

    // slender scarred trunk

    K.pxRect(ctx, 22, 44, 1, 20, wood.out);

    for (let s = 0; s < 6; s++) K.pxRect(ctx, 20 + (rnd() * 6 | 0), 42 + s * 3, 1, 1, wood.hi); // bark scars

      const cx2 = 2 + (rnd() * (40 - cw2)) | 0;

// A02 — Hero sprites. Kes (sword) and Fin (sling + lantern), 20x30, built

(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});

    id: 'kes', top: 2, headW: 9, headH: 9,             // full-height teen
    skin: K.ramp('#c9945f'), hair: K.ramp('#3a2a1a'),
    tunic: K.ramp('#37606e'), trouser: K.ramp('#463526'),
    accent: K.ramp('#d08a34'),                          // amber shoulder scarf

    tunic: K.ramp('#5a6a34'), trouser: K.ramp('#39392a'),
    accent: K.ramp('#7fb0c0'),                           // satchel strap
    steel: K.ramp('#8a6a3a'),

  // draw one figure into a fresh 20x30 canvas; returns the canvas.

  function bakeFrame(D, action, dir, i) {

    const cx = 10;
    const top = D.top;

    const headX = cx - (headW >> 1);
    const headY = top;
    const bodyY = headY + headH;             // torso start
    const bodyH = 9;

    // leg swing phase for walk

    drawLeg(ctx, D, cx - 4, legTop, legH, lp);

  }

  function drawLeg(ctx, D, x, y, h, swing) {

  }

        if (dir === 'side') {
          // arc forward: windup up, slash forward, recover
          const cfg = [{ x: cx + 5, y: bodyY - 6, l: 10, v: true },
                       { x: cx + 6, y: bodyY + 2, l: 12, v: false },
                       { x: cx + 6, y: bodyY + 5, l: 9, v: false }][i];
          drawSword(ctx, steel, cfg.x, cfg.y, cfg.l, cfg.v);
          return;
        } else {
          const cfg = [{ x: cx + 5, y: bodyY - 7, l: 10, v: true },
                       { x: cx + 6, y: bodyY - 9, l: 13, v: true },
                       { x: cx + 5, y: bodyY - 3, l: 8, v: true }][i];
          drawSword(ctx, steel, cfg.x, cfg.y, cfg.l, cfg.v);
          return;
        }
      }
      // idle/walk: sword sheathed on back (diagonal)
      if (dir !== 'up') {
        for (let s = 0; s < 9; s++) px(ctx, cx + 4 - s * 0.4 | 0, bodyY - 4 + s, 1, 1, steel.mid);
        px(ctx, cx + 4, bodyY - 4, 2, 2, D.accent.mid); // pommel
      }
    } else {
      // Fin: sling in hand. On attack, extend the sling arm forward.
      const sr = K.ramp('#7a5a3a');
      if (action === 'attack') {
        const ext = [3, 6, 4][i];
        px(ctx, cx + 5, bodyY + 3, ext, 1, sr.mid);
        px(ctx, cx + 5 + ext, bodyY + 2, 2, 2, sr.hi); // pouch
      }
    }
  }

  function drawSword(ctx, steel, x, y, len, vertical) {
    if (vertical) {
      px(ctx, x, y, 2, len, steel.hi);
      px(ctx, x, y, 1, len, steel.spec);
      px(ctx, x - 1, y + len, 4, 2, K.ramp('#6a4a2a').mid); // guard
    } else {
      px(ctx, x, y, len, 2, steel.hi);
      px(ctx, x, y, len, 1, steel.spec);
      px(ctx, x - 2, y - 1, 2, 4, K.ramp('#6a4a2a').mid); // guard
    }
  }

  function drawLantern(ctx, dir, action, i) {
    // lantern held out to Fin's side; small stepped square glow
    const lx = dir === 'side' ? 15 : (dir === 'up' ? 3 : 14);
    const ly = 18;
    // housing
    px(ctx, lx, ly, 4, 6, K.ramp('#2a1c12').mid);
    K.outlineRect(ctx, lx, ly, 4, 6, K.ramp('#2a1c12').out);
    // glass + baked glow
    K.pxGlowSq(ctx, lx + 2, ly + 3, 7 + (i & 1), K.LANTERN, 4);
    px(ctx, lx + 1, ly + 2, 2, 3, K.LANTERN);
    px(ctx, lx + 1, ly + 2, 1, 1, K.FIRST_FLAME);
  }

  function drawRoll(ctx, D, dir, i) {
    // tucked ball — compressed figure, 2 frames rotate the tuck
    const r = D.tunic, sk = D.skin, tr = D.trouser;
    const cy = 20;
    px(ctx, 4, cy - 6, 12, 12, r.mid);
    K.dither(ctx, 4, cy - 6, 12, 12, r.mid, r.lo);
    px(ctx, 4, cy - 6, 12, 2, r.hi);
    // head tucked
    const hx = i === 0 ? 12 : 5;
    px(ctx, hx, cy - 4, 5, 5, sk.mid);
    px(ctx, hx, cy - 4, 5, 1, D.hair.mid);
    // legs curled
    const lx = i === 0 ? 4 : 11;
    px(ctx, lx, cy + 3, 4, 3, tr.mid);
    // motion streak
    px(ctx, 2, cy + 4, 16, 1, r.out);
  }

  let built = null;
  function build() {
    if (built) return built;
    if (!K.font.meta.ready) K.font.bake();
    const atlas = new SS.Atlas(256);
    const heroes = [KES, FIN];
    const anims = { walk: 4, attack: 3, roll: 2 };
    const dirs = ['down', 'up', 'side'];
    for (const D of heroes) {
      for (const action in anims) {
        for (const dir of dirs) {
          for (let i = 0; i < anims[action]; i++) {
            const base = bakeFrame(D, action, dir, i);
            atlas.add(`${D.id}.${action}.${dir}.${i}`, base);
            // rim-light variant (lit from the carried lantern; world is dark)
            const rimmed = K.rim(base, dir === 'side' ? 'r' : 'r', K.LANTERN);
            atlas.add(`${D.id}.${action}.${dir}.${i}.rim`, rimmed);
            // white-flash hit variant
            atlas.add(`${D.id}.${action}.${dir}.${i}.flash`, K.flashVariant(base, K.FIRST_FLAME));
          }
        }
      }
    }
    built = { atlas, W, H };
    return built;
  }

  SS.Heroes = { build, W, H };
})();

// real range of skin tones AND face shapes so adjacent people don't share a face.
//
