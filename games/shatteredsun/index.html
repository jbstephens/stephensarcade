  function workbenchSprite() {
    const c = K.makeCanvas(42, 30); const ctx = c.getContext('2d');
    const wood = K.ramp('#5a4028'), iron = K.ramp('#4a4954'), bronze = K.ramp('#8a6a3a');
    contact(ctx, 3, 26, 34);
    K.pxRect(ctx, 5, 16, 3, 10, wood.out); K.pxRect(ctx, 34, 16, 3, 10, wood.out);         // legs
    K.pxBlock(ctx, 2, 10, 38, 8, wood); K.pxRect(ctx, 2, 10, 38, 1, wood.spec);            // top
    K.pxRect(ctx, 3, 12, 4, 10, iron.lo); K.pxRect(ctx, 3, 12, 4, 1, iron.hi); K.pxRect(ctx, 2, 15, 6, 2, iron.mid);   // leg-vise
    K.pxGlowSq(ctx, 24, 8, 5, K.LANTERN, 3);                                               // the eye lands on the hilt
    K.pxRect(ctx, 22, 4, 3, 5, bronze.mid); K.pxRect(ctx, 22, 4, 3, 1, bronze.hi);         // wound grip
    K.pxRect(ctx, 21, 3, 5, 1, bronze.spec);                                               // pommel
    K.pxRect(ctx, 19, 9, 8, 2, bronze.lo); K.pxRect(ctx, 19, 9, 8, 1, bronze.hi);          // crossguard
    K.pxRect(ctx, 23, 11, 1, 4, iron.mid);                                                 // bare tang (no blade yet)
    K.pxRect(ctx, 30, 7, 2, 4, wood.mid); K.pxRect(ctx, 29, 6, 4, 2, iron.mid);            // a stray hammer
    return c;
  }

  // ---- warm dusk grade (baked; the runtime hot path never composites) ----
  // A gentle warm-violet multiply that seats every baked surface into one firelit
  // room without dimming the hearth's carried light. Named duskTint for parity
  // with SS.Tiles so region.js applies it identically to chunks and statics.
  function duskTint(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#4a3448';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    return canvas;
  }

  // interiors have no drifting moor beneath the tiles: the base is warm shadow,
  // fully overdrawn by wall/floor stamps (any seam reads as room-dark, not moor).
  function paintMoor(ctx, w, h /*, ox, oy */) {
    ctx.fillStyle = mixHex(K.DEEP_DUSK, '#3a2a30', 0.5);
    ctx.fillRect(0, 0, w, h);
  }
  function emptyCanvas() { return K.makeCanvas(1, 1); }

  let cache = null;
  function build() {
    if (cache) return cache;
    if (!K.font.meta.ready) K.font.bake();
    const woods = [woodPlank(31), woodPlank(37), woodPlank(43)];
    const flags = [flagstone(51), flagstone(57)];
    const walls = [wallTile(0), wallTile(0), wallTile(0), wallTile(0), wallTile(1)];  // sconce variant 1-in-5; explicit 'wall-sconce' tiles carry the designed light
    const rug = rugTile();
    const thr = threshold(61);
    const pick = (arr, tx, ty) => arr[hash2(tx, ty) % arr.length];
    // full-tile stamps draw the floor; furniture tiles ALSO stamp their floor so
    // the wood/stone reads continuously beneath a y-sorted furniture sprite.
    const woodStamp = (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(woods, tx, ty), dx, dy);
    const flagStamp = (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(flags, tx, ty), dx, dy);
    const tiles = {
      'wall':        { solid: true, stamp: (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(walls, tx, ty), dx, dy) },
      // sconce wall: guaranteed warm wall light that also pools on the floor below
      'wall-sconce': { solid: true, stamp: (ctx, dx, dy) => ctx.drawImage(walls[2], dx, dy), pool: { r: 26, color: K.LANTERN, dy: 30, a: 0.5 } },
      'floor-wood':  { solid: false, stamp: woodStamp },
      'floor-stone': { solid: false, stamp: flagStamp },
      'threshold':   { solid: false, stamp: (ctx, dx, dy) => ctx.drawImage(thr, dx, dy) },
      'rug':         { solid: false, stamp: (ctx, dx, dy) => ctx.drawImage(rug, dx, dy) },
      // furniture: wood floor under a solid, y-sorted object sprite
      'hearth':      { solid: true, stamp: flagStamp, static: 'hearth', pool: { r: 70, color: K.LANTERN, dy: 26, a: 0.75 } },
      'table':       { solid: true, stamp: woodStamp, static: 'table', pool: { r: 26, color: K.LANTERN, dy: 0, a: 0.4 } },
      'stool':       { solid: true, stamp: woodStamp, static: 'stool' },
      'chair':       { solid: true, stamp: woodStamp, static: 'chair' },
      'shelf':       { solid: true, stamp: woodStamp, static: 'shelf' },
      'cot':         { solid: true, stamp: woodStamp, static: 'cot' },
      'barrel':      { solid: true, stamp: woodStamp, static: 'barrel' },
      'crate':       { solid: true, stamp: woodStamp, static: 'crate' },
      'chest':       { solid: true, stamp: woodStamp, static: 'chest' },
      // smithy fixtures — forge/anvil/quench stand on stone; racks + bench on wood
      'forge':       { solid: true, stamp: flagStamp, static: 'forge' },
      'forge-lit':   { solid: true, stamp: flagStamp, static: 'forge-lit', pool: { r: 60, color: K.EMBER, dy: 24, a: 0.7 } },
      'anvil':       { solid: true, stamp: flagStamp, static: 'anvil' },
      'quench':      { solid: true, stamp: flagStamp, static: 'quench' },
      'bellows':     { solid: true, stamp: woodStamp, static: 'bellows' },
      'tool-rack':   { solid: true, stamp: woodStamp, static: 'tool-rack' },
      'weapon-rack': { solid: true, stamp: woodStamp, static: 'weapon-rack' },
      'workbench':   { solid: true, stamp: woodStamp, static: 'workbench' },
    };
    const statics = {
      hearth: [hearthSprite()],
      table: [tableSprite()],
      stool: [stoolSprite()],
      chair: [chairSprite()],
      shelf: [shelfSprite()],
      cot: [cotSprite()],
      barrel: [barrelSprite()],
      crate: [crateSprite()],
      chest: [chestSprite()],
      // COLD forge is the shipped default; the LIT variant is baked and ready for
      // the day the cold-forge side quest (flag:forge_relit) wakes the fire.
      forge: [forgeColdSprite()],
      'forge-lit': [forgeLitSprite()],
      anvil: [anvilSprite()],
      quench: [quenchSprite()],
      bellows: [bellowsSprite()],
      'tool-rack': [toolRackSprite()],
      'weapon-rack': [weaponRackSprite()],
      workbench: [workbenchSprite()],
    };
    // Parity stubs for the outdoor-only fields region.js reads generically. None
    // fire for an interior (no painted tiles, wisps, shrine, buildings, clouds),
    // but they keep the tile-registry contract identical to SS.Tiles.build().
    const empty = emptyCanvas();
    cache = {
      TS, tiles, statics, hash2, duskTint, paintMoor,
      scatter: [empty], bogMush: empty,
      lips: { n: empty, s: empty, w: empty, e: empty },
      cloudShadow: () => emptyCanvas(),
      buildCottage: () => emptyCanvas(),
      wispFrames: [], shrineGlowFrames: [],
    };
    return cache;
  }

  SS.Interior = { build, TS };
})();


// ===== src/art/dungeon.js =====
// Dungeon tileset + fixtures generator (D01/B01 enabler). The Fallen Beacon is
// a ruined stone signal-tower on the moor's edge: FLAT ROOMS like SS.Interior
// (never the director's continuous moor painting), but cold, haunted and dusk-
// drowned instead of hearth-cozy. Cracked flagstone floors, broken masonry
// walls, rubble and toppled columns, a barred cold-iron gate, worn stairs, and
// the beacon's iron braziers — dead-cold until the lantern-keeper's children
// carry a spark to them. A lit brazier bakes its warm glow with pxGlowSq (never
// shadowBlur); an unlit one is the only-warmth-is-carried-light rule made literal.
//
// This module lives beside (never inside) the director-owned src/art/tiles.js
// and returns the SAME shape SS.Region.load consumes from SS.Tiles.build(), so
// region.js selects it for any region whose `tileset` is "dungeon" with no
// special-casing in the tile pipeline. It also exposes brazier/key/gate FIXTURE
// sprites the region runtime draws as y-sorted, stateful objects (lit vs unlit).
// TS is 24 to match the shared engine.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  const TS = 24;

  function hash2(x, y) { let h = (x * 374761393 + y * 668265263) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return (h ^ (h >>> 16)) >>> 0; }
  function mixHex(a, b, t) {
    const A = K.hexToRgb(a), B = K.hexToRgb(b);
    return K.rgbToHex(A.r + (B.r - A.r) * t, A.g + (B.g - A.g) * t, A.b + (B.b - A.b) * t);
  }

  // cold-stone palette bases (deliberately blue-violet: the beacon is a dead,
  // grief-cold ruin; warmth only ever comes from a lit brazier).
  const STONE = '#525872';       // wall masonry (lifted lighter + a touch warmer so it reads as the raised, lit surface)
  const FLAG = '#2b2938';        // flagstone floor (deliberately much darker + cooler than walls: floor must never read as the same material even with the gloom off)
  const RUBBLE = '#4a4450';      // toppled stone / debris
  const IRON = '#2a2732';        // cold iron (gates, brazier bowls)
  const GRIEF = '#6fb6cc';       // the caged cold-flame blue of the fallen beacon

  // ---- floor -------------------------------------------------------------
  // Cracked flagstone: cool stones over dark mortar, chipped corners, a few
  // hairline cracks and cold grit. Three variants keep a run from reading as a
  // repeated stamp (art-bible anti-repeat rule).
  function flagFloor(seed) {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp(FLAG);
    const rnd = K.mulberry32((seed || 3) >>> 0);
    K.pxRect(ctx, 0, 0, TS, TS, r.out);                          // mortar bed
    for (let gy = 0; gy < TS; gy += 8) {
      let gx = -((rnd() * 6) | 0);
      while (gx < TS) {
        const sw = 7 + ((rnd() * 5) | 0);
        const tone = rnd() < 0.18 ? r.lo : r.mid;                   // quieter: fewer stray-bright slabs so the floor reads as one calm dark surface
        K.pxRect(ctx, gx, gy, sw - 1, 7, tone);
        K.pxRect(ctx, gx, gy, sw - 1, 1, mixHex(tone, r.hi, 0.22));  // soft lit top of the slab (muted so it doesn't compete with the walls)
        ctx.fillStyle = r.out;                                       // knocked-out corners
        ctx.fillRect(gx, gy, 1, 1); ctx.fillRect(gx + sw - 2, gy, 1, 1);
        ctx.fillRect(gx, gy + 6, 1, 1); ctx.fillRect(gx + sw - 2, gy + 6, 1, 1);
        if (rnd() < 0.18) K.pxRect(ctx, gx + 2, gy + 3, sw - 4, 1, r.out);  // occasional hairline crack
        gx += sw;
      }
    }
    K.pxNoise(ctx, 0, 0, TS, TS, [r.lo, r.out], seed + 7, 0.03);   // cold grit (sparser so the floor stays quiet under the walls)
    return c;
  }

  // Rubble floor: flagstone strewn with pale fallen-stone chips — walkable
  // debris that breaks up long halls without blocking the path.
  function rubbleFloor(seed) {
    const c = flagFloor(seed); const ctx = c.getContext('2d');
    const r = K.ramp(RUBBLE);
    const rnd = K.mulberry32((seed * 3 + 11) >>> 0);
    for (let i = 0; i < 5; i++) {
      const x = 2 + ((rnd() * (TS - 8)) | 0), y = 3 + ((rnd() * (TS - 8)) | 0);
      const w = 3 + ((rnd() * 4) | 0), h = 2 + ((rnd() * 3) | 0);
      K.pxRect(ctx, x, y, w, h, r.lo); K.pxRect(ctx, x, y, w, 1, r.hi);
      K.pxRect(ctx, x, y + h, w, 1, K.ramp(FLAG).out);            // little cast shadow
    }
    return c;
  }

  // Warm threshold: swept flagstone catching a sliver of doorway light — the
  // tile a return/home exit sits over.
  function threshold(seed) {
    const c = flagFloor(seed); const ctx = c.getContext('2d');
    K.pxRect(ctx, 3, TS - 3, TS - 6, 2, mixHex(FLAG, K.LANTERN, 0.28));
    K.pxRect(ctx, 5, TS - 4, TS - 10, 1, mixHex(FLAG, K.LANTERN, 0.45));
    return c;
  }

  // Worn stone stairs climbing away (decorative, walkable) — reads as the way up
  // to the beacon spire. Lit nosings, shadowed risers.
  function stairs() {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp(STONE);
    K.pxRect(ctx, 0, 0, TS, TS, r.out);
    for (let s = 0; s < 4; s++) {
      const y = s * 6;
      K.pxRect(ctx, 1, y, TS - 2, 5, r.mid);
      K.pxRect(ctx, 1, y, TS - 2, 1, r.hi);                       // lit nosing
      K.pxRect(ctx, 1, y + 5, TS - 2, 1, r.out);                 // riser shadow
      K.dither2(ctx, 2, y + 1, TS - 4, 3, r.lo, 0.3);
    }
    return c;
  }

  // ---- walls -------------------------------------------------------------
  // Broken masonry: heavy offset courses over a black mortar bed, a cold-lit
  // crown, a dark outline; the rarer variant has cracked-through stone so no run
  // of wall reads as plain material. Cold — never the interior's warm sconces.
  function wallTile(variant) {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp(STONE);
    const rnd = K.mulberry32(variant ? 29 : 13);
    K.pxRect(ctx, 0, 0, TS, TS, r.out);                          // mortar bed
    for (let gy = 0; gy < TS; gy += 6) {
      let gx = (gy % 12 === 0) ? 0 : -6;                         // stagger courses
      while (gx < TS) {
        const bw = 8 + ((rnd() * 5) | 0);
        const tone = rnd() < 0.32 ? r.lo : r.mid;
        K.pxRect(ctx, gx + 1, gy + 1, bw - 2, 4, tone);
        K.pxRect(ctx, gx + 1, gy + 1, bw - 2, 1, mixHex(tone, r.hi, 0.5));
        gx += bw;
      }
    }
    K.pxNoise(ctx, 0, 2, TS, TS - 2, [r.out, r.hi], variant ? 5 : 3, 0.05);
    K.pxRect(ctx, 0, 0, TS, 2, r.hi);                            // cold-lit crown
    K.pxRect(ctx, 0, 0, TS, 1, r.spec);
    if (variant) {                                               // cracked-through stone
      K.pxRect(ctx, TS / 2 - 1, 6, 2, 12, r.out);
      K.pxRect(ctx, TS / 2 - 3, 10, 6, 2, r.out);
      K.pxRect(ctx, TS / 2, 6, 1, 12, K.DEEP_DUSK);
    }
    K.outlineRect(ctx, 0, 0, TS, TS, r.out);
    return c;
  }

  // Toppled column stub: a broken pillar drum standing in the floor (solid
  // cover). Stamped flat into the chunk (no y-sort needed at this height).
  // DIRECTOR'S LAW — decor must never out-prominence the way forward or the
  // interactables. The toppled column is now unmistakably dead rubble: a low
  // cracked drum, no lit cap, sunk into the floor's own value range.
  function columnTile() {
    const c = flagFloor(97); const ctx = c.getContext('2d');
    const r = K.ramp(STONE);
    const drum = mixHex(r.lo, K.ramp(FLAG).mid, 0.45);          // sunk toward floor value
    K.pxRect(ctx, 5, 8, 14, 14, drum); K.outlineRect(ctx, 5, 8, 14, 14, r.out);
    K.dither2(ctx, 6, 10, 12, 11, mixHex(drum, r.out, 0.5), 0.35);
    K.pxRect(ctx, 8, 8, 3, 14, r.out);                          // deep crack
    K.pxRect(ctx, 5, 8, 14, 1, mixHex(drum, r.mid, 0.5));       // faint top edge only
    K.pxRect(ctx, 4, 21, 16, 2, r.out);                         // base shadow
    K.pxRect(ctx, 15, 5, 5, 3, drum); K.pxRect(ctx, 15, 5, 5, 1, r.out);  // fallen chunk beside it
    return c;
  }

  // ---- doorway framing (auto-stamped by region.js on wall-gap pairs) ------
  // THE WAY FORWARD IS THE MOST LEGIBLE THING IN THE ROOM: every 2-tile gap in
  // a wall run gets carved jambs and a cold light-spill so passages read from
  // across a dark room, gloom or no gloom.
  function doorwaySprites() {
    const s = K.ramp(STONE);
    const jamb = (side) => {
      const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
      const x0 = side === 'l' ? 0 : TS - 6;
      K.pxRect(ctx, x0, 0, 6, TS, s.mid);                        // carved jamb post
      K.pxRect(ctx, x0, 0, 6, 2, s.hi); K.pxRect(ctx, x0, 0, 6, 1, s.spec);
      K.pxRect(ctx, side === 'l' ? 5 : x0 - 1, 0, 1, TS, s.out); // inner shadow line
      for (let fy = 5; fy < TS; fy += 6) K.pxRect(ctx, x0 + 1, fy, 4, 1, s.lo); // flutes
      return c;
    };
    const glow = (() => {                                        // cold draft-light in the gap
      const c = K.makeCanvas(TS * 2, TS); const ctx = c.getContext('2d');
      ctx.globalAlpha = 0.55;
      K.pxGlowSq(ctx, TS, TS / 2, 22, GRIEF, 4);
      return c;
    })();
    return { jambL: jamb('l'), jambR: jamb('r'), glow };
  }

  // Barred cold-iron gate: the locked way up, set in a stone frame. Purely a
  // read — the region's key-gated EXIT rect sits on the floor just before it.
  function gateTile() {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const s = K.ramp(STONE), i = K.ramp(IRON);
    K.pxRect(ctx, 0, 0, TS, TS, s.out);
    K.pxRect(ctx, 0, 0, 4, TS, s.mid); K.pxRect(ctx, TS - 4, 0, 4, TS, s.mid); // stone jambs
    K.pxRect(ctx, 0, 0, TS, 4, s.mid); K.pxRect(ctx, 0, 0, TS, 1, s.hi);       // lintel
    K.pxRect(ctx, 4, 4, TS - 8, TS - 4, K.DEEP_DUSK);           // dark behind the bars
    for (let bx = 6; bx < TS - 5; bx += 4) { K.pxRect(ctx, bx, 4, 2, TS - 4, i.mid); K.pxRect(ctx, bx, 4, 1, TS - 4, i.hi); }
    K.pxRect(ctx, 4, 11, TS - 8, 2, i.lo);                      // cross-brace
    K.pxRect(ctx, TS / 2 - 2, 10, 4, 4, i.hi);                  // cold lockplate
    K.pxRect(ctx, TS / 2 - 1, 12, 2, 3, GRIEF);                 // grief-cold keyhole glimmer
    K.outlineRect(ctx, 0, 0, TS, TS, i.out);
    return c;
  }

  // ---- fixture sprites (drawn y-sorted + STATEFUL by the region runtime) --
  function contact(ctx, x, y, w) { K.dither2(ctx, x, y, w, 4, K.DEEP_DUSK, 0.6); }

  // A beacon brazier: iron bowl on a fluted pillar. `lit` bakes the warm halo
  // (ember -> lantern, First-Flame-white core reserved for the very center) so
  // the stonework reads lit from within — the ONLY warmth in the dungeon. `big`
  // is the arena's central beacon. Never shadowBlur.
  function brazier(lit, big) {
    const w = big ? 38 : 28, h = big ? 54 : 38;                 // bigger: a brazier must read as a findable, interactable landmark, not a tiny pillar
    const c = K.makeCanvas(w, h); const ctx = c.getContext('2d');
    const cx = w >> 1;
    const iron = K.ramp(IRON), stone = K.ramp(STONE);
    contact(ctx, 3, h - 4, w - 6);
    const bw = big ? 28 : 20, by = big ? 15 : 11, bh = big ? 12 : 9;
    if (lit) {                                                   // baked firelight first
      K.pxGlowSq(ctx, cx, by - 1, big ? 28 : 19, K.EMBER, 6);
      K.pxGlowSq(ctx, cx, by - 1, big ? 17 : 12, K.LANTERN, 5);
    } else {                                                     // unlit: a dim carried-ember glow so the bowl reads as a thing you can spark
      K.pxGlowSq(ctx, cx, by + (bh >> 1), big ? 9 : 7, mixHex(IRON, K.EMBER, 0.55), 3);
    }
    // pillar / stem
    const pw = big ? 10 : 7, py = big ? 26 : 19;
    K.pxRect(ctx, cx - (pw >> 1), py, pw, h - py - 3, stone.lo);
    K.outlineRect(ctx, cx - (pw >> 1), py, pw, h - py - 3, stone.out);
    K.pxRect(ctx, cx - (pw >> 1), py, pw, 2, stone.hi);
    K.pxRect(ctx, cx - (pw >> 1) - 4, h - 5, pw + 8, 3, stone.lo);   // foot
    K.pxRect(ctx, cx - (pw >> 1) - 4, h - 5, pw + 8, 1, stone.mid);
    // iron bowl
    K.pxRect(ctx, cx - (bw >> 1), by, bw, bh, iron.mid);
    K.pxRect(ctx, cx - (bw >> 1), by, bw, 2, iron.hi);
    K.dither2(ctx, cx - (bw >> 1) + 1, by + 2, bw - 2, bh - 2, iron.lo, 0.5);
    K.outlineRect(ctx, cx - (bw >> 1), by, bw, bh, iron.out);
    if (lit) {                                                   // stepped flame, warm core
      const fh = big ? 12 : 8;
      K.pxRect(ctx, cx - 2, by - fh, 4, fh, K.EMBER);
      K.pxRect(ctx, cx - 1, by - fh - 2, 2, fh + 2, K.LANTERN);
      K.pxRect(ctx, cx, by - fh - 1, 1, 4, K.FIRST_FLAME);
    } else {                                                     // cold: banked embers still smoldering in the bowl (the interactable hint)
      K.pxRect(ctx, cx - 2, by + bh - 4, 4, 2, mixHex(IRON, K.EMBER, 0.5));
      K.pxRect(ctx, cx - 1, by + bh - 4, 1, 1, mixHex(IRON, K.EMBER, 0.75));
      K.pxRect(ctx, cx + 1, by + bh - 3, 1, 1, mixHex(IRON, GRIEF, 0.5));
    }
    K.outline(c, K.ramp('#241a2e').out);
    return c;
  }

  // The Keeper's cold-iron key: found once the beacon-line is rekindled. Sealed
  // (a grief-cold barrier) reads dim blue; freed reads warm with a baked glint.
  function keySprite(sealed) {
    const c = K.makeCanvas(20, 16); const ctx = c.getContext('2d');
    const warm = K.ramp('#c8a24a'), cold = K.ramp('#5a6a86');
    const r = sealed ? cold : warm;
    if (!sealed) K.pxGlowSq(ctx, 6, 8, 7, K.LANTERN, 4);
    contact(ctx, 3, 13, 14);
    K.pxRect(ctx, 3, 5, 6, 6, r.mid); K.outlineRect(ctx, 3, 5, 6, 6, r.out);   // bow (ring)
    K.pxRect(ctx, 5, 7, 2, 2, sealed ? K.DEEP_DUSK : K.EMBER);                  // ring hole
    K.pxRect(ctx, 9, 7, 8, 2, r.mid); K.pxRect(ctx, 9, 7, 8, 1, r.hi);         // shaft
    K.pxRect(ctx, 15, 9, 2, 3, r.mid); K.pxRect(ctx, 12, 9, 2, 2, r.mid);      // bit teeth
    if (sealed) { K.pxRect(ctx, 1, 4, 18, 1, GRIEF); K.pxRect(ctx, 1, 12, 18, 1, GRIEF); } // cold seal bars
    K.outline(c, K.ramp('#241a2e').out);
    return c;
  }

  // ---- cold dusk grade (baked; the runtime hot path never composites) ----
  // A deep blue-violet multiply that drowns every surface in grief-cold — heavier
  // than the interior's warm tint, so a lit brazier's carried warmth reads as the
  // one exception. Named duskTint for parity with SS.Tiles / SS.Interior.
  function duskTint(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#2a3050';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    return canvas;
  }

  // dungeons have no drifting moor beneath the tiles: the base is cold shadow,
  // fully overdrawn by wall/floor stamps (any seam reads as tomb-dark).
  function paintMoor(ctx, w, h /*, ox, oy */) {
    ctx.fillStyle = '#141420';
    ctx.fillRect(0, 0, w, h);
  }
  function emptyCanvas() { return K.makeCanvas(1, 1); }

  let cache = null;
  function build() {
    if (cache) return cache;
    if (!K.font.meta.ready) K.font.bake();
    const floors = [flagFloor(41), flagFloor(53), flagFloor(67)];
    const rubbles = [rubbleFloor(71), rubbleFloor(83)];
    const walls = [wallTile(0), wallTile(0), wallTile(1)];       // cracked variant rarer
    const stair = stairs(), thr = threshold(61), gate = gateTile(), column = columnTile();
    const pick = (arr, tx, ty) => arr[hash2(tx, ty) % arr.length];
    const floorStamp = (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(floors, tx, ty), dx, dy);
    const tiles = {
      'wall':      { solid: true, stamp: (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(walls, tx, ty), dx, dy) },
      'floor':     { solid: false, stamp: floorStamp },
      'rubble':    { solid: false, stamp: (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(rubbles, tx, ty), dx, dy) },
      'column':    { solid: true, stamp: (ctx, dx, dy) => ctx.drawImage(column, dx, dy) },
      'stair':     { solid: false, stamp: (ctx, dx, dy) => ctx.drawImage(stair, dx, dy) },
      'threshold': { solid: false, stamp: (ctx, dx, dy) => ctx.drawImage(thr, dx, dy) },
      'gate':      { solid: true, stamp: (ctx, dx, dy) => ctx.drawImage(gate, dx, dy) },
    };
    // fixture sprites the region runtime draws as stateful, y-sorted objects
    const fixtures = {
      brazier: { unlit: brazier(false, false), lit: brazier(true, false) },
      beacon:  { unlit: brazier(false, true), lit: brazier(true, true) },
      key:     { sealed: keySprite(true), freed: keySprite(false) },
    };
    // Parity stubs for the outdoor-only fields region.js reads generically — none
    // fire for a dungeon, but they keep the tile-registry contract identical to
    // SS.Tiles.build() so the pipeline stays provider-agnostic.
    const empty = emptyCanvas();
    cache = {
      TS, tiles, statics: {}, fixtures, doorway: doorwaySprites(), hash2, duskTint, paintMoor,
      scatter: [empty], bogMush: empty,
      lips: { n: empty, s: empty, w: empty, e: empty },
      cloudShadow: () => emptyCanvas(),
      buildCottage: () => emptyCanvas(),
      wispFrames: [], shrineGlowFrames: [],
    };
    return cache;
  }

  SS.Dungeon = { build, TS };
})();


// ===== src/art/hollow.js =====
// Hollow tileset + fixtures generator (D02). The Mothqueen's Hollow is the
// living heart of Gloamwood: a bioluminescent TREE-DUNGEON, the warm-alive
// opposite of the cold-stone Fallen Beacon. FLAT ROOMS like SS.Dungeon (never
// the director's continuous moor painting), but everything here breathes —
// ridged violet-brown bark walls, warm amber-violet heartwood floors threaded
// with faint glowing veins, knotted root-rubble, living trunk-columns, stepped
// roots, and woven thorn-gates. The signature is the fixture reskin: instead of
// iron braziers, clusters of BIOLUMINESCENT BULBS — closed dim pods until the
// Hollow wakes, then a warm-pink/foxfire-cyan BLOOM baked with pxGlowSq (never
// shadowBlur). A gap tile reads as an uncrossable chasm in the living wood: the
// engine agent makes it crossable only once the Moth Cloak's glide is earned.
//
// This module lives beside (never inside) SS.Dungeon and returns the SAME shape
// SS.Region.load consumes, so region.js selects it for any region whose tileset
// is "hollow" with no tile-pipeline special-casing. Its `fixtures` object reuses
// the exact keys brazier/beacon/key the region runtime hardcodes (region.js
// ~L144) — the bulbs ARE the braziers, the great bloom IS the beacon, the moth-
// cocoon IS the key. TS is 24 to match the shared engine.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  const TS = 24;

  function hash2(x, y) { let h = (x * 374761393 + y * 668265263) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return (h ^ (h >>> 16)) >>> 0; }
  function mixHex(a, b, t) {
    const A = K.hexToRgb(a), B = K.hexToRgb(b);
    return K.rgbToHex(A.r + (B.r - A.r) * t, A.g + (B.g - A.g) * t, A.b + (B.b - A.b) * t);
  }

  // living-tree palette bases. Deep violet-brown bark, warm amber-violet heart-
  // wood, and Gloamwood's two sacred accents: warm-pink moth + cold foxfire cyan.
  const BARK = '#3a2f42';        // ridged bark wall (violet-brown, alive)
  const HEART = '#5b4650';       // heartwood floor (warm amber-violet, walkable-bright)
  const ROOT = '#493a44';        // knotted root debris
  const LIVEWOOD = '#4a3a52';    // trunk / stem / stalk flesh
  const VEIN = '#d0a468';        // faint warm amber sap-vein
  const SILK = '#6a5a74';        // silvery-violet cocoon silk
  const MOTH = '#e0a0d0';        // warm-pink moth bloom
  const MOTH_CORE = '#f0c8e0';   // pink bloom core
  const MOTHQUEEN = '#c86aa0';   // deep queen-pink (bloom outline)
  const FOX = '#a8ccff';         // cold foxfire cyan
  const FOX_CORE = '#eaf4ff';    // foxfire core
  const CHASM = '#120c1c';       // the dark of the drop

  // ---- heartwood floor ---------------------------------------------------
  // Warm organic grain: wavering wood bands over a violet-shadow bed, faint
  // amber sap-veins that catch a low glow, and a little living grit. Kept
  // deliberately bright so it reads UNMISTAKABLY walkable under the dusk grade.
  // Three variants defeat the anti-repeat rule (art-bible).
  function heartwoodFloor(seed) {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp(HEART);
    const rnd = K.mulberry32((seed || 5) >>> 0);
    K.pxRect(ctx, 0, 0, TS, TS, r.lo);                              // shadowed bed
    let y = 0;                                                      // wavering grain bands
    while (y < TS) {
      const bh = 3 + ((rnd() * 3) | 0);
      const tone = rnd() < 0.3 ? r.hi : (rnd() < 0.4 ? r.mid : r.lo);
      for (let x = 0; x < TS; x++) {
        const wob = Math.round(Math.sin((x + seed) * 0.55 + y * 0.7) * 1.3);
        K.pxRect(ctx, x, y + wob, 1, bh, tone);
      }
      y += bh;
    }
    // a meandering warm sap-vein threading the grain
    let vx = 4 + ((rnd() * (TS - 8)) | 0);
    for (let vy = 0; vy < TS; vy += 2) {
      K.pxRect(ctx, vx, vy, 1, 2, mixHex(HEART, VEIN, 0.55));
      K.pxRect(ctx, vx, vy, 1, 1, mixHex(HEART, VEIN, 0.8));        // lit vein crest
      vx += (rnd() < 0.5 ? 1 : -1) * (rnd() < 0.45 ? 1 : 0);
      if (vx < 1) vx = 1; if (vx > TS - 2) vx = TS - 2;
    }
    // one faint pulse-node where the vein swells (baked glow, not a gradient)
    if (seed % 2 === 0) K.pxGlowSq(ctx, 4 + ((rnd() * (TS - 8)) | 0), 6 + ((rnd() * (TS - 12)) | 0), 3, VEIN, 3);
    K.pxNoise(ctx, 0, 0, TS, TS, [r.out, r.spec], seed + 3, 0.05);  // living grit + spark
    return c;
  }

  // Root-rubble: heartwood strewn with knotted, arcing root chunks — walkable
  // debris that breaks a long hall without blocking it.
  function rootRubble(seed) {
    const c = heartwoodFloor(seed); const ctx = c.getContext('2d');
    const r = K.ramp(ROOT);
    const rnd = K.mulberry32((seed * 3 + 13) >>> 0);
    for (let i = 0; i < 5; i++) {
      const x = 2 + ((rnd() * (TS - 8)) | 0), y = 3 + ((rnd() * (TS - 8)) | 0);
      const w = 4 + ((rnd() * 5) | 0);
      const bow = rnd() < 0.5 ? 1 : -1;                             // knotted arc
      for (let k = 0; k < w; k++) {
        const yy = y + Math.round(Math.sin(k / w * 3.14) * 2) * bow;
        K.pxRect(ctx, x + k, yy, 1, 3, r.mid);
        K.pxRect(ctx, x + k, yy, 1, 1, r.hi);                       // lit top of root
        K.pxRect(ctx, x + k, yy + 3, 1, 1, K.ramp(HEART).out);      // cast shadow
      }
    }
    return c;
  }

  // Threshold: swept heartwood sill catching a sliver of moth-light — the tile a
  // return/home exit sits over.
  function threshold(seed) {
    const c = heartwoodFloor(seed); const ctx = c.getContext('2d');
    K.pxRect(ctx, 3, TS - 3, TS - 6, 2, mixHex(HEART, MOTH, 0.30));
    K.pxRect(ctx, 5, TS - 4, TS - 10, 1, mixHex(HEART, MOTH_CORE, 0.5));
    return c;
  }

  // Glowing-moss decor floor: heartwood cushioned with cold foxfire moss whose
  // patches carry a small baked cyan glow (legible walkable, gently alive).
  function mossFloor(seed) {
    const c = heartwoodFloor(seed); const ctx = c.getContext('2d');
    const m = K.ramp('#3e5a52');                                    // damp cyan-green moss
    const rnd = K.mulberry32((seed * 5 + 7) >>> 0);
    for (let i = 0; i < 3; i++) {
      const x = 3 + ((rnd() * (TS - 9)) | 0), y = 3 + ((rnd() * (TS - 9)) | 0);
      const w = 4 + ((rnd() * 4) | 0), h = 3 + ((rnd() * 3) | 0);
      K.dither2(ctx, x, y, w, h, m.mid, 0.7);
      K.dither2(ctx, x, y, w, 1, m.hi, 0.6);
      if (rnd() < 0.7) K.pxGlowSq(ctx, x + (w >> 1), y + (h >> 1), 3, FOX, 3);  // foxfire spore
    }
    return c;
  }

  // Root-stair: stepped living roots climbing away (decorative, walkable). Mossy
  // lit nosings (cyan), shadowed risers — reads as the way up through the trunk.
  function rootStair() {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp(ROOT);
    K.pxRect(ctx, 0, 0, TS, TS, r.out);
    for (let s = 0; s < 4; s++) {
      const y = s * 6;
      for (let x = 1; x < TS - 1; x++) {                            // knotted, uneven tread
        const wob = Math.round(Math.sin(x * 0.6 + s) * 0.9);
        K.pxRect(ctx, x, y + wob, 1, 5, r.mid);
        K.pxRect(ctx, x, y + wob, 1, 1, mixHex(ROOT, FOX, 0.35));   // mossy lit nosing
      }
      K.pxRect(ctx, 1, y + 5, TS - 2, 1, r.out);                    // riser shadow
      K.dither2(ctx, 2, y + 1, TS - 4, 3, r.lo, 0.3);
    }
    return c;
  }

  // ---- bark walls --------------------------------------------------------
  // Ridged bark: vertical living-wood ridges (lit left edge, grooved right)
  // over a deep-violet bark bed, a warm-lit crown, knots and breaks. The rarer
  // variant carries a glowing sap-vein crack so no run of wall reads as flat.
  function barkWall(variant) {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp(BARK);
    const rnd = K.mulberry32(variant ? 31 : 17);
    K.pxRect(ctx, 0, 0, TS, TS, r.out);                            // bark bed
    let x = 0;
    while (x < TS) {                                               // vertical ridges
      const rw = 3 + ((rnd() * 3) | 0);
      const tone = rnd() < 0.35 ? r.lo : r.mid;
      K.pxRect(ctx, x, 0, rw, TS, tone);
      K.pxRect(ctx, x, 0, 1, TS, r.hi);                            // lit ridge edge
      K.pxRect(ctx, x + rw - 1, 0, 1, TS, r.out);                  // groove shadow
      if (rnd() < 0.3) { const ky = (rnd() * (TS - 3)) | 0; K.pxRect(ctx, x, ky, rw, 2, r.out); } // knot break
      x += rw;
    }
    K.pxNoise(ctx, 0, 2, TS, TS - 2, [r.out, r.lo], variant ? 9 : 5, 0.06); // bark grain
    K.pxRect(ctx, 0, 0, TS, 2, r.hi);                              // warm-lit crown
    K.pxRect(ctx, 0, 0, TS, 1, r.spec);
    if (variant) {                                                 // glowing sap-vein crack
      K.pxGlowSq(ctx, TS / 2, 12, 4, VEIN, 3);
      K.pxRect(ctx, TS / 2 - 1, 5, 2, 14, mixHex(BARK, VEIN, 0.6));
      K.pxRect(ctx, TS / 2, 5, 1, 14, mixHex(BARK, MOTH, 0.4));
    }
    K.outlineRect(ctx, 0, 0, TS, TS, r.out);
    return c;
  }

  // Trunk-column: a living trunk pillar (solid cover) rising in the floor. Bark
  // ridges, a warm-lit side, a faint vein pulse, seated by a root base. Stamped
  // flat into the chunk (no y-sort needed at this height).
  function trunkColumn() {
    const c = heartwoodFloor(89); const ctx = c.getContext('2d');
    const r = K.ramp(LIVEWOOD), b = K.ramp(BARK);
    K.pxRect(ctx, 5, 1, 14, 21, r.lo);
    for (let cx = 5; cx < 19; cx += 3) K.pxRect(ctx, cx, 1, 1, 21, b.out); // vertical bark grooves
    K.pxRect(ctx, 5, 1, 3, 21, r.mid);                             // warm-lit side
    K.pxRect(ctx, 5, 1, 2, 21, r.hi);
    K.pxRect(ctx, 6, 8, 1, 8, mixHex(LIVEWOOD, VEIN, 0.5));        // faint sap-vein pulse
    K.pxGlowSq(ctx, 12, 11, 3, VEIN, 3);
    K.dither2(ctx, 15, 3, 4, 17, b.out, 0.4);                      // shadowed far side
    K.pxRect(ctx, 4, 20, 16, 2, b.out);                            // root base shadow
    K.pxRect(ctx, 3, 21, 18, 1, K.ramp(HEART).out);
    K.outlineRect(ctx, 5, 1, 14, 21, b.out);
    return c;
  }

  // Thorn-gate: a woven bark-and-thorn barrier in a living-wood frame — the
  // SEALED look. Dark heartwood behind woven vertical posts, cross-lashed
  // thorns, a dim moth-lock glimmer. The runtime swaps the barrier open via
  // fixtures; this tile is the closed art.
  function thornGate() {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const w = K.ramp(LIVEWOOD), b = K.ramp(BARK);
    K.pxRect(ctx, 0, 0, TS, TS, b.out);
    K.pxRect(ctx, 0, 0, 4, TS, b.mid); K.pxRect(ctx, TS - 4, 0, 4, TS, b.mid);   // trunk jambs
    K.pxRect(ctx, 0, 0, 4, TS, b.hi > 0 ? b.hi : b.mid); K.pxRect(ctx, 0, 0, 1, TS, b.hi);
    K.pxRect(ctx, 0, 0, TS, 4, b.mid); K.pxRect(ctx, 0, 0, TS, 1, b.hi);         // lintel
    K.pxRect(ctx, 4, 4, TS - 8, TS - 4, CHASM);                    // dark behind the weave
    for (let bx = 5; bx < TS - 5; bx += 4) {                       // woven bark posts
      K.pxRect(ctx, bx, 4, 2, TS - 4, w.mid); K.pxRect(ctx, bx, 4, 1, TS - 4, w.hi);
    }
    for (let ty = 7; ty < TS - 2; ty += 6) {                       // cross-lashed thorns
      K.pxRect(ctx, 4, ty, TS - 8, 2, w.lo);
      for (let tx = 5; tx < TS - 5; tx += 5) K.pxRect(ctx, tx, ty - 1, 1, 1, w.out); // thorn barbs
    }
    K.pxGlowSq(ctx, TS / 2, 12, 3, MOTH, 3);                       // dim moth-lock glimmer
    K.pxRect(ctx, TS / 2 - 1, 11, 2, 3, mixHex(MOTHQUEEN, CHASM, 0.3));
    K.outlineRect(ctx, 0, 0, TS, TS, b.out);
    return c;
  }

  // Gap: an uncrossable CHASM in the living wood. Near lip in shadow at the
  // bottom, a lit far-edge bark lip up top, a recessed drop between, and a
  // couple of glow-moths rising from the deep — so it reads UNMISTAKABLY as a
  // gap you cannot yet cross. Solid to the engine until the Moth Cloak's glide
  // is earned. Two variants so a run of gap doesn't tile-repeat.
  function gapTile(variant) {
    const c = K.makeCanvas(TS, TS); const ctx = c.getContext('2d');
    const r = K.ramp(BARK);
    const rnd = K.mulberry32(variant ? 43 : 29);
    K.pxRect(ctx, 0, 0, TS, TS, CHASM);                            // the void
    // lit far-edge lip (top) — the far side you can see across
    K.pxRect(ctx, 0, 0, TS, 5, r.mid);
    for (let x = 0; x < TS; x++) { const wob = Math.round(Math.sin(x * 0.5 + variant) * 1.2); K.pxRect(ctx, x, 4 + wob, 1, 2, r.out); } // ragged far edge
    K.pxRect(ctx, 0, 0, TS, 1, r.hi); K.pxRect(ctx, 0, 1, TS, 1, r.spec); // lit crown of the far side
    // recessed drop: darkening bands falling away into black
    K.dither2(ctx, 1, 6, TS - 2, 6, mixHex(CHASM, BARK, 0.35), 0.5);
    K.dither2(ctx, 2, 10, TS - 4, 6, CHASM, 0.7);
    K.pxRect(ctx, 3, 15, TS - 6, TS - 18, '#080510');              // bottomless core
    // near lip (bottom) — the overhang the party stands on, in shadow
    K.pxRect(ctx, 0, TS - 3, TS, 3, K.ramp(HEART).out);
    K.pxRect(ctx, 0, TS - 3, TS, 1, K.ramp(HEART).lo);
    // glow-moths rising from the deep (baked, tiny)
    K.pxGlowSq(ctx, 6 + ((rnd() * 12) | 0), 12 + ((rnd() * 4) | 0), 2, FOX, 3);
    K.pxGlowSq(ctx, 6 + ((rnd() * 12) | 0), 9 + ((rnd() * 3) | 0), 2, MOTH, 3);
    K.pxRect(ctx, 8 + ((rnd() * 8) | 0), 13, 1, 1, FOX_CORE);
    K.outlineRect(ctx, 0, 0, TS, TS, '#050308');                   // deep seat
    return c;
  }

  // ---- fixture sprites (drawn y-sorted + STATEFUL by the region runtime) --
  function contact(ctx, x, y, w) { K.dither2(ctx, x, y, w, 4, K.DEEP_DUSK, 0.6); }

  // one bioluminescent pod. Cold+closed when the Hollow sleeps (dim violet
  // shell, dark seam); a lit warm-pink or foxfire-cyan bloom when woken. Halo is
  // baked by the caller with pxGlowSq — this is just the pod body.
  function drawPod(ctx, px, py, pr, lit, warm) {
    if (lit) {
      const skin = warm ? MOTH : FOX;
      const core = warm ? MOTH_CORE : FOX_CORE;
      K.pxRect(ctx, px - pr, py - pr, pr * 2, pr * 2, skin);
      K.pxRect(ctx, px - pr + 1, py - pr + 1, pr * 2 - 2, pr * 2 - 2, core);
      K.pxRect(ctx, px - 1, py - 1, 2, 2, '#ffffff');              // spec kiss
      // knock corners round
      ctx.clearRect(px - pr, py - pr, 1, 1); ctx.clearRect(px + pr - 1, py - pr, 1, 1);
      ctx.clearRect(px - pr, py + pr - 1, 1, 1); ctx.clearRect(px + pr - 1, py + pr - 1, 1, 1);
      K.outlineRect(ctx, px - pr, py - pr, pr * 2, pr * 2, K.ramp(MOTHQUEEN).out);
    } else {
      const s = K.ramp('#443a5c');                                 // dim closed shell
      K.pxRect(ctx, px - pr, py - pr, pr * 2, pr * 2, s.mid);
      K.pxRect(ctx, px - pr, py - pr, pr * 2, 1, s.hi);            // faint lit top
      K.dither2(ctx, px - pr + 1, py - pr + 1, pr * 2 - 2, pr * 2 - 2, s.out, 0.4);
      K.pxRect(ctx, px, py - pr, 1, pr * 2, s.out);               // closed seam
      ctx.clearRect(px - pr, py - pr, 1, 1); ctx.clearRect(px + pr - 1, py - pr, 1, 1);
      ctx.clearRect(px - pr, py + pr - 1, 1, 1); ctx.clearRect(px + pr - 1, py + pr - 1, 1, 1);
      K.outlineRect(ctx, px - pr, py - pr, pr * 2, pr * 2, s.out);
    }
  }

  // A bioluminescent bulb-cluster on a living stalk — the Hollow's brazier
  // reskin. `lit` bakes the pink/cyan bloom halo (pxGlowSq, never shadowBlur);
  // `big` is the arena's grand central heartwood bloom (the beacon).
  function bulb(lit, big) {
    const w = big ? 32 : 22, h = big ? 46 : 30;
    const c = K.makeCanvas(w, h); const ctx = c.getContext('2d');
    const cx = w >> 1;
    const wood = K.ramp(LIVEWOOD);
    contact(ctx, 3, h - 4, w - 6);
    const headY = big ? 15 : 10;
    if (lit) {                                                     // baked bloom, warm-pink over foxfire
      K.pxGlowSq(ctx, cx, headY, big ? 26 : 17, MOTH, 6);
      K.pxGlowSq(ctx, cx, headY, big ? 17 : 11, FOX, 5);
      K.pxGlowSq(ctx, cx, headY, big ? 9 : 6, MOTH_CORE, 4);
    }
    // living stalk
    const sw = big ? 7 : 5, sy = big ? 23 : 16;
    K.pxRect(ctx, cx - (sw >> 1), sy, sw, h - sy - 3, wood.lo);
    K.pxRect(ctx, cx - (sw >> 1), sy, 2, h - sy - 3, wood.mid);    // lit side
    K.outlineRect(ctx, cx - (sw >> 1), sy, sw, h - sy - 3, wood.out);
    K.pxRect(ctx, cx - (sw >> 1) - 3, h - 5, sw + 6, 3, wood.lo);  // root foot
    K.pxRect(ctx, cx - (sw >> 1) - 3, h - 5, sw + 6, 1, wood.mid);
    // pod cluster
    if (big) {
      drawPod(ctx, cx, 15, 6, lit, true);                         // grand central bloom
      drawPod(ctx, cx - 8, 17, 3, lit, false);
      drawPod(ctx, cx + 8, 17, 3, lit, true);
      drawPod(ctx, cx, 7, 3, lit, false);
      drawPod(ctx, cx - 5, 9, 2, lit, true);
      drawPod(ctx, cx + 5, 9, 2, lit, false);
    } else {
      drawPod(ctx, cx, 10, 3, lit, true);
      drawPod(ctx, cx - 5, 13, 2, lit, false);
      drawPod(ctx, cx + 5, 12, 2, lit, true);
      drawPod(ctx, cx, 6, 2, lit, false);
    }
    K.outline(c, K.ramp('#241a2e').out);
    return c;
  }

  // The Mothqueen's cocoon-key: a silvery-violet cocoon lashed with silk. Sealed
  // = closed, dim, a cold cyan seam-glimmer. Freed = split open, a baked warm
  // key-glow spilling out with the key itself cradled inside.
  function cocoon(sealed) {
    const c = K.makeCanvas(20, 22); const ctx = c.getContext('2d');
    const cx = 10;
    const silk = K.ramp(SILK);
    if (!sealed) { K.pxGlowSq(ctx, cx, 11, 8, MOTH, 5); K.pxGlowSq(ctx, cx, 11, 5, K.LANTERN, 4); }
    contact(ctx, 4, 19, 12);
    if (sealed) {
      K.pxRect(ctx, cx - 4, 3, 8, 15, silk.mid);                  // closed pod body
      K.pxRect(ctx, cx - 5, 6, 10, 9, silk.mid);
      K.pxRect(ctx, cx - 4, 3, 8, 2, silk.hi);                    // lit crown
      K.pxRect(ctx, cx - 3, 2, 6, 1, silk.hi);
      for (let sy = 4; sy < 17; sy += 3) {                        // diagonal silk lashings
        K.pxRect(ctx, cx - 5, sy, 10, 1, silk.lo);
        K.pxRect(ctx, cx - 4 + ((sy) % 3), sy + 1, 8, 1, silk.out);
      }
      K.pxRect(ctx, cx, 3, 1, 15, silk.out);                      // closed seam
      K.pxRect(ctx, cx - 1, 8, 2, 5, mixHex(SILK, FOX, 0.4));     // cold seam-glimmer
      ctx.clearRect(cx - 5, 3, 1, 1); ctx.clearRect(cx + 4, 3, 1, 1);
      K.outline(c, K.ramp('#241a2e').out);
    } else {
      // split open — two silk halves drawn back
      K.pxRect(ctx, cx - 6, 3, 4, 15, silk.mid); K.pxRect(ctx, cx - 6, 3, 4, 2, silk.hi);
      K.pxRect(ctx, cx + 2, 3, 4, 15, silk.mid); K.pxRect(ctx, cx + 2, 3, 4, 2, silk.hi);
      for (let sy = 5; sy < 17; sy += 3) { K.pxRect(ctx, cx - 6, sy, 4, 1, silk.lo); K.pxRect(ctx, cx + 2, sy, 4, 1, silk.lo); }
      K.pxRect(ctx, cx - 2, 4, 4, 14, mixHex(K.LANTERN, MOTH_CORE, 0.4)); // glow spilling from within
      // the key, cradled and warm
      const warm = K.ramp('#d8b45a');
      K.pxRect(ctx, cx - 2, 6, 4, 4, warm.mid); K.outlineRect(ctx, cx - 2, 6, 4, 4, warm.out); // bow ring
      K.pxRect(ctx, cx - 1, 7, 2, 2, K.EMBER);                    // ring hole
      K.pxRect(ctx, cx - 1, 10, 2, 6, warm.mid); K.pxRect(ctx, cx - 1, 10, 1, 6, warm.hi); // shaft
      K.pxRect(ctx, cx + 1, 13, 2, 2, warm.mid); K.pxRect(ctx, cx + 1, 15, 2, 2, warm.mid); // bit teeth
      K.pxRect(ctx, cx - 1, 6, 1, 1, '#ffffff');                  // glint
      K.outline(c, K.ramp('#241a2e').out);
    }
    return c;
  }

  // ---- living dusk grade (baked; the runtime hot path never composites) --
  // A warm living violet-amber: a violet multiply drowns the surfaces (this is
  // still deep Gloamwood), but a faint amber screen keeps the Hollow ALIVE — the
  // deliberate opposite of the Fallen Beacon's grief-cold blue. Named duskTint
  // for parity with SS.Tiles / SS.Dungeon.
  function duskTint(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#33284a';                                    // living violet
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#3a2610';                                    // faint amber warmth (alive)
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    return canvas;
  }

  // No drifting moor beneath a tree-dungeon: the base is warm heartwood shadow,
  // fully overdrawn by the stamps (any seam reads as living-wood dark, not the
  // beacon's tomb-cold).
  function paintMoor(ctx, w, h /*, ox, oy */) {
    ctx.fillStyle = '#171020';
    ctx.fillRect(0, 0, w, h);
  }
  function emptyCanvas() { return K.makeCanvas(1, 1); }

  let cache = null;
  function build() {
    if (cache) return cache;
    if (!K.font.meta.ready) K.font.bake();
    const floors = [heartwoodFloor(41), heartwoodFloor(52), heartwoodFloor(67)];
    const rubbles = [rootRubble(71), rootRubble(84)];
    const mosses = [mossFloor(23), mossFloor(38)];
    const walls = [barkWall(0), barkWall(0), barkWall(1)];        // sap-vein variant rarer
    const gaps = [gapTile(0), gapTile(1)];
    const stair = rootStair(), thr = threshold(61), gate = thornGate(), column = trunkColumn();
    const pick = (arr, tx, ty) => arr[hash2(tx, ty) % arr.length];
    const floorStamp = (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(floors, tx, ty), dx, dy);
    const tiles = {
      'bark-wall':       { solid: true, stamp: (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(walls, tx, ty), dx, dy) },
      'heartwood-floor': { solid: false, stamp: floorStamp },
      'root-rubble':     { solid: false, stamp: (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(rubbles, tx, ty), dx, dy) },
      'trunk-column':    { solid: true, stamp: (ctx, dx, dy) => ctx.drawImage(column, dx, dy) },
      'root-stair':      { solid: false, stamp: (ctx, dx, dy) => ctx.drawImage(stair, dx, dy) },
      'threshold':       { solid: false, stamp: (ctx, dx, dy) => ctx.drawImage(thr, dx, dy) },
      'thorn-gate':      { solid: true, stamp: (ctx, dx, dy) => ctx.drawImage(gate, dx, dy) },
      'gap':             { solid: true, stamp: (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(gaps, tx, ty), dx, dy) },
      'moss':            { solid: false, stamp: (ctx, dx, dy, tx, ty) => ctx.drawImage(pick(mosses, tx, ty), dx, dy) },
    };
    // fixture sprites the region runtime draws as stateful, y-sorted objects —
    // the bulbs ARE the braziers, the grand bloom IS the beacon, the cocoon IS
    // the key (region.js keys on brazier/beacon/key by name).
    const fixtures = {
      brazier: { unlit: bulb(false, false), lit: bulb(true, false) },
      beacon:  { unlit: bulb(false, true), lit: bulb(true, true) },
      key:     { sealed: cocoon(true), freed: cocoon(false) },
    };
    // Parity stubs for the outdoor-only fields region.js reads generically — none
    // fire for a dungeon, but they keep the tile-registry contract identical to
    // SS.Tiles.build() so the pipeline stays provider-agnostic.
    const empty = emptyCanvas();
    cache = {
      TS, tiles, statics: {}, fixtures, hash2, duskTint, paintMoor,
      scatter: [empty], bogMush: empty,
      lips: { n: empty, s: empty, w: empty, e: empty },
      cloudShadow: () => emptyCanvas(),
      buildCottage: () => emptyCanvas(),
      wispFrames: [], shrineGlowFrames: [],
    };
    return cache;
  }

  SS.Hollow = { build, TS };
})();


// ===== src/art/enemy.js =====
// A04 — Enemy sprites. Thirteen creature FAMILIES drawn from the Solmere
// bestiary (world-bible): each is a distinct BODY PLAN, not a recolor — the
// black silhouette alone must read at couch distance. Built entirely from the
// crunch kit (5-step hue-shifted ramps, dither, stepped square glow, dark-
// violet outline, warm rim-light) per docs/art-bible.md. Every frame is baked
// to a shelf-packed atlas at load: idle (2f) + move (3-4f) + a wind-up
// telegraph frame where the creature attacks, each with a lantern-warm rim
// variant (the world is lit by carried light) and a white-flash hit variant
// (combat C05 reads .rim for play and .flash on damage). No runtime gradients,
// no shadowBlur, no per-frame path ops — the hot path is drawImage only.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  const px = (ctx, x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); };
  const OUTLINE = '#241a2e';       // dusk-violet outline (never black), house rule
  const EMBER = K.EMBER;           // #ff9a3c — Cindermarch / Smolder ember-life
  const EMBER_HOT = '#ff5a1e';     // deeper ember for glutton innards

  // ---- shared silhouette helpers ---------------------------------------
  // a small stepped ember/cold core glow, baked (rgba fills at bake time only).
  function core(ctx, cx, cy, r, color) { K.pxGlowSq(ctx, cx, cy, r, color, 4); }
  // a single lit "eye" pixel with a hot center — the read that says "alive".
  function eye(ctx, x, y, color, hot) { px(ctx, x, y, 2, 2, color); px(ctx, x, y, 1, 1, hot || K.FIRST_FLAME); }

  // =======================================================================
  // FAMILY DESCRIPTORS — each carries size, ground anchor (the pixel that
  // aligns to an entity's world (x,y) foot/ground point), animation counts,
  // and its own bake(). Anchors let C05 place a tiny moth and a heavy revenant
  // by the same rule: dx = e.x - anchor.x, dy = e.y - anchor.y.
  // =======================================================================

  // 1. MOOR-SHAMBLER — Duskmoor's peat-and-root brute. STOOPED BIPED: a
  //    narrow-shouldered hump up top, two long arms that hang BELOW the body
  //    and splay OUTSIDE its width to drag their knuckles, short legs tucked
  //    between. Silhouette reads unmistakably as a hunched ape/man, not a box.
  const MOOR_SHAMBLER = {
    id: 'moor-shambler', name: 'Moor Shambler', w: 26, h: 30, ax: 13, ay: 29,
    anims: { idle: 2, move: 4, tele: 1 },
    peat: K.ramp('#3c4a38'), mud: K.ramp('#4a3b2a'), moss: K.ramp('#6a7a3a'),
    bake(ctx, D, action, i) {
      const breathe = action === 'idle' ? (i & 1) : 0;
      const top = 3 + breathe;
      // stooped torso hump — narrower than the arm span (upper mass only)
      px(ctx, 8, top + 3, 10, 13, D.peat.mid);
      K.dither(ctx, 8, top + 6, 10, 9, D.peat.mid, D.peat.lo);
      px(ctx, 8, top + 3, 10, 3, D.peat.hi);            // lit shoulder hump
      px(ctx, 7, top + 14, 12, 3, D.peat.out);          // heavy under-shadow
      // moss clumps breaking the shoulder line
      px(ctx, 9, top + 1, 5, 3, D.moss.mid); px(ctx, 14, top, 4, 2, D.moss.hi);
      // sunk head low on the hump — brow ridge + two dim amber eyes
      px(ctx, 10, top + 5, 6, 3, D.peat.lo);
      eye(ctx, 10, top + 6, EMBER, '#ffd08a'); eye(ctx, 14, top + 6, EMBER, '#ffd08a');
      // short stubby legs BETWEEN the arms (kept well inside the arm span)
      const stepA = action === 'move' ? [0, 1, 0, 1][i] : 0;
      const stepB = action === 'move' ? [1, 0, 1, 0][i] : 0;
      px(ctx, 9, 22 - stepA, 4, 8, D.mud.lo);
      px(ctx, 13, 22 - stepB, 4, 8, D.mud.mid);
      // LONG dragging arms — reach BELOW the torso and OUTSIDE its width, ending
      // in heavy knuckles near the ground (the knuckle-walk read).
      const swing = action === 'move' ? [1, 3, 1, -1][i] : 0;
      px(ctx, 1, top + 5, 5, 20, D.mud.mid);            // left arm down the outside
      px(ctx, 1, top + 5, 5, 2, D.mud.hi);
      px(ctx, 0, top + 21 + Math.min(2, swing), 6, 5, D.mud.lo);   // left knuckle
      if (action === 'tele') {
        // right arm reared high overhead to smash — breaks the top-right outline
        px(ctx, 19, top - 6, 5, 18, D.mud.mid); px(ctx, 20, top - 8, 4, 4, D.mud.hi);
      } else {
        px(ctx, 20, top + 5, 5, 20, D.mud.mid);         // right arm down the outside
        px(ctx, 20, top + 5, 5, 2, D.mud.hi);
        px(ctx, 20, top + 21 - Math.min(2, swing), 6, 5, D.mud.lo); // right knuckle
      }
    },
  };

  // 2. WISP — Duskmoor will-o-wisp. A small cold flame that floats and lures.
  //    Silhouette: round teardrop bob with a trailing wick-tail, no limbs.
  const WISP = {
    id: 'wisp', name: 'Marsh Wisp', w: 14, h: 20, ax: 7, ay: 19,
    anims: { idle: 2, move: 3 },
    cold: K.ramp('#7fd8e0'), halo: K.ramp('#5a6ab0'),
    bake(ctx, D, action, i) {
      const bob = action === 'idle' ? (i & 1) : [0, 1, 2][i] | 0;
      const cy = 7 + bob;
      // trailing tail (wisps of cold light drifting down toward the anchor)
      for (let t = 0; t < 5; t++) { const tw = 3 - ((t + i) & 1); px(ctx, 7 - (tw >> 1), cy + 4 + t, tw, 1, t < 3 ? D.cold.lo : D.halo.lo); }
      // teardrop body
      core(ctx, 7, cy + 1, 7, '#bfeef2');
      px(ctx, 4, cy, 6, 5, D.cold.mid);
      px(ctx, 5, cy - 2, 4, 3, D.cold.hi);              // rounded crown

      px(ctx, 8, oy + 7, 7, 2, D.maw.mid);
      for (let t = 0; t < 4; t++) {                     // jagged teeth on the inner lips
        px(ctx, 8 + t, oy + 6 - (t & 1), 1, 2, D.ash.hi);
        px(ctx, 14 - t, oy + 5 - (t & 1) - gape, 1, 2, D.ash.hi);
      }
      // single ember eye on the heavier right side
      eye(ctx, 17, oy + 4, EMBER, K.FIRST_FLAME);
      // torn side notches (break the side outline too)
      px(ctx, 3, oy + 12, 2, 2, K.DEEP_DUSK); px(ctx, 19, oy + 13, 2, 2, K.DEEP_DUSK);
      // drifting ash tail below (it floats; anchor is the ground under it)
      px(ctx, 9, oy + 16, 5, 3, D.ash.lo); px(ctx, 10, oy + 19, 2, 3, D.ash.out);
    },
  };

  // 13. CINDER-CROW — ember-life scavenger bird of the Ashlands. An unmistakable
  //     FLYING BIRD in silhouette: compact body with a hooked BEAK thrust to the
  //     right, two swept wings whose pointed primary tips break the outline well
  //     past the body on both sides, and a fanned, NOTCHED tail to the left.
  //     Crunched with kit ramps + dither (not a flat fill).
  const CINDER_CROW = {
    id: 'cinder-crow', name: 'Cinder Crow', w: 28, h: 20, ax: 14, ay: 19,
    anims: { idle: 2, move: 4, tele: 1 },
    feather: K.ramp('#33303c'), beak: K.ramp('#c9b98a'), ember: K.ramp('#ff8a3c'),
    bake(ctx, D, action, i) {
      const cx = 15, cy = 11;
      const flap = action === 'move' ? [-4, -1, 3, -1][i] : (i ? -2 : -3); // wing-tip vertical
      const dive = action === 'tele' ? 1 : 0;
      // compact body
      px(ctx, cx - 3, cy - 1, 8, 6, D.feather.mid);
      px(ctx, cx - 3, cy - 1, 8, 2, D.feather.hi);
      K.dither(ctx, cx - 3, cy + 1, 8, 4, D.feather.mid, D.feather.lo);
      // hooked beak thrust forward (right) — a pointed wedge past the body
      px(ctx, cx + 5, cy, 4, 2, D.beak.mid); px(ctx, cx + 8, cy, 2, 1, D.beak.hi);
      px(ctx, cx + 8, cy + 1, 1, 1, D.beak.lo);         // downward hook
      eye(ctx, cx + 2, cy, D.ember.hi, K.FIRST_FLAME);
      // fanned, notched tail at the rear (left), spreading past the body
      px(ctx, cx - 9, cy + 1, 6, 5, D.feather.lo);
      px(ctx, cx - 12, cy, 4, 2, D.feather.mid);        // upper tail feather
      px(ctx, cx - 12, cy + 4, 4, 2, D.feather.mid);    // lower tail feather
      px(ctx, cx - 9, cy + 3, 6, 1, D.feather.out);     // notch between them
      if (!dive) {
        // two wings swept UP and OUT; pointed primary tips break the outline
        px(ctx, cx - 7, cy - 2 + flap, 9, 3, D.feather.mid); px(ctx, cx - 7, cy - 2 + flap, 9, 1, D.feather.hi);
        px(ctx, cx - 1, cy - 2 + flap, 9, 3, D.feather.mid); px(ctx, cx - 1, cy - 2 + flap, 9, 1, D.feather.hi);
        px(ctx, cx - 10, cy - 1 + flap, 3, 2, D.feather.lo); // back primary tip
        px(ctx, cx + 8, cy - 1 + flap, 3, 2, D.feather.lo);  // front primary tip
      } else {
        // dive telegraph: wings fold back into a streamlined arrow
        px(ctx, cx - 6, cy - 2, 6, 3, D.feather.lo); px(ctx, cx - 10, cy - 1, 4, 2, D.feather.out);
        px(ctx, cx, cy - 2, 5, 3, D.feather.lo);
      }
      // ember flecks in the plumage (crunch accent)
      px(ctx, cx - 1, cy + 2, 1, 1, D.ember.mid); px(ctx, cx + 2, cy + 1, 1, 1, D.ember.lo);
    },
  };

  const FAMILIES = [
    MOOR_SHAMBLER, WISP, ASH_HOUND, EMBER_MOTH, CINDER_PARASITE, GLASS_WRAITH,
    FROST_REVENANT, CINDER_EEL, EMBER_URCHIN, FOOTMAN, PIKEMAN, GLUTTON_SPAWN, CINDER_CROW,
  ];

  // bake one frame of a family into a fresh canvas, outlined in dusk-violet.
  function bakeFrame(D, action, i) {
    const c = K.makeCanvas(D.w, D.h);
    const ctx = c.getContext('2d');
    D.bake(ctx, D, action, i);
    K.outline(c, K.ramp(OUTLINE).out);
    return c;
  }

  // ---- build the atlas (called once at load) ----------------------------
  let built = null;
  function build() {
    if (built) return built;
    if (!K.font.meta.ready) K.font.bake();
    const atlas = new SS.Atlas(512);
    const meta = {};
    for (const D of FAMILIES) {
      const counts = D.anims;
      for (const action in counts) {
        for (let i = 0; i < counts[action]; i++) {
          const base = bakeFrame(D, action, i);
          const key = `${D.id}.${action}.${i}`;
          atlas.add(key, base);
          atlas.add(key + '.rim', K.rim(base, 'r', K.LANTERN));   // world lit by lantern
          atlas.add(key + '.flash', K.flashVariant(base, K.FIRST_FLAME)); // hit feedback (C05)
        }
      }
      meta[D.id] = {
        id: D.id, name: D.name, w: D.w, h: D.h,
        anchor: { x: D.ax, y: D.ay },
        anims: Object.assign({}, counts),
      };
    }
    built = { atlas, families: meta, list: FAMILIES.map(f => f.id) };
    return built;
  }

  // ---- silhouette (review) ----------------------------------------------
  // fill every opaque pixel of a baked frame solid black — proves the shape
  // reads with zero interior detail. Used only by the contact sheet.
  function silhouette(frame, color) {
    const c = K.makeCanvas(frame.w, frame.h);
    const ctx = c.getContext('2d');
    ctx.drawImage(frame.sheet, frame.sx, frame.sy, frame.w, frame.h, 0, 0, frame.w, frame.h);
    const img = ctx.getImageData(0, 0, frame.w, frame.h);
    const { r, g, b } = K.hexToRgb(color || '#000000');
    for (let p = 0; p < img.data.length; p += 4) {
      if (img.data[p + 3] > 40) { img.data[p] = r; img.data[p + 1] = g; img.data[p + 2] = b; img.data[p + 3] = 255; }
      else img.data[p + 3] = 0;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // ---- bestiary contact sheet (director review) -------------------------
  // Draws a labeled 1280x720 review grid into ctx: a top SILHOUETTE lineup
  // (each family's idle read as solid black — the distinctness proof) and a
  // per-family card grid of the colored idle/move/telegraph frames + a rim and
  // flash variant demo. Read-only: touches no game state. Everything is drawn
  // at 2x (couch-distance review scale). ctx is a 1280x720 2D context.
  function debugContactSheet(ctx) {
    const b = build();
    const S = 2;                                   // integer review scale
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#12101c'; ctx.fillRect(0, 0, 1280, 720);   // dusk backdrop
    const drawFrame = (frame, dx, dy) => ctx.drawImage(frame.sheet, frame.sx, frame.sy, frame.w, frame.h, dx | 0, dy | 0, frame.w * S, frame.h * S);
    const label = (s, x, y, col) => K.font.text(ctx, s, x | 0, y | 0, col || '#c8c2d4', 1);

    label('SHATTERED SUN  -  BESTIARY CONTACT SHEET  (A04)', 12, 10, K.LANTERN);
    label('13 FAMILIES  -  DISTINCT SILHOUETTES, NOT RECOLORS', 12, 22, '#8f8aa0');

    // --- silhouette lineup on a lighter panel so black shapes read ---------
    const panelY = 34, panelH = 130;
    ctx.fillStyle = '#6b6780'; ctx.fillRect(12, panelY, 1256, panelH);
    ctx.fillStyle = '#7a7690'; ctx.fillRect(12, panelY, 1256, 2);
    label('SILHOUETTE READ (idle, solid black) - each must be identifiable by shape alone', 18, panelY + 4, '#1a1622');
    const n = b.list.length;
    const cellW = Math.floor(1256 / n);
    b.list.forEach((id, k) => {
      const m = b.families[id];
      const f = b.atlas.get(`${id}.idle.0`);
      const sil = silhouette(f, '#0a0810');
      const cxp = 12 + k * cellW + Math.floor((cellW - f.w * S) / 2);
      const baseY = panelY + panelH - 22;                        // align feet
      ctx.drawImage(sil, cxp, baseY - f.h * S);
      // name (short) under each silhouette
      const short = id.replace('cindermarch-', 'cm-');
      label(short, 12 + k * cellW + 2, panelY + panelH - 16, '#161320');
    });

    // --- per-family colored cards (idle + move + telegraph, plus rim/flash) -
    const gridTop = panelY + panelH + 10;
    const cols = 2, rows = Math.ceil(n / cols);
    const cardW = Math.floor(1256 / cols), cardH = Math.floor((720 - gridTop - 8) / rows);
    b.list.forEach((id, k) => {
      const m = b.families[id];
      const col = k % cols, row = (k / cols) | 0;
      const cxp = 12 + col * cardW, cyp = gridTop + row * cardH;
      ctx.fillStyle = (k & 1) ? '#181521' : '#1d1a28'; ctx.fillRect(cxp, cyp, cardW - 4, cardH - 3);
      label(m.name, cxp + 6, cyp + 4, K.LANTERN);
      label(m.w + 'x' + m.h, cxp + cardW - 44, cyp + 4, '#6f6a82');
      // baseline to sit sprites on (feet-aligned by anchor.y)
      const baseY = cyp + cardH - 8;
      let dx = cxp + 6;
      const put = (key, tag) => {
        const f = b.atlas.get(key); if (!f) return;
        drawFrame(f, dx, baseY - m.anchor.y * S);
        if (tag) label(tag, dx, baseY + 1, '#57536a');
        dx += f.w * S + 6;
      };
      for (let i = 0; i < m.anims.idle; i++) put(`${id}.idle.${i}`, i === 0 ? 'idle' : '');
      for (let i = 0; i < m.anims.move; i++) put(`${id}.move.${i}`, i === 0 ? 'move' : '');
      if (m.anims.tele) put(`${id}.tele.0`, 'tell');
      dx += 8;
      put(`${id}.idle.0.rim`, 'rim');
      put(`${id}.idle.0.flash`, 'hit');
    });
    return b;
  }

  SS.Enemies = { build, debugContactSheet, families: () => build().families, silhouette };
})();


// ===== src/art/boss.js =====
// A05 — Boss sprites. Seven BOSS families, one per dungeon/finale, each a large
// (44-64px) articulated creature that reads as a BOSS by silhouette alone —
// bigger and more detailed than any A04 rank-and-file, and a different body plan
// from every other boss. Identities come straight from the bibles (world/
// narrative/quest): a grief-ghost Keeper knight, a moth-matriarch you CURE, a
// glass-and-cinder colossus, a frozen robed astronomer, a rearing sea-leviathan,
// the courteous armored Ashen King you DUEL, and the light-devouring Smolder.
//
// Built entirely from the crunch kit (5-step hue-shifted ramps, dither, stepped
// square glow, dark-violet outline, warm rim-light) per docs/art-bible.md. Every
// frame bakes to a shelf-packed atlas: an idle breathing cycle plus a readable
// wind-up TELEGRAPH frame for the boss's signature attack (a fair Zelda boss
// always tells its move), each with a lantern-warm rim variant (the world is lit
// by carried light) and a white-flash hit variant. The Smolder also carries a
// phase-2 read. No runtime gradients, no shadowBlur, no per-frame path ops — the
// hot path is drawImage only. build() is lazy: nothing bakes until a boss review
// or a boss fight asks for it, so bosses stay out of memory during ordinary play.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  const px = (ctx, x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); };
  const OUTLINE = '#241a2e';       // dusk-violet outline (never black), house rule
  const EMBER = K.EMBER;           // #ff9a3c
  const EMBER_HOT = '#ff5a1e';     // deeper ember for hungry cores

  // stepped square glow (baked rgba fills — never a smooth radial or shadowBlur)
  function core(ctx, cx, cy, r, color) { K.pxGlowSq(ctx, cx, cy, r, color, 4); }
  // a lit "eye" pixel with a hot center — the read that says "alive"
  function eye(ctx, x, y, color, hot) { px(ctx, x, y, 2, 2, color); px(ctx, x, y, 1, 1, hot || K.FIRST_FLAME); }

  // =======================================================================
  // FAMILY DESCRIPTORS — size, ground anchor (aligns to the entity's world
  // foot point), animation counts, palette ramps, and a bake(). Anchors let a
  // future B01-B07 place every boss by the same rule regardless of body plan.
  // =======================================================================

  // 1. BEACON WRAITH (B01, Duskmoor / Fallen Beacon) — the grief-ghost of the
  //    Keeper knight who died at his post. Silhouette: a BROAD spectral knight,
  //    horned helm, tattered cloak fraying into wisps (no legs — it floats),
  //    with a tall Keeper SIGNAL-STAFF on the right topped by a caged cold flame
  //    (the fallen beacon it is bound to). Telegraph: the caged beacon FLARES
  //    huge and the free arm rears — the wail/light-slam it must not be woken to.
  const BEACON_WRAITH = {
    id: 'beacon-wraith', name: 'Beacon Wraith', short: 'BEACON', w: 48, h: 58, ax: 22, ay: 56,
    anims: { idle: 2, tele: 1 },
    body: K.ramp('#5f6f92'), cloak: K.ramp('#2e2a44'), cold: K.ramp('#7fc8dd'),
    bake(ctx, D, action, i) {
      const drift = action === 'idle' ? (i & 1) : 0;
      const top = 6 + drift;
      const flare = action === 'tele' ? 4 : 0;
      // --- tall signal-staff + caged beacon on the right (silhouette spike) ---
      px(ctx, 40, top + 2, 2, 44, D.cloak.hi);                 // staff pole
      px(ctx, 38, top - 3, 8, 1, D.cold.hi); px(ctx, 38, top + 5, 8, 1, D.cold.hi);   // cage top/bottom bars
      px(ctx, 38, top - 3, 1, 9, D.cold.hi); px(ctx, 45, top - 3, 1, 9, D.cold.hi);   // cage side bars
      core(ctx, 41, top + 1, 5 + flare, action === 'tele' ? '#dff4fb' : '#8fd6e6');   // caged cold flame
      px(ctx, 40, top - 1, 3, 4, K.FIRST_FLAME);               // cold-white heart of the beacon
      // --- broad ghostly shoulders + torso (dither reads translucent) ---
      px(ctx, 8, top + 6, 22, 4, D.body.hi);                   // broad shoulder line
      px(ctx, 10, top + 10, 18, 16, D.body.mid);
      K.dither(ctx, 10, top + 14, 18, 12, D.body.mid, D.body.lo);
      px(ctx, 11, top + 24, 16, 2, D.body.out);                // under-chest shadow
      // hollow horned helm — two cold eyes in the dark of the visor
      px(ctx, 13, top - 2, 2, 4, D.body.lo); px(ctx, 23, top - 2, 2, 4, D.body.lo);   // helm horns/crest
      px(ctx, 14, top, 10, 9, D.body.mid); px(ctx, 14, top, 10, 2, D.body.hi);
      px(ctx, 15, top + 2, 8, 5, D.cloak.out);                 // hollow shadowed face
      eye(ctx, 16, top + 3, D.cold.hi, K.FIRST_FLAME); eye(ctx, 20, top + 3, D.cold.hi, K.FIRST_FLAME);
      // free arm — hangs at rest, rears up on the telegraph
      const raise = action === 'tele' ? 7 : 0;
      px(ctx, 5, top + 11 - raise, 4, 12, D.body.lo); px(ctx, 5, top + 11 - raise, 4, 2, D.body.mid);
      // tattered cloak fraying into drifting wisps below (no feet)
      for (let f = 0; f < 9; f++) {
        const fx = 9 + f * 2;
        const flen = 12 - ((f * 3 + i * 2) % 6);
        px(ctx, fx, top + 26, 2, flen, (f & 1) ? D.cloak.mid : D.cloak.lo);
      }
      px(ctx, 16, top + 40, 6, 4, D.cloak.out);                // last wisp gathers at the anchor
    },
  };

  // 2. THE MOTHQUEEN (B02, Gloamwood) — an ancient moth-matriarch, NOT a monster:
  //    a cinder parasite has burrowed into her and the fight CURES her (burn the
  //    growth, spare the host). Silhouette: a majestic symmetric moth with grand
  //    feathered wings spread wide, a draped regal body-pillar, a feathery crown
  //    of antennae, gentle downturned eyes — and one UGLY asymmetric ember canker
  //    clamped to her thorax (the target). Telegraph: the PARASITE swells and
  //    flares before its spore-burst — she stays serene; the growth is the threat.
  const MOTHQUEEN = {
    id: 'mothqueen', name: 'The Mothqueen', short: 'MOTHQUEEN', w: 62, h: 50, ax: 31, ay: 48,
    anims: { idle: 2, tele: 1 },
    wing: K.ramp('#6a4a8a'), robe: K.ramp('#4a3a6a'), glow: K.ramp('#d07ab0'), para: K.ramp('#5a4a44'),
    bake(ctx, D, action, i) {
      const cx = 31, cy = 12;
      const beat = action === 'idle' ? (i ? 2 : 0) : 1;        // slow regal wing-raise
      // --- grand wings, drawn mirrored around the body-pillar ---
      for (const s of [-1, 1]) {
        const wx = s < 0 ? cx - 26 : cx + 4;                   // upper wing box start
        px(ctx, wx, cy + beat, 22, 14, D.wing.mid);
        px(ctx, wx, cy + beat, 22, 2, D.wing.hi);              // lit leading edge
        K.dither(ctx, wx + 2, cy + 4 + beat, 18, 9, D.wing.mid, D.wing.lo);
        // scalloped trailing edge (crunch, not a flat fill)
        for (let e = 0; e < 5; e++) px(ctx, wx + 1 + e * 4, cy + 12 + beat, 2, 2 + (e & 1), D.wing.lo);
        // glowing eye-spot high on the wing
        const es = s < 0 ? cx - 17 : cx + 8;
        core(ctx, es + 2, cy + 6 + beat, 4, '#eaa6d0');
        px(ctx, es, cy + 4 + beat, 5, 5, D.glow.mid); px(ctx, es + 1, cy + 5 + beat, 3, 3, D.glow.hi);
        // lower wing (smaller, hangs below)
        const lwx = s < 0 ? cx - 17 : cx + 3;
        px(ctx, lwx, cy + 16, 14, 10, D.wing.lo); px(ctx, lwx, cy + 16, 14, 1, D.wing.mid);
      }
      // --- draped body-pillar (the matriarch), centered ---
      px(ctx, cx - 4, cy + 2, 8, 26, D.robe.mid);
      K.dither(ctx, cx - 4, cy + 10, 8, 16, D.robe.mid, D.robe.lo);
      px(ctx, cx - 4, cy + 2, 8, 3, D.robe.hi);
      px(ctx, cx - 6, cy + 26, 12, 8, D.robe.lo); px(ctx, cx - 7, cy + 32, 14, 4, D.robe.out); // hem drape
      // gentle head + downturned eyes (serene, a host — not a beast)
      px(ctx, cx - 3, cy - 4, 6, 7, D.robe.mid); px(ctx, cx - 3, cy - 4, 6, 2, D.robe.hi);
      eye(ctx, cx - 2, cy - 1, D.glow.hi, K.FIRST_FLAME); eye(ctx, cx + 1, cy - 1, D.glow.hi, K.FIRST_FLAME);
      px(ctx, cx - 2, cy + 2, 4, 1, D.robe.out);               // soft downturned mouth-line
      // feathery crown of antennae
      for (const s of [-1, 1]) for (let a = 0; a < 4; a++) {
        px(ctx, cx + s * (1 + a), cy - 6 - a * 2, 1, 2, D.glow.mid);
        px(ctx, cx + s * (2 + a), cy - 6 - a * 2, 1, 1, D.glow.hi);
      }
      // --- THE PARASITE: the cinder canker to BURN (asymmetric, foreign, ember) ---
      const swell = action === 'tele' ? 3 : 0;
      px(ctx, cx + 3, cy + 8, 8, 9 + swell, D.para.mid);
      K.dither(ctx, cx + 3, cy + 10, 8, 6 + swell, D.para.mid, D.para.lo);
      px(ctx, cx + 3, cy + 8, 8, 1, D.para.hi);
      px(ctx, cx + 1, cy + 12, 3, 1, D.para.lo); px(ctx, cx + 4, cy + 16, 2, 4, D.para.lo); // grasping roots
      core(ctx, cx + 7, cy + 12, 4 + swell, EMBER_HOT);
      px(ctx, cx + 6, cy + 11, 3, 3, EMBER); px(ctx, cx + 7, cy + 12, 1, 1, K.FIRST_FLAME);
      if (action === 'tele') core(ctx, cx + 7, cy + 12, 7, EMBER); // flares bright before the spore-burst
    },
  };

  // 3. GLASS COLOSSUS (B03, Cinder Steppe / Glasskiln) — a towering storm-built
  //    automaton of fused glass and cinder that shatters and reforms. Silhouette:
  //    a HUGE blocky biped, enormous angular shoulders and fists, a tiny head sunk
  //    between them, thick pillar legs with a clear gap between. Telegraph: it
  //    rears one giant fist high overhead while the cinder core and body-cracks
  //    flare WIDE — the shatter/slam wind-up.
  const GLASS_COLOSSUS = {
    id: 'glass-colossus', name: 'Glass Colossus', short: 'COLOSSUS', w: 56, h: 64, ax: 28, ay: 62,
    anims: { idle: 2, tele: 1 },
    glass: K.ramp('#4f8f96'), cinder: K.ramp('#e07a34'),
    bake(ctx, D, action, i) {
      const breathe = action === 'idle' ? (i & 1) : 0;
      const wind = action === 'tele' ? 4 : 0;
      const top = 6 + breathe;
      // massive pillar legs (gap between them for the silhouette read)
      px(ctx, 8, 40, 12, 22, D.glass.mid); K.dither(ctx, 8, 48, 12, 14, D.glass.mid, D.glass.lo); px(ctx, 8, 40, 12, 3, D.glass.hi);
      px(ctx, 36, 40, 12, 22, D.glass.mid); K.dither(ctx, 36, 48, 12, 14, D.glass.mid, D.glass.lo); px(ctx, 36, 40, 12, 3, D.glass.hi);
      px(ctx, 7, 60, 14, 3, D.glass.out); px(ctx, 35, 60, 14, 3, D.glass.out);        // slab feet
      // enormous faceted torso
      px(ctx, 10, top + 10, 36, 26, D.glass.mid); px(ctx, 10, top + 10, 36, 4, D.glass.hi);
      K.dither(ctx, 12, top + 16, 32, 18, D.glass.mid, D.glass.lo);
      px(ctx, 20, top + 10, 2, 26, D.glass.hi); px(ctx, 34, top + 10, 2, 26, D.glass.lo); // facet seams
      // cinder core + cracks (widen on telegraph = the shatter tell)
      const crack = action === 'tele' ? 2 : 0;
      core(ctx, 28, top + 24, 7 + wind, EMBER); px(ctx, 24, top + 20, 8, 8, EMBER_HOT); px(ctx, 27, top + 23, 3, 3, K.FIRST_FLAME);
      px(ctx, 28, top + 12, 1 + crack, 9, D.cinder.hi); px(ctx, 22, top + 24, 7, 1 + crack, D.cinder.mid); px(ctx, 31, top + 27, 9, 1 + crack, D.cinder.mid);
      // colossal angular shoulders (break the outline wide)
      px(ctx, 2, top + 8, 12, 10, D.glass.mid); px(ctx, 2, top + 8, 12, 3, D.glass.hi); px(ctx, 2, top + 7, 3, 3, D.glass.spec);
      px(ctx, 42, top + 8, 12, 10, D.glass.mid); px(ctx, 42, top + 8, 12, 3, D.glass.hi); px(ctx, 51, top + 7, 3, 3, D.glass.spec);
      // fists — both low at rest; on telegraph the right rears high to slam
      if (action === 'tele') {
        px(ctx, 43, 1, 13, 13, D.glass.mid); px(ctx, 43, 1, 13, 3, D.glass.hi); px(ctx, 44, 0, 3, 3, D.glass.spec); // raised fist
        px(ctx, 0, top + 22, 10, 13, D.glass.lo);                                   // lowered fist coiled
      } else {
        px(ctx, 0, top + 20, 10, 14, D.glass.mid); px(ctx, 0, top + 20, 10, 3, D.glass.hi);
        px(ctx, 46, top + 20, 10, 14, D.glass.mid); px(ctx, 46, top + 20, 10, 3, D.glass.hi);
      }
      // tiny head sunk between the shoulders + shard-crown glints
      px(ctx, 23, top + 2, 10, 9, D.glass.mid); px(ctx, 23, top + 2, 10, 2, D.glass.hi);

      px(ctx, 24, top, 2, 2, D.glass.spec); px(ctx, 30, top, 2, 2, D.glass.spec);
    },
  };

  // 4. THE PALE ASTRONOMER (B04, Frostreach / Pale Observatory) — the last Keeper
  //    observer, frozen mid-vigil, animated by grief; a tragic robed stargazer.
  //    Silhouette: a tall STILL robe-column with a bowed cowled head, hem pooled
  //    to the floor, and a big frost-caked ARMILLARY LENS-RING floating up-right
  //    (the reading-lens — the silhouette signature). Cold and motionless.
  //    Telegraph: the lens-ring core charges white and a focused beam-line forms
  //    beneath it — the light/lens beam it will loose.
  const PALE_ASTRONOMER = {
    id: 'pale-astronomer', name: 'Pale Astronomer', short: 'ASTRONOMER', w: 46, h: 60, ax: 17, ay: 58,
    anims: { idle: 2, tele: 1 },
    robe: K.ramp('#5a6a86'), ice: K.ramp('#bcd6e4'), lens: K.ramp('#d8c46a'),
    bake(ctx, D, action, i) {
      const breathe = action === 'idle' ? (i & 1) : 0;
      const top = 6 + breathe;

      px(ctx, 8, top + 10, 18, 30, D.robe.mid);
      K.dither(ctx, 8, top + 18, 18, 22, D.robe.mid, D.robe.lo);
      px(ctx, 8, top + 10, 18, 3, D.robe.hi);
      px(ctx, 6, top + 38, 22, 6, D.robe.lo); px(ctx, 5, top + 43, 24, 3, D.robe.out); // pooled hem
      // cowl + bowed head, shadowed face
      px(ctx, 10, top, 14, 12, D.robe.mid); px(ctx, 10, top, 14, 3, D.robe.hi);

      eye(ctx, 13, top + 6, D.lens.hi, K.FIRST_FLAME); eye(ctx, 18, top + 6, D.lens.hi, K.FIRST_FLAME);
      // frost rime crusting the robe
      px(ctx, 9, top + 16, 4, 1, D.ice.hi); px(ctx, 20, top + 24, 5, 1, D.ice.mid); px(ctx, 8, top + 31, 3, 1, D.ice.hi);
      // one arm raised toward the lens (rises further on telegraph)

      px(ctx, 23, top + 12 - raise, 4, 12, D.robe.lo); px(ctx, 23, top + 12 - raise, 4, 2, D.robe.mid);
      // --- ARMILLARY LENS-RING (hollow circle up-right — the signature) ---
      const rcx = 35, rcy = top + 9, R = 9;
      for (let a = 0; a < 22; a++) { const ang = a / 22 * Math.PI * 2; px(ctx, Math.round(rcx + Math.cos(ang) * R), Math.round(rcy + Math.sin(ang) * R), 2, 2, D.ice.mid); }
      for (let a = 0; a < 18; a++) { const ang = a / 18 * Math.PI * 2; px(ctx, Math.round(rcx + Math.cos(ang) * (R - 3)), Math.round(rcy + Math.sin(ang) * (R - 3)), 1, 1, D.ice.lo); }
      px(ctx, rcx - R, rcy, R * 2, 1, D.ice.hi);               // horizon spar across the ring
      // lens core — charges bright on the telegraph
      const chg = action === 'tele' ? 6 : 2;
      core(ctx, rcx, rcy, chg, action === 'tele' ? '#fff2b0' : D.lens.mid);
      px(ctx, rcx - 1, rcy - 1, 3, 3, D.lens.hi); px(ctx, rcx, rcy, 1, 1, K.FIRST_FLAME);
      if (action === 'tele') for (let b = 0; b < 9; b++) px(ctx, rcx - 1, rcy + R + b * 2, 2, 2, (b & 1) ? D.lens.hi : D.lens.mid); // focused beam-line
    },
  };

  // 5. CINDER-EEL LEVIATHAN (B05, Sunken Cauldron / Ember Deep) — the massive
  //    serpentine boiler-beast of the drowned caldera. Silhouette: a body COILED
  //    on the sea floor with a thick neck REARING vertically to a big frilled,
  //    fanged head at the top (utterly unlike the small horizontal A04 eel).
  //    Telegraph: the head draws back and the maw gapes glowing — the lunge/dive.
  const CINDER_EEL_LEVIATHAN = {
    id: 'cinder-eel-leviathan', name: 'Cinder-Eel Leviathan', short: 'LEVIATHAN', w: 60, h: 64, ax: 28, ay: 62,
    anims: { idle: 2, tele: 1 },
    skin: K.ramp('#2f5a5e'), belly: K.ramp('#c8492c'), frill: K.ramp('#8fd0c8'),
    bake(ctx, D, action, i) {
      const sway = action === 'tele' ? -3 : (action === 'idle' ? (i ? 2 : -2) : 0);
      // --- coiled body on the sea floor ---
      px(ctx, 6, 48, 46, 12, D.skin.mid);
      K.dither(ctx, 6, 52, 46, 8, D.skin.mid, D.skin.lo);
      px(ctx, 6, 48, 46, 3, D.skin.hi);
      px(ctx, 5, 58, 48, 2, D.skin.out);
      for (let x = 8; x < 50; x += 4) px(ctx, x, 55, 2, 1, D.belly.mid);              // ember belly scales
      // --- rearing neck (thick S column, tapering up) ---
      let nx = 26, ny = 48;
      for (let s = 0; s < 10; s++) {
        const t = s / 9;
        nx = 26 + Math.round(Math.sin(t * 2.0) * 5) + Math.round(sway * t);
        ny = 48 - s * 4;
        const th = 13 - s;
        px(ctx, nx - (th >> 1), ny - 2, th, 5, D.skin.mid);
        px(ctx, nx - (th >> 1), ny - 2, th, 1, D.skin.hi);
        px(ctx, nx - (th >> 1) - 1, ny - 3, 2, 2, D.frill.mid);                       // dorsal frill nubs
      }
      // --- reared head at the top ---
      const hx = nx, hy = 6, gape = action === 'tele' ? 4 : 0, draw = action === 'tele' ? 3 : 0;
      const hcx = hx - draw;
      px(ctx, hcx - 8, hy, 18, 12, D.skin.mid); px(ctx, hcx - 8, hy, 18, 3, D.skin.hi);
      K.dither(ctx, hcx - 6, hy + 5, 14, 6, D.skin.mid, D.skin.lo);
      // fanning gill-frills (silhouette signature at the head)
      for (let f = 0; f < 4; f++) { px(ctx, hcx - 10 - f, hy + 2 + f * 2, 3, 2, D.frill.lo); px(ctx, hcx + 8 + f, hy + 2 + f * 2, 3, 2, D.frill.lo); }
      px(ctx, hcx - 12, hy + 1, 3, 6, D.frill.mid); px(ctx, hcx + 10, hy + 1, 3, 6, D.frill.mid);
      eye(ctx, hcx - 4, hy + 4, D.belly.hi, K.FIRST_FLAME); eye(ctx, hcx + 3, hy + 4, D.belly.hi, K.FIRST_FLAME);
      // maw: lower jaw drops and the throat glows on the telegraph
      px(ctx, hcx - 8, hy + 12 + gape, 16, 4, D.skin.lo);

      for (let t = 0; t < 5; t++) {
        px(ctx, hcx - 7 + t * 3, hy + 11, 1, 2 + gape, D.frill.hi);                   // upper fangs
        if (gape) px(ctx, hcx - 7 + t * 3, hy + 13 + gape, 1, 3, D.frill.hi);         // lower fangs
      }
