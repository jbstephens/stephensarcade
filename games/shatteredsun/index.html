  };

  // 6. THE ASHEN KING / SIR CORVANE (B06, Sun Forge) — the courteous, exhausted
  //    king; the fight is a DUEL and he must read as a PERSON, not a monster:
  //    human proportions, a spiked CROWN fused to the helm, a long royal cloak
  //    pooling wide, a greatsword held point-down at weary rest, and the stolen
  //    shard-ember burning in his chest that keeps him from dying or grieving.
  //    Telegraph: he lifts the greatsword high in a two-handed heavy commitment —
  //    an honest, readable wind-up (he never gloats, and he never cheats).
  const ASHEN_KING = {
    id: 'ashen-king', name: 'Ashen King', short: 'ASHEN KING', w: 44, h: 62, ax: 20, ay: 60,
    anims: { idle: 2, tele: 1 },
    iron: K.ramp('#3f3a4a'), steel: K.ramp('#9098a4'), gold: K.ramp('#c8a24a'), cloak: K.ramp('#5a2438'),
    bake(ctx, D, action, i) {
      const breathe = action === 'idle' ? (i & 1) : 0;
      const top = 4 + breathe;
      // long royal cloak (flares wide + pools at the floor — regal, weary weight)
      px(ctx, 6, top + 10, 30, 34, D.cloak.lo);
      K.dither(ctx, 6, top + 24, 30, 20, D.cloak.lo, D.cloak.out);
      px(ctx, 4, top + 40, 34, 6, D.cloak.out);
      // armored legs
      px(ctx, 13, 44, 6, 14, D.iron.mid); px(ctx, 21, 44, 6, 14, D.iron.lo);
      px(ctx, 12, 56, 8, 3, D.iron.out); px(ctx, 21, 56, 8, 3, D.iron.out);
      // torso plate + tabard, with the shard-ember heart
      px(ctx, 11, top + 12, 18, 22, D.iron.mid); px(ctx, 11, top + 12, 18, 4, D.iron.hi);
      K.dither(ctx, 11, top + 20, 18, 14, D.iron.mid, D.iron.lo);
      core(ctx, 20, top + 22, 6, EMBER); px(ctx, 16, top + 18, 8, 8, EMBER_HOT); px(ctx, 19, top + 21, 3, 3, K.FIRST_FLAME);
      // pauldrons with gold trim
      px(ctx, 6, top + 11, 9, 7, D.iron.mid); px(ctx, 6, top + 11, 9, 2, D.iron.hi); px(ctx, 6, top + 10, 3, 2, D.gold.spec);
      px(ctx, 25, top + 11, 9, 7, D.iron.mid); px(ctx, 25, top + 11, 9, 2, D.iron.hi); px(ctx, 31, top + 10, 3, 2, D.gold.spec);
      // crowned helm — spiked crown fused to the dome (silhouette signature)
      px(ctx, 14, top, 12, 12, D.iron.mid); px(ctx, 14, top, 12, 3, D.iron.hi);
      px(ctx, 15, top + 4, 10, 2, EMBER);                      // tired glowing visor slit
      for (let c = 0; c < 5; c++) { const tall = c === 2 ? 6 : 4; px(ctx, 13 + c * 4, top - tall, 2, tall + 1, D.gold.mid); px(ctx, 13 + c * 4, top - tall, 2, 1, D.gold.spec); }
      // greatsword — point-down at rest; lifted high overhead on the telegraph
      if (action === 'tele') {
        px(ctx, 17, top - 2, 10, 7, D.iron.lo);                // both arms up, gripping
        px(ctx, 17, top - 2, 10, 2, D.gold.mid);               // crossguard at the hands

        px(ctx, 20, top - 24, 3, 30, D.steel.hi); px(ctx, 20, top - 24, 1, 30, D.steel.spec); // blade raised
      } else {
        px(ctx, 28, top + 16, 4, 10, D.iron.lo);               // sword arm rests at the hip
        px(ctx, 30, top + 15, 5, 2, D.gold.mid);               // crossguard
        px(ctx, 29, top + 13, 3, 3, D.gold.mid);               // pommel
        px(ctx, 31, top + 17, 3, 35, D.steel.hi); px(ctx, 31, top + 17, 1, 35, D.steel.spec); // blade point-down
      }
    },
  };

  // 7. THE SMOLDER (B07, Sun Forge finale, two phases) — Fin's "Ember-Glutton"
  //    grown vast: the patient hunger that eats light. Silhouette: a huge horned
  //    void-mass with a great gaping MAW ringed by jagged teeth, an ember-and-
  //    white throat (the swallowed light), two ember eyes, and torn tendrils
  //    breaking the bottom edge. Telegraph: the maw widens and embers funnel INWARD
  //    from above — the light-eating beam. Phase 2 (`p2`) splits the mass down a
  //    glowing fissure and bares more of the burning core.
  const SMOLDER = {
    id: 'smolder', name: 'The Smolder', short: 'SMOLDER', w: 64, h: 56, ax: 32, ay: 54,
    anims: { idle: 2, tele: 1, p2: 1 },
    voidc: K.ramp('#241f2c'), maw: K.ramp('#ff7a2c'),
    bake(ctx, D, action, i) {
      const bob = action === 'idle' ? (i & 1) : 0;
      const oy = 6 + bob;
      const p2 = action === 'p2';
      const gape = action === 'tele' ? 5 : (p2 ? 3 : 0);
      // vast dark body mass
      px(ctx, 4, oy + 6, 56, 38, D.voidc.mid);
      K.dither(ctx, 4, oy + 14, 56, 28, D.voidc.mid, D.voidc.lo);
      px(ctx, 4, oy + 6, 56, 3, D.voidc.hi);
      px(ctx, 2, oy + 40, 60, 4, D.voidc.out);
      // great curved horns breaking the top corners (silhouette signature)
      for (const s of [-1, 1]) {
        const bx = s < 0 ? 6 : 50;
        px(ctx, bx, oy - 2, 8, 10, D.voidc.mid); px(ctx, bx, oy - 2, 8, 2, D.voidc.hi);
        px(ctx, bx + (s < 0 ? 0 : 6), oy - 8, 2, 8, D.voidc.mid);
        px(ctx, bx + (s < 0 ? -1 : 7), oy - 12, 3, 6, D.voidc.lo);                    // curling tip
      }
      // THE MAW — a gaping oval: ember throat, white-hot swallowed-light center,
      // ringed by jagged teeth
      const mw = 22 + gape * 2, mh = 16 + gape * 2, mcx = 32, mcy = oy + 14;
      core(ctx, mcx, mcy, 11 + gape, EMBER_HOT);
      px(ctx, mcx - (mw >> 1) + 2, mcy - (mh >> 1) + 2, mw - 4, mh - 4, EMBER);
      core(ctx, mcx, mcy, 5, K.FIRST_FLAME);                   // the light it has eaten
      for (let t = 0; t < 14; t++) { const ang = t / 14 * Math.PI * 2; px(ctx, Math.round(mcx + Math.cos(ang) * (mw >> 1)) - 1, Math.round(mcy + Math.sin(ang) * (mh >> 1)) - 1, 3, 3, D.voidc.hi); }
      // two ember eyes riding above the maw
      eye(ctx, mcx - 11, oy + 6, EMBER, K.FIRST_FLAME); eye(ctx, mcx + 9, oy + 6, EMBER, K.FIRST_FLAME);
      // torn tendrils breaking the bottom edge (it hovers; anchor is the floor under it)
      for (let f = 0; f < 7; f++) { const fx = 6 + f * 8; const fl = 6 + ((f + i) % 4) * 2; px(ctx, fx, oy + 44, 3, fl, (f & 1) ? D.voidc.mid : D.voidc.lo); }
      if (action === 'tele') {
        // light-eating beam: embers funnel INWARD toward the maw from above
        for (let b = 0; b < 8; b++) { const spread = 11 - b; px(ctx, mcx - spread, oy - 14 + b * 3, 2, 2, (b & 1) ? EMBER : D.maw.hi); px(ctx, mcx + spread - 2, oy - 14 + b * 3, 2, 2, (b & 1) ? EMBER : D.maw.hi); }
      }
      if (p2) {
        // phase 2: a glowing fissure splits the mass; more of the core bares through
        px(ctx, mcx - 1, oy + 4, 2, 42, D.maw.hi);
        for (let c = 0; c < 5; c++) px(ctx, 10 + c * 11, oy + 30, 6, 2, EMBER);
        px(ctx, 4, oy + 6, 56, 1, EMBER);                      // rim of the widening crack
      }
    },
  };

  const FAMILIES = [
    BEACON_WRAITH, MOTHQUEEN, GLASS_COLOSSUS, PALE_ASTRONOMER,
    CINDER_EEL_LEVIATHAN, ASHEN_KING, SMOLDER,
  ];

  // bake one frame of a family into a fresh canvas, outlined in dusk-violet.
  function bakeFrame(D, action, i) {
    const c = K.makeCanvas(D.w, D.h);
    const ctx = c.getContext('2d');
    D.bake(ctx, D, action, i);
    K.outline(c, K.ramp(OUTLINE).out);
    return c;
  }

  // ---- build the atlas (lazy — called once when a boss review/fight loads) ----
  let built = null;
  function build() {
    if (built) return built;
    if (!K.font.meta.ready) K.font.bake();
    const atlas = new SS.Atlas(512);
    const meta = {};
    for (const D of FAMILIES) {
      const counts = D.anims;
      for (const action in counts) {
        for (let i = 0; i < counts[action]; i++) {
          const base = bakeFrame(D, action, i);
          const key = `${D.id}.${action}.${i}`;
          atlas.add(key, base);
          atlas.add(key + '.rim', K.rim(base, 'r', K.LANTERN));           // world lit by carried light
          atlas.add(key + '.flash', K.flashVariant(base, K.FIRST_FLAME)); // hit feedback
        }
      }
      meta[D.id] = {
        id: D.id, name: D.name, short: D.short, w: D.w, h: D.h,
        anchor: { x: D.ax, y: D.ay },
        anims: Object.assign({}, counts),
      };
    }
    built = { atlas, families: meta, list: FAMILIES.map(f => f.id) };
    return built;
  }

  // ---- silhouette (review) ----------------------------------------------
  // fill every opaque pixel of a baked frame solid — proves the shape reads with
  // zero interior detail. Used only by the boss contact sheet.
  function silhouette(frame, color) {
    const c = K.makeCanvas(frame.w, frame.h);
    const ctx = c.getContext('2d');
    ctx.drawImage(frame.sheet, frame.sx, frame.sy, frame.w, frame.h, 0, 0, frame.w, frame.h);
    const img = ctx.getImageData(0, 0, frame.w, frame.h);
    const { r, g, b } = K.hexToRgb(color || '#000000');
    for (let p = 0; p < img.data.length; p += 4) {
      if (img.data[p + 3] > 40) { img.data[p] = r; img.data[p + 1] = g; img.data[p + 2] = b; img.data[p + 3] = 255; }
      else img.data[p + 3] = 0;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // ---- boss contact sheet (director review) -----------------------------
  // A top SILHOUETTE lineup (each boss idle in solid black — the distinctness
  // proof) plus per-boss cards showing the colored idle + telegraph big (2x),
  // and idle.1 / rim / hit (and the Smolder's phase-2) small (1x). Read-only:
  // it builds the sprite atlas and paints its own 1280x720 overlay canvas, never
  // touching game state.
  function debugContactSheet(ctx) {
    const b = build();
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#12101c'; ctx.fillRect(0, 0, 1280, 720);
    const label = (s, x, y, c) => K.font.text(ctx, s, x | 0, y | 0, c || '#c8c2d4', 1);
    label('SHATTERED SUN  -  BOSS CONTACT SHEET  (A05)', 12, 10, K.LANTERN);
    label('7 BOSSES  -  DISTINCT SILHOUETTES + FAIR TELEGRAPHS, NOT RESKINS', 12, 22, '#8f8aa0');

    // --- silhouette lineup on a lighter panel so the black shapes read ---
    const panelY = 34, panelH = 150;
    ctx.fillStyle = '#6b6780'; ctx.fillRect(12, panelY, 1256, panelH);
    ctx.fillStyle = '#7a7690'; ctx.fillRect(12, panelY, 1256, 2);
    label('SILHOUETTE READ (idle, solid black) - each identifiable by shape alone', 18, panelY + 4, '#1a1622');
    const n = b.list.length, cellW = Math.floor(1256 / n);
    b.list.forEach((id, k) => {
      const m = b.families[id];
      const f = b.atlas.get(`${id}.idle.0`);
      const sil = silhouette(f, '#0a0810');
      const cxp = 12 + k * cellW + Math.floor((cellW - f.w) / 2);
      const baseY = panelY + panelH - 24;
      ctx.drawImage(sil, cxp, baseY - f.h);
      label(m.short, 12 + k * cellW + 4, panelY + panelH - 15, '#161320');
    });

    // --- per-boss cards (4 cols x 2 rows) ---
    const gridTop = panelY + panelH + 8;
    const cols = 4, rows = 2;
    const cardW = Math.floor(1256 / cols), cardH = Math.floor((720 - gridTop - 6) / rows);
    b.list.forEach((id, k) => {
      const m = b.families[id];
      const col = k % cols, row = (k / cols) | 0;
      const cxp = 12 + col * cardW, cyp = gridTop + row * cardH;
      ctx.fillStyle = (k & 1) ? '#181521' : '#1d1a28'; ctx.fillRect(cxp, cyp, cardW - 4, cardH - 3);
      label(m.name, cxp + 6, cyp + 4, K.LANTERN);
      label(m.w + 'x' + m.h, cxp + cardW - 46, cyp + 4, '#6f6a82');
      // secondary row (1x) up top: idle.1, rim, hit, (+ p2 for the Smolder)
      const topBase = cyp + 74;
      let sx = cxp + 6;
      const putS = (key, tag) => { const f = b.atlas.get(key); if (!f) return; ctx.drawImage(f.sheet, f.sx, f.sy, f.w, f.h, sx | 0, (topBase - m.anchor.y) | 0, f.w, f.h); if (tag) label(tag, sx, topBase + 1, '#57536a'); sx += f.w + 5; };
      if (m.anims.idle > 1) putS(`${id}.idle.1`, 'idle+');
      putS(`${id}.idle.0.rim`, 'rim');
      putS(`${id}.idle.0.flash`, 'hit');
      if (m.anims.p2) putS(`${id}.p2.0`, 'ph2');
      // main row (2x): idle.0 + telegraph
      const baseY = cyp + cardH - 22, S = 2;
      let dx = cxp + 6;
      const putL = (key, tag) => { const f = b.atlas.get(key); if (!f) return; ctx.drawImage(f.sheet, f.sx, f.sy, f.w, f.h, dx | 0, (baseY - m.anchor.y * S) | 0, f.w * S, f.h * S); if (tag) label(tag, dx, baseY + 1, '#57536a'); dx += f.w * S + 8; };
      putL(`${id}.idle.0`, 'idle');
      putL(`${id}.tele.0`, 'TELEGRAPH');
    });
    return b;
  }

  SS.Bosses = { build, debugContactSheet, families: () => build().families, silhouette };
})();


// ===== src/art/icons.js =====
// A06 — Item icons + menu chrome. One baked 16x16 icon per distinct item
// `icon` tag in content/items/*.json (E14 inventory/HUD draws SS.Icons.get(tag)
// at ~2x). Every icon is built from the crunch kit — 5-step hue-shifted ramps,
// dither, dark-violet outline, a spec kiss, and a stepped square glow baked
// BEHIND the silhouette for lit items (shards, sparks, lantern, dawn-ember) —
// so each reads by SILHOUETTE + a signature colour at a glance, distinct by
// KIND (a charm is trinket-scale, a consumable is a vessel, a key is a seal, a
// weapon fills the cell) and distinct WITHIN kind. Reuse-family tags (sunshard,
// spark, seed-spark, food, oil, potion, sword, lantern) are intentionally one
// icon shared by their items. Baked once at load into an atlas; hot path is
// drawImage only — no runtime gradients, no shadowBlur, no per-frame path ops.
// See docs/art-bible.md (UI + palette) and docs/content-schema.md (items).
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  const S = 16;                       // icon cell (drawn ~2x in HUD/inventory)
  const px = (ctx, x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); };
  const OUTLINE = '#241a2e';          // dusk-violet outline, never black (house rule)
  const FLAME = K.FIRST_FLAME;

  // a warm/cold stepped glow baked BEHIND everything already drawn (so the
  // dusk-violet outline never traces the soft glow edge). Inset from the border.
  function glowBehind(ctx, cx, cy, r, color) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-over';

  function bead(ctx, x, y, w, h, R) {
    px(ctx, x, y, w, h, R.mid);

    px(ctx, x, y + h - 1, w, 1, R.lo);

  }

        px(ctx, 5, 8, 6, 1, gold.hi); px(ctx, 5, 12, 6, 1, gold.lo);
        px(ctx, 7, 10, 2, 2, K.DEEP_DUSK);            // ring hole
        px(ctx, 5, 3, 6, 5, gold.mid); px(ctx, 5, 3, 6, 1, gold.hi);   // signet face
        px(ctx, 4, 4, 1, 3, gold.hi); px(ctx, 11, 4, 1, 3, gold.lo);
        px(ctx, 7, 5, 2, 1, K.EMBER); px(ctx, 8, 4, 1, 3, K.EMBER);    // sun sigil
        px(ctx, 6, 5, 1, 1, gold.spec); px(ctx, 8, 5, 1, 1, FLAME);
      } },
    { tag: 'papers', kind: 'key', name: 'Forged Papers', depicts: 'rolled fisher\'s papers with a wax seal',
      bake(ctx) {
        const vel = K.ramp('#d8c8a0'), wax = K.ramp('#c0442e');
        px(ctx, 4, 4, 8, 8, vel.mid); px(ctx, 4, 4, 8, 1, vel.hi); px(ctx, 4, 11, 8, 1, vel.lo);
        px(ctx, 4, 4, 1, 8, vel.hi); px(ctx, 11, 4, 1, 8, vel.lo);     // sheet
        px(ctx, 6, 6, 5, 1, vel.lo); px(ctx, 6, 8, 4, 1, vel.lo);      // lines of writing
        px(ctx, 3, 3, 2, 10, vel.lo); px(ctx, 3, 3, 1, 10, vel.mid);   // curled edge
        px(ctx, 7, 10, 3, 3, wax.mid); px(ctx, 7, 10, 3, 1, wax.hi);   // wax seal
        px(ctx, 8, 11, 1, 1, FLAME);
      } },

    // ---- UPGRADES --------------------------------------------------------
    { tag: 'heart', kind: 'upgrade', name: 'Dawn Ember', depicts: 'a heart-container of kept dawnlight, hard as amber (Dawn Ember)',
      bake(ctx) {
        const amber = K.ramp('#f0a838');
        const rows = ['.##.##.', '#######', '#######', '#######', '.#####.', '..###..', '...#...'];
        for (let y = 0; y < rows.length; y++) for (let x = 0; x < 7; x++)
          if (rows[y][x] === '#') px(ctx, 5 + x, 4 + y, 1, 1, y === 0 || y === 1 ? amber.hi : amber.mid);
        px(ctx, 7, 6, 3, 2, K.LANTERN);               // dawn core
        px(ctx, 8, 7, 1, 1, FLAME);
        px(ctx, 6, 6, 1, 1, amber.spec);
        glowBehind(ctx, 8, 8, 6, K.LANTERN);
      } },
    { tag: 'pouch', kind: 'upgrade', name: 'Ember-Pouch', depicts: 'a deep leather ember-purse, embers peeking out (Deep Ember-Pouch)',
      bake(ctx) {
        const lea = K.ramp('#8a5a34');
        px(ctx, 6, 3, 4, 1, lea.lo);                  // cinched neck
        px(ctx, 5, 4, 6, 2, lea.mid); px(ctx, 5, 4, 6, 1, lea.hi);
        px(ctx, 4, 6, 8, 7, lea.mid);                 // full body
        K.dither(ctx, 4, 9, 8, 4, lea.mid, lea.lo);
        px(ctx, 4, 6, 8, 1, lea.hi); px(ctx, 4, 12, 8, 1, lea.lo);
        px(ctx, 4, 7, 1, 5, lea.hi); px(ctx, 11, 7, 1, 5, lea.lo);
        px(ctx, 6, 4, 1, 1, lea.spec);
        px(ctx, 7, 5, 2, 1, K.EMBER); px(ctx, 8, 4, 1, 1, FLAME);      // ember peeking from the drawstring
        glowBehind(ctx, 8, 5, 3, K.EMBER);
      } },
    { tag: 'shot', kind: 'upgrade', name: 'Cast-Iron Shot', depicts: 'a cluster of heavy cast-iron sling-shot (Cast-Iron Shot)',
      bake(ctx) {
        const iron = K.ramp('#5a5a66');
        bead(ctx, 4, 5, 4, 4, iron);                  // three heavy iron balls
        bead(ctx, 9, 4, 4, 4, iron);
        bead(ctx, 6, 9, 4, 4, iron);
        px(ctx, 5, 6, 1, 1, FLAME); px(ctx, 10, 5, 1, 1, FLAME); px(ctx, 7, 10, 1, 1, FLAME);// cast-metal glints
        px(ctx, 6, 8, 1, 1, iron.out); px(ctx, 11, 7, 1, 1, iron.out);
      } },
  ];

  // =======================================================================
  // MENU CHROME — a small baked set the inventory/shop UI (E14) can reuse:
  // an inset slot tile, a crunchy panel border, and the lantern-spark cursor
  // (art-bible: "cursor is a baked lantern-spark"). Cheap + optional.
  // =======================================================================
  function bakeSlot() {
    const c = K.makeCanvas(20, 20); const ctx = c.getContext('2d');
    const r = K.ramp('#2a2436');
    K.pxRect(ctx, 0, 0, 20, 20, r.lo);
    K.pxRect(ctx, 1, 1, 18, 18, r.out);               // recessed well
    K.pxRect(ctx, 1, 1, 18, 1, '#151120');            // top-inner shadow (inset read)
    K.pxRect(ctx, 1, 1, 1, 18, '#151120');
    K.pxRect(ctx, 1, 18, 18, 1, '#3a3450');           // bottom-inner light
    K.pxRect(ctx, 18, 1, 1, 18, '#3a3450');
    K.outlineRect(ctx, 0, 0, 20, 20, K.ramp(OUTLINE).out);
    return c;
  }
  function bakeCursor() {
    const c = K.makeCanvas(12, 12); const ctx = c.getContext('2d');
    // a four-point lantern-spark: warm core + stepped arms + glow, baked.
    px(ctx, 5, 1, 2, 10, K.LANTERN); px(ctx, 1, 5, 10, 2, K.LANTERN);  // cross arms
    px(ctx, 4, 4, 4, 4, K.EMBER);                     // ember body
    px(ctx, 5, 5, 2, 2, FLAME);                       // white-hot heart
    px(ctx, 3, 3, 1, 1, K.LANTERN); px(ctx, 8, 8, 1, 1, K.LANTERN);    // diagonal glints
    px(ctx, 8, 3, 1, 1, K.LANTERN); px(ctx, 3, 8, 1, 1, K.LANTERN);
    glowBehind(ctx, 6, 6, 6, K.EMBER);
    return c;
  }
  function bakeCorner() {
    // an 8x8 top-left panel corner: lantern-edged notch (art-bible dialogue box
    // "corner notches"). Rotate via drawImage for the other three corners.
    const c = K.makeCanvas(8, 8); const ctx = c.getContext('2d');
    px(ctx, 0, 0, 8, 1, K.LANTERN); px(ctx, 0, 0, 1, 8, K.LANTERN);    // lit border run
    px(ctx, 2, 2, 3, 1, K.LANTERN); px(ctx, 2, 2, 1, 3, K.LANTERN);    // inner notch
    px(ctx, 0, 0, 2, 2, '#f4d38c');                   // bright corner pip
    return c;
  }

  // =======================================================================
  // BAKE — one 16x16 icon per tag, outlined in dusk-violet, into the atlas.
  // Lazy build() like enemy/boss; called by HUD/inventory (E14) and the review.
  // =======================================================================
  function bakeIcon(D) {
    const c = K.makeCanvas(S, S);
    const ctx = c.getContext('2d');
    D.bake(ctx);
    K.outline(c, K.ramp(OUTLINE).out);
    return c;
  }

  const KIND_ORDER = ['gear', 'charm', 'consumable', 'quest', 'key', 'upgrade'];
  const KIND_LABEL = { gear: 'GEAR & WEAPONS', charm: 'CHARMS', consumable: 'CONSUMABLES', quest: 'QUEST ITEMS', key: 'KEYS', upgrade: 'UPGRADES' };

  let built = null;
  function build() {
    if (built) return built;
    if (!K.font.meta.ready) K.font.bake();
    const atlas = new SS.Atlas(256);
    const meta = {};
    for (const D of ICONS) {
      atlas.add('icon.' + D.tag, bakeIcon(D));
      meta[D.tag] = { tag: D.tag, kind: D.kind, name: D.name, depicts: D.depicts, w: S, h: S };
    }
    // chrome
    atlas.add('chrome.slot', bakeSlot());
    atlas.add('chrome.cursor', bakeCursor());
    atlas.add('chrome.corner', bakeCorner());
    built = { atlas, meta, tags: ICONS.map(d => d.tag), kinds: KIND_ORDER };
    return built;
  }

  // ---- public lookup (E14 inventory/HUD) --------------------------------
  function get(tag) { return build().atlas.get('icon.' + tag); }
  // draw an icon top-left at (dx,dy) scaled by integer `scale` (default 1)
  function draw(ctx, tag, dx, dy, scale) {
    const f = build().atlas.get('icon.' + tag); if (!f) return false;
    scale = scale || 1;
    ctx.drawImage(f.sheet, f.sx, f.sy, f.w, f.h, dx | 0, dy | 0, f.w * scale, f.h * scale);
    return true;
  }
  const chrome = {
    slot: () => build().atlas.get('chrome.slot'),
    cursor: () => build().atlas.get('chrome.cursor'),
    corner: () => build().atlas.get('chrome.corner'),
    drawSlot(ctx, x, y) { const f = build().atlas.get('chrome.slot'); ctx.drawImage(f.sheet, f.sx, f.sy, f.w, f.h, x | 0, y | 0, f.w, f.h); },
    drawCursor(ctx, x, y) { const f = build().atlas.get('chrome.cursor'); ctx.drawImage(f.sheet, f.sx, f.sy, f.w, f.h, x | 0, y | 0, f.w, f.h); },
  };

  // ---- contact sheet (director review) ----------------------------------
  // Grouped by KIND, each icon shown at 3x on a baked inventory slot with its
  // tag label — the "distinct by kind / within kind + every item resolves"
  // proof — plus a chrome demo strip. Read-only w.r.t. game state.
  function debugContactSheet(ctx) {
    const b = build();
    const Z = 3;                                  // review zoom (16 -> 48)
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#12101c'; ctx.fillRect(0, 0, 1280, 720);
    const label = (s, x, y, col) => K.font.text(ctx, s, x | 0, y | 0, col || '#c8c2d4', 1);
    label('SHATTERED SUN  -  ITEM ICON CONTACT SHEET  (A06)', 12, 10, K.LANTERN);
    label(b.tags.length + ' DISTINCT ICON TAGS  -  EVERY ITEM RESOLVES TO A READABLE, KIND-DISTINCT ICON', 12, 22, '#8f8aa0');

    const slotF = b.atlas.get('chrome.slot');
    const cell = 78, iconBox = S * Z;             // 48
    let y = 36;
    for (const kind of b.kinds) {
      const tags = b.tags.filter(t => b.meta[t].kind === kind);
      // section header band
      ctx.fillStyle = '#1d1a28'; ctx.fillRect(12, y, 1256, 12);
      ctx.fillStyle = '#3a3450'; ctx.fillRect(12, y, 1256, 1);
      label(KIND_LABEL[kind] + '   (' + tags.length + ')', 18, y + 3, K.LANTERN);
      y += 16;
      let x = 16;
      for (const tag of tags) {
        if (x + cell > 1268) { x = 16; y += cell + 14; }
        // baked slot behind the icon (chrome demo + grounding)
        const sx = x + ((cell - slotF.w * 2) >> 1), sy = y;
        ctx.drawImage(slotF.sheet, slotF.sx, slotF.sy, slotF.w, slotF.h, sx, sy, slotF.w * 2, slotF.h * 2);
        const f = b.atlas.get('icon.' + tag);
        const ix = x + ((cell - iconBox) >> 1), iy = y + ((slotF.h * 2 - iconBox) >> 1);
        ctx.drawImage(f.sheet, f.sx, f.sy, f.w, f.h, ix, iy, iconBox, iconBox);
        // tag label (trim charm- prefix so it fits the cell)
        label(tag.replace('charm-', '~'), x + 2, y + slotF.h * 2 + 2, '#b7b0c8');
        x += cell;
      }
      y += cell + 18;
    }

    // chrome demo strip along the bottom: cursor + corner panel pips
    const cy = 700;
    label('CHROME:', 16, cy - 10, '#8f8aa0');
    chrome.drawCursor(ctx, 70, cy - 14);
    const cornF = b.atlas.get('chrome.corner');
    // draw a tiny 3-corner-notch panel outline to show the frame piece
    const pxx = 120, pw = 60, ph = 14;
    ctx.fillStyle = '#0d0a14'; ctx.fillRect(pxx, cy - 16, pw, ph);
    ctx.drawImage(cornF.sheet, cornF.sx, cornF.sy, cornF.w, cornF.h, pxx, cy - 16, cornF.w, cornF.h);
    label('slot + lantern-spark cursor + corner notch (E14 reuse)', 190, cy - 12, '#57536a');
    return b;
  }

  SS.Icons = {
    build, get, draw, chrome, debugContactSheet,
    meta: () => build().meta, tags: () => build().tags,
  };
})();


// ===== src/game/region.js =====
// Region runtime — parses region JSON (row-strings + legend), builds the
// solidity grid, pre-renders tile chunks (hot path = drawImage per visible
// chunk only), and drives ambient overlays. Ground pipeline (director's
// pass): 1) CONTINUOUS moor painting (position-seeded, never repeats),
// 2) full-tile stamps (cobble/dirt/hedge/bog/garden/foundation), 3) grass
// lips on all four ground-tile edges, 4) flat overlays (fence/stones/
// flowers), 5) CLUMPED scatter. Trees/well/lamps/shrine/buildings become
// y-sorted statics drawn among entities by the play state.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;

  function load(data) {
    // interiors AND dungeons are flat rooms drawn from their own tile registry
    // (SS.Interior / SS.Dungeon); every other region is the director's outdoor
    // moor pipeline (SS.Tiles). All three return the identical tile-definition
    // contract, so the pipeline below is agnostic — it only routes the provider.
    const interior = data.tileset === 'interior';
    const dungeon = data.tileset === 'dungeon';
    const gloam = data.tileset === 'gloamwood';
    const hollow = data.tileset === 'hollow';
    // The Hollow is a dungeon-shape room (SS.Hollow.build): flat, grief-dark with
    // light pools, no drifting cloud shadows — so it counts as a 'dungeon' kind
    // like the Beacon Spire (the lantern/gloom language is the Mothqueen mechanic).
    const flat = interior || dungeon || hollow;
    const built = (interior && SS.Interior) ? SS.Interior.build()
      : (dungeon && SS.Dungeon) ? SS.Dungeon.build()
      : (gloam && SS.Gloam) ? SS.Gloam.build()
      : (hollow && SS.Hollow) ? SS.Hollow.build()
      : SS.Tiles.build();
    const TS = built.TS;
    const rows = data.map;
    const height = rows.length;
    const width = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const legend = data.legend;

    function tileNameAt(tx, ty) {
      if (tx < 0 || ty < 0 || tx >= width || ty >= height) return null;
      const row = rows[ty];
      const ch = tx < row.length ? row[tx] : ' ';
      return legend[ch] || null;
    }
    const tileAt = (tx, ty) => { const n = tileNameAt(tx, ty); return n ? built.tiles[n] : null; };
    const isMoor = (tx, ty) => { const t = tileAt(tx, ty); return !!(t && t.painted); };

    // Bake one furniture/fixture static: copy its (position-hashed) source
    // variant, apply the baked dusk grade, and anchor it by its foot tile so it
    // y-sorts with the party. Shared by map-tile fixtures and entity-declared
    // props so both anchor identically.
    function bakeStatic(name, tx, ty) {
      const variants = built.statics[name];
      const src = variants[built.hash2(tx, ty) % variants.length];
      const canvas = K.makeCanvas(src.width, src.height);
      canvas.getContext('2d').drawImage(src, 0, 0);
      built.duskTint(canvas);
      const baseY = (ty + 1) * TS;
      return { canvas, x: (tx * TS + TS / 2 - canvas.width / 2) | 0, topY: baseY - canvas.height + 4, y: baseY, w: canvas.width };
    }

    // solidity grid + object statics from the map itself
    const solid = new Uint8Array(width * height);
    const statics = [];
    for (let ty = 0; ty < height; ty++) {
      for (let tx = 0; tx < width; tx++) {
        const t = tileAt(tx, ty);
        if (!t) continue;
        if (t.solid) solid[ty * width + tx] = 1;
        if (t.static) statics.push(bakeStatic(t.static, tx, ty));
      }
    }

    // pre-render chunks
    const tilesPerChunk = Math.floor(512 / TS);       // 21 tiles -> 504px
    const chunkPx = tilesPerChunk * TS;
    const chunkCols = Math.ceil(width / tilesPerChunk);
    const chunkRows = Math.ceil(height / tilesPerChunk);
    const chunks = [];
    for (let cy = 0; cy < chunkRows; cy++) {
      for (let cx = 0; cx < chunkCols; cx++) {
        const cw = Math.min(chunkPx, (width - cx * tilesPerChunk) * TS);
        const ch = Math.min(chunkPx, (height - cy * tilesPerChunk) * TS);
        const canvas = K.makeCanvas(cw, ch);
        const ctx = canvas.getContext('2d');
        const pools = [];   // baked floor light (hearths/sconces/candles) — painted after all stamps
        // 1) the moor, painted continuously in world coordinates
        built.paintMoor(ctx, cw, ch, cx * chunkPx, cy * chunkPx);
        for (let ly = 0; ly < tilesPerChunk; ly++) {
          for (let lx = 0; lx < tilesPerChunk; lx++) {
            const tx = cx * tilesPerChunk + lx, ty = cy * tilesPerChunk + ly;
            const t = tileAt(tx, ty);
            if (!t) continue;
            const dx = lx * TS, dy = ly * TS;
            // 2) full-tile stamps
            if (t.stamp) t.stamp(ctx, dx, dy, tx, ty);
            if (t.pool) pools.push({ x: dx + TS / 2, y: dy + TS / 2 + (t.pool.dy || 0), r: t.pool.r, color: t.pool.color, a: t.pool.a });
            // 3) grass lips where a ground stamp borders painted moor
            if (t.ground) {
              if (isMoor(tx, ty - 1)) ctx.drawImage(built.lips.n, dx, dy);
              if (isMoor(tx, ty + 1)) ctx.drawImage(built.lips.s, dx, dy + TS - 5);
              if (isMoor(tx - 1, ty)) ctx.drawImage(built.lips.w, dx, dy);
              if (isMoor(tx + 1, ty)) ctx.drawImage(built.lips.e, dx + TS - 4, dy);
            }
            // 4) flat overlays over painted moor (fence, stones, flowers)
            if (t.overlay) {
              const ov = t.overlay[built.hash2(tx, ty) % t.overlay.length];
              ctx.drawImage(ov, dx + ((TS - ov.width) >> 1), dy + (t.oy || 0));
            }
            // 5) clumped scatter on pure moor (low-freq gate -> per-tile roll)
            if (t.painted && !t.overlay && !t.static) {
              const gate = built.hash2(tx >> 2, ty >> 2) % 100;
              if (gate < 38) {
                const h = built.hash2(tx, ty);
                if ((h % 100) < 30) {
                  const sp = built.scatter[h % built.scatter.length];
                  ctx.drawImage(sp, dx + (h % (TS - 8)), dy + ((h >> 8) % (TS - 8)));
                }
              }
              // fox-fire mushrooms only where the bog seeps (within 2 tiles)
              let nearBog = false;
              for (let by = -2; by <= 2 && !nearBog; by++)
                for (let bx = -2; bx <= 2 && !nearBog; bx++)
                  if (tileNameAt(tx + bx, ty + by) === 'bog') nearBog = true;
              if (nearBog) {
                const h = built.hash2(tx + 91, ty + 57);
                if ((h % 100) < 45) ctx.drawImage(built.bogMush, dx + (h % (TS - 7)), dy + ((h >> 6) % (TS - 8)));
              }
            }
          }
        }
        // doorway framing: any walkable 2-tile gap in a horizontal wall run
        // gets carved jambs + a cold light-spill (built.doorway providers only).
        // THE WAY FORWARD IS THE MOST LEGIBLE THING IN THE ROOM.
        if (built.doorway) {
          const isWall = (x, y) => tileNameAt(x, y) === 'wall';
          const walkable = (x, y) => { const t = tileAt(x, y); return t && !t.solid; };
          for (let ly = 0; ly < tilesPerChunk; ly++) {
            for (let lx = 0; lx < tilesPerChunk; lx++) {
              const tx = cx * tilesPerChunk + lx, ty = cy * tilesPerChunk + ly;
              if (walkable(tx, ty) && walkable(tx + 1, ty) && isWall(tx - 1, ty) && isWall(tx + 2, ty) && isWall(tx - 2, ty) && isWall(tx + 3, ty)) {
                const dx = lx * TS, dy = ly * TS;
                ctx.drawImage(built.doorway.glow, dx, dy);
                ctx.drawImage(built.doorway.jambL, dx, dy);
                ctx.drawImage(built.doorway.jambR, dx + TS, dy);
              }
            }
          }
        }
        // baked floor-light pools over the finished stamps (bake-time only —
        // this is what makes interiors read LIT instead of uniformly ambient)
        for (const p of pools) {
          ctx.save();
          if (p.a != null) ctx.globalAlpha = p.a;
          K.pxGlowSq(ctx, p.x | 0, p.y | 0, p.r, p.color, 5);
          ctx.restore();
        }
        built.duskTint(canvas);   // amber-violet dusk grading, baked
        chunks.push({ canvas, px: cx * chunkPx, py: cy * chunkPx, w: cw, h: ch });
      }
    }

    // cloud-shadow overlay (drifts)
    const worldW = width * TS, worldH = height * TS;
    const cloud = built.cloudShadow(Math.min(1024, worldW + 256), Math.min(1024, worldH + 256));

    // parse entities (JSON x,y are TILE coordinates; convert to world-px centers)
    const npcs = [], wisps = [], props = [], triggers = [], exits = [], enemySpecs = [];
    const objects = [];                       // stateful, interactable, y-sorted dungeon fixtures (braziers/key)
    const fixtures = built.fixtures || null;
    let galleryTotal = 0;
    let spawn = { x: (width / 2) * TS, y: (height / 2) * TS }, spawn2 = null;
    for (const e of (data.entities || [])) {
      const wx = (e.x + 0.5) * TS, wy = (e.y + 0.5) * TS;
      // dungeon fixtures: braziers (the lantern mechanic) + the Keeper's key.
      // Drawn y-sorted with a runtime lit/sealed state, solid so the party stands
      // adjacent to interact. Only present when the dungeon tileset baked them.
      if (fixtures && (e.ref === 'prop.brazier' || e.ref === 'prop.beacon' || e.ref === 'prop.beacon-key')) {
        const p = e.props || {};
        const foot = (e.y + 1) * TS, cx = wx;
        if (e.ref === 'prop.beacon-key') {
          const spr = fixtures.key.freed;
          objects.push({ isObject: true, kind: 'key', ref: e.ref, props: p, on: false,
            spriteOn: fixtures.key.freed, spriteOff: fixtures.key.sealed, w: spr.width,
            x: (cx - spr.width / 2) | 0, cx, y: foot, topY: foot - spr.height });
        } else {
          const big = e.ref === 'prop.beacon';
          const kit = big ? fixtures.beacon : fixtures.brazier;
          const spr = kit.lit;
          objects.push({ isObject: true, kind: 'brazier', ref: e.ref, props: p,
            on: !!p.lit, order: p.order || 0, group: p.group || 'arena',
            spriteOn: kit.lit, spriteOff: kit.unlit, w: spr.width,
            x: (cx - spr.width / 2) | 0, cx, y: foot, topY: foot - spr.height });
          if ((p.group || 'arena') === 'gallery') galleryTotal = Math.max(galleryTotal, p.order || 0);
          solid[e.y * width + e.x] = 1;        // a brazier blocks the tile it stands on
        }
        continue;
      }
      if (e.kind === 'npc') {
        // Conditional NPC presence: an npc may carry props.req (the shared
        // condition mini-language). It's evaluated once here at region-load
        // time — a region reloads on entry via swapTo — so a story-gated ally
        // (e.g. the cured Mothqueen) simply appears the next time the region
        // is entered after its flag is set. NPCs without props.req are wholly
        // unaffected. Allocation-free: no req -> straight to push.
        const rq = e.props && e.props.req;
        if (rq && SS.Cond && !SS.Cond.eval(rq)) continue;
        npcs.push({ ref: e.ref, sprite: e.props && e.props.sprite, name: e.props && e.props.name, x: wx, y: wy, facing: (e.props && e.props.facing) || 'down', anim: 0 });
      }
      else if (e.kind === 'wisp') wisps.push({ x: wx, y: wy, phase: (e.props && e.props.phase) || 0, driftT: Math.random() * 6.28 });
      else if (e.kind === 'boss') {
        // a boss is resolved from the bosses registry and handed to the enemy
        // manager as a boss-flagged spec (it draws from SS.Bosses, not SS.Enemies).
        const def = SS.reg('bosses', e.ref);
        if (def) enemySpecs.push({ ref: e.ref, def, x: wx, y: wy, props: e.props || {}, boss: true });
      }
      else if (e.kind === 'building') {
        const p = e.props || {}; const w = (p.w || 6) * TS, h = (p.h || 5) * TS;
        const canvas = built.duskTint(built.buildCottage(w, h, p.variant || 'hall'));
        const baseY = (e.y + (p.h || 5)) * TS;
        statics.push({ ref: e.ref, canvas, x: e.x * TS, topY: baseY - canvas.height, y: baseY, w });
      }
      else if (e.kind === 'enemy') {
        // resolve the stat block; place at the tile's world-px center for the
        // enemy manager to spawn at region load (data-driven — the region's
        // entity list defines its combat mix).
        const def = SS.reg('enemies', e.ref);
        if (def) enemySpecs.push({ ref: e.ref, def, x: wx, y: wy, props: e.props || {} });
      }
      else if (e.kind === 'prop' && built.statics && e.props && e.props.static && built.statics[e.props.static]) {
        // Flag-conditional fixture: a y-sorted furniture static that swaps to a
        // lit/alt sprite when a continuity flag is set (Sera's forge lighting
        // after the cold-forge side quest; general enough for any "living
        // interior" fixture). Both variants are baked ONCE here; the draw hot
        // path only reads the flag and blits base OR alt — one drawImage, no
        // allocation, the warm glow already baked into the alt sprite.
        const p = e.props;
        const st = bakeStatic(p.static, e.x, e.y);
        st.ref = e.ref;
        if (p.flag && p.altStatic && built.statics[p.altStatic]) { st.flag = p.flag; st.altCanvas = bakeStatic(p.altStatic, e.x, e.y).canvas; }
        statics.push(st);
        if (p.solid !== false) solid[e.y * width + e.x] = 1;
      }
      else if (e.kind === 'prop') props.push({ ref: e.ref, x: wx, y: wy, props: e.props || {} });
      else if (e.kind === 'trigger' || e.kind === 'sign' || e.kind === 'door') triggers.push({ kind: e.kind, ref: e.ref, x: wx, y: wy, props: e.props || {} });
      else if (e.kind === 'spawn') { spawn = { x: wx, y: wy }; if (e.props && e.props.p2) spawn2 = { x: wx, y: wy }; }
    }
    for (const ex of (data.exits || [])) exits.push(ex);

    // areas / camera locks (rects in TILE coords)
    const areas = (data.areas || []).map(a => ({ id: a.id, name: a.name,
      rect: { x: a.rect[0] * TS, y: a.rect[1] * TS, w: a.rect[2] * TS, h: a.rect[3] * TS },
      cameraLock: a.cameraLock ? { x: a.rect[0] * TS, y: a.rect[1] * TS, w: a.rect[2] * TS, h: a.rect[3] * TS } : null }));

    let tick = 0, cloudX = 0, cloudY = 0;
    const region = {
      id: data.id, name: data.name, palette: data.palette, music: data.music,
      kind: (dungeon || hollow) ? 'dungeon' : interior ? 'interior' : 'exterior',
      tileSize: TS, width, height, worldW, worldH,
      npcs, wisps, props, triggers, exits, areas, spawn, spawn2, statics, enemySpecs,
      objects, galleryTotal, galleryNext: 1,   // dungeon light-puzzle runtime (states.js drives it)
      solidAt(tx, ty) { if (tx < 0 || ty < 0 || tx >= width || ty >= height) return true; return solid[ty * width + tx] === 1; },
      // A `gap` tile is solid (enemies + default collision never cross it), but
      // the Moth-Cloak glide lets the party over it — the player mover consults
      // this to punch a cloak-aware hole through the wall of gaps (see player.js).
      isGap(tx, ty) { return tileNameAt(tx, ty) === 'gap'; },
      lockAt(x, y) { for (const a of areas) if (a.cameraLock && x >= a.rect.x && x < a.rect.x + a.rect.w && y >= a.rect.y && y < a.rect.y + a.rect.h) return a.cameraLock; return null; },
      areaAt(x, y) { for (const a of areas) if (x >= a.rect.x && x < a.rect.x + a.rect.w && y >= a.rect.y && y < a.rect.y + a.rect.h) return a; return null; },
      update() {
        tick++;
        if (!SS.lowfx()) {                        // E16: freeze the drifting cloud shadow under lowfx
          cloudX = (Math.sin(tick / 600) * 40);
          cloudY = (Math.cos(tick / 900) * 24);
        }
      },
      drawTerrain(ctx, cam) {
        for (const c of chunks) {
          if (c.px + c.w < cam.x || c.px > cam.x + cam.w || c.py + c.h < cam.y || c.py > cam.y + cam.h) continue;
          ctx.drawImage(c.canvas, c.px, c.py);
        }
      },
      drawAmbientOverlay(ctx, cam) {
        if (this.kind !== 'exterior') return;   // no drifting cloud shadows indoors / in dungeons
        if (SS.lowfx()) return;                 // E16: skip the whole drifting cloud-shadow overlay under lowfx
        ctx.save();
        ctx.globalAlpha = 0.5;
        const ox = ((cam.x * 0.4 + cloudX) % cloud.width);
        const oy = ((cam.y * 0.4 + cloudY) % cloud.height);
        ctx.drawImage(cloud, cam.x - ox, cam.y - oy);
        ctx.drawImage(cloud, cam.x - ox + cloud.width, cam.y - oy);
        ctx.drawImage(cloud, cam.x - ox, cam.y - oy + cloud.height);
        ctx.restore();
      },
      drawWisps(ctx) {
        const frames = built.wispFrames;
        // E16: halve the drifting fen-lights under lowfx (decorative fireflies —
        // thinning them lifts drawImage load without touching any readable cue).
        const lowfx = SS.lowfx();
        for (let wi = 0; wi < wisps.length; wi++) {
          if (lowfx && (wi & 1)) continue;
          const w = wisps[wi];
          const fi = (Math.floor(tick / 10) + w.phase) % frames.length;
          const f = frames[fi];
          const dx = w.x - f.width / 2 + Math.sin(tick / 40 + w.driftT) * 6;
          const dy = w.y - f.height / 2 + Math.cos(tick / 55 + w.driftT) * 5;
          ctx.drawImage(f, dx | 0, dy | 0);
        }
      },
      drawShrineGlow(ctx) {
        const frames = built.shrineGlowFrames;
        for (const p of props) {
          if (p.ref !== 'prop.shrine-glow') continue;
          const fi = Math.floor(tick / 14) % frames.length;
          const f = frames[fi];
          ctx.drawImage(f, (p.x - f.width / 2) | 0, (p.y - f.height / 2 - 14) | 0);
        }
      },
      tickVal() { return tick; },
    };
    return region;
  }

  // swapTo(regionId): the ONE region-swap primitive. It loads a region's
  // content, installs it as the live region, hands its data-driven encounter to
  // the enemy manager (clearing the previous region's enemies so none leak), and
  // starts its music. Both the E08 load path (save.js applyRegion) and the
  // walk-through-an-exit transition (State.regionTransition) go through here, so
  // there is exactly one place a region is brought online. It does NOT place the
  // party or move the camera — callers own where you land — and no-ops if the
  // target is already loaded or its content isn't present yet.
  function swapTo(regionId) {
    if (!regionId || !SS.Game || !SS.reg) return null;
    if (SS.Game.region && SS.Game.region.id === regionId) return SS.Game.region;
    const data = SS.reg('regions', regionId);
    if (!data) return null;
    const region = load(data);
    SS.Game.region = region;
    if (SS.EnemyMgr) SS.EnemyMgr.load(region);
    if (SS.Audio && region.music) SS.Audio.playMusic(region.music);
    return region;
  }

  SS.Region = { load, swapTo };
})();


// ===== src/game/dialogue.js =====
// E06 — Dialogue system + shared conditions/effects mini-language (also used
// by the cutscene runner, E11). Full content-schema support: nodes, choices,
// req conditions, effects; typewriter at 2 chars/frame with South-to-skip;
// flat dusk panel with lantern border + corner notches, 32x32 portrait, name
// tag; per-voice WebAudio blip (lazy, muted-safe). All text = bitmap font.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;

  // ---- conditions / effects (docs/content-schema.md §mini-language) ------
  function evalCond(cond) {
    const S = SS.State; if (!S) return true;
    if (cond == null) return true;
    if (Array.isArray(cond)) return cond.every(evalCond);   // arrays = AND
    if (typeof cond !== 'string') return true;
    if (cond.startsWith('!flag:')) return !S.getFlag(cond.slice(6));
    if (cond.startsWith('flag:')) return !!S.getFlag(cond.slice(5));
    if (cond.startsWith('quest-done:')) return S.questDone(cond.slice(11));
    if (cond.startsWith('quest:')) {
      const m = cond.slice(6).match(/^(.+?)>=(\d+)$/);
      if (m) return (S.questStage(m[1]) || 0) >= (+m[2]);
      return (S.questStage(cond.slice(6)) || 0) > 0;
    }
    if (cond.startsWith('item:')) return S.hasItem(cond.slice(5));
    if (cond.startsWith('act:')) return S.act === (+cond.slice(4));
    return true;
  }
  function applyEffects(effects) {
    const S = SS.State; if (!S || !effects) return;
    for (const e of (Array.isArray(effects) ? effects : [effects])) {
      if (!e) continue;
      if (e.set) for (const k in e.set) S.setFlag(k, e.set[k]);
      if (e.give) S.give(e.give, e.n || 1);
      if (e.take) S.take(e.take);
      if (e.quest) {
        if (e.quest.start || e.start) S.questStart(qid(e));
        else if (e.advance) S.questAdvance(qid(e));
        else if (typeof e.stage === 'number') S.questSet(qid(e), e.stage);
      }
      if (typeof e.embers === 'number') S.addEmbers(e.embers);
      if (e.cutscene) S.playCutscene(e.cutscene);
      if (e.teleport) S.teleport(e.teleport);
      // ---- E14 item-effect verbs (implemented where they apply; routed
      // through where an item is USED, never auto-fired) -------------------
      if ('heal' in e) S.heal(e.heal);                                    // restore hp (n or "full")
      if (typeof e['max-hearts'] === 'number') S.raiseMaxHearts(e['max-hearts']);   // permanent heart container
      if (typeof e['max-embers'] === 'number') S.raiseEmberCap(e['max-embers']);    // deeper ember purse
      if (typeof e['sling-power'] === 'number') S.slingPower += e['sling-power'];    // heavier shot for Fin
      if (typeof e['light-radius'] === 'number') S.lightRadiusBonus += e['light-radius']; // wider carried light
      if (typeof e['lantern-fuel'] === 'number') S.lanternFuel += e['lantern-fuel'];       // banked refuels
      if (typeof e['lantern-capacity'] === 'number') S.lanternCapacity = Math.max(S.lanternCapacity, e['lantern-capacity']);
      // {shop:"shop.id"} — a dialogue/interaction offer; play.update opens it
      // once the conversation closes (deferred so it never pops the wrong state).
      if (e.shop) S._pendingShop = e.shop;
      // {shop-stock} (content-schema alias) kept a harmless no-op — stock is
      // authored in content/shops/*.json and read by the shop state directly.
    }
  }
  function qid(e) { return typeof e.quest === 'string' ? e.quest : e.quest.id || e.id; }

  SS.Cond = { eval: evalCond };
  SS.Effects = { apply: applyEffects };

  // ---- voice blip mapping ------------------------------------------------
  const VOICE_FOR = { maren: 'proverb', 'old-wick': 'old', sera: 'bright', fin: 'kid', poll: 'kid', kes: 'default' };
  function voiceOf(speakerId) {
    if (!speakerId) return 'default';
    const short = speakerId.split('.').pop();
    return VOICE_FOR[short] || 'default';
  }
  function displayName(speakerId) {
    if (!speakerId) return '';
    const ch = SS.reg('characters', speakerId);
    if (ch && ch.name) return ch.name;
    const short = speakerId.split('.').pop();
    const named = { kes: 'Kes', fin: 'Fin' };
    return named[short] || short.replace(/(^|-)([a-z])/g, (m, a, b) => (a ? ' ' : '') + b.toUpperCase());
  }
  function portraitFrame(speakerId) {
    if (!speakerId) return null;
    const ch = SS.reg('characters', speakerId);
    const tag = ch && ch.portrait ? ch.portrait : speakerId.split('.').pop();
    return 'portrait.' + tag;
  }

  // ---- runtime -----------------------------------------------------------
  let active = null, onEnd = null;

  function nodeById(dlg, id) { return dlg.nodes.find(n => n.id === id) || null; }

  function enterNode(node) {
    if (!node) { end(); return; }
    if (node.effects) applyEffects(node.effects);
    const speaker = node.speaker || active.dlg.speaker;
    active.node = node;
    active.text = node.text || '';
    active.shown = 0; active.done = false; active.choiceIndex = 0;
    active.speaker = speaker;
    active.voice = voiceOf(speaker);
    active.choices = null;
    active.blipAccum = 0;
  }

  function start(dlgId, cb) {
    const dlg = SS.reg('dialogue', dlgId);
    if (!dlg) { console.error('[dialogue] unknown dialogue id: ' + dlgId); return false; }
    onEnd = cb || null;
    active = { dlg };
    enterNode(dlg.nodes[0]);
    return true;
  }
  // start from an in-memory dialogue object (cutscene inline `say` steps)
  function startObj(obj, cb) {
    if (!obj || !obj.nodes || !obj.nodes.length) { if (cb) cb(); return false; }
    onEnd = cb || null; active = { dlg: obj }; enterNode(obj.nodes[0]); return true;
  }
  function end() { const cb = onEnd; active = null; onEnd = null; if (cb) cb(); }

  function visibleChoices() {
    if (!active.node.choices) return null;
    return active.node.choices.filter(c => evalCond(c.req));
  }

  // fixed-step update; returns true while dialogue owns input
  function update() {
    if (!active) return false;
    if (!active.done) {
      active.shown += 2;                          // 2 chars/frame
      if (active.shown >= active.text.length) { active.shown = active.text.length; active.done = true; active.choices = visibleChoices(); }
      else { active.blipAccum++; if (active.blipAccum % 2 === 0 && SS.Audio) SS.Audio.blip(active.voice); }
    }
    const I = SS.Input;
    // choice navigation once revealed
    if (active.done && active.choices && active.choices.length) {
      if (I.anyPressed('up')) { active.choiceIndex = (active.choiceIndex - 1 + active.choices.length) % active.choices.length; SS.Audio && SS.Audio.sfx('select'); }
      if (I.anyPressed('down')) { active.choiceIndex = (active.choiceIndex + 1) % active.choices.length; SS.Audio && SS.Audio.sfx('select'); }
    }
    if (I.anyPressed('confirm')) {
      if (!active.done) { active.shown = active.text.length; active.done = true; active.choices = visibleChoices(); return true; }
      SS.Audio && SS.Audio.sfx('confirm');
      if (active.choices && active.choices.length) {
        const c = active.choices[active.choiceIndex];
        if (c.effects) applyEffects(c.effects);
        if (c.next) enterNode(nodeById(active.dlg, c.next)); else end();
      } else if (active.node.next) {
        enterNode(nodeById(active.dlg, active.node.next));
      } else end();
    }
    return true;
  }

  // ---- draw --------------------------------------------------------------
  function draw(ctx) {
    if (!active) return;
    const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
    const boxX = 8, boxY = H - 104, boxW = W - 16, boxH = 96;
    // flat panel @ 92% alpha (NO backdrop-filter)
    ctx.globalAlpha = 0.92;
    K.pxRect(ctx, boxX, boxY, boxW, boxH, K.DEEP_DUSK);
    ctx.globalAlpha = 1;
    // lantern border + corner notches
    K.outlineRect(ctx, boxX, boxY, boxW, boxH, K.LANTERN);
    for (const [nx, ny] of [[boxX, boxY], [boxX + boxW - 4, boxY], [boxX, boxY + boxH - 4], [boxX + boxW - 4, boxY + boxH - 4]])
      K.pxRect(ctx, nx, ny, 4, 4, K.LANTERN);

    // portrait 32x32 scaled x2 -> 64
    const npcs = SS.Assets && SS.Assets.npcs;
    const pf = portraitFrame(active.speaker);
    let textX = boxX + 12;
    if (npcs && pf && npcs.atlas.get(pf)) {
      const f = npcs.atlas.get(pf);
      ctx.drawImage(f.sheet, f.sx, f.sy, f.w, f.h, boxX + 8, boxY + 20, f.w * 2, f.h * 2);
      textX = boxX + 8 + f.w * 2 + 10;
    }
    // name tag
    const name = displayName(active.speaker);
    if (name) {
      K.pxRect(ctx, textX - 2, boxY + 6, K.font.width(name, 1) + 6, 11, '#1a1526');
      K.outlineRect(ctx, textX - 2, boxY + 6, K.font.width(name, 1) + 6, 11, K.LANTERN);
      K.font.text(ctx, name, textX + 1, boxY + 8, K.LANTERN, 1);
    }
    // body text (typewriter, wrapped)
    const shownText = active.text.slice(0, active.shown);
    const maxW = boxX + boxW - textX - 10;
    const lines = K.font.wrap(shownText, maxW, 1);
    let ty = boxY + 22;
    for (const ln of lines) { K.font.text(ctx, ln, textX, ty, '#e8ecf1', 1); ty += 10; }

    // choices
    if (active.done && active.choices && active.choices.length) {
      let cy = boxY + boxH - 6 - active.choices.length * 10;
      active.choices.forEach((c, idx) => {
        const sel = idx === active.choiceIndex;
        if (sel) { K.pxRect(ctx, textX - 6, cy + 1, 4, 6, K.EMBER); K.pxRect(ctx, textX - 5, cy + 2, 3, 4, K.LANTERN); } // lantern-spark cursor
        K.font.text(ctx, c.text, textX, cy, sel ? '#f4d38c' : '#9a90a8', 1);
        cy += 10;
      });
    } else if (active.done) {
      // advance chevron
      K.font.text(ctx, '\x7e', boxX + boxW - 16, boxY + boxH - 12, K.LANTERN, 1);
    }
  }

  SS.Dialogue = { start, startObj, update, draw, isActive: () => !!active, current: () => active };
})();


// ===== src/game/cutscene.js =====
// E11 — Cutscene runner. Executes a command list per docs/content-schema.md
// (say / move / camera / wait / music / sfx / effects / spawn / despawn /
// choice). Hold-South (either player, 2P-aware) skips: remaining state-
// changing steps' effects are applied so the world stays consistent.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  const SKIP_FRAMES = 36; // ~0.6s hold

  let cut = null, steps = null, idx = 0, ctxRefs = null, onEnd = null;
  let waitFrames = 0, camFrom = null, camTo = null, camT = 0, camDur = 0;
  let holding = 0, letterbox = 0;

  function resolveActor(who) {
    if (!who || !ctxRefs || !ctxRefs.actors) return null;
    return ctxRefs.actors[who] || ctxRefs.actors[who.split('.').pop()] || null;
  }

  function play(cutId, refs) {
    cut = SS.reg('cutscenes', cutId);
    if (!cut) { console.error('[cutscene] unknown id ' + cutId); if (refs && refs.onEnd) refs.onEnd(); return false; }
    steps = cut.steps || []; idx = 0; ctxRefs = refs || {}; onEnd = refs && refs.onEnd;
    waitFrames = 0; camFrom = camTo = null; holding = 0; letterbox = 0;
    beginStep();
    return true;
  }

  function beginStep() {
    if (idx >= steps.length) { finish(false); return; }
    const s = steps[idx];
    switch (s.cmd) {
      case 'say': {
        if (s.dlg) { SS.Dialogue.start(s.dlg, next); }
        else { SS.Dialogue.startObj({ id: '__cut', speaker: s.speaker, nodes: [{ id: 'n1', text: s.text || '' }] }, next); }
        break;
      }
      case 'wait': waitFrames = Math.max(1, Math.round((s.ms || 400) / (1000 / 60))); break;
      case 'camera': {
        if (s.shake) { SS.Renderer.cam.shake(s.shake === true ? 3 : s.shake); next(); }
        else if (s.to) {
          const TS = ctxRefs.region ? ctxRefs.region.tileSize : 24;
          const tx = (s.to.x + 0.5) * TS, ty = (s.to.y + 0.5) * TS;
          camFrom = { x: SS.Renderer.cam.x + SS.Renderer.cam.w / 2, y: SS.Renderer.cam.y + SS.Renderer.cam.h / 2 };
          camTo = { x: tx, y: ty }; camDur = s.ms ? Math.round(s.ms / (1000 / 60)) : 40; camT = 0;
        } else next();
        break;
      }
      case 'move': {
        const a = resolveActor(s.who);
        if (!a || !s.to) { next(); break; }
        const TS = ctxRefs.region ? ctxRefs.region.tileSize : 24;
        a._mtx = (s.to.x + 0.5) * TS; a._mty = (s.to.y + 0.5) * TS; a._mspd = s.speed || 1.2;
        break;
      }
      case 'effects': SS.Effects.apply(s.effects); next(); break;
      case 'music': next(); break; // sequencer is E10
      case 'sfx': SS.Audio && SS.Audio.sfx(s.ref); next(); break;
      case 'spawn': if (ctxRefs.onSpawn) ctxRefs.onSpawn(s); next(); break;
      case 'despawn': if (ctxRefs.onDespawn) ctxRefs.onDespawn(s); next(); break;
      case 'choice': { // minimal: reuse dialogue choices via an inline node
        SS.Dialogue.startObj({ id: '__cutchoice', speaker: s.speaker,
          nodes: [{ id: 'n1', text: s.text || '', choices: (s.choices || []).map(c => ({ text: c.text, effects: c.effects })) }] }, next);
        break;
      }
      default: next();
    }
  }

  function next() { idx++; beginStep(); }

  function finish(skipped) {
    if (skipped) {
      // apply remaining state-changing effects so the world is consistent
      for (let i = idx; i < steps.length; i++) {
        const s = steps[i];
        if (s.cmd === 'effects') SS.Effects.apply(s.effects);
        else if (s.cmd === 'say' && s.dlg) applyDlgEnterEffects(s.dlg);
        else if (s.cmd === 'choice' && s.choices && s.choices[0] && s.choices[0].effects) SS.Effects.apply(s.choices[0].effects);
      }
    }
    if (SS.Dialogue.isActive()) { /* dialogue end callback would re-enter; guard */ }
    const cb = onEnd; cut = null; steps = null; ctxRefs = null; onEnd = null; if (cb) cb();
  }
  function applyDlgEnterEffects(dlgId) {
    const d = SS.reg('dialogue', dlgId); if (!d) return;
    for (const n of d.nodes) if (n.effects) SS.Effects.apply(n.effects);
  }

  function update() {
    if (!cut) return false;
    if (letterbox < 24) letterbox += 3;
    // global skip: hold South on either pad
    if (SS.Input.down(0, 'confirm') || SS.Input.down(1, 'confirm')) {
      // don't count the hold as skip while a dialogue is mid-typewriter reveal
      holding++;
      if (holding >= SKIP_FRAMES && cut.skippable !== false) { if (SS.Dialogue.isActive()) SS.Dialogue.current() && (SS.Dialogue.current().shown = 0); finish(true); return true; }
    } else holding = 0;

    if (SS.Dialogue.isActive()) { SS.Dialogue.update(); return true; }

    if (waitFrames > 0) { waitFrames--; if (waitFrames === 0) next(); return true; }

    if (camTo) {
      camT++;
      const t = Math.min(1, camT / camDur);
      const e = t * t * (3 - 2 * t); // smoothstep
      SS.Renderer.cam.centerOn(camFrom.x + (camTo.x - camFrom.x) * e, camFrom.y + (camTo.y - camFrom.y) * e);
      if (t >= 1) { camTo = camFrom = null; next(); }
      return true;
    }

    // move step in progress?
    const s = steps[idx];
    if (s && s.cmd === 'move') {
      const a = resolveActor(s.who);
      if (a && a._mtx != null) {
        const dx = a._mtx - a.x, dy = a._mty - a.y, d = Math.hypot(dx, dy);
        if (d <= a._mspd) { a.x = a._mtx; a.y = a._mty; a._mtx = a._mty = null; a.moving = false; next(); }
        else { a.x += dx / d * a._mspd; a.y += dy / d * a._mspd; a.facing = SS.math.dir4(dx, dy) || a.facing; a.moving = true; a.animT = (a.animT || 0) + 1; }
      } else next();
      return true;
    }
    return true;
  }

  function draw(ctx) {
    if (!cut) return;
    const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
    K.pxRect(ctx, 0, 0, W, letterbox, K.DEEP_DUSK);
    K.pxRect(ctx, 0, H - letterbox, W, letterbox, K.DEEP_DUSK);
    if (SS.Dialogue.isActive()) SS.Dialogue.draw(ctx);
    // skip hint
    const hint = holding > 0 ? 'SKIPPING' : 'HOLD SOUTH TO SKIP';
    K.font.text(ctx, hint, W - K.font.width(hint, 1) - 8, H - 10, holding > 0 ? K.EMBER : '#8a80a0', 1);
    if (holding > 0) { const w = Math.round((holding / SKIP_FRAMES) * 60); K.pxRect(ctx, W - 68, H - 14, w, 2, K.EMBER); }
  }

  SS.Cutscene = { play, update, draw, isActive: () => !!cut };
})();


// ===== src/game/quest.js =====
// E07 — Quest runtime. Makes the quest JSON the single source of truth for
// stage progression and rewards: every fixed tick it re-evaluates the current
// stage's trigger for each in-progress quest, applies stage effects on a hit,
// advances, and on passing the last stage pays out rewards + continuity and
// marks the quest done. Also resolves the in-world objective marker target and
// feeds the journal UI. Zero allocations in tick(); marker/journal helpers run
// in menu/draw and may allocate.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});

  // per-run runtime state (never persisted; rebuilt by reset on new game)
  const talkPending = Object.create(null); // npcRef -> true once the party finishes talking to them
  let frame = 0;                            // marker-bob clock, advanced by tick()

  function reset() {
    for (const k in talkPending) delete talkPending[k];
    frame = 0;
  }

  // The dialogue wrapper calls this when an NPC conversation ends; it arms the
  // `talk` trigger for that NPC. Cleared per-stage so only talks that happen
  // AFTER a stage begins can satisfy that stage (see beginStage).
  function noteTalk(npcRef) { if (npcRef) talkPending[npcRef] = true; }

  // ---- trigger evaluation (event sources that exist today) ---------------
  // Returns true when the current stage's trigger has fired. `talk` consumes
  // its event so it fires exactly once. kill/cutscene triggers have no wired
  // event source yet, so they never auto-fire — such a stage advances only via
  // explicit stage/dialogue effects.
  function triggerFires(t) {
    const S = SS.State;
    if (!t || !t.type) return false;
    if (t.type === 'item') return S.hasItem(t.item);
    if (t.type === 'flag') {
      const v = S.getFlag(t.flag);
      const ok = ('value' in t) ? v === t.value : !!v;
      return ok && SS.Cond.eval(t.req);
    }
    if (t.type === 'enter') {
      const k = SS.Players.get().kes;
      const a = SS.Game.region.areaAt(k.x, k.y);
      return !!(a && a.id === t.area) && SS.Cond.eval(t.req);
    }
    if (t.type === 'talk') {
      if (!talkPending[t.npc]) return false;
      if (!SS.Cond.eval(t.req)) return false;
      delete talkPending[t.npc];               // consume — fires once
      return true;
    }
    return false;
  }

  // Enforce "since this stage began": a talk recorded before this stage was
  // entered must not satisfy the new stage's talk trigger.
  function beginStage(q, st) {
    const stage = q.stages[st - 1];
    if (stage && stage.trigger && stage.trigger.type === 'talk' && stage.trigger.npc)
      delete talkPending[stage.trigger.npc];
  }

  function payReward(r) {
    const S = SS.State;
    if (!r) return;
    if (typeof r.embers === 'number') S.addEmbers(r.embers);
    const item = r.give || r.item;
    if (item) S.give(item, r.n || 1);
  }

  function complete(id, q) {
    const S = SS.State;
    for (const r of (q.rewards || [])) payReward(r);
    if (q.continuity) SS.Effects.apply(q.continuity);
    S.questSet(id, q.stages.length + 1);       // past the last stage
    S.setFlag('done:' + id, true);             // matches State.questDone
    if (SS.Audio) SS.Audio.sfx('chime');
  }

  // Called every fixed tick from play.update AFTER region/players update.
  function tick() {
    const S = SS.State;
    if (!S) return;
    frame++;
    for (const id in S.quests) {
      const st = S.quests[id];
      const q = SS.reg('quests', id);
      if (!q || st < 1 || st > q.stages.length) continue;   // not in progress
      const stage = q.stages[st - 1];
      if (!stage || !triggerFires(stage.trigger)) continue;
      SS.Effects.apply(stage.effects);
      if (st >= q.stages.length) complete(id, q);
      else { S.questSet(id, st + 1); beginStage(q, st + 1); }
    }
  }

  // ---- journal / marker helpers (menu + draw; allocation OK here) ---------
  function isDone(id, q) { return (SS.State.quests[id] || 0) > q.stages.length || !!SS.State.getFlag('done:' + id); }

  function activeQuests() {
    const S = SS.State, out = [];
    if (!S) return out;
    for (const id in S.quests) {
      const q = SS.reg('quests', id); const st = S.quests[id];
      if (!q || st < 1 || isDone(id, q)) continue;
      out.push({ id, quest: q, stage: st, def: q.stages[st - 1] });
    }
    return out;
  }
  function completedQuests() {
    const S = SS.State, out = [];
    if (!S) return out;
    for (const id in S.quests) {
      const q = SS.reg('quests', id);
      if (!q || !isDone(id, q)) continue;
      out.push({ id, quest: q });
    }
    return out;
  }

  function resolveNpc(ref) {
    const npcs = SS.Game.region.npcs;
    for (const n of npcs) if (n.ref === ref) return { x: n.x, y: n.y };
    return null;
  }
  function resolveAreaCenter(areaId) {
    for (const a of SS.Game.region.areas) if (a.id === areaId)
      return { x: a.rect.x + a.rect.w / 2, y: a.rect.y + a.rect.h / 2 };
    return null;
  }

  // World {x,y} for the active stage's marker (see resolution order in E07).
  function objectiveTarget(questId) {
    const S = SS.State; if (!S) return null;
    const q = SS.reg('quests', questId); const st = S.questStage(questId);
    if (!q || st < 1 || st > q.stages.length) return null;
    const stage = q.stages[st - 1]; if (!stage) return null;
    const t = stage.trigger || {}, m = stage.marker || {};
    if (t.type === 'talk' && t.npc) return resolveNpc(t.npc);
    if (m.npc) return resolveNpc(m.npc);
    if (m.area) return resolveAreaCenter(m.area);
    if (t.area) return resolveAreaCenter(t.area);
    return null;
  }

  // The first in-progress main quest's marker target, for the in-world pin.
  function activeMarker() {
    const S = SS.State; if (!S) return null;
    for (const id in S.quests) {
      const q = SS.reg('quests', id); const st = S.quests[id];
      if (!q || q.category !== 'main' || st < 1 || st > q.stages.length) continue;
      return objectiveTarget(id);
    }
    return null;
  }
  function markerFrame() { return frame; }

  SS.Quest = { reset, noteTalk, tick, activeQuests, completedQuests, objectiveTarget, activeMarker, markerFrame };
})();


// ===== src/game/save.js =====
// E08 — Save system. Three slots (ss_save_1..3) + a global settings store
// (ss_settings), all versioned and every localStorage access guarded so the
// Pi kiosk and private-mode browsers (which can throw on access) degrade to a
// clean no-op instead of crashing. A save is a flat JSON snapshot of the whole
// resumable game-state: flags, quest stages, inventory, embers/act, the region
// id, and both heroes' positions. Audio owns its own volume keys (E10,
// ss_vol_*) — this module never touches them.
//
// Autosave fires only at natural beat boundaries the game already owns
// (entering pause, closing a conversation, and the pagehide/visibilitychange
// flush wired in main.js) and is time-debounced, so it can never run on a hot
// frame. serialize()/apply() are the real code path the save-select UI and the
// autosave both use — there is one way to write a save and one way to load it.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});

  // Bump when the payload shape changes incompatibly. read() rejects any slot
  // whose stored version differs (the migration seam): an incompatible slot
  // reads back as empty rather than hydrating a mismatched shape.
  const SAVE_VERSION = 1;

  const SLOT_KEY = (slot) => 'ss_save_' + slot;
  const SETTINGS_KEY = 'ss_settings';
  const AUTOSAVE_DEBOUNCE_MS = 600;   // floor between autosaves; transitions only

  let lastAutosave = 0;
  // "dirty" = this session has reached at least one real checkpoint, so there
  // is progress worth persisting. A brand-new game that is booted but never
  // played to a checkpoint stays clean, and the pagehide/visibilitychange flush
  // then writes nothing — nothing is lost because there was no progress, and no
  // stray empty-game save is created.
  let dirty = false;

  // ---- localStorage helpers (all guarded) --------------------------------
  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }
  function lsRemove(key) { try { localStorage.removeItem(key); return true; } catch (e) { return false; } }

  // plain-object copy of a null-prototype map (JSON-safe, order-agnostic)
  function copyMap(src) {
    const out = {};
    for (const k in src) out[k] = src[k];
    return out;
  }

  function playerSnapshot(pl) {
    return {
      active: !!pl.active,
      x: pl.x, y: pl.y,
      facing: pl.facing,
      hp: pl.hp, maxhp: pl.maxhp,
    };
  }

  // A short, human descriptor for the slot list: where you are, what you're
  // doing, and how many embers you've gathered. Baked into the payload at write
  // time so slotSummaries() reads it straight from disk without touching live
  // state or content lookups per slot.
  function describe(state, regionId) {
    const region = SS.reg && SS.reg('regions', regionId);
    const place = (region && region.name) || 'The Moor';
    let objective = null;
    if (state.activeQuestHint) objective = state.activeQuestHint();
    const embers = state.embers | 0;
    let d = place;
    if (objective) d += '  -  ' + objective;
    d += '  -  ' + embers + (embers === 1 ? ' EMBER' : ' EMBERS');
    return d;
  }

  // ---- serialize / write -------------------------------------------------
  function serialize() {
    const S = SS.State;
    const players = SS.Players.get();
    const regionId = (SS.Game && SS.Game.region && SS.Game.region.id) || null;
    return {
      version: SAVE_VERSION,
      slot: S.slot,
      act: S.act,
      embers: S.embers,
      flags: copyMap(S.flags),
      quests: copyMap(S.quests),
      inventory: Array.from(S.inventory),
      // E14: worn charms + the upgrade-driven stat pools. Player maxhp/hp (the
      // Dawn Ember result) already ride in the kes/fin snapshots below.
      equippedCharms: Array.from(S.equippedCharms),
      emberCap: S.emberCap,
      slingPower: S.slingPower,
      lightRadiusBonus: S.lightRadiusBonus,
      lanternFuel: S.lanternFuel,
      lanternCapacity: S.lanternCapacity,
      region: regionId,
      kes: playerSnapshot(players.kes),
      fin: playerSnapshot(players.fin),
      savedAt: Date.now(),
      descriptor: describe(S, regionId),
      // the one-line active-quest objective, baked at write time so the save-
      // select rows can show "what you were doing" without touching live state.
      objective: S.activeQuestHint ? S.activeQuestHint() : null,
    };
  }

  function write(slot) {
    try {
      const payload = serialize();
      payload.slot = slot;                         // target slot wins over live slot
      return lsSet(SLOT_KEY(slot), JSON.stringify(payload));
    } catch (e) { return false; }
  }

  // ---- read / version-check ----------------------------------------------
  function read(slot) {
    const raw = lsGet(SLOT_KEY(slot));
    if (!raw) return null;
    let p;
    try { p = JSON.parse(raw); } catch (e) { return null; }
    if (!p || p.version !== SAVE_VERSION) return null;   // incompatible -> treat as empty
    return p;
  }

  function exists(slot) { return read(slot) !== null; }

  // ---- apply (hydrate live state from a payload) -------------------------
  // Loads the payload's region if it differs from the one already loaded (so an
  // R01 multi-region save is a data change, not a rewrite), restores all state,
  // then places both heroes. HUD/journal/objective-marker read SS.State live,
  // so they reflect the loaded state on the very next frame with no re-init.
  // Load the payload's region via the shared SS.Region.swapTo primitive (used
  // by transitions too), so there is one region-swap code path. swapTo no-ops if
  // it's already loaded or the content isn't present yet (keeps the current
  // slice), matching the prior behavior; apply() then places the heroes.
  function loadRegion(regionId) {
    if (!regionId) return;
    SS.Region.swapTo(regionId);
  }

  function placePlayer(pl, snap) {
    if (!snap) return;
    if (typeof snap.x === 'number') pl.x = snap.x;
    if (typeof snap.y === 'number') pl.y = snap.y;
    if (snap.facing) pl.facing = snap.facing;
    if (typeof snap.hp === 'number') pl.hp = snap.hp;
    if (typeof snap.maxhp === 'number') pl.maxhp = snap.maxhp;
    pl.action = 'idle'; pl.moving = false; pl.attackTimer = 0; pl.rollTimer = 0; pl.iframes = 0;
    if (pl.hb) pl.hb.active = false;
  }

  function apply(payload) {
    if (!payload) return false;
    const S = SS.State;
    S.slot = payload.slot;
    S.act = payload.act;
    S.embers = payload.embers | 0;
    // rebuild the maps on a null prototype (same shape State ships with)
    S.flags = Object.create(null);
    for (const k in payload.flags) S.flags[k] = payload.flags[k];
    S.quests = Object.create(null);
    for (const k in payload.quests) S.quests[k] = payload.quests[k];
    S.inventory = new Set(payload.inventory || []);
    // E14 (defaults keep pre-E14 saves loadable: missing fields fall back to a
    // fresh-lantern baseline, so this is a purely additive, version-safe change)
    S.equippedCharms = new Set(payload.equippedCharms || []);
    S.emberCap = payload.emberCap || 200;
    S.slingPower = payload.slingPower || 0;
    S.lightRadiusBonus = payload.lightRadiusBonus || 0;
    S.lanternFuel = payload.lanternFuel || 0;
    S.lanternCapacity = payload.lanternCapacity || 1;

    loadRegion(payload.region);

    const players = SS.Players.get();
    players.kes.active = true;
    placePlayer(players.kes, payload.kes);
    placePlayer(players.fin, payload.fin);
    players.fin.active = !!(payload.fin && payload.fin.active);
    dirty = false; lastAutosave = 0;              // loaded game starts clean
    return true;
  }

  // ---- slot summaries for the save-select UI -----------------------------
  function slotSummaries() {
    const out = [];
    for (let slot = 1; slot <= 3; slot++) {
      const p = read(slot);
      if (!p) { out.push({ slot, empty: true, descriptor: null, savedAt: 0, hearts: 0, maxhearts: 0, embers: 0, place: null, objective: null }); continue; }
      // richer at-a-glance fields so siblings recognize their game: hearts (P1's
      // string), embers, region/area name, and the active objective. All read
      // straight from the stored payload — no live-state or content mutation.
      const region = SS.reg && SS.reg('regions', p.region);
      out.push({
        slot, empty: false,
        descriptor: p.descriptor || describe(SS.State, p.region),
        savedAt: p.savedAt || 0,
        hearts: (p.kes && p.kes.hp) | 0,
        maxhearts: (p.kes && p.kes.maxhp) | 0,
        embers: p.embers | 0,
        place: (region && region.name) || 'The Moor',
        objective: p.objective || null,
      });
    }
    return out;
  }

  // ---- autosave / checkpoints / clear ------------------------------------
  // autosave() flushes the active slot but only once the session is dirty; it
  // is time-debounced so back-to-back transitions never double-write and it can
  // never land on a hot frame. This is what the pagehide/visibilitychange
  // handler calls — a background/quit flushes real progress and no-ops an
  // untouched fresh game.
  function autosave() {
    if (!dirty) return false;
    const now = Date.now();
    if (now - lastAutosave < AUTOSAVE_DEBOUNCE_MS) return false;
    lastAutosave = now;
    return write(SS.State.slot);
  }

  // checkpoint() is a deliberate beat boundary (opening pause, closing a
  // conversation): it marks the session dirty and flushes. Every persisted save
  // originates from a checkpoint; pagehide only ever re-flushes what a
  // checkpoint already established.
  function checkpoint() { dirty = true; return autosave(); }

  // Start a clean session (new game / freshly loaded game): no unsaved progress
  // yet, so a subsequent flush is a no-op until the next checkpoint.
  function sessionReset() { dirty = false; lastAutosave = 0; }

  function clear(slot) { return lsRemove(SLOT_KEY(slot)); }

  // ---- global settings store (ss_settings) -------------------------------
  // A versioned JSON bag for game-wide settings. Audio persists its own volumes
  // under ss_vol_* (E10) and the arcade shell injects lowfx — this store never
  // touches either. Reads/writes are guarded and tolerate a corrupt blob.
  function readSettings() {
    const raw = lsGet(SETTINGS_KEY);
    if (!raw) return {};
    try { const s = JSON.parse(raw); return (s && typeof s === 'object') ? s : {}; }
    catch (e) { return {}; }
  }
  function getSetting(key, fallback) {
    const s = readSettings();
    return (key in s) ? s[key] : fallback;
  }
  function setSetting(key, value) {
    const s = readSettings();
    s[key] = value;
    return lsSet(SETTINGS_KEY, JSON.stringify(s));
  }

  SS.Save = {
    SAVE_VERSION,
    serialize, write, read, exists, apply,
    slotSummaries, autosave, checkpoint, sessionReset, clear,
    getSetting, setSetting, settings: readSettings,
  };
})();


// ===== src/game/player.js =====
// Player — Kes (p0, sword + roll) and Fin (p1, sling + lantern). Movement by
// polling (Input.axis), actions by press-events. Collision via
// entities.moveVsTiles. Attacks expose a hitbox resolved by C05 (enemies.js).
//
// E09 — the co-op layer lives here: P2 drop-in/out, the downed state (replaces
// C05's stopgap safe-respawn), 2P adjacent-hold revive, the both-down/solo-down
// fail-state that restores the last E08 checkpoint (kid-proof, never a harsh
// game-over), and warp-to-partner so the shared camera can never strand a hero
// off-screen. All visuals are baked / drawImage / fillRect (no shadowBlur, no
// per-frame path ops) and the revive/downed indicators are cheap by design.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const K = SS.kit;
  const M = SS.math;
  const WALK = 1.35, ROLL = 3.0;

  // ---- co-op tuning (ticks at fixed 60Hz, px) ---------------------------
  const REVIVE_TICKS = 66;      // ~1.1s adjacent hold to bring a partner back
  const DAWNWARD_REGEN = 240;   // idle ticks per mended heart with the Dawnward Charm (~4s)
  // Kindled Charm (E14) halves the revive channel — light shared, lightly given.
  function reviveTicks() { return (SS.State && SS.State.hasCharm('item.kindled-charm')) ? Math.ceil(REVIVE_TICKS / 2) : REVIVE_TICKS; }
  const REVIVE_RANGE = 18;      // extra gap (beyond both radii) that still counts as adjacent
  const REVIVE_HP = 3;          // a revived hero returns at partial light...
  const REVIVE_IFRAMES = 90;    // ...with a brief mercy-invuln so they aren't instantly re-downed
  const REVIVE_DECAY = 3;       // meter bleed-off per tick when the channel is interrupted
  const DOWN_FAIL_TICKS = 42;   // a short guttering beat once everyone is down, then a kind restore
  const DROPOUT_TICKS = 45;     // ~0.75s P2 hold to gracefully leave co-op
  const WARP_MARGIN = 12;       // px inset from the shared viewport before a trailing hero is warped

  let players = null, projectiles = null, glowFrames = null, downIcon = null;
  let failT = 0, dropoutT = 0;

  // Moth-Cloak glide: once the party has earned the cloak, the heroes may cross
  // `gap` tiles (glide over the void) while every other solid tile still blocks;
  // enemies are unaffected (they keep the plain grid). This returns a cloak-aware
  // collision view for the mover: the plain region when there's no cloak (the
  // common case, zero overhead), otherwise ONE reused wrapper whose solidAt lets
  // gaps through. No per-frame allocation and no per-frame closures — the wrapper
  // is built once and only its region pointer + tileSize are re-pointed.
  let _cloakView = null;
  function cloakView(region) {
    const hasCloak = !!(SS.State && (SS.State.getFlag('has_moth_cloak') || SS.State.hasItem('item.moth-cloak')));
    if (!hasCloak || !region.isGap) return region;
    if (!_cloakView) _cloakView = {
      _r: null, tileSize: 0,
      solidAt(tx, ty) { return this._r.solidAt(tx, ty) && !this._r.isGap(tx, ty); },
    };
    _cloakView._r = region;
    _cloakView.tileSize = region.tileSize;
    return _cloakView;
  }

  function makePlayer(which, p) {
    return { which, pad: p, active: false, x: 0, y: 0, r: 6,
      facing: 'down', action: 'idle', animT: 0, moving: false,
      attackTimer: 0, rollTimer: 0, iframes: 0, hp: 6, maxhp: 6, downed: false,
      reviveT: 0, channeling: false, leaving: false, regenT: 0,
      hitX: false, hitY: false, hitApplied: false,
      // combat hitbox (world coords) valid while action==='attack' mid-swing
      hb: { active: false, x: 0, y: 0, r: 0 } };
  }

  function init() {
    const H = SS.Heroes.build();
    players = { kes: makePlayer('kes', 0), fin: makePlayer('fin', 1) };
