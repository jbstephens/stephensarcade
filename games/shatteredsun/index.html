      const I = SS.Input;
      navMenu(this, 3);
      if (I.anyPressed('cancel')) { SS.Audio && SS.Audio.sfx('menuClose'); SM.replace(title); return; }
      if (I.anyPressed('confirm')) {
        SS.Audio && SS.Audio.unlock(); SS.Audio && SS.Audio.sfx('confirm');
        const slot = this.sel + 1, s = this.slots[this.sel];
        if (s && !s.empty) {
          const payload = SS.Save.read(slot);
          if (payload) SS.Save.apply(payload); else SS.State.newGame(slot);
        } else {
          SS.State.newGame(slot);
        }
        SM.replace(play);
      }
    },
    draw(ctx) {
      const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
      K.pxRect(ctx, 0, 0, W, H, K.DEEP_DUSK);
      const hdr = 'CHOOSE A LANTERN'; K.font.text(ctx, hdr, (W - K.font.width(hdr, 2)) / 2 | 0, 34, '#f4d38c', 2);
      const bw = 360, bh = 62, bx = W / 2 - bw / 2 | 0, maxW = bw - 30;
      for (let i = 0; i < 3; i++) {
        const y = 78 + i * 74; const sel = i === this.sel; const s = this.slots[i] || { empty: true };
        ctx.globalAlpha = 0.92; K.pxRect(ctx, bx, y, bw, bh, sel ? '#221a30' : '#181322'); ctx.globalAlpha = 1;
        K.outlineRect(ctx, bx, y, bw, bh, sel ? K.LANTERN : '#3a3248');
        for (const [nx, ny] of [[bx, y], [bx + bw - 4, y], [bx, y + bh - 4], [bx + bw - 4, y + bh - 4]])
          K.pxRect(ctx, nx, ny, 4, 4, sel ? K.LANTERN : '#3a3248');
        // lantern cursor on the selected row
        if (sel) { K.pxRect(ctx, bx - 12, y + bh / 2 - 4 | 0, 5, 8, K.EMBER); K.pxRect(ctx, bx - 10, y + bh / 2 - 2 | 0, 3, 4, K.LANTERN); }
        const label = 'SLOT ' + (i + 1);
        K.font.text(ctx, label, bx + 12, y + 10, sel ? '#f4d38c' : '#c9bfe0', 1);
        if (s.empty) {
          K.font.text(ctx, 'NEW LIGHT', bx + 12 + K.font.width(label, 1) + 10, y + 10, sel ? '#f4d38c' : '#8a80a0', 1);
          K.font.text(ctx, 'kindle a new lantern', bx + 12, y + 30, '#6a6078', 1);
        } else {
          const ago = savedLabel(s.savedAt);
          if (ago) K.font.text(ctx, ago, bx + bw - 12 - K.font.width(ago, 1) | 0, y + 10, '#7a8a7a', 1);
          // header line: the place/area name, so a sibling recognizes their game
          const place = (s.place || 'The Moor').toUpperCase();
          K.font.text(ctx, place, bx + 12 + K.font.width(label, 1) + 10, y + 10, sel ? '#f4d38c' : '#cdbfe0', 1);
          // status line: heart pips + ember count (the at-a-glance recognizers)
          const hy = y + 26;
          const mh = Math.max(1, Math.min(s.maxhearts || 6, 12));
          let hx = bx + 12;
          for (let hI = 0; hI < mh; hI++) { drawMiniHeart(ctx, hx, hy, hI < s.hearts); hx += 8; }
          const es = (s.embers | 0) + ' EMBERS';
          K.font.text(ctx, es, bx + bw - 12 - K.font.width(es, 1) | 0, hy, '#d9b06a', 1);
          // objective line: the one-line descriptor tail (what you were doing)
          const obj = s.objective || '';
          if (obj) K.font.text(ctx, K.font.wrap(obj, maxW, 1)[0] || '', bx + 12, y + 42, '#9a90a8', 1);
        }
      }
      const hint = 'UP/DOWN CHOOSE     SOUTH/START CONFIRM     CANCEL BACK';
      K.font.text(ctx, hint, (W - K.font.width(hint, 1)) / 2 | 0, H - 22, '#6a6078', 1);
    },
  };

  // ---- play --------------------------------------------------------------
  const drawOrder = [];
  const play = {
    name: 'play', _target: null,
    enter() {
      // (re)stock this region's data-driven combat encounter on every entry to
      // play (new game or loaded slot) — enemies are off the quest path.
      SS.EnemyMgr.load(SS.Game.region);
      // this region's theme takes over from the title/front-door music (or the
      // boss theme, if we just walked out of the arena) the moment play opens.
      applyMusic();
      // player placement handled by State.newGame(); play just triggers the
      // one-time opening cutscene (which sets slice_intro + starts q.main.01).
      if (!SS.State.getFlag('slice_intro')) SM.push(cutsceneState('cut.duskmoor-open'));
    },
    update() {
      const S = SS.State;
      // Per-tick music resolve: swaps to music.boss when the Wraith wakes and
      // back to the region theme on its defeat or when the party leaves the
      // arena/region. playMusic no-ops when the id is unchanged, so this is a
      // cheap state-change check, not a per-frame restart.
      applyMusic();
      S._trans = false;
      // a {shop} effect fired from a closed conversation opens here, on solid
      // play ground, so the shop is never pushed over a state that's popping.
      if (S._pendingShop) { const id = S._pendingShop; S._pendingShop = null; const sh = shopState(id); if (sh) SM.push(sh); return; }
      const region = SS.Game.region, I = SS.Input;
      region.update();
      const kes = SS.Players.get().kes;
      this._target = findInteract(kes, region);
      const suppress = {};
      if (this._target && I.pressed(0, 'confirm')) { suppress.kes = true; openInteract(this._target); }
      if (S._trans) return;                     // a door interact crossed to another region (camera already snapped)
      if (I.pressed(0, 'pause') || I.pressed(1, 'pause')) { SM.push(pause); return; }
      SS.Players.update(region, { suppress });
      if (checkExitTransition(region)) return;  // walked onto an exit rect -> crossed regions (camera snapped)
      SS.EnemyMgr.update(region);               // AI + combat resolution (after players, so hitboxes are current)
      SS.Quest.tick();                          // quest triggers fire from live state
      dungeonTick(region);                      // D01/B01 scripted dungeon beats (no-op outside a dungeon)
      hollowTick(region);                       // D02/B02 Mothqueen's Hollow beats (no-op outside the hollow)
      if (captionT > 0) captionT--;
      if (edgeFlash > 0) edgeFlash--;
      if (SS.SM.name() !== 'play') return;      // a beat pushed a cutscene this tick — camera work belongs to it now
      // camera follows the party midpoint, clamped to region + any area lock
      const m = midpoint();
      const cam = SS.Renderer.cam;
      cam.setBounds(region.worldW, region.worldH);
      cam.setLock(region.lockAt(m.x, m.y));
      cam.centerOn(m.x, m.y);
      cam.tick();
      // co-op safety net: if the shared camera can't keep both heroes visible
      // (walked apart / split by a camera lock), warp the trailing one over.
      SS.Players.keepTogether(region, cam);
    },
    draw(ctx) {
      const region = SS.Game.region, R = SS.Renderer, cam = R.cam;
      R.begin(); R.world();
      region.drawTerrain(ctx, cam);
      drawDungeonGloom(ctx, region, cam);        // D01: grief-dark with light pools (no-op outside a dungeon)
      drawOrder.length = 0;
      for (const n of region.npcs) drawOrder.push(n);
      for (const p of SS.Players.activeList()) drawOrder.push(p);
      // statics (buildings/trees/well/lamps/shrine) y-sort with entities so
      // walking behind a roof puts you BEHIND the roof
      for (const s of region.statics) {
        if (s.x + s.w < cam.x || s.x > cam.x + cam.w || s.y < cam.y || s.topY > cam.y + cam.h) continue;
        drawOrder.push(s);
      }
      for (const o of region.objects) { if (!o.taken) drawOrder.push(o); }   // braziers / key y-sort with the world
      SS.EnemyMgr.collectDrawList(drawOrder, cam);   // live, on-screen enemies y-sort with the world
      drawOrder.sort((a, b) => a.y - b.y);
      for (const e of drawOrder) {
        if (e.isObject) drawObject(ctx, e);
        else if (e.canvas) ctx.drawImage((e.altCanvas && SS.State.getFlag(e.flag)) ? e.altCanvas : e.canvas, e.x | 0, e.topY | 0);
        else if (e.which) SS.Players.drawOne(ctx, e, SS.Game.assets.heroAtlas);
        else if (e.isEnemy) SS.EnemyMgr.drawOne(ctx, e);
        else drawNpc(ctx, e);
      }
      region.drawShrineGlow(ctx);
      SS.Players.drawProjectiles(ctx);
      SS.EnemyMgr.drawShots(ctx);
      SS.EnemyMgr.drawPoofs(ctx);
      SS.EnemyMgr.drawPickups(ctx);      // dropped heart pickups (world-space)
      region.drawWisps(ctx);
      region.drawAmbientOverlay(ctx, cam);
      if (this._target) drawPrompt(ctx, this._target.ent.x, this._target.ent.y - 24, promptLabel(this._target));
      R.ui();
      drawObjectiveMarker(ctx, cam);
      SS.HUD.draw(ctx);
      drawBossHud(ctx);
      drawEdgeFlash(ctx);
      drawCaption(ctx);
    },
  };

  // A dungeon fixture (brazier / key): pick its sprite from live state and blit
  // at its baked foot anchor. drawImage-only — the warm glow is baked into the
  // lit sprite (never shadowBlur).
  function drawObject(ctx, o) {
    let spr;
    if (o.kind === 'key') spr = SS.State.getFlag('d01_beacons_lit') ? o.spriteOn : o.spriteOff;
    else spr = o.on ? o.spriteOn : o.spriteOff;
    ctx.drawImage(spr, o.x | 0, o.topY | 0);
  }

  // Grief-dark: a baked-cost gloom fill over the room with warm light POOLS
  // punched around each hero and every lit brazier (pxGlowSq = fillRects only,
  // so zero drawImage + zero path ops added to the frame). This gloom is the
  // room's STRUCTURAL legibility layer — it gives the hall its shape and focus
  // — so it RUNS under lowfx too (E16 owner hotfix): the dark fill + hero pools
  // + lit-brazier pools are what let a cabinet player see where the light reaches.
  // It stays cheap (fillRects only) so lowfx runs it at a hair lower fill alpha.
  function drawDungeonGloom(ctx, region, cam) {
    if (region.kind !== 'dungeon') return;
    ctx.save();
    ctx.globalAlpha = SS.lowfx() ? 0.5 : 0.55;
    K.pxRect(ctx, cam.x | 0, cam.y | 0, cam.w, cam.h, '#0a0a16');
    ctx.restore();
    // {light-radius} upgrades (Lantern Mantle) widen the carried circle of light.
    const lr = (SS.State && SS.State.lightRadiusBonus || 0) * 8;
    for (const p of SS.Players.activeList()) { if (!p.downed) K.pxGlowSq(ctx, p.x | 0, (p.y - 6) | 0, (p.which === 'fin' ? 52 : 40) + lr, K.LANTERN, 5); }
    for (const o of region.objects) { if (o.kind === 'brazier' && o.on) K.pxGlowSq(ctx, o.cx | 0, (o.y - 16) | 0, 60, K.EMBER, 6); }
  }

  // Boss health bar + a lit/warded read — shown for EITHER woken boss (the
  // Beacon Wraith or the Mothqueen). The name comes from bossInfo(); the tag
  // reads EXPOSED/SHIELDED for the Mothqueen's parasite, VULNERABLE/WARDED for
  // the Wraith. Flat pxRect chrome in the dusk-panel language; only while alive.
  function drawBossHud(ctx) {
    const bi = SS.EnemyMgr.bossInfo();
    if (!bi || !(SS.State.getFlag('d01_wraith_woke') || SS.State.getFlag('d02_queen_woke'))) return;
    const W = SS.Renderer.SCREEN_W, bw = 240, bh = 8, bx = (W - bw) / 2 | 0, by = 16;
    const name = (bi.name || 'BOSS').toUpperCase();
    K.font.text(ctx, name, (W - K.font.width(name, 1)) / 2 | 0, by - 12, '#c9bfe0', 1);
    K.pxRect(ctx, bx - 2, by - 2, bw + 4, bh + 4, K.DEEP_DUSK);
    K.outlineRect(ctx, bx - 2, by - 2, bw + 4, bh + 4, '#3a3248');
    const frac = Math.max(0, bi.hp) / bi.maxhp;
    K.pxRect(ctx, bx, by, bw, bh, '#241a2c');
    K.pxRect(ctx, bx, by, (bw * frac) | 0, bh, bi.vulnerable ? K.EMBER : '#4a5a72');
    K.pxRect(ctx, bx, by, (bw * frac) | 0, 2, bi.vulnerable ? K.LANTERN : '#6f8bad');
    const queen = bi.ref === 'boss.mothqueen';
    const tag = bi.vulnerable ? (queen ? 'EXPOSED' : 'VULNERABLE') : (queen ? 'SHIELDED' : 'WARDED');
    K.font.text(ctx, tag, (W - K.font.width(tag, 1)) / 2 | 0, by + bh + 4, bi.vulnerable ? K.LANTERN : '#8fb0cc', 1);
  }

  // A scripted-beat / puzzle-feedback caption, TOP-CENTER just below the quest
  // toast so a TV player reads it without hunting: scale-2 text in a flat dusk
  // panel with a 1px lantern-tone border (the site UI language). Width is capped
  // to clear the corner HUD panels; centered.
  function drawCaption(ctx) {
    if (captionT <= 0 || !caption) return;
    const W = SS.Renderer.SCREEN_W, sc = 2, pad = 8;
    const lines = K.font.wrap(caption, W - 240, sc);   // cap width to clear the corner HUD panels
    let tw = 0; for (const ln of lines) { const w = K.font.width(ln, sc); if (w > tw) tw = w; }
    const lineH = 16;                                  // scale-2 line advance (8px cell x2)
    const bw = tw + pad * 2, boxH = lines.length * lineH + pad * 2 - 2;
    const bx = (W - bw) / 2 | 0, by = 26;              // just below the quest toast (toast ~y6..18)
    ctx.globalAlpha = 0.9; K.pxRect(ctx, bx, by, bw, boxH, K.DEEP_DUSK); ctx.globalAlpha = 1;
    K.outlineRect(ctx, bx, by, bw, boxH, captionCol);
    for (let i = 0; i < lines.length; i++)
      K.font.text(ctx, lines[i], (W - K.font.width(lines[i], sc)) / 2 | 0, by + pad + i * lineH, captionCol, sc);
  }

  // The wrong-move edge vignette: four dark fillRect bands pulsing at the screen
  // edges for ~edgeFlash frames. Cheap (4 rects) and lowfx-safe (no blur/glow).
  function drawEdgeFlash(ctx) {
    if (edgeFlash <= 0) return;
    const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H, band = 46;
    ctx.save();
    ctx.globalAlpha = Math.min(0.6, (edgeFlash / 10) * 0.6);
    ctx.fillStyle = '#0a0a16';
    ctx.fillRect(0, 0, W, band);
    ctx.fillRect(0, H - band, W, band);
    ctx.fillRect(0, 0, band, H);
    ctx.fillRect(W - band, 0, band, H);
    ctx.restore();
  }

  function drawNpc(ctx, n) {
    K.dither2(ctx, (n.x - 7) | 0, (n.y + 9) | 0, 14, 5, K.DEEP_DUSK, 0.6);
    const f = Math.floor(SS.Game.region.tickVal() / 40) % 2;
    SS.Game.assets.npcAtlas.draw(ctx, `${n.sprite}.idle.down.${f}.rim`, (n.x - 10) | 0, (n.y - 22) | 0);
  }
  // baked lantern-pip objective marker (glow via pxGlowSq — never shadowBlur)
  let pip = null;
  function bakePip() {
    const c = K.makeCanvas(20, 26); const ctx = c.getContext('2d');
    K.pxGlowSq(ctx, 10, 8, 8, K.EMBER, 5);
    const cx = 10, cy = 8, rad = 5;
    for (let y = -rad; y <= rad; y++) {
      const hw = rad - Math.abs(y); if (hw < 0) continue;
      const col = Math.abs(y) <= 1 ? K.FIRST_FLAME : (y < 0 ? K.LANTERN : K.EMBER);
      K.pxRect(ctx, cx - hw, cy + y, hw * 2 + 1, 1, col);
    }
    K.pxRect(ctx, cx - 1, cy + rad + 1, 3, 3, K.EMBER);   // downward tail...
    K.pxRect(ctx, cx, cy + rad + 4, 1, 3, K.LANTERN);     // ...tapering to a point
    return c;
  }
  // Called in UI space: pin above the target when on-screen, clamp to the
  // screen edge (pointing toward it) when off-screen. lowfx -> no bob.
  function drawObjectiveMarker(ctx, cam) {
    const target = SS.Quest.activeMarker(); if (!target) return;
    if (!pip) pip = bakePip();
    const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H, m = 12;
    const sx = target.x - cam.x, sy = target.y - cam.y;
    const lowfx = SS.lowfx();
    if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) {
      const bob = lowfx ? 0 : Math.round(Math.sin(SS.Quest.markerFrame() / 12) * 2);
      ctx.drawImage(pip, (sx - 10) | 0, (sy - 20 - 19 + bob) | 0);   // tail tip just above the target
    } else {
      const cx = sx < m ? m : sx > W - m ? W - m : sx;
      const cy = sy < m ? m : sy > H - m ? H - m : sy;
      ctx.drawImage(pip, (cx - 10) | 0, (cy - 8) | 0);
      // 3px chevron nub pointing outward toward the off-screen target
      const dx = sx - cx, dy = sy - cy, len = Math.hypot(dx, dy) || 1;
      const nx = cx + (dx / len) * 8, ny = cy + (dy / len) * 8;
      K.pxRect(ctx, (nx - 1) | 0, (ny - 1) | 0, 3, 3, K.LANTERN);
    }
  }

  function drawPrompt(ctx, x, y, label) {
    label = label || 'TALK';
    const w = K.font.width(label, 1) + 8;
    ctx.globalAlpha = 0.9; K.pxRect(ctx, (x - w / 2) | 0, y | 0, w, 12, K.DEEP_DUSK); ctx.globalAlpha = 1;
    K.outlineRect(ctx, (x - w / 2) | 0, y | 0, w, 12, K.LANTERN);
    K.font.text(ctx, label, (x - w / 2 + 4) | 0, (y + 2) | 0, K.LANTERN, 1);
    K.pxRect(ctx, (x - w / 2 + w / 2) | 0, (y + 12) | 0, 2, 3, K.LANTERN); // pointer
  }
  function openInteract(t) {
    if (t.type === 'npc') { const dlg = npcDialogue(t.ent.ref); if (dlg) SM.push(dialogueState(dlg, t.ent.ref)); return; }
    if (t.type === 'object') { interactObject(t.ent); return; }
    const p = t.ent.props || {};
    // a door carrying a `to` whose region is authored is a threshold: pressing
    // South crosses inside/outside. (Doors without a `to`, and signs, keep their
    // flavor line.) The cooldown guards against a held press re-firing on arrival.
    if (t.ent.kind === 'door' && p.to && p.to.region && SS.reg('regions', p.to.region)) {
      if (SS.State._exitCooldown > 0) return;
      SS.Audio && SS.Audio.sfx('confirm');
      SS.State.regionTransition(p.to.region, p.to.x, p.to.y, p.to.facing);
      return;
    }
    if (p.dlg) SM.push(dialogueState(p.dlg)); else if (p.text) SM.push(dialogueInline(p.text, p.speaker));
  }
  // Interact-prompt verb: a threshold door reads ENTER, other doors/signs READ,
  // people TALK.
  function promptLabel(t) {
    if (t.type === 'object') {
      if (t.ent.kind === 'key') return 'TAKE';
      return t.ent.on ? 'LIT' : 'LIGHT';
    }
    if (t.type === 'trigger') {
      const e = t.ent, p = e.props || {};
      if (e.kind === 'door') return (p.to && p.to.region && SS.reg('regions', p.to.region)) ? 'ENTER' : 'READ';
      if (e.kind === 'sign') return 'READ';
    }
    return 'TALK';
  }

  // ---- dungeon light mechanic (D01) --------------------------------------
  // The lantern mechanic made interactive: braziers are lit by carrying a spark
  // to them (South). In the DARK GALLERY they must be lit in the inscribed order
  // (north -> south); the last one rekindles the beacon-line and unseals the
  // Keeper's key. Arena braziers light freely — their light is what exposes the
  // Wraith. A brief caption gives kid-legible feedback for every outcome.
  let caption = '', captionT = 0, captionCol = '#f4d38c';
  // captions hold ~300 frames (~5s) by default so a TV player across the room
  // has time to read the puzzle feedback (John missed the old 200-frame ones).
  function setCaption(text, frames, col) { caption = text; captionT = frames || 300; captionCol = col || '#f4d38c'; }
  // A brief screen-edge darkening on a wrong move (e.g. lighting a brazier out
  // of order) — a cheap fillRect vignette a cabinet player can't miss. lowfx-safe.
  let edgeFlash = 0;
  function flashEdges(frames) { edgeFlash = Math.max(edgeFlash, frames || 10); }

  function interactObject(o) {
    const S = SS.State;
    if (o.kind === 'key') {
      if (!S.getFlag('d01_beacons_lit')) { SS.Audio && SS.Audio.sfx('hit'); setCaption('A cold seal. Light the beacon-line first.', 200, '#8fd6e6'); return; }
      if (o.taken) return;
      o.taken = true;
      if (o.props && o.props.effects) SS.Effects.apply(o.props.effects);
      S.setFlag('d01_have_key', true);
      SS.Audio && SS.Audio.sfx('chime');
      setCaption("You take the Keeper's cold-iron key.", 220);
      return;
    }
    // brazier
    if (o.on) { setCaption('It already burns.', 120); return; }
    const region = SS.Game.region;
    if (o.group === 'gallery') {
      if (o.order === region.galleryNext) {
        o.on = true; region.galleryNext++; SS.Audio && SS.Audio.sfx('chime');
        if (region.galleryNext > region.galleryTotal) {
          S.setFlag('d01_beacons_lit', true);
          setCaption('The beacon-line is lit. The key-niche opens.', 240);
        } else {
          setCaption('The wick catches. Keep to the line.', 180);
        }
      } else {
        SS.Audio && SS.Audio.sfx('hit');
        setCaption('Not this one. Light them north to south.', 300, '#8fd6e6');
        flashEdges(10);   // wrong-order press: dark edge-flash so a TV player registers the miss
      }
    } else {
      o.on = true; SS.Audio && SS.Audio.sfx('chime');
      setCaption('The brazier flares - the dark recoils.', 200);
    }
  }

  // The dungeon director: fires the scripted beats off live state each tick —
  // the "do not wake it" arena intro, the mid-fight grief-beat, and laying the
  // Wraith to rest on its defeat (which grants the shard-sliver + opens the way
  // home). All idempotent via one-shot flags so a beat never double-fires.
  function dungeonTick(region) {
    if (region.kind !== 'dungeon') return;
    const S = SS.State;
    const kes = SS.Players.get().kes;
    // intro: crossing into the arena wakes the beacon's grief ("do not wake it")
    if (region.id === 'region.fallen-beacon-spire' && !S.getFlag('d01_wraith_seen')) {
      const a = region.areaAt(kes.x, kes.y);
      if (a && a.id === 'area.beacon-arena') { S.setFlag('d01_wraith_seen', true); SS.State.playCutscene('cut.beacon-wake'); return; }
    }
    const bi = SS.EnemyMgr.bossInfo();
    // mid-fight grief-beat (non-blocking caption so the fight keeps flowing)
    if (bi && S.getFlag('d01_wraith_woke') && !S.getFlag('d01_wraith_half') && bi.hp <= bi.maxhp / 2) {
      S.setFlag('d01_wraith_half', true);
      setCaption('THE WRAITH:  "Put her light down... let me keep my post..."', 240, '#8fd6e6');
    }
    // laid to rest: on defeat, the grief goes out — the closing beat grants the reward
    if (SS.EnemyMgr.bossStatus() === 'dead' && !S.getFlag('d01_boss_dead')) {
      S.setFlag('d01_boss_dead', true);
      SS.State.playCutscene('cut.beacon-laid-to-rest');
    }
  }

  // The Hollow director (D02/B02): the Mothqueen cure-fight's scripted beats,
  // keyed to region.mothqueens-hollow so it coexists cleanly with dungeonTick
  // (which no-ops outside a dungeon). Idempotent via one-shot flags:
  //   - stepping into the Hollow Heart wakes her (the intro cutscene sets
  //     d02_queen_woke, un-dormanting the boss);
  //   - crossing half her light triggers the "keep her lit" grief-beat caption;
  //   - burning the parasite fully off (bossStatus 'dead') plays the cure, which
  //     grants the Moth-Cloak and sets d02_cleared.
  function hollowTick(region) {
    if (region.id !== 'region.mothqueens-hollow') return;
    const S = SS.State;
    const kes = SS.Players.get().kes;
    if (!S.getFlag('d02_queen_seen')) {
      const a = region.areaAt(kes.x, kes.y);
      if (a && a.id === 'area.hollow-heart') { S.setFlag('d02_queen_seen', true); SS.State.playCutscene('cut.mothqueen-intro'); return; }
    }
    const bi = SS.EnemyMgr.bossInfo();
    if (bi && S.getFlag('d02_queen_woke') && !S.getFlag('d02_queen_half') && bi.hp <= bi.maxhp / 2) {
      S.setFlag('d02_queen_half', true);
      setCaption('Keep her in the light - burn the rot, not her!', 240, '#9fe3c8');
    }
    if (SS.EnemyMgr.bossStatus() === 'dead' && !S.getFlag('d02_boss_dead')) {
      S.setFlag('d02_boss_dead', true);
      SS.State.playCutscene('cut.mothqueen-cured');
    }
  }

  // ---- pause -------------------------------------------------------------
  const pause = {
    // RETURN TO TITLE stays at index 2 and SETTINGS at index 3 (INVENTORY is
    // appended LAST, index 4) so the "down, down" -> RETURN TO TITLE and the
    // settings/journal indices the menu harness relies on never shift.
    name: 'pause', sel: 0, opts: ['RESUME', 'JOURNAL', 'RETURN TO TITLE', 'SETTINGS', 'INVENTORY'],
    // opening pause is a natural beat boundary — checkpoint the active slot.
    enter() { this.sel = 0; SS.Save.checkpoint(); },
    update() {
      const I = SS.Input;
      navMenu(this, this.opts.length);
      if (I.pressed(0, 'pause') || I.pressed(1, 'pause') || I.anyPressed('cancel')) { SM.pop(); return; }
      if (I.anyPressed('confirm')) {
        SS.Audio && SS.Audio.sfx('confirm');
        if (this.sel === 0) SM.pop();                       // RESUME
        else if (this.sel === 1) SM.push(journal);          // JOURNAL
        else if (this.sel === 2) { SM.pop(); SM.replace(title); }  // RETURN TO TITLE (progress checkpointed on enter)
        else if (this.sel === 3) SM.push(settings);         // SETTINGS
        else SM.push(inventory);                            // INVENTORY (E14)
      }
    },
    draw(ctx) {
      const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
      ctx.globalAlpha = 0.6; K.pxRect(ctx, 0, 0, W, H, K.DEEP_DUSK); ctx.globalAlpha = 1;
      const bw = 184, bh = 176, bx = W / 2 - bw / 2 | 0, by = 78;
      K.pxRect(ctx, bx, by, bw, bh, '#181322'); K.outlineRect(ctx, bx, by, bw, bh, K.LANTERN);
      cornerPips(ctx, bx, by, bw, bh, K.LANTERN);
      const hdr = 'PAUSED'; K.font.text(ctx, hdr, (W - K.font.width(hdr, 2)) / 2 | 0, by + 14, '#f4d38c', 2);
      this.opts.forEach((o, i) => {
        const y = by + 46 + i * 24; const sel = i === this.sel;
        if (sel) { K.pxRect(ctx, bx + 20, y + 1, 5, 8, K.EMBER); K.pxRect(ctx, bx + 22, y + 3, 3, 4, K.LANTERN); }
        K.font.text(ctx, o, bx + 34, y + 1, sel ? '#f4d38c' : '#8a80a0', 1);
      });
    },
  };

  // ---- journal (quest log) -----------------------------------------------
  // Pad-navigable list of active + completed quests over the frozen play world.
  // Same dusk panel + lantern border as pause/dialogue (flat pxRect, no glow).
  const journal = {
    name: 'journal', sel: 0, rows: [],
    enter() {
      this.sel = 0; this.rows = [];
      for (const a of SS.Quest.activeQuests()) this.rows.push({ id: a.id, quest: a.quest, def: a.def, done: false });
      for (const c of SS.Quest.completedQuests()) this.rows.push({ id: c.id, quest: c.quest, done: true });
    },
    update() {
      const I = SS.Input;
      navMenu(this, this.rows.length);
      if (I.anyPressed('cancel') || I.pressed(0, 'pause') || I.pressed(1, 'pause')) { SS.Audio && SS.Audio.sfx('confirm'); SM.pop(); }
    },
    draw(ctx) {
      const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
      ctx.globalAlpha = 0.72; K.pxRect(ctx, 0, 0, W, H, K.DEEP_DUSK); ctx.globalAlpha = 1;
      const bx = 48, by = 28, bw = W - 96, bh = H - 56;
      ctx.globalAlpha = 0.94; K.pxRect(ctx, bx, by, bw, bh, '#181322'); ctx.globalAlpha = 1;
      K.outlineRect(ctx, bx, by, bw, bh, K.LANTERN);
      for (const [nx, ny] of [[bx, by], [bx + bw - 4, by], [bx, by + bh - 4], [bx + bw - 4, by + bh - 4]])
        K.pxRect(ctx, nx, ny, 4, 4, K.LANTERN);
      const hdr = 'JOURNAL'; K.font.text(ctx, hdr, bx + 12, by + 10, '#f4d38c', 2);
      K.pxRect(ctx, bx + 12, by + 28, bw - 24, 1, '#3a3248');

      if (!this.rows.length) {
        K.font.text(ctx, 'No quests yet. Speak with the folk of Lanternwick.', bx + 14, by + 44, '#9a90a8', 1);
        return;
      }
      // title list
      let ly = by + 38;
      this.rows.forEach((r, i) => {
        const sel = i === this.sel;
        if (sel) { K.pxRect(ctx, bx + 14, ly + 1, 5, 8, K.EMBER); K.pxRect(ctx, bx + 16, ly + 3, 3, 4, K.LANTERN); }
        const col = r.done ? '#7a8a7a' : (sel ? '#f4d38c' : '#c9bfe0');
        K.font.text(ctx, r.quest.title, bx + 26, ly + 1, col, 1);
        if (r.done) K.font.text(ctx, '\x7e', bx + 26 + K.font.width(r.quest.title, 1) + 6, ly + 1, '#9fe3c8', 1);
        ly += 12;
      });
      // detail pane for the selected quest
      const dy = ly + 8;
      K.pxRect(ctx, bx + 12, dy - 6, bw - 24, 1, '#3a3248');
      const sel = this.rows[this.sel];
      const maxW = bw - 28;
      let ty = dy;
      if (sel.done) {
        K.font.text(ctx, 'COMPLETE', bx + 14, ty, '#9fe3c8', 1); ty += 14;
      } else if (sel.def) {
        for (const ln of K.font.wrap('Objective: ' + sel.def.objective, maxW, 1)) { K.font.text(ctx, ln, bx + 14, ty, '#f4d38c', 1); ty += 10; }
        if (sel.def.hint) for (const ln of K.font.wrap(sel.def.hint, maxW, 1)) { K.font.text(ctx, ln, bx + 14, ty, '#cdbfe0', 1); ty += 10; }
        ty += 4;
      }
      for (const ln of K.font.wrap(sel.quest.journalSummary || '', maxW, 1)) { K.font.text(ctx, ln, bx + 14, ty, '#9a90a8', 1); ty += 10; }

      const foot = 'UP/DOWN SELECT     CANCEL/START CLOSE';
      K.font.text(ctx, foot, bx + 14, by + bh - 14, '#6a6078', 1);
    },
  };

  // ---- settings ----------------------------------------------------------
  // Volumes (master/music/sfx), low-effects toggle. Reachable from the title
  // AND from pause — it's simply PUSHED over whichever opened it, so BACK is a
  // clean SM.pop() that lands back exactly where it came from (no return-target
  // bookkeeping). Values reflect persisted state on entry (SS.Audio.getVolume /
  // SS.Save.getSetting) and are live-applied, so reopening or reloading shows
  // what was set. Same dusk-panel + lantern-border language as pause/journal.
  const SET_ROWS = ['MASTER', 'MUSIC', 'SFX', 'LOW EFFECTS', 'BACK'];
  const VOL_KIND = ['master', 'music', 'sfx'];
  function drawVolBar(ctx, x, y, val, sel) {
    const segs = 10, sw = 8, gap = 2, filled = Math.round(val / 10);
    for (let i = 0; i < segs; i++) {
      const sx = x + i * (sw + gap), on = i < filled;
      K.pxRect(ctx, sx, y, sw, 8, on ? (sel ? K.EMBER : K.LANTERN) : '#241a2c');
      K.outlineRect(ctx, sx, y, sw, 8, '#3a3248');
    }
  }
  const settings = {
    name: 'settings', sel: 0, vals: [0, 0, 0], lowfx: false,
    enter() {
      this.sel = 0;
      for (let i = 0; i < 3; i++) this.vals[i] = pctFromVol(SS.Audio ? SS.Audio.getVolume(VOL_KIND[i]) : 0);
      this.lowfx = readLowfx();
      SS.Audio && SS.Audio.unlock(); SS.Audio && SS.Audio.sfx('menuOpen');
    },
    // step a value: sliders by dir*10 (clamped 0..100), the toggle flips
    adjust(dir, toggle) {
      if (this.sel <= 2) {
        let v = this.vals[this.sel] + dir * 10;
        v = v < 0 ? 0 : v > 100 ? 100 : v;
        if (v !== this.vals[this.sel]) {
          this.vals[this.sel] = v;
          SS.Audio && SS.Audio.setVolume(VOL_KIND[this.sel], v / 100);   // live + persisted (ss_vol_*)
          SS.Audio && SS.Audio.sfx('select');                            // audible at the new level
        }
      } else if (this.sel === 3) {
        const next = toggle ? !this.lowfx : dir > 0 ? true : dir < 0 ? false : this.lowfx;
        if (next !== this.lowfx) { this.lowfx = next; writeLowfx(next); SS.Audio && SS.Audio.sfx('select'); }
      }
    },
    update() {
      const I = SS.Input;
      if (I.anyPressed('cancel') || I.pressed(0, 'pause') || I.pressed(1, 'pause')) { SS.Audio && SS.Audio.sfx('menuClose'); SM.pop(); return; }
      navMenu(this, SET_ROWS.length);
      const dir = I.anyPressed('right') ? 1 : I.anyPressed('left') ? -1 : 0;
      if (dir !== 0) this.adjust(dir);
      if (I.anyPressed('confirm')) {
        if (this.sel === 4) { SS.Audio && SS.Audio.sfx('menuClose'); SM.pop(); return; }   // BACK
        if (this.sel === 3) this.adjust(0, true);                                            // toggle LOW EFFECTS
      }
    },
    draw(ctx) {
      const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
      ctx.globalAlpha = 0.72; K.pxRect(ctx, 0, 0, W, H, K.DEEP_DUSK); ctx.globalAlpha = 1;
      const bw = 320, bh = 212, bx = W / 2 - bw / 2 | 0, by = 54;
      ctx.globalAlpha = 0.96; K.pxRect(ctx, bx, by, bw, bh, '#181322'); ctx.globalAlpha = 1;
      K.outlineRect(ctx, bx, by, bw, bh, K.LANTERN);
      cornerPips(ctx, bx, by, bw, bh, K.LANTERN);
      const hdr = 'SETTINGS'; K.font.text(ctx, hdr, (W - K.font.width(hdr, 2)) / 2 | 0, by + 12, '#f4d38c', 2);
      K.pxRect(ctx, bx + 14, by + 34, bw - 28, 1, '#3a3248');
      const barX = bx + 150;
      for (let i = 0; i < SET_ROWS.length; i++) {
        const sel = i === this.sel, y = by + 50 + i * 30;
        if (sel) { K.pxRect(ctx, bx + 14, y + 1, 5, 8, K.EMBER); K.pxRect(ctx, bx + 16, y + 3, 3, 4, K.LANTERN); }
        K.font.text(ctx, SET_ROWS[i], bx + 28, y + 1, sel ? '#f4d38c' : '#c9bfe0', 1);
        if (i <= 2) {
          drawVolBar(ctx, barX, y, this.vals[i], sel);
          const pctStr = this.vals[i] + '%';
          K.font.text(ctx, pctStr, barX + 106, y + 1, sel ? '#f4d38c' : '#9a90a8', 1);
          if (sel) { K.font.text(ctx, '<', barX - 12, y + 1, K.EMBER, 1); K.font.text(ctx, '>', barX + 138, y + 1, K.EMBER, 1); }
        } else if (i === 3) {
          const on = this.lowfx;
          K.font.text(ctx, on ? 'ON' : 'OFF', barX, y + 1, on ? '#9fe3c8' : '#8a80a0', 1);
          if (sel) { K.font.text(ctx, '<', barX - 12, y + 1, K.EMBER, 1); K.font.text(ctx, '>', barX + 30, y + 1, K.EMBER, 1); }
        }
      }
      const foot = 'UP/DOWN SELECT   LEFT/RIGHT ADJUST   SOUTH TOGGLE   CANCEL/START BACK';
      K.font.text(ctx, foot, (W - K.font.width(foot, 1)) / 2 | 0, by + bh - 14, '#6a6078', 1);
    },
  };

  // ---- E14 inventory + charm equip ---------------------------------------
  // Owned items grouped by kind (gear/charms/consumables/quest/keys/upgrades),
  // pad-navigable, with a detail pane for the selected item. South equips or
  // sets aside a charm (limited to CHARM_SLOTS), or USEs a consumable/upgrade —
  // routing its effects through SS.Effects.apply and consuming one. Same dusk-
  // panel + lantern-border language as pause/journal; all drawImage + fillRect,
  // no gradients/shadowBlur, and only redrawn while the menu is open.
  const INV_KIND_ORDER = ['gear', 'charm', 'consumable', 'quest', 'key', 'upgrade'];
  const INV_KIND_LABEL = { gear: 'GEAR & WEAPONS', charm: 'CHARM', consumable: 'CONSUMABLE', quest: 'QUEST ITEM', key: 'KEY', upgrade: 'UPGRADE' };

  // shared list-row draw (icon + lantern-cursor + name), returns nothing.
  function drawItemRow(ctx, it, x, y, sel, tagCol, rightText, rightCol) {
    SS.Icons.draw(ctx, it.icon, x, y - 1, 1);                 // 16px baked icon
    if (sel) { K.pxRect(ctx, x - 10, y + 3, 5, 8, K.EMBER); K.pxRect(ctx, x - 8, y + 5, 3, 4, K.LANTERN); }
    K.font.text(ctx, it.name, x + 20, y + 3, sel ? '#f4d38c' : tagCol, 1);
    if (rightText) K.font.text(ctx, rightText, x + 300 - K.font.width(rightText, 1) | 0, y + 3, rightCol, 1);
  }

  const inventory = {
    name: 'inventory', sel: 0, rows: [], msg: '', msgT: 0, _top: 0,
    build() {
      this.rows = [];
      const owned = [];
      for (const id of SS.State.inventory) { const it = SS.reg('items', id); if (it) owned.push(it); }
      for (const kind of INV_KIND_ORDER) {
        const group = owned.filter(it => (it.kind || '') === kind).sort((a, b) => a.name < b.name ? -1 : 1);
        for (const it of group) this.rows.push(it);
      }
      if (this.sel >= this.rows.length) this.sel = Math.max(0, this.rows.length - 1);
    },
    enter() { this.sel = 0; this._top = 0; this.msg = ''; this.msgT = 0; this.build(); },
    setMsg(t) { this.msg = t; this.msgT = 160; },
    use(it) {
      if (it.effects && it.effects.length) {
        SS.Effects.apply(it.effects);                        // heal / max-hearts / buffs / upgrades
        SS.State.take(it.id);                                // consume one (Set model: have -> not have)
        SS.Audio && SS.Audio.sfx('confirm');
        this.setMsg('Used ' + it.name + '.');
        this.build();
      } else {
        // an effect-less consumable (Lamp-Oil feeds the lantern-burn system,
        // which lands with a later ledger item) — kept, never wasted.
        SS.Audio && SS.Audio.sfx('hit');
        this.setMsg('You keep that for the lantern.');
      }
    },
    update() {
      const I = SS.Input;
      if (this.msgT > 0) this.msgT--;
      navMenu(this, this.rows.length);
      if (I.anyPressed('cancel') || I.pressed(0, 'pause') || I.pressed(1, 'pause')) { SS.Audio && SS.Audio.sfx('menuClose'); SS.Save.checkpoint(); SM.pop(); return; }
      if (I.anyPressed('confirm') && this.rows.length) {
        const it = this.rows[this.sel];
        if (it.kind === 'charm') {
          const r = SS.State.toggleCharm(it.id);
          this.setMsg(r === 'equipped' ? 'Equipped ' + it.name + '.'
            : r === 'unequipped' ? 'Set aside ' + it.name + '.'
            : r === 'full' ? 'Charm slots full (' + SS.State.CHARM_SLOTS + ').' : '');
        } else if (it.kind === 'consumable' || it.kind === 'upgrade') {
          this.use(it);
        } else {
          SS.Audio && SS.Audio.sfx('hit'); this.setMsg('Nothing to do with that here.');
        }
      }
    },
    draw(ctx) {
      const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
      ctx.globalAlpha = 0.72; K.pxRect(ctx, 0, 0, W, H, K.DEEP_DUSK); ctx.globalAlpha = 1;
      const bx = 28, by = 22, bw = W - 56, bh = H - 44;
      ctx.globalAlpha = 0.94; K.pxRect(ctx, bx, by, bw, bh, '#181322'); ctx.globalAlpha = 1;
      K.outlineRect(ctx, bx, by, bw, bh, K.LANTERN);
      cornerPips(ctx, bx, by, bw, bh, K.LANTERN);
      K.font.text(ctx, 'PACK', bx + 12, by + 9, '#f4d38c', 2);
      const em = SS.State.embers + '/' + SS.State.emberCap + ' EMBERS';
      K.font.text(ctx, em, bx + bw - 12 - K.font.width(em, 1) | 0, by + 9, K.EMBER, 1);
      const cs = 'CHARMS ' + SS.State.charmSlotsUsed() + '/' + SS.State.CHARM_SLOTS;
      K.font.text(ctx, cs, bx + bw - 12 - K.font.width(cs, 1) | 0, by + 21, '#9fe3c8', 1);
      K.pxRect(ctx, bx + 12, by + 32, bw - 24, 1, '#3a3248');

      const listX = bx + 24, listTop = by + 42, listBottom = by + bh - 18, rowH = 16;
      const capacity = Math.max(1, Math.floor((listBottom - listTop) / rowH));
      if (!this.rows.length) {
        K.font.text(ctx, 'Your pack is empty. Gather embers and visit a stall.', listX, listTop, '#9a90a8', 1);
      } else {
        let top = this._top;
        if (this.sel < top) top = this.sel;
        if (this.sel >= top + capacity) top = this.sel - capacity + 1;
        this._top = top;
        for (let vi = 0; vi < capacity; vi++) {
          const i = top + vi; if (i >= this.rows.length) break;
          const it = this.rows[i], y = listTop + vi * rowH, sel = i === this.sel;
          const equipped = it.kind === 'charm' && SS.State.hasCharm(it.id);
          drawItemRow(ctx, it, listX, y, sel, equipped ? '#9fe3c8' : '#c9bfe0', equipped ? 'WORN' : '', '#9fe3c8');
        }
        if (top > 0) K.font.text(ctx, '\x18', listX + 300, listTop - 1, '#8a80a0', 1);
        if (top + capacity < this.rows.length) K.font.text(ctx, '\x19', listX + 300, listBottom - 6, '#8a80a0', 1);
      }

      // detail pane (right of a divider)
      const dx = bx + 344, dw = bw - 344 - 14;
      K.pxRect(ctx, dx - 12, by + 40, 1, bh - 56, '#3a3248');
      if (this.rows.length) {
        const it = this.rows[this.sel];
        SS.Icons.draw(ctx, it.icon, dx, by + 46, 3);          // 48px
        K.font.text(ctx, it.name, dx + 56, by + 48, '#f4d38c', 1);
        K.font.text(ctx, INV_KIND_LABEL[it.kind] || (it.kind || '').toUpperCase(), dx + 56, by + 60, '#8fb0cc', 1);
        if (it.kind === 'charm' && SS.State.hasCharm(it.id)) K.font.text(ctx, 'EQUIPPED', dx + 56, by + 72, '#9fe3c8', 1);
        else if (it.shopPrice) K.font.text(ctx, 'VALUE ' + it.shopPrice, dx + 56, by + 72, K.EMBER, 1);
        let ty = by + 98;
        for (const ln of K.font.wrap(it.desc || '', dw, 1)) { K.font.text(ctx, ln, dx, ty, '#cdbfe0', 1); ty += 11; }
        const act = it.kind === 'charm' ? (SS.State.hasCharm(it.id) ? 'SOUTH  UNEQUIP' : 'SOUTH  EQUIP')
          : (it.kind === 'consumable' || it.kind === 'upgrade') ? 'SOUTH  USE' : '';
        if (act) K.font.text(ctx, act, dx, by + bh - 42, K.LANTERN, 1);
      }
      if (this.msgT > 0 && this.msg) K.font.text(ctx, this.msg, bx + 14, by + bh - 26, '#9fe3c8', 1);
      const foot = 'UP/DOWN SELECT     SOUTH USE/EQUIP     CANCEL/START CLOSE';
      K.font.text(ctx, foot, (W - K.font.width(foot, 1)) / 2 | 0, by + bh - 13, '#6a6078', 1);
    },
  };

  // ---- E14 shop (data-driven from content/shops/*.json) ------------------
  // Pad-navigable stock list priced from each item's shopPrice in embers. BUY
  // spends embers (guarded — can't buy what you can't afford, can't double-buy
  // a stackless item), adds it to the pack, and plays a cue. Opened from a real
  // interaction: Reeve's dialogue fires {shop:"shop.id"}, which play.update
  // resolves into this state once the conversation closes.
  function shopState(shopId) {
    const shop = SS.reg('shops', shopId);
    if (!shop) { console.error('[shop] unknown shop id: ' + shopId); return null; }
    const rows = [];
    for (const id of shop.stock || []) { const it = SS.reg('items', id); if (it && typeof it.shopPrice === 'number') rows.push({ id, it, price: it.shopPrice }); }
    return {
      name: 'shop', sel: 0, rows, msg: shop.greeting || '', msgT: shop.greeting ? 220 : 0, _top: 0,
      enter() { SS.Audio && SS.Audio.sfx('menuOpen'); },
      setMsg(t) { this.msg = t; this.msgT = 170; },
      buy(row) {
        const S = SS.State;
        if (S.hasItem(row.id)) { SS.Audio && SS.Audio.sfx('hit'); this.setMsg('Already in your pack.'); return; }
        if (S.embers < row.price) { SS.Audio && SS.Audio.sfx('hit'); this.setMsg('Not enough embers.'); return; }
        S.addEmbers(-row.price);
        S.give(row.id);                                       // adds to pack + plays the chime cue
        this.setMsg('Bought ' + row.it.name + '.');
      },
      update() {
        const I = SS.Input;
        if (this.msgT > 0) this.msgT--;
        navMenu(this, this.rows.length);
        if (I.anyPressed('cancel') || I.pressed(0, 'pause') || I.pressed(1, 'pause')) { SS.Audio && SS.Audio.sfx('menuClose'); SS.Save.checkpoint(); SM.pop(); return; }
        if (I.anyPressed('confirm') && this.rows.length) this.buy(this.rows[this.sel]);
      },
      draw(ctx) {
        const W = SS.Renderer.SCREEN_W, H = SS.Renderer.SCREEN_H;
        ctx.globalAlpha = 0.72; K.pxRect(ctx, 0, 0, W, H, K.DEEP_DUSK); ctx.globalAlpha = 1;
        const bx = 28, by = 22, bw = W - 56, bh = H - 44;
        ctx.globalAlpha = 0.94; K.pxRect(ctx, bx, by, bw, bh, '#181322'); ctx.globalAlpha = 1;
        K.outlineRect(ctx, bx, by, bw, bh, K.LANTERN);
        cornerPips(ctx, bx, by, bw, bh, K.LANTERN);
        K.font.text(ctx, (shop.name || 'STALL').toUpperCase(), bx + 12, by + 9, '#f4d38c', 2);
        const em = SS.State.embers + ' EMBERS';
        K.font.text(ctx, em, bx + bw - 12 - K.font.width(em, 1) | 0, by + 11, K.EMBER, 1);
        K.pxRect(ctx, bx + 12, by + 32, bw - 24, 1, '#3a3248');

        const listX = bx + 24, listTop = by + 42, listBottom = by + bh - 18, rowH = 16;
        const capacity = Math.max(1, Math.floor((listBottom - listTop) / rowH));
        let top = this._top;
        if (this.sel < top) top = this.sel;
        if (this.sel >= top + capacity) top = this.sel - capacity + 1;
        this._top = top;

// ===== src/engine/loop.js =====
// E04 — Fixed 60Hz update / rAF render loop. Accumulator with a max-catchup
// clamp so a slow frame never spirals. Exposes a deterministic manual step
// for the test harness to advance the sim without wall-clock waiting.
(function () {
  'use strict';
  const SS = window.SS || (window.SS = {});
  const STEP = 1000 / 60;
  let updateFn = null, renderFn = null, running = false, acc = 0, last = 0;

  function frame(now) {
    if (!running) return;
    let dt = now - last; last = now;
    if (dt > 250) dt = 250;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 5) { updateFn(); acc -= STEP; steps++; }
    renderFn();
    requestAnimationFrame(frame);
  }

  function start(u, r) {
    updateFn = u; renderFn = r; running = true; acc = 0; last = performance.now();
    requestAnimationFrame(frame);
  }
  function stop() { running = false; }
  // harness: run exactly n fixed updates then one render (no rAF, deterministic)
  function step(n) { for (let i = 0; i < (n || 1); i++) updateFn(); if (renderFn) renderFn(); }

  SS.Loop = { start, stop, step, STEP };
})();


// ===== src/game/main.js =====
// Boot + glue. Builds all baked art, loads the slice region, defines the

    version: 1, slot: 1, act: 1, embers: 0,
    _exitCooldown: 0,   // ticks the play state skips exit-rect checks after arriving (anti-bounce)
    _trans: false,      // set true for the one update() in which a region swap happened
    _pendingShop: null, // a {shop} effect (fired from dialogue) that play.update opens next tick
    flags: Object.create(null),
    quests: Object.create(null),   // id -> stage index (0 = not started)
    inventory: new Set(),
    // ---- E14 economy + charm loadout (all persisted by save.js) ----------
    equippedCharms: new Set(),     // item ids currently worn (<= CHARM_SLOTS)
    CHARM_SLOTS,
    emberCap: BASE_EMBER_CAP,      // raised by {max-embers} upgrades (Ember-Pouch)
    slingPower: 0,                 // {sling-power} upgrades — added to Fin's shot
    lightRadiusBonus: 0,           // {light-radius} upgrades — widens carried light

    hasItem(id) { return this.inventory.has(id); },
    give(id, n) { this.inventory.add(id); if (SS.Audio) SS.Audio.sfx('chime'); },
    take(id) { this.inventory.delete(id); this.equippedCharms.delete(id); },
    addEmbers(n) { this.embers = Math.max(0, Math.min(this.emberCap, this.embers + n)); },
    // ---- charm equip API (queried by combat/coop/light hot paths) --------

    charmSlotsUsed() { return this.equippedCharms.size; },
    // toggle a charm on/off; returns the outcome so the inventory UI can speak it
    toggleCharm(id) {
      if (this.equippedCharms.has(id)) { this.equippedCharms.delete(id); if (SS.Audio) SS.Audio.sfx('menuClose'); return 'unequipped'; }
      if (!this.hasItem(id)) return 'missing';
      if (this.equippedCharms.size >= this.CHARM_SLOTS) { if (SS.Audio) SS.Audio.sfx('hit'); return 'full'; }

    },
    // ---- item-effect helpers (routed through USE, never auto-applied) -----
    // heal restores hp on every standing hero (shared inventory, kid-forgiving).

      const P = SS.Players.get();
      for (const pl of [P.kes, P.fin]) {

      }
    },
    // a Dawn Ember hangs one more heart on both heroes' string and tops them off.
    raiseMaxHearts(n) {

    },
    raiseEmberCap(n) { this.emberCap += n; },
    questStage(id) { return this.quests[id] || 0; },
    questSet(id, s) { this.quests[id] = s; },
    questStart(id) { if (!this.quests[id]) this.quests[id] = 1; },
    questAdvance(id) { this.quests[id] = (this.quests[id] || 0) + 1; },
    questDone(id) { const q = SS.reg('quests', id); const last = q ? q.stages.length : 999; return (this.quests[id] || 0) > last || !!this.flags['done:' + id]; },
    // active-quest objective for the HUD hint (first main quest in progress)
    activeQuestHint() {

    playCutscene(id) { SS.SM.push(SS.States.cutsceneState(id)); },
    // dialogue/cutscene {teleport:{region,x,y,facing?}} effects and region exits
    // both resolve here to the one transition path.
    teleport(t) { if (t && t.region) this.regionTransition(t.region, t.x, t.y, t.facing); },
    // regionTransition: bring the target region online (shared SS.Region.swapTo —
    // swaps the live region, reloads that region's enemies, starts its music),

    regionTransition(regionId, tx, ty, facing) {

      const TS = region.tileSize;

      placeParty(wx, wy, facing || 'down');

  function padActive() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (!gp || !gp.connected) continue;
      for (var b = 0; b < gp.buttons.length; b++)
        if (gp.buttons[b].pressed) return true;
      for (var a = 0; a < gp.axes.length; a++)
        if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  function tick(now) {
    if (leaving) return;
    if (padActive()) last = now;
    if (now - last >= IDLE_MS) {
      leaving = true;
      location.href = '/';   // pagehide fires → games persist their state
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
