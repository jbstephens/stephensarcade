}
function starPath(c, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr2 = i % 2 ? r * .45 : r, a = i / 10 * TAU - Math.PI / 2;
    c.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
  }
  c.closePath();
}

function drawMenuIcons() {
  document.querySelectorAll('#panel canvas[data-bld]').forEach(cv => {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, 104, 104);
    const sz = BLD[cv.dataset.bld].sz;
    c.save(); c.translate(52, 92); c.scale(sz === 2 ? .62 : .9, sz === 2 ? .62 : .9);
    drawBuilding(c, cv.dataset.bld, 1.2, true);
    c.restore();
  });
}

/* ═══════════ RENDER — characters ═══════════ */
function drawVillager(r) {
  ctx.save(); ctx.translate(r.x, r.y);
  const dir = player.x > r.x ? 1 : -1;
  const hop = Math.abs(Math.sin(r.ph * 3)) * 2;
  ctx.fillStyle = 'rgba(20,40,16,.25)';
  ctx.beginPath(); ctx.ellipse(0, 2, 10, 3.5, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -hop);
  ctx.scale(dir, 1);
  /* body */
  ctx.fillStyle = `hsl(${r.hue},55%,55%)`;
  rr(ctx, -7, -16, 14, 17, 5); ctx.fill();
  /* head */
  ctx.fillStyle = '#ffcf9f'; ctx.beginPath(); ctx.arc(0, -22, 8, 0, TAU); ctx.fill();
  ctx.fillStyle = `hsl(${(r.hue + 140) % 360},45%,35%)`;
  ctx.beginPath(); ctx.arc(0, -25, 8, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(3, -22, 1.4, 0, TAU); ctx.arc(-2, -22, 1.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a20'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(1, -19, 3, .2 * Math.PI, .8 * Math.PI); ctx.stroke();
  /* arm */
  ctx.strokeStyle = '#ffcf9f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  if (r.waveT > 0) { ctx.beginPath(); ctx.moveTo(6, -12); ctx.lineTo(11, -22 + Math.sin(now * 12) * 3); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(6, -12); ctx.lineTo(10, -6); ctx.stroke(); }
  if (r.heartT > 0) {
    ctx.scale(dir, 1);
    ctx.fillStyle = '#ff6b8a'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('♥', 0, -38 - (1.2 - r.heartT) * 20);
  }
  ctx.restore();
}

function drawChicken(ch) {
  ctx.save(); ctx.translate(ch.x, ch.y);
  const dir = ch.tx2 > ch.x ? 1 : -1;
  const hop = Math.abs(Math.sin(ch.ph * 6)) * 1.5;
  ctx.fillStyle = 'rgba(20,40,16,.22)';
  ctx.beginPath(); ctx.ellipse(0, 1, 8, 3, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -hop); ctx.scale(dir, 1);
  const peck = ch.peckT > 0 ? Math.abs(Math.sin(now * 14)) * .5 : 0;
  ctx.rotate(peck * .5);
  ctx.fillStyle = ch.hue < .2 ? '#e8b34b' : '#fff';
  ctx.beginPath(); ctx.ellipse(0, -7, 8, 7, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -13, 4.5, 0, TAU); ctx.fill();
  /* tail */
  ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(-12, -14); ctx.lineTo(-4, -11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e84a3a'; ctx.beginPath(); ctx.arc(5, -17, 1.8, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffb35c'; ctx.beginPath(); ctx.moveTo(8.5, -13); ctx.lineTo(13, -12); ctx.lineTo(8.5, -10.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6.5, -14, 1.1, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#ffb35c'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(-2, 2.6); ctx.moveTo(2, 0); ctx.lineTo(2, 2.6); ctx.stroke();
  if (ch.heartT > 0) {
    ctx.fillStyle = '#ff6b8a'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('♥', 0, -26 - (1.2 - ch.heartT) * 16);
  }
  ctx.restore();
}

function drawWizard() {
  const x = POI.wizard.x, y = POI.wizard.y;
  ctx.save(); ctx.translate(x, y + Math.sin(now * 1.6) * 2);
  ctx.fillStyle = 'rgba(20,40,16,.25)';
  ctx.beginPath(); ctx.ellipse(0, 4, 14, 5, 0, 0, TAU); ctx.fill();
  /* robe */
  ctx.fillStyle = '#7a5cb8';
  ctx.beginPath(); ctx.moveTo(-13, 2); ctx.quadraticCurveTo(-10, -26, 0, -28);
  ctx.quadraticCurveTo(10, -26, 13, 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe9a3'; ctx.beginPath(); ctx.arc(-5, -12, 1.6, 0, TAU); ctx.arc(4, -6, 1.6, 0, TAU); ctx.fill();
  /* head + beard */
  ctx.fillStyle = '#ffcf9f'; ctx.beginPath(); ctx.arc(0, -32, 8, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e8e8f0';
  ctx.beginPath(); ctx.moveTo(-7, -30); ctx.quadraticCurveTo(0, -14, 7, -30); ctx.quadraticCurveTo(2, -26, -7, -30); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-3, -33, 1.3, 0, TAU); ctx.arc(3, -33, 1.3, 0, TAU); ctx.fill();
  /* hat */
  ctx.fillStyle = '#5a3f96';
  ctx.beginPath(); ctx.moveTo(-11, -37); ctx.lineTo(4 + Math.sin(now * 2) * 1.5, -62); ctx.lineTo(11, -37); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe9a3'; starPath2(ctx, 0, -44, 3); ctx.fill();
  /* staff */
  ctx.strokeStyle = '#8a5a30'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(14, 2); ctx.lineTo(16, -34); ctx.stroke();
  const p = .5 + Math.sin(now * 3) * .5;
  ctx.fillStyle = `rgba(140,240,255,${.5 + p * .5})`;
  ctx.beginPath(); ctx.arc(16, -38, 4 + p * 1.5, 0, TAU); ctx.fill();
  if (Math.random() < .04)
    particles.push({ x: x + 16, y: y - 38, vx: rnd(-10, 10), vy: rnd(-20, -8), life: 0, maxlife: 1, kind: 'spark', size: 2, hue: rnd(260, 320) });
  ctx.restore();
}
function starPath2(c, x, y, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr2 = i % 2 ? r * .45 : r, a = i / 10 * TAU - Math.PI / 2;
    c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
  }
  c.closePath();
}

function drawCave() {
  const x = POI.cave.x, y = POI.cave.y;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#6b7382';
  ctx.beginPath(); ctx.arc(-50, -20, 42, 0, TAU); ctx.arc(50, -24, 46, 0, TAU); ctx.arc(0, -44, 55, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(240,246,255,.5)';
  ctx.beginPath(); ctx.arc(-10, -76, 16, 0, TAU); ctx.arc(30, -66, 12, 0, TAU); ctx.fill();
  ctx.fillStyle = '#231a28';
  ctx.beginPath(); ctx.arc(0, -6, 34, Math.PI, TAU); ctx.fillRect(-34, -6, 68, 6); ctx.fill();
  ctx.restore();
}

function drawDragon() {
  const d = dragon;
  const sleeping = d.mode === 'sleep';
  ctx.save(); ctx.translate(d.x, d.y);
  const flap = sleeping ? 0 : Math.sin(d.flap) * .6;
  const dir = sleeping ? -1 : (d.vx > 4 ? 1 : d.vx < -4 ? -1 : (player.x > d.x ? 1 : -1));
  if (!sleeping) {
    ctx.fillStyle = 'rgba(20,40,16,.28)';
    ctx.beginPath(); ctx.ellipse(0, 66, 40, 11, 0, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(20,20,30,.3)';
    ctx.beginPath(); ctx.ellipse(0, 16, 52, 13, 0, 0, TAU); ctx.fill();
  }
  ctx.scale(dir, 1);
  const bob2 = sleeping ? Math.sin(now * 1.2) * 2 : 0;
  ctx.translate(0, bob2);
  /* wings */
  ctx.fillStyle = '#c05a3a';
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(-6, -18);
    ctx.rotate(sleeping ? s * .12 : s * (.5 + flap * .5) * .8);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-34 * (sleeping ? .4 : 1), -34 * (sleeping ? .3 : 1) * s, -52 * (sleeping ? .45 : 1), -12 * s);
    ctx.quadraticCurveTo(-30, 6, 0, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  /* tail */
  ctx.strokeStyle = '#e8703f'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-20, 0);
  ctx.quadraticCurveTo(-42, 6 + Math.sin(now * 2) * 6, -54, -4 + Math.sin(now * 1.6) * 8);
  ctx.stroke();
  ctx.fillStyle = '#ffb35c';
  ctx.save(); ctx.translate(-56, -4 + Math.sin(now * 1.6) * 8);
  ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(-10, 0); ctx.lineTo(0, 7); ctx.closePath(); ctx.fill();
  ctx.restore();
  /* body */
  ctx.fillStyle = '#e8703f';
  ctx.beginPath(); ctx.ellipse(0, -8, 26, 20, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffcf9f';
  ctx.beginPath(); ctx.ellipse(4, -2, 15, 11, 0, 0, TAU); ctx.fill();
  /* head */
  ctx.fillStyle = '#e8703f';
  ctx.beginPath(); ctx.arc(22, -26, 15, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(32, -22, 9, 6, 0, 0, TAU); ctx.fill();
  /* horns + spikes */
  ctx.fillStyle = '#ffe9a3';
  ctx.beginPath(); ctx.moveTo(14, -38); ctx.lineTo(11, -48); ctx.lineTo(20, -40); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(24, -39); ctx.lineTo(25, -50); ctx.lineTo(30, -38); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(-4 - i * 9, -24 + i * 2); ctx.lineTo(-8 - i * 9, -32 + i * 2); ctx.lineTo(-12 - i * 9, -22 + i * 3); ctx.closePath(); ctx.fill();
  }
  /* face */
  if (sleeping) {
    ctx.strokeStyle = '#7a3416'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18, -28); ctx.lineTo(24, -28); ctx.stroke();
    ctx.strokeStyle = '#7a3416';
    ctx.beginPath(); ctx.arc(30, -19, 3, 0, Math.PI); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(21, -29, 5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(22.5, -29, 2.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#7a3416'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(30, -18, 5, .1 * Math.PI, .7 * Math.PI); ctx.stroke();
  }
  /* nostril puff */
  if (!sleeping && Math.random() < .02)
    particles.push({ x: d.x + dir * 40, y: d.y - 22, vx: dir * 20, vy: -10, life: 0, maxlife: .7, kind: 'smoke', size: 4, hue: 0 });
  ctx.restore();
}

function drawStar() {
  const x = POI.star.x, y = POI.star.y;
  if (fin && fin.t > 2) return;             // the finale takes over
  ctx.save(); ctx.translate(x, y);
  const p = .5 + Math.sin(now * 2) * .5;
  ctx.fillStyle = 'rgba(60,44,80,.6)';
  ctx.beginPath(); ctx.ellipse(0, 8, 46, 16, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = `rgba(255,230,140,${.16 + p * .12})`;
  ctx.beginPath(); ctx.arc(0, -16, 54 + p * 8, 0, TAU); ctx.fill();
  ctx.fillStyle = `rgba(255,230,140,${.25 + p * .2})`;
  ctx.beginPath(); ctx.arc(0, -16, 32 + p * 5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffe27a';
  ctx.save(); ctx.rotate(Math.sin(now * .8) * .1); starPath(ctx, 26); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#fff8d0';
  ctx.save(); ctx.rotate(Math.sin(now * .8) * .1); starPath(ctx, 14); ctx.fill(); ctx.restore();
  /* sleepy face on the star */
  ctx.fillStyle = '#c9962a';
  ctx.beginPath(); ctx.arc(-5, -18, 1.6, 0, TAU); ctx.arc(5, -18, 1.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#c9962a'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -13, 3, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
  if (Math.random() < .06)
    particles.push({ x: x + rnd(-20, 20), y: y - 20 + rnd(-16, 16), vx: rnd(-8, 8), vy: rnd(-18, -6), life: 0, maxlife: 1.2, kind: 'spark', size: rnd(1.5, 3), hue: 50 });
  ctx.restore();
}

function drawCrate(c) {
  const y = c.landed ? c.y + Math.sin(c.t * 2) * 1.5 : c.curY;
  ctx.save(); ctx.translate(c.x + (c.landed ? 0 : c.swayX || 0), y);
  if (!c.landed) {
    /* balloon delivery! */
    ctx.strokeStyle = 'rgba(120,80,40,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(-4, -42); ctx.moveTo(10, -16); ctx.lineTo(4, -42); ctx.stroke();
    ctx.fillStyle = '#e84a6a';
    ctx.beginPath(); ctx.ellipse(0, -58, 16, 19, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-5, -64, 5, 7, .4, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(20,40,16,.25)';
    ctx.beginPath(); ctx.ellipse(0, 16, 20, 6, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#a8763f'; rr(ctx, -18, -14, 36, 30, 5); ctx.fill();
  ctx.fillStyle = '#8a5a30'; rr(ctx, -18, -14, 36, 10, 5); ctx.fill();
  ctx.fillStyle = '#ffd85e'; rr(ctx, -4, -14, 8, 30, 2); ctx.fill();
  ctx.fillStyle = '#c9962a'; rr(ctx, -6, -4, 12, 10, 3); ctx.fill();
  const s = Math.sin(now * 5 + c.x) * .5 + .5;
  ctx.fillStyle = `rgba(255,255,210,${s * .9})`;
  ctx.beginPath(); ctx.arc(13, -12, 2.5 + s * 2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ── the captain of the kingdom (outfit by age) ── */
const OUTFIT = [null,
  { body: '#6ea84f', trim: '#4a7a34' },      // peasant greens
  { body: '#c9944f', trim: '#8a5a30' },      // farmer
  { body: '#a8763f', trim: '#6e4520' },      // builder
  { body: '#8d99b0', trim: '#5a6883' },      // knight
  { body: '#7a5cb8', trim: '#5a3f96' },      // wizard apprentice
  { body: '#e8703f', trim: '#b04a20' },      // dragon rider
  { body: '#ffd85e', trim: '#c9962a' },      // starforged
];
function drawPlayer() {
  const o = OUTFIT[age];
  ctx.save(); ctx.translate(player.x, player.y);
  ctx.fillStyle = 'rgba(20,40,16,.3)';
  ctx.beginPath(); ctx.ellipse(0, 3, 11, 4, 0, 0, TAU); ctx.fill();
  const hop = player.moving ? Math.abs(Math.sin(player.walkT * 6)) * 3 : 0;
  ctx.translate(0, -hop);
  ctx.scale(player.face, 1);
  /* legs */
  const step = player.moving ? Math.sin(player.walkT * 6) * 4 : 0;
  ctx.strokeStyle = '#5a3a18'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(-3 + step, 1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, -8); ctx.lineTo(3 - step, 1); ctx.stroke();
  /* body */
  ctx.fillStyle = o.body;
  rr(ctx, -8, -20, 16, 15, 5); ctx.fill();
  ctx.fillStyle = o.trim;
  rr(ctx, -8, -9, 16, 4, 2); ctx.fill();
  /* cape for age >= 4 */
  if (age >= 4) {
    ctx.fillStyle = age >= 7 ? '#fff' : age >= 6 ? '#ffb35c' : age >= 5 ? '#b89ee8' : '#e84a6a';
    ctx.beginPath(); ctx.moveTo(-7, -19);
    ctx.quadraticCurveTo(-14 - (player.moving ? 5 : 0), -10 + Math.sin(now * 6) * 1.5, -10 - (player.moving ? 6 : 1), 0);
    ctx.lineTo(-6, -6); ctx.closePath(); ctx.fill();
  }
  /* arm */
  ctx.strokeStyle = '#ffcf9f'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(10 + (player.moving ? step * .5 : 0), -8); ctx.stroke();
  /* head */
  ctx.fillStyle = '#ffcf9f'; ctx.beginPath(); ctx.arc(1, -27, 8.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6b4a2a'; ctx.beginPath(); ctx.arc(0, -30, 8.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(4.5, -27, 1.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a20'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(3, -23.5, 3, .1 * Math.PI, .7 * Math.PI); ctx.stroke();
  /* age headgear (hat overrides) */
  if (hatWorn < 0) {
    if (age === 2) {           // straw hat
      ctx.fillStyle = '#e8c85e';
      ctx.beginPath(); ctx.ellipse(1, -33, 12, 4, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(1, -34, 6.5, Math.PI, TAU); ctx.fill();
    } else if (age === 3) {    // builder cap
      ctx.fillStyle = '#c05a3a';
      ctx.beginPath(); ctx.arc(1, -32, 7, Math.PI, TAU); ctx.fill();
      rr(ctx, 1, -33, 10, 3, 1); ctx.fill();
    } else if (age === 4) {    // knight helm
      ctx.fillStyle = '#c2c8ce';
      ctx.beginPath(); ctx.arc(1, -29, 9, Math.PI * .9, TAU * 1.05); ctx.fill();
      ctx.fillStyle = '#e84a6a';
      ctx.beginPath(); ctx.moveTo(0, -37); ctx.quadraticCurveTo(-6, -44, -10, -38); ctx.lineTo(-2, -34); ctx.closePath(); ctx.fill();
    } else if (age === 5) {    // apprentice hat
      ctx.fillStyle = '#5a3f96';
      ctx.beginPath(); ctx.moveTo(-9, -33); ctx.lineTo(3, -50); ctx.lineTo(11, -33); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe9a3'; starPath2(ctx, 2, -40, 2.5); ctx.fill();
    } else if (age === 6) {    // dragon hood
      ctx.fillStyle = '#e8703f';
      ctx.beginPath(); ctx.arc(1, -30, 9.5, Math.PI * .85, TAU * 1.08); ctx.fill();
      ctx.fillStyle = '#ffe9a3';
      ctx.beginPath(); ctx.moveTo(-4, -38); ctx.lineTo(-6, -44); ctx.lineTo(0, -39); ctx.closePath(); ctx.fill();
    } else if (age === 7) {    // star crown glow
      const p = .5 + Math.sin(now * 3) * .5;
      ctx.fillStyle = `rgba(255,240,170,${.5 + p * .4})`;
      starPath2(ctx, 1, -38, 6); ctx.fill();
    }
  } else {
    ctx.save(); ctx.translate(1, -35); drawHat(ctx, HATS[hatWorn].key); ctx.restore();
  }
  ctx.restore();
}

/* ── hats! ── */
function drawHat(c, key) {
  switch (key) {
    case 'party':
      c.fillStyle = '#ff5f9e'; c.beginPath(); c.moveTo(-8, 2); c.lineTo(0, -16); c.lineTo(8, 2); c.closePath(); c.fill();
      c.fillStyle = '#ffe95e'; c.beginPath(); c.arc(0, -16, 3.4, 0, TAU); c.fill();
      break;
    case 'chicken':
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, -3, 9, 7, 0, 0, TAU); c.fill();
      c.fillStyle = '#e84a3a'; c.beginPath(); c.arc(-2, -10, 2.2, 0, TAU); c.arc(2, -11, 2.2, 0, TAU); c.fill();
      c.fillStyle = '#ffb35c'; c.beginPath(); c.moveTo(8, -4); c.lineTo(13, -3); c.lineTo(8, -1); c.closePath(); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(5, -5, 1, 0, TAU); c.fill();
      break;
    case 'viking':
      c.fillStyle = '#8d9aa8'; c.beginPath(); c.arc(0, 0, 10, Math.PI, TAU); c.fill();
      c.fillStyle = '#ffe9a3';
      c.beginPath(); c.moveTo(-9, -3); c.quadraticCurveTo(-17, -10, -14, -18); c.quadraticCurveTo(-9, -12, -7, -6); c.fill();
      c.beginPath(); c.moveTo(9, -3); c.quadraticCurveTo(17, -10, 14, -18); c.quadraticCurveTo(9, -12, 7, -6); c.fill();
      break;
    case 'wizard':
      c.fillStyle = '#2b3a75';
      c.beginPath(); c.moveTo(-11, 2); c.lineTo(2, -22); c.lineTo(11, 2); c.closePath(); c.fill();
      c.fillStyle = '#ffe95e'; starPath2(c, 0, -8, 3); c.fill();
      c.beginPath(); c.arc(-5, -2, 1.4, 0, TAU); c.arc(6, -6, 1.2, 0, TAU); c.fill();
      break;
    case 'crown':
      c.fillStyle = '#ffd85e';
      c.beginPath(); c.moveTo(-10, 2); c.lineTo(-10, -8); c.lineTo(-5, -2); c.lineTo(0, -10); c.lineTo(5, -2); c.lineTo(10, -8); c.lineTo(10, 2);
      c.closePath(); c.fill();
      c.fillStyle = '#ff5f9e'; c.beginPath(); c.arc(0, -1, 2, 0, TAU); c.fill();
      break;
    case 'prop': {
      c.fillStyle = '#5eb0ff'; c.beginPath(); c.arc(0, -2, 8, Math.PI, TAU); c.fill();
      c.strokeStyle = '#3d4750'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(0, -8); c.lineTo(0, -12); c.stroke();
      const a = now * 12;
      c.fillStyle = '#ffe95e';
      c.save(); c.translate(0, -13); c.scale(Math.cos(a), 1);
      c.beginPath(); c.ellipse(0, 0, 10, 3, 0, 0, TAU); c.fill(); c.restore();
      break; }
  }
}

/* ── particles ── */
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.life / p.maxlife;
    if (p.kind === 'spark') {
      ctx.fillStyle = `hsla(${p.hue},90%,65%,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a + .5, 0, TAU); ctx.fill();
    } else if (p.kind === 'dust') {
      ctx.fillStyle = `rgba(120,100,70,${a * .4})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    } else if (p.kind === 'smoke') {
      ctx.fillStyle = `rgba(140,140,150,${a * .4})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    } else if (p.kind === 'snow') {
      ctx.fillStyle = `rgba(250,252,255,${a * .8})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    } else if (p.kind === 'leaf') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 4 + p.size);
      ctx.fillStyle = `hsla(${p.hue},60%,45%,${a})`;
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * .5, 0, 0, TAU); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'butterfly') {
      ctx.save(); ctx.translate(p.x, p.y);
      const w = Math.sin(p.life * 20) * .8;
      ctx.fillStyle = `hsla(${p.hue},80%,70%,${a})`;
      ctx.beginPath(); ctx.ellipse(-p.size * .8 * Math.abs(Math.cos(w)), 0, p.size * Math.abs(Math.cos(w)), p.size * .7, 0, 0, TAU);
      ctx.ellipse(p.size * .8 * Math.abs(Math.cos(w)), 0, p.size * Math.abs(Math.cos(w)), p.size * .7, 0, 0, TAU); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'confetti') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 6 + p.size);
      ctx.fillStyle = `hsla(${p.hue},85%,65%,${a})`;
      ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
      ctx.restore();
    } else if (p.kind === 'heart') {
      ctx.fillStyle = `rgba(255,107,138,${a})`;
      ctx.font = `bold ${p.size + 4}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('♥', p.x, p.y);
    } else if (p.kind === 'zz') {
      ctx.fillStyle = `rgba(200,220,255,${a})`;
      ctx.font = `bold ${p.size}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('z', p.x + Math.sin(p.life * 3) * 5, p.y);
    } else if (p.kind === 'text') {
      ctx.font = `bold ${p.size}px 'Arial Rounded MT Bold','Trebuchet MS',sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = `rgba(30,20,6,${a * .8})`;
      ctx.strokeText(p.txt, p.x, p.y);
      ctx.fillStyle = p.color || '#ffe9a3'; ctx.globalAlpha = a; ctx.fillText(p.txt, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }
  /* flying pies */
  for (const p of pies) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 8);
    ctx.fillStyle = '#e8c9a0'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e84a6a'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -1, 2.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ═══════════ RENDER — frame composition ═══════════ */
function drawPlacing() {
  if (!placing) return;
  const d = BLD[placing.key];
  for (let i = 0; i < placing.cands.length; i++) {
    const c = placing.cands[i];
    if (i === placing.sel) continue;
    ctx.fillStyle = 'rgba(255,240,170,.28)';
    rr(ctx, c.tx * TILE + 4, c.ty * TILE + 4, d.sz * TILE - 8, d.sz * TILE - 8, 8); ctx.fill();
  }
  const c = placing.cands[placing.sel];
  const ok = canAfford(d.cost) && tilesFree(c.tx, c.ty, d.sz);
  ctx.fillStyle = ok ? 'rgba(140,255,140,.22)' : 'rgba(255,120,120,.25)';
  rr(ctx, c.tx * TILE + 2, c.ty * TILE + 2, d.sz * TILE - 4, d.sz * TILE - 4, 8); ctx.fill();
  ctx.save(); ctx.translate(c.x, c.ty * TILE + d.sz * TILE - 8);
  ctx.globalAlpha = .55 + Math.sin(now * 5) * .12;
  drawBuilding(ctx, placing.key, now, true);
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.strokeStyle = ok ? '#7fff9e' : '#ff8f8f'; ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  rr(ctx, c.tx * TILE + 2, c.ty * TILE + 2, d.sz * TILE - 4, d.sz * TILE - 4, 8); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPrompt() {
  if (placing || panelMode) return;
  let best = null, bd = 1e9;
  const consider = (x, y, r, yOff) => {
    const d = dist(player.x, player.y, x, y);
    if (d < r && d < bd) { bd = d; best = { x, y: y + (yOff || 0) }; }
  };
  for (const c of crates) if (c.landed) consider(c.x, c.y, 80, -46);
  consider(POI.wizard.x, POI.wizard.y, 90, -80);
  if (dragon.found) consider(dragon.x, dragon.y, dragon.mode === 'sleep' ? 160 : 110, -80);
  if (!starTouched) consider(POI.star.x, POI.star.y, 110, -70);
  for (const ch of chickens) consider(ch.x, ch.y, 55, -34);
  for (const r of villagers) consider(r.x, r.y, 65, -48);
  for (const b of buildings) if (BLD[b.key].interact)
    consider(bldCX(b), bldCY(b), 70 + BLD[b.key].sz * 30, -BLD[b.key].sz * 50 - 30);
  for (const o of objects) if (!o.dead && OBJ_DEF[o.kind].res) consider(o.x, o.y - 10, 78, -60);
  if (!best) return;
  const by = best.y - 14 + Math.sin(now * 5) * 5;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.arc(best.x, by, 13, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4a2c00'; ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('✕', best.x, by + 1);
  ctx.textBaseline = 'alphabetic';
}

const NIGHT_STARS = (() => { const R = mulberry(5); const a = [];
  for (let i = 0; i < 120; i++) a.push([R(), R() * .8, R()]); return a; })();

function drawFinaleOverlay() {
  const night = fin ? fin.night : 0;
  if (fin) {
    /* beam of light from the beacon */
    if (fin.beamOn) {
      const bw = 26 + Math.sin(now * 8) * 5;
      const g = ctx.createLinearGradient(fin.bx, fin.by - 800, fin.bx, fin.by);
      g.addColorStop(0, 'rgba(255,240,170,0)');
      g.addColorStop(1, 'rgba(255,240,170,.5)');
      ctx.fillStyle = g;
      ctx.fillRect(fin.bx - bw / 2, fin.by - 800, bw, 740);
    }
    /* the star itself */
    ctx.save(); ctx.translate(fin.starX, fin.starY); ctx.scale(fin.starS, fin.starS);
    ctx.fillStyle = 'rgba(255,230,140,.3)';
    ctx.beginPath(); ctx.arc(0, 0, 48, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.rotate(now * 1.2); starPath(ctx, 26); ctx.fill();
    ctx.fillStyle = '#fff8d0'; starPath(ctx, 14); ctx.fill();
    ctx.restore();
  }
  return night;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#2c5a2c';
  ctx.fillRect(0, 0, VW, VH);
  const v = viewRange();
  ctx.save();
  const shx = shake > 0 ? rnd(-shake, shake) : 0, shy = shake > 0 ? rnd(-shake, shake) : 0;
  ctx.translate(VW / 2 + shx, VH / 2 + shy);
  ctx.scale(SCALE, SCALE);
  ctx.translate(-cam.x, -cam.y);

  drawGround(v);
  drawRiver(v);

  /* y-sorted world sprites */
  const list = [];
  for (const o of objects)
    if (!o.dead && o.x > v.x0 - 80 && o.x < v.x1 + 80 && o.y > v.y0 - 40 && o.y < v.y1 + 130)
      list.push({ y: o.y, f: () => drawObject(o) });
  for (const b of buildings) {
    const by = (b.ty + BLD[b.key].sz) * TILE - 8, bx = bldCX(b);
    if (bx > v.x0 - 120 && bx < v.x1 + 120 && by > v.y0 - 40 && by < v.y1 + 160)
      list.push({ y: by, f: () => { ctx.save(); ctx.translate(bx, by); drawBuilding(ctx, b.key, b.t, b.active); ctx.restore();
        if (BLD[b.key].pop && Math.random() < .008)
          particles.push({ x: bx + rnd(-14, 14), y: by - 50, vx: rnd(-4, 4), vy: rnd(-14, -8), life: 0, maxlife: 1.4, kind: 'smoke', size: rnd(3, 5), hue: 0 }); } });
  }
  for (const s of SIGNS)
    if (s.x > v.x0 - 60 && s.x < v.x1 + 60 && s.y > v.y0 - 40 && s.y < v.y1 + 90)
      list.push({ y: s.y, f: () => drawSign(s) });
  if (POI.wizard.x > v.x0 - 80 && POI.wizard.x < v.x1 + 80 && POI.wizard.y > v.y0 - 40 && POI.wizard.y < v.y1 + 90)
    list.push({ y: POI.wizard.y, f: drawWizard });
  if (POI.cave.x > v.x0 - 200 && POI.cave.x < v.x1 + 200 && POI.cave.y > v.y0 - 100 && POI.cave.y < v.y1 + 160)
    list.push({ y: POI.cave.y - 60, f: drawCave });
  if (POI.star.x > v.x0 - 120 && POI.star.x < v.x1 + 120 && POI.star.y > v.y0 - 60 && POI.star.y < v.y1 + 120)
    list.push({ y: POI.star.y, f: drawStar });
  for (const r of villagers)
    if (r.x > v.x0 - 40 && r.x < v.x1 + 40 && r.y > v.y0 - 40 && r.y < v.y1 + 60)
      list.push({ y: r.y, f: () => drawVillager(r) });
  for (const ch of chickens)
    if (ch.x > v.x0 - 40 && ch.x < v.x1 + 40 && ch.y > v.y0 - 30 && ch.y < v.y1 + 40)
      list.push({ y: ch.y, f: () => drawChicken(ch) });
  for (const c of crates)
    if (c.x > v.x0 - 40 && c.x < v.x1 + 40 && c.y > v.y0 - 40 && c.y < v.y1 + 60)
      list.push({ y: c.y, f: () => drawCrate(c) });
  if (scene !== 'title') list.push({ y: player.y, f: drawPlayer });
  if (dragon.mode === 'sleep') {
    if (dragon.x > v.x0 - 150 && dragon.x < v.x1 + 150 && dragon.y > v.y0 - 100 && dragon.y < v.y1 + 120)
      list.push({ y: dragon.y + 20, f: drawDragon });
  }
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.f();

  if (dragon.mode !== 'sleep') drawDragon();       // flying friend rides above it all
  drawParticles();
  const anyFog = drawFog(v);
  if (scene === 'play') { drawPlacing(); drawPrompt(); }
  const night = drawFinaleOverlay();
  ctx.restore();

  /* night wash + twinkling sky (finale) */
  if (night > 0) {
    ctx.fillStyle = `rgba(8,10,40,${night * .78})`;
    ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#fff';
    for (const [sx, sy, tw] of NIGHT_STARS) {
      ctx.globalAlpha = night * (.3 + .7 * Math.abs(Math.sin(now * 2 + tw * 9)));
      ctx.fillRect(sx * VW, sy * VH, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  /* cozy vignette */
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .45, VW / 2, VH / 2, Math.max(VW, VH) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(10,24,8,.32)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);
}

/* ═══════════ MAIN LOOP + BOOT ═══════════ */
let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(1 / 30, (ts - lastT) / 1000 || 0);
  lastT = ts;
  now = ts / 1000;
  if (scene === 'title') {
    const a = now * .05;
    cam.x = WORLD / 2 + Math.cos(a) * 260;
    cam.y = WORLD / 2 + Math.sin(a * 1.3) * 200;
    updateParticles(dt);
  } else {
    update(dt);
    refreshHUD();
  }
  render();
}

document.addEventListener('visibilitychange', () => { if (document.hidden && scene !== 'title') save(); });
addEventListener('mousedown', ensureAudio, { once: true });

resize();
genWorld();
placeBuildingAt('campfire', WT / 2, WT / 2);
buildTitleBtns();
updateGoalUI();
requestAnimationFrame(frame);
</script>

<!-- injected by scripts/bundle-games.sh — hold PS (or SELECT+START) on any gamepad to return to the arcade menu -->
<script id="__arcade_pad_exit">
(function () {
  var HOLD_MS = 1000;
  var heldSince = 0;
  var leaving = false;
  function comboDown(gp) {
    var b = gp.buttons;
    var ps = b[16] && b[16].pressed;
    var selectStart = b[8] && b[8].pressed && b[9] && b[9].pressed;
    return !!(ps || selectStart);
  }
  function tick(now) {
    if (leaving) return;
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var down = false;
    for (var i = 0; i < pads.length; i++) {
      if (pads[i] && pads[i].connected && comboDown(pads[i])) { down = true; break; }
    }
    var btn = document.getElementById('__arcade_back');
    if (!down) {
      heldSince = 0;
      if (btn) { btn.style.transform = ''; btn.style.boxShadow = ''; }
    } else {
      if (!heldSince) heldSince = now;
      var progress = (now - heldSince) / HOLD_MS;
      if (btn) {
        btn.style.transform = 'scale(' + (1 + 0.35 * Math.min(progress, 1)) + ')';
        btn.style.transformOrigin = 'top left';
        btn.style.boxShadow = '0 0 ' + Math.round(18 * Math.min(progress, 1)) + 'px #ffd23f';
      }
      if (progress >= 1) { leaving = true; location.href = '/'; return; }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

<!-- injected by scripts/bundle-games.sh — low-effects mode for the Pi console.
     Canvas shadowBlur (neon glow) costs a GPU blur pass per glowing sprite;
     the Pi 5 drops from ~50fps to ~13fps with it on. The console kiosk loads
     the arcade with ?fx=low, the launcher persists the flag in localStorage,
     and this overlay no-ops shadowBlur in every bundled game. Visit with
     ?fx=full to turn glows back on. -->
<script id="__arcade_lowfx">
(function () {
  var on = false;
  try {
    if (/[?&]fx=low\b/.test(location.search)) { on = true; localStorage.setItem('arcade_lowfx', '1'); }
    else if (/[?&]fx=full\b/.test(location.search)) { localStorage.setItem('arcade_lowfx', '0'); }
    else { on = localStorage.getItem('arcade_lowfx') === '1'; }
  } catch (e) {}
  if (!on) return;
  try {
    Object.defineProperty(CanvasRenderingContext2D.prototype, 'shadowBlur', {
      set: function () {}, get: function () { return 0; }
    });
  } catch (e) {}
  // Console mode: no mouse exists, so never show a cursor. And CSS
  // backdrop-filter re-blurs the animating canvas under every frosted panel
  // on every frame — measured 17fps -> 60fps in Ninth Inning on the Pi by
  // disabling it. Panels keep their translucent rgba backgrounds.
  try {
    document.head.insertAdjacentHTML('beforeend',
      '<style>* { cursor: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }</style>');
  } catch (e) {}
})();
</script>

<!-- injected by scripts/bundle-games.sh — after 15 idle minutes (no pad /
     keyboard / touch input) return to the arcade menu. Games save on
     pagehide and/or rolling autosave, so nothing is lost. Test override:
     ?idle=<seconds>. -->
<script id="__arcade_idle">
(function () {
  var qs = new URLSearchParams(location.search).get('idle');
  var IDLE_MS = (qs ? Math.max(10, parseFloat(qs)) : 15 * 60) * 1000;
  var DEADZONE = 0.25;
  var last = performance.now();
  var leaving = false;
  function bump() { last = performance.now(); }
  window.addEventListener('keydown', bump, { capture: true });
  window.addEventListener('pointerdown', bump, { capture: true });
  window.addEventListener('touchstart', bump, { capture: true, passive: true });
  function padActive() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (!gp || !gp.connected) continue;
      for (var b = 0; b < gp.buttons.length; b++)
        if (gp.buttons[b].pressed) return true;
      for (var a = 0; a < gp.axes.length; a++)
        if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  function tick(now) {
    if (leaving) return;
    if (padActive()) last = now;
    if (now - last >= IDLE_MS) {
      leaving = true;
      location.href = '/';   // pagehide fires → games persist their state
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
