  </div>

<script>
'use strict';
/* ═════════════════════════════════════════════════════════════════════
   CASTLEFORGE — sequel to IslandForge.
   One static file. Canvas 2D, no libraries. Top-down kingdom builder:
   chop, build, age up, unlock the wild lands, befriend a dragon, and
   light the fallen star home.
   ═════════════════════════════════════════════════════════════════════ */

/* ───── canvas boot ───── */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1, SCALE = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = VW * DPR; canvas.height = VH * DPR;
  SCALE = Math.max(.72, Math.min(VW / 1280, VH / 800, 1.15));
}
addEventListener('resize', resize);

/* ───── tiny helpers ───── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.random() * arr.length | 0];
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hash2 = (x, y) => {          // deterministic per-tile noise 0..1
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ h >> 13) * 1274126177 | 0;
  return ((h ^ h >> 16) >>> 0) / 4294967296;
};
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  r = clamp(r + r * amt | 0, 0, 255); g = clamp(g + g * amt | 0, 0, 255); b = clamp(b + b * amt | 0, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ═══════════ AUDIO — tiny WebAudio synth ═══════════ */
let actx = null, master = null, muted = false;
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = .5; master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(f, dur, type = 'sine', vol = .2, delay = 0, slide = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + .05);
}
function noiseHit(dur = .12, vol = .18, delay = 0, hp = 400) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay, n = actx.sampleRate * dur | 0;
  const buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(); s.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = actx.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
const SFX = {
  blip:   () => tone(660, .07, 'square', .12),
  bloop:  () => { tone(300, .12, 'sine', .22, 0, 160); },
  pop:    () => { tone(520, .09, 'sine', .25, 0, 300); noiseHit(.05, .08, 0, 1200); },
  chop:   () => { noiseHit(.09, .22, 0, 250); tone(160, .07, 'triangle', .2); },
  build:  () => { tone(240, .1, 'triangle', .22); tone(360, .12, 'triangle', .2, .09); tone(480, .16, 'triangle', .2, .19); },
  deny:   () => { tone(200, .12, 'square', .12); tone(150, .16, 'square', .12, .1); },
  ui:     () => tone(520, .05, 'square', .08),
  goal:   () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .22, i * .09)); },
  ageUp:  () => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'triangle', .22, i * .1)); noiseHit(.3, .1, .5, 300); },
  crate:  () => { tone(784, .1, 'square', .15); tone(988, .1, 'square', .15, .09); tone(1319, .22, 'square', .18, .18); },
  cluck:  () => { tone(880, .06, 'square', .16, 0, 200); tone(700, .08, 'square', .13, .09, -150); },
  clang:  () => { tone(1800, .12, 'square', .08, 0, -400); noiseHit(.06, .12, 0, 2000); },
  hi:     () => { tone(880, .09, 'sine', .18); tone(1175, .13, 'sine', .18, .08); },
  magic:  () => { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .18, 'sine', .12, i * .06)); },
  roar:   () => { tone(90, .9, 'sawtooth', .22, 0, 50); noiseHit(.5, .18, 0, 120); },
  rumble: () => { tone(60, .8, 'sawtooth', .18, 0, -20); noiseHit(.6, .2, 0, 80); },
  fanfare:() => { [523, 523, 523, 659, 784, 784, 1047].forEach((f, i) => tone(f, .22, 'square', .14, i * .13)); },
};
let ambT = 0;
function ambientTick(dt) {                    // birdsong!
  if (!actx || muted) return;
  ambT -= dt;
  if (ambT <= 0) {
    ambT = rnd(4, 11);
    const f0 = rnd(1400, 2400);
    tone(f0, .09, 'sine', .035, 0, rnd(200, 500));
    tone(f0 * 1.2, .07, 'sine', .03, .12, -rnd(100, 300));
  }
}

/* ═══════════ DATA — ages, regions, resources, buildings ═══════════ */
const TILE = 64, WT = 50, WORLD = TILE * WT;      // 3200×3200 world

const AGES = [
  null,
  { name: 'CAMPFIRE AGE', sub: 'Chop wood, build cottages!' },
  { name: 'FARMING AGE',  sub: 'The Farmlands are open — grow food!' },
  { name: 'BUILDER AGE',  sub: 'The Whisperwood is open — sawmills and quarries!' },
  { name: 'KNIGHT AGE',   sub: 'The Stone Hills are open — raise a castle!' },
  { name: 'WIZARD AGE',   sub: 'The Wizard\'s Glade is open — it sparkles!' },
  { name: 'DRAGON AGE',   sub: 'The Dragon Peaks are open — something BIG lives there…' },
  { name: 'STARFALL AGE', sub: 'The crater is open — a star fell from the sky!' },
];

const REGIONS = {
  meadow:    { name: 'THE SUNNY MEADOW',   age: 1, ground: '#79bd58' },
  farm:      { name: 'THE FARMLANDS',      age: 2, ground: '#94c162' },
  forest:    { name: 'THE WHISPERWOOD',    age: 3, ground: '#4e9450' },
  hills:     { name: 'THE STONE HILLS',    age: 4, ground: '#9aa678' },
  glade:     { name: 'THE WIZARD\'S GLADE',age: 5, ground: '#4f8a80' },
  peaks:     { name: 'THE DRAGON PEAKS',   age: 6, ground: '#8d8f98' },
  crater:    { name: 'STARFALL CRATER',    age: 7, ground: '#6e5f80' },
};
/* geometric region lookup (world px) */
function regionAt(x, y) {
  if (dist(x, y, 640, 640) < 520) return 'crater';                       // NW
  if (x > 2280 && y < 1080) return 'peaks';                              // NE
  if (y < 1000) return 'glade';                                          // N band
  if (y > 2350) return 'hills';                                          // S band
  if (x < 980) return 'forest';                                          // W band
  if (x > 2150) return 'farm';                                           // E band (across river)
  return 'meadow';
}
const regionUnlocked = key => age >= REGIONS[key].age;

/* the river: vertical, separates meadow from farmlands; bridge at mid */
const RIVER_X = 2150, RIVER_W = 120;
const riverCurve = y => RIVER_X + Math.sin(y * .004) * 40;
const BRIDGE_Y = 1620, BRIDGE_H = 150;
function inRiver(x, y) {
  const cx2 = riverCurve(y);
  if (x < cx2 - RIVER_W / 2 || x > cx2 + RIVER_W / 2) return false;
  if (age >= 2 && Math.abs(y - BRIDGE_Y) < BRIDGE_H / 2) return false;   // the bridge!
  return true;
}

const RESDEF = {
  wood:  { ico: '🪵', name: 'WOOD' },
  food:  { ico: '🍞', name: 'FOOD' },
  stone: { ico: '🪨', name: 'STONE' },
  iron:  { ico: '⚙️', name: 'IRON' },
  gold:  { ico: '🪙', name: 'GOLD' },
  magic: { ico: '✨', name: 'MAGIC' },

function genWorld() {
  const R = mulberry(11);
  objects = [];
  for (let ty = 0; ty < WT; ty++) for (let tx = 0; tx < WT; tx++) {
    const x = tx * TILE + TILE / 2 + (R() - .5) * 34;
    const y = ty * TILE + TILE / 2 + (R() - .5) * 34;
    const reg = regionAt(x, y);
    if (dist(x, y, POI.campfire.x, POI.campfire.y) < 240) continue;      // starting clearing
    if (dist(x, y, POI.star.x, POI.star.y) < 180) continue;
    if (dist(x, y, POI.wizard.x, POI.wizard.y) < 120) continue;
    if (dist(x, y, POI.cave.x, POI.cave.y) < 200) continue;
    const cx2 = riverCurve(y);
    if (Math.abs(x - cx2) < RIVER_W / 2 + 46) continue;                  // river banks clear
    if (Math.abs(y - BRIDGE_Y) < 130 && x > 1900 && x < 2400) continue;  // bridge road
    const roll = R();
    let kind = null;
    if (reg === 'meadow') kind = roll < .06 ? 'oak' : roll < .085 ? 'rock' : roll < .11 ? 'bush' : null;
    else if (reg === 'farm') kind = roll < .05 ? 'oak' : roll < .08 ? 'bush' : null;
    else if (reg === 'forest') kind = roll < .3 ? 'pine' : roll < .33 ? 'rock' : roll < .36 ? 'bush' : null;
    else if (reg === 'hills') kind = roll < .1 ? 'rock' : roll < .17 ? 'ore' : roll < .2 ? 'boulder' : roll < .22 ? 'oak' : null;
    else if (reg === 'glade') kind = roll < .1 ? 'sparkletree' : roll < .18 ? 'crystal' : roll < .2 ? 'rock' : null;
    else if (reg === 'peaks') kind = roll < .12 ? 'boulder' : roll < .2 ? 'ore' : roll < .24 ? 'rock' : roll < .27 ? 'pine' : null;
    else if (reg === 'crater') kind = roll < .12 ? 'shard' : roll < .18 ? 'boulder' : roll < .2 ? 'rock' : null;
    if (!kind) continue;
    const d = OBJ_DEF[kind];
    objects.push({ kind, x, y, hp: d.hp, maxhp: d.hp, dead: 0, respawn: 0, s: .82 + R() * .5, ph: R() * TAU });
  }
}

/* ── occupancy + collision ── */
const tkey = (tx, ty) => tx + ',' + ty;
function tilesFree(tx, ty, sz) {
  for (let dy = 0; dy < sz; dy++) for (let dx = 0; dx < sz; dx++) {
    const ttx = tx + dx, tty = ty + dy;
    if (ttx < 1 || tty < 1 || ttx >= WT - 1 || tty >= WT - 1) return false;
    if (occ.has(tkey(ttx, tty))) return false;
    const cx2 = ttx * TILE + TILE / 2, cy2 = tty * TILE + TILE / 2;
    if (!regionUnlocked(regionAt(cx2, cy2))) return false;
    for (const corner of [[8, 8], [TILE - 8, 8], [8, TILE - 8], [TILE - 8, TILE - 8]])
      if (inRiver(ttx * TILE + corner[0], tty * TILE + corner[1])) return false;
    for (const o of objects)
      if (!o.dead && o.x > ttx * TILE - 20 && o.x < (ttx + 1) * TILE + 20 &&
          o.y > tty * TILE - 20 && o.y < (tty + 1) * TILE + 20) return false;
    for (const p of [POI.star, POI.wizard, POI.cave])
      if (dist(cx2, cy2, p.x, p.y) < 150) return false;
  }
  return true;
}
function placeBuildingAt(key, tx, ty) {
  const d = BLD[key];
  const b = { key, tx, ty, t: rnd(0, 9), active: true };
  for (let dy = 0; dy < d.sz; dy++) for (let dx = 0; dx < d.sz; dx++)
    occ.set(tkey(tx + dx, ty + dy), b);
  buildings.push(b);
  return b;
}
const bldCX = b => b.tx * TILE + BLD[b.key].sz * TILE / 2;
const bldCY = b => b.ty * TILE + BLD[b.key].sz * TILE / 2;

/* movement blocking test for a circle at (x,y) r=13 */
function blocked(x, y) {
  if (x < 40 || y < 40 || x > WORLD - 40 || y > WORLD - 40) return true;
  if (!regionUnlocked(regionAt(x, y))) return true;
  if (inRiver(x, y)) return true;
  for (const o of objects) {
    if (o.dead) continue;
    const d = OBJ_DEF[o.kind];
    if (Math.abs(o.x - x) < 60 && Math.abs(o.y - y) < 60 && dist(o.x, o.y, x, y) < d.r * o.s + 10) return true;
  }
  const tx = x / TILE | 0, ty = y / TILE | 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const b = occ.get(tkey(tx + dx, ty + dy));
    if (!b) continue;
    const d = BLD[b.key];
    const x0 = b.tx * TILE + 6, y0 = b.ty * TILE + 10, x1 = (b.tx + d.sz) * TILE - 6, y1 = (b.ty + d.sz) * TILE - 4;
    if (x > x0 && x < x1 && y > y0 && y < y1) return true;
  }
  if (dist(x, y, POI.star.x, POI.star.y) < 46 && !starTouched) { /* allow close approach */ }
  return false;
}

/* placement candidates near the player */
function freeTilesNear(px2, py2, sz) {
  const out = [];
  const ptx = px2 / TILE | 0, pty = py2 / TILE | 0;
  for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
    const tx = ptx + dx, ty = pty + dy;
    if (!tilesFree(tx, ty, sz)) continue;
    /* never offer a spot the player is standing in — no building on your own head! */
    if (px2 > tx * TILE - 16 && px2 < (tx + sz) * TILE + 16 &&
        py2 > ty * TILE - 16 && py2 < (ty + sz) * TILE + 16) continue;
    const cx2 = tx * TILE + sz * TILE / 2, cy2 = ty * TILE + sz * TILE / 2;
    out.push({ tx, ty, x: cx2, y: cy2, d: dist(px2, py2, cx2, cy2) });
  }
  out.sort((a, b) => a.d - b.d);
  return out.slice(0, 24);
}

function syncVillagers() {
  const homes = buildings.filter(b => BLD[b.key].pop);
  const want = Math.min(pop, homes.length * 3, 26);
  while (villagers.length > want) villagers.pop();
  while (villagers.length < want && homes.length) {
    const h = homes[villagers.length % homes.length];
    const hx = bldCX(h), hy = bldCY(h) + 40;
    villagers.push({ x: hx + rnd(-40, 40), y: hy + rnd(-10, 40), hx, hy,
      name: NAMES[(villagers.length * 7 + 3) % NAMES.length], hue: (villagers.length * 47) % 360,
      ph: rnd(0, TAU), waveT: 0, heartT: 0, tx2: hx, ty2: hy, wanderT: rnd(0, 3) });
  }
}
function syncChickens() {
  const coops = buildings.filter(b => b.key === 'coop' || b.key === 'nuggetfort');
  const want = Math.min(coops.length * 2 + (cnt('nuggetfort') ? 2 : 0), 14);
  while (chickens.length > want) chickens.pop();
  while (chickens.length < want && coops.length) {
    const cp = coops[chickens.length % coops.length];
    const hx = bldCX(cp), hy = bldCY(cp) + 44;
    chickens.push({ x: hx + rnd(-30, 30), y: hy + rnd(0, 30), hx, hy, ph: rnd(0, TAU),
      peckT: 0, heartT: 0, tx2: hx, ty2: hy, wanderT: rnd(0, 2), hue: rnd(0, 1) });
  }
}

/* ═══════════ ECONOMY + SYSTEMS ═══════════ */
let popTimer = 0, saveTimer = 0, hudDirty = true;
function gain(k, n, x, y) {
  const before = life[k];
  res[k] += n; life[k] += n;
  if (x !== undefined) floatText(x, y, '+' + n + ' ' + RESDEF[k].ico);
  if (before === 0 && life[k] > 0) hudDirty = true;
  bumpChip(k);
}
function canAfford(cost) { return Object.entries(cost).every(([k, v]) => res[k] >= v); }
function pay(cost) { for (const [k, v] of Object.entries(cost)) res[k] -= v; hudDirty = true; }
function costStr(cost) {
  return Object.entries(cost).map(([k, v]) =>
    `<span class="${res[k] >= v ? '' : 'no'}">${v} ${RESDEF[k].ico}</span>`).join(' ');
}
function popCap() { return buildings.reduce((s, b) => s + (BLD[b.key].pop || 0), 0); }

function tickEconomy(dt) {
  for (const b of buildings) {
    const d = BLD[b.key];
    b.active = true;
    if (d.cons) {
      const ok = Object.entries(d.cons).every(([k, v]) => res[k] >= v * dt);
      if (!ok) { b.active = false; continue; }
      for (const [k, v] of Object.entries(d.cons)) res[k] -= v * dt;
    }
    if (d.prod) for (const [k, v] of Object.entries(d.prod)) {
      const before = life[k];
      res[k] += v * dt; life[k] += v * dt;
      if (before === 0) hudDirty = true;
    }
  }
  popTimer += dt;
  if (popTimer > 3) {
    popTimer = 0;
    if (pop < popCap() && res.food >= 1) {
      res.food -= 1; pop++;
      syncVillagers(); hudDirty = true;
      const homes = buildings.filter(b => BLD[b.key].pop);
      if (homes.length) {
        const h = pick(homes);
        puff(bldCX(h), bldCY(h) - 20, 6, 'spark', 55);
        floatText(bldCX(h), bldCY(h) - 50, '+1 👋');
      }
    }
  }
  res.food = Math.max(0, res.food - pop * .012 * dt);   // villagers nibble (never starve)
}

/* goal engine + age-ups */
function setAge(n) {
  age = n;
  for (const [key, r] of Object.entries(REGIONS)) if (r.age === n) fogAnim[key] = 1;
  banner('AGE ' + n + ' — ' + AGES[n].name + '!', AGES[n].sub);

}
function refreshOutfit() {}    // avatar reads `age` directly; hook kept for future
function tickGoals() {

/* royal chests drop from the sky on a little balloon */
function spawnCrate(idx) {
  let x = player.x + rnd(-100, 100), y = player.y + rnd(-60, 60);
  let guard = 0;
  while (blocked(x, y) && guard++ < 20) { x = player.x + rnd(-140, 140); y = player.y + rnd(-100, 100); }
  crates.push({ x, y, dropY: -160, t: 0, idx, landed: false });
}
function openCrate(c) {
  crates.splice(crates.indexOf(c), 1);
  cratesOpened++;
  SFX.crate(); confetti(c.x, c.y, 30);
  if (HAT_CRATES[c.idx] !== undefined && !hats.includes(HAT_CRATES[c.idx])) {
    const h = HAT_CRATES[c.idx];
    hats.push(h); hatWorn = h;
    toast('🎩 NEW HAT: ' + HATS[h].name + '!', 'gold');
    SFX.ageUp();
  } else {
    const loot = {};
    const options = RES_KEYS.filter(k => life[k] > 0 || k === 'wood' || k === 'food');
    for (let i = 0; i < 2 + (Math.random() * 2 | 0); i++) {
      const k = pick(options);
      loot[k] = (loot[k] || 0) + [12, 10, 8, 5, 6, 4, 2][RES_KEYS.indexOf(k)];
    }
    let dy = 0;
    for (const [k, v] of Object.entries(loot)) { gain(k, v); floatText(c.x, c.y - 20 - dy, '+' + v + ' ' + RESDEF[k].ico); dy += 26; }
  }
}

/* region discovery */
function tickRegions() {

/* ═══════════ SAVE / LOAD ═══════════ */
const SAVE_KEY = 'castleforge-save-v1';
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, res, life, age, pop, goalI, cratesOpened, woodChopped, greeted, chickensPetted,
      cheers, piesFired, wizardMet, dragonFound, dragonFriend, starTouched, beaconLit,
      hats, hatWorn, visitedRegions, playT,
      px: player.x, py: player.y,
      buildings: buildings.filter(b => b.key !== 'campfire').map(b => ({ k: b.key, x: b.tx, y: b.ty })),
    }));
  } catch (e) {}
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return false;
    res = { ...res, ...d.res }; life = { ...life, ...d.life };
    age = d.age; pop = d.pop; goalI = d.goalI; cratesOpened = d.cratesOpened;
    woodChopped = d.woodChopped; greeted = d.greeted; chickensPetted = d.chickensPetted || 0;
    cheers = d.cheers || 0; piesFired = d.piesFired || 0;
    wizardMet = d.wizardMet; dragonFound = d.dragonFound; dragonFriend = d.dragonFriend;
    starTouched = d.starTouched; beaconLit = d.beaconLit;
    hats = d.hats || []; hatWorn = d.hatWorn ?? -1;
    visitedRegions = d.visitedRegions || { meadow: true };
    playT = d.playT || 0;
    player.x = d.px; player.y = d.py;
    for (const bd of d.buildings) {
      if (!BLD[bd.k]) continue;
      /* clear any objects that regrew into the footprint */
      const sz = BLD[bd.k].sz;
      objects = objects.filter(o => !(o.x > bd.x * TILE - 20 && o.x < (bd.x + sz) * TILE + 20 &&
                                      o.y > bd.y * TILE - 20 && o.y < (bd.y + sz) * TILE + 20));
      placeBuildingAt(bd.k, bd.x, bd.y);
    }
    if (dragonFound) dragon.found = true;
    if (dragonFriend) { dragon.mode = 'follow'; dragon.x = player.x + 80; dragon.y = player.y - 60; }
    syncVillagers(); syncChickens();
    return true;
  } catch (e) { return false; }
}
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ═══════════ INPUT ═══════════ */
const keys = {};
let joy = { on: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
let placing = null;                 // {key, cands, sel}
let panelMode = null;

function inputVec() {
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  if (joy.on) { dx += joy.dx; dy += joy.dy; }
  if (PADS) for (const pd of PADS) if (pd && pd.connected) {
    const lx = pd.axis('lx'), ly = pd.axis('ly');
    if (Math.abs(lx) > .18) dx += lx;
    if (Math.abs(ly) > .18) dy += ly;
  }
  const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  return [dx, dy];
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.code] = true;
  ensureAudio();
  document.body.classList.add('input-kb'); document.body.classList.remove('input-touch');
  const map = { KeyX: 'south', Space: 'south', KeyZ: 'east', Escape: 'east', KeyC: 'west', KeyB: 'west',
                KeyV: 'north', Enter: 'south', KeyM: 'mute', KeyP: 'start',
                ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (map[e.code]) onBtn(map[e.code]);
  if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* gamepads — guarded; the arcade shell hosts controller.js */
const AC = window.ArcadeController || null;
const PADS = AC ? [AC.pad(0), AC.pad(1)] : null;
if (AC) AC.on('press', e => { if (e.padIndex > 1) return; ensureAudio(); onBtn(e.button); });

/* touch: left-half joystick + DOM buttons */
function touchStart(ev) {
  ensureAudio();
  document.body.classList.add('input-touch'); document.body.classList.remove('input-kb');
  for (const t of ev.changedTouches) {
    if (t.clientX < VW * .45 && !joy.on) {
      joy.on = true; joy.id = t.identifier; joy.cx = t.clientX; joy.cy = t.clientY; joy.dx = joy.dy = 0;
      styleJoy(t.clientX, t.clientY, t.clientX, t.clientY);
    }
  }
}
function touchMove(ev) {
  for (const t of ev.changedTouches) if (joy.on && t.identifier === joy.id) {
    let dx = (t.clientX - joy.cx) / 46, dy = (t.clientY - joy.cy) / 46;
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    joy.dx = dx; joy.dy = dy;
    styleJoy(joy.cx, joy.cy, joy.cx + dx * 46, joy.cy + dy * 46);
  }
  ev.preventDefault();
}
function touchEnd(ev) {
  for (const t of ev.changedTouches) if (joy.on && t.identifier === joy.id) {
    joy.on = false; joy.dx = joy.dy = 0;
    document.getElementById('joyBase').style.opacity = document.getElementById('joyKnob').style.opacity = '';
  }
}
function styleJoy(bx, by, kx, ky) {
  const base = document.getElementById('joyBase'), knob = document.getElementById('joyKnob');
  base.style.left = (bx - 64) + 'px'; base.style.top = (by - 64) + 'px'; base.style.bottom = 'auto'; base.style.opacity = 1;
  knob.style.left = (kx - 28) + 'px'; knob.style.top = (ky - 28) + 'px'; knob.style.bottom = 'auto'; knob.style.opacity = 1;
}
canvas.addEventListener('touchstart', touchStart, { passive: true });
canvas.addEventListener('touchmove', touchMove, { passive: false });
canvas.addEventListener('touchend', touchEnd);
canvas.addEventListener('touchcancel', touchEnd);
function bindTb(id, b) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', ev => { ev.preventDefault(); ensureAudio(); onBtn(b); }, { passive: false });
  el.addEventListener('mousedown', ev => { ev.preventDefault(); onBtn(b); });
}
bindTb('tbA', 'south'); bindTb('tbB', 'west'); bindTb('tbStats', 'north');

function onBtn(b) {
  if (b === 'mute') { muted = !muted; toast(muted ? '🔇 SOUND OFF' : '🔊 SOUND ON'); return; }
  if (scene === 'title') { titleBtn(b); return; }
  if (scene === 'finale') return;
  if (panelMode) { panelBtn(b); return; }
  if (placing) { placeBtn(b); return; }
  if (b === 'south') interact();
  else if (b === 'west') openBuildMenu();
  else if (b === 'north') openStats();
  else if (b === 'start' || b === 'east') openPause();
}

/* ═══════════ INTERACTION (X) — nearest thing wins ═══════════ */
function interact() {
  const px = player.x, py = player.y;
  /* chests first */
  for (const c of crates) if (c.landed && dist(px, py, c.x, c.y) < 80) { openCrate(c); return; }
  /* the wizard */
  if (dist(px, py, POI.wizard.x, POI.wizard.y) < 90) {
    if (!wizardMet) {
      wizardMet = true;
      banner('WIZZO THE WIZARD!', '"Ooh! A visitor! Build me a tower, will you?"');
      SFX.magic(); confetti(POI.wizard.x, POI.wizard.y - 40, 20);
    } else {
      const lines = ['"Sparkles are 30% of my diet."', '"My beard is full of secrets. And crumbs."',
        '"The star misses the sky, you know."', '"Abraca-HELLO!"', '"I once turned a turnip into a slightly better turnip."'];
      floatText(POI.wizard.x, POI.wizard.y - 70, pick(lines), '#c9a3ff');
      SFX.magic();
    }
    return;
  }
  /* the dragon */
  if (dragon.found && dragon.mode === 'sleep' && dist(px, py, dragon.x, dragon.y) < 160) {
    if (res.food >= 20) {
      res.food -= 20; hudDirty = true;
      dragonFriend = true; dragon.mode = 'follow';
      banner('SPARKY JOINED YOU!', 'Your enormous best friend forever! 🐉');
      SFX.roar(); SFX.ageUp(); confetti(dragon.x, dragon.y - 40, 40); shake = 8;
      heart(dragon.x, dragon.y - 60);
    } else { floatText(dragon.x, dragon.y - 90, 'SPARKY WANTS 20 🍞!', '#ffca6e'); SFX.bloop(); }
    return;
  }
  if (dragon.mode !== 'sleep' && dist(px, py, dragon.x, dragon.y) < 110) {
    heart(dragon.x, dragon.y - 70); SFX.roar();
    floatText(dragon.x, dragon.y - 100, pick(['RAWRRR! (that means hi)', 'SPARKY LOVES YOU', '*happy dragon noises*']), '#ffca6e');
    return;
  }
  /* the fallen star */
  if (starTouched === false && dist(px, py, POI.star.x, POI.star.y) < 110) { tickRegions(); return; }
  /* chickens!! */
  for (const ch of chickens) if (dist(px, py, ch.x, ch.y) < 55) {
    ch.heartT = 1.2; chickensPetted++;
    heart(ch.x, ch.y - 20); SFX.cluck();
    floatText(ch.x, ch.y - 36, pick(['BAWK!', 'CLUCK!', '♪ bok bok ♪', 'SO SOFT']), '#fff');
    return;
  }
  /* villagers */
  for (const r of villagers) if (dist(px, py, r.x, r.y) < 65) {
    r.heartT = 1.2; r.waveT = 1.2; greeted++;
    heart(r.x, r.y - 34); SFX.hi(); floatText(r.x, r.y - 52, 'HI ' + r.name + '!');
    return;
  }
  /* interactive buildings */
  for (const b of buildings) {
    const d = BLD[b.key]; if (!d.interact) continue;
    const bx = bldCX(b), by = bldCY(b);
    if (dist(px, py, bx, by) > 70 + d.sz * 30) continue;
    if (d.interact === 'joust') {
      cheers++;
      SFX.clang(); SFX.fanfare(); confetti(bx, by - 30, 18);
      floatText(bx, by - 60, pick(['HUZZAH!', 'GOOD SHOW!', 'CLANG!', 'FOR THE KINGDOM!']), '#ffe9a3');
      return;
    }
    if (d.interact === 'pie') {
      if (res.food >= 1) {
        res.food--; piesFired++; hudDirty = true;
        SFX.pop(); shake = 3;
        pies.push({ x: bx, y: by - 20, vx: rnd(-1, 1) * 260, vy: rnd(-340, -240), life: 0 });
      } else { floatText(bx, by - 50, 'NEED 1 🍞!', '#ff9f9f'); SFX.deny(); }
      return;
    }
    if (d.interact === 'beacon') {
      if (!beaconLit) startFinale();
      return;
    }
  }
  /* harvest objects */
  let best = null, bd = 78;
  for (const o of objects) {
    if (o.dead || !OBJ_DEF[o.kind].res) continue;
    const d2 = dist(px, py, o.x, o.y - 10);
    if (d2 < bd) { bd = d2; best = o; }
  }
  if (best) { harvest(best); return; }
  SFX.blip();
}

function harvest(o) {
  const d = OBJ_DEF[o.kind];
  o.hp--;
  gain(d.res, d.n, o.x, o.y - 44);
  if (d.res === 'wood') woodChopped += d.n;
  if (d.bonus && Math.random() < .5) gain(d.bonus, 1, o.x, o.y - 70);
  o.ph = Math.random() * TAU;
  o.shakeT = .3;
  if (o.kind === 'oak' || o.kind === 'pine' || o.kind === 'sparkletree') { SFX.chop(); leafBurst(o.x, o.y - 40, 5, o.kind === 'sparkletree' ? 300 : undefined); }
  else { SFX.chop(); puff(o.x, o.y - 10, 5, 'spark', o.kind === 'crystal' ? 280 : o.kind === 'shard' ? 55 : 210); }
  if (o.hp <= 0) { o.dead = 1; o.respawn = rnd(25, 45); SFX.pop(); puff(o.x, o.y - 10, 8, 'spark', 100); }
}

/* ═══════════ BUILD PLACEMENT ═══════════ */
function startPlacing(key) {
  const cands = freeTilesNear(player.x, player.y, BLD[key].sz);
  if (!cands.length) { toast('NO ROOM HERE — FIND OPEN GRASS!'); SFX.deny(); return; }
  placing = { key, cands, sel: 0 };
  closePanel();
  toast('◀ ▶ ▲ ▼ PICK A SPOT · X BUILD · Z CANCEL');
}
function placeBtn(b) {
  if (b === 'left' || b === 'right' || b === 'up' || b === 'down') {
    /* move selection to nearest candidate in that direction */
    const cur = placing.cands[placing.sel];
    const dir = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[b];
    let bi = -1, bs = 1e9;
    for (let i = 0; i < placing.cands.length; i++) {
      if (i === placing.sel) continue;
      const c = placing.cands[i];
      const ddx = c.x - cur.x, ddy = c.y - cur.y;
      const dot = ddx * dir[0] + ddy * dir[1];
      if (dot <= 0) continue;
      const score = dot + Math.abs(ddx * dir[1]) * 2 + Math.abs(ddy * dir[0]) * 2;
      if (score < bs) { bs = score; bi = i; }
    }
    if (bi >= 0) { placing.sel = bi; SFX.ui(); }
  }
  else if (b === 'south') {
    const c = placing.cands[placing.sel], d = BLD[placing.key];
    if (!canAfford(d.cost)) { SFX.deny(); toast('NOT ENOUGH STUFF YET!'); placing = null; return; }
    if (!tilesFree(c.tx, c.ty, d.sz)) { SFX.deny(); placing = null; return; }
    pay(d.cost);
    const nb = placeBuildingAt(placing.key, c.tx, c.ty);
    nb.t = 0;
    SFX.build(); puff(c.x, c.y, 14, 'spark', 45); confetti(c.x, c.y - 20, 10);
    if (d.pop) syncVillagers();
    if (d.chickens || placing.key === 'nuggetfort') syncChickens();
    if (placing.key === 'perch' && dragon.mode === 'follow') { /* Sparky will nap there sometimes */ }
    placing = null; hudDirty = true;
    save();
  }
  else if (b === 'east' || b === 'west') { placing = null; SFX.ui(); }
}

    const item = document.createElement('div');
    item.className = 'bItem' + (afford ? '' : ' cant');
    item.innerHTML = `<canvas width="104" height="104" data-bld="${key}"></canvas>
      <div><div class="bt">${d.name}</div><div class="bd">${d.desc}</div></div>
      <div class="bc">${costStr(d.cost)}${d.pop ? '<br>🧑‍🌾 +' + d.pop : ''}${coopsShort ? '<br>🐔 ' + cnt('coop') + '/' + d.needCoops + ' COOPS' : ''}</div>`;
    item.addEventListener('click', () => {
      if (d.needCoops && cnt('coop') < d.needCoops) { SFX.deny(); toast('NEEDS ' + d.needCoops + ' CHICKEN COOPS FIRST!'); return; }
      if (!canAfford(d.cost)) { SFX.deny(); toast('NOT ENOUGH STUFF YET!'); return; }
      startPlacing(key);
    });
    panelEl.appendChild(item);
    panelItems.push(item);
  }
  if (age < 7) {
    const locked = BLD_KEYS.filter(k => BLD[k].age === age + 1).length;
    if (locked) {
      const note = document.createElement('div');
      note.className = 'psub';
      note.style.marginTop = '6px';
      note.textContent = '🔒 ' + locked + ' more unlock in the ' + AGES[age + 1].name + '!';
      panelEl.appendChild(note);
    }
  }
  hilite();
  panelWrap.classList.add('show');
  requestAnimationFrame(drawMenuIcons);
}

function resetState() {
  res = { wood: 0, food: 0, stone: 0, iron: 0, gold: 0, magic: 0, star: 0 };
  life = { ...res };
  buildings = []; occ = new Map(); villagers = []; chickens = []; crates = []; particles = []; pies = [];
  age = 1; pop = 0; goalI = 0;
  cratesOpened = 0; woodChopped = 0; greeted = 0; chickensPetted = 0; cheers = 0; piesFired = 0;
  wizardMet = dragonFound = dragonFriend = starTouched = beaconLit = false;
  hats = []; hatWorn = -1;
  visitedRegions = { meadow: true };
  playT = 0; placing = null; panelMode = null; fogAnim = {};
  dragon.found = false; dragon.mode = 'sleep'; dragon.x = POI.cave.x; dragon.y = POI.cave.y;
  player.x = WORLD / 2 - 60; player.y = WORLD / 2 + 60; player.vx = player.vy = 0;
  cam.x = player.x; cam.y = player.y;

/* ═══════════ UPDATE ═══════════ */
let fin = null;    // finale cinematic state
function startFinale() {
  if (fin) return;
  scene = 'finale';
  closePanel(); placing = null;
  const bcn = buildings.find(b => b.key === 'beacon');
  fin = { t: 0, bx: bldCX(bcn), by: bldCY(bcn), starX: POI.star.x, starY: POI.star.y, starS: 1, night: 0, fwT: 0 };
  SFX.rumble();
}

function update(dt) {
  playT += dt;
  ambientTick(dt);

  if (scene === 'finale') { updateFinale(dt); updateParticles(dt); return; }

  /* ── player walk ── */
  const frozen = panelMode !== null;
  const [ix, iy] = frozen ? [0, 0] : inputVec();
  const SPD = 230;
  const nvx = ix * SPD, nvy = iy * SPD;
  player.vx = lerp(player.vx, nvx, 1 - Math.pow(.0001, dt));
  player.vy = lerp(player.vy, nvy, 1 - Math.pow(.0001, dt));
  const nx = player.x + player.vx * dt, ny = player.y + player.vy * dt;
  /* escape hatch: if somehow inside something solid, let them walk right out */
  const stuck = blocked(player.x, player.y);
  if (stuck || !blocked(nx, player.y)) player.x = nx; else player.vx = 0;
  if (stuck || !blocked(player.x, ny)) player.y = ny; else player.vy = 0;
  player.moving = Math.hypot(player.vx, player.vy) > 30;
  if (Math.abs(player.vx) > 20) player.face = player.vx > 0 ? 1 : -1;
  player.walkT += dt * (player.moving ? 1.6 : .4);
  /* footstep dust */
  bubbleT -= dt;
  if (bubbleT <= 0 && player.moving) {
    bubbleT = .22;
    particles.push({ x: player.x + rnd(-6, 6), y: player.y + 12, vx: rnd(-10, 10), vy: rnd(-16, -6),
      life: 0, maxlife: .5, kind: 'dust', size: rnd(2, 4), hue: 0 });
  }

  /* camera */
  const k = 1 - Math.pow(.002, dt);
  cam.x = clamp(lerp(cam.x, player.x, k), VW / 2 / SCALE, WORLD - VW / 2 / SCALE);
  cam.y = clamp(lerp(cam.y, player.y, k), VH / 2 / SCALE, WORLD - VH / 2 / SCALE);
  shake = Math.max(0, shake - dt * 14);

  if (!frozen) tickRegions();
  tickEconomy(dt);
  if (GOALS[goalI] && GOALS[goalI].live) updateGoalUI();
  tickGoals();
  for (const b of buildings) b.t += dt;
  for (const [key, v] of Object.entries(fogAnim)) {
    fogAnim[key] = v - dt * .35;
    if (fogAnim[key] <= 0) delete fogAnim[key];
  }

  /* ── chests parachute in ── */
  for (const c of crates) {
    c.t += dt;
    if (!c.landed) {
      const fall = Math.min(1, c.t / 1.6);
      const ease = 1 - Math.pow(1 - fall, 2);
      c.curY = c.y - (1 - ease) * 260;
      c.swayX = Math.sin(c.t * 3) * (1 - fall) * 14;
      if (fall >= 1) { c.landed = true; puff(c.x, c.y, 8, 'dust'); SFX.bloop(); }
    }
  }

  /* ── object respawn ── */
  for (const o of objects) {
    if (o.shakeT) o.shakeT = Math.max(0, o.shakeT - dt);
    if (o.dead) {
      o.respawn -= dt;
      if (o.respawn <= 0 && dist(o.x, o.y, player.x, player.y) > 200) {
        /* don't regrow under buildings */
        const tx = o.x / TILE | 0, ty = o.y / TILE | 0;
        if (!occ.has(tkey(tx, ty))) { o.dead = 0; o.hp = o.maxhp; puff(o.x, o.y - 10, 6, 'leaf', 110); }
        else o.respawn = 999;
      }
    }
  }

  /* ── villagers wander near home ── */
  for (const r of villagers) {
    r.ph += dt;
    r.wanderT -= dt;
    if (r.wanderT <= 0) {
      r.wanderT = rnd(2, 5);
      r.tx2 = r.hx + rnd(-70, 70); r.ty2 = r.hy + rnd(-40, 70);
    }
    r.x = lerp(r.x, r.tx2, 1 - Math.pow(.5, dt));
    r.y = lerp(r.y, r.ty2, 1 - Math.pow(.5, dt));
    r.waveT = Math.max(0, r.waveT - dt); r.heartT = Math.max(0, r.heartT - dt);
    if (r.waveT === 0 && dist(player.x, player.y, r.x, r.y) < 110 && Math.random() < dt * .5) r.waveT = 1;
  }
  /* ── chickens peck about ── */
  for (const ch of chickens) {
    ch.ph += dt;
    ch.wanderT -= dt;
    if (ch.wanderT <= 0) {
      ch.wanderT = rnd(1.5, 4);
      ch.tx2 = ch.hx + rnd(-60, 60); ch.ty2 = ch.hy + rnd(-30, 60);
      ch.peckT = rnd(0, 1) < .5 ? .8 : 0;
    }
    ch.x = lerp(ch.x, ch.tx2, 1 - Math.pow(.4, dt));
    ch.y = lerp(ch.y, ch.ty2, 1 - Math.pow(.4, dt));
    ch.peckT = Math.max(0, ch.peckT - dt); ch.heartT = Math.max(0, ch.heartT - dt);
  }

  /* ── Sparky the dragon ── */
  dragon.ph += dt;
  if (dragon.mode === 'sleep') {
    if (dragon.found && Math.random() < dt * .5)
      particles.push({ x: dragon.x + 60, y: dragon.y - 20, vx: 10, vy: -24, life: 0, maxlife: 1.6, kind: 'zz', size: 12, hue: 0 });
    if (Math.random() < dt * .3)
      particles.push({ x: dragon.x + 70, y: dragon.y - 6, vx: rnd(6, 18), vy: rnd(-30, -14), life: 0, maxlife: 1, kind: 'smoke', size: rnd(4, 8), hue: 0 });
  } else {
    dragon.flap += dt * 5;
    const tx = player.x - player.face * 90, ty = player.y - 80 + Math.sin(dragon.ph * 1.8) * 14;
    dragon.vx = lerp(dragon.vx, (tx - dragon.x) * 2.4, 1 - Math.pow(.01, dt));
    dragon.vy = lerp(dragon.vy, (ty - dragon.y) * 2.4, 1 - Math.pow(.01, dt));
    dragon.x += dragon.vx * dt; dragon.y += dragon.vy * dt;
    if (Math.random() < dt * .6)
      particles.push({ x: dragon.x + rnd(-20, 20), y: dragon.y + 10, vx: rnd(-8, 8), vy: rnd(10, 26), life: 0, maxlife: .8, kind: 'spark', size: rnd(2, 4), hue: rnd(20, 50) });
  }

  /* ── flying pies ── */
  for (let i = pies.length - 1; i >= 0; i--) {
    const p = pies[i];
    p.life += dt;
    p.vy += 420 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vy > 0 && p.life > .8) {
      puff(p.x, p.y, 10, 'spark', 45); heart(p.x, p.y - 10);
      floatText(p.x, p.y - 20, pick(['SPLAT!', 'PIE!!', 'DELICIOUS!']), '#ffd85e');
      SFX.pop();
      for (const r of villagers) if (dist(p.x, p.y, r.x, r.y) < 90) { r.heartT = 1.2; r.waveT = 1; }
      pies.splice(i, 1);
    }
  }

  /* ── regional ambience ── */
  const reg = regionAt(cam.x, cam.y);
  if (Math.random() < dt * 3) {
    const ax = cam.x + rnd(-VW, VW) / 2 / SCALE, ay = cam.y + rnd(-VH, VH) / 2 / SCALE;
    const areg = regionAt(ax, ay);
    if (areg === 'forest') particles.push({ x: ax, y: ay, vx: rnd(-14, 14), vy: rnd(8, 22), life: 0, maxlife: rnd(1.5, 3), kind: 'leaf', size: rnd(3, 5), hue: rnd(80, 140) });
    else if (areg === 'glade') particles.push({ x: ax, y: ay, vx: rnd(-8, 8), vy: rnd(-14, -4), life: 0, maxlife: rnd(1, 2.4), kind: 'spark', size: rnd(1.5, 3), hue: rnd(260, 320) });
    else if (areg === 'peaks') particles.push({ x: ax, y: ay, vx: rnd(-10, 10), vy: rnd(14, 30), life: 0, maxlife: rnd(1.5, 3), kind: 'snow', size: rnd(2, 4), hue: 0 });
    else if (areg === 'crater') particles.push({ x: ax, y: ay, vx: rnd(-6, 6), vy: rnd(-18, -8), life: 0, maxlife: rnd(1, 2), kind: 'spark', size: rnd(1.5, 3), hue: rnd(40, 70) });
    else if (Math.random() < .3) particles.push({ x: ax, y: ay, vx: rnd(-16, 16), vy: rnd(-6, 6), life: 0, maxlife: rnd(2, 4), kind: 'butterfly', size: rnd(3, 4.5), hue: rnd(0, 360) });
  }

  updateParticles(dt);

  saveTimer += dt;
  if (saveTimer > 6) { saveTimer = 0; save(); }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life > p.maxlife) { particles.splice(i, 1); continue; }
    if (p.kind === 'confetti') p.vy += 160 * dt;
    if (p.kind === 'heart') p.vy -= 10 * dt;
    if (p.kind === 'leaf') { p.vx += Math.sin(p.life * 4 + p.size) * 30 * dt; }
    if (p.kind === 'butterfly') { p.vx += Math.sin(p.life * 6) * 60 * dt; p.vy += Math.cos(p.life * 5) * 60 * dt; }
    if (p.kind === 'smoke') { p.vy -= 10 * dt; p.size += 3 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  if (particles.length > 400) particles.splice(0, particles.length - 400);
}

/* ── finale: the star goes home ── */
function updateFinale(dt) {
  fin.t += dt;
  /* night falls */
  fin.night = clamp(fin.t / 2.5, 0, .88);
  if (fin.t > 2 && fin.t < 8) {
    /* star glides to the beacon */
    const t = clamp((fin.t - 2) / 3, 0, 1), e = t * t * (3 - 2 * t);
    fin.starX = lerp(POI.star.x, fin.bx, e);
    fin.starY = lerp(POI.star.y, fin.by - 60, e);
    if (t >= 1 && !fin.beamOn) { fin.beamOn = true; SFX.magic(); SFX.rumble(); shake = 6; }
  }
  if (fin.t > 5.5) {
    /* and rises — it shrinks into the sky */
    fin.starS = Math.max(.12, fin.starS - dt * .22);
    fin.starY -= dt * 30;
    if (Math.random() < dt * 20)
      particles.push({ x: fin.starX + rnd(-14, 14), y: fin.starY + 14, vx: rnd(-16, 16), vy: rnd(20, 60),
        life: 0, maxlife: rnd(.5, 1.2), kind: 'spark', size: rnd(2, 4), hue: rnd(45, 60) });
  }
  /* fireworks! */
  if (fin.t > 7.5 && fin.t < 14) {
    fin.fwT -= dt;
    if (fin.fwT <= 0) {
      fin.fwT = rnd(.35, .8);
      const fx = cam.x + rnd(-400, 400), fy = cam.y + rnd(-320, -80);
      const hue = rnd(0, 360);
      for (let i = 0; i < 26; i++) {
        const a = rnd(0, TAU), sp2 = rnd(40, 190);
        particles.push({ x: fx, y: fy, vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2, life: 0,
          maxlife: rnd(.8, 1.6), kind: 'confetti', size: rnd(2.5, 5), hue });
      }
      SFX.pop();
    }
  }
  if (fin.t > 9 && !fin.banner1) { fin.banner1 = true; banner('THE STAR IS HOME!', 'Look at it twinkle up there! ⭐'); SFX.fanfare(); }
  if (fin.t > 13 && !fin.banner2) { fin.banner2 = true; banner('YOU LIT UP THE KINGDOM!', '🏰 TO BE CONTINUED… 🏰'); SFX.ageUp(); }
  /* dawn returns */
  if (fin.t > 14) fin.night = Math.max(0, fin.night - dt * .3);
  if (fin.t > 17.5) {
    beaconLit = true;
    fin = null;
    scene = 'play';
    tickGoals(); save();
    setTimeout(() => toast('FREE PLAY — THE KINGDOM IS YOURS! 👑', 'gold'), 1200);
  }
}

/* ═══════════ RENDER — ground layer ═══════════ */
let now = 0;

function viewRange() {
  const halfW = VW / 2 / SCALE + 90, halfH = VH / 2 / SCALE + 110;
  return { x0: cam.x - halfW, x1: cam.x + halfW, y0: cam.y - halfH, y1: cam.y + halfH };
}

function drawGround(v) {
  const tx0 = Math.max(0, v.x0 / TILE | 0), tx1 = Math.min(WT - 1, v.x1 / TILE | 0);
  const ty0 = Math.max(0, v.y0 / TILE | 0), ty1 = Math.min(WT - 1, v.y1 / TILE | 0);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const x = tx * TILE, y = ty * TILE;
    const cx2 = x + TILE / 2, cy2 = y + TILE / 2;
    const regKey = regionAt(cx2, cy2);
    const h = hash2(tx, ty);
    ctx.fillStyle = shade(REGIONS[regKey].ground, (h - .5) * .07);
    ctx.fillRect(x, y, TILE + 1, TILE + 1);
    /* scalloped blend where two lands meet */
    const regR = regionAt(cx2 + TILE, cy2), regD = regionAt(cx2, cy2 + TILE);
    if (regR !== regKey) {
      ctx.fillStyle = shade(REGIONS[regR].ground, (h - .5) * .07);
      for (let i = 0; i < 3; i++) {
        const hh = hash2(tx * 5 + i, ty * 9 + i);
        ctx.beginPath(); ctx.arc(x + TILE, y + 10 + i * 22 + hh * 8, 7 + hh * 9, 0, TAU); ctx.fill();
      }
    }
    if (regD !== regKey) {
      ctx.fillStyle = shade(REGIONS[regD].ground, (h - .5) * .07);
      for (let i = 0; i < 3; i++) {
        const hh = hash2(tx * 9 + i, ty * 5 + i);
        ctx.beginPath(); ctx.arc(x + 10 + i * 22 + hh * 8, y + TILE, 7 + hh * 9, 0, TAU); ctx.fill();
      }
    }
    /* micro decoration (deterministic, cheap) */
    const h2 = hash2(tx * 3 + 1, ty * 5 + 2);
    if (regKey === 'meadow' || regKey === 'farm') {
      if (h2 < .16) {                                       // flowers
        ctx.fillStyle = ['#ffe9a3', '#ff9db8', '#fff', '#ffb35c'][h * 4 | 0];
        ctx.beginPath(); ctx.arc(x + 10 + h * 44, y + 10 + h2 * 260 % 44, 2.5, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(60,120,40,.5)';
        ctx.fillRect(x + 9 + h * 44, y + 13 + h2 * 260 % 44, 1.5, 4);
      } else if (h2 < .4) {                                 // grass tufts
        ctx.strokeStyle = 'rgba(48,110,40,.4)'; ctx.lineWidth = 1.5;
        const gx = x + 8 + h * 46, gy = y + 8 + (h2 * 200 % 46);
        ctx.beginPath();
        ctx.moveTo(gx, gy + 5); ctx.lineTo(gx + 1, gy);
        ctx.moveTo(gx + 4, gy + 5); ctx.lineTo(gx + 5.5, gy + 1);
        ctx.stroke();
      }
    } else if (regKey === 'forest' && h2 < .2) {            // mushrooms + moss
      if (h2 < .08) {
        ctx.fillStyle = '#d1543f';
        ctx.beginPath(); ctx.arc(x + 14 + h * 36, y + 16 + h2 * 500 % 36, 3, Math.PI, TAU); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(30,80,36,.35)';
        ctx.beginPath(); ctx.arc(x + 12 + h * 40, y + 12 + h2 * 300 % 40, 5 + h * 5, 0, TAU); ctx.fill();
      }
    } else if (regKey === 'hills' && h2 < .22) {            // pebbles
      ctx.fillStyle = 'rgba(70,72,58,.4)';
      ctx.beginPath(); ctx.arc(x + 12 + h * 40, y + 12 + h2 * 260 % 40, 2.5 + h * 2.5, 0, TAU); ctx.fill();
    } else if (regKey === 'glade' && h2 < .14) {            // sparkle motes
      const p = .5 + Math.sin(now * 2 + h * 20) * .5;
      ctx.fillStyle = `rgba(190,240,255,${.25 + p * .35})`;
      ctx.beginPath(); ctx.arc(x + 10 + h * 44, y + 10 + h2 * 400 % 44, 1.8 + p, 0, TAU); ctx.fill();
    } else if (regKey === 'peaks' && h2 < .3) {             // snow patches
      ctx.fillStyle = 'rgba(240,246,255,.5)';
      ctx.beginPath(); ctx.ellipse(x + 16 + h * 32, y + 16 + h2 * 180 % 32, 9 + h * 8, 5 + h * 4, 0, 0, TAU); ctx.fill();
    } else if (regKey === 'crater' && h2 < .18) {           // ash cracks aglow
      ctx.strokeStyle = `rgba(255,200,90,${.15 + Math.sin(now * 1.5 + h * 12) * .1 + .1})`;
      ctx.lineWidth = 1.5;
      const gx = x + 8 + h * 44, gy = y + 8 + h2 * 300 % 44;
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + 8, gy + 3); ctx.lineTo(gx + 13, gy + 9); ctx.stroke();
    }
  }
  /* crater rim */
  if (v.x0 < 1300 && v.y0 < 1300) {
    ctx.strokeStyle = 'rgba(40,28,56,.55)'; ctx.lineWidth = 26;
    ctx.beginPath(); ctx.arc(640, 640, 508, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,90,150,.3)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(640, 640, 494, 0, TAU); ctx.stroke();
  }
}

/* the river + bridge */
function drawRiver(v) {
  if (v.x1 < RIVER_X - 160 || v.x0 > RIVER_X + 160) return;
  const y0 = Math.max(0, v.y0), y1 = Math.min(WORLD, v.y1);
  /* banks */
  ctx.fillStyle = '#c9b070';
  ctx.beginPath();
  for (let y = y0; y <= y1 + 16; y += 16) { const c = riverCurve(y); y === y0 ? ctx.moveTo(c - RIVER_W / 2 - 10, y) : ctx.lineTo(c - RIVER_W / 2 - 10, y); }
  for (let y = y1; y >= y0 - 16; y -= 16) { const c = riverCurve(y); ctx.lineTo(c + RIVER_W / 2 + 10, y); }
  ctx.closePath(); ctx.fill();
  /* water */
  ctx.fillStyle = '#3f8fd4';
  ctx.beginPath();
  for (let y = y0; y <= y1 + 16; y += 16) { const c = riverCurve(y); y === y0 ? ctx.moveTo(c - RIVER_W / 2, y) : ctx.lineTo(c - RIVER_W / 2, y); }
  for (let y = y1; y >= y0 - 16; y -= 16) { const c = riverCurve(y); ctx.lineTo(c + RIVER_W / 2, y); }
  ctx.closePath(); ctx.fill();
  /* moving highlights */
  ctx.strokeStyle = 'rgba(200,235,255,.5)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let y = y0 - (y0 % 60); y <= y1; y += 60) {
    const off = (now * 46 + y) % 60;
    const c = riverCurve(y + off);
    ctx.beginPath(); ctx.moveTo(c - 24 + Math.sin(y) * 14, y + off);
    ctx.lineTo(c - 8 + Math.sin(y) * 14, y + off + 10); ctx.stroke();
  }
  /* the bridge (age 2+) */
  if (age >= 2 && v.y0 < BRIDGE_Y + 120 && v.y1 > BRIDGE_Y - 120) {
    const c = riverCurve(BRIDGE_Y);
    ctx.save(); ctx.translate(c, BRIDGE_Y);
    ctx.fillStyle = '#9a6b3d';
    rr(ctx, -RIVER_W / 2 - 26, -BRIDGE_H / 2 + 14, RIVER_W + 52, BRIDGE_H - 28, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(60,36,14,.5)'; ctx.lineWidth = 2.5;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(i * 22, -BRIDGE_H / 2 + 16); ctx.lineTo(i * 22, BRIDGE_H / 2 - 16); ctx.stroke();
    }
    ctx.fillStyle = '#7a5230';
    rr(ctx, -RIVER_W / 2 - 30, -BRIDGE_H / 2 + 4, RIVER_W + 60, 10, 5); ctx.fill();
    rr(ctx, -RIVER_W / 2 - 30, BRIDGE_H / 2 - 14, RIVER_W + 60, 10, 5); ctx.fill();
    ctx.restore();
  }
}

/* fog of the unexplored — locked regions sleep under rolling clouds */
function drawFog(v) {
  const tx0 = Math.max(0, v.x0 / TILE | 0), tx1 = Math.min(WT - 1, v.x1 / TILE | 0);
  const ty0 = Math.max(0, v.y0 / TILE | 0), ty1 = Math.min(WT - 1, v.y1 / TILE | 0);
  /* one path per alpha level so translucent tiles never overlap-seam */
  const groups = new Map(), clouds = [];
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const cx2 = tx * TILE + TILE / 2, cy2 = ty * TILE + TILE / 2;
    const key = regionAt(cx2, cy2);
    let a = 0;
    if (!regionUnlocked(key)) a = .82;
    else if (fogAnim[key]) a = fogAnim[key] * .82;
    if (a <= 0) continue;
    const ak = Math.round(a * 40);
    if (!groups.has(ak)) groups.set(ak, { a, rects: [] });
    groups.get(ak).rects.push([tx * TILE, ty * TILE]);
    const h = hash2(tx * 7, ty * 11);
    if (h < .12) clouds.push([cx2, cy2, h, a]);
  }
  for (const g of groups.values()) {
    ctx.fillStyle = `rgba(196,206,224,${g.a})`;
    ctx.beginPath();
    for (const [rx, ry] of g.rects) ctx.rect(rx, ry, TILE, TILE);
    ctx.fill();
  }
  for (const [cx2, cy2, h, a] of clouds) {
    ctx.fillStyle = `rgba(230,238,250,${a * .5})`;
    const off = Math.sin(now * .6 + h * 40) * 10;
    ctx.beginPath(); ctx.ellipse(cx2 + off, cy2, 34, 16, 0, 0, TAU); ctx.fill();
  }
  return groups.size > 0;
}

/* wooden signposts at each frontier */
function drawSign(s) {
  const locked = !regionUnlocked(s.region);
  ctx.save(); ctx.translate(s.x, s.y);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(0, 4, 16, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8a5a30'; rr(ctx, -3.5, -44, 7, 46, 3); ctx.fill();
  ctx.fillStyle = '#a8763f'; rr(ctx, -42, -58, 84, 26, 6); ctx.fill();
  ctx.strokeStyle = '#6e4520'; ctx.lineWidth = 2; rr(ctx, -42, -58, 84, 26, 6); ctx.stroke();
  ctx.fillStyle = locked ? '#4a2e12' : '#33200c';
  ctx.font = 'bold 9.5px "Arial Rounded MT Bold","Trebuchet MS",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s.label, 0, -45);
  if (locked) {
    ctx.font = '13px sans-serif';
    ctx.fillText('🔒', 0, -70);
    ctx.font = 'bold 8.5px "Arial Rounded MT Bold",sans-serif';
    ctx.fillStyle = '#6e4520';
    ctx.fillText('AGE ' + REGIONS[s.region].age, 0, -30);
  }
  ctx.restore();
}

/* ═══════════ RENDER — world objects + buildings (origin = feet) ═══════════ */
function shadow(w, h) {
  ctx.fillStyle = 'rgba(20,40,16,.25)';
  ctx.beginPath(); ctx.ellipse(0, 2, w, h || w * .32, 0, 0, TAU); ctx.fill();
}

function drawObject(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  const sway = Math.sin(now * 1.4 + o.ph) * .028 + (o.shakeT ? Math.sin(now * 40) * .06 * o.shakeT : 0);
  const frac = o.maxhp ? o.hp / o.maxhp : 1;
  switch (o.kind) {
    case 'oak': {
      shadow(24 * o.s);
      ctx.fillStyle = '#8a5a30'; rr(ctx, -5 * o.s, -26 * o.s, 10 * o.s, 27 * o.s, 4); ctx.fill();
      ctx.save(); ctx.rotate(sway);
      const rr2 = (16 + 12 * frac) * o.s;
      ctx.fillStyle = '#3e8a3a';
      ctx.beginPath(); ctx.arc(-rr2 * .45, -34 * o.s, rr2 * .72, 0, TAU);
      ctx.arc(rr2 * .45, -36 * o.s, rr2 * .68, 0, TAU);
      ctx.arc(0, -46 * o.s, rr2 * .8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#54a848';
      ctx.beginPath(); ctx.arc(-rr2 * .25, -46 * o.s, rr2 * .5, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.beginPath(); ctx.arc(-rr2 * .4, -52 * o.s, rr2 * .3, 0, TAU); ctx.fill();
      ctx.restore();
      break; }
    case 'pine': {
      shadow(22 * o.s);
      ctx.fillStyle = '#6e4520'; rr(ctx, -4.5 * o.s, -20 * o.s, 9 * o.s, 21 * o.s, 3); ctx.fill();
      ctx.save(); ctx.rotate(sway);
      ctx.fillStyle = '#2c6e3c';
      for (let i = 0; i < 3; i++) {
        const w = (30 - i * 7) * o.s * (.6 + .4 * frac), yy = (-24 - i * 20) * o.s;
        ctx.beginPath(); ctx.moveTo(-w, yy); ctx.lineTo(0, yy - 26 * o.s); ctx.lineTo(w, yy); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.beginPath(); ctx.moveTo(-8 * o.s, -66 * o.s); ctx.lineTo(0, -84 * o.s); ctx.lineTo(4 * o.s, -74 * o.s); ctx.closePath(); ctx.fill();
      ctx.restore();
      break; }
    case 'sparkletree': {
      shadow(24 * o.s);
      ctx.fillStyle = '#7a6296'; rr(ctx, -5 * o.s, -26 * o.s, 10 * o.s, 27 * o.s, 4); ctx.fill();
      ctx.save(); ctx.rotate(sway);
      const rr3 = (16 + 12 * frac) * o.s;
      ctx.fillStyle = '#5ec9b8';
      ctx.beginPath(); ctx.arc(-rr3 * .4, -36 * o.s, rr3 * .7, 0, TAU);
      ctx.arc(rr3 * .4, -38 * o.s, rr3 * .66, 0, TAU); ctx.arc(0, -48 * o.s, rr3 * .76, 0, TAU); ctx.fill();
      const p = .5 + Math.sin(now * 3 + o.ph) * .5;
      ctx.fillStyle = `rgba(220,255,250,${.4 + p * .5})`;
      ctx.beginPath(); ctx.arc(-rr3 * .3, -50 * o.s, 2.5, 0, TAU); ctx.arc(rr3 * .35, -40 * o.s, 2, 0, TAU); ctx.arc(2, -60 * o.s, 2.2, 0, TAU); ctx.fill();
      ctx.restore();
      break; }
    case 'rock':
      shadow(20 * o.s);
      ctx.fillStyle = '#8d94a0';
      ctx.beginPath(); ctx.arc(-7 * o.s, -9 * o.s * frac - 2, (12 * frac + 5) * o.s, 0, TAU);
      ctx.arc(8 * o.s, -6 * o.s * frac - 2, (9 * frac + 4) * o.s, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(-9 * o.s, -12 * o.s * frac - 2, 3.5 * o.s, 0, TAU); ctx.fill();
      break;
    case 'boulder':
      shadow(26 * o.s);
      ctx.fillStyle = '#7d8490';
      ctx.beginPath(); ctx.arc(0, -14 * o.s, 22 * o.s, 0, TAU); ctx.arc(-14 * o.s, -6 * o.s, 13 * o.s, 0, TAU);
      ctx.arc(15 * o.s, -7 * o.s, 12 * o.s, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.beginPath(); ctx.arc(-6 * o.s, -24 * o.s, 6 * o.s, 0, TAU); ctx.fill();
      break;
    case 'bush': {
      shadow(15 * o.s);
      ctx.save(); ctx.rotate(sway * .6);
      ctx.fillStyle = '#3f7e38';
      ctx.beginPath(); ctx.arc(-8 * o.s, -8 * o.s, 9 * o.s, 0, TAU); ctx.arc(8 * o.s, -8 * o.s, 9 * o.s, 0, TAU);
      ctx.arc(0, -13 * o.s, 10 * o.s, 0, TAU); ctx.fill();
      if (frac > 0) {
        ctx.fillStyle = '#e84a6a';
        for (let i = 0; i < 3 * frac + 1; i++)
          { ctx.beginPath(); ctx.arc((-8 + i * 6.5) * o.s, (-14 + (i % 2) * 6) * o.s, 2.4, 0, TAU); ctx.fill(); }
      }
      ctx.restore();
      break; }
    case 'ore':
      shadow(20 * o.s);
      ctx.fillStyle = '#6b6459';
      ctx.beginPath(); ctx.arc(-6 * o.s, -8 * o.s, 13 * o.s * (0.6 + .4 * frac), 0, TAU);
      ctx.arc(8 * o.s, -6 * o.s, 10 * o.s * (0.6 + .4 * frac), 0, TAU); ctx.fill();
      ctx.fillStyle = '#d8a860';
      for (let i = 0; i < 3; i++)
        { ctx.beginPath(); ctx.arc((-9 + i * 8) * o.s, (-10 + (i % 2) * 5) * o.s, 2.6 * frac + 1, 0, TAU); ctx.fill(); }
      break;
    case 'crystal': {
      shadow(16 * o.s);
      const p = .5 + Math.sin(now * 2.5 + o.ph) * .5;
      ctx.fillStyle = '#b98fff';
      for (const [dx, h, w2] of [[-9, 22, 7], [2, 32, 9], [12, 17, 6]]) {
        ctx.beginPath();
        ctx.moveTo((dx - w2 * frac) * o.s, 0); ctx.lineTo(dx * o.s, (-h * frac - 5) * o.s); ctx.lineTo((dx + w2 * frac) * o.s, 0);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = `rgba(255,255,255,${.3 + p * .35})`;
      ctx.beginPath(); ctx.moveTo(2 * o.s, (-32 * frac - 5) * o.s); ctx.lineTo(5 * o.s, -14 * o.s); ctx.lineTo(-1 * o.s, -12 * o.s); ctx.closePath(); ctx.fill();
      break; }
    case 'shard': {
      shadow(16 * o.s);
      const p = .5 + Math.sin(now * 3 + o.ph) * .5;
      ctx.fillStyle = `rgba(255,220,110,${.85})`;
      for (const [dx, h, w2] of [[-8, 18, 6], [3, 28, 8], [12, 14, 5]]) {
        ctx.beginPath();
        ctx.moveTo((dx - w2 * frac) * o.s, 0); ctx.lineTo(dx * o.s, (-h * frac - 5) * o.s); ctx.lineTo((dx + w2 * frac) * o.s, 0);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = `rgba(255,250,210,${.4 + p * .5})`;
      ctx.beginPath(); ctx.arc(3 * o.s, -16 * o.s, (4 + p * 3) * o.s, 0, TAU); ctx.fill();
      break; }
  }
  ctx.restore();
}

/* ── buildings (origin = bottom-center; also drawn as menu icons) ── */
function drawBuilding(c, key, t, active) {
  const A = active !== false;
  const bob = Math.sin(t * 2) * 1.5;
  const roof = (w, y, h, col) => {   // little triangle roof helper
    c.fillStyle = col;
    c.beginPath(); c.moveTo(-w, y); c.lineTo(0, y - h); c.lineTo(w, y); c.closePath(); c.fill();
  };
  switch (key) {
    case 'campfire': {
      c.fillStyle = '#7d8490';
      for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; c.beginPath(); c.arc(Math.cos(a) * 20, Math.sin(a) * 9 - 4, 4.5, 0, TAU); c.fill(); }
      c.fillStyle = '#6e4520';
      c.save(); c.rotate(.5); rr(c, -14, -8, 28, 7, 3); c.fill(); c.restore();
      c.save(); c.rotate(-.5); rr(c, -14, -8, 28, 7, 3); c.fill(); c.restore();
      for (let i = 0; i < 3; i++) {
        const fh = (14 + Math.sin(t * 7 + i * 2.1) * 5) * (1 - i * .22);
        c.fillStyle = ['#ff8c3a', '#ffb35c', '#ffe9a3'][i];
        c.beginPath(); c.moveTo(-8 + i * 3, -6);
        c.quadraticCurveTo(-10 + i * 3, -6 - fh * .6, i * 2 - 2 + Math.sin(t * 9 + i) * 2, -8 - fh);
        c.quadraticCurveTo(8 - i * 2, -6 - fh * .5, 8 - i * 3, -6); c.closePath(); c.fill();
      }
      break; }
    case 'woodhut': {
      c.fillStyle = '#a8763f'; rr(c, -26, -34, 52, 34, 5); c.fill();
      roof(32, -34, 22, '#6e4520');
      c.fillStyle = '#5a3a18'; rr(c, -8, -18, 16, 18, 3); c.fill();
      c.fillStyle = '#c9944f';
      c.beginPath(); c.arc(20, -6, 8, Math.PI, TAU); c.fill();   // log pile
      c.beginPath(); c.arc(30, -6, 6, Math.PI, TAU); c.fill();
      const ax = -22, chop = Math.abs(Math.sin(t * 3)) * (A ? 1 : 0);
      c.save(); c.translate(ax, -38); c.rotate(-.8 + chop * 1.1);
      c.fillStyle = '#8a5a30'; rr(c, -2, -14, 4, 16, 2); c.fill();
      c.fillStyle = '#c2c8ce'; rr(c, -7, -18, 14, 7, 2); c.fill();
      c.restore();
      break; }
    case 'cottage': {
      c.fillStyle = '#e8d8b0'; rr(c, -26, -32, 52, 32, 5); c.fill();
      roof(33, -32, 24, '#c05a3a');
      c.fillStyle = '#7ec9e8'; rr(c, -18, -24, 12, 11, 3); c.fill();
      c.fillStyle = '#8a5a30'; rr(c, 6, -20, 13, 20, 3); c.fill();
      c.fillStyle = '#ffd85e'; c.beginPath(); c.arc(16, -10, 1.8, 0, TAU); c.fill();
      /* chimney puffs */
      c.fillStyle = '#9a4a30'; rr(c, 16, -52, 9, 16, 2); c.fill();
      break; }
    case 'farmplot': {
      c.fillStyle = '#8a6a3d'; rr(c, -30, -14, 60, 16, 4); c.fill();
      c.strokeStyle = '#e8c85e'; c.lineWidth = 3; c.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        const wx = i * 11, sw = Math.sin(t * 2 + i) * 3;
        c.beginPath(); c.moveTo(wx, -4); c.quadraticCurveTo(wx + sw, -18, wx + sw * 1.6, -28 - (i % 2) * 5); c.stroke();
        c.fillStyle = '#ffe9a3';
        c.beginPath(); c.ellipse(wx + sw * 1.6, -30 - (i % 2) * 5, 3, 6, sw * .1, 0, TAU); c.fill();
      }
      break; }
    case 'coop': {
      c.fillStyle = '#d1885a'; rr(c, -22, -28, 44, 28, 5); c.fill();
      roof(28, -28, 16, '#8a4a2a');
      c.fillStyle = '#4a2e12'; c.beginPath(); c.arc(0, -14, 7, 0, TAU); c.fill();
      c.strokeStyle = '#8a5a30'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-16, 0); c.lineTo(-16, -8); c.moveTo(16, 0); c.lineTo(16, -8); c.stroke();
      /* rooster on top */
      c.save(); c.translate(2, -46 + bob * .6);
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, 0, 7, 6, 0, 0, TAU); c.fill();
      c.fillStyle = '#e84a3a'; c.beginPath(); c.arc(3, -6, 2.5, 0, TAU); c.fill();
      c.fillStyle = '#ffb35c'; c.beginPath(); c.moveTo(6, -1); c.lineTo(11, 0); c.lineTo(6, 2); c.closePath(); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(4, -2.5, 1, 0, TAU); c.fill();
      c.restore();
      break; }
    case 'bakery': {
      c.fillStyle = '#e8c9a0'; rr(c, -26, -34, 52, 34, 5); c.fill();
      roof(32, -34, 20, '#a8763f');
      c.fillStyle = '#5a3a18'; c.beginPath(); c.arc(0, -12, 10, Math.PI, TAU); c.fill();
      c.fillStyle = '#ff8c3a'; c.beginPath(); c.arc(0, -12, 6, Math.PI, TAU); c.fill();
      /* pretzel sign */
      c.save(); c.translate(0, -58 + bob);
      c.fillStyle = '#c9944f'; c.beginPath(); c.arc(0, 0, 8, 0, TAU); c.fill();
      c.fillStyle = '#e8c9a0'; c.beginPath(); c.arc(0, 0, 4, 0, TAU); c.fill();
      c.restore();
      break; }
    case 'nuggetfort': {
      c.fillStyle = '#ffd85e'; rr(c, -30, -40, 60, 40, 6); c.fill();
      c.fillStyle = '#f0a63a';
      for (let i = -2; i <= 2; i++) rr(c, i * 12 - 4, -48, 8, 10, 2), c.fill();
      c.fillStyle = '#8a4a2a'; rr(c, -9, -22, 18, 22, 4); c.fill();
      /* nugget banner */
      c.save(); c.translate(0, -60 + bob); c.rotate(Math.sin(t * 1.5) * .08);
      c.fillStyle = '#fff'; rr(c, -13, -9, 26, 18, 6); c.fill();
      c.fillStyle = '#e8a53a'; c.beginPath(); c.ellipse(0, 0, 8, 6, .3, 0, TAU); c.fill();
      c.restore();
      /* guard chicken w/ tiny helmet */
      c.save(); c.translate(22, -4);
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, -5, 6.5, 6, 0, 0, TAU); c.fill();
      c.fillStyle = '#8d94a0'; c.beginPath(); c.arc(1, -10, 4, Math.PI, TAU); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(3, -7, 1, 0, TAU); c.fill();
      c.fillStyle = '#ffb35c'; c.beginPath(); c.moveTo(5.5, -6); c.lineTo(9.5, -5); c.lineTo(5.5, -3.6); c.closePath(); c.fill();
      c.restore();
      break; }
    case 'sawmill': {
      c.fillStyle = '#a8763f'; rr(c, -28, -32, 56, 32, 5); c.fill();
      roof(34, -32, 18, '#6e4520');
      const spin = A ? t * 5 : .4;
      c.save(); c.translate(18, -22); c.rotate(spin);
      c.fillStyle = '#c2c8ce';
      c.beginPath();
      for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; c.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); c.lineTo(Math.cos(a + .3) * 8, Math.sin(a + .3) * 8); }
      c.closePath(); c.fill();

      roof(32, -36, 16, '#3a3550');
