<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Bro Force</title>
<!-- Shared arcade controller. Guard every use with `if (window.ArcadeController)`. -->
<script src="https://ses.q5labs.co/lib/controller.js"></script>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Impact, "Arial Black", system-ui, sans-serif;
    color: #fff;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; display: block; }

  /* ── iPad on-screen controls: left 8-way pad + right JUMP/SHOOT/SPECIAL ── */
  .controls {
    position: fixed; top: 0; bottom: 0;
    display: none; flex-direction: column;
    justify-content: flex-end;
    padding: max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    z-index: 5; pointer-events: none;
  }
  body.touch.in-match .controls { display: flex; }
  body.paused .controls { display: none; }
  body.input-pad .controls { display: none !important; }
  .controls.left  { left: 0;  align-items: flex-start; }
  .controls.right { right: 0; align-items: flex-end;   }
  .row { display: flex; gap: 10px; pointer-events: auto; align-items: center; justify-content: center; }
  .btn {
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 22px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none;
    transition: transform 0.05s, background 0.05s;
  }
  .btn.held { background: rgba(255,255,255,0.42); transform: scale(0.93); }
  .btn.jump  { width: 76px; height: 76px; font-size: 15px; letter-spacing:1px; background: rgba(93,214,108,0.22); border-color: rgba(93,214,108,0.7); color:#bfffca; }
  .btn.shoot { width: 96px; height: 96px; font-size: 16px; letter-spacing:1px; background: rgba(255,224,102,0.22); border-color: rgba(255,224,102,0.75); color:#ffe066; }
  .btn.spec  { width: 62px; height: 62px; font-size: 12px; letter-spacing:1px; background: rgba(197,95,255,0.22); border-color: rgba(197,95,255,0.7); color:#e4b7ff; }
  .btn.jump.held  { background: rgba(93,214,108,0.5); }
  .btn.shoot.held { background: rgba(255,224,102,0.5); }
  .btn.spec.held  { background: rgba(197,95,255,0.5); }
  .dpad { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; align-items: center; }
  .dpad .row { gap: 6px; }
  .dpad .spacer { width: 58px; height: 58px; pointer-events: none; }
  .cluster { display:flex; flex-direction:column; gap:10px; align-items:flex-end; pointer-events:none; }
  .cluster .row { pointer-events:auto; }

  .hud-btn {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.55);
    color: #fff; font-size: 22px; font-weight: 900;
    display: none; align-items: center; justify-content: center;
    z-index: 6; cursor: pointer; padding: 0; line-height: 1;
    font-family: inherit; touch-action: manipulation;
  }
  body.touch.in-match .hud-btn { display: flex; }
  body.paused   .hud-btn { display: none; }
  body.input-pad .hud-btn { display: none; }
  .hud-btn:active { transform: scale(0.92); }
</style>

<body>
<canvas id="game"></canvas>

<button id="pauseBtn" class="hud-btn" aria-label="Pause">II</button>

<div class="controls left">
  <div class="dpad">
    <div class="row">
      <div class="btn" data-act="ul" aria-label="Up-Left">&#8598;</div>
      <div class="btn" data-act="up" aria-label="Up">&#9650;</div>

      <div class="btn" data-act="left"  aria-label="Left">&#9664;</div>

</div>
<div class="controls right">

    <div class="row"><div class="btn spec" data-act="special" aria-label="Special">BOMB</div></div>

      <div class="btn shoot" data-act="shoot" aria-label="Shoot">SHOOT</div>
      <div class="btn jump" data-act="jump" aria-label="Jump">JUMP</div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  // ── Virtual playfield. Camera scrolls a wide world through this window. ──
  const VW = 480, VH = 270;
  const HUD_FONT = 'Impact, "Arial Black", system-ui, sans-serif';

  // ── LOW-FX / Pi mode: honor ?fx=low and localStorage.arcade_lowfx ──
  const LOWFX = (() => {
    try { const u = new URL(location.href); if ((u.searchParams.get('fx') || '') === 'low') return true; } catch {}
    try { if (localStorage.getItem('arcade_lowfx')) return true; } catch {}
    return false;
  })();

  let scale = 1, offX = 0, offY = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    scale = Math.min(canvas.width / VW, canvas.height / VH);
    offX = (canvas.width - VW * scale) / 2;
    offY = (canvas.height - VH * scale) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  const AC = window.ArcadeController || null;
  const PADS = AC ? [AC.pad(0), AC.pad(1)] : null;

  // ════════════════════════════════════════════════════════════════════════
  // AUDIO — synthesized, context created lazily on first user gesture.
  // ════════════════════════════════════════════════════════════════════════
  let audioCtx = null, muted = false;
  function ensureAudio() {
    if (!audioCtx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (A) audioCtx = new A();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function blip(freq, dur, type = 'square', vol = 0.07, sweepTo = null) {
    if (!audioCtx || muted) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (sweepTo != null) o.frequency.exponentialRampToValueAtTime(Math.max(1, sweepTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noiseBurst(durSec, peakGain, lpStart, lpEnd) {
    if (!audioCtx || muted) return;
    const t0 = audioCtx.currentTime, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, Math.max(1, Math.floor(sr * durSec)), sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length * 0.6);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const filt = audioCtx.createBiquadFilter(); filt.type = 'lowpass';
    filt.frequency.setValueAtTime(lpStart, t0);
    filt.frequency.exponentialRampToValueAtTime(Math.max(1, lpEnd), t0 + durSec);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peakGain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + durSec);
    src.connect(filt).connect(g).connect(audioCtx.destination);
    src.start(t0); src.stop(t0 + durSec + 0.05);
  }
  let _lastShotAt = 0;
  const sfx = {
    rifle:  () => blip(720, 0.06, 'square',   0.045, 1200),
    spread: () => blip(430, 0.09, 'sawtooth', 0.05, 900),
    laser:  () => blip(1200, 0.09, 'sawtooth', 0.045, 420),
    rapid:  () => blip(900, 0.04, 'square',   0.035, 1500),
    enemyShot: () => blip(300, 0.08, 'square', 0.04, 140),
    hit:    () => blip(200, 0.05, 'square', 0.05, 110),
    kill:   () => { noiseBurst(0.15, 0.12, 1800, 240); blip(200, 0.14, 'sawtooth', 0.06, 70); },
    boom:   () => { noiseBurst(0.30, 0.22, 2200, 150); blip(130, 0.26, 'sawtooth', 0.12, 40); },
    jump:   () => blip(360, 0.10, 'square', 0.05, 720),
    pickup: () => { [660, 990, 1320].forEach((f, i) => setTimeout(() => blip(f, 0.08, 'triangle', 0.06), i * 55)); },
    shield: () => { [330, 520, 700].forEach((f, i) => setTimeout(() => blip(f, 0.14, 'sine', 0.05), i * 50)); },
    special:() => { noiseBurst(0.5, 0.28, 2600, 80); blip(110, 0.5, 'sawtooth', 0.16, 30); setTimeout(() => blip(520, 0.3, 'square', 0.09, 90), 60); },
    playerHit: () => { blip(240, 0.16, 'sawtooth', 0.1, 80); noiseBurst(0.14, 0.1, 1400, 200); },
    downed: () => blip(300, 0.7, 'sawtooth', 0.12, 45),
    revive: () => { [440, 660, 880, 1100].forEach((f, i) => setTimeout(() => blip(f, 0.1, 'triangle', 0.07), i * 60)); },
    bossRoar: () => { noiseBurst(0.9, 0.3, 900, 60); [90, 70, 50].forEach((f, i) => setTimeout(() => blip(f, 0.5, 'sawtooth', 0.18, f * 0.7), i * 160)); },
    bossHurt: () => { noiseBurst(0.2, 0.16, 1600, 120); blip(160, 0.18, 'square', 0.09, 70); },
    clang:  () => blip(1400, 0.05, 'square', 0.05, 900),
    levelClear: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, 0.16, 'triangle', 0.08), i * 130)); },
    ui:     () => blip(600, 0.05, 'square', 0.04, 800),
    confirm:() => { blip(700, 0.08, 'square', 0.05, 1100); setTimeout(() => blip(1050, 0.1, 'square', 0.05), 70); },
    rumble: () => { noiseBurst(0.45, 0.14, 460, 50); blip(66, 0.45, 'sawtooth', 0.11, 40); },
  };

  // ════════════════════════════════════════════════════════════════════════
  // MUSIC — one driving, intense Contra-style synth loop (same track every
  // level for now). WebAudio lookahead scheduler: minor-key galloping bass +
  // heroic square lead + kick/hat. Light on the CPU (a few short nodes/step).
  // ════════════════════════════════════════════════════════════════════════
  let musicOn = false, _musTimer = null, _musStep = 0, _musNextT = 0, musicGain = null;
  const MUS_STEP = 0.107;                                  // ~140 BPM sixteenths
  const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);
  // A multi-section song (each section = 32 steps / 2 bars). The SONG order
  // strings them together so it develops instead of looping one riff.
  // A = main driving riff, B = syncopated 16th push, C = soaring bridge,
  // D = variation with a turnaround fill. 'busy' drums = 8th kicks + 16th hats.
  const SECTIONS = {
    A: { drums: 'straight',
      bass: [45,-1,45,45,-1,45,45,-1, 41,-1,41,41,-1,41,41,-1, 43,-1,43,43,-1,43,43,-1, 40,-1,40,40,-1,40,40,-1],
      lead: [69,-1,72,-1,76,-1,72,-1, 65,-1,69,-1,72,-1,69,-1, 67,-1,71,-1,74,-1,71,-1, 64,-1,68,-1,71,-1,76,-1] },
    B: { drums: 'busy',
      bass: [45,45,-1,45,-1,45,45,-1, 45,45,-1,45,-1,45,45,-1, 40,40,-1,40,-1,40,40,-1, 43,43,-1,43,44,44,45,45],
      lead: [76,76,-1,74,-1,72,-1,71, 69,-1,72,-1,76,-1,-1,-1, 71,71,-1,69,-1,67,-1,64, 67,-1,69,71,72,-1,76,-1] },
    C: { drums: 'straight',
      bass: [41,-1,41,-1,43,-1,43,-1, 45,-1,45,-1,45,-1,45,-1, 41,-1,41,-1,43,-1,43,-1, 40,-1,40,-1,40,-1,40,-1],
      lead: [72,-1,74,76,77,-1,76,-1, 81,-1,79,77,76,-1,74,-1, 72,-1,74,76,77,-1,79,-1, 81,-1,84,-1,83,81,79,77] },
    D: { drums: 'busy',
      bass: [45,-1,45,45,45,-1,45,45, 41,-1,41,41,41,-1,41,41, 43,-1,43,43,43,-1,43,43, 40,40,40,40,44,44,45,45],
      lead: [69,-1,72,76,-1,79,-1,76, 72,-1,69,-1,65,-1,69,-1, 67,-1,71,74,-1,76,-1,74, 71,-1,68,-1,71,72,74,76] },
  };
  const SONG = ['A','A','B','A','C','C','D','B'];   // ~27s before it repeats
  function musVoice(freq, t, dur, type, vol) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(musicGain); o.start(t); o.stop(t + dur + 0.02);
  }
  function musKick(t) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.24, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.17);
  }
  function musHat(t) {
    const sr = audioCtx.sampleRate, buf = audioCtx.createBuffer(1, Math.floor(sr * 0.03), sr), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = audioCtx.createBufferSource(); s.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7200;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    s.connect(f).connect(g).connect(musicGain); s.start(t); s.stop(t + 0.04);
  }
  function scheduleMusic() {
    if (!musicOn || !audioCtx) return;
    // master level follows mute + ducks under the pause screen
    musicGain.gain.value = muted ? 0 : (state === PAUSED ? 0.18 : 0.42);
    while (_musNextT < audioCtx.currentTime + 0.18) {
      const g = _musStep, s = g % 32, t = _musNextT;
      const sec = SECTIONS[SONG[Math.floor(g / 32) % SONG.length]];
      const bn = sec.bass[s]; if (bn >= 0) musVoice(midiHz(bn), t, 0.15, 'sawtooth', 0.16);
      const ln = sec.lead[s]; if (ln >= 0) { musVoice(midiHz(ln), t, 0.12, 'square', 0.085); musVoice(midiHz(ln + 12), t, 0.10, 'square', 0.03); }
      if (sec.drums === 'busy') { if (s % 2 === 0) musKick(t); musHat(t); }
      else { if (s % 4 === 0) musKick(t); if (s % 2 === 0) musHat(t); }
      _musNextT += MUS_STEP; _musStep++;
    }
    _musTimer = setTimeout(scheduleMusic, 45);
  }
  function startMusic() {
    ensureAudio();
    if (!audioCtx || musicOn) return;
    musicGain = audioCtx.createGain(); musicGain.gain.value = 0.42; musicGain.connect(audioCtx.destination);
    musicOn = true; _musStep = 0; _musNextT = audioCtx.currentTime + 0.06;
    scheduleMusic();
  }
  function stopMusic() { musicOn = false; if (_musTimer) { clearTimeout(_musTimer); _musTimer = null; } }

  // ════════════════════════════════════════════════════════════════════════
  // COLOR + BAKE KIT (techniques from meteorblaster.html)
  // ════════════════════════════════════════════════════════════════════════
  const SS = 3;
  function colorToRgb(c) {
    if (c[0] === '#') { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    const m = c.match(/(\d+),\s*(\d+),\s*(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [255, 255, 255];
  }
  function rgba(c, a) { const [r, g, b] = colorToRgb(c); return `rgba(${r},${g},${b},${a})`; }
  function shade(c, k) {
    const [r, g, b] = colorToRgb(c);
    const f = v => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function bake(w, h, fn, ss = SS) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * ss));
    c.height = Math.max(1, Math.round(h * ss));
    const g = c.getContext('2d');
    g.scale(ss, ss);
    fn(g, w, h);
    return { c, w, h };
  }
  function whiten(s) {
    const c = document.createElement('canvas');
    c.width = s.c.width; c.height = s.c.height;
    const g = c.getContext('2d');
    g.drawImage(s.c, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    return { c, w: s.w, h: s.h };
  }
  function glowDot(g, x, y, r, color, a = 0.8) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rgba(color, a));
    gr.addColorStop(0.55, rgba(color, a * 0.35));
    gr.addColorStop(1, rgba(color, 0));
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // Per-frame draw helpers. drawSprRot/Pivot reset straight to the world cam.
  let _camX = 0, _camY = 0;
  function drawSpr(s, x, y) { ctx.drawImage(s.c, x - s.w / 2, y - s.h / 2, s.w, s.h); }
  function drawSprScaled(s, x, y, w, h) { ctx.drawImage(s.c, x - w / 2, y - h / 2, w, h); }
  function drawSprTop(s, x, yTop) { ctx.drawImage(s.c, x - s.w / 2, yTop, s.w, s.h); }
  function drawSprRot(s, x, y, rot, sc = 1) {
    ctx.translate(x, y); ctx.rotate(rot);
    const w = s.w * sc, h = s.h * sc;
    ctx.drawImage(s.c, -w / 2, -h / 2, w, h);
    ctx.setTransform(scale, 0, 0, scale, _camX, _camY);
  }
  function drawSprPivot(s, x, y, rot, px, py) {
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.drawImage(s.c, -px, -py, s.w, s.h);
    ctx.setTransform(scale, 0, 0, scale, _camX, _camY);
  }

  // ════════════════════════════════════════════════════════════════════════
  // ROSTER — 4 cosmetic bros. Distinct colors/silhouettes.
  // ════════════════════════════════════════════════════════════════════════
  const BROS = {
    commander: { name: 'COMMANDER BRO', color: '#3aa0ff', dark: '#1c5ea0', pants: '#26324a', skin: '#f3d0a8', helmet: true,  bolt: '#8fd6ff', quip: 'FOR THE BROS!' },
    ben:       { name: 'BEN BRO',       color: '#5dd66c', dark: '#2f8a3c', pants: '#274a2c', skin: '#f3d0a8', bandana: '#eaffd0', bolt: '#bfffca', quip: 'LET\'S GO!' },
    luke:      { name: 'LUKE BRO',      color: '#ff5252', dark: '#a02020', pants: '#4a2626', skin: '#e8b988', cap: true,     bolt: '#ff9b9b', quip: 'BOOM!' },
    coffee:    { name: 'COFFEE BRO',    color: '#b06b3a', dark: '#5e3418', pants: '#3a2412', skin: '#e3b388', mug: true,     bolt: '#ffd7a0', quip: 'NEED... COFFEE' },
  };
  const BRO_ORDER = ['commander', 'ben', 'luke', 'coffee'];

  // ════════════════════════════════════════════════════════════════════════
  // WEAPONS — data-driven. Add a new weapon = one entry here + a crate icon.
  // ════════════════════════════════════════════════════════════════════════
  const WEAPONS = {
    rifle:  { name: 'RIFLE',  cd: 7,  dmg: 1, speed: 8.5, count: 1, spread: 0,    kind: 'bolt',  pierce: 0, color: '#ffe066', sfx: 'rifle',  bw: 8,  bh: 4 },
    spread: { name: 'SPREAD', cd: 15, dmg: 1, speed: 7.0, count: 5, spread: 0.42, kind: 'bolt',  pierce: 0, color: '#ff9b3d', sfx: 'spread', bw: 8,  bh: 5 },
    laser:  { name: 'LASER',  cd: 12, dmg: 3, speed: 13,  count: 1, spread: 0,    kind: 'laser', pierce: 99,color: '#7fdcff', sfx: 'laser',  bw: 22, bh: 5 },
    rapid:  { name: 'RAPID',  cd: 3,  dmg: 1, speed: 9.0, count: 1, spread: 0.06, kind: 'bolt',  pierce: 0, color: '#aaff60', sfx: 'rapid',  bw: 7,  bh: 4 },
  };
  const WEAPON_DROP_ORDER = ['spread', 'laser', 'rapid', 'rifle'];

  // ════════════════════════════════════════════════════════════════════════
  // TUNING
  // ════════════════════════════════════════════════════════════════════════
  const GRAV = 0.52, JUMP_V = -10.6, RUN = 2.7, MAX_FALL = 11;
  const PLW = 15, PLH = 30, PRONE_H = 15;
  const INVULN = 60, DOWN_TIME = 480, RESPAWN_SHIELD = 160, REVIVE_NEED = 60;
  const START_SPECIALS = 2;

  // ════════════════════════════════════════════════════════════════════════
  // SPRITE ATLAS — everything baked once at load. Per-frame path = drawImage.
  // ════════════════════════════════════════════════════════════════════════
  const SPR = {};

  // ---- Bro body: baked per (broId, facing, pose). Feet at bottom-center. ----
  const POSES = ['stand', 'run0', 'run1', 'jump', 'prone'];
  function bakeBro(g, b, facing, pose) {
    // Coordinate space: 26 wide x 34 tall, feet at (13, 33), facing right.
    g.translate(13, 0);
    if (facing < 0) g.scale(-1, 1);
    const col = b.color, dk = b.dark, sk = b.skin, pants = b.pants;
    const legLift = pose === 'run0' ? 1 : pose === 'run1' ? -1 : 0;
    const crouch = pose === 'prone';
    g.lineJoin = 'round'; g.lineWidth = 1.4; g.strokeStyle = 'rgba(0,0,0,0.6)';
    if (crouch) {
      // prone: low body lying, firing horizontally
      g.fillStyle = pants; g.fillRect(-11, 26, 20, 6); g.strokeRect(-11, 26, 20, 6);
      const tg = g.createLinearGradient(0, 18, 0, 27);
      tg.addColorStop(0, shade(col, 0.3)); tg.addColorStop(1, shade(col, -0.35));
      g.fillStyle = tg; g.fillRect(-9, 18, 20, 9); g.strokeRect(-9, 18, 20, 9);
      // head
      g.fillStyle = sk; g.beginPath(); g.arc(9, 17, 5, 0, Math.PI * 2); g.fill(); g.stroke();
      g.fillStyle = dk; g.fillRect(6, 11, 8, 4); // helmet band
      // gun
      g.fillStyle = '#333a44'; g.fillRect(11, 17, 12, 3);
      return;
    }
    // legs
    const lg = g.createLinearGradient(0, 22, 0, 33);
    lg.addColorStop(0, pants); lg.addColorStop(1, shade(pants, -0.35));
    g.fillStyle = lg;
    if (pose === 'jump') {
      g.fillRect(-8, 22, 6, 8); g.fillRect(2, 20, 6, 9);
      g.strokeRect(-8, 22, 6, 8); g.strokeRect(2, 20, 6, 9);
      g.fillStyle = '#1a1a22'; g.fillRect(-9, 29, 8, 3); g.fillRect(1, 28, 8, 3);
    } else {
      g.fillRect(-7, 22 - legLift, 6, 11 + legLift); g.fillRect(1, 22 + legLift, 6, 11 - legLift);
      g.strokeRect(-7, 22 - legLift, 6, 11 + legLift); g.strokeRect(1, 22 + legLift, 6, 11 - legLift);
      g.fillStyle = '#1a1a22'; g.fillRect(-8, 31 - legLift, 8, 3); g.fillRect(0, 31 + legLift, 8, 3);
    }
    // torso
    const tg = g.createLinearGradient(-8, 9, 8, 24);
    tg.addColorStop(0, shade(col, 0.35)); tg.addColorStop(0.55, col); tg.addColorStop(1, shade(col, -0.4));
    g.fillStyle = tg;
    g.beginPath();
    g.moveTo(-8, 10); g.lineTo(8, 10); g.lineTo(7, 24); g.lineTo(-7, 24); g.closePath();
    g.fill(); g.stroke();
    // chest strap / accent
    g.strokeStyle = rgba(b.bolt, 0.9); g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-7, 12); g.lineTo(6, 20); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.4;
    // arm (back) holding gun forward
    g.fillStyle = shade(col, -0.15);
    g.fillRect(2, 12, 5, 9); g.strokeRect(2, 12, 5, 9);
    // head
    g.fillStyle = sk; g.beginPath(); g.arc(0, 6, 5.4, 0, Math.PI * 2); g.fill(); g.stroke();
    // face detail (eye)
    g.fillStyle = '#20242c'; g.fillRect(2.5, 4.5, 1.6, 1.6);
    // headgear per bro
    if (b.helmet) { g.fillStyle = dk; g.beginPath(); g.arc(0, 4, 6, Math.PI, 0); g.fill(); g.fillRect(-6, 3, 12, 2.5); }
    else if (b.cap) { g.fillStyle = dk; g.beginPath(); g.arc(0, 4, 6, Math.PI, 0); g.fill(); g.fillRect(2, 3, 8, 2.2); }
    else if (b.bandana) { g.fillStyle = b.bandana; g.fillRect(-6, 1.5, 12, 3.4); g.fillRect(-8, 2, 3, 5); }
    else if (b.mug) { g.fillStyle = dk; g.fillRect(-6, 0.5, 12, 3); g.fillStyle = '#e8e8f0'; g.fillRect(5, 5, 4, 4); g.strokeRect(5, 5, 4, 4); }
    // steam for coffee bro
    if (b.mug) { glowDot(g, 7, 3, 3, '#fff', 0.4); }
  }
  for (const id of BRO_ORDER) {
    const b = BROS[id];
    for (const facing of [1, -1]) {
      for (const pose of POSES) {
        SPR['bro_' + id + '_' + (facing > 0 ? 'r' : 'l') + '_' + pose] = bake(28, 36, g => bakeBro(g, b, facing, pose));
      }
    }
  }
  // gun arm sprite (barrel to the right, pivot at inner end)
  SPR.gun = bake(16, 6, g => {
    g.fillStyle = '#2c313c'; g.fillRect(0, 1, 13, 4);
    g.fillStyle = '#4a5060'; g.fillRect(0, 1, 13, 1.4);
    g.fillStyle = '#1a1d24'; g.fillRect(11, 0.5, 3, 5);
  });
  // muzzle flash
  function bakeMuzzle(color) {
    return bake(20, 20, g => {
      glowDot(g, 10, 10, 10, color, 0.9);
      g.fillStyle = '#fff';
      g.beginPath();
      g.moveTo(10, 2); g.lineTo(12.5, 8); g.lineTo(18, 10); g.lineTo(12.5, 12);
      g.lineTo(10, 18); g.lineTo(7.5, 12); g.lineTo(2, 10); g.lineTo(7.5, 8);
      g.closePath(); g.fill();
    });
  }
  const _muzzleCache = {};
  function muzzleSpr(c) { return _muzzleCache[c] || (_muzzleCache[c] = bakeMuzzle(c)); }

  // ---- Bullets (capsule + halo + white core), cached per color ----
  const _boltCache = {}, _laserCache = {};
  function boltSpr(color) {
    let s = _boltCache[color];
    if (!s) {
      s = _boltCache[color] = bake(14, 8, g => {
        glowDot(g, 7, 4, 5, color, 0.7);
        g.fillStyle = color;
        g.beginPath(); g.ellipse(7, 4, 5, 2.6, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#fff';
        g.beginPath(); g.ellipse(6, 4, 2.6, 1.4, 0, 0, Math.PI * 2); g.fill();
      });
    }
    return s;
  }
  function laserSpr(color) {
    let s = _laserCache[color];
    if (!s) {
      s = _laserCache[color] = bake(30, 8, g => {
        const gr = g.createLinearGradient(0, 0, 0, 8);
        gr.addColorStop(0, rgba(color, 0)); gr.addColorStop(0.4, rgba(color, 0.85));
        gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(0.6, rgba(color, 0.85));
        gr.addColorStop(1, rgba(color, 0));
        g.fillStyle = gr; g.fillRect(0, 0, 30, 8);
        glowDot(g, 4, 4, 5, color, 0.8);
      }, 1.5);
    }
    return s;
  }
  // enemy shot
  const _shotCache = {};
  function shotSpr(color) {
    let s = _shotCache[color];
    if (!s) {
      s = _shotCache[color] = bake(16, 16, g => {
        glowDot(g, 8, 8, 8, color, 0.75);
        g.fillStyle = color; g.beginPath(); g.arc(8, 8, 4, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(6.5, 6.5, 1.6, 0, Math.PI * 2); g.fill();
      });
    }
    return s;
  }
  // debris dot
  const _dotCache = {};
  function dotSpr(color) {
    let s = _dotCache[color];
    if (!s) {
      s = _dotCache[color] = bake(10, 10, g => {
        glowDot(g, 5, 5, 4.5, color, 0.6);
        g.fillStyle = color; g.fillRect(3, 3, 4, 4);
        g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(3.5, 3.5, 1.6, 1.6);
      });
    }
    return s;
  }

  // ---- Enemies (baked, facing left toward players by default = facing -1) ----
  SPR.scout = bake(22, 28, g => {
    g.translate(11, 0);
    const bg = g.createLinearGradient(-8, 6, 8, 26);
    bg.addColorStop(0, '#c85a4a'); bg.addColorStop(1, '#7a2c22');
    g.fillStyle = bg; g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.4; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(-7, 8); g.lineTo(7, 8); g.lineTo(6, 22); g.lineTo(-6, 22); g.closePath(); g.fill(); g.stroke();
    // legs
    g.fillStyle = '#2a2a34'; g.fillRect(-6, 22, 4, 6); g.fillRect(2, 22, 4, 6);
    // head/visor
    g.fillStyle = '#3a3a48'; g.beginPath(); g.arc(0, 5, 5, 0, Math.PI * 2); g.fill(); g.stroke();
    glowDot(g, -2, 5, 4, '#ff5252', 0.8);
    g.fillStyle = '#ff5252'; g.fillRect(-5, 3.5, 6, 2.4);
  });
  SPR.turret = bake(34, 30, g => {
    g.translate(17, 0);
    // base
    g.fillStyle = '#33384a'; g.beginPath(); g.moveTo(-14, 30); g.lineTo(14, 30); g.lineTo(9, 18); g.lineTo(-9, 18); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.4; g.stroke();
    // dome
    const dg = g.createLinearGradient(0, 4, 0, 20);
    dg.addColorStop(0, '#7a8296'); dg.addColorStop(1, '#3a4050');
    g.fillStyle = dg; g.beginPath(); g.arc(0, 18, 11, Math.PI, 0); g.fill(); g.stroke();
    glowDot(g, 0, 14, 5, '#ffce4d', 0.7);
    g.fillStyle = '#ffce4d'; g.beginPath(); g.arc(0, 14, 3, 0, Math.PI * 2); g.fill();
    // barrel
    g.fillStyle = '#22262f'; g.fillRect(-16, 12, 8, 5);
  });
  SPR.drone = bake(30, 22, g => {
    g.translate(15, 11);
    const bg = g.createLinearGradient(0, -8, 0, 8);
    bg.addColorStop(0, '#8f6bd8'); bg.addColorStop(1, '#4a2c86');
    g.fillStyle = bg; g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.4;
    g.beginPath(); g.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    glowDot(g, 0, 0, 6, '#c45fff', 0.7);
    g.fillStyle = '#e9d0ff'; g.beginPath(); g.arc(0, 0, 3.4, 0, Math.PI * 2); g.fill();
    // rotor blur
    g.fillStyle = 'rgba(200,200,230,0.35)'; g.fillRect(-14, -10, 28, 2.4);
  });
  SPR.walker = bake(48, 50, g => {
    g.translate(24, 0);
    // legs
    g.strokeStyle = '#2a2e3a'; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-10, 30); g.lineTo(-16, 48); g.moveTo(10, 30); g.lineTo(16, 48); g.stroke();
    g.beginPath(); g.moveTo(-8, 30); g.lineTo(-4, 48); g.moveTo(8, 30); g.lineTo(4, 48); g.stroke();
    // body
    const bg = g.createLinearGradient(0, 8, 0, 34);
    bg.addColorStop(0, '#9aa2b6'); bg.addColorStop(1, '#454b5e');
    g.fillStyle = bg; g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.6; g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(-16, 12); g.lineTo(16, 12); g.lineTo(14, 32); g.lineTo(-14, 32); g.closePath();
    g.fill(); g.stroke();
    // eye
    glowDot(g, -2, 20, 7, '#ff5252', 0.8);
    g.fillStyle = '#ff5252'; g.fillRect(-12, 18, 12, 4);
    // shoulder cannon
    g.fillStyle = '#22262f'; g.fillRect(-22, 14, 9, 6);
    // rivets
    g.fillStyle = 'rgba(255,255,255,0.3)';
    for (const rx of [-11, 0, 11]) g.fillRect(rx, 14, 2, 2);
  });
  // hit-flash whites
  for (const k of ['scout', 'turret', 'drone', 'walker']) SPR[k + '_w'] = whiten(SPR[k]);

  // ---- Sammy the cat ----
  SPR.cat0 = bake(28, 16, g => bakeCat(g, 0));
  SPR.cat1 = bake(28, 16, g => bakeCat(g, 1));
  function bakeCat(g, f) {
    g.translate(14, 0);
    g.fillStyle = '#3a3a44';
    // body
    g.beginPath(); g.ellipse(0, 10, 11, 5, 0, 0, Math.PI * 2); g.fill();
    // head
    g.beginPath(); g.arc(9, 7, 4.5, 0, Math.PI * 2); g.fill();
    // ears
    g.beginPath(); g.moveTo(7, 3); g.lineTo(8, -1); g.lineTo(10, 3); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(11, 3); g.lineTo(12, -1); g.lineTo(13, 3); g.closePath(); g.fill();
    // tail
    g.strokeStyle = '#3a3a44'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-10, 8); g.quadraticCurveTo(-16, 2, -12, -2); g.stroke();
    // legs
    g.strokeStyle = '#2a2a34'; g.lineWidth = 2.4;
    const off = f ? 2 : -2;
    g.beginPath(); g.moveTo(-6, 14); g.lineTo(-6 + off, 16); g.moveTo(4, 14); g.lineTo(4 - off, 16); g.stroke();
    // eye
    g.fillStyle = '#aaff60'; g.fillRect(8, 6, 1.8, 1.8);
  }

  // ---- Pickups: weapon crates + powerup orbs ----
  function bakeCrate(color, letter) {
    return bake(22, 22, g => {
      g.translate(11, 11);
      glowDot(g, 0, 0, 13, color, 0.55);
      const bg = g.createLinearGradient(-9, -9, 9, 9);
      bg.addColorStop(0, shade(color, 0.4)); bg.addColorStop(1, shade(color, -0.35));
      g.fillStyle = bg; g.strokeStyle = 'rgba(0,0,0,0.7)'; g.lineWidth = 1.6;
      g.beginPath(); g.rect(-9, -9, 18, 18); g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.85)';
      g.font = '900 14px ' + HUD_FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(letter, 0, 1);
    });
  }
  SPR.crate = {
    spread: bakeCrate('#ff9b3d', 'S'),
    laser:  bakeCrate('#7fdcff', 'L'),
    rapid:  bakeCrate('#aaff60', 'R'),
    rifle:  bakeCrate('#ffe066', 'I'),
  };
  function bakeOrb(color, letter) {
    return bake(20, 20, g => {
      g.translate(10, 10);
      glowDot(g, 0, 0, 12, color, 0.7);
      const bg = g.createRadialGradient(-3, -3, 1, 0, 0, 9);
      bg.addColorStop(0, '#fff'); bg.addColorStop(0.5, color); bg.addColorStop(1, shade(color, -0.4));
      g.fillStyle = bg; g.beginPath(); g.arc(0, 0, 8, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(0,0,0,0.75)'; g.font = '900 11px ' + HUD_FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(letter, 0, 1);
    });
  }
  SPR.orb = {
    shield: bakeOrb('#7fdcff', 'S'),
    ddmg:   bakeOrb('#ff5cae', 'D'),
    special:bakeOrb('#ffce4d', 'B'),
  };
  // weapon pod (falcon nod)
  SPR.pod = bake(38, 22, g => {
    g.translate(19, 11);
    glowDot(g, 0, 0, 15, '#ffce4d', 0.4);
    const bg = g.createLinearGradient(0, -9, 0, 9);
    bg.addColorStop(0, '#d0d6e2'); bg.addColorStop(1, '#5a6070');
    g.fillStyle = bg; g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.6;
    g.beginPath(); g.ellipse(0, 0, 16, 8, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    // wings
    g.fillStyle = '#ffce4d';
    g.beginPath(); g.moveTo(-4, -8); g.lineTo(-16, -14); g.lineTo(-8, -4); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(4, -8); g.lineTo(16, -14); g.lineTo(8, -4); g.closePath(); g.fill();
    glowDot(g, 0, 0, 5, '#7fdcff', 0.8);
    g.fillStyle = '#7fdcff'; g.beginPath(); g.arc(0, 0, 3.2, 0, Math.PI * 2); g.fill();
  });
  SPR.shieldBubble = bake(48, 52, g => {
    const gr = g.createRadialGradient(24, 26, 14, 24, 26, 25);
    gr.addColorStop(0, 'rgba(127,220,255,0)');
    gr.addColorStop(0.72, 'rgba(127,220,255,0.10)');
    gr.addColorStop(0.9, 'rgba(127,220,255,0.7)');
    gr.addColorStop(1, 'rgba(200,245,255,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(24, 26, 22, 25, 0, 0, Math.PI * 2); g.fill();
  });
  // downed marker
  SPR.downed = bake(30, 30, g => {
    g.translate(15, 15);
    glowDot(g, 0, 0, 14, '#ffce4d', 0.5);
    g.strokeStyle = '#ffce4d'; g.lineWidth = 2.4;
    g.beginPath(); g.arc(0, 0, 10, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#ffce4d'; g.font = '900 16px ' + HUD_FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('!', 0, 1);
  });

  // ---- HUD bro face icons ----
  function bakeFace(id) {
    const b = BROS[id];
    return bake(20, 20, g => {
      g.translate(10, 10);
      g.fillStyle = b.color; g.beginPath(); g.arc(0, 0, 9, 0, Math.PI * 2); g.fill();
      g.fillStyle = b.skin; g.beginPath(); g.arc(0, 1, 6, 0, Math.PI * 2); g.fill();
      g.fillStyle = b.dark; g.beginPath(); g.arc(0, -1, 6.5, Math.PI, 0); g.fill();
      g.fillStyle = '#20242c'; g.fillRect(-3, 0, 1.6, 1.6); g.fillRect(1.6, 0, 1.6, 1.6);
    });
  }
  SPR.face = {};
  for (const id of BRO_ORDER) SPR.face[id] = bakeFace(id);

  // ---- Explosions: 9-frame sheet x 3 tiers x tints (meteorblaster technique) ----
  const EXPLO_FRAMES = 9;
  const EXPLO_SIZES = [30, 62, 120];
  const EXPLO_TINTS = { orange: '#ff9944', red: '#ff5252', green: '#aaff60', gray: '#9aa2b6', white: '#ffffff', gold: '#ffce4d' };
  SPR.explo = {};
  for (const tname of Object.keys(EXPLO_TINTS)) {
    const col = EXPLO_TINTS[tname];
    SPR.explo[tname] = EXPLO_SIZES.map((D, tier) => {
      const frames = [];
      const CW = Math.round(D * 1.35);
      for (let f = 0; f < EXPLO_FRAMES; f++) {
        const t = f / (EXPLO_FRAMES - 1);
        frames.push(bake(CW, CW, g => {
          g.translate(CW / 2, CW / 2);
          const R = D / 2;
          let seed = (f * 7919 + tier * 104729 + tname.length * 31) >>> 0;
          const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
          const px = Math.max(2.2, D / 11);
          const chunk = (x, y, ccol, k = 1) => { g.fillStyle = ccol; const s2 = px * k; g.fillRect(Math.round(x - s2 / 2), Math.round(y - s2 / 2), Math.round(s2), Math.round(s2)); };
          if (t < 0.38) {
            const r = R * (0.30 + t * 1.7);
            glowDot(g, 0, 0, r * 1.5, col, 0.85);
            for (let i = 0; i < 14; i++) { const a = rnd() * Math.PI * 2, d = rnd() * r * 0.85, ramp = d / r; chunk(Math.cos(a) * d, Math.sin(a) * d, ramp < 0.35 ? '#ffffff' : ramp < 0.7 ? '#ffe9a0' : col, 1.6 - ramp * 0.6); }
            glowDot(g, 0, 0, r * 0.55, '#ffffff', 0.95);
          } else if (t < 0.72) {
            const r = R * (0.75 + t * 0.45);
            glowDot(g, 0, 0, r, col, 0.5 * (1 - t));
            for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2 + rnd() * 0.5, d = r * (0.55 + rnd() * 0.45), ramp = rnd(); chunk(Math.cos(a) * d, Math.sin(a) * d, ramp < 0.3 ? '#ffe9a0' : ramp < 0.7 ? col : shade(col, -0.4), 1.15 - t * 0.5); }
            for (let i = 0; i < 4; i++) { const a = rnd() * Math.PI * 2, d = rnd() * r * 0.5; chunk(Math.cos(a) * d, Math.sin(a) * d, 'rgba(70,70,80,0.8)', 1.5); }
          } else {
            const r = R * (1.0 + t * 0.35), fade = (1 - t) / 0.28;
            for (let i = 0; i < 6; i++) { const a = rnd() * Math.PI * 2, d = rnd() * r * 0.8, sr = px * (2.2 + rnd() * 1.4); const sg = g.createRadialGradient(Math.cos(a) * d, Math.sin(a) * d, 0, Math.cos(a) * d, Math.sin(a) * d, sr); sg.addColorStop(0, `rgba(90,90,100,${0.5 * fade})`); sg.addColorStop(1, 'rgba(90,90,100,0)'); g.fillStyle = sg; g.fillRect(Math.cos(a) * d - sr, Math.sin(a) * d - sr, sr * 2, sr * 2); }
          }
        }, 1.5));
      }
      return frames;
    });
  }

  const PARALLAX = {};

      for (let i = 0; i < 40; i++) g.fillRect(rnd() * w, 10 + rnd() * (h - 10), 3, 3);

  // ---- L4/L5/L6 ground + platform tiles (distinct palettes) ----
  SPR.ground_snow = bake(128, VH - 200, (g, w, h) => {

    g.fillStyle = 'rgba(120,150,175,0.35)'; for (let i = 0; i < 30; i++) g.fillRect(rnd() * w, 10 + rnd() * (h - 10), 3, 3);

  SPR.plat_snow = bakePlatform('#dfeef7', '#5e7891');

    g.fillStyle = 'rgba(0,0,0,0.35)'; for (let i = 0; i < 26; i++) g.fillRect(rnd() * w, 10 + rnd() * (h - 10), 3, 3);

  SPR.plat_volcano = bake(64, 16, (g) => {

  SPR.ground_hive = bake(128, VH - 200, (g, w, h) => {

  // ---- DESTRUCTIBLE COVER (ice/crystal block; two damage states) ----
  function bakeIceBlock(cracked) {
    return bake(40, 40, g => {
      const bg = g.createLinearGradient(0, 0, 40, 40);
      bg.addColorStop(0, '#dff1fb'); bg.addColorStop(0.5, '#a9d4ec'); bg.addColorStop(1, '#5b86a8');
      g.fillStyle = bg; g.strokeStyle = 'rgba(30,60,90,0.7)'; g.lineWidth = 2;
      g.fillRect(1, 1, 38, 38); g.strokeRect(1, 1, 38, 38);
      g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(4, 4, 32, 5); g.fillRect(4, 4, 5, 26);
      // facets
      g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(8, 34); g.lineTo(20, 12); g.lineTo(34, 30); g.stroke();
      if (cracked) {
        g.strokeStyle = 'rgba(20,40,60,0.85)'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(6, 6); g.lineTo(18, 20); g.lineTo(12, 34); g.moveTo(18, 20); g.lineTo(34, 16); g.moveTo(18, 20); g.lineTo(28, 36); g.stroke();
      }
    }, 1.5);
  }
  SPR.iceBlock = bakeIceBlock(false);
  SPR.iceBlockCracked = bakeIceBlock(true);

  SPR.lava = bake(64, 24, g => {

  // ---- SPAWNER-NEST (hive node; hp states) + gate door ----
  function bakeNest(dmg) {
    return bake(48, 56, g => {
      g.translate(24, 28);
      glowDot(g, 0, 0, 26, '#7dff9a', dmg ? 0.4 : 0.7);
      const bg = g.createRadialGradient(-4, -6, 3, 0, 0, 24);
      bg.addColorStop(0, dmg ? '#8a4aa0' : '#c48fff'); bg.addColorStop(0.6, '#6a2f9a'); bg.addColorStop(1, '#3a1a5a');
      g.fillStyle = bg; g.strokeStyle = 'rgba(20,10,30,0.7)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(0, 0, 20, 26, 0, 0, Math.PI * 2); g.fill(); g.stroke();
      // pulsing maw
      const mg = g.createRadialGradient(0, 2, 1, 0, 2, 12);
      mg.addColorStop(0, '#eaffe0'); mg.addColorStop(0.5, '#7dff9a'); mg.addColorStop(1, '#1a5a2a');
      g.fillStyle = mg; g.beginPath(); g.ellipse(0, 2, 9, 12, 0, 0, Math.PI * 2); g.fill();
      // spikes
      g.fillStyle = '#4a2a70'; for (const a of [-1.1, -0.4, 0.4, 1.1]) { g.save(); g.rotate(a); g.beginPath(); g.moveTo(-3, -22); g.lineTo(3, -22); g.lineTo(0, -30); g.closePath(); g.fill(); g.restore(); }
      if (dmg) { g.strokeStyle = 'rgba(20,5,10,0.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-10, -12); g.lineTo(2, 4); g.lineTo(-6, 20); g.moveTo(2, 4); g.lineTo(14, -2); g.stroke(); }
    });
  }
  SPR.nest = bakeNest(false);

  // ---- SHIELD UNIT (front shield on the LEFT; damage only from behind/above) ----
  // Rendered facing left toward oncoming players; e.facing kept = 1 so the

  // chest core: closed (armored) vs open (weak point glowing)

  // ════════════════════════════════════════════════════════════════════════
  // BOSS SPRITES — Sand Worm (L2)

  SPR.wormSeg = bake(64, 46, g => {

    g.fillStyle = hg; g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 2.4; g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(-30, 20); g.quadraticCurveTo(-34, -2, 0, -4); g.quadraticCurveTo(34, -2, 30, 20);

  function nearestPlayer(x, y) {
    let best = null, bd = 1e9;
    for (const p of players) {
      if (!p.alive || p.downed) continue;
      const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

    b.life = 200; b.color = color || '#ff5252'; b.r = 4;
    b.spr = null; b.homing = false; b.arc = false; b.grav = 0;
    sfx.enemyShot();
  }
