    LV._secret = LV.secret ? { ...LV.secret, taken: false } : null;
    checkpointX = 0;
    camX = 0;
    deathsThisLevel = 0; secretsFound = 0;
    // place spawned pickups into pool
    for (const pd of LV._pickups) placePickup(pd);
    if (LV._secret) placePickup({ x: LV._secret.x, y: LV._secret.y, kind: LV._secret.kind, _secret: true });
    // spawn players at checkpoint
    for (let k = 0; k < players.length; k++) {
      const p = players[k];
      p.x = 50 + k * 34; p.y = LV.groundY; p.vx = 0; p.vy = 0;
      p.health = p.maxHealth; p.alive = true; p.downed = false; p.invuln = 90;
      p.weapon = 'rifle'; p.specials = START_SPECIALS;
    }
    bannerBig(LV.name, 'GO!');
    startBg();
  }

  function placePickup(pd) {
    for (const pu of pickups) {
      if (pu.active) continue;
      pu.active = true; pu.x = pd.x; pu.y = pd.y; pu.kind = pd.kind; pu.weapon = pd.weapon || null;
      pu.vy = 0; pu.grounded = false; pu.t = 0; pu._secret = pd._secret || false; pu.falling = false;
      return pu;
    }
  }

  function bannerBig(t, s) { bannerText = t; bannerSub = s || ''; bannerT = 150; }

  // ════════════════════════════════════════════════════════════════════════
  // INPUT — one unified read merging pad + keyboard + touch, per player.
  // Held state polled; edges (jump/special/start/confirm) derived vs prev.
  // ════════════════════════════════════════════════════════════════════════
  const keys = {};
  const touchAct = {};
  const prevHeld = [{}, {}];

  window.addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = true;
    // prevent page scroll on arrows/space
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    if (!audioCtx) ensureAudio();
  }, { passive: false });
  window.addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });

  // touch buttons
  document.querySelectorAll('.controls .btn').forEach(btn => {
    const act = btn.getAttribute('data-act');
    const on = e => { e.preventDefault(); touchAct[act] = true; btn.classList.add('held'); if (!audioCtx) ensureAudio(); };
    const off = e => { e.preventDefault(); touchAct[act] = false; btn.classList.remove('held'); };
    btn.addEventListener('touchstart', on, { passive: false });
    btn.addEventListener('touchend', off, { passive: false });
    btn.addEventListener('touchcancel', off, { passive: false });
    btn.addEventListener('mousedown', on);
    btn.addEventListener('mouseup', off);
    btn.addEventListener('mouseleave', off);
  });
  document.getElementById('pauseBtn').addEventListener('click', () => { if (state === PLAYING) togglePause(); else if (state === PAUSED) togglePause(); });

  function rawHeld(idx) {
    let L = false, R = false, U = false, D = false, shoot = false, jump = false, special = false, strafe = false, start = false, confirm = false, cancel = false;
    if (PADS && PADS[idx] && PADS[idx].connected) {
      const p = PADS[idx];
      L = p.button('left') || p.axis('lx') < -0.35;
      R = p.button('right') || p.axis('lx') > 0.35;
      U = p.button('up') || p.axis('ly') < -0.35;
      D = p.button('down') || p.axis('ly') > 0.35;
      shoot = p.button('west') || p.button('r2');
      jump = p.button('south');
      special = p.button('north');
      strafe = p.button('l1') || p.button('r1');
      start = p.button('start');
      confirm = p.button('south');
      cancel = p.button('east');
    }
    if (idx === 0) {
      if (keys['arrowleft'] || keys['a']) L = true;
      if (keys['arrowright'] || keys['d']) R = true;
      if (keys['arrowup'] || keys['w']) U = true;
      if (keys['arrowdown'] || keys['s']) D = true;
      if (keys['x']) shoot = true;
      if (keys['z']) jump = true;
      if (keys['c']) special = true;
      if (keys['shift']) strafe = true;
      if (keys['Enter']) { start = true; confirm = true; }
      if (keys['p'] || keys['Escape']) start = true;
      if (touchAct.left) L = true; if (touchAct.right) R = true;
      if (touchAct.up) U = true; if (touchAct.down) D = true;
      if (touchAct.ul) { U = true; L = true; } if (touchAct.ur) { U = true; R = true; }
      if (touchAct.shoot) shoot = true;
      if (touchAct.jump) { jump = true; confirm = true; }
      if (touchAct.special) special = true;
    } else {
      // P2 keyboard fallback (couch second set): IJKL + G/H/B
      if (keys['j']) L = true; if (keys['l']) R = true;
      if (keys['i']) U = true; if (keys['k']) D = true;
      if (keys['g']) shoot = true; if (keys['h']) { jump = true; confirm = true; }
      if (keys['b']) special = true; if (keys['n']) strafe = true;
    }
    return { L, R, U, D, shoot, jump, special, strafe, start, confirm, cancel };
  }
  // edge helper: was this control just pressed for player idx this frame?
  function edge(idx, held, name) {
    const prev = prevHeld[idx];
    const now = held[name];
    return now && !prev[name];
  }

  // Menu edges: aggregate from either pad + keyboard (P1). P2 handled separately.
  function anyMenuEdge(name) {
    return edge(0, curHeld[0], name) || (p2Present && edge(1, curHeld[1], name));
  }

  let curHeld = [{}, {}];

  // ════════════════════════════════════════════════════════════════════════
  // PLAYER LOGIC
  // ════════════════════════════════════════════════════════════════════════
  function groundYatX(x) {
    // pits create gaps; return VH+400 (no ground) if over a pit
    for (const pit of LV.pits) if (x > pit.x0 && x < pit.x1) return VH + 400;
    return LV.groundY;
  }
  function platformUnder(x, feetY, prevFeetY, vy) {
    // one-way platforms: land if falling and crossing the top this frame
    if (vy < 0) return null;
    for (const pl of LV.platforms) {
      if (x > pl.x - pl.w / 2 - 6 && x < pl.x + pl.w / 2 + 6) {
        if (prevFeetY <= pl.y + 2 && feetY >= pl.y - 0.5) return pl;
      }
    }
    return null;
  }

  function updatePlayer(p) {
    if (!p.alive) return;
    const h = curHeld[p.idx];

    if (p.downed) {
      // downed marker: gravity to ground, revive check
      p.vy += GRAV; p.y += p.vy;
      const gy = groundYatX(p.x);
      if (p.y >= gy) { p.y = gy; p.vy = 0; }
      // if over a pit while downed, just hold at ground level
      if (gy > VH) { p.y = LV.groundY; }
      p.downTimer--;
      // revive by partner nearby
      let reviver = null;
      for (const o of players) { if (o !== p && o.alive && !o.downed && Math.abs(o.x - p.x) < 30 && Math.abs(o.y - p.y) < 40) reviver = o; }
      if (reviver) { p.reviveProg++; if (p.reviveProg >= REVIVE_NEED) { revivePlayer(p); return; } }
      else p.reviveProg = Math.max(0, p.reviveProg - 2);
      if (p.downTimer <= 0) {
        // auto-respawn (solo or timed out) unless both down -> checkpoint
        respawnPlayer(p, true);
      }
      return;
    }

    if (p.respawnT > 0) { p.respawnT--; return; }

    // timers
    if (p.invuln > 0) p.invuln--;
    if (p.flash > 0) p.flash--;
    if (p.muzzle > 0) p.muzzle--;
    if (p.shieldTime > 0) p.shieldTime--;
    if (p.ddmgTime > 0) p.ddmgTime--;
    if (p.cd > 0) p.cd--;

    // horizontal + facing
    let move = 0;
    if (h.L) move -= 1; if (h.R) move += 1;
    // prone: grounded + down + no horizontal
    p.prone = p.grounded && h.D && move === 0;

    if (!p.prone) {
      p.vx = move * RUN;
      if (move !== 0 && !h.strafe) p.facing = move;
    } else p.vx = 0;

    // jump
    if (p.grounded || p.coyote > 0) {
      if (edge(p.idx, h, 'jump') && !p.prone) { p.vy = JUMP_V; p.grounded = false; p.coyote = 0; sfx.jump(); }
    }
    if (p.coyote > 0) p.coyote--;

    // gravity
    p.vy += GRAV; if (p.vy > MAX_FALL) p.vy = MAX_FALL;

    const prevFeet = p.y;
    p.x += p.vx; p.y += p.vy;

    // world bounds (block at edges rather than split camera)
    const leftLimit = camX + 8, rightLimit = camX + VW - 8;
    if (p.x < leftLimit) p.x = leftLimit;
    if (p.x > rightLimit) p.x = rightLimit;
    if (p.x < 8) p.x = 8;
    if (p.x > LV.worldW - 8) p.x = LV.worldW - 8;

    // ground / platform collision
    p.grounded = false;
    const gy = groundYatX(p.x);
    const plat = platformUnder(p.x, p.y, prevFeet, p.vy);
    if (plat && p.y >= plat.y && prevFeet <= plat.y + 6) { p.y = plat.y; p.vy = 0; p.grounded = true; p.coyote = 6; }
    else if (p.y >= gy) {
      if (gy > VH) {
        // fell into a pit (kid-proof: lose a segment, respawn on ground)
        if (p.y > VH + 30) { pitFall(p); return; }
      } else { p.y = gy; p.vy = 0; p.grounded = true; p.coyote = 6; }
    }

    // conveyor push
    for (const hz of LV.hazards) {
      if (hz.type === 'conveyor' && p.grounded && Math.abs(p.y - hz.y) < 4 && p.x > hz.x - hz.w / 2 && p.x < hz.x + hz.w / 2) {
        p.x += hz.dir * (hz.speed || 1);
      }
    }

    // ── blizzard gust: TELEGRAPHED horizontal wind. The push is weaker than
    //    run speed, so controls stay TIGHT — no slipperiness. ──
    for (const hz of LV.hazards) {
      if (hz.type === 'blizzard' && hz.gust === 2) p.x += hz.dir * hz.strength;
      else if (hz.type === 'spawner' && hz.hp > 0) { const bar = hz.x - 46; if (p.x > bar) { p.x = bar; if (p.vx > 0) p.vx = 0; } }
    }

    // ── destructible cover: solid until shot out; stand on top or bump aside
    //    (blocks are shorter than a jump, so they can never trap a kid). ──
    for (const hz of LV.hazards) {
      if (hz.type !== 'destructible' || hz.hp <= 0) continue;
      const dl = hz.x - hz.w / 2, dr = hz.x + hz.w / 2, dtop = hz.y - hz.h;
      const ph2 = p.prone ? PRONE_H : PLH;
      if (p.x + p.w / 2 > dl && p.x - p.w / 2 < dr && p.y - ph2 < hz.y && p.y > dtop) {
        if (prevFeet <= dtop + 6 && p.vy >= 0) { p.y = dtop; p.vy = 0; p.grounded = true; p.coyote = 6; }
        else { p.x = p.x < hz.x ? dl - p.w / 2 : dr + p.w / 2; }
      }
    }

    // ── rising lava: touching costs 1 segment + bump to the last solid
    //    platform. NEVER an instakill. ──
    const lava = LV._lava;
    if (lava && lava.cur < VH + 20) {
      if (p.grounded && p.y <= lava.cur - 2) { p.lastSafeX = p.x; p.lastSafeY = p.y; }
      if (p.invuln <= 0 && p.respawnT <= 0 && !p.downed && p.y > lava.cur - 2) lavaHit(p, lava);
    } else if (p.grounded) { p.lastSafeX = p.x; p.lastSafeY = p.y; }

    // aim vector (8-way)
    computeAim(p, h);

    // shoot
    if (h.shoot) fireWeapon(p);

    // special / bomb
    if (edge(p.idx, h, 'special') && p.specials > 0) doSpecial(p);

    // walk animation
    if (Math.abs(p.vx) > 0.2 && p.grounded) { p.walkT++; if (p.walkT > 6) { p.walkT = 0; p.walkFrame ^= 1; } }
    else p.walkFrame = 0;
  }

  function computeAim(p, h) {
    let ax = 0, ay = 0;
    const hor = (h.L ? -1 : 0) + (h.R ? 1 : 0);
    if (p.prone) { ax = p.facing; ay = 0.15; }
    else if (!p.grounded && h.D && hor === 0) { ax = 0; ay = 1; }        // straight down (air)
    else if (h.U && hor === 0) { ax = 0; ay = -1; }                       // straight up
    else if (h.U && hor !== 0) { ax = hor; ay = -1; }                      // up-diagonal
    else if (!p.grounded && h.D && hor !== 0) { ax = hor; ay = 1; }        // down-diagonal (air)
    else if (hor !== 0) { ax = hor; ay = 0; }                              // horizontal
    else { ax = p.facing; ay = 0; }                                        // idle: face
    const d = Math.hypot(ax, ay) || 1;
    p.aimx = ax / d; p.aimy = ay / d;
  }

  function fireWeapon(p) {
    if (p.cd > 0) return;
    const w = WEAPONS[p.weapon];
    p.cd = w.cd;
    ensureAudio(); sfx[w.sfx]();
    const gunLen = 12;
    const sx = p.x + p.aimx * gunLen;
    const sy = (p.prone ? p.y - PRONE_H * 0.5 : p.y - PLH * 0.55) + p.aimy * gunLen;
    p.muzzle = 4;
    p.muzzleX = sx; p.muzzleY = sy;
    const baseAng = Math.atan2(p.aimy, p.aimx);
    const dmg = w.dmg * (p.ddmgTime > 0 ? 2 : 1);
    for (let i = 0; i < w.count; i++) {
      const off = w.count > 1 ? (i - (w.count - 1) / 2) * w.spread : (Math.random() - 0.5) * w.spread;
      const ang = baseAng + off;
      const b = pbullets[_pbI]; _pbI = (_pbI + 1) % PB_MAX;
      b.active = true; b.x = sx; b.y = sy;
      b.vx = Math.cos(ang) * w.speed; b.vy = Math.sin(ang) * w.speed;
      b.dmg = dmg; b.pierce = w.pierce; b.life = w.kind === 'laser' ? 40 : 70;
      b.kind = w.kind; b.color = w.weaponColor || w.color; b.owner = p.idx; b.ang = ang;
      b.hitset = w.pierce ? new Set() : null;
      shotsFired++;
    }
  }

  function doSpecial(p) {
    p.specials--;
    ensureAudio(); sfx.special();
    bombFlash = 18; shake = Math.max(shake, 14);
    p.invuln = Math.max(p.invuln, 50);
    boom(p.x, p.y - 14, 120, '#ffce4d');
    // clear all enemy bullets on screen + damage all enemies
    for (const b of ebullets) if (b.active && b.x > camX - 20 && b.x < camX + VW + 20) b.active = false;
    for (const e of enemies) if (e.active && e.x > camX - 40 && e.x < camX + VW + 40) damageEnemy(e, 4, p, e.x, e.y - e.h / 2);
    if (boss && bossVuln(boss)) damageBoss(6, p);
    floatText(p.x, p.y - 40, 'BOOM!', '#ffce4d', 16);
  }

  function pitFall(p) {
    hurtPlayer(p, true);
    if (!p.downed && p.alive) {
      // place back on nearest solid ground
      p.x = Math.max(camX + 30, p.x - 40);
      // find x not in a pit
      let safe = p.x;
      for (let tries = 0; tries < 40; tries++) { if (groundYatX(safe) < VH) break; safe -= 20; }
      p.x = Math.max(8, safe); p.y = LV.groundY - 40; p.vy = 0; p.invuln = INVULN;
    }
  }

  function lavaHit(p, lava) {
    hurtPlayer(p, true);
    if (p.downed || !p.alive) return;
    // bump to the last safe platform above the lava (or the nearest one)
    let tx = p.lastSafeX, ty = p.lastSafeY;
    if (ty == null || ty > lava.cur - 4) {
      let best = null, bd = 1e9;
      for (const pl of LV.platforms) { if (pl.y < lava.cur - 6) { const d = Math.abs(pl.x - p.x); if (d < bd) { bd = d; best = pl; } } }
      if (best) { tx = best.x; ty = best.y; } else { tx = p.x; ty = lava.cur - 60; }
    }
    p.x = tx; p.y = ty - 1; p.vx = 0; p.vy = 0; p.grounded = true; p.invuln = INVULN;
    floatText(p.x, p.y - 40, 'LAVA!', '#ff7a2a', 12);
  }

  function hurtPlayer(p, force) {
    if (!p.alive || p.downed) return;
    if (!force && (p.invuln > 0 || p.respawnT > 0)) return;
    if (p.shieldTime > 0) { p.shieldTime = 0; p.invuln = INVULN; floatText(p.x, p.y - 36, 'SHIELD!', '#7fdcff', 11); sfx.hit(); return; }
    p.health--;
    p.invuln = INVULN; p.flash = INVULN;
    p.vx = -p.facing * 2; p.vy = -3;
    sfx.playerHit();
    combo = 0;
    if (p.health <= 0) downPlayer(p);
  }

  function downPlayer(p) {
    p.downed = true; p.downTimer = DOWN_TIME; p.reviveProg = 0; p.vy = -2;
    deathsThisLevel++;
    sfx.downed();
    floatText(p.x, p.y - 40, 'DOWNED!', '#ff5252', 13);
    // both down -> checkpoint respawn
    const anyUp = players.some(o => o !== p && o.alive && !o.downed);
    if (!anyUp) {
      // respawn all at checkpoint after a brief beat
      setTimeout(() => {}, 0);
      checkpointRespawn();
    }
  }

  function revivePlayer(p) {
    p.downed = false; p.health = 2; p.invuln = INVULN; p.reviveProg = 0;
    sfx.revive();
    floatText(p.x, p.y - 40, 'REVIVED!', '#5dd66c', 13);
  }

  function respawnPlayer(p, keepPlace) {
    p.downed = false; p.health = p.maxHealth; p.invuln = INVULN; p.shieldTime = RESPAWN_SHIELD;
    p.weapon = 'rifle'; p.reviveProg = 0;
    if (!keepPlace) { p.x = camX + 40; }
    p.y = LV.groundY - 30; p.vy = 0;
    floatText(p.x, p.y - 40, 'RESPAWN', '#7fdcff', 12);
  }

  function checkpointRespawn() {
    // move camera + all players back to last checkpoint
    const cp = checkpointX;
    for (let k = 0; k < players.length; k++) {
      const p = players[k];
      p.downed = false; p.alive = true; p.health = p.maxHealth; p.weapon = 'rifle';
      p.x = cp + 40 + k * 30; p.y = LV.groundY - 30; p.vx = 0; p.vy = 0;
      p.invuln = 120; p.shieldTime = RESPAWN_SHIELD;
    }
    camX = Math.max(0, cp);
    // if boss arena, keep boss but heal players; else clear nearby enemies
    if (!arena.active) for (const e of enemies) if (e.active && Math.abs(e.x - cp) < VW) e.active = false;
    bannerBig('CHECKPOINT', 'TRY AGAIN!');
  }

  // ════════════════════════════════════════════════════════════════════════
  // DAMAGE
  // ════════════════════════════════════════════════════════════════════════
  function addScore(pts, x, y, byPlayer) {
    const mult = 1 + Math.min(9, combo) * 0.1;
    const total = Math.round(pts * mult);
    score += total;
    if (byPlayer) byPlayer.kills++;
    if (x != null) floatText(x, y, '+' + total, '#ffe066', 10);
  }

  function damageEnemy(e, dmg, byPlayer, wx, wy) {
    if (!e.active) return;
    // STAGE 2 hook: front-armored (shield unit) rejects frontal hits
    if (e.def.frontArmor && byPlayer) {
      const fromFront = Math.sign(wx - e.x) === -e.facing; // hit coming from the side it faces
      const fromAbove = wy < e.y - e.h * 0.7;
      if (fromFront && !fromAbove) { sfx.clang(); return; }
    }
    e.hp -= dmg; e.flash = 3;
    sfx.hit();
    if (e.hp <= 0) killEnemy(e, byPlayer);
  }
  function killEnemy(e, byPlayer) {
    e.active = false;
    boom(e.x, e.y - e.h / 2, e.def.w > 36 ? 60 : 34, '#ff9944');
    spawnParts(e.x, e.y - e.h / 2, e.def.w > 36 ? 10 : 6);
    sfx.kill();
    combo++; comboTimer = 110;
    addScore(e.points, e.x, e.y - e.h - 6, byPlayer);
    if (combo >= 3 && combo % 3 === 0) floatText(e.x, e.y - e.h - 18, 'COMBO x' + combo, '#ff5cae', 11);
  }

  // Is the boss's weak point currently exposed? While open, body hits count as
  // damage — the weak-point core sits mid-body, so requiring a pixel-perfect
  // core hit means bullets clang on the outer hull first and the boss can never
  // be damaged by shooting (only the special bomb worked). Windowed bosses are
  // still only vulnerable during their opening; spidertank/battleship expose a
  // permanent cockpit/pods, so they read as always-open.
  function bossVuln(b) {
    switch (LV.boss) {
      case 'gorilla':
      case 'crystaltitan': return !!b.core;
      case 'aliendrill':   return !!b.core && !b.hidden;
      case 'sandworm':     return !!b.reared;
      case 'spidertank':
      case 'battleship':   return true;
      default:             return !!b.core;
    }
  }

  function damageBoss(dmg, byPlayer) {
    if (!boss) return;
    boss.hp -= dmg; boss.flash = 4;
    sfx.bossHurt();
    score += 20 * dmg;
    spawnParts(boss.x, boss.y - 74, 4);
    if (boss.hp <= 0) defeatBoss();
  }

  let bossDefeatSeq = 0;
  function defeatBoss() {
    if (bossDefeatSeq > 0) return;
    bossDefeatSeq = 130;
    slowmo = 90;
    sfx.bossRoar();
    // score for boss kill
    score += 5000;
  }

  // ════════════════════════════════════════════════════════════════════════
  // WEAPON POD + PICKUPS
  // ════════════════════════════════════════════════════════════════════════
  let pod = null, podTimer = 600;
  function updatePod() {
    podTimer--;
    if (!pod && podTimer <= 0 && state === PLAYING && !arena.active) {
      pod = { x: camX - 30, y: 60 + Math.random() * 40, vx: 1.6, hp: 2, t: 0 };
      podTimer = 900 + Math.random() * 600;
    }
    if (pod) {
      pod.x += pod.vx; pod.t++;
      pod.y += Math.sin(pod.t * 0.05) * 0.6;
      if (pod.x > camX + VW + 40) pod = null;
    }
  }
  function hitPod(byPlayer) {
    pod.hp--;
    if (pod.hp <= 0) {
      // drop a random weapon icon that falls
      const w = WEAPON_DROP_ORDER[Math.floor(Math.random() * 3)];
      const pu = placePickup({ x: pod.x, y: pod.y, kind: 'weapon', weapon: w });
      if (pu) { pu.falling = true; pu.vy = 1; }
      boom(pod.x, pod.y, 40, '#ffce4d'); sfx.kill();
      floatText(pod.x, pod.y - 20, 'WEAPON!', '#ffce4d', 11);
      pod = null;
    } else sfx.hit();
  }

  function updatePickups() {
    for (const pu of pickups) {
      if (!pu.active) continue;
      pu.t++;
      if (pu.falling) {
        pu.vy += 0.2; pu.y += pu.vy;
        const gy = LV.groundY - 14;
        // land on platform or ground
        let landed = gy;
        for (const pl of LV.platforms) if (pu.x > pl.x - pl.w / 2 && pu.x < pl.x + pl.w / 2 && pu.y >= pl.y - 14) { landed = Math.min(landed, pl.y - 14); }
        if (pu.y >= landed) { pu.y = landed; pu.falling = false; pu.vy = 0; }
      }
      // pickup collision
      for (const p of players) {
        if (!p.alive || p.downed) continue;
        if (Math.abs(p.x - pu.x) < 22 && Math.abs((p.y - PLH / 2) - pu.y) < 26) { grabPickup(pu, p); break; }
      }
    }
  }
  function grabPickup(pu, p) {
    pu.active = false;
    ensureAudio();
    if (pu.kind === 'weapon') { p.weapon = pu.weapon; sfx.pickup(); floatText(p.x, p.y - 40, WEAPONS[pu.weapon].name, WEAPONS[pu.weapon].color, 11); }
    else if (pu.kind === 'shield') { p.shieldTime = 600; sfx.shield(); floatText(p.x, p.y - 40, 'SHIELD', '#7fdcff', 11); }
    else if (pu.kind === 'ddmg') { p.ddmgTime = 600; sfx.shield(); floatText(p.x, p.y - 40, '2X DAMAGE', '#ff5cae', 11); }
    else if (pu.kind === 'special') { p.specials++; sfx.pickup(); floatText(p.x, p.y - 40, '+1 BOMB', '#ffce4d', 11); }
    else if (pu.kind === 'chicken') { secretsFound++; score += 2000; sfx.confirm(); floatText(p.x, p.y - 44, 'SECRET! +2000', '#ffd24d', 13); }
  }

  // ════════════════════════════════════════════════════════════════════════
  // BULLETS / COLLISIONS
  // ════════════════════════════════════════════════════════════════════════
  function updatePlayerBullets() {
    for (const b of pbullets) {
      if (!b.active) continue;
      b.x += b.vx; b.y += b.vy;
      if (--b.life <= 0 || b.x < camX - 40 || b.x > camX + VW + 40 || b.y < -40 || b.y > VH + 40) { b.active = false; continue; }
      // vs pod
      if (pod && Math.abs(b.x - pod.x) < 20 && Math.abs(b.y - pod.y) < 14) { if (!b.pierce) b.active = false; hitPod(players[b.owner]); if (!b.pierce) continue; }
      // vs destructible cover + spawner nests (shoot them out)
      for (const hz of LV.hazards) {
        if (hz.type === 'destructible' && hz.hp > 0) {
          if (b.x > hz.x - hz.w / 2 && b.x < hz.x + hz.w / 2 && b.y > hz.y - hz.h && b.y < hz.y) {
            hz.hp -= b.dmg; sfx.hit(); spawnDebris(b.x, b.y, '#a9d4ec', 3);
            if (hz.hp <= 0) { boom(hz.x, hz.y - hz.h / 2, 34, '#8fe6ff'); spawnParts(hz.x, hz.y - hz.h / 2, 6); addScore(50, hz.x, hz.y - hz.h, players[b.owner]); }
            if (!b.pierce) b.active = false;
            break;
          }
        } else if (hz.type === 'spawner' && hz.hp > 0) {
          if (b.x > hz.x - 20 && b.x < hz.x + 20 && b.y > hz.y - 56 && b.y < hz.y - 2) {
            damageSpawner(hz, b.dmg, players[b.owner]); shotsHit++;
            if (!b.pierce) b.active = false;
            break;
          }
        }
      }
      if (!b.active) continue;
      // vs enemies
      let hitSomething = false;
      for (const e of enemies) {
        if (!e.active) continue;
        if (b.hitset && b.hitset.has(e)) continue;
        if (b.x > e.x - e.w / 2 && b.x < e.x + e.w / 2 && b.y > e.y - e.h && b.y < e.y) {
          damageEnemy(e, b.dmg, players[b.owner], b.x, b.y);
          shotsHit++;
          if (b.hitset) b.hitset.add(e); else { b.active = true; hitSomething = true; }
          if (!b.pierce) { b.active = false; break; }
        }
      }
      if (!b.active) continue;
      // vs boss
      if (boss && bossDefeatSeq === 0) {
        const bd = BOSS_DEFS[LV.boss];
        const hitBody = b.x > boss.x - boss.w / 2 && b.x < boss.x + boss.w / 2 && b.y > boss.y - boss.h && b.y < boss.y;
        if (hitBody) {
          if (bossVuln(boss) || bd.coreHit(boss, b.x, b.y)) { damageBoss(b.dmg, players[b.owner]); shotsHit++; if (!b.pierce) { b.active = false; } }
          else { sfx.clang(); if (!b.pierce) { b.active = false; boom(b.x, b.y, 16, '#ffce4d'); } }
        }
      }
    }
  }

  function updateEnemyBullets() {
    for (const b of ebullets) {
      if (!b.active) continue;
      if (b.color === 'barrel') { b.vy = (b.vy || 0) + (b.grav || 0.22); b.spin = (b.spin || 0) + 0.16; }
      else if (b.arc) { b.vy = (b.vy || 0) + (b.grav || 0.16); b.spin = Math.atan2(b.vy, b.vx); }
      else if (b.homing) {
        const tgt = nearestPlayer(b.x, b.y);
        if (tgt) {
          const desired = Math.atan2((tgt.y - PLH * 0.5) - b.y, tgt.x - b.x), cur = Math.atan2(b.vy, b.vx);
          let dA = desired - cur; while (dA > Math.PI) dA -= 2 * Math.PI; while (dA < -Math.PI) dA += 2 * Math.PI;
          const turn = b.turn || 0.045, na = cur + Math.max(-turn, Math.min(turn, dA)), sp = Math.min(3.3, Math.hypot(b.vx, b.vy) + 0.06);
          b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
        }
        b.spin = Math.atan2(b.vy, b.vx);
      }
      b.x += b.vx; b.y += b.vy;
      // blocked by destructible cover
      let eBlocked = false;
      for (const hz of LV.hazards) if (hz.type === 'destructible' && hz.hp > 0 && b.x > hz.x - hz.w / 2 && b.x < hz.x + hz.w / 2 && b.y > hz.y - hz.h && b.y < hz.y) { b.active = false; eBlocked = true; break; }
      if (eBlocked) continue;
      // barrels bounce on ground once
      if (b.color === 'barrel' && b.y >= LV.groundY - 6) { b.y = LV.groundY - 6; b.vy = -b.vy * 0.4; if (Math.abs(b.vy) < 1.5) { boom(b.x, b.y, 30, '#ff9944'); b.active = false; continue; } }
      // arcing shots: bombs blast on the ground; everything else splats
      if (b.arc && b.y >= LV.groundY - 2) { if (b.explodeOnGround) { boom(b.x, LV.groundY - 6, 42, '#ff9944'); sfx.boom(); shake = Math.max(shake, 6); } else spawnDebris(b.x, LV.groundY - 2, b.splat || '#d0a860', 4); b.active = false; continue; }
      if (--b.life <= 0) { if (b.homing) boom(b.x, b.y, 26, '#ff9944'); b.active = false; continue; }
      if (b.x < camX - 60 || b.x > camX + VW + 60 || b.y > VH + 40 || b.y < -60) { b.active = false; continue; }
      for (const p of players) {
        if (!p.alive || p.downed || p.invuln > 0 || p.respawnT > 0) continue;
        const ph = p.prone ? PRONE_H : PLH;
        if (b.x > p.x - p.w / 2 && b.x < p.x + p.w / 2 && b.y > p.y - ph && b.y < p.y) { hurtPlayer(p); if (b.homing) boom(b.x, b.y, 26, '#ff9944'); b.active = false; break; }
      }
    }
  }

  function updateEnemies() {
    for (const e of enemies) {
      if (!e.active) continue;
      if (e.flash > 0) e.flash--;
      e.def.update(e);
      if (!e.def.flying && !e.def.static) {
        e.vy = (e.vy || 0) + GRAV; e.y += e.vy;
        const gy = groundYatX(e.x);
        if (e.y >= gy) { e.y = gy < VH ? gy : LV.groundY; e.vy = 0; }
        e.x += e.vx;
      } else if (e.def.flying) {
        e.x += e.vx;
      }
      // cull far behind
      if (e.x < camX - 120 || e.x > LV.worldW + 60) { if (e.x < camX - 200) e.active = false; }
      // contact damage
      if (e.def.contact) {
        for (const p of players) {
          if (!p.alive || p.downed || p.invuln > 0 || p.respawnT > 0) continue;
          const ph = p.prone ? PRONE_H : PLH;
          if (Math.abs(p.x - e.x) < (p.w / 2 + e.w / 2) && p.y - ph < e.y && p.y > e.y - e.h) { hurtPlayer(p); }
        }
      }
    }
  }

  // boss contact damage to players
  function bossContact() {
    if (!boss || bossDefeatSeq > 0 || boss.mode === 'enter' || boss.state === 'enter' || boss.hidden) return;
    for (const p of players) {
      if (!p.alive || p.downed || p.invuln > 0 || p.respawnT > 0) continue;
      const ph = p.prone ? PRONE_H : PLH;
      // contact hitbox is tighter than the visual body so you can stand at a
      // boss's edges to shoot without being chip-damaged just for being close
      if (Math.abs(p.x - boss.x) < boss.w * 0.34 + p.w / 2 && p.y - ph < boss.y && p.y > boss.y - boss.h) hurtPlayer(p);
    }
  }

  // ════════════════════════════════════════════════════════════════════════
  // HAZARDS — crushers (telegraphed piston) + moving platforms. Conveyor push
  // is applied in updatePlayer. All are kid-proof: 1 segment, never instakill.
  // hz.cur = current y of the crusher-head TOP (sprite is 22px tall).
  // ════════════════════════════════════════════════════════════════════════
  function updateHazards() {
    for (const hz of LV.hazards) {
      if (hz.type === 'crusher') {
        const P = hz.period || 180;
        hz.t = (hz.t || 0) + 1;
        const ph = (hz.t + (hz.phase || 0)) % P;
        const upEnd = P * 0.5, slamEnd = upEnd + 12, holdEnd = slamEnd + 28;
        if (ph < upEnd) { hz.cur = hz.top; hz.warn = ph > upEnd - 30; hz.slamming = false; }
        else if (ph < slamEnd) { hz.cur = hz.top + (hz.reach - hz.top) * ((ph - upEnd) / 12); hz.warn = false; hz.slamming = true; }
        else if (ph < holdEnd) { hz.cur = hz.reach; hz.slamming = true; }
        else { hz.cur = hz.reach + (hz.top - hz.reach) * ((ph - holdEnd) / (P - holdEnd)); hz.warn = false; hz.slamming = false; }
        if (Math.floor(ph) === Math.floor(slamEnd)) { shake = Math.max(shake, 6); if (Math.abs(hz.x - (camX + VW / 2)) < VW) sfx.clang(); }
        if (hz.slamming) {
          const headBottom = hz.cur + 22;
          for (const p of players) {
            if (!p.alive || p.downed || p.invuln > 0 || p.respawnT > 0) continue;
            const ph2 = p.prone ? PRONE_H : PLH;
            if (p.x > hz.x - hz.w / 2 && p.x < hz.x + hz.w / 2 && headBottom > p.y - ph2 && hz.cur < p.y) {
              hurtPlayer(p);
              p.x = p.x < hz.x ? hz.x - hz.w / 2 - p.w : hz.x + hz.w / 2 + p.w; // shove clear, never trap
            }
          }
        }
      } else if (hz.type === 'blizzard') {
        // TELEGRAPHED gust cycle: calm -> warn -> active gust -> calm.
        hz.t = (hz.t || 0) + 1;
        const P = hz.period, ph = hz.t % P;
        const warnAt = hz.calmLen, gustAt = hz.calmLen + hz.warnLen, gustEnd = gustAt + hz.gustLen;
        hz.dir = (Math.floor(hz.t / P) % 2 === 0) ? -1 : 1;
        const prev = hz.gust;
        hz.gust = ph < warnAt ? 0 : ph < gustAt ? 1 : ph < gustEnd ? 2 : 0;
        if (hz.gust === 2 && prev !== 2) { sfx.enemyShot(); shake = Math.max(shake, 4); }
      } else if (hz.type === 'lava') {
        hz.t = (hz.t || 0) + 1;
        if (hz.bossRecede) { hz.cur = Math.min(hz.low, hz.cur + hz.fallSpd); } // boss reached: drop & stay
        else if (hz.phase === 'low') { if (--hz.timer <= 0) { hz.phase = 'rising'; shake = Math.max(shake, 4); sfx.rumble && sfx.rumble(); } }
        else if (hz.phase === 'rising') { hz.cur -= hz.riseSpd; if (hz.cur <= hz.high) { hz.cur = hz.high; hz.phase = 'high'; hz.timer = hz.holdHigh; } }
        else if (hz.phase === 'high') { if (--hz.timer <= 0) hz.phase = 'falling'; }
        else if (hz.phase === 'falling') { hz.cur += hz.fallSpd; if (hz.cur >= hz.low) { hz.cur = hz.low; hz.phase = 'low'; hz.timer = hz.holdLow; } }
      } else if (hz.type === 'spawner') {
        if (hz.hp <= 0) { hz.open = true; continue; }
        hz.st = (hz.st || 0) + 1;
        if (hz.x < camX + VW + 40 && hz.x > camX - 100) {
          let alive = 0; for (const e of enemies) if (e.active) alive++;
          if (hz.st % hz.interval === 0 && alive < 7) spawnEnemy(hz.spawnType, hz.x - 30, 0);
        }
      }
    }
  }
  function damageSpawner(hz, dmg, byPlayer) {
    hz.hp -= dmg; sfx.hit();
    if (hz.hp <= 0) {
      hz.hp = 0; hz.open = true;
      boom(hz.x, hz.y - 28, 58, '#7dff9a'); spawnParts(hz.x, hz.y - 28, 12); shake = Math.max(shake, 10);
      addScore(800, hz.x, hz.y - 62, byPlayer); floatText(hz.x, hz.y - 72, 'NEST DOWN!', '#7dff9a', 12); sfx.kill();
    }
  }
  function updateMovingPlatforms() {
    for (const pl of LV.platforms) {
      if (!pl.move) continue;
      const m = pl.move;
      if (m.base === undefined) m.base = m.axis === 'x' ? pl._ox : pl._oy;
      m.t = (m.t || 0) + (m.speed || 0.02);
      const val = m.base + Math.sin(m.t) * (m.amp || 30);
      const nx = m.axis === 'x' ? val : pl.x, ny = m.axis === 'y' ? val : pl.y;
      const dx = nx - pl.x, dy = ny - pl.y;
      for (const p of players) {
        if (!p.alive || p.downed) continue;
        if (p.grounded && Math.abs(p.y - pl.y) < 3 && p.x > pl.x - pl.w / 2 - 4 && p.x < pl.x + pl.w / 2 + 4) { p.x += dx; p.y += dy; }
      }
      pl.x = nx; pl.y = ny;
    }
  }

  // ════════════════════════════════════════════════════════════════════════
  // WAVES + PROGRESSION
  // ════════════════════════════════════════════════════════════════════════
  function updateWaves() {
    const front = camX + VW;
    for (const w of LV.waves) {
      if (w.done) continue;
      if (front >= w.x) {
        w.done = true;
        for (const s of w.spawns) spawnEnemy(s.type, s.x, s.y);
      }
    }
    // checkpoints
    for (const cp of LV.checkpoints) { if (cp > checkpointX && camX + VW / 2 > cp) checkpointX = cp; }
    // boss trigger
    if (!arena.active && !boss && camX + VW >= LV.bossArenaX0 + 30) {
      startBossFight();
    }
  }

  function startBossFight() {
    arena.active = true;
    arena.x0 = LV.bossArenaX0; arena.x1 = LV.bossArenaX0 + VW;
    camLockX = Math.min(LV.worldW - VW, LV.bossArenaX0);
    // volcano: reaching the boss arena drops the lava for good (stays low)
    for (const hz of LV.hazards) if (hz.type === 'lava') hz.bossRecede = true;
    // clear stragglers
    for (const e of enemies) if (e.active) e.active = false;
    boss = { def: BOSS_DEFS[LV.boss], hp: BOSS_DEFS[LV.boss].maxHp, maxHp: BOSS_DEFS[LV.boss].maxHp, w: BOSS_DEFS[LV.boss].w, h: BOSS_DEFS[LV.boss].h, flash: 0, t: 0 };
    BOSS_DEFS[LV.boss].spawn(boss, camLockX + VW * 0.5);
    checkpointX = LV.bossArenaX0;
    bannerBig('BOSS', BOSS_DEFS[LV.boss].name);
  }

  function updateBossDefeat() {
    if (bossDefeatSeq <= 0) return;
    bossDefeatSeq--;
    // multi-explosion sequence
    if (bossDefeatSeq % 8 === 0 && boss) {
      boom(boss.x + (Math.random() - 0.5) * boss.w, boss.y - Math.random() * boss.h, 40 + Math.random() * 40, Math.random() < 0.5 ? '#ff9944' : '#ffce4d');
      spawnParts(boss.x + (Math.random() - 0.5) * boss.w, boss.y - Math.random() * boss.h, 6);
      shake = Math.max(shake, 8);
      sfx.boom();
    }
    if (bossDefeatSeq === 0) { boss = null; levelClear(); }
  }

  function levelClear() {
    state = CLEAR;
    // boss defeat quip (framework for more)
    const quips = { gorilla: 'GORILLA GO SLEEP.', sandworm: 'BACK TO THE SAND.', spidertank: 'THESE KIDS NEVER GO TO BED.', crystaltitan: 'BRRR... I MELT NOW.', battleship: 'ABANDON... EVERYTHING.', aliendrill: 'YOU DRILL HARDER THAN ME.' };
    clearStats = computeClearStats();
    clearQuip = quips[LV.boss] || '';
    sfx.levelClear();
    bannerT = 0;
    if (score > best) { best = score; try { localStorage.setItem('broforce_best', String(best)); } catch {} }
  }
  let clearStats = null, clearQuip = '', clearAnim = 0;
  function computeClearStats() {
    const acc = shotsFired > 0 ? Math.round(shotsHit / shotsFired * 100) : 0;
    const noDeath = deathsThisLevel === 0 ? 3000 : 0;
    const accBonus = acc * 20;
    const secBonus = secretsFound * 1000;
    score += noDeath + accBonus + secBonus;
    if (score > best) { best = score; try { localStorage.setItem('broforce_best', String(best)); } catch {} }
    return { acc, noDeath, accBonus, secBonus, kills: players.reduce((a, p) => a + p.kills, 0) };
  }

  function advanceLevel() {
    if (levelIndex + 1 < LEVELS.length) { loadLevel(levelIndex + 1); state = PLAYING; }
    else {
      // All six worlds cleared -> VICTORY / credits. (Hook for future L7-8:
      // just push more LEVELS entries and this branch keeps advancing.)
      if (score > best) { best = score; try { localStorage.setItem('broforce_best', String(best)); } catch {} }
      victoryAnim = 0; state = VICTORY; sfx.levelClear();
      setTimeout(() => { try { sfx.confirm(); } catch {} }, 400);
    }
  }
  let victoryAnim = 0;

  // ════════════════════════════════════════════════════════════════════════
  // CAT (Sammy) — invulnerable, harmless wink.
  // ════════════════════════════════════════════════════════════════════════
  function updateCat() {
    if (!cat) { catTimer--; if (catTimer <= 0 && state === PLAYING) { const dir = Math.random() < 0.5 ? 1 : -1; cat = { x: dir > 0 ? camX - 20 : camX + VW + 20, y: LV.groundY - 8, dir, t: 0, shot: false }; catTimer = 1200 + Math.random() * 800; } return; }
    cat.x += cat.dir * 0.8; cat.t++;
    if (cat.x < camX - 40 || cat.x > camX + VW + 40) { if (!cat.shot) { score += 200; } cat = null; }
  }

  // ════════════════════════════════════════════════════════════════════════
  // CAMERA
  // ════════════════════════════════════════════════════════════════════════
  function updateCamera() {
    let target;
    if (camLockX != null) target = camLockX;
    else {
      let sum = 0, n = 0, maxx = 0;
      for (const p of players) { if (!p.alive) continue; sum += p.x; n++; if (p.x > maxx) maxx = p.x; }
      const avg = n ? sum / n : camX + VW / 2;
      target = Math.max(avg - VW / 2, maxx - VW * 0.62);
    }
    // spawner-nest gate: don't scroll past an un-destroyed nest
    if (camLockX == null) {
      for (const hz of LV.hazards) {
        if (hz.type === 'spawner' && hz.hp > 0 && hz.x > camX) {
          const cap = hz.x - VW * 0.72;
          if (target > cap) target = Math.max(camX, cap);
        }
      }
    }
    target = Math.max(0, Math.min(LV.worldW - VW, target));
    camX += (target - camX) * 0.12;
    if (Math.abs(target - camX) < 0.4) camX = target;
  }

  // ════════════════════════════════════════════════════════════════════════
  // EXPLOSIONS + PARTICLES UPDATE
  // ════════════════════════════════════════════════════════════════════════
  function updateFX() {
    for (const e of explosions) { if (!e.active) continue; if (++e.tick >= 3) { e.tick = 0; if (++e.f >= EXPLO_FRAMES) e.active = false; } }
    for (const p of particles) { if (!p.active) continue; p.vy += p.grav; p.x += p.vx; p.y += p.vy; p.vx *= 0.98; if (--p.life <= 0) p.active = false; }
    for (const f of ftexts) { if (!f.active) continue; f.y += f.vy; if (--f.life <= 0) f.active = false; }
    if (comboTimer > 0) { if (--comboTimer <= 0) combo = 0; }
    if (bombFlash > 0) bombFlash--;
    if (shake > 0) shake = Math.max(0, shake - 0.7);
    if (slowmo > 0) slowmo--;
  }

  // ════════════════════════════════════════════════════════════════════════
  // 2P JOIN
  // ════════════════════════════════════════════════════════════════════════
  function joinP2MidGame() {
    if (players.length >= 2) return;
    const p2id = pickP2Bro();
    const p = freshPlayer(1, p2id);
    p.x = Math.max(camX + 20, players[0].x - 30); p.y = LV.groundY - 20;
    p.shieldTime = RESPAWN_SHIELD; p.invuln = 120;
    players.push(p); p2JoinedGame = true;
    floatText(p.x, p.y - 44, 'P2 JOINS!', '#35e0ff', 14);
    sfx.confirm();
  }
  function pickP2Bro() {
    if (p2Present) return BRO_ORDER[selIndex[1]];
    for (const id of BRO_ORDER) if (id !== players[0].broId) return id;
    return BRO_ORDER[1];
  }

  // ════════════════════════════════════════════════════════════════════════
  // STATE TRANSITIONS / MENUS
  // ════════════════════════════════════════════════════════════════════════
  function startCharSelect() { state = CHARSEL; selIndex = [0, 0]; selReady = [false, false]; sfx.confirm(); }
  function beginGame() {
    players = [freshPlayer(0, BRO_ORDER[selIndex[0]])];
    if (p2Present) { players.push(freshPlayer(1, BRO_ORDER[selIndex[1]])); p2JoinedGame = true; }
    score = 0; combo = 0; shotsFired = 0; shotsHit = 0;
    loadLevel(0);
    state = STORY; storyT = 0;
    startMusic();
  }
  function togglePause() {
    if (state === PLAYING) { state = PAUSED; }
    else if (state === PAUSED) { state = PLAYING; }
  }
  function backToTitle() { state = TITLE; players = []; p2Present = false; p2JoinedGame = false; resetLevelEntities(); }

  // menu input handling per frame (edge-driven)
  function handleMenus() {
    if (state === TITLE) {
      // Track a second pad live (set AND clear) so a disconnected P2 never
      // strands a solo player at "waiting for P2".
      p2Present = !!(PADS && PADS[1] && PADS[1].connected);
      if (anyMenuEdge('confirm') || anyMenuEdge('start')) { ensureAudio(); startCharSelect(); }
    } else if (state === CHARSEL) {
      // P1 cursor
      const h0 = curHeld[0];
      if (edge(0, h0, 'L')) { selIndex[0] = (selIndex[0] + 3) % 4; sfx.ui(); }
      if (edge(0, h0, 'R')) { selIndex[0] = (selIndex[0] + 1) % 4; sfx.ui(); }
      if (edge(0, h0, 'confirm')) { if (!selReady[0]) { selReady[0] = true; sfx.confirm(); } else tryLaunch(); }
      if (edge(0, h0, 'cancel')) { if (selReady[0]) { selReady[0] = false; sfx.ui(); } else backToTitle(); }
      // drop a P2 whose pad vanished before locking in (kid pulls a plug)
      if (p2Present && !selReady[1] && PADS && !(PADS[1] && PADS[1].connected)) p2Present = false;
      // P2 join / cursor
      if (!p2Present && PADS && PADS[1] && PADS[1].connected && (edge(1, curHeld[1], 'confirm') || edge(1, curHeld[1], 'jump'))) { p2Present = true; selIndex[1] = 1; sfx.confirm(); }
      if (p2Present) {
        const h1 = curHeld[1];
        if (edge(1, h1, 'L')) { selIndex[1] = (selIndex[1] + 3) % 4; sfx.ui(); }
        if (edge(1, h1, 'R')) { selIndex[1] = (selIndex[1] + 1) % 4; sfx.ui(); }
        if (edge(1, h1, 'confirm')) { if (!selReady[1]) { selReady[1] = true; sfx.confirm(); } else tryLaunch(); }
        if (edge(1, h1, 'cancel')) { if (selReady[1]) selReady[1] = false; else { p2Present = false; selReady[1] = false; } }
      }
    } else if (state === STORY) {
      storyT++;
      if (storyT > 6 && (anyMenuEdge('confirm') || anyMenuEdge('start') || anyMenuEdge('shoot'))) { state = PLAYING; }
      if (storyT > 600) state = PLAYING;
    } else if (state === PAUSED) {
      if (anyMenuEdge('start') || anyMenuEdge('confirm')) togglePause();
      if (anyMenuEdge('cancel')) backToTitle();
    } else if (state === CLEAR) {
      clearAnim++;
      if (clearAnim > 30 && (anyMenuEdge('confirm') || anyMenuEdge('start'))) { clearAnim = 0; advanceLevel(); }
    } else if (state === MORECOMING) {
      if (anyMenuEdge('confirm') || anyMenuEdge('start')) backToTitle();
    } else if (state === VICTORY) {
      victoryAnim++;
      if (victoryAnim > 40 && (anyMenuEdge('confirm') || anyMenuEdge('start'))) backToTitle();
    }
  }
  function tryLaunch() {
    if (!selReady[0]) return;
    if (p2Present && !selReady[1]) return;
    ensureAudio(); beginGame();
  }

  // in-game pad edges (pause + 2P join)
  function handleGameEdges() {
    if (state !== PLAYING) return;
    // pause: either pad start, or P1 keyboard
    if (edge(0, curHeld[0], 'start') || (p2JoinedGame && edge(1, curHeld[1], 'start'))) { togglePause(); return; }
    // drop-in P2: pad 1 present but not in game -> press south/start joins
    if (players.length === 1 && PADS && PADS[1] && PADS[1].connected) {
      if (edge(1, curHeld[1], 'jump') || edge(1, curHeld[1], 'start') || edge(1, curHeld[1], 'shoot')) joinP2MidGame();
    }
    // keyboard P2 drop-in
    if (players.length === 1 && (keys['h'] || keys['g'])) joinP2MidGame();
  }

  // ════════════════════════════════════════════════════════════════════════
  // BACKGROUND MUSIC (simple synth loop, optional)
  // ════════════════════════════════════════════════════════════════════════
  let bgTimer = null;
  function startBg() { /* left as a hook; SFX carry the game. */ }

  // ════════════════════════════════════════════════════════════════════════
  // DRAW
  // ════════════════════════════════════════════════════════════════════════
  function applyWorldCam() {
    let sx = offX - camX * scale, sy = offY;
    if (shake > 0) { sx += (Math.random() - 0.5) * shake * scale; sy += (Math.random() - 0.5) * shake * scale; }
    _camX = sx; _camY = sy;
    ctx.setTransform(scale, 0, 0, scale, sx, sy);
  }
  function applyHudCam() { _camX = offX; _camY = offY; ctx.setTransform(scale, 0, 0, scale, offX, offY); }

  function drawParallax() {
    const P = PARALLAX[LV.parallax];
    // sky (static, screen-space)
    ctx.setTransform(scale, 0, 0, scale, offX, offY);
    ctx.drawImage(P.sky.c, 0, 0, VW, VH);
    // layers scroll with camX * factor; tiled horizontally
    for (const layer of P.layers) {
      const s = layer.spr, tw = s.w;
      const scroll = camX * layer.factor;
      let startX = -(scroll % tw); if (startX > 0) startX -= tw;
      ctx.setTransform(scale, 0, 0, scale, offX, offY);
      for (let x = startX; x < VW; x += tw) ctx.drawImage(s.c, x, layer.y, s.w, s.h);
    }
  }

  function drawGround() {
    applyWorldCam();
    // pit chasms: a dark depth fill so gaps read clearly (few, cheap fillRects)
    // ground tiled straight across…
    const gTile = SPR[LV.ground], tw = gTile.w, gh = gTile.h;
    const startX = Math.floor(camX / tw) * tw;
    for (let x = startX; x < camX + VW + tw; x += tw) ctx.drawImage(gTile.c, x, LV.groundY, tw, gh);
    // …then carve each pit OVER the ground so the visible hole exactly matches
    // the fall-through gap. (The old tile-center skip missed pits narrower than
    // a tile — e.g. 1600–1710 — so you fell through invisible holes.)
    for (const pit of LV.pits) {
      if (pit.x1 < camX - 20 || pit.x0 > camX + VW + 20) continue;
      const px0 = pit.x0, pw = pit.x1 - pit.x0, py = LV.groundY - 2, depth = VH - LV.groundY + 8;
      ctx.fillStyle = '#0c0a08'; ctx.fillRect(px0, py, pw, depth);
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(px0, py, pw, 6);            // shaded top lip
      ctx.fillStyle = 'rgba(255,255,255,0.06)';                                    // faint side walls
      ctx.fillRect(px0, py, 3, depth); ctx.fillRect(px0 + pw - 3, py, 3, depth);
    }
    // platforms
    const pl = SPR[LV.platform];
    for (const p of LV.platforms) {
      if (p.x + p.w < camX - 20 || p.x - p.w > camX + VW + 20) continue;
      ctx.drawImage(pl.c, p.x - p.w / 2, p.y - 8, p.w, 16);
    }
    // lava first (drawn under entities so bros stand above the surface glow)
    for (const hz of LV.hazards) {
      if (hz.type !== 'lava') continue;
      const y = hz.cur; if (y > VH + 20) continue;
      ctx.fillStyle = '#5a0f06'; ctx.fillRect(camX - 10, y + 8, VW + 20, VH - y + 20);
      const lw = SPR.lava.w, lstart = Math.floor(camX / lw) * lw;
      const bob = Math.sin(frameCount * 0.08) * 1.5;
      for (let x = lstart; x < camX + VW + lw; x += lw) ctx.drawImage(SPR.lava.c, x, y - 6 + bob, lw, 24);
    }
    // hazards
    for (const hz of LV.hazards) {
      if (hz.type === 'lava' || hz.type === 'blizzard') continue; // lava above; blizzard = weather
      if (hz.x != null && (hz.x + (hz.w || 60) < camX - 30 || hz.x - (hz.w || 60) > camX + VW + 30)) continue;
      if (hz.type === 'destructible') {
        if (hz.hp <= 0) continue;
        const s = hz.hp <= hz._hp0 / 2 ? SPR.iceBlockCracked : SPR.iceBlock;
        ctx.drawImage(s.c, hz.x - hz.w / 2, hz.y - hz.h, hz.w, hz.h);
      } else if (hz.type === 'spawner') {
        const open = hz.hp <= 0;
        const slide = open ? (hz._open = Math.min(126, (hz._open || 0) + 3)) : 0;
        ctx.drawImage(SPR.gateDoor.c, hz.x + 22, LV.groundY - 120 - slide, 26, 120);
        if (!open) {
          drawSprTop(hz.hp <= hz.maxHp / 2 ? SPR.nestHurt : SPR.nest, hz.x, LV.groundY - 56);
          const bw = 40, bx = hz.x - bw / 2, by = LV.groundY - 66;
          ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 5);
          ctx.fillStyle = '#7dff9a'; ctx.fillRect(bx, by, bw * Math.max(0, hz.hp / hz.maxHp), 3);
        }
      } else if (hz.type === 'conveyor') {
        const w = hz.w, x0 = hz.x - w / 2, y = hz.y;
        for (let x = x0; x < x0 + w; x += 48) ctx.drawImage(SPR.conveyorBelt.c, x, y - 2, Math.min(48, x0 + w - x), 14);
        ctx.drawImage(SPR.conveyorRoller.c, x0 - 3, y - 2, 12, 12);
        ctx.drawImage(SPR.conveyorRoller.c, x0 + w - 9, y - 2, 12, 12);
        if (!SPR.conveyorChevronL) SPR.conveyorChevronL = bake(16, 12, g => { g.translate(16, 0); g.scale(-1, 1); g.drawImage(SPR.conveyorChevron.c, 0, 0, 16, 12); }, 1);
        const chev = hz.dir < 0 ? SPR.conveyorChevronL : SPR.conveyorChevron;
        const off = ((frameCount * (hz.speed || 1) * hz.dir) % 24 + 24) % 24;
        for (let x = x0 - 24 + off; x < x0 + w - 2; x += 24) if (x > x0 - 2) ctx.drawImage(chev.c, x, y, 16, 12);
      } else if (hz.type === 'crusher') {
        const headTop = hz.cur == null ? hz.top : hz.cur, shaftTop = hz.ceil || 0;
        ctx.drawImage(SPR.crusherShaft.c, hz.x - 10, shaftTop, 20, Math.max(0, headTop - shaftTop));
        ctx.drawImage(SPR.crusherHead.c, hz.x - hz.w / 2, headTop, hz.w, 22);
        if (hz.warn && (frameCount >> 2 & 1)) drawSpr(SPR.landZone, hz.x, LV.groundY - 4);
      }
    }
  }

  function drawPod() {
    if (!pod) return;
    drawSpr(SPR.pod, pod.x, pod.y);
  }

  function drawPickup(pu) {
    if (!pu.active) return;
    const bob = Math.sin(pu.t * 0.08) * 2;
    if (pu.kind === 'weapon') { const s = SPR.crate[pu.weapon]; drawSprRot(s, pu.x, pu.y + bob, pu.t * 0.03); }
    else if (pu.kind === 'chicken') { drawChicken(pu.x, pu.y + bob); }
    else { const s = SPR.orb[pu.kind === 'ddmg' ? 'ddmg' : pu.kind === 'special' ? 'special' : 'shield']; drawSpr(s, pu.x, pu.y + bob); }
  }
  function drawChicken(x, y) {
    // baked lazily
    if (!SPR.chicken) SPR.chicken = bake(20, 20, g => {
      g.translate(10, 10);
      glowDot(g, 0, 0, 12, '#ffd24d', 0.7);
      g.fillStyle = '#ffe066'; g.beginPath(); g.ellipse(0, 2, 7, 6, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(4, -4, 4, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ff5252'; g.beginPath(); g.moveTo(7, -6); g.lineTo(9, -5); g.lineTo(7, -3); g.fill();
      g.fillStyle = '#ff9b3d'; g.fillRect(3, -8, 2, 3);
      g.fillStyle = '#20242c'; g.fillRect(5, -5, 1.4, 1.4);
    });
    drawSpr(SPR.chicken, x, y);
  }

  function drawEnemy(e) {
    if (!e.active) return;
    if (e.x + e.w < camX - 20 || e.x - e.w > camX + VW + 20) return;
    const yTop = e.y - e.h;
    if (e.flash > 0) drawSprTop(SPR[e.def.spr + '_w'], e.x, yTop);
    else drawSprTop(SPR[e.def.spr], e.x, yTop);
    // turret / walker charge telegraph (drawImage only)
    if (e.charge) {
      const mx = e.x + (e.facing < 0 ? -e.w * 0.5 : e.w * 0.5);
      const my = e.y - e.h * 0.5;
      drawSpr(muzzleSpr('#ff5252'), mx, my);
    }
  }

  function drawPlayer(p) {
    if (!p.alive) return;
    if (p.downed) {
      drawSpr(SPR.downed, p.x, p.y - 16 + Math.sin(p.downTimer * 0.1) * 2);
      // revive ring
      if (p.reviveProg > 0) { const g = ctx; g.fillStyle = 'rgba(93,214,108,0.8)'; g.fillRect(p.x - 14, p.y - 34, 28 * (p.reviveProg / REVIVE_NEED), 3); }
      return;
    }
    if (p.respawnT > 0) return;
    // invuln blink
    if (p.invuln > 0 && ((p.invuln >> 2) & 1) === 0 && p.shieldTime <= 0) { /* skip body draw this frame */ }
    else {
      const face = p.facing > 0 ? 'r' : 'l';
      const pose = p.prone ? 'prone' : !p.grounded ? 'jump' : Math.abs(p.vx) > 0.2 ? (p.walkFrame ? 'run1' : 'run0') : 'stand';
      const spr = SPR['bro_' + p.broId + '_' + face + '_' + pose];
      drawSprTop(spr, p.x, p.y - 34);
      // gun arm rotated to aim
      if (!p.prone) {
        const shx = p.x, shy = p.y - PLH * 0.55;
        drawSprPivot(SPR.gun, shx, shy, Math.atan2(p.aimy, p.aimx), 1, 3);
      }
    }
    // muzzle flash
    if (p.muzzle > 0) drawSpr(muzzleSpr(WEAPONS[p.weapon].color), p.muzzleX, p.muzzleY);
    // shield bubble
    if (p.shieldTime > 0) { const a = p.shieldTime < 120 ? (p.shieldTime % 12 < 6 ? 1 : 0.3) : 1; if (a > 0.5) drawSpr(SPR.shieldBubble, p.x, p.y - 16); }
    // P2 marker
    if (p.idx === 1) { ctx.fillStyle = '#35e0ff'; ctx.fillRect(p.x - 2, p.y - 40, 4, 4); }
  }

  function drawBullet(b) {
    if (!b.active) return;
    if (b.x < camX - 30 || b.x > camX + VW + 30) return;
    if (b.kind === 'laser') drawSprRot(laserSpr(b.color), b.x, b.y, b.ang);
    else drawSprRot(boltSpr(b.color), b.x, b.y, b.ang);
  }
  function drawEBullet(b) {
    if (!b.active) return;
    if (b.color === 'barrel') { drawSprRot(SPR.barrel, b.x, b.y, b.spin || 0); return; }
    if (b.spr) { drawSprRot(b.spr, b.x, b.y, b.spin || 0); return; }
    drawSpr(shotSpr(b.color), b.x, b.y);
  }
  function drawExplosion(e) {
    const frames = SPR.explo[e.tint][e.tier];
    const s = frames[Math.min(EXPLO_FRAMES - 1, e.f)];
    let a = 1; if (e.f >= EXPLO_FRAMES - 2) a = Math.max(0, (EXPLO_FRAMES - e.f) / 2);
    if (a < 1) ctx.globalAlpha = a;
    drawSprScaled(s, e.x, e.y, s.w * e.k, s.h * e.k);
    if (a < 1) ctx.globalAlpha = 1;
  }
  function drawParticle(p) {
    const a = Math.max(0, p.life / p.maxLife);
    const sz = p.size * (0.4 + a * 0.6);
    if (a < 1) ctx.globalAlpha = a;
    drawSprScaled(p.spr, p.x, p.y, sz * 2, sz * 2);
    if (a < 1) ctx.globalAlpha = 1;
  }
  function drawFloatText(f) {
    const a = Math.min(1, f.life / 30);
    ctx.globalAlpha = a;
    hudText(f.text, f.x, f.y, f.size, f.color, 'center');
    ctx.globalAlpha = 1;
  }
  function drawCat() {
    if (!cat) return;
    const s = (cat.t >> 3 & 1) ? SPR.cat1 : SPR.cat0;
    if (cat.dir < 0) { ctx.translate(cat.x, cat.y - 8); ctx.scale(-1, 1); ctx.drawImage(s.c, -s.w / 2, -s.h / 2, s.w, s.h); ctx.setTransform(scale, 0, 0, scale, _camX, _camY); }
    else drawSpr(s, cat.x, cat.y - 8);
  }
  function drawLandTelegraph() {
    if (boss && (boss.mode === 'leapTele' || boss.mode === 'leapUp')) {
      drawSpr(SPR.landZone, boss.landX, LV.groundY - 4);
    }
  }

  // ── HUD text (stroke + fill only; allowed) ──
  function hudText(txt, x, y, size, color, align) {
    ctx.font = '900 ' + size + 'px ' + HUD_FONT;
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = Math.max(2.5, size * 0.28); ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(txt, x, y);
    ctx.fillStyle = color; ctx.fillText(txt, x, y);
  }

  function drawHUD() {
    applyHudCam();
    // per-player panels
    for (let i = 0; i < players.length; i++) drawPlayerHUD(players[i], i === 1);
    // shared score center-top
    hudText('SCORE', VW / 2, 13, 8, '#7fdcff', 'center');
    hudText(String(score), VW / 2, 28, 14, '#fff', 'center');
    if (combo >= 2) hudText('x' + combo, VW / 2, 40, 9, '#ff5cae', 'center');
    // boss health bar
    if (boss && bossDefeatSeq === 0) {
      const bw = 260, bx = (VW - bw) / 2, by = VH - 16;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
      ctx.fillStyle = '#5a1010'; ctx.fillRect(bx, by, bw, 8);
      ctx.fillStyle = '#ff3a3a'; ctx.fillRect(bx, by, bw * Math.max(0, boss.hp / boss.maxHp), 8);
      hudText(boss.def.name, VW / 2, by - 6, 8, '#ffce4d', 'center');
    }
    // 2P join hint
    if (players.length === 1 && PADS && PADS[1] && PADS[1].connected && state === PLAYING) {
      hudText('P2 PRESS ✕ TO JOIN', VW / 2, VH - 8, 9, '#35e0ff', 'center');
    }
  }
  function drawPlayerHUD(p, right) {
    const x0 = right ? VW - 10 : 10;
    const ax = right ? 'right' : 'left';
    // face icon
    const ix = right ? VW - 22 : 6;
    ctx.drawImage(SPR.face[p.broId].c, ix, 6, 16, 16);
    // health segments
    for (let s = 0; s < p.maxHealth; s++) {
      const sx = right ? VW - 30 - s * 16 : 26 + s * 16;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(sx - 1, 8, 14, 10);
      ctx.fillStyle = s < p.health ? (p.idx === 1 ? '#35e0ff' : '#5dd66c') : 'rgba(255,255,255,0.15)';
      ctx.fillRect(sx, 9, 12, 8);
    }
    // weapon + specials
    const w = WEAPONS[p.weapon];
    hudText(w.name, x0, 32, 8, w.color, ax);
    // special charges
    for (let s = 0; s < p.specials; s++) { const sx = right ? VW - 10 - s * 9 : 10 + s * 9; ctx.fillStyle = '#ffce4d'; ctx.fillRect(sx - (right ? 6 : 0), 36, 6, 6); }
    // buffs
    if (p.shieldTime > 0) hudText('SHIELD', x0, 48, 7, '#7fdcff', ax);
    else if (p.ddmgTime > 0) hudText('2X DMG', x0, 48, 7, '#ff5cae', ax);
    // downed timer
    if (p.downed) hudText('DOWN ' + Math.ceil(p.downTimer / 60), x0, 48, 8, '#ff5252', ax);
  }

  // ── menu screens (canvas) ──
  let titlePulse = 0;
  function bakeTitleLogo() {
    // Hand-drawn geometric block letters so the logo is unambiguous on ANY
    // font stack (the O is a clean ring — never mistakable for a Q — and the B
    // never reads as R). Each glyph = filled bars + stroked rings, drawn twice:
    // a black outline pass, then a gradient fill pass on top.
    function letterOps(ch, x, y, W, H, st) {
      const o = { rects: [], lines: [], ells: [], arcs: [] };
      const R = x + W, midY = y + H / 2;
      switch (ch) {
        case 'B':
          o.rects.push([x, y, st, H], [x, y, W - st * 0.5, st], [x, midY - st / 2, W - st * 0.55, st], [x, y + H - st, W - st * 0.5, st], [R - st, y, st, H / 2], [R - st, midY, st, H / 2]);
          break;
        case 'R':
          o.rects.push([x, y, st, H], [x, y, W - st * 0.4, st], [x, midY - st, W - st * 0.4, st], [R - st, y, st, H / 2]);
          o.lines.push([x + st * 0.7, midY - st * 0.4, R - st * 0.2, y + H]);
          break;
        case 'O':
          o.ells.push([x + W / 2, midY, W / 2 - st / 2, H / 2 - st / 2]);
          break;
        case 'F':
          o.rects.push([x, y, st, H], [x, y, W - st * 0.2, st], [x, midY - st / 2, W * 0.72, st]);
          break;
        case 'C':
          o.arcs.push([x + W / 2, midY, W / 2 - st / 2, H / 2 - st / 2, Math.PI * 0.34, Math.PI * 1.66]);
          break;
        case 'E':
          o.rects.push([x, y, st, H], [x, y, W - st * 0.2, st], [x, midY - st / 2, W * 0.8, st], [x, y + H - st, W - st * 0.2, st]);
          break;
      }
      return o;
    }
    function drawOps(g, o, st, OL) {
      for (const r of o.rects) g.fillRect(r[0] - OL, r[1] - OL, r[2] + 2 * OL, r[3] + 2 * OL);
      g.lineWidth = st + 2 * OL; g.lineCap = 'round'; g.lineJoin = 'round';
      for (const l of o.lines) { g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); g.stroke(); }
      for (const e of o.ells) { g.beginPath(); g.ellipse(e[0], e[1], e[2], e[3], 0, 0, Math.PI * 2); g.stroke(); }
      for (const a of o.arcs) { g.beginPath(); g.ellipse(a[0], a[1], a[2], a[3], 0, a[4], a[5]); g.stroke(); }
    }
    function drawWord(g, text, cx, topY, H, st, gap, grad) {
      const OL = 3, W = Math.round(H * 0.74), n = text.length;
      const total = n * W + (n - 1) * gap;
      let x = cx - total / 2;
      // outline pass
      g.fillStyle = '#000'; g.strokeStyle = '#000';
      for (const ch of text) { drawOps(g, letterOps(ch, x, topY, W, H, st), st, OL); x += W + gap; }
      // fill pass

  // ── ambient weather (snow / ember / spore) + blizzard streaks ──
  function drawWeather() {
    const w = LV.weather; if (!w) return;
    applyHudCam();
    const spr = w === 'snow' ? SPR.flakeSnow : w === 'ember' ? SPR.flakeEmber : SPR.flakeSpore;
    const N = LOWFX ? 6 : 10, fc = frameCount;
    let wind = 0;
    let bz = null;
    if (w === 'snow') { for (const hz of LV.hazards) if (hz.type === 'blizzard') bz = hz; if (bz) wind = bz.gust === 2 ? bz.dir * 3 : bz.gust === 1 ? bz.dir * 1 : 0; }
    for (let i = 0; i < N; i++) {
      const seedX = (i * 97) % VW;
      let x, y;
      if (w === 'ember') { y = VH - ((fc * 0.8 + i * 53) % (VH + 20)); x = (seedX + Math.sin(fc * 0.02 + i) * 18 + VW) % VW; }
      else { y = (fc * (w === 'snow' ? 1.1 : 0.6) + i * 47) % (VH + 20); x = (seedX + (w === 'snow' ? fc * wind * 0.1 + Math.sin(fc * 0.03 + i) * 10 : Math.sin(fc * 0.02 + i) * 24) + VW * 3) % VW; }
      ctx.drawImage(spr.c, x - 4, y - 4, 8, 8);
    }
    if (w === 'snow' && bz && bz.gust >= 1) {
      if (bz.gust === 2) {
        const M = LOWFX ? 2 : 4;
        ctx.globalAlpha = 0.5;
        for (let i = 0; i < M; i++) { const y = (i * 23 + fc * 4) % VH; const x = (fc * bz.dir * 6 + i * 80 + VW * 3) % VW; ctx.drawImage(spr.c, x, y, 22, 4); }
        ctx.globalAlpha = 1;
      }
      if ((fc >> 3) & 1) hudText(bz.dir < 0 ? '<<< BLIZZARD' : 'BLIZZARD >>>', VW / 2, 62, 12, '#eaf7ff', 'center');
    }
  }

  function drawWorld() {
    // background
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawParallax();
    drawGround();
    // world entities
    applyWorldCam();
    drawCat();
    for (const pu of pickups) drawPickup(pu);
    drawPod();
    for (const e of enemies) drawEnemy(e);
    drawLandTelegraph();
    if (boss) BOSS_DEFS[LV.boss].draw(boss);
    for (const p of players) drawPlayer(p);
    for (const b of pbullets) if (b.active) drawBullet(b);
    for (const b of ebullets) if (b.active) drawEBullet(b);
    for (const e of explosions) if (e.active) drawExplosion(e);
    for (const p of particles) if (p.active) drawParticle(p);
    for (const f of ftexts) if (f.active) drawFloatText(f);
    // ambient weather + blizzard telegraph (screen-space, drawImage only)
    drawWeather();
    // bomb flash
    if (bombFlash > 0) { applyHudCam(); ctx.globalAlpha = Math.min(0.8, bombFlash / 12); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }

    // HUD
    drawHUD();
  }

  function render() {
    if (state === TITLE) drawTitle();
    else if (state === CHARSEL) drawCharSelect();
    else if (state === STORY) drawStory();
    else if (state === PLAYING) drawWorld();
    else if (state === PAUSED) drawPause();
    else if (state === CLEAR) drawClear();
    else if (state === MORECOMING) drawMoreComing();
    else if (state === VICTORY) drawVictory();
  }

  // ════════════════════════════════════════════════════════════════════════
  // MAIN LOOP
  // ════════════════════════════════════════════════════════════════════════
  function updateGame() {
    // slow-mo during boss defeat: run world every other frame
    const skip = slowmo > 0 && (frameCount & 1);
    if (bannerT > 0) bannerT--;
    updatePod();
    if (!skip) {
      updateMovingPlatforms();
      for (const p of players) updatePlayer(p);
      updateHazards();
      updatePlayerBullets();
      updateEnemyBullets();
      updateEnemies();
      if (boss) { if (bossDefeatSeq === 0) BOSS_DEFS[LV.boss].update(boss); if (boss.flash > 0) boss.flash--; bossContact(); }
      updateBossDefeat();
      updatePickups();
      updateWaves();
      updateCat();
    }
    updateCamera();
    updateFX();
    document.body.classList.toggle('in-match', true);
  }

  let frameCount = 0;
  function tick() {
    frameCount++;
    titlePulse++; bgScroll += 1;
    // snapshot current held for all players
    curHeld[0] = rawHeld(0);
    curHeld[1] = rawHeld(1);

    if (state === PLAYING) { handleGameEdges(); updateGame(); }
    else { handleMenus(); document.body.classList.toggle('in-match', false); }

    render();

    // store prev held for edge detection next frame
    prevHeld[0] = curHeld[0];
    prevHeld[1] = curHeld[1];
    if (window.__bfHooks) window.__bfHooks._afterFrame && window.__bfHooks._afterFrame();
  }

  function loop() {
    try { tick(); } catch (err) { console.error('bro-force frame error:', err); }
    requestAnimationFrame(loop);
  }
  loop();

<!-- injected by scripts/bundle-games.sh — hold PS (or SELECT+START) on any gamepad to return to the arcade menu -->
<script id="__arcade_pad_exit">
(function () {
  var HOLD_MS = 1000;
  var heldSince = 0;
  var leaving = false;
  function comboDown(gp) {
    var b = gp.buttons;
    var ps = b[16] && b[16].pressed;
    var selectStart = b[8] && b[8].pressed && b[9] && b[9].pressed;
    return !!(ps || selectStart);
  }
  function tick(now) {
    if (leaving) return;
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];

    for (var i = 0; i < pads.length; i++) {
      if (pads[i] && pads[i].connected && comboDown(pads[i])) { down = true; break; }
    }
    var btn = document.getElementById('__arcade_back');
    if (!down) {
      heldSince = 0;
      if (btn) { btn.style.transform = ''; btn.style.boxShadow = ''; }
    } else {
      if (!heldSince) heldSince = now;
      var progress = (now - heldSince) / HOLD_MS;
      if (btn) {
        btn.style.transform = 'scale(' + (1 + 0.35 * Math.min(progress, 1)) + ')';
        btn.style.transformOrigin = 'top left';

      }

<!-- injected by scripts/bundle-games.sh — low-effects mode for the Pi console.
     Canvas shadowBlur (neon glow) costs a GPU blur pass per glowing sprite;
     the Pi 5 drops from ~50fps to ~13fps with it on. The console kiosk loads
     the arcade with ?fx=low, the launcher persists the flag in localStorage,
     and this overlay no-ops shadowBlur in every bundled game. Visit with
     ?fx=full to turn glows back on. -->
<script id="__arcade_lowfx">
(function () {
  var on = false;
  try {
    if (/[?&]fx=low\b/.test(location.search)) { on = true; localStorage.setItem('arcade_lowfx', '1'); }
    else if (/[?&]fx=full\b/.test(location.search)) { localStorage.setItem('arcade_lowfx', '0'); }
    else { on = localStorage.getItem('arcade_lowfx') === '1'; }
  } catch (e) {}
  if (!on) return;
  try {
    Object.defineProperty(CanvasRenderingContext2D.prototype, 'shadowBlur', {
      set: function () {}, get: function () { return 0; }
    });
  } catch (e) {}
  // Console mode: no mouse exists, so never show a cursor. And CSS
  // backdrop-filter re-blurs the animating canvas under every frosted panel
  // on every frame — measured 17fps -> 60fps in Ninth Inning on the Pi by
  // disabling it. Panels keep their translucent rgba backgrounds.
  try {
    document.head.insertAdjacentHTML('beforeend',
      '<style>* { cursor: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }</style>');
  } catch (e) {}
})();
</script>

<!-- injected by scripts/bundle-games.sh — after 15 idle minutes (no pad /
     keyboard / touch input) return to the arcade menu. Games save on
     pagehide and/or rolling autosave, so nothing is lost. Test override:
     ?idle=<seconds>. -->
<script id="__arcade_idle">
(function () {
  var qs = new URLSearchParams(location.search).get('idle');
  var IDLE_MS = (qs ? Math.max(10, parseFloat(qs)) : 15 * 60) * 1000;
  var DEADZONE = 0.25;
  var last = performance.now();
  var leaving = false;
  function bump() { last = performance.now(); }
  window.addEventListener('keydown', bump, { capture: true });
  window.addEventListener('pointerdown', bump, { capture: true });
  window.addEventListener('touchstart', bump, { capture: true, passive: true });
  function padActive() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (!gp || !gp.connected) continue;
      for (var b = 0; b < gp.buttons.length; b++)
        if (gp.buttons[b].pressed) return true;
      for (var a = 0; a < gp.axes.length; a++)
        if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  function tick(now) {
    if (leaving) return;
    if (padActive()) last = now;
    if (now - last >= IDLE_MS) {
      leaving = true;
      location.href = '/';   // pagehide fires → games persist their state
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
