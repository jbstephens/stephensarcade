<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bro Force">
<title>Bro Force</title>
<!-- Shared arcade controller. Guard every use with `if (window.ArcadeController)`. -->
<script src="https://ses.q5labs.co/lib/controller.js"></script>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Impact, "Arial Black", system-ui, sans-serif;
    color: #fff;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; display: block; }

  /* ── iPad on-screen controls: left 8-way pad + right JUMP/SHOOT/SPECIAL ── */
  .controls {
    position: fixed; top: 0; bottom: 0;
    display: none; flex-direction: column;
    justify-content: flex-end;
    padding: max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    z-index: 5; pointer-events: none;
  }
  body.touch.in-match .controls { display: flex; }
  body.paused .controls { display: none; }
  body.input-pad .controls { display: none !important; }
  .controls.left  { left: 0;  align-items: flex-start; }
  .controls.right { right: 0; align-items: flex-end;   }
  .row { display: flex; gap: 10px; pointer-events: auto; align-items: center; justify-content: center; }
  .btn {
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 22px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none;
    transition: transform 0.05s, background 0.05s;
  }
  .btn.held { background: rgba(255,255,255,0.42); transform: scale(0.93); }
  .btn.jump  { width: 76px; height: 76px; font-size: 15px; letter-spacing:1px; background: rgba(93,214,108,0.22); border-color: rgba(93,214,108,0.7); color:#bfffca; }
  .btn.shoot { width: 96px; height: 96px; font-size: 16px; letter-spacing:1px; background: rgba(255,224,102,0.22); border-color: rgba(255,224,102,0.75); color:#ffe066; }
  .btn.spec  { width: 62px; height: 62px; font-size: 12px; letter-spacing:1px; background: rgba(197,95,255,0.22); border-color: rgba(197,95,255,0.7); color:#e4b7ff; }
  .btn.jump.held  { background: rgba(93,214,108,0.5); }
  .btn.shoot.held { background: rgba(255,224,102,0.5); }
  .btn.spec.held  { background: rgba(197,95,255,0.5); }
  .dpad { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; align-items: center; }
  .dpad .row { gap: 6px; }
  .dpad .spacer { width: 58px; height: 58px; pointer-events: none; }
  .cluster { display:flex; flex-direction:column; gap:10px; align-items:flex-end; pointer-events:none; }
  .cluster .row { pointer-events:auto; }

  .hud-btn {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.55);
    color: #fff; font-size: 22px; font-weight: 900;
    display: none; align-items: center; justify-content: center;
    z-index: 6; cursor: pointer; padding: 0; line-height: 1;
    font-family: inherit; touch-action: manipulation;
  }
  body.touch.in-match .hud-btn { display: flex; }
  body.paused   .hud-btn { display: none; }
  body.input-pad .hud-btn { display: none; }
  .hud-btn:active { transform: scale(0.92); }
</style>

<body>
<canvas id="game"></canvas>

<button id="pauseBtn" class="hud-btn" aria-label="Pause">II</button>

<div class="controls left">
  <div class="dpad">
    <div class="row">
      <div class="btn" data-act="ul" aria-label="Up-Left">&#8598;</div>
      <div class="btn" data-act="up" aria-label="Up">&#9650;</div>
      <div class="btn" data-act="ur" aria-label="Up-Right">&#8599;</div>
    </div>
    <div class="row">
      <div class="btn" data-act="left"  aria-label="Left">&#9664;</div>
      <div class="spacer"></div>
      <div class="btn" data-act="right" aria-label="Right">&#9654;</div>
    </div>
    <div class="row">
      <div class="spacer"></div>
      <div class="btn" data-act="down"  aria-label="Down">&#9660;</div>
      <div class="spacer"></div>
    </div>
  </div>
</div>
<div class="controls right">
  <div class="cluster">
    <div class="row"><div class="btn spec" data-act="special" aria-label="Special">BOMB</div></div>
    <div class="row">
      <div class="btn shoot" data-act="shoot" aria-label="Shoot">SHOOT</div>
      <div class="btn jump" data-act="jump" aria-label="Jump">JUMP</div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  // ── Virtual playfield. Camera scrolls a wide world through this window. ──
  const VW = 480, VH = 270;
  const HUD_FONT = 'Impact, "Arial Black", system-ui, sans-serif';

  // ── LOW-FX / Pi mode: honor ?fx=low and localStorage.arcade_lowfx ──
  const LOWFX = (() => {
    try { const u = new URL(location.href); if ((u.searchParams.get('fx') || '') === 'low') return true; } catch {}
    try { if (localStorage.getItem('arcade_lowfx')) return true; } catch {}
    return false;
  })();

  let scale = 1, offX = 0, offY = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    scale = Math.min(canvas.width / VW, canvas.height / VH);
    offX = (canvas.width - VW * scale) / 2;
    offY = (canvas.height - VH * scale) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  const AC = window.ArcadeController || null;
  const PADS = AC ? [AC.pad(0), AC.pad(1)] : null;

  // ════════════════════════════════════════════════════════════════════════
  // AUDIO — synthesized, context created lazily on first user gesture.
  // ════════════════════════════════════════════════════════════════════════
  let audioCtx = null, muted = false;
  function ensureAudio() {
    if (!audioCtx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (A) audioCtx = new A();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function blip(freq, dur, type = 'square', vol = 0.07, sweepTo = null) {
    if (!audioCtx || muted) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (sweepTo != null) o.frequency.exponentialRampToValueAtTime(Math.max(1, sweepTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noiseBurst(durSec, peakGain, lpStart, lpEnd) {
    if (!audioCtx || muted) return;
    const t0 = audioCtx.currentTime, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, Math.max(1, Math.floor(sr * durSec)), sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length * 0.6);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const filt = audioCtx.createBiquadFilter(); filt.type = 'lowpass';
    filt.frequency.setValueAtTime(lpStart, t0);
    filt.frequency.exponentialRampToValueAtTime(Math.max(1, lpEnd), t0 + durSec);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peakGain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + durSec);
    src.connect(filt).connect(g).connect(audioCtx.destination);
    src.start(t0); src.stop(t0 + durSec + 0.05);
  }
  let _lastShotAt = 0;
  const sfx = {
    rifle:  () => blip(720, 0.06, 'square',   0.045, 1200),
    spread: () => blip(430, 0.09, 'sawtooth', 0.05, 900),
    laser:  () => blip(1200, 0.09, 'sawtooth', 0.045, 420),
    rapid:  () => blip(900, 0.04, 'square',   0.035, 1500),
    enemyShot: () => blip(300, 0.08, 'square', 0.04, 140),
    hit:    () => blip(200, 0.05, 'square', 0.05, 110),
    kill:   () => { noiseBurst(0.15, 0.12, 1800, 240); blip(200, 0.14, 'sawtooth', 0.06, 70); },
    boom:   () => { noiseBurst(0.30, 0.22, 2200, 150); blip(130, 0.26, 'sawtooth', 0.12, 40); },
    jump:   () => blip(360, 0.10, 'square', 0.05, 720),
    pickup: () => { [660, 990, 1320].forEach((f, i) => setTimeout(() => blip(f, 0.08, 'triangle', 0.06), i * 55)); },
    shield: () => { [330, 520, 700].forEach((f, i) => setTimeout(() => blip(f, 0.14, 'sine', 0.05), i * 50)); },
    special:() => { noiseBurst(0.5, 0.28, 2600, 80); blip(110, 0.5, 'sawtooth', 0.16, 30); setTimeout(() => blip(520, 0.3, 'square', 0.09, 90), 60); },
    playerHit: () => { blip(240, 0.16, 'sawtooth', 0.1, 80); noiseBurst(0.14, 0.1, 1400, 200); },
    downed: () => blip(300, 0.7, 'sawtooth', 0.12, 45),
    revive: () => { [440, 660, 880, 1100].forEach((f, i) => setTimeout(() => blip(f, 0.1, 'triangle', 0.07), i * 60)); },
    bossRoar: () => { noiseBurst(0.9, 0.3, 900, 60); [90, 70, 50].forEach((f, i) => setTimeout(() => blip(f, 0.5, 'sawtooth', 0.18, f * 0.7), i * 160)); },
    bossHurt: () => { noiseBurst(0.2, 0.16, 1600, 120); blip(160, 0.18, 'square', 0.09, 70); },
    clang:  () => blip(1400, 0.05, 'square', 0.05, 900),
    levelClear: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, 0.16, 'triangle', 0.08), i * 130)); },
    ui:     () => blip(600, 0.05, 'square', 0.04, 800),
    confirm:() => { blip(700, 0.08, 'square', 0.05, 1100); setTimeout(() => blip(1050, 0.1, 'square', 0.05), 70); },
    rumble: () => { noiseBurst(0.45, 0.14, 460, 50); blip(66, 0.45, 'sawtooth', 0.11, 40); },
    flame:  () => { if (Math.random() < 0.5) noiseBurst(0.07, 0.035, 900, 300); },   // soft whoosh (fires often)
    rocketFire: () => { blip(200, 0.22, 'sawtooth', 0.08, 55); noiseBurst(0.22, 0.11, 1300, 180); },
  };

  // ════════════════════════════════════════════════════════════════════════
  // MUSIC — one driving, intense Contra-style synth loop (same track every
  // level for now). WebAudio lookahead scheduler: minor-key galloping bass +
  // heroic square lead + kick/hat. Light on the CPU (a few short nodes/step).
  // ════════════════════════════════════════════════════════════════════════
  let musicOn = false, _musTimer = null, _musStep = 0, _musNextT = 0, musicGain = null;
  const MUS_STEP = 0.092;                                  // ~163 BPM sixteenths — driving
  const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);
  // A multi-section song (each section = 32 steps / 2 bars). The SONG order
  // strings them together so it develops instead of looping one riff.
  // A = main driving riff, B = syncopated 16th push, C = soaring bridge,
  // D = variation with a turnaround fill. 'busy' drums = 8th kicks + 16th hats.
  // Dark, driving A-minor descent (Am–G–F–E). Bass gallops in low sawtooth,
  // lead is gritty sawtooth, section B is the pounding "DUN DUN DUN… DUNNNN"
  // hook (a run of stabs into a long held note).
  const SECTIONS = {
    A: { drums: 'straight',                                             // main heavy riff
      bass: [45,45,45,-1,45,45,45,-1, 43,43,43,-1,43,43,43,-1, 41,41,41,-1,41,41,41,-1, 40,40,40,-1,40,40,40,-1],
      lead: [64,-1,64,-1,67,-1,64,-1, 62,-1,62,-1,64,-1,62,-1, 60,-1,60,-1,62,-1,60,-1, 59,-1,64,64,64,-1,64,-1] },
    B: { drums: 'busy',                                                 // the pounding hook
      bass: [45,45,45,45,45,45,45,45, 45,45,45,45,45,45,-1,-1, 40,40,40,40,40,40,40,40, 40,40,40,40,40,40,-1,-1],
      lead: [64,64,64,64,64,64,64,-1, 76,-1,-1,-1,-1,-1,-1,-1, 64,64,64,64,64,64,64,-1, 77,-1,-1,-1,-1,-1,-1,-1] },
    C: { drums: 'straight',                                             // climbing build
      bass: [45,-1,45,45,43,-1,43,43, 41,-1,41,41,40,-1,40,40, 45,-1,45,45,43,-1,43,43, 41,41,41,41,40,40,40,40],
      lead: [64,-1,67,-1,69,-1,71,-1, 67,-1,69,-1,71,-1,72,-1, 69,-1,71,-1,72,-1,74,-1, 71,-1,74,-1,76,76,76,-1] },
    D: { drums: 'busy',                                                 // aggressive variation + fill
      bass: [45,45,45,-1,45,45,45,-1, 43,43,43,-1,43,43,43,-1, 41,41,41,-1,41,41,41,-1, 40,40,43,43,45,45,47,47],
      lead: [67,-1,64,-1,67,-1,69,-1, 71,-1,69,-1,67,-1,64,-1, 72,-1,71,-1,69,-1,67,-1, 64,64,-1,64,64,-1,64,-1] },
  };
  const SONG = ['A','A','B','A','C','B','D','B'];   // ~24s before it repeats
  function musVoice(freq, t, dur, type, vol) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(musicGain); o.start(t); o.stop(t + dur + 0.02);
  }
  function musKick(t) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.13);
    g.gain.setValueAtTime(0.30, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.17);
  }
  function musHat(t) {
    const sr = audioCtx.sampleRate, buf = audioCtx.createBuffer(1, Math.floor(sr * 0.03), sr), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = audioCtx.createBufferSource(); s.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7200;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    s.connect(f).connect(g).connect(musicGain); s.start(t); s.stop(t + 0.04);
  }
  function musSnare(t) {
    const sr = audioCtx.sampleRate, buf = audioCtx.createBuffer(1, Math.floor(sr * 0.13), sr), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = audioCtx.createBufferSource(); s.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.6;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    const o = audioCtx.createOscillator(), og = audioCtx.createGain();  // tonal body
    o.type = 'triangle'; o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.07);
    og.gain.setValueAtTime(0.07, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    s.connect(f).connect(g).connect(musicGain); o.connect(og).connect(musicGain);
    s.start(t); s.stop(t + 0.14); o.start(t); o.stop(t + 0.1);
  }
  function musPower(rootMidi, t, dur) {   // sustained root+fifth for weight
    for (const iv of [0, 7]) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(midiHz(rootMidi + iv), t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(musicGain); o.start(t); o.stop(t + dur + 0.02);
    }
  }
  function scheduleMusic() {
    if (!musicOn || !audioCtx) return;
    // master level follows mute + ducks under the pause screen
    musicGain.gain.value = muted ? 0 : (state === PAUSED ? 0.2 : 0.46);
    while (_musNextT < audioCtx.currentTime + 0.18) {
      const g = _musStep, s = g % 32, t = _musNextT;
      const sec = SECTIONS[SONG[Math.floor(g / 32) % SONG.length]];
      // heavy galloping bass
      const bn = sec.bass[s]; if (bn >= 0) musVoice(midiHz(bn), t, 0.11, 'sawtooth', 0.18);
      // sustained power chord (root+fifth) on each chord change — weight
      if (s % 8 === 0 && sec.bass[s] >= 0) musPower(sec.bass[s], t, MUS_STEP * 8 * 0.92);
      // gritty saw lead; held notes ring out (the "…DUNNNN")
      const ln = sec.lead[s];
      if (ln >= 0) {
        let hold = 1; while (hold < 8 && s + hold < 32 && sec.lead[s + hold] === -1) hold++;
        const dur = Math.min(0.55, 0.10 + (hold - 1) * MUS_STEP * 0.9);
        musVoice(midiHz(ln), t, dur, 'sawtooth', 0.095);
        musVoice(midiHz(ln) * 1.007, t, dur, 'sawtooth', 0.045);   // detuned grit, not a cutesy octave
      }
      // driving drums: quarter kick, backbeat snare, 8th/16th hats
      if (s % 4 === 0) musKick(t);
      if (s % 8 === 4) musSnare(t);
      if (sec.drums === 'busy') musHat(t); else if (s % 2 === 0) musHat(t);
      _musNextT += MUS_STEP; _musStep++;
    }
    _musTimer = setTimeout(scheduleMusic, 45);
  }
  function startMusic() {
    ensureAudio();
    if (!audioCtx || musicOn) return;
    musicGain = audioCtx.createGain(); musicGain.gain.value = 0.42; musicGain.connect(audioCtx.destination);
    musicOn = true; _musStep = 0; _musNextT = audioCtx.currentTime + 0.06;
    scheduleMusic();
  }
  function stopMusic() { musicOn = false; if (_musTimer) { clearTimeout(_musTimer); _musTimer = null; } }

  // ════════════════════════════════════════════════════════════════════════
  // COLOR + BAKE KIT (techniques from meteorblaster.html)
  // ════════════════════════════════════════════════════════════════════════
  const SS = 3;
  function colorToRgb(c) {
    if (c[0] === '#') { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    const m = c.match(/(\d+),\s*(\d+),\s*(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [255, 255, 255];
  }
  function rgba(c, a) { const [r, g, b] = colorToRgb(c); return `rgba(${r},${g},${b},${a})`; }
  function shade(c, k) {
    const [r, g, b] = colorToRgb(c);
    const f = v => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function bake(w, h, fn, ss = SS) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * ss));
    c.height = Math.max(1, Math.round(h * ss));
    const g = c.getContext('2d');
    g.scale(ss, ss);
    fn(g, w, h);
    return { c, w, h };
  }
  function whiten(s) {
    const c = document.createElement('canvas');
    c.width = s.c.width; c.height = s.c.height;
    const g = c.getContext('2d');
    g.drawImage(s.c, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    return { c, w: s.w, h: s.h };
  }
  function glowDot(g, x, y, r, color, a = 0.8) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rgba(color, a));
    gr.addColorStop(0.55, rgba(color, a * 0.35));
    gr.addColorStop(1, rgba(color, 0));
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // ════════════════════════════════════════════════════════════════════════
  // CRUNCHY PIXEL-ART KIT — hand-pixeled 16-bit terrain/sprite primitives.
  // Everything snaps to an integer pixel grid so bakes read as chunky, hard-
  // edged blocks (no smooth gradients). Reused by terrain now + the later
  // character/enemy/boss art pass. Draw terrain with imageSmoothing OFF so the
  // upscale to screen keeps pixels razor-sharp.
  // ════════════════════════════════════════════════════════════════════════
  // Grid-snapped filled block.
  function pxRect(g, x, y, w, h, color) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    if (w <= 0 || h <= 0) return;
    g.fillStyle = color; g.fillRect(x, y, w, h);
  }
  // Checkerboard dither of two tones (cell = px). Hard tone transition, not a blend.
  function dither(g, x, y, w, h, colA, colB, px = 2) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    if (w <= 0 || h <= 0) return;
    for (let j = 0; j < h; j += px) {
      for (let i = 0; i < w; i += px) {
        g.fillStyle = ((((i / px) | 0) + ((j / px) | 0)) & 1) ? colB : colA;
        g.fillRect(x + i, y + j, Math.min(px, w - i), Math.min(px, h - j));
      }
    }
  }
  // Hard 4-step tone ramp from a base color: outline / low / mid / high.
  function pal(base) {
    return { hi: shade(base, 0.34), mid: base, lo: shade(base, -0.30), out: shade(base, -0.60) };
  }
  // Seeded LCG (reusable — replaces the inline copies scattered in the bakes).
  function rngOf(seed) { let s = (seed >>> 0) || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
  // Chunky grid-aligned speckle. `inset` keeps specks off the tile edges so
  // horizontally-tiled ground still seams cleanly.
  function pxNoise(g, x, y, w, h, colors, rnd, count, px = 2, inset = 0) {
    const cw = Math.max(px, w - inset * 2), ch = Math.max(px, h - inset * 2);
    for (let i = 0; i < count; i++) {
      const rx = x + inset + Math.floor(rnd() * cw / px) * px;
      const ry = y + inset + Math.floor(rnd() * ch / px) * px;
      g.fillStyle = colors[(rnd() * colors.length) | 0];
      g.fillRect(rx, ry, px, px);
    }
  }
  // A chiseled shaded block: dark outline, lit top, dithered midriff, dark belly.
  function pxBlock(g, x, y, w, h, p) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    pxRect(g, x - 1, y - 1, w + 2, h + 2, p.out);       // outline
    pxRect(g, x, y, w, h, p.mid);
    const t = Math.max(2, Math.round(h * 0.32));
    pxRect(g, x, y, w, t, p.hi);                          // lit cap
    pxRect(g, x, y + h - t, w, t, p.lo);                  // shadowed belly
    dither(g, x, y + t, w, Math.max(2, Math.round(h * 0.22)), p.hi, p.mid, 3);
  }
  // Crunchy square "glow" — concentric alpha squares (no smooth radial blur).
  function pxGlow(g, cx, cy, r, color, step = 3) {
    for (let i = r; i > 0; i -= step) {
      g.fillStyle = rgba(color, 0.10 + 0.55 * (1 - i / r));
      g.fillRect(Math.round(cx - i), Math.round(cy - i), Math.round(i * 2), Math.round(i * 2));
    }
  }
  // Chunky stepped silhouette ridge: columns of width `step` from a quantized
  // height fn down to floorY. fn MUST be periodic over w (fn(0)==fn(w)) and
  // `step` MUST divide w so the layer tiles seamlessly.
  function pxRidge(g, w, floorY, color, fn, step = 8, q = 4) {
    for (let x = 0; x < w; x += step) {
      const y = Math.round(fn(x + step / 2) / q) * q;
      pxRect(g, x, y, step, floorY - y, color);
    }
  }

  function pxSupported(str) { for (let i = 0; i < str.length; i++) { const c = str[i]; if (c === ' ') continue; if (!PXF[c]) return false; } return true; }
  // Draw a run-length pixel string into context g. shadow=true → dark drop-shadow.
  function pxTextG(g, str, x, y, scale, color, align, shadow) {
    align = align || 'left';
    const adv = 6 * scale, total = str.length * adv - scale;
    const sx = align === 'center' ? Math.round(x - total / 2) : align === 'right' ? Math.round(x - total) : Math.round(x);
    const top = Math.round(y) - 7 * scale;
    for (let pass = shadow ? 0 : 1; pass < 2; pass++) {
      g.fillStyle = pass === 0 ? (shadow === true ? 'rgba(0,0,0,0.85)' : shadow) : color;
      const off = pass === 0 ? scale : 0;
      let cx = sx;
      for (let ci = 0; ci < str.length; ci++) {
        const rows = PXF[str[ci]];
        if (rows) {
          for (let r = 0; r < 7; r++) {
            const row = rows[r]; let c = 0;
            while (c < 5) {

  // Per-frame draw helpers. drawSprRot/Pivot reset straight to the world cam.
  let _camX = 0, _camY = 0;

    ctx.translate(x, y); ctx.rotate(rot);

  // CRUNCHY bro: chunky pixel blocks, hard 4-tone ramps, dark outline. Same

  function bakeBro(g, b, facing, pose) {

    g.translate(13, 0);

  // muzzle flash

  // ---- Bullets (capsule + halo + white core), cached per color ----
  const _boltCache = {}, _laserCache = {};
  function boltSpr(color) {

  // ---- Explosions: 9-frame sheet x 3 tiers x tints (meteorblaster technique) ----
  const EXPLO_FRAMES = 9;
  const EXPLO_SIZES = [30, 62, 120];
  const EXPLO_TINTS = { orange: '#ff9944', red: '#ff5252', green: '#aaff60', gray: '#9aa2b6', white: '#ffffff', gold: '#ffce4d' };
  SPR.explo = {};
  for (const tname of Object.keys(EXPLO_TINTS)) {
    const col = EXPLO_TINTS[tname];
    SPR.explo[tname] = EXPLO_SIZES.map((D, tier) => {
      const frames = [];
      const CW = Math.round(D * 1.35);
      for (let f = 0; f < EXPLO_FRAMES; f++) {
        const t = f / (EXPLO_FRAMES - 1);
        frames.push(bake(CW, CW, g => {
          g.translate(CW / 2, CW / 2);
          const R = D / 2;
          let seed = (f * 7919 + tier * 104729 + tname.length * 31) >>> 0;
          const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
          const px = Math.max(2.2, D / 11);
          const chunk = (x, y, ccol, k = 1) => { g.fillStyle = ccol; const s2 = px * k; g.fillRect(Math.round(x - s2 / 2), Math.round(y - s2 / 2), Math.round(s2), Math.round(s2)); };
          if (t < 0.38) {
            const r = R * (0.30 + t * 1.7);
            glowDot(g, 0, 0, r * 1.5, col, 0.85);
            for (let i = 0; i < 14; i++) { const a = rnd() * Math.PI * 2, d = rnd() * r * 0.85, ramp = d / r; chunk(Math.cos(a) * d, Math.sin(a) * d, ramp < 0.35 ? '#ffffff' : ramp < 0.7 ? '#ffe9a0' : col, 1.6 - ramp * 0.6); }
            glowDot(g, 0, 0, r * 0.55, '#ffffff', 0.95);
          } else if (t < 0.72) {
            const r = R * (0.75 + t * 0.45);
            glowDot(g, 0, 0, r, col, 0.5 * (1 - t));
            for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2 + rnd() * 0.5, d = r * (0.55 + rnd() * 0.45), ramp = rnd(); chunk(Math.cos(a) * d, Math.sin(a) * d, ramp < 0.3 ? '#ffe9a0' : ramp < 0.7 ? col : shade(col, -0.4), 1.15 - t * 0.5); }
            for (let i = 0; i < 4; i++) { const a = rnd() * Math.PI * 2, d = rnd() * r * 0.5; chunk(Math.cos(a) * d, Math.sin(a) * d, 'rgba(70,70,80,0.8)', 1.5); }
          } else {
            const r = R * (1.0 + t * 0.35), fade = (1 - t) / 0.28;
            for (let i = 0; i < 6; i++) { const a = rnd() * Math.PI * 2, d = rnd() * r * 0.8, sr = px * (2.2 + rnd() * 1.4); const sg = g.createRadialGradient(Math.cos(a) * d, Math.sin(a) * d, 0, Math.cos(a) * d, Math.sin(a) * d, sr); sg.addColorStop(0, `rgba(90,90,100,${0.5 * fade})`); sg.addColorStop(1, 'rgba(90,90,100,0)'); g.fillStyle = sg; g.fillRect(Math.cos(a) * d - sr, Math.sin(a) * d - sr, sr * 2, sr * 2); }
          }
        }, 1.5));
      }
      return frames;
    });
  }

  // ════════════════════════════════════════════════════════════════════════
  // PARALLAX — per-level baked layer sets (CRUNCHY 16-bit pixel art).
  // Each layer: { spr, factor (0=static..1=world), y, tileW }. Drawn with a
  // couple of wrapped drawImage calls. Sky/far/mid/near are chunky, atmospheric
  // and each seamless across its own width (fn(0)==fn(w), features interior).
  // An extra top-fringe `fg` layer per level is trimmed under LOWFX.
  // ════════════════════════════════════════════════════════════════════════
  const PARALLAX = {};
  const GY = 232;
  // Banded + dithered sky (crunchy, no smooth gradient). stops = [[y,color],...]
  function crunchySky(stops, decorate) {
    return bake(VW, VH, (g) => {
      for (let i = 0; i < stops.length; i++) {
        const y0 = stops[i][0], y1 = i + 1 < stops.length ? stops[i + 1][0] : VH;
        pxRect(g, 0, y0, VW, y1 - y0, stops[i][1]);
        if (i + 1 < stops.length) dither(g, 0, y1 - 7, VW, 14, stops[i][1], stops[i + 1][1], 4);
      }
      decorate && decorate(g);
    }, 1);
  }

  // ── L1 JUNGLE — chunky mossy canopy, blocky trunks, pixel waterfall ──
  function bakeJungleParallax() {
    const sky = crunchySky([[0, '#0a2b1c'], [70, '#13472b'], [140, '#1f6b47'], [200, '#2c8f5e']], (g) => {
      glowDot(g, 388, 44, 120, '#d7ffb8', 0.30); glowDot(g, 388, 44, 58, '#f2ffe0', 0.42);
      // blocky god-ray shafts fanning down-left
      g.save(); g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 6; i++) { const a = 2.0 + i * 0.12, len = 250; for (let t = 0; t < len; t += 6) { const x = 388 + Math.cos(a) * t, y = 40 + Math.sin(a) * t; pxRect(g, x, y, 4, 6, 'rgba(190,255,150,0.05)'); } }
      g.restore();
    });
    // FAR: stepped canopy ridge + distant pixel waterfall
    const far = bake(640, VH, (g, w) => {
      const R = x => 118 + Math.sin(x * 2 * Math.PI * 2 / w) * 24 + Math.sin(x * 2 * Math.PI * 4 / w) * 12;
      pxRidge(g, w, GY, '#0f3122', R, 8, 4);
      for (let x = 0; x < w; x += 16) pxRect(g, x, R(x + 8) - 4, 8, 4, '#1c5237');   // lit rim
      // WATERFALL between two dark cliffs (interior)
      const wx = 432; pxRect(g, wx - 30, 66, 18, GY - 66, '#0a221a'); pxRect(g, wx + 20, 66, 18, GY - 66, '#0a221a');
      for (let y = 72; y < GY - 6; y += 4) { const c = ((y / 4) & 1) ? '#cfeefc' : '#9fd6ea'; pxRect(g, wx - 8, y, 26, 3, c); }
      pxGlow(g, wx + 5, GY - 6, 22, '#dff3ff', 4);
    }, 1);
    // MID: blocky trunks + chunky canopy clusters
    const mid = bake(560, VH, (g, w) => {
      const rnd = rngOf(999);
      for (let i = 0; i < 7; i++) {
        const x = Math.round(40 + (i / 7) * (w - 80) + (rnd() - 0.5) * 20), th = 120 + ((rnd() * 12) | 0) * 4, ty = GY - th;

  // ── L2 DESERT — stacked sandstone mesas, blocky dunes, sun haze ──

  // ── L3 FACTORY — riveted girders, machinery, warning stripes, deep dark ──
  function bakeFactoryParallax() {

  // ── L6 ALIEN HIVE — chitin mounds, pulsing egg-sacs, membrane, bio-glow ──

  // ══════════════════ L7-L12 PARALLAX (new worlds) ══════════════════

  // ── L7 CITY RUINS — shattered skyscrapers, dusk haze, smoke plumes ──
  function bakeCityParallax() {
    const sky = crunchySky([[0, '#2e2836'], [90, '#5a4048'], [170, '#a8663e']], (g) => {

      for (let i = 0; i < 4; i++) { const bx = 70 + i * 150; for (let y = 30; y < 200; y += 10) pxRect(g, bx + Math.round(Math.sin(y * 0.04 + i) * 10), y, 12, 8, 'rgba(56,50,58,0.16)'); }
    });

      }

      const rnd = rngOf(1207), bp = pal('#5a5260');
      for (let x = 20; x < w; x += 96) { const bh = 60 + ((rnd() * 14) | 0) * 4, bw = 52 + ((rnd() * 6) | 0) * 4; pxBlock(g, x, GY - bh, bw, bh, bp); for (let k = 0; k < 3; k++) pxRect(g, x + 8 + k * 14, GY - bh + 10, 8, bh - 20, 'rgba(20,18,26,0.5)'); pxRect(g, x - 6, GY - 18, bw + 12, 18, '#3a3440'); }

  // ── L8 CRYSTAL CAVERN — deep rock, glowing crystals, stalactites ──
  function bakeCaveParallax() {
    const sky = crunchySky([[0, '#140f22'], [110, '#221838'], [200, '#2e1f4a']], (g) => { glowDot(g, 150, 90, 96, '#b06ad8', 0.2); glowDot(g, 360, 70, 80, '#5fd6ff', 0.18); });
    // FAR: cavern back-wall + hanging stalactites with crystal glints
    const far = bake(680, VH, (g, w) => {

      for (let x = 20; x < w; x += 60) { const l = 20 + ((x / 60 % 3) | 0) * 14; for (let y = 0; y < l; y += 4) pxRect(g, x, 40 + y, Math.max(2, 8 - (y >> 2)), 4, (y & 4) ? '#2e2246' : '#3a2c58'); }

        pxGlow(g, x, GY - cH + 10, 8, col, 3);
      }
    }, 1);

  // ════════════════════════════════════════════════════════════════════════
  // GROUND + PLATFORM TILES — CRUNCHY 16-bit, hand-pixeled per palette.
  // Ground tile is 128 wide and tiles seamlessly horizontally: full-width
  // bands + periodic cap motif (period divides 128) + interior-only features.
  // Only the top ~40px is on-screen (drawn from groundY=232 down past VH).
  // ════════════════════════════════════════════════════════════════════════
  // cfg: { body, deep, cap, capHi, capH, seed, strata:[[y,h,color]], features(g,w,h,rnd,B), capMotif(g,w) }
  function crunchyGround(base, cfg) {
    const w = 128, h = VH - 200, B = pal(base);
    return bake(w, h, (g) => {
      const rnd = rngOf(cfg.seed || 3131);
      // body: stacked flat tone steps (crunchy, no smooth gradient)
      pxRect(g, 0, 0, w, h, cfg.body);
      pxRect(g, 0, 26, w, h - 26, cfg.deep);
      dither(g, 0, 20, w, 8, cfg.body, cfg.deep, 4);
      dither(g, 0, 42, w, 8, cfg.deep, shade(cfg.deep, -0.35), 4);
      for (const s of (cfg.strata || [])) pxRect(g, 0, s[0], w, s[1], s[2]);   // full-width => seamless
      cfg.features && cfg.features(g, w, h, rnd, B);                            // interior-only
      // top surface cap (full width => seamless)
      const capH = cfg.capH != null ? cfg.capH : 7;
      pxRect(g, 0, 0, w, capH, cfg.cap || B.mid);
      pxRect(g, 0, 0, w, 2, cfg.capHi || B.hi);
      pxRect(g, 0, capH, w, 1, B.out);
      dither(g, 0, capH + 1, w, 4, cfg.cap || B.mid, cfg.body, 4);
      cfg.capMotif && cfg.capMotif(g, w, B);
    }, 1);
  }
  // 64x16 ledge: bright cap, hard-shaded body, dithered belly, dark outline.
  function crunchyPlatform(base, opts) {
    opts = opts || {}; const P = pal(base);
    return bake(64, 16, (g) => {
      const rnd = rngOf(opts.seed || 707);
      pxRect(g, 0, 0, 64, 16, P.out);
      pxRect(g, 0, 2, 64, 12, P.lo);
      pxRect(g, 0, 2, 64, 6, P.mid);
      dither(g, 0, 8, 64, 3, P.mid, P.lo, 3);
      pxRect(g, 0, 0, 64, 3, opts.cap || P.hi);
      pxRect(g, 0, 0, 64, 1, opts.capHi || shade(base, 0.6));
      pxRect(g, 0, 14, 64, 2, P.out);
      opts.detail && opts.detail(g, P, rnd);
    }, 1);
  }

  // ── JUNGLE ground/platform: mossy cap over chiseled soil + boulders ──
  SPR.ground_jungle = crunchyGround('#4f9a38', {
    seed: 313, body: '#5a3a1e', deep: '#31200f', cap: '#3f8a2c', capHi: '#8fe05a', capH: 6,
    strata: [[22, 3, 'rgba(0,0,0,0.28)'], [32, 2, 'rgba(255,216,160,0.07)'], [46, 4, 'rgba(0,0,0,0.30)']],
    features(g, w, h, rnd) {
      const rock = pal('#6b5a44');
      for (let i = 0; i < 4; i++) { const bw = 16 + ((rnd() * 3) | 0) * 4, bh = 12 + ((rnd() * 2) | 0) * 4, x = 12 + ((rnd() * (w - 28 - bw) / 4) | 0) * 4, y = 22 + ((rnd() * (h - 30 - bh) / 4) | 0) * 4; pxBlock(g, x, y, bw, bh, rock); pxRect(g, x, y, bw, 2, '#3f7d2f'); }
      pxNoise(g, 6, 10, w - 12, h - 14, ['rgba(0,0,0,0.30)', 'rgba(255,225,170,0.10)', '#3f2a16'], rnd, 56, 2, 4);
      g.fillStyle = 'rgba(0,0,0,0.34)';
      for (let i = 0; i < 3; i++) { let x = 24 + ((rnd() * (w - 48) / 4) | 0) * 4, y = 12; while (y < h - 6) { g.fillRect(x, y, 2, 4); x += (rnd() < 0.5 ? -2 : 2); y += 6; } }
      g.fillStyle = 'rgba(58,120,45,0.6)';
      for (let i = 0; i < 7; i++) { const x = 8 + ((rnd() * (w - 16) / 4) | 0) * 4; g.fillRect(x, 6, 3, 4 + ((rnd() * 3) | 0) * 2); }
    },
    capMotif(g, w) { for (let x = 0; x < w; x += 8) { pxRect(g, x + 2, -1, 4, 3, (x / 8) & 1 ? '#57a63f' : '#3f8a2c'); pxRect(g, x + 3, 1, 2, 4, '#2c5f22'); } }

  });

  // ── FACTORY ground/platform: riveted steel panels + grating ──
  SPR.ground_factory = crunchyGround('#6a7284', {

      if (!p.alive || p.downed) continue;
      const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

    b.life = 200; b.color = color || '#ff5252'; b.r = 4;
    b.spr = null; b.homing = false; b.arc = false; b.grav = 0;
    sfx.enemyShot();
  }

  // ════════════════════════════════════════════════════════════════════════
  // GAME STATE
  // ════════════════════════════════════════════════════════════════════════
  const TITLE = 'title', CHARSEL = 'charsel', WORLDSEL = 'worldsel', STORY = 'story', PLAYING = 'playing',
    PAUSED = 'paused', CLEAR = 'clear', MORECOMING = 'more', VICTORY = 'victory';
  let state = TITLE;
  let players = [];
  let LV = LEVELS[0];
  let levelIndex = 0;
  let camX = 0, camLockX = null;
  let shake = 0;
  let score = 0, best = 0;
  try { best = parseInt(localStorage.getItem('broforce_best') || '0', 10) || 0; } catch {}
  // ── World-select + difficulty (kid-friendly front-end additions) ──
  // reached = number of worlds CLEARED so far (0..LEVELS.length); worlds with
  // index < reached show a clear-star and the cursor defaults to `reached`.
  let reached = 0;
  try { reached = parseInt(localStorage.getItem('broforce_reached') || '0', 10) || 0; } catch {}
  let worldSel = 0;                 // WORLDSEL cursor
  let difficultyMode = 'classic';   // 'rookie' | 'classic'
  try { const d = localStorage.getItem('broforce_diff'); if (d === 'rookie' || d === 'classic') difficultyMode = d; } catch {}
  function isRookie() { return difficultyMode === 'rookie'; }
  function ebSpeedMul() { return isRookie() ? 0.8 : 1; }   // rookie: slower enemy shots
  function setDifficulty(d) { difficultyMode = (d === 'rookie') ? 'rookie' : 'classic'; try { localStorage.setItem('broforce_diff', difficultyMode); } catch {} }
  function markCleared(idx) { if (idx + 1 > reached) { reached = idx + 1; try { localStorage.setItem('broforce_reached', String(reached)); } catch {} } }
  let combo = 0, comboTimer = 0, newBestFlash = 0;
  let shotsFired = 0, shotsHit = 0, deathsThisLevel = 0, secretsFound = 0;
  let bgScroll = 0;
  let arena = { x0: 0, x1: 0, active: false };
  let slowmo = 0;
  let bombFlash = 0;
  let cat = null, catTimer = 400, catAssistTimer = 540;
  let bannerText = '', bannerSub = '', bannerT = 0;
  let checkpointX = 0;
  let storyT = 0;

  // char-select cursor state
  let selIndex = [0, 0], selReady = [false, false], p2Present = false;
  let p2JoinedGame = false;

  function difficulty() { return 1 + levelIndex * 0.4 + (boss ? 0.4 : 0); }

  function freshPlayer(idx, broId) {
    return {
      idx, broId, x: 60, y: LV.groundY, vx: 0, vy: 0, w: PLW, h: PLH,
      facing: 1, grounded: false, prone: false,
      weapon: 'rifle', cd: 0, aimx: 1, aimy: 0, muzzle: 0,
      health: isRookie() ? 5 : 3, maxHealth: isRookie() ? 5 : 3, invuln: 0, flash: 0,
      downed: false, downTimer: 0, reviveProg: 0, alive: true, respawnT: 0,
      shieldTime: 0, ddmgTime: 0, specials: START_SPECIALS,
      kills: 0, walkT: 0, walkFrame: 0, jumpHeld: false, coyote: 0,
