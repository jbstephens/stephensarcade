<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   ISLAND FORGE — Stephens Arcade
   Kid-friendly incremental island builder. One file, zero assets:
   every sprite is baked into offscreen canvases at load, all audio is
   WebAudio synth. Per-frame hot path is drawImage + transforms only —
   all static content (ocean, land, wires, paths, buildings, trees) lives in ONE
   background canvas rebuilt only when the island changes.
   ═══════════════════════════════════════════════════════════════════════ */

const W = 1280, H = 720, TILE = 32, GY0 = 8;
/* v4b: TWO worlds. The active world's grid/canvases live in these globals;
   the inactive world's live in `otherWorld` and swap in wholesale. */
const EGW = 80, EGH = 44;                      // Earth grid
const MGW = 40, MGH = 26;                      // Moon grid (all space around one landmass)
const RGW = 44, RGH = 28;                      // v6b: Mars grid — bigger than the moon
let GW = EGW, GH = EGH;
let WORLD_W = GW * TILE, WORLD_H = GY0 + GH * TILE;   // 2560 x 1416 (Earth)
const CX = 24, CYG = 13;                       // home island centre in grid coords
const MCX = 20, MCY = 13;                      // moon landmass centre
const RCX = 22, RCY = 14;                      // mars landmass centre
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ───── tiny utils ───── */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) ^ ((x + 7) * (y + 13) * 1274126177);
  h = (h ^ (h >>> 13)) >>> 0;
  return (h % 1024) / 1024;
}
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return '' + n;
}
const tX = gx => gx * TILE, tY = gy => GY0 + gy * TILE;

/* ───── storage ───── */
const SLOT_KEY = i => 'islandforge_slot' + i;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
let best = parseInt(lsGet('islandforge_best') || '0', 10) || 0;
let muted = lsGet('islandforge_mute') === '1';

/* ───── audio (all synthesized, context created lazily on first gesture) ───── */
let actx = null, musNext = 0, chordI = 0;
function ensureAudio() {
  if (!actx) {
    const A = window.AudioContext || window.webkitAudioContext;
    if (A) { actx = new A(); musNext = actx.currentTime + 0.4; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function blip(freq, dur, type, vol, sweepTo) {
  if (!actx || muted) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (sweepTo != null) o.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.06, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, peak, lp0, lp1) {
  if (!actx || muted) return;
  const t0 = actx.currentTime, sr = actx.sampleRate;
  const buf = actx.createBuffer(1, Math.floor(sr * dur), sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length * 0.5);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(lp0, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(30, lp1), t0 + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(actx.destination);
  src.start(t0); src.stop(t0 + dur + 0.05);
}
let lastTickSnd = 0;
const SFX = {

  confirm:  () => { blip(660, 0.07, 'triangle', 0.07); setTimeout(() => blip(990, 0.09, 'triangle', 0.07), 60); },
  cancel:   () => blip(330, 0.09, 'square', 0.05, 200),
  chop:     () => { noiseBurst(0.07, 0.12, 1600, 500); blip(190, 0.06, 'square', 0.07, 120); },
  mine:     () => { noiseBurst(0.06, 0.12, 2600, 900); blip(560, 0.05, 'square', 0.05, 340); },
  place:    () => { blip(240, 0.1, 'triangle', 0.09, 480); noiseBurst(0.1, 0.08, 900, 300); },

  legendary:() => { [660, 880, 1100, 1320, 1760].forEach((f, i) => setTimeout(() => blip(f, 0.18, 'triangle', 0.08), i * 90)); },

  hungry:   () => blip(420, 0.12, 'sine', 0.05, 300),
  power:    () => { [440, 660, 880].forEach((f, i) => setTimeout(() => blip(f, 0.14, 'sawtooth', 0.05, f * 1.4), i * 70)); },
  count:    () => blip(700, 0.14, 'square', 0.08),
  rumble:   () => { noiseBurst(2.8, 0.26, 400, 60); blip(60, 2.6, 'sawtooth', 0.14, 30); },
  firework: () => { noiseBurst(0.25, 0.12, 2400, 200); blip(1200, 0.2, 'triangle', 0.04, 300); },
  hatch:    () => { [520, 700, 940].forEach((f, i) => setTimeout(() => blip(f, 0.1, 'sine', 0.07), i * 80)); },
  alarm:    () => { [420, 300, 420, 300].forEach((f, i) => setTimeout(() => blip(f, 0.16, 'square', 0.06), i * 180)); },
  boom:     () => { noiseBurst(0.5, 0.28, 900, 60); blip(90, 0.4, 'sawtooth', 0.1, 35); },
  fixed:    () => { [523, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.12, 'triangle', 0.08), i * 70)); },
  gate:     () => { [330, 440, 587, 784].forEach((f, i) => setTimeout(() => blip(f, 0.3, 'sawtooth', 0.05, f * 1.5), i * 160)); },
  splash:   () => { noiseBurst(0.28, 0.14, 1400, 220); blip(320, 0.14, 'sine', 0.05, 130); },
  /* v4c: pop cannon */
  shoot:    () => { noiseBurst(0.12, 0.14, 900, 220); blip(150, 0.16, 'square', 0.07, 430); },
  bounce:   () => blip(300, 0.07, 'sine', 0.06, 620),
  boing:    () => { blip(150, 0.08, 'sine', 0.09, 80); setTimeout(() => blip(190, 0.24, 'sine', 0.08, 540), 50); },
  burst:    () => { noiseBurst(0.2, 0.14, 2200, 300); blip(900, 0.18, 'triangle', 0.06, 260); },
  /* v5b: interiors */
  purr:     () => { blip(170, 0.32, 'sine', 0.05, 130); setTimeout(() => blip(210, 0.26, 'sine', 0.045, 150), 130); },
  ding:     () => { blip(880, 0.16, 'triangle', 0.06); setTimeout(() => blip(1320, 0.3, 'triangle', 0.05), 110); },
  door:     () => { blip(300, 0.08, 'triangle', 0.06, 420); setTimeout(() => blip(460, 0.1, 'triangle', 0.05, 620), 70); },
  /* v7: asteroid rush */
  jet:      () => { noiseBurst(0.22, 0.09, 2000, 500); blip(540, 0.3, 'sine', 0.05, 180); },
  thunk:    () => { blip(120, 0.12, 'square', 0.09, 70); noiseBurst(0.08, 0.1, 700, 250);
                    setTimeout(() => blip(760, 0.07, 'triangle', 0.05, 1100), 70); },
  zap:      () => { blip(1400, 0.09, 'sawtooth', 0.045, 300); noiseBurst(0.06, 0.07, 3200, 1200); },
};
/* cozy ambient loop — soft pad chords + pentatonic plucks, scheduled ahead */
const CHORDS = [[130.8, 196, 329.6], [110, 164.8, 261.6], [87.3, 130.8, 220], [98, 146.8, 246.9]];
const PENTA = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];
function musicTick() {
  if (!actx || muted) return;
  const now = actx.currentTime;
  if (musNext < now - 4) musNext = now + 0.1;
  while (musNext < now + 0.5) {
    const t0 = musNext, ch = CHORDS[chordI % CHORDS.length]; chordI++;
    for (const f of ch) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.02, t0 + 0.8);
      g.gain.linearRampToValueAtTime(0.0001, t0 + 3.1);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 3.2);
    }
    for (let i = 0; i < 4; i++) {
      if (Math.random() < 0.35) continue;
      const t1 = t0 + i * 0.8 + (Math.random() < 0.3 ? 0.4 : 0);
      const f = PENTA[(Math.random() * PENTA.length) | 0];
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.linearRampToValueAtTime(0.035, t1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.7);
      o.connect(g).connect(actx.destination); o.start(t1); o.stop(t1 + 0.75);
    }
    musNext += 3.2;
  }
}

                   metal: '#e8eef4', parts: '#ffd24a', power: '#59e0ff', science: '#7dff9a', pop: '#ffd1a1',
                   regolith: '#c2c9d6', ice: '#9fe8ff', he3: '#7dffe0', fuel: '#ff9a4a',

                   astroiron: '#d8c49a', crystal: '#c99bff', alloy: '#7dffe0', starsteel: '#9fd8ff' };

/* ═══════════════════════════════════════════════════════════════════════
   SPRITE ATLAS — everything baked once at load. P() draws chunky 2x
   "16px art" pixels; gradients/ellipses are fine HERE (load time only).
   ═══════════════════════════════════════════════════════════════════════ */
const SPR = {};
function C(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}
function S(w, h, fn) {          // w,h in art units (1 unit = 2px)
  const [c, g] = C(w * 2, h * 2);
  const P = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(Math.round(x * 2), Math.round(y * 2), Math.round(ww * 2), Math.round(hh * 2)); };
  fn(g, P);
  return c;
}
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function shad(g, cx, cy, rx, ry) {
  g.fillStyle = 'rgba(15,40,30,0.28)';
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 6.3); g.fill();
}
function glowDot(r, col) {      // baked radial glow sprite
  const [c, g] = C(r * 2, r * 2);
  const gr = g.createRadialGradient(r, r, 1, r, r, r);
  gr.addColorStop(0, col); gr.addColorStop(0.5, col.slice(0, 7) + '88'); gr.addColorStop(1, col.slice(0, 7) + '00');
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
  return c;
}

/* ═══ v5a: DECOR ART — paths (16-variant auto-connect sets), garden bits,
   showpieces and the golden trophies. ALL baked at load. ═══ */
const FLAG_COLS = [['#e05a3a', '#f0705e'], ['#3a7bd5', '#5f9ae8'], ['#4cb45a', '#6ecc78'], ['#ffd24a', '#ffe27a']];
function initDecorSprites() {
  SPR.dec = {}; SPR.path = {};
  /* covered rects for a connection mask: fat centre pad + an arm per bit */
  const maskRects = m => {
    const r = [[9, 9, 14, 14]];
    if (m & 1) r.push([9, 0, 14, 9]);
    if (m & 2) r.push([23, 9, 9, 14]);
    if (m & 4) r.push([9, 23, 14, 9]);
    if (m & 8) r.push([0, 9, 9, 14]);
    return r;
  };
  const inRects = (r, x, y) => r.some(q => x >= q[0] && x < q[0] + q[2] && y >= q[1] && y < q[1] + q[3]);
  const mkPathSet = paint => [...Array(16)].map((_, m) => {
    const [c, g] = C(32, 32);
    paint(g, maskRects(m), m);
    return c;
  });
  SPR.path.stonepath = mkPathSet((g, r, m) => {
    for (const q of r) { g.fillStyle = '#848c95'; g.fillRect(q[0], q[1], q[2], q[3]); }
    for (const q of r) { g.fillStyle = '#a9b1ba'; g.fillRect(q[0] + 1, q[1] + 1, q[2] - 2, q[3] - 2); }
    for (let i = 0; i < 26; i++) {
      const x = (i * 7 + m * 3) % 30, y = (i * 11 + 5 + m) % 30;
      if (!inRects(r, x, y) || !inRects(r, x + 3, y + 2)) continue;
      g.fillStyle = i % 3 ? '#98a0a8' : '#c6cdd5';
      g.fillRect(x, y, 3, 2);
    }
  });
  SPR.path.boardwalk = mkPathSet((g, r, m) => {
    for (const q of r) { g.fillStyle = '#7a4a2b'; g.fillRect(q[0], q[1], q[2], q[3]); }
    for (const q of r) { g.fillStyle = '#9c6b3d'; g.fillRect(q[0] + 1, q[1] + 1, q[2] - 2, q[3] - 2); }
    for (let y = 2; y < 32; y += 4) for (const q of r) {
      if (y <= q[1] || y >= q[1] + q[3] - 1) continue;
      g.fillStyle = '#8a5c33'; g.fillRect(q[0] + 1, y, q[2] - 2, 1);
      g.fillStyle = '#b07c48'; g.fillRect(q[0] + 1, y + 1, q[2] - 2, 1);
    }
    for (let i = 0; i < 8; i++) {
      const x = (i * 9 + m * 5 + 3) % 29, y = (i * 13 + 7) % 29;
      if (inRects(r, x, y)) { g.fillStyle = '#5f3a22'; g.fillRect(x, y, 1, 1); }
    }
  });
  SPR.path.sandtrail = mkPathSet((g, r, m) => {
    for (const q of r) { g.fillStyle = '#dbc27b'; g.fillRect(q[0], q[1], q[2], q[3]); }
    for (const q of r) { g.fillStyle = '#ecd794'; g.fillRect(q[0] + 1, q[1] + 1, q[2] - 2, q[3] - 2); }
    for (let i = 0; i < 22; i++) {
      const x = (i * 5 + m * 7 + 2) % 30, y = (i * 11 + 3) % 30;
      if (inRects(r, x, y)) { g.fillStyle = i % 2 ? '#d4ba76' : '#f7e8b4'; g.fillRect(x, y, 2, 1); }
    }
  });
  /* fence + hedge: same 16-mask idea, but they live in the bg (y-sorted) */
  SPR.fence16 = [...Array(16)].map((_, m) => {
    const [c, g] = C(32, 40);
    const P = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    const rail = (x, w, y) => { P(x, y, w, 3, '#9c6b3d'); P(x, y, w, 1, '#b07c48'); };
    if (m & 8) { rail(0, 15, 16); rail(0, 15, 25); }
    if (m & 2) { rail(17, 15, 16); rail(17, 15, 25); }
    if (m & 1) { P(11, 8, 2.4, 12, '#8a5c33'); P(18.6, 8, 2.4, 12, '#8a5c33'); }   // rails receding north
    if (m & 4) { P(11, 30, 2.4, 10, '#8a5c33'); P(18.6, 30, 2.4, 10, '#8a5c33'); }
    P(13.4, 10, 5, 27, '#8a5c33'); P(13.4, 10, 2, 27, '#9c6b3d');   // the post
    P(12.6, 8, 6.6, 3, '#b07c48'); P(12.6, 8, 6.6, 1.2, '#c98a58'); // cap
    if (!(m & 15)) { rail(4, 11, 16); rail(17, 11, 16); rail(4, 11, 25); rail(17, 11, 25); }  // lone = little section
    return c;

  SPR.hedge16 = [...Array(16)].map((_, m) => {
    const [c, g] = C(32, 40);
    const P = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };

    blob(6, 14, 20, 24);
    if (m & 8) blob(0, 16, 10, 22);

    for (let i = 0; i < 8; i++) {
      const x = 7 + (i * 5 + m * 3) % 18, y = 15 + (i * 7) % 18;

  SPR.dec.pond = (() => {

    g.fillStyle = '#3f97c9'; g.beginPath(); g.ellipse(15, 16, 9, 6.6, 0, 0, 6.3); g.fill();
    g.fillStyle = 'rgba(230,248,255,0.8)'; g.fillRect(9, 12, 7, 2); g.fillRect(14, 20, 5, 1.6);
    g.fillStyle = '#4cb45a'; g.beginPath(); g.ellipse(21, 14, 3, 2, 0, 0, 6.3); g.fill();

    return c;

  /* bg (y-sorted) decor */
  SPR.dec.shadetree = S(16, 24, (g, P) => {
    shad(g, 16, 44, 12, 3.8);
    P(7, 15, 2.4, 7, '#6e4023'); P(7, 15, 1, 7, '#8a5530');
    P(4.6, 13.6, 2, 1.6, '#6e4023'); P(9.6, 14, 2, 1.4, '#6e4023');
    P(1.6, 7, 12.8, 8, '#2c7a3a');
    P(2.6, 4.6, 10.8, 7, '#3a9a49');
    P(4, 2.6, 8, 5, '#54bd62');
    P(5, 3.4, 4, 2, '#8ed88a');
    P(2.6, 10.6, 2, 1, '#54bd62'); P(11, 9, 2, 1, '#54bd62');
  });
  SPR.dec.lamppost = S(16, 24, (g, P) => {
    shad(g, 16, 44, 5, 2);
    P(6.6, 21, 3, 1.6, '#2a3a34'); P(7, 20, 2.2, 1.2, '#3a4e46');
    P(7.4, 5, 1.4, 16, '#2a3a34'); P(7.4, 5, 0.6, 16, '#3a4e46');
    P(6.4, 1.4, 3.4, 4, '#2a3a34');
    P(7, 2, 2.2, 3, '#ffe9b0'); P(7.4, 2.4, 1, 1.4, '#fff7dc');
    P(6.8, 0.6, 2.6, 1, '#2a3a34'); P(7.7, 0, 0.8, 0.8, '#3a4e46');
    P(5.8, 5.2, 4.6, 0.8, '#2a3a34');
  });
  const mkFountain = gold => S(16, 18, (g, P) => {
    shad(g, 16, 33, 12, 3.4);

    const j = (rng() * (i + 1)) | 0;
    const t = free[i]; free[i] = free[j]; free[j] = t;
  }
  let rocks = 0, ices = 0;
  for (const t of free) {
    const r = rng();
    if (r < 0.11 && rocks < 16) { flora.push({ type: 'mrock', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false }); rocks++; }
    else if (r < 0.18 && ices < 11) { flora.push({ type: 'ice', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false }); ices++; }
  }
  let fi = free.length - 1;
  const spare = t => !flora.some(f => f.gx === t.gx && f.gy === t.gy);
  while (rocks < 8 && fi >= 0) { const t = free[fi--]; if (!spare(t)) continue; flora.push({ type: 'mrock', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false }); rocks++; }
  while (ices < 6 && fi >= 0) { const t = free[fi--]; if (!spare(t)) continue; flora.push({ type: 'ice', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false }); ices++; }
}
/* first free valid spot for k, spiralling out from (cx2, cy2) — moon world */
function moonPlaceSpot(k, cx2, cy2) {
  cx2 = cx2 === undefined ? MCX : cx2; cy2 = cy2 === undefined ? MCY : cy2;
  for (let r = 0; r < 16; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const gx = cx2 + dx, gy = cy2 + dy;
    if (validAt(k, gx, gy)) return { gx, gy };

  return null;
}

/* ── v6b: generate the MARS world (call with the mars world ACTIVE).
   Deterministic per seed. Rust-red dunes, HEMATITE nodes + FROST patches
   (frost thickens toward the polar caps). `bare` = contents from a save. ── */
function genMars(sd, bare) {
  const rng = mulberry((sd * 29 + 11) >>> 0);
  const s0 = rng() * 6.28, s1 = rng() * 6.28, s2 = rng() * 6.28;
  landAge = []; occ = [];
  for (let gy = 0; gy < GH; gy++) {
    landAge[gy] = []; occ[gy] = [];
    for (let gx = 0; gx < GW; gx++) {
      occ[gy][gx] = null;
      let a = 0;
      if (gx >= 2 && gx < GW - 2 && gy >= 2 && gy < GH - 2) {
        const dx = (gx - RCX) / 16.6, dy = (gy - RCY) / 10.4;
        const r = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
        const wob = 1 + 0.11 * Math.sin(ang * 3 + s0) + 0.08 * Math.sin(ang * 5 + s1) + 0.05 * Math.sin(ang * 7 + s2);
        if (r < wob * 0.84 || Math.hypot(gx - RCX, gy - RCY) < 2.2) a = 1;
      }
      landAge[gy][gx] = a;
    }
  }
  recomputeIsleIds();
  buildings = []; flora = []; wires = []; anims = []; robots = []; ferries = [];
  decor = []; decorMap = new Map();
  terrainDirty = true; bgDirty = true;
  if (bare) return;
  /* hematite nodes + frost patches (kid-proof minimums; frost loves the poles).
     The MARS LANDER touches down WITH you on the first arrival —
     the clearing near (RCX-6, RCY) is kept free for it. */
  let loY = GH, hiY = 0;
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++)
    if (isLand(gx, gy)) { if (gy < loY) loY = gy; if (gy > hiY) hiY = gy; }
  const free = [];
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    if (!isLand(gx, gy) || occ[gy][gx]) continue;
    if (Math.hypot(gx - (RCX - 6), gy - RCY) < 3.5) continue;
    free.push({ gx, gy });
  }
  for (let i = free.length - 1; i > 0; i--) {
    const j = (rng() * (i + 1)) | 0;
    const t = free[i]; free[i] = free[j]; free[j] = t;
  }
  let hems = 0, frosts = 0;
  for (const t of free) {
    const polar = t.gy <= loY + 3 || t.gy >= hiY - 3;
    const r = rng();
    if (r < 0.10 && hems < 18) { flora.push({ type: 'hem', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false }); hems++; }
    else if (r < (polar ? 0.3 : 0.145) && frosts < 13) { flora.push({ type: 'frost', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false }); frosts++; }
  }
  let fi = free.length - 1;
  const spare = t => !flora.some(f => f.gx === t.gx && f.gy === t.gy);
  while (hems < 8 && fi >= 0) { const t = free[fi--]; if (!spare(t)) continue; flora.push({ type: 'hem', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false }); hems++; }
  while (frosts < 6 && fi >= 0) { const t = free[fi--]; if (!spare(t)) continue; flora.push({ type: 'frost', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false }); frosts++; }
}

/* ═══ v7: MISSION WORLDS — ephemeral asteroid maps. NEVER saved: built at
   scan-confirm, discarded at departure. 7 handcrafted chunk-silhouette
   templates × seeded variation (mirror/flip, node placement, hazard). ═══ */
/* each template = list of wobble-ellipse blobs [cx, cy, rx, ry] (+ optional
   carve blobs and 1-tile bridges). Template 6 = the rare alien layout. */
const MTEMPLATES = [
  { blobs: [[21, 12, 10.5, 6.4]] },                                              // one big
  { blobs: [[13, 11, 7, 5], [31, 14, 6, 4.4]] },                                 // twin
  { blobs: [[21, 12, 10.5, 6.6]], carve: [[21, 12, 4.6, 2.7]] },                 // ring
  { blobs: [[16, 8, 9, 4.2], [12, 15, 4.6, 5.2], [30, 16, 5, 3.6]] },            // L + spur
  { blobs: [[9, 7, 4.8, 3.4], [31, 6, 4.4, 3], [11, 18, 4.4, 3.2], [30, 17, 5.2, 3.6], [21, 12, 3.6, 2.6]] },   // scattered
  { blobs: [[8, 12, 4.8, 3.6], [21, 12, 4.8, 3.6], [34, 12, 4.8, 3.6]],
    bridges: [[12, 17, 12], [25, 30, 12]] },                                     // bridge-of-three
  { blobs: [[21, 12, 5.6, 4.2], [9, 7, 4, 3], [33, 8, 4.2, 3], [21, 20, 5, 2.8]], vault: [21, 11] },   // rare-alien
];
function genMission(sd, card) {
  const rng = mulberry((sd * 41 + 17) >>> 0);
  const tp = MTEMPLATES[card.tmpl];
  const flip = rng() < 0.5, mir = rng() < 0.5;   // seeded mirror/flip variation
  const mx2 = gx => flip ? GW - 1 - gx : gx, my2 = gy => mir ? GH - 1 - gy : gy;
  const s0 = rng() * 6.28, s1 = rng() * 6.28;
  landAge = []; occ = [];
  for (let gy = 0; gy < GH; gy++) {
    landAge[gy] = []; occ[gy] = [];
    for (let gx = 0; gx < GW; gx++) { occ[gy][gx] = null; landAge[gy][gx] = 0; }
  }
  const stamp = (bl, val) => {
    const [bcx, bcy, brx, bry] = bl;
    for (let gy = 2; gy < GH - 2; gy++) for (let gx = 2; gx < GW - 2; gx++) {
      const dx = (gx - bcx) / brx, dy = (gy - bcy) / bry;
      const r = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
      const wob = 1 + 0.13 * Math.sin(ang * 3 + s0) + 0.08 * Math.sin(ang * 5 + s1);
      if (r < wob * 0.92) landAge[my2(gy)][mx2(gx)] = val;
    }
  };
  for (const bl of tp.blobs) stamp(bl, 1);
  for (const bl of (tp.carve || [])) stamp(bl, 0);
  for (const br of (tp.bridges || [])) {         // 1-wide rock catwalks
    const [x0, x1, by] = br;
    for (let gx = x0; gx <= x1; gx++) landAge[my2(by)][mx2(gx)] = 1;
  }
  recomputeIsleIds();
  buildings = []; flora = []; wires = []; anims = []; robots = []; ferries = [];
  decor = []; decorMap = new Map();
  terrainDirty = true; bgDirty = true;
  /* the LARGEST chunk hosts the barge + CARGO LOADER */
  const sizes = {};
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++)
    if (landAge[gy][gx]) sizes[isleId[gy][gx]] = (sizes[isleId[gy][gx]] || 0) + 1;
  let bigId = 0, bigN = 0;
  for (const id in sizes) if (sizes[id] > bigN) { bigN = sizes[id]; bigId = +id; }
  let cx3 = 0, cy3 = 0, cn2 = 0;
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++)
    if (landAge[gy][gx] && isleId[gy][gx] === bigId) { cx3 += gx; cy3 += gy; cn2++; }
  cx3 = Math.round(cx3 / cn2); cy3 = Math.round(cy3 / cn2);
  const ls = moonPlaceSpot('cargoloader', cx3, cy3);
  const loader = ls ? addBuilding('cargoloader', ls.gx, ls.gy) : null;
  /* deposits — richer with more stars; every chunk gets at least one so the
     jet hop matters. Vault (rare template) sits on the centre chunk. */
  const smallN = [0, 6, 8, 10][card.stars], bigDepN = [0, 1, 2, 3][card.stars];
  const free = [];
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    if (!landAge[gy][gx] || occ[gy][gx]) continue;
    if (loader && Math.hypot(gx - (loader.gx + 1), gy - loader.gy) < 3) continue;
    free.push({ gx, gy, il: isleId[gy][gx] });
  }
  for (let i = free.length - 1; i > 0; i--) {
    const j = (rng() * (i + 1)) | 0;
    const t = free[i]; free[i] = free[j]; free[j] = t;
  }
  const depRes = () => rng() < 0.7 ? card.type : (card.type === 'crystal' ? 'astroiron' : 'crystal');
  const mkD = (t, big) => flora.push({ type: 'dep', res: card.type === 'alloy' ? (rng() < 0.5 ? 'astroiron' : 'crystal') : depRes(),
                                       big, gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false });
  const seenIsle = new Set();
  let sN = 0, bN = 0;
  if (card.tmpl === 6) {                         // the ALIEN VAULT, dead centre
    let bt = null, bd = 1e9;
    for (const t of free) {
      const d = Math.hypot(t.gx - (flip ? GW - 1 - 21 : 21), t.gy - (mir ? GH - 1 - 11 : 11));
      if (t.il !== bigId && d < bd) { bd = d; bt = t; }   // vault on the centre chunk (not the loader's)
    }
    if (!bt) bt = free[0];
    flora.push({ type: 'vault', gx: bt.gx, gy: bt.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false });
    seenIsle.add(bt.il);
  }
  for (const t of free) {
    if (flora.some(f => Math.abs(f.gx - t.gx) < 2 && Math.abs(f.gy - t.gy) < 2)) continue;
    if (!seenIsle.has(t.il)) { mkD(t, false); sN++; seenIsle.add(t.il); continue; }   // 1 per chunk first
    if (bN < bigDepN && rng() < 0.3) { mkD(t, true); bN++; }
    else if (sN < smallN) { mkD(t, false); sN++; }
    if (sN >= smallN && bN >= bigDepN) break;
  }

  const chunks = [];
  for (let i = 0; i < 40; i++) chunks.push({ on: false });
  const pebbles = [];
  for (let i = 0; i < 8; i++) pebbles.push({ on: false });
  /* crumble hazard: mark bare edge tiles (never under deposits/loader) */
  const crumbles = [];
  if (card.hazard === 'crumble') {
    for (const t of free) {
      if (crumbles.length >= 12) break;
      const edge = !isLand(t.gx - 1, t.gy) || !isLand(t.gx + 1, t.gy) || !isLand(t.gx, t.gy - 1) || !isLand(t.gx, t.gy + 1);
      if (!edge || occ[t.gy][t.gx] || floraAt(t.gx, t.gy)) continue;
      if (loader && Math.hypot(t.gx - loader.gx, t.gy - loader.gy) < 4) continue;
      crumbles.push({ gx: t.gx, gy: t.gy, t: -1, goneT: 0 });
    }
  }
  exped = { stars: card.stars, type: card.type, hazard: card.hazard, tmpl: card.tmpl, rare: !!card.rare,
            timer: EXP_BATT[card.stars], timerMax: EXP_BATT[card.stars], warned: false, rescue: 0,
            chunks, pebbles, crumbles, boosts: 0, beacon: null, fullT: 0,
            pebT: 16 + rng() * 6, flareT: 24 + rng() * 8, flareA: 0, flareWarnT: 0, sparkT: 5,
            started: false };
  recomputePower(); recomputeAnims();
}

/* ── max-age land growth: at Age 7 the island keeps spreading every +25 pop ── */
function growCandidates() {
  const out = [];
  for (let gy = 2; gy <= GH - 3; gy++) for (let gx = 2; gx <= GW - 3; gx++) {
    if (landAge[gy][gx] !== 0) continue;              // water only
    let n = 0;
    if (isLand(gx - 1, gy)) n++;
    if (isLand(gx + 1, gy)) n++;
    if (isLand(gx, gy - 1)) n++;
    if (isLand(gx, gy + 1)) n++;
    if (n) out.push({ gx, gy, n });
  }
  return out;
}
function growIsland() {
  const cands = growCandidates();
  if (!cands.length) {
    /* per-archipelago: only "full" when no island can grow AND all are settled */
    if (!islandFull && settled.length >= SETTLE_MAX) {
      islandFull = true;
      pushEvent('full');                        // v5b
      banners.push({ title: 'YOUR ARCHIPELAGO IS FULL!', sub: 'Every last tile tamed!', t: 0, dur: 3.6, legendary: true });
      SFX.fanfare();
      saveGame();
    }
    return false;
  }
  /* connected band of ~10-16 tiles hugging the coastline (prefer 2+ land
     neighbours so the shoreline stays organic; re-seed only if boxed in) */
  const want = 10 + ((Math.random() * 7) | 0);
  const picked = [];
  const nearPicked = c => picked.some(p => Math.abs(p.gx - c.gx) + Math.abs(p.gy - c.gy) === 1);
  const score = c => {
    let n = c.n;
    for (const p of picked) if (Math.abs(p.gx - c.gx) + Math.abs(p.gy - c.gy) === 1) n++;
    return n;
  };
  while (picked.length < want && cands.length) {
    let pool = picked.length ? cands.filter(nearPicked) : cands;
    if (!pool.length) pool = cands;                   // boxed in — start a new arm
    let bestS = 0;
    for (const c of pool) { c.s = score(c); if (c.s > bestS) bestS = c.s; }
    const top = pool.filter(c => c.s >= Math.min(2, bestS));
    const t = top[(Math.random() * top.length) | 0];
    picked.push(t);
    cands.splice(cands.indexOf(t), 1);
  }
  for (const t of picked) {
    landAge[t.gy][t.gx] = 7;
    grownTiles.push([t.gx, t.gy]);
    spawnP(tX(t.gx) + 16, tY(t.gy) + 16, SPR.spark[(t.gx + t.gy) % 2], { vy: -30, g: 0, life: 1.2 });
  }
  for (const t of picked) {                           // fresh flora takes root (not on sand)
    if (sandAt(t.gx, t.gy) || occ[t.gy][t.gx] || floraAt(t.gx, t.gy)) continue;
    const r = hash2(t.gx * 5 + 3, t.gy * 9 + 1);
    if (r < 0.16) flora.push({ type: 'tree', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false });
    else if (r < 0.24) flora.push({ type: 'rock', gx: t.gx, gy: t.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false });
  }
  banners.push({ title: 'THE ISLAND GROWS!', sub: '+' + picked.length + ' new land — room to build!', t: 0, dur: 3 });
  SFX.fanfare();
  let px2 = 0, py2 = 0;
  for (const t of picked) { px2 += tX(t.gx) + 16; py2 += tY(t.gy) + 16; }
  camPanTo(px2 / picked.length, py2 / picked.length, 2.4);   // show kids the new land
  recomputeIsleIds();
  landGrowthSanity(false);                      // v4d: boats push off, landlocked ports pack up
  refreshColonyChecks(); refreshFerries();
  terrainDirty = true;
  saveGame();
  return true;
}

/* ── v3: camera — one smooth window into the big world ── */
function camPanTo(x, y, dur) { camPan = { x, y, t: dur }; }
function camTarget() {
  if (gateSeq) return { x: tX(gateSeq.b.gx) + 32, y: tY(gateSeq.b.gy) + 30 };
  if (travelCin()) {
    const st = travel.phase === 'land' ? travel.site : travel.srcSite;
    if (st) return { x: tX(st.gx) + st.s * 16, y: tY(st.gy) + 20 - Math.min((travel.ry || 0) * 0.5, 260) };
  }
  if (rocketSeq && rocketSeq.phase !== 'stars')
    return { x: tX(rocketSeq.pad.gx) + 32, y: tY(rocketSeq.pad.gy) + 20 - Math.min(rocketSeq.ry * 0.5, 260) };
  if (disaster && world === disaster.wld) {
    const t = disaster.targets.find(t2 => !t2.done) || disaster.targets[disaster.targets.length - 1];
    if (t) return { x: t.x, y: t.y };
  }
  if (camPan) return camPan;
  let sx = 0, sy = 0, n = 0;
  for (const p of players) { if (p.inside) continue; sx += p.x; sy += p.y; n++; }   // v5b: follow OUTSIDE players only
  if (!n && players.length) return { x: camX + W / 2, y: camY + H / 2 };            // everyone inside — hold still
  return n ? { x: sx / n, y: sy / n } : { x: tX(CX) + 16, y: tY(CYG) + 16 };
}
const camFollowing = () => !gateSeq && !rocketSeq && !travelCin() &&
  !(disaster && world === disaster.wld) && !camPan;   // leash only in follow mode
function updateCamera(dt, snap) {
  if (camPan) { camPan.t -= dt; if (camPan.t <= 0) camPan = null; }
  const t = camTarget();
  const wx = clamp(t.x - W / 2, 0, WORLD_W - W), wy = clamp(t.y - H / 2, 0, WORLD_H - H);
  if (snap) { camX = wx; camY = wy; return; }
  const f = Math.min(1, dt * 3.2);
  camX += (wx - camX) * f;
  camY += (wy - camY) * f;
}

/* ═══ v5a: THE POWER GRID — real and player-built (SimCity-style).
   ONE kid-legible rule: power flood-fills from any SOURCE through
   orthogonally adjacent buildings and POWER POLES. b.conn caches the
   result; wire runs bake into the terrain as sagging catenary segments
   (path ops at bake time only — the hot path never draws a path). ═══ */
const isSource = b => !b.rubble && !!(B[b.k].prod && B[b.k].prod.power);
function wireAnchor(b) {
  const s = B[b.k].size || 1;
  if (B[b.k].pole) return { x: tX(b.gx) + 16, y: tY(b.gy) - 4 };   // the crossarm
  return { x: tX(b.gx) + s * 16, y: tY(b.gy) + 8 };
}
function recomputePower() {
  for (const b of buildings) b.conn = false;
  const q = [];
  for (const b of buildings) if (isSource(b)) { b.conn = true; q.push(b); }
  while (q.length) {
    const b = q.pop();
    const s = B[b.k].size || 1;
    for (let dy = 0; dy < s; dy++) for (let dx = 0; dx < s; dx++) {
      const gx = b.gx + dx, gy = b.gy + dy;
      const nbs = [occ[gy - 1] && occ[gy - 1][gx], occ[gy + 1] && occ[gy + 1][gx],
                   occ[gy][gx - 1], occ[gy][gx + 1]];
      for (const o of nbs) {
        if (!o || o === b || o.conn || o.rubble) continue;
        o.conn = true; q.push(o);
      }
    }
  }
  /* visible wires: adjacent pairs involving a pole, or a source feeding a
     power-hungry neighbour directly (dense cabin rows stay wire-free) */
  wires = [];
  const seen = new Set();
  for (const b of buildings) {
    if (b.rubble) continue;
    const s = B[b.k].size || 1;
    for (let dy = 0; dy < s; dy++) for (let dx = 0; dx < s; dx++) {
      const gx = b.gx + dx, gy = b.gy + dy;
      for (const o of [occ[gy] && occ[gy][gx + 1], occ[gy + 1] && occ[gy + 1][gx]]) {
        if (!o || o === b || o.rubble) continue;
        const wired = B[b.k].pole || B[o.k].pole ||
          (isSource(b) && B[o.k].needPower) || (isSource(o) && B[b.k].needPower);
        if (!wired) continue;
        const key = Math.min(b.seq, o.seq) * 131072 + Math.max(b.seq, o.seq);
        if (seen.has(key)) continue;
        seen.add(key);
        const a1 = wireAnchor(b), a2 = wireAnchor(o);
        wires.push({ x0: a1.x, y0: a1.y, x1: a2.x, y1: a2.y,
                     g0: [b.gx, b.gy], g1: [o.gx, o.gy], on: !!(b.conn && o.conn) });
      }
    }
  }

  terrainDirty = true;
}
function drawWires(g) {           // bake-time only — drawn into the terrain layer
  for (const w of wires) {
    const mx = (w.x0 + w.x1) / 2, my = Math.max(w.y0, w.y1) / 2 + Math.min(w.y0, w.y1) / 2 + 5;
    g.globalAlpha = w.on ? 1 : 0.5;
    g.lineCap = 'round';
    g.strokeStyle = '#241a10'; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(w.x0, w.y0); g.quadraticCurveTo(mx, my, w.x1, w.y1); g.stroke();
    g.strokeStyle = w.on ? '#59606a' : '#3a3830'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(w.x0, w.y0 - 1); g.quadraticCurveTo(mx, my - 1, w.x1, w.y1 - 1); g.stroke();
    g.globalAlpha = 1;
  }
}
/* placement aid: faint glow on the grid + everything one step away from it,
   baked at ¼ resolution and blitted as ONE drawImage while placing */
function rebuildPowGlow() {
  glowDirty = false;
  if (!powGlowC) { const a = C(EGW * TILE / 4, (GY0 + EGH * TILE) / 4); powGlowC = a[0]; powGlowG = a[1]; }
  const g = powGlowG;
  g.clearRect(0, 0, powGlowC.width, powGlowC.height);
  const mark = (gx, gy, a) => {
    if (gx < 0 || gy < 0 || gx >= GW || gy >= GH || !isLand(gx, gy)) return;

/* ── v5a migration: pre-v6 saves get REAL poles auto-granted along sensible

function poleOKAt(gx, gy) {
  return isLand(gx, gy) && !occ[gy][gx] && !floraAt(gx, gy) && !decorAt(gx, gy) &&

}

  const s = B[b.k].size || 1, kk = (gx, gy) => gy * GW + gx;
  const prev = new Map(), q = [];
  const goal = (gx, gy) => {
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const o = occ[gy + dy] && occ[gy + dy][gx + dx];
      if (o && o.conn && !o.rubble) return true;

  for (let fy = 0; fy < s; fy++) for (let fx = 0; fx < s; fx++)
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const gx = b.gx + fx + dx, gy = b.gy + fy + dy;

      prev.set(kk(gx, gy), null);

      while (cur) { path.push(cur); cur = prev.get(kk(cur.gx, cur.gy)); }
      return path;
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const gx = t.gx + dx, gy = t.gy + dy;
      if (!poleOKAt(gx, gy) || prev.has(kk(gx, gy))) continue;

    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;

}

  recomputePower();

  for (let pass = 0; pass < 90; pass++) {
    const b = buildings.find(b2 => !b2.rubble && B[b2.k].needPower && !b2.conn && !skip.has(b2));
    if (!b) break;
    const isle = isleIdAt(b.gx, b.gy);
    if (!buildings.some(o => isSource(o) && isleIdAt(o.gx, o.gy) === isle)) {
      const spot = spiralSpot('windmill', b.gx, b.gy);   // old rule powered it globally
      if (spot) { addBuilding('windmill', spot.gx, spot.gy); granted++; continue; }
      skip.add(b); continue;
    }
    const path = poleRoute(b);
    if (!path || !path.length) { skip.add(b); continue; }

function rebuildTerrain() {

  if (world === 'moon') { rebuildMoonTerrain(); bgDirty = true; return; }
  if (world === 'mars') { rebuildMarsTerrain(); bgDirty = true; return; }
  if (world === 'mission') { rebuildMissionTerrain(); bgDirty = true; return; }   // v7
  const gr = tg.createLinearGradient(0, 0, 0, WORLD_H);
  gr.addColorStop(0, '#2b7db8'); gr.addColorStop(1, '#175a92');
  tg.fillStyle = gr; tg.fillRect(0, 0, WORLD_W, WORLD_H);
  /* soft turquoise halo under every island so they sit IN the water */
  const isleHalo = (hx, hy, r) => {
    const halo = tg.createRadialGradient(hx, hy, 60, hx, hy, r);
    halo.addColorStop(0, 'rgba(120,215,255,0.13)'); halo.addColorStop(1, 'rgba(120,215,255,0)');
    tg.fillStyle = halo; tg.fillRect(hx - r, hy - r, r * 2, r * 2);
  };
  isleHalo(CX * TILE + 16, tY(CYG) + 16, 460);
  for (const il of settled) isleHalo(tX(il.gx) + 16, tY(il.gy) + 16, 220 + il.steps * 40);
  tg.fillStyle = 'rgba(10,50,90,0.25)';
  for (let i = 0; i < 340; i++) {
    const x = (i * 211 + 40) % WORLD_W, y = (i * 127 + 60) % WORLD_H;
    if (!isLandPx(x, y)) tg.fillRect(x, y, 26, 3);
  }
  tg.fillStyle = 'rgba(200,235,255,0.14)';
  for (let i = 0; i < 230; i++) {
    const x = (i * 173 + 90) % WORLD_W, y = (i * 149 + 20) % WORLD_H;
    if (!isLandPx(x, y)) tg.fillRect(x, y, 14, 2);
  }
  const nearLandR = (gx, gy, r) => {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
      if (isLand(gx + dx, gy + dy)) return true;
    return false;
  };
  coast = [];
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    if (isLand(gx, gy)) continue;
    if (nearLandR(gx, gy, 1)) {
      tg.drawImage(SPR.shallow, tX(gx), tY(gy));
      tg.drawImage(SPR.foam[(gx + gy) % 2], tX(gx), tY(gy));
      coast.push({ x: tX(gx) + 16, y: tY(gy) + 16 });
    } else if (nearLandR(gx, gy, 2)) {
      tg.globalAlpha = 0.4;                       // second, fainter shallow ring
      tg.drawImage(SPR.shallow, tX(gx), tY(gy));
      tg.globalAlpha = 1;
    }
  }
  /* land tiles: mottled grass via smooth value noise + beach sand */
  const vn = (x, y, sx, sy) => {
    const fx = x / sx, fy = y / sy;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const sm = t => t * t * (3 - 2 * t);
    const u = sm(fx - x0), v = sm(fy - y0);
    const h = (a, b) => hash2(a * 13 + 7, b * 17 + 3);
    return (h(x0, y0) * (1 - u) + h(x0 + 1, y0) * u) * (1 - v)

  };
  const mots = (gx, gy) => vn(gx, gy, 5, 4) * 0.65 + vn(gx + 31, gy + 17, 2, 2) * 0.35;
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    if (!isLand(gx, gy)) continue;
    const x = tX(gx), y = tY(gy);
    if (sandAt(gx, gy)) {
      tg.drawImage(SPR.sand, x, y);

      tg.fillStyle = 'rgba(150,115,60,0.4)';
      if (!isLand(gx, gy + 1)) tg.fillRect(x, y + 27, 32, 5);
      if (!isLand(gx, gy - 1)) tg.fillRect(x, y, 32, 4);

const P_MAX = 48, parts = [];   // v4c: 96→48 — worst-case scenes stay well under the draw budget

function spawnP(x, y, spr, o) {

    if (p.on) continue;
    p.on = true; p.x = x; p.y = y; p.spr = spr;
    p.vx = o.vx !== undefined ? o.vx : (Math.random() - 0.5) * 60;
    p.vy = o.vy !== undefined ? o.vy : -40 - Math.random() * 40;
    p.g = o.g !== undefined ? o.g : 140;

const F_MAX = 14, floats = [];
for (let i = 0; i < F_MAX; i++) floats.push({ on: false });
function addFloat(x, y, str, color, icon) {
  for (let i = 0; i < F_MAX; i++) {

    if (f.on) continue;

/* v5a: subtle blue sparks running along POWERED wires (replaces pipe dots) */
const K_MAX = 12, sparks = [];
for (let i = 0; i < K_MAX; i++) sparks.push({ on: false });
let sparkT = 0, sparkRR = 0;
function updateSparks(dt) {
  sparkT -= dt;
  if (sparkT <= 0 && wires.length) {
    sparkT = Math.max(0.07, 1.3 / wires.length);
    for (let tries = 0; tries < wires.length; tries++) {
      const w = wires[sparkRR++ % wires.length];
      if (!w.on) continue;
      for (let i = 0; i < K_MAX; i++) {
        if (sparks[i].on) continue;
        sparks[i].on = true; sparks[i].w = w; sparks[i].t = 0;
        tries = 99; break;
      }
      break;
    }
  }
  for (let i = 0; i < K_MAX; i++) {
    const s = sparks[i];
    if (!s.on) continue;
    s.t += dt * 2.4;
    if (s.t >= 1 || wires.indexOf(s.w) === -1) s.on = false;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   ECONOMY — fixed 1s tick. One shared global pool; placement never
   affects function. All numbers live in B / REQ_NEXT above.
   ═══════════════════════════════════════════════════════════════════════ */
/* counts span BOTH worlds — goals, wonders and pop are global */
const cnt = k => {
  let n = 0;
  for (const b of buildings) if (b.k === k) n++;
  for (const o of parked.values()) for (const b of o.buildings) if (b.k === k) n++;
  return n;
};
function capPop() {
  let c = 2;
  for (const b of allB()) {
    if (b.rubble || !B[b.k].pop) continue;
    if (B[b.k].mega && !megaDone(b)) continue;   // v7: nobody lives on a construction site
    c += B[b.k].pop;
  }

}
function canAfford(cost) { for (const r in cost) if ((res[r] || 0) < cost[r]) return false; return true; }
function payCost(cost) { for (const r in cost) res[r] -= cost[r]; }
function refund(cost) { for (const r in cost) res[r] += cost[r]; }

function economyTick() {
  const wellBonus = cnt('well') > 0 ? 1.5 : 1;
  const mult = 1 + 0.1 * stars;                 // prestige bonus on ALL production
  /* v4a: TOWN islands boost their specialty producers 1.5x locally;
     each finished COLONY adds +10% to its specialty resource GLOBALLY
     (multiplicative with prestige) */
  const townSpec = {}, colonyMult = {};
  for (const il of settled) {
    if (il.lvl >= 3) townSpec[earthIsleAt(il.gx, il.gy)] = il.spec;
    if (il.lvl >= 4) colonyMult[il.spec] = (colonyMult[il.spec] || 1) * 1.1;
  }
  /* v4b: the tick spans BOTH worlds — production never stops while away */
  const every = allB();
  powerInc = 0; powerDem = 0;
  const inc = {};
  for (const b of every) {
    if (b.rubble) continue;                     // rubble makes nothing
    const d = B[b.k];
    if (d.mega && !megaDone(b)) continue;       // v7: construction sites draw nothing yet
    if (d.prod && d.prod.power) powerInc += d.prod.power * mult;
    if (d.needPower && b.conn) powerDem += d.needPower;   // v5a: only the WIRED city draws
  }
  powerInc = Math.round(powerInc * 10) / 10;
  /* batteries: surplus charges them, deficit drains them before anything idles */
  battCap = every.reduce((n, b) => n + (!b.rubble && B[b.k].store ? B[b.k].store : 0), 0);
  battCharge = Math.min(battCharge, battCap);
  let avail = powerInc + battCharge;
  const sorted = every.sort((a, b2) => a.seq - b2.seq);
  for (const b of sorted) {
    const d = B[b.k];
    b.idle = null;
    if (b.rubble) continue;
    if (d.mega && !megaDone(b)) continue;       // v7: under construction — feeds first!
    if (d.needPower) {
      if (!b.conn) { b.powered = false; b.idle = 'plug'; continue; }   // v5a: wire it in! (🔌)
      if (avail >= d.needPower) { avail -= d.needPower; b.powered = true; }
      else { b.powered = false; b.idle = 'power'; continue; }          // wired, grid too small (⚡)
    }
    if (d.cons) {
      let ok = true;
      for (const r in d.cons) if ((res[r] || 0) < d.cons[r]) ok = false;
      if (!ok) { b.idle = 'input'; continue; }
      for (const r in d.cons) { res[r] -= d.cons[r]; inc[r] = (inc[r] || 0) - d.cons[r]; }
    }
    if (d.prod) for (const r in d.prod) {
      if (r === 'power') continue;
      let amt = d.prod[r] * mult;
      if (b.k === 'farm') amt *= wellBonus;
      const ts = (d.moon || d.mars) ? null : townSpec[earthIsleAt(b.gx, b.gy)];   // colonies are an Earth thing
      if (ts && SPEC_B[ts] === b.k) amt *= 1.5;  // golden TOWN producer
      if (colonyMult[r]) amt *= colonyMult[r];   // global COLONY bonus
      if (r === 'metal' && marsBaseDone) amt *= 1.1;   // v6b: MARS ★ planet specialty
      res[r] += amt; inc[r] = (inc[r] || 0) + amt;
      if (r === 'metal') life.metal += amt;
      if (r === 'parts') life.parts += amt;
      if (r === 'science') life.science += amt;
      if (r === 'regolith') life.regolith += amt;
      if (r === 'ice') life.ice += amt;
      if (r === 'fuel') life.fuel += amt;        // v6a: REFINE 20 FUEL goal
      if (r === 'starsteel') life.starsteel += amt;   // v7: FORGE 20 STARSTEEL goal
    }
  }
  /* population eats (age 2+); never dies — growth just pauses */
  const eat = age >= 2 ? pop * 0.05 : 0;
  const before = res.food;
  res.food = Math.max(0, res.food - eat);
  hungry = age >= 2 && res.food <= 0 && eat > 0 && (inc.food || 0) <= eat;
  inc.food = (inc.food || 0) - Math.min(eat, before);
  const cap = capPop();
  if (popF < cap && (age < 2 || !hungry)) popF = Math.min(cap, popF + 0.5);
  pop = Math.floor(popF);
  if (pop > best) { best = pop; lsSet('islandforge_best', '' + best); }
  /* max-age growth: at Age 7 every +25 pop past the last growth adds land
     (Earth-only; while on the moon it politely waits for your return) */
  if (age >= 7 && !islandFull && !loading && world === 'earth' && !travel) {
    if (!growNextPop) growNextPop = pop + 25;
    else if (pop >= growNextPop && growIsland()) growNextPop = pop + 25;
  }
  battCharge = clamp(avail, 0, battCap);      // leftovers charge the batteries
  rates = inc; rates.power = powerInc - powerDem;
  const nowPowered = powerInc > 0;
  if (nowPowered !== islandPowered) {
    islandPowered = nowPowered;
    bgDirty = true;
    for (const o of parked.values()) o.bgDirty = true;   // lit windows in every world
    if (nowPowered && !firstPowerDone) {
      firstPowerDone = true;
      banners.push({ title: 'POWER ONLINE!', sub: 'The island comes alive!', t: 0, dur: 2.6 });
      SFX.power();
    }
  }
  /* mystery crate — every 4–6 minutes of active play */
  if (!crate && scene === 'play') {
    crateT -= 1;
    if (crateT <= 0) spawnCrate();
  }
  /* goals — one active goal, reward crate washes ashore */
  if (!loading && goalI < GOALS.length && GOALS[goalI].ok()) {
    banners.push({ title: 'GOAL DONE!', sub: GOALS[goalI].t + ' — a reward crate washed ashore!', t: 0, dur: 3, legendary: true });
    SFX.fanfare();
    goalI++;
    if (!crate) spawnCrate();
    else crateT = Math.min(crateT, 5);
  }
  /* v4a: colony ladders — one level-up per tick (staged celebrations).
     Earth-only machinery: while on the moon it simply waits. */
  if (!loading && world === 'earth') {
    for (const il of settled)
      if (colonyReady(il)) { colonyLevelUp(il); break; }
    refreshColonyChecks();                       // keep HUD checklists live
  }
  /* v6b: MARS BASE COMPLETE — the planet specialty bonus (colony pattern
     at planet scale): port + greenhouse + catcher + hab + shipyard */
  if (!loading && !marsBaseDone && marsArrived &&
      cnt('marsport') >= 1 && cnt('greendome') >= 1 && cnt('dustcatcher') >= 1 &&
      cnt('habdome') >= 1 && cnt('marsyard') >= 1) {
    marsBaseDone = true;
    banners.push({ title: 'MARS BASE COMPLETE!', sub: 'The red planet is home — METAL +10% everywhere, forever!', t: 0, dur: 4.4, legendary: true });
    SFX.legendary();
    fwShow = Math.max(fwShow, 6); fwT = 0;
    pushEvent('marsbase');

  const rq = REQ_NEXT[age];
  if (rq && rq.ok()) ageUp();
}
function skipSatisfiedGoals() { while (goalI < GOALS.length && GOALS[goalI].ok()) goalI++; }

function ageUp() {
  if (age >= 7) return;
  age++;
  banners.push({ title: 'AGE ' + age + ' — ' + AGE_NAMES[age] + '!', sub: AGE_SUBS[age], t: 0, dur: 3.4 });
  SFX.fanfare();
  /* every settled island grows its own ring, from its own centre */
  for (const il of settled) {
    if (il.steps >= ISLE_STEP_MAX) continue;

  }
  recomputeIsleIds();

/* ── building placement ── */
/* each building kind has a HOME world; `both` = buildable anywhere (v4c) */

/* ── robots & drakes ── */

}
function spawnRover(x, y) {

/* v4d: one robot per target — a robot's `targ` IS its reservation; it clears

function targReserved(r, t) {
  for (const o of robots) if (o !== r && o.targ === t) return true;
  return false;
}
function updateRobot(r, dt) {
  /* drop finished / invalid targets (flora harvested/napping, rubble repaired,

  if (r.targ && (r.targ.k ? (!r.targ.rubble || r.targ.packed) : (r.targ.gone || r.targ.sleepT > 0))) r.targ = null;
  if (!r.targ) {
    r.seekT = (r.seekT || 0) - dt;               // gentle rescan pace when idle
    if (r.seekT > 0) return;
    /* robots stay on their own island — never chase targets across water */
    const home = isleIdAt(Math.floor(r.x / TILE), Math.floor((r.y - GY0) / TILE));
    let bd = 1e9;
    for (const b of buildings) {                // rubble first — robots AND rovers love fixing (v6b)
      if (!b.rubble || b.packed) continue;
      if (home && isleIdAt(b.gx, b.gy) !== home) continue;
      if (targReserved(r, b)) continue;         // v4d: someone's already on it
      const s = B[b.k].size || 1;
      const d = Math.hypot(tX(b.gx) + s * 16 - r.x, tY(b.gy) + s * 16 - r.y);
      if (d < bd) { bd = d; r.targ = b; }
    }
    if (!r.targ) for (const f of flora) {
      if (f.gone || f.sleepT > 0) continue;     // v4d: napping treasure trees rest
      if (r.rover && f.type !== 'mrock' && f.type !== 'ice' &&
          f.type !== 'hem' && f.type !== 'frost') continue;   // v6b: rovers mine only
      if (home && isleIdAt(f.gx, f.gy) !== home) continue;
      if (targReserved(r, f)) continue;         // v4d: spread out, little buddies
      const d = Math.hypot(tX(f.gx) + 16 - r.x, tY(f.gy) + 24 - r.y);
      if (d < bd) { bd = d; r.targ = f; }
    }
    if (!r.targ) { r.seekT = 0.4; return; }
  }
  if (r.targ) {
    const s2 = r.targ.k ? (B[r.targ.k].size || 1) : 1;
    const tx2 = tX(r.targ.gx) + s2 * 16, ty2 = tY(r.targ.gy) + s2 * 16 + (r.targ.k ? 4 : 10);
    const d = Math.hypot(tx2 - r.x, ty2 - r.y);
    if (d > 26) {
      const nx = r.x + (tx2 - r.x) / d * r.sp * dt, ny = r.y + (ty2 - r.y) / d * r.sp * dt;
      if (isLandPx(nx, ny)) { r.x = nx; r.y = ny; }
      else if (isLandPx(nx, r.y)) r.x = nx;
      else if (isLandPx(r.x, ny)) r.y = ny;
      else r.targ = null;
      r.frame += dt * 6;
      if (r.rover) {                            // v6a: dust kicked up behind the wheels (red on Mars)
        r.dustT -= dt;
        if (r.dustT <= 0) {
          r.dustT = 0.18;
          spawnP(r.x + (Math.random() - 0.5) * 8, r.y + 2, (r.red ? SPR.puffRed : SPR.puffDark)[1],
                 { vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 6, g: -5, life: 0.5 });
        }
      }
    } else {
      r.cool -= dt;
      if (r.cool <= 0) {
        r.cool = 1.1;
        if (r.targ.k) repairWhack(r.targ);
        else harvestFlora(r.targ, r.x, r.y - 10);
      }
    }
  }
}
function updateDrake(dr, i, dt) {
  const owner = players[i % (players.length || 1)];  // both drakes follow players
  if (!owner) return;
  /* if their human sails away, drakes hover to the shore and wait (cute) */
  const ax = owner.boat ? owner.shoreX : owner.x, ay = owner.boat ? owner.shoreY : owner.y;
  const tx2 = ax + (i ? 26 : -26), ty2 = ay - 6;

      }
    }
  }
}

/* ═══ v6b: PER-SHIP TRAVEL ROUTES — rockets fly Earth↔Moon, the MARS
   CRUISER flies Moon↔Mars. Each world lists its live boarding zones. ═══ */
function boardingPads() {
  if (travelCin()) return [];
  const out = [];
  const zone = (b, ship, to) => {
    const s = B[b.k].size || 1;
    out.push({ b, ship, to, cx: tX(b.gx) + s * 16, cy: tY(b.gy) + s * 32 + 20 });
  };
  if (world === 'earth') {
    if (moonRocketBought) {
      const pad = buildings.find(b => b.k === 'launchpad' && !b.rubble);
      if (pad) zone(pad, 'rocket', 'moon');
    }
  } else if (world === 'moon') {
    if (moonReturnDone || returnFueled) {         // survival arc: fuel first!
      const port = buildings.find(b => b.k === 'moonport');
      if (port) zone(port, 'rocket', 'earth');
    }
    if (cruiserStage >= 3 && cruiserAt === 'moon') {
      const sy = buildings.find(b => b.k === 'shipyard' && !b.rubble);
      if (sy) zone(sy, 'cruiser', 'mars');
    }
  } else if (world === 'mars') {
    /* v7: the SURVEY BARGE waits beside the MARS SHIPYARD. Loaded + express
       unlocked → she flies the cargo straight home; otherwise → the belt! */
    if (bargeStage >= 3) {
      /* parked just far enough from the yard that ✕ AT the yard still
         means "upgrade", and ✕ AT the barge means "fly" */
      const my = buildings.find(b => b.k === 'marsyard' && !b.rubble);
      if (my) out.push({ b: my, ship: 'barge', to: (firstHaulDone && cargoTotal() > 0) ? 'earth' : 'scan',
                         cx: tX(my.gx) + 118, cy: tY(my.gy) + 74 });
    }
    /* kid-proof absolute: pre-fuel the cruiser waits at the LANDER and can
       ALWAYS fly home free — nobody strands on the red planet, ever */
    if (marsReturnDone || marsFueled) {
      const port = buildings.find(b => b.k === 'marsport');
      if (port) { zone(port, 'cruiser', 'moon'); return out; }
    }
    const l = buildings.find(b => b.k === 'marslander');
    if (l) zone(l, 'cruiser', 'moon');
  } else if (world === 'mission') {
    /* v7: home is the barge at the CARGO LOADER — always boardable */
    const cl = buildings.find(b => b.k === 'cargoloader');
    if (cl) out.push({ b: cl, ship: 'barge', to: 'mars', cx: tX(cl.gx) + 32, cy: tY(cl.gy) + 76 });
  }
  return out;
}

function updateTravel(dt) {
  const q = travel;
  const n0 = q.ship === 'barge' ? 3 : 5;         // v7: the barge counts a snappy 3-2-1
  if (q.phase === 'board') {
    if (players.length && players.every(p => p.aboard)) {
      q.phase = 'count'; q.t = 0; q.n = n0; SFX.count();
    }
    return;
  }
  if (q.phase === 'count' && !players.every(p => p.aboard)) {   // P2 joined mid-count
    q.phase = 'board'; q.t = 0; q.n = n0;
    return;
  }
  if (q.phase === 'scan') { if (scanScr) scanScr.t += dt; return; }   // v7: waiting on the choice
  q.t += dt;
  if (q.phase === 'count') {
    shakeAmt = Math.max(shakeAmt, 1.2);
    if (q.t > 1) {
      q.t = 0; q.n--;
      if (q.n <= 0) { q.phase = 'lift'; q.t = 0; q.ry = 0; SFX.rumble(); }
      else SFX.count();
    }
  } else if (q.phase === 'lift') {
    q.ry = 70 * q.t * q.t;
    shakeAmt = Math.max(0, 7 - q.t * 2.5);
    if (Math.random() < 0.6) {
      const st = q.srcSite;
      const px2 = tX(st.gx) + st.s * 16 + (Math.random() - 0.5) * 16;
      spawnP(px2, tY(st.gy) + 40 - q.ry + 40, SPR.flameP, { vy: 60, vx: (Math.random() - 0.5) * 80, g: -20, life: 0.5 });
      spawnP(px2 + (Math.random() - 0.5) * 20, tY(st.gy) + 46, SPR.puff[2], { vy: -10, vx: (Math.random() - 0.5) * 100, g: -14, life: 0.9 });
    }
    if (q.t > 2.6) { q.phase = 'stars'; q.t = 0; shakeAmt = 0; }
  } else if (q.phase === 'stars') {
    if (q.to === 'scan') {                       // v7: the SCAN takes over mid-warp
      if (q.t > 1.2) { q.phase = 'scan'; q.t = 0; scanScr = genScanCards(); SFX.ding(); }
      return;
    }
    const starsDur = q.express ? 3.4 : 2.4;      // express: time to wave at Mars + the Moon
    if (!q.sw && q.t > (q.express ? 2.1 : 1.1)) { q.sw = true; arriveOtherWorld(q); }
    if (q.t > starsDur) { q.phase = 'land'; q.t = 0; q.ry = 430; }
  } else if (q.phase === 'land') {
    const f = clamp(q.t / 2.2, 0, 1);
    q.ry = (1 - f) * (1 - f) * 430;
    if (q.ry < 6 && !q.dusted) {
      q.dusted = true; shakeAmt = 4; SFX.place();

               SPR.puffDark[i % 2], { vy: -8, vx: (Math.random() - 0.5) * 90, g: -10, life: 0.8 });
    }
    if (q.t > 2.9) finishTravel(q);
  }
}

/* ── THE SCAN — three seeded asteroid cards, one rare in ~6 (pity at 8) ── */
function bakeCardPreview(card) {
  const [c, g] = C(150, 96);
  const rng2 = mulberry((card.sd * 7 + 3) >>> 0);
  for (let i = 0; i < 24; i++) {
    g.fillStyle = i % 5 ? 'rgba(200,215,255,0.5)' : 'rgba(159,216,255,0.8)';
    g.fillRect((rng2() * 146) | 0, (rng2() * 92) | 0, i % 3 ? 2 : 3, i % 3 ? 2 : 3);
  }
  const body = card.rare ? '#3a4468' : card.type === 'crystal' ? '#5c5470' : '#5c584e';
  const hi   = card.rare ? '#5a6a9a' : card.type === 'crystal' ? '#746a8a' : '#736d5c';
  const s0 = rng2() * 6.28, s1 = rng2() * 6.28;
  const cx3 = 75, cy3 = 48, rx = 40 + rng2() * 8, ry = 24 + rng2() * 6;
  g.fillStyle = body; g.beginPath();
  for (let a = 0; a <= 40; a++) {
    const th = a / 40 * 6.283;
    const wob = 1 + 0.14 * Math.sin(th * 3 + s0) + 0.09 * Math.sin(th * 5 + s1);
    const px2 = cx3 + Math.cos(th) * rx * wob, py2 = cy3 + Math.sin(th) * ry * wob;
    if (a) g.lineTo(px2, py2); else g.moveTo(px2, py2);
  }
  g.closePath(); g.fill();
  g.fillStyle = hi; g.beginPath(); g.ellipse(cx3 - 8, cy3 - 7, rx * 0.6, ry * 0.55, -0.3, 0, 6.3); g.fill();
  for (let i = 0; i < 4; i++) {                  // craters
    const a2 = rng2() * 6.28, rr2 = rng2() * 0.55 + 0.15;
    const px2 = cx3 + Math.cos(a2) * rx * rr2, py2 = cy3 + Math.sin(a2) * ry * rr2;
    g.fillStyle = 'rgba(20,20,28,0.5)'; g.beginPath(); g.ellipse(px2, py2, 5 + rng2() * 4, 3 + rng2() * 2.4, 0, 0, 6.3); g.fill();
  }
  /* resource sparkle dots in the type colour */
  g.fillStyle = card.rare ? '#7dffe0' : card.type === 'crystal' ? '#c99bff' : '#d8c49a';
  for (let i = 0; i < 7; i++) {
    const a2 = rng2() * 6.28, rr2 = rng2() * 0.7;
    g.fillRect(cx3 + Math.cos(a2) * rx * rr2 - 1.4, cy3 + Math.sin(a2) * ry * rr2 - 1.4, 3, 3);
  }
  if (card.rare) {                               // teal glyph glow on the vault rock
    const gl = g.createRadialGradient(cx3, cy3, 2, cx3, cy3, 22);
    gl.addColorStop(0, 'rgba(125,255,224,0.55)'); gl.addColorStop(1, 'rgba(125,255,224,0)');
    g.fillStyle = gl; g.fillRect(cx3 - 22, cy3 - 22, 44, 44);
    g.fillStyle = '#d8fff4'; g.fillRect(cx3 - 1.6, cy3 - 6, 3.2, 12); g.fillRect(cx3 - 6, cy3 - 1.6, 12, 3.2);
  }
  return c;
}
function genScanCards() {
  expedCounter++;
  const rng = mulberry((seed * 57 + expedCounter * 131 + 7) >>> 0);
  const pity = expedCounter - lastRareAt >= 8;
  const rare = forceRare || pity || rng() < 1 / 6;
  forceRare = false;
  const rareIdx = rare ? (rng() * 3) | 0 : -1;
  const cards = [];
  for (let i = 0; i < 3; i++) {
    let card;
    if (i === rareIdx) {
      card = { type: 'alloy', stars: 3, hazard: 'sparky', rare: true, tmpl: 6, sd: (rng() * 1e9) | 0 };
    } else {
      const stars = 1 + ((rng() * 3) | 0);
      card = { type: rng() < 0.5 ? 'astroiron' : 'crystal', stars,
               hazard: ['pebbles', 'crumble', 'flare', 'drift'][(rng() * 4) | 0],
               rare: false, tmpl: (rng() * 6) | 0, sd: (rng() * 1e9) | 0 };
    }
    card.prev = bakeCardPreview(card);           // menu-time bake — allowed off the hot path
    cards.push(card);
  }
  if (rareIdx >= 0) lastRareAt = expedCounter;
  return { cards, sel: 0, t: 0 };
}
function confirmScan() {
  const card = scanScr.cards[scanScr.sel];

/* ── deposits burst into drifting CHUNKS (pooled — never allocated hot) ── */
function spawnChunk(x, y, resK, kick) {
  if (!exped) return;
  for (const ch of exped.chunks) {
    if (ch.on) continue;
    const a = Math.random() * 6.28;
    const sp = (kick || 1) * (26 + Math.random() * 30) * (exped.hazard === 'drift' ? 1.8 : 1);
    ch.on = true; ch.x = x; ch.y = y; ch.res = resK;
    ch.vx = Math.cos(a) * sp; ch.vy = Math.sin(a) * sp;
    return;
  }
}
function burstDeposit(f) {
  const cx2 = tX(f.gx) + 16, cy2 = tY(f.gy) + 8;

function vaultBurst(f) {

/* one cannon blast on a deposit: smalls burst, bigs + the vault crack 1/3 */
function depositBlast(f) {
  const cx2 = tX(f.gx) + 16, cy2 = tY(f.gy) + 8;
  if (f.type === 'vault') {
    f.hits++;
    f.shakeT = 0.3; bgDirty = true;

/* ── mission structures: paid in cargo chunks (banked first, then carried) ── */
function cargoAvail(r) {
  let n = cargo[r] || 0;
  for (const p of players) for (const ck of (p.carry || [])) if (ck === r) n++;
  return n;
}
function missionAfford(cost) {
  for (const r in cost) if (cargoAvail(r) < cost[r]) return false;
  return true;
}
function payMissionCost(cost) {
  for (const r in cost) {
    let need = cost[r];
    const fromBank = Math.min(need, cargo[r] || 0);
    cargo[r] -= fromBank; need -= fromBank;
    for (const p of players) {
      while (need > 0 && (p.carry || []).indexOf(r) >= 0) {
        p.carry.splice(p.carry.indexOf(r), 1); need--;
      }
    }
  }
}
function placeMissionB(k, gx, gy) {
  const cost = MB[k];
  if (!cost || !validAt(k, gx, gy) || !missionAfford(cost)) return false;
  if (k === 'boostbattery' && exped.boosts >= BOOST_MAX) {
    addFloat(tX(gx) + 16, tY(gy) - 10, 'MAX ' + BOOST_MAX + ' PER TRIP!', '#ff9a8a');
    SFX.cancel();
    return false;
  }
  payMissionCost(cost);
  const costStr = Object.keys(cost).map(r => '-' + cost[r] + ' ' + (r === 'astroiron' ? 'IRON' : r.toUpperCase())).join(' ');
  addFloat(tX(gx) + 16, tY(gy) - 22, costStr, '#ffd24a');
  const b = addBuilding(k, gx, gy);
  if (k === 'minidrill') b.drillT = 5;
  if (k === 'boostbattery') {
    exped.boosts++;
    exped.timer += BOOST_SECS; exped.timerMax += BOOST_SECS;
    addFloat(tX(gx) + 16, tY(gy) - 36, '+' + BOOST_SECS + 's BATTERY!', '#7dffe0');
    SFX.power();
  }
  SFX.place();
  for (let i = 0; i < 8; i++)
    spawnP(tX(gx) + 16 + (Math.random() - 0.5) * 26, tY(gy) + 30, SPR.puff[1], { vy: -25, g: -10, life: 0.5 });
  return true;
}

/* ── JET HOP — pushing off a chunk edge scans 6 tiles (3 lanes) for land ── */
function tryJetHop(p, mx, my) {
  if (p.hop || p.stunT > 0) return;
  const m = Math.hypot(mx, my);
  if (!m) return;
  const dx = mx / m, dy = my / m;
  for (let i = 1; i <= 6; i++) {
    for (const lane of [0, -1, 1]) {
      const px2 = p.x + dx * 32 * i + (-dy) * 32 * lane;
      const py2 = p.y + dy * 32 * i + dx * 32 * lane;
      if (!isLandPx(px2, py2)) continue;
      const gx = Math.floor(px2 / TILE), gy = Math.floor((py2 - GY0) / TILE);
      if (occ[gy] && occ[gy][gx]) continue;      // never land ON a structure
      p.hop = { t: 0, dur: 0.4 + i * 0.05, x0: p.x, y0: p.y, x1: tX(gx) + 16, y1: tY(gy) + 16, bounce: false };
      p.target = null;
      SFX.jet();
      for (let j = 0; j < 3; j++)
        spawnP(p.x - dx * 6, p.y + 4, SPR.puffDark[j % 2], { vx: -dx * 30, vy: -dy * 30 - 8, g: -6, life: 0.4 });
      return;
    }
  }
  /* nothing to land on: a soft 0.25s bounce-back — never strands, no drama */
  p.hop = { t: 0, dur: 0.25, x0: p.x, y0: p.y, xm: p.x + dx * 15, ym: p.y + dy * 15, bounce: true };
  p.target = null;
  SFX.bounce();
}

/* ── auto-rescue: battery empty → the tug scoops everyone up, banked cargo
   safe, un-banked ground chunks stay behind. Never a fail state. ── */
function startRescue() {
  const cl = buildings.find(b => b.k === 'cargoloader');
  banners.push({ title: 'RESCUE TUG INBOUND!', sub: 'Battery empty — everyone aboard, banked crates safe!', t: 0, dur: 3.2, legendary: true });
  SFX.alarm(); SFX.rumble();
  for (const p of players) {
    p.aboard = true; p.hop = null; p.hopH = 0; p.stunT = 0; p.carry = [];
    if (p.mode === 'cannon') unmanCannon(p);
    p.mode = 'walk'; p.ghost = null; p.target = null;
  }
  const s = 2;
  travel = { phase: 'lift', ship: 'barge', from: 'mission', to: 'mars', dir: 'toMars', rescue: true,
             pad: cl, srcSite: cl ? { gx: cl.gx, gy: cl.gy, s } : { gx: MISSION_GW >> 1, gy: MISSION_GH >> 1, s },
             destPad: null, site: null, t: 0, n: 0, ry: 0 };
}

/* ── the per-frame mission brain (timer, hazards, chunks, drills, banking) ── */
function updateMission(dt) {
  const q = exped;
  if (!q || !q.started) return;
  const cl = buildings.find(b => b.k === 'cargoloader');
  /* battery drains only while actually on the rock */
  if (!travel) {
    q.timer -= dt;
    if (!q.warned && q.timer <= q.timerMax * 0.25) {
      q.warned = true;
      banners.push({ title: 'BATTERY LOW!', sub: 'HEAD BACK TO THE SHIP — bank your chunks!', t: 0, dur: 3 });
      SFX.alarm();
    }
    if (q.timer <= 0) { q.timer = 0; startRescue(); return; }
  }
  /* chunks drift, bounce softly at the world edge, clamp for pickup */
  for (const ch of q.chunks) {
    if (!ch.on) continue;
    ch.x += ch.vx * dt; ch.y += ch.vy * dt;
    const fr = q.hazard === 'drift' ? 0.995 : 0.975;   // DRIFT FIELD: chase-fun
    ch.vx *= fr; ch.vy *= fr;
    if (ch.x < 24) { ch.x = 24; ch.vx = Math.abs(ch.vx) * 0.6; }
    if (ch.x > WORLD_W - 24) { ch.x = WORLD_W - 24; ch.vx = -Math.abs(ch.vx) * 0.6; }
    if (ch.y < GY0 + 24) { ch.y = GY0 + 24; ch.vy = Math.abs(ch.vy) * 0.6; }
    if (ch.y > WORLD_H - 24) { ch.y = WORLD_H - 24; ch.vy = -Math.abs(ch.vy) * 0.6; }
    /* pickup: forgiving radius, works mid-hop, 2 per pair of arms */
    for (const p of players) {
      if (p.aboard || (p.carry || []).length >= 2) continue;
      if (Math.hypot(ch.x - p.x, ch.y - p.y) < 26) {
        ch.on = false;
        p.carry = p.carry || [];
        p.carry.push(ch.res);
        addFloat(p.x, p.y - 40, 'GOT IT!', RES_COL[ch.res]);
        SFX.pop(); SFX.coin();
        break;
      }
    }
  }
  /* the beacon pickup (rare missions) */
  if (q.beacon) {
    q.beacon.t += dt;
    for (const p of players) {
      if (p.aboard || Math.hypot(q.beacon.x - p.x, q.beacon.y - p.y) >= 30) continue;
      q.beacon = null;
      beaconsFound++;
      banners.push({ title: 'ALIEN BEACON DISCOVERED!', sub: beaconsFound >= 3 ? 'The fragments hum together...' : 'Beacon ' + beaconsFound + ' — someone MADE this...', t: 0, dur: 4, legendary: true });
      SFX.legendary();
      fwShow = Math.max(fwShow, 3); fwT = 0;

  recomputeIsleIds();
  /* a few trees & rocks take root (deterministic per seed + settle order) */
  const rng = mulberry(((seed % 65536) * 997 + isl.o * 57 + 3) >>> 0);
  for (const q of si.tiles) {
    if (sandAt(q.gx, q.gy) || Math.hypot(q.gx - isl.gx, q.gy - isl.gy) < 1.5) continue;
    const r = rng();
    if (r < 0.18) flora.push({ type: 'tree', gx: q.gx, gy: q.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false });
    else if (r < 0.28) flora.push({ type: 'rock', gx: q.gx, gy: q.gy, hits: 0, gone: false, regrowT: 0, shakeT: 0, golden: false });
  }
  /* land rises! splash + sparkle celebration */
  for (const q of si.tiles) {
    if (hash2(q.gx, q.gy + 3) < 0.5)
      spawnP(tX(q.gx) + 16, tY(q.gy) + 16, SPR.spark[(q.gx + q.gy) % 2], { vy: -30, g: 0, life: 1.1 });
  }
  for (let i = 0; i < 10; i++)
    spawnP(p.x + (Math.random() - 0.5) * 120, p.y + (Math.random() - 0.5) * 80, SPR.wake, { vy: -24, g: -8, life: 0.8 });
  banners.push({ title: 'OUTPOST FOUNDED!', sub: isl.name + ' — a fine place for ' + spec.toUpperCase() + '!', t: 0, dur: 3.4, legendary: true });
  SFX.legendary(); SFX.splash();
  pushEvent('colony');                          // v5b
  /* the boat is beached on the brand-new shore — step off proudly, and the
     dinghy stays moored just off the coast so you can always sail home */
  p.boat = false; p.mode = 'walk';
  p.x = tX(isl.gx) + 16; p.y = tY(isl.gy) + 16;
  p.moor = null;

    if (isWater(isl.gx + dx, isl.gy + dy)) { p.moor = { x: tX(isl.gx + dx) + 16, y: tY(isl.gy + dy) + 16 }; break out; }
  }

  terrainDirty = true;
  refreshColonyChecks(); refreshFerries();
  recomputePower(); recomputeAnims();
  saveGame();

/* ═══════════════════════════════════════════════════════════════════════
   V4a — COLONY LEVELS: every settled island climbs a 4-step local ladder

const ISLE_NAMES = {
  wood:   ['OAK ISLE', 'PINE KEY', 'CEDAR CAY'],
  stone:  ['STONE CAY', 'BOULDER ISLE', 'FLINT KEY'],
  food:   ['BERRY KEY', 'HONEY ISLE', 'MANGO CAY'],
  metal:  ['IRON ISLE', 'COPPER KEY', 'FORGE CAY'],
  science:['SPARK ISLE', 'COMET KEY', 'NOVA CAY'],

  for (const b of buildings) {
    if (b.rubble || isleIdAt(b.gx, b.gy) !== id) continue;
    if (b.k === 'cabin') cabins++;
    if (b.k === 'farm' || b.k === 'bakery') food++;
    if (b.k === SPEC_B[il.spec]) spec++;
    if (b.k === 'windmill' || b.k === 'solar' || b.k === 'fusioncore') pow++;
    if (b.k === 'seaport') port++;
  }
  if (il.lvl <= 1) return [{ k: 'cabin', n: cabins, need: 2 }, { k: 'farm', n: food, need: 1 }];
  if (il.lvl === 2) return [{ k: SPEC_B[il.spec], n: spec, need: 2 }];
  if (il.lvl === 3) return [{ k: 'windmill', n: pow, need: 1 }, { k: 'seaport', n: port, need: 1 }];

function refreshColonyChecks() {

  const gm = {};
  for (const il of settled) {
    il.check = colonyChecklist(il);
    if (il.lvl >= 3) gm[isleIdAt(il.gx, il.gy)] = il.spec;
  }
  let dirty = false;
  for (const b of buildings) {
    const want = SPEC_B[gm[isleIdAt(b.gx, b.gy)]] === b.k;
    if (!!b.gold !== want) { b.gold = want; dirty = true; }

}
/* one colony ring — reuses the per-island ring machinery, with sparkles */
function colonyGrowRing(il, silent) {

  recomputeIsleIds();
  if (!silent) for (const t of tiles)
    if (hash2(t.gx, t.gy + 5) < 0.6)
      spawnP(tX(t.gx) + 16, tY(t.gy) + 16, SPR.spark[(t.gx + t.gy) % 2], { vy: -30, g: 0, life: 1.2 });
  terrainDirty = true;
}

    SFX.legendary();
    const id = isleIdAt(il.gx, il.gy);
    for (const b of buildings)

        for (let i = 0; i < 6; i++)

  } else if (il.lvl === 4) {

/* the goal-strip swaps to an island checklist while a player stands on (or

function playerColony(p) {
  if (world !== 'earth') return null;
  const t = tileUnder(p);
  let id = isleIdAt(t.gx, t.gy);
  if (!id && p.boat)
    id = isleIdAt(t.gx + 1, t.gy) || isleIdAt(t.gx - 1, t.gy) ||
         isleIdAt(t.gx, t.gy + 1) || isleIdAt(t.gx, t.gy - 1);

/* ── cosmetic cargo ferries: village+ islands get a dinghy that shuttles
   the longest clear-water leg of the straight line to the home island.
   Pure decoration — the economy is one shared pool. ── */
function refreshFerries() {
  ferries = [];
  const hx = tX(CX) + 16, hy = tY(CYG) + 16;
  for (const il of settled) {
    if (il.lvl < 2) continue;
    const ix = tX(il.gx) + 16, iy = tY(il.gy) + 16;
    const n = Math.max(2, Math.ceil(Math.hypot(hx - ix, hy - iy) / 16));
    let runS = -1, bS = 0, bE = -1;
    for (let s = 0; s <= n; s++) {
      const wet = isWaterPx(ix + (hx - ix) * s / n, iy + (hy - iy) * s / n);
      if (wet) { if (runS < 0) runS = s; if (s - runS > bE - bS) { bS = runS; bE = s; } }
      else runS = -1;
    }
    if (bE - bS < 6) continue;                  // no clear lane — skip, decoration only
    const f0 = (bS + 1) / n, f1 = (bE - 1) / n;
    const x0 = ix + (hx - ix) * f0, y0 = iy + (hy - iy) * f0;
    ferries.push({ x0, y0, x1: ix + (hx - ix) * f1, y1: iy + (hy - iy) * f1,
                   t: 0.2 + Math.random() * 0.6, dir: 1, pause: 0, x: x0, y: y0 });
  }

function updateFerries(dt) {
  for (const f of ferries) {
    if (f.pause > 0) { f.pause -= dt; continue; }
    const len = Math.max(1, Math.hypot(f.x1 - f.x0, f.y1 - f.y0));
    f.t += f.dir * dt * 34 / len;
    if (f.t >= 1) { f.t = 1; f.dir = -1; f.pause = 2.5; }
    else if (f.t <= 0) { f.t = 0; f.dir = 1; f.pause = 2.5; }
    f.x = f.x0 + (f.x1 - f.x0) * f.t;
    f.y = f.y0 + (f.y1 - f.y0) * f.t;
  }
}

  /* speech bubble (3-slice stretch) + tail */

}

      if (x > x0 + c2 * 66 && x < x0 + c2 * 66 + 60 && y > y0 + r2 * 72 && y < y0 + r2 * 72 + 62) {
        n.r = r2; n.c = c2; onBtn(0, 'south'); return;
      }
    }
    const sy = y0 + 3 * 72;
    for (let c2 = 0; c2 < 3; c2++) {
      if (x > x0 + c2 * 224 && x < x0 + c2 * 224 + 208 && y > sy && y < sy + 62) {
        n.r = 3; n.c = c2; onBtn(0, 'south'); return;
      }
    }
    return;
  }
  /* play */
  if (modal) { onBtn(0, 'south'); return; }
  if (vignette) { closeVignette(); return; }     // v6a: tap anywhere closes the telescope
  if (confirmPrestige) {
    if (y > 380 && y < 460) { confirmPrestige.yes = x < W / 2; onBtn(0, 'south'); }
    else { confirmPrestige = null; SFX.cancel(); }
    return;
  }
  if (travel && travel.phase === 'scan' && scanScr) {   // v7: tap a card / tap it again to go
    for (let i = 0; i < 3; i++) {
      const cx2 = W / 2 + (i - 1) * 330;
      if (x > cx2 - 140 && x < cx2 + 140 && y > 190 && y < 570) {
        if (scanScr.sel === i) confirmScan();
        else { scanScr.sel = i; SFX.ui(); }
        return;
      }
    }
    if (y > 640) cancelScan();                   // the bottom hint row = fly back
    return;
  }
  if (rocketSeq || gateSeq || travelCin()) return;
  if (paused) {
    const opts = pauseOptions();
    const py = H / 2 - 130;
    for (let i = 0; i < opts.length; i++) {
      if (y > py + 80 + i * 52 && y < py + 80 + (i + 1) * 52 && x > W / 2 - 180 && x < W / 2 + 180) {
        pauseIdx = i; onBtn(0, 'south'); return;
      }
    }
    paused = false;
    return;
  }
  if (statsOpen) { statsOpen = false; SFX.ui(); return; }
  const p = players[0];
  if (!p || p.aboard) return;                   // aboard: tbB (○) hops out
  if (p.mode === 'cannon') return;              // v4c: dedicated ◀ ▶ PWR FIRE buttons drive it
  if (interior && p.inside) {                   // v5b: taps land in room space
    const rx = x - IPX, ry = y - IPY;
    if (rx < 0 || ry < 0 || rx > IPW || ry > IPH) return;
    const dm = interior.door;
    if (rx > dm.x && rx < dm.x + dm.w && ry > dm.y - 10) { exitInterior(p); return; }
    const r = interior.residents.find(r2 => Math.hypot(r2.x - rx, (r2.y - 30) - ry) < 44);
    if (r && Math.hypot(r.x - p.ix, r.y - p.iy) < 58) { talkToResident(p, r); return; }
    if (interior.cat && Math.hypot(interior.cat.x - rx, interior.cat.y - ry) < 40 &&
        Math.hypot(interior.cat.x - p.ix, interior.cat.y - p.iy) < 52) { petCatDo(p); return; }
    p.itarget = { x: clamp(rx, 42, IPW - 42), y: clamp(ry, IWALL + 16, IPH - 24) };
    return;
  }
  const wx = x + camX, wy = y + camY;           // tap → world coords through the camera
  if (p.mode === 'boatmenu') {
    const y0 = H - 114;
    if (y > y0 && y < y0 + 106) { onBtn(0, 'south'); return; }
    p.mode = 'walk'; SFX.cancel();
    return;
  }
  if (p.mode === 'settle') {
    if (y > 44) p.target = { x: clamp(wx, 8, WORLD_W - 8), y: clamp(wy, GY0 + 8, WORLD_H - 8) };
    return;
  }
  if (p.mode === 'menu') {
    const items = stripItems(p);
    const pw = Math.min(1240, items.length * 100 + 24);
    const x0 = W / 2 - pw / 2, y0 = H - 114;
    if (y > y0 && y < y0 + 106) {
      const i = Math.floor((x - x0 - 12) / 100);
      if (i >= 0 && i < items.length) {
        if (p.menuI === i) onBtn(0, 'south');
        else { p.menuI = i; SFX.ui(); }
      }
      return;
    }
    p.mode = 'walk'; SFX.cancel();
    return;
  }
  if (p.mode === 'place' || p.mode === 'remove') {
    if (y > 44) {
      const s = p.placeK && p.mode === 'place' ? (B[p.placeK].size || 1) : 1;
      p.ghost = { gx: clamp(Math.floor(wx / TILE), 0, GW - s), gy: clamp(Math.floor((wy - GY0) / TILE), 0, GH - s) };
      SFX.ui();
    }
    return;
  }
  if (y > 44) {
    /* v5b: tapping an enterable building walks to its door and steps in */
    const tgx = Math.floor(wx / TILE), tgy = Math.floor((wy - GY0) / TILE);
    const tb = occ[tgy] && occ[tgy][tgx];
    if (tb && ENTERABLE[tb.k] && !tb.rubble && !p.boat && enterAllowed()) {
      const ts = B[tb.k].size || 1;
      if (nearDoorB(p) === tb) { enterInterior(p, tb); return; }
      p.target = { x: tX(tb.gx) + ts * 16, y: tY(tb.gy) + ts * 32 + 14 };
      p.enterB = tb;
      return;
    }
    p.target = { x: clamp(wx, 8, WORLD_W - 8), y: clamp(wy, GY0 + 8, WORLD_H - 8) };
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   RENDER — per-frame hot path is drawImage + transforms + fillText only.
   Static world = 1 drawImage of bgC.
   ═══════════════════════════════════════════════════════════════════════ */
function txt(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 700) + ' ' + size + 'px Verdana, sans-serif';
  ctx.textAlign = align || 'left';
  ctx.fillStyle = color || '#fff';
  ctx.fillText(s, x, y);
}
function otxt(s, x, y, size, color, align) {
  ctx.font = '900 ' + size + 'px Verdana, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.fillStyle = 'rgba(10,25,40,0.85)';
  ctx.fillText(s, x + Math.max(1, size / 14), y + Math.max(1, size / 14));
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function drawFit(s, cx2, cy2, mw, mh) {
  const sc = Math.min(mw / s.width, mh / s.height);
  ctx.drawImage(s, cx2 - s.width * sc / 2, cy2 - s.height * sc / 2, s.width * sc, s.height * sc);
}
function extraSprites() {
  SPR.dim = (() => { const [c, g] = C(W, H); g.fillStyle = 'rgba(5,14,24,0.62)'; g.fillRect(0, 0, W, H); return c; })();
  SPR.iconRemove = S(11, 11, (g, P) => {
    g.fillStyle = '#e05a3a'; g.beginPath(); g.arc(11, 11, 10, 0, 6.3); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(6, 6); g.lineTo(16, 16); g.moveTo(16, 6); g.lineTo(6, 16); g.stroke();
  });
}
