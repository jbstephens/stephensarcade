<!-- injected by scripts/inject-factory.py — console mode only: the TV has no printer,
     so window.print shows a friendly toast instead of a dead print dialog. -->
<script id="__gf_print">
(function () {
  var on = false;
  try { on = /[?&]fx=low\b/.test(location.search) || localStorage.getItem('arcade_lowfx') === '1'; } catch (e) {}
  if (!on) return;
  var toast = null, timer = 0;
  function hide() { if (toast) toast.style.opacity = '0'; }
  window.print = function () {
    try {
      if (!toast) {
        toast = document.createElement('div');
        toast.id = '__gfx_print';
        toast.textContent = '🖨️ Printing works on the iPad — not on the TV!';
        toast.style.cssText = 'position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:2147483001;' +
          'pointer-events:none;padding:14px 26px;border-radius:16px;background:#10172a;color:#ffd23f;' +
          'border:3px solid #ffd23f;font:bold 24px/1.2 "Trebuchet MS","Arial Rounded MT Bold",sans-serif;' +
          'white-space:nowrap;opacity:0;transition:opacity .2s;';
        (document.body || document.documentElement).appendChild(toast);
      }
      toast.style.opacity = '1';
      clearTimeout(timer);
      timer = setTimeout(hide, 2500);
    } catch (e) {}
  };
})();
</script>
