<!-- injected by scripts/inject-factory.py — pad cursor: a pad-driven mouse pointer so
     tap/click-only games play on the console. Right stick moves it (left stick too in
     pointer games); X / R1 clicks and drags (pointer + mouse events, like touchpad.js
     turns fingers into mouse events). Never consumes pad input. -->
<script id="__gf_cursor">
(function () {
  window.__GF_CURSOR_LEFT = false; /*@gf:cursor_left*/
  var IS_BOOK = false; /*@gf:is_book*/
  var LEFT = window.__GF_CURSOR_LEFT === true;
  var DZ = 0.2, SPEED = 900, SLEEP_MS = 4000, CLICK_SLOP = 12;
  // one rAF loop per page reads the pads for every __gf overlay
  var hub = window.__gfHub;
  if (!hub) {
    hub = window.__gfHub = { fns: [], pads: [] };
    (function () {
      var NONE = [];
      function loop(now) {
        var p = null;
        try { p = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) {}
        hub.pads = p || NONE;
        for (var i = 0; i < hub.fns.length; i++) { try { hub.fns[i](now, hub.pads); } catch (e) {} }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  }

  var S = window.__gfCursorState = { installed: false, awake: false, held: false, x: 0, y: 0 };
  var el = null, x = 0, y = 0, awake = false, lastMove = 0, lastT = 0;
  var held = false, target = null, sx = 0, sy = 0, prevBtn = false, vx = 0, vy = 0, player = null;
  var INIT = { bubbles: true, cancelable: true, composed: true, view: window, detail: 0,
    clientX: 0, clientY: 0, screenX: 0, screenY: 0, button: 0, buttons: 0,
    pointerId: 1, pointerType: 'mouse', isPrimary: true, width: 1, height: 1, pressure: 0 };
  var HAS_PE = typeof window.PointerEvent === 'function';

  function install() {
    if (S.installed) return;
    S.installed = true;
    x = Math.round((window.innerWidth || 1280) / 2); y = Math.round((window.innerHeight || 720) / 2);
    el = document.createElement('div');
    el.id = '__gfx_cursor';
    el.style.cssText = 'position:fixed;left:0;top:0;width:28px;height:28px;pointer-events:none;z-index:2147483000;' +
      'opacity:0;transition:opacity .25s;will-change:transform;';
    el.innerHTML = '<svg width="28" height="28" viewBox="0 0 28 28" style="display:block;overflow:visible">' +
      '<path d="M3 2 L3 23.5 L8.6 18.3 L12.6 26.6 L17 24.5 L13 16.4 L20.8 16.4 Z" fill="#fff" stroke="#10172a" ' +
      'stroke-width="2.2" stroke-linejoin="round"/></svg>';
    (document.body || document.documentElement).appendChild(el);
    try { document.documentElement.classList.add('__gfx_padcursor'); } catch (e) {}
    place();
  }
  function place() {
    el.style.transform = 'translate3d(' + (x - 3) + 'px,' + (y - 2) + 'px,0)';
    S.x = x; S.y = y;
  }
  function wake() { awake = S.awake = true; el.style.opacity = '1'; }
  function sleep() { awake = S.awake = false; el.style.opacity = '0'; }
  function fire(type, node, buttons, pointer) {
    if (!node) return;
    INIT.clientX = x; INIT.clientY = y;
    INIT.screenX = (window.screenX || 0) + x; INIT.screenY = (window.screenY || 0) + y;
    INIT.buttons = buttons; INIT.pressure = buttons ? 0.5 : 0;
    INIT.detail = type === 'click' ? 1 : 0;
    var ev;
    try { ev = pointer && HAS_PE ? new PointerEvent(type, INIT) : new MouseEvent(type, INIT); } catch (e) { return; }
    try { node.dispatchEvent(ev); } catch (e) {}
  }
  function at() { return document.elementFromPoint(x, y) || document.body || document.documentElement; }
  function press(now) {
    target = at(); held = S.held = true; sx = x; sy = y; lastMove = now;
    fire('pointermove', target, 0, true); fire('mousemove', target, 0, false);
    fire('pointerdown', target, 1, true); fire('mousedown', target, 1, false);
  }
  function release(clickOk) {
    var t = target;
    held = S.held = false; target = null;
    fire('pointerup', t, 0, true); fire('mouseup', t, 0, false);
    if (clickOk) { var dx = x - sx, dy = y - sy; if (dx * dx + dy * dy < CLICK_SLOP * CLICK_SLOP) fire('click', t, 0, false); }
  }
  function stick(ax, ay) {
    ax = +ax || 0; ay = +ay || 0;
    var m = Math.sqrt(ax * ax + ay * ay);
    if (m <= DZ) return;
    var e = ((m > 1 ? 1 : m) - DZ) / (1 - DZ);
    e = e * e * SPEED / m;              // mild ease: squared magnitude, ~900 px/s at full tilt
    vx += ax * e; vy += ay * e;
  }

  window.addEventListener('gamepadconnected', install);
  hub.fns.push(function (now, pads) {
    var i, p, a, b, btn = false;
    if (!S.installed) {
      for (i = 0; i < pads.length; i++) { p = pads[i]; if (p && p.mapping === 'standard') { install(); break; } }
      if (!S.installed) return;
    }
    var dt = lastT ? (now - lastT) / 1000 : 0;
    if (dt > 0.05) dt = 0.05;
    lastT = now;
    vx = 0; vy = 0;
    for (i = 0; i < pads.length; i++) {
      p = pads[i];
      if (!p || p.connected === false) continue;
      a = p.axes; b = p.buttons;
      if (a) { stick(a[2], a[3]); if (LEFT) stick(a[0], a[1]); }
      if ((b[0] && b[0].pressed) || (b[5] && b[5].pressed)) btn = true;
    }
    if (IS_BOOK) {                      // the book: asleep and silent while a game is open
      if (!player) player = document.getElementById('player');
      if (player && player.classList.contains('open')) {
        if (held) release(false);
        if (awake) sleep();
        prevBtn = btn; return;
      }
    }
    if (vx !== 0 || vy !== 0) {
      var w = window.innerWidth || 1280, h = window.innerHeight || 720;
      x += vx * dt; y += vy * dt;
      if (x < 0) x = 0; else if (x > w - 1) x = w - 1;
      if (y < 0) y = 0; else if (y > h - 1) y = h - 1;
      lastMove = now;
      if (!awake) wake();
      place();
      if (held) { fire('pointermove', target, 1, true); fire('mousemove', target, 1, false); }
      else { var t = at(); fire('pointermove', t, 0, true); fire('mousemove', t, 0, false); }
    } else if (awake && !held && now - lastMove > SLEEP_MS) {
      sleep();
    }
    if (btn && !prevBtn) { if (awake) press(now); }
    else if (!btn && prevBtn) { if (held) release(true); }
    if (held) lastMove = now;
    prevBtn = btn;
  });
})();
</script>
