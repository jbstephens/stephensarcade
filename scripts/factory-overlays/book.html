<!-- injected by scripts/inject-factory.py (the book only) — no popups in the kiosk.
     Ben's Wormhole calls window.open('https://ses.q5labs.co'); we return a truthy
     stand-in so his whoosh plays, then return to Stephens Arcade at / after 1.3s.
     Any other URL gets null (no popup). -->
<script id="__gf_book">
(function () {
  var going = false;
  window.open = function (url) {
    var u = '';
    try { u = url == null ? '' : String(url); } catch (e) {}
    if (u.indexOf('ses.q5labs.co') >= 0) {
      if (!going) { going = true; setTimeout(function () { location.href = '/'; }, 1300); }
      return {};
    }
    return null;
  };
})();
</script>
