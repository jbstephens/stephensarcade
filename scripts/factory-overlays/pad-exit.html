<!-- injected by scripts/inject-factory.py — hold PS (or SELECT+START) for 1s to go
     up one level: game -> the book (parent.closeGame), standalone game -> /factory/,
     the book -> Stephens Arcade (/). Shares one rAF pad poll with the cursor + idle overlays. -->
<script id="__gf_pad_exit">
(function () {
  var IS_BOOK = false; /*@gf:is_book*/
  var HOLD_MS = 1000;
  // one rAF loop per page reads the pads for every __gf overlay
  var hub = window.__gfHub;
  if (!hub) {
    hub = window.__gfHub = { fns: [], pads: [] };
    (function () {
      var NONE = [];
      function loop(now) {
        var p = null;
        try { p = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) {}
        hub.pads = p || NONE;
        for (var i = 0; i < hub.fns.length; i++) { try { hub.fns[i](now, hub.pads); } catch (e) {} }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  }

  var STEPS = 20, TF = [];               // precomputed badge transforms: zero allocations while held
  for (var s = 0; s <= STEPS; s++) TF.push('translateX(-50%) scale(' + (1 + 0.35 * s / STEPS).toFixed(4) + ')');
  var HIDE_TF = 'translateX(-50%) scale(0.85)';
  var heldSince = 0, needRelease = true, leaving = false, badge = null, lastStep = -2;
  var player = null;

  function comboDown(pads) {
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (!gp || gp.connected === false) continue;
      var b = gp.buttons;
      if ((b[16] && b[16].pressed) || (b[8] && b[8].pressed && b[9] && b[9].pressed)) return true;
    }
    return false;
  }
  function makeBadge() {
    badge = document.createElement('div');
    badge.id = '__gfx_exit';
    badge.textContent = IS_BOOK ? '◄ ARCADE' : '◄ BOOK';
    badge.style.cssText = 'position:fixed;top:12px;left:50%;z-index:2147483001;pointer-events:none;' +
      'padding:7px 18px;border-radius:999px;background:#10172a;color:#ffd23f;border:3px solid #ffd23f;' +
      'font:bold 18px/1 "Trebuchet MS","Arial Rounded MT Bold",sans-serif;letter-spacing:1px;white-space:nowrap;' +
      'transform-origin:50% 0;opacity:0;transform:' + HIDE_TF + ';transition:opacity .12s;';
    (document.body || document.documentElement).appendChild(badge);
  }
  function setBadge(step) {            // step -1 = hidden, 0..STEPS = hold progress
    if (step === lastStep) return;
    lastStep = step;
    if (step < 0) { if (badge) { badge.style.opacity = '0'; badge.style.transform = HIDE_TF; } return; }
    if (!badge) makeBadge();
    badge.style.opacity = '1';
    badge.style.transform = TF[step];
  }
  function inGame() {
    try { return window.parent !== window && typeof window.parent.closeGame === 'function'; } catch (e) { return false; }
  }
  function leave() {
    leaving = true;                    // never navigate twice
    if (!IS_BOOK && inGame()) { setBadge(-1); try { window.parent.closeGame(); } catch (e) {} return; }
    location.href = IS_BOOK ? '/' : '/factory/';
  }
  hub.fns.push(function (now, pads) {
    if (leaving) return;
    var down = comboDown(pads);
    if (IS_BOOK) {
      if (!player) player = document.getElementById('player');
      if (player && player.classList.contains('open')) {   // the game's own overlay handles this hold
        if (down) needRelease = true;
        heldSince = 0; setBadge(-1); return;
      }
    }
    if (needRelease) {                 // a hold that started elsewhere never counts here
      if (down) return;
      needRelease = false;
    }
    if (!down) { heldSince = 0; setBadge(-1); return; }
    if (!heldSince) heldSince = now;
    var p = (now - heldSince) / HOLD_MS;
    setBadge(Math.round((p > 1 ? 1 : p) * STEPS));
    if (p >= 1) leave();
  });
})();
</script>
