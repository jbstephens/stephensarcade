<!-- injected by scripts/inject-factory.py — console (low-fx) mode only: no-op canvas
     shadowBlur and kill CSS backdrop-filter (both measured fps killers on the Pi).
     The mouse cursor is hidden only while the pad cursor is installed. -->
<script id="__gf_lowfx">
(function () {
  var on = false;
  try {
    if (/[?&]fx=low\b/.test(location.search)) { on = true; localStorage.setItem('arcade_lowfx', '1'); }
    else if (/[?&]fx=full\b/.test(location.search)) { localStorage.setItem('arcade_lowfx', '0'); }
    else { on = localStorage.getItem('arcade_lowfx') === '1'; }
  } catch (e) {}
  if (!on) return;
  try {
    Object.defineProperty(CanvasRenderingContext2D.prototype, 'shadowBlur', {
      set: function () {}, get: function () { return 0; }, configurable: true
    });
  } catch (e) {}
  try {
    var st = document.createElement('style');
    st.textContent = '* { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }' +
      ' html.__gfx_padcursor, html.__gfx_padcursor * { cursor: none !important; }';
    (document.head || document.documentElement).appendChild(st);
  } catch (e) {}
})();
</script>
