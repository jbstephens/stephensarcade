<!-- injected by scripts/inject-factory.py — after 15 idle minutes (no pad / keyboard /
     pointer / touch input): a game closes back to the book, anything else returns to
     Stephens Arcade. Test override: ?idle=<seconds>. -->
<script id="__gf_idle">
(function () {
  var IS_BOOK = false; /*@gf:is_book*/
  var qs = null;
  try { qs = new URLSearchParams(location.search).get('idle'); } catch (e) {}
  var IDLE_MS = (qs ? Math.max(10, parseFloat(qs) || 900) : 15 * 60) * 1000;
  var DEADZONE = 0.25;
  // one rAF loop per page reads the pads for every __gf overlay
  var hub = window.__gfHub;
  if (!hub) {
    hub = window.__gfHub = { fns: [], pads: [] };
    (function () {
      var NONE = [];
      function loop(now) {
        var p = null;
        try { p = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) {}
        hub.pads = p || NONE;
        for (var i = 0; i < hub.fns.length; i++) { try { hub.fns[i](now, hub.pads); } catch (e) {} }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  }
  var last = performance.now(), leaving = false, player = null;
  function bump() { last = performance.now(); }
  window.addEventListener('keydown', bump, { capture: true });
  window.addEventListener('pointerdown', bump, { capture: true });
  window.addEventListener('touchstart', bump, { capture: true, passive: true });
  function padActive(pads) {
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (!gp || gp.connected === false) continue;
      for (var b = 0; b < gp.buttons.length; b++) if (gp.buttons[b].pressed) return true;
      for (var a = 0; a < gp.axes.length; a++) if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  hub.fns.push(function (now, pads) {
    if (leaving) return;
    if (IS_BOOK) {                     // while a game is open its own overlay owns the idle timer
      if (!player) player = document.getElementById('player');
      if (player && player.classList.contains('open')) { last = now; return; }
    }
    if (padActive(pads)) last = now;
    if (now - last < IDLE_MS) return;
    leaving = true;
    var g = false;
    try { g = window.parent !== window && typeof window.parent.closeGame === 'function'; } catch (e) {}
    if (g) { try { window.parent.closeGame(); } catch (e) {} }
    else location.href = '/';          // pagehide fires -> games persist their state
  });
})();
</script>
