<!-- injected by scripts/bundle-games.sh — low-effects mode for the Pi console.
     Canvas shadowBlur (neon glow) costs a GPU blur pass per glowing sprite;
     the Pi 5 drops from ~50fps to ~13fps with it on. The console kiosk loads
     the arcade with ?fx=low, the launcher persists the flag in localStorage,
     and this overlay no-ops shadowBlur in every bundled game. Visit with
     ?fx=full to turn glows back on. -->
<script id="__arcade_lowfx">
(function () {
  var on = false;
  try {
    if (/[?&]fx=low\b/.test(location.search)) { on = true; localStorage.setItem('arcade_lowfx', '1'); }
    else if (/[?&]fx=full\b/.test(location.search)) { localStorage.setItem('arcade_lowfx', '0'); }
    else { on = localStorage.getItem('arcade_lowfx') === '1'; }
  } catch (e) {}
  if (!on) return;
  try {
    Object.defineProperty(CanvasRenderingContext2D.prototype, 'shadowBlur', {
      set: function () {}, get: function () { return 0; }
    });
  } catch (e) {}
  // Console mode: no mouse exists, so never show a cursor. And CSS
  // backdrop-filter re-blurs the animating canvas under every frosted panel
  // on every frame — measured 17fps -> 60fps in Ninth Inning on the Pi by
  // disabling it. Panels keep their translucent rgba backgrounds.
  try {
    document.head.insertAdjacentHTML('beforeend',
      '<style>* { cursor: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }</style>');
  } catch (e) {}
})();
</script>
