<!-- injected by scripts/bundle-games.sh — hold PS (or SELECT+START) on any gamepad to return to the arcade menu -->
<script id="__arcade_pad_exit">
(function () {
  var HOLD_MS = 1000;
  var heldSince = 0;
  var leaving = false;
  function comboDown(gp) {
    var b = gp.buttons;
    var ps = b[16] && b[16].pressed;
    var selectStart = b[8] && b[8].pressed && b[9] && b[9].pressed;
    return !!(ps || selectStart);
  }
  function tick(now) {
    if (leaving) return;
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var down = false;
    for (var i = 0; i < pads.length; i++) {
      if (pads[i] && pads[i].connected && comboDown(pads[i])) { down = true; break; }
    }
    var btn = document.getElementById('__arcade_back');
    if (!down) {
      heldSince = 0;
      if (btn) { btn.style.transform = ''; btn.style.boxShadow = ''; }
    } else {
      if (!heldSince) heldSince = now;
      var progress = (now - heldSince) / HOLD_MS;
      if (btn) {
        btn.style.transform = 'scale(' + (1 + 0.35 * Math.min(progress, 1)) + ')';
        btn.style.transformOrigin = 'top left';
        btn.style.boxShadow = '0 0 ' + Math.round(18 * Math.min(progress, 1)) + 'px #ffd23f';
      }
      if (progress >= 1) { leaving = true; location.href = '/'; return; }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
