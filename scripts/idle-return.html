<!-- injected by scripts/bundle-games.sh — after 15 idle minutes (no pad /
     keyboard / touch input) return to the arcade menu. Games save on
     pagehide and/or rolling autosave, so nothing is lost. Test override:
     ?idle=<seconds>. -->
<script id="__arcade_idle">
(function () {
  var qs = new URLSearchParams(location.search).get('idle');
  var IDLE_MS = (qs ? Math.max(10, parseFloat(qs)) : 15 * 60) * 1000;
  var DEADZONE = 0.25;
  var last = performance.now();
  var leaving = false;
  function bump() { last = performance.now(); }
  window.addEventListener('keydown', bump, { capture: true });
  window.addEventListener('pointerdown', bump, { capture: true });
  window.addEventListener('touchstart', bump, { capture: true, passive: true });
  function padActive() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (!gp || !gp.connected) continue;
      for (var b = 0; b < gp.buttons.length; b++)
        if (gp.buttons[b].pressed) return true;
      for (var a = 0; a < gp.axes.length; a++)
        if (Math.abs(gp.axes[a]) > DEADZONE) return true;
    }
    return false;
  }
  function tick(now) {
    if (leaving) return;
    if (padActive()) last = now;
    if (now - last >= IDLE_MS) {
      leaving = true;
      location.href = '/';   // pagehide fires → games persist their state
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
