# Stephens Arcade — minimal lighttpd config for the OFFLINE local server.
#
# Installed to /etc/lighttpd/ses-arcade.conf by pi/setup.sh and run by the
# ses-webserver.service systemd unit as:
#     lighttpd -D -f /etc/lighttpd/ses-arcade.conf
#
# Design goals: rock-solid, tiny, and impossible to expose to the network.
#   - LOCALHOST ONLY: binds 127.0.0.1, so nothing off the box can ever reach it.
#   - Unprivileged port 8080 (no root, no cap_net_bind, no setuid dance).
#   - Document root is passed in from the systemd unit via $SES_ARCADE_DOCROOT
#     so this file never hard-codes a home directory / username.
#
# This is a *static file* server — no CGI, no PHP, no directory listings.

server.document-root = env.SES_ARCADE_DOCROOT
server.port          = 8080
server.bind          = "127.0.0.1"

# Keep it lean: only the modules a static arcade needs.
server.modules = ( "mod_indexfile", "mod_staticfile" )

index-file.names   = ( "index.html" )
dir-listing.activate = "disable"
server.follow-symlink = "enable"

# Log to the systemd journal via stderr (the unit runs with -D, foreground).
server.errorlog = "/dev/stderr"

# MIME types the arcade actually serves. Games are single self-contained HTML
# files, plus the shared controller.js and a handful of PNG/JSON assets.
mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".htm"  => "text/html; charset=utf-8",
  ".js"   => "text/javascript; charset=utf-8",
  ".mjs"  => "text/javascript; charset=utf-8",
  ".json" => "application/json; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif"  => "image/gif",
  ".ico"  => "image/x-icon",
  ".webp" => "image/webp",
  ".wav"  => "audio/wav",
  ".mp3"  => "audio/mpeg",
  ".ogg"  => "audio/ogg",
  ".woff" => "font/woff",
  ".woff2"=> "font/woff2",
  ".ttf"  => "font/ttf",
  ".txt"  => "text/plain; charset=utf-8",
  ".xml"  => "application/xml",
  ""      => "application/octet-stream"
)
